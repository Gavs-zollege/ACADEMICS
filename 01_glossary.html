<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossary — General Patient Care</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d0d0d;
  --surface: #141414;
  --card: #1a1a1a;
  --border: rgba(255,255,255,0.07);
  --red: #e05a3a;
  --red-dim: rgba(224,90,58,0.15);
  --text: #ffffff;
  --muted: #6b7280;
  --muted2: #9ca3af;
  --pill-bg: rgba(255,255,255,0.06);
  --pill-border: rgba(255,255,255,0.12);
}
html, body {
  height: 100%; overflow: hidden;
  background: var(--bg); color: var(--text);
  font-family: 'Inter', sans-serif;
}

/* Full viewport — 5 rows */
.page {
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto auto auto 1fr auto;
  max-width: 820px;
  margin: 0 auto;
  padding: 0 32px;
}

/* ── ROW 1: HEADER ── */
.hdr { padding: 36px 0 16px; }
.hdr-eyebrow {
  font-size: 11px; font-weight: 700; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--red); margin-bottom: 8px;
}
.hdr h1 {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 42px; font-weight: 800; color: var(--text);
  margin-bottom: 4px; line-height: 1.05;
}
.hdr-sub { font-size: 15px; color: var(--muted2); }

/* ── ROW 2: SEARCH ── */
.search-wrap { padding: 16px 0 12px; }
.search-inner {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 18px;
}
.search-icon { color: var(--muted); flex-shrink: 0; font-size: 15px; }
.search-input {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-size: 15px; font-family: 'Inter', sans-serif;
}
.search-input::placeholder { color: var(--muted); }

/* ── ROW 3: FILTER PILLS + TERM COUNT ── */
.filter-area { padding-bottom: 10px; }
.pills {
  display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px;
}
.pill {
  padding: 5px 14px; border-radius: 999px;
  border: 1px solid var(--pill-border); background: var(--pill-bg);
  color: var(--muted2); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.18s; white-space: nowrap;
  font-family: 'Inter', sans-serif;
}
.pill:hover { border-color: rgba(255,255,255,0.22); color: var(--text); }
.pill.active {
  background: var(--red-dim); border-color: var(--red);
  color: var(--text); font-weight: 600;
}
.term-count { font-size: 13px; color: var(--muted); }

/* ── ROW 4: TERM LIST ── */
.list-area {
  min-height: 0;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column;
}
.term-list { flex: 1; overflow: hidden; }
.term-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; border-bottom: 1px solid var(--border);
  cursor: pointer; transition: background 0.15s;
  gap: 16px;
  /* height is set dynamically via JS */
}
.term-row:last-child { border-bottom: none; }
.term-row:hover { background: rgba(255,255,255,0.03); }
.term-left {
  display: flex; align-items: center; gap: 14px;
  min-width: 0;
}
.red-bar {
  width: 3px; border-radius: 2px; background: var(--red);
  flex-shrink: 0;
  /* height set via JS */
}
.term-name {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 17px; font-weight: 700; color: var(--text);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cat-badge {
  flex-shrink: 0; padding: 3px 10px; border-radius: 999px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; background: var(--red-dim); color: var(--red);
  white-space: nowrap;
}

/* ── ROW 5: PAGINATION ── */
.pager {
  background: var(--card); border-top: 1px solid var(--border);
  border-radius: 0 0 12px 12px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px; flex-shrink: 0;
}
.pager-btn {
  padding: 8px 20px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface);
  color: var(--muted2); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.18s; font-family: 'Inter', sans-serif;
}
.pager-btn:hover:not(:disabled) { border-color: rgba(255,255,255,0.2); color: var(--text); }
.pager-btn:disabled { opacity: 0.3; cursor: default; }
.pager-dots { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; justify-content: center; max-width: 460px; }
.pdot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--border); transition: all 0.2s; cursor: pointer;
  border: none; padding: 0; flex-shrink: 0;
}
.pdot.active { background: var(--red); transform: scale(1.2); }
.pdot.near   { background: rgba(255,255,255,0.3); }

/* ── MODAL ── */
.overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 50;
  display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--card); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 14px; padding: 32px 36px; max-width: 520px; width: 90%;
  transform: translateY(10px); transition: transform 0.2s;
}
.overlay.open .modal { transform: translateY(0); }
.m-badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; background: var(--red-dim); color: var(--red); margin-bottom: 14px; }
.m-name { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 14px; line-height: 1.2; }
.m-def  { font-size: 14px; color: var(--muted2); line-height: 1.72; margin-bottom: 14px; }
.m-note { background: rgba(224,90,58,0.1); border-left: 2px solid var(--red); padding: 11px 14px; border-radius: 0 8px 8px 0; font-size: 13px; color: var(--text); line-height: 1.6; display: none; }
.m-note.show { display: block; }
.m-note strong { color: var(--red); }
.m-close {
  margin-top: 20px; width: 100%; padding: 10px;
  border-radius: 8px; border: 1px solid var(--border);
  background: transparent; color: var(--muted2);
  font-size: 13px; cursor: pointer; transition: all 0.18s;
  font-family: 'Inter', sans-serif;
}
.m-close:hover { border-color: var(--red); color: var(--red); }
</style>
</head>
<body>
<div class="page">

  <!-- ROW 1: HEADER -->
  <div class="hdr">
    <div class="hdr-eyebrow">General Patient Care</div>
    <h1>Glossary</h1>
    <div class="hdr-sub">Exam Room Prep · Positioning · Injections · Eye & Ear · EHR</div>
  </div>

  <!-- ROW 2: SEARCH -->
  <div class="search-wrap">
    <div class="search-inner">
      <span class="search-icon">&#9906;</span>
      <input class="search-input" id="searchInput" placeholder="Search terms or definitions…" oninput="onSearch()">
    </div>
  </div>

  <!-- ROW 3: FILTERS + COUNT -->
  <div class="filter-area">
    <div class="pills" id="pills"></div>
    <div class="term-count" id="termCount"></div>
  </div>

  <!-- ROW 4: LIST + PAGER combined in one container -->
  <div class="list-area" id="listArea">
    <div class="term-list" id="termList"></div>
    <div class="pager" id="pager">
      <button class="pager-btn" id="btnPrev" onclick="changePage(-1)">← Prev</button>
      <div class="pager-dots" id="pagerDots"></div>
      <button class="pager-btn" id="btnNext" onclick="changePage(1)">Next →</button>
    </div>
  </div>

</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal" id="modal">
    <div class="m-badge" id="mBadge"></div>
    <div class="m-name"  id="mName"></div>
    <div class="m-def"   id="mDef"></div>
    <div class="m-note"  id="mNote"></div>
    <button class="m-close" onclick="closeModal()">Close</button>
  </div>
</div>

<script>
const TERMS = [
  {cat:"Exam Room",name:"Sphygmomanometer",def:"A medical instrument used to measure blood pressure, consisting of an inflatable cuff and a pressure gauge — commonly called a BP cuff.",note:"<strong>Remember:</strong> Always ensure the device is calibrated and functioning before use. Select the correct cuff size."},
  {cat:"Exam Room",name:"Pulse Oximeter",def:"A non-invasive device clipped onto a fingertip to measure the percentage of hemoglobin saturated with oxygen (SpO2) and pulse rate.",note:"<strong>Clinical tip:</strong> Normal SpO2 is 95–100%. Nail polish or poor circulation can affect readings."},
  {cat:"Exam Room",name:"Ophthalmoscope",def:"A diagnostic instrument with a light and lens used to examine interior eye structures including the retina and optic disc.",note:"<strong>Room prep:</strong> Confirm battery and light function before each patient."},
  {cat:"Exam Room",name:"Otoscope",def:"A handheld instrument with a light and magnifying lens used to visually examine the external ear canal and tympanic membrane.",note:"<strong>Tip:</strong> Use disposable speculum tips and discard between patients."},
  {cat:"Exam Room",name:"Biohazard Container",def:"A red or orange puncture-resistant bag or bin for disposal of materials contaminated with blood or other potentially infectious materials.",note:"<strong>Do not</strong> place sharps in the biohazard bag — those go directly into the sharps container."},
  {cat:"Exam Room",name:"Sharps Container",def:"A rigid, puncture-proof container for safe disposal of used needles, syringes, lancets, and other sharps.",note:"<strong>Rule:</strong> Used needles go directly into the sharps container — never recap, never place on a counter."},
  {cat:"Exam Room",name:"Disinfection Protocol",def:"Between-patient cleaning: disinfect all surfaces, allow to fully dry, replace table paper, change pillow cover, and discard all disposables.",note:"Allowing the disinfectant to fully dry is essential — placing paper on a wet surface compromises the process."},
  {cat:"Exam Room",name:"Two Identifiers",def:"Patient safety standard requiring two unique identifiers — full legal name and date of birth — before any procedure, medication, or specimen.",note:"<strong>Never</strong> rely on room number or appearance. Always confirm verbally."},
  {cat:"Exam Room",name:"Reflex Hammer",def:"A rubber-tipped percussion instrument used to test deep tendon reflexes by tapping specific tendons.",note:"Part of the standard diagnostic equipment set — ensure it is in the room prior to neurological exams."},
  {cat:"Positioning",name:"Supine",def:"Patient lies flat on back (face up), legs extended. Used for head, chest, and abdominal examinations and anterior imaging.",note:"<strong>Draping:</strong> Cover from chest to feet; expose only the area being examined."},
  {cat:"Positioning",name:"Prone",def:"Patient lies face down (on stomach), head turned to one side. Used for back examinations and certain surgical procedures.",note:"<strong>Draping:</strong> Upper back to over the feet. Ensure the patient's airway is not compromised."},
  {cat:"Positioning",name:"Dorsal Recumbent",def:"Patient on back with knees bent and feet flat on the table. Used for head, neck, chest, vaginal, rectal, and perineal examinations.",note:"Similar to supine but with bent knees — relaxes abdominal muscles for better pelvic/rectal exam access."},
  {cat:"Positioning",name:"Lithotomy",def:"Patient on back with legs raised in stirrups, hips at the table edge. Used for vaginal exams, Pap tests, and pelvic procedures.",note:"<strong>Assist</strong> the patient carefully into and out of stirrups. Drape from under the arms to the ankles."},
  {cat:"Positioning",name:"Fowler's Position (90°)",def:"Patient sits upright at 90 degrees. Used for head, neck, and upper body examinations and for patients with breathing difficulty.",note:"Semi-Fowler's is 45 degrees — used post-surgically, for breathing problems, or lower back injuries."},
  {cat:"Positioning",name:"Left Lateral",def:"Patient lies on their left side. Used for rectal exams, enemas, rectal temperature measurement, and perineal or pelvic examinations.",note:"<strong>Draping:</strong> Shoulders to below the knees at an angle so the provider can lift a corner for access."},
  {cat:"Positioning",name:"Knee-Chest",def:"Patient kneels on the table, weight on knees and chest, hips elevated. Used for proctologic exams and sigmoidoscopy.",note:"This position can be uncomfortable — always communicate with the patient and minimize time in it."},
  {cat:"Positioning",name:"Draping",def:"Use of sheets, gowns, or paper coverings to cover areas not being examined, preserving patient dignity and comfort.",note:"Expose only the area being examined. Adjust draping based on the specific exam position."},
  {cat:"Injections",name:"Intradermal (ID)",def:"Injection into the dermis at 5–15° using a 25–27G, ¼–½ inch needle, ≤0.1 mL. Primary use: TB and allergy skin testing.",note:"A wheal (raised bubble) MUST form for the test to be valid. Do NOT massage, bandage, or apply pressure afterward."},
  {cat:"Injections",name:"Subcutaneous (SC)",def:"Injection into fatty tissue at 45° using a 23–25G, 5/8 inch needle, ≤1.5 mL. Sites: upper outer arm, abdomen, upper thigh.",note:"Pinch at least 1 inch of skin before inserting. Release after the needle is seated. Rotate insulin injection sites."},
  {cat:"Injections",name:"Intramuscular (IM)",def:"Injection directly into muscle at 90° using a 22–25G, 1–1½ inch needle, up to 3 mL. Sites: deltoid (≤1 mL), ventrogluteal and vastus lateralis (≤3 mL).",note:"Stretch skin taut. Insert like a dart — smooth, steady motion. Vastus lateralis preferred for children under 3."},
  {cat:"Injections",name:"Wheal",def:"A small raised blister or bubble that forms in the skin immediately after a correctly performed intradermal injection.",note:"No wheal during a TB test = injection invalid. Must be repeated at a different site after 15 minutes."},
  {cat:"Injections",name:"Gauge",def:"A measurement of needle diameter. Higher gauge = smaller, thinner needle. 18G is larger than 25G.",note:"Select gauge based on medication viscosity and injection type: thicker medications need a lower gauge."},
  {cat:"Injections",name:"Ventrogluteal Site",def:"The gluteus medius and minimus muscles in the hip area. Preferred IM site for adults due to low risk of nerve injury.",note:"Can accept up to 3 mL. Safer than the dorsogluteal site, which carries higher sciatic nerve injury risk."},
  {cat:"Injections",name:"Bevel",def:"The angled, slanted tip at the end of a needle. Always insert bevel-side UP for smoother penetration and controlled delivery.",note:"<strong>Bevel-up</strong> is the universal rule for all injections — especially critical for intradermal."},
  {cat:"Medications",name:"Nine Rights",def:"Safety framework for every medication administration: Right Patient, Medication, Form, Dose, Route, Time, Technique, Education, and Documentation.",note:"<strong>The 9th Right (Documentation)</strong> must always be completed AFTER administration — never before."},
  {cat:"Medications",name:"MAR",def:"Medication Administration Record — the legal document recording every medication administered, including date, time, drug, dose, route, and reactions.",note:"If it isn't documented, it legally didn't happen. Complete AFTER — not before — administration."},
  {cat:"Medications",name:"Dosage Formula",def:"X = (D ÷ H) × Q. D = desired dose, H = dose on hand, Q = quantity of one unit. Calculate and double-check before preparing.",note:"<strong>Example:</strong> Order 500 mg; on hand 250 mg/tablet. X = (500 ÷ 250) × 1 = 2 tablets."},
  {cat:"Medications",name:"Multi-dose Vial",def:"A medication vial containing multiple doses. Wipe stopper with alcohol before each use. Inject equal air before withdrawing. Expires 28 days after opening.",note:"<strong>Never</strong> use a multi-dose vial for multiple patients. Write the open date immediately."},
  {cat:"Medications",name:"Filter Needle",def:"A specially designed needle with a filter that prevents glass fragments from being drawn into the syringe when aspirating from a glass ampule.",note:"Replace the filter needle with a standard needle before administering the injection."},
  {cat:"Medications",name:"Controlled Substance Log",def:"Mandatory legal record of all controlled substance use, requiring double-lock storage, daily count by two people, and documentation of every dose.",note:"Discrepancies must be reported immediately — never ignore a count difference."},
  {cat:"Medications",name:"Three-Label Check",def:"Reading the medication label three times: when selecting, when drawing up the dose, and when returning or discarding the container.",note:"This is the Right Medication check within the Nine Rights — a critical error prevention step."},
  {cat:"Medications",name:"Immunization Log",def:"Required documentation for every vaccine: name, lot number, manufacturer, expiration date, site, route, date, and patient consent.",note:"Immunization records are entered into state vaccine registries. Accuracy is critical for public health tracking."},
  {cat:"Eye & Ear",name:"Conjunctival Sac",def:"The space formed when the lower eyelid is gently pulled down. Drops and ointments are instilled here — never directly onto the eyeball.",note:"Drop the medication approximately ½ inch above the sac. Never touch the eye or surrounding skin with the applicator tip."},
  {cat:"Eye & Ear",name:"Ophthalmic Medication",def:"Any sterile medication formulated specifically for use in or around the eye. Only ophthalmic-labeled medications may be used for eye instillation.",note:"Never use ear drops in the eye. Check the label every time."},
  {cat:"Eye & Ear",name:"Pinna",def:"The visible outer part of the ear (the auricle). Pulled to straighten the ear canal during ear instillation or irrigation.",note:"<strong>Critical direction:</strong> Pull outward and UPWARD for adults. Outward and DOWNWARD for children/infants — opposite directions!"},
  {cat:"Eye & Ear",name:"Cerumen",def:"The medical term for earwax — a natural secretion that protects and lubricates the ear canal. Impacted cerumen may require irrigation.",note:"Ear irrigation removes impacted cerumen. Position patient with the affected ear up; insert irrigator tip toward top of canal."},
  {cat:"Eye & Ear",name:"Canthus",def:"The corner angles where the upper and lower eyelids meet. Inner (medial) canthus is closest to the nose; outer (lateral) is at the temple.",note:"Eye irrigation always flows from inner (medial) to outer (lateral) canthus to prevent contamination from spreading."},
  {cat:"Eye & Ear",name:"Sterile Ophthalmic Technique",def:"Strict aseptic practice required for all eye procedures: sterile solutions, separate equipment for each eye, never reusing applicators.",note:"Always use separate sterile equipment for each eye. Cross-contaminating eyes is a preventable patient safety error."},
  {cat:"EHR & Tech",name:"EMR vs. EHR",def:"EMR = digital record within one organization. EHR = extends across multiple organizations, sharing data with specialists, labs, and hospitals.",note:"Think of the EMR as the clinic's internal record, and the EHR as the patient's portable health story across providers."},
  {cat:"EHR & Tech",name:"CPOE",def:"Computerized Provider Order Entry — electronic system for orders (medications, labs, radiology, referrals). Eliminates handwriting errors.",note:"MAs enter order information for the provider to authorize. Always confirm with the provider before submitting any order."},
  {cat:"EHR & Tech",name:"E-Prescribing (EPCS)",def:"Prescriptions transmitted electronically to the pharmacy. DEA-approved EPCS software required for controlled substances.",note:"Required elements: DEA number, provider phone, date/time of transmission, and pharmacy name."},
  {cat:"EHR & Tech",name:"Clinical Decision Support",def:"Integrated EHR/CPOE tools that automatically flag potential drug interactions, allergies, dosage errors, and contraindications.",note:"CDS alerts are safety nets, not replacements for clinical judgment. Always review alerts with the provider."},
  {cat:"EHR & Tech",name:"Telehealth",def:"Healthcare delivery via secure video conferencing. Appropriate for wellness visits, chronic condition follow-ups, behavioral health, and low-acuity urgent care.",note:"MA duties: confirm tech requirements, test connection, gather history and med list, remind patients to have vitals ready."},
];

const CATS = ['All', 'Exam Room', 'Positioning', 'Injections', 'Medications', 'Eye & Ear', 'EHR & Tech'];
const PER_PAGE = 4;

let activeCat = 'All';
let searchQ = '';
let currentPage = 0;
let filtered = [];

// Build filter pills
function buildPills() {
  document.getElementById('pills').innerHTML = CATS.map(c => `
    <button class="pill ${c === activeCat ? 'active' : ''}" onclick="setFilter('${c}')">${c}</button>
  `).join('');
}

function setFilter(c) {
  activeCat = c;
  currentPage = 0;
  buildPills();
  applyFilter();
}

function onSearch() {
  searchQ = document.getElementById('searchInput').value.toLowerCase();
  currentPage = 0;
  applyFilter();
}

function applyFilter() {
  filtered = TERMS.filter(t => {
    const mc = activeCat === 'All' || t.cat === activeCat;
    const mq = !searchQ || t.name.toLowerCase().includes(searchQ) || t.def.toLowerCase().includes(searchQ);
    return mc && mq;
  });
  renderPage();
}

function renderPage() {
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  if (currentPage >= totalPages) currentPage = totalPages - 1;

  const start = currentPage * PER_PAGE;
  const items = filtered.slice(start, start + PER_PAGE);

  // Term count
  document.getElementById('termCount').textContent =
    `${total} term${total !== 1 ? 's' : ''} · Page ${currentPage + 1} of ${totalPages}`;

  // Compute row height dynamically from list area
  const listArea = document.getElementById('listArea');
  const pager = document.getElementById('pager');
  const listAreaH = listArea.clientHeight;
  const pagerH = pager.offsetHeight;
  const availH = listAreaH - pagerH;
  const rowH = Math.floor(availH / PER_PAGE);
  const barH = Math.floor(rowH * 0.38);

  // Render rows
  const list = document.getElementById('termList');
  list.innerHTML = items.map((t, i) => `
    <div class="term-row" style="height:${rowH}px" onclick="openModal(${filtered.indexOf(t)})">
      <div class="term-left">
        <div class="red-bar" style="height:${barH}px"></div>
        <div class="term-name">${t.name}</div>
      </div>
      <div class="cat-badge">${t.cat}</div>
    </div>
  `).join('');

  // Dots
  const maxDots = 23;
  const dotsEl = document.getElementById('pagerDots');
  if (totalPages <= maxDots) {
    dotsEl.innerHTML = Array.from({length: totalPages}, (_, i) => {
      let cls = 'pdot';
      if (i === currentPage) cls += ' active';
      else if (Math.abs(i - currentPage) <= 2) cls += ' near';
      return `<button class="${cls}" onclick="goPage(${i})"></button>`;
    }).join('');
  } else {
    // Show window of dots around current
    const win = [];
    for (let i = 0; i < totalPages; i++) {
      if (i === 0 || i === totalPages - 1 || Math.abs(i - currentPage) <= 3) win.push(i);
    }
    dotsEl.innerHTML = win.map(i => {
      let cls = 'pdot';
      if (i === currentPage) cls += ' active';
      else if (Math.abs(i - currentPage) <= 2) cls += ' near';
      return `<button class="${cls}" onclick="goPage(${i})"></button>`;
    }).join('');
  }

  // Prev/Next buttons
  document.getElementById('btnPrev').disabled = currentPage === 0;
  document.getElementById('btnNext').disabled = currentPage >= totalPages - 1;
}

function changePage(dir) {
  const total = filtered.length;
  const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
  currentPage = Math.max(0, Math.min(totalPages - 1, currentPage + dir));
  renderPage();
}

function goPage(n) {
  currentPage = n;
  renderPage();
}

function openModal(i) {
  const t = filtered[i];
  document.getElementById('mBadge').textContent = t.cat;
  document.getElementById('mName').textContent  = t.name;
  document.getElementById('mDef').textContent   = t.def;
  const n = document.getElementById('mNote');
  if (t.note) { n.innerHTML = t.note; n.className = 'm-note show'; }
  else { n.className = 'm-note'; }
  document.getElementById('overlay').classList.add('open');
}
function closeModal() { document.getElementById('overlay').classList.remove('open'); }
function maybeClose(e) { if (e.target === document.getElementById('overlay')) closeModal(); }

// Init
buildPills();
applyFilter();

// Re-render on resize so row heights stay correct
window.addEventListener('resize', () => renderPage());
</script>
</body>
</html>
