<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Preparation & Radiographic Purpose — Scenario Challenge</title>
<style>
:root{
  --navy:#0E1A30; --navy2:#16294B; --navy3:#1E3157;
  --teal:#0E7C86; --teal-l:#3AC0C9; --gold:#C9A227; --gold-l:#E8CE7A;
  --text:#EAF1F6; --muted:#9FB0C4; --good:#2FBF71; --bad:#E15554;
  --card:#152744; --border:#26406B;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:radial-gradient(circle at 15% 0%, var(--navy3), var(--navy) 60%);
  color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
.wrap{
  height:100vh; width:100%; max-width:980px; margin:0 auto;
  padding:clamp(14px,2.4vh,26px) clamp(16px,3vw,30px);
  display:flex; flex-direction:column; overflow:hidden;
}
.head{flex:0 0 auto;}
.kicker{color:var(--gold);font-weight:700;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
h1{font-family:Georgia,"Cambria",serif;font-size:clamp(20px,2.6vw,30px);margin:0 0 4px;line-height:1.15;}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:10px;}
.badge{display:inline-block;background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.5px;}
.btn{
  background:var(--teal); color:#fff; border:none; border-radius:10px; padding:10px 16px;
  font-size:14px; font-weight:600; cursor:pointer; transition:transform .12s ease, background .2s ease; white-space:nowrap;
}
.btn:hover{background:var(--teal-l); transform:translateY(-1px);}
.btn.gold{background:var(--gold); color:#152030;}
.btn.gold:hover{background:var(--gold-l);}
.btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn.ghost:hover{border-color:var(--teal-l);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.progress-wrap{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:20px;height:8px;overflow:hidden;margin:8px 0;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0%;transition:width .3s ease;}
.stat-row{flex:0 0 auto;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:7px 14px;font-size:12.5px;color:var(--muted);}
.stat b{color:var(--text);font-size:14.5px;display:block;}
.footer-note{flex:0 0 auto;color:var(--muted);font-size:10.5px;text-align:center;padding-top:6px;}
.center{text-align:center;}
.act-col{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.nav-row{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;}
input[type="text"]{
  background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;
  padding:9px 14px;font-size:14px;width:100%;
}
input[type="text"]:focus{outline:none;border-color:var(--teal-l);}


.sc-stage{flex:1 1 auto;min-height:0;overflow-y:auto;}
.sc-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(14px,2.8vh,28px);}
.sc-setup{font-size:13.5px;line-height:1.55;margin-bottom:14px;padding:12px 14px;background:var(--navy2);border-radius:10px;border-left:3px solid var(--teal);}
.sc-q{font-size:14.5px;font-weight:600;margin-bottom:12px;}
.sc-opt{display:block;width:100%;text-align:left;background:var(--navy2);border:1.5px solid var(--border);color:var(--text);
  border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px;cursor:pointer;}
.sc-opt:hover{border-color:var(--teal-l);}
.sc-opt.correct{border-color:var(--good);background:rgba(47,191,113,.15);}
.sc-opt.wrong{border-color:var(--bad);background:rgba(225,85,84,.15);}
.sc-fb{margin-top:12px;padding:11px 13px;background:var(--navy);border-left:3px solid var(--gold);border-radius:6px;font-size:12.5px;color:var(--muted);display:none;}
.sc-progress{flex:0 0 auto;color:var(--muted);font-size:12px;margin-bottom:8px;}
.result-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:clamp(20px,5vh,40px);}
.result-score{font-size:clamp(30px,6vh,44px);font-weight:800;color:var(--gold-l);margin:8px 0;}

</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">DANB RHS · Week 1 — Purpose and Technique</div>
    <h1>Patient Preparation & Radiographic Purpose — Scenario Challenge</h1>
    <div class="sub">Week 1: Apply your knowledge to realistic clinical situations.</div>
  </div>
  
<div class="act-col">
  <div class="sc-progress" id="progress"></div>
  <div class="sc-stage" id="stage"></div>
</div>
  <div class="footer-note">Zollege Dental Assisting Program — DANB RHS Exam Prep</div>
</div>
<script>
const cases = [{"setup":"A patient arrives for a routine recall exam wearing a nose ring and a removable partial denture.","question":"What should you do before beginning radiographic exposure?","options":["Proceed with exposure as-is to save time","Ask the patient to remove the nose ring and partial denture first","Only remove the partial denture, jewelry is fine","Cancel the appointment"],"correct":1,"feedback":"Both jewelry and removable appliances can create image artifacts or superimposition and must be removed before exposure."},{"setup":"A patient mentions she found out she is newly pregnant this week and is anxious about having X-rays taken today.","question":"What is the best next step?","options":["Proceed without any discussion since dental X-rays are always safe","Discuss the necessity of the exposure, apply proper shielding, and document the conversation and her decision","Refuse to treat her at all until after the pregnancy","Skip the lead apron since it isn't needed for dental exposures"],"correct":1,"feedback":"Pregnancy requires an informed discussion of risks/benefits, proper shielding, and documentation of the conversation and the patient's decision — not an automatic refusal or an automatic skip of safety steps."},{"setup":"You need to evaluate a patient's interproximal contacts for early caries at a routine 6-month recall.","question":"Which image type is the best choice?","options":["Periapical series","Bitewings","Panoramic","Occlusal"],"correct":1,"feedback":"Bitewings are specifically designed to evaluate interproximal caries and crestal bone levels efficiently."},{"setup":"While reviewing a periapical image chairside, you notice a clear unexposed white band cutting across part of the image.","question":"What most likely caused this?","options":["Too much mA","PID misalignment with the receptor (cone cutting)","Incorrect kVp setting","The patient moved during exposure"],"correct":1,"feedback":"A sharp unexposed area is the classic sign of cone cutting from PID/receptor misalignment — not a density, movement, or contrast issue."}];
let i=0, answered=false, correctCount=0;
const progress = document.getElementById('progress');
const stage = document.getElementById('stage');
function render(){
  answered=false;
  if(i>=cases.length){
    progress.textContent='';
    stage.innerHTML = '<div class="sc-card center result-card"><div class="kicker">Scenarios Complete</div><div class="result-score">'+correctCount+' / '+cases.length+'</div><div class="sub">correct decisions</div><button class="btn gold" id="restart">Restart</button></div>';
    document.getElementById('restart').onclick=()=>{i=0;correctCount=0;render();};
    return;
  }
  const c = cases[i];
  progress.textContent = 'Scenario '+(i+1)+' of '+cases.length;
  stage.innerHTML = '<div class="sc-card"><div class="sc-setup">'+c.setup+'</div><div class="sc-q">'+c.question+'</div>'+
    c.options.map((o,idx)=>'<button class="sc-opt" data-idx="'+idx+'">'+o+'</button>').join('')+
    '<div class="sc-fb" id="fb">'+c.feedback+'</div>'+
    '<div class="nav-row" style="margin-top:12px;"><span></span><button class="btn" id="nextCase" style="display:none;">Next Scenario →</button></div></div>';
  document.querySelectorAll('.sc-opt').forEach(btn=>{
    btn.onclick=()=>{
      if(answered) return; answered=true;
      const idx=parseInt(btn.dataset.idx);
      document.querySelectorAll('.sc-opt').forEach((b,bi)=>{
        if(bi===c.correct) b.classList.add('correct');
        else if(bi===idx) b.classList.add('wrong');
      });
      if(idx===c.correct) correctCount++;
      document.getElementById('fb').style.display='block';
      document.getElementById('nextCase').style.display='inline-block';
    };
  });
  document.getElementById('nextCase').onclick=()=>{i++;render();};
}
render();
</script>
</body>
</html>
