<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radiation Characteristics & Protection — Flashcards</title>
<style>
:root{
  --navy:#0E1A30; --navy2:#16294B; --navy3:#1E3157;
  --teal:#0E7C86; --teal-l:#3AC0C9; --gold:#C9A227; --gold-l:#E8CE7A;
  --text:#EAF1F6; --muted:#9FB0C4; --good:#2FBF71; --bad:#E15554;
  --card:#152744; --border:#26406B;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;overflow:hidden;}
body{
  background:radial-gradient(circle at 15% 0%, var(--navy3), var(--navy) 60%);
  color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
.wrap{
  height:100vh; width:100%; max-width:980px; margin:0 auto;
  padding:clamp(14px,2.4vh,26px) clamp(16px,3vw,30px);
  display:flex; flex-direction:column; overflow:hidden;
}
.head{flex:0 0 auto;}
.kicker{color:var(--gold);font-weight:700;font-size:11.5px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px;}
h1{font-family:Georgia,"Cambria",serif;font-size:clamp(20px,2.6vw,30px);margin:0 0 4px;line-height:1.15;}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:10px;}
.badge{display:inline-block;background:var(--teal);color:#fff;font-size:11px;font-weight:700;padding:4px 10px;border-radius:20px;letter-spacing:.5px;}
.btn{
  background:var(--teal); color:#fff; border:none; border-radius:10px; padding:10px 16px;
  font-size:14px; font-weight:600; cursor:pointer; transition:transform .12s ease, background .2s ease; white-space:nowrap;
}
.btn:hover{background:var(--teal-l); transform:translateY(-1px);}
.btn.gold{background:var(--gold); color:#152030;}
.btn.gold:hover{background:var(--gold-l);}
.btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn.ghost:hover{border-color:var(--teal-l);}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}
.progress-wrap{flex:0 0 auto;background:var(--card);border:1px solid var(--border);border-radius:20px;height:8px;overflow:hidden;margin:8px 0;}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));width:0%;transition:width .3s ease;}
.stat-row{flex:0 0 auto;display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:7px 14px;font-size:12.5px;color:var(--muted);}
.stat b{color:var(--text);font-size:14.5px;display:block;}
.footer-note{flex:0 0 auto;color:var(--muted);font-size:10.5px;text-align:center;padding-top:6px;}
.center{text-align:center;}
.act-col{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden;}
.nav-row{flex:0 0 auto;display:flex;justify-content:space-between;align-items:center;gap:10px;}
input[type="text"]{
  background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:10px;
  padding:9px 14px;font-size:14px;width:100%;
}
input[type="text"]:focus{outline:none;border-color:var(--teal-l);}


.card-stage{flex:1 1 auto;min-height:140px;perspective:1200px;margin-bottom:12px;}
.flip-card{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s;cursor:pointer;}
.flip-card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(14px,3vh,30px);text-align:center;border:1px solid var(--border);overflow:hidden;}
.front{background:var(--card);}
.back{background:linear-gradient(150deg,var(--teal),#0a4d54);transform:rotateY(180deg);}
.face .tag{color:var(--gold);font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:clamp(6px,1.6vh,14px);}
.face .txt{font-size:clamp(15px,2.2vh,19px);font-weight:600;line-height:1.4;max-height:100%;overflow-y:auto;}
.back .txt{font-weight:400;font-size:clamp(13px,1.9vh,16px);}

</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="kicker">DANB RHS · Week 3 — Radiation Characteristics and Protection</div>
    <h1>Radiation Characteristics & Protection — Flashcards</h1>
    <div class="sub">Week 3: Flip through key terms and concepts.</div>
  </div>
  
<div class="act-col">
  <div class="stat-row"><div class="stat">Click the card to flip it<br><b id="counter">1 / 15</b></div></div>
  <div class="progress-wrap"><div class="progress-bar" id="bar"></div></div>
  <div class="card-stage" id="stage"></div>
  <div class="nav-row">
    <button class="btn ghost" id="prevBtn">← Previous</button>
    <button class="btn gold" id="shufBtn">🔀 Shuffle</button>
    <button class="btn" id="nextBtn">Next →</button>
  </div>
</div>
  <div class="footer-note">Zollege Dental Assisting Program — DANB RHS Exam Prep</div>
</div>
<script>
const cards = [{"front":"MPD (Maximum Permissible Dose)","back":"The maximum dose an occupationally exposed individual may legally receive in a given period without significant risk of harm."},{"front":"Cumulative occupational dose","back":"The total radiation exposure a dental worker accumulates over their career."},{"front":"Absorbed dose","back":"Energy deposited per unit mass of tissue, measured in Gray (Gy) or the older unit rad."},{"front":"Equivalent dose","back":"Absorbed dose adjusted for the type of radiation, measured in Sievert (Sv) or the older unit rem."},{"front":"Effective dose","back":"Equivalent dose further adjusted for the differing radiosensitivity of body tissues."},{"front":"Deterministic effect","back":"An effect that occurs above a specific dose threshold, with severity increasing with dose (e.g., skin erythema)."},{"front":"Stochastic effect","back":"An effect with no threshold — probability (not severity) increases with dose (e.g., cancer risk)."},{"front":"ALARA","back":"As Low As Reasonably Achievable — the guiding principle for minimizing radiation exposure."},{"front":"Collimation","back":"Restricting the X-ray beam to the area of clinical interest, reducing unnecessary patient exposure."},{"front":"Filtration","back":"Removes low-energy X-rays that add patient dose without contributing useful image quality."},{"front":"PID (Position Indicating Device)","back":"The device that aligns and directs the X-ray beam, helping ensure accurate positioning and reducing retakes."},{"front":"Photoelectric effect","back":"An X-ray photon is completely absorbed by tissue, transferring all its energy — this creates image contrast."},{"front":"Compton scatter","back":"A photon interacts with an atom and continues with less energy in a new direction — the main source of occupational scatter exposure."},{"front":"Operator protection order of preference","back":"Barrier first, then distance (at least 6 feet), then angle (90–135 degrees to the beam)."},{"front":"Leakage radiation","back":"Radiation escaping from the tube head housing itself, not the useful beam — minimized by properly maintained equipment."}];
let i = 0;
const stage = document.getElementById('stage');
const counter = document.getElementById('counter');
const bar = document.getElementById('bar');
function render(){
  stage.innerHTML = '<div class="flip-card" id="fc"><div class="face front"><div class="tag">Term</div><div class="txt">'+cards[i].front+'</div></div><div class="face back"><div class="tag">Explanation</div><div class="txt">'+cards[i].back+'</div></div></div>';
  document.getElementById('fc').onclick = () => document.getElementById('fc').classList.toggle('flipped');
  counter.textContent = (i+1)+' / '+cards.length;
  bar.style.width = (((i+1)/cards.length)*100)+'%';
}
function next(){ i = (i+1)%cards.length; render(); }
function prev(){ i = (i-1+cards.length)%cards.length; render(); }
function shuffle(){ for(let j=cards.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));[cards[j],cards[k]]=[cards[k],cards[j]];} i=0; render(); }
document.getElementById('nextBtn').onclick = next;
document.getElementById('prevBtn').onclick = prev;
document.getElementById('shufBtn').onclick = shuffle;
render();
</script>
</body>
</html>
