  {week:'week2', module:'Instruments & Handpieces', term:'Explorer', def:'An examination instrument used to detect caries, calculus, and defects on tooth surfaces.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Cotton Pliers', def:'An examination instrument used to transfer small materials in and out of the mouth.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Periodontal Probe', def:'An examination instrument used to measure pocket depth for periodontal (gum) health assessment.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Excavator', def:'A hand cutting instrument used to remove soft dentin and debris from a cavity preparation.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Hoe', def:'A hand cutting instrument used to plane the walls and floors of cavity preparations.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Chisel', def:'A hand cutting instrument used to form sharp line and point angles in a cavity preparation.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Hatchet', def:'A hand cutting instrument used to cut enamel and smooth cavity walls.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Gingival Margin Trimmer', def:'A hand cutting instrument used to bevel gingival margins of a cavity preparation.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Amalgam Carrier', def:'A restorative instrument used to transfer amalgam material into the cavity preparation.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Condenser', def:'A restorative instrument used to pack restorative material into the tooth.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Burnisher', def:'A restorative instrument used to smooth and shape restorative fillings.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Carvers', def:'Restorative instruments used to shape and remove excess restorative material.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Composite Placement Instrument', def:'A restorative instrument used specifically for placing composite materials.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Woodson (FP-1)', def:'A double-ended restorative instrument used for material placement.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Spatulas', def:'Accessory instruments used to mix dental materials.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Scissors (Dental)', def:'Accessory instruments used to cut materials like dental dams.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Amalgam Well', def:'An accessory instrument used to hold freshly mixed amalgam.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Howe Pliers', def:'Accessory instruments, also called 110 pliers, used to manipulate small objects.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Articulating Paper Holder', def:'An accessory instrument that holds articulating paper used to check a patient\'s occlusion.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Low-Speed Handpiece', def:'A dental handpiece operating up to 25,000 RPM, used for polishing, decay removal, and adjustments; accepts straight (denture adjustments), contra-angle (holds latch-type burs), and prophy angle (holds polishing cups and brushes) attachments.'},
  {week:'week2', module:'Instruments & Handpieces', term:'High-Speed Handpiece', def:'A dental handpiece operating up to 450,000 RPM, used for tooth preparation, decay removal, and shaping; features water spray for cooling, fiber-optic light for visibility, and a friction-grip bur locking system.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Ultrasonic Handpiece', def:'A specialty handpiece used for scaling and removing calculus.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Air Abrasion Handpiece', def:'A specialty handpiece used to prepare teeth for bonding and remove stains.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Laser Handpiece', def:'A specialty handpiece that uses laser light for cutting and soft tissue procedures.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Diamond Burs', def:'Rotary cutting instruments used for precise cutting and faster cavity preparation, available in round, flame, wheel, and cylinder shapes.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Finishing Burs', def:'Rotary instruments used to smooth and polish restorations, available in extra-fine, fine, and super-fine grits.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Polishing Discs', def:'Abrasive rotary instruments used for finishing composite restorations.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Rubber Points', def:'Abrasive rotary instruments used to polish grooves and metal restorations.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Mandrels', def:'Rotary attachments that hold discs and wheels for polishing.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Round Bur (1-10)', def:'A bur type numbered 1-10, used for initial cavity entry and decay removal.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Inverted Cone Bur (33-39)', def:'A bur type numbered 33-39, used to create retentive grooves.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Straight Fissure Bur (55-60)', def:'A bur type numbered 55-60, used to form cavity walls.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Tapered Fissure Bur (169-172)', def:'A bur type numbered 169-172, used to provide angles for cavity walls.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Pear Bur (330-333)', def:'A bur type numbered 330-333, used for initial tooth entry.'},
  {week:'week2', module:'Instruments & Handpieces', term:'End-Cutting Bur (957-958)', def:'A bur type numbered 957-958, used to create margins for crowns.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Instrument and Handpiece Maintenance', def:'Before a procedure, instruments should be sterilized and remain wrapped until use, arranged in order of use from left to right. During the procedure, organization must be maintained, correct transfer techniques followed, and instruments wiped with sterile gauze after use. After the procedure, sharps are disposed of in appropriate containers, instruments are cleaned before sterilization to remove debris, and manufacturer guidelines are followed for lubrication and sterilization of handpieces.'},
  {week:'week2', module:'Restorative Materials', term:'Restorative and Esthetic Dentistry (Overview)', def:'Restorative dentistry focuses on removing decay or disease and restoring the function of a tooth using direct or indirect restorations. Esthetic dentistry aims to restore teeth with a natural and attractive appearance.'},
  {week:'week2', module:'Restorative Materials', term:'ADA Material Requirements', def:'The American Dental Association sets strict guidelines requiring dental materials to be non-toxic and non-irritating, protect oral tissues and restore natural contours, function well under limited access, wet conditions, and poor visibility, and resemble natural dentition for esthetics.'},
  {week:'week2', module:'Restorative Materials', term:'Characteristics of Dental Materials', def:'Key properties dental materials must have: mechanical strength to withstand biting and chewing forces, thermal stability against expansion/contraction, electrical properties that prevent galvanic reactions between metals, corrosion resistance to foods and drinks, hardness to resist wear and abrasion, low solubility in saliva, and strong adhesion to tooth surfaces.'},
  {week:'week2', module:'Restorative Materials', term:'Amalgam', def:'A durable silver filling material perfected by G.V. Black, composed of mercury bound with an alloy powder.'},
  {week:'week2', module:'Restorative Materials', term:'Amalgam Composition', def:'Amalgam is composed of mercury (43%-54%, which binds the alloy powder), silver (provides strength), tin (increases workability), copper (reduces corrosion), and zinc (minimizes oxidation).'},
  {week:'week2', module:'Restorative Materials', term:'Trituration', def:'The mixing process for amalgam, where a capsule containing mercury and alloy powder is activated and mixed in an amalgamator; the mixed amalgam is then packed into the cavity preparation and carved to match tooth anatomy.'},
  {week:'week2', module:'Restorative Materials', term:'Amalgam Waste Disposal', def:'Amalgam waste is managed using sealed capsules, amalgam separators installed to capture mercury waste, and recycling according to ADA guidelines.'},
  {week:'week2', module:'Restorative Materials', term:'Composite Resin', def:'A tooth-colored restorative material preferred for its esthetics and strength; bonds directly to the tooth and requires minimal removal of natural tooth structure.'},
  {week:'week2', module:'Restorative Materials', term:'Resin Matrix (BIS-GMA)', def:'The base component of composite resin that forms its structural foundation.'},
  {week:'week2', module:'Restorative Materials', term:'Inorganic Fillers', def:'Composite resin components such as quartz, silica, and glass that add strength and reduce shrinkage.'},
  {week:'week2', module:'Restorative Materials', term:'Coupling Agents', def:'Composite resin components that bond the inorganic fillers to the resin matrix.'},
  {week:'week2', module:'Restorative Materials', term:'Polymerization', def:'The curing process of composite resin, achieved through light-curing (blue light) or self-curing; curing time depends on shade, material thickness, and manufacturer instructions.'},
  {week:'week2', module:'Restorative Materials', term:'Composite Finishing & Polishing', def:'Composite is contoured using finishing burs, and polishing enhances smoothness and longevity of the restoration.'},
  {week:'week2', module:'Restorative Materials', term:'Calcium Hydroxide Liner', def:'A dental liner that protects the pulp and stimulates dentin formation.'},
  {week:'week2', module:'Restorative Materials', term:'Dentin Sealer', def:'A dental liner that seals dentinal tubules to prevent tooth sensitivity.'},
  {week:'week2', module:'Restorative Materials', term:'Cavity Varnish', def:'A dental liner that reduces microleakage and protects the tooth from acidic cements.'},
  {week:'week2', module:'Restorative Materials', term:'Dental Base', def:'A material such as zinc oxide-eugenol, glass ionomer, or zinc phosphate cement that provides thermal insulation and support beneath a restoration.'},
  {week:'week2', module:'Restorative Materials', term:'Acid Etching', def:'The use of phosphoric acid to create a roughened enamel surface, enhancing bonding for composite resins, sealants, and orthodontic brackets.'},
  {week:'week2', module:'Restorative Materials', term:'Enamel Bonding', def:'A bonding system used for sealants, veneers, and orthodontic brackets.'},
  {week:'week2', module:'Restorative Materials', term:'Dentin Bonding', def:'A bonding system that creates micromechanical retention for composite restorations.'},
  {week:'week2', module:'Restorative Materials', term:'Intermediate Restorative Material (IRM)', def:'A temporary restorative material made of zinc oxide-eugenol with added fillers for strength and durability, used when a tooth\'s condition is uncertain, the patient\'s health prevents permanent treatment, or financial constraints delay final restorations.'},
  {week:'week2', module:'Restorative Materials', term:'Luting Agent', def:'A dental cement function that permanently cements crowns, bridges, and inlays.'},
  {week:'week2', module:'Restorative Materials', term:'Zinc Oxide-Eugenol (ZOE)', def:'A dental cement used for temporary restorations and bases.'},
  {week:'week2', module:'Restorative Materials', term:'Glass Ionomer', def:'A dental cement and restorative material that releases fluoride and bonds to enamel, dentin, and metal.'},
  {week:'week2', module:'Restorative Materials', term:'Zinc Phosphate Cement', def:'A permanent dental cement that requires precise mixing due to heat generation during setting.'},
  {week:'week2', module:'Restorative Materials', term:'Polycarboxylate Cement', def:'A dental cement that bonds well to tooth structures, used for cast restorations and orthodontics.'},
  {week:'week2', module:'Restorative Materials', term:'Hydrogen Peroxide (Whitening)', def:'A tooth-whitening agent at 25%-38% concentration, used in professional in-office treatments, often accelerated with laser or LED light in a single visit.'},
  {week:'week2', module:'Restorative Materials', term:'Carbamide Peroxide (Whitening)', def:'A tooth-whitening agent at 10%-30% concentration, found in at-home whitening kits using custom trays worn daily for a period recommended by the dentist.'},
  {week:'week2', module:'Restorative Procedures', term:'Restorative Dentistry (Operative Dentistry)', def:'Also known as operative dentistry, this focuses on restoring teeth to their original function and structure using direct and indirect restorative materials; clinical dental assistants play a crucial role in preparing and assisting with these procedures.'},
  {week:'week2', module:'Restorative Procedures', term:'Dental Assistant Responsibilities in Restorative Procedures', def:'Preparing the tray setup, materials, and instruments; understanding and anticipating the dentist\'s needs; assisting in local anesthesia administration and moisture control; assisting in caries removal and material placement; maintaining patient comfort and following exposure control protocols; and performing legally delegated expanded functions.'},
  {week:'week2', module:'Restorative Procedures', term:'Conditions Requiring Restorative Treatment', def:'Includes caries (tooth decay) requiring removal and permanent restoration, tooth structure defects from fractures or developmental anomalies, failed restorations needing replacement, and abrasion/erosion requiring restoration of worn-down tooth structure.'},
  {week:'week2', module:'Restorative Procedures', term:'Cavity Preparation', def:'The process of removing decay using high-speed handpieces and burs, with retentive grooves sometimes added to enhance restoration retention; the depth, size, and location of the cavity determine the restorative material used.'},
  {week:'week2', module:'Restorative Procedures', term:'Retentive Grooves', def:'Grooves placed during cavity preparation to enhance the retention of restorative material.'},
  {week:'week2', module:'Restorative Procedures', term:'Restoration Placement Process', def:'Small preparations receive direct placement of amalgam or composite resin; deep preparations use liners, bases, or bonding agents before material placement; finishing includes carving and contouring for anatomical accuracy, and polishing for aesthetics and smoothness.'},
  {week:'week2', module:'Restorative Procedures', term:'Matrix System', def:'A device that provides a temporary wall for Class II, III, and IV restorations during placement.'},
  {week:'week2', module:'Restorative Procedures', term:'Tofflemire (Universal Retainer)', def:'A matrix system and band commonly used for Class II posterior restorations.'},
  {week:'week2', module:'Restorative Procedures', term:'Plastic Strip Matrix', def:'A matrix system used for anterior composite restorations.'},
  {week:'week2', module:'Restorative Procedures', term:'Sectional Matrix', def:'A matrix system preferred for composite restorations to create tight proximal contacts.'},
  {week:'week2', module:'Restorative Procedures', term:'Wedges (Restorative)', def:'Wood or plastic devices inserted interproximally to stabilize the matrix and ensure proper restoration contour and adaptation.'},
  {week:'week2', module:'Restorative Procedures', term:'Complex Restorations', def:'Restorations used when a large portion of the tooth is missing, often requiring retention pins for internal support when minimal tooth structure remains.'},
  {week:'week2', module:'Restorative Procedures', term:'Retention Pins', def:'Devices that provide internal support for complex restorations when minimal tooth structure remains.'},
  {week:'week2', module:'Restorative Procedures', term:'Veneers', def:'Thin layers of tooth-colored material placed on the tooth surface for esthetic improvement.'},
  {week:'week2', module:'Restorative Procedures', term:'Resin Veneers', def:'Esthetic restorations used to correct stained or misshapen teeth.'},
  {week:'week2', module:'Restorative Procedures', term:'Restorative Ethical & Legal Considerations', def:'Dental assistants must be trained and certified to perform expanded functions, adhere to state laws and practice regulations to ensure patient safety, and maintain up-to-date knowledge of materials and procedures.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Professional and Legal Aspects (Overview)', def:'A crucial area of study covering ethics, legal requirements, patient privacy, professional conduct, and scope of practice, ensuring dental assistants understand both their responsibilities and the legal framework within which they operate.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Dental Assistant Characteristics', def:'Effective dental assistants are communicative, detail-oriented, technically skilled, empathetic, organized, team-oriented, knowledgeable, time-efficient, adaptable, and professional in appearance and behavior.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Ethical Guidelines (Professional Conduct)', def:'Dental professionals are expected to adhere to high ethical standards, including maintaining professionalism, showing respect for patients, and ensuring informed consent before treatments.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Scope of Practice', def:'The specific tasks and responsibilities that a dental assistant is legally authorized to perform based on their education, training, and licensure within a particular state or region. It ensures dental assistants only perform duties they are qualified and permitted to do, reducing the risk of malpractice or legal violations.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Licensure and Certification', def:'Dental assistants often need specific certifications or licenses depending on their role and location, requiring knowledge of regulatory bodies and continuing education to stay compliant.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Patient Confidentiality (HIPAA)', def:'The protection of a patient\'s personal and medical information; HIPAA (Health Insurance Portability and Accountability Act) outlines the federal standards for maintaining this privacy. Keeping information confidential builds patient trust and helps avoid legal consequences for the practice and staff.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Workplace Safety and Regulations', def:'Dental assistants must follow strict guidelines to ensure a safe working environment, including infection control practices and the proper handling of equipment and materials.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Informed Consent (Legal & Ethical)', def:'The process by which a patient is fully educated about a proposed dental procedure, including its risks, benefits, and alternatives, and then voluntarily agrees to proceed. It fosters a collaborative environment where the patient feels empowered and informed before any procedure.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Preparation for Patient Care (Legal Steps)', def:'Review the patient\'s medical history, medications, and allergies and check the chart for special needs; prepare a sterile, organized operatory with disposable surface barriers; then greet and seat the patient, explaining the procedure while maintaining HIPAA confidentiality throughout.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Sterilization and Infection Control (Legal Steps)', def:'Sterilize instruments using autoclaves or other approved methods, disinfect operatory surfaces between appointments, and use appropriate PPE (gloves, masks, eyewear, protective clothing), always following OSHA standards and infection control protocols.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Assisting During Procedures (Legal Steps)', def:'Position the patient correctly and place a protective bib, hand instruments to the dentist using proper technique, and use suction and irrigation as necessary to keep the field clean and safe.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Post-Procedure Care (Legal Steps)', def:'Clean and disinfect the operatory, provide the patient with clear post-treatment instructions covering diet, medications, and follow-up, and document the treatment performed, any complications, and materials used while maintaining confidentiality.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Legal and Professional Considerations (Practice Steps)', def:'Follow the scope of practice defined by your state\'s dental practice act and never perform tasks beyond your certification; maintain patient confidentiality per HIPAA guidelines; and ensure accurate, securely stored record-keeping that complies with state and federal regulations.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Communication (Professional Practice)', def:'Maintain open communication with the dentist during procedures, handing instruments promptly and staying focused on patient comfort, while being compassionate and reassuring with patients before, during, and after treatment.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Dental Practice Act', def:'The state law establishing dentistry as a licensed profession; it defines what dental auxiliaries are legally permitted to do and sets the boundary between delegable and dentist-only duties. It is passed by the state legislature.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Administrative Code (Rule 64B5, F.A.C.)', def:'The detailed regulations that implement the Dental Practice Act, including infection control standards (Chapter 64B5-25) and radiography supervision requirements, adopted and enforced by the state Board.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Delegable Duties', def:'Tasks a licensed dentist may legally assign to a trained auxiliary, such as taking radiographs, placing or removing certain materials, and chairside assisting duties defined by rule.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Dentist-Only Duties', def:'Diagnosis, treatment planning, and irreversible procedures such as cutting hard or soft tissue, which remain exclusively within the dentist\'s scope regardless of an auxiliary\'s experience.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'When in Doubt, Don\'t (Scope Principle)', def:'If a task isn\'t clearly defined as delegable, it should not be performed by an auxiliary without direct confirmation from the supervising dentist.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Hepatitis B — Licensee Reporting', def:'A legal notification duty under Rule 64B5-25, F.A.C., separate from routine bloodborne pathogen training. Any dental licensee — dentist, hygienist, or auxiliary practicing under license — who becomes infected with Hepatitis B must have the Board notified in writing within 14 days of the licensee learning of the infection (from confirmed diagnosis/awareness, not from exposure).'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Board Monitoring After Hepatitis B Notification', def:'After notification, the Board reviews each case individually, applying monitoring criteria based on the licensee\'s role and procedures performed. Continued practice is often possible under defined monitoring conditions, which may include follow-up testing, specific infection-control precautions, or scope limitations depending on viral load and role.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Board Reporting vs. OSHA Bloodborne Pathogen Training', def:'Board reporting is a legal, licensure-based obligation triggered by the licensee\'s own infection status, requiring written notice to the state Board within 14 days under Rule 64B5-25. OSHA bloodborne pathogen training is a separate clinical workplace-safety requirement covering exposure response for any staff member and any bloodborne pathogen, involving annual training and an exposure control plan governed by OSHA, not the dental Board.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Explorer (Legal/Professional Use)', def:'A small, pointed instrument used to detect cavities, irregularities, plaque, and calculus on the teeth during routine exams; handled by the handle with gentle pressure, sterilized after each use, and used only by certified dental professionals to avoid legal issues.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Scaler (Manual or Ultrasonic)', def:'An instrument used to remove plaque, tartar, and debris from teeth, especially hard-to-reach areas like the gum line, during prophylaxis. A manual scaler has a sharp edge for scraping; an ultrasonic scaler vibrates for more aggressive tartar removal and can be operated by the assistant under direct supervision.'},
  {week:'week3', module:'Professional & Legal Aspects', term:'Dental Forceps (Legal Scope)', def:'Instruments used for extracting teeth or removing loose tissue, and for grasping and manipulating tissues during other procedures. Only licensed dentists or oral surgeons can perform extractions; dental assistants may assist but cannot perform extractions independently, as unauthorized use may lead to legal consequences.'},
  {week:'week3', module:'The Dental Patient', term:'The Dental Patient (Overview)', def:'The dental patient is central to all dental practice; understanding a patient\'s needs, medical history, and treatment preferences involves medical/dental history review, communication, treatment planning, patient safety and comfort, and legal/ethical considerations like consent and confidentiality.'},
  {week:'week3', module:'The Dental Patient', term:'Medical History (Patient Concept)', def:'A record of a patient\'s health conditions and medications, crucial for identifying treatment risks. It helps prevent adverse reactions and ensures safe procedures, tailoring treatment to individual needs and enhancing safety and outcomes.'},
  {week:'week3', module:'The Dental Patient', term:'Patient Communication', def:'The exchange of information between the dental team and the patient. It ensures understanding and cooperation, reduces anxiety, builds trust, improves comfort, and promotes treatment adherence.'},
  {week:'week3', module:'The Dental Patient', term:'Informed Consent (Patient Concept)', def:'Providing patients with clear information to make informed decisions about their treatment, required before procedures to ensure patient agreement. It respects patient autonomy, builds trust, and ensures ethical, legal care.'},
  {week:'week3', module:'The Dental Patient', term:'Patient Intake and Assessment', def:'Greet and seat the patient comfortably, update medical and dental history forms, take vital signs (blood pressure, pulse, temperature) if necessary, and explain the treatment process while ensuring confidentiality and awareness of any conditions requiring special care.'},
  {week:'week3', module:'The Dental Patient', term:'Preparing for Dental Treatment (Patient Steps)', def:'Disinfect treatment surfaces and set up instruments, position the patient and apply a protective bib while explaining the treatment, and administer local anesthesia if needed — always following strict infection control protocols and double-checking instrument sterility.'},
  {week:'week3', module:'The Dental Patient', term:'Assisting During the Procedure (Patient Steps)', def:'Hand instruments to the dentist in the correct order, monitor the patient for discomfort and adjust as needed, use suction to maintain dryness, and handle sterile instruments carefully to avoid contamination while ensuring proper head positioning.'},
  {week:'week3', module:'The Dental Patient', term:'Post-Treatment Care (Patient Steps)', def:'Explain post-care instructions, offer support and pain relief as needed, schedule any necessary follow-up appointments, and confirm the patient\'s understanding before discharge — monitoring for reactions to anesthesia throughout.'},
  {week:'week3', module:'The Dental Patient', term:'Dental Mirror', def:'An instrument that provides visibility in hard-to-see areas and reflects light, used during exams and procedures to view the oral cavity; cleaned and sterilized after each use.'},
  {week:'week3', module:'The Dental Patient', term:'Suction Tip (Saliva Ejector / HVE)', def:'A device used during procedures to remove fluids and debris from the mouth and keep the area dry; cleaned and sterilized after use, with regular checks for blockages.'},
  {week:'week3', module:'Medical Emergencies', term:'Medical Emergency (Definition)', def:'Any sudden, acute medical condition in the dental office that requires immediate attention and intervention. Its relevance lies in the fact that dental professionals may be the first responders to these emergencies.'},
  {week:'week3', module:'Medical Emergencies', term:'Common Medical Emergencies (Dental Office)', def:'Includes vasovagal syncope (fainting), hyperventilation from panic attacks, acute asthma attacks, angina/myocardial infarction, epileptic seizures, diabetic emergencies, allergic/hypersensitivity reactions, choking and aspiration, adrenal insufficiency, and cardiac arrest — with fainting being the most frequent and cardiac arrest the most severe, requiring immediate CPR/AED.'},
  {week:'week3', module:'Medical Emergencies', term:'Emergency Protocols', def:'Predefined steps dental teams must follow when an emergency arises, ensuring a systematic and efficient response to situations such as syncope or anaphylaxis and reducing the risk of complications.'},
  {week:'week3', module:'Medical Emergencies', term:'Basic Life Support (BLS)', def:'Techniques including CPR and use of an Automated External Defibrillator (AED); essential training for dental professionals to provide life-saving interventions in cases like cardiac arrest or respiratory failure.'},
  {week:'week3', module:'Medical Emergencies', term:'Handling of Medical Emergencies (Structured Approach)', def:'Assess the patient\'s condition (consciousness, breathing, pulse); activate the emergency protocol and alert the team; stabilize the patient with appropriate positioning and treatment; monitor vital signs until stable or help arrives; and document the events, steps taken, and outcome for legal and future reference.'},
  {week:'week3', module:'Medical Emergencies', term:'Oxygen Tank (Emergency Equipment)', def:'Provides supplemental oxygen during respiratory distress or when a patient is not breathing properly, vital in emergencies like asthma attacks or hypoxia. Maintenance involves regularly checking tank pressure/levels and ensuring the mask and tubing are clean and functional.'},
  {week:'week3', module:'Medical Emergencies', term:'Epinephrine Auto-Injector', def:'Used during severe allergic reactions (anaphylaxis), administered into the patient\'s thigh muscle to counteract the reaction. Maintenance involves regularly checking expiration dates and replacing before expiry.'},
  {week:'week3', module:'Medical Emergencies', term:'Automated External Defibrillator (AED)', def:'Used in cases of cardiac arrest to deliver a shock that can restore normal heart rhythm. Proper maintenance involves regularly checking battery levels and pad readiness/expiration.'},
  {week:'week3', module:'Medical Emergencies', term:'Managing a Fainting Patient (Vasovagal Syncope)', def:'An 8-step structured response: assess consciousness/breathing/pulse; position the patient reclined with feet slightly elevated to restore blood flow; alert the team and loosen tight clothing; administer oxygen if recovery is slow; stabilize using aromatic ammonia if trained/permitted; monitor return to consciousness and vital signs; document the episode and actions taken; and reassess — not resuming treatment until the patient is stable and oriented.'},
  {week:'week3', module:'Medical Emergencies', term:'Minimizing the Risk of Medical Emergencies', def:'Six protective habits: thorough patient assessment of medical history and vitals before treatment, regular staff BLS/CPR and first aid certification, routine emergency drills, regular inspection and maintenance of emergency equipment, clearly assigned team roles, and clear patient communication to reduce anxiety-triggered events like syncope or hyperventilation.'},
  {week:'week3', module:'Radiation Physics Basics', term:'Non-Ionizing Radiation', def:'Lower-energy photons (radio through UV) that lack enough energy to remove electrons from atoms — they warm or excite matter but don\'t ionize it.'},
  {week:'week3', module:'Radiation Physics Basics', term:'Ionizing Radiation', def:'X-rays and gamma rays that carry enough energy to eject electrons from atoms, creating ion pairs — this is exactly what makes them useful for imaging and what makes safe handling essential.'},
  {week:'week3', module:'Radiation Physics Basics', term:'How X-Rays Are Produced', def:'The filament (cathode) is heated, releasing electrons through thermionic emission; high voltage across the tube accelerates the electrons toward the anode; electrons slam into the tungsten target at the anode; and about 1% of that kinetic energy becomes x-ray photons, with the rest becoming heat.'},
  {week:'week3', module:'Radiation Physics Basics', term:'Bremsstrahlung ("Braking") Radiation', def:'Radiation produced when an electron is deflected and slowed by a target nucleus, losing energy as an x-ray photon. This produces most dental x-ray photons, across a range of energies.'},
  {week:'week3', module:'Radiation Physics Basics', term:'Characteristic Radiation', def:'Radiation produced when an incoming electron knocks out an inner-shell electron and an outer-shell electron drops down to fill the gap, releasing a photon of one specific energy.'},
  {week:'week3', module:'Radiation Physics Basics', term:'Photoelectric Effect', def:'An interaction where a photon is fully absorbed, ejecting an inner-shell electron. This absorption difference between tissues creates image contrast — denser tissue like enamel and bone absorbs more and appears radiopaque, while less dense tissue like pulp and periodontal ligament appears radiolucent.'},
  {week:'week3', module:'Radiation Physics Basics', term:'Compton Scatter', def:'An interaction where a photon ejects an outer electron and continues on in a new direction at lower energy — the main source of scatter radiation and occupational exposure, which is why operators step back or leave the room during exposure.'},
  {week:'week3', module:'Radiation Physics Basics', term:'Radiation Measurement Units (Expanded)', def:'Exposure is measured in Roentgen (R) / Coulomb per kg, quantifying ionization produced in air. Absorbed dose is measured in rad / Gray (Gy), quantifying energy absorbed per unit mass of tissue. Equivalent dose is measured in rem / Sievert (Sv), adjusting absorbed dose for radiation type. Effective dose, also in rem/Sievert, further adjusts equivalent dose for tissue sensitivity.'},
  {week:'week3', module:'Radiation Physics Basics', term:'Typical Dental Radiation Exposures', def:'Bitewing/periapical images deliver the lowest dental dose — a small fraction of one day\'s natural background radiation. Panoramic images are somewhat higher than a single intraoral film but still very low. Natural background radiation received annually from cosmic rays, soil, and radon is the benchmark dental doses are compared against.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Occlusal Radiograph (Localization Use)', def:'An intraoral image capturing a broad section of an arch in a single exposure, with the receptor placed flat on the occlusal plane and bitten down on rather than positioned like a periapical or bitewing. Used for localizing impacted or supernumerary teeth, retained roots, or foreign objects; evaluating large lesions, cysts, or suspected jaw fractures; and imaging pediatric or limited-opening patients who can\'t tolerate standard intraoral positioning.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Cephalometric Radiograph (Orthodontic Use)', def:'An extraoral image of the entire skull taken from a fixed, standardized head position, used to measure the profile rather than diagnose individual teeth. Used for orthodontic treatment planning, growth and development tracking over time in pediatric/adolescent patients, and facial profile/surgical assessment before jaw surgery.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Choosing the Right Image (Panoramic vs. Occlusal vs. Cephalometric)', def:'Panoramic is extraoral, captures both arches in one exposure, and gives a broad diagnostic overview. Occlusal is intraoral, covers one arch section in a wide field, and is used for localizing objects and large lesions. Cephalometric is extraoral, captures the full skull in a fixed head position, and is used for growth, profile, and jaw relationship assessment.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Bony & Soft Tissue Variations (Radiographic Placement)', def:'A shallow palatal vault won\'t hold the receptor at a normal angle, requiring slightly reduced vertical angulation or a cotton roll/extra padding for support. Palatal or mandibular tori interfere with normal placement, requiring extra soft padding over the torus and gentle repositioning away from (not pressed against) the growth. A large tongue or narrow arch can displace the receptor, requiring a smaller receptor size or a flexible-holder/finger-supported technique.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Dentition & Arch Variations (Radiographic Placement)', def:'Edentulous areas have no teeth to stabilize the receptor, so cotton rolls or a modified bite-block are used, centering the receptor over the ridge crest. Pediatric/primary dentition requires a smaller receptor (size 0 or 1), reduced exposure time, and adjusted vertical angulation for shorter roots. Limited opening/trismus may require a smaller receptor, a modified holder or finger-held technique, or switching to an extraoral image.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Managing Anxiety & the Gag Reflex', def:'Ease anxiety by explaining each step, using calm non-threatening language, letting the patient hold a stop-cue, and working efficiently. Manage the gag reflex by seating the patient upright (not reclined), having them breathe through the nose and focus on an object, using topical anesthetic on the palate or posterior tongue if permitted, and working posterior-to-anterior with minimal exposure time.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Special Populations in Radiography', def:'Pediatric patients benefit from simple, positive language and hands-on equipment familiarization. Patients with disabilities need input from the patient/caregiver on communication and adapted receptor holding methods. Medically compromised patients require confirming medical history and positioning restrictions while keeping exposure time efficient. Pregnant patients should be reassured that a lead apron, thyroid collar, and proper collimation follow established safety practice.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Barrier Techniques & Surface Disinfection (Radiography)', def:'Before the patient, use disposable barrier envelopes on sensors and PSP plates, barrier sleeves on the tube head/PID/exposure button, and surface covers on the control panel and other high-contact points. After the patient, remove barriers with gloved hands, re-glove, wipe all touched surfaces with an EPA-registered intermediate-level disinfectant, and allow the full manufacturer-specified contact time before reuse. A barrier not replaced between patients is the same as having no barrier at all.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Receptor & Sensor Asepsis', def:'Digital sensors cannot be heat-sterilized or fully immersed, so a barrier sleeve is always used and the sensor is wiped with a compatible intermediate-level disinfectant after barrier removal. PSP (phosphor) plates are barrier-protected but delicate — the barrier is removed without touching the plate, avoiding abrasive cleaning. Film packets have a contaminated outer packet but clean film inside — the packet is wiped or dipped per protocol, then opened with clean gloves in a separate clean area.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Reviewing Patient History for Radiographic Contraindications', def:'Before positioning any receptor, review medications (anticoagulants, bisphosphonates), pregnancy status, prior radiation history to avoid unnecessary duplicate exposure, and relevant medical conditions affecting positioning or tolerance such as a severe gag reflex or TMJ disorders.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Patient Preparation Before Radiographic Exposure', def:'Remove eyewear for panoramic and cephalometric exposures to prevent frame artifacts; take out removable appliances such as partial dentures or retainers; remove jewelry, piercings, and necklaces that create metal artifacts; and place the lead apron and thyroid collar correctly as the final preparation step.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Paralleling Technique', def:'The preferred radiographic acquisition technique, in which the receptor is held parallel to the long axis of the tooth and the central ray is directed perpendicular to both the receptor and tooth, typically using an XCP/beam-alignment device. It is the most accurate technique with the least distortion.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Bisecting Angle Technique', def:'A radiographic acquisition technique in which the receptor is placed at an angle to the tooth (not parallel) and the central ray is directed perpendicular to an imaginary bisector. Used when anatomy limits parallel placement (shallow palate, tori), though it carries a higher risk of image distortion such as elongation or foreshortening.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Panoramic Technique', def:'An extraoral acquisition technique with no intraoral receptor placement, producing a tomographic image of the entire maxilla and mandible in one exposure with the patient positioned in a stationary unit and head stabilized. Used for a broad diagnostic overview, growth/development tracking, or when intraoral placement isn\'t tolerated.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Hand Hygiene & PPE Selection (Radiography)', def:'Wash or sanitize hands before patient contact, before donning gloves, and immediately after removing gloves for every patient and exposure. Masks and eyewear are selected based on likely exposure to blood, saliva, or aerosols and worn for the full procedure. Gloves are donned last, immediately before touching the patient, with a fresh pair for every patient.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Donning & Doffing PPE (Radiography Order)', def:'Donning order: perform hand hygiene, put on mask, put on protective eyewear, then put on gloves last right before patient contact. Doffing order: remove gloves first without touching the outer contaminated surface, perform hand hygiene, remove eyewear then mask, then perform hand hygiene again.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Preventing Cross-Contamination During Imaging', def:'Avoid touching light switches, drawers, keyboards, or the exposure panel with contaminated gloves once they\'ve touched the patient; use barriers or overgloves to handle non-barriered items like charts or phones; and between patients, remove and dispose of PPE, disinfect touched surfaces, perform hand hygiene, then don fresh PPE.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'CBCT (Cone Beam Computed Tomography)', def:'The one radiographic exception that produces three-dimensional data rather than a flat image. The x-ray source and detector rotate once around the patient\'s head in a single rotation, capturing hundreds of images that are reconstructed into a 3D volume that can be viewed and sliced in any plane — unlike periapical, bitewing, or panoramic images, which compress 3D anatomy into a flat image.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'Clinical Applications of CBCT', def:'Ordered when 2D imaging can\'t answer the diagnostic question, not as a routine substitute for periapicals or panoramics. Applications include implant planning (measuring bone volume, density, and structures like the mandibular canal), impacted tooth localization in 3D relative to roots/nerves/sinus, TMJ and airway evaluation, and complex endodontic or surgical case planning.'},
  {week:'week3', module:'Radiography Techniques & Technology', term:'CBCT vs. Traditional 2D Imaging', def:'2D imaging (periapical/panoramic) produces a flat, two-dimensional image with a field of view fixed by receptor size and technique, typically used for routine caries, bone level, and general diagnosis at a lower radiation dose. CBCT produces three-dimensional volumetric data with a selectable field of view (small focused volumes to full craniofacial), used for complex surgical, implant, and 3D-anatomy questions at a higher radiation dose per exposure, selected only when 3D data changes the treatment plan.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Radiobiology (Definition)', def:'The study of how ionizing radiation interacts with living tissue, from the moment an x-ray photon strikes a cell to the biological effect that may result. An x-ray photon has enough energy to eject electrons from atoms it strikes, creating ion pairs; the cell nucleus, specifically DNA, is the most radiosensitive structure, and damage there drives nearly all meaningful biological effects.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Direct Action (Radiation Damage)', def:'A pathway of radiation damage, accounting for about 5% of dental x-ray interactions, in which the x-ray photon strikes the DNA molecule itself and ionization breaks chemical bonds directly within the strand. More common with high-LET radiation, which is not typical of dental x-rays.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Indirect Action (Radiation Damage)', def:'A pathway of radiation damage, accounting for about 95% of dental x-ray interactions, in which the photon strikes a water molecule (cells are 70-80% water), ionizing it into free radicals — most notably hydroxyl (OH•) — which diffuse and damage DNA chemically rather than by direct impact. Because dental imaging is low-LET radiation, indirect action is the dominant mechanism of biological damage.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Law of Bergonié and Tribondeau', def:'A 1906 principle stating that cells are more radiosensitive when they have a high mitotic rate, low differentiation, high metabolic rate, and a long mitotic future. The most radiosensitive tissues include lymphoid and bone marrow cells, reproductive cells, and epithelial cells including oral mucosa and salivary gland tissue; the most radioresistant include muscle cells, nerve cells, and mature bone/cartilage.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Stochastic Effects', def:'Radiation effects that are "all-or-nothing" — probability, not severity, increases with dose, and there is no threshold dose, meaning any exposure (including dental-range doses) carries some risk. Effects have a long latent period, sometimes years, and examples include cancer induction and genetic (hereditary) effects.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Deterministic Effects', def:'Radiation effects that are threshold-based — severity increases once a specific dose threshold is exceeded, and the effect only occurs above that level. Effects have a short latent period, appearing relatively soon after exposure, with examples including skin erythema, cataracts, and epilation (hair loss). These are essentially avoided at diagnostic dental doses.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Somatic Effects', def:'Radiation effects that occur only in the exposed individual, not passed to offspring, typically with a short latent period (minutes to weeks, such as skin erythema after a high acute dose). Most radiation effects relevant to dental exposure for patients and operators are somatic.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Genetic (Hereditary) Effects', def:'Radiation effects that occur in the offspring of the exposed individual, caused by radiation damage to reproductive (germ) cells, typically with a long latent period of years to decades. This is why gonadal shielding and minimizing gonadal dose matter even at low dental doses.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Dose-Response Relationships', def:'The deterministic curve stays flat at zero, then rises sharply once the threshold dose is crossed, with severity climbing with dose. The stochastic curve rises from zero with no threshold, meaning even small doses carry small, nonzero risk that scales with dose. Dental radiographic doses sit far to the left on this graph, below deterministic thresholds, which is why stochastic risk remains the operative concern and why ALARA still applies.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'Acute vs. Chronic Exposure', def:'Acute exposure is a large dose delivered in a short period, giving the body little time to repair cellular damage and being associated with deterministic effects at high enough doses — not the typical dental exposure pattern. Chronic exposure is a smaller dose delivered repeatedly over a long period, giving cells time to repair some damage between exposures; this reflects real occupational dental exposure, which is why cumulative dose tracking (dosimetry) matters.'},
  {week:'week3', module:'Radiation Protection & Radiobiology', term:'ALARA — Time, Distance, Shielding, Technique', def:'Because stochastic effects have no threshold, no dose is considered completely safe, so ALARA (As Low As Reasonably Achievable) is applied through four measures: minimizing exposure time by using correct technique the first time to avoid retakes; maximizing operator distance from the primary beam and patient; using lead aprons, thyroid collars, and structural barriers to absorb scatter radiation; and using proper collimation, filtration, and receptor selection to reduce dose at the source.'},
  {week:'week4', module:'Periodontics', term:'Periodontics (Overview)', def:'A dental specialty focusing on the prevention, diagnosis, and treatment of periodontal (gum) diseases and the maintenance of the supporting structures of teeth, including the gums, periodontal ligament, and alveolar bone. Periodontal diseases such as gingivitis and periodontitis can lead to tooth loss and systemic health problems if untreated.'},
  {week:'week4', module:'Periodontics', term:'Gingivitis', def:'The earliest stage of periodontal disease, caused by plaque buildup, resulting in red, swollen, and bleeding gums; it is reversible with proper care.'},
  {week:'week4', module:'Periodontics', term:'Early Periodontitis', def:'A stage of periodontal disease involving mild bone loss, gum recession, and the beginning of deeper periodontal pockets.'},
  {week:'week4', module:'Periodontics', term:'Moderate Periodontitis', def:'A stage of periodontal disease involving increased bone loss, loose teeth, and the development of infections.'},
  {week:'week4', module:'Periodontics', term:'Advanced Periodontitis', def:'The most severe stage of periodontal disease, involving severe bone loss, deep pockets, tooth mobility, and potential tooth loss.'},
  {week:'week4', module:'Periodontics', term:'Gingival Recession', def:'A condition where the gum tissue pulls back from the teeth, exposing the roots. Addressing this condition helps preserve tooth structure and prevent sensitivity.'},
  {week:'week4', module:'Periodontics', term:'Periodontal Disease (Definition)', def:'An inflammatory condition affecting the tissues surrounding and supporting the teeth, commonly caused by plaque accumulation. Understanding it is essential for diagnosing, preventing, and treating gum diseases that can result in tooth loss if untreated.'},
  {week:'week4', module:'Periodontics', term:'Scaling and Root Planing', def:'A deep cleaning procedure involving the removal of plaque and tartar from below the gumline, followed by smoothing the root surfaces to help gums re-attach. It is a non-surgical treatment for early periodontal disease that prevents further gum damage.'},
  {week:'week4', module:'Periodontics', term:'Scaling and Root Planing — Step-by-Step Process', def:'Review medical history and assess periodontal status (probing depths, bleeding on probing); administer local anesthesia for comfort; scale with ultrasonic or hand instruments to remove plaque and tartar; plane the root to smooth rough surfaces and promote gum re-attachment; then provide home-care instructions and schedule a follow-up for reassessment.'},
  {week:'week4', module:'Periodontics', term:'Signs Requiring a Periodontal Consult', def:'Bite changes, loose or separating teeth, pain or sores in the mouth, pus between the gum and teeth, bleeding while brushing or flossing, gum recession, bad breath, tooth sensitivity, and swollen, red, or tender gums. When gum disease is caught at the gingivitis stage, it can be reversed.'},
  {week:'week4', module:'Periodontics', term:'Ultrasonic Scaler', def:'An instrument that removes plaque and tartar from teeth and below the gumline using high-frequency vibrations, applied to surfaces with calculus buildup for efficient cleaning.'},
  {week:'week4', module:'Periodontics', term:'Periodontal Probe (Week 4 Use)', def:'Used to measure the depth of periodontal pockets around each tooth; gently inserted into the sulcus to assess gum attachment and detect early signs of periodontal disease.'},
  {week:'week4', module:'Periodontics', term:'Curette', def:'A handheld instrument with a curved blade used for scaling and root planing; must be kept sharp and sterilized after every use to prevent infection.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Four Instrument Categories', def:'Examination instruments assess oral structures without altering them (mouth mirror, explorer, periodontal probe, cotton pliers). Hand cutting instruments manually remove or shape tooth structure (excavators, chisels and hoes, hatchets). Restorative/accessory instruments place, condense, and finish materials (amalgam carrier, condenser/plugger, carver, burnisher). Rotary instruments cut, finish, or polish using a handpiece (high-speed handpiece, low-speed handpiece, burs and discs).'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Mouth Mirror (Purpose)', def:'Provides indirect vision of surfaces not directly visible, retracts cheeks and tongue, reflects light onto the field, and allows transillumination to check for cracks.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Explorer (Purpose)', def:'A fine tactile probe used to detect caries, calculus, defective margins, and other surface irregularities by feel rather than sight.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Cotton Pliers (Purpose)', def:'Used to pick up and transfer small items — cotton rolls, medicaments, small restorative pieces — into and out of the mouth without contaminating gloved fingers.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Instrument Processing Cycle', def:'A six-step cycle: (1) transport contaminated instruments in a covered, puncture-resistant container; (2) pre-clean using an ultrasonic cleaner or instrument washer to remove bioburden; (3) package by wrapping or pouching to preserve sterility; (4) sterilize using autoclave, dry heat, or chemical vapor per manufacturer instructions; (5) store sterile packages dry, dated, and protected from damage; and (6) deliver to the point of use, staying sealed until opened chairside. Skipping or rushing any step, especially pre-cleaning or drying, can leave bioburden behind or compromise sterility even after autoclaving.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'CDC Classification — Critical Instruments (Week 4)', def:'Instruments that penetrate soft tissue or bone, requiring sterilization; examples include scalers, surgical forceps, elevators, and scalpel blades.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'CDC Classification — Semicritical Instruments (Week 4)', def:'Instruments that contact mucous membranes without penetrating tissue, requiring heat sterilization or high-level disinfection; examples include mouth mirrors, amalgam condensers, and impression trays.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'CDC Classification — Noncritical Items (Week 4)', def:'Items that contact only intact skin, requiring intermediate-level disinfection; examples include blood pressure cuffs, pulse oximeters, and external unit surfaces.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'FDA-Approved Sterilization Requirement (Rule 64B5-25)', def:'Florida Rule 64B5-25, F.A.C. requires every dental practice to use at least one FDA-approved sterilization device; disinfection alone is not enough for instruments classified as critical or semi-critical. The requirement is about the device itself — a sterilizer must be FDA-cleared for the modality it performs, and homemade or unapproved processes do not satisfy the rule even if instruments appear clean. Compliance must be verified, not assumed, through routine biological monitoring.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Steam Under Pressure (Autoclave)', def:'The most common sterilization method in dental offices; features fast cycle times and is effective against all microorganisms including spores when time, temperature, and pressure parameters are met.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Dry Heat Sterilization', def:'A sterilization modality involving no moisture — items exit dry. It has a longer cycle time than steam but reduces corrosion risk for certain metal instruments.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Chemical Vapor Sterilization', def:'A sterilization modality using a heated chemical solution under pressure, with speed comparable to steam autoclaving but less rusting of carbon-steel instruments.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Ethylene Oxide (Gas) Sterilization', def:'A sterilization modality used for heat-sensitive items that can\'t tolerate steam or dry heat. It has the longest cycle of the four modalities, requiring extended aeration time before instruments are safe to handle.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Choosing & Verifying a Sterilization Device', def:'Follow manufacturer instructions exactly, since cycle time, temperature, and loading requirements vary by device and instrument load and deviating from validated parameters can void sterility even on approved equipment. Run biological (spore) testing routinely to confirm the sterilizer is killing the most resistant organisms, not just running a cycle. Keep dated, retained sterilization records available for review as evidence of compliance if the practice is audited.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Radiographs as Protected Health Information (PHI)', def:'A radiograph is not just a diagnostic image — it\'s protected health information governed by the same HIPAA Privacy and Security Rules as any other part of the patient\'s chart, whether digital or film.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Minimum Necessary Standard', def:'A HIPAA principle stating that only the images relevant to a specific request should be shared, not the entire imaging history by default.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Patient Access Rights (Radiographs)', def:'Patients have the right to request and receive copies of their own radiographs, typically within a defined response window.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Record Retention (Radiographs)', def:'HIPAA does not set a retention period for clinical records — that is determined by state law, which varies. Adult patient records are commonly retained for a state-defined minimum after the last visit, often 7-10 years. Minor patient records are typically retained until the patient reaches the age of majority (usually 18) plus an additional state-defined period. Separately, HIPAA requires privacy/security compliance documentation to be kept for at least 6 years, distinct from the clinical record itself.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Ownership & Transfer of Radiographs', def:'The dentist/practice owns the original radiographs and chart as part of the clinical record they created. Patients (or their new dentist, with authorization) are entitled to copies of their radiographs, not the originals. When transferring records to a new provider, copies are sent — originals are only released under a court order or similar legal requirement.'},
  {week:'week4', module:'Instrument Purpose & Care', term:'Charting & Documentation of Radiographic Images', def:'An image that isn\'t documented is legally as if it doesn\'t exist. Every exposure must be logged in the chart with the date and image type (e.g., FMX, bitewings, panoramic), linked to the clinical reason it was ordered, and stored digitally attached directly to the patient\'s file in the practice management system — never as a standalone, unlabeled file.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Prosthodontics (Overview)', def:'The branch of dentistry focused on the restoration and replacement of missing or damaged teeth through prostheses such as dentures, crowns, and bridges. It combines advanced restorative techniques with aesthetics, function, and patient comfort.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Dental Implants (Overview)', def:'Artificial tooth roots placed into the jawbone to replace missing teeth, serving as a foundation for attaching prosthetic teeth such as crowns, bridges, or dentures. They offer a long-term solution for tooth loss and improve a patient\'s ability to speak and eat comfortably.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Visual Inspection (Prosthodontic Exam)', def:'An examination technique checking for damage or misalignment of restorations and the health of tissues around implants.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Bite Test', def:'An examination technique used to ensure proper fit and alignment of restorations in the patient\'s bite.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Occlusion Evaluation (Prosthodontics)', def:'An examination technique ensuring even bite force distribution and patient comfort.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Percussion Test', def:'An examination technique used to check the stability of restorations or implants.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Prosthesis', def:'A custom-made device used to replace missing teeth or other oral structures, playing a critical role in restoring the form and function of the mouth so patients can chew, speak, and smile confidently.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Dental Implant (Key Concept)', def:'A titanium post surgically placed into the jawbone, serving as an artificial root to support crowns, bridges, or dentures. Implants offer stability and durability, closely mimicking natural tooth structure.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Osseointegration', def:'The process by which a dental implant fuses with the jawbone, ensuring stability and permanence of the implant. This process is crucial for the long-term success of the implant.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Abutment Placement', def:'Once osseointegration is complete, an abutment is placed on the implant; this component connects the implant to the final prosthesis (crown, bridge, or denture).'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Dental Implant Procedure (Full Sequence)', def:'Initial consultation evaluates oral health, discusses options, and images the jaw to assess bone density; implant placement surgery uses local anesthesia and small incisions to insert the implant into the bone; the osseointegration phase requires 3 to 6 months of healing for the implant to fuse with bone, during which the patient may wear a temporary restoration; then the abutment and final prosthesis are placed and adjusted for fit, function, and aesthetics.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Dental Implant Drill', def:'Used for preparing the bone and creating a space for the implant; essential for precise placement to ensure osseointegration.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Torque Wrench (Implants)', def:'Used to tighten the implant into the bone with a specific amount of force, ensuring the implant is securely placed without damaging surrounding tissues.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Implant Surgical Kit', def:'Includes drills, guide pins, and implant drivers used during surgical placement of the implant, ensuring precise placement and the appropriate implant size.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Bone Grafting Materials', def:'Synthetic bone, autografts, or allografts used to build up bone structure when there is insufficient bone volume to place an implant.'},
  {week:'week5', module:'Prosthodontics & Implants', term:'Periosteal Elevator', def:'Used to lift the gum tissue away from the jawbone during surgery, providing clear access for implant placement; proper handling and sterilization are crucial to avoid tissue damage.'},
  {week:'week5', module:'Oral & Maxillofacial Surgery', term:'Oral and Maxillofacial Surgery (Overview)', def:'A specialized branch of dentistry focused on diagnosing, treating, and managing conditions, diseases, injuries, and defects related to the oral cavity, jaw, face, and neck, bridging medicine and dentistry to address complex issues affecting speech, eating, and breathing.'},
  {week:'week5', module:'Oral & Maxillofacial Surgery', term:'Maxillofacial Trauma', def:'Injuries to the face, jaws, and surrounding structures; relevant to oral and maxillofacial surgery because these traumatic injuries often require surgical intervention to restore function and appearance.'},
  {week:'week5', module:'Oral & Maxillofacial Surgery', term:'Orthognathic Surgery', def:'Surgery involving the correction of jaw and facial skeletal deformities, crucial in treating malocclusions and other jaw irregularities that affect chewing, speaking, or breathing.'},
  {week:'week5', module:'Oral & Maxillofacial Surgery', term:'TMJ Disorders (Surgical Context)', def:'Disorders causing pain and dysfunction in the jaw joint and muscles responsible for movement; surgical treatment can provide relief for patients suffering from chronic pain, improving their ability to eat and speak.'},
  {week:'week5', module:'Oral & Maxillofacial Surgery', term:'Oral & Maxillofacial Surgery Process', def:'Preoperative assessment includes a physical exam, diagnostic imaging (x-rays or CT scans), and medical history review. Anesthesia is local for minor procedures or general for complex surgeries. Incision and exposure carefully accesses the affected area with minimal tissue damage. Surgical intervention ranges from extractions to bone grafting or reconstructive surgery. Postoperative care includes pain management, infection prevention, and monitoring for complications. Follow-up involves regular visits to monitor healing and function.'},
  {week:'week5', module:'Oral & Maxillofacial Surgery', term:'Scalpel', def:'Used to make precise incisions in soft tissue, essential for accessing the surgical site with minimal tissue damage.'},
  {week:'week5', module:'Oral & Maxillofacial Surgery', term:'Bone Saw', def:'Used when cutting bone during procedures like orthognathic surgery or in cases of trauma; requires the appropriate blade for the bone type and controlled cuts to avoid damaging surrounding tissues.'},
  {week:'week5', module:'Oral & Maxillofacial Surgery', term:'Surgical Forceps (Maxillofacial)', def:'Used to grasp and manipulate tissues or bones during oral and maxillofacial procedures; proper sterilization and handling are critical to maintaining effectiveness and preventing cross-contamination.'},
  {week:'week5', module:'Pediatric Dentistry', term:'Pediatric Dentistry (Overview)', def:'A specialized field focused on the oral health of children from infancy through adolescence, ensuring early development of proper dental habits, preventing oral health issues, and addressing needs unique to growing children, including teething, cavities, malocclusion, and developmental disorders.'},
  {week:'week5', module:'Pediatric Dentistry', term:'Teething', def:'The process of a baby\'s first teeth (deciduous teeth) emerging through the gums; can be uncomfortable, so understanding how to ease the associated discomfort is vital for pediatric dental care.'},
  {week:'week5', module:'Pediatric Dentistry', term:'Pulp Therapy', def:'Treatment of the innermost portion of a tooth (the pulp) to prevent infection or save the tooth from extraction, particularly relevant when children have deep cavities reaching the pulp; can save a child\'s tooth so it remains functional while the adult tooth develops.'},
  {week:'week5', module:'Pediatric Dentistry', term:'Preventive Care (Pediatric)', def:'Procedures like fluoride treatments, sealants, and oral hygiene education that teach children and parents proper habits to help prevent future dental issues and promote long-term oral health.'},
  {week:'week5', module:'Pediatric Dentistry', term:'Pediatric Oral Hygiene Education', def:'Teaching children proper brushing and flossing techniques to foster lifelong oral health habits, encouraging twice-daily brushing with fluoride toothpaste and daily flossing.'},
  {week:'week5', module:'Pediatric Dentistry', term:'Nutrition & Fluoride (Pediatric)', def:'A well-balanced diet supports healthy growth and strong teeth, while excessive sugar intake increases cavity risk. Fluoride is essential in preventing tooth decay, particularly for children lacking early fluoride exposure, and professional fluoride treatments effectively strengthen enamel and reduce cavities.'},
  {week:'week5', module:'Pediatric Dentistry', term:'Dental Sealants (Pediatric)', def:'Clear or tooth-colored coatings that offer a protective barrier against decay, particularly on the chewing surfaces of molars and premolars, helping keep vulnerable areas cavity-free as a key preventive measure in pediatric dentistry.'},
  {week:'week5', module:'Pediatric Dentistry', term:'Fluoride Application Process', def:'Clean the child\'s teeth thoroughly to remove plaque and debris; apply fluoride gel or varnish using a small brush or applicator; allow the fluoride to remain on the teeth for several minutes as instructed; and ensure the child does not eat or drink for at least 30 minutes afterward to allow maximum absorption, monitoring for adverse reactions and using age-appropriate concentration.'},
  {week:'week6', module:'Endodontics', term:'Endodontics (Overview)', def:'A specialized field in dentistry focused on the prevention, diagnosis, and treatment of dental pulp diseases. The primary goal of endodontic treatment is to save a tooth from extraction, primarily through root canal therapy. General dentists handle simple cases, while endodontists specialize in more complex treatments.'},
  {week:'week6', module:'Endodontics', term:'Root Canal Therapy', def:'The primary endodontic treatment used to save a tooth from extraction by removing diseased or infected pulp tissue from within the tooth, then cleaning, shaping, and filling the resulting canal space.'},
  {week:'week6', module:'Endodontics', term:'Reversible Pulpitis', def:'Mild, early inflammation of the dental pulp in which the tissue remains healthy enough to recover if the irritant (such as deep decay) is removed; typically presents as brief, sharp sensitivity that subsides quickly.'},
  {week:'week6', module:'Endodontics', term:'Irreversible Pulpitis', def:'Advanced inflammation of the dental pulp in which the tissue cannot heal even if the irritant is removed; typically presents as lingering, spontaneous pain and usually requires root canal therapy or extraction.'},
  {week:'week6', module:'Endodontics', term:'Pulp Vitality Testing', def:'Diagnostic tests such as thermal (cold/heat), electric pulp testing, and percussion testing used to assess whether the pulp of a tooth is alive, inflamed, or necrotic.'},
  {week:'week6', module:'Endodontics', term:'Gutta-Percha', def:'A rubber-like, biocompatible material used to fill and seal the root canal space after cleaning and shaping during root canal therapy.'},
  {week:'week6', module:'Endodontics', term:'Endodontic Explorer', def:'A specialized fine, often angled explorer used to locate canal orifices on the pulpal floor of a tooth during root canal therapy.'},
  {week:'week6', module:'Endodontics', term:'Electronic Apex Locator', def:'A device that measures electrical resistance to determine the precise working length of a root canal by detecting when the file reaches the apical foramen.'},
  {week:'week6', module:'Endodontics', term:'Surgical Endodontic Procedures', def:'Procedures such as apicoectomy, performed when non-surgical root canal therapy cannot resolve persistent infection or pathology, typically involving surgical removal of the root tip and surrounding infected tissue.'},
  {week:'week6', module:'Endodontics', term:'Sodium Hypochlorite (Endodontic Irrigant)', def:'An antimicrobial solution used to irrigate and disinfect the root canal system during treatment, dissolving organic tissue and eliminating bacteria within the canal.'},
  {week:'week6', module:'Radiation Biology & Units', term:'Radiation Measurement Units (Week 6)', def:'Exposure is measured in Roentgen (R) / Coulomb per kg, quantifying ionization produced in air. Absorbed dose is measured in rad / Gray (Gy), quantifying energy absorbed per unit mass of tissue. Equivalent dose is measured in rem / Sievert (Sv), adjusting absorbed dose for radiation type. Effective dose, also in rem/Sievert, further adjusts equivalent dose for tissue sensitivity.'},
  {week:'week6', module:'Radiation Biology & Units', term:'Typical Dental Radiation Exposures (Week 6)', def:'Bitewing/periapical images deliver the lowest dental dose — a small fraction of one day\'s natural background radiation. Panoramic images are somewhat higher but still very low. Natural background radiation received annually from cosmic rays, soil, and radon is the benchmark dental doses are compared against.'},
  {week:'week6', module:'Radiation Biology & Units', term:'Deterministic Effects (Week 6)', def:'Radiation effects with a dose threshold; severity increases with dose once that threshold is crossed. Essentially avoided at diagnostic dental doses.'},
  {week:'week6', module:'Radiation Biology & Units', term:'Stochastic Effects (Week 6)', def:'Radiation effects with no dose threshold — probability rises with dose, but severity does not. This is the effect radiation safety practices are designed around.'},
  {week:'week6', module:'Radiation Biology & Units', term:'Law of Bergonié and Tribondeau (Week 6)', def:'A principle stating that cells are more radiosensitive when they divide rapidly, have a long dividing future, and are less differentiated. The most radiosensitive cells include lymphocytes, reproductive cells, GI epithelium, and bone marrow; the least radiosensitive include nerve cells, muscle cells, and mature bone and cartilage.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'ALARA Equipment Choices', def:'Four equipment-based ways to reduce dose: collimation restricts the beam to the receptor size, cutting the volume of tissue irradiated; fast receptors (F-speed film or digital sensors) need less exposure per image; filtration removes low-energy photons that would be absorbed by tissue without reaching the receptor; and a longer PID length reduces beam divergence and scatter.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Patient Protection (ALARA)', def:'Measures include placing a lead apron and thyroid collar on every intraoral and panoramic exposure, justifying every exposure based on clinical need rather than a fixed schedule, using the fastest receptor and correct technique to avoid retakes, and selecting the smallest field size that still covers the diagnostic area.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Operator Protection (ALARA)', def:'Measures include standing behind a protective barrier or at least 6 feet away at a 90-135 degree angle to the beam, never holding the receptor or tube head for a patient during exposure, wearing a personnel dosimetry badge and reviewing readings on schedule, and stepping outside the room (or behind the barrier) for every single exposure with no exceptions.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'MPD (Maximum Permissible Dose)', def:'The upper limit of radiation dose a person may receive without significant risk of harmful effects. Occupational whole-body MPD is 5 rem (50 mSv) per year.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Cumulative Dose', def:'The running total of radiation dose an operator accumulates over a career, tracked via a personal dosimeter badge and compared against annual MPD limits.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Absorbed Dose (Week 6)', def:'The amount of radiation energy absorbed per unit of tissue mass, measured in gray (Gy) or rad.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Equivalent & Effective Dose (Week 6)', def:'Equivalent dose adjusts absorbed dose for the harm of the radiation type (measured in sievert or rem); effective dose further adjusts for tissue sensitivity to estimate whole-body risk.'},
