  {week:'week6', module:'ALARA & Radiation Protection', term:'Operator Protection During Exposure — Use a Barrier', def:'Whenever possible, stand behind a protective barrier — a wall or shield containing lead — during x-ray exposure.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Operator Protection During Exposure — Keep Distance', def:'If no barrier is available, stand at least 6 feet (2 meters) from the x-ray tube head and the patient during exposure.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Operator Protection During Exposure — Stand at an Angle', def:'Position at a 90-135 degree angle to the central beam — never directly in the path of the primary beam.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Operator Protection During Exposure — Never Hold', def:'Never hold the image receptor or the tube head in place for a patient during exposure.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Leakage Radiation (Causes of Unnecessary Exposure)', def:'Radiation escaping through the tube head housing outside the collimated beam. Well-maintained equipment keeps leakage within regulated limits, checked during routine inspections.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Retakes (Causes of Unnecessary Exposure)', def:'Repeat exposures due to positioning errors, technique errors, or patient movement, which add unnecessary dose to both the patient and the operator. Consistent technique reduces retake frequency.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Addressing Patient Concerns About Radiation Exposure', def:'Explain that dental radiographic doses are very low, often comparable to natural background radiation received over a few days; that protective measures (lead apron, thyroid collar, collimation, fast receptors) are already part of the ALARA principle in practice; that images are only taken when diagnostically necessary as determined by the dentist; and refer specific medical questions (pregnancy, systemic conditions) to the supervising dentist.'},
  {week:'week6', module:'ALARA & Radiation Protection', term:'Protocol for Suspected X-Ray Unit Malfunction', def:'A six-step protocol: (1) stop use immediately — do not attempt further exposures; (2) notify the supervising dentist or office manager right away; (3) tag the unit "Out of Service" and remove it from availability; (4) call for service from the manufacturer or a qualified technician to inspect and calibrate; (5) document the incident, recording the date, symptoms observed, and any exposure involved; and (6) confirm before reuse — do not resume use until the unit passes inspection.'},
  {week:'week7', module:'Preventive Care', term:'Preventive Care (Overview)', def:'A crucial aspect of dentistry focused on maintaining optimal oral health and preventing the onset of dental diseases such as cavities, gum disease, and oral cancer. It saves patients from pain and discomfort while reducing long-term treatment costs, and plays a central role in education, early detection, and management of oral health.'},
  {week:'week7', module:'Preventive Care', term:'Oral Hygiene (Preventive Concept)', def:'Daily practices essential for preventing common dental conditions and promoting overall health.'},
  {week:'week7', module:'Preventive Care', term:'Fluoride Treatment (Week 7)', def:'The application of fluoride to teeth to make them more resistant to decay and help remineralize weakened enamel.'},
  {week:'week7', module:'Preventive Care', term:'Sealants (Week 7)', def:'Protective coatings effective in preventing decay in children and adults prone to cavities in pits and fissures, reducing the need for more extensive treatments like fillings.'},
  {week:'week7', module:'Preventive Care', term:'Bass Method of Sulcular Brushing', def:'A toothbrushing technique in which bristles are angled at 45 degrees toward the gumline and gently vibrated to clean along and slightly under the gingival margin, effectively removing plaque at the sulcus.'},
  {week:'week7', module:'Preventive Care', term:'Oral Cancer Screening', def:'An examination technique checking for unusual lesions or lumps in the mouth for early detection of oral cancer.'},
  {week:'week7', module:'Preventive Care', term:'Gingival Assessment', def:'An examination technique checking gum health, looking for signs of inflammation or bleeding.'},
  {week:'week7', module:'Preventive Care', term:'Bite Evaluation (Preventive Exam)', def:'An examination technique ensuring proper bite alignment to prevent wear or discomfort.'},
  {week:'week7', module:'Preventive Care', term:'Periodontal Probing (Preventive Exam)', def:'An examination technique measuring pocket depth around teeth to assess gum health.'},
  {week:'week7', module:'Preventive Care', term:'Saliva Flow Test', def:'An examination technique assessing saliva production to help prevent dry mouth-related issues.'},
  {week:'week7', module:'Preventive Care', term:'Oral Health Education', def:'Educating patients on the importance of daily brushing, flossing, and regular dental visits, and emphasizing the role of diet and lifestyle choices in oral health.'},
  {week:'week7', module:'Preventive Care', term:'Fluoride Application (Week 7 Steps)', def:'After cleaning the teeth, fluoride varnish or gel is applied to the tooth surfaces and left undisturbed for several minutes to allow absorption.'},
  {week:'week7', module:'Preventive Care', term:'Sealant Application Process (Week 7 Steps)', def:'Clean and dry the patient\'s teeth; apply an acid etching solution to prepare the enamel; rinse and dry, then apply the sealant material to the grooves of the molars; and light-cure (harden) the sealant using a curing light.'},
  {week:'week7', module:'Preventive Care', term:'UV Light (for Sealant Curing)', def:'A curing light used to harden the dental sealant after application; must be directed properly and used for the recommended time to ensure full polymerization.'},
  {week:'week7', module:'Preventive Care', term:'Toothbrush (Manual or Electric)', def:'The primary tool for daily brushing, ensuring the removal of plaque and bacteria as part of a patient\'s daily oral hygiene routine.'},
  {week:'week7', module:'Preventive Care', term:'Prophy Cup and Polisher', def:'A small rubber cup that holds polishing paste, applied by the dental professional to remove plaque, stains, and tartar buildup during dental cleanings.'},
  {week:'week7', module:'Orthodontics', term:'Orthodontics (Overview)', def:'A branch of dentistry focused on diagnosing, preventing, and correcting misaligned teeth and jaws. The primary goal is to ensure proper alignment, improving both function and aesthetics, enhancing bite function, and improving a patient\'s smile.'},
  {week:'week7', module:'Orthodontics', term:'Malocclusion (Orthodontic Context)', def:'The misalignment of teeth and jaws, which can lead to difficulties in chewing, speaking, and maintaining oral hygiene. Correcting malocclusion improves function, appearance, and confidence, and is a central concern in orthodontics.'},
  {week:'week7', module:'Orthodontics', term:'Braces', def:'A device used to move teeth into better alignment, consisting of brackets, wires, and bands that work together to gradually reposition teeth. Braces are the most common tool for treating malocclusion.'},
  {week:'week7', module:'Orthodontics', term:'Retention (Orthodontic Phase)', def:'The phase of orthodontic treatment that involves keeping teeth in their new position after braces are removed, often using retainers, ensuring teeth do not shift back to their original misalignment.'},
  {week:'week7', module:'Orthodontics', term:'Orthodontic Treatment Process', def:'Initial consultation evaluates dental/medical history and takes x-rays, photographs, and impressions to design a treatment plan; braces placement cleans and dries teeth, bonds brackets, and attaches the archwire; adjustment appointments every 4-6 weeks tighten or adjust the braces for gradual movement; retention fits a retainer once braces are removed; and follow-up care ensures the alignment remains stable.'},
  {week:'week7', module:'Orthodontics', term:'Brackets (Orthodontic)', def:'Small metal or ceramic pieces attached to each tooth that hold the archwire in place, used as anchors for shifting the teeth gradually.'},
  {week:'week7', module:'Orthodontics', term:'Archwire', def:'A thin metal wire that connects all the brackets and applies continuous pressure to move teeth into position; inserted into the brackets and adjusted regularly to maintain correct pressure.'},
  {week:'week7', module:'Orthodontics', term:'Elastic Ligatures', def:'Tiny rubber bands used to hold the archwire to the brackets; need to be replaced regularly to ensure the braces stay secure and effective.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Diagnostically Acceptable Image (Core Criteria)', def:'An image doesn\'t need to be perfect — it needs to reliably show the structures the exam was ordered to evaluate. Core quality criteria include correct density and contrast, sharp anatomical detail free of motion blur, no elongation or foreshortening, open/unoverlapped contacts, no cone cuts, and freedom from artifacts like fogging or scratches.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Common Radiographic Rejects & the Retake Decision', def:'Cone cut is a partial, unexposed area from beam-receptor misalignment — retake only if the missing area covers the region of interest. Elongation/foreshortening distorts tooth length from incorrect vertical angulation — retake if root length or apex position can\'t be judged. Overlap obscures contacts from incorrect horizontal angulation — retake if interproximal surfaces can\'t be evaluated for caries. Artifacts (static, fogging, scratches) warrant a retake only if they obscure the anatomy of interest. Before repeating an exposure, confirm the defect actually compromises the diagnosis, correct the underlying cause rather than just repeating the technique, and document the reason for every retake.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Anatomical (Labial) Mounting', def:'The process of mounting radiographic films correctly: orient every film so the raised (convex) dot faces the viewer; place maxillary films on top and mandibular films on the bottom; keep anterior periapicals centered with posterior films and bitewings extending outward; double-check orientation against crown morphology and root curvature, not the dot alone; and label the mount with patient name, date, and exposing operator before filing.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Legal & Recordkeeping Requirements (Radiographs)', def:'Radiographs are retained per state dental board requirements, with minors\' records typically kept well past the age of majority; the practice owns the physical/digital record while the patient owns the right to access it. Informed consent should be documented before exposure, with patient name, date, operator, and clinical justification recorded. Images must never be altered, deleted, or discarded without documenting why, and retakes and their reasons become part of the permanent record; only appropriately licensed personnel may operate the equipment.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Caries (Radiographic Appearance)', def:'Radiolucent areas on the enamel or dentin; interproximal caries typically appear as a triangular radiolucency below the contact point.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Apical Pathology (Radiographic Appearance)', def:'Radiolucency at the root apex suggesting periapical inflammation, abscess, granuloma, or cyst, often linked to loss of the lamina dura.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Dental Anomalies (Radiographic Appearance)', def:'Deviations from normal tooth number, size, or shape visible on a radiograph, such as supernumerary teeth, dilaceration, fusion, or gemination.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Dental Implants (Radiographic Appearance)', def:'Appear as uniformly radiopaque, screw-shaped structures with a distinct, well-defined outline, distinguishable from natural roots by shape and density.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Edentulous Arches (Radiographic Appearance)', def:'Absence of teeth with corresponding alveolar bone resorption visible on a radiograph; ridge height and density are assessed for prosthodontic planning.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Impacted Teeth & Foreign Object Localization', def:'Localization techniques such as the buccal object rule (SLOB rule — Same Lingual, Opposite Buccal) are used to determine the facial-lingual position of an unerupted tooth or foreign object on radiographs.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Periodontal Conditions (Radiographic Appearance)', def:'Horizontal or vertical bone loss, widened periodontal ligament space, and furcation involvement visible at the alveolar crest on a radiograph.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Sinus Areas (Radiographic Appearance)', def:'The maxillary sinus floor\'s proximity to posterior tooth roots visible on radiographs; sinus radiopacities may indicate mucositis, polyps, or root proximity concerns.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'TMJ (Radiographic Assessment)', def:'The condylar head and glenoid fossa relationship assessed on panoramic or transcranial images for degenerative changes or asymmetry.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Purpose of the Computer in Digital Radiography', def:'The monitor displays the acquired digital image immediately for chairside review of positioning and exposure quality. The keyboard enters patient identifiers, exposure parameters, and image annotations. The mouse navigates the imaging software and manipulates the displayed image (zoom, contrast, enhancement, measurement). The workstation is positioned within reach for real-time review but outside the direct splash zone of the treatment area.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Caring for Computer Equipment During Imaging', def:'Cover the keyboard, mouse, and other frequently touched surfaces with clear plastic barriers changed between every patient; if barriers aren\'t used, wipe surfaces with an EPA-registered intermediate-level disinfectant after each patient; remove contaminated gloves or have an uncontaminated team member type before touching an unbarriered keyboard; and check barriers for tears and cables/housings for damage during routine operatory setup and breakdown.'},
  {week:'week7', module:'Image Quality, Mounting & Legal', term:'Informed Consent & Patient Refusal (Radiography)', def:'The patient must be informed of the purpose, expected benefit, and risks of a radiographic procedure before it takes place, with consent obtained and documented in the chart beforehand. Patients have the right to decline radiographic exposure, and that decision must be respected without pressure — the refusal is recorded in the chart, the supervising dentist is notified, and the effect on diagnosis and treatment planning is discussed.'},
  {week:'week8', module:'Radiography', term:'Radiography (Week 8 Overview)', def:'The use of x-rays to view the internal structures of teeth, bones, and surrounding tissues — a diagnostic tool crucial for identifying problems that cannot be seen through visual examination alone, such as cavities, infections, bone loss, and structural abnormalities.'},
  {week:'week8', module:'Radiography', term:'Radiograph (Week 8 Key Concept)', def:'An image produced on a photographic film or digital sensor by x-rays, crucial in identifying hidden dental problems such as cavities, impacted teeth, or tumors before they become visible.'},
  {week:'week8', module:'Radiography', term:'X-Rays (Week 8 Key Concept)', def:'A form of electromagnetic radiation that penetrates through tissues and produces images, helping visualize tooth structures, bone health, and soft tissues for early diagnosis and treatment planning.'},
  {week:'week8', module:'Radiography', term:'Contrast (Week 8 Key Concept)', def:'The difference in density between tissues on a radiograph, helping to highlight specific areas; understanding contrast is key for interpreting images accurately and detecting abnormalities.'},
  {week:'week8', module:'Radiography', term:'Radiographic Procedure (Full Sequence)', def:'Preparation positions the patient and places a lead apron and thyroid collar for safety. Positioning places the sensor or film in the mouth per the procedure type. Exposure activates the x-ray machine with time adjusted for the imaged area. Processing develops the film or processes the digital image. Evaluation has the dentist or technician examine the image for issues. Aftercare may involve additional images or dietary instructions if contrast agents were used.'},
  {week:'week8', module:'Radiography', term:'X-ray Machine', def:'Generates and directs radiation toward the patient; used for both intraoral (inside the mouth) and extraoral (outside the mouth) imaging.'},
  {week:'week8', module:'Radiography', term:'Radiographic Film or Digital Sensor (Week 8)', def:'Captures the x-ray image; placed inside the patient\'s mouth for intraoral images or positioned outside the mouth for extraoral images.'},
  {week:'week8', module:'Radiography', term:'Lead Apron and Thyroid Collar (Week 8)', def:'Protective tools that minimize radiation exposure to the body, particularly the thyroid; should be stored properly and regularly inspected for wear or damage.'},
  {week:'week8', module:'Radiography', term:'Four Categories of Radiographic Error', def:'Technique/positioning errors are caused during exposure (incorrect angulation, poor receptor placement, incomplete coverage). Processing errors are caused after exposure, film or digital (chemical time/temperature/freshness errors, light leaks, scanning/storage errors). Equipment errors are caused by the machine or receptor itself (malfunctioning timer, damaged sensor/cable, collimation/PID misalignment). Patient-related errors are caused by the person being imaged (movement, failure to remove appliances/jewelry, inability to tolerate correct placement). Placing a defect in its category points directly to the fix.'},
  {week:'week8', module:'Radiography', term:'Elongation (Angulation Error)', def:'A radiographic error where vertical angulation is too flat (too little), distorting tooth length; corrected by increasing the vertical angulation until image length matches the true tooth.'},
  {week:'week8', module:'Radiography', term:'Foreshortening (Angulation Error)', def:'A radiographic error where vertical angulation is too steep (too much), distorting tooth proportions; corrected by decreasing the vertical angulation to restore true tooth proportions.'},
  {week:'week8', module:'Radiography', term:'Overlap (Week 8 Angulation Error)', def:'A radiographic error where horizontal angulation doesn\'t pass through the contacts; corrected by redirecting the central ray through the interproximal contacts rather than across them.'},
  {week:'week8', module:'Radiography', term:'Reversed Film Error', def:'Occurs when the receptor is placed with its back (lead-foil side) toward the beam instead of the active side, so the beam passes through the foil\'s pattern before reaching the emulsion or sensor. The fix is to always confirm the raised identification dot faces the beam before exposing and retake with correct orientation — the original is not salvageable.'},
  {week:'week8', module:'Radiography', term:'Incomplete Coverage (Placement Error)', def:'A radiographic error where the missing apex or incomplete arch coverage usually means the receptor was seated too shallow or too far forward; corrected by repositioning deeper and re-verifying placement before the next exposure.'},
  {week:'week8', module:'Radiography', term:'Underdevelopment (Processing Error)', def:'A light, low-contrast image caused by insufficient developing time/temperature or exhausted developer.'},
  {week:'week8', module:'Radiography', term:'Overdevelopment (Processing Error)', def:'A dark, excessively contrasty image caused by excessive developing time/temperature or developer that is too concentrated.'},
  {week:'week8', module:'Radiography', term:'Incomplete Fixation (Processing Error)', def:'A cloudy, brownish, or fading image over time, caused by insufficient fixing time or exhausted fixer.'},
  {week:'week8', module:'Radiography', term:'Static Electricity Artifact', def:'Black, branching lightning-shaped marks on film caused by rough handling or low humidity while unwrapping film.'},
  {week:'week8', module:'Radiography', term:'Fogging (Processing Error)', def:'An overall gray haze reducing contrast, caused by a light leak, expired film, or unsafe safelighting.'},
  {week:'week8', module:'Radiography', term:'Reticulation', def:'A cracked, textured emulsion surface caused by an abrupt temperature change between processing solutions.'},
  {week:'week8', module:'Radiography', term:'Banding / Line Artifacts (Digital Imaging Error)', def:'Repeating lines that distort or streak a digital image; corrected by checking the sensor cable connection and USB port and avoiding bending the cable during placement.'},
  {week:'week8', module:'Radiography', term:'Sensor Damage from Bending', def:'Rigid digital sensors can crack or fail if flexed to fit anatomy; the fix is to never force a rigid sensor into position and instead switch to a PSP plate for tight or curved anatomy.'},
  {week:'week8', module:'Radiography', term:'Oversaturation / Blooming (Digital Imaging Error)', def:'A digital image appearing washed out despite digital exposure latitude; corrected by reducing exposure settings, since digital receptors typically need less exposure than film.'},
  {week:'week8', module:'Radiography', term:'PSP Ghosting', def:'A faint prior image bleeding through a new exposure on a phosphor storage plate; prevented by always erasing PSP plates with light before storing and again immediately before reuse.'},
  {week:'week8', module:'Radiography', term:'Systematic Troubleshooting Approach (Radiographic Errors)', def:'Four questions asked in order solve nearly every image problem: identify what the defect actually looks like (light, dark, distorted, blank, patterned); isolate which category it points to (technique, processing, equipment, or patient); correct the specific cause rather than just the symptom; and verify & document, retaking only if the defect truly compromises the diagnosis and recording the reason for any retake.'},
  {week:'week8', module:'Radiography', term:'Filtration (Radiographic Protection)', def:'Aluminum discs placed in the beam path near the tube head that remove low-energy, non-useful radiation, reducing patient dose without reducing diagnostic image quality. The required aluminum equivalent increases with kVp.'},
  {week:'week8', module:'Radiography', term:'Shielding (Radiographic Protection)', def:'Lead apron and thyroid collar absorb scatter radiation reaching the patient, and the tube head housing itself is lead-lined to contain leakage radiation, protecting radiosensitive tissues like the thyroid and reproductive organs on every patient, every exposure.'},
  {week:'week8', module:'Radiography', term:'Collimation (Week 8 Detail)', def:'Restricts the beam size to match the image receptor, reducing the volume of tissue exposed to radiation; rectangular collimation exposes significantly less tissue than round collimation, directly reducing patient dose without affecting diagnostic quality.'},
  {week:'week8', module:'Radiography', term:'PID / Beam Alignment Device (Week 8 Detail)', def:'Guides and aligns the beam from the tube head to the receptor; longer PIDs reduce beam divergence for less scatter and less patient dose, while round PIDs create a wider beam than rectangular ones for the same field. PID length and shape is a direct protection factor, not just a positioning tool.'},
  {week:'week8', module:'Radiography', term:'Patient Size & Age (Exposure Adjustment)', def:'The same exposure settings don\'t belong on every patient. Pediatric patients have smaller anatomy and less tissue density, requiring lower mA/kVp/time than adults. Smaller-framed adults need exposure factors adjusted downward to avoid over-exposure. Larger or denser patients may require increased exposure settings to penetrate greater tissue density and still produce a diagnostically acceptable image.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Coronal Polishing', def:'A technique used to remove biofilm and extrinsic stains from the clinical crowns of teeth using a dental handpiece, a rubber cup, and an abrasive agent. It is not a substitute for an oral prophylaxis, which removes calculus and debris from all tooth surfaces and must be performed by a licensed dentist or hygienist.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Dental Sealants (Week 9)', def:'Thin protective coatings applied to pits and fissures of posterior teeth to prevent caries, providing an effective barrier against bacteria and food particles that lead to decay.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Indications for Coronal Polishing', def:'Coronal polishing is indicated before placement of sealants, before cementing crowns/bridges, before fluoride application, before orthodontic band cementation, before placing acid etching solution, and before placing a dental dam.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Contraindications for Coronal Polishing', def:'Coronal polishing should be avoided for patients without visible stains, high-risk caries patients (e.g., nursing bottle caries), patients with demineralized enamel, sensitive teeth, patients requiring antibiotic premedication, and newly erupted teeth with incomplete mineralization.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Damaging Effects of Coronal Polishing', def:'Excessive polishing can remove surface enamel; polishing exposed cementum can lead to sensitivity; and abrasive pastes can scratch restorations like gold and composite materials.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Extrinsic Stains', def:'Stains removable by polishing, including black line stains (thin black line near the gingival margin, more common in females), tobacco stains (dark brown/black from tobacco products), green stains (yellow-green deposits from poor oral hygiene or bacterial/fungal growth), and food and drink stains (light brownish, from coffee, tea, colas, berries, soy sauce).'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Intrinsic Stains', def:'Stains not removed by polishing, including pulpless teeth (gray/brown/black discoloration from pulpal breakdown), tetracycline staining (light green to dark yellow from antibiotic exposure in utero or infancy), dental fluorosis (white to brown mottled enamel from excess fluoride intake during development), and amalgam staining (gray or black discoloration from metallic ions penetrating dentin).'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Air-Powder Polishing', def:'A technique using a handpiece to spray sodium bicarbonate and water, efficient for stain removal without enamel contact.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Rubber-Cup Polishing', def:'A technique using a slow-speed handpiece to rotate a rubber cup with abrasive paste, commonly used for coronal polishing.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Bristle Brushes (Polishing)', def:'Polishing tools used for deep pits and fissures; not recommended on exposed cementum or soft tissues.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Polishing Cups', def:'Soft rubber cups used to clean and polish smooth tooth surfaces.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Prophy Angles', def:'Attachments that connect to slow-speed handpieces for coronal polishing.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Handpiece Grasp (Polishing)', def:'The polishing handpiece is held in a pen grasp for control and stability.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Abrasive Pastes (Polishing)', def:'Polishing pastes available in grits ranging from extra-coarse to fine.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Patient & Operator Positioning (Coronal Polishing)', def:'The patient\'s chair is parallel to the floor with a slight head tilt — chin-down for the mandibular arch, chin-up for the maxillary arch. The operator sits at the 8-9 o\'clock position if right-handed, or the 3-4 o\'clock position if left-handed.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Pit and Fissure Sealants', def:'Preventive coatings that prevent bacteria and food debris from accumulating in pits and fissures, providing long-term protection against caries. Indicated for deep pits and fissures and recently erupted molars (within 4 years); contraindicated for shallow pits and fissures, existing caries requiring restoration, or existing restorations on the tooth.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Sealant Placement Steps', def:'Clean the tooth surface with pumice and water, then rinse and dry; isolate with a rubber dam or cotton rolls; etch with phosphoric acid for 15-60 seconds, then rinse and dry until the enamel appears frosty white; apply a thin layer of sealant material avoiding overfilling or bubbles; light-cure for 20 seconds per surface ensuring complete polymerization; and evaluate for voids, retention, and occlusion, adjusting as necessary.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Self-Cured (Auto-Polymerizing) Sealants', def:'A two-part sealant system (base and catalyst) that hardens within 1 minute.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Light-Cured (Photo-Polymerizing) Sealants', def:'Sealant material that hardens under visible light exposure, preferred for greater control over working time.'},
  {week:'week9', module:'Coronal Polishing & Sealants', term:'Clear or Opaque Sealants', def:'Tinted sealant materials that allow easier visibility for maintenance and monitoring over time.'},
  {week:'week9', module:'The Job Search', term:'Job Search Preparation (Before You Begin)', def:'Determine personal and professional goals, consider financial needs (living expenses, transportation, relocation), and establish priorities for job characteristics such as work hours, office environment, job security and benefits, location/commute, and professional recognition or continuing education opportunities.'},
  {week:'week9', module:'The Job Search', term:'Career Opportunities for Dental Assistants', def:'Private practice (general or specialty dentistry), insurance companies (claims processing, customer service), sales representative roles (dental manufacturers/supply companies), public health & government programs, dental schools (assisting faculty and students), hospitals (medically compromised patients), and teaching (requires DANB certification and preferably a bachelor\'s degree).'},
  {week:'week9', module:'The Job Search', term:'Methods for Finding Job Openings', def:'Social media (employers research candidates via LinkedIn, Facebook, Twitter), newspaper ads, employment agencies, working interviews (working a day to evaluate office fit), professional organizations (dental societies, ADAA chapters), campus placement services, and sales representatives who often know when a dentist is hiring.'},
  {week:'week9', module:'The Job Search', term:'Telephone Contact (Job Application)', def:'When calling about a job, identify yourself and clearly state the reason for calling, be professional and confident, and be prepared to submit a resume and schedule an interview.'},
  {week:'week9', module:'The Job Search', term:'Cover Letter Guidelines', def:'A cover letter should be one page, typed, and professionally formatted; addressed to a specific person; clearly state job interest and request an interview; and include contact details and a closing thank-you.'},
  {week:'week9', module:'The Job Search', term:'Resume Essentials (Week 9)', def:'A resume heading includes full name, credentials, and contact information; a professional objective states job goals; education lists the most recent first including certifications; work experience lists positions, responsibilities, and dates; certifications include CPR, DANB, and ADAA membership; references are optional but available on request; and volunteer work/awards highlight additional qualifications.'},
  {week:'week9', module:'The Job Search', term:'Interview Preparation (Before)', def:'Review your resume, research the dental practice, prepare answers for common interview questions, dress professionally (avoid scrubs), and plan to arrive 15 minutes early.'},
  {week:'week9', module:'The Job Search', term:'Interview Conduct (During)', def:'Greet the interviewer with a firm handshake and eye contact, maintain positive body language and engage in conversation, be honest about experience and skills, and ask relevant questions about job responsibilities, office culture, and benefits.'},
  {week:'week9', module:'The Job Search', term:'Interview Follow-Up (After)', def:'Send a thank-you letter within 48 hours, expressing appreciation for the opportunity and reaffirming interest in the position.'},
  {week:'week9', module:'The Job Search', term:'Salary Negotiations & Benefits', def:'Know the typical salary range for dental assistants in your area, consider total compensation including health benefits/PTO/continuing education/retirement plans, and ask about performance reviews and salary increase opportunities.'},
  {week:'week9', module:'The Job Search', term:'Resignation Process', def:'Provide a two-week notice, maintain professionalism by not speaking negatively about the office, assist with training a replacement if requested, and leave on good terms for future job references.'},
  {week:'week9', module:'The Job Search', term:'Employer Termination (Professional Response)', def:'If terminated, handle the situation professionally, review severance pay and final paycheck policies, and seek feedback to improve in future roles.'},
  {week:'week9', module:'The Job Search', term:'Job Termination Ethical Considerations', def:'Maintain professionalism in all work environments, avoid burning bridges with former employers or colleagues, and network within the dental community for future opportunities.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'The Mounting Convention', def:'Every intraoral image has a small raised (convex) dot or identification marker embossed during exposure. Standard convention mounts films with the raised side of the dot facing the viewer — called "labial mounting." Mounted this way, the patient\'s right side appears on the viewer\'s left, the same as looking directly at the patient\'s face.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Radiopaque', def:'A structure that blocks the x-ray beam and appears white/light on the image; examples include enamel (the densest structure on the image), metal restorations (amalgam, crowns), and dental implants.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Radiolucent', def:'A structure that lets the x-ray beam pass through and appears dark/black on the image; examples include dentin and bone, the pulp chamber and root canal space, the periodontal ligament (PDL) space, dental caries, and air spaces such as the nasal fossa.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Anatomical Order of a Full Mouth Series (FMX)', def:'A mounted FMX follows the same sequence every time: maxillary right posterior (start at the patient\'s upper right, back teeth), maxillary anterior (move across the front of the upper arch), maxillary left posterior (finish the top row at the upper left), bitewings left to right (in their own row), mandibular right posterior (begin the bottom row at the lower right), and mandibular anterior through left posterior (complete the bottom row the same way as the top).'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Anterior / Posterior (Orientation)', def:'Anterior refers to teeth toward the front of the mouth (incisors, canines); posterior refers to teeth toward the back (premolars, molars).'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Mesial / Distal (Orientation, Week 9)', def:'Mesial means toward the midline of the arch; distal means away from the midline, toward the back.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Maxillary / Mandibular (Orientation)', def:'Maxillary refers to the upper arch; mandibular refers to the lower arch — radiographs are always mounted with maxillary on top.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Facial / Lingual (Orientation)', def:'Facial refers to the surface toward the cheek or lips; lingual refers to the surface toward the tongue — orientation used when describing surfaces on a mounted image.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Positioning & Anatomy (Image Acceptability)', def:'The first question an acceptable image must answer: the intended teeth and surrounding structures (including the apex when required) are fully visible; correct horizontal angulation means interproximal contacts are not overlapped; and the PID is aligned so the entire beam covers the receptor with no cone-cutting at the edges.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Density (Image Acceptability, Week 9)', def:'The overall darkness of the image, controlled mainly by mA and exposure time. Too little exposure makes the image too light to read; too much makes it too dark and structures are lost. Acceptable density shows a clear range of light and dark areas.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Contrast (Image Acceptability, Week 9)', def:'The difference between the lightest and darkest areas of an image, controlled mainly by kVp. High contrast shows fewer shades (mostly black and white, sharp but less detail); low contrast shows many shades of gray (more detail but can look flat). Acceptable contrast lets the viewer distinguish enamel, dentin, pulp, and bone clearly.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Distortion & Artifacts (Image Acceptability)', def:'Correct vertical angulation keeps teeth their true length — too little angulation elongates them, too much foreshortens them. The image should be free of fingerprints, static marks, scratches, or foreign objects, and the sensor or PSP plate must be free of bending, cracking, or damage, since damaged equipment produces a diagnostically unusable image regardless of technique.'},
  {week:'week9', module:'Radiographic Mounting & Image Quality', term:'Six-Question Diagnostic Acceptability Checklist', def:'Before accepting an image: Is the correct tooth/area fully captured, including the apex when required? Are the interproximal contacts open, not overlapped? Is the full image present with no cone-cutting? Is the density right — not too light or too dark? Is the contrast clear enough to distinguish enamel, dentin, and bone? Is the image free of elongation, foreshortening, and artifacts?'},
  {week:'week10', module:'Dental Assisting Resume', term:'Resume Format (Week 10)', def:'A dental assisting resume should be one page long, well-organized and easy to read, and professional in tone. Recommended sections are: contact information, professional summary (optional but recommended), skills section, work experience/externship experience, and education & certifications.'},
  {week:'week10', module:'Dental Assisting Resume', term:'Contact Information (Resume Section)', def:'Placed at the top of the resume; contact details must be clear and professional, avoiding unprofessional email addresses.'},
  {week:'week10', module:'Dental Assisting Resume', term:'Professional Summary (Resume Section)', def:'An optional but recommended 2-3 sentence statement highlighting experience, skills, and career goals; should be tailored to match the specific job description.'},
  {week:'week10', module:'Dental Assisting Resume', term:'Work / Externship Experience (Resume Section)', def:'If you have prior work experience, list your externship under "Experience"; if this is your first dental role, create a separate "Externships" or "Clinical Experience" section. Use bullet points starting with strong action verbs (e.g., "Assisted," "Prepared," "Educated"); if you have no prior jobs, include customer service experience to show communication skills.'},
  {week:'week10', module:'Dental Assisting Resume', term:'Education & Certifications (Resume Section)', def:'Includes the dental assisting program, certifications (such as CPR/BLS, Dental Radiology Certification, HIPAA & OSHA Training), and any additional courses. If your state requires an RDA or EFDA license/certification, list it here.'},
  {week:'week10', module:'Dental Assisting Resume', term:'Final Resume Checklist', def:'Add a non-filtered headshot; use a professional, clean format with no fancy colors; keep it to one page unless you have extensive experience; check for spelling and grammar mistakes; tailor it to the job description matching keywords from the posting; and save it as a PDF before sending to keep formatting intact. Consider creating a simple portfolio with photos of sterilization setups or impressions, copies of certifications, and a short professional introduction.'},
  {week:'week10', module:'Dental Assisting Resume', term:'Recommended Clinical Skills (Resume)', def:'Chairside assisting, sterilization & infection control, taking and developing x-rays (if certified), four-handed dentistry, instrument setup & breakdown, and impression taking & model pouring.'},
  {week:'week10', module:'Dental Assisting Resume', term:'Recommended Technical Skills (Resume)', def:'Dental software proficiency (Eaglesoft, Dentrix, Open Dental), charting & treatment planning, and digital x-rays & imaging.'},
  {week:'week10', module:'Dental Assisting Resume', term:'Recommended Soft Skills (Resume)', def:'Patient education & communication, time management & multitasking, team collaboration, and HIPAA & OSHA compliance.'},
  {week:'week10', module:'Dental Assisting Resume', term:'RDA (Registered Dental Assistant)', def:'A state-issued license some states require for dental assistants to perform certain expanded duties; should be listed on a resume if held.'},
  {week:'week10', module:'Dental Assisting Resume', term:'EFDA (Expanded Functions Dental Assistant)', def:'A certification some states require to perform expanded intraoral functions beyond standard dental assisting duties; should be listed on a resume if held.'},
  {week:'week10', module:'Job Process', term:'Where to Find Dental Assisting Jobs', def:'Job boards (Indeed, DentalPost, ZipRecruiter, Glassdoor), dental-specific websites (ADA Career Center, RDH Magazine Job Board), networking (dental assisting Facebook groups, LinkedIn, local dental associations), and externship opportunities — many externship sites hire their own externs.'},
  {week:'week10', module:'Job Process', term:'Tailoring Your Resume (Job Process)', def:'Customize your resume for each job application, highlighting relevant experience and skills that align with the specific job description.'},
  {week:'week10', module:'Job Process', term:'Clear Resume Formatting', def:'Choose a clean, professional layout using headings, bullet points, and consistent fonts to improve readability.'},
  {week:'week10', module:'Job Process', term:'Strong Resume Summary', def:'A compelling summary at the top of the resume that showcases professional background and key achievements.'},
  {week:'week10', module:'Job Process', term:'Highlighting Achievements vs. Duties', def:'Use quantifiable metrics to demonstrate impact (e.g., "Increased sales by 20% within six months") rather than just listing responsibilities.'},
  {week:'week10', module:'Job Process', term:'Including Relevant Skills (Resume)', def:'Focus on both hard and soft skills important for the position, including technical proficiencies, languages, or certifications.'},
  {week:'week10', module:'Job Process', term:'Keeping a Resume Concise', def:'Limit the resume to one page if possible, especially for entry to mid-level positions, using clear and concise language.'},
  {week:'week10', module:'Job Process', term:'Proofreading a Resume', def:'Always check for typos, grammatical errors, and formatting inconsistencies; consider having someone else review it too.'},
  {week:'week10', module:'Job Process', term:'Researching the Practice (Interview Prep)', def:'Familiarize yourself with the dental practice\'s services, mission, values, patient demographic, and any recent news before an interview.'},
  {week:'week10', module:'Job Process', term:'Preparing for Common Interview Questions', def:'Practice answers to typical questions such as "What motivated you to become a dental assistant?", "How do you handle difficult patients?", and "Describe your experience with dental software."'},
  {week:'week10', module:'Job Process', term:'Showcasing Skills in an Interview', def:'Highlight relevant skills such as infection control procedures, patient management, and radiography proficiency.'},
  {week:'week10', module:'Job Process', term:'Interpersonal Skills in an Interview', def:'Display the ability to communicate effectively and empathize with patients; be friendly and approachable throughout the interview.'},
  {week:'week10', module:'Job Process', term:'Asking Thoughtful Interview Questions', def:'Prepare questions for the interviewer, such as "What does a typical day look like for a dental assistant here?" and "What opportunities are there for professional development?"'},
  {week:'week10', module:'Job Process', term:'Interview Attire', def:'Choose clean, neat, professional clothing that aligns with the dental office environment.'},
  {week:'week10', module:'Job Process', term:'Thank-You Note (Post-Interview)', def:'Send a thank-you email after the interview expressing appreciation for the opportunity and reemphasizing enthusiasm for the position.'},
  {week:'week10', module:'Job Process', term:'Professional Online Presence', def:'Create a LinkedIn profile showcasing skills and externship experience, follow dental groups, connect with local dentists and assistants, and keep social media professional since employers check it.'},
  {week:'week10', module:'Job Process', term:'Certifications & Licensing to Know', def:'Radiology certification is required in some states for taking x-rays; CPR certification (BLS) is required by many offices; and state licensing requirements should be checked for an RDA or EFDA license.'},
  {week:'week10', module:'Job Process', term:'Negotiating Salary & Benefits', def:'Research average salaries for your state (using sites like Payscale or BLS), ask about benefits such as paid time off, health insurance, and CE opportunities, and if offered a lower salary, politely express your worth based on skills and experience.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Introduction to Dental Assisting', def:'Final review focus: overview of the dental assisting profession, roles and responsibilities of a dental assistant, and career opportunities in the field.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Anatomy and Physiology', def:'Final review focus: basic structure and function of the human body, and oral cavity structures and their importance in dentistry.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Dental Anatomy', def:'Final review focus: tooth morphology and numbering systems, types of dentition (primary, mixed, permanent), and occlusion and tooth surfaces.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Clinical Dentistry', def:'Final review focus: dental operatory setup, dental team positioning and patient care, and instrument transfer techniques.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: The Dental Examination', def:'Final review focus: components of a dental exam, radiographic and periodontal assessments, and charting and documentation.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Disease Transmission', def:'Final review focus: modes of disease transmission in a dental setting, common pathogens in dentistry, and the importance of infection control.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Infection Control and Hazardous Materials', def:'Final review focus: OSHA guidelines and CDC recommendations, PPE and hand hygiene protocols, and handling and disposal of hazardous materials.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Surface Disinfection and Treatment Room Prep', def:'Final review focus: disinfectant types and uses, surface barriers versus pre-cleaning and disinfection, and proper treatment room setup.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Instrument Processing', def:'Final review focus: steps of instrument sterilization, sterilization monitoring and validation, and proper storage and handling.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Moisture Control', def:'Final review focus: use of saliva ejectors and high-volume evacuators (HVE), and dental dams and cotton roll isolation.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Impression Materials and Laboratory Procedures', def:'Final review focus: types of impression materials, mixing and pouring techniques, and model trimming and finishing.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Pain and Anxiety Control', def:'Final review focus: local anesthesia and nitrous oxide sedation, pain management techniques, and patient anxiety reduction strategies.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Radiation Safety and Production of X-Rays', def:'Final review focus: principles of radiography, radiation protection for patients and operators, and x-ray machine components.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Oral Radiography', def:'Final review focus: types of intraoral radiographs, paralleling versus bisecting angle techniques, and common radiographic errors.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Instruments, Handpieces, and Accessories', def:'Final review focus: examination and restorative instruments, types of handpieces and their uses, and rotary and finishing burs.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Restorative and Esthetic Dental Materials', def:'Final review focus: amalgam and composite materials, dental cements and bonding agents, and veneers and whitening techniques.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Restorative Procedures', def:'Final review focus: cavity preparation steps, matrix systems and restorative material placement, and finishing and polishing restorations.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Professional and Legal Aspects of Dental Assisting', def:'Final review focus: scope of practice and state regulations, ethical responsibilities in dentistry, and HIPAA and patient confidentiality.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: The Dental Patient', def:'Final review focus: patient communication and management, and special needs patients and accommodations.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Medical Emergencies in the Dental Office', def:'Final review focus: common medical emergencies and responses, emergency preparedness and CPR training, and emergency drug kit essentials.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Periodontics', def:'Final review focus: gum disease classification and treatment, and scaling and root planing procedures.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Prosthodontics and Dental Implants', def:'Final review focus: types of prosthetic restorations, and implant placement and maintenance.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Oral and Maxillofacial Surgery', def:'Final review focus: common surgical procedures, and pre- and post-operative care.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Pediatric Dentistry', def:'Final review focus: child behavior management, and preventive treatments in pediatric patients.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Endodontics', def:'Final review focus: root canal therapy process, and endodontic instruments and materials.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Preventive Care', def:'Final review focus: oral hygiene instruction and patient education, and fluoride application and dietary counseling.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Orthodontics', def:'Final review focus: types of orthodontic appliances, and principles of tooth movement and alignment.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Radiography', def:'Final review focus: importance of diagnostic imaging in dentistry, and safety and interpretation of radiographs.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: Coronal Polishing and Dental Sealants', def:'Final review focus: coronal polishing techniques, and indications for dental sealants and application steps.'},
  {week:'week11', module:'Final Exam Study Guide', term:'Review: The Job Search', def:'Final review focus: resume writing and interview skills, and career paths in dental assisting.'},
];

const weekLabel = {foundations:"Pre Class", week1:"Week 1", week2:"Week 2", week3:"Week 3", week4:"Week 4", week5:"Week 5", week6:"Week 6", week7:"Week 7", week8:"Week 8", week9:"Week 9", week10:"Week 10", week11:"Week 11"};

const grid = document.getElementById('grid');
const searchInput = document.getElementById('searchInput');
const weekBtns = document.querySelectorAll('.seg button');
const moduleFiltersEl = document.getElementById('moduleFilters');
const countNum = document.getElementById('countNum');
const totalNum = document.getElementById('totalNum');

let activeWeek = 'all';
let activeModule = 'all';
let currentList = [];
let currentPage = 0;
const CARDS_PER_PAGE = 6;

const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const pageInfo = document.getElementById('pageInfo');
const pager = document.getElementById('pager');

function moduleChipsFor(week){
  if(week === 'all') return [];
  return [...new Set(TERMS.filter(t => t.week === week).map(t => t.module))];
}

function renderModuleChips(){
  moduleFiltersEl.innerHTML = '';
  const mods = moduleChipsFor(activeWeek);
  if(mods.length === 0) return;
  const allChip = document.createElement('button');
  allChip.className = 'chip' + (activeModule === 'all' ? ' active' : '');
  allChip.textContent = 'All Modules';
  allChip.addEventListener('click', () => { activeModule = 'all'; applyFilters(); });
  moduleFiltersEl.appendChild(allChip);
  mods.forEach(m => {
    const chip = document.createElement('button');
    chip.className = 'chip' + (activeModule === m ? ' active' : '');
    chip.textContent = m;
    chip.addEventListener('click', () => { activeModule = m; applyFilters(); });
    moduleFiltersEl.appendChild(chip);
  });
}

function renderPage(){
  grid.innerHTML = '';
  const totalPages = Math.max(1, Math.ceil(currentList.length / CARDS_PER_PAGE));
  if(currentPage >= totalPages) currentPage = totalPages - 1;
  if(currentPage < 0) currentPage = 0;

  const start = currentPage * CARDS_PER_PAGE;
  const pageItems = currentList.slice(start, start + CARDS_PER_PAGE);

  if(currentList.length === 0){
    const empty = document.createElement('div');
    empty.id = 'emptyState';
    empty.textContent = 'No terms match your search. Try a different word.';
    grid.appendChild(empty);
  }

  pageItems.forEach(item => {
    const card = document.createElement('div');
    card.className = `term-card wk-${item.week}`;
    card.innerHTML = `
      <div class="card-top">
        <span class="module-tag">${item.module}</span>
        <span class="week-pill wk-${item.week}">${weekLabel[item.week]}</span>
      </div>
      <div class="term-name">${item.term}</div>
      <div class="term-preview">${item.def}</div>
      <div class="read-more">Read full definition &rarr;</div>
    `;
    card.addEventListener('click', () => openModal(item));
    grid.appendChild(card);
  });

  countNum.textContent = currentList.length;
  pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages}`;
  prevBtn.disabled = currentPage === 0;
  nextBtn.disabled = currentPage >= totalPages - 1;
  pager.style.visibility = currentList.length <= CARDS_PER_PAGE ? 'hidden' : 'visible';
}

function applyFilters(){
  const q = searchInput.value.trim().toLowerCase();
  let list = TERMS.filter(t => activeWeek === 'all' || t.week === activeWeek);
  if(activeModule !== 'all'){
    list = list.filter(t => t.module === activeModule);
  }
  if(q){
    list = list.filter(t =>
      t.term.toLowerCase().includes(q) ||
      t.def.toLowerCase().includes(q) ||
      t.module.toLowerCase().includes(q)
    );
  }
  currentList = list;
  currentPage = 0;
  renderModuleChips();
  renderPage();
}

prevBtn.addEventListener('click', () => { currentPage--; renderPage(); });
nextBtn.addEventListener('click', () => { currentPage++; renderPage(); });

weekBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    weekBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeWeek = btn.dataset.week;
    activeModule = 'all';
    applyFilters();
  });
});

searchInput.addEventListener('input', applyFilters);

document.getElementById('resetBtn').addEventListener('click', () => {
  searchInput.value = '';
  activeWeek = 'all';
  activeModule = 'all';
  weekBtns.forEach(b => b.classList.remove('active'));
  document.querySelector('.seg button[data-week="all"]').classList.add('active');
  applyFilters();
});

// ---------- MODAL ----------
const modalOverlay = document.getElementById('modalOverlay');
const modalModule = document.getElementById('modalModule');
const modalWeekPill = document.getElementById('modalWeekPill');
const modalTerm = document.getElementById('modalTerm');
const modalDef = document.getElementById('modalDef');
const modalClose = document.getElementById('modalClose');

function openModal(item){
  modalModule.textContent = item.module;
  modalWeekPill.textContent = weekLabel[item.week];
  modalWeekPill.className = `wk-${item.week}`;
  modalTerm.textContent = item.term;
  modalDef.textContent = item.def;
  modalOverlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  modalOverlay.classList.remove('open');
  document.body.style.overflow = '';
}
modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => { if(e.target === modalOverlay) closeModal(); });
document.addEventListener('keydown', (e) => { if(e.key === 'Escape') closeModal(); });

totalNum.textContent = TERMS.length;
applyFilters();
</script>

</body>
</html>
