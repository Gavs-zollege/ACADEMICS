<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dental Assistant Program | Master Glossary</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cambria&display=swap');

  :root{
    --navy:#122240;
    --navy-deep:#0B1830;
    --blue:#1C6FB0;
    --blue-deep:#0C4E86;
    --teal:#0E7C86;
    --gold:#C9A227;
    --gold-light:#EAC968;
    --rust:#B23A2E;
    --slate:#5C7A99;
    --aqua:#12909F;
    --plum:#7B4B94;
    --amber:#C46A1F;
    --forest:#2E7D52;
    --crimson:#9E2A4C;
    --steel:#3E5C76;
    --olive:#6B7A2E;
    --paper:#EEF2F7;
    --ink:#1B2636;
    --ink-soft:#66748A;
    --line:#DEE6EF;
    --card:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{ margin:0; padding:0; height:100%; overflow:hidden; }
  body{
    font-family: Calibri, "Segoe UI", Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    display:flex;
    flex-direction:column;
    height:100vh;
  }

  /* ================= HEADER ================= */
  header{
    flex: 0 0 auto;
    background: var(--navy);
    color:#fff;
    padding: 18px 4vw;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .brand{ display:flex; align-items:center; gap:14px; }
  .brand-mark{
    width:40px; height:40px;
    border-radius:10px;
    background: rgba(255,255,255,0.1);
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .brand-mark svg{ width:20px; height:26px; }
  h1{
    font-family: Cambria, Georgia, serif;
    font-size: 21px;
    margin:0;
  }
  .brand p{
    margin:2px 0 0;
    font-size:12px;
    color:#b9c6da;
  }
  #totalCount{
    font-size:13px;
    color: var(--gold-light);
    font-weight:700;
    background: rgba(255,255,255,0.08);
    padding:6px 14px;
    border-radius:999px;
  }

  /* ================= TOOLBAR ================= */
  .toolbar{
    flex: 0 0 auto;
    background:#fff;
    border-bottom: 1px solid var(--line);
    padding: 12px 4vw;
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  .search-wrap{
    flex: 1 1 260px;
    max-width:340px;
    background: var(--paper);
    border-radius: 9px;
    padding: 9px 13px;
    display:flex;
    align-items:center;
    gap:8px;
    border: 1px solid var(--line);
  }
  #searchInput{
    border:none; outline:none;
    font-size:14px;
    font-family: Calibri, Arial, sans-serif;
    width:100%;
    background:transparent;
    color: var(--ink);
  }
  #searchInput::placeholder{ color:#9aa8ba; }

  .seg{
    display:flex;
    background: var(--paper);
    border-radius: 9px;
    padding:3px;
    gap:2px;
    flex-wrap:wrap;
  }
  .seg button{
    border:none;
    background:transparent;
    font-family: Calibri, Arial, sans-serif;
    font-weight:600;
    font-size:12.5px;
    color: var(--ink-soft);
    padding: 7px 13px;
    border-radius:7px;
    cursor:pointer;
    display:flex; align-items:center; gap:6px;
    white-space:nowrap;
    transition: all .12s ease;
  }
  .seg button:hover{ color: var(--navy); }
  .seg button.active{ background:#fff; color: var(--navy); box-shadow: 0 1px 3px rgba(18,34,64,0.15); }
  .seg .dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }
  .seg button[data-week="all"] .dot{ background: var(--navy); }
  .seg button[data-week="foundations"] .dot{ background: var(--teal); }
  .seg button[data-week="week1"] .dot{ background: var(--blue); }
  .seg button[data-week="week2"] .dot{ background: var(--gold); }
  .seg button[data-week="week3"] .dot{ background: var(--rust); }
  .seg button[data-week="week4"] .dot{ background: var(--slate); }
  .seg button[data-week="week5"] .dot{ background: var(--aqua); }
  .seg button[data-week="week6"] .dot{ background: var(--plum); }
  .seg button[data-week="week7"] .dot{ background: var(--amber); }
  .seg button[data-week="week8"] .dot{ background: var(--forest); }
  .seg button[data-week="week9"] .dot{ background: var(--crimson); }
  .seg button[data-week="week10"] .dot{ background: var(--steel); }
  .seg button[data-week="week11"] .dot{ background: var(--olive); }

  #resetBtn{
    margin-left:auto;
    font-size:12.5px;
    font-weight:600;
    color: var(--blue-deep);
    cursor:pointer;
    white-space:nowrap;
  }
  #resetBtn:hover{ text-decoration:underline; }

  /* Module chips row */
  .chiprow{
    flex: 0 0 auto;
    background:#fff;
    padding: 0 4vw 12px;
    display:flex;
    gap:7px;
    flex-wrap:wrap;
    border-bottom: 1px solid var(--line);
  }
  .chiprow:empty{ display:none; padding:0; border:none; }
  .chip{
    font-size:12px;
    font-weight:600;
    color: var(--ink-soft);
    background: var(--paper);
    border: 1px solid var(--line);
    padding:6px 13px;
    border-radius:999px;
    cursor:pointer;
    transition: all .12s ease;
  }
  .chip:hover{ border-color: var(--blue); color: var(--blue); }
  .chip.active{ background: var(--navy); color:#fff; border-color: var(--navy); }

  #countLabel{
    flex: 0 0 auto;
    padding: 10px 4vw 4px;
    font-size:13px;
    color: var(--ink-soft);
  }
  #countLabel b{ color: var(--blue-deep); }

  /* ================= SCROLLABLE LIST ================= */
  main{
    flex: 1 1 auto;
    padding: 6px 4vw 8px;
    display:flex;
    flex-direction:column;
    min-height:0;
  }
  .deck-surface{
    flex:1 1 auto;
    max-width:1280px;
    width:100%;
    margin:0 auto;
    min-height:0;
    display:flex;
  }
  #grid{
    flex:1 1 auto;
    width:100%;
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap:12px;
    min-height:0;
  }

  .term-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 5px solid var(--teal);
    border-radius: 4px 10px 10px 4px;
    padding: 14px 16px;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:0;
    overflow-y:auto;
  }
  .term-card::-webkit-scrollbar{ width:4px; }
  .term-card::-webkit-scrollbar-thumb{ background:#d7e1eb; border-radius:3px; }
  .term-card:hover{
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(18,34,64,0.12);
  }
  .term-card.wk-foundations{ border-left-color: var(--teal); }
  .term-card.wk-week1{ border-left-color: var(--blue); }
  .term-card.wk-week2{ border-left-color: var(--gold); }
  .term-card.wk-week3{ border-left-color: var(--rust); }
  .term-card.wk-week4{ border-left-color: var(--slate); }
  .term-card.wk-week5{ border-left-color: var(--aqua); }
  .term-card.wk-week6{ border-left-color: var(--plum); }
  .term-card.wk-week7{ border-left-color: var(--amber); }
  .term-card.wk-week8{ border-left-color: var(--forest); }
  .term-card.wk-week9{ border-left-color: var(--crimson); }
  .term-card.wk-week10{ border-left-color: var(--steel); }
  .term-card.wk-week11{ border-left-color: var(--olive); }

  .card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
  }
  .module-tag{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.3px;
    text-transform:uppercase;
    color: var(--ink-soft);
  }
  .week-pill{
    flex-shrink:0;
    font-size:9.5px;
    font-weight:800;
    letter-spacing:0.3px;
    padding:2px 8px;
    border-radius:999px;
    color:#fff;
  }
  .week-pill.wk-foundations{ background: var(--teal); }
  .week-pill.wk-week1{ background: var(--blue); }
  .week-pill.wk-week2{ background: var(--gold); color:var(--navy); }
  .week-pill.wk-week3{ background: var(--rust); }
  .week-pill.wk-week4{ background: var(--slate); }
  .week-pill.wk-week5{ background: var(--aqua); }
  .week-pill.wk-week6{ background: var(--plum); }
  .week-pill.wk-week7{ background: var(--amber); }
  .week-pill.wk-week8{ background: var(--forest); }
  .week-pill.wk-week9{ background: var(--crimson); }
  .week-pill.wk-week10{ background: var(--steel); }
  .week-pill.wk-week11{ background: var(--olive); }

  .term-name{
    font-family: Cambria, Georgia, serif;
    font-size: 17px;
    color: var(--navy);
    line-height:1.25;
    flex-shrink:0;
  }
  .term-preview{
    font-size:12.5px;
    color: var(--ink-soft);
    line-height:1.4;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
    flex:1 1 auto;
  }
  .read-more{
    font-size:11.5px;
    font-weight:700;
    color: var(--blue-deep);
    flex-shrink:0;
  }

  #emptyState{
    grid-column: 1 / -1;
    text-align:center;
    color: var(--ink-soft);
    font-style:italic;
    padding: 60px 20px;
    font-size:15px;
  }

  .pager{
    flex: 0 0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    padding-top:10px;
  }
  .pager button{
    background: var(--navy);
    color:#fff;
    border:none;
    border-radius: 9px;
    width:38px; height:38px;
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .15s;
  }
  .pager button:hover:not(:disabled){ background: var(--blue); }
  .pager button:disabled{ background:#cfd8e3; cursor:default; }
  .pager .pageInfo{
    font-size:14px;
    color: var(--ink-soft);
    font-weight:700;
    min-width:90px;
    text-align:center;
  }

  /* ================= MODAL ================= */
  #modalOverlay{
    display:none;
    position:fixed;
    inset:0;
    background: rgba(11,24,48,0.55);
    z-index:100;
    align-items:center;
    justify-content:center;
    padding: 4vh 4vw;
  }
  #modalOverlay.open{ display:flex; }
  #modalBox{
    background:#fff;
    border-radius: 16px;
    max-width: 640px;
    width:100%;
    max-height: 88vh;
    overflow-y:auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    animation: modalIn .18s ease;
  }
  @keyframes modalIn{
    from{ opacity:0; transform: translateY(12px) scale(0.98); }
    to{ opacity:1; transform: translateY(0) scale(1); }
  }
  #modalHead{
    background: linear-gradient(120deg, var(--navy-deep) 0%, var(--blue-deep) 100%);
    color:#fff;
    padding: 26px 30px 22px;
    position:relative;
    border-radius: 16px 16px 0 0;
  }
  #modalClose{
    position:absolute;
    top:16px; right:16px;
    width:32px; height:32px;
    border-radius:50%;
    background: rgba(255,255,255,0.15);
    border:none;
    color:#fff;
    font-size:18px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition: background .12s;
  }
  #modalClose:hover{ background: rgba(255,255,255,0.28); }
  #modalMeta{
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  #modalModule{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.4px;
    text-transform:uppercase;
    color:#b9c6da;
  }
  #modalWeekPill{
    font-size:10px;
    font-weight:800;
    letter-spacing:0.3px;
    padding:3px 10px;
    border-radius:999px;
    color:#fff;
  }
  #modalWeekPill.wk-foundations{ background: var(--teal); }
  #modalWeekPill.wk-week1{ background: var(--blue); }
  #modalWeekPill.wk-week2{ background: var(--gold); color:var(--navy); }
  #modalWeekPill.wk-week3{ background: var(--rust); }
  #modalWeekPill.wk-week4{ background: var(--slate); }
  #modalWeekPill.wk-week5{ background: var(--aqua); }
  #modalWeekPill.wk-week6{ background: var(--plum); }
  #modalWeekPill.wk-week7{ background: var(--amber); }
  #modalWeekPill.wk-week8{ background: var(--forest); }
  #modalWeekPill.wk-week9{ background: var(--crimson); }
  #modalWeekPill.wk-week10{ background: var(--steel); }
  #modalWeekPill.wk-week11{ background: var(--olive); }
  #modalTerm{
    font-family: Cambria, Georgia, serif;
    font-size: 30px;
    line-height:1.2;
    margin:0;
    padding-right: 30px;
  }
  #modalBody{
    padding: 26px 30px 32px;
  }
  #modalDef{
    font-size: 17px;
    line-height:1.6;
    color: var(--ink);
    margin:0;
  }

  @media (max-width: 820px){
    #grid{ grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(3, 1fr); }
  }
  @media (max-width: 560px){
    #grid{ grid-template-columns: 1fr; grid-template-rows: repeat(6, 1fr); }
    #modalTerm{ font-size:24px; }
    #modalDef{ font-size:15.5px; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 32" fill="#EAC968" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 1C7 1 3.5 4 3 8.5C2.6 12 3.6 15 4.3 18.5C5 22 5.6 27 7.3 30C8.1 31.4 9.4 31 9.8 29.3C10.3 27 10.2 22.8 12 22.8C13.8 22.8 13.7 27 14.2 29.3C14.6 31 15.9 31.4 16.7 30C18.4 27 19 22 19.7 18.5C20.4 15 21.4 12 21 8.5C20.5 4 17 1 12 1Z"/>
      </svg>
    </div>
    <div>
      <h1>Dental Assistant Program — Master Glossary</h1>
      <p>Pre Class &middot; Weeks 1&ndash;11 &mdash; tap any term to read the full definition</p>
    </div>
  </div>
  <span id="totalCount">745 terms</span>
</header>

<div class="toolbar">
  <div class="search-wrap">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1C6FB0" stroke-width="2.6"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="searchInput" type="text" placeholder="Search terms or definitions&hellip;">
  </div>
  <div class="seg" id="weekFilters">
    <button class="active" data-week="all"><span class="dot"></span>All Weeks</button>
    <button data-week="foundations"><span class="dot"></span>Pre Class</button>
    <button data-week="week1"><span class="dot"></span>Week 1</button>
    <button data-week="week2"><span class="dot"></span>Week 2</button>
    <button data-week="week3"><span class="dot"></span>Week 3</button>
    <button data-week="week4"><span class="dot"></span>Week 4</button>
    <button data-week="week5"><span class="dot"></span>Week 5</button>
    <button data-week="week6"><span class="dot"></span>Week 6</button>
    <button data-week="week7"><span class="dot"></span>Week 7</button>
    <button data-week="week8"><span class="dot"></span>Week 8</button>
    <button data-week="week9"><span class="dot"></span>Week 9</button>
    <button data-week="week10"><span class="dot"></span>Week 10</button>
    <button data-week="week11"><span class="dot"></span>Week 11</button>
  </div>
  <span id="resetBtn">Reset</span>
</div>

<div class="chiprow" id="moduleFilters"></div>

<span id="countLabel">Showing <b id="countNum">0</b> of <b id="totalNum">0</b> terms</span>

<main>
  <div class="deck-surface">
    <div id="grid"></div>
  </div>
  <div class="pager" id="pager">
    <button id="prevBtn" aria-label="Previous page">&#8249;</button>
    <span class="pageInfo" id="pageInfo">Page 1 of 1</span>
    <button id="nextBtn" aria-label="Next page">&#8250;</button>
  </div>
</main>

<div id="modalOverlay">
  <div id="modalBox">
    <div id="modalHead">
      <button id="modalClose" aria-label="Close">&times;</button>
      <div id="modalMeta">
        <span id="modalModule"></span>
        <span id="modalWeekPill"></span>
      </div>
      <h2 id="modalTerm"></h2>
    </div>
    <div id="modalBody">
      <p id="modalDef"></p>
    </div>
  </div>
</div>

<script>
const TERMS = [
  {week:'foundations', module:'Intro to Dental Assisting', term:'Evolution of Dentistry', def:'Dentistry has been essential to human health for centuries. In the 18th and 19th centuries the first dental schools were established and the dental chair and drill were invented, revolutionizing practice. In the 20th century, fluoride was introduced and significantly reduced cavities. Today, modern dentistry relies on digital imaging and CAD/CAM technologies for greater precision and efficiency.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'History of Dental Assisting', def:'In the early 1900s, dental assisting duties were filled informally by office secretaries or family members. In the 1920s-30s, Dr. Alfred C. Fones trained the first dental hygienist, Irene Newman, and the American Dental Assistants Association (ADAA) was established in 1924. During the 1940s (WWII), reliance on dental assistants increased due to dentist shortages. In the 1950s-60s, formal training programs emerged, and from 1970 to the present, certification (such as DANB) became widely recognized and the assistant\'s role expanded into both clinical and administrative tasks.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Dr. Alfred C. Fones & Irene Newman', def:'Dr. Alfred C. Fones trained Irene Newman as the first dental hygienist in the 1920s-30s, a foundational moment in the professionalization of dental auxiliary roles.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'ADAA', def:'American Dental Assistants Association, established in 1924; the professional organization representing dental assistants and supporting their training, credentialing, and career advancement.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'DANB', def:'Dental Assisting National Board; the certifying body whose exams (CDA, COA, NELDA) establish national credentialing standards for dental assistants and became widely recognized starting in the 1970s.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'CDA', def:'Certified Dental Assistant; a DANB credential that enhances professional credibility and leads to higher earning potential and career advancement.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'COA', def:'Certified Orthodontic Assistant; a DANB credential focused specifically on orthodontic assisting duties.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'NELDA', def:'National Entry Level Dental Assistant; a DANB credential for assistants entering the field, part of the broader DANB certification pathway.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Certification Pathways', def:'Routes to earning DANB certification, including graduation from an accredited dental assisting program, or qualifying work experience combined with prior certifications.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Dentist (Role)', def:'The clinical team member who diagnoses and treats oral diseases and oversees the dental team\'s overall patient care.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Dental Hygienist (Role)', def:'A clinical team member who focuses on preventive care such as cleanings, fluoride treatments, and sealants, and educates patients about oral hygiene.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Dental Assistant (Role)', def:'A clinical team member who assists the dentist during procedures and manages infection control, patient comfort, and laboratory tasks.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Lab Technician (Role)', def:'A member of the dental healthcare team who creates dental prosthetics such as crowns, bridges, and dentures.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Receptionist (Role)', def:'An administrative team member who manages patient appointments and inquiries.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Office Manager (Role)', def:'An administrative team member who ensures the smooth day-to-day operations of the dental practice.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Treatment Coordinator (Role)', def:'An administrative team member who assists with scheduling and patient education regarding treatment plans.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Expanded Functions', def:'Delegated intraoral tasks that vary by state law and may be performed by trained dental assistants, including placing sealants, taking impressions, fabricating temporary crowns, and applying fluoride treatments.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Infection Control', def:'Protocols including sterilizing instruments, disinfecting surfaces, and proper disposal of biohazard materials, guided by adherence to OSHA and CDC guidelines.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'PPE', def:'Personal Protective Equipment, including gloves, masks, and eyewear, used to prevent cross-contamination between patients and staff.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Radiography in Dentistry (DA Role)', def:'The dental assistant\'s role in taking dental x-rays and ensuring safety measures for radiation exposure; accurate imaging aids in diagnosis and treatment planning.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Autonomy', def:'An ethical principle requiring dental professionals to respect a patient\'s decisions about their own care, for example respecting a patient\'s refusal for x-rays while informing them of the risks.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Beneficence', def:'An ethical principle requiring dental professionals to act in the patient\'s best interest.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Non-Maleficence', def:'An ethical principle requiring dental professionals to avoid causing harm to the patient.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Justice (Ethical Principle)', def:'An ethical principle requiring fair and unbiased treatment of all patients.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Confidentiality', def:'An ethical principle requiring dental professionals to protect a patient\'s personal and health information.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'HIPAA', def:'Health Insurance Portability and Accountability Act; federal law that protects patient privacy and health information.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'OSHA', def:'Occupational Safety and Health Administration; the federal agency that ensures safe workplace practices and infection control in the dental office.'},
  {week:'foundations', module:'Intro to Dental Assisting', term:'Informed Consent', def:'The legal and ethical requirement that patients understand the risks and benefits of a treatment before it is performed.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Anatomy', def:'The study of the body\'s structure — the location and organization of body parts.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Physiology', def:'The study of how the body functions.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Mesial', def:'A directional term describing the surface or direction closest to the midline of the dental arch.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Distal', def:'A directional term describing the surface or direction farthest from the midline of the dental arch.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Midsagittal Plane', def:'An imaginary body plane that divides the body into equal right and left halves.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Frontal Plane', def:'An imaginary body plane that divides the body into front and back portions.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Cells', def:'The basic building blocks of the body; there are approximately 75 trillion cells in an adult human.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Cell Membrane', def:'The structure that controls the entry and exit of substances into and out of a cell.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Cytoplasm', def:'The gel-like substance inside a cell that holds the organelles.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Nucleus (Cell)', def:'The command center of the cell, containing genetic material (DNA and RNA).'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Stem Cells', def:'Cells with the potential to regenerate dental tissues, relevant to treating conditions such as periodontal disease.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Epithelial Tissue', def:'Tissue that covers surfaces of the body, such as the oral lining.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Connective Tissue', def:'Tissue that supports the teeth and gums.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Muscle Tissue', def:'Tissue that assists in chewing and speaking.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Nerve Tissue', def:'Tissue that enables sensation in the mouth.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Skeletal System', def:'Body system that provides structure and protection, and supports dental procedures such as implants.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Muscular System', def:'Body system that facilitates jaw movement for chewing and speaking.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Cardiovascular System', def:'Body system that supplies oxygen and nutrients essential for healing; requires special consideration for patients with heart conditions.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Lymphatic/Immune System', def:'Body system that defends against oral infections.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Preimplantation', def:'The embryonic stage from fertilization through the first week of development.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Embryonic Period', def:'Weeks 2 to 8 of development; the critical period for facial and oral development.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Fetal Period', def:'The developmental stage from week 9 until birth, involving growth and maturation.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Ectoderm / Mesoderm / Endoderm', def:'The three primary embryonic germ layers from which the facial bones, muscles, and oral structures develop.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Odontogenesis', def:'The overall process of tooth development, progressing through initiation, bud, cap, bell, and maturation stages.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Initiation Stage (Odontogenesis)', def:'The first stage of tooth development, marked by the formation of the dental lamina.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Dental Lamina', def:'The band of tissue that forms during the initiation stage of tooth development.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Bud Stage (Odontogenesis)', def:'The stage of tooth development in which tooth buds form.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Cap Stage (Odontogenesis)', def:'The stage of tooth development in which the enamel organ differentiates.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Bell Stage (Odontogenesis)', def:'The stage of tooth development in which cells differentiate into specific types.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Maturation Stage (Odontogenesis)', def:'The final stage of tooth development, involving mineralization of the dental tissues.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Cranium Bones', def:'The 8 bones that protect the brain, including the frontal and occipital bones.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Facial Bones', def:'The 14 bones that form the oral cavity and facial structure, including the maxilla and mandible.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'TMJ', def:'Temporomandibular Joint; the joint responsible for jaw movement during chewing and speaking.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'TMD', def:'Temporomandibular Disorders; conditions of the TMJ caused by stress, arthritis, or a misaligned bite.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Vestibule', def:'The space between the lips/cheeks and the teeth.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Oral Cavity Proper', def:'The area of the mouth inside the dental arches.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Gingiva', def:'The gums; includes attached gingiva and interdental gingiva, which provide support around the teeth.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Occlusion', def:'The ideal alignment and contact between the upper and lower teeth during biting and chewing.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Malocclusion', def:'Misalignment of the teeth, classified as Class I (normal alignment with minor issues), Class II (overbite), or Class III (underbite).'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Periodontal Ligaments', def:'Connective tissue fibers that anchor the teeth to the alveolar bone.'},
  {week:'foundations', module:'Anatomy & Physiology', term:'Alveolar Bone', def:'The bone that supports the teeth within the jaw.'},
  {week:'foundations', module:'Dental Anatomy', term:'Anatomic Crown', def:'The portion of a tooth covered with enamel; it remains constant in size throughout life.'},
  {week:'foundations', module:'Dental Anatomy', term:'Clinical Crown', def:'The visible portion of a tooth above the gumline; it changes in size as gingiva recedes.'},
  {week:'foundations', module:'Dental Anatomy', term:'Root (Tooth)', def:'The portion of the tooth embedded in the alveolar bone and covered with cementum; may be single, bifurcated (two roots), or trifurcated (three roots).'},
  {week:'foundations', module:'Dental Anatomy', term:'Cervix (CEJ)', def:'The narrow area where the crown and root meet, also known as the cementoenamel junction.'},
  {week:'foundations', module:'Dental Anatomy', term:'Enamel', def:'The hardest material in the body; composed of enamel prisms (calcified rods) and protects the underlying dentin.'},
  {week:'foundations', module:'Dental Anatomy', term:'Dentin', def:'The tissue that makes up most of the tooth structure; contains dentinal tubules that transmit pain stimuli to the pulp.'},
  {week:'foundations', module:'Dental Anatomy', term:'Dentinal Tubules', def:'Microscopic channels within dentin that transmit pain stimuli to the pulp.'},
  {week:'foundations', module:'Dental Anatomy', term:'Pulp', def:'The soft tissue inside the tooth containing blood vessels and nerves, divided into coronal pulp (in the crown) and radicular pulp (in the root).'},
  {week:'foundations', module:'Dental Anatomy', term:'Cementum', def:'The tissue that covers the root of the tooth, joins the enamel at the CEJ, protects the root, and anchors periodontal fibers.'},
  {week:'foundations', module:'Dental Anatomy', term:'Periodontium', def:'The supporting structures of the teeth, including cementum, alveolar bone, and the periodontal ligament; provides support and protection and absorbs forces during chewing.'},
  {week:'foundations', module:'Dental Anatomy', term:'PDL (Periodontal Ligament)', def:'The connective tissue that anchors the teeth to the alveolar bone.'},
  {week:'foundations', module:'Dental Anatomy', term:'Maxillary Arch', def:'The upper, fixed dental arch.'},
  {week:'foundations', module:'Dental Anatomy', term:'Mandibular Arch', def:'The lower, movable dental arch.'},
  {week:'foundations', module:'Dental Anatomy', term:'Quadrants', def:'The four sections of the dentition, divided by maxillary/mandibular and left/right.'},
  {week:'foundations', module:'Dental Anatomy', term:'Sextants', def:'The six sections of the dentition, such as anterior and posterior segments.'},
  {week:'foundations', module:'Dental Anatomy', term:'Facial Surface', def:'The tooth surface closest to the face — labial for anterior teeth (near the lips) and buccal for posterior teeth (near the cheeks).'},
  {week:'foundations', module:'Dental Anatomy', term:'Lingual Surface', def:'The tooth surface closest to the tongue.'},
  {week:'foundations', module:'Dental Anatomy', term:'Masticatory Surface', def:'The biting surface of a tooth — incisal for anterior teeth and occlusal for posterior teeth.'},
  {week:'foundations', module:'Dental Anatomy', term:'Primary (Deciduous) Dentition', def:'The set of 20 baby teeth that erupt by age 2, including central/lateral incisors, canines, and molars.'},
  {week:'foundations', module:'Dental Anatomy', term:'Mixed Dentition', def:'The period from ages 6-12 when primary and permanent teeth are both present in the mouth.'},
  {week:'foundations', module:'Dental Anatomy', term:'Permanent Dentition', def:'The full set of 32 adult teeth that erupt after age 12, including incisors, canines, premolars, and molars.'},
  {week:'foundations', module:'Dental Anatomy', term:'Universal National System', def:'A tooth numbering system where permanent teeth are numbered 1-32 and primary teeth are labeled A-T.'},
  {week:'foundations', module:'Dental Anatomy', term:'FDI System', def:'An international two-digit tooth numbering system combining quadrant number and tooth number (e.g., 11 = maxillary right central incisor).'},
  {week:'foundations', module:'Dental Anatomy', term:'Palmer Notation', def:'A tooth numbering system that uses brackets to represent quadrants with numbers or letters representing individual teeth.'},
  {week:'foundations', module:'Dental Anatomy', term:'Contours', def:'The facial and lingual curves of a tooth that direct food away from the gingiva and help protect it.'},
  {week:'foundations', module:'Dental Anatomy', term:'Contacts', def:'The points where adjacent teeth touch, preventing food from becoming impacted between them.'},
  {week:'foundations', module:'Dental Anatomy', term:'Embrasures', def:'The triangular spaces between adjacent teeth.'},
  {week:'foundations', module:'Dental Anatomy', term:'Incisors', def:'Teeth with sharp, thin edges located at the front of the arch, used for cutting food.'},
  {week:'foundations', module:'Dental Anatomy', term:'Canines', def:'Teeth with pointed cusps and long roots, used for tearing food.'},
  {week:'foundations', module:'Dental Anatomy', term:'Premolars', def:'Teeth with a broader surface and cusps, used for grasping, tearing, and chewing food.'},
  {week:'foundations', module:'Dental Anatomy', term:'Molars', def:'Teeth with large crowns and multiple cusps, used for grinding food.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Dental Operatory', def:'The central clinical area where patients receive treatment, typically containing multiple treatment areas for dentists and hygienists.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Dental Chair', def:'An adjustable chair positioned for patient comfort and positioning during treatment.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Operator\'s Stool', def:'An ergonomically designed stool that supports the dentist\'s mobility and posture during procedures.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Assistant\'s Stool', def:'A stool that provides stability and mobility for the dental assistant, typically equipped with a foot bar.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Operating Light', def:'The overhead light used to illuminate the oral cavity during treatment.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Air-Water Syringe', def:'A handpiece used to rinse and dry the oral cavity during procedures.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Oral Evacuation System', def:'Suction equipment that removes debris, saliva, and fluids from the oral cavity.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Curing Light', def:'A light used to polymerize (harden) resins and composite materials.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Amalgamator', def:'A device that triturates (mixes) dental materials such as amalgam.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Rheostat', def:'A foot-controlled device used to operate dental handpieces.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Dental Unit', def:'The equipment housing that holds handpieces, the air-water syringe, and evacuation systems.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Admitting and Seating the Patient', def:'The process of greeting patients warmly by name, introducing yourself, establishing eye contact, placing personal belongings in a safe visible location, initiating relaxed conversation, and explaining procedures and answering questions before positioning the patient in the chair.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Upright Position', def:'Patient chair position used for entry, dismissal, radiographs, or impressions.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Supine Position', def:'Patient chair position used for most dental procedures.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Subsupine Position', def:'Patient chair position with the head lower than the feet, used in medical emergencies.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Positioning the Dental Team', def:'The dentist (operator) sits with a straight back, feet flat, elbows close to the body, and the patient\'s oral cavity at elbow height. The dental assistant sits 4-5 inches higher than the dentist, with a straight back, feet on the platform, and the body facing the patient\'s head.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Ergonomics', def:'Proper posture and positioning practices that prevent injuries such as carpal tunnel syndrome, neck/back pain, and cumulative trauma disorders among dental team members.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Static Zone', def:'An operating zone located behind the patient, generally reserved for equipment — 12:00 to 2:00 for a right-handed dentist, or 10:00 to 12:00 for a left-handed dentist.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Operator\'s Zone', def:'The clock-position seating area for the dentist — 7:00 to 12:00 for a right-handed dentist, or 12:00 to 5:00 for a left-handed dentist.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Assistant\'s Zone', def:'The clock-position seating area for the dental assistant — 2:00 to 4:00 for a right-handed dentist, or 8:00 to 10:00 for a left-handed dentist.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Transfer Zone', def:'The clock-position area over the patient\'s chest used for instrument transfers — 4:00 to 7:00 for a right-handed dentist, or 5:00 to 8:00 for a left-handed dentist.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Instrument Transfer Basic Principles', def:'Instrument transfers should use minimum motion of the fingers, wrist, and elbow; instruments are transferred in the position of use with the working end directed appropriately; and the assistant must ensure the dentist has a firm grasp before releasing the instrument.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Single-Handed Transfer', def:'An instrument transfer technique where the assistant retrieves an instrument using the thumb, index, and middle fingers, uses the last two fingers to retrieve used instruments, and places the new instrument firmly in the dentist\'s grasp.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Two-Handed Transfer', def:'An instrument transfer technique where the right hand retrieves the used instrument while the left hand delivers the new one.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Expanded Functions for Dental Assistants (Clinical Skills)', def:'Delegated intraoral tasks that vary by state law, such as placing sealants or amalgam, fabricating temporary crowns, applying fluoride or liners, and placing matrix bands and wedges. Performing them well requires dental anatomy knowledge, proper operator positioning, mirror use for indirect vision, a stable fulcrum, and an understanding of cavity preparations and material application.'},
  {week:'foundations', module:'Clinical Dentistry', term:'Fulcrum', def:'A stable finger rest used to steady the hand and instrument during a procedure, especially important in expanded functions.'},
  {week:'week1', module:'Dental Examination', term:'Dental Examination', def:'A thorough assessment allowing the dentist to diagnose oral conditions and develop a treatment plan; covers soft tissue, periodontal tissue, teeth, and facial structures and neck.'},
  {week:'week1', module:'Dental Examination', term:'Soft Tissue Assessment', def:'Examination of the oral mucosa and surrounding soft tissues as part of a comprehensive dental exam.'},
  {week:'week1', module:'Dental Examination', term:'Periodontal Tissue Assessment', def:'Examination of the gums and supporting structures around the teeth during a dental exam.'},
  {week:'week1', module:'Dental Examination', term:'Assistant\'s Role (Exam)', def:'Preparing the setup, assisting with data collection, and recording information as dictated by the dentist during the examination.'},
  {week:'week1', module:'Dental Examination', term:'Charting Symbols', def:'Standardized symbols and color coding used to record findings and conditions on a patient\'s dental chart.'},
  {week:'week1', module:'Dental Examination', term:'G.V. Black\'s Cavity Classification', def:'A system developed by G.V. Black that classifies cavities by location and surface involvement, still used to describe restorations today.'},
  {week:'week1', module:'Dental Examination', term:'Treatment Plan Levels', def:'The tiered approach to treatment planning, distinguishing different levels of urgency and priority for patient care.'},
  {week:'week1', module:'Disease Transmission', term:'Nutritional Influences on Oral Health', def:'The effect of diet, particularly sugar and acid exposure, on the development of dental caries and erosion.'},
  {week:'week1', module:'Disease Transmission', term:'Dental Caries', def:'Tooth decay caused by acid-producing bacteria breaking down enamel and dentin over time.'},
  {week:'week1', module:'Disease Transmission', term:'Caries Progression', def:'The staged advancement of tooth decay from the enamel surface through dentin and toward the pulp if left untreated.'},
  {week:'week1', module:'Disease Transmission', term:'Fluoride', def:'A mineral that strengthens enamel and helps prevent cavities; used both topically and systemically in dental care.'},
  {week:'week1', module:'Disease Transmission', term:'Modes of Disease Transmission', def:'The common pathways — direct contact, indirect contact, airborne, and parenteral — through which disease spreads in a dental setting.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Direct Contact Transmission', def:'Pathogen spread through contact with saliva, blood, or other body fluids.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Indirect Contact Transmission', def:'Pathogen spread through contaminated surfaces or instruments.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Airborne Transmission', def:'Pathogen spread through aerosols and droplets generated during dental procedures.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Parenteral Transmission', def:'Pathogen spread through needlestick injuries or cuts that introduce infectious material into the body.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Bacteria', def:'Microorganisms classified by shape — cocci (spherical), bacilli (rod-shaped), spirilla (spiral) — and by their Gram stain reaction.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Gram-Positive Bacteria', def:'Bacteria with thick cell walls that retain violet stain during Gram staining.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Gram-Negative Bacteria', def:'Bacteria with thin cell walls that do not retain violet stain during Gram staining.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Viruses', def:'Microorganisms smaller than bacteria that require a host cell to replicate; examples include HIV, Herpes Simplex Virus, and Influenza.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Fungi', def:'Microorganisms that can cause oral infections; Candida albicans is a common cause of oral thrush.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Prions', def:'Infectious proteins that cause diseases such as Creutzfeldt-Jakob Disease (CJD).'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Hand Hygiene', def:'The process of washing or disinfecting hands to prevent the spread of pathogens; a foundational infection control practice.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'High-Level Disinfectant', def:'A disinfectant capable of destroying all microorganisms except high numbers of bacterial spores; used on semi-critical items.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Low-Level Disinfectant', def:'A disinfectant that destroys most bacteria and some viruses/fungi but not spores or resistant organisms; used on non-critical surfaces.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'OPIM', def:'Other Potentially Infectious Material — body fluids other than blood that may carry pathogens, such as saliva in dental procedures.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Biohazardous Waste', def:'Legally regulated waste including sharps, blood- or OPIM-saturated items, and extracted teeth, which cannot be disposed of in regular trash.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Sharps', def:'Needles, scalpel blades, orthodontic wires, or any item that can puncture skin, regardless of visible blood; must be disposed of in a sharps container.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Sharps Container', def:'A rigid, puncture-resistant, closable container labeled with the biohazard symbol, used to dispose of sharps; must be replaced before it becomes full.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Biohazard Bag', def:'A leak-proof, red or orange bag prominently marked with the universal biohazard symbol, used for non-sharp regulated waste.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Holding Solution', def:'A solution used to hold contaminated instruments when immediate cleaning isn\'t possible; its container must carry biohazard and chemical hazard warning labels.'},
  {week:'week1', module:'Infection Control & Hazmat', term:'The Disposal Chain', def:'The five-step regulated waste process: generate (waste produced chairside), contain (placed in the correct labeled container), store (held securely on-site), haul away (picked up by a licensed medical waste hauler), and document (manifests and pickup records retained as proof of compliant disposal).'},
  {week:'week1', module:'Infection Control & Hazmat', term:'Rule 64B5-25, F.A.C.', def:'The Florida Administrative Code rule governing infection control, including biohazardous waste disposal and shipping requirements for dental lab cases.'},
  {week:'week1', module:'Surface Disinfection', term:'Surface Barriers', def:'Protective coverings placed over equipment and surfaces to prevent contamination, removed and replaced between patients.'},
  {week:'week1', module:'Surface Disinfection', term:'Plastic Covers', def:'Custom-fitted surface barriers used for equipment such as handpieces and chair controls.'},
  {week:'week1', module:'Surface Disinfection', term:'Sticky Tape (Barrier)', def:'A surface barrier used for smooth surfaces such as touch pads and switches.'},
  {week:'week1', module:'Surface Disinfection', term:'Aluminum Foil (Barrier)', def:'A surface barrier that molds to various shapes, effective for protecting irregular surfaces.'},
  {week:'week1', module:'Surface Disinfection', term:'Tube Socks (Barrier)', def:'A surface barrier used to cover hoses and other difficult-to-clean areas.'},
  {week:'week1', module:'Surface Disinfection', term:'Precleaning', def:'The first step of surface treatment, physically removing debris before disinfectant is applied.'},
  {week:'week1', module:'Surface Disinfection', term:'Ideal Disinfectant Characteristics', def:'Properties a disinfectant should have, including broad-spectrum effectiveness, fast action, safety for the surface being treated, and material compatibility.'},
  {week:'week1', module:'Instrument Processing', term:'Sterilization Center', def:'A centrally located, dedicated area for instrument processing, divided into contaminated, cleaning, sterilization, and storage areas to prevent cross-contamination.'},
  {week:'week1', module:'Instrument Processing', term:'Contaminated Area', def:'The zone of the sterilization center where used instruments are received and sorted.'},
  {week:'week1', module:'Instrument Processing', term:'Cleaning Area', def:'The zone of the sterilization center where instruments are pre-cleaned and decontaminated.'},
  {week:'week1', module:'Instrument Processing', term:'Sterilization Area', def:'The zone of the sterilization center where instruments are packaged and sterilized.'},
  {week:'week1', module:'Instrument Processing', term:'Storage Area', def:'The zone of the sterilization center where sterile instruments are kept until use.'},
  {week:'week1', module:'Instrument Processing', term:'Hand Scrubbing', def:'The least preferred instrument cleaning method due to a high risk of injury from sharp instruments.'},
  {week:'week1', module:'Instrument Processing', term:'Ultrasonic Cleaning', def:'A preferred instrument cleaning method that uses sound waves to remove debris without direct handling.'},
  {week:'week1', module:'Instrument Processing', term:'Instrument Washers', def:'Thermal disinfectors that provide automated cleaning of dental instruments.'},
  {week:'week1', module:'Instrument Processing', term:'Sterilization Pouches', def:'Packaging material used to protect instruments from contamination after sterilization.'},
  {week:'week1', module:'Instrument Processing', term:'Peel Pouches', def:'Paper and plastic packaging that peels open for aseptic instrument delivery after sterilization.'},
  {week:'week1', module:'Instrument Processing', term:'Instrument Cassettes', def:'Perforated containers that hold and organize instruments through cleaning, sterilization, and storage.'},
  {week:'week1', module:'Instrument Processing', term:'Biological Monitoring', def:'A verification method using spore tests to confirm that a sterilizer is effectively killing microorganisms.'},
  {week:'week1', module:'Instrument Processing', term:'Aseptic Technique', def:'Practices used to prevent contamination when delivering or handling sterile instruments.'},
  {week:'week1', module:'Instrument Processing', term:'Post-Sterilization Storage & Delivery', def:'Sterile instruments must be kept in a clean, dry storage area; packages should be inspected for damage before opening; and aseptic technique must be used when delivering instruments to the treatment area.'},
  {week:'week1', module:'Instrument Processing', term:'Seal-and-Label Rule', def:'Florida Rule 64B5-25 requirement that any disinfected impression, model, or appliance leaving for an outside lab be sealed in an impervious (leak-proof) container and labeled "Treat as Infectious Material," regardless of whether contamination is visible. This applies to crown and bridge impressions, bite registrations, full and partial dentures, and any removable appliance such as night guards, retainers, or orthodontic appliances.'},
  {week:'week1', module:'Moisture Control', term:'Limited-Area Rinse', def:'A rinsing technique used throughout a procedure to quickly clear debris during short pauses.'},
  {week:'week1', module:'Moisture Control', term:'Complete Mouth Rinse', def:'A rinsing technique performed at the end of a procedure, leaving the patient with a clean, refreshed feeling.'},
  {week:'week1', module:'Moisture Control', term:'HVE', def:'High-Volume Evacuator; suction equipment used to remove large amounts of fluid and debris during procedures.'},
  {week:'week1', module:'Moisture Control', term:'Saliva Ejector', def:'A low-volume suction device used to remove saliva and small amounts of fluid from the mouth.'},
  {week:'week1', module:'Moisture Control', term:'Cotton Rolls', def:'An easy-to-use isolation method for short procedures; does not fully prevent saliva contamination and requires frequent replacement.'},
  {week:'week1', module:'Moisture Control', term:'Dry Angles', def:'Absorbent triangle pads placed over the Stensen duct to block saliva flow from the parotid gland.'},
  {week:'week1', module:'Moisture Control', term:'Dental Dam', def:'A thin latex or non-latex barrier used for complete isolation; protects the airway, prevents cross-contamination, and improves visibility for the dentist. Keeps the area dry for bonding and restorative procedures and protects soft tissues from chemicals and debris.'},
  {week:'week1', module:'Impressions & Lab', term:'Preliminary Impressions', def:'Impressions used for diagnostic models, custom trays, provisional coverage, dental appliances, and pre/post-treatment records.'},
  {week:'week1', module:'Impressions & Lab', term:'Final Impressions', def:'Highly detailed impressions used for cast restorations such as inlays, onlays, veneers, crowns, and bridges.'},
  {week:'week1', module:'Impressions & Lab', term:'Occlusal (Bite) Registration', def:'An impression that records the occlusal relationship between the maxillary and mandibular teeth when the patient bites.'},
  {week:'week1', module:'Impressions & Lab', term:'Perforated Tray', def:'A preformed metal or plastic impression tray with holes for mechanical retention, used for preliminary impressions.'},
  {week:'week1', module:'Impressions & Lab', term:'Plastic Smooth Tray', def:'An impression tray that requires adhesive for material retention, used for final impressions.'},
  {week:'week1', module:'Impressions & Lab', term:'Gauze Tray', def:'A thin, mesh-like impression tray used for bite registration.'},
  {week:'week1', module:'Impressions & Lab', term:'Triple Tray', def:'An impression tray that captures both the final impression and bite registration simultaneously.'},
  {week:'week1', module:'Impressions & Lab', term:'Custom Tray', def:'An impression tray made from acrylic or thermoplastic resin, used for final impressions.'},
  {week:'week1', module:'Impressions & Lab', term:'Water-Coolant Tray', def:'An impression tray used with reversible hydrocolloid materials for final impressions.'},
  {week:'week1', module:'Impressions & Lab', term:'Inelastic Impression Material', def:'Rigid, fracture-prone material such as impression plaster or zinc oxide-eugenol paste.'},
  {week:'week1', module:'Impressions & Lab', term:'Elastic Impression Material', def:'Deformable material that returns to its original shape, such as alginate, elastomers, or agar.'},
  {week:'week1', module:'Impressions & Lab', term:'Irreversible Impression Material', def:'Material that sets through a chemical reaction and cannot return to its original state, such as alginate, elastomers, or ZOE paste.'},
  {week:'week1', module:'Impressions & Lab', term:'Reversible Impression Material', def:'Material that can return to its original state through temperature changes, such as agar or impression compounds.'},
  {week:'week1', module:'Impressions & Lab', term:'Alginate', def:'An irreversible hydrocolloid derived from seaweed, used for preliminary impressions. Available in normal set (2 min working time, 4.5 min setting) and fast set (1 min working time, 1-2 min setting). Requires immediate pouring, within one hour, to prevent imbibition (water absorption) or syneresis (water loss).'},
  {week:'week1', module:'Impressions & Lab', term:'Imbibition', def:'Water absorption in an alginate impression that causes distortion if pouring is delayed.'},
  {week:'week1', module:'Impressions & Lab', term:'Syneresis', def:'Water loss in an alginate impression that causes shrinkage if pouring is delayed.'},
  {week:'week1', module:'Impressions & Lab', term:'Polysulfide', def:'An elastomeric final impression material with a long setting time, strong odor, and good elasticity.'},
  {week:'week1', module:'Impressions & Lab', term:'Polyether', def:'An elastomeric final impression material with a short setting time, stiff consistency, and excellent dimensional stability.'},
  {week:'week1', module:'Impressions & Lab', term:'Condensation Silicone', def:'An elastomeric final impression material with moderate dimensional stability that requires mixing.'},
  {week:'week1', module:'Impressions & Lab', term:'Addition Silicone (VPS)', def:'Vinyl polysiloxane; an elastomeric final impression material with the best dimensional stability, commonly used in practice.'},
  {week:'week1', module:'Impressions & Lab', term:'Alginate Mixing Procedure', def:'Measure the correct water-to-powder ratio, sift powder into water and mix with a spatula, stir until a smooth creamy consistency is achieved, load the tray and seat it in the patient\'s mouth, then remove the impression once set and rinse under water.'},
  {week:'week1', module:'Impressions & Lab', term:'Final Impression Technique', def:'Light-bodied material is placed around the prepared tooth, heavy-bodied material is placed in the tray and seated over the light-body, and once set the impression is removed and inspected for accuracy.'},
  {week:'week1', module:'Impressions & Lab', term:'Diagnostic Cast', def:'A model made from an impression using model plaster or dental stone, used for diagnosis and treatment planning.'},
  {week:'week1', module:'Impressions & Lab', term:'Model Plaster', def:'A weaker gypsum material used for diagnostic casts, mixed at a 45-50 ml water to 100 g powder ratio.'},
  {week:'week1', module:'Impressions & Lab', term:'Dental Stone', def:'A stronger gypsum material used for diagnostic casts, mixed at a 30-32 ml water to 100 g powder ratio.'},
  {week:'week1', module:'Impressions & Lab', term:'High-Strength Stone', def:'The strongest common gypsum product used for casts, mixed at a 19-24 ml water to 100 g powder ratio.'},
  {week:'week1', module:'Impressions & Lab', term:'Mixing Dental Plaster', def:'Add water first, then add powder in increments; stir gently to avoid air bubbles; use a vibrator to remove trapped air; then pour into the impression and allow it to set.'},
  {week:'week1', module:'Impressions & Lab', term:'Double-Pour Method', def:'A pouring technique for diagnostic casts where the base is poured separately from the anatomic portion.'},
  {week:'week1', module:'Impressions & Lab', term:'Box-and-Pour Method', def:'A pouring technique for diagnostic casts where wax walls contain the poured material.'},
  {week:'week1', module:'Impressions & Lab', term:'Inverted-Pour Method', def:'A one-step pouring technique that forms both the impression and base of a diagnostic cast simultaneously.'},
  {week:'week1', module:'Impressions & Lab', term:'Anatomic Portion (Cast)', def:'The part of a diagnostic cast containing the teeth and oral mucosa, comprising about two-thirds of the model.'},
  {week:'week1', module:'Impressions & Lab', term:'Art Portion / Base (Cast)', def:'The base portion of a diagnostic cast, comprising about one-third of the model, trimmed for proper anatomical proportion.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Pain and Anxiety Control (Overview)', def:'Many individuals avoid dental care due to fear of pain. The dental profession uses chemical, physiological, and psychological methods before, during, and after procedures to manage pain and anxiety so patients receive necessary treatment comfortably.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Topical Anesthesia', def:'Anesthetic applied directly to the mucosa before a local anesthetic injection; available as ointments, liquids, sprays, and patches to reduce discomfort from injections and minor procedures.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'General Anesthesia', def:'An anesthesia method that induces unconsciousness, used for extensive procedures or special needs patients and requiring a trained anesthesiologist.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Local Anesthesia', def:'The most common pain control method in dentistry; blocks nerve impulses at the injection site using amide or ester chemical groups.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Amides', def:'A chemical group of local anesthetics including Lidocaine, Mepivacaine, Articaine, and Prilocaine.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Esters', def:'A chemical group of local anesthetics used less commonly today due to a higher risk of allergic reactions.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Induction (Anesthesia)', def:'The time between the anesthetic injection and the onset of the numbing effect.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Anesthesia Duration', def:'The length of numbing effect from a local anesthetic — short-acting (~30 min), intermediate-acting (~60 min, most commonly used), or long-acting (~90 min).'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Vasoconstrictors', def:'Agents such as epinephrine, levonordefrin, and neo-cobefrin added to local anesthetics to prolong numbness and reduce bleeding; must be used cautiously in patients with hypertension, cardiovascular disease, hyperthyroidism, or pregnancy.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Sedation Methods (Overview)', def:'Used for patients with severe anxiety or lengthy procedures, including nitrous oxide sedation, oral anti-anxiety medication, and intravenous sedation.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Nitrous Oxide (N2O) Sedation', def:'An inhaled gas mixed with oxygen and administered via nasal mask that induces relaxation with rapid onset and recovery; contraindicated in pregnancy, respiratory conditions, or emotional instability. Baseline oxygen flow starts at 100%, nitrous oxide is gradually introduced, and oxygen is administered for 5 minutes post-procedure to prevent diffusion hypoxia.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Oral Sedation', def:'Anti-anxiety drugs such as Diazepam (Valium), Lorazepam (Ativan), or Triazolam (Halcion), taken 30-60 minutes before treatment to manage patient anxiety.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'IV Sedation', def:'Sedation administered directly into the bloodstream, used for complex or surgical dental procedures.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Infiltration Anesthesia', def:'A local anesthetic technique injected near the tooth apex, typically used for maxillary procedures.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'PDL Injection', def:'Periodontal Ligament injection; anesthetic injected under pressure into the PDL for localized numbing.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Block Anesthesia', def:'A local anesthetic technique that targets major nerve trunks to numb larger areas, such as a mandibular block.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Buccal Nerve Block', def:'A nerve block that numbs soft tissues near the mandibular molars.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Incisive Nerve Block', def:'A nerve block that numbs the anterior mandibular teeth.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Anesthetic Syringe Components', def:'The parts of a dental anesthetic syringe: thumb ring, finger grip, barrel, piston rod, harpoon, and needle hub.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Needle Length', def:'Dental anesthetic needles come in short (1 inch), used for infiltration, and long (1.5 inches), used for block anesthesia.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Needle Gauge', def:'A measure of needle thickness; a lower gauge number indicates a thicker needle (common gauges: 25, 27, 30).'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Procedure for Loading a Syringe', def:'Select the anesthetic solution and needle size based on the procedure, load the cartridge with the stopper end first, attach the needle securely, and confirm proper aspiration before injection.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Diffusion Hypoxia', def:'A risk following nitrous oxide sedation, prevented by administering 100% oxygen for 5 minutes after the procedure.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Non-Opioid Analgesics', def:'Mild pain relief medications such as acetaminophen and ibuprofen.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Opioid Analgesics', def:'Medications for severe pain relief, such as codeine, oxycodone, and morphine.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Anti-Anxiety Drugs', def:'Medications such as Diazepam (Valium) and Lorazepam (Ativan) used for anxiety management before dental procedures.'},
  {week:'week2', module:'Pain & Anxiety Control', term:'Anesthesia Documentation', def:'Required records including pre/postoperative vital signs, type and amount of anesthetic used, procedure duration, and patient response and recovery notes.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Benefits of Dental Radiographs', def:'Radiographs detect early-stage dental decay, identify bone loss, locate abnormalities in soft and hard tissues, assess growth and development, document a patient\'s condition over time, and aid in procedures such as detecting broken root tips during extractions.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'X-Rays (Definition)', def:'Weightless bundles of energy (photons) traveling at the speed of light; they have no mass or charge and cannot be focused, but they can penetrate matter.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Atomic Structure', def:'Atoms consist of protons (positive), electrons (negative), and neutrons (neutral); understanding this structure is essential to understanding how x-rays interact with tissue.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Ionization', def:'The process by which x-rays eject electrons from atoms, potentially causing tissue damage.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Primary Radiation', def:'The original x-ray beam emitted directly from the x-ray machine.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Secondary Radiation', def:'Radiation produced when the primary x-ray beam interacts with tissue.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Scatter Radiation', def:'Deflected secondary radiation that spreads in different directions from the point of interaction.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Leakage Radiation', def:'Unintended radiation escaping from faulty x-ray equipment.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Tubehead', def:'The component of an x-ray machine that houses the x-ray tube and lead shielding.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Cathode', def:'The negatively charged component of an x-ray tube that emits electrons via a tungsten filament.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Anode', def:'The positively charged component of an x-ray tube that converts electrons into x-ray photons.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Collimator', def:'A component that restricts the x-ray beam size to reduce patient radiation exposure.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'PID', def:'Position Indicator Device; directs the x-ray beam toward the receptor.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Control Panel (X-Ray)', def:'The component that allows adjustment of exposure settings, including milliamperage (mA), kilovoltage peak (kVp), and timer.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Roentgen / Rad / Rem', def:'Traditional radiation measurement units for exposure (Roentgen), absorbed dose (Rad), and dose equivalence (Rem), corresponding to SI units Coulomb/kg, Gray, and Sievert respectively.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Maximum Permissible Dose (MPD)', def:'The legal radiation exposure limit — 0.05 Sv (5 rem) per year for occupational exposure, and 0.005 Sv (0.5 rem) per year for the general public and pregnant workers.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Patient Radiation Protection Measures', def:'Includes use of lead aprons and thyroid collars, fast-speed film or digital sensors to reduce exposure, proper collimation to minimize scattered radiation, and proper film exposure techniques to avoid retakes.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Operator Radiation Protection Measures', def:'Operators should maintain a 6-foot distance from the x-ray unit during exposure, stand behind a lead barrier or at a 90-135 degree angle from the beam, wear a dosimeter badge to monitor exposure, and inspect x-ray equipment regularly for leakage radiation.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'ALARA Principle', def:'"As Low As Reasonably Achievable" — the principle of minimizing patient and operator radiation exposure using all available protective measures.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Dosimeter Badge', def:'A device worn by dental radiography operators to monitor cumulative radiation exposure.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Radiation Safety Legal Considerations', def:'Dental assistants must follow state and federal radiation safety laws, and documentation of radiographs is required for patient records, including exposure date and justification.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Contrast (Image Quality)', def:'Determined by kVp settings; high kVp produces low contrast (many grays), while low kVp produces high contrast (sharp blacks and whites).'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Density (Image Quality)', def:'Determined by mA and exposure time; more mA produces a darker image, less mA produces a lighter image.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Sharpness (Image Quality)', def:'Determined by focal spot size and movement; a small focal spot produces a sharper image, while movement causes blur.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Digital Imaging Advantages', def:'Digital imaging uses 70-80% less radiation exposure than film, offers immediate image processing, allows enhanced image manipulation for better diagnosis, and eliminates the need for chemical processing.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Traditional Film Disadvantages', def:'Traditional film requires higher radiation doses, needs chemical processing, and carries a risk of image retakes due to exposure errors.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Critical Items (Radiography)', def:'Items that penetrate soft tissue or bone; rare in routine radiography, but must be heat-sterilized if contaminated this way (e.g., a sensor edge that punctures tissue).'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Semicritical Items (Radiography)', def:'Items that contact mucous membranes without penetrating tissue, such as reusable film/sensor holders and RINN components; require heat sterilization or high-level disinfection if heat-sensitive.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Noncritical Items (Radiography)', def:'Items that contact only intact skin, such as the x-ray tube head, control panel, or lead apron; require intermediate-level disinfection between patients.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Sensor Sleeve', def:'A disposable plastic sleeve or barrier envelope placed over a digital sensor before every exposure and every patient.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'PSP Plate Barrier', def:'A barrier envelope for phosphor storage plates; the envelope is opened and discarded before scanning to avoid contaminating the scanner.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'RINN & Holder Covers', def:'Reusable positioning devices that are barriered when possible, and otherwise treated as semicritical items requiring sterilization between patients.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Single-Use Film Packets', def:'Traditional film packets that are inherently single-use and disposed of after the outer barrier is removed in a clean area.'},
  {week:'week2', module:'Radiation Safety & X-Rays', term:'Reprocessing Equipment Between Patients', def:'A six-step workflow: (1) remove barriers while still gloved, (2) sort items by category as semicritical or noncritical, (3) clean semicritical items to remove visible debris before sterilizing, (4) sterilize semicritical items such as reusable holders and RINN components, (5) disinfect noncritical surfaces like the tube head, control panel, and headrest with an EPA-registered intermediate-level disinfectant, and (6) re-barrier the sensor, control panel, and PID before seating the next patient.'},
  {week:'week2', module:'Oral Radiography', term:'Periapical Radiograph', def:'An intraoral radiograph showing the entire tooth, including root and surrounding bone; used to detect abscesses, unerupted teeth, and periodontal conditions.'},
  {week:'week2', module:'Oral Radiography', term:'Bite-Wing Radiograph', def:'An intraoral radiograph capturing the crowns of upper and lower teeth in one image; used to detect interproximal caries, recurrent decay, and crestal bone loss.'},
  {week:'week2', module:'Oral Radiography', term:'Occlusal Radiograph', def:'A large intraoral radiograph placed in the occlusal plane and held by biting down, providing a wide arch view for impacted or supernumerary teeth, sialoliths, midline or palatal cysts, maxilla/palate fractures, cleft palate evaluation, buccal-lingual tooth position, mandibular width, and body/symphysis fractures.'},
  {week:'week2', module:'Oral Radiography', term:'Panoramic Radiograph', def:'An extraoral radiograph capturing the entire maxilla and mandible in one rotating sweep, used for full-mouth screening.'},
  {week:'week2', module:'Oral Radiography', term:'Cephalometric Radiograph', def:'An extraoral skull radiograph taken in a cephalostat at a standardized distance, reproducible over time for growth tracking. The lateral view assesses skeletal Class I/II/III diagnosis, facial growth pattern, incisor inclination, and treatment planning; the PA view assesses facial asymmetry, transverse skeletal discrepancies, and surgical planning. Traced landmarks include Sella, Nasion, Orbitale, Porion, A point, B point, Pogonion, Gonion, and Menton.'},
  {week:'week2', module:'Oral Radiography', term:'Intraoral', def:'A radiographic category where the film or sensor is placed inside the mouth, such as periapical, bite-wing, or occlusal images.'},
  {week:'week2', module:'Oral Radiography', term:'Extraoral', def:'A radiographic category where the film or sensor is placed outside the mouth, such as panoramic or cephalometric images.'},
  {week:'week2', module:'Oral Radiography', term:'Film-Based Radiography', def:'Uses x-ray film that requires chemical processing; images are captured on film packets containing lead foil, black paper, and film layers, and require proper film storage, handling, and processing techniques.'},
  {week:'week2', module:'Oral Radiography', term:'Digital Imaging (Radiography)', def:'Uses digital sensors instead of film; reduces radiation exposure by 50-80%, allows instant image viewing and enhancement, and eliminates the need for chemical processing.'},
  {week:'week2', module:'Oral Radiography', term:'Film Size 0', def:'Intraoral film size used for small children under 3 years old.'},
  {week:'week2', module:'Oral Radiography', term:'Film Size 1', def:'Intraoral film size used for anterior periapical images in adults.'},
  {week:'week2', module:'Oral Radiography', term:'Film Size 2', def:'Intraoral film size used for standard adult bite-wing and periapical radiographs.'},
  {week:'week2', module:'Oral Radiography', term:'Film Size 3', def:'Intraoral film size used for extended bite-wings; less common.'},
  {week:'week2', module:'Oral Radiography', term:'Film Size 4', def:'Intraoral film size used for occlusal radiographs.'},
  {week:'week2', module:'Oral Radiography', term:'Developer (Film Processing)', def:'The processing chemical that converts a latent x-ray image into a visible image.'},
  {week:'week2', module:'Oral Radiography', term:'Rinse (Film Processing)', def:'The processing step that removes excess chemicals from the film after developing.'},
  {week:'week2', module:'Oral Radiography', term:'Fixer (Film Processing)', def:'The processing chemical that hardens and preserves the developed x-ray image.'},
  {week:'week2', module:'Oral Radiography', term:'Wash (Film Processing)', def:'The processing step that removes fixer residue from the film.'},
  {week:'week2', module:'Oral Radiography', term:'Dry (Film Processing)', def:'The final film processing step that prepares the film for mounting.'},
  {week:'week2', module:'Oral Radiography', term:'Light Film (Error)', def:'A processing error caused by underdevelopment or excessive fixer; corrected by checking processing times.'},
  {week:'week2', module:'Oral Radiography', term:'Dark Film (Error)', def:'A processing error caused by overdevelopment or excessive exposure; corrected by adjusting exposure settings.'},
  {week:'week2', module:'Oral Radiography', term:'Blurred Image (Error)', def:'A radiographic error caused by patient or sensor movement; corrected by ensuring the patient remains still.'},
  {week:'week2', module:'Oral Radiography', term:'Overlapping Contacts (Error)', def:'A radiographic error caused by incorrect horizontal angulation; corrected by adjusting tubehead angulation.'},
  {week:'week2', module:'Oral Radiography', term:'Cone Cut', def:'A film processing error caused by a misaligned x-ray beam; corrected by centering the PID over the film.'},
  {week:'week2', module:'Oral Radiography', term:'Infection Control Surfaces (Radiography)', def:'Surfaces commonly contaminated during x-ray procedures include the x-ray tubehead, control panel, exposure button, digital sensors and cables, and the lead apron.'},
  {week:'week2', module:'Oral Radiography', term:'CDC Guidelines for Radiography Infection Control', def:'Wear gloves and PPE when handling radiographic equipment, use disposable or heat-sterilizable film-holding devices, transport and handle exposed film aseptically, and use FDA-cleared barriers on digital sensors.'},
  {week:'week2', module:'Oral Radiography', term:'Digital Radiography and Image Enhancement', def:'Digital images can be enhanced, magnified, and color-adjusted to improve diagnosis; image manipulation reduces the need for retakes and eliminates film storage while reducing environmental waste.'},
  {week:'week2', module:'Instruments & Handpieces', term:'Hand Instrument Design', def:'The three main parts of a dental hand instrument: the handle (held by the operator), the shank (connects handle to working end), and the working end (functional blade, nib, or point).'},
  {week:'week2', module:'Instruments & Handpieces', term:'Mouth Mirror', def:'An examination instrument that provides indirect vision and light reflection in the oral cavity.'},
