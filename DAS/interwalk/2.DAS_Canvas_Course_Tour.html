<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Canvas Course Tour</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap" rel="stylesheet">
<style>

:root{
  --cv-blue:#144de7; --cv-link:#0e68b3; --cv-ink:#273540; --cv-ink2:#47535c; --cv-muted:#6b7780;
  --cv-line:#e8eaec; --cv-line2:#c7cdd1; --cv-gray:#f2f4f4; --cv-green:#0b874b;
  --z-purple:#7a12e0; --z-purple-d:#5a0fb0; --z-purple-l:#f2e9fd; --amber:#fc5e13;
  --page:#f3f1f8;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Lato Extended",Lato,"Helvetica Neue",Helvetica,Arial,sans-serif;color:var(--cv-ink);background:var(--page);font-size:16px}
button{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 32px}

/* ===== Coach (outside Canvas mock) ===== */
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:1.5rem;font-weight:900;margin:0}
.top p{margin:2px 0 0;color:#5f5a6b;font-size:.95rem}
.miles{display:flex;gap:6px;margin-bottom:12px}
.mile{flex:1;background:#e3ddef;border-radius:999px;padding:7px 8px;font-size:.78rem;font-weight:700;color:#7d7590;text-align:center;transition:.3s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mile.on{background:var(--z-purple);color:#fff}
.mile.done{background:#d9c6fb;color:var(--z-purple-d)}
.coach{background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 2px 12px rgba(60,30,120,.09);display:flex;gap:14px;align-items:flex-start;margin-bottom:14px;border-left:6px solid var(--z-purple)}
.coach .num{flex:none;width:40px;height:40px;border-radius:50%;background:var(--z-purple);color:#fff;font-weight:900;display:grid;place-items:center;font-size:1.05rem}
.coach .txt{flex:1;min-width:0}
.coach h2{margin:0 0 3px;font-size:1.1rem;font-weight:900}
.coach p{margin:0;line-height:1.45}
.coach .hint{display:none;margin-top:8px;font-size:.92rem;color:var(--z-purple-d);background:var(--z-purple-l);padding:7px 10px;border-radius:6px}
.coach .hint.show{display:block}
.coach .acts{display:flex;flex-direction:column;gap:6px;flex:none}
.cbtn{border:1.5px solid var(--z-purple);background:#fff;color:var(--z-purple);border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:700;cursor:pointer;white-space:nowrap}
.cbtn:hover{background:var(--z-purple-l)}
.cbtn.solid{background:var(--z-purple);color:#fff}
.coach.win{border-left-color:var(--cv-green)}
.coach.win .num{background:var(--cv-green)}

/* ===== Browser frame ===== */
.browser{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(40,20,90,.18);border:1px solid #cdc6dc;position:relative}
.chrome{background:#dfe1e5;padding:7px 12px;display:flex;align-items:center;gap:10px}
.dots{display:flex;gap:6px}.dots i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
.url{flex:1;background:#fff;border-radius:16px;padding:5px 14px;font-size:.8rem;color:#3c4043;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:6px;align-items:center}
.url svg{flex:none}

/* ===== Canvas mock ===== */
.cv{display:flex;height:640px;background:#fff}
.gnav{width:84px;flex:none;background:var(--cv-blue);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.gnav .logo{width:84px;height:84px;display:grid;place-items:center;border-bottom:1px solid rgba(255,255,255,.25)}
.gnav .logo img{width:84px;height:84px;object-fit:cover;display:block}
.gi{width:100%;display:flex;flex-direction:column;align-items:center;padding:7px 2px 8px;color:#fff;font-size:12px;line-height:1.15;text-align:center;cursor:pointer}
.gi svg{width:26px;height:26px;margin-bottom:3px}
.gi .av{width:30px;height:30px;border-radius:50%;background:#c7cdd1;border:2px solid #fff;display:grid;place-items:center;margin-bottom:3px;overflow:hidden}
.gi.cur{background:#fff;color:var(--cv-blue)}
.cmain{flex:1;min-width:0;display:flex;flex-direction:column}
.chead{height:72px;flex:none;display:flex;align-items:center;gap:22px;margin:0 24px;border-bottom:1px solid var(--cv-line2)}
.ham{width:24px;flex:none;cursor:pointer}
.ham i{display:block;height:2px;background:var(--cv-blue);margin:5px 0;border-radius:1px}
.crumbs{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs a{color:var(--cv-link);text-decoration:none;cursor:pointer}
.crumbs .s{color:var(--cv-ink2);margin:0 8px;font-size:12px;vertical-align:2px}
.cbody{flex:1;display:flex;min-height:0}
.cnav{width:178px;flex:none;padding:24px 0 0 24px;overflow:auto}
.cnav a{display:block;color:var(--cv-link);padding:8px 0 8px 8px;font-size:16px;text-decoration:none;border-left:2px solid transparent;cursor:pointer;line-height:1.3}
.cnav a:hover{text-decoration:underline}
.cnav a.cur{color:var(--cv-ink);font-weight:700;border-left-color:var(--cv-ink)}
.content{flex:1;overflow:auto;position:relative;min-width:0;scroll-behavior:auto}
.inner{padding:24px 32px 40px;max-width:820px;position:relative}

/* home */
.ptitle{font-size:2rem;font-weight:700;color:#5b6168;margin:2px 0 26px}
.uc{max-width:470px;margin:0 auto}
.uc .banner{display:block;width:100%;margin:0 auto 28px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 30px}.qgrid img{display:block;width:100%}
.wgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 8px}
.wgrid a{display:block;cursor:pointer;border-radius:30px}
.wgrid img{display:block;width:100%}

/* modules */
.mtop{display:flex;justify-content:flex-end;margin:0 0 28px}
.btn{background:var(--cv-gray);border:1px solid var(--cv-line);color:var(--cv-ink);border-radius:4px;padding:8px 14px;font-size:16px;cursor:pointer;line-height:1.4}
.btn:hover{background:#e7eaec}
.mod{border:1px solid var(--cv-line);border-radius:4px;margin-bottom:36px;background:#fff}
.mh{background:var(--cv-gray);padding:12px 10px 10px 12px;border-bottom:1px solid var(--cv-line);display:flex;gap:8px;align-items:flex-start}
.mh .car{font-size:11px;padding-top:4px;color:var(--cv-ink)}
.mh .mt{flex:1;min-width:0}
.mh .mt b{display:block;font-size:16px;color:#3d454c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh .mt small{display:block;font-size:12px;color:var(--cv-ink2);margin-top:3px}
.mh .mr{display:flex;align-items:center;gap:16px;align-self:flex-end;margin-top:6px}
.pill{border:1px solid #8b969e;border-radius:12px;padding:1px 10px;font-size:14px;background:#fff;white-space:nowrap}
.pill.ok{border-color:var(--cv-green);color:var(--cv-green)}
.mi{display:flex;align-items:center;gap:12px;padding:12px 10px 12px 14px;border-bottom:1px solid var(--cv-line);min-height:66px}
.mi:last-child{border-bottom:0}
.mi.ind1{padding-left:34px}
.mi .ic{width:22px;height:22px;flex:none;color:var(--cv-ink2)}
.mi .t{flex:1;min-width:0}
.mi .t b{display:block;font-size:16px;color:var(--cv-ink);font-weight:700;line-height:1.25}
.mi .t a{color:var(--cv-ink);text-decoration:none;cursor:pointer}
.mi .t a:hover{text-decoration:underline;color:var(--cv-link)}
.mi .t small{display:flex;gap:12px;font-size:13px;color:var(--cv-ink2);margin-top:4px}
.mi .comp{width:20px;height:20px;border-radius:50%;border:1.5px solid #8b969e;flex:none;display:grid;place-items:center}
.mi .comp.ok{background:var(--cv-green);border-color:var(--cv-green)}
.mi.sh{min-height:0;padding:14px 14px}
.mi.sh b{font-size:20px;font-weight:400;color:var(--cv-ink)}
.locked .mi{opacity:.4}
.lockic{width:18px;height:18px;color:var(--cv-ink)}

/* page */
.uc2{max-width:470px;margin:0 auto}
.uc2 .hdr{display:block;width:100%;margin:6px 0 34px}
.uc2 h2{font-size:28.8px;font-weight:700;color:#2f6fa5;margin:0 0 14px;line-height:1.2}
.uc2 p{line-height:1.5;margin:12px 0}
.uc2 ul{margin:8px 0 12px;padding-left:24px;line-height:1.6}
.uc2 .rem{font-size:20px;color:#2f6fa5;font-weight:700;margin:34px 0 8px;display:flex;align-items:center;gap:8px}
.uc2 .rem .bx{width:20px;height:20px;border-radius:4px;background:#4cb36a;display:grid;place-items:center}
.uc2 .rem + p strong{color:#2f6fa5}
.vid{position:relative;aspect-ratio:16/9;width:100%;margin:24px 0 4px;background:#000;overflow:hidden;cursor:pointer}
.vid img{width:100%;height:100%;object-fit:cover;display:block}
.yt-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:68px;height:48px}
.yt-wo{position:absolute;left:12px;bottom:12px;background:rgba(23,23,23,.8);color:#fff;border-radius:22px;padding:8px 14px;font-size:14px;font-family:Roboto,Arial,sans-serif;display:flex;align-items:center;gap:6px;font-weight:500}
.yt-wo b{font-weight:900;letter-spacing:-.5px}
.vid .prog{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.3);display:none}
.vid .prog i{display:block;height:100%;width:0;background:#f00}
.vid .state{position:absolute;inset:0;display:none;place-items:center;background:rgba(0,0,0,.35);color:#fff;font-size:14px}
.vid.playing .prog,.vid.ended .prog{display:block}
.vid.playing .state,.vid.ended .state{display:grid}
.vid.playing .yt-play,.vid.playing .yt-wo,.vid.ended .yt-play,.vid.ended .yt-wo,.vid.playing .h5-play,.vid.ended .h5-play,.vid.playing .drv-play,.vid.ended .drv-play{display:none}
.vid .state span{background:rgba(0,0,0,.6);padding:6px 12px;border-radius:4px}
.h5{background:#000}
.drv-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:60px;height:60px;border-radius:14px;background:rgba(32,33,36,.85);display:grid;place-items:center}
.gdoc{height:360px;overflow:auto;border:1px solid var(--cv-line2);margin:0 0 4px;background:#fff;overscroll-behavior:contain}
.gdin{padding:22px 26px;font-family:Calibri,Arial,sans-serif;font-size:15px;line-height:1.45;color:#222}
.gdin h3{font-size:30px;color:#1f3d7a;margin:4px 0 4px}.gdin .sub{margin:0;color:#555}.gdin .it{font-style:italic;color:#1f3d7a;margin:6px 0 14px}
.gdin h4{font-size:20px;color:#1f3d7a;font-weight:400;margin:22px 0 6px}.gdin hr{border:0;border-top:1px solid #ccc;margin:18px 0}
.gdin .end{text-align:center;color:#888;margin:28px 0 6px;font-weight:700}
.h5-play{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%)}
.h5-title{position:absolute;bottom:6px;left:0;right:0;text-align:center;color:#fff;font-size:20px;font-family:Arial,sans-serif}
.h5bar{display:flex;align-items:center;gap:12px;background:#fafafa;border:1px solid #ddd;border-top:0;padding:4px 10px;font-size:12px;color:#666;font-family:Arial,sans-serif}
.h5bar .sp{flex:1}
.h5bar b{font-weight:900;color:#555}
.seqfoot{max-width:470px;margin:30px auto 0;border-top:1px solid var(--cv-line2);padding-top:14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.seqfoot .r{display:flex;gap:6px;margin-left:auto}
.mdone{display:flex;align-items:center;gap:6px}
.mdone .o{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--cv-ink)}
.mdone.ok{background:var(--cv-green);border-color:var(--cv-green);color:#fff}
.mdone.ok .o{border:0;width:auto;height:auto}

/* coach overlays in canvas */
.hl{outline:3px solid var(--amber)!important;outline-offset:3px;border-radius:6px;animation:pl 1.3s infinite}
@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(252,94,19,.55)}50%{box-shadow:0 0 0 12px rgba(252,94,19,0)}}
.tip{position:absolute;z-index:20;background:var(--amber);color:#fff;font-weight:900;font-size:13px;padding:6px 12px;border-radius:8px;white-space:nowrap;pointer-events:none;box-shadow:0 4px 12px rgba(0,0,0,.2);animation:bob 1s infinite}
.tip:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--amber)}
@keyframes bob{50%{transform:translateY(-4px)}}
.cue{position:sticky;z-index:20;left:0;right:0;display:none;justify-content:center;pointer-events:none;height:0}
.cue.show{display:flex}
.cue span{background:var(--amber);color:#fff;font-weight:900;font-size:13px;padding:6px 14px;border-radius:999px;box-shadow:0 3px 10px rgba(0,0,0,.25);animation:bob 1s infinite;height:max-content}
.cue.up{top:10px}.cue.down{top:calc(100% - 46px)}
.toast{position:absolute;left:50%;bottom:20px;transform:translate(-50%,16px);background:#2d3b45;color:#fff;padding:10px 16px;border-radius:8px;font-size:.92rem;opacity:0;pointer-events:none;transition:.25s;max-width:88%;text-align:center;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.good{background:var(--cv-green)}

.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#6b6580;font-size:.85rem;gap:8px}

.cbody{position:relative}
@media (max-width:900px){.cnav{display:none}.inner{padding:20px 20px 36px}.cv.navopen .cnav{display:block;position:absolute;left:0;top:0;bottom:0;z-index:30;background:#fff;box-shadow:4px 0 14px rgba(0,0,0,.15);padding-right:16px}}
@media (max-width:640px){
  .gnav{width:56px}.gnav .logo,.gnav .logo img{width:56px;height:56px}.gi span{display:none}.gi{padding:10px 2px}
  .chead{margin:0 14px;height:58px;gap:14px}.crumbs{font-size:15px}
  .cv{height:600px}.inner{padding:16px 14px 30px}
  .ptitle{font-size:1.5rem}
  .coach{flex-wrap:wrap}.coach .acts{flex-direction:row;width:100%}
  .mile{font-size:.66rem;padding:6px 4px}
  .mh .mr{display:none}
  .uc2 h2{font-size:23px}
}

/* ===== tour additions ===== */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{background:#e3ddef;color:#6d6585;border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;cursor:pointer;border:0}
.chip.v{background:#d9c6fb;color:var(--z-purple-d)}.chip.v::before{content:"✓ "}
.chip.cur{background:var(--z-purple);color:#fff}
.bar2{height:8px;background:#e3ddef;border-radius:9px;overflow:hidden;margin:0 0 10px}.bar2 i{display:block;height:100%;width:0;background:var(--z-purple);transition:width .4s}
.coach .nexty{margin-top:8px;font-weight:700;color:var(--z-purple-d)}
.cnav a.seen{position:relative}.cnav a.seen::after{content:"✓";color:var(--cv-green);font-weight:900;font-size:13px;margin-left:6px}
.ph{font-size:2rem;font-weight:400;color:var(--cv-ink);margin:0 0 18px}
.hdrbar{display:flex;align-items:center;gap:14px;background:linear-gradient(100deg,#3c8ad6 0 18%,#0f2f5c 18%);color:#fff;border-radius:2px;padding:12px 18px;font-weight:900;font-size:28px;margin:0 0 18px;max-width:470px}
.hdrbar svg{width:34px;height:34px}
.card{border:1px solid var(--cv-line);border-radius:8px;padding:18px;margin:0 0 14px;background:#fff}
.card h4{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--cv-ink2);line-height:1.45}
.ghost{border:2px dashed var(--cv-line2);border-radius:10px;padding:26px 18px;text-align:center;color:var(--cv-ink2);background:#fafbfb}
.ghost .ico{width:54px;height:54px;border-radius:50%;background:var(--z-purple-l);color:var(--z-purple);display:grid;place-items:center;margin:0 auto 10px;font-size:26px}
.ghost b{display:block;color:var(--cv-ink);font-size:17px;margin-bottom:4px}
.fakebtn{display:inline-block;margin-top:12px;background:var(--cv-blue);color:#fff;border-radius:4px;padding:8px 16px;font-weight:700;font-size:15px}
.fakefield{height:38px;border:1px solid var(--cv-line2);border-radius:4px;margin:6px 0 12px;background:#fff}
.lbl{font-size:14px;font-weight:700;color:var(--cv-ink)}
table.cvt{width:100%;border-collapse:collapse;font-size:15px}
.cvt th{text-align:left;font-weight:700;border-bottom:2px solid var(--cv-line2);padding:8px 6px}
.cvt td{border-bottom:1px solid var(--cv-line);padding:10px 6px;vertical-align:top}
.cvt a{color:var(--cv-link)}.cvt small{display:block;color:var(--cv-ink2);font-size:13px}
.cvt tr.shade td{background:#f5f5f5}
.miss{color:#e0061f;border:1px solid #e0061f;border-radius:4px;padding:0 6px;font-size:12px}
.gl-hero{background:#0f2447;color:#fff;border-radius:8px;padding:18px 20px;margin-bottom:10px}
.gl-hero h3{margin:0 0 4px;font-size:21px;font-family:Georgia,serif}.gl-hero p{margin:0;font-size:13px;opacity:.85}
.gl-hero .pillg{display:inline-block;margin-top:10px;background:#f4c04e;color:#0f2447;border-radius:999px;padding:2px 10px;font-weight:900;font-size:12px}
.gl-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.gl-tabs span{border:1px solid var(--cv-line2);border-radius:999px;padding:3px 10px;font-size:13px}.gl-tabs span:first-child{background:#0f2447;color:#fff;border-color:#0f2447}
.gl-row{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--cv-line);border-radius:6px;padding:10px 12px;margin-bottom:6px;font-size:14px}
.gl-row b{font-size:14px}.gl-row small{display:block;color:var(--cv-ink2)}.gl-row .tg{background:#e6edf8;color:#1f4e9c;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;white-space:nowrap}
.disc-top{display:flex;flex-direction:column;gap:10px;max-width:420px;margin-left:auto}
.sel{border:1px solid var(--cv-line2);border-radius:4px;padding:8px 12px;display:flex;justify-content:space-between}
.empty{border:1px solid var(--cv-line);border-radius:4px;margin-top:20px}.empty .h{padding:10px 12px;font-weight:700;border-bottom:1px solid var(--cv-line);display:flex;justify-content:space-between}.empty .h i{font-weight:400}
.empty .b{margin:14px;border:2px dashed var(--cv-line);border-radius:6px;padding:30px;text-align:center;color:var(--cv-ink)}
.lib{max-width:520px}
.lib .banner2{background:linear-gradient(135deg,#1352d6,#0b2a8a);color:#fff;font-weight:900;font-size:24px;padding:22px;line-height:1.15;border-radius:4px;margin-bottom:16px}
.libgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.libgrid .card{padding:14px}.libgrid h4{font-size:14px;letter-spacing:.03em;text-transform:uppercase}
.minical{border:1px solid var(--cv-line);border-radius:4px;margin-top:22px;padding:10px;font-size:13px;text-align:center}
.minical .g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}.minical .g span{padding:4px 0}.minical .g .td{background:#fde2e2;border-radius:3px}
.chatbox{border:1px solid var(--cv-line2);border-radius:8px;height:300px;display:flex;flex-direction:column;max-width:470px}
.chatbox .msgs{flex:1;padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:75%;padding:8px 12px;border-radius:14px;font-size:14px;background:var(--cv-gray)}.bub.me{align-self:flex-end;background:var(--z-purple-l)}
.chatbox .in{border-top:1px solid var(--cv-line);padding:10px;color:var(--cv-muted);font-size:14px}
.demo-note{font-size:12px;color:var(--cv-muted);margin:10px 0 0;font-style:italic}
.gnav .gi.hlg{outline:3px solid var(--amber);outline-offset:-3px;animation:pl 1.3s infinite}
.gtour{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.gtour div{background:var(--z-purple-l);border-radius:8px;padding:10px 12px;font-size:.9rem}.gtour b{display:block;color:var(--z-purple-d)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div><h1>Canvas Course Tour</h1><p>Explore every link in your course menu. Click where you would in the real course.</p></div></div>
  <div class="bar2"><i id="bar"></i></div>
  <div class="chips" id="chips"></div>
  <div class="coach" id="coach" aria-live="polite">
    <div class="num" id="num">1</div>

const ORDER=PAGES.map(p=>p.n);
let cur=0,seen=new Set(),hintOn=false,idle=null,finished=false;
function renderChrome(){
  $("gnav").innerHTML=`<div class="logo"><img src="${IMG.logo}" alt="Zollege"></div>`+GN.map(g=>`<div class="gi${g[2]?" cur":""}" data-g="${g[0]}">${g[1]}<span>${g[0]}</span></div>`).join("");
  $("cnav").innerHTML=ORDER.map((n,i)=>`<a data-t="nav-${i}" class="${i===cur?"cur":""} ${seen.has(i)&&i!==cur?"seen":""}">${n}</a>`).join("");
}
function crumbs(p){const parts=[COURSE];if(p.crumb)parts.push(p.crumb);if(cur!==0)parts.push(p.title||p.n);if(p.crumb2)parts.push(p.crumb2);
  $("crumbs").innerHTML=parts.map((x,i)=>i<parts.length-1?`<a>${x}</a><span class="s">&#10095;</span>`:`<span>${x}</span>`).join("");$("url").textContent=BASE+p.u;}
function nextUnseen(){for(let k=0;k<ORDER.length;k++){const i=(cur+1+k)%ORDER.length;if(!seen.has(i))return i}return -1}
function open(i,silent){
  cur=i;seen.add(i);const p=PAGES[i];renderChrome();crumbs(p);view.innerHTML=p.r();content.scrollTop=0;
  document.querySelector(".cv").classList.remove("navopen");
  const nu=nextUnseen();
  $("num").textContent=i+1;$("st").textContent=p.n;$("sx").innerHTML=p.about;
  $("nexty").innerHTML=nu>=0?`Next, click <b>${ORDER[nu]}</b> in the course menu on the left.`:`You've explored every link! Click <b>Finish</b> below.`;
  $("hint").innerHTML=nu>=0?`Tip: it's in the list of links on the left (on a small screen, tap the &#9776; icon first).`:"";$("hint").classList.remove("show");
  hintOn=false;clearHL();updateProgress();
  if(nu<0)showFinishBtn();
  armIdle();
}
function updateProgress(){
  $("bar").style.width=(seen.size/ORDER.length*100)+"%";
  $("chips").innerHTML=ORDER.map((n,i)=>`<button class="chip ${i===cur?"cur":seen.has(i)?"v":""}" data-c="${i}">${n}</button>`).join("");
  $("chips").querySelectorAll(".chip").forEach(c=>c.onclick=()=>open(+c.dataset.c));
  $("prog").textContent=`${seen.size} of ${ORDER.length} menu links explored`;
}
function clearHL(){document.querySelectorAll(".hl,.hlg").forEach(e=>e.classList.remove("hl","hlg"))}
function showHint(){const nu=nextUnseen();if(nu<0)return;hintOn=true;$("hint").classList.add("show");clearHL();const el=document.querySelector(`[data-t="nav-${nu}"]`);el&&el.classList.add("hl");el&&el.scrollIntoView({block:"nearest"});if(window.innerWidth<=900)document.querySelector(".cv").classList.add("navopen")}
function armIdle(){clearTimeout(idle);idle=setTimeout(showHint,10000)}
function toast(m,g){const t=$("toast");t.innerHTML=m;t.classList.toggle("good",!!g);t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("show"),2200)}
function showFinishBtn(){$("nexty").innerHTML+=` <button class="cbtn solid" id="fin" style="margin-left:6px">Finish ▸</button>`;$("fin").onclick=globalTour}
function globalTour(){
  finished=true;clearTimeout(idle);clearHL();
  document.querySelectorAll(".gi").forEach(g=>g.classList.add("hlg"));
  $("coach").classList.add("win");$("num").innerHTML="✓";$("st").textContent="One more thing: the blue bar";
  $("sx").innerHTML="The blue bar on the far left is always there, on every page in Canvas:";
  $("nexty").innerHTML=`<div class="gtour"><div><b>Account</b>Your profile, settings and notifications.</div><div><b>Dashboard</b>A card for each of your courses.</div><div><b>Courses</b>Jump to any of your courses.</div><div><b>Calendar</b>Due dates from all your courses.</div><div><b>Studio</b>Canvas Studio videos.</div><div><b>Support</b>Get help with Canvas.</div><div><b>FAQ</b>Zollege's Knowledge Base of common questions.</div></div><p style="margin:10px 0 0">🎉 <b>Tour complete!</b> You've seen every part of your course menu.</p>`;
  $("hint").classList.remove("show");$("prog").textContent="Tour complete";toast("Tour complete!",true);
}
$("browser").addEventListener("click",e=>{
  const h=e.target.closest("[data-t]"),k=h&&h.dataset.t;
  if(k==="ham"){document.querySelector(".cv").classList.toggle("navopen");return}
  if(k&&k.startsWith("nav-")){e.preventDefault();const i=+k.slice(4);const was=seen.has(i);if(finished){finished=false;$("coach").classList.remove("win")}open(i);if(!was)toast(`Opened ${ORDER[i]}`,true);return}
  if(e.target.closest(".gi")){toast("That's the blue global menu. You'll see it at the end of the tour. For now, use the course menu.");return}
  if(e.target.closest(".cv")&&!finished){const nu=nextUnseen();if(nu>=0){toast(`Try the course menu on the left: click <b>${ORDER[nu]}</b>.`);showHint()}}
});
$("showme").onclick=showHint;
$("restart").onclick=()=>{seen=new Set();finished=false;$("coach").classList.remove("win");open(0)};
open(0);
</script>
