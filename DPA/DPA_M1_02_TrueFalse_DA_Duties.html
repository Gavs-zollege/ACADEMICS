<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unlicensed DA: True or False?</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0f0e17;color:#f0eeff;font-family:'Inter',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);}
.t-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#06b6d4,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.t-info{flex:1;min-width:0;}
.t-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#fff;}
.prow{display:flex;align-items:center;gap:7px;margin-top:3px;}
.pbg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.pfill{height:5px;border-radius:99px;background:linear-gradient(90deg,#06b6d4,#7c3aed);transition:width .4s ease;}
.plabel{font-size:10px;color:#9d9bb8;white-space:nowrap;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;}
.inner{width:100%;max-width:620px;display:flex;flex-direction:column;gap:10px;}
.qtag{display:inline-flex;align-items:center;background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.3);color:#67e8f9;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;align-self:flex-start;}
.scard{background:linear-gradient(135deg,rgba(6,182,212,.08),rgba(124,58,237,.06));border:1.5px solid rgba(6,182,212,.2);border-radius:14px;padding:14px 18px;}
.stext{font-family:'Nunito',sans-serif;font-size:clamp(13px,2vw,17px);font-weight:800;color:#fff;line-height:1.35;}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tfbtn{padding:14px;border-radius:12px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);font-family:'Nunito',sans-serif;font-size:clamp(14px,2.5vw,20px);font-weight:900;cursor:pointer;color:#f0eeff;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.tfbtn .ico{font-size:clamp(20px,4vw,32px);}
.tfbtn.tb:hover:not(:disabled){border-color:#10b981;background:rgba(16,185,129,.1);}
.tfbtn.fb2:hover:not(:disabled){border-color:#ef4444;background:rgba(239,68,68,.1);}
.tfbtn.correct{border-color:#10b981;background:rgba(16,185,129,.15);}
.tfbtn.incorrect{border-color:#ef4444;background:rgba(239,68,68,.12);}
.tfbtn:disabled{cursor:default;}
.fb{padding:10px 14px;border-radius:11px;display:none;animation:su .25s ease;}
@keyframes su{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fb.correct{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);}
.fb.incorrect{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.3);}
.fb-h{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;margin-bottom:3px;}
.fb-h.correct{color:#34d399;}.fb-h.incorrect{color:#f87171;}
.fb-b{font-size:11px;color:#d4d0f0;line-height:1.45;}
.footer{flex-shrink:0;padding:9px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);}
.qc{font-size:11px;color:#9d9bb8;}
.btn-next{background:linear-gradient(135deg,#06b6d4,#7c3aed);color:#fff;border:none;border-radius:9px;padding:8px 22px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:none;box-shadow:0 3px 14px rgba(6,182,212,.4);}
.result{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;height:100%;gap:6px;}
.result.active{display:flex;}
.remoji{font-size:clamp(48px,8vw,72px);animation:bounce .5s ease;}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.rpct{font-family:'Nunito',sans-serif;font-size:clamp(40px,7vw,56px);font-weight:900;background:linear-gradient(135deg,#06b6d4,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.rtitle{font-family:'Nunito',sans-serif;font-size:clamp(18px,3vw,24px);font-weight:900;color:#fff;}
.rsub{font-size:clamp(12px,1.8vw,14px);color:#9d9bb8;line-height:1.4;}
.btn-retry{background:linear-gradient(135deg,#06b6d4,#7c3aed);color:#fff;border:none;border-radius:11px;padding:12px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="t-icon">⚡</div>
    <div class="t-info">
      <div class="t-title">Unlicensed DA: True or False?</div>
      <div class="prow"><div class="pbg"><div class="pfill" id="pf" style="width:0%"></div></div><span class="plabel" id="pl">0/6</span></div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer">
    <span class="qc" id="qc">Statement 1 of 6</span>
    <button class="btn-next" id="bn" onclick="next()">Next →</button>
  </div>
</div>
<script>
const Q=[
  {q:'An unlicensed DA may perform coronal polishing after completing a Board-approved course (effective January 1, 2025).',a:true,f:'TRUE! SB 1453 added coronal polishing to approved unlicensed DA duties — but only after a Board-approved course (BPC § 1750.1).'},
  {q:'An unlicensed DA may place and finish permanent restorations.',a:false,f:'FALSE! Placing, finishing, or removing permanent restorations is explicitly PROHIBITED for unlicensed DAs under BPC § 1750. Irreversible = prohibited.'},
  {q:'An unlicensed DA may operate radiographic equipment after completing a Board-approved radiation safety course.',a:true,f:'TRUE! Operating radiographic equipment is approved under BPC § 1656 — radiation safety course required first.'},
  {q:'An unlicensed DA may diagnose oral disease if directly supervised by the dentist.',a:false,f:'FALSE! Diagnosing disease is ALWAYS prohibited for unlicensed DAs — no supervision level changes this. Diagnosis belongs to the dentist only.'},
  {q:'An unlicensed DA may adjust nitrous oxide/oxygen flow when directed and with the dentist physically present.',a:true,f:'TRUE! SB 1453 (effective January 1, 2025): unlicensed DAs may adjust N₂O/O₂ flow when directed — but dentist must be present.'},
  {q:'An unlicensed DA may cut soft tissue if trained to do so.',a:false,f:'FALSE! Cutting hard OR soft tissue is explicitly PROHIBITED under BPC § 1750 — no amount of training changes this for an unlicensed DA.'}
];
let cur=0,score=0,ans=false;
function render(){
  ans=false;document.getElementById('bn').style.display='none';
  const q=Q[cur];
  document.getElementById('pf').style.width=Math.round(cur/Q.length*100)+'%';
  document.getElementById('pl').textContent=cur+'/'+Q.length;
  document.getElementById('qc').textContent='Statement '+(cur+1)+' of '+Q.length;
  document.getElementById('content').innerHTML=`<div class="inner">
    <div class="qtag">⚡ BPC § 1750.1 · ${cur+1}/${Q.length}</div>
    <div class="scard"><div class="stext">${q.q}</div></div>
    <div class="tfrow">
      <button class="tfbtn tb" id="bt" onclick="answer(true)"><span class="ico">✅</span>TRUE</button>
      <button class="tfbtn fb2" id="bf" onclick="answer(false)"><span class="ico">❌</span>FALSE</button>
    </div>
    <div class="fb" id="fb"></div>
  </div>`;
}
function answer(v){
  if(ans)return;ans=true;
  const q=Q[cur],ok=v===q.a;if(ok)score++;
  const bt=document.getElementById('bt'),bf=document.getElementById('bf');
  bt.disabled=true;bf.disabled=true;
  (v?bt:bf).classList.add(ok?'correct':'incorrect');
  if(!ok)(q.a?bt:bf).classList.add('correct');
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'correct':'incorrect');fb.style.display='block';
  fb.innerHTML=`<div class="fb-h ${ok?'correct':'incorrect'}">${ok?'🎉 Correct!':'😬 It\'s '+(q.a?'TRUE':'FALSE')+'!'}</div><div class="fb-b">${q.f}</div>`;
  document.getElementById('bn').style.display='inline-block';
}
function next(){cur++;cur>=Q.length?done():render();}
function done(){
  const p=Math.round(score/Q.length*100);
  document.getElementById('pf').style.width='100%';document.getElementById('pl').textContent=Q.length+'/'+Q.length;
  document.getElementById('qc').textContent='';document.getElementById('bn').style.display='none';
  document.getElementById('content').innerHTML=`<div class="result active">
    <div class="remoji">${p===100?'🏆':p>=80?'🎯':p>=60?'💪':'📖'}</div>
    <div class="rpct">${p}%</div>
    <div class="rtitle">${p===100?'Perfect!':p>=80?'Well Done!':p>=60?'Good Effort':'Keep Studying!'}</div>
    <div class="rsub">You got <strong>${score}</strong> of <strong>${Q.length}</strong> correct.</div>
    <button class="btn-retry" onclick="cur=0;score=0;render()">Try Again 🔄</button>
  </div>`;
}
render();
</script>
</body>
</html>
