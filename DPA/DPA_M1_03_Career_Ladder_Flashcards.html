<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Ladder Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0f0e17;color:#f0eeff;font-family:'Inter',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);}
.t-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#f97316,#fbbf24);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.t-info{flex:1;min-width:0;}
.t-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#fff;}
.prow{display:flex;align-items:center;gap:7px;margin-top:3px;}
.pbg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.pfill{height:5px;border-radius:99px;background:linear-gradient(90deg,#f97316,#fbbf24);transition:width .4s ease;}
.plabel{font-size:10px;color:#9d9bb8;white-space:nowrap;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;}
.inner{width:100%;max-width:580px;display:flex;flex-direction:column;align-items:center;gap:10px;}
.meta{display:flex;justify-content:space-between;width:100%;}
.mcount{font-size:11px;color:#9d9bb8;}
.mscore{font-size:11px;color:#fbbf24;font-weight:700;}
.fcwrap{width:100%;cursor:pointer;perspective:1000px;}
.fci{position:relative;width:100%;height:clamp(140px,22vh,200px);transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
.fci.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;}
.face.front{background:linear-gradient(135deg,#1e1b30,#2a2040);border:2px solid rgba(249,115,22,.3);}
.face.back{transform:rotateY(180deg);background:linear-gradient(135deg,#1a2535,#0f1e30);border:2px solid rgba(6,182,212,.35);}
.ftag{font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:8px;padding:3px 10px;border-radius:20px;}
.ftag.fr{color:#fb923c;background:rgba(249,115,22,.15);}
.ftag.bk{color:#67e8f9;background:rgba(6,182,212,.15);}
.fterm{font-family:'Nunito',sans-serif;font-size:clamp(15px,2.5vw,22px);font-weight:900;color:#fff;line-height:1.2;}
.fdef{font-size:clamp(11px,1.6vw,13px);color:#d4d0f0;line-height:1.5;}
.ftap{font-size:10px;color:#6b7280;margin-top:8px;}
.btnrow{display:flex;gap:10px;width:100%;}
.bskip{flex:1;padding:10px;border-radius:11px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#9d9bb8;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .2s;}
.bskip:hover{border-color:#9d9bb8;}
.bknew{flex:1;padding:10px;border-radius:11px;border:none;background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 3px 14px rgba(16,185,129,.35);}
.bknew:hover{opacity:.88;}
.footer{flex-shrink:0;padding:8px 16px;border-top:1px solid rgba(255,255,255,.07);text-align:center;background:rgba(255,255,255,.03);}
.fhint{font-size:11px;color:#4b5563;}
.result{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;height:100%;gap:6px;}
.result.active{display:flex;}
.remoji{font-size:clamp(48px,8vw,72px);animation:bounce .5s ease;}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.rpct{font-family:'Nunito',sans-serif;font-size:clamp(40px,7vw,56px);font-weight:900;background:linear-gradient(135deg,#f97316,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.rtitle{font-family:'Nunito',sans-serif;font-size:clamp(18px,3vw,24px);font-weight:900;color:#fff;}
.rsub{font-size:clamp(12px,1.8vw,14px);color:#9d9bb8;line-height:1.4;}
.btn-retry{background:linear-gradient(135deg,#f97316,#fbbf24);color:#fff;border:none;border-radius:11px;padding:12px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="t-icon">🃏</div>
    <div class="t-info">
      <div class="t-title">Career Ladder Flashcards</div>
      <div class="prow"><div class="pbg"><div class="pfill" id="pf" style="width:0%"></div></div><span class="plabel" id="pl">0/8</span></div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer"><div class="fhint">👆 Tap card to flip · Got it! = forward · Skip = queue again</div></div>
</div>
<script>
const cards=[
  {t:'Unlicensed Dental Assistant (DA)',d:'BPC § 1750 — No license required. Basic supportive procedures only. Must be technically elementary, completely reversible, and unlikely to cause harm.'},
  {t:'Registered Dental Assistant (RDA)',d:'BPC § 1752 — Licensed by the Dental Board of California. Performs expanded duties. Requires radiation safety, coronal polishing, pit & fissure sealants, infection control, DPA, and BLS courses.'},
  {t:'RDAEF',d:'BPC § 1753.5 — Registered Dental Assistant in Extended Functions. Highest assisting license. MAX 2 per supervising dentist (BPC § 1763). ALL duties under DIRECT supervision.'},
  {t:'RDH / RDHAP / RDHEF',d:'Dental Hygienist. Regulated by the SEPARATE Dental Hygiene Board of California — NOT the Dental Board of California (DBC). Two different boards!'},
  {t:'Dentist (DDS/DMD)',d:'BPC § 1625 — Diagnoses, treats, and prescribes. Supervises all auxiliaries. Legally responsible for ALL delegated procedures regardless of supervision type.'},
  {t:'Direct Supervision',d:'BPC § 1741 — Dentist PHYSICALLY PRESENT in treatment facility. Work must be checked and approved by the dentist BEFORE the patient is dismissed.'},
  {t:'General Supervision',d:'BPC § 1741 — Dentist gives instructions but is NOT required to be physically present. Dentist remains fully legally responsible for all delegated procedures.'},
  {t:'BPC § 1684',d:'Criminal liability provision. Performing illegal dental functions is criminal. Both the unlicensed performer AND the dentist who aids or abets face Board discipline AND criminal charges.'}
];
let idx=0,knew=0,queue=[...Array(cards.length).keys()];
function render(){
  if(!queue.length){done();return;}
  idx=queue[0];
  const c=cards[idx],done2=cards.length-queue.length;
  document.getElementById('pf').style.width=Math.round(done2/cards.length*100)+'%';
  document.getElementById('pl').textContent=done2+'/'+cards.length;
  document.getElementById('content').innerHTML=`<div class="inner">
    <div class="meta"><span class="mcount">Card ${done2+1} of ${cards.length}</span><span class="mscore">✨ Knew: ${knew}/${done2}</span></div>
    <div class="fcwrap" onclick="flip()">
      <div class="fci" id="fci">
        <div class="face front"><div class="ftag fr">TERM</div><div class="fterm">${c.t}</div><div class="ftap">👆 Tap to reveal</div></div>
        <div class="face back"><div class="ftag bk">DEFINITION</div><div class="fdef">${c.d}</div></div>
      </div>
    </div>
    <div class="btnrow">
      <button class="bskip" onclick="skip()">⏭ Skip</button>
      <button class="bknew" onclick="got()">Got it! ✓</button>
    </div>
  </div>`;
}
function flip(){document.getElementById('fci').classList.toggle('flipped');}
function got(){knew++;queue.shift();render();}
function skip(){queue.shift();queue.push(idx);render();}
function done(){
  const p=Math.round(knew/cards.length*100);
  document.getElementById('pf').style.width='100%';document.getElementById('pl').textContent=cards.length+'/'+cards.length;
  document.getElementById('content').innerHTML=`<div class="result active">
    <div class="remoji">${p===100?'🏆':p>=75?'🎯':p>=50?'💪':'📖'}</div>
    <div class="rpct">${p}%</div>
    <div class="rtitle">${p===100?'All Mastered!':p>=75?'Great Retention!':p>=50?'Getting There!':'Keep Reviewing!'}</div>
    <div class="rsub">You knew <strong>${knew}</strong> of <strong>${cards.length}</strong> cards.</div>
    <button class="btn-retry" onclick="idx=0;knew=0;queue=[...Array(cards.length).keys()];render()">Review Again 🔄</button>
  </div>`;
}
render();
</script>
</body>
</html>
