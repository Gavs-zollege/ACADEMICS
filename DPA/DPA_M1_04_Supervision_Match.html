<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supervision Match-Up</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0f0e17;color:#f0eeff;font-family:'Inter',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);}
.t-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#10b981,#06b6d4);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.t-info{flex:1;min-width:0;}
.t-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#fff;}
.prow{display:flex;align-items:center;gap:7px;margin-top:3px;}
.pbg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.pfill{height:5px;border-radius:99px;background:linear-gradient(90deg,#10b981,#06b6d4);transition:width .4s ease;}
.plabel{font-size:10px;color:#9d9bb8;white-space:nowrap;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;}
.inner{width:100%;max-width:720px;display:flex;flex-direction:column;gap:8px;}
.qtag{display:inline-flex;align-items:center;background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.3);color:#6ee7b7;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;align-self:flex-start;}
.qsub{font-size:11px;color:#9d9bb8;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.col-h{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;padding:0 2px;}
.col-h.l{color:#a78bfa;}.col-h.r{color:#67e8f9;}
.col{display:flex;flex-direction:column;gap:5px;}
.item{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.09);border-radius:9px;padding:8px 11px;font-size:clamp(10px,1.5vw,12px);font-weight:600;cursor:pointer;transition:all .18s;min-height:40px;display:flex;align-items:center;color:#d4d0f0;user-select:none;line-height:1.3;}
.item:hover:not(.matched):not(.disabled-i){border-color:#a78bfa;background:rgba(124,58,237,.1);}
.item.sl{border-color:#fbbf24;background:rgba(251,191,36,.1);color:#fde68a;}
.item.sr{border-color:#fbbf24;background:rgba(251,191,36,.1);color:#fde68a;}
.item.matched{border-color:#10b981;background:rgba(16,185,129,.1);color:#6ee7b7;cursor:default;}
.item.wrong{border-color:#ef4444;animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{padding:10px 14px;border-radius:11px;display:none;animation:su .25s ease;}
@keyframes su{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fb.ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);}
.fb-h{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;margin-bottom:3px;color:#34d399;}
.fb-b{font-size:11px;color:#d4d0f0;line-height:1.4;}
.footer{flex-shrink:0;padding:9px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);}
.qc{font-size:11px;color:#9d9bb8;}
.btn-done{background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;border:none;border-radius:9px;padding:8px 22px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:none;box-shadow:0 3px 14px rgba(16,185,129,.35);}
.result{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;height:100%;gap:6px;}
.result.active{display:flex;}
.remoji{font-size:clamp(48px,8vw,72px);animation:bounce .5s ease;}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.rpct{font-family:'Nunito',sans-serif;font-size:clamp(40px,7vw,56px);font-weight:900;background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.rtitle{font-family:'Nunito',sans-serif;font-size:clamp(18px,3vw,24px);font-weight:900;color:#fff;}
.rsub{font-size:clamp(11px,1.8vw,13px);color:#9d9bb8;max-width:400px;line-height:1.4;}
.btn-retry{background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;border:none;border-radius:11px;padding:12px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="t-icon">🔗</div>
    <div class="t-info">
      <div class="t-title">Supervision Match-Up</div>
      <div class="prow"><div class="pbg"><div class="pfill" id="pf" style="width:0%"></div></div><span class="plabel" id="pl">0/6</span></div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer">
    <span class="qc" id="qc">0 / 6 matched</span>
    <button class="btn-done" id="bd" onclick="showResult()">Done! 🎉</button>
  </div>
</div>
<script>
const pairs=[
  {l:'RDAEF performing extended functions',r:'Direct Supervision'},
  {l:'RDA performing pulp vitality testing',r:'General Supervision'},
  {l:'RDA applying bleaching agents',r:'Direct Supervision'},
  {l:'Unlicensed DA operating radiographic equipment',r:'General Supervision'},
  {l:'Pre-dismissal check of patient required',r:'Direct Supervision'},
  {l:'Dentist may be off-premises',r:'General Supervision'}
];
let selL=null,selR=null,matched=0;
const mL=new Set(),mR=new Set();
let sr;
function init(){matched=0;selL=null;selR=null;mL.clear();mR.clear();sr=[...pairs.map(p=>p.r)].sort(()=>Math.random()-.5);render();}
function render(){
  document.getElementById('pf').style.width=Math.round(matched/pairs.length*100)+'%';
  document.getElementById('pl').textContent=matched+'/'+pairs.length;
  document.getElementById('qc').textContent=matched+' / '+pairs.length+' matched';
  document.getElementById('content').innerHTML=`<div class="inner">
    <div class="qtag">🔗 BPC § 1741 · Matching</div>
    <div class="qsub">Tap left item then right item to match. Wrong pairs shake — try again!</div>
    <div class="grid">
      <div>
        <div class="col-h l">Duty / Role</div>
        <div class="col">${pairs.map((p,i)=>`<div class="item${mL.has(i)?' matched':''}" id="ml${i}" onclick="selLeft(${i})">${mL.has(i)?'✓ ':''} ${p.l}</div>`).join('')}</div>
      </div>
      <div>
        <div class="col-h r">Supervision Type</div>
        <div class="col">${sr.map((r,i)=>`<div class="item${mR.has(i)?' matched':''}" id="mr${i}" onclick="selRight(${i})">${mR.has(i)?'✓ ':''} ${r}</div>`).join('')}</div>
      </div>
    </div>
    <div class="fb" id="fb"></div>
  </div>`;
  if(selL!==null&&!mL.has(selL))document.getElementById('ml'+selL)?.classList.add('sl');
  if(selR!==null&&!mR.has(selR))document.getElementById('mr'+selR)?.classList.add('sr');
}
function selLeft(i){if(mL.has(i))return;selL=i;document.querySelectorAll('[id^="ml"]').forEach(e=>e.classList.remove('sl'));document.getElementById('ml'+i).classList.add('sl');if(selR!==null)tryMatch();}
function selRight(i){if(mR.has(i))return;selR=i;document.querySelectorAll('[id^="mr"]').forEach(e=>e.classList.remove('sr'));document.getElementById('mr'+i).classList.add('sr');if(selL!==null)tryMatch();}
function tryMatch(){
  const lE=document.getElementById('ml'+selL),rE=document.getElementById('mr'+selR);
  const ok=pairs[selL].r===sr[selR];
  if(ok){
    mL.add(selL);mR.add(selR);matched++;
    selL=null;selR=null;render();
    if(matched===pairs.length){
      const fb=document.getElementById('fb');
      fb.className='fb ok';fb.style.display='block';
      fb.innerHTML='<div class="fb-h">🏆 All 6 matched!</div><div class="fb-b">Direct = dentist present + pre-dismissal check. General = dentist may be off-site, no dismissal check required.</div>';
      document.getElementById('bd').style.display='inline-block';
    }
  } else {
    lE.classList.add('wrong');rE.classList.add('wrong');
    setTimeout(()=>{lE.classList.remove('wrong','sl');rE.classList.remove('wrong','sr');selL=null;selR=null;},400);
  }
}
function showResult(){
  document.getElementById('content').innerHTML=`<div class="result active">
    <div class="remoji">🏆</div><div class="rpct">6/6</div>
    <div class="rtitle">All Matched!</div>
    <div class="rsub">Direct Supervision = dentist physically present + checks before dismissal. General Supervision = dentist can be off-site, no pre-dismissal check required.</div>
    <button class="btn-retry" onclick="init()">Play Again 🔄</button>
  </div>`;
  document.getElementById('bd').style.display='none';
}
init();
</script>
</body>
</html>
