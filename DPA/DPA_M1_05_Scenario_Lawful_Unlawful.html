<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0f0e17;color:#f0eeff;font-family:'Inter',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);}
.t-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#ec4899,#f97316);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.t-info{flex:1;min-width:0;}
.t-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#fff;}
.prow{display:flex;align-items:center;gap:7px;margin-top:3px;}
.pbg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.pfill{height:5px;border-radius:99px;background:linear-gradient(90deg,#ec4899,#f97316);transition:width .4s ease;}
.plabel{font-size:10px;color:#9d9bb8;white-space:nowrap;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;}
.inner{width:100%;max-width:660px;display:flex;flex-direction:column;gap:8px;}
.qtag{display:inline-flex;align-items:center;background:rgba(236,72,153,.15);border:1px solid rgba(236,72,153,.3);color:#f9a8d4;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;align-self:flex-start;}
.scard{background:linear-gradient(135deg,rgba(236,72,153,.08),rgba(249,115,22,.05));border:1.5px solid rgba(236,72,153,.2);border-radius:13px;padding:12px 16px;}
.slabel{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:#f9a8d4;font-weight:800;margin-bottom:6px;}
.stext{font-family:'Nunito',sans-serif;font-size:clamp(12px,1.9vw,16px);font-weight:800;color:#fff;line-height:1.35;}
.opts{display:flex;flex-direction:column;gap:6px;}
.opt{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.09);border-radius:10px;padding:8px 13px;cursor:pointer;font-size:clamp(10px,1.5vw,12.5px);font-weight:600;color:#d4d0f0;text-align:left;transition:all .18s;display:flex;align-items:flex-start;gap:9px;line-height:1.3;}
.ol{width:24px;height:24px;min-width:24px;border-radius:6px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;margin-top:1px;transition:all .18s;flex-shrink:0;}
.opt:hover:not(:disabled){border-color:#ec4899;background:rgba(236,72,153,.09);transform:translateX(3px);}
.opt:hover .ol{background:#ec4899;}
.opt.correct{border-color:#10b981;background:rgba(16,185,129,.1);}
.opt.correct .ol{background:#10b981;color:#fff;}
.opt.incorrect{border-color:#ef4444;background:rgba(239,68,68,.09);}
.opt.incorrect .ol{background:#ef4444;color:#fff;}
.opt:disabled{cursor:default;transform:none!important;}
.fb{padding:9px 13px;border-radius:10px;display:none;animation:su .25s ease;}
@keyframes su{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fb.correct{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);}
.fb.incorrect{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.3);}
.fb-h{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;margin-bottom:3px;}
.fb-h.correct{color:#34d399;}.fb-h.incorrect{color:#f87171;}
.fb-b{font-size:11px;color:#d4d0f0;line-height:1.4;}
.footer{flex-shrink:0;padding:9px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);}
.qc{font-size:11px;color:#9d9bb8;}
.btn-next{background:linear-gradient(135deg,#ec4899,#f97316);color:#fff;border:none;border-radius:9px;padding:8px 22px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:none;box-shadow:0 3px 14px rgba(236,72,153,.4);}
.result{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;height:100%;gap:6px;}
.result.active{display:flex;}
.remoji{font-size:clamp(48px,8vw,72px);animation:bounce .5s ease;}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.rpct{font-family:'Nunito',sans-serif;font-size:clamp(40px,7vw,56px);font-weight:900;background:linear-gradient(135deg,#ec4899,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.rtitle{font-family:'Nunito',sans-serif;font-size:clamp(18px,3vw,24px);font-weight:900;color:#fff;}
.rsub{font-size:clamp(12px,1.8vw,14px);color:#9d9bb8;line-height:1.4;}
.btn-retry{background:linear-gradient(135deg,#ec4899,#f97316);color:#fff;border:none;border-radius:11px;padding:12px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="t-icon">🎭</div>
    <div class="t-info">
      <div class="t-title">What Would You Do?</div>
      <div class="prow"><div class="pbg"><div class="pfill" id="pf" style="width:0%"></div></div><span class="plabel" id="pl">0/5</span></div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer">
    <span class="qc" id="qc">Scenario 1 of 5</span>
    <button class="btn-next" id="bn" onclick="next()">Next →</button>
  </div>
</div>
<script>
const Q=[
  {q:'The dentist has left the office. The RDA performs a mouth-mirror inspection and documents obvious lesions. Lawful?',o:['Yes — RDA expanded duty under General Supervision','No — dentist must be present for expanded duties','No — only RDAEF may document existing restorations','Yes — but only with written patient consent'],c:0,f:'✅ LAWFUL! Mouth-mirror inspection is an RDA expanded duty under BPC § 1752.4 performable under GENERAL Supervision — dentist need not be present.'},
  {q:'An unlicensed DA places, condenses, and carves a direct restoration after the dentist prepares the tooth. Lawful?',o:['Yes — if directly supervised','Yes — if the DA completed a Board-approved course','No — this is an RDAEF extended function only','No — restorations may only be placed by a dentist'],c:2,f:'🚫 UNLAWFUL! Placing, condensing, and carving direct restorations is an RDAEF extended function under BPC § 1753.5 — far beyond unlicensed DA scope regardless of supervision.'},
  {q:'The office hasn\'t posted a list of delegated duties. An inspector arrives. What happens?',o:['No consequence — posting is voluntary','Compliance violation under CCR § 1068','Only the DAs are cited, not the dentist','The office has 30 days to post with no penalty'],c:1,f:'⚠️ COMPLIANCE VIOLATION! CCR § 1068 requires the delegated duties list posted in a common area visible to all staff. Inspectors check for this every visit.'},
  {q:'An RDAEF cements a permanent indirect restoration while the dentist is at lunch off-site. Lawful?',o:['Yes — RDAEFs may work under General Supervision','No — all RDAEF duties need DIRECT supervision; dentist must be present','Yes — a written order was left before the dentist left','No — only dentists may cement permanent restorations'],c:1,f:'🚫 UNLAWFUL! ALL RDAEF extended functions require DIRECT supervision under BPC § 1753.5 — dentist must be physically present. Off-site = clear violation.'},
  {q:'A staff member wears a nametag in 12-point font listing "DA." A BPC § 700 inspection occurs. Compliant?',o:['Yes — any nametag with license status is sufficient','No — nametag text must be ≥ 18 pt under BPC § 700/§ 680','Yes — 12 pt is the required minimum','No — only licensed staff must wear nametags'],c:1,f:'⚠️ NOT COMPLIANT! BPC § 700/§ 680 requires name and license status in type of AT LEAST 18 pt. A 12-point font is a violation.'}
];
let cur=0,score=0,ans=false;
function render(){
  ans=false;document.getElementById('bn').style.display='none';
  const q=Q[cur];
  document.getElementById('pf').style.width=Math.round(cur/Q.length*100)+'%';
  document.getElementById('pl').textContent=cur+'/'+Q.length;
  document.getElementById('qc').textContent='Scenario '+(cur+1)+' of '+Q.length;
  document.getElementById('content').innerHTML=`<div class="inner">
    <div class="qtag">🎭 Scenario ${cur+1} of ${Q.length}</div>
    <div class="scard"><div class="slabel">Real-World Situation</div><div class="stext">${q.q}</div></div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="answer(${i})"><span class="ol">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
}
function answer(i){
  if(ans)return;ans=true;
  const q=Q[cur],ok=i===q.c;if(ok)score++;
  const btns=document.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);
  btns[i].classList.add(ok?'correct':'incorrect');
  if(!ok)btns[q.c].classList.add('correct');
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'correct':'incorrect');fb.style.display='block';
  fb.innerHTML=`<div class="fb-h ${ok?'correct':'incorrect'}">${ok?'🎉 Correct!':'😬 Not quite!'}</div><div class="fb-b">${q.f}</div>`;
  document.getElementById('bn').style.display='inline-block';
}
function next(){cur++;cur>=Q.length?done():render();}
function done(){
  const p=Math.round(score/Q.length*100);
  document.getElementById('pf').style.width='100%';document.getElementById('pl').textContent=Q.length+'/'+Q.length;
  document.getElementById('qc').textContent='';document.getElementById('bn').style.display='none';
  document.getElementById('content').innerHTML=`<div class="result active">
    <div class="remoji">${p===100?'🏆':p>=80?'🎯':p>=60?'💪':'📖'}</div>
    <div class="rpct">${p}%</div>
    <div class="rtitle">${p===100?'Perfect!':p>=80?'Sharp Eye!':p>=60?'Good Effort':'Keep Practicing!'}</div>
    <div class="rsub">You got <strong>${score}</strong> of <strong>${Q.length}</strong> scenarios correct.</div>
    <button class="btn-retry" onclick="cur=0;score=0;render()">Try Again 🔄</button>
  </div>`;
}
render();
</script>
</body>
</html>
