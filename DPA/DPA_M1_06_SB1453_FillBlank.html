<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB 1453 Fill-in-the-Blank</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0f0e17;color:#f0eeff;font-family:'Inter',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);}
.t-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#fbbf24,#f97316);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.t-info{flex:1;min-width:0;}
.t-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#fff;}
.prow{display:flex;align-items:center;gap:7px;margin-top:3px;}
.pbg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.pfill{height:5px;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#f97316);transition:width .4s ease;}
.plabel{font-size:10px;color:#9d9bb8;white-space:nowrap;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px 16px;}
.inner{width:100%;max-width:600px;display:flex;flex-direction:column;gap:12px;}
.qtag{display:inline-flex;align-items:center;background:rgba(251,191,36,.15);border:1px solid rgba(251,191,36,.3);color:#fde68a;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;align-self:flex-start;}
.qdir{font-size:12px;color:#9d9bb8;}
.swrap{background:linear-gradient(135deg,rgba(251,191,36,.07),rgba(249,115,22,.05));border:2px solid rgba(251,191,36,.2);border-radius:14px;padding:18px 20px;}
.sentence{font-family:'Nunito',sans-serif;font-size:clamp(15px,2.5vw,21px);font-weight:800;color:#fff;line-height:1.6;}
.blank{display:inline-block;min-width:140px;padding:2px 10px;border-bottom:3px solid #fbbf24;color:#fbbf24;font-weight:900;text-align:center;border-radius:4px 4px 0 0;transition:all .3s;}
.blank.correct{border-color:#10b981;color:#10b981;background:rgba(16,185,129,.08);}
.blank.incorrect{border-color:#ef4444;color:#ef4444;background:rgba(239,68,68,.07);}
.chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);border-radius:22px;padding:7px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;font-family:'Nunito',sans-serif;color:#f0eeff;}
.chip:hover:not(.used){border-color:#fbbf24;background:rgba(251,191,36,.12);color:#fbbf24;transform:scale(1.04);}
.chip.used{opacity:.3;cursor:default;pointer-events:none;}
.fb{padding:10px 14px;border-radius:11px;display:none;animation:su .25s ease;}
@keyframes su{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fb.correct{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);}
.fb.incorrect{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.3);}
.fb-h{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;margin-bottom:3px;}
.fb-h.correct{color:#34d399;}.fb-h.incorrect{color:#f87171;}
.fb-b{font-size:11px;color:#d4d0f0;line-height:1.4;}
.footer{flex-shrink:0;padding:9px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);}
.qc{font-size:11px;color:#9d9bb8;}
.btn-next{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;border:none;border-radius:9px;padding:8px 22px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:none;box-shadow:0 3px 14px rgba(251,191,36,.4);}
.result{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;height:100%;gap:6px;}
.result.active{display:flex;}
.remoji{font-size:clamp(48px,8vw,72px);animation:bounce .5s ease;}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.rpct{font-family:'Nunito',sans-serif;font-size:clamp(40px,7vw,56px);font-weight:900;background:linear-gradient(135deg,#fbbf24,#f97316);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.rtitle{font-family:'Nunito',sans-serif;font-size:clamp(18px,3vw,24px);font-weight:900;color:#fff;}
.rsub{font-size:clamp(11px,1.8vw,13px);color:#9d9bb8;max-width:380px;line-height:1.45;}
.btn-retry{background:linear-gradient(135deg,#fbbf24,#f97316);color:#fff;border:none;border-radius:11px;padding:12px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="t-icon">📅</div>
    <div class="t-info">
      <div class="t-title">SB 1453 Fill-in-the-Blank</div>
      <div class="prow"><div class="pbg"><div class="pfill" id="pf" style="width:0%"></div></div><span class="plabel" id="pl">0/4</span></div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer">
    <span class="qc" id="qc">Question 1 of 4</span>
    <button class="btn-next" id="bn" onclick="next()">Next →</button>
  </div>
</div>
<script>
const Q=[
  {b:'Duty and scope changes from SB 1453 took effect on',a:'.',ch:['July 1, 2025','January 1, 2025','January 1, 2024','July 1, 2024'],ans:'January 1, 2025',f:'📅 January 1, 2025 — Duty/scope changes: coronal polishing, ortho appliance exam, nitrous oxide adjustment, infection control course, RDA ortho bands.'},
  {b:'The three new RDA licensure pathways created by SB 1453 took effect on',a:'.',ch:['January 1, 2025','July 1, 2025','January 1, 2026','September 1, 2025'],ans:'July 1, 2025',f:'📅 July 1, 2025 — DANB CDA exam, Alternative Program, and Preceptorship pathways all start here. SB 1453 has TWO key dates!'},
  {b:'The DANB',a:'exam is one of the new pathways to RDA licensure under SB 1453.',ch:['RDA','CDA','RDAEF','DDS'],ans:'CDA',f:'🎓 DANB CDA (Certified Dental Assistant) exam — this national certification is now a valid California RDA licensure pathway as of July 1, 2025.'},
  {b:'The Alternative Dental Assisting Program requires at least',a:'hours of didactic training plus ≥300 hours of supervised clinical experience.',ch:['300','400','500','1280'],ans:'500',f:'📚 500 hrs didactic + 300 hrs directly supervised clinical chairside = Alternative Dental Assisting Program pathway (BPC § 1750.1, eff. July 1, 2025).'}
];
let cur=0,score=0;
function render(){
  document.getElementById('bn').style.display='none';
  const q=Q[cur];
  document.getElementById('pf').style.width=Math.round(cur/Q.length*100)+'%';
  document.getElementById('pl').textContent=cur+'/'+Q.length;
  document.getElementById('qc').textContent='Question '+(cur+1)+' of '+Q.length;
  const sh=[...q.ch].sort(()=>Math.random()-.5);
  document.getElementById('content').innerHTML=`<div class="inner">
    <div class="qtag">📅 SB 1453 · Q${cur+1}/${Q.length}</div>
    <div class="qdir">Tap the correct answer to fill in the blank ⬇️</div>
    <div class="swrap"><div class="sentence">${q.b} <span id="bs" class="blank">___</span> ${q.a}</div></div>
    <div class="chips">${sh.map((c,i)=>`<div class="chip" id="cp${i}" onclick="pick('${c.replace(/'/g,"\\'")}','${q.ans.replace(/'/g,"\\'")}',this)">${c}</div>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
}
function pick(chosen,answer,el){
  if(el.classList.contains('used'))return;
  document.querySelectorAll('.chip').forEach(c=>c.classList.add('used'));
  const bs=document.getElementById('bs');
  bs.textContent=chosen;
  const ok=chosen===answer;if(ok)score++;
  bs.className='blank '+(ok?'correct':'incorrect');
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'correct':'incorrect');fb.style.display='block';
  fb.innerHTML=`<div class="fb-h ${ok?'correct':'incorrect'}">${ok?'🎉 Correct!':'😬 Answer: '+answer}</div><div class="fb-b">${Q[cur].f}</div>`;
  document.getElementById('bn').style.display='inline-block';
}
function next(){cur++;cur>=Q.length?done():render();}
function done(){
  const p=Math.round(score/Q.length*100);
  document.getElementById('pf').style.width='100%';document.getElementById('pl').textContent=Q.length+'/'+Q.length;
  document.getElementById('qc').textContent='';document.getElementById('bn').style.display='none';
  document.getElementById('content').innerHTML=`<div class="result active">
    <div class="remoji">${p===100?'🏆':p>=75?'🎯':'📖'}</div>
    <div class="rpct">${p}%</div>
    <div class="rtitle">${p===100?'Perfect!':p>=75?'Well Done!':'Review SB 1453!'}</div>
    <div class="rsub">You got <strong>${score}</strong> of <strong>${Q.length}</strong> correct.<br>🗓️ Jan 1, 2025 = duties · July 1, 2025 = new pathways</div>
    <button class="btn-retry" onclick="cur=0;score=0;render()">Try Again 🔄</button>
  </div>`;
}
render();
</script>
</body>
</html>
