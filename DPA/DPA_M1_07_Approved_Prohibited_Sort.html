<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Approved or Prohibited?</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0f0e17;color:#f0eeff;font-family:'Inter',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);}
.t-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#10b981,#ef4444);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.t-info{flex:1;min-width:0;}
.t-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#fff;}
.prow{display:flex;align-items:center;gap:7px;margin-top:3px;}
.pbg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.pfill{height:5px;border-radius:99px;background:linear-gradient(90deg,#10b981,#06b6d4);transition:width .4s ease;}
.plabel{font-size:10px;color:#9d9bb8;white-space:nowrap;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 14px;}
.inner{width:100%;max-width:760px;display:flex;flex-direction:column;gap:7px;}
.qtag{display:inline-flex;align-items:center;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.25);color:#6ee7b7;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;align-self:flex-start;}
.qsub{font-size:11px;color:#9d9bb8;}
.pool-wrap{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:11px;padding:8px 10px;}
.pool-label{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:#9d9bb8;margin-bottom:6px;}
.pool{display:flex;flex-wrap:wrap;gap:5px;min-height:30px;}
.chip{background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;cursor:pointer;transition:all .18s;color:#d4d0f0;user-select:none;font-family:'Nunito',sans-serif;}
.chip:hover:not(.used){border-color:#a78bfa;background:rgba(124,58,237,.1);}
.chip.sel{border-color:#fbbf24;background:rgba(251,191,36,.12);color:#fde68a;transform:scale(1.04);}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.zone{border-radius:12px;padding:10px;cursor:pointer;transition:all .18s;border:2px dashed;}
.zone.ap{background:rgba(16,185,129,.06);border-color:rgba(16,185,129,.25);}
.zone.pr{background:rgba(239,68,68,.06);border-color:rgba(239,68,68,.25);}
.zone.ap:hover{background:rgba(16,185,129,.1);border-color:#10b981;}
.zone.pr:hover{background:rgba(239,68,68,.1);border-color:#ef4444;}
.zh{display:flex;align-items:center;gap:6px;margin-bottom:6px;}
.zi{font-size:15px;}
.zl{font-family:'Nunito',sans-serif;font-size:12px;font-weight:900;}
.zone.ap .zl{color:#34d399;}.zone.pr .zl{color:#f87171;}
.zi-list{display:flex;flex-direction:column;gap:4px;}
.pi{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:6px;font-family:'Nunito',sans-serif;}
.pi.ap{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);color:#6ee7b7;}
.pi.pr{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.2);color:#fca5a5;}
.shake{animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.fb{padding:9px 13px;border-radius:10px;display:none;animation:su .25s ease;}
@keyframes su{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fb.ok{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);}
.fb-h{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;margin-bottom:3px;color:#34d399;}
.fb-b{font-size:11px;color:#d4d0f0;line-height:1.4;}
.footer{flex-shrink:0;padding:9px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);}
.qc{font-size:11px;color:#9d9bb8;}
.btn-done{background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;border:none;border-radius:9px;padding:8px 22px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:none;box-shadow:0 3px 14px rgba(16,185,129,.35);}
.result{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;height:100%;gap:6px;}
.result.active{display:flex;}
.remoji{font-size:clamp(48px,8vw,72px);animation:bounce .5s ease;}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.rpct{font-family:'Nunito',sans-serif;font-size:clamp(40px,7vw,56px);font-weight:900;background:linear-gradient(135deg,#10b981,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.rtitle{font-family:'Nunito',sans-serif;font-size:clamp(18px,3vw,24px);font-weight:900;color:#fff;}
.rsub{font-size:clamp(11px,1.8vw,13px);color:#9d9bb8;max-width:400px;line-height:1.4;}
.btn-retry{background:linear-gradient(135deg,#10b981,#06b6d4);color:#fff;border:none;border-radius:11px;padding:12px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="t-icon">🗂️</div>
    <div class="t-info">
      <div class="t-title">Approved or Prohibited?</div>
      <div class="prow"><div class="pbg"><div class="pfill" id="pf" style="width:0%"></div></div><span class="plabel" id="pl">0/10</span></div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer">
    <span class="qc" id="qc">0 / 10 sorted</span>
    <button class="btn-done" id="bd" onclick="showResult()">Done! 🎉</button>
  </div>
</div>
<script>
const items=[
  {t:'Apply fluoride varnish',c:0},{t:'Diagnose carious lesions',c:1},
  {t:'Remove periodontal dressings',c:0},{t:'Place a permanent restoration',c:1},
  {t:'Intraoral photography',c:0},{t:'Cut hard tissue',c:1},
  {t:'Place and remove rubber dams',c:0},{t:'Administer IV anesthesia (unlicensed)',c:1},
  {t:'Operate radiographic equipment (with course)',c:0},{t:'Perform an irreversible procedure',c:1}
];
let placed=0,selected=null,pool;
function init(){placed=0;selected=null;pool=[...items].map((it,i)=>({...it,id:i,_p:false})).sort(()=>Math.random()-.5);render();}
function render(){
  document.getElementById('pf').style.width=Math.round(placed/items.length*100)+'%';
  document.getElementById('pl').textContent=placed+'/'+items.length;
  document.getElementById('qc').textContent=placed+' / '+items.length+' sorted';
  const rem=pool.filter(i=>!i._p);
  const ap=pool.filter(i=>i._p&&i.c===0);
  const pr=pool.filter(i=>i._p&&i.c===1);
  document.getElementById('content').innerHTML=`<div class="inner">
    <div class="qtag">🗂️ BPC § 1750 · Sort &amp; Classify</div>
    <div class="qsub">Tap a duty (gold = selected) → tap the correct zone. Wrong = shake!</div>
    <div class="pool-wrap">
      <div class="pool-label">Duties to Sort</div>
      <div class="pool">
        ${rem.map(item=>`<div class="chip${selected===item.id?' sel':''}" id="chip${item.id}" onclick="selChip(${item.id})">${item.t}</div>`).join('')}
        ${rem.length===0?'<span style="font-size:11px;color:#6b7280;font-style:italic">All sorted! ✨</span>':''}
      </div>
    </div>
    <div class="zones">
      <div class="zone ap" onclick="place(0)">
        <div class="zh"><span class="zi">✅</span><span class="zl">Approved for Unlicensed DA</span></div>
        <div class="zi-list">${ap.map(i=>`<div class="pi ap">✓ ${i.t}</div>`).join('')}</div>
      </div>
      <div class="zone pr" onclick="place(1)">
        <div class="zh"><span class="zi">🚫</span><span class="zl">Prohibited for Unlicensed DA</span></div>
        <div class="zi-list">${pr.map(i=>`<div class="pi pr">✗ ${i.t}</div>`).join('')}</div>
      </div>
    </div>
    <div class="fb" id="fb"></div>
  </div>`;
}
function selChip(id){selected=id;render();}
function place(z){
  if(selected===null)return;
  const item=pool.find(i=>i.id===selected);
  if(!item||item._p)return;
  const ok=item.c===z;
  if(ok){
    item._p=true;placed++;selected=null;
    if(placed===items.length){
      render();
      const fb=document.getElementById('fb');
      fb.className='fb ok';fb.style.display='block';
      fb.innerHTML='<div class="fb-h">🏆 All 10 sorted!</div><div class="fb-b">Key rule: if it\'s irreversible, involves diagnosis, or cuts tissue → PROHIBITED for unlicensed DAs (BPC § 1750).</div>';
      document.getElementById('bd').style.display='inline-block';
    } else {render();}
  } else {
    selected=null;render();
    const el=document.getElementById('chip'+item.id);
    if(el){el.classList.add('shake');setTimeout(()=>el&&el.classList.remove('shake'),350);}
  }
}
function showResult(){
  document.getElementById('content').innerHTML=`<div class="result active">
    <div class="remoji">🏆</div><div class="rpct">10/10</div>
    <div class="rtitle">All Sorted!</div>
    <div class="rsub">Reversibility test: if it can't be undone, it's not a basic supportive duty (BPC § 1750(a)).</div>
    <button class="btn-retry" onclick="pool.forEach(i=>i._p=false);init()">Play Again 🔄</button>
  </div>`;
  document.getElementById('bd').style.display='none';
}
init();
</script>
</body>
</html>
