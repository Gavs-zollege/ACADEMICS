<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Module 1 Final Review</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0f0e17;color:#f0eeff;font-family:'Inter',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);}
.t-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#fbbf24,#ec4899,#7c3aed);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.t-info{flex:1;min-width:0;}
.t-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#fff;}
.prow{display:flex;align-items:center;gap:7px;margin-top:3px;}
.pbg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.pfill{height:5px;border-radius:99px;background:linear-gradient(90deg,#fbbf24,#ec4899,#7c3aed);transition:width .4s ease;}
.plabel{font-size:10px;color:#9d9bb8;white-space:nowrap;}
/* INTRO */
.intro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;height:100%;gap:8px;}
.iemoji{font-size:clamp(48px,8vw,64px);}
.ititle{font-family:'Nunito',sans-serif;font-size:clamp(20px,4vw,32px);font-weight:900;background:linear-gradient(135deg,#fbbf24,#ec4899,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.15;}
.isub{font-size:clamp(12px,1.8vw,14px);color:#9d9bb8;max-width:420px;line-height:1.5;}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;}
.pill{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:4px 12px;font-size:11px;font-weight:700;color:#9d9bb8;}
.pill.hot{background:rgba(251,191,36,.12);border-color:rgba(251,191,36,.3);color:#fde68a;}
.btn-start{background:linear-gradient(135deg,#fbbf24,#ec4899,#7c3aed);color:#fff;border:none;border-radius:12px;padding:14px 36px;font-size:16px;font-weight:900;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 6px 24px rgba(236,72,153,.35);}
.btn-start:hover{opacity:.88;}
/* QUIZ */
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;}
.inner{width:100%;max-width:660px;display:flex;flex-direction:column;gap:7px;}
.qtag{display:inline-flex;align-items:center;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;align-self:flex-start;border:1px solid;}
.qtext{font-family:'Nunito',sans-serif;font-size:clamp(12px,1.9vw,16px);font-weight:800;color:#fff;line-height:1.35;}
.opts{display:flex;flex-direction:column;gap:5px;}
.opt{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.09);border-radius:9px;padding:8px 13px;cursor:pointer;font-size:clamp(10px,1.4vw,12.5px);font-weight:600;color:#d4d0f0;text-align:left;transition:all .18s;display:flex;align-items:flex-start;gap:9px;line-height:1.3;}
.ol{width:24px;height:24px;min-width:24px;border-radius:6px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;margin-top:1px;transition:all .18s;flex-shrink:0;}
.opt:hover:not(:disabled){border-color:#ec4899;background:rgba(236,72,153,.09);transform:translateX(3px);}
.opt:hover .ol{background:#ec4899;}
.opt.correct{border-color:#10b981;background:rgba(16,185,129,.1);}
.opt.correct .ol{background:#10b981;color:#fff;}
.opt.incorrect{border-color:#ef4444;background:rgba(239,68,68,.09);}
.opt.incorrect .ol{background:#ef4444;color:#fff;}
.opt:disabled{cursor:default;transform:none!important;}
.fb{padding:9px 13px;border-radius:10px;display:none;animation:su .25s ease;}
@keyframes su{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.fb.correct{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);}
.fb.incorrect{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.3);}
.fb-h{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;margin-bottom:3px;}
.fb-h.correct{color:#34d399;}.fb-h.incorrect{color:#f87171;}
.fb-b{font-size:11px;color:#d4d0f0;line-height:1.4;}
.footer{flex-shrink:0;padding:9px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);}
.qc{font-size:11px;color:#9d9bb8;}
.btn-next{background:linear-gradient(135deg,#fbbf24,#ec4899);color:#fff;border:none;border-radius:9px;padding:8px 22px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:none;box-shadow:0 3px 14px rgba(236,72,153,.35);}
/* RESULT */
.result{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;height:100%;gap:6px;}
.result.active{display:flex;}
.remoji{font-size:clamp(48px,8vw,72px);animation:bounce .5s ease;}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
.rpct{font-family:'Nunito',sans-serif;font-size:clamp(40px,7vw,58px);font-weight:900;background:linear-gradient(135deg,#fbbf24,#ec4899,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.rtitle{font-family:'Nunito',sans-serif;font-size:clamp(18px,3vw,24px);font-weight:900;color:#fff;}
.rsub{font-size:clamp(11px,1.8vw,13px);color:#9d9bb8;max-width:400px;line-height:1.4;}
.stats{display:flex;gap:10px;}
.stat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:10px 16px;text-align:center;}
.sv{font-family:'Nunito',sans-serif;font-size:clamp(22px,4vw,28px);font-weight:900;}
.sl{font-size:10px;color:#9d9bb8;text-transform:uppercase;letter-spacing:.5px;margin-top:2px;}
.stat.g .sv{color:#34d399;}.stat.r .sv{color:#f87171;}
.btn-retry{background:linear-gradient(135deg,#fbbf24,#ec4899,#7c3aed);color:#fff;border:none;border-radius:11px;padding:12px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 5px 20px rgba(236,72,153,.35);}
/* Tag colors per question */
.tc0{background:rgba(124,58,237,.15);border-color:rgba(124,58,237,.3);color:#c4b5fd;}
.tc1{background:rgba(6,182,212,.15);border-color:rgba(6,182,212,.3);color:#67e8f9;}
.tc2{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);color:#6ee7b7;}
.tc3{background:rgba(236,72,153,.15);border-color:rgba(236,72,153,.3);color:#f9a8d4;}
.tc4{background:rgba(251,191,36,.15);border-color:rgba(251,191,36,.3);color:#fde68a;}
.tc5{background:rgba(249,115,22,.15);border-color:rgba(249,115,22,.3);color:#fdba74;}
.tc6{background:rgba(167,139,250,.15);border-color:rgba(167,139,250,.3);color:#c4b5fd;}
.tc7{background:rgba(34,211,238,.15);border-color:rgba(34,211,238,.3);color:#67e8f9;}
.tc8{background:rgba(52,211,153,.15);border-color:rgba(52,211,153,.3);color:#6ee7b7;}
.tc9{background:rgba(248,113,113,.15);border-color:rgba(248,113,113,.3);color:#fca5a5;}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="t-icon">🏆</div>
    <div class="t-info">
      <div class="t-title">Module 1 Final Review</div>
      <div class="prow"><div class="pbg"><div class="pfill" id="pf" style="width:0%"></div></div><span class="plabel" id="pl">0/10</span></div>
    </div>
  </div>
  <div class="content" id="content">
    <div class="intro">
      <div class="iemoji">🏆</div>
      <div class="ititle">Module 1 Final Review</div>
      <div class="isub">10-question comprehensive challenge covering Career Ladder, Supervision, DA Duties, SB 1453, RDAEF, and Office Compliance.</div>
      <div class="pills">
        <div class="pill hot">10 Questions</div>
        <div class="pill">BPC §§ 1740–1777</div>
        <div class="pill">CCR Title 16</div>
        <div class="pill">SB 1453</div>
      </div>
      <button class="btn-start" onclick="start()">Start Final Review 🚀</button>
    </div>
  </div>
  <div class="footer">
    <span class="qc" id="qc"></span>
    <button class="btn-next" id="bn" onclick="next()">Next →</button>
  </div>
</div>
<script>
const TL=['Career Ladder','Regulatory Boards','Reversibility Test','Criminal Liability','SB 1453 · Infection Control','RDA Expanded Duties','New RDA Pathways','Supervision Requirements','RDAEF Limit','Office Posting'];
const TC=['tc0','tc1','tc2','tc3','tc4','tc5','tc6','tc7','tc8','tc9'];
const Q=[
  {q:'The career ladder from lowest to highest dental assisting licensure in California is:',o:['RDA → RDAEF → Unlicensed DA','Unlicensed DA → RDA → RDAEF','RDAEF → RDA → Unlicensed DA','Unlicensed DA → RDAEF → RDA'],c:1,f:'🪜 Unlicensed DA (no license) → RDA (licensed by DBC) → RDAEF (highest). Each level requires additional licensing per BPC § 1740.'},
  {q:'Which regulatory board governs Registered Dental Hygienists (RDH)?',o:['The Dental Board of California (DBC)','The California Medical Board','The Dental Hygiene Board of California','The Bureau of Occupational Licensing'],c:2,f:'🏛️ The Dental Hygiene Board of California — a SEPARATE board from the DBC. The DBC does NOT regulate hygienists.'},
  {q:'The "reversibility test" under BPC § 1750(a) means:',o:['An unlicensed DA must undo any procedure they perform','Only reversible anesthesia may be used','A basic supportive procedure must be completely reversible and unlikely to cause harm','The dentist must reverse any procedure before billing'],c:2,f:'🔄 Completely reversible + technically elementary + unlikely to cause harm. If it can\'t be undone → outside unlicensed DA scope.'},
  {q:'Which code section makes it criminal for a dentist to allow an unlicensed person to perform illegal dental functions?',o:['BPC § 1740','BPC § 1750.1','BPC § 1684','CCR § 1068'],c:2,f:'⚖️ BPC § 1684 — both the performer AND the dentist who aids or abets face criminal charges + Board discipline.'},
  {q:'Under SB 1453 (eff. Jan. 1, 2025), an unlicensed DA must complete a Board-approved infection control course of how many hours before any procedure involving blood or saliva?',o:['4 hours','6 hours','8 hours','12 hours'],c:2,f:'🦠 8-hour Board-approved infection control course — required before ANY procedure with blood or saliva exposure (SB 1453, eff. Jan. 1, 2025).'},
  {q:'An RDA applying bleaching agents using a non-laser light-curing device requires which supervision level?',o:['General Supervision','Direct Supervision','No supervision required','Indirect Supervision'],c:1,f:'💡 DIRECT Supervision — dentist physically present. Per BPC § 1752.4, bleaching with non-laser light cure = RDA expanded duty requiring direct supervision.'},
  {q:'The Alternative Dental Assisting Program pathway (SB 1453) requires at minimum:',o:['300 hrs didactic + 500 hrs clinical','500 hrs didactic + 300 hrs directly supervised clinical','1,280 hrs work experience only','500 hrs didactic only'],c:1,f:'📚 500 hrs didactic + 300 hrs directly supervised clinical chairside (BPC § 1750.1, eff. July 1, 2025).'},
  {q:'Both Direct and General Supervision share which requirement?',o:['Dentist must be physically present','A pre-dismissal check by the dentist','A written order prior to the procedure','Dentist must countersign all records immediately'],c:2,f:'📝 Written order BEFORE the procedure — required by both. Direct also needs physical presence + pre-dismissal check. General does not.'},
  {q:'Under BPC § 1763, the maximum number of RDAEFs per supervising dentist is:',o:['1','2','3','Unlimited'],c:1,f:'👥 MAX 2 RDAEFs per supervising dentist (BPC § 1763). This cap applies only to RDAEFs.'},
  {q:'Which must be posted in the office under CCR § 1068?',o:['Each provider\'s salary schedule','A list of all procedures delegated to auxiliaries','The dental fee schedule','Patient rights and HIPAA notices only'],c:1,f:'📌 Delegated duties list — posted in a common area visible to ALL staff. First thing inspectors check.'}
];
let cur=0,score=0,ans=false;
function start(){render();}
function render(){
  ans=false;document.getElementById('bn').style.display='none';
  const q=Q[cur];
  document.getElementById('pf').style.width=Math.round(cur/Q.length*100)+'%';
  document.getElementById('pl').textContent=cur+'/'+Q.length;
  document.getElementById('qc').textContent='Question '+(cur+1)+' of '+Q.length;
  document.getElementById('content').innerHTML=`<div class="inner">
    <div class="qtag ${TC[cur]}">${TL[cur]} · Q${cur+1}/10</div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="answer(${i})"><span class="ol">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
}
function answer(i){
  if(ans)return;ans=true;
  const q=Q[cur],ok=i===q.c;if(ok)score++;
  const btns=document.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);
  btns[i].classList.add(ok?'correct':'incorrect');
  if(!ok)btns[q.c].classList.add('correct');
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'correct':'incorrect');fb.style.display='block';
  fb.innerHTML=`<div class="fb-h ${ok?'correct':'incorrect'}">${ok?'🎉 Correct!':'😬 Not quite!'}</div><div class="fb-b">${q.f}</div>`;
  document.getElementById('bn').style.display='inline-block';
}
function next(){cur++;cur>=Q.length?done():render();}
function done(){
  const p=Math.round(score/Q.length*100);
  let emoji,title,msg;
  if(p===100){emoji='🏆';title='Perfect Score!';msg='You\'ve completely mastered Module 1!';}
  else if(p>=80){emoji='🎯';title='Excellent Work!';msg='Strong performance — review any missed questions.';}
  else if(p>=60){emoji='💪';title='Almost There!';msg='Good effort — review feedback for missed questions and retake.';}
  else{emoji='📖';title='More Review Needed';msg='Revisit supervision types, DA duties, and SB 1453 before retaking.';}
  document.getElementById('pf').style.width='100%';document.getElementById('pl').textContent=Q.length+'/'+Q.length;
  document.getElementById('qc').textContent='';document.getElementById('bn').style.display='none';
  document.getElementById('content').innerHTML=`<div class="result active">
    <div class="remoji">${emoji}</div>
    <div class="rpct">${p}%</div>
    <div class="rtitle">${title}</div>
    <div class="rsub">${msg}</div>
    <div class="stats">
      <div class="stat g"><div class="sv">${score}</div><div class="sl">Correct</div></div>
      <div class="stat r"><div class="sv">${Q.length-score}</div><div class="sl">Missed</div></div>
      <div class="stat"><div class="sv">${Q.length}</div><div class="sl">Total</div></div>
    </div>
    <button class="btn-retry" onclick="cur=0;score=0;render()">Retake Quiz 🔄</button>
  </div>`;
}
</script>
</body>
</html>
