<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Key Definitions Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:#0f0e17;color:#f0eeff;font-family:'Inter',sans-serif;}
.shell{display:flex;flex-direction:column;height:100vh;overflow:hidden;}
.topbar{flex-shrink:0;padding:10px 16px;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.04);border-bottom:1px solid rgba(255,255,255,.08);}
.t-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.t-info{flex:1;min-width:0;}
.t-title{font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.prow{display:flex;align-items:center;gap:7px;margin-top:3px;}
.pbg{flex:1;height:5px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
.pfill{height:5px;border-radius:99px;background:linear-gradient(90deg,#7c3aed,#ec4899);transition:width .4s ease;}
.plabel{font-size:10px;color:#9d9bb8;white-space:nowrap;}
.content{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 16px;}
.inner{width:100%;max-width:660px;display:flex;flex-direction:column;gap:8px;}
.qtag{display:inline-flex;align-items:center;background:rgba(124,58,237,.2);border:1px solid rgba(124,58,237,.4);color:#a78bfa;border-radius:20px;padding:3px 10px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;align-self:flex-start;}
.qtext{font-family:'Nunito',sans-serif;font-size:clamp(13px,2vw,17px);font-weight:800;color:#fff;line-height:1.35;}
.opts{display:flex;flex-direction:column;gap:6px;}
.opt{background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.1);border-radius:10px;padding:9px 14px;cursor:pointer;font-size:clamp(11px,1.5vw,13px);font-weight:600;color:#d4d0f0;text-align:left;transition:all .18s;display:flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;}
.ol{width:26px;height:26px;min-width:26px;border-radius:7px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;transition:all .18s;}
.opt:hover:not(:disabled){border-color:#7c3aed;background:rgba(124,58,237,.1);transform:translateX(3px);}
.opt:hover .ol{background:#7c3aed;}
.opt.correct{border-color:#10b981;background:rgba(16,185,129,.12);}
.opt.correct .ol{background:#10b981;color:#fff;}
.opt.incorrect{border-color:#ef4444;background:rgba(239,68,68,.1);}
.opt.incorrect .ol{background:#ef4444;color:#fff;}
.opt:disabled{cursor:default;transform:none!important;}
.fb{padding:10px 14px;border-radius:11px;display:none;animation:su .25s ease;}
@keyframes su{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.fb.correct{background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.3);}
.fb.incorrect{background:rgba(239,68,68,.09);border:1px solid rgba(239,68,68,.3);}
.fb-h{font-family:'Nunito',sans-serif;font-weight:900;font-size:12px;margin-bottom:3px;}
.fb-h.correct{color:#34d399;}.fb-h.incorrect{color:#f87171;}
.fb-b{font-size:11px;color:#d4d0f0;line-height:1.45;}
.footer{flex-shrink:0;padding:9px 16px;border-top:1px solid rgba(255,255,255,.07);display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);}
.qc{font-size:11px;color:#9d9bb8;}
.btn-next{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border:none;border-radius:9px;padding:8px 22px;font-size:13px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;display:none;box-shadow:0 3px 14px rgba(124,58,237,.4);}
.btn-next:hover{opacity:.88;}
.result{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;height:100%;gap:6px;}
.result.active{display:flex;}
.remoji{font-size:clamp(48px,8vw,72px);animation:bounce .5s ease;}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
.rpct{font-family:'Nunito',sans-serif;font-size:clamp(40px,7vw,56px);font-weight:900;background:linear-gradient(135deg,#7c3aed,#ec4899);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;}
.rtitle{font-family:'Nunito',sans-serif;font-size:clamp(18px,3vw,24px);font-weight:900;color:#fff;}
.rsub{font-size:clamp(12px,1.8vw,14px);color:#9d9bb8;max-width:360px;line-height:1.4;}
.btn-retry{background:linear-gradient(135deg,#7c3aed,#ec4899);color:#fff;border:none;border-radius:11px;padding:12px 28px;font-size:15px;font-weight:800;font-family:'Nunito',sans-serif;cursor:pointer;box-shadow:0 5px 20px rgba(124,58,237,.4);}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="t-icon">📖</div>
    <div class="t-info">
      <div class="t-title">Key Definitions Quiz</div>
      <div class="prow"><div class="pbg"><div class="pfill" id="pf" style="width:0%"></div></div><span class="plabel" id="pl">0/5</span></div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <div class="footer">
    <span class="qc" id="qc">Question 1 of 5</span>
    <button class="btn-next" id="bn" onclick="next()">Next →</button>
  </div>
</div>
<script>
const Q=[
  {q:'Under BPC § 1741, which supervision type requires the dentist to be physically present in the treatment facility during the procedure?',o:['General Supervision','Direct Supervision','Indirect Supervision','Remote Supervision'],c:1,f:'Direct Supervision requires the dentist to be physically present AND check/approve work before the patient is dismissed.'},
  {q:'A Basic Supportive Procedure must be all of the following EXCEPT:',o:['Technically elementary','Irreversible if done correctly','Completely reversible','Unlikely to precipitate hazardous conditions'],c:1,f:'A basic supportive procedure must be completely REVERSIBLE. If it cannot be undone, it exceeds an unlicensed DA\'s scope (BPC § 1750(a)).'},
  {q:'BPC § 1740 states that the Legislature intends to:',o:['Restrict the duties of dental auxiliaries','Create a single licensing level for all staff','Permit the full utilization of dental assistants to meet the state\'s needs','Transfer hygienist regulation to the Dental Board'],c:2,f:'BPC § 1740 creates the career ladder and establishes the Legislature\'s intent to permit FULL UTILIZATION of dental assistants to meet California\'s dental care needs.'},
  {q:'Under General Supervision, which of the following is TRUE?',o:['The dentist must be physically present','No written order is required','The dentist may be off-premises; no pre-dismissal check required','It only applies to RDAEF-level duties'],c:2,f:'Under General Supervision the dentist gives instructions but is NOT required to be on-site, and no pre-dismissal check is required — though the dentist remains legally responsible.'},
  {q:'Who determines whether an unlicensed dental assistant is competent to perform a basic supportive procedure?',o:['The Dental Board of California','The patient','The supervising dentist','The office manager'],c:2,f:'BPC § 1750(a): the SUPERVISING DENTIST determines competency. This responsibility cannot be delegated to anyone else.'}
];
let cur=0,score=0,ans=false;
function render(){
  ans=false;document.getElementById('bn').style.display='none';
  const q=Q[cur];
  document.getElementById('pf').style.width=Math.round(cur/Q.length*100)+'%';
  document.getElementById('pl').textContent=cur+'/'+Q.length;
  document.getElementById('qc').textContent='Question '+(cur+1)+' of '+Q.length;
  document.getElementById('content').innerHTML=`<div class="inner">
    <div class="qtag">📚 BPC § 1741 · Q${cur+1}/${Q.length}</div>
    <div class="qtext">${q.q}</div>
    <div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="answer(${i})"><span class="ol">${String.fromCharCode(65+i)}</span>${o}</button>`).join('')}</div>
    <div class="fb" id="fb"></div>
  </div>`;
}
function answer(i){
  if(ans)return;ans=true;
  const q=Q[cur],ok=i===q.c;if(ok)score++;
  const btns=document.querySelectorAll('.opt');btns.forEach(b=>b.disabled=true);
  btns[i].classList.add(ok?'correct':'incorrect');
  if(!ok)btns[q.c].classList.add('correct');
  const fb=document.getElementById('fb');
  fb.className='fb '+(ok?'correct':'incorrect');fb.style.display='block';
  fb.innerHTML=`<div class="fb-h ${ok?'correct':'incorrect'}">${ok?'🎉 Correct!':'😬 Not quite!'}</div><div class="fb-b">${q.f}</div>`;
  document.getElementById('bn').style.display='inline-block';
}
function next(){cur++;cur>=Q.length?done():render();}
function done(){
  const p=Math.round(score/Q.length*100);
  document.getElementById('pf').style.width='100%';document.getElementById('pl').textContent=Q.length+'/'+Q.length;
  document.getElementById('qc').textContent='';document.getElementById('bn').style.display='none';
  document.getElementById('content').innerHTML=`<div class="result active">
    <div class="remoji">${p===100?'🏆':p>=80?'🎯':p>=60?'💪':'📖'}</div>
    <div class="rpct">${p}%</div>
    <div class="rtitle">${p===100?'Perfect!':p>=80?'Well Done!':p>=60?'Good Effort':'Keep Studying!'}</div>
    <div class="rsub">You got <strong>${score}</strong> of <strong>${Q.length}</strong> correct.</div>
    <button class="btn-retry" onclick="cur=0;score=0;render()">Try Again 🔄</button>
  </div>`;
}
render();
</script>
</body>
</html>
