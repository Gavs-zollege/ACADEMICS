<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>First Impressions: Front Desk Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caladea:ital,wght@0,400;0,700;1,700&family=Carlito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --surface-2:#E4EBF3; --ink:#14213A; --muted:#55627A; --line:#D0D9E4;
  --navy:#13294B; --navy-2:#1E3A66; --navy-3:#0C1B33;
  --teal:#0E9293; --teal-ink:#fff; --gold:#E0A526; --gold-ink:#1D1503;
  --good:#1FA67A; --ok:#E0A526; --bad:#D2553F;
  --g-text:#F2F5FA; --g-muted:#A9B8D0;
  --serif:Cambria, Caladea, Georgia, serif;
  --sans:Calibri, Carlito, "Segoe UI", system-ui, sans-serif;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08111F; --surface:#111E33; --surface-2:#1A2A45; --ink:#E6ECF4; --muted:#9BA9C0; --line:#28395A;
  --teal:#35BDBA; --teal-ink:#05201F; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#111E33; --surface-2:#1A2A45; --ink:#E6ECF4; --muted:#9BA9C0; --line:#28395A;
  --teal:#35BDBA; --teal-ink:#05201F; color-scheme:dark;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--navy-3)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--navy-3);color:var(--g-text)}
.top-in{max-width:1120px;margin:0 auto;padding:.7rem 1.1rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:.6rem;margin-right:auto}
.logo b{font-family:var(--serif);font-size:1.35rem;letter-spacing:.01em}
.logo svg{width:34px;height:34px}
.tabs{display:flex;gap:.25rem;background:var(--navy-2);padding:.25rem;border-radius:10px}
.tab{border:0;background:none;color:var(--g-muted);padding:.42rem .85rem;border-radius:7px;font-weight:700;font-size:.95rem}
.tab[aria-selected="true"]{background:var(--gold);color:var(--gold-ink)}
main{max-width:1120px;margin:0 auto;padding:1.25rem 1.1rem 3rem}
.view[hidden]{display:none}
.btn{border:1px solid var(--line);background:var(--surface);padding:.6rem 1rem;border-radius:10px;font-weight:700;font-size:.97rem;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.go{background:var(--gold);border-color:var(--gold);color:var(--gold-ink);box-shadow:0 4px 0 #9C6F10}
.btn.go:active{transform:translateY(3px);box-shadow:0 1px 0 #9C6F10}
.btn.teal{background:var(--teal);border-color:var(--teal);color:var(--teal-ink)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}

/* ===== GAME CABINET ===== */
.cab{background:var(--navy);color:var(--g-text);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px -22px rgba(10,20,40,.6);position:relative}
.hud{display:grid;grid-template-columns:1fr auto auto auto;gap:1rem;align-items:center;padding:.8rem 1.1rem;background:var(--navy-3)}
.street{display:flex;gap:.35rem;align-items:flex-end}
.door{width:38px;height:38px;border-radius:9px;background:var(--navy-2);border:2px solid #2E4C7C;position:relative;display:grid;place-items:center;color:#5F7AA6;transition:transform .2s}
.door svg{width:26px;height:26px;fill:currentColor}
.door.win{background:var(--good);border-color:#7FE0BE;color:#fff}
.door.lose{background:#5B4512;border-color:var(--ok);color:#F6D88C}
.door.here{border-color:var(--gold);color:var(--gold);transform:translateY(-4px);box-shadow:0 0 0 3px rgba(224,165,38,.3)}
.door b{position:absolute;right:-6px;top:-6px;width:17px;height:17px;border-radius:50%;background:#fff;color:#137A57;font-size:.7rem;display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.stat{text-align:right;line-height:1.1}
.stat small{display:block;color:var(--g-muted);font-size:.8rem}
.stat b{font-family:var(--serif);font-size:1.6rem;font-variant-numeric:tabular-nums}
.streak{color:var(--gold)}
@media (max-width:560px){.hud{grid-template-columns:1fr auto auto}.street{grid-column:1/-1}.door{width:32px;height:32px}.door svg{width:22px;height:22px}}

.stage-scene{position:relative;background:#E7ECEF}
.scn svg{display:block;width:100%;height:auto}
.ext{overflow:hidden}.ext svg{transition:transform .65s cubic-bezier(.5,0,.75,0),opacity .65s ease-in}.ext.go svg{transform:scale(3.2);opacity:0}
.bubble-wrap{position:absolute;left:3%;top:6%;width:41%;display:grid;gap:.5rem}
.speech{background:#fff;color:#13294B;border-radius:22px 22px 6px 22px;padding:1rem 1.2rem;position:relative;box-shadow:0 10px 24px -12px rgba(19,41,75,.45)}
.speech::after{content:"";position:absolute;right:-12px;bottom:10px;border:12px solid transparent;border-left-color:#fff;border-right:0}
.speech .who{font-size:.85rem;color:#5A6880;margin:0 0 .2rem}
.speech q{quotes:"“" "”";font-family:var(--serif);font-weight:700;font-size:clamp(1.25rem,2.6vw,1.9rem);line-height:1.15;display:block}
.speech.push{background:#E2F3F2}.speech.push::after{border-left-color:#E2F3F2}
.office-tag{display:inline-block;background:var(--gold);color:var(--gold-ink);font-weight:700;font-size:.85rem;padding:.15rem .6rem;border-radius:6px;margin-bottom:.5rem}
.rap{min-width:130px}.rap small{display:block;color:var(--g-muted);font-size:.8rem;margin-bottom:.3rem}
.mood{height:12px;border-radius:7px;background:#0A1730;overflow:hidden}
.mood span{display:block;height:100%;transition:width .5s ease,background .5s}
@media (max-width:640px){.bubble-wrap{position:static;width:auto;padding:.9rem 1rem 0;background:var(--navy)}.speech{border-radius:22px}.speech::after{display:none}.rap{min-width:90px}}
.play{padding:1.1rem 1.3rem 1.4rem;display:grid;gap:.9rem}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:1rem}
.qhead p{margin:0;color:var(--g-muted)}
.clock{position:relative;width:46px;height:46px;flex:none}
.clock svg{transform:rotate(-90deg)}
.clock b{position:absolute;inset:0;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
.opt{display:flex;gap:.7rem;align-items:flex-start;text-align:left;background:#22426F;border:2px solid #345A8E;color:var(--g-text);border-radius:14px;padding:.8rem .9rem;font-size:1.02rem;line-height:1.35;transition:transform .12s,background .2s}
.opt:hover:not(:disabled){background:#2A4F84;transform:translateY(-2px)}
.opt .k{flex:none;width:1.7rem;height:1.7rem;border-radius:7px;background:#0E1E3A;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:var(--gold)}
.opt:disabled{cursor:default}
.opt.best{background:#145C4A;border-color:var(--good)}
.opt.okay{background:#5B4512;border-color:var(--ok)}
.opt.bad{background:#3A3F55;border-color:#7C86A3}
.opt.dim{opacity:.45}
.fb{border-radius:14px;padding:.9rem 1rem;background:#0E1E3A;border-left:6px solid var(--good)}
.fb.okay{border-color:var(--ok)}.fb.bad{border-color:var(--teal)}
.fb h3{margin:0 0 .25rem;font-family:var(--serif);font-size:1.25rem}
.fb p{margin:.25rem 0 0}
.fb .model{font-family:var(--serif);color:#CFE9E6}
.pts{font-weight:700;color:var(--gold)}
.center{text-align:center;padding:2.2rem 1.3rem}
.center h2{font-family:var(--serif);font-size:clamp(2rem,5vw,3rem);margin:.2rem 0 .4rem;line-height:1.05}
.center p{color:var(--g-muted);max-width:52ch;margin:0 auto 1.2rem}
.big-door{width:120px;margin:0 auto .5rem}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:.6rem;max-width:720px;margin:0 auto 1.4rem;text-align:left}
.rules div{background:#0E1E3A;border-radius:12px;padding:.7rem .85rem;font-size:.95rem}
.rules b{display:block;color:var(--gold);font-family:var(--serif);font-size:1.05rem}
.leads{list-style:none;padding:0;margin:.4rem 0 0;display:flex;flex-wrap:wrap;gap:.35rem}
.leads li{background:#0E1E3A;border:1px solid #2E4C7C;border-radius:999px;padding:.2rem .7rem;font-size:.88rem}
.review{max-width:760px;margin:0 auto;text-align:left;display:grid;gap:.5rem}
.review div{background:#0E1E3A;border-radius:12px;padding:.7rem .9rem}
.review q{quotes:"“" "”";font-weight:700}
.review p{margin:.2rem 0 0;color:#CFE9E6;font-family:var(--serif)}
.rv-head{max-width:980px;margin:2rem auto 1rem;text-align:left}
.rv-head h3{font-family:var(--serif);font-size:1.6rem;margin:0}
.rv-head p{margin:.2rem 0 0;max-width:none}
.rv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:.9rem;max-width:980px;margin:0 auto;text-align:left}
.rv{background:#fff;color:#13294B;border-radius:16px;padding:1rem 1.1rem 1.1rem;display:grid;gap:.7rem;align-content:start}
.rv-top{display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.85rem;color:#5A6880}
.badge{font-weight:700;padding:.15rem .6rem;border-radius:999px;font-size:.8rem;white-space:nowrap}
.badge.got{background:#DDF2EA;color:#137A57}.badge.try{background:#FBEFD2;color:#855800}
.rv q{quotes:"“" "”";font-family:var(--serif);font-weight:700;font-size:1.3rem;line-height:1.2}
.rv .say{color:#13294B;max-width:none;background:#DDF2F1;border-radius:14px 14px 4px 14px;padding:.7rem .85rem;font-family:var(--serif);font-size:1.03rem;line-height:1.4;margin:0}
.rv .fu{max-width:none;border-top:1px solid #E3E8EE;padding-top:.7rem;font-size:.95rem;color:#3F4B60;margin:0}
.rv .fu b{display:block;font-size:.82rem;color:#5A6880;margin-bottom:.2rem}
.pop{position:absolute;right:1.2rem;top:4.5rem;font-family:var(--serif);font-weight:700;font-size:2rem;color:var(--gold);pointer-events:none;animation:pop 1s ease forwards}
@keyframes pop{0%{opacity:0;transform:translateY(10px) scale(.8)}20%{opacity:1;transform:translateY(0) scale(1.1)}100%{opacity:0;transform:translateY(-30px)}}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.rise{animation:rise .35s ease both}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.shake{animation:shake .4s}
.stamp{display:inline-block;font-family:var(--serif);font-weight:700;font-size:1.5rem;padding:.3rem 1rem;border:4px solid currentColor;border-radius:10px;transform:rotate(-4deg);margin:.4rem 0 .8rem;animation:rise .4s ease both}

.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(150%);background:var(--navy-3);color:#fff;padding:.6rem 1.1rem;border-radius:10px;font-weight:700;transition:transform .25s;z-index:20}
.toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ===== fit to screen, no page scrolling ===== */
html,body{height:100%}
body{height:100dvh;display:flex;flex-direction:column;overflow:hidden;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{position:static;flex:none}
.top-in{padding:.5rem 1rem}
.logo b{font-size:1.2rem}.logo svg{width:30px;height:30px}
main{flex:1;min-height:0;width:100%;padding:.75rem;display:flex}
#v-play{flex:1;min-height:0;display:flex}
.cab{flex:1;min-height:0;display:flex;flex-direction:column}
.hud{flex:none;padding:.55rem .9rem;gap:.8rem}
.stat b{font-size:1.35rem}
.stage-scene{flex:1 1 0;min-height:110px;position:relative;overflow:hidden}
.scn{position:absolute;inset:0}.scn svg{width:100%;height:100%}
.bubble-wrap{position:absolute;left:2.5%;top:5%;width:min(44%,440px)}
.speech{padding:.7rem 1rem}.speech q{font-size:clamp(1.1rem,2.4vw,1.75rem)}
.play{flex:none;padding:.8rem 1rem .9rem;gap:.6rem}
.center{flex:none;padding:.9rem 1rem 1rem}
.center h2{font-size:clamp(1.5rem,3.6vw,2.4rem);margin:.1rem 0 .3rem}
.center p{margin:0 auto .7rem}
.fill{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;overflow:auto}
.opt{padding:.55rem .75rem;font-size:.98rem}
.qhead p{font-size:.95rem}
.clock,.clock svg{width:40px;height:40px}
.fb{padding:.7rem .9rem}.fb h3{font-size:1.15rem}.fb p{margin:.2rem 0 0}
.fb .said{color:var(--g-muted);font-style:italic}
.chips{list-style:none;padding:0;margin:0 auto .9rem;display:flex;flex-wrap:wrap;justify-content:center;gap:.4rem;max-width:720px}
.chips li{background:#0E1E3A;border:1px solid #2E4C7C;border-radius:999px;padding:.3rem .8rem;font-size:.92rem}
.chips b{color:var(--gold)}
.stamp{font-size:1.25rem;margin:.1rem 0 .5rem}
.big-score{font-family:var(--serif);font-size:2.4rem;color:var(--gold);margin:.1rem 0}
.rv-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:.9rem 1rem 1rem;gap:.7rem}
.rv-bar{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap}
.rv-bar h3{font-family:var(--serif);font-size:1.4rem;margin:0}
.rv-bar span{color:var(--g-muted);font-size:.92rem}
.rv-grid{flex:1;min-height:0;max-width:none;margin:0;grid-template-columns:repeat(var(--n),1fr);align-items:start;align-content:start}
.rv{max-height:100%}
.rv{overflow:auto}
.btn.line{background:transparent;color:#fff;border-color:#2E4C7C}
@media (max-width:640px){
 .top-in{padding:.4rem .8rem}.logo b{font-size:1.05rem}
 main{padding:.4rem}
 .hud{grid-template-columns:1fr auto auto;row-gap:.4rem;padding:.45rem .7rem}
 .street{grid-column:1/-1;gap:.3rem}.door{width:28px;height:28px}.door svg{width:19px;height:19px}.door.here{transform:none}
 .rap{min-width:0}.rap .mood{width:120px}
 .bubble-wrap{position:absolute;left:3%;top:4%;width:62%;padding:0;background:none}
 .speech{border-radius:18px 18px 5px 18px;padding:.5rem .7rem}.speech::after{display:block}
 .speech .who{font-size:.75rem}.speech q{font-size:1rem}
 .opts{gap:.4rem}.opt{font-size:.9rem;padding:.45rem .6rem;gap:.5rem}.opt .k{width:1.4rem;height:1.4rem}
 .qhead .keys-hint{display:none}
 .play{padding:.6rem .7rem .7rem}
 .center p{font-size:.95rem}
 .chips li{font-size:.82rem;padding:.2rem .6rem}
}
@media (max-height:640px){.center p.sub{display:none}.chips{display:none}}
.toast:not(.show){visibility:hidden}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="logo"><svg viewBox="0 0 40 40" aria-hidden="true"><rect x="0" y="0" width="40" height="40" rx="9" fill="#0E9293"/><g fill="#fff" transform="translate(5 4) scale(.75)"><path d="M5 9h13v9H5z"/><path d="M10 18h3v2h-3z"/><circle cx="28" cy="9" r="4.5"/><path d="M20.5 21c0-5 3.3-7.5 7.5-7.5s7.5 2.5 7.5 7.5z"/><rect x="2" y="21" width="36" height="3.5" rx="1"/><rect x="5" y="24.5" width="30" height="13"/></g></svg><b>First Impressions</b></div>
</div></header>

<main>
  <section class="view" id="v-play"><div class="cab" id="cab"></div></section>

</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
var OFF=[
 {id:"slammed",short:"We’re slammed",office:"Brightview Medical Group",mgr:"Dana",hair:"#5B3A1E",skin:"#E8B994",
  line:"We’re slammed right now.",act:"Keep typing. Answer the phone mid-sentence.",lead:"Best time to come back",
  o:[["Totally understand. Can I leave this at the front and come back at a better time? When’s usually quieter?",2,"Short, respectful, and you found out when to come back."],
     ["Oh, I’m so sorry to bother you! I’ll just leave my packet right here on the counter and get out of your way.",1,"Polite, but you left without knowing when to return."],
     ["I totally get it, but this will only take five minutes, I promise. Can I quickly tell you about my program?",0,"Busy offices appreciate a quick visit. Offer to come back instead."],
     ["No problem at all! I’ll just have a seat over there in the waiting room until you have a free minute to talk.",0,"Leaving the packet and asking for a better time is easier on a busy team."]],
  push:"Honestly, it’s always like this.",
  p:[["That’s okay, I’ll keep it quick. Is there a day of the week that tends to be lighter?",2,"Specific question, zero pressure."],
     ["Okay, no worries at all. I’ll try stopping by again sometime soon when it’s hopefully a little calmer.",1,"“Sometime” isn’t a plan. Ask for a day."],
     ["Oh, so when are you ever not busy? I can come back whenever, I just really need to talk to someone today.",0,"Try asking about a specific day instead. It keeps things friendly."]]},
 {id:"noexterns",short:"No externs",office:"Harbor Family Medical",mgr:"Gloria",hair:"#B8B8C2",skin:"#C98E66",
  line:"We don’t take externs.",act:"Brief and matter-of-fact.",lead:"Résumé on file",
  o:[["Thanks for letting me know. Could I still leave my résumé in case anything changes, or if you’re hiring later?",2,"Gracious, and the door stays open."],
     ["Oh, okay, I understand. Thank you so much for your time, and I hope you have a really great rest of your day!",1,"Polite, but you walked away with your résumé still in hand."],
     ["Really? Why not? Students can be really helpful, and we’ve already finished most of our hands-on training.",0,"Accepting the answer warmly leaves a better impression."],
     ["Oh, that’s surprising. A lot of the other offices around here do take externs from our program, though.",0,"Keep the focus on them, and ask to leave your résumé."]],
  push:"We’ve had bad experiences with students before.",
  p:[["I’m sorry to hear that, I understand. Could I still leave my résumé in case you ever reconsider?",2,"Acknowledged, didn’t argue, still left the résumé."],
     ["I totally understand, but I promise I’m not like the other students. I’m really responsible and hardworking.",1,"Understandable, but you can’t prove it at the desk. Let the résumé do it."],
     ["That doesn’t really seem fair to me, though. I wasn’t the one who caused those problems for your office.",0,"Acknowledge their experience and offer your résumé."]]},
 {id:"email",short:"Just email us",office:"Cedar Park Medical",mgr:"Marcus",hair:"#1E1A17",skin:"#8D5A3B",
  line:"Just email us.",act:"Slide a business card across without looking up.",lead:"Contact name and email",
  o:[["Happy to. Who should I address it to, and what’s the best email? I’ll leave this packet too.",2,"Name, exact email, and the packet still lands on the desk."],
     ["Sure, that works for me! What’s the best email address to send my résumé and my information over to?",1,"Good start, but get a name, and leave the packet anyway."],
     ["Okay, sounds good! I’ll go home and send everything over by email later tonight. Thank you so much!",0,"Ask for a name and email, and leave the packet too."],
     ["I actually already emailed your office last week, but I never heard anything back from anyone there.",0,"Start fresh: ask who to address it to."]],
  push:"It’s on our website.",
  p:[["Great, I’ll use that. Whose attention should I put it to? I’ll leave this packet for them as well.",2,"You turned a brush-off into a named contact."],
     ["Okay, perfect, thank you! I’ll look it up on your website when I get home and send it over tonight.",1,"You’ll end up emailing an inbox nobody checks. Ask for a name."],
     ["I tried looking on your website earlier, but honestly I couldn’t find an email address anywhere on it.",0,"Asking for a name gets your email to the right person."]]},
 {id:"mgrout",short:"Manager’s out",office:"Northgate Medical Clinic",mgr:"Priya",hair:"#2A1B12",skin:"#B57B55",
  line:"The office manager isn’t here.",act:"Friendly but brief. Offer nothing extra unless asked.",lead:"Manager’s name and hours",
  o:[["No problem. What’s their name, and when are they usually in?",2,"Now you know who decides and when to find them."],
     ["Oh, okay. Could I leave this packet here for them so they can look at it whenever they get back in?",1,"Good, but get the name and a time to return."],
     ["Oh, that’s too bad. Would you be able to give them a quick call for me so I could talk to them now?",0,"Getting the manager’s name and hours lets you follow up yourself."],
     ["Okay, no worries at all. I’ll just come back again tomorrow and hopefully they’ll be in then. Thanks!",0,"Ask for their name and usual hours first, so your trip counts."]],
  push:"I don’t really know their schedule.",
  p:[["No worries. Could I leave this for them by name? Are mornings or afternoons usually better?",2,"Easy question, and the packet is addressed to the right person."],
     ["Okay, that’s alright. I’ll just keep trying to stop by on different days until I finally catch them here.",1,"Leave the packet by name so the trip isn’t wasted."],

/* fit each scene to its box: keep the important part large, never crop it */
var FOCUS={ex:{p:[0,0,800,400],m:[100,20,600,340],vy:.6,door:[400,267]},in:{p:[0,20,800,380],m:[250,30,530,350],vy:.7}};
function fitScene(svg){
 var F=FOCUS[svg.getAttribute("data-scene")],box=svg.parentNode.getBoundingClientRect();if(!F||!box.width||!box.height)return;
 var a=box.width/box.height,P=F.p,M=F.m,w,h,x,y;
 h=P[3];w=h*a;
 if(w>=P[2]){x=P[0]+P[2]/2-w/2;y=P[1]}
 else if(w>=M[2]){var c=Math.max(M[0]+w/2,Math.min(M[0]+M[2]-w/2,P[0]+P[2]/2));x=c-w/2;y=P[1]}
 else{w=M[2];h=w/a;x=M[0];var extra=h-M[3];y=M[1]-extra*F.vy}
 svg.setAttribute("viewBox",x.toFixed(1)+" "+y.toFixed(1)+" "+w.toFixed(1)+" "+h.toFixed(1));
 if(F.door)svg.style.transformOrigin=((F.door[0]-x)/w*100).toFixed(1)+"% "+((F.door[1]-y)/h*100).toFixed(1)+"%";
}
function fitAll(){document.querySelectorAll("svg[data-scene]").forEach(fitScene)}
var fitRaf=0;function queueFit(){cancelAnimationFrame(fitRaf);fitRaf=requestAnimationFrame(fitAll)}
new MutationObserver(function(){fitAll();queueFit()}).observe(document.getElementById("cab"),{childList:true,subtree:true});
addEventListener("resize",queueFit);

/* ================= SOLO GAME ================= */
var G=null, clock=null;
function stopClock(){clearInterval(clock);clock=null}
function newGame(){G={mood:null,order:shuffle(OFF),i:0,score:0,streak:0,bestStreak:0,doors:[],leads:[],miss:[]};enterOffice()}
function cur(){return G.order[G.i]}
function hud(){
 return '<div class="hud"><div class="street" aria-label="Office '+(G.i+1)+' of 6">'+G.order.map(function(o,i){
   var c=G.doors[i]===true?"win":G.doors[i]===false?"lose":"";if(i===G.i&&G.doors[i]===undefined)c+=" here";
   return '<div class="door '+c+'" title="'+esc(o.office)+'"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M5 9h13v9H5z"/><path d="M10 18h3v2h-3z"/><circle cx="28" cy="9" r="4.5"/><path d="M20.5 21c0-5 3.3-7.5 7.5-7.5s7.5 2.5 7.5 7.5z"/><rect x="2" y="21" width="36" height="3.5" rx="1"/><rect x="5" y="24.5" width="30" height="13"/></svg>'+(G.doors[i]===true?'<b>✓</b>':'')+'</div>'}).join("")+
  '</div>'+(G.mood!=null?'<div class="rap"><small>Rapport</small><div class="mood" role="meter" aria-label="Rapport" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+G.mood+'"><span style="width:'+G.mood+'%;background:'+moodColor(G.mood)+'"></span></div></div>':'<div></div>')+'<div class="stat streak"><small>Streak</small><b>'+(G.streak?"×"+G.streak:"–")+'</b></div><div class="stat"><small>Score</small><b id="score">'+G.score+'</b></div></div>';
}
function title(){
 stopClock();G=null;
 var t={id:"title",office:"Welcome to the front desk",mgr:"",hair:"#5B3A1E",skin:"#E8B994"};
 $("#cab").innerHTML='<div class="stage-scene"><div class="scn">'+clinic(t,80)+'</div><div class="bubble-wrap"><div class="speech rise"><p class="who">Front desk</p><q>Hi there! How can I help you?</q></div></div></div>'+
 '<div class="center rise"><h2>First Impressions</h2><p class="sub">Visit six medical offices, make a great first impression at each front desk, and leave your packet with a friendly contact.</p>'+
 '<ul class="chips"><li><b>15 sec</b> per answer</li><li>Build <b>rapport</b></li><li>Handle <b>follow-ups</b></li><li>Keep a <b>streak</b></li></ul>'+
 '<button class="btn go" id="start" style="font-size:1.1rem;padding:.7rem 1.5rem">Start visiting offices</button>'+
 (S.best?'<p style="margin:.6rem 0 0">Your best: <b style="color:var(--gold)">'+S.best+'</b></p>':'')+'</div>';
 $("#start").onclick=newGame;
}
function enterOffice(){
 var o=cur();G.mood=60;G.stage=0;G.snap={score:G.score,streak:G.streak,bestStreak:G.bestStreak,leads:G.leads.length,miss:G.miss.length};
 $("#cab").innerHTML=hud()+'<div class="stage-scene ext"><div class="scn">'+exterior(o)+'</div></div>'+
 '<div class="center rise"><span class="office-tag">Office '+(G.i+1)+' of 6</span><h2>'+esc(o.office)+'</h2><p class="sub">Your next stop. Packet in hand, head inside and make a great first impression.</p><button class="btn go" id="walk">Walk in</button></div>';
 $("#walk").onclick=function(){
  var ex=$(".ext");this.disabled=true;
  if(reduced){greet();return}
  ex.classList.add("go");setTimeout(greet,650);
 };$("#walk").focus();
}
function greet(){
 var o=cur();
 $("#cab").innerHTML=hud()+sceneHTML(o,"Hi! Welcome to "+o.office+".",false)+
 '<div class="center rise"><p>'+esc(o.mgr)+' looks up from the front desk and smiles.</p><button class="btn go" id="walk">Walk up to the desk</button></div>';
 $("#walk").onclick=function(){ask()};$("#walk").focus();
}
function sceneHTML(o,line,isPush,who){
 return '<div class="stage-scene"><div class="scn">'+clinic(o,G?G.mood:60)+'</div><div class="bubble-wrap"><div class="speech rise '+(isPush?"push":"")+'"><p class="who">'+esc(who||(isPush?o.mgr+" follows up":o.mgr))+'</p><q>'+esc(line)+'</q></div></div></div>';
}
function ask(){
 var o=cur(),isPush=G.stage===1,src=isPush?o.p:o.o;
 G.opts=shuffle(src.map(function(x,i){return{t:x[0],q:x[1],f:x[2]}}));
 G.t0=Date.now();G.left=QTIME;
 $("#cab").innerHTML=hud()+sceneHTML(o,isPush?o.push:o.line,isPush)+
  '<div class="play"><div class="qhead"><p>'+(isPush?"They have a follow-up. What do you say?":"What do you say?")+' <span class="keys-hint" style="opacity:.7">Press 1–'+G.opts.length+'</span></p>'+
  '<div class="clock"><svg viewBox="0 0 46 46"><circle cx="23" cy="23" r="20" fill="none" stroke="#0A1730" stroke-width="5"/><circle id="ring" cx="23" cy="23" r="20" fill="none" stroke="#E0A526" stroke-width="5" stroke-dasharray="125.7" stroke-dashoffset="0" stroke-linecap="round"/></svg><b id="secs">'+QTIME+'</b></div></div>'+
  '<div class="opts">'+G.opts.map(function(x,i){return '<button class="opt" data-i="'+i+'"><span class="k">'+(i+1)+'</span><span>“'+esc(x.t)+'”</span></button>'}).join("")+'</div><div id="fbox"></div></div>';
 document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){answer(+b.dataset.i)}});
 stopClock();clock=setInterval(tick,100);
}
function tick(){
 var el=(Date.now()-G.t0)/1000,left=Math.max(0,QTIME-el);
 var s=$("#secs"),r=$("#ring");if(!s){stopClock();return}
 s.textContent=Math.ceil(left);r.setAttribute("stroke-dashoffset",(125.7*(1-left/QTIME)).toFixed(1));
 
 if(left<=0){stopClock();answer(-1)}
}
function answer(i){
 if(G.answered===G.stage+"-"+G.i)return;G.answered=G.stage+"-"+G.i;stopClock();
 var o=cur(),isPush=G.stage===1,el=(Date.now()-G.t0)/1000;
 var pick=i>=0?G.opts[i]:null,q=pick?pick.q:0,bestOpt=G.opts.filter(function(x){return x.q===2})[0];
 var gain=PTS[q];
 if(q===2){G.streak++;G.bestStreak=Math.max(G.bestStreak,G.streak);gain+=Math.round(Math.max(0,QTIME-el)/QTIME*50);if(G.streak>=2)gain+=25*(G.streak-1)}else G.streak=0;
 G.score+=gain;G.mood=Math.max(0,Math.min(100,G.mood+(pick?MOOD[q]:-30)));
 G.res=G.res||{};G.res[o.id]=G.res[o.id]||{};G.res[o.id][isPush?"b":"a"]=q;
 if(q<2)G.miss.push({line:isPush?o.push:o.line,best:bestOpt.t});
 document.querySelectorAll(".opt").forEach(function(b,j){b.disabled=true;var x=G.opts[j];
  if(x.q===2)b.classList.add("best");else if(j===i)b.classList.add(q===1?"okay":"bad");else b.classList.add("dim")});
 // refresh hud + mood
 var h=document.createElement("div");h.innerHTML=hud();$("#cab").replaceChild(h.firstChild,$(".hud"));
 $(".scn").innerHTML=clinic(o,G.mood);
 
 if(gain&&!reduced){var p=document.createElement("div");p.className="pop";p.textContent="+"+gain;$("#cab").appendChild(p);setTimeout(function(){p.remove()},1000)}
 var cls=q===2?"":q===1?"okay":"bad",head=!pick?"Time’s up, here’s a tip":q===2?"Nailed it!":q===1?"Good start!":"Here’s a stronger option";
 var fbText=!pick?"Having a line ready before you walk in makes this easier. Here’s one to try.":pick.f;
 var next=isPush||G.mood<35?"Finish this office":"Keep going";
 $(".opts").remove();$(".qhead").remove();
 $("#fbox").innerHTML='<div class="fb rise '+cls+'"><h3>'+head+(gain?' <span class="pts">+'+gain+'</span>':'')+'</h3>'+(pick&&q<2?'<p class="said">You said: “'+esc(pick.t)+'”</p>':'')+'<p>'+esc(fbText)+'</p>'+
  (q<2?'<p class="model">Best move: “'+esc(bestOpt.t)+'”'+(o.id==="email"&&!isPush?' Then leave the packet anyway.':'')+'</p>':'')+
  '<div class="row" style="margin-top:.6rem"><button class="btn go" id="nx">'+next+'</button></div></div>';
 $("#nx").onclick=function(){ if(!isPush&&G.mood>=35){G.stage=1;ask()}else finishOffice() };$("#nx").focus();
}
function finishOffice(){
 var o=cur(),won=G.mood>=50;G.doors[G.i]=won;if(won){G.leads.push(o.lead);G.score+=150}
 $("#cab").innerHTML=hud()+sceneHTML(o,won?"Thanks, I’ll make sure they see this.":"Thanks for stopping by.",!won,o.mgr)+
  '<div class="center"><div class="stamp" style="color:'+(won?"var(--good)":"var(--gold)")+'">'+(won?"Packet left +150":"Good practice!")+'</div>'+
  '<p>'+(won?"You collected: <b style=\"color:#fff\">"+esc(o.lead)+"</b>":"Try this office again to practice the best moves, or keep going to the next one.")+'</p>'+
  '<div class="row" style="justify-content:center"><button class="btn go" id="nx">'+(G.i<5?"Next office":"See your results")+'</button><button class="btn line" id="redo">↻ Try this office again</button></div></div>';
 
 $("#nx").onclick=function(){G.i++;G.i<6?enterOffice():end()};$("#nx").focus();
 $("#redo").onclick=redoOffice;
}
function redoOffice(){
 var o=cur(),k=G.snap;
 G.score=k.score;G.streak=k.streak;G.bestStreak=k.bestStreak;G.leads.length=k.leads;G.miss.length=k.miss;
 G.doors[G.i]=undefined;if(G.res)delete G.res[o.id];
 G.mood=60;G.stage=0;G.answered=null;greet();
}
function end(){
 var won=G.doors.filter(Boolean).length,newBest=G.score>S.best;if(newBest){S.best=G.score;save()}
 G.mood=null;G.endInfo={won:won,newBest:newBest};renderEnd();
}
function renderEnd(){
 var won=G.endInfo.won,newBest=G.endInfo.newBest;
 var rank=won===6?["Externship Closer","Every desk, every packet. You’re ready for real offices."]:won>=4?["Front Desk Pro","Strong run! Check your script cards and go for all six."]:won>=2?["Rising Star","You’ve got the basics. Check your script cards and go again."]:["Great First Step","Every run builds confidence. Check your script cards, then try again."];
 $("#cab").innerHTML=hud()+'<div class="center fill rise"><span class="office-tag" style="align-self:center">'+won+' of 6 packets left</span><h2>'+rank[0]+'</h2><p class="sub">'+rank[1]+'</p>'+
  '<p class="big-score">'+G.score+'</p><p>'+(newBest?"New personal best!":"Best: "+S.best)+' · Longest streak: ×'+G.bestStreak+'</p>'+
  (G.leads.length?'<ul class="leads chips" style="justify-content:center">'+G.leads.map(function(l){return"<li>"+esc(l)+"</li>"}).join("")+'</ul>':'')+
  '<div class="row" style="justify-content:center"><button class="btn go" id="cards">See your script cards</button><button class="btn line" id="again">Play again</button><button class="btn line" id="home">Title screen</button></div></div>';
 $("#cards").onclick=function(){cardsView(0)};$("#again").onclick=newGame;$("#home").onclick=title;$("#cards").focus();
}
function cardsView(pg){
 var w=innerWidth,n=w>=900?3:w>=600?2:1,pages=Math.ceil(6/n);pg=Math.max(0,Math.min(pages-1,pg));
 var list=G.order.slice(pg*n,pg*n+n);
 $("#cab").innerHTML=hud()+'<div class="rv-wrap rise"><div class="rv-bar"><div><h3>Your script cards</h3><span>The best response for each front desk</span></div>'+
  '<div class="row"><button class="btn line" id="pv" '+(pg===0?"disabled":"")+' aria-label="Previous cards">‹</button><span>'+(pg+1)+' of '+pages+'</span><button class="btn line" id="nv" '+(pg===pages-1?"disabled":"")+' aria-label="Next cards">›</button><button class="btn go" id="back">Back to results</button></div></div>'+
  '<div class="rv-grid" style="--n:'+n+'">'+list.map(function(o){var r=(G.res||{})[o.id]||{},got=r.a===2&&(r.b===undefined||r.b===2);
   return '<article class="rv"><div class="rv-top"><span>'+esc(o.office)+'</span><span class="badge '+(got?"got":"try")+'">'+(got?"Nailed it":"Practice this")+'</span></div>'+
   '<q>'+esc(o.line)+'</q><p class="say">“'+esc(o.o[0][0])+'”</p>'+
   '<p class="fu"><b>If they say “'+esc(o.push)+'”</b>“'+esc(o.p[0][0])+'”</p></article>'}).join("")+'</div></div>';
 $("#pv").onclick=function(){cardsView(pg-1)};$("#nv").onclick=function(){cardsView(pg+1)};$("#back").onclick=renderEnd;
 (pg<pages-1?$("#nv"):$("#back")).focus();
}
addEventListener("keydown",function(e){
 if($("#v-play").hidden||e.metaKey||e.ctrlKey||/TEXTAREA|INPUT/.test(e.target.tagName))return;
 var n=+e.key;if(n>=1&&n<=4){var b=document.querySelectorAll(".opt")[n-1];if(b&&!b.disabled)b.click()}
});

title();show(location.hash.slice(1));
})();
</script>
