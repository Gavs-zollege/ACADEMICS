<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normal or Abnormal?</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-start: #0B1D2C;
    --bg-mid: #0F2D3D;
    --bg-end: #0B1D2C;
    --teal: #2DD4BF;
    --teal-dark: #14B8A6;
    --teal-bright: #5EEAD4;
    --green: #34D399;
    --green-dark: #10B981;
    --red: #F87171;
    --amber: #FBBF24;
    --blue: #60A5FA;
    --purple: #A78BFA;
    --text-primary: #FFFFFF;
    --text-secondary: #E2E8F0;
    --text-muted: #94A3B8;
    --card-border: rgba(255,255,255,0.15);
    --card-bg: rgba(255,255,255,0.08);
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--bg-start) 0%, var(--bg-mid) 50%, var(--bg-end) 100%);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .screen { display: none; max-width: 480px; width: 100%; }
  .screen.active { display: block; }
  .center-wrap { text-align: center; }

  /* START SCREEN */
  .emoji-big { font-size: 60px; margin-bottom: 16px; }

  .start-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 30px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }
  .start-desc {
    color: var(--text-secondary);
    font-size: 15px;
    line-height: 1.65;
    margin-bottom: 8px;
    font-family: 'Inter', sans-serif;
  }
  .start-sub {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 32px;
    font-family: 'Inter', sans-serif;
  }

  .btn-go {
    background: linear-gradient(135deg, #34D399, #10B981);
    color: white;
    border: none;
    padding: 15px 52px;
    border-radius: 12px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    box-shadow: 0 8px 28px rgba(52,211,153,0.3);
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 0.2px;
  }
  .btn-go:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(52,211,153,0.4);
  }
  .btn-go:active { transform: translateY(0); }

  /* PLAY SCREEN */
  .timer-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .timer-val {
    font-size: 26px;
    font-weight: 800;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-variant-numeric: tabular-nums;
    transition: color 0.3s;
  }
  .score-area { display: flex; align-items: center; gap: 10px; }
  .streak-badge {
    font-size: 13px;
    font-weight: 700;
    color: var(--amber);
    font-family: 'Inter', sans-serif;
    background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.25);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .score-text {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-secondary);
    font-family: 'Inter', sans-serif;
  }
  .score-total { color: var(--text-muted); }

  .timer-bar {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .timer-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 1s linear, background 0.3s;
  }

  /* Vital display */
  .vital-area { text-align: center; margin-bottom: 28px; }
  .cat-pill {
    display: inline-flex;
    align-items: center;
    padding: 4px 14px;
    border-radius: 20px;
    margin-bottom: 16px;
  }
  .cat-pill-text {
    font-size: 11px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .vital-box {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 40px 28px;
    border: 1px solid var(--card-border);
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
  }
  .vital-text {
    font-family: 'Plus Jakarta Sans', sans-serif;
    color: var(--text-primary);
    font-size: 26px;
    font-weight: 700;
    line-height: 1.35;
    letter-spacing: -0.3px;
  }

  /* Answer buttons */
  .answer-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .answer-btn {
    padding: 22px 12px;
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 0.1px;
  }
  .answer-btn:hover:not(:disabled) {
    transform: translateY(-2px);
  }
  .answer-btn:active:not(:disabled) { transform: translateY(0); }
  .answer-btn:disabled { cursor: default; }

  /* DONE SCREEN */
  .done-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 20px;
    letter-spacing: -0.4px;
  }
  .results-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .result-card {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 18px 10px;
    border: 1px solid var(--card-border);
    text-align: center;
  }
  .result-card-val {
    font-size: 22px;
    font-weight: 800;
    font-family: 'Plus Jakarta Sans', sans-serif;
    line-height: 1;
  }
  .result-card-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 5px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .review-box {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 16px 20px;
    margin-bottom: 24px;
    border: 1px solid var(--card-border);
    text-align: left;
  }
  .review-title {
    font-size: 11px;
    color: var(--amber);
    font-weight: 600;
    margin-bottom: 12px;
    font-family: 'Inter', sans-serif;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .review-item {
    padding: 8px 0;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }
  .review-item:last-child { border-bottom: none; }
  .review-label {
    color: var(--text-secondary);
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
  }
  .review-explain {
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 3px;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }

  .done-emoji { font-size: 52px; margin-bottom: 14px; }

  .btn-next {
    display: none;
    margin: 16px auto 0;
    background: linear-gradient(135deg, #14B8A6, #0D9488);
    color: white;
    border: none;
    padding: 12px 44px;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn-next:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(20,184,166,0.45);
  }
  .btn-next:active { transform: translateY(0); }

  .explain-bar {
    display: none;
    margin-top: 14px;
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    line-height: 1.5;
    text-align: center;
  }

  .btn-redo {
    background: transparent;
    color: var(--teal-bright);
    border: 1.5px solid var(--teal-bright);
    padding: 12px 36px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin-top: 10px;
    transition: transform 0.12s, background 0.12s;
  }
  .btn-redo:hover {
    background: rgba(94,234,212,0.12);
    transform: translateY(-2px);
  }
  .btn-redo:active { transform: translateY(0); }

  /* ================= GUIDED TOUR ================= */
  .tour-hidden{ display:none !important; }
  #tourHighlight{
    position:fixed; z-index:9998; border-radius:16px; pointer-events:none;
    box-shadow: 0 0 0 9999px rgba(2,6,12,0.78);
    border: 2px solid var(--teal-bright);
    transition: top .4s cubic-bezier(.4,0,.2,1), left .4s cubic-bezier(.4,0,.2,1),
                width .4s cubic-bezier(.4,0,.2,1), height .4s cubic-bezier(.4,0,.2,1);
  }
  #tourTooltip{
    position:fixed; z-index:10001; background:#0F2D3D; border-radius:14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    width:300px; max-width:88vw; padding:20px 22px;
    font-family:'Inter',sans-serif;
    border: 1px solid var(--card-border);
    transition: top .35s ease, left .35s ease;
  }
  #tourTooltip .tour-step-count{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    color: var(--teal-bright); margin-bottom:6px;
  }
  #tourTooltip h3{ font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; font-weight:800; color: var(--text-primary); margin:0 0 8px; }
  #tourTooltip p{ font-size:13px; line-height:1.55; color: var(--text-secondary); margin:0 0 16px; }
  #tourTooltip .tour-actions{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #tourTooltip .tour-right{ display:flex; align-items:center; gap:10px; }
  #tourTooltip button.tour-btn{
    background: linear-gradient(135deg, #34D399, #10B981); color:#062018; border:none; border-radius:10px;
    padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;
  }
  #tourTooltip button.tour-btn:hover{ opacity:.9; }
  #tourTooltip button.tour-btn-secondary{
    background:transparent; color: var(--text-muted); border:none;
    font-size:12.5px; font-weight:600; cursor:pointer; padding:9px 2px; font-family:'Inter',sans-serif;
  }
  #tourTooltip button.tour-btn-secondary:hover{ color: var(--text-primary); text-decoration:underline; }
  #tourReplayBtn{
    position:fixed; bottom:20px; right:20px; z-index:9997;
    background: linear-gradient(135deg, #34D399, #10B981); color:#062018; border:none; border-radius:999px;
    padding:12px 20px; font-weight:700; font-size:13px; cursor:pointer;
    box-shadow: 0 8px 24px rgba(52,211,153,.4);
    display:flex; align-items:center; gap:8px; font-family:'Plus Jakarta Sans',sans-serif;
  }
  #tourReplayBtn:hover{ opacity:.9; }
</style>
</head>
<body>

<div id="tourHighlight" class="tour-hidden"></div>
<div id="tourTooltip" class="tour-hidden">
  <div class="tour-step-count" id="tourStepCount"></div>
  <h3 id="tourTitle"></h3>
  <p id="tourText"></p>
  <div class="tour-actions">
    <button class="tour-btn-secondary" id="tourSkip">Skip tour</button>
    <div class="tour-right">
      <button class="tour-btn-secondary" id="tourBack">Back</button>
      <button class="tour-btn" id="tourNext">Next</button>
    </div>
  </div>
</div>
<button id="tourReplayBtn" class="tour-hidden">&#9654; Replay Tutorial</button>

<!-- START SCREEN -->
<div class="screen active" id="startScreen">
  <div class="center-wrap">
    <div class="emoji-big">⚡</div>
    <h1 class="start-title">Normal or Abnormal?</h1>
    <p class="start-desc">A vital sign reading flashes on screen. Tap <strong style="color:#34D399">Normal</strong> or <strong style="color:#F87171">Abnormal</strong> as fast as you can!</p>
    <p class="start-sub">Includes adult AND pediatric ranges &mdash; 45 seconds on the clock.</p>
    <button class="btn-go" onclick="startGame()">Let's Go!</button>
  </div>
</div>

<!-- PLAY SCREEN -->
<div class="screen" id="playScreen">
  <div class="timer-row">
    <span class="timer-val" id="timerVal">45s</span>
    <div class="score-area">
      <span class="streak-badge" id="streakLabel" style="display:none"></span>
      <span class="score-text">
        <span id="playScore">0</span><span class="score-total">/<span id="playTotal">0</span></span>
      </span>
    </div>
  </div>
  <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>

  <div class="vital-area">
    <div class="cat-pill" id="vitalBadge">
      <span class="cat-pill-text" id="vitalCat"></span>
    </div>
    <div class="vital-box">
      <div class="vital-text" id="vitalText"></div>
    </div>
  </div>

  <div class="answer-grid">
    <button class="answer-btn" id="btnNormal" onclick="answer(true)">&#10003; Normal</button>
    <button class="answer-btn" id="btnAbnormal" onclick="answer(false)">&#10007; Abnormal</button>
  </div>
  <div class="explain-bar" id="explainBar"></div>
  <button class="btn-next" id="btnNext" onclick="advanceRound()">Next →</button>
</div>

<!-- DONE SCREEN -->
<div class="screen" id="doneScreen">
  <div class="center-wrap">
    <div class="done-emoji" id="doneEmoji"></div>
    <h1 class="done-title">Time&rsquo;s Up!</h1>
    <div class="results-grid" id="resultsGrid"></div>
    <div id="reviewSection"></div>
    <button class="btn-go" onclick="startGame()">Play Again</button>
    <button class="btn-redo" id="btnRedo" onclick="redoMissed()" style="display:none">Redo Missed</button>
  </div>
</div>

<script>
var catColors = {
  "Pulse": "#F87171",
  "BP": "#60A5FA",
  "Resp": "#34D399",
  "Temp": "#FB923C",
  "SpO\u2082": "#A78BFA"
};

var vital = null;
var userPicked = null;
var score = 0;
var total = 0;
var streak = 0;
var best = 0;
var time = 45;
var gameHistory = [];
var timer = null;
var missedVitals = [];
var paused = false;

function genVital() {
  var types = [
    function() {
      var v = Math.floor(Math.random() * 50 + 55);
      var n = v >= 60 && v <= 100;
      return { label: "Adult pulse: " + v + " bpm", normal: n, category: "Pulse", explain: n ? "60\u2013100 bpm is normal for adults." : v < 60 ? "Bradycardia \u2014 below 60 bpm." : "Tachycardia \u2014 above 100 bpm." };
    },
    function() {
      var s = Math.floor(Math.random() * 80 + 95);
      var d = Math.floor(Math.random() * 40 + 55);
      var n = s < 120 && d < 80;
      return { label: "Adult BP: " + s + "/" + d + " mmHg", normal: n, category: "BP", explain: n ? "< 120/80 mmHg is normal." : "Systolic " + (s >= 120 ? "\u2265 120" : "ok") + ", Diastolic " + (d >= 80 ? "\u2265 80" : "ok") + " \u2014 elevated or hypertensive." };
    },
    function() {
      var v = Math.floor(Math.random() * 16 + 8);
      var n = v >= 12 && v <= 20;
      return { label: "Adult RR: " + v + " breaths/min", normal: n, category: "Resp", explain: n ? "12\u201320 breaths/min is normal." : v < 12 ? "Bradypnea \u2014 abnormally slow." : "Tachypnea \u2014 abnormally fast." };
    },
    function() {
      var v = (Math.random() * 6 + 95).toFixed(1);
      var n = parseFloat(v) >= 97.6 && parseFloat(v) <= 99.6;
      return { label: "Oral temp: " + v + "\u00b0F", normal: n, category: "Temp", explain: n ? "97.6\u201399.6\u00b0F is the normal oral range." : parseFloat(v) < 97.6 ? "Below normal \u2014 possible hypothermia." : "Above normal \u2014 fever." };
    },
    function() {
      var v = Math.floor(Math.random() * 12 + 88);
      var n = v >= 95;
      return { label: "SpO\u2082: " + v + "%", normal: n, category: "SpO\u2082", explain: n ? "\u2265 95% is normal." : "Below 95% \u2014 warrants attention." };
    },
    function() {
      var v = Math.floor(Math.random() * 120 + 80);
      var n = v >= 100 && v <= 180;
      return { label: "Infant pulse: " + v + " bpm", normal: n, category: "Pulse", explain: n ? "100\u2013180 bpm is normal for infants." : v < 100 ? "Below normal infant range." : "Above normal infant range." };
    },
    function() {
      var v = Math.floor(Math.random() * 40 + 20);
      var n = v >= 30 && v <= 53;
      return { label: "Infant RR: " + v + " breaths/min", normal: n, category: "Resp", explain: n ? "30\u201353 breaths/min is normal for infants." : v < 30 ? "Below normal infant RR." : "Above normal infant RR." };
    },
    function() {
      var v = Math.floor(Math.random() * 80 + 70);
      var n = v >= 98 && v <= 140;
      return { label: "Toddler pulse: " + v + " bpm", normal: n, category: "Pulse", explain: n ? "98\u2013140 bpm is normal for toddlers." : v < 98 ? "Below normal toddler range." : "Above normal toddler range." };
    },
    function() {
      var v = (Math.random() * 4 + 97).toFixed(1);
      var n = parseFloat(v) >= 96.0 && parseFloat(v) <= 98.6;
      return { label: "Axillary temp: " + v + "\u00b0F", normal: n, category: "Temp", explain: n ? "Axillary reads ~1\u00b0F lower than oral. Acceptable range." : parseFloat(v) > 98.6 ? "Elevated for axillary \u2014 clinically significant." : "Below expected axillary range." };
    },
    function() {
      var v = (Math.random() * 5 + 98).toFixed(1);
      var n = parseFloat(v) >= 98.6 && parseFloat(v) <= 100.6;
      return { label: "Rectal temp: " + v + "\u00b0F", normal: n, category: "Temp", explain: n ? "Rectal reads ~1\u00b0F higher than oral. Expected range." : parseFloat(v) < 98.6 ? "Below expected rectal range." : "Elevated even for rectal \u2014 possible fever." };
    }
  ];
  return types[Math.floor(Math.random() * types.length)]();
}

function showScreen(id) {
  var screens = document.querySelectorAll('.screen');
  for (var i = 0; i < screens.length; i++) screens[i].classList.remove('active');
  document.getElementById(id).classList.add('active');
}

function startGame() {
  score = 0; total = 0; streak = 0; best = 0; time = 45; gameHistory = []; userPicked = null; missedVitals = []; paused = false;
  if (timer) clearInterval(timer);
  vital = genVital();
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('explainBar').style.display = 'none';
  renderPlay();
  showScreen('playScreen');
  timer = setInterval(function() {
    if (paused) return;
    time--;
    updateTimer();
    if (time <= 0) { clearInterval(timer); showDone(); }
  }, 1000);
}

function updateTimer() {
  var color = time > 15 ? '#34D399' : time > 6 ? '#FBBF24' : '#F87171';
  var el = document.getElementById('timerVal');
  el.textContent = time + 's';
  el.style.color = color;
  var fill = document.getElementById('timerFill');
  fill.style.width = (time / 45 * 100) + '%';
  fill.style.background = color;
}

function renderPlay() {
  updateTimer();
  document.getElementById('playScore').textContent = score;
  document.getElementById('playTotal').textContent = total;

  var sl = document.getElementById('streakLabel');
  if (streak >= 3) { sl.style.display = 'inline'; sl.textContent = '\uD83D\uDD25 ' + streak; }
  else sl.style.display = 'none';

  var cc = catColors[vital.category] || '#94A3B8';
  document.getElementById('vitalBadge').style.background = cc + '20';
  document.getElementById('vitalCat').style.color = cc;
  document.getElementById('vitalCat').textContent = vital.category;
  document.getElementById('vitalText').textContent = vital.label;

  var bn = document.getElementById('btnNormal');
  var ba = document.getElementById('btnAbnormal');
  bn.disabled = false; ba.disabled = false;
  bn.style.background = 'rgba(52,211,153,0.12)';
  bn.style.border = '2px solid rgba(52,211,153,0.4)';
  bn.style.color = '#34D399';
  ba.style.background = 'rgba(248,113,113,0.12)';
  ba.style.border = '2px solid rgba(248,113,113,0.4)';
  ba.style.color = '#F87171';
  bn.textContent = '\u2713 Normal';
  ba.textContent = '\u2717 Abnormal';
  bn.style.cursor = 'pointer';
  ba.style.cursor = 'pointer';
}

function answer(isNormal) {
  if (userPicked !== null) return;
  userPicked = isNormal;
  paused = true;
  var correct = isNormal === vital.normal;
  total++;
  if (correct) { score++; streak++; best = Math.max(best, streak); }
  else { streak = 0; missedVitals.push(vital); }
  gameHistory.push({ label: vital.label, normal: vital.normal, explain: vital.explain, userSaid: isNormal, correct: correct });

  var bn = document.getElementById('btnNormal');
  var ba = document.getElementById('btnAbnormal');
  bn.disabled = true; ba.disabled = true;
  bn.style.cursor = 'default'; ba.style.cursor = 'default';

  var explainBar = document.getElementById('explainBar');

  if (correct) {
    // Highlight the correct choice
    if (vital.normal) {
      bn.style.background = 'rgba(52,211,153,0.25)'; bn.style.border = '2.5px solid #34D399'; bn.style.color = '#34D399';
      bn.textContent = '\u2713 Normal — Correct!';
      ba.style.background = 'rgba(255,255,255,0.03)'; ba.style.border = '2px solid rgba(255,255,255,0.06)'; ba.style.color = '#64748B';
    } else {
      ba.style.background = 'rgba(248,113,113,0.25)'; ba.style.border = '2.5px solid #F87171'; ba.style.color = '#F87171';
      ba.textContent = '\u2717 Abnormal — Correct!';
      bn.style.background = 'rgba(255,255,255,0.03)'; bn.style.border = '2px solid rgba(255,255,255,0.06)'; bn.style.color = '#64748B';
    }
    explainBar.style.display = 'none';
  } else {
    // Wrong pick: mark it red, highlight the correct answer prominently
    if (isNormal) {
      // User said Normal, but it's Abnormal
      bn.style.background = 'rgba(248,113,113,0.18)'; bn.style.border = '2px solid #F87171'; bn.style.color = '#FCA5A5';
      bn.textContent = '\u2717 Normal — Wrong';
      ba.style.background = 'rgba(248,113,113,0.25)'; ba.style.border = '2.5px solid #F87171'; ba.style.color = '#F87171';
      ba.style.fontWeight = '800'; ba.style.fontSize = '18px';
      ba.textContent = '\u2713 Abnormal — Correct Answer';
    } else {
      // User said Abnormal, but it's Normal
      ba.style.background = 'rgba(248,113,113,0.18)'; ba.style.border = '2px solid #F87171'; ba.style.color = '#FCA5A5';
      ba.textContent = '\u2717 Abnormal — Wrong';
      bn.style.background = 'rgba(52,211,153,0.25)'; bn.style.border = '2.5px solid #34D399'; bn.style.color = '#34D399';
      bn.style.fontWeight = '800'; bn.style.fontSize = '18px';
      bn.textContent = '\u2713 Normal — Correct Answer';
    }
    // Show explanation
    explainBar.style.display = 'block';
    explainBar.style.background = 'rgba(251,191,36,0.12)';
    explainBar.style.border = '1px solid rgba(251,191,36,0.3)';
    explainBar.style.color = '#FBBF24';
    explainBar.textContent = vital.explain;
  }

  document.getElementById('playScore').textContent = score;
  document.getElementById('playTotal').textContent = total;
  document.getElementById('btnNext').style.display = 'block';
}

function advanceRound() {
  paused = false;
  userPicked = null;
  vital = genVital();
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('explainBar').style.display = 'none';
  var bn = document.getElementById('btnNormal');
  var ba = document.getElementById('btnAbnormal');
  bn.style.fontWeight = '700'; bn.style.fontSize = '17px';
  ba.style.fontWeight = '700'; ba.style.fontSize = '17px';
  renderPlay();
}

function showDone() {
  showScreen('doneScreen');
  var pct = total > 0 ? Math.round(score / total * 100) : 0;
  document.getElementById('doneEmoji').textContent = pct >= 80 ? '\uD83C\uDFAF' : '\uD83D\uDCDA';

  var stats = [
    { l: 'Score', v: score + '/' + total, c: '#34D399' },
    { l: 'Accuracy', v: pct + '%', c: '#60A5FA' },
    { l: 'Best Streak', v: best + ' \uD83D\uDD25', c: '#FBBF24' }
  ];
  var gridHTML = '';
  for (var i = 0; i < stats.length; i++) {
    gridHTML += '<div class="result-card"><div class="result-card-val" style="color:' + stats[i].c + '">' + stats[i].v + '</div><div class="result-card-label">' + stats[i].l + '</div></div>';
  }
  document.getElementById('resultsGrid').innerHTML = gridHTML;

  var missed = [];
  for (var j = 0; j < gameHistory.length; j++) {
    if (!gameHistory[j].correct) missed.push(gameHistory[j]);
  }
  missed = missed.slice(0, 6);

  var sec = document.getElementById('reviewSection');
  if (missed.length > 0) {
    var reviewHTML = '<div class="review-box"><div class="review-title">Review These</div>';
    for (var k = 0; k < missed.length; k++) {
      reviewHTML += '<div class="review-item"><div class="review-label">' + missed[k].label + '</div><div class="review-explain">' + missed[k].explain + '</div></div>';
    }
    reviewHTML += '</div>';
    sec.innerHTML = reviewHTML;
  } else {
    sec.innerHTML = '<p style="color:#34D399;font-size:14px;font-family:Inter,sans-serif;margin-bottom:20px;font-weight:500">Perfect round \u2014 no misses!</p>';
  }

  document.getElementById('btnRedo').style.display = missed.length > 0 ? 'inline-block' : 'none';
}

function redoMissed() {
  var redoList = missedVitals.slice();
  score = 0; total = 0; streak = 0; best = 0; time = 45; gameHistory = []; userPicked = null; missedVitals = []; paused = false;
  var redoIdx = 0;
  if (timer) clearInterval(timer);

  // Override genVital to serve missed vitals
  var origGen = genVital;
  genVital = function() {
    if (redoIdx < redoList.length) return redoList[redoIdx++];
    genVital = origGen;
    return origGen();
  };

  vital = genVital();
  document.getElementById('btnNext').style.display = 'none';
  document.getElementById('explainBar').style.display = 'none';
  renderPlay();
  showScreen('playScreen');
  timer = setInterval(function() {
    if (paused) return;
    time--;
    updateTimer();
    if (time <= 0) { clearInterval(timer); genVital = origGen; showDone(); }
  }, 1000);
}
</script>

<script>
(function(){
  const highlightBox = document.getElementById('tourHighlight');
  const tooltip = document.getElementById('tourTooltip');
  const stepCountEl = document.getElementById('tourStepCount');
  const titleEl = document.getElementById('tourTitle');
  const textEl = document.getElementById('tourText');
  const nextBtn = document.getElementById('tourNext');
  const backBtn = document.getElementById('tourBack');
  const skipBtn = document.getElementById('tourSkip');
  const replayBtn = document.getElementById('tourReplayBtn');

  function q(sel){ return document.querySelector(sel); }

  function enterPlayFrozen(){
    startGame();
    if(timer) clearInterval(timer);
  }

  function demoWrongPick(){
    if(userPicked !== null) return;
    answer(!vital.normal);
  }

  function previewDone(){
    if(timer) clearInterval(timer);
    showDone();
  }

  function resetToDefault(){
    if(timer) clearInterval(timer);
    showScreen('startScreen');
  }

  const steps = [
    {
      selector: '.center-wrap',
      placement: 'bottom',
      title: 'Welcome to Normal or Abnormal?',
      text: "A vital sign reading flashes on screen \u2014 decide if it's Normal or Abnormal before the 45-second clock runs out. Click Next to see how it works."
    },
    {
      selector: '.timer-row',
      placement: 'bottom',
      title: 'Timer, score & streak',
      text: 'The countdown ticks down as you play. Your score and a streak badge (once you hit 3 in a row) show here.',
      before: () => enterPlayFrozen(),
      delay: 300
    },
    {
      selector: '.vital-area',
      placement: 'bottom',
      title: 'Read the vital sign',
      text: 'Each round shows one reading \u2014 covering both adult and pediatric ranges \u2014 tagged by category.'
    },
    {
      selector: '.answer-grid',
      placement: 'top',
      title: 'Make the call',
      text: 'Tap Normal or Abnormal. The correct choice glows, and if you\u2019re wrong, your pick turns red so you can compare.',
      before: () => demoWrongPick(),
      delay: 300
    },
    {
      selector: '#explainBar',
      placement: 'top',
      title: 'See why',
      text: 'When you miss one, a quick explanation appears here so you know why the reading was normal or abnormal.'
    },
    {
      selector: '#btnNext',
      placement: 'top',
      title: 'Keep going',
      text: 'Click Next to move to the next reading \u2014 as fast as you can before time runs out!'
    },
    {
      selector: '.results-grid',
      placement: 'bottom',
      title: 'Your results',
      text: 'When time\u2019s up, you\u2019ll see your score, accuracy, and best streak, plus a review of anything you missed and a button to redo just those.',
      before: () => previewDone(),
      delay: 300
    }
  ];

  let current = -1;

  function showStep(i){
    if(i < 0) i = 0;
    if(i >= steps.length){ endTour(); return; }
    current = i;
    const step = steps[i];
    const wait = step.delay !== undefined ? step.delay : (step.before ? 300 : 60);
    if(step.before) step.before();
    setTimeout(() => renderStep(step, i), wait);
  }

  function renderStep(step, i){
    const target = q(step.selector);
    tooltip.classList.remove('tour-hidden');
    stepCountEl.textContent = `Step ${i + 1} of ${steps.length}`;
    titleEl.textContent = step.title;
    textEl.textContent = step.text;
    backBtn.style.visibility = i === 0 ? 'hidden' : 'visible';
    nextBtn.textContent = i === steps.length - 1 ? 'Finish' : 'Next';

    if(target){
      highlightBox.classList.remove('tour-hidden');
      const rect = target.getBoundingClientRect();
      const pad = 8;
      highlightBox.style.top = (rect.top - pad) + 'px';
      highlightBox.style.left = (rect.left - pad) + 'px';
      highlightBox.style.width = (rect.width + pad * 2) + 'px';
      highlightBox.style.height = (rect.height + pad * 2) + 'px';
      positionTooltip(rect, step.placement);
    } else {
      highlightBox.classList.add('tour-hidden');
      const ttRect = tooltip.getBoundingClientRect();
      tooltip.style.top = (window.innerHeight / 2 - ttRect.height / 2) + 'px';
      tooltip.style.left = (window.innerWidth / 2 - ttRect.width / 2) + 'px';
    }
  }

  function positionTooltip(rect, placement){
    const ttRect = tooltip.getBoundingClientRect();
    const margin = 16;
    let top, left;

    if(placement === 'bottom'){
      top = rect.bottom + margin;
      left = rect.left;
    } else {
      top = rect.top - ttRect.height - margin;
      left = rect.left;
    }

    if(top < margin){ top = rect.bottom + margin; }
    if(top + ttRect.height > window.innerHeight - margin){ top = rect.top - ttRect.height - margin; }

    left = Math.min(Math.max(margin, left), window.innerWidth - ttRect.width - margin);
    top = Math.min(Math.max(margin, top), window.innerHeight - ttRect.height - margin);

    tooltip.style.top = top + 'px';
    tooltip.style.left = left + 'px';
  }

  function startTour(){
    replayBtn.classList.add('tour-hidden');
    resetToDefault();
    setTimeout(() => showStep(0), 200);
  }

  function endTour(){
    tooltip.classList.add('tour-hidden');
    highlightBox.classList.add('tour-hidden');
    resetToDefault();
    replayBtn.classList.remove('tour-hidden');
  }

  nextBtn.addEventListener('click', () => showStep(current + 1));
  backBtn.addEventListener('click', () => showStep(current - 1));
  skipBtn.addEventListener('click', endTour);
  replayBtn.addEventListener('click', startTour);

  document.addEventListener('keydown', (e) => {
    if(tooltip.classList.contains('tour-hidden')) return;
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){
      e.preventDefault();
      showStep(current + 1);
    } else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
      e.preventDefault();
      showStep(current - 1);
    }
  });

  window.addEventListener('resize', () => {
    if(current >= 0 && current < steps.length) renderStep(steps[current], current);
  });

  window.addEventListener('load', () => setTimeout(startTour, 500));
})();
</script>

</body>
</html>
