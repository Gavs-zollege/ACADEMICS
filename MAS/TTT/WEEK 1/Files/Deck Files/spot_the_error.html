<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spot the Error</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B1D2C;
    --card-bg: #132F42;
    --border: rgba(255,255,255,0.15);
    --text-primary: #FFFFFF;
    --text-secondary: #E2E8F0;
    --text-muted: #94A3B8;
    --accent: #2DD4BF;
    --accent-dark: #14B8A6;
    --accent-hover: #5EEAD4;
    --green: #34D399;
    --green-bg: rgba(52,211,153,0.18);
    --green-text: #6EE7B7;
    --red: #F87171;
    --red-bg: rgba(248,113,113,0.18);
    --red-text: #FCA5A5;
    --amber: #FBBF24;
    --amber-bg: rgba(251,191,36,0.18);
    --amber-text: #FCD34D;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    height: 100vh;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* PLAY VIEW */
  .play-view { padding: 12px 16px 16px; height: 100vh; overflow-y: auto; }
  .play-inner { max-width: 660px; margin: 0 auto; }

  .header-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
  }
  .header-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--accent-hover);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    margin-bottom: 5px;
  }
  .header-title {
    font-size: 17px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    color: var(--text-primary);
    letter-spacing: -0.3px;
  }
  .header-score {
    font-size: 12px;
    color: var(--text-secondary);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    background: var(--card-bg);
    border: 1px solid var(--border);
    padding: 6px 14px;
    border-radius: 20px;
    white-space: nowrap;
    margin-top: 2px;
  }

  /* Progress bar */
  .progress-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 10px;
  }
  .progress-seg {
    flex: 1;
    height: 3px;
    border-radius: 2px;
    transition: background 0.3s;
  }

  /* Scenario box */
  .scenario-box {
    background: var(--card-bg);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
  }
  .scenario-title {
    font-size: 13px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    color: var(--text-primary);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .scenario-title-badge {
    font-size: 9px;
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--accent-hover);
    background: rgba(45,212,191,0.12);
    padding: 3px 10px;
    border-radius: 20px;
  }
  .scenario-text {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.55;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
  }

  /* Instructions */
  .instructions {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
  }
  .instructions strong {
    color: var(--text-secondary);
    font-weight: 600;
  }

  /* Items */
  .items-list {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin-bottom: 10px;
  }

  .item-wrapper { display: flex; flex-direction: column; }

  .item-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    padding: 9px 12px;
    background: var(--card-bg);
    border-radius: 8px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    font-family: 'Inter', sans-serif;
    border: 1.5px solid var(--border);
  }
  .item-btn:not(.locked):hover {
    border-color: var(--accent-hover);
    background: rgba(45,212,191,0.08);
  }
  .item-btn.selected { border-color: var(--accent); background: rgba(45,212,191,0.12); }
  .item-btn.locked { cursor: default; }

  .item-btn.result-correct-hit { background: var(--green-bg); border-color: var(--green); }
  .item-btn.result-missed-error { background: var(--amber-bg); border-color: var(--amber); }
  .item-btn.result-false-alarm { background: var(--red-bg); border-color: var(--red); }
  .item-btn.result-correct-pass { background: var(--card-bg); border-color: var(--border); opacity: 0.6; }

  .item-check {
    width: 22px;
    height: 22px;
    border-radius: 5px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: white;
    transition: all 0.15s;
  }
  .item-check.checked { border-color: var(--accent); background: var(--accent); }
  .item-check.check-green { border-color: var(--green); background: var(--green); }
  .item-check.check-red { border-color: var(--red); background: var(--red); }
  .item-check.check-amber { border-color: var(--amber); background: var(--amber); }

  .item-text {
    font-size: 12px;
    color: #F1F5F9;
    line-height: 1.35;
    font-weight: 500;
    font-family: 'Inter', sans-serif;
  }
  .item-btn.result-correct-hit .item-text { color: var(--green-text); font-weight: 600; }
  .item-btn.result-missed-error .item-text { color: var(--amber-text); font-weight: 600; }
  .item-btn.result-false-alarm .item-text { color: var(--red-text); font-weight: 600; }

  /* Explanation */
  .explanation {
    margin: 2px 0 2px 44px;
    font-size: 11px;
    color: var(--text-muted);
    line-height: 1.45;
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    animation: fadeSlideIn 0.25s ease;
  }
  .explanation.exp-hit { color: var(--green-text); }
  .explanation.exp-missed { color: var(--amber-text); }
  .explanation.exp-false { color: var(--red-text); }
  .explanation.exp-ok { color: var(--text-muted); }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Submit button */
  .submit-btn {
    width: 100%;
    padding: 11px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: transform 0.12s, box-shadow 0.12s, opacity 0.15s;
    letter-spacing: 0.2px;
  }
  .submit-btn.disabled {
    background: rgba(255,255,255,0.08);
    color: #64748B;
    cursor: default;
  }
  .submit-btn.active {
    background: linear-gradient(135deg, #14B8A6, #0D9488);
    color: white;
  }
  .submit-btn.active:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(20,184,166,0.4);
  }
  .submit-btn.active:active { transform: translateY(0); }

  /* DONE SCREEN */
  .done-wrap {
    height: 100vh;
    overflow-y: auto;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .done-inner { max-width: 480px; width: 100%; text-align: center; }
  .done-emoji { font-size: 40px; margin-bottom: 8px; }
  .done-title {
    font-size: 22px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    color: var(--text-primary);
    margin-bottom: 4px;
    letter-spacing: -0.4px;
  }
  .done-msg {
    color: var(--text-secondary);
    font-size: 13px;
    margin-bottom: 16px;
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
  }
  .done-box {
    background: var(--card-bg);
    border-radius: 14px;
    padding: 20px;
    border: 1px solid var(--border);
    margin-bottom: 16px;
  }
  .done-pct {
    font-size: 44px;
    font-weight: 800;
    font-family: 'Plus Jakarta Sans', sans-serif;
    line-height: 1;
    letter-spacing: -2px;
  }
  .done-label {
    color: var(--text-muted);
    font-size: 12px;
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-top: 6px;
  }
  .score-chips {
    margin-top: 14px;
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .score-chip {
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 700;
    font-family: 'Inter', sans-serif;
  }
  .btn-restart {
    background: linear-gradient(135deg, #14B8A6, #0D9488);
    color: white;
    border: none;
    padding: 11px 36px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    transition: transform 0.12s, box-shadow 0.12s;
  }
  .btn-restart:hover {
    transform: translateY(-1px);
    box-shadow: 0 6px 20px rgba(20,184,166,0.4);
  }
  .btn-redo {
    background: transparent;
    color: var(--accent-hover);
    border: 1.5px solid var(--accent-hover);
    padding: 10px 30px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Plus Jakarta Sans', sans-serif;
    margin-top: 10px;
    transition: transform 0.12s, background 0.12s;
  }
  .btn-redo:hover {
    background: rgba(94,234,212,0.12);
    transform: translateY(-1px);
  }

  .hidden { display: none !important; }

  /* ================= GUIDED TOUR ================= */
  .tour-hidden{ display:none !important; }
  #tourHighlight{
    position:fixed; z-index:9998; border-radius:14px; pointer-events:none;
    box-shadow: 0 0 0 9999px rgba(4,8,14,0.78);
    border: 2px solid var(--accent);
    transition: top .4s cubic-bezier(.4,0,.2,1), left .4s cubic-bezier(.4,0,.2,1),
                width .4s cubic-bezier(.4,0,.2,1), height .4s cubic-bezier(.4,0,.2,1);
  }
  #tourTooltip{
    position:fixed; z-index:10001; background: var(--card-bg); border-radius:14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    width:300px; max-width:88vw; padding:20px 22px;
    font-family:'Inter',sans-serif;
    border: 1px solid var(--border);
    transition: top .35s ease, left .35s ease;
  }
  #tourTooltip .tour-step-count{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    color: var(--accent-hover); margin-bottom:6px;
  }
  #tourTooltip h3{ font-family:'Plus Jakarta Sans',sans-serif; font-size:16px; font-weight:800; color: var(--text-primary); margin:0 0 8px; }
  #tourTooltip p{ font-size:13px; line-height:1.55; color: var(--text-secondary); margin:0 0 16px; }
  #tourTooltip .tour-actions{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #tourTooltip .tour-right{ display:flex; align-items:center; gap:10px; }
  #tourTooltip button.tour-btn{
    background: linear-gradient(135deg, #14B8A6, #0D9488); color:#fff; border:none; border-radius:8px;
    padding:9px 16px; font-weight:700; font-size:13px; cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;
  }
  #tourTooltip button.tour-btn:hover{ opacity:.9; }
  #tourTooltip button.tour-btn-secondary{
    background:transparent; color: var(--text-muted); border:none;
    font-size:12.5px; font-weight:600; cursor:pointer; padding:9px 2px; font-family:'Inter',sans-serif;
  }
  #tourTooltip button.tour-btn-secondary:hover{ color: var(--text-primary); text-decoration:underline; }
  #tourReplayBtn{
    position:fixed; bottom:20px; right:20px; z-index:9997;
    background: linear-gradient(135deg, #14B8A6, #0D9488); color:#fff; border:none; border-radius:999px;
    padding:12px 20px; font-weight:700; font-size:13px; cursor:pointer;
    box-shadow: 0 8px 24px rgba(20,184,166,.4);
    display:flex; align-items:center; gap:8px; font-family:'Plus Jakarta Sans',sans-serif;
  }
  #tourReplayBtn:hover{ opacity:.9; }
</style>
</head>
<body>

<div id="tourHighlight" class="tour-hidden"></div>
<div id="tourTooltip" class="tour-hidden">
  <div class="tour-step-count" id="tourStepCount"></div>
  <h3 id="tourTitle"></h3>
  <p id="tourText"></p>
  <div class="tour-actions">
    <button class="tour-btn-secondary" id="tourSkip">Skip tour</button>
    <div class="tour-right">
      <button class="tour-btn-secondary" id="tourBack">Back</button>
      <button class="tour-btn" id="tourNext">Next</button>
    </div>
  </div>
</div>
<button id="tourReplayBtn" class="tour-hidden">&#9654; Replay Tutorial</button>

<!-- PLAY VIEW -->
<div id="playView" class="play-view">
  <div class="play-inner">
    <div class="header-row">
      <div>
        <div class="header-label">Spot the Error</div>
        <h2 class="header-title" id="sceneLabel"></h2>
      </div>
      <span class="header-score" id="runningScore">Score: 0</span>
    </div>

    <div class="progress-bar" id="progressBar"></div>

    <div class="scenario-box">
      <div class="scenario-title">
        <span id="scenarioTitle"></span>
        <span class="scenario-title-badge">Clinical Scenario</span>
      </div>
      <p class="scenario-text" id="scenarioText"></p>
    </div>

    <p class="instructions"><strong>Tap every item you think is an error.</strong> Leave non-errors unchecked. Some items look wrong but aren&rsquo;t!</p>

    <div class="items-list" id="itemsList"></div>

    <button class="submit-btn disabled" id="submitBtn">Check My Answers</button>
  </div>
</div>

<!-- DONE VIEW -->
<div id="doneView" class="done-wrap hidden">
  <div class="done-inner">
    <div class="done-emoji" id="doneEmoji"></div>
    <h1 class="done-title">All Scenarios Complete!</h1>
    <p class="done-msg" id="doneMsg"></p>
    <div class="done-box">
      <div class="done-pct" id="donePct"></div>
      <div class="done-label">Overall accuracy</div>
      <div class="score-chips" id="scoreChips"></div>
    </div>
    <button class="btn-restart" onclick="restart()">Try Again</button>
    <button class="btn-redo" id="btnRedo" onclick="redoMissed()" style="display:none">Redo Missed</button>
  </div>
</div>

<script>
var SCENARIOS = [
  {
    title: "The Rushed BP Reading",
    scene: "A medical assistant seats a patient, immediately wraps the cuff over their sweater sleeve, and takes a blood pressure reading. The patient's legs are crossed and they're talking on their phone. The MA records 148/92 and flags it as Stage 2 Hypertension.",
    errors: [
      { id:"cuff", text:"Cuff placed over clothing", explanation:"The cuff must be placed on bare skin. Clothing can add 10\u201350 mmHg to the reading." },
      { id:"legs", text:"Patient's legs are crossed", explanation:"Crossed legs can raise systolic pressure by 2\u20138 mmHg. Feet should be flat on the floor." },
      { id:"phone", text:"Patient talking during measurement", explanation:"Talking elevates both BP and heart rate. Patient should sit quietly." },
      { id:"rest", text:"No rest period before measurement", explanation:"Patient should rest seated for 1\u20135 minutes before a BP reading." }
    ],
    notErrors: [
      { id:"flag", text:"Flagging 148/92 as Stage 2 HTN", explanation:"The classification is correct \u2014 148/92 falls into Stage 2 (\u2265\u202f140/\u2265\u202f90). The reading itself is likely inaccurate." },
      { id:"seat", text:"Seating the patient for BP", explanation:"Seated position is correct for routine BP measurement." }
    ]
  },
  {
    title: "The Temperature Mix-Up",
    scene: "A nurse takes a child's temperature using a tympanic thermometer in the left ear. The reading shows 99.2\u00b0F. The nurse documents: \"Temp 99.2\u00b0F (Ax) \u2014 within normal limits.\" The child had been drinking cold juice 5 minutes ago.",
    errors: [
      { id:"doc", text:"Documented as (Ax) instead of (T) or (AU)", explanation:"Tympanic readings are documented as (T) or (AU), not (Ax). (Ax) indicates axillary." },
      { id:"adjust", text:"Didn't account for tympanic reading being ~1\u00b0F higher than oral", explanation:"Tympanic reads ~1\u00b0F higher than oral. So 99.2\u00b0F tympanic \u2248 98.2\u00b0F oral \u2014 worth noting in context." }
    ],
    notErrors: [
      { id:"juice", text:"Cold juice consumption before reading", explanation:"Cold beverages affect oral temperatures, not tympanic. Tympanic measures infrared heat from the ear canal." },
      { id:"left", text:"Using the left ear", explanation:"Either ear can be used for tympanic measurement." },
      { id:"child", text:"Using tympanic on a child", explanation:"Tympanic thermometers are appropriate for children." }
    ]
  },
  {
    title: "The Patient ID Shortcut",
    scene: "The front desk calls out \"Maria Gonzalez?\" in the crowded waiting room. A woman stands up. The MA says \"Mrs. Gonzalez, date of birth June 5th, 1985 \u2014 is that correct?\" The patient nods yes. The MA proceeds to room her without further verification.",
    errors: [
      { id:"callout", text:"Calling the patient's full name in the waiting room", explanation:"Calling a full name in a crowded room is a potential HIPAA privacy concern." },
      { id:"confirm", text:"Reading the DOB to the patient and asking them to confirm", explanation:"Never read identifiers TO the patient. Ask them to STATE their date of birth." },
      { id:"nod", text:"Accepting a head nod as verification", explanation:"A nod is not reliable. The patient must verbally state their identifiers." }
    ],
    notErrors: [
      { id:"dob", text:"Using date of birth as a second identifier", explanation:"DOB is an appropriate second identifier. The problem is HOW it was verified." },
      { id:"twoid", text:"Using two identifiers (name + DOB)", explanation:"Two identifiers is correct protocol. The issue is the verification method." }
    ]
  },
  {
    title: "The Pediatric Scale Incident",
    scene: "An MA weighs a 6-month-old infant while the baby is wearing a diaper and onesie. The MA records the weight, then turns to the computer to enter it into the EHR while the baby is still on the scale. The parent is standing 4 feet away, looking at their phone.",
    errors: [
      { id:"clothes", text:"Weighing infant with diaper and clothing on", explanation:"Infants should be weighed without clothing or diaper. A wet diaper can significantly distort results." },
      { id:"turn", text:"Turning away from infant still on the scale", explanation:"Never turn away from an infant on a scale. Always keep one hand hovering over the baby." },
      { id:"parent", text:"Parent not positioned to assist", explanation:"The parent should be close and engaged, not 4 feet away on their phone." }
    ],
    notErrors: [
      { id:"six", text:"Weighing a 6-month-old on an infant scale", explanation:"Infant scales are appropriate up to about 2 years old." },
      { id:"ehr", text:"Recording weight in the EHR", explanation:"Entering weight is required \u2014 the error is when it happens (while the baby is still on the scale)." }
    ]
  },
  {
    title: "The SpO\u2082 Reading Puzzle",
    scene: "A patient's pulse oximeter reads 91%. The MA notices the patient has dark blue acrylic nails. She documents SpO\u2082 = 91% and tells the patient \"everything looks fine\" before continuing the intake. The patient mentions feeling slightly short of breath.",
    errors: [
      { id:"nails", text:"Didn't work around the acrylic nails", explanation:"Artificial nails can block infrared light and produce inaccurate SpO\u2082 readings. Try a different finger or site." },
      { id:"fine", text:"Told the patient \"everything looks fine\" at 91%", explanation:"91% is not fine. Normal SpO\u2082 is \u2265 95%. Below 90% requires immediate provider notification." },
      { id:"sob", text:"Didn't address the shortness of breath complaint", explanation:"Dyspnea paired with borderline SpO\u2082 must be reported to the provider immediately." }
    ],
    notErrors: [
      { id:"finger", text:"Using a fingertip for pulse oximetry", explanation:"Fingertip is the standard site. The issue here is the acrylic nails obstructing the reading." },
      { id:"document", text:"Documenting the SpO\u2082 reading", explanation:"Documenting is correct. The problems are failing to troubleshoot and failing to report." }
    ]
  }
];

var sceneIdx = 0;
var selected = {};
var submitted = false;
var scores = [];
var missedScenes = [];
var ORIG_SCENARIOS = SCENARIOS.slice();

function getAllItems(sc) {
  var all = [];
  for (var i = 0; i < sc.errors.length; i++) {
    all.push({ id: sc.errors[i].id, text: sc.errors[i].text, explanation: sc.errors[i].explanation, isError: true });
  }
  for (var j = 0; j < sc.notErrors.length; j++) {
    all.push({ id: sc.notErrors[j].id, text: sc.notErrors[j].text, explanation: sc.notErrors[j].explanation, isError: false });
  }
  all.sort(function(a, b) { return a.id.localeCompare(b.id); });
  return all;
}

function countSelected() {
  var n = 0;
  for (var k in selected) { if (selected[k]) n++; }
  return n;
}

function render() {
  var playView = document.getElementById('playView');
  var doneView = document.getElementById('doneView');

  if (sceneIdx === -1) {
    playView.classList.add('hidden');
    doneView.classList.remove('hidden');
    renderDone();
    return;
  }

  playView.classList.remove('hidden');
  doneView.classList.add('hidden');

  var sc = SCENARIOS[sceneIdx];
  var items = getAllItems(sc);
  var totalScore = 0;
  for (var s = 0; s < scores.length; s++) totalScore += scores[s].pts;

  document.getElementById('sceneLabel').textContent = 'Scenario ' + (sceneIdx + 1) + ' of ' + SCENARIOS.length;
  document.getElementById('runningScore').textContent = 'Score: ' + totalScore;

  // Progress bar
  var bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  for (var i = 0; i < SCENARIOS.length; i++) {
    var seg = document.createElement('div');
    seg.className = 'progress-seg';
    seg.style.background = i < sceneIdx ? '#34D399' : i === sceneIdx ? 'var(--accent)' : 'rgba(255,255,255,0.1)';
    bar.appendChild(seg);
  }

  document.getElementById('scenarioTitle').textContent = sc.title;
  document.getElementById('scenarioText').textContent = sc.scene;

  // Items list
  var list = document.getElementById('itemsList');
  list.innerHTML = '';

  for (var k = 0; k < items.length; k++) {
    (function(item) {
      var isSel = !!selected[item.id];

      var wrapper = document.createElement('div');
      wrapper.className = 'item-wrapper';

      var btn = document.createElement('button');
      btn.type = 'button';

      var check = document.createElement('span');
      var text = document.createElement('span');
      text.className = 'item-text';
      text.textContent = item.text;

      if (!submitted) {
        btn.className = 'item-btn' + (isSel ? ' selected' : '');
        check.className = 'item-check' + (isSel ? ' checked' : '');
        check.textContent = isSel ? '\u2713' : '';
        btn.addEventListener('click', function() {
          selected[item.id] = !selected[item.id];
          render();
        });
      } else {
        btn.className = 'item-btn locked';
        // Determine result class
        if (item.isError && isSel) {
          btn.classList.add('result-correct-hit');
          check.className = 'item-check check-green';
          check.textContent = '\u2713';
        } else if (item.isError && !isSel) {
          btn.classList.add('result-missed-error');
          check.className = 'item-check check-amber';
          check.textContent = '!';
        } else if (!item.isError && isSel) {
          btn.classList.add('result-false-alarm');
          check.className = 'item-check check-red';
          check.textContent = '\u2717';
        } else {
          btn.classList.add('result-correct-pass');
          check.className = 'item-check';
          check.textContent = '';
        }

        // Explanation
        var expl = document.createElement('div');
        var expCls = 'explanation';
        if (item.isError && isSel) expCls += ' exp-hit';
        else if (item.isError && !isSel) expCls += ' exp-missed';
        else if (!item.isError && isSel) expCls += ' exp-false';
        else expCls += ' exp-ok';
        expl.className = expCls;
        var prefix = item.isError && isSel ? '\u2713 Caught: '
          : item.isError && !isSel ? '\u26a0 Missed: '
          : !item.isError && isSel ? '\u2717 Not an error: '
          : '\u2014 ';
        expl.textContent = prefix + item.explanation;
        wrapper.appendChild(btn);
        wrapper.appendChild(expl);
      }

      btn.appendChild(check);
      btn.appendChild(text);
      if (submitted) {
        // already appended above
      } else {
        wrapper.appendChild(btn);
      }

      list.appendChild(wrapper);
    })(items[k]);
  }

  // Submit button
  var submitBtn = document.getElementById('submitBtn');
  if (!submitted) {
    submitBtn.textContent = 'Check My Answers';
    submitBtn.className = 'submit-btn ' + (countSelected() === 0 ? 'disabled' : 'active');
    submitBtn.onclick = handleSubmit;
  } else {
    submitBtn.textContent = (sceneIdx + 1 >= SCENARIOS.length) ? 'See Final Results' : 'Next Scenario \u2192';
    submitBtn.className = 'submit-btn active';
    submitBtn.onclick = handleNext;
  }
}

function handleSubmit() {
  if (countSelected() === 0) return;
  var sc = SCENARIOS[sceneIdx];
  var items = getAllItems(sc);
  var pts = 0;
  for (var i = 0; i < items.length; i++) {
    var userSaid = !!selected[items[i].id];
    if (items[i].isError && userSaid) pts++;
    else if (!items[i].isError && !userSaid) pts++;
  }
  scores.push({ scene: sceneIdx, pts: pts, max: items.length });
  if (pts < items.length) missedScenes.push(sceneIdx);
  submitted = true;
  render();
}

function handleNext() {
  if (sceneIdx + 1 >= SCENARIOS.length) {
    sceneIdx = -1;
  } else {
    sceneIdx++;
    selected = {};
    submitted = false;
  }
  render();
}

function renderDone() {
  var totalPts = 0, totalMax = 0;
  for (var i = 0; i < scores.length; i++) { totalPts += scores[i].pts; totalMax += scores[i].max; }
  var pct = totalMax > 0 ? Math.round(totalPts / totalMax * 100) : 0;

  document.getElementById('doneEmoji').textContent = pct >= 80 ? '\uD83D\uDD0D' : '\uD83D\uDCDA';
  document.getElementById('doneMsg').textContent = pct >= 85
    ? "Sharp clinical eye \u2014 you caught nearly everything!"
    : pct >= 65 ? "Good awareness \u2014 review the tricky ones."
    : "Keep studying \u2014 attention to detail saves patients.";
  document.getElementById('donePct').textContent = pct + '%';
  document.getElementById('donePct').style.color = pct >= 80 ? '#34D399' : '#FBBF24';

  var chips = document.getElementById('scoreChips');
  chips.innerHTML = '';
  for (var j = 0; j < scores.length; j++) {
    var s = scores[j];
    var ratio = s.pts / s.max;
    var chip = document.createElement('div');
    chip.className = 'score-chip';
    chip.style.background = ratio >= 1 ? 'rgba(52,211,153,0.2)' : ratio >= 0.7 ? 'rgba(251,191,36,0.2)' : 'rgba(248,113,113,0.2)';
    chip.style.color = ratio >= 1 ? '#6EE7B7' : ratio >= 0.7 ? '#FCD34D' : '#FCA5A5';
    chip.textContent = 'S' + (j + 1) + ': ' + s.pts + '/' + s.max;
    chips.appendChild(chip);
  }

  document.getElementById('btnRedo').style.display = missedScenes.length > 0 ? 'inline-block' : 'none';
}

function restart() {
  SCENARIOS = ORIG_SCENARIOS.slice();
  sceneIdx = 0; selected = {}; submitted = false; scores = []; missedScenes = [];
  render();
}

function redoMissed() {
  var redo = [];
  for (var i = 0; i < missedScenes.length; i++) {
    redo.push(ORIG_SCENARIOS[missedScenes[i]]);
  }
  SCENARIOS = redo;
  sceneIdx = 0; selected = {}; submitted = false; scores = []; missedScenes = [];
  render();
}

render();
</script>

<script>
(function(){
  const highlightBox = document.getElementById('tourHighlight');
  const tooltip = document.getElementById('tourTooltip');
  const stepCountEl = document.getElementById('tourStepCount');
  const titleEl = document.getElementById('tourTitle');
  const textEl = document.getElementById('tourText');
  const nextBtn = document.getElementById('tourNext');
  const backBtn = document.getElementById('tourBack');
  const skipBtn = document.getElementById('tourSkip');
  const replayBtn = document.getElementById('tourReplayBtn');

  function q(sel){ return document.querySelector(sel); }

  function demoSelect(){
    const sc = SCENARIOS[sceneIdx];
    if(sc.errors[0]) selected[sc.errors[0].id] = true;
    if(sc.notErrors && sc.notErrors[0]) selected[sc.notErrors[0].id] = true;
    render();
  }

  function demoSubmit(){
    handleSubmit();
  }

  function previewDone(){
    sceneIdx = -1;
    render();
  }

  function resetToDefault(){
    restart();
  }

  const steps = [
    {
      selector: '.scenario-box',
      placement: 'bottom',
      title: 'Welcome to Spot the Error',
      text: "Read each clinical scenario, then find every action that was a mistake. Click Next to see how it works."
    },
    {
      selector: '.instructions',
      placement: 'bottom',
      title: 'Tap every error you spot',
      text: 'Some items look wrong but aren\u2019t \u2014 leave those unchecked. Only select the ones you think are actual errors.'
    },
    {
      selector: '.items-list',
      placement: 'top',
      title: 'Select items',
      text: 'Tap an item to check it. We\u2019ve pre-selected a couple here to demonstrate.',
      before: () => demoSelect()
    },
    {
      selector: '#submitBtn',
      placement: 'top',
      title: 'Check your answers',
      text: 'Once you\u2019ve made your selections, tap here to see how you did.',
      before: () => demoSubmit(),
      delay: 300
    },
    {
      selector: '.items-list',
      placement: 'top',
      title: 'Read the results',
      text: 'Green means you caught a real error, amber means you missed one, red means you flagged something that wasn\u2019t actually wrong, and grey means you correctly left it unchecked \u2014 each with an explanation.'
    },
    {
      selector: '#submitBtn',
      placement: 'top',
      title: 'Move to the next scenario',
      text: 'Click here to continue through all the scenarios.'
    },
    {
      selector: '.done-inner',
      placement: 'bottom',
      title: 'Your results',
      text: 'At the end, you\u2019ll see your overall accuracy, a per-scenario breakdown, and options to try again or redo just the ones you missed.',
      before: () => previewDone(),
      delay: 300
    }
  ];

  let current = -1;

  function showStep(i){
    if(i < 0) i = 0;
    if(i >= steps.length){ endTour(); return; }
    current = i;
    const step = steps[i];
    const wait = step.delay !== undefined ? step.delay : (step.before ? 300 : 60);
    if(step.before) step.before();
    setTimeout(() => renderStep(step, i), wait);
  }

  function renderStep(step, i){
    const target = q(step.selector);
    tooltip.classList.remove('tour-hidden');
    stepCountEl.textContent = `Step ${i + 1} of ${steps.length}`;
    titleEl.textContent = step.title;
    textEl.textContent = step.text;
    backBtn.style.visibility = i === 0 ? 'hidden' : 'visible';
    nextBtn.textContent = i === steps.length - 1 ? 'Finish' : 'Next';

    if(target){
      highlightBox.classList.remove('tour-hidden');
      const rect = target.getBoundingClientRect();
      const pad = 8;
      highlightBox.style.top = (rect.top - pad) + 'px';
      highlightBox.style.left = (rect.left - pad) + 'px';
      highlightBox.style.width = (rect.width + pad * 2) + 'px';
      highlightBox.style.height = (rect.height + pad * 2) + 'px';
      positionTooltip(rect, step.placement);
    } else {
      highlightBox.classList.add('tour-hidden');
      const ttRect = tooltip.getBoundingClientRect();
      tooltip.style.top = (window.innerHeight / 2 - ttRect.height / 2) + 'px';
      tooltip.style.left = (window.innerWidth / 2 - ttRect.width / 2) + 'px';
    }
  }

  function positionTooltip(rect, placement){
    const ttRect = tooltip.getBoundingClientRect();
    const margin = 16;
    let top, left;

    if(placement === 'bottom'){
      top = rect.bottom + margin;
      left = rect.left;
    } else {
      top = rect.top - ttRect.height - margin;
      left = rect.left;
    }

    if(top < margin){ top = rect.bottom + margin; }
    if(top + ttRect.height > window.innerHeight - margin){ top = rect.top - ttRect.height - margin; }

    left = Math.min(Math.max(margin, left), window.innerWidth - ttRect.width - margin);
    top = Math.min(Math.max(margin, top), window.innerHeight - ttRect.height - margin);

    tooltip.style.top = top + 'px';
    tooltip.style.left = left + 'px';
  }

  function startTour(){
    replayBtn.classList.add('tour-hidden');
    resetToDefault();
    setTimeout(() => showStep(0), 200);
  }

  function endTour(){
    tooltip.classList.add('tour-hidden');
    highlightBox.classList.add('tour-hidden');
    resetToDefault();
    replayBtn.classList.remove('tour-hidden');
  }

  nextBtn.addEventListener('click', () => showStep(current + 1));
  backBtn.addEventListener('click', () => showStep(current - 1));
  skipBtn.addEventListener('click', endTour);
  replayBtn.addEventListener('click', startTour);

  document.addEventListener('keydown', (e) => {
    if(tooltip.classList.contains('tour-hidden')) return;
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){
      e.preventDefault();
      showStep(current + 1);
    } else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
      e.preventDefault();
      showStep(current - 1);
    }
  });

  window.addEventListener('resize', () => {
    if(current >= 0 && current < steps.length) renderStep(steps[current], current);
  });

  window.addEventListener('load', () => setTimeout(startTour, 500));
})();
</script>

</body>
</html>
