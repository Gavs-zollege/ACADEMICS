<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:14px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 10px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Glossary</h1>
  <p class="sub">Patient Intake & Vital Signs</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar">
    <div class="count" id="count"></div>
  </div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Patient ID & Safety",color:"#E05555",terms:[
    {term:"Patient Identifier",def:"A piece of information used to confirm a patient's identity. The two most common identifiers are full name and date of birth."},
    {term:"Medical Record Number (MRN)",def:"A unique number assigned to each patient within a healthcare system's electronic health record."},
    {term:"Demographics",def:"Basic personal information about a patient collected and verified at every visit, including full name, address, phone number, date of birth, insurance, and emergency contact."},
    {term:"The Joint Commission",def:"A nonprofit organization that accredits and certifies healthcare organizations in the United States. Establishes patient safety standards."},
    {term:"Medication Reconciliation",def:"A formal safety process comparing medications a patient is currently taking against those listed in the medical record."},
  ]},
  {name:"Patient History",color:"#5B8CDB",terms:[
    {term:"Chief Complaint (CC)",def:"The main reason a patient is seeking care, documented in the patient's own words and placed in quotation marks."},
    {term:"Subjective Information",def:"Information felt, experienced, or described by the patient that cannot be directly measured. Examples: pain, nausea, dizziness."},
    {term:"Objective Information",def:"Information that can be directly observed, measured, or documented — such as vital signs, lab results, and physical exam findings."},
    {term:"Medical History",def:"A record of a patient's past illnesses, diagnoses, surgeries, hospitalizations, and procedures."},
    {term:"Family History",def:"A record of illnesses, diseases, and health conditions in a patient's immediate family. Helps identify genetic predispositions."},
    {term:"Social History",def:"Information about a patient's lifestyle including diet, exercise, tobacco/alcohol use, recreational drug use, and living situation."},
    {term:"Occupational History",def:"A record of past and current employment, with attention to occupational hazards and exposures."},
    {term:"Allergy",def:"An immune system reaction to a specific substance. The allergen and type of reaction must be documented and flagged."},
    {term:"Anaphylaxis",def:"A severe, potentially life-threatening allergic reaction requiring immediate emergency treatment."},
  ]},
  {name:"Blood Pressure",color:"#E74C6F",terms:[
    {term:"Blood Pressure (BP)",def:"Measurement of the force exerted by circulating blood against artery walls. Recorded as systolic over diastolic in mmHg."},
    {term:"Systolic Pressure",def:"The top number in a blood pressure reading. Represents pressure when the heart contracts and pumps blood."},
    {term:"Diastolic Pressure",def:"The bottom number in a blood pressure reading. Represents pressure when the heart is at rest between beats."},
    {term:"Sphygmomanometer",def:"The medical instrument used to measure blood pressure, consisting of an inflatable cuff and a pressure gauge."},
    {term:"Korotkoff Sounds",def:"Five distinct sounds heard through a stethoscope during manual blood pressure measurement."},
    {term:"Hypertension",def:"Chronically elevated blood pressure. Stages: Elevated (120–129/<80), Stage 1 (130–139 or 80–89), Stage 2 (≥140 or ≥90)."},
    {term:"Hypertensive Crisis",def:"A medical emergency where blood pressure exceeds 180/120 mmHg. Requires immediate care."},
    {term:"Palpatory Method",def:"A technique to estimate systolic BP by feeling the radial pulse rather than listening with a stethoscope."},
    {term:"Auscultation",def:"The act of listening to sounds within the body, typically with a stethoscope. Used when measuring blood pressure."},
    {term:"Antecubital Space",def:"The inner bend of the elbow. Standard placement site for the blood pressure cuff."},
    {term:"Orthostatic Hypotension",def:"A significant drop in BP (≥20 mmHg systolic or ≥10 mmHg diastolic) when moving from lying to sitting or standing."},
    {term:"Postural Hypotension",def:"Another term for orthostatic hypotension. Can indicate dehydration, heart disease, or medication effects."},
  ]},
  {name:"Pulse",color:"#8B6AAE",terms:[
    {term:"Pulse Rate",def:"The number of times the heart beats per minute. Normal adult range: 60–100 bpm."},
    {term:"Radial Pulse",def:"The pulse felt on the thumb side of the wrist at the radial artery. Most common site for adults."},
    {term:"Brachial Pulse",def:"The pulse felt on the inside of the upper arm. Most common site for infants/children and BP measurement."},
    {term:"Carotid Pulse",def:"The pulse felt in the neck at the carotid artery. Most commonly used during emergencies and CPR."},
    {term:"Apical Pulse",def:"The pulse measured by listening directly over the apex of the heart with a stethoscope. Always counted for a full minute."},
    {term:"Bradycardia",def:"A heart rate below 60 bpm in adults. May be normal in athletes but can indicate cardiac or metabolic problems."},
    {term:"Tachycardia",def:"A heart rate above 100 bpm in adults. Can be caused by fever, pain, anxiety, dehydration, or cardiac conditions."},
    {term:"Thready Pulse",def:"A pulse that is weak, faint, or difficult to detect. May indicate low blood pressure or shock."},
    {term:"Bounding Pulse",def:"A pulse that feels abnormally strong or forceful. May indicate elevated BP or fever."},
    {term:"Irregular Rhythm",def:"A pulse that does not beat at a consistent, even interval. Should be reported to the provider."},
  ]},
  {name:"Respiration",color:"#1A8A7D",terms:[
    {term:"Respiratory Rate",def:"The number of complete breaths per minute. Normal adult range: 12–20 breaths/min."},
    {term:"Tachypnea",def:"Abnormally fast respiratory rate, greater than 20 breaths/min in adults."},
    {term:"Bradypnea",def:"Abnormally slow respiratory rate, fewer than 12 breaths/min in adults."},
    {term:"Dyspnea",def:"Difficult, labored, or painful breathing. Commonly associated with asthma, COPD, pneumonia, or heart failure."},
    {term:"Apnea",def:"A temporary pause or complete cessation of breathing."},
    {term:"Hyperventilation",def:"Abnormally rapid and deep breathing causing a decrease in blood CO₂ levels."},
    {term:"Orthopnea",def:"Difficulty breathing that occurs when lying flat, relieved by sitting or standing upright."},
    {term:"Wheezing",def:"A high-pitched whistling sound during breathing through narrowed airways."},
    {term:"Rales",def:"Abnormal crackling or clicking sounds heard on lung auscultation, usually during inhalation."},
    {term:"Rhonchi",def:"Low-pitched, rumbling sounds heard in the larger airways during breathing."},
  ]},
  {name:"Temperature",color:"#E8976A",terms:[
    {term:"Body Temperature",def:"Measurement of the body's ability to generate and release heat. Normal adult oral ≈ 98.6°F (37°C)."},
    {term:"Pyrexia",def:"The medical term for fever — an elevation in body temperature above the normal range."},
    {term:"Afebrile",def:"Having no fever. Body temperature within the normal range."},
    {term:"Febrile",def:"Having a fever. Body temperature above the normal range."},
    {term:"Axillary Temperature",def:"Temperature measured in the armpit. Approximately 1°F lower than oral temperature."},
    {term:"Tympanic Temperature",def:"Temperature measured in the ear canal using infrared technology. Approximately 1°F higher than oral."},
    {term:"Temporal Artery Temperature",def:"Temperature measured by scanning the forehead over the temporal artery. Approximately 1°F higher than oral."},
    {term:"Rectal Temperature",def:"Temperature measured in the rectum. The most accurate method for measuring core body temperature."},
    {term:"Frenulum Linguae",def:"The thin membrane on the underside of the tongue. Thermometer probe placed beside it for oral temperature."},
    {term:"Malaise",def:"A general feeling of discomfort, illness, or lack of energy that often accompanies fever."},
  ]},
  {name:"Pulse Oximetry",color:"#4A90B8",terms:[
    {term:"Pulse Oximetry",def:"A non-invasive method of measuring oxygen saturation in the blood using a probe with infrared light."},
    {term:"SpO₂",def:"Oxygen saturation measured by pulse oximeter. Normal: ≥95%. Below 90% requires immediate reporting."},
    {term:"Hypoxemia",def:"An abnormally low level of oxygen in the blood. Defined as SpO₂ below 90%."},
    {term:"Oxygen Saturation",def:"The percentage of hemoglobin carrying oxygen. Normal SpO₂ ≥95% for most adults."},
  ]},
  {name:"Pain Assessment",color:"#E2B94C",terms:[
    {term:"Pain Scale (0–10)",def:"A standardized numerical tool to measure self-reported pain. Zero = no pain, ten = worst pain imaginable."},
    {term:"Wong-Baker Faces Scale",def:"A pain assessment tool using illustrated faces ranging from happy to crying. Designed for children."},
    {term:"Nonverbal Pain Cues",def:"Observable signs of pain in patients who cannot verbally communicate: grimacing, guarding, rigid posture, moaning."},
  ]},
  {name:"Menstrual History",color:"#C4A84D",terms:[
    {term:"Last Menstrual Period (LMP)",def:"The first day of a patient's most recent menstrual cycle. Recorded at every visit for menstruating patients."},
    {term:"Menstruation",def:"The monthly shedding of the uterine lining through vaginal bleeding. Typically every 28 days."},
    {term:"Endometrium",def:"The inner mucous membrane lining of the uterus. Thickens monthly in preparation for pregnancy."},
    {term:"Estimated Due Date (EDD)",def:"The projected date of delivery calculated from the LMP. Typically 40 weeks from LMP."},
  ]},
  {name:"Anthropometrics",color:"#4CAF90",terms:[
    {term:"Anthropometric Measurements",def:"Physical measurements of the human body used to assess health: height, weight, head circumference, waist circumference."},
    {term:"Body Mass Index (BMI)",def:"A screening tool estimating body fat based on height and weight. Formula: weight (kg) ÷ height² (m²)."},
    {term:"Stadiometer",def:"A height-measuring device with a vertical ruler and movable horizontal headpiece."},
    {term:"Head Circumference",def:"Measurement of the widest part of an infant's head. Monitored birth to 36 months."},
  ]},
  {name:"Pediatric Growth",color:"#7D6AAE",terms:[
    {term:"Growth Chart",def:"A standardized graph plotting a child's height, weight, and head circumference against national data by age and sex."},
    {term:"Growth Percentile",def:"A measurement indicating what percentage of same-age, same-sex children are at or below a given measurement."},
    {term:"Length",def:"Measurement of an infant's body from head to heel, taken while lying flat."},
    {term:"Well-Child Visit",def:"A routine preventive healthcare appointment including growth measurements, developmental screening, and immunization review."},
  ]},
  {name:"Screenings",color:"#3A9E8F",terms:[
    {term:"PHQ-2",def:"A brief two-question depression screening tool. A positive result prompts the full PHQ-9."},
    {term:"PHQ-9",def:"A nine-question depression screening tool to assess severity. Completed when PHQ-2 is positive."},
    {term:"GAD-7",def:"A seven-question screening questionnaire for generalized anxiety disorder."},
    {term:"Mini-Mental State Exam",def:"A brief cognitive screening tool for older adults evaluating memory, orientation, attention, and language."},
    {term:"Depression",def:"A mental health condition characterized by persistent sadness, loss of interest, fatigue, and difficulty concentrating."},
    {term:"Anxiety",def:"A mental health condition characterized by excessive worry, fear, or nervousness with physical symptoms."},
    {term:"White Coat Syndrome",def:"Elevated BP or anxiety specifically in a clinical setting due to stress. Can lead to falsely elevated readings."},
  ]},
  {name:"Unit Conversions",color:"#6B7B8D",terms:[
    {term:"mmHg",def:"Millimeters of mercury — the unit of measurement for blood pressure."},
    {term:"Fahrenheit (°F)",def:"Temperature scale used in US clinical practice. Normal adult oral temp ≈ 98.6°F."},
    {term:"Celsius (°C)",def:"Metric temperature scale. Normal adult oral temp ≈ 37°C."},
    {term:"°F to °C",def:"Formula: °C = (°F − 32) ÷ 1.8. Example: 99°F → 37.2°C."},
    {term:"°C to °F",def:"Formula: °F = (°C × 1.8) + 32. Example: 38°C → 100.4°F."},
    {term:"Pounds to Kilograms",def:"Formula: kg = lb ÷ 2.2. Used when medication dosing requires weight in kilograms."},
    {term:"Kilograms to Pounds",def:"Formula: lb = kg × 2.2."},
    {term:"Inches to Feet/Inches",def:"Formula: divide total inches by 12. Whole number = feet; remainder = inches."},
  ]},
];

const glossary=[];
const catNames=["All"];
const catColors={};
CATEGORIES.forEach(cat=>{
  catNames.push(cat.name);
  catColors[cat.name]=cat.color;
  cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));
});

let filter="All",search="",openIdx=null,currentPage=0;
const PER_PAGE=4;

function renderFilters(){
  document.getElementById('filters').innerHTML=catNames.map(c=>{
    const col=c==="All"?"#7a7f90":(catColors[c]||"#888");
    const active=filter===c;
    return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;
  }).join('');
}

function getFiltered(){
  const s=search.toLowerCase();
  return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));
}

function renderList(){
  const filtered=getFiltered();
  const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  if(currentPage>=totalPages) currentPage=totalPages-1;
  if(currentPage<0) currentPage=0;
  const start=currentPage*PER_PAGE;
  const pageItems=filtered.slice(start,start+PER_PAGE);

  document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;

  if(!filtered.length){
    document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';
    document.getElementById('pager').innerHTML='';
    return;
  }

  document.getElementById('list').innerHTML=pageItems.map(g=>{
    const col=catColors[g.category]||"#888";
    const origIdx=glossary.indexOf(g);
    const isOpen=openIdx===origIdx;
    return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})">
      <div class="item-head">
        <div class="item-left">
          <div class="item-bar" style="background:${col}"></div>
          <span class="item-term">${g.term}</span>
        </div>
        <span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span>
      </div>
      <div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div>
    </div>`;
  }).join('');

  let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button>`;
  ph+=`<div class="pg-dots">`;
  for(let p=0;p<totalPages;p++){
    ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;
  }
  ph+=`</div>`;
  ph+=`<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;
  document.getElementById('pager').innerHTML=ph;
}

function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
