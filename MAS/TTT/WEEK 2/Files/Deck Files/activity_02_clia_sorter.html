<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLIA Complexity Sorter</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Fredoka',sans-serif;color:#FFFFFF}
.wrap{max-width:720px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}
.header{text-align:center;margin-bottom:8px;flex-shrink:0}
.header .icon{font-size:32px}
h1{font-weight:700;font-size:22px;margin:4px 0 2px;color:#FFF}
.sub{color:#94A3B8;font-weight:500;font-size:13px}
.score{color:#FBBF24;font-weight:600;font-size:13px;margin-top:4px}
.prompt{background:rgba(45,212,191,0.08);padding:12px 18px;border-radius:14px;text-align:center;margin-bottom:8px;border:1.5px solid rgba(45,212,191,0.2);flex-shrink:0}
.prompt .label{color:#94A3B8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.prompt .item{color:#FFF;font-size:18px;font-weight:700}
.prompt .rem{color:#94A3B8;font-size:12px;margin-top:4px}
.fb{text-align:center;padding:8px;margin-bottom:6px;border-radius:10px;font-weight:700;font-size:14px;flex-shrink:0}
.fb.ok{background:rgba(52,211,153,.15);color:#34d399}
.fb.no{background:rgba(248,113,113,.15);color:#FCA5A5}
.game-area{flex:1;min-height:0;display:flex;flex-direction:column}
.buckets{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-height:0;overflow-y:auto;align-content:start;padding-bottom:8px}
.bucket{flex:1 1 180px;min-width:150px;background:#132F42;border-radius:14px;padding:12px;cursor:pointer;transition:all .18s}
.bucket:hover{filter:brightness(1.15);transform:translateY(-1px)}
.bucket h3{font-weight:700;font-size:14px;text-align:center;margin-bottom:2px}
.bucket .hint{color:#94A3B8;font-size:11px;text-align:center;margin-bottom:8px;font-weight:500}
.bucket .placed{padding:5px 10px;border-radius:8px;margin-bottom:4px;font-size:12px;font-weight:600}
.bucket-0{border:2px solid rgba(52,211,153,.3)}.bucket-0 h3{color:#34D399}.bucket-0 .placed{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.15)}
.bucket-1{border:2px solid rgba(251,191,36,.3)}.bucket-1 h3{color:#FBBF24}.bucket-1 .placed{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.15)}
.bucket-2{border:2px solid rgba(248,113,113,.3)}.bucket-2 h3{color:#F87171}.bucket-2 .placed{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.15)}
.bucket.correct-flash{box-shadow:0 0 0 3px rgba(52,211,153,0.5);filter:brightness(1.2)}
.bucket.wrong-flash{box-shadow:0 0 0 3px rgba(248,113,113,0.5)}
.next-btn{display:none;width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-bottom:8px;flex-shrink:0;transition:transform .12s}
.next-btn:hover{transform:translateY(-1px)}
.done{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);flex-shrink:0;margin:auto 0}
.done .big{font-size:40px}
.done h2{font-weight:700;font-size:24px;margin:8px 0 4px;color:#FFF}
.done .tip{color:#E2E8F0;font-weight:500;font-size:13px;margin-bottom:16px;line-height:1.5}
.btn{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:transform .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}
.btn-redo{padding:10px 28px;border:1.5px solid #5EEAD4;border-radius:10px;background:transparent;color:#5EEAD4;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px;transition:transform .12s,background .12s}
.btn-redo:hover{background:rgba(94,234,212,0.1);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="icon">🧪</div>
    <h1>CLIA Complexity Sorter</h1>
    <p class="sub">Sort each test into the correct CLIA complexity level</p>
    <p class="score" id="scoreDisplay">Score: 0 / 10</p>
  </div>
  <div id="game" class="game-area">
    <div class="prompt" id="promptBox"></div>
    <div class="fb" id="feedback" style="display:none"></div>
    <button class="next-btn" id="nextBtn" onclick="nextItem()">Next →</button>
    <div class="buckets" id="bucketsRow"></div>
  </div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
const BUCKETS=["CLIA-Waived","Moderate Complexity","High Complexity"];
const ICONS=["🏠","🏥","🔬"];
const HINTS=["Office / Home","Hospital Lab","Reference Lab"];
const ALL=[
  {text:"Urine pregnancy test (hCG)",b:0},{text:"Blood glucose (glucometer)",b:0},
  {text:"Rapid strep test",b:0},{text:"Dipstick urinalysis",b:0},
  {text:"Fecal occult blood test",b:0},{text:"Routine hospital CBC",b:1},
  {text:"Provider microscopy",b:1},{text:"Automated chemistry panels",b:1},
  {text:"Molecular / genetic testing",b:2},{text:"Advanced cytology",b:2},
];
let remaining,bucketContents,score,missedItems,answered,ORIG_ALL=ALL.slice();

function shuffle(a){return[...a].sort(()=>Math.random()-.5)}

function init(){
  remaining=shuffle(ORIG_ALL.slice());bucketContents=BUCKETS.map(()=>[]);score=0;missedItems=[];answered=false;
  document.getElementById('game').style.display='flex';
  document.getElementById('doneBox').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('feedback').style.display='none';
  render();
}

function render(){
  document.getElementById('scoreDisplay').textContent='Score: '+score+' / '+ORIG_ALL.length;
  const pb=document.getElementById('promptBox');
  if(remaining.length>0){
    pb.style.display='block';
    pb.innerHTML='<div class="label">Sort this test → tap a bucket</div><div class="item">'+remaining[0].text+'</div><div class="rem">'+remaining.length+' remaining</div>';
  } else pb.style.display='none';
  const br=document.getElementById('bucketsRow');
  br.innerHTML='';
  BUCKETS.forEach((name,i)=>{
    const d=document.createElement('div');
    d.className='bucket bucket-'+i;
    if(!answered) d.onclick=()=>drop(i);
    else d.style.cursor='default';
    let html='<h3>'+ICONS[i]+' '+name+'</h3><div class="hint">'+HINTS[i]+'</div>';
    bucketContents[i].forEach(t=>{html+='<div class="placed">✅ '+t+'</div>'});
    d.innerHTML=html;
    br.appendChild(d);
  });
}

function drop(bi){
  if(remaining.length===0||answered)return;
  answered=true;
  const cur=remaining[0];
  const correct=cur.b===bi;
  if(correct){bucketContents[bi].push(cur.text);score++}
  else{missedItems.push(cur)}

  const fb=document.getElementById('feedback');
  fb.style.display='block';

  if(correct){
    fb.className='fb ok';
    fb.textContent='✅ Correct!';
  } else {
    fb.className='fb no';
    fb.textContent='❌ Wrong — belongs in '+BUCKETS[cur.b];
  }

  // Highlight correct bucket and flash wrong one
  const bucketEls=document.querySelectorAll('.bucket');
  bucketEls.forEach((el,i)=>{
    el.style.cursor='default';
    el.onclick=null;
    if(i===cur.b){
      el.classList.add('correct-flash');
    } else if(i===bi && !correct){
      el.classList.add('wrong-flash');
    }
  });

  remaining=remaining.slice(1);
  render();

  // Re-apply flashes after render
  const bucketEls2=document.querySelectorAll('.bucket');
  bucketEls2.forEach((el,i)=>{
    el.style.cursor='default';
    el.onclick=null;
    if(i===cur.b) el.classList.add('correct-flash');
    else if(i===bi && !correct) el.classList.add('wrong-flash');
  });

  document.getElementById('nextBtn').style.display='block';
}

function nextItem(){
  answered=false;
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('feedback').style.display='none';
  document.querySelectorAll('.bucket').forEach(el=>{
    el.classList.remove('correct-flash','wrong-flash');
  });
  if(remaining.length===0){showDone();return}
  render();
}

function showDone(){
  document.getElementById('game').style.display='none';
  const d=document.getElementById('doneBox');d.style.display='block';
  let html='<div class="big">'+(score>=8?'🏆':'💪')+'</div><h2>'+score+'/'+ORIG_ALL.length+' Correct!</h2><p class="tip">CLIA-waived tests are simple enough for home use. MAs perform these in ambulatory care.</p><button class="btn" onclick="init()">Play Again</button>';
  if(missedItems.length>0){
    html+='<br><button class="btn-redo" onclick="redoMissed()">Redo Missed ('+missedItems.length+')</button>';
  }
  d.innerHTML=html;
}

function redoMissed(){
  remaining=shuffle(missedItems.slice());bucketContents=BUCKETS.map(()=>[]);score=0;
  var oldMissed=missedItems.slice();
  missedItems=[];answered=false;
  ORIG_ALL=oldMissed;
  document.getElementById('game').style.display='flex';
  document.getElementById('doneBox').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('feedback').style.display='none';
  render();
}

init();
</script>
</body>
</html>
