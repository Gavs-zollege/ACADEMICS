<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Urine Collection Methods</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Outfit',sans-serif;color:#FFFFFF}
.wrap{max-width:640px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}
.header{text-align:center;margin-bottom:8px;flex-shrink:0}
.header .icon{font-size:32px}
h1{font-weight:800;font-size:22px;margin:4px 0 2px;color:#FFF}
.sub{color:#94A3B8;font-weight:600;font-size:13px}
.game-area{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}
.topbar{display:flex;justify-content:space-between;margin-bottom:8px;padding:0 4px}
.topbar span{font-weight:700;font-size:12px}
.topbar .qn{color:#94A3B8}
.topbar .sc{color:#FBBF24}
.bar{height:3px;background:rgba(255,255,255,0.1);border-radius:10px;margin-bottom:10px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#2DD4BF,#5EEAD4);border-radius:10px;transition:width .4s}
.question{background:#132F42;padding:12px 16px;border-radius:12px;margin-bottom:10px;border-left:3px solid #2DD4BF}
.question p{font-weight:800;font-size:14px;line-height:1.55;color:#FFF}
.opts{display:grid;gap:6px}
.opt{padding:10px 14px;border-radius:10px;background:#132F42;border:1.5px solid rgba(255,255,255,0.12);font-weight:700;font-size:13px;cursor:pointer;transition:all .18s;text-align:left;color:#F1F5F9}
.opt:hover{background:#1A3A50;border-color:rgba(255,255,255,0.22)}
.opt .letter{color:#2DD4BF;font-weight:800;margin-right:10px}
.opt.correct{background:rgba(52,211,153,.15);border-color:#34D399;color:#6EE7B7}
.opt.wrong{background:rgba(248,113,113,.15);border-color:#F87171;color:#FCA5A5}
.opt.dimmed{opacity:0.4;cursor:default}
.opt .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:auto;float:right;text-transform:uppercase;letter-spacing:0.5px}
.opt .tag.tag-correct{background:rgba(52,211,153,0.15);color:#34D399}
.opt .tag.tag-wrong{background:rgba(248,113,113,0.15);color:#F87171}
.tip{margin-top:8px;padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.5}
.tip.ok{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2)}
.tip.no{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2)}
.tip strong{font-size:13px;display:block;margin-bottom:2px}
.tip strong.ok{color:#34D399}
.tip strong.no{color:#FCA5A5}
.tip span{color:#E2E8F0;font-weight:500}
.next-btn{margin-top:10px;width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;transition:transform .12s}
.next-btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}
.done{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);margin:auto 0}
.done .big{font-size:40px}
.done h2{font-weight:800;font-size:24px;margin:8px 0 4px;color:#FFF}
.done p{color:#E2E8F0;font-weight:600;font-size:13px;margin-bottom:16px;line-height:1.5}
.btn{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:transform .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}
.btn-redo{padding:10px 28px;border:1.5px solid #5EEAD4;border-radius:10px;background:transparent;color:#5EEAD4;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;margin-top:8px;transition:transform .12s,background .12s}
.btn-redo:hover{background:rgba(94,234,212,0.1);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="icon">🚰</div>
    <h1>Urine Collection Methods</h1>
    <p class="sub">Pick the right collection method for each clinical scenario</p>
  </div>
  <div id="game" class="game-area"></div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
var ORIG_QS=[
  {q:"A patient needs a pregnancy test. Which urine specimen is preferred?",opts:["Random","First Morning","Clean-Catch Midstream","24-Hour Collection"],a:1,tip:"First morning urine is most concentrated — best for detecting hCG."},
  {q:"The provider orders a urine culture to check for infection.",opts:["Random Specimen","First Morning","Clean-Catch Midstream","Catheterized"],a:2,tip:"Clean-catch midstream reduces contamination for culture results."},
  {q:"Total protein output over a full day must be measured.",opts:["Random","First Morning","Clean-Catch","24-Hour Collection"],a:3,tip:"24-hour collection captures everything — discard first void, collect all after."},
  {q:"A quick routine screening is needed — no special timing required.",opts:["Random Specimen","First Morning","Clean-Catch Midstream","Catheterized"],a:0,tip:"Random specimens work for general screening at any time of day."},
  {q:"The patient cannot void and a sterile sample is essential.",opts:["Random","Clean-Catch","24-Hour Collection","Catheterized Collection"],a:3,tip:"A catheter is inserted into the bladder when the patient can't void."},
  {q:"Protein and nitrite evaluation requires the most concentrated sample.",opts:["Random","First Morning Specimen","Clean-Catch","24-Hour"],a:1,tip:"First morning urine is the most concentrated after overnight."},
  {q:"The patient cleanses with 3 antiseptic wipes before collecting mid-stream.",opts:["Random","First Morning","Clean-Catch Midstream","Catheterized"],a:2,tip:"That's the clean-catch protocol — cleanse, void, then catch."},
  {q:"A large container with preservatives is given to the patient to take home.",opts:["Random","First Morning","Clean-Catch","24-Hour Collection"],a:3,tip:"24-hour containers need preservatives and must be refrigerated."},
];
var QS=ORIG_QS.slice();
var ci=0,score=0,chosen=null,missedIndices=[];

function renderQ(){
  var g=document.getElementById('game');
  var q=QS[ci];
  var h='<div class="topbar"><span class="qn">Q '+(ci+1)+' / '+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';
  h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';
  h+='<div class="question"><p>'+q.q+'</p></div>';
  h+='<div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt';
    var tag='';
    if(chosen!==null){
      if(i===q.a){
        cls+=' correct';
        tag='<span class="tag tag-correct">'+(chosen===i?'✓ Correct':'✓ Correct Answer')+'</span>';
      } else if(chosen===i&&i!==q.a){
        cls+=' wrong';
        tag='<span class="tag tag-wrong">✗ Wrong</span>';
      } else {
        cls+=' dimmed';
      }
    }
    h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+tag+'</div>';
  });
  h+='</div>';
  if(chosen!==null){
    var ok=chosen===q.a;
    h+='<div class="tip '+(ok?'ok':'no')+'"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>';
    h+='<button class="next-btn" onclick="nextQ()">Next →</button>';
  }
  g.innerHTML=h;
}

function answer(i){
  if(chosen!==null)return;
  chosen=i;
  if(i===QS[ci].a)score++;
  else missedIndices.push(ci);
  renderQ();
}

function nextQ(){
  if(ci+1<QS.length){ci++;chosen=null;renderQ()}
  else showDone();
}

function showDone(){
  document.getElementById('game').style.display='none';
  var d=document.getElementById('doneBox');d.style.display='block';
  var html='<div class="big">'+(score>=7?'🏆':score>=5?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Urine is the most common specimen — knowing each method is essential.</p><button class="btn" onclick="reset()">Play Again</button>';
  if(missedIndices.length>0){
    html+='<br><button class="btn-redo" onclick="redoMissed()">Redo Missed ('+missedIndices.length+')</button>';
  }
  d.innerHTML=html;
}

function reset(){
  QS=ORIG_QS.slice();ci=0;score=0;chosen=null;missedIndices=[];
  document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ();
}

function redoMissed(){
  var redo=[];
  for(var i=0;i<missedIndices.length;i++)redo.push(ORIG_QS[missedIndices[i]]);
  QS=redo;ci=0;score=0;chosen=null;missedIndices=[];
  document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ();
}

renderQ();
</script>
</body>
</html>
