<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Normal or Abnormal?</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Inter',sans-serif;color:#FFF}
.wrap{max-width:560px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}
.header{text-align:center;margin-bottom:8px;flex-shrink:0}
.header .icon{font-size:32px}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:#94A3B8;font-weight:600;font-size:13px}
.game-area{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}
.topbar{display:flex;justify-content:space-between;margin-bottom:8px}
.topbar span{font-weight:700;font-size:12px}
.topbar .ct{color:#94A3B8}
.topbar .sc{color:#FBBF24}
.bar{height:3px;background:rgba(255,255,255,0.1);border-radius:10px;margin-bottom:10px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#2DD4BF,#38BDF8);border-radius:10px;transition:width .4s}
.value-card{background:#132F42;padding:16px 20px;border-radius:14px;text-align:center;margin-bottom:10px;border:1.5px solid rgba(255,255,255,0.12)}
.value-card .lab{color:#2DD4BF;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
.value-card .val{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:36px;margin-bottom:6px}
.value-card .ref{color:#E2E8F0;font-weight:600;font-size:12px;padding:5px 12px;background:rgba(255,255,255,0.06);border-radius:8px;display:inline-block;border:1px solid rgba(255,255,255,0.1)}
.fb{text-align:center;padding:8px;margin-bottom:6px;border-radius:10px;font-weight:700;font-size:14px}
.fb.ok{background:rgba(52,211,153,.15);color:#34D399}
.fb.no{background:rgba(248,113,113,.15);color:#FCA5A5}
.btns{display:flex;gap:10px;margin-bottom:6px}
.btns button{flex:1;padding:12px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;color:#FFF;transition:all .18s;border:2px solid}
.btn-n{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4)}
.btn-n:hover{background:rgba(52,211,153,.18)}
.btn-a{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4)}
.btn-a:hover{background:rgba(248,113,113,.18)}
.btns button:disabled{cursor:default;opacity:0.4}
.btns button.is-answer{border-color:#34D399;border-width:2.5px;opacity:1}
.btns button.pick-wrong{background:rgba(248,113,113,.25);border-color:#F87171;opacity:1}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;text-transform:uppercase;letter-spacing:.5px;display:inline-block}
.tag-c{background:rgba(52,211,153,0.15);color:#34D399}
.tag-w{background:rgba(248,113,113,0.15);color:#F87171}
.next-btn{width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:transform .12s}
.next-btn:hover{transform:translateY(-1px)}
.done{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);margin:auto 0}
.done .big{font-size:40px}
.done h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;margin:8px 0 4px}
.done p{color:#E2E8F0;font-weight:500;font-size:13px;margin-bottom:16px;line-height:1.5}
.btn-r{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.btn-r:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}
.btn-redo{padding:10px 28px;border:1.5px solid #5EEAD4;border-radius:10px;background:transparent;color:#5EEAD4;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:8px}
.btn-redo:hover{background:rgba(94,234,212,0.1);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="icon">🔬</div><h1>Normal or Abnormal?</h1><p class="sub">Classify each lab value against its reference range</p></div>
  <div id="game" class="game-area"></div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
var ORIG=[
  {lab:"Hemoglobin (Male)",value:"16 g/dL",normal:true,range:"14–18 g/dL"},
  {lab:"Fasting Glucose",value:"130 mg/dL",normal:false,range:"70–99 mg/dL"},
  {lab:"WBC Count",value:"7,500/mm³",normal:true,range:"4,000–11,000/mm³"},
  {lab:"Platelet Count",value:"120,000/mm³",normal:false,range:"150,000–450,000/mm³"},
  {lab:"Total Cholesterol",value:"185 mg/dL",normal:true,range:"< 200 mg/dL"},
  {lab:"HbA1C",value:"7.2%",normal:false,range:"4.0–5.6%"},
  {lab:"Hematocrit (Female)",value:"40%",normal:true,range:"37–47%"},
  {lab:"LDL Cholesterol",value:"145 mg/dL",normal:false,range:"< 100 mg/dL"},
  {lab:"HDL (Male)",value:"55 mg/dL",normal:true,range:"> 40 mg/dL"},
  {lab:"Triglycerides",value:"220 mg/dL",normal:false,range:"< 150 mg/dL"},
  {lab:"RBC Count",value:"5.1 million/µL",normal:true,range:"4.2–5.9 million/µL"},
  {lab:"MCV",value:"72 fL",normal:false,range:"80–98 fL"},
];
var ITEMS=ORIG.slice(),ci=0,score=0,chosen=null,missedIdx=[];
function renderQ(){
  var g=document.getElementById('game'),it=ITEMS[ci];
  var h='<div class="topbar"><span class="ct">'+(ci+1)+' / '+ITEMS.length+'</span><span class="sc">Score: '+score+'</span></div>';
  h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/ITEMS.length*100)+'%"></div></div>';
  h+='<div class="value-card"><div class="lab">'+it.lab+'</div><div class="val">'+it.value+'</div>';
  if(chosen!==null)h+='<div class="ref">Reference: '+it.range+'</div>';
  h+='</div>';
  if(chosen!==null){var ok=chosen===it.normal;h+='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ It\'s actually '+(it.normal?'Normal':'Abnormal'))+'</div>';}
  var nCls='btn-n',aCls='btn-a',nTag='',aTag='',dis=chosen!==null?'disabled':'';
  if(chosen!==null){
    if(it.normal){nCls+=' is-answer';nTag=chosen===true?'<span class="tag tag-c">✓ Correct</span>':'<span class="tag tag-c">✓ Answer</span>';}
    if(!it.normal){aCls+=' is-answer';aTag=chosen===false?'<span class="tag tag-c">✓ Correct</span>':'<span class="tag tag-c">✓ Answer</span>';}
    if(chosen===true&&!it.normal){nCls+=' pick-wrong';nTag='<span class="tag tag-w">✗ Wrong</span>';}
    if(chosen===false&&it.normal){aCls+=' pick-wrong';aTag='<span class="tag tag-w">✗ Wrong</span>';}
  }
  h+='<div class="btns"><button class="'+nCls+'" '+dis+' '+(chosen===null?'onclick="pick(true)"':'')+'>✅ Normal'+nTag+'</button>';
  h+='<button class="'+aCls+'" '+dis+' '+(chosen===null?'onclick="pick(false)"':'')+'>⚠️ Abnormal'+aTag+'</button></div>';
  if(chosen!==null)h+='<button class="next-btn" onclick="nextQ()">Next →</button>';
  g.innerHTML=h;
}
function pick(v){if(chosen!==null)return;chosen=v;if(v===ITEMS[ci].normal)score++;else missedIdx.push(ci);renderQ();}
function nextQ(){if(ci+1<ITEMS.length){ci++;chosen=null;renderQ()}else showDone()}
function showDone(){document.getElementById('game').style.display='none';var d=document.getElementById('doneBox');d.style.display='block';var html='<div class="big">'+(score>=10?'🏆':score>=7?'⭐':'💪')+'</div><h2>'+score+'/'+ITEMS.length+' Correct!</h2><p>MAs must recognize and immediately report out-of-range critical values.</p><button class="btn-r" onclick="reset()">Play Again</button>';if(missedIdx.length>0)html+='<br><button class="btn-redo" onclick="redo()">Redo Missed ('+missedIdx.length+')</button>';d.innerHTML=html;}
function reset(){ITEMS=ORIG.slice();ci=0;score=0;chosen=null;missedIdx=[];document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
function redo(){var r=[];for(var i=0;i<missedIdx.length;i++)r.push(ITEMS[missedIdx[i]]);ITEMS=r;ci=0;score=0;chosen=null;missedIdx=[];document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script>
</body>
</html>
