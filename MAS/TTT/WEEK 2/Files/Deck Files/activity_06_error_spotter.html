<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Error Spotter</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Inter',sans-serif;color:#FFF}
.wrap{max-width:640px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}
.header{text-align:center;margin-bottom:8px;flex-shrink:0}
.header .icon{font-size:32px}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:#94A3B8;font-weight:600;font-size:13px}
.game-area{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}
.topbar{display:flex;justify-content:space-between;margin-bottom:8px}
.topbar .qn{color:#94A3B8;font-weight:700;font-size:12px}
.topbar .sc{color:#FBBF24;font-weight:800;font-size:12px}
.bar{height:3px;background:rgba(255,255,255,0.1);border-radius:10px;margin-bottom:10px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#FBBF24,#F87171);border-radius:10px;transition:width .4s}
.question{background:#132F42;padding:12px 16px;border-radius:12px;margin-bottom:10px;border-left:3px solid #FBBF24}
.question p{font-weight:800;font-size:14px;line-height:1.55;font-family:'Plus Jakarta Sans',sans-serif}
.opts{display:grid;gap:6px}
.opt{padding:10px 14px;border-radius:10px;background:#132F42;border:1.5px solid rgba(255,255,255,0.12);font-weight:700;font-size:13px;cursor:pointer;transition:all .18s;text-align:left;color:#F1F5F9}
.opt:hover{background:#1A3A50;border-color:rgba(255,255,255,0.22)}
.opt .letter{color:#FBBF24;font-weight:800;margin-right:10px}
.opt.correct{background:rgba(52,211,153,.15);border-color:#34D399}
.opt.wrong{background:rgba(248,113,113,.15);border-color:#F87171}
.opt.dimmed{opacity:0.4;cursor:default}
.opt .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:auto;float:right;text-transform:uppercase;letter-spacing:.5px}
.opt .tag-c{background:rgba(52,211,153,0.15);color:#34D399}
.opt .tag-w{background:rgba(248,113,113,0.15);color:#F87171}
.tip{margin-top:8px;padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.5}
.tip.ok{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2)}
.tip.no{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2)}
.tip strong{font-size:13px;display:block;margin-bottom:2px}
.tip strong.ok{color:#34D399}
.tip strong.no{color:#FCA5A5}
.tip span{color:#E2E8F0;font-weight:500}
.next-btn{margin-top:8px;width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:transform .12s}
.next-btn:hover{transform:translateY(-1px)}
.done{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);margin:auto 0}
.done .big{font-size:40px}
.done h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;margin:8px 0 4px}
.done p{color:#E2E8F0;font-weight:500;font-size:13px;margin-bottom:16px;line-height:1.5}
.btn{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:transform .12s}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}
.btn-redo{padding:10px 28px;border:1.5px solid #5EEAD4;border-radius:10px;background:transparent;color:#5EEAD4;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:8px;transition:transform .12s,background .12s}
.btn-redo:hover{background:rgba(94,234,212,0.1);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="icon">⚠️</div><h1>Error Spotter</h1><p class="sub">Identify what went wrong in each lab scenario</p></div>
  <div id="game" class="game-area"></div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
var ORIG=[
  {q:"The MA labeled the LID of the urine cup instead of the container. What's the risk?",opts:["No risk — lids are fine for labeling","Lids can be swapped between containers, causing dangerous mix-ups","The label will fade faster on the lid","The lid is too small for all the info"],a:1,tip:"Always label the CONTAINER, not the lid. Lids can be accidentally swapped."},
  {q:"A patient ate breakfast before a fasting glucose test. What should the MA do?",opts:["Run the test anyway and note it","Reschedule the test","Have the patient wait 2 hours then run it","Draw blood but label it 'non-fasting'"],a:1,tip:"Never process a specimen collected under incorrect conditions — reschedule."},
  {q:"The MA opens reagent strips and notices they expired last month.",opts:["Use them — they're good for 90 days past expiration","Do NOT use — expired reagents give invalid results","Test one strip first to check","Only use for screening, not diagnostics"],a:1,tip:"Always check expiration dates. Expired supplies produce inaccurate results."},
  {q:"A urine sample sat at room temperature for 3 hours.",opts:["It's fine — urine is stable at room temp","Bacteria have likely grown, altering results","Only the color changes; chemistry is unaffected","Shake it well before testing"],a:1,tip:"Urine must be tested within 1 hour or refrigerated to prevent bacterial growth."},
  {q:"During a throat culture, the MA touched the inside of the swab container.",opts:["It doesn't matter — it's just for transport","Outside organisms now contaminate the specimen","Just wipe the edge and continue","Only the lid needs to stay sterile"],a:1,tip:"Never touch the inside of sterile containers — contamination masks the real pathogen."},
  {q:"The MA collects a specimen but doesn't match it to the requisition before transport.",opts:["The lab will figure it out","The specimen may be tested for the wrong patient or test","It only matters for blood specimens","The requisition isn't needed until results come back"],a:1,tip:"Every specimen MUST be paired with the correct requisition before transport."},
  {q:"A patient wasn't instructed about FOBT prep and ate red meat the day before.",opts:["Red meat doesn't affect the test","This can cause a false-positive result","It only matters if they ate more than 8oz","The lab adjusts for dietary factors"],a:1,tip:"Red meat, aspirin, NSAIDs, vitamin C, and iron can all cause false-positive FOBT results."},
];
var QS=ORIG.slice(),ci=0,score=0,chosen=null,missedIdx=[];
function renderQ(){
  var g=document.getElementById('game'),q=QS[ci];
  var h='<div class="topbar"><span class="qn">Scenario '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';
  h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';
  h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';
  q.opts.forEach(function(o,i){
    var cls='opt',tag='';
    if(chosen!==null){
      if(i===q.a){cls+=' correct';tag='<span class="tag tag-c">'+(chosen===i?'✓ Correct':'✓ Correct Answer')+'</span>';}
      else if(chosen===i){cls+=' wrong';tag='<span class="tag tag-w">✗ Wrong</span>';}
      else cls+=' dimmed';
    }
    h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+tag+'</div>';
  });
  h+='</div>';
  if(chosen!==null){var ok=chosen===q.a;h+='<div class="tip '+(ok?'ok':'no')+'"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>';h+='<button class="next-btn" onclick="nextQ()">Next →</button>';}
  g.innerHTML=h;
}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;else missedIdx.push(ci);renderQ();}
function nextQ(){if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()}
function showDone(){document.getElementById('game').style.display='none';var d=document.getElementById('doneBox');d.style.display='block';var html='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Prevention requires attention at every step — pre-analytical errors are the most common!</p><button class="btn" onclick="reset()">Play Again</button>';if(missedIdx.length>0)html+='<br><button class="btn-redo" onclick="redo()">Redo Missed ('+missedIdx.length+')</button>';d.innerHTML=html;}
function reset(){QS=ORIG.slice();ci=0;score=0;chosen=null;missedIdx=[];document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
function redo(){var r=[];for(var i=0;i<missedIdx.length;i++)r.push(QS[missedIdx[i]]);QS=r;ci=0;score=0;chosen=null;missedIdx=[];document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script>
</body>
</html>
