<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QA Phase Detective</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Inter',sans-serif;color:#FFF}
.wrap{max-width:740px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}
.header{text-align:center;margin-bottom:8px;flex-shrink:0}
.header .icon{font-size:32px}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:#94A3B8;font-weight:600;font-size:13px}
.score{color:#A78BFA;font-weight:700;font-size:13px;margin-top:4px}
.prompt{background:rgba(45,212,191,0.08);padding:12px 18px;border-radius:14px;text-align:center;margin-bottom:8px;border:1.5px solid rgba(45,212,191,0.2);flex-shrink:0}
.prompt .label{color:#94A3B8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.prompt .item{color:#FFF;font-size:16px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif}
.prompt .rem{color:#94A3B8;font-size:12px;margin-top:4px}
.fb{text-align:center;padding:8px;margin-bottom:6px;border-radius:10px;font-weight:700;font-size:13px;flex-shrink:0}
.fb.ok{background:rgba(52,211,153,.15);color:#34D399}
.fb.no{background:rgba(248,113,113,.15);color:#FCA5A5}
.game-area{flex:1;min-height:0;display:flex;flex-direction:column}
.next-btn{width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:6px;flex-shrink:0;transition:transform .12s}
.next-btn:hover{transform:translateY(-1px)}
.buckets{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}
.bucket{flex:1 1 180px;min-width:150px;background:#132F42;border-radius:14px;padding:10px;cursor:pointer;transition:all .18s}
.bucket:hover{filter:brightness(1.15);transform:translateY(-1px)}
.bucket h3{font-weight:700;font-size:13px;text-align:center;margin-bottom:2px;font-family:'Plus Jakarta Sans',sans-serif}
.bucket .hint{color:#94A3B8;font-size:10px;text-align:center;margin-bottom:6px;font-weight:500}
.bucket .placed{padding:4px 8px;border-radius:6px;margin-bottom:3px;font-size:11px;font-weight:600}
.bucket-0{border:2px solid rgba(244,114,182,.3)}.bucket-0 h3{color:#F472B6}.bucket-0 .placed{background:rgba(244,114,182,.08);border:1px solid rgba(244,114,182,.15)}
.bucket-1{border:2px solid rgba(96,165,250,.3)}.bucket-1 h3{color:#60A5FA}.bucket-1 .placed{background:rgba(96,165,250,.08);border:1px solid rgba(96,165,250,.15)}
.bucket-2{border:2px solid rgba(167,139,250,.3)}.bucket-2 h3{color:#A78BFA}.bucket-2 .placed{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.15)}
.bucket.correct-flash{box-shadow:0 0 0 3px rgba(52,211,153,0.5);filter:brightness(1.2)}
.bucket.wrong-flash{box-shadow:0 0 0 3px rgba(248,113,113,0.5)}
.done{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);margin:auto 0}
.done .big{font-size:40px}
.done h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;margin:8px 0 4px}
.done p{color:#E2E8F0;font-weight:500;font-size:13px;margin-bottom:16px;line-height:1.5}
.btn{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}
.btn-redo{padding:10px 28px;border:1.5px solid #5EEAD4;border-radius:10px;background:transparent;color:#5EEAD4;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:8px}
.btn-redo:hover{background:rgba(94,234,212,0.1);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="icon">📋</div><h1>QA Phase Detective</h1><p class="sub">Sort each error into the correct quality assurance phase</p><p class="score" id="scoreDisplay">Score: 0 / 12</p></div>
  <div id="game" class="game-area">
    <div class="prompt" id="promptBox"></div>
    <div class="fb" id="feedback" style="display:none"></div>
    <button class="next-btn" id="nextBtn" style="display:none" onclick="nextItem()">Next →</button>
    <div class="buckets" id="bucketsRow"></div>
  </div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
var BUCKETS=["Pre-Analytical","Analytical","Post-Analytical"],ICONS=["📋","⚙️","📤"],HINTS=["Before testing","During testing","After testing"];
var ORIG_ALL=[
  {text:"Wrong test ordered by the provider",b:0},{text:"Patient misidentification at collection",b:0},
  {text:"Improper specimen labeling",b:0},{text:"Wrong container used for specimen",b:0},
  {text:"Inadequate sample volume collected",b:0},{text:"Equipment malfunction during testing",b:1},
  {text:"QC failure not caught before testing",b:1},{text:"Sample mix-up during analysis",b:1},
  {text:"Procedures not followed correctly",b:1},{text:"Failure to report results to provider",b:2},
  {text:"Incorrect data entry into health record",b:2},{text:"Excessive turnaround time for results",b:2},
];
var remaining,bContents,score,missedItems,answered;
function shuffle(a){return[].concat(a).sort(function(){return Math.random()-.5})}
function init(){remaining=shuffle(ORIG_ALL);bContents=BUCKETS.map(function(){return[]});score=0;missedItems=[];answered=false;document.getElementById('game').style.display='flex';document.getElementById('doneBox').style.display='none';document.getElementById('nextBtn').style.display='none';document.getElementById('feedback').style.display='none';render()}
function render(){
  document.getElementById('scoreDisplay').textContent='Score: '+score+' / '+ORIG_ALL.length;
  var pb=document.getElementById('promptBox');
  if(remaining.length>0){pb.style.display='block';pb.innerHTML='<div class="label">Which QA phase?</div><div class="item">'+remaining[0].text+'</div><div class="rem">'+remaining.length+' remaining</div>'}else pb.style.display='none';
  var br=document.getElementById('bucketsRow');br.innerHTML='';
  BUCKETS.forEach(function(name,i){
    var d=document.createElement('div');d.className='bucket bucket-'+i;
    if(!answered)d.onclick=function(){drop(i)};else d.style.cursor='default';
    var h='<h3>'+ICONS[i]+' '+name+'</h3><div class="hint">'+HINTS[i]+'</div>';
    bContents[i].forEach(function(t){h+='<div class="placed">✅ '+t+'</div>'});
    d.innerHTML=h;br.appendChild(d);
  });
}
function drop(bi){
  if(remaining.length===0||answered)return;answered=true;
  var cur=remaining[0],ok=cur.b===bi;
  if(ok){bContents[bi].push(cur.text);score++}else{missedItems.push(cur)}
  var fb=document.getElementById('feedback');fb.style.display='block';
  fb.className='fb '+(ok?'ok':'no');fb.textContent=ok?'✅ Correct!':'❌ That\'s a '+BUCKETS[cur.b]+' error';
  remaining=remaining.slice(1);render();
  var els=document.querySelectorAll('.bucket');
  els.forEach(function(el,i){el.style.cursor='default';el.onclick=null;if(i===cur.b)el.classList.add('correct-flash');else if(i===bi&&!ok)el.classList.add('wrong-flash')});
  document.getElementById('nextBtn').style.display='block';
}
function nextItem(){
  answered=false;document.getElementById('nextBtn').style.display='none';document.getElementById('feedback').style.display='none';
  document.querySelectorAll('.bucket').forEach(function(el){el.classList.remove('correct-flash','wrong-flash')});
  if(remaining.length===0){showDone();return}render();
}
function showDone(){document.getElementById('game').style.display='none';var d=document.getElementById('doneBox');d.style.display='block';var html='<div class="big">'+(score>=10?'🏆':'💪')+'</div><h2>'+score+'/'+ORIG_ALL.length+' Correct!</h2><p>Errors can occur at ANY phase. Pre-analytical errors (before testing) are the most common.</p><button class="btn" onclick="init()">Play Again</button>';if(missedItems.length>0)html+='<br><button class="btn-redo" onclick="redoMissed()">Redo Missed ('+missedItems.length+')</button>';d.innerHTML=html;}
function redoMissed(){remaining=shuffle(missedItems.slice());bContents=BUCKETS.map(function(){return[]});score=0;var old=missedItems.slice();missedItems=[];answered=false;ORIG_ALL=old;document.getElementById('game').style.display='flex';document.getElementById('doneBox').style.display='none';document.getElementById('nextBtn').style.display='none';document.getElementById('feedback').style.display='none';render()}
init();
</script>
</body>
</html>
