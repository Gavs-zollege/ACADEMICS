<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 2 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 2 Glossary</h1>
  <p class="sub">Point of Care Testing & Laboratory Procedures</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar">
    <div class="count" id="count"></div>
  </div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Lab Basics",color:"#6B7B8D",terms:[
    {term:"Specimen",def:"A sample collected from a patient for laboratory analysis — blood, urine, stool, tissue, sputum, or swab material."},
    {term:"Laboratory Requisition",def:"A written or electronic order accompanying a specimen to the lab with patient demographics, tests ordered, specimen source, and diagnosis code."},
    {term:"Diagnosis Code (ICD)",def:"A standardized code identifying the patient's condition or reason for testing. Required to establish medical necessity."},
    {term:"Medical Necessity",def:"The clinical justification for ordering a laboratory test. Required for insurance reimbursement."},
    {term:"Reference Laboratory",def:"An outside laboratory that receives, processes, and analyzes specimens sent from a provider's office."},
    {term:"Electronic Health Record (EHR)",def:"A digital version of a patient's complete medical record where lab orders and results are documented."},
    {term:"Critical Value",def:"A lab result significantly outside the normal range that may indicate a life-threatening condition. Must be communicated immediately."},
    {term:"Medical Technologist (MT)",def:"A certified laboratory professional who analyzes specimens, performs complex testing, and interprets results."},
    {term:"Medical Lab Technician (MLT)",def:"A certified lab professional who performs routine tests under supervision of a medical technologist or pathologist."},
    {term:"Phlebotomist",def:"A trained healthcare worker who specializes in drawing blood for laboratory testing."},
  ]},
  {name:"CLIA & QA",color:"#4A90B8",terms:[
    {term:"CLIA",def:"Clinical Laboratory Improvement Amendments — federal legislation regulating all laboratory testing performed on humans."},
    {term:"CLIA-Waived Testing",def:"The simplest category of lab testing, cleared for home use or office use with minimal risk of error."},
    {term:"Moderate-Complexity Testing",def:"A non-waived CLIA category requiring a certificate and regular inspections. Performed by certified lab personnel."},
    {term:"High-Complexity Testing",def:"The most stringent CLIA category requiring the highest level of training and proficiency testing."},
    {term:"Provider-Performed Microscopy",def:"A special CLIA exception allowing providers to microscopically examine certain specimens in ambulatory settings."},
    {term:"Quality Control (QC)",def:"Steps taken to ensure test reliability: checking reagent dates, running controls, calibrating instruments, verifying results."},
    {term:"Quality Assurance (QA)",def:"A comprehensive set of policies monitoring and improving overall quality of patient care and lab testing."},
    {term:"Control Sample",def:"A sample with a known value tested alongside patient specimens to verify testing accuracy."},
    {term:"Calibration",def:"Standardizing a laboratory instrument by comparing its measurements against a known reference standard."},
    {term:"Reagent",def:"A chemical substance used in a lab test to react with the analyte being measured. Has expiration dates."},
  ]},
  {name:"Three-Phase QA",color:"#8B6AAE",terms:[
    {term:"Pre-Analytical Phase",def:"First phase of lab QA — all steps before testing: receiving orders, collecting and labeling specimens, transporting. Most errors occur here."},
    {term:"Analytical Phase",def:"Second phase — the actual testing: running controls, testing the sample, comparing to reference ranges, logging findings."},
    {term:"Post-Analytical Phase",def:"Final phase — disposing specimens, logging results, provider interpretation, patient notification, documentation."},
    {term:"Preanalytical Error",def:"Error before testing — misidentification, wrong container, improper labeling, inadequate volume. Most common lab error."},
    {term:"Analytical Error",def:"Error during testing — equipment malfunction, sample mix-up, failed controls, incorrect procedure."},
    {term:"Postanalytical Error",def:"Error after testing — failure to report, incorrect data entry, excessive turnaround time."},
  ]},
  {name:"Point-of-Care",color:"#E05555",terms:[
    {term:"Point-of-Care Testing",def:"Lab testing performed at or near the patient's location rather than in a central laboratory. Results available quickly."},
    {term:"hCG",def:"Human Chorionic Gonadotropin — hormone detected in urine or blood to confirm pregnancy. First morning specimen preferred."},
    {term:"Rapid Strep Test",def:"A CLIA-waived test screening for Group A Streptococcus using a throat swab. Results in minutes."},
    {term:"Reagent Strip (Dipstick)",def:"A chemical test strip with pads sensitive to specific urine analytes like glucose, protein, blood, nitrites, and pH."},
    {term:"Glucometer",def:"A handheld device measuring blood glucose from a capillary fingerstick sample."},
    {term:"Capillary Puncture",def:"Collecting a small blood sample by pricking the fingertip (or heel in newborns) for POC tests."},
    {term:"Hemoglobin A1C",def:"A blood test measuring average blood glucose over ~3 months. Normal: 4.0–5.6%. Monitors diabetes."},
    {term:"Spun Hematocrit",def:"A CLIA-waived test measuring the percentage of red blood cells in whole blood using centrifuged microcapillary tubes."},
    {term:"Fecal Occult Blood Test",def:"A stool test detecting hidden blood. Screens for GI bleeding or colorectal disease. Requires dietary restrictions."},
    {term:"Nasopharyngeal Swab",def:"A swab inserted into the nostril to collect a specimen from the nasopharynx for influenza testing."},
    {term:"Epstein-Barr Virus",def:"The virus causing infectious mononucleosis. Detected via a CLIA-waived capillary blood test."},
    {term:"H. pylori",def:"A bacteria associated with stomach ulcers. A whole blood POC test screens for antibodies."},
  ]},
  {name:"Urine Collection",color:"#E2B94C",terms:[
    {term:"Random Urine Specimen",def:"Urine collected at any time without special preparation. Used for general screening."},
    {term:"First Morning Specimen",def:"First urine after waking — most concentrated. Preferred for pregnancy testing and protein/nitrite evaluation."},
    {term:"Clean-Catch Midstream",def:"Collection technique minimizing contamination: cleanse, begin voiding, then collect mid-portion in sterile container."},
    {term:"24-Hour Urine Collection",def:"All urine collected over 24 hours in a preserved container for quantitative analysis of substances like protein or creatinine."},
    {term:"Catheterized Specimen",def:"A sterile urine sample collected via catheter when a sterile specimen is required or patient cannot void."},
    {term:"Urinary Meatus",def:"The external opening of the urethra. Cleansed with antiseptic wipes before clean-catch collection."},
    {term:"Analyte",def:"A specific substance being tested in a specimen. In urinalysis: glucose, protein, blood, ketones, nitrites, bilirubin, pH."},
    {term:"Supernatant",def:"The clear fluid layer above sediment after centrifuging. May be removed before microscopic examination."},
    {term:"Centrifuge",def:"A lab instrument spinning specimens at high speed to separate components by density."},
  ]},
  {name:"Cultures & CoC",color:"#C4A84D",terms:[
    {term:"Culture",def:"A lab procedure placing a specimen in growth medium to identify bacteria, fungi, or organisms causing infection."},
    {term:"Causative Agent",def:"The specific microorganism responsible for causing an infection. Cultures identify it for appropriate treatment."},
    {term:"Standard Precautions",def:"Infection control practices applied to all patients: handwashing, PPE, sharps handling, biohazard disposal."},
    {term:"Chain of Custody",def:"Legal documentation tracking who collected, handled, and tested a specimen. Required for drug/alcohol testing."},
    {term:"Biohazard",def:"A biological substance posing a health threat. Must be stored in red biohazard bags with the universal symbol."},
    {term:"Medical Review Officer",def:"A licensed physician trained to interpret drug test results and review positive results before reporting."},
    {term:"Consent Form",def:"Document signed before drug/alcohol testing granting permission to collect, transport, and release results."},
  ]},
  {name:"Transport & Handling",color:"#1A8A7D",terms:[
    {term:"Specimen Integrity",def:"The condition ensuring a specimen accurately reflects the patient's physiology. Maintained by proper labeling, storage, and packaging."},
    {term:"Bilirubin",def:"A yellow compound from red blood cell breakdown. Urine samples must be protected from light to prevent false-negatives."},
    {term:"Refrigeration of Specimens",def:"Urine not tested within 1 hour must be refrigerated (2–8°C) to prevent bacterial growth."},
    {term:"Dual-Pocket Specimen Bag",def:"A clear bag with two pockets — one for the specimen, one for the requisition."},
    {term:"Absorbent Packaging",def:"Material wrapped around specimen containers to protect during transport and absorb any leakage."},
    {term:"OSHA Standards",def:"Regulations protecting healthcare workers from occupational exposure to hazardous materials including specimens."},
    {term:"Sharps Container",def:"A puncture-resistant, leak-proof container for disposing needles, lancets, and sharp items."},
  ]},
  {name:"Lab Values",color:"#E74C6F",terms:[
    {term:"Hemoglobin (Hgb)",def:"Oxygen-carrying protein in red blood cells. Normal: males 14–18 g/dL; females 12–16 g/dL. Low = anemia."},
    {term:"Hematocrit (Hct)",def:"Percentage of blood volume made up of red blood cells. Normal: males 42–50%; females 37–47%."},
    {term:"Complete Blood Count (CBC)",def:"Comprehensive panel measuring WBC, RBC, platelets, hemoglobin, hematocrit, and MCV."},
    {term:"WBC Count",def:"White blood cells per cubic mm. Normal: 4,000–11,000/mm³. Elevated may indicate infection."},
    {term:"RBC Count",def:"Red blood cells per microliter. Normal: 4.2–5.9 million/µL. Used to evaluate anemia."},
    {term:"Platelet Count",def:"Platelets per cubic mm. Normal: 150,000–450,000/mm³. Low increases bleeding risk."},
    {term:"MCV",def:"Mean Corpuscular Volume — average red blood cell size. Normal: 80–98 fL. Classifies anemia type."},
    {term:"Fasting Glucose",def:"Blood glucose after 8+ hours fasting. Normal: 70–99 mg/dL. Screens for diabetes."},
    {term:"Lipid Profile",def:"Measures total cholesterol, LDL, HDL, and triglycerides for cardiovascular risk assessment."},
    {term:"LDL",def:"Low-density lipoprotein — 'bad' cholesterol. Normal: < 100 mg/dL. High = cardiovascular risk."},
    {term:"HDL",def:"High-density lipoprotein — 'good' cholesterol. Normal: males > 40; females > 50 mg/dL."},
    {term:"Triglycerides",def:"A blood fat. Normal: < 150 mg/dL. Elevated = cardiovascular and metabolic risk."},
  ]},
  {name:"Vision",color:"#3A9E8F",terms:[
    {term:"Snellen Chart",def:"A wall chart for distance vision screening. Adults stand 20 feet away. Results as a fraction (e.g., 20/20)."},
    {term:"Visual Acuity",def:"Measure of vision sharpness. The fraction's numerator = testing distance, denominator = normal reading distance."},
    {term:"Myopia",def:"Nearsightedness — difficulty seeing distant objects. Screened with the Snellen chart."},
    {term:"Hyperopia",def:"Farsightedness — difficulty seeing close objects. Screened with the Jaeger chart."},
    {term:"Presbyopia",def:"Age-related loss of lens flexibility making near focus difficult. Commonly affects adults over 40."},
    {term:"Jaeger Eye Chart",def:"A near-vision test card with progressively smaller text held 14–16 inches from the eyes."},
    {term:"Ishihara Color Plates",def:"11 colored plates screening for color vision deficiency. Missing 4+ suggests a deficiency."},
    {term:"Color Vision Deficiency",def:"Inability to distinguish certain colors. Most common: red-green deficiency."},
  ]},
  {name:"Hearing",color:"#5B8CDB",terms:[
    {term:"Audiometer",def:"An electronic instrument testing hearing acuity by producing tones at controlled frequencies and amplitudes."},
    {term:"Audiometry",def:"A hearing test using an audiometer to measure ability to hear sounds at different frequencies and volumes."},
    {term:"Decibels (dB)",def:"Unit measuring sound loudness. Normal thresholds: adults < 25 dB; children < 15 dB."},
    {term:"Hertz (Hz)",def:"Unit measuring sound frequency (pitch). Higher Hz = higher pitch."},
    {term:"Tympanometry",def:"A test measuring eardrum movement by changing air pressure. Detects fluid or infection in the middle ear."},
    {term:"Tympanic Membrane",def:"The eardrum — thin membrane separating outer ear from middle ear."},
    {term:"Tympanogram",def:"The graphic readout from tympanometry. A peak = normal; flat line = abnormal."},
  ]},
  {name:"Allergy Testing",color:"#E8976A",terms:[
    {term:"Allergen",def:"A substance triggering an allergic reaction. Used in diluted form during allergy skin testing."},
    {term:"Antihistamine",def:"Medication blocking histamine action. Must be stopped 3 days before skin testing to avoid false-negatives."},
    {term:"Histamine",def:"Chemical released during allergic reactions causing inflammation, itching, redness, and swelling."},
    {term:"Wheal",def:"A raised skin swelling at a positive allergy test site. Larger wheal = stronger reaction."},
    {term:"Induration",def:"A hardened, raised tissue area at an injection site confirming a positive allergic response."},
    {term:"Scratch Test",def:"An allergy test applying diluted allergen to scratched skin. Positive = wheal-and-flare in 15–20 minutes."},
    {term:"Intradermal Test",def:"An allergy test injecting allergen just below the skin surface. Read no sooner than 15 minutes after."},
    {term:"False-Negative Result",def:"A result incorrectly indicating absence of a condition. Antihistamines can cause false-negatives in allergy testing."},
  ]},
  {name:"Pulmonary Function",color:"#4CAF90",terms:[
    {term:"Spirometry",def:"A non-invasive test measuring how fast and how much air a patient can move in and out of the lungs."},
    {term:"Pulmonary Function Test (PFT)",def:"A group of tests evaluating the lungs' capacity to move air. Spirometry is the most common."},
    {term:"FEV1",def:"Forced Expiratory Volume in 1 Second. Expected: 80–120% predicted. Reduced = airway obstruction."},
    {term:"FVC",def:"Forced Vital Capacity — total air forcefully exhaled after deepest breath. Expected: 80–120% predicted."},
    {term:"FEV1/FVC Ratio",def:"Ratio expressed as percentage. Low = obstructive disease; normal with reduced FVC = restrictive disease."},
    {term:"TLC",def:"Total Lung Capacity — total air in lungs after maximal inhalation. Expected: 80–120% predicted."},
    {term:"FRC",def:"Functional Residual Capacity — air remaining after normal exhalation. Expected: 75–120% predicted."},
    {term:"RV",def:"Residual Volume — air remaining after maximal exhalation. Elevated in emphysema and air trapping."},
    {term:"Bronchodilator",def:"Medication opening airways by relaxing bronchial muscle. Must be withheld 6+ hours before spirometry."},
    {term:"Peak Flow Meter",def:"Portable device measuring how fast air leaves the lungs. 80%+ of personal best = well-controlled."},
    {term:"PEFR",def:"Peak Expiratory Flow Rate — maximum exhalation speed. A drop signals worsening airway inflammation."},
    {term:"COPD",def:"Chronic Obstructive Pulmonary Disease — progressive lung disease including emphysema and chronic bronchitis."},
  ]},
];

const glossary=[];
const catNames=["All"];
const catColors={};
CATEGORIES.forEach(cat=>{
  catNames.push(cat.name);
  catColors[cat.name]=cat.color;
  cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));
});

let filter="All",search="",openIdx=null,currentPage=0;
const PER_PAGE=4;

function renderFilters(){
  document.getElementById('filters').innerHTML=catNames.map(c=>{
    const col=c==="All"?"#7a7f90":(catColors[c]||"#888");
    const active=filter===c;
    return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;
  }).join('');
}

function getFiltered(){
  const s=search.toLowerCase();
  return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));
}

function renderList(){
  const filtered=getFiltered();
  const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  if(currentPage>=totalPages) currentPage=totalPages-1;
  if(currentPage<0) currentPage=0;
  const start=currentPage*PER_PAGE;
  const pageItems=filtered.slice(start,start+PER_PAGE);

  document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;

  if(!filtered.length){
    document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';
    document.getElementById('pager').innerHTML='';
    return;
  }

  document.getElementById('list').innerHTML=pageItems.map(g=>{
    const col=catColors[g.category]||"#888";
    const origIdx=glossary.indexOf(g);
    const isOpen=openIdx===origIdx;
    return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})">
      <div class="item-head">
        <div class="item-left">
          <div class="item-bar" style="background:${col}"></div>
          <span class="item-term">${g.term}</span>
        </div>
        <span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span>
      </div>
      <div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div>
    </div>`;
  }).join('');

  let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button>`;
  ph+=`<div class="pg-dots">`;
  for(let p=0;p<totalPages;p++){
    ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;
  }
  ph+=`</div>`;
  ph+=`<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;
  document.getElementById('pager').innerHTML=ph;
}

function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
