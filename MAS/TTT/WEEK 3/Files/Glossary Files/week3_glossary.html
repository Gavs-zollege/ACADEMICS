<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 3 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 3 Glossary</h1>
  <p class="sub">Administrative Assisting</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Practice Mgmt",color:"#6B7B8D",terms:[
    {term:"Practice Management System",def:"The administrative software handling scheduling, demographics, billing, claim submission, and payment tracking."},
    {term:"Electronic Medical Record (EMR)",def:"A digital patient chart within a single healthcare organization. Replaces paper charts for clinical documentation."},
    {term:"Electronic Health Record (EHR)",def:"A comprehensive digital record accessible across different locations and organizations. Supports real-time data sharing."},
    {term:"Interoperability",def:"The ability of different healthcare systems to exchange, interpret, and use patient health information."},
    {term:"Alphabetic Filing",def:"Most common paper filing method — by last name. Documents in reverse chronological order, most recent on top."},
    {term:"Reverse Chronological Order",def:"Filing with the most recent document on top and older documents below."},
    {term:"Medical Record Retention",def:"The required time a record must be kept before legal destruction. Varies by state law."},
    {term:"Addendum",def:"An entry added to correct or supplement previously documented information. Includes date, time, and author."},
    {term:"Cloud Storage",def:"Storing EHR data on remote servers accessed via internet. Data backed up in real time off-site."},
    {term:"Notice of Privacy Practices",def:"A required HIPAA document explaining how PHI may be used and disclosed. Patients sign acknowledgment."},
    {term:"Advance Directive",def:"A legal document stating wishes for medical care and end-of-life decisions if unable to communicate."},
    {term:"Assignment of Benefits",def:"Patient authorization directing insurance to pay benefits directly to the provider."},
  ]},
  {name:"Scheduling",color:"#4A90B8",terms:[
    {term:"Specific Time Scheduling",def:"Each patient gets their own individual appointment slot. The most traditional approach."},
    {term:"Wave Scheduling",def:"Multiple patients booked at the top of each hour, seen in order of arrival."},
    {term:"Double-Booking",def:"Two patients given the same time when one requires independent lab work while provider sees the other."},
    {term:"Cluster Scheduling",def:"Grouping similar appointment types into the same time blocks."},
    {term:"New Patient",def:"No services from the provider or same group/specialty in the past 3 years. Requires more time."},
    {term:"Established Patient",def:"Has received services from the same provider or group/specialty within the past 3 years."},
    {term:"Urgent Visit",def:"Needed within 24 hours for a condition requiring prompt attention but not life-threatening."},
    {term:"Preventive Care Visit",def:"Focused on maintaining health, identifying risk factors, and age-appropriate screenings."},
    {term:"Comprehensive Visit",def:"Highest coding level — multiple complaints, complex conditions, or extensive workup."},
    {term:"Schedule Matrix",def:"A pre-built template defining provider availability, blocking non-patient time before booking opens."},
    {term:"Telehealth Visit",def:"Medical encounter via secure video/phone when provider and patient are in separate locations."},
    {term:"After-Visit Summary (AVS)",def:"Document summarizing the visit — diagnoses, medication changes, instructions, follow-up."},
  ]},
  {name:"Insurance",color:"#E05555",terms:[
    {term:"Eligibility Verification",def:"Confirming insurance is active and covers requested services. Done at scheduling and date of service."},
    {term:"Premium",def:"The fixed monthly amount paid to maintain health insurance coverage."},
    {term:"Copayment (Copay)",def:"A fixed dollar amount the patient pays at each visit, collected before the appointment."},
    {term:"Deductible",def:"The amount a patient pays out-of-pocket before insurance begins to pay. Resets annually."},
    {term:"Coinsurance",def:"The percentage of costs the patient pays after the deductible is met."},
    {term:"Out-of-Pocket Maximum",def:"The highest total a patient pays per plan year. After this, insurance pays 100%."},
    {term:"Tier (Insurance Plan)",def:"A coverage level — lower tiers have lower premiums but higher cost-sharing."},
    {term:"Sliding Scale Fee",def:"Fees adjusted based on patient income level to ensure access for those with limited means."},
    {term:"Indigent Program",def:"Government/community programs providing free or low-cost care to patients who cannot afford to pay."},
    {term:"Real-Time Adjudication",def:"Evaluating a claim at the point of service for immediate confirmation of coverage."},
  ]},
  {name:"Preauth & Referrals",color:"#8B6AAE",terms:[
    {term:"Preauthorization",def:"Insurance approval obtained before a procedure, therapy, or specialist consultation."},
    {term:"Precertification",def:"Verifying that a patient's plan includes a specific benefit. Does not confirm medical necessity."},
    {term:"Utilization Review",def:"Insurance evaluation of the medical necessity and appropriateness of proposed services."},
    {term:"Referral",def:"A PCP order directing a patient to a specialist. Some plans require formal referrals for coverage."},
    {term:"Treatment, Payment, Operations",def:"HIPAA categories permitting PHI use without separate patient authorization."},
    {term:"Electronic Referral",def:"A referral submitted digitally through EHR or payer portal via encrypted connection."},
    {term:"Predetermination",def:"Submitting a treatment plan to the payer in advance for a coverage estimate."},
    {term:"Prior Authorization Number",def:"A unique ID issued when preauth is approved. Must be included on the claim."},
  ]},
  {name:"Coding",color:"#E2B94C",terms:[
    {term:"ICD-10-CM",def:"Code set for reporting diagnoses — 3–7 alphanumeric characters. Describes condition, injury, severity."},
    {term:"CPT®",def:"Current Procedural Terminology — 5-digit codes for medical procedures. Updated annually by the AMA."},
    {term:"HCPCS",def:"Codes covering services not described by CPT — DME, ambulance, therapies. Required for Medicare/Medicaid."},
    {term:"Modifier",def:"A two-digit code appended to CPT/HCPCS providing additional info without changing the definition."},
    {term:"Medical Necessity",def:"Clinical justification that a service is appropriate. Diagnosis must link to procedure code."},
    {term:"Superbill / Encounter Form",def:"Document listing visit diagnoses and procedures with codes. Used to generate claims."},
    {term:"Code Sequencing",def:"The order codes are listed on a claim. Principal diagnosis first."},
    {term:"E/M Services",def:"Evaluation and Management CPT codes for assessment, diagnosis, and treatment planning."},
    {term:"ICD-10-PCS",def:"Procedure Coding System for inpatient hospital procedures only. Not used in ambulatory care."},
    {term:"Diagnosis Code Linkage",def:"Every procedure code must link to a diagnosis code justifying the service."},
  ]},
  {name:"Revenue & Billing",color:"#1A8A7D",terms:[
    {term:"Revenue Cycle",def:"The complete financial process — from verifying eligibility to collecting final payment."},
    {term:"Charge Reconciliation",def:"Verifying all services are accurately billed and payments correctly posted."},
    {term:"Accounts Receivable (A/R)",def:"Total money owed for services rendered but not yet paid."},
    {term:"A/R Aging Report",def:"Groups outstanding balances by time unpaid to prioritize collection."},
    {term:"Contractual Adjustment",def:"Difference between billed charge and insurance-agreed amount. Written off."},
    {term:"Write-Off",def:"An amount removed from a balance deemed uncollectible."},
    {term:"Clearinghouse",def:"A third party that checks claims for errors, reformats, and forwards to insurers."},
    {term:"Clean Claim",def:"A claim with all required info and no errors. Processed faster with fewer denials."},
    {term:"Timely Filing",def:"Claims must be submitted within a specified number of days or they are denied."},
    {term:"Explanation of Benefits (EOB)",def:"Insurance document showing what was covered, paid, adjusted, and patient owes."},
    {term:"Adjudication",def:"Insurance review of a claim to determine payment or denial."},
    {term:"Fee-for-Service",def:"Payment model where providers are reimbursed for each individual service."},
    {term:"Value-Based Care",def:"Reimbursement rewarding quality outcomes rather than volume of services."},
    {term:"Cycle Billing",def:"Billing accounts in segments throughout the month to distribute workload."},
    {term:"Advance Beneficiary Notice",def:"Medicare form notifying a patient a service may not be covered. Must be signed before service."},
  ]},
  {name:"Denials & Appeals",color:"#E74C6F",terms:[
    {term:"Claim Denial",def:"Insurance determination that a claim will not be paid."},
    {term:"Appeal",def:"A formal request to reconsider a denied or underpaid claim with supporting documentation."},
    {term:"Denial Management",def:"Identifying, analyzing, and resolving denied claims."},
    {term:"Retroactive Authorization",def:"Auth requested after a service was already performed. Not always granted."},
    {term:"Eligibility Denial",def:"Denial because patient wasn't covered on the date of service."},
    {term:"Medical Necessity Denial",def:"Denial stating the service isn't justified for the diagnosis."},
  ]},
  {name:"Auditing",color:"#4CAF90",terms:[
    {term:"Prospective Audit",def:"Review of records and coding before claims are submitted."},
    {term:"Retrospective Audit (Internal)",def:"Post-billing review for quality improvement and trend identification."},
    {term:"Retrospective Audit (External)",def:"Post-billing review by a third-party payer. Can result in repayment requests."},
    {term:"Concurrent Review",def:"Audit during an inpatient stay. Not typical in ambulatory care."},
    {term:"CMS",def:"Centers for Medicare & Medicaid Services — oversees Medicare and documentation guidelines."},
    {term:"MACRA",def:"2015 law shifting Medicare toward value-based payment with quality metrics."},
    {term:"Documentation Guidelines",def:"CMS/payer rules for how encounters must be documented to support codes billed."},
    {term:"Fraud & Abuse",def:"Fraud = intentional deception for payment. Abuse = improper but unintentional billing."},
    {term:"Compliance Program",def:"A program to prevent, detect, and correct healthcare law and billing violations."},
  ]},
  {name:"HIPAA & Comms",color:"#C4A84D",terms:[
    {term:"Protected Health Information",def:"Any individually identifiable health info protected under HIPAA."},
    {term:"HIPAA",def:"Federal law establishing standards for protecting patient health information privacy and security."},
    {term:"Patient Portal",def:"Secure online platform for patients to access records, message providers, and manage care."},
    {term:"Appointment Reminder",def:"Pre-visit notification to reduce no-shows — phone, text, email, or portal message."},
    {term:"No-Show Policy",def:"Written policy for missed appointments. Patients informed at scheduling."},
    {term:"Telehealth",def:"Healthcare delivery via secure electronic communication from different locations."},
    {term:"Synchronous Telehealth",def:"Real-time live video or phone encounter. Most common in ambulatory care."},
    {term:"Patient Financial Responsibility",def:"The portion owed by the patient — copays, deductibles, coinsurance, non-covered services."},
  ]},
  {name:"Inventory & Office",color:"#E8976A",terms:[
    {term:"Par Level",def:"Minimum supply quantity before reorder is triggered."},
    {term:"Supply Chain",def:"The system of organizations and processes delivering supplies to the practice."},
    {term:"Inventory Log",def:"A record tracking quantity, location, cost, vendor, and reorder frequency."},
    {term:"Administrative Supplies",def:"Non-clinical office supplies — paper, printer cartridges, pens, forms."},
    {term:"Clinical Supplies",def:"Medical supplies for patient care — gloves, bandages, lancets, specimen kits."},
    {term:"Proper Body Mechanics",def:"Correct posture and movement when lifting heavy items to prevent injury."},
    {term:"Equipment Inspection Log",def:"Record of maintenance, calibration checks, and service history for equipment."},
    {term:"OSHA",def:"Occupational Safety and Health Administration — workplace safety standards in healthcare."},
    {term:"Calibration",def:"Verifying and adjusting equipment to ensure accurate measurements."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;

function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
