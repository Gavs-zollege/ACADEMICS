<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Order of Draw</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Inter',sans-serif;color:#FFF}
.wrap{max-width:640px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}
.header{text-align:center;margin-bottom:8px;flex-shrink:0}
.header .icon{font-size:32px}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:#94A3B8;font-weight:600;font-size:13px}
.badge{display:inline-block;margin-top:4px;background:#132F42;padding:4px 14px;border-radius:20px;border:1px solid rgba(45,212,191,.25);color:#2DD4BF;font-weight:800;font-size:12px}
.game-area{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}
.fb{text-align:center;padding:8px 14px;margin-bottom:8px;border-radius:10px}
.fb.ok{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2)}
.fb.no{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.2)}
.fb strong{font-weight:800;font-size:14px}
.fb strong.ok{color:#34D399}
.fb strong.no{color:#FCA5A5}
.fb .tip{color:#E2E8F0;font-weight:500;font-size:12px;margin-top:4px}
.section-label{font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px}
.section-label.done-l{color:#34D399}
.section-label.pick{color:#F87171}
.placed-item{display:flex;align-items:center;gap:10px;padding:8px 14px;background:rgba(52,211,153,.06);border-radius:10px;margin-bottom:4px;border:1px solid rgba(52,211,153,.13)}
.placed-num{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(52,211,153,.13);color:#34D399;font-weight:800;font-size:14px;flex-shrink:0;font-family:'Plus Jakarta Sans',sans-serif}
.placed-text{font-weight:700;font-size:12px}
.pool{display:grid;gap:6px}
.pool-item{padding:10px 14px;border-radius:10px;background:#132F42;border:1.5px solid rgba(45,212,191,.15);font-weight:700;font-size:13px;cursor:pointer;transition:all .18s}
.pool-item:hover{background:#1A3A50;border-color:rgba(45,212,191,.3)}
.done-box{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);margin:auto 0}
.done-box .big{font-size:40px}
.done-box h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;margin:8px 0 4px}
.done-box p{color:#E2E8F0;font-weight:500;font-size:13px;margin-bottom:16px;line-height:1.5}
.btn{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}</style></head>
<body><div class="wrap">
<div class="header"><div class="icon">🧪</div><h1>Order of Draw</h1><p class="sub">Tap the tubes in the correct venipuncture order of draw</p><div class="badge" id="counter">0 / 8 placed</div></div>
<div id="game" class="game-area"></div><div id="doneBox" class="done-box" style="display:none"></div></div>
<script>
var ORDER=["Yellow \u2014 Blood cultures (SPS)", "Light Blue \u2014 Coagulation (sodium citrate)", "Red \u2014 Serum, no additive", "Red/Gray SST \u2014 Serum with clot activator", "Green \u2014 Chemistry (heparin)", "Green/Gray \u2014 Plasma chemistry (lithium heparin + gel)", "Lavender \u2014 Hematology (EDTA)", "Gray \u2014 Glucose & alcohol (oxalate/fluoride)"];var TIPS=["SPS prevents clotting; always drawn first to avoid contamination.", "Citrate ratio must be exact \u2014 underfilled tubes give invalid coag results.", "No additive \u2014 produces serum for chemistry and blood bank.", "Silica activates clotting; gel separates serum during centrifugation.", "Heparin inhibits thrombin \u2014 used for stat chemistry panels.", "Lithium heparin + gel separator for plasma chemistry studies.", "EDTA chelates calcium \u2014 the standard for CBC and hematology.", "Fluoride inhibits glycolysis to preserve glucose levels."];
var pool,placed,fbData;
function shuffle(a){return[].concat(a).sort(function(){return Math.random()-.5})}
function init(){pool=shuffle(ORDER);placed=[];fbData=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';render()}
function render(){document.getElementById('counter').textContent=placed.length+' / '+ORDER.length+' placed';var g=document.getElementById('game'),h='';if(fbData){h+='<div class="fb '+(fbData.ok?'ok':'no')+'"><strong class="'+(fbData.ok?'ok':'no')+'">'+(fbData.ok?'\u2705 Correct!':'\u274c Not the next step!')+'</strong>';if(fbData.tip)h+='<div class="tip">'+fbData.tip+'</div>';h+='</div>';}if(placed.length>0){h+='<div style="margin-bottom:10px"><div class="section-label done-l">\u2705 Completed</div>';placed.forEach(function(s,i){h+='<div class="placed-item"><div class="placed-num">'+(i+1)+'</div><div class="placed-text">'+s+'</div></div>'});h+='</div>';}if(pool.length>0){h+='<div class="section-label pick">\uD83C\uDFAF Tap step #'+(placed.length+1)+'</div><div class="pool">';pool.forEach(function(s,i){h+='<div class="pool-item" onclick="pick('+i+')">'+s+'</div>'});h+='</div>';}g.innerHTML=h;}
function pick(idx){var step=pool[idx],ni=placed.length;if(step===ORDER[ni]){placed.push(step);pool=pool.filter(function(_,i){return i!==idx});fbData={ok:true,tip:TIPS[ni]};render();if(placed.length===ORDER.length)setTimeout(function(){document.getElementById('game').style.display='none';var d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">\uD83C\uDF89</div><h2>Perfect Order!</h2><p>Additive carryover between tubes corrupts results — correct order prevents this.</p><button class="btn" onclick="init()">Play Again</button>';},1000);else setTimeout(function(){fbData=null;render()},1500)}else{fbData={ok:false};render();setTimeout(function(){fbData=null;render()},1200)}}
init();
</script></body></html>
