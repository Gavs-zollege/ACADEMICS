<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Needle System Sorter</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Inter',sans-serif;color:#FFF}
.wrap{max-width:720px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}
.header{text-align:center;margin-bottom:8px;flex-shrink:0}
.header .icon{font-size:32px}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:#94A3B8;font-weight:600;font-size:13px}
.score{color:#FBBF24;font-weight:700;font-size:13px;margin-top:4px}
.prompt{background:rgba(45,212,191,0.08);padding:12px 18px;border-radius:14px;text-align:center;margin-bottom:8px;border:1.5px solid rgba(45,212,191,0.2);flex-shrink:0}
.prompt .label{color:#94A3B8;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:4px}
.prompt .item{color:#FFF;font-size:16px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif}
.prompt .rem{color:#94A3B8;font-size:12px;margin-top:4px}
.fb{text-align:center;padding:8px;margin-bottom:6px;border-radius:10px;font-weight:700;font-size:13px;flex-shrink:0}
.fb.ok{background:rgba(52,211,153,.15);color:#34D399}
.fb.no{background:rgba(248,113,113,.15);color:#FCA5A5}
.game-area{flex:1;min-height:0;display:flex;flex-direction:column}
.next-btn{width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:6px;flex-shrink:0;transition:transform .12s}
.next-btn:hover{transform:translateY(-1px)}
.buckets{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-height:0;overflow-y:auto;align-content:start;padding-bottom:8px}
.bucket{flex:1 1 150px;min-width:140px;background:#132F42;border-radius:14px;padding:10px;cursor:pointer;transition:all .18s}
.bucket:hover{filter:brightness(1.15);transform:translateY(-1px)}
.bucket h3{font-weight:700;font-size:13px;text-align:center;margin-bottom:2px;font-family:'Plus Jakarta Sans',sans-serif}
.bucket .hint{color:#94A3B8;font-size:10px;text-align:center;margin-bottom:6px;font-weight:500}
.bucket .placed{padding:4px 8px;border-radius:6px;margin-bottom:3px;font-size:11px;font-weight:600}
.bucket.correct-flash{box-shadow:0 0 0 3px rgba(52,211,153,0.5);filter:brightness(1.2)}
.bucket.wrong-flash{box-shadow:0 0 0 3px rgba(248,113,113,0.5)}
.b0{border:2px solid rgba(167,139,250,.3)}.b0 h3{color:#A78BFA}.b0 .placed{background:rgba(167,139,250,.08);border:1px solid rgba(167,139,250,.15)}
.b1{border:2px solid rgba(251,191,36,.3)}.b1 h3{color:#FBBF24}.b1 .placed{background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.15)}
.b2{border:2px solid rgba(52,211,153,.3)}.b2 h3{color:#34D399}.b2 .placed{background:rgba(52,211,153,.08);border:1px solid rgba(52,211,153,.15)}
.done{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);margin:auto 0}
.done .big{font-size:40px}
.done h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;margin:8px 0 4px}
.done p{color:#E2E8F0;font-weight:500;font-size:13px;margin-bottom:16px;line-height:1.5}
.btn{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}
.btn-redo{padding:10px 28px;border:1.5px solid #5EEAD4;border-radius:10px;background:transparent;color:#5EEAD4;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:8px}
.btn-redo:hover{background:rgba(94,234,212,0.1);transform:translateY(-1px)}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="icon">💉</div>
    <h1>Needle System Sorter</h1>
    <p class="sub">Sort each fact into the correct collection system</p>
    <p class="score" id="scoreDisplay">Score: 0 / 12</p>
  </div>
  <div id="game" class="game-area">
    <div class="prompt" id="promptBox"></div>
    <div class="fb" id="feedback" style="display:none"></div>
    <button class="next-btn" id="nextBtn" style="display:none" onclick="nextItem()">Next →</button>
    <div class="buckets" id="bucketsRow"></div>
  </div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
var BNAMES = ["Evacuated Tube", "Butterfly (Winged)", "Syringe"];
var BICONS = ["🧪", "🦋", "💉"];
var BHINTS = ["Most common", "Fragile veins", "Limited volume"];

var ORIG_ALL = [
  {text: "Most common method \u2014 ideal for most patients", b: 0},
  {text: "Double-pointed needle + holder + vacuum tubes", b: 0},
  {text: "Gauge 20\u201322; length \u00be to 1\u00bd inches", b: 0},
  {text: "Allows multiple tubes with a single puncture", b: 0},
  {text: "Best for small, fragile, or difficult veins", b: 1},
  {text: "Wings + short needle + flexible tubing", b: 1},
  {text: "Gauge 21\u201323; length \u00bd to \u00be inch", b: 1},
  {text: "Often used for hand veins and pediatric patients", b: 1},
  {text: "Suction controlled by the plunger", b: 2},
  {text: "Used when draw volume is limited", b: 2},
  {text: "Transfer to tubes immediately after collection", b: 2},
  {text: "16-gauge injection needle typically used", b: 2}
];

var remaining, bContents, score, missedItems, answered;

function shuffle(a) {
  return [].concat(a).sort(function() { return Math.random() - 0.5; });
}

function init() {
  remaining = shuffle(ORIG_ALL);
  bContents = BNAMES.map(function() { return []; });
  score = 0;
  missedItems = [];
  answered = false;
  document.getElementById("game").style.display = "flex";
  document.getElementById("doneBox").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("feedback").style.display = "none";
  render();
}

function render() {
  document.getElementById("scoreDisplay").textContent = "Score: " + score + " / " + ORIG_ALL.length;

  var pb = document.getElementById("promptBox");
  if (remaining.length > 0) {
    pb.style.display = "block";
    pb.innerHTML = '<div class="label">Which collection system?</div><div class="item">' + remaining[0].text + '</div><div class="rem">' + remaining.length + " remaining</div>";
  } else {
    pb.style.display = "none";
  }

  var br = document.getElementById("bucketsRow");
  br.innerHTML = "";
  BNAMES.forEach(function(name, i) {
    var d = document.createElement("div");
    d.className = "bucket b" + i;
    if (!answered) {
      d.onclick = function() { drop(i); };
    } else {
      d.style.cursor = "default";
    }
    var h = "<h3>" + BICONS[i] + " " + name + "</h3><div class=\"hint\">" + BHINTS[i] + "</div>";
    bContents[i].forEach(function(t) {
      h += '<div class="placed">\u2705 ' + t + "</div>";
    });
    d.innerHTML = h;
    br.appendChild(d);
  });
}

function drop(bi) {
  if (remaining.length === 0 || answered) return;
  answered = true;
  var cur = remaining[0];
  var ok = cur.b === bi;

  if (ok) {
    bContents[bi].push(cur.text);
    score++;
  } else {
    missedItems.push(cur);
  }

  var fb = document.getElementById("feedback");
  fb.style.display = "block";
  fb.className = "fb " + (ok ? "ok" : "no");
  fb.textContent = ok ? "\u2705 Correct!" : "\u274c That belongs in " + BNAMES[cur.b];

  remaining = remaining.slice(1);
  render();

  var els = document.querySelectorAll(".bucket");
  els.forEach(function(el, i) {
    el.style.cursor = "default";
    el.onclick = null;
    if (i === cur.b) el.classList.add("correct-flash");
    else if (i === bi && !ok) el.classList.add("wrong-flash");
  });

  document.getElementById("nextBtn").style.display = "block";
}

function nextItem() {
  answered = false;
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("feedback").style.display = "none";
  document.querySelectorAll(".bucket").forEach(function(el) {
    el.classList.remove("correct-flash", "wrong-flash");
  });
  if (remaining.length === 0) { showDone(); return; }
  render();
}

function showDone() {
  document.getElementById("game").style.display = "none";
  var d = document.getElementById("doneBox");
  d.style.display = "block";
  var pct = score >= 10;
  var html = '<div class="big">' + (pct ? "\uD83C\uDFC6" : "\uD83D\uDCAA") + "</div>";
  html += "<h2>" + score + "/" + ORIG_ALL.length + " Correct!</h2>";
  html += "<p>Choose the right system based on the patient\u2019s veins \u2014 evacuated for most, butterfly for fragile.</p>";
  html += '<button class="btn" onclick="init()">Play Again</button>';
  if (missedItems.length > 0) {
    html += '<br><button class="btn-redo" onclick="redoMissed()">Redo Missed (' + missedItems.length + ")</button>";
  }
  d.innerHTML = html;
}

function redoMissed() {
  remaining = shuffle(missedItems.slice());
  bContents = BNAMES.map(function() { return []; });
  score = 0;
  var old = missedItems.slice();
  missedItems = [];
  answered = false;
  ORIG_ALL = old;
  document.getElementById("game").style.display = "flex";
  document.getElementById("doneBox").style.display = "none";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("feedback").style.display = "none";
  render();
}

init();
</script>
</body>
</html>
