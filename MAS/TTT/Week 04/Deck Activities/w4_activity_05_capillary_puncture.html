<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Capillary Puncture Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(155deg,#14082a,#1c1040,#100828);font-family:'Outfit',sans-serif;padding:24px 16px;color:#ece0ff}
.wrap{max-width:640px;margin:0 auto}
.header{text-align:center;margin-bottom:24px}
.icon{font-size:44px}
h1{font-weight:800;font-size:30px;margin:8px 0 4px}
.sub{color:#9880c0;font-weight:600;font-size:15px}
.topbar{display:flex;justify-content:space-between;margin-bottom:12px}
.topbar .qn{color:#9880c0;font-weight:700;font-size:14px}
.topbar .sc{color:#a3e635;font-weight:800;font-size:14px}
.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#a3e635);border-radius:10px;transition:width .4s}
.question{background:#1c1040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}
.question p{font-weight:800;font-size:18px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
.opt:hover{filter:brightness(1.15)}
.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}
.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}
.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}
.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1040}
.tip strong{font-size:16px;display:block;margin-bottom:6px}
.tip strong.ok{color:#4ade80}
.tip strong.no{color:#fb7185}
.tip span{color:#9880c0;font-weight:600;font-size:14px}
.done{text-align:center;background:#1c1040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}
.done .big{font-size:56px}
.done h2{font-weight:800;font-size:28px;margin:12px 0}
.done p{color:#9880c0;font-weight:600;font-size:15px;margin-bottom:24px}
.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#14082a;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="icon">🤏</div><h1>Capillary Puncture Quiz</h1><p class="sub">Test your fingerstick & heel stick knowledge</p></div>
  <div id="game"></div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"For adults and children, the capillary puncture site is:",opts:["The thumb of either hand","The middle or ring finger of the nondominant hand","Any finger on the dominant hand","The index finger tip"],a:1,tip:"Middle or ring finger, slightly off-center. Avoid the nail bed and central pad."},
  {q:"For infants, the correct capillary puncture site is:",opts:["The middle finger","The earlobe","The outer edge of the underside of the heel","The big toe"],a:2,tip:"ONLY the outer heel edge. Never puncture an infant's finger — bone damage risk."},
  {q:"Why do you wipe away the first drop of blood?",opts:["It's too dark to read","It contains tissue fluid that contaminates the sample","It clots too fast","The lancet isn't sterile"],a:1,tip:"First drop = tissue fluid contamination. Exception: prothrombin time (PT) testing."},
  {q:"What is the capillary order of draw?",opts:["Same as venipuncture","Blood gas → EDTA → Other additives → Serum","Serum → EDTA → Blood gas → Other","Yellow → Blue → Red → Lavender → Gray"],a:1,tip:"Capillary order differs from venipuncture: gas → EDTA → other additives → serum."},
  {q:"Cold hands before a fingerstick should be managed by:",opts:["Drawing anyway — temperature doesn't matter","Having the patient rub hands or run warm water over them","Using a tourniquet on the wrist","Puncturing deeper with a larger lancet"],a:1,tip:"Warmth dilates capillaries. Rub hands, warm water, or heel warmers for infants."},
  {q:"When is capillary collection preferred over venipuncture?",opts:["When large volumes of blood are needed","When small volume is needed, for immediate results, or for infants","When the patient has excellent veins","For blood cultures"],a:1,tip:"Small volume, POC tests, infants, and young children — capillary is ideal."},
  {q:"What collection devices are used for capillary draws?",opts:["Evacuated tubes and holders","Micropipettes, capillary tubes, glucometer strips, screening cards","Standard syringes","IV catheters"],a:1,tip:"Specialized micro-collection devices match the small volume of capillary draws."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Capillary draws require different sites, order, and devices than venipuncture.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script>
</body>
</html>
