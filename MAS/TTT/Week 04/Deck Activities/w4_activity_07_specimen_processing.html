<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Specimen Processing Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(155deg,#0a1a10,#102818,#08140a);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#e0f5e8}
.wrap{max-width:640px;margin:0 auto}
.header{text-align:center;margin-bottom:24px}
.icon{font-size:44px}
h1{font-weight:700;font-size:30px;margin:8px 0 4px}
.sub{color:#6aa880;font-weight:600;font-size:15px}
.topbar{display:flex;justify-content:space-between;margin-bottom:12px}
.topbar .qn{color:#6aa880;font-weight:700;font-size:14px}
.topbar .sc{color:#fbbf24;font-weight:700;font-size:14px}
.bar{height:6px;background:#1a3820;border-radius:10px;margin-bottom:20px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#fbbf24);border-radius:10px;transition:width .4s}
.question{background:#122818;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #fbbf24}
.question p{font-weight:700;font-size:18px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{padding:15px 20px;border-radius:14px;background:#1a3820;border:2px solid #1a3820;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
.opt:hover{filter:brightness(1.15)}
.opt .letter{color:#fbbf24;font-weight:700;margin-right:12px}
.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}
.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}
.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#122818}
.tip strong{font-size:16px;display:block;margin-bottom:6px}
.tip strong.ok{color:#4ade80}
.tip strong.no{color:#fb7185}
.tip span{color:#6aa880;font-weight:600;font-size:14px}
.done{text-align:center;background:#122818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}
.done .big{font-size:56px}
.done h2{font-weight:700;font-size:28px;margin:12px 0}
.done p{color:#6aa880;font-weight:600;font-size:15px;margin-bottom:24px}
.btn{padding:14px 36px;border:none;border-radius:14px;background:#fbbf24;color:#0a1a10;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="icon">🧫</div><h1>Specimen Processing Pro</h1><p class="sub">Test your knowledge of processing, storage & transport</p></div>
  <div id="game"></div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"Serum tubes must stand upright at room temperature for how long before centrifuging?",opts:["5–10 minutes","30–45 minutes","1–2 hours","No wait needed"],a:1,tip:"30–45 minutes for clotting. Produces maximum serum yield."},
  {q:"Specimens must NOT sit longer than ___ before centrifugation.",opts:["30 minutes","1 hour","2 hours","4 hours"],a:1,tip:"After 1 hour, leaching begins and specimen integrity degrades."},
  {q:"After centrifugation, the three layers (top to bottom) are:",opts:["RBCs, buffy coat, serum","Plasma/serum, buffy coat, red blood cells","Buffy coat, plasma, RBCs","Serum, RBCs, buffy coat"],a:1,tip:"Top = plasma/serum, middle = buffy coat (WBCs/platelets), bottom = RBCs."},
  {q:"How do you balance a centrifuge with a single specimen?",opts:["Spin it alone — it's fine","Place a water-filled tube of equal size opposite it","Use a heavier tube on the other side","Run it at half speed"],a:1,tip:"Always balance: equal size and fill volume opposite. Use water tubes for odd numbers."},
  {q:"When splitting a specimen into multiple tubes (aliquots), you should:",opts:["Pour carefully between containers","Use a disposable pipette — never pour","Use your finger to guide the liquid","Shake the tube first to mix"],a:1,tip:"Never pour — splashing risk is too high. Always use a disposable pipette."},
  {q:"Light-sensitive specimens should be:",opts:["Kept under bright lights for visibility","Wrapped in foil or placed in amber tubes after processing","Stored in clear containers","Left uncovered during transport"],a:1,tip:"Keep lab lights low during processing. Foil or amber tubes protect from light degradation."},
  {q:"Before leaving for the day, the MA should always:",opts:["Turn off the centrifuge","Verify that specimen pickup occurred","Empty the sharps container","Count the remaining tubes"],a:1,tip:"Missed transport can compromise specimen viability — always confirm pickup."},
  {q:"Frozen specimens should be moved to the transport cooler:",opts:["While still thawing","Only after completely frozen","At room temperature first","With refrigerated specimens together"],a:1,tip:"Specimen must be completely frozen before transfer to the transport cooler."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=7?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Proper processing, storage, and transport protect every specimen\'s diagnostic integrity.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script>
</body>
</html>
