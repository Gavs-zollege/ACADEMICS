<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Collections & Critical Values</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(160deg,#1a1508,#221c0e,#141006);font-family:'Rubik',sans-serif;padding:24px 16px;color:#fff5e0}
.wrap{max-width:640px;margin:0 auto}
.header{text-align:center;margin-bottom:24px}
.icon{font-size:44px}
h1{font-weight:800;font-size:28px;margin:8px 0 4px}
.sub{color:#b8a060;font-weight:600;font-size:15px}
.topbar{display:flex;justify-content:space-between;margin-bottom:12px}
.topbar .qn{color:#b8a060;font-weight:700;font-size:14px}
.topbar .sc{color:#f59e0b;font-weight:800;font-size:14px}
.bar{height:6px;background:#302818;border-radius:10px;margin-bottom:20px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#ef4444);border-radius:10px;transition:width .4s}
.question{background:#221c0e;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #f59e0b}
.question p{font-weight:800;font-size:18px;line-height:1.6}
.opts{display:grid;gap:10px}
.opt{padding:15px 20px;border-radius:14px;background:#302818;border:2px solid #302818;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}
.opt:hover{filter:brightness(1.1)}
.opt .letter{color:#f59e0b;font-weight:800;margin-right:12px}
.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}
.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}
.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#221c0e}
.tip strong{font-size:16px;display:block;margin-bottom:6px}
.tip strong.ok{color:#4ade80}
.tip strong.no{color:#fb7185}
.tip span{color:#b8a060;font-weight:600;font-size:14px}
.done{text-align:center;background:#221c0e;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}
.done .big{font-size:56px}
.done h2{font-weight:800;font-size:28px;margin:12px 0}
.done p{color:#b8a060;font-weight:600;font-size:15px;margin-bottom:24px}
.btn{padding:14px 36px;border:none;border-radius:14px;background:#f59e0b;color:#1a1508;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="icon">🔬</div><h1>Special Collections & Critical Values</h1><p class="sub">Timed draws, blood cultures, chain of custody & critical results</p></div>
  <div id="game"></div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A timed specimen must be drawn at the exact provider-ordered time. If the patient arrives early, you should:",opts:["Draw anyway to save time","Contact the provider before proceeding","Have the patient wait in the lobby and draw at the scheduled time","Reschedule for another day"],a:1,tip:"Timing errors undermine the test. Contact the provider — never guess."},
  {q:"Blood cultures require what special step compared to routine draws?",opts:["A larger needle gauge","Special skin preparation to prevent contamination","Drawing from the foot","Using a syringe only"],a:1,tip:"Contamination renders blood cultures invalid. Always follow the lab manual protocol."},
  {q:"For chain-of-custody collections, who must sign the form?",opts:["Only the MA","Only the patient","Every individual who handles the specimen","Only the provider"],a:2,tip:"Every handler signs. Patient consents before collection. Everything is documented."},
  {q:"When a lab calls with a CRITICAL value, the MA should:",opts:["Write it down and tell the provider at the end of the day","Repeat the result back to the lab, then notify the provider immediately","Ask the lab to call back later","Send it through the patient portal"],a:1,tip:"Read-back confirmation, then IMMEDIATE provider notification. Document everything."},
  {q:"What must be documented when receiving a critical lab value?",opts:["Just the value","The value, lab person's name, time received, and confirmation provider was notified","Only that you called the provider","The patient's phone number"],a:1,tip:"Full documentation: value, caller name, time, and confirmation of provider notification."},
  {q:"Results may be shared with the patient:",opts:["Immediately when they call asking","Only after the provider has reviewed and directed the communication","By any staff member who answered the phone","Only by mail"],a:1,tip:"Provider reviews ALL results first. Then share only with patient or authorized individual."},
  {q:"When communicating results to a patient, you should:",opts:["Read the numbers and hang up","Explain the results independently","Ask the patient to repeat back what they heard","Email the raw lab report"],a:2,tip:"Confirm understanding by having the patient repeat back. Address questions through the provider."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Critical values need immediate notification, read-back, and thorough documentation.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script>
</body>
</html>
