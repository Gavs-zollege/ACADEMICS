<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 Flashcards — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #e4e4f0;
    --text-secondary: #9898b0;
    --surface-1: #1c1c2e;
    --surface-2: #282840;
    --border: #363650;
    --bg: #0d0d1a;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.35);
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-display: 'Playfair Display', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: #C0392B; margin-bottom: 6px;
  }
  .header h1 {
    font-family: var(--font-display); font-size: 32px; font-weight: 900;
    letter-spacing: -1px; margin-bottom: 6px; line-height: 1.1;
  }
  .header p { font-size: 13px; color: var(--text-secondary); }
  .flashcard {
    width: 100%; max-width: 500px; min-height: 250px; border-radius: 22px;
    cursor: pointer; padding: 34px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12); transition: all .35s cubic-bezier(.4,0,.2,1);
    user-select: none; position: relative; margin: 0 auto;
  }
  .flashcard .label {
    position: absolute; top: 16px; left: 20px; font-size: 11px;
    font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; opacity: .7;
  }
  .flashcard .hint {
    position: absolute; top: 16px; right: 20px; font-size: 11px; opacity: .5;
  }
  .flashcard h2 {
    margin: 0; font-family: var(--font-display); font-size: 26px;
    font-weight: 900; line-height: 1.2; letter-spacing: -.5px;
  }
  .flashcard .def-text {
    margin: 0; font-size: 15px; line-height: 1.65; color: var(--text-secondary);
  }
  .progress-bar {
    height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 6px; transition: width .3s;
  }
  .pill {
    padding: 8px 16px; border-radius: 24px; font-weight: 700;
    cursor: pointer; font-size: 13px; transition: all .2s; font-family: var(--font-body);
  }
  .pill-primary {
    border: none; color: #fff; padding: 13px 34px; font-size: 15px;
    border-radius: 30px; letter-spacing: .3px;
  }
  .pill-outline {
    background: transparent; border: 2px solid;
  }
  .chip {
    padding: 8px 14px; border-radius: 20px; border: 2px solid;
    font-weight: 600; cursor: pointer; font-size: 13px; transition: all .2s;
    font-family: var(--font-body); white-space: nowrap;
  }
  .flex-center { display: flex; align-items: center; justify-content: center; }
  .text-center { text-align: center; }
  .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
  .mt-20 { margin-top: 20px; } .mt-24 { margin-top: 24px; }
  .mb-6 { margin-bottom: 6px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; } .mb-24 { margin-bottom: 24px; }
  .gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-tag">Medical Assistant Program</div>
    <h1>Week 4 Flashcards</h1>
    <p id="header-subtitle"></p>
  </div>
  <div id="flash-mode"></div>
</div>

<script>
const CATEGORIES = [
  {
    name: "Phlebotomy Basics & Patient Preparation", emoji: "💉", color: "#C0392B",
    terms: [
      { term: "Phlebotomy", def: "The clinical procedure of withdrawing blood from a vein for laboratory testing, diagnosis, monitoring of conditions, or medication level assessment. Performed by trained medical assistants, phlebotomists, and other clinical personnel." },
      { term: "Venipuncture", def: "The process of puncturing a vein with a needle for the purpose of collecting blood. The most common method of blood collection in clinical settings." },
      { term: "Laboratory Directory (Lab Manual)", def: "A reference guide maintained by the laboratory that lists all orderable tests along with specimen requirements, patient preparation instructions, container type, handling instructions, and transport requirements." },
      { term: "Laboratory Requisition", def: "A written or electronic order accompanying a specimen to the laboratory. Contains the ordering provider's information, patient demographics, test codes, diagnosis codes, and any special collection requirements." },
      { term: "Fasting", def: "A pre-collection instruction requiring the patient to abstain from all food and drink (except water) for a specified period — typically 12 hours — before blood is drawn. Required for tests such as fasting glucose and lipid panels." },
      { term: "Patient Identifiers", def: "Specific pieces of information used to confirm a patient's identity before performing any procedure. The two required identifiers for blood draws are the patient's full name and date of birth." },
      { term: "Semi-Fowler's Position", def: "A partially reclined patient position with the head of the bed elevated approximately 30–45 degrees. Used during phlebotomy for patients with a history of fainting (vasovagal syncope) to reduce the risk of falling." },
      { term: "Vasovagal Syncope", def: "A sudden, temporary loss of consciousness caused by a drop in blood pressure and heart rate, often triggered by the sight of blood, pain, or anxiety. The most common adverse reaction to phlebotomy." },
    ],
  },
  {
    name: "Needle Systems & Equipment", emoji: "🔧", color: "#2471A3",
    terms: [
      { term: "Evacuated Tube System", def: "The most commonly used venipuncture method. Consists of a double-pointed needle, a plastic needle holder/adapter, and vacuum collection tubes. The pre-existing vacuum inside each tube draws blood directly in." },
      { term: "Butterfly Needle (Winged Infusion Set)", def: "A needle attached to flexible plastic wings and tubing that connects to the collection device. Used for patients with small, fragile, or difficult-to-access veins. Gauge range: 21–23; length: ½ to ¾ inch." },
      { term: "Needle and Syringe System", def: "A method using a standard needle attached to a syringe to draw blood manually. The amount of suction is controlled by pulling the plunger. Used when only a small volume is needed. Blood must be transferred to collection tubes immediately." },
      { term: "Gauge (Lumen)", def: "A measurement of needle diameter. The gauge number and the needle's internal diameter are inversely related — a higher gauge number means a smaller needle opening. For routine venipuncture, 20–22 gauge is standard." },
      { term: "Bevel", def: "The angled, sharpened tip at the end of a needle that creates a cutting point for smooth skin and vein penetration. The bevel should always face upward during needle insertion to facilitate blood flow." },
      { term: "Needle Holder/Adapter", def: "The plastic tube-shaped device that screws onto one end of the double-pointed venipuncture needle and holds the collection tube. Part of the evacuated tube system." },
      { term: "Tourniquet", def: "An elastic band applied 3–4 inches above the draw site to slow venous blood flow, making the vein more visible, palpable, and accessible. Must not remain in place for more than 1 minute to prevent hemoconcentration." },
      { term: "Sharps Container", def: "A puncture-resistant, leak-proof container used to safely dispose of needles, lancets, and other sharp instruments immediately after use. Must be placed on the dominant side before beginning the procedure." },
    ],
  },
  {
    name: "Blood Tubes, Additives & Order of Draw", emoji: "🧪", color: "#7D3C98",
    terms: [
      { term: "Order of Draw", def: "The required sequence in which blood collection tubes must be filled during a single venipuncture. Established to prevent additive carryover from one tube to the next." },
      { term: "Additive Carryover", def: "The transfer of a small amount of additive from one collection tube into the next during multi-tube draws. Prevented by following the correct order of draw." },
      { term: "Yellow Top Tube", def: "Contains sodium polyanethol sulfonate (SPS). Used for blood and body fluid cultures. Drawn first in the order of draw." },
      { term: "Light Blue Top Tube (Sodium Citrate)", def: "Contains sodium citrate, which removes calcium to prevent clotting. Used for coagulation testing (PT, PTT, INR). Requires 3–4 gentle inversions. Has a minimum fill line that must be met." },
      { term: "Red Top Tube", def: "Contains no additive. Blood is allowed to clot naturally. Used for serum-based tests including chemistry, blood bank, and immunology. Requires 5 inversions." },
      { term: "Red/Gray Marble Top (SST)", def: "Contains no anticoagulant but includes silica particles to accelerate clot formation and a gel barrier for serum separation during centrifugation. Used for serum chemistry and immunology testing. Requires 5 inversions." },
      { term: "Green Top Tube (Heparin)", def: "Contains heparin, which inhibits thrombin formation to prevent clotting. Used for plasma-based chemistry tests. Requires 8 inversions." },
      { term: "Green/Gray Marble Top (PST)", def: "Contains lithium heparin and a gel separator for plasma separation. Used for plasma chemistry studies. Requires 8 inversions." },
      { term: "Lavender Top Tube (EDTA)", def: "Contains ethylenediaminetetraacetic acid (EDTA), which removes calcium to prevent clotting. Used for hematology testing, including complete blood counts (CBC). Requires 8 inversions." },
      { term: "Gray Top Tube", def: "Contains potassium oxalate and sodium fluoride. Fluoride inhibits glycolysis, preserving glucose levels in the specimen. Used primarily for glucose and blood alcohol testing. Requires 8–10 inversions." },
      { term: "Inversion", def: "The act of gently turning a blood collection tube completely upside down and returning it upright to mix blood with the additive. Never shake or forcefully invert — this causes hemolysis." },
      { term: "Fill Level / Fill Ratio", def: "The required amount of blood in a collection tube for the test to be valid. The light blue tube is the most critical — it has a marked minimum fill line for the correct blood-to-anticoagulant ratio." },
    ],
  },
  {
    name: "Blood Components & Specimen Types", emoji: "🩸", color: "#C2185B",
    terms: [
      { term: "Plasma", def: "The liquid portion of the blood obtained from a centrifuged specimen collected in a tube containing an anticoagulant. Plasma retains clotting factors because the blood was prevented from clotting." },
      { term: "Serum", def: "The liquid portion of the blood obtained after a blood specimen has been allowed to clot and then centrifuged. Serum does not contain clotting factors. Used for many chemistry and immunology tests." },
      { term: "Whole Blood", def: "Unprocessed blood collected in a tube containing an anticoagulant, which prevents clotting. Used for hematology testing such as complete blood counts." },
      { term: "Clotted Blood", def: "Blood that has been collected in a tube without an anticoagulant and allowed to naturally form a clot before processing. Used when serum is required for testing." },
      { term: "Buffy Coat", def: "The thin layer of white blood cells and platelets that forms between the plasma/serum layer and the red blood cell layer after centrifugation." },
      { term: "Hemolysis", def: "The breakdown of red blood cells, releasing hemoglobin into the surrounding plasma. Causes a red or pink discoloration. Results in invalid test results. Caused by forceful inversion, shaking, or excessive suction." },
      { term: "Hemoconcentration", def: "An increase in the concentration of large molecules in the blood caused by leaving the tourniquet on for longer than 1 minute. Alters values for several lab tests and is a preanalytical error." },
      { term: "Anticoagulant", def: "A substance added to a collection tube that prevents blood from clotting. Examples include EDTA, heparin, sodium citrate, and sodium fluoride. Different anticoagulants are used depending on the type of testing." },
    ],
  },
  {
    name: "Vein Selection & Venipuncture Technique", emoji: "🫴", color: "#148F77",
    terms: [
      { term: "Antecubital Space", def: "The inner bend of the elbow — the most common and preferred site for venipuncture. Contains the median cubital, cephalic, and basilic veins." },
      { term: "Median Cubital Vein", def: "The vein located in the center of the antecubital space. The preferred vein for blood draws because it is typically large, well-anchored, and less likely to roll." },
      { term: "Cephalic Vein", def: "A vein located on the thumb side of the antecubital space. A common alternative when the median cubital is unavailable. Has a higher tendency to roll." },
      { term: "Basilic Vein", def: "A vein located on the pinky side of the antecubital space. Less preferred due to proximity to the brachial artery and median nerve. Has the highest tendency to roll." },
      { term: "Palpation", def: "The technique of pressing the skin up and down with the fingertip to locate and assess a vein. A healthy, accessible vein has a bouncy or springy feel." },
      { term: "Anchoring the Vein", def: "The technique of pulling the skin taut approximately 2–3 inches below the intended puncture site to stabilize the vein during needle insertion, preventing it from rolling." },
      { term: "Angle of Insertion", def: "The angle at which the needle enters the skin. For arm draws: 15–30 degrees. For hand or wrist draws: 10–15 degrees because the veins are thinner and closer to the surface." },
      { term: "Rolling Vein", def: "A vein that shifts or moves sideways when pressure is applied rather than accepting the needle. More common with the basilic vein and hand/wrist veins. Prevented by anchoring the skin firmly." },
      { term: "Deep Vein Thrombosis (DVT)", def: "A blood clot that forms in a deep vein, usually in the leg. Phlebotomy from foot veins carries a risk of DVT and should only be performed under direct provider supervision." },
    ],
  },
  {
    name: "Capillary Puncture", emoji: "🤏", color: "#D68910",
    terms: [
      { term: "Capillary Puncture", def: "A method of blood collection that involves puncturing a capillary bed to obtain a small blood sample. Preferred for infants, young children, or when only a small volume is needed. Also called a fingerstick or heel stick." },
      { term: "Lancet", def: "A small, spring-loaded, retractable device used to puncture the skin during capillary blood collection. Always automatically retracts after use for safety. Disposed of immediately in a sharps container." },
      { term: "Fingerstick", def: "A capillary puncture performed on the fingertip. The preferred site is the middle or ring finger of the nondominant hand, slightly off-center, avoiding the nail bed." },
      { term: "Heel Stick", def: "A capillary puncture performed on the outer edge of the underside of the heel of an infant. The only acceptable capillary puncture site for infants — finger punctures carry unacceptably high risk of bone injury." },
      { term: "Capillary Order of Draw", def: "The recommended sequence for collecting capillary blood specimens: (1) blood gas tubes, (2) EDTA tubes, (3) other additive tubes, (4) serum tubes. Different from venipuncture order of draw." },
      { term: "First Drop Rule", def: "The practice of wiping away the first drop of blood from a capillary puncture site before collecting the specimen. The first drop contains tissue fluid that can dilute or contaminate the sample. Exception: prothrombin time (PT) testing." },
      { term: "Micropipette", def: "A small, calibrated capillary tube used to collect a precise, very small volume of blood from a capillary puncture site. Used for certain point-of-care tests requiring a specific measured volume." },
    ],
  },
  {
    name: "Specimen Processing & Storage", emoji: "🔬", color: "#1A5276",
    terms: [
      { term: "Centrifuge", def: "A laboratory instrument that spins specimens at high speed to separate blood components by density. Heavier components settle to the bottom; lighter components rise to the top. Must always be balanced before use." },
      { term: "Centrifugation", def: "The process of spinning a blood specimen in a centrifuge to separate its components. Serum tubes must clot at room temperature for 30–45 minutes before centrifugation. Specimens should not sit for more than 1 hour before being centrifuged." },
      { term: "Aliquot", def: "A portion of a specimen divided from the original sample into secondary tubes for testing on different instruments or departments. Always performed using a disposable pipette — never by pouring." },
      { term: "Pipette (Single-Use)", def: "A disposable tube used to transfer small, precise volumes of liquid between containers. Required for aliquoting specimens. Prevents splashing, cross-contamination, and aerosol generation." },
      { term: "Serum Separator Tube (SST)", def: "A tube containing silica particles and a gel barrier. After centrifugation, the gel forms a physical barrier between the clotted red cells and the serum, making serum collection easier and more accurate." },
      { term: "Light-Sensitive Specimen", def: "A blood specimen that must be protected from light during and after processing because light exposure degrades the analyte. Handled by keeping lights low, wrapping tubes in foil, or using amber transport tubes." },
      { term: "Calibration", def: "The process of standardizing a laboratory instrument by comparing its measurements to a known reference value. Equipment overdue for calibration must be taken out of service until recalibrated." },
      { term: "Specimen Integrity", def: "The condition of a specimen that accurately reflects the patient's physiological state at the time of collection. Maintained through proper labeling, correct tube selection, timely processing, and appropriate storage." },
    ],
  },
  {
    name: "Specimen Handling, Transport & Errors", emoji: "📦", color: "#2C3E50",
    terms: [
      { term: "Biohazard Bag (Specimen Transport Bag)", def: "A leakproof, zip-close plastic bag used to transport laboratory specimens. Contains two pockets — one for the labeled specimen tube and one for the matching requisition. One bag per patient is required." },
      { term: "Chain of Custody", def: "A legal documentation process that tracks every person who handles a specimen from collection through final reporting. Required for drug and alcohol testing. Every handler must sign." },
      { term: "Preanalytical Error", def: "An error that occurs before or during specimen collection. The most common category of lab error. Examples include mislabeling, patient misidentification, wrong container, and incorrect collection technique." },
      { term: "Postanalytical Error", def: "An error that occurs after the specimen has been tested. Examples include failure to report results, incorrect data entry, excessive turnaround time, and misinterpretation of results." },
      { term: "Mislabeling", def: "The most common single source of laboratory error. Occurs when a specimen tube is labeled with incorrect or missing information. All tubes must be labeled immediately after the draw, before leaving the draw area." },
      { term: "Critical Value (Critical Lab Result)", def: "A laboratory result that falls so far outside the normal range that it indicates a potentially life-threatening condition. Must be reported to the ordering provider by phone immediately. The MA must read the value back to confirm accuracy." },
      { term: "Timed Specimen", def: "A specimen collected at a specific time ordered by the provider. Used for therapeutic drug monitoring and timed metabolic tests such as the glucose tolerance test (GTT)." },
      { term: "Blood Culture", def: "A specimen collected to detect bacteria or fungi in the bloodstream. Requires special skin antiseptic preparation using a two-step process to minimize contamination." },
      { term: "Therapeutic Drug Monitoring", def: "The measurement of medication levels in the blood at timed intervals to ensure the patient is receiving an effective and safe dose. Timing of collection is critical." },
      { term: "Oral Glucose Tolerance Test (GTT)", def: "A timed test that measures how the body processes glucose by collecting blood at set intervals after the patient consumes a standardized glucose drink. Used to evaluate for gestational diabetes." },
    ],
  },
  {
    name: "Anatomical & Clinical Terms", emoji: "🫀", color: "#922B21",
    terms: [
      { term: "Plasma Separator Tube (PST)", def: "A collection tube containing lithium heparin and a gel barrier that separates plasma from blood cells during centrifugation." },
      { term: "Hemostasis", def: "The process by which the body stops bleeding after a blood vessel is injured. In phlebotomy, hemostasis is achieved by applying direct pressure with gauze after needle removal." },
      { term: "Thrombosis", def: "The formation of a blood clot inside a blood vessel that partially or completely obstructs blood flow. Phlebotomy from foot veins carries a risk of deep vein thrombosis (DVT)." },
      { term: "Arteriole", def: "A small artery that branches into capillaries. Capillary blood collected during a fingerstick is a mixture of blood from arterioles, venules, and capillaries." },
      { term: "Fistula (AV Fistula)", def: "A surgically created connection between an artery and a vein used for dialysis access. The arm containing an AV fistula must never be used for venipuncture." },
      { term: "Mastectomy Site Restriction", def: "Blood draws should not be performed on the same side as a mastectomy due to impaired lymphatic drainage, which can increase infection risk and affect test results." },
      { term: "Interstitial Fluid", def: "Fluid found between the cells in body tissues. Present in the first drop of blood from a capillary puncture and must be wiped away before specimen collection because it dilutes the sample." },
      { term: "Glycolysis", def: "The metabolic process by which glucose is broken down in red blood cells. If a glucose specimen is not collected in a gray top tube (sodium fluoride), glycolysis continues and produces a falsely low result." },
    ],
  },
];

const ALL_TERMS = CATEGORIES.flatMap((cat, ci) =>
  cat.terms.map(t => ({ ...t, category: cat.name, emoji: cat.emoji, color: cat.color, catIndex: ci }))
);

let flashDeck = [];
let flashIdx = 0;
let flashFlipped = false;
let flashKnown = 0;
let flashLearning = 0;
let flashDone = false;
let flashSelectedCats = new Set(CATEGORIES.map((_, i) => i));
let flashStarted = false;

document.getElementById('header-subtitle').textContent =
  `Phlebotomy: Techniques and Best Practices · ${ALL_TERMS.length} terms across ${CATEGORIES.length} topics`;

renderFlash();

function startFlashDeck() {
  const terms = CATEGORIES.flatMap((cat, ci) =>
    flashSelectedCats.has(ci) ? cat.terms.map(t => ({ ...t, color: cat.color, emoji: cat.emoji, category: cat.name })) : []
  );
  flashDeck = shuffle([...terms]);
  flashIdx = 0; flashFlipped = false; flashKnown = 0; flashLearning = 0; flashDone = false; flashStarted = true;
  renderFlash();
}

function flashToggleCat(i) {
  if (flashSelectedCats.has(i)) {
    if (flashSelectedCats.size > 1) flashSelectedCats.delete(i);
  } else { flashSelectedCats.add(i); }
  renderFlash();
}

function flashMark(isKnown) {
  if (isKnown) flashKnown++; else flashLearning++;
  if (flashIdx + 1 >= flashDeck.length) { flashDone = true; renderFlash(); return; }
  flashIdx++; flashFlipped = false; renderFlash();
}

function renderFlash() {
  const el = document.getElementById('flash-mode');

  if (!flashStarted || flashDeck.length === 0) {
    let html = `<div class="text-center" style="padding:40px 0">
      <p style="font-size:18px;margin-bottom:20px;color:var(--text)">Select categories and start studying!</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px">`;
    CATEGORIES.forEach((c, i) => {
      const sel = flashSelectedCats.has(i);
      html += `<button class="chip" onclick="flashToggleCat(${i})"
        style="border-color:${c.color};background:${sel ? c.color : 'transparent'};color:${sel ? '#fff' : c.color}">
        ${c.emoji} ${escHtml(c.name)}</button>`;
    });
    html += `</div>
      <button class="pill-primary" style="background:#E74C3C" onclick="startFlashDeck()">Shuffle & Start →</button>
    </div>`;
    el.innerHTML = html; return;
  }

  if (flashDone) {
    const total = flashKnown + flashLearning;
    const pct = Math.round((flashKnown / total) * 100);
    const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📖';
    el.innerHTML = `
      <div class="text-center" style="padding:40px 0">
        <div style="font-size:48px;margin-bottom:12px">${emoji}</div>
        <h3 style="margin:0 0 8px">Round Complete!</h3>
        <p style="color:var(--text-secondary);font-size:15px;margin:0 0 24px">
          ${flashKnown} knew it · ${flashLearning} still learning · ${pct}% mastery
        </p>
        <div style="width:100%;max-width:300px;height:10px;border-radius:10px;background:var(--surface-2);margin:0 auto 24px;overflow:hidden">
          <div style="width:${pct}%;height:100%;border-radius:10px;background:linear-gradient(90deg,#27AE60,#2ECC71);transition:width .6s"></div>
        </div>
        <button class="pill-primary" style="background:#3498DB" onclick="flashDeck=[];flashStarted=false;flashDone=false;renderFlash()">New Round</button>
      </div>`;
    return;
  }

  const card = flashDeck[flashIdx];
  const pctProgress = ((flashIdx / flashDeck.length) * 100);
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;padding:12px 0">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;width:100%">
        <span style="font-size:13px;color:var(--text-secondary);font-weight:600">${flashIdx + 1}/${flashDeck.length}</span>
        <div class="progress-bar" style="flex:1"><div class="fill" style="width:${pctProgress}%;background:${card.color}"></div></div>
        <span style="font-size:12px;color:var(--text-secondary)">✓${flashKnown} ✗${flashLearning}</span>
      </div>
      <div class="flashcard" onclick="flashFlipped=!flashFlipped;renderFlash();"
           style="background:${flashFlipped ? 'var(--surface-1)' : card.color};color:${flashFlipped ? 'var(--text)' : '#fff'}">
        <span class="label">${flashFlipped ? 'Definition' : card.emoji + ' ' + escHtml(card.category)}</span>
        <span class="hint">${flashFlipped ? '' : 'tap to flip'}</span>
        ${!flashFlipped
          ? `<h2>${escHtml(card.term)}</h2>`
          : `<p class="def-text">${escHtml(card.def)}</p>`
        }
      </div>
      ${flashFlipped ? `
        <div style="display:flex;gap:12px;margin-top:20px">
          <button class="pill pill-outline" style="border-color:#E74C3C;color:#E74C3C;padding:12px 28px;font-size:14px" onclick="flashMark(false)">Still Learning</button>
          <button class="pill-primary" style="background:#27AE60;padding:12px 28px;font-size:14px" onclick="flashMark(true)">Got It! ✓</button>
        </div>` : ''}
    </div>`;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function escHtml(str) {
  const d = document.createElement('div');
