<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 4 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 4 Glossary</h1>
  <p class="sub">Phlebotomy: Techniques and Best Practices</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Basics & Prep",color:"#E05555",terms:[
    {term:"Phlebotomy",def:"The clinical procedure of withdrawing blood from a vein for laboratory testing, diagnosis, or monitoring."},
    {term:"Venipuncture",def:"The process of puncturing a vein with a needle to collect blood. The most common collection method."},
    {term:"Laboratory Directory",def:"A reference guide listing all orderable tests with specimen requirements, patient prep, container type, and handling instructions."},
    {term:"Laboratory Requisition",def:"A written or electronic order with provider info, patient demographics, test codes, and collection requirements."},
    {term:"Fasting",def:"Abstaining from food and drink (except water) for typically 12 hours before a draw. Required for glucose and lipid panels."},
    {term:"Patient Identifiers",def:"Full name and date of birth — the two required identifiers before performing any blood draw."},
    {term:"Semi-Fowler's Position",def:"Head of bed elevated 30–45°. Used for patients with fainting history to reduce fall risk."},
    {term:"Vasovagal Syncope",def:"Sudden loss of consciousness from BP/HR drop, triggered by blood, pain, or anxiety. Most common phlebotomy reaction."},
  ]},
  {name:"Equipment",color:"#6B7B8D",terms:[
    {term:"Evacuated Tube System",def:"Most common method — double-pointed needle, holder, and vacuum tubes. Tube vacuum draws blood automatically."},
    {term:"Butterfly Needle",def:"Winged infusion set for small, fragile, or difficult veins. 21–23 gauge, ½–¾ inch. Less traumatic."},
    {term:"Needle and Syringe System",def:"Manual method using a syringe. Suction controlled by pulling the plunger. Blood transferred to tubes after collection."},
    {term:"Gauge (Lumen)",def:"Needle diameter measurement. Higher gauge = smaller needle. 20–22 gauge standard for routine venipuncture."},
    {term:"Bevel",def:"The angled needle tip that creates a cutting point. Must face upward during insertion for smooth blood flow."},
    {term:"Needle Holder/Adapter",def:"Plastic device that screws onto the needle and holds the collection tube. Part of the evacuated system."},
    {term:"Tourniquet",def:"Elastic band applied 3–4 inches above draw site. Must not stay on more than 1 minute to prevent hemoconcentration."},
    {term:"Sharps Container",def:"Puncture-resistant container for immediate disposal of needles and lancets. Placed on dominant side before procedure."},
  ]},
  {name:"Tubes & Order of Draw",color:"#8B6AAE",terms:[
    {term:"Order of Draw",def:"Required sequence for filling tubes during a single venipuncture. Prevents additive carryover between tubes."},
    {term:"Additive Carryover",def:"Transfer of additive from one tube to the next. Even trace amounts can compromise a specimen."},
    {term:"Yellow Top Tube",def:"Contains SPS. Used for blood cultures. Drawn first in the order of draw."},
    {term:"Light Blue Top Tube",def:"Contains sodium citrate. Used for coagulation testing (PT, PTT, INR). Must meet minimum fill line."},
    {term:"Red Top Tube",def:"No additive. Blood clots naturally. Used for serum chemistry, blood bank, immunology. 5 inversions."},
    {term:"Red/Gray Marble Top (SST)",def:"Silica particles + gel barrier. Used for serum chemistry and immunology. 5 inversions."},
    {term:"Green Top Tube",def:"Contains heparin. Used for plasma chemistry. 8 inversions."},
    {term:"Green/Gray Marble Top (PST)",def:"Lithium heparin + gel separator. Used for plasma chemistry. 8 inversions."},
    {term:"Lavender Top Tube (EDTA)",def:"Contains EDTA. Used for hematology/CBC. 8 inversions."},
    {term:"Gray Top Tube",def:"Contains potassium oxalate and sodium fluoride. Used for glucose and blood alcohol. 8–10 inversions."},
    {term:"Inversion",def:"Gently turning a tube upside down and back to mix blood with additive. Never shake — causes hemolysis."},
    {term:"Fill Level / Fill Ratio",def:"Required blood amount for valid results. Light blue tube is most critical — must reach the fill line."},
  ]},
  {name:"Blood Components",color:"#E74C6F",terms:[
    {term:"Plasma",def:"Liquid portion from anticoagulated, centrifuged blood. Retains clotting factors. Top layer after spinning."},
    {term:"Serum",def:"Liquid portion after blood clots and is centrifuged. No clotting factors. Used for chemistry and immunology."},
    {term:"Whole Blood",def:"Unprocessed blood in an anticoagulant tube. Used for hematology testing like CBC."},
    {term:"Clotted Blood",def:"Blood collected without anticoagulant, allowed to clot naturally. Used when serum is needed."},
    {term:"Buffy Coat",def:"Thin layer of WBCs and platelets between plasma/serum and red cells after centrifugation."},
    {term:"Hemolysis",def:"RBC breakdown releasing hemoglobin into plasma. Caused by forceful mixing, shaking, or excessive suction."},
    {term:"Hemoconcentration",def:"Increased concentration of large molecules from tourniquet left on >1 minute. A preanalytical error."},
    {term:"Anticoagulant",def:"Substance in a tube preventing clotting — EDTA, heparin, sodium citrate, sodium fluoride."},
  ]},
  {name:"Vein Selection",color:"#4A90B8",terms:[
    {term:"Antecubital Space",def:"Inner bend of the elbow — the preferred venipuncture site with median cubital, cephalic, and basilic veins."},
    {term:"Median Cubital Vein",def:"Center of the antecubital space. Preferred — large, well-anchored, less likely to roll."},
    {term:"Cephalic Vein",def:"Thumb side of the antecubital space. Alternative when median cubital is unavailable. May roll."},
    {term:"Basilic Vein",def:"Pinky side. Less preferred — near brachial artery and median nerve. Highest rolling tendency."},
    {term:"Palpation",def:"Pressing with fingertip to locate veins. A healthy vein has a bouncy, springy feel."},
    {term:"Anchoring the Vein",def:"Pulling skin taut 2–3 inches below the site to stabilize the vein and prevent rolling."},
    {term:"Angle of Insertion",def:"15–30° for arm draws; 10–15° for hand/wrist where veins are thinner and more superficial."},
    {term:"Rolling Vein",def:"A vein that shifts sideways under pressure. Prevented by firm anchoring before insertion."},
    {term:"Deep Vein Thrombosis",def:"A blood clot in a deep vein. Foot draws carry DVT risk — only with provider supervision."},
  ]},
  {name:"Capillary Puncture",color:"#1A8A7D",terms:[
    {term:"Capillary Puncture",def:"Puncturing a capillary bed for a small blood sample. Fingerstick for adults, heel stick for infants."},
    {term:"Lancet",def:"A spring-loaded, retractable device for skin puncture. Auto-retracts for safety. Disposed in sharps container."},
    {term:"Fingerstick",def:"Capillary puncture on the fingertip — middle or ring finger, nondominant hand, slightly off-center."},
    {term:"Heel Stick",def:"Capillary puncture on the outer heel of an infant. The only acceptable capillary site for infants."},
    {term:"Capillary Order of Draw",def:"(1) Blood gas tubes, (2) EDTA, (3) other additive tubes, (4) serum tubes. Different from venipuncture."},
    {term:"First Drop Rule",def:"Wipe away the first drop — it contains tissue fluid that dilutes the sample. Exception: PT testing."},
    {term:"Micropipette",def:"A small calibrated tube for collecting a precise volume from a capillary puncture for POC tests."},
  ]},
  {name:"Processing & Storage",color:"#E2B94C",terms:[
    {term:"Centrifuge",def:"Spins specimens at high speed to separate components by density. Must always be balanced before use."},
    {term:"Centrifugation",def:"Spinning blood to separate components. Serum tubes clot 30–45 min first. Don't wait more than 1 hour."},
    {term:"Aliquot",def:"A portion of specimen divided into secondary tubes for different departments. Use disposable pipette, never pour."},
    {term:"Pipette (Single-Use)",def:"Disposable tube for transferring precise liquid volumes. Prevents contamination and aerosols."},
    {term:"Serum Separator Tube (SST)",def:"Contains silica particles and gel barrier. After spinning, gel separates clotted cells from serum."},
    {term:"Light-Sensitive Specimen",def:"Must be protected from light — wrap in foil or use amber tubes to prevent analyte degradation."},
    {term:"Calibration",def:"Standardizing lab instruments against a known reference. Overdue equipment must be taken out of service."},
    {term:"Specimen Integrity",def:"Condition reflecting the patient's physiology at collection. Maintained by proper labeling, tubes, processing, storage."},
  ]},
  {name:"Handling & Errors",color:"#4CAF90",terms:[
    {term:"Biohazard Bag",def:"Leakproof zip-close bag with two pockets — one for specimen, one for requisition. One bag per patient."},
    {term:"Chain of Custody",def:"Legal documentation tracking every handler from collection to final reporting. Required for drug/alcohol testing."},
    {term:"Preanalytical Error",def:"Error before or during collection — mislabeling, wrong container, wrong technique, insufficient volume. Most common."},
    {term:"Postanalytical Error",def:"Error after testing — failure to report, incorrect data entry, excessive turnaround time."},
    {term:"Mislabeling",def:"The most common single lab error. Tubes must be labeled immediately after the draw, before leaving."},
    {term:"Critical Value",def:"A result indicating a life-threatening condition. Must be reported immediately by phone. Read back to confirm."},
    {term:"Timed Specimen",def:"Collected at a specific provider-ordered time for drug monitoring or timed metabolic tests like GTT."},
    {term:"Blood Culture",def:"Detects bloodstream bacteria/fungi. Requires special antiseptic prep and specific bottle sequence."},
    {term:"Therapeutic Drug Monitoring",def:"Measuring medication blood levels at timed intervals to ensure effective and safe dosing."},
    {term:"Oral Glucose Tolerance Test",def:"Timed test measuring glucose processing — blood drawn at intervals after a standardized glucose drink."},
  ]},
  {name:"Anatomical Terms",color:"#C4A84D",terms:[
    {term:"Plasma Separator Tube (PST)",def:"Contains lithium heparin and gel barrier. Separates plasma from cells during centrifugation."},
    {term:"Hemostasis",def:"The body's process of stopping bleeding. Achieved at the puncture site by applying direct pressure with gauze."},
    {term:"Thrombosis",def:"Blood clot inside a vessel obstructing flow. Foot draws carry thrombosis risk."},
    {term:"Arteriole",def:"A small artery branching into capillaries. Capillary blood is a mixture from arterioles, venules, and capillaries."},
    {term:"Fistula (AV Fistula)",def:"Surgically created artery-vein connection for dialysis. Never draw from an arm with a fistula."},
    {term:"Mastectomy Site Restriction",def:"No draws on the mastectomy side due to impaired lymphatic drainage. Bilateral = leg draw per provider."},
    {term:"Interstitial Fluid",def:"Fluid between tissue cells. Present in the first capillary drop — must be wiped away to avoid dilution."},
    {term:"Glycolysis",def:"Glucose breakdown in RBCs. Without sodium fluoride (gray top), glucose levels decrease over time — falsely low."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
