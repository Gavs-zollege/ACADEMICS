<!DOCTYPE html>
<html lang="en">
<head>

<title>Medical Assistant — Phlebotomy Techniques & Best Practices</title>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ff:"Libre Baskerville","Georgia",serif;--fs:"Source Sans 3","Segoe UI",sans-serif;--slideBg:#FFF;--slideAlt:#F6F8FB;--dark:#0D2137;--darkSub:#1B3A57;--accent:#0F7B6C;--accentLight:#E6F5F2;--warm:#D94F4F;--warmLight:#FDF0F0;--amber:#D4880F;--amberLight:#FFF7E6;--blue:#2B6CB0;--blueLight:#EBF2FA;--purple:#6B46A8;--text:#1A202C;--textMid:#4A5568;--textLight:#8896A6;--border:#E2E8F0;--headerBg:#0D2137}
body{background:#E8ECF0;font-family:var(--fs);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px 24px}button{cursor:pointer;font-family:var(--fs)}
.sw{width:100%;max-width:960px}.sf{width:100%;aspect-ratio:16/9;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.18);overflow:hidden;position:relative;display:flex;flex-direction:column;animation:sF .35s ease-out}.sf.dk{background:var(--headerBg)}.sf:not(.dk){background:var(--slideBg)}
.sh{background:var(--headerBg);padding:10px 28px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0}.sh .n{font-size:9px;font-weight:700;color:var(--accent);background:rgba(15,123,108,.15);border-radius:3px;padding:2px 7px;letter-spacing:1px}.sh .t{font-family:var(--ff);font-size:13px;font-weight:700;color:#fff}
.sb{flex:1;padding:12px 28px 8px;overflow:hidden}.ft{display:flex;justify-content:space-between;align-items:center;padding:0 28px 6px;flex-shrink:0}.ft .l{font-size:8px;color:var(--textLight);letter-spacing:1px;text-transform:uppercase}.ft .r{font-size:9px;font-weight:600;color:var(--textLight)}
.ctrls{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:960px;margin-top:14px}.cb{font-size:12px;font-weight:600;color:#4A5568;background:rgba(0,0,0,.05);border:none;border-radius:8px;padding:8px 18px;transition:all .2s}.cb:hover:not(:disabled){filter:brightness(1.08)}.cb:disabled{opacity:.3;cursor:default}.cb.act{background:var(--dark);color:#fff}
.dots{display:flex;gap:3px;align-items:center}.dot{height:5px;border-radius:3px;cursor:pointer;transition:all .3s}.dot.c{width:16px;background:var(--accent)}.dot.v{width:5px;background:var(--darkSub)}.dot.f{width:5px;background:rgba(0,0,0,.12)}
.to{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center}.tp{background:#fff;border-radius:12px;padding:24px 20px;max-height:70vh;overflow-y:auto;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.tt{font-family:var(--ff);font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px}.ti{font-size:12px;padding:6px 10px;border-radius:5px;cursor:pointer;margin-bottom:1px;transition:all .15s}.ti:hover{background:var(--slideAlt)}.ti.a{color:var(--accent);background:var(--accentLight);font-weight:700}.ti .x{color:var(--textLight);margin-right:8px;font-weight:600;font-size:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fr{display:flex;gap:16px}.cd{background:var(--slideAlt);border-radius:6px;padding:10px 12px}
table{width:100%;border-collapse:collapse;font-size:10px}th{padding:5px 8px;text-align:left;font-weight:700;font-size:8px;letter-spacing:.5px;text-transform:uppercase}td{padding:5px 8px;font-size:10px;color:var(--text)}.thd th{background:var(--headerBg);color:#fff}tr.al{background:var(--slideAlt)}
.tb{display:flex;gap:0;margin-bottom:10px;border-bottom:2px solid var(--border)}.tbtn{font-size:10px;font-weight:500;color:var(--textMid);background:none;border:none;border-bottom:3px solid transparent;padding:5px 10px;margin-bottom:-2px;transition:all .2s}.tbtn.a{font-weight:700;color:var(--accent)}
.co{border-radius:6px;padding:8px 12px;border-left:3px solid}.co-a{background:var(--accentLight);border-color:var(--accent)}.co-w{background:var(--warmLight);border-color:var(--warm)}.co-am{background:var(--amberLight);border-color:var(--amber)}
.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}
@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}
.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}
.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}
.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}
.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}.sb-s.a{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 768px) {
  body { padding: 10px 8px; min-height: auto; }
  .sw { max-width: 100%; }
  .sf { aspect-ratio: auto !important; min-height: auto; }
  .sh { padding: 8px 14px 6px; }
  .sh .t { font-size: 11px; }
  .sb { padding: 10px 14px 8px; overflow: visible !important; }
  .ft { padding: 0 14px 6px; }
  .ctrls { margin-top: 10px; gap: 6px; }
  .cb { font-size: 11px; padding: 7px 12px; }
  .dots { gap: 2px; }
  .g2 { grid-template-columns: 1fr !important; }
  .g3 { grid-template-columns: 1fr !important; }
  .g4 { grid-template-columns: 1fr 1fr !important; }
  .fr { flex-direction: column !important; gap: 10px !important; }
  table { font-size: 9px; display: block; overflow-x: auto; }
  th, td { padding: 4px 6px; white-space: nowrap; }
  .tp { width: 90vw; max-width: 340px; }
  .to { padding: 16px; }
  .or { gap: 8px; }
  .qo { font-size: 10px; padding: 8px 10px; }
  .co { padding: 6px 10px; }
  .tb { flex-wrap: wrap; }
  .tbtn { font-size: 9px; padding: 4px 8px; }
  .cd { padding: 8px 10px; }
  .tag { font-size: 9px; padding: 3px 8px; }
  .sb-s { font-size: 9px; min-width: 100px; padding: 4px 8px; }
  .tw { padding: 5px 8px; }
  .tw .lb { font-size: 9px; }
}
@media (max-width: 480px) {
  .g4 { grid-template-columns: 1fr !important; }
  .ctrls { flex-wrap: wrap; justify-content: center; gap: 8px; }
}

</style>
</head>

<div class="ctrls"><button class="cb" id="pB" onclick="go(cur-1)">← Previous</button><div style="display:flex;align-items:center;gap:14px"><button class="cb" id="tB" onclick="toggleTOC()">☰ Slides</button><div class="dots" id="dots"></div></div><button class="cb" id="nB" onclick="go(cur+1)">Next →</button></div>

<script>
const S=[
{id:0,type:"title",title:"Phlebotomy: Techniques &\nBest Practices",subtitle:"MEDICAL ASSISTANT PROGRAM",week:"Week Four",tags:["Venipuncture","Capillary Puncture","Order of Draw","Specimen Handling"]},
{id:1,type:"objectives",title:"Learning Objectives",objectives:["Verify order details, identify the patient, and confirm testing preparation","Select the correct supplies for the tests ordered","Name tube top colors, additives, lab uses, fill ratios, and the correct order of draw","Explain inversion requirements and why tubes are positioned upright after collection","Perform venipuncture using evacuated, syringe, and butterfly methods","Perform capillary puncture and follow capillary order of draw","Complete post-procedure care: bandaging and patient discharge instructions","Match and label every specimen to the correct patient and requisition","Handle, process, and store blood samples for diagnostic accuracy","Recognize preanalytical factors and how to address them","Collect special specimens: timed samples, blood cultures, and chain-of-custody draws","Prepare specimens for transport to a reference laboratory"]},
{id:2,type:"patient_prep",title:"Patient Preparation & Identification",before:[{icon:"📋",title:"Obtain the provider's order",desc:"Never draw blood without a written or electronic order."},{icon:"🪪",title:"Identify patient — two identifiers",desc:"Full name and DOB at every encounter. Never skip."},{icon:"✅",title:"Confirm test preparation",desc:"Ask if patient followed instructions (fasting, medication holds)."},{icon:"📖",title:"Review the lab directory",desc:"Check specimen type, container, prep, and handling."},{icon:"👋",title:"Introduce yourself & explain",desc:"A warm, confident approach reduces anxiety."}],special:[{label:"Fasting",desc:"Most require no food/drink except water for 12 hours."},{label:"Positioning",desc:"Arm extended, elbow straight. Use phlebotomy chair."},{label:"History of reactions",desc:"Ask about bruising, difficult draws, or fainting."},{label:"Syncope risk",desc:"Semi-Fowler's or supine if history of fainting."},{label:"Pediatric",desc:"Support person may hold arm. Age-appropriate communication."}]},
{id:3,type:"supplies",title:"Phlebotomy Supplies & Needle Systems",supplies:["Alcohol wipes","Gauze pads","Adhesive bandages","Biohazard sharps container","PPE — gloves always","Tourniquet","Collection tubes (in draw order)","Selected needle system"],systems:[{name:"Evacuated Tube System",color:"#4A90D9",items:["Most common — ideal for most patients","Double-pointed needle + holder + vacuum tubes","Gauge: 20–22; length: ¾ to 1½ inches","Allows multiple tubes with single puncture"]},{name:"Butterfly (Winged Infusion)",color:"#3DAE8E",items:["Best for small, fragile, or difficult veins","Wings + short needle + flexible tubing","Gauge: 21–23; length: ½ to ¾ inch","Often used for hand veins and pediatric"]},{name:"Needle and Syringe",color:"#E8853D",items:["Used when draw volume is limited","Suction controlled by plunger","Transfer to tubes immediately after","16-gauge injection needle typically used"]}]},
{id:4,type:"order_draw",title:"Order of Draw — Tube Colors, Additives & Lab Use",tubes:[{num:1,color:"Yellow",additive:"Sodium polyanethol sulfonate",use:"Blood / body fluid cultures",inv:"—",hex:"#E8C840"},{num:2,color:"Light Blue",additive:"Sodium citrate",use:"Coagulation testing",inv:"3–4",hex:"#6CB4EE"},{num:3,color:"Red",additive:"None (no additive)",use:"Serum: chemistry, blood bank, immunology",inv:"5",hex:"#D94F4F"},{num:4,color:"Red/Gray (SST)",additive:"Silica particles",use:"Serum: chemistry, immunology",inv:"5",hex:"#D97070"},{num:5,color:"Green",additive:"Heparin",use:"Chemistry testing",inv:"8",hex:"#3DAE8E"},{num:6,color:"Green/Gray",additive:"Lithium heparin + gel",use:"Plasma chemistry studies",inv:"8",hex:"#5CAA7E"},{num:7,color:"Lavender",additive:"EDTA",use:"Hematology testing",inv:"8",hex:"#9B8EC8"},{num:8,color:"Gray",additive:"Potassium oxalate + sodium fluoride",use:"Glucose and alcohol levels",inv:"8–10",hex:"#8896A6"}],note:"Draw tubes in this exact order. Carryover of additives between tubes can corrupt results."},
{id:5,type:"vein_site",title:"Vein Selection, Site Prep & Tourniquet Use",veins:[{label:"First choice: median cubital",desc:"Antecubital space. Least painful, least likely to roll."},{label:"Alternatives: cephalic & basilic",desc:"Either side of median cubital. May roll — anchor firmly."},{label:"When antecubital unavailable",desc:"Back of hand or wrist. More nerve endings — expect discomfort."},{label:"Foot draws",desc:"Only under direct provider supervision (DVT risk)."},{label:"Cleansing",desc:"Wipe with antiseptic, up-and-down friction. Air-dry completely."}],tourniquet:["Apply 3–4 inches above draw site","Snug but not painfully tight","Never leave >1 minute — hemoconcentration begins","Remove after site selection; reapply when ready to puncture"],restrictions:["Avoid same side as mastectomy","Avoid arm with dialysis fistula","Avoid implanted ports/devices","Avoid scar tissue, burns, wounds, bruises","Older adults: fragile veins — lighter touch, consider butterfly"]},
{id:6,type:"venipuncture",title:"Performing a Venipuncture — Step by Step",steps:[{num:1,title:"Arrange supplies",desc:"Set up in order of use. Sharps container on dominant side. Tubes in correct order of draw."},{num:2,title:"Apply tourniquet & palpate",desc:"3–4 inches above site. Push up/down on skin — veins feel bouncy. Inspect both arms."},{num:3,title:"Cleanse & allow to dry",desc:"Antiseptic pad with friction strokes. Air-dry. Never touch, blow on, or fan the site."},{num:4,title:"Anchor & insert needle",desc:"Hold skin taut 2–3 inches below. Bevel up at 15–30° (arm) or 10–15° (hand)."},{num:5,title:"Collect tubes in order",desc:"Insert tubes into holder. Release tourniquet when blood flows. Fill completely, invert immediately."},{num:6,title:"Withdraw & dispose safely",desc:"Gauze over site — no pressure until needle fully out. Safety guard, then sharps container."}]},
{id:7,type:"capillary",title:"Capillary Puncture — Fingerstick & Heel Stick",when:["Small blood volume needed or immediate results required","Patient is infant or young child","Adult/child: middle or ring finger, nondominant hand, off-center","Infant: outer edge of heel underside only — never the finger","Warm the site first — cold constricts capillaries","Wipe away first drop (tissue fluid contamination) — except PT testing"],order:[{num:1,name:"Blood gas tubes"},{num:2,name:"EDTA tubes"},{num:3,name:"Other additive tubes"},{num:4,name:"Serum tubes"}],supplies:["Automatic retractable lancet","70% isopropyl alcohol pad","Gauze pads and bandage","Collection device: micropipette, capillary tube, glucometer strip","Biohazard sharps container"]},
{id:8,type:"post_proc",title:"Post-Procedure Care, Labeling & Requisitions",items:[{icon:"🩹",title:"Gauze, pressure & hemostasis",desc:"Gauze over site before removing needle. Extend and elevate arm. Apply bandage after bleeding stops."},{icon:"⏱️",title:"Bandaging instructions",desc:"Leave bandage 15+ minutes. No heavy lifting with that arm for the rest of the day."},{icon:"⚠️",title:"Watch for adverse reactions",desc:"Check before standing. Vasovagal syncope most common. Keep seated if concerning symptoms."},{icon:"🏷️",title:"Label tubes immediately",desc:"Before moving from draw area. Name, DOB, date/time, MA initials. Permanent marker or lab labels."},{icon:"✅",title:"Match specimens to requisitions",desc:"Verify each tube against requisition. Place together in same biohazard transport bag."},{icon:"📦",title:"One bag per patient",desc:"Never mix specimens from different patients. Each gets own biohazard bag with matching requisition."}]},
{id:9,type:"processing",title:"Processing, Storage & Transport",processing:[{label:"Serum tubes must clot",desc:"Stand upright 30–45 min at room temp before centrifuging."},{label:"Don't wait too long",desc:"Must not sit >1 hour. Leaching degrades integrity."},{label:"After centrifugation",desc:"3 layers: plasma/serum (top), buffy coat (middle), RBCs (bottom)."},{label:"Balance the centrifuge",desc:"Equal size/fill tubes opposite each other. Water tubes for uneven loads."},{label:"Aliquots",desc:"Use disposable pipette to split specimens. Never pour between containers."}],storage:[{label:"Room temperature",desc:"No special management. Avoid extreme outdoor temps."},{label:"Refrigerated",desc:"Dedicated medical-grade specimen refrigerator only."},{label:"Frozen",desc:"Medical-grade lab freezer. Move to cooler only when completely frozen."},{label:"Light-sensitive",desc:"Low lab lights during processing. Wrap in foil or use amber tube."},{label:"Confirm pickup daily",desc:"Verify before leaving. Missed transport compromises viability."}]},
{id:10,type:"special",title:"Special Collections & Preanalytical Errors",collections:[{name:"Timed Specimens",color:"#4A90D9",items:["Collected at provider-ordered time — don't proceed if patient early or skipped prep","Critical for drug monitoring and GTT","Contact provider if timing is off"]},{name:"Blood Cultures",color:"#3DAE8E",items:["Special skin prep to prevent contamination","Multiple bottles, each specifically labeled","Any protocol failure = invalid specimen"]},{name:"Chain of Custody",color:"#8B6FC0",items:["Required for drug/alcohol and legal specimens","Everyone handling must sign the form","Patient signs consent before collection"]}],errors:["Mislabeled tubes, wrong patient ID, wrong container","Insufficient volume, hemolysis from rough handling","Failure to follow fasting/preparation instructions","Any error must be reported — incorrect results affect patient care"]},
{id:11,type:"results",title:"Reporting & Communicating Lab Results",communication:[{label:"Provider reviews first",desc:"Never share results before the ordering provider has reviewed them."},{label:"Delivery methods",desc:"Patient portal, phone call, or mailed letter per practice policy."},{label:"Normal vs. out-of-range",desc:"Labs flag abnormal values. Most need action but not emergency."},{label:"Confirm understanding",desc:"Ask patient to repeat back what they heard."},{label:"Documentation",desc:"All result communications documented: who, when, what."}],critical:[{label:"How they arrive",desc:"Phoned directly from lab to provider's office immediately."},{label:"MA role: receive & read back",desc:"Repeat result back to lab to confirm accuracy."},{label:"Notify provider immediately",desc:"Do not wait. Follow organizational escalation policy."},{label:"Document everything",desc:"Critical value, lab personnel name, time received, provider notified."}]},
{id:12,type:"takeaways",title:"Week Four — Key Takeaways",items:["Always verify patient identity and confirm test preparation before any draw — no exceptions.","Order of draw prevents additive carryover. Skipping or reversing it corrupts results.","Choose the right needle system: evacuated for most, butterfly for fragile or small veins.","Tourniquet on for no more than 1 minute. Hemoconcentration begins immediately after.","Label tubes immediately after the draw, before moving away — mislabeling is the most common error.","Most errors occur before the specimen is tested. Pre-analytical steps are the most important.","Critical values require immediate provider notification, read-back confirmation, and documentation.","Proper storage, light protection, and temperature management protect every specimen."]},
{id:13,type:"quiz",title:"Knowledge Check",questions:[{q:"What is the first tube in the order of draw?",options:["Light blue","Red","Yellow","Lavender"],correct:2,explanation:"Yellow (blood culture) tubes are always drawn first to prevent contamination."},{q:"How long can a tourniquet remain applied?",options:["30 seconds","1 minute","2 minutes","5 minutes"],correct:1,explanation:"Never leave the tourniquet on longer than 1 minute — hemoconcentration begins immediately after."},{q:"Which vein is the preferred first choice for venipuncture?",options:["Basilic vein","Cephalic vein","Median cubital vein","Dorsal hand vein"],correct:2,explanation:"The median cubital vein in the antecubital space is least painful and least likely to roll."},{q:"What should you do with the first drop of blood during a capillary puncture?",options:["Collect it immediately","Wipe it away","Let it air dry","Use it for the glucose test"],correct:1,explanation:"Wipe away the first drop — it contains tissue fluid that contaminates the sample."},{q:"Lavender-top tubes contain which additive?",options:["Heparin","Sodium citrate","EDTA","No additive"],correct:2,explanation:"Lavender tubes contain EDTA, which removes calcium to prevent clotting, and are used for hematology."},{q:"When you receive a critical lab value by phone, what must you do first?",options:["Tell the patient","Document it in the chart","Read the result back to the lab","Page the provider"],correct:2,explanation:"Read back the result to confirm accuracy before notifying the provider."}]},
{id:14,type:"end",title:"End of Week Four",subtitle:"Phlebotomy Techniques & Best Practices",message:"Every tube, every label, every step matters. Precision in blood collection is the foundation of accurate diagnosis and effective patient care."}
];
const total=S.length;let cur=0;let st={};
function rs(){st={objShown:new Set([0]),veniStep:0,prepTab:0,takeaways:{},qi:0,qs:null,qa:false,qsc:0,qd:false}}rs();
function e(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function go(n){if(n<0||n>=total)return;cur=n;render()}
function toggleTOC(){document.getElementById('tocO').classList.toggle('hidden');document.getElementById('tB').classList.toggle('act')}
function closeTOC(){document.getElementById('tocO').classList.add('hidden');document.getElementById('tB').classList.remove('act')}
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'||ev.key===' '){ev.preventDefault();go(cur+1)}if(ev.key==='ArrowLeft'){ev.preventDefault();go(cur-1)}if(ev.key==='Escape')closeTOC()});
function render(){
  document.getElementById('W').innerHTML=rS(S[cur]);
  document.getElementById('dots').innerHTML=S.map((_,i)=>`<div class="dot ${i===cur?'c':i<cur?'v':'f'}" onclick="go(${i})"></div>`).join('');
  document.getElementById('pB').disabled=cur===0;document.getElementById('nB').disabled=cur===total-1;
  document.getElementById('tocL').innerHTML=S.map((s,i)=>`<div class="ti ${i===cur?'a':''}" onclick="go(${i});closeTOC()" style="color:${i===cur?'var(--accent)':'var(--textMid)'}"><span class="x">${String(i+1).padStart(2,'0')}</span>${e(s.title)}</div>`).join('');
}
function H(i,t){return `<div class="sh"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${e(t)}</div></div>`}
function F(i){return `<div class="ft"><span class="l">Medical Assistant Program • Week 4</span><span class="r">${i+1} / ${total}</span></div>`}
function rS(s){const m={title:rTitle,objectives:rObj,patient_prep:rPrep,supplies:rSupp,order_draw:rOD,vein_site:rVein,venipuncture:rVeni,capillary:rCap,post_proc:rPost,processing:rProc,special:rSpec,results:rRes,takeaways:rTake,quiz:rQuiz,end:rEnd};return m[s.type]?m[s.type](s,s.id):''}

function rTitle(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px;position:relative"><div style="position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:6px"><div style="width:24px;height:2px;background:var(--accent)"></div><span style="font-size:9px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase">${e(s.subtitle)}</span></div><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">${e(s.week)}</div><h1 style="font-family:var(--ff);font-size:34px;font-weight:700;color:#fff;margin:0;line-height:1.25;white-space:pre-line">${e(s.title)}</h1><div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center">${s.tags.map(t=>`<span class="tag">${e(t)}</span>`).join('')}</div><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}

function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:3px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}">${j+1}</div><div style="font-size:10px;color:var(--text);line-height:1.4;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:4px;font-style:italic">Click each objective to reveal</p>':''}</div>${F(i)}</div>`}

function rPrep(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Before Every Blood Draw</div>${s.before.map(b=>`<div style="display:flex;gap:6px;margin-bottom:4px"><span style="font-size:13px">${b.icon}</span><div><div style="font-size:10px;font-weight:700;color:var(--text)">${e(b.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.3">${e(b.desc)}</div></div></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--blue);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Special Cases</div>${s.special.map(sp=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:var(--blue)">${e(sp.label)}: </span><span style="font-size:9px;color:var(--textMid)">${e(sp.desc)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}

function rSupp(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="flex:.6"><div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Essential Supplies</div>${s.supplies.map(sp=>`<div style="font-size:9px;color:var(--textMid);line-height:1.6;padding-left:10px;position:relative"><span style="position:absolute;left:0;color:var(--accent)">›</span>${e(sp)}</div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--blue);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Needle Systems</div><div style="display:flex;flex-direction:column;gap:6px">${s.systems.map(sys=>`<div class="cd" style="padding:8px 10px;border-left:3px solid ${sys.color}"><div style="font-size:10px;font-weight:700;color:${sys.color};margin-bottom:3px">${e(sys.name)}</div>${sys.items.map(it=>`<div style="font-size:9px;color:var(--textMid);line-height:1.4;padding-left:8px;position:relative"><span style="position:absolute;left:0;color:${sys.color}">›</span>${e(it)}</div>`).join('')}</div>`).join('')}</div></div></div></div>${F(i)}</div>`}

function rOD(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd"><th>#</th><th>Tube Color</th><th>Additive</th><th>Lab Use</th><th>Inv</th></tr></thead><tbody>${s.tubes.map((t,j)=>`<tr ${j%2?'class="al"':''}><td style="font-weight:700">${t.num}</td><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${t.hex};margin-right:4px;vertical-align:middle"></span><span style="font-weight:600">${e(t.color)}</span></td><td style="font-size:9px">${e(t.additive)}</td><td style="font-size:9px">${e(t.use)}</td><td style="font-weight:700;color:var(--accent)">${e(t.inv)}</td></tr>`).join('')}</tbody></table><div class="co co-w" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div></div>${F(i)}</div>`}

function rVein(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:12px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px">Vein Selection & Site Prep</div>${s.veins.map(v=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:var(--accent)">${e(v.label)}: </span><span style="font-size:9px;color:var(--textMid)">${e(v.desc)}</span></div>`).join('')}<div style="font-size:10px;font-weight:700;color:var(--blue);margin:8px 0 5px;text-transform:uppercase;letter-spacing:1px">Tourniquet</div>${s.tourniquet.map(t=>`<div style="font-size:9px;color:var(--textMid);line-height:1.5;padding-left:10px;position:relative"><span style="position:absolute;left:0;color:var(--blue)">›</span>${e(t)}</div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--warm);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px">Site Restrictions — Always Confirm</div>${s.restrictions.map(r=>`<div style="font-size:9px;color:var(--textMid);line-height:1.6;padding-left:10px;position:relative"><span style="position:absolute;left:0;color:var(--warm)">×</span>${e(r)}</div>`).join('')}</div></div></div>${F(i)}</div>`}

function rVeni(s,i){const p=st.veniStep;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.veniStep=${j};render()"><span style="font-weight:700;margin-right:4px">${step.num}.</span>${e(step.title)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.num}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.title)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.desc)}</div></div></div></div>${F(i)}</div>`}

function rCap(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:12px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px">When to Use & Where to Puncture</div>${s.when.map(w=>`<div style="font-size:9px;color:var(--textMid);line-height:1.5;padding-left:10px;position:relative"><span style="position:absolute;left:0;color:var(--accent)">›</span>${e(w)}</div>`).join('')}<div style="font-size:10px;font-weight:700;color:var(--purple);margin:8px 0 4px;text-transform:uppercase;letter-spacing:1px">Supplies</div>${s.supplies.map(sp=>`<div style="font-size:9px;color:var(--textMid);line-height:1.5;padding-left:10px;position:relative"><span style="position:absolute;left:0;color:var(--purple)">›</span>${e(sp)}</div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--warm);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px">Capillary Order of Draw</div>${s.order.map(o=>`<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px"><span style="font-size:9px;font-weight:700;color:#fff;background:var(--warm);border-radius:50%;min-width:20px;height:20px;display:flex;align-items:center;justify-content:center">${o.num}</span><span style="font-size:10px;color:var(--text);font-weight:600">${e(o.name)}</span></div>`).join('')}<div class="co co-am" style="margin-top:10px;font-size:9px;color:var(--text)">Capillary order differs from venipuncture order.</div></div></div></div>${F(i)}</div>`}

function rPost(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="g3" style="gap:8px">${s.items.map(it=>`<div class="cd" style="border-left:3px solid var(--accent)"><div style="font-size:14px;margin-bottom:2px">${it.icon}</div><div style="font-size:10px;font-weight:700;color:var(--text);margin-bottom:2px">${e(it.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(it.desc)}</div></div>`).join('')}</div></div>${F(i)}</div>`}

function rProc(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Processing & Centrifugation</div>${s.processing.map(p=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:var(--accent)">${e(p.label)}: </span><span style="font-size:9px;color:var(--textMid)">${e(p.desc)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--blue);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Storage & Transport</div>${s.storage.map(st=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:var(--blue)">${e(st.label)}: </span><span style="font-size:9px;color:var(--textMid)">${e(st.desc)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}

function rSpec(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="g3" style="gap:8px;margin-bottom:8px">${s.collections.map(c=>`<div class="cd" style="padding:8px 10px;border-top:3px solid ${c.color}"><div style="font-size:10px;font-weight:700;color:${c.color};margin-bottom:4px">${e(c.name)}</div>${c.items.map(it=>`<div style="font-size:9px;color:var(--textMid);line-height:1.4;padding-left:8px;position:relative"><span style="position:absolute;left:0;color:${c.color}">›</span>${e(it)}</div>`).join('')}</div>`).join('')}</div><div class="co co-w"><div style="font-size:9px;font-weight:700;color:var(--warm);margin-bottom:3px;text-transform:uppercase;letter-spacing:1px">Common Preanalytical Errors</div>${s.errors.map(er=>`<div style="font-size:9px;color:var(--text);line-height:1.5;padding-left:10px;position:relative"><span style="position:absolute;left:0;color:var(--warm)">×</span>${e(er)}</div>`).join('')}</div></div>${F(i)}</div>`}

function rRes(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--accent);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">How Results Are Communicated</div>${s.communication.map(c=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:var(--accent)">${e(c.label)}: </span><span style="font-size:9px;color:var(--textMid)">${e(c.desc)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:var(--warm);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">Critical Values — Act Immediately</div>${s.critical.map(c=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:var(--warm)">${e(c.label)}: </span><span style="font-size:9px;color:var(--textMid)">${e(c.desc)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}

function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}

function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600;color:var(--text)">${qsc}/${s.questions.length} Correct</div><div style="font-size:12px;color:var(--textMid);margin-top:6px">${pct>=80?"Excellent!":"Review the slides and try again."}</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake Quiz</button></div>${F(i)}</div>`}
const q=s.questions[qi];return `<div class="sf">${H(i,`Knowledge Check — Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight)"><div style="font-size:11px;font-style:italic">Select an answer</div></div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[13].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[13].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}

function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="display:flex;gap:16px;margin-top:24px;font-size:11px;color:rgba(255,255,255,0.4)"><span>Questions?</span><span>•</span><span>Review</span><span>•</span><span>Practice</span></div><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script>
</body>
</html>
