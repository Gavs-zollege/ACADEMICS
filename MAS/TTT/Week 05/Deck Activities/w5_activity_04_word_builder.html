<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Word Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0f1f17,#132419,#0d1a20);font-family:'Outfit',sans-serif;padding:24px 16px;color:#e8f5ec}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#7da98e;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7da98e;font-weight:700;font-size:14px}.topbar .sc{color:#fb7185;font-weight:800;font-size:14px}.bar{height:6px;background:#1e3a28;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#34d399,#fb7185);border-radius:10px;transition:width .4s}.question{background:#162a1f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #34d399}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1e3a28;border:2px solid #1e3a28;font-weight:700;font-size:16px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#34d399;font-weight:800;margin-right:12px}.opt.correct{background:rgba(52,211,153,.15);border-color:#34d399}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#162a1f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#34d399}.tip strong.no{color:#fb7185}.tip span{color:#7da98e;font-weight:600;font-size:14px}.done{text-align:center;background:#162a1f;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#7da98e;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#34d399;color:#0f1f17;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="icon">📝</div><h1>Medical Word Builder</h1><p class="sub">Decode medical terms using roots, prefixes & suffixes</p></div>
  <div id="game"></div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"What does 'bradycardia' mean?",opts:["Fast heart rate","Slow heart rate","Heart inflammation","Heart removal"],a:1,tip:"Brady- = slow, cardi = heart, -ia = condition. Slow heart rate."},
  {q:"'Hepatomegaly' means:",opts:["Liver pain","Liver removal","Liver enlargement","Liver inflammation"],a:2,tip:"Hepat = liver, -megaly = enlargement. Enlarged liver."},
  {q:"What does '-ectomy' mean?",opts:["Inflammation","Surgical removal","Visual examination","New opening"],a:1,tip:"-ectomy = surgical removal. Appendectomy = removal of the appendix."},
  {q:"'Dyspnea' means:",opts:["Without breathing","Difficult/painful breathing","Fast breathing","Normal breathing"],a:1,tip:"Dys- = difficult/painful, -pnea = breathing."},
  {q:"What does 'tachypnea' mean?",opts:["Slow breathing","No breathing","Rapid breathing","Painful breathing"],a:2,tip:"Tachy- = fast, -pnea = breathing. Rapid breathing."},
  {q:"'Nephritis' refers to:",opts:["Kidney enlargement","Kidney stone","Kidney inflammation","Kidney removal"],a:2,tip:"Nephr = kidney, -itis = inflammation."},
  {q:"What does 'hypo-' mean?",opts:["Above/excess","Below/deficient","Around","Within"],a:1,tip:"Hypo- = below or deficient. Hypoglycemia = low blood sugar."},
  {q:"'Osteoplasty' means:",opts:["Bone study","Bone pain","Bone surgical repair","Bone disease"],a:2,tip:"Oste = bone, -plasty = surgical repair."},
  {q:"What does '-emia' indicate?",opts:["Pain condition","Blood condition","Deficiency","Inflammation"],a:1,tip:"-emia = blood condition. Anemia = deficiency in blood/RBCs."},
  {q:"'Endoscopy' means:",opts:["External examination","Visual exam within the body","Skin biopsy","Blood test"],a:1,tip:"Endo- = within, -scopy = visual examination."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=8?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Learning roots, prefixes & suffixes lets you decode terms you\'ve never seen before.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script>
</body>
</html>
