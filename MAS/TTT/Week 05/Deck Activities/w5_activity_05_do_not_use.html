<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Do Not Use List Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#1a0a0e,#28101a,#180a14);font-family:'Sora',sans-serif;padding:24px 16px;color:#ffe4ea}.wrap{max-width:560px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#c07080;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar span{font-weight:700;font-size:14px}.topbar .ct{color:#c07080}.topbar .sc{color:#22d3ee}.bar{height:6px;background:#301820;border-radius:10px;margin-bottom:24px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#fb7185,#22d3ee);border-radius:10px;transition:width .4s}.vc{background:linear-gradient(135deg,#28101a,#301820);padding:32px 28px;border-radius:24px;text-align:center;margin-bottom:24px;border:2px solid rgba(34,211,238,.15)}.vc .label{color:#22d3ee;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}.vc .val{font-weight:800;font-size:36px;margin-bottom:8px;font-family:monospace;letter-spacing:3px}.fb{text-align:center;padding:14px;margin-bottom:16px;border-radius:14px;font-weight:800;font-size:18px}.fb.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:#4ade80}.fb.no{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.25);color:#fb7185}.fb .ex{font-weight:600;font-size:14px;color:#c07080;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid button{padding:14px 16px;border-radius:14px;background:#301820;border:2px solid #301820;color:#ffe4ea;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;transition:all .2s;text-align:center}.grid button:hover{filter:brightness(1.15)}.grid button.ok{background:rgba(74,222,128,.13);border-color:#4ade80}.grid button.no{background:rgba(251,113,133,.13);border-color:#fb7185}.done{text-align:center;background:#28101a;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#c07080;font-weight:600;font-size:15px;margin-bottom:24px}.btn-r{padding:14px 36px;border:none;border-radius:14px;background:#22d3ee;color:#1a0a0e;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="icon">🚫</div><h1>Do Not Use List Challenge</h1><p class="sub">What should be written instead of these dangerous abbreviations?</p></div>
  <div id="game"></div>
  <div id="doneBox" class="done" style="display:none"></div>
</div>
<script>
const ITEMS=[
  {abbr:"U or u",answer:"Units",opts:["Units","Micrograms","Urine","Universal"],tip:"'U' can be mistaken for 0, 4, or cc — causing 10x dosing errors."},
  {abbr:"IU",answer:"Units",opts:["International Units","Units","Injected Units","IV Units"],tip:"IU can be misread as IV or 10. Write 'Units' instead."},
  {abbr:"cc",answer:"mL",opts:["mL","mg","mcg","mm"],tip:"'cc' can be mistaken for 'U' (units). Always write 'mL'."},
  {abbr:"q.d. or QD",answer:"Daily",opts:["Every day","Daily","Once","Quarterly"],tip:"The period after 'q' can be mistaken for 'i' — making it 'qid' (4x/day)."},
  {abbr:"q.o.d. or QOD",answer:"Every other day",opts:["Every day","Twice daily","Every other day","Once weekly"],tip:"Easily confused with q.d. (daily) or q.i.d. (4x/day)."},
  {abbr:"MS or MSO4",answer:"Morphine",opts:["Magnesium sulfate","Morphine","Muscle spasm","Multiple sclerosis"],tip:"MS could mean morphine OR magnesium sulfate — write the full drug name."},
  {abbr:"MgSO4",answer:"Magnesium sulfate",opts:["Morphine","Magnesium sulfate","Manganese","MSG"],tip:"Easily confused with MSO4 (morphine). Write 'Magnesium sulfate' in full."},
  {abbr:"SC, SQ, sub q",answer:"Subcutaneously",opts:["Sublingual","Subcutaneously","Subconscious","Secondary"],tip:"Can be misread as 'SL' (sublingual) or '5Q'. Write 'Subcutaneously'."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),it=ITEMS[ci];let h='<div class="topbar"><span class="ct">'+(ci+1)+'/'+ITEMS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/ITEMS.length*100)+'%"></div></div>';h+='<div class="vc"><div class="label">Do Not Use — Write Instead:</div><div class="val">'+it.abbr+'</div></div>';if(chosen!==null){const ok=chosen===it.answer;h+='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Write: '+it.answer)+'<div class="ex">'+it.tip+'</div></div>'}h+='<div class="grid">';it.opts.forEach(o=>{let cls='';if(chosen===o)cls=o===it.answer?'ok':'no';else if(chosen!==null&&o===it.answer)cls='ok';h+='<button class="'+cls+'" '+(chosen===null?"onclick=\"pick('"+o.replace(/'/g,"\\'")+"')\"":'')+'>'+o+'</button>'});h+='</div>';g.innerHTML=h}
function pick(o){if(chosen!==null)return;chosen=o;if(o===ITEMS[ci].answer)score++;renderQ();setTimeout(()=>{if(ci+1<ITEMS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=7?'🏆':'💪')+'</div><h2>'+score+'/'+ITEMS.length+' Correct!</h2><p>These abbreviations cause real medication errors that harm patients. Always use the full term.</p><button class="btn-r" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script>
</body>
</html>
