<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Erikson's 8 Stages</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#1a0f20,#241530,#150a1c);font-family:'Plus Jakarta Sans',sans-serif;padding:24px 16px;color:#f0e4ff}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#a080c0;font-weight:600;font-size:15px}.badge{display:inline-block;margin-top:12px;background:#241530;padding:6px 20px;border-radius:20px;border:1px solid rgba(167,139,250,.2);color:#a78bfa;font-weight:800;font-size:15px}.fb{text-align:center;padding:12px 18px;margin-bottom:14px;border-radius:14px}.fb.ok{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2)}.fb.no{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.2)}.fb strong{font-weight:800;font-size:17px}.fb strong.ok{color:#34d399}.fb strong.no{color:#fb7185}.fb .tip{color:#a080c0;font-weight:600;font-size:13px;margin-top:6px}.sl{font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}.sl.d{color:#34d399}.sl.p{color:#a78bfa}.pi{display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(52,211,153,.06);border-radius:12px;margin-bottom:6px;border:1px solid rgba(52,211,153,.13)}.pn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(52,211,153,.13);color:#34d399;font-weight:800;font-size:18px;flex-shrink:0}.pt{font-weight:700;font-size:14px}.pool{display:grid;gap:8px}.pi2{padding:15px 20px;border-radius:14px;background:#2a1a3a;border:2px solid rgba(167,139,250,.15);font-weight:700;font-size:14px;cursor:pointer;transition:all .2s}.pi2:hover{filter:brightness(1.15);border-color:rgba(167,139,250,.35)}.dn{text-align:center;background:#241530;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.dn .big{font-size:56px}.dn h2{font-weight:800;font-size:28px;margin:12px 0 8px}.dn p{color:#a080c0;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#1a0f20;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><div class="icon">🧠</div><h1>Erikson's 8 Stages</h1><p class="sub">Tap the developmental stages in order — infancy to older adult</p><div class="badge" id="counter">0 / 8 placed</div></div>
  <div id="game"></div>
  <div id="doneBox" class="dn" style="display:none"><div class="big">🎉</div><h2>Perfect Sequence!</h2><p>Understanding developmental stages helps MAs communicate effectively with all age groups.</p><button class="btn" onclick="resetGame()">🔄 Play Again</button></div>
</div>
<script>
const ORDER=["Infancy: Trust vs. Mistrust","Toddler: Autonomy vs. Shame & Doubt","Preschool: Initiative vs. Guilt","School-age: Industry vs. Inferiority","Adolescent: Identity vs. Role Confusion","Young adult: Intimacy vs. Isolation","Middle adult: Generativity vs. Stagnation","Older adult: Ego Integrity vs. Despair"];
const TIPS=["Can I trust the world? Consistent care builds trust.","Can I do things myself? Independence vs. shame.","Can I act on my own? Purpose and initiative develop.","Am I competent? Mastery of skills and tasks.","Who am I? Identity formation is central.","Can I love? Forming intimate relationships.","Can I make my life count? Contributing to the next generation.","Did my life matter? Reflecting on life with acceptance."];
let pool,placed,fbData;
function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function init(){pool=shuffle(ORDER);placed=[];fbData=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';render()}
function render(){document.getElementById('counter').textContent=placed.length+' / '+ORDER.length+' placed';const g=document.getElementById('game');let h='';if(fbData){h+='<div class="fb '+(fbData.ok?'ok':'no')+'"><strong class="'+(fbData.ok?'ok':'no')+'">'+(fbData.ok?'✅ Correct!':'❌ Not the next stage!')+'</strong>';if(fbData.tip)h+='<div class="tip">'+fbData.tip+'</div>';h+='</div>'}if(placed.length>0){h+='<div style="margin-bottom:20px"><div class="sl d">✅ Stages</div>';placed.forEach((s,i)=>{h+='<div class="pi"><div class="pn">'+(i+1)+'</div><div class="pt">'+s+'</div></div>'});h+='</div>'}if(pool.length>0){h+='<div class="sl p">🧠 Tap stage #'+(placed.length+1)+'</div><div class="pool">';pool.forEach((s,i)=>{h+='<div class="pi2" onclick="pick('+i+')">'+s+'</div>'});h+='</div>'}g.innerHTML=h}
function pick(idx){const step=pool[idx];const ni=placed.length;if(step===ORDER[ni]){placed.push(step);pool=pool.filter((_,i)=>i!==idx);fbData={ok:true,tip:TIPS[ni]};render();if(placed.length===ORDER.length)setTimeout(()=>{document.getElementById('game').style.display='none';document.getElementById('doneBox').style.display='block'},1000);else setTimeout(()=>{fbData=null;render()},1500)}else{fbData={ok:false};render();setTimeout(()=>{fbData=null;render()},1200)}}
function resetGame(){init()}
init();
</script>
</body>
</html>
