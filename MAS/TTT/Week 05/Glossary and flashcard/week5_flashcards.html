<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 5 Flashcards — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #e4e4f0;
    --text-secondary: #9898b0;
    --surface-1: #1c1c2e;
    --surface-2: #282840;
    --border: #363650;
    --bg: #0d0d1a;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.35);
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-display: 'Playfair Display', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: #C0392B; margin-bottom: 6px;
  }
  .header h1 {
    font-family: var(--font-display); font-size: 32px; font-weight: 900;
    letter-spacing: -1px; margin-bottom: 6px; line-height: 1.1;
  }
  .header p { font-size: 13px; color: var(--text-secondary); }
  .flashcard {
    width: 100%; max-width: 500px; min-height: 250px; border-radius: 22px;
    cursor: pointer; padding: 34px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12); transition: all .35s cubic-bezier(.4,0,.2,1);
    user-select: none; position: relative; margin: 0 auto;
  }
  .flashcard .label {
    position: absolute; top: 16px; left: 20px; font-size: 11px;
    font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; opacity: .7;
  }
  .flashcard .hint {
    position: absolute; top: 16px; right: 20px; font-size: 11px; opacity: .5;
  }
  .flashcard h2 {
    margin: 0; font-family: var(--font-display); font-size: 26px;
    font-weight: 900; line-height: 1.2; letter-spacing: -.5px;
  }
  .flashcard .def-text {
    margin: 0; font-size: 15px; line-height: 1.65; color: var(--text-secondary);
  }
  .progress-bar {
    height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 6px; transition: width .3s;
  }
  .pill {
    padding: 8px 16px; border-radius: 24px; font-weight: 700;
    cursor: pointer; font-size: 13px; transition: all .2s; font-family: var(--font-body);
  }
  .pill-primary {
    border: none; color: #fff; padding: 13px 34px; font-size: 15px;
    border-radius: 30px; letter-spacing: .3px;
  }
  .pill-outline {
    background: transparent; border: 2px solid;
  }
  .chip {
    padding: 8px 14px; border-radius: 20px; border: 2px solid;
    font-weight: 600; cursor: pointer; font-size: 13px; transition: all .2s;
    font-family: var(--font-body); white-space: nowrap;
  }
  .flex-center { display: flex; align-items: center; justify-content: center; }
  .text-center { text-align: center; }
  .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
  .mt-20 { margin-top: 20px; } .mt-24 { margin-top: 24px; }
  .mb-6 { margin-bottom: 6px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; } .mb-24 { margin-bottom: 24px; }
  .gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-tag">Medical Assistant Program</div>
    <h1>Week 5 Flashcards</h1>
    <p id="header-subtitle"></p>
  </div>
  <div id="flash-mode"></div>
</div>

<script>
const CATEGORIES = [
  {
    name: "Cell Structure & Function", emoji: "🔬", color: "#2471A3",
    terms: [
      { term: "Cell", def: "The smallest structural and functional unit of all living things. Every tissue, organ, and body system is ultimately composed of cells." },
      { term: "Plasma Membrane", def: "The selectively permeable outer boundary of the cell, composed of a phospholipid bilayer embedded with proteins. Controls what enters and exits the cell." },
      { term: "Cytoplasm", def: "The gel-like fluid that fills the interior of the cell. Composed primarily of water with dissolved electrolytes, nutrients, and metabolic waste. Serves as the medium for chemical reactions and contains all suspended organelles." },
      { term: "Nucleus", def: "The large, spherical organelle near the center of the cell that serves as the cell's control center. Contains the cell's DNA and regulates all cell activities including growth, metabolism, and reproduction." },
      { term: "Nuclear Membrane", def: "The double-layered, porous membrane surrounding the nucleus. Protects the nucleus while selectively allowing specific materials to pass through." },
      { term: "Nucleolus", def: "A dense structure inside the nucleus responsible for forming RNA and ribosomes. Most cells contain one to four nucleoli." },
      { term: "Mitochondria", def: "Elongated, rod-shaped organelles that function as the cell's power plant. Convert nutrients into adenosine triphosphate (ATP), the cell's primary energy currency. Contain their own DNA." },
      { term: "Adenosine Triphosphate (ATP)", def: "The molecule that stores and transfers energy within cells. Produced by the mitochondria, ATP is the usable energy source that powers virtually every cellular process." },
      { term: "Ribosomes", def: "Small granules composed of RNA responsible for protein synthesis — building proteins for use both inside and outside the cell." },
      { term: "Endoplasmic Reticulum (ER)", def: "A complex network of membrane-enclosed channels connecting the cell membrane to the nuclear membrane. Rough ER (studded with ribosomes) supports protein synthesis; smooth ER supports lipid and steroid synthesis." },
      { term: "Golgi Apparatus", def: "A stack of flat, membrane-enclosed sacs that acts as the cell's packaging and shipping plant — processes materials, prepares them for export, and forms lysosomes." },
      { term: "Lysosomes", def: "Membrane-enclosed sacs formed by the Golgi apparatus containing digestive enzymes that break down cellular waste, damaged organelles, and foreign substances." },
      { term: "Cytoskeleton", def: "An internal framework of protein microfilaments and microtubules that maintains the cell's shape, keeps organelles in place, and moves organelles within the cell." },
      { term: "Centrioles", def: "Paired, rod-shaped structures made of microtubules near the nucleus. Play a critical role in cell reproduction by distributing chromosomes evenly to each new daughter cell during division." },
      { term: "Cilia", def: "Short, hair-like microtubule projections on the surface of certain cells that aid in moving substances along the cell surface. Cilia lining the trachea sweep debris and pathogens away from the respiratory tract." },
    ],
  },
  {
    name: "Body Planes, Cavities & Positional Terms", emoji: "🧍", color: "#7D3C98",
    terms: [
      { term: "Anatomical Position", def: "The standard reference frame: body standing upright, facing forward, arms at the sides, palms facing forward, toes pointing forward. All directional terms are described relative to this position." },
      { term: "Sagittal Plane", def: "An imaginary vertical cut dividing the body into left and right sections. The midsagittal plane divides the body into equal left and right halves." },
      { term: "Transverse Plane", def: "A horizontal cut dividing the body into upper (superior) and lower (inferior) sections. Also called the axial plane." },
      { term: "Frontal (Coronal) Plane", def: "A vertical cut dividing the body into anterior (front) and posterior (back) sections." },
      { term: "Cranial Cavity", def: "Located within the skull; houses the brain and meninges." },
      { term: "Thoracic Cavity", def: "Located within the chest; contains the lungs, heart, major blood vessels, and trachea." },
      { term: "Abdominal Cavity", def: "Located below the diaphragm; contains the stomach, small and large intestines, liver, gallbladder, pancreas, and spleen." },
      { term: "Pelvic Cavity", def: "Located inferior to the abdominal cavity; contains the urinary bladder and reproductive organs." },
      { term: "Anterior / Posterior", def: "Anterior means toward the front (ventral). Posterior means toward the back (dorsal)." },
      { term: "Superior / Inferior", def: "Superior means above, toward the head. Inferior means below, toward the feet." },
      { term: "Medial / Lateral", def: "Medial means closer to the midline. Lateral means further from the midline, toward the side." },
      { term: "Proximal / Distal", def: "Proximal means closer to the body's trunk or point of origin. Distal means further from the trunk." },
      { term: "Supine", def: "Lying flat on the back, face upward." },
      { term: "Prone", def: "Lying flat on the stomach, face downward." },
      { term: "Fowler's Position", def: "A sitting position with the back of the examination table raised to 90 degrees. Used for procedures requiring an upright seated patient." },
      { term: "Semi-Fowler's Position", def: "A partially upright position with the back raised to approximately 45 degrees. Used for patients at risk of vasovagal syncope and for certain respiratory conditions." },
      { term: "Dorsal Recumbent", def: "The patient lies face upward with knees flexed and feet flat on the table. Used for pelvic and abdominal examinations." },
    ],
  },
  {
    name: "Body Systems", emoji: "🫀", color: "#C0392B",
    terms: [
      { term: "Homeostasis", def: "The body's ability to maintain a stable, balanced internal environment despite changes in the external environment. The nervous and endocrine systems are the primary regulators." },
      { term: "Integumentary System", def: "The body system composed of the skin, hair, nails, and glands. The skin is the largest organ. Functions include protection, temperature regulation, sensation, excretion, and vitamin D production." },
      { term: "Skeletal System", def: "The framework of 206 bones that provides structure, supports posture, protects organs, and serves as attachment points for muscles. Red bone marrow produces blood cells through hematopoiesis." },
      { term: "Hematopoiesis", def: "The process of producing new blood cells. Occurs in the red bone marrow of certain bones. Produces red blood cells, white blood cells, and platelets." },
      { term: "Muscular System", def: "Composed of three muscle types: skeletal (voluntary), smooth (involuntary, in hollow organs), and cardiac (heart only). Responsible for all movement." },
      { term: "Cardiovascular System", def: "Consists of the heart, arteries, veins, and capillaries. The heart pumps blood to deliver oxygen and nutrients and remove waste. Average resting heart rate: 60–80 bpm." },
      { term: "Sinoatrial (SA) Node", def: "The heart's natural pacemaker, located in the right atrium. Generates the electrical impulse that initiates each heartbeat. Impulse travels through the AV node → Bundle of His → bundle branches → Purkinje fibers." },
      { term: "Respiratory System", def: "Moves air into and out of the lungs through the nose, pharynx, larynx, trachea, bronchi, and alveoli. Works with the cardiovascular system to deliver oxygen and eliminate CO₂." },
      { term: "Nervous System", def: "The body's primary control and communication system. Divided into the central nervous system (brain and spinal cord) and peripheral nervous system (all nerves outside the CNS)." },
      { term: "Somatic Nervous System", def: "Controls voluntary (skeletal) muscle movement. Afferent neurons carry sensory information to the CNS; efferent neurons carry motor responses from the CNS to the muscles." },
      { term: "Autonomic Nervous System", def: "Controls automatic (involuntary) body functions. Divided into sympathetic (fight or flight) and parasympathetic (rest and digest) branches." },
      { term: "Endocrine System", def: "A system of glands that produce, store, and release hormones into the bloodstream. Works with the nervous system to maintain homeostasis. Key glands: pituitary, thyroid, adrenals, pancreas." },
      { term: "Lymphatic / Immune System", def: "The lymphatic system collects and filters interstitial fluid; the immune system uses B-cells, T-cells, lymph nodes, and the spleen to destroy pathogens. Four types of immunity: naturally/artificially acquired active and passive." },
      { term: "Urinary System", def: "Filters blood and eliminates liquid waste. Kidneys produce urine, which travels through ureters to the bladder for storage, then exits via the urethra." },
      { term: "Gastrointestinal (GI) System", def: "Responsible for ingesting, digesting, and absorbing nutrients, and eliminating solid waste. Begins at the oral cavity and ends at the anus. Accessory organs: liver, pancreas, gallbladder." },
    ],
  },
  {
    name: "Common Diseases & Conditions", emoji: "🏥", color: "#1A5276",
    terms: [
      { term: "Hypertension", def: "Consistently elevated blood pressure — systolic ≥ 130 mmHg or diastolic ≥ 80 mmHg. Often called the 'silent killer.' Risk factors include genetics, obesity, smoking, and high sodium intake." },
      { term: "Myocardial Infarction (MI)", def: "A heart attack — occurs when blood flow to cardiac muscle is blocked, causing ischemia and tissue death. Symptoms: chest pain, nausea, sweating, shortness of breath." },
      { term: "Atherosclerosis", def: "Hardening and narrowing of arteries due to buildup of fatty plaques. A leading cause of coronary artery disease, stroke, and peripheral artery disease." },
      { term: "Cerebrovascular Accident (CVA / Stroke)", def: "Sudden loss of brain function due to a blocked or ruptured blood vessel. Recognized using FAST: Facial drooping, Arm weakness, Speech difficulty, Time to call 911." },
      { term: "Type 1 Diabetes Mellitus", def: "A chronic autoimmune condition in which the pancreas produces little or no insulin. Typically diagnosed in childhood. Requires daily insulin therapy." },
      { term: "Type 2 Diabetes Mellitus", def: "A chronic condition caused by insulin resistance, typically related to genetics, obesity, and lifestyle. Managed with diet, exercise, oral medications, and insulin if needed." },
      { term: "Hypothyroidism", def: "Underproduction of thyroid hormone. Causes fatigue, weight gain, cold intolerance, dry skin, and constipation. Treated with synthetic thyroid hormone (levothyroxine)." },
      { term: "Hyperthyroidism", def: "Overproduction of thyroid hormone leading to rapid heartbeat, weight loss, tremors, and anxiety. Graves' disease is the most common cause." },
      { term: "Asthma", def: "A chronic respiratory condition where airway inflammation causes swelling and tightening, reducing airflow. Symptoms: wheezing, chest tightness, shortness of breath. Triggered by allergens, exercise, or irritants." },
      { term: "COPD", def: "Chronic Obstructive Pulmonary Disease — a chronic lung disease that obstructs airflow, usually caused by chronic bronchitis and emphysema. The primary cause is smoking." },
      { term: "Osteoarthritis", def: "The most common form of arthritis — caused by degeneration of articular cartilage. Leads to pain, stiffness, and reduced flexibility. Treated with physical therapy, exercise, steroid injections, or joint replacement." },
      { term: "Osteoporosis", def: "Reduced bone mineral density making bones weaker and more prone to fracture. Diagnosed with a DEXA scan. Risk factors include aging, inadequate calcium intake, and hormonal changes." },
      { term: "GERD", def: "Gastroesophageal Reflux Disease — the lower esophageal sphincter malfunctions, allowing stomach acid to back up into the esophagus. Causes heartburn, nausea, and difficulty swallowing." },
      { term: "Urinary Tract Infection (UTI)", def: "An infection in any part of the urinary system, most commonly caused by E. coli. Symptoms: persistent urge to urinate, burning with urination, cloudy or strong-smelling urine. Treated with antibiotics." },
    ],
  },
  {
    name: "Diagnostic Measures & Treatment", emoji: "📡", color: "#D68910",
    terms: [
      { term: "Biopsy", def: "The removal of a small tissue sample for microscopic examination. Used to confirm or rule out a diagnosis of cancer or other disease." },
      { term: "Computed Tomography (CT Scan)", def: "A diagnostic imaging technique using X-rays from multiple angles to create detailed cross-sectional images. Uses radiation; contrast material may be given to enhance visibility." },
      { term: "Magnetic Resonance Imaging (MRI)", def: "Diagnostic imaging using a strong electromagnetic field and radio waves to produce detailed images of soft tissues. Does not use ionizing radiation. Contrast agent gadolinium may be used." },
      { term: "Ultrasound", def: "Diagnostic imaging using high-frequency sound waves. No radiation is involved. Commonly used for abdominal, pelvic, and cardiac evaluation." },
      { term: "Nuclear Medicine", def: "Diagnostic imaging using radioactive tracers to assess organ and tissue function. Examples: PET scans, SPECT scans, and MUGA scans." },
      { term: "Contrast Material", def: "A substance administered to make certain body structures more visible on imaging. Common agents include barium, iodine, and gadolinium." },
      { term: "Radiolucent / Radiopaque", def: "Radiolucent = structures that appear dark on imaging (low density, e.g., air-filled lungs). Radiopaque = structures that appear bright/white (dense, e.g., bone, or enhanced by contrast)." },
      { term: "Infusion Therapy", def: "The delivery of fluids, medications, nutrients, or blood products directly into the bloodstream through an IV line. Used for hydration, antibiotics, chemotherapy, and blood transfusions." },
      { term: "Chemotherapy", def: "The use of cytotoxic medications to treat cancer by targeting rapidly dividing cells. Side effects include nausea, hair loss, fatigue, and increased infection risk." },
      { term: "Endemic / Epidemic / Pandemic", def: "Endemic: disease consistently present in a region. Epidemic: sudden significant increase in cases. Pandemic: worldwide outbreak crossing international borders (e.g., COVID-19)." },
    ],
  },
  {
    name: "Medical Terminology", emoji: "📖", color: "#148F77",
    terms: [
      { term: "Word Root", def: "The foundation of a medical term conveying its core meaning. Examples: cardi (heart), hepat (liver), nephr (kidney), neur (nerve), oste (bone), gastr (stomach), derm (skin)." },
      { term: "Combining Form", def: "A word root joined to a combining vowel (usually 'o') to make it easier to attach to suffixes or other roots. Example: cardi/o, gastr/o, arthr/o." },
      { term: "Prefix", def: "A word component attached to the beginning of a medical term. Examples: hyper- (excess), hypo- (deficient), brady- (slow), tachy- (fast), a-/an- (without), peri- (around), endo- (within)." },
      { term: "Suffix", def: "A word component attached to the end of a medical term. Examples: -itis (inflammation), -ectomy (removal), -ology (study of), -algia (pain), -pathy (disease), -plasty (repair), -scopy (visual exam)." },
      { term: "The Joint Commission Do Not Use List", def: "A list of abbreviations prohibited in clinical documentation due to high potential for misinterpretation. Examples: U (for units), q.d. (for daily), MS (for morphine or magnesium sulfate)." },
      { term: "Lay Term", def: "A plain-language word used to describe a medical condition for patients. Examples: hypertension = high blood pressure; myocardial infarction = heart attack; edema = swelling." },
      { term: "Acronym", def: "An abbreviation formed from first letters of a series of words. Examples: FAST (stroke recognition), RICE (Rest, Ice, Compression, Elevation for sprains)." },
      { term: "Medical Terminology", def: "The specialized vocabulary of healthcare, built primarily from Greek and Latin roots, prefixes, and suffixes. Understanding word parts allows decoding new terms without memorizing them individually." },
    ],
  },
  {
    name: "Developmental Stages & Psychology", emoji: "🧠", color: "#CA6F1E",
    terms: [
      { term: "Erikson's Stages of Development", def: "Eight psychosocial stages from infancy through older adulthood. Each stage presents a central crisis that must be resolved for healthy psychological development." },
      { term: "Trust vs. Mistrust (Infancy)", def: "The first Erikson stage. The infant must develop trust in their primary caregiver. Success leads to confidence and optimism. Failure leads to suspiciousness." },
      { term: "Autonomy vs. Shame & Doubt (Toddler)", def: "The toddler develops independence and self-control. Success leads to confidence. Failure leads to shame and anger." },
      { term: "Identity vs. Role Confusion (Adolescent)", def: "The adolescent works to establish personal identity and direction. Success leads to emotional stability. Failure leads to role confusion and rebelliousness." },
      { term: "Ego Integrity vs. Despair (Older Adult)", def: "The final Erikson stage. The older adult reflects on their life. Success leads to wisdom and self-worth. Failure leads to despair, regret, and fear of death." },
      { term: "Defense Mechanism", def: "An unconscious coping strategy to protect the mind from uncomfortable emotions like anxiety, guilt, or shame. Can be adaptive (helpful) or maladaptive (hindering growth)." },
      { term: "Denial", def: "A defense mechanism where a person refuses to accept a difficult reality. Example: a patient denies a cancer diagnosis and refuses further testing." },
      { term: "Projection", def: "A defense mechanism where a person attributes their own uncomfortable feelings to someone else. Example: a patient blames staff for being uncaring when they are actually experiencing their own fear." },
      { term: "Rationalization", def: "A defense mechanism using logical-sounding explanations to justify unacceptable behavior. Example: 'My partner drinks every night to relieve work stress.'" },
      { term: "Displacement", def: "A defense mechanism where a person redirects difficult emotions onto a less-threatening person or object. Example: an MA frustrated with a patient taking it out on equipment." },
      { term: "Regression", def: "A defense mechanism where a person reverts to earlier, more childlike behaviors when under stress. Example: a patient refusing to cooperate in a petulant manner." },
      { term: "White Coat Syndrome", def: "A phenomenon where a patient's blood pressure is significantly higher in a clinical setting due to anxiety. May result in falsely elevated BP readings during office visits." },
    ],
  },
  {
    name: "Mental Health Conditions", emoji: "💜", color: "#6C3483",
    terms: [
      { term: "Depression", def: "A mood disorder involving persistent chemical imbalance causing extreme sadness, fatigue, loss of motivation, and hopelessness. Best managed with therapy, healthy lifestyle changes, and medication." },
      { term: "Anxiety Disorder", def: "Excessive, uncontrolled fear and worry that significantly interferes with daily functioning. Physical symptoms include rapid heart rate, sweating, and shortness of breath." },
      { term: "Post-Traumatic Stress Disorder (PTSD)", def: "Develops following a traumatic event. Symptoms include flashbacks, avoidance, negative changes in thinking, sleep disturbance, and heightened reactivity. Treated with psychotherapy and medication." },
      { term: "Attention-Deficit/Hyperactivity Disorder (ADHD)", def: "A chronic neurodevelopmental condition characterized by inattention, hyperactivity, and impulsivity. More commonly diagnosed in males. Treated with medications and behavior therapy." },
      { term: "Stressor", def: "Any event or condition that causes anxiety or stress. Can be environmental, socioeconomic, or psychological. Even positive events can act as stressors." },
      { term: "Environmental Stressor", def: "A physical or situational factor in the environment that creates stress — pollution, overcrowding, language barriers, natural disasters, theft, and violence." },
      { term: "Socioeconomic Stressor", def: "Financial or social circumstances creating ongoing adversity — inability to afford medications, job loss, housing instability, medical debt, lack of health insurance." },
    ],
  },
  {
    name: "End of Life & Stages of Grief", emoji: "🕊️", color: "#2C3E50",
    terms: [
      { term: "Anticipatory Grief", def: "Grief symptoms experienced before a loss has actually occurred. Common in patients with terminal illness and their families preparing for death." },
      { term: "Kübler-Ross Stages of Grief", def: "Five stages: Denial, Anger, Bargaining, Depression, and Acceptance. Not everyone moves through in order; some stages may be skipped or revisited." },
      { term: "Denial (Grief)", def: "First stage — the person cannot accept the loss. Thought: 'No, not me.' The MA should support without reinforcing the denial." },
      { term: "Anger (Grief)", def: "Second stage — hostility directed outward, often toward staff or family. Thought: 'Why me?' The MA should not take anger personally." },
      { term: "Bargaining (Grief)", def: "Third stage — attempting to negotiate or make deals to delay the loss. Thought: 'Yes, me, but...' The MA should listen attentively." },
      { term: "Depression (Grief)", def: "Fourth stage — reality sets in with profound sadness and withdrawal. Thought: 'Yes, it's me.' The MA should offer support and counseling referrals." },
      { term: "Acceptance (Grief)", def: "Fifth stage — coming to terms with the loss and making plans. Thought: 'Yes, me, and I'm ready.' The MA should offer encouragement and continued support." },
      { term: "Advance Directive", def: "A legal document expressing wishes regarding medical care if the patient becomes unable to communicate. Types include living will and durable power of attorney for healthcare." },
      { term: "Hospice Care", def: "Specialized care focused on comfort, quality of life, and emotional support for patients no longer pursuing curative treatment. Also supports the patient's family." },
    ],
  },
];

const ALL_TERMS = CATEGORIES.flatMap((cat, ci) =>
  cat.terms.map(t => ({ ...t, category: cat.name, emoji: cat.emoji, color: cat.color, catIndex: ci }))
);

let flashDeck = [];
let flashIdx = 0;
let flashFlipped = false;
let flashKnown = 0;
let flashLearning = 0;
let flashDone = false;
let flashSelectedCats = new Set(CATEGORIES.map((_, i) => i));
let flashStarted = false;

document.getElementById('header-subtitle').textContent =
  `Anatomy & Physiology · ${ALL_TERMS.length} terms across ${CATEGORIES.length} topics`;

renderFlash();

function startFlashDeck() {
  const terms = CATEGORIES.flatMap((cat, ci) =>
    flashSelectedCats.has(ci) ? cat.terms.map(t => ({ ...t, color: cat.color, emoji: cat.emoji, category: cat.name })) : []
  );
  flashDeck = shuffle([...terms]);
  flashIdx = 0; flashFlipped = false; flashKnown = 0; flashLearning = 0; flashDone = false; flashStarted = true;
  renderFlash();
}

function flashToggleCat(i) {
  if (flashSelectedCats.has(i)) {
    if (flashSelectedCats.size > 1) flashSelectedCats.delete(i);
  } else { flashSelectedCats.add(i); }
  renderFlash();
}

function flashMark(isKnown) {
  if (isKnown) flashKnown++; else flashLearning++;
  if (flashIdx + 1 >= flashDeck.length) { flashDone = true; renderFlash(); return; }
  flashIdx++; flashFlipped = false; renderFlash();
}

function renderFlash() {
  const el = document.getElementById('flash-mode');

  if (!flashStarted || flashDeck.length === 0) {
    let html = `<div class="text-center" style="padding:40px 0">
      <p style="font-size:18px;margin-bottom:20px;color:var(--text)">Select categories and start studying!</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px">`;
    CATEGORIES.forEach((c, i) => {
      const sel = flashSelectedCats.has(i);
      html += `<button class="chip" onclick="flashToggleCat(${i})"
        style="border-color:${c.color};background:${sel ? c.color : 'transparent'};color:${sel ? '#fff' : c.color}">
        ${c.emoji} ${escHtml(c.name)}</button>`;
    });
    html += `</div>
      <button class="pill-primary" style="background:#E74C3C" onclick="startFlashDeck()">Shuffle & Start →</button>
    </div>`;
    el.innerHTML = html; return;
  }

  if (flashDone) {
    const total = flashKnown + flashLearning;
    const pct = Math.round((flashKnown / total) * 100);
    const emoji = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📖';
    el.innerHTML = `
      <div class="text-center" style="padding:40px 0">
        <div style="font-size:48px;margin-bottom:12px">${emoji}</div>
        <h3 style="margin:0 0 8px">Round Complete!</h3>
        <p style="color:var(--text-secondary);font-size:15px;margin:0 0 24px">
          ${flashKnown} knew it · ${flashLearning} still learning · ${pct}% mastery
        </p>
        <div style="width:100%;max-width:300px;height:10px;border-radius:10px;background:var(--surface-2);margin:0 auto 24px;overflow:hidden">
          <div style="width:${pct}%;height:100%;border-radius:10px;background:linear-gradient(90deg,#27AE60,#2ECC71);transition:width .6s"></div>
        </div>
        <button class="pill-primary" style="background:#3498DB" onclick="flashDeck=[];flashStarted=false;flashDone=false;renderFlash()">New Round</button>
      </div>`;
    return;
  }

  const card = flashDeck[flashIdx];
  const pctProgress = ((flashIdx / flashDeck.length) * 100);
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;padding:12px 0">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;width:100%">
        <span style="font-size:13px;color:var(--text-secondary);font-weight:600">${flashIdx + 1}/${flashDeck.length}</span>
        <div class="progress-bar" style="flex:1"><div class="fill" style="width:${pctProgress}%;background:${card.color}"></div></div>
        <span style="font-size:12px;color:var(--text-secondary)">✓${flashKnown} ✗${flashLearning}</span>
      </div>
      <div class="flashcard" onclick="flashFlipped=!flashFlipped;renderFlash();"
           style="background:${flashFlipped ? 'var(--surface-1)' : card.color};color:${flashFlipped ? 'var(--text)' : '#fff'}">
        <span class="label">${flashFlipped ? 'Definition' : card.emoji + ' ' + escHtml(card.category)}</span>
        <span class="hint">${flashFlipped ? '' : 'tap to flip'}</span>
        ${!flashFlipped
          ? `<h2>${escHtml(card.term)}</h2>`
          : `<p class="def-text">${escHtml(card.def)}</p>`
        }
      </div>
      ${flashFlipped ? `
        <div style="display:flex;gap:12px;margin-top:20px">
          <button class="pill pill-outline" style="border-color:#E74C3C;color:#E74C3C;padding:12px 28px;font-size:14px" onclick="flashMark(false)">Still Learning</button>
          <button class="pill-primary" style="background:#27AE60;padding:12px 28px;font-size:14px" onclick="flashMark(true)">Got It! ✓</button>
        </div>` : ''}
    </div>`;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
