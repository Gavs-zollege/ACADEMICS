<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 5 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 5 Glossary</h1>
  <p class="sub">Anatomy & Physiology</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Cell Structure",color:"#6B7B8D",terms:[
    {term:"Cell",def:"The smallest structural and functional unit of all living things."},
    {term:"Plasma Membrane",def:"Selectively permeable outer boundary of the cell. Controls what enters and exits."},
    {term:"Cytoplasm",def:"Gel-like fluid filling the cell interior. Medium for chemical reactions, contains organelles."},
    {term:"Nucleus",def:"The cell's control center containing DNA. Regulates growth, metabolism, and reproduction."},
    {term:"Nuclear Membrane",def:"Double-layered porous membrane surrounding the nucleus."},
    {term:"Nucleolus",def:"Dense structure inside the nucleus. Forms RNA and ribosomes."},
    {term:"Mitochondria",def:"The cell's power plant. Converts nutrients into ATP energy."},
    {term:"ATP",def:"Adenosine triphosphate — the molecule that stores and transfers energy for cellular processes."},
    {term:"Ribosomes",def:"Small granules responsible for protein synthesis."},
    {term:"Endoplasmic Reticulum",def:"Network of channels transporting materials. Rough ER = protein synthesis; Smooth ER = lipid synthesis."},
    {term:"Golgi Apparatus",def:"The cell's packaging and shipping plant. Processes materials for export and forms lysosomes."},
    {term:"Lysosomes",def:"Contain digestive enzymes that break down waste, damaged organelles, and foreign substances."},
    {term:"Cytoskeleton",def:"Internal protein framework maintaining cell shape and moving organelles."},
    {term:"Centrioles",def:"Paired structures distributing chromosomes evenly during cell division."},
    {term:"Cilia",def:"Short hair-like projections that move substances along the cell surface."},
  ]},
  {name:"Planes & Positions",color:"#4A90B8",terms:[
    {term:"Anatomical Position",def:"Standard reference: standing upright, facing forward, palms forward, toes forward."},
    {term:"Sagittal Plane",def:"Vertical cut dividing body into left and right sections."},
    {term:"Transverse Plane",def:"Horizontal cut dividing body into upper (superior) and lower (inferior) sections."},
    {term:"Frontal (Coronal) Plane",def:"Vertical cut dividing body into anterior (front) and posterior (back) sections."},
    {term:"Cranial Cavity",def:"Within the skull; houses the brain and meninges."},
    {term:"Thoracic Cavity",def:"Within the chest; contains lungs, heart, major vessels, and trachea."},
    {term:"Abdominal Cavity",def:"Below the diaphragm; contains stomach, intestines, liver, gallbladder, pancreas, spleen."},
    {term:"Pelvic Cavity",def:"Below the abdominal cavity; contains urinary bladder and reproductive organs."},
    {term:"Anterior / Posterior",def:"Anterior = toward the front (ventral). Posterior = toward the back (dorsal)."},
    {term:"Superior / Inferior",def:"Superior = above, toward the head. Inferior = below, toward the feet."},
    {term:"Medial / Lateral",def:"Medial = closer to the midline. Lateral = further from midline, toward the side."},
    {term:"Proximal / Distal",def:"Proximal = closer to the trunk. Distal = further from the trunk."},
    {term:"Supine / Prone",def:"Supine = lying face up. Prone = lying face down."},
    {term:"Fowler's Position",def:"Sitting with back raised to 90°. Used for upright seated procedures."},
    {term:"Semi-Fowler's Position",def:"Back raised to ~45°. Used for syncope risk patients and respiratory conditions."},
    {term:"Dorsal Recumbent",def:"Face up with knees flexed and feet flat. Used for pelvic and abdominal exams."},
  ]},
  {name:"Body Systems",color:"#E05555",terms:[
    {term:"Homeostasis",def:"The body's ability to maintain stable internal conditions despite external changes."},
    {term:"Integumentary System",def:"Skin, hair, nails, glands. Protection, temperature regulation, sensation, vitamin D production."},
    {term:"Skeletal System",def:"206 bones providing structure, protection, muscle attachment. Red marrow produces blood cells."},
    {term:"Hematopoiesis",def:"Production of new blood cells in red bone marrow — RBCs, WBCs, and platelets."},
    {term:"Muscular System",def:"Three types: skeletal (voluntary), smooth (involuntary), cardiac (heart only). All movement."},
    {term:"Cardiovascular System",def:"Heart, arteries, veins, capillaries. Pumps blood to deliver O₂/nutrients and remove waste."},
    {term:"SA Node",def:"Heart's natural pacemaker in the right atrium. Initiates each heartbeat."},
    {term:"Respiratory System",def:"Moves air through nose, pharynx, larynx, trachea, bronchi, alveoli. O₂/CO₂ exchange."},
    {term:"Nervous System",def:"Primary control system. CNS (brain + spinal cord) and PNS (all other nerves)."},
    {term:"Somatic Nervous System",def:"Controls voluntary skeletal muscle movement. Afferent = sensory in; efferent = motor out."},
    {term:"Autonomic Nervous System",def:"Controls involuntary functions. Sympathetic = fight/flight; Parasympathetic = rest/digest."},
    {term:"Endocrine System",def:"Glands producing hormones for regulation. Pituitary, thyroid, adrenal, pancreas."},
    {term:"Lymphatic / Immune",def:"Filters interstitial fluid; B-cells, T-cells, lymph nodes, spleen destroy pathogens."},
    {term:"Urinary System",def:"Kidneys filter blood → ureters → bladder → urethra. Eliminates liquid waste."},
    {term:"GI System",def:"Ingests, digests, absorbs nutrients, eliminates waste. Oral cavity to anus + accessory organs."},
  ]},
  {name:"Diseases",color:"#E74C6F",terms:[
    {term:"Hypertension",def:"Elevated BP ≥130/80. Often asymptomatic. Managed with lifestyle changes and medications."},
    {term:"Myocardial Infarction",def:"Heart attack — blocked coronary artery causes cardiac muscle death. Chest pain, nausea, sweating."},
    {term:"Atherosclerosis",def:"Hardening/narrowing of arteries from fatty plaque buildup. Leads to CAD, stroke, PAD."},
    {term:"Stroke (CVA)",def:"Sudden brain function loss from blocked/ruptured vessel. FAST: Face, Arm, Speech, Time."},
    {term:"Type 1 Diabetes",def:"Autoimmune — pancreas produces little/no insulin. Requires daily insulin. Usually childhood onset."},
    {term:"Type 2 Diabetes",def:"Insulin resistance from genetics/obesity/lifestyle. Managed with diet, exercise, medications."},
    {term:"Hypothyroidism",def:"Underactive thyroid — fatigue, weight gain, cold intolerance. Treated with levothyroxine."},
    {term:"Hyperthyroidism",def:"Overactive thyroid — rapid heart, weight loss, tremors. Graves' disease most common cause."},
    {term:"Asthma",def:"Chronic airway inflammation causing wheezing, chest tightness, SOB. Triggered by allergens/exercise."},
    {term:"COPD",def:"Chronic lung disease obstructing airflow. Emphysema + chronic bronchitis. Primary cause: smoking."},
    {term:"Osteoarthritis",def:"Cartilage degeneration causing joint pain and stiffness. Most common form of arthritis."},
    {term:"Osteoporosis",def:"Reduced bone density making bones fracture-prone. Diagnosed with DEXA scan."},
    {term:"GERD",def:"Stomach acid backs up into esophagus. Heartburn, nausea, difficulty swallowing."},
    {term:"UTI",def:"Urinary infection usually from E. coli. Burning urination, urgency, cloudy urine. Antibiotics."},
  ]},
  {name:"Diagnostics",color:"#8B6AAE",terms:[
    {term:"Biopsy",def:"Tissue sample removal for microscopic examination. Confirms/rules out cancer or disease."},
    {term:"CT Scan",def:"X-rays from multiple angles creating cross-sectional images. Uses radiation; may use contrast."},
    {term:"MRI",def:"Electromagnetic field + radio waves for detailed soft tissue images. No radiation. May use gadolinium."},
    {term:"Ultrasound",def:"High-frequency sound waves for imaging organs, vessels, and fetuses. No radiation."},
    {term:"Nuclear Medicine",def:"Radioactive tracers assess organ function. PET, SPECT, MUGA scans."},
    {term:"Contrast Material",def:"Substance making structures more visible on imaging — barium, iodine, gadolinium."},
    {term:"Radiolucent / Radiopaque",def:"Radiolucent = dark (low density, e.g., air). Radiopaque = bright (dense, e.g., bone)."},
    {term:"Infusion Therapy",def:"IV delivery of fluids, medications, nutrients, or blood products directly into the bloodstream."},
    {term:"Chemotherapy",def:"Cytotoxic medications targeting rapidly dividing cancer cells. Oral or IV. Side effects: nausea, hair loss."},
    {term:"Endemic/Epidemic/Pandemic",def:"Endemic = normal rate. Epidemic = sudden increase. Pandemic = worldwide outbreak."},
  ]},
  {name:"Medical Terms",color:"#1A8A7D",terms:[
    {term:"Word Root",def:"Core meaning of a medical term. Examples: cardi (heart), hepat (liver), nephr (kidney)."},
    {term:"Combining Form",def:"Word root + combining vowel (usually 'o'). Example: cardi/o, gastr/o, arthr/o."},
    {term:"Prefix",def:"Attached to the beginning — hyper- (excess), hypo- (deficient), brady- (slow), tachy- (fast)."},
    {term:"Suffix",def:"Attached to the end — -itis (inflammation), -ectomy (removal), -algia (pain), -scopy (visual exam)."},
    {term:"TJC Do Not Use List",def:"Prohibited abbreviations in clinical docs due to misinterpretation risk (e.g., U, q.d., MS)."},
    {term:"Lay Term",def:"Plain-language medical explanations for patients. Hypertension = high blood pressure."},
    {term:"Acronym",def:"Abbreviation from first letters pronounced as a word. FAST (stroke), RICE (sprains)."},
    {term:"Medical Terminology",def:"Healthcare vocabulary built from Greek/Latin roots, prefixes, and suffixes."},
  ]},
  {name:"Development",color:"#4CAF90",terms:[
    {term:"Erikson's Stages",def:"Eight psychosocial stages from infancy to old age. Each has a central crisis to resolve."},
    {term:"Trust vs. Mistrust",def:"Infancy — developing trust in caregivers. Success = confidence; failure = suspiciousness."},
    {term:"Autonomy vs. Shame",def:"Toddler — developing independence. Success = self-control; failure = shame and anger."},
    {term:"Identity vs. Role Confusion",def:"Adolescent — establishing personal identity. Success = stability; failure = confusion."},
    {term:"Ego Integrity vs. Despair",def:"Older adult — reflecting on life. Success = wisdom; failure = despair and regret."},
    {term:"Defense Mechanism",def:"Unconscious coping strategies protecting the mind from uncomfortable emotions."},
    {term:"Denial",def:"Refusing to accept a difficult reality. Support without reinforcing the denial."},
    {term:"Projection",def:"Attributing one's own uncomfortable feelings to someone else."},
    {term:"Rationalization",def:"Using logical-sounding explanations to justify unacceptable behavior."},
    {term:"Displacement",def:"Redirecting emotions from the real source onto a less-threatening target."},
    {term:"Regression",def:"Reverting to earlier, more childlike behaviors under stress."},
    {term:"White Coat Syndrome",def:"Elevated BP in clinical settings due to anxiety. May cause falsely elevated readings."},
  ]},
  {name:"Mental Health",color:"#E2B94C",terms:[
    {term:"Depression",def:"Persistent chemical imbalance causing extreme sadness, fatigue, hopelessness. Therapy + medication."},
    {term:"Anxiety Disorder",def:"Excessive uncontrolled fear/worry interfering with daily life. Rapid heart, sweating, SOB."},
    {term:"PTSD",def:"Develops after trauma — flashbacks, avoidance, mood changes, sleep disturbance."},
    {term:"ADHD",def:"Neurodevelopmental — inattention, hyperactivity, impulsivity. Usually begins in childhood."},
    {term:"Stressor",def:"Any event causing anxiety — environmental, socioeconomic, or psychological."},
    {term:"Environmental Stressor",def:"Physical/situational factors: pollution, overcrowding, disasters, violence."},
    {term:"Socioeconomic Stressor",def:"Financial/social circumstances: job loss, housing instability, medical debt."},
  ]},
  {name:"End of Life",color:"#C4A84D",terms:[
    {term:"Anticipatory Grief",def:"Grief symptoms before a loss occurs. Common in terminal illness situations."},
    {term:"Kübler-Ross Stages",def:"Five stages: Denial, Anger, Bargaining, Depression, Acceptance. Not always sequential."},
    {term:"Denial (Grief)",def:"First stage — refusing to accept the loss. 'No, not me.' Support without reinforcing."},
    {term:"Anger (Grief)",def:"Second stage — hostility directed outward. 'Why me?' Don't take it personally."},
    {term:"Bargaining (Grief)",def:"Third stage — negotiating to delay the loss. 'Yes, me, but...' Listen attentively."},
    {term:"Depression (Grief)",def:"Fourth stage — profound sadness as reality sets in. 'Yes, it's me.' Offer support."},
    {term:"Acceptance (Grief)",def:"Fifth stage — coming to terms with the loss. 'Yes, me, and I'm ready.'"},
    {term:"Advance Directive",def:"Legal document expressing medical care wishes if unable to communicate."},
    {term:"Hospice Care",def:"Comfort-focused care for terminal illness patients no longer pursuing curative treatment."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
