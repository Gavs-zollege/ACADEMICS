*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--ff:"Libre Baskerville","Georgia",serif;--fs:"Source Sans 3","Segoe UI",sans-serif;--slideBg:#FFF;--slideAlt:#F6F8FB;--dark:#0D2137;--darkSub:#1B3A57;--accent:#0F7B6C;--accentLight:#E6F5F2;--warm:#D94F4F;--warmLight:#FDF0F0;--amber:#D4880F;--amberLight:#FFF7E6;--blue:#2B6CB0;--blueLight:#EBF2FA;--purple:#6B46A8;--text:#1A202C;--textMid:#4A5568;--textLight:#8896A6;--border:#E2E8F0;--headerBg:#0D2137}body{background:#E8ECF0;font-family:var(--fs);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px 24px}button{cursor:pointer;font-family:var(--fs)}.sw{width:100%;max-width:960px}.sf{width:100%;aspect-ratio:16/9;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.18);overflow:hidden;position:relative;display:flex;flex-direction:column;animation:sF .35s ease-out}.sf.dk{background:var(--headerBg)}.sf:not(.dk){background:var(--slideBg)}.sh{background:var(--headerBg);padding:10px 28px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0}.sh .n{font-size:9px;font-weight:700;color:var(--accent);background:rgba(15,123,108,.15);border-radius:3px;padding:2px 7px;letter-spacing:1px}.sh .t{font-family:var(--ff);font-size:13px;font-weight:700;color:#fff}.sb{flex:1;padding:12px 28px 8px;overflow:hidden}.ft{display:flex;justify-content:space-between;align-items:center;padding:0 28px 6px;flex-shrink:0}.ft .l{font-size:8px;color:var(--textLight);letter-spacing:1px;text-transform:uppercase}.ft .r{font-size:9px;font-weight:600;color:var(--textLight)}.ctrls{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:960px;margin-top:14px}.cb{font-size:12px;font-weight:600;color:#4A5568;background:rgba(0,0,0,.05);border:none;border-radius:8px;padding:8px 18px;transition:all .2s}.cb:hover:not(:disabled){filter:brightness(1.08)}.cb:disabled{opacity:.3;cursor:default}.cb.act{background:var(--dark);color:#fff}.dots{display:flex;gap:3px;align-items:center}.dot{height:5px;border-radius:3px;cursor:pointer;transition:all .3s}.dot.c{width:16px;background:var(--accent)}.dot.v{width:5px;background:var(--darkSub)}.dot.f{width:5px;background:rgba(0,0,0,.12)}.to{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center}.tp{background:#fff;border-radius:12px;padding:24px 20px;max-height:70vh;overflow-y:auto;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.tt{font-family:var(--ff);font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px}.ti{font-size:12px;padding:6px 10px;border-radius:5px;cursor:pointer;margin-bottom:1px;transition:all .15s}.ti:hover{background:var(--slideAlt)}.ti.a{color:var(--accent);background:var(--accentLight);font-weight:700}.ti .x{color:var(--textLight);margin-right:8px;font-weight:600;font-size:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.fr{display:flex;gap:16px}.cd{background:var(--slideAlt);border-radius:6px;padding:10px 12px}table{width:100%;border-collapse:collapse;font-size:10px}th{padding:5px 8px;text-align:left;font-weight:700;font-size:8px;letter-spacing:.5px;text-transform:uppercase}td{padding:5px 8px;font-size:10px;color:var(--text)}.thd th{background:var(--headerBg);color:#fff}tr.al{background:var(--slideAlt)}.tb{display:flex;gap:0;margin-bottom:10px;border-bottom:2px solid var(--border)}.tbtn{font-size:10px;font-weight:500;color:var(--textMid);background:none;border:none;border-bottom:3px solid transparent;padding:5px 10px;margin-bottom:-2px;transition:all .2s}.tbtn.a{font-weight:700;color:var(--accent)}.co{border-radius:6px;padding:8px 12px;border-left:3px solid}.co-a{background:var(--accentLight);border-color:var(--accent)}.co-w{background:var(--warmLight);border-color:var(--warm)}.co-am{background:var(--amberLight);border-color:var(--amber)}.co-b{background:var(--blueLight);border-color:var(--blue)}.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}.sb-s.a{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

<script>
const S=[
{id:0,type:"title",title:"Understanding the Language\nand Structure of the Human Body",subtitle:"MEDICAL ASSISTANT PROGRAM",week:"Week Five",tags:["Body Systems","Disease","Medical Terminology","Psychology"],fs:28},
{id:1,type:"objectives",title:"Learning Objectives",objectives:["Identify cell structures and their functions","Describe anatomical structures, locations, and positions","Compare the structure and function of major body systems","Explain how organ systems interact to maintain homeostasis","Identify signs, symptoms, and causes of common diseases","Recall diagnostic measures and treatment modalities","Outline incidence, risk factors, and comorbidities of disease","Describe epidemics and pandemics","Define common abbreviations, acronyms, and symbols","Build medical words using roots, prefixes, and suffixes","Identify The Joint Commission's Do Not Use list","Define lay terms for common conditions and procedures","Label positional and directional terminology","Differentiate developmental stages","Identify signs/symptoms of common mental health conditions","Describe environmental and socioeconomic stressors","Explain psychology for physical and developmental challenges","Describe defense mechanisms and end-of-life stages of grief"]},
{id:2,type:"cards",title:"Cell Structure — The Building Blocks of Life",cols:4,cards:[{title:"Plasma Membrane",desc:"Selectively permeable outer layer; separates interior from environment",color:"#4A90D9"},{title:"Cytoplasm",desc:"Gel-like fluid; medium for chemical reactions; contains organelles",color:"#3DAE8E"},{title:"Nucleus",desc:"Control center; houses DNA; regulates cell activity and reproduction",color:"#D94F4F"},{title:"Mitochondria",desc:"Power plant — converts nutrients into ATP (usable energy)",color:"#E8853D"},{title:"Ribosomes",desc:"Synthesize proteins; found in nucleolus or floating in cytoplasm",color:"#8B6FC0"},{title:"Golgi Apparatus",desc:"Packaging plant — processes and ships materials; forms lysosomes",color:"#B8860B"},{title:"Lysosomes",desc:"Digest/remove waste, damaged organelles, and foreign substances",color:"#4A90D9"},{title:"Endoplasmic Reticulum",desc:"Transport network; RER = protein transport; SER = lipid synthesis",color:"#3DAE8E"}]},
{id:3,type:"twocol",title:"Body Planes, Cavities & Directional Terms",lt:"Planes & Cavities",lc:"var(--blue)",li:[{l:"Sagittal",d:"Divides body into left and right (midsagittal = equal)"},{l:"Transverse",d:"Divides into upper and lower sections"},{l:"Frontal (Coronal)",d:"Divides into anterior (front) and posterior (back)"},{l:"Cranial",d:"Brain (meninges)"},{l:"Spinal",d:"Spinal cord"},{l:"Thoracic",d:"Lungs, heart, major vessels"},{l:"Abdominal",d:"Stomach, liver, intestines"},{l:"Pelvic",d:"Bladder, reproductive organs"}],rt:"Directional & Positional Terms",rc:"var(--accent)",ri:[{l:"Anterior / Posterior",d:"Front / Back of body"},{l:"Superior / Inferior",d:"Above (head) / Below (feet)"},{l:"Medial / Lateral",d:"Closer to / Further from midline"},{l:"Proximal / Distal",d:"Closer to / Further from trunk"},{l:"Superficial / Deep",d:"Near surface / Further from surface"},{l:"Supine / Prone",d:"Face up / Face down"},{l:"Fowler's / Semi-Fowler's",d:"Sitting 90° / Sitting 45°"},{l:"Dorsal Recumbent",d:"Face up, knees flexed, feet flat"}]},
{id:4,type:"table",title:"Major Body Systems at a Glance",hd:["System","Primary Function"],rows:[["Integumentary","Protection, temperature regulation, sensation, vitamin D. Skin = largest organ."],["Skeletal","Structure, organ protection, muscle attachment, blood cell production (hematopoiesis)."],["Muscular","Voluntary (skeletal), involuntary (smooth), cardiac function. Works with skeleton."],["Cardiovascular","Heart pumps blood; delivers O₂ and nutrients; removes waste."],["Respiratory","Air in/out of lungs; O₂/CO₂ exchange through external and internal respiration."],["Nervous","Controls all systems. CNS + PNS. Somatic (voluntary) and autonomic branches."],["Endocrine","Glands produce hormones regulating body functions and homeostasis."],["Urinary","Kidneys filter blood, produce urine; ureters, bladder, urethra eliminate waste."],["GI","Digests food, absorbs nutrients. Mouth through anus; liver, pancreas."],["Immune & Lymphatic","Defends against pathogens; B-cells, T-cells, lymph nodes; 4 immunity types."],["Reproductive","Produces gametes and hormones; supports fetal development (female)."]]},
{id:5,type:"twocol",title:"Cardiovascular & Respiratory Systems",lt:"Cardiovascular System",lc:"var(--warm)",li:[{l:"Heart chambers",d:"4 chambers: RA, RV, LA, LV. Tricuspid (right) and mitral (left) valves."},{l:"Blood flow",d:"Deoxy → right heart → lungs (pulmonary) → left heart → body (systemic)"},{l:"Conduction",d:"SA node → AV node → Bundle of His → bundle branches → Purkinje fibers"},{l:"Heart layers",d:"Pericardium (outer), myocardium (middle/thickest), endocardium (inner)"},{l:"Blood vessels",d:"Arteries = away from heart; Veins = toward heart; Capillaries = exchange"}],rt:"Respiratory System",rc:"var(--blue)",ri:[{l:"Air pathway",d:"Nose/mouth → pharynx → larynx → trachea → bronchi → bronchioles → alveoli"},{l:"External respiration",d:"Gas exchange in the alveoli of the lungs"},{l:"Internal respiration",d:"O₂/CO₂ exchange within red blood cells throughout the body"},{l:"Lung anatomy",d:"Right: 3 lobes. Left: 2 lobes. Both surrounded by pleura."},{l:"Cilia role",d:"Line trachea and nasal passages; trap and sweep out particles"}]},
{id:6,type:"twocol",title:"Nervous & Endocrine Systems",lt:"Nervous System",lc:"var(--purple)",li:[{l:"CNS vs. PNS",d:"CNS: brain + spinal cord. PNS: 12 cranial pairs, 31 spinal pairs."},{l:"Somatic vs. autonomic",d:"Somatic: voluntary muscles. Autonomic: breathing, digestion."},{l:"Sympathetic vs. parasympathetic",d:"Fight-or-flight vs. rest-and-digest."},{l:"Neuron structure",d:"Dendrites receive; axon transmits; neurotransmitters cross synapses."},{l:"Brain lobes",d:"Frontal (judgment), parietal (sensation), occipital (vision), temporal (hearing)."}],rt:"Endocrine System & Homeostasis",rc:"var(--amber)",ri:[{l:"Function",d:"Glands produce hormones — chemical messengers maintaining homeostasis."},{l:"Exocrine vs. endocrine",d:"Exocrine: into a duct (sweat). Endocrine: into bloodstream."},{l:"Key glands",d:"Thyroid (metabolism), adrenal (stress), pancreas (glucose), pituitary (master)."},{l:"Homeostasis",d:"Stable internal environment despite external changes. All systems contribute."},{l:"When it breaks",d:"Disease in one system cascades across others."}]},
{id:7,type:"tab",title:"Common Diseases — By System",tk:"0",tabs:[{n:"Cardiovascular",c:"#D94F4F",items:["Hypertension: elevated BP; meds, diet, exercise","MI: chest pain, nausea, sweating; EKG, stenting","Atherosclerosis: hardened arteries from plaque; leads to TIA, CAD","Anemia: fatigue, dizziness; treated based on cause (iron, B12, transfusion)"]},{n:"Respiratory",c:"#4A90D9",items:["Asthma: wheezing, chest tightness; inhalers and oral meds","COPD: chronic airflow obstruction; primarily caused by smoking","Bronchitis: coughing, mucus; acute (viral) vs. chronic (smoking)","ARDS: sudden SOB after injury; oxygen and ventilation"]},{n:"Musculoskeletal",c:"#3DAE8E",items:["Osteoporosis: bone loss; DEXA scan; meds and calcium","Osteoarthritis: joint degeneration; PT, injections, replacement","Rheumatoid arthritis: autoimmune; anti-inflammatory meds","Gout: uric acid crystals in joints; anti-inflammatory diet"]},{n:"Endocrine",c:"#E8853D",items:["Type 1 DM: no insulin (autoimmune); insulin therapy required","Type 2 DM: insulin resistance; diet, exercise, metformin","Hypothyroidism: fatigue, weight gain; levothyroxine","Hyperthyroidism/Graves': overactive thyroid; radioactive iodine"]}]},
{id:8,type:"tab",title:"Common Diseases — Continued",tk:"1",tabs:[{n:"Nervous",c:"#6B46A8",items:["Stroke (CVA): FAST; CT/MRI; immediate blood restoration","Alzheimer's: memory loss; symptom management only","Sciatica: radiating leg pain; PT, anti-inflammatories","Shingles: varicella-zoster; banded rash; antivirals"]},{n:"GI",c:"#B8860B",items:["GERD: heartburn, reflux; lifestyle, antacids, surgery","Appendicitis: RLQ pain, fever; surgical removal","Colorectal cancer: colonoscopy; surgery, chemo","Celiac: gluten immune response; strict gluten-free diet"]},{n:"Urinary",c:"#2B6CB0",items:["UTI: burning, urgency; E. coli; antibiotics","Kidney stones: severe flank pain; lithotripsy, hydration","Chronic renal failure: progressive; BP control, dialysis","Urinary incontinence: Kegel exercises, surgery"]},{n:"Integumentary",c:"#D94F4F",items:["Cellulitis: bacterial infection; red, hot, swollen; antibiotics","Eczema: inflammatory; steroid creams, antihistamines","Basal cell carcinoma: non-healing bump; UV; excision","Melanoma: ABCDE criteria; surgery + radiation"]}]},
{id:9,type:"twocol",title:"Diagnostic Measures, Treatments & Epidemics",lt:"Diagnostic Imaging & Treatment",lc:"var(--blue)",li:[{l:"Uses radiation",d:"X-ray, CT, angiography, mammography, nuclear medicine (PET, SPECT)"},{l:"No radiation",d:"MRI (electromagnetic) and ultrasound (sound waves)"},{l:"Contrast agents",d:"Barium, iodine, gadolinium, or air for clearer visualization"},{l:"Treatment modalities",d:"Medications, surgery, chemo/radiation, PT/OT/RT, dialysis, O₂ therapy"}],rt:"Endemic, Epidemic & Pandemic",rc:"var(--warm)",ri:[{l:"Endemic",d:"Normal, expected rate in a region. Consistently present."},{l:"Epidemic",d:"Rapid increase beyond expected in a population or area."},{l:"Pandemic",d:"Worldwide outbreak crossing international borders (e.g., COVID-19)."},{l:"Prevention",d:"Cough protocols, hand hygiene, isolation, vaccinations."},{l:"Monitoring",d:"CDC and WHO track outbreaks and coordinate global responses."}]},
{id:10,type:"tab",title:"Medical Terminology — Building Words",tk:"2",tabs:[{n:"Prefixes",c:"#4A90D9",items:["a-, an- = without (apnea)","brady- = slow (bradycardia)","tachy- = fast (tachycardia)","hyper- = above/excess (hypertension)","hypo- = below/deficient (hypoglycemia)","endo- = within (endoscopy)","peri- = around (pericardium)","poly- = many (polyuria)","dys- = painful/difficult (dyspnea)","hemi- = half (hemiplegia)"]},{n:"Word Roots",c:"#3DAE8E",items:["cardi = heart | hepat = liver | neur = nerve","oste = bone | nephr = kidney | gastr = stomach","derm = skin | pulmon = lung | arthr = joint","hem/hemat = blood | cephal = head | my = muscle"]},{n:"Suffixes",c:"#8B6FC0",items:["-itis = inflammation | -ectomy = removal","-ology = study of | -emia = blood condition","-algia = pain | -plasty = surgical repair","-scopy = visual exam | -pathy = disease","-megaly = enlargement | -stomy = new opening","-tomy = incision | -penia = deficiency"]}]},
{id:11,type:"twocol",title:"Abbreviations & Do Not Use List",lt:"Do Not Use — TJC List",lc:"var(--warm)",li:[{l:"MS, MSO4",d:'Write "Morphine"'},{l:"MgSO4",d:'Write "Magnesium sulfate"'},{l:"U, u, IU",d:'Write "Units"'},{l:"cc",d:'Write "mL"'},{l:"q.d., qd, QD",d:'Write "Daily"'},{l:"q.o.d., QOD",d:'Write "Every other day"'},{l:"SC, SQ, sub q",d:'Write "Subcutaneously"'},{l:"OD, OS, OU",d:'Write "Right eye, left eye, both eyes"'}],rt:"Essential Abbreviations",rc:"var(--accent)",ri:[{l:"BP",d:"Blood pressure"},{l:"CBC",d:"Complete blood count"},{l:"CVA",d:"Cerebrovascular accident (stroke)"},{l:"DM",d:"Diabetes mellitus"},{l:"DNR",d:"Do not resuscitate"},{l:"EKG/ECG",d:"Electrocardiogram"},{l:"NPO",d:"Nothing by mouth"},{l:"PRN",d:"As needed"},{l:"SOB",d:"Shortness of breath"},{l:"Stat",d:"Immediately"}]},
{id:12,type:"twocol",title:"Mental Health & Developmental Stages",lt:"Common Mental Health Conditions",lc:"var(--purple)",li:[{l:"Depression",d:"Extreme sadness, fatigue, hopelessness. Therapy, medication, lifestyle."},{l:"Anxiety",d:"Extreme worry, fast heart rate, sweating. Therapy and medication."},{l:"PTSD",d:"Flashbacks, avoidance, sleep disturbance. Psychotherapy, medication."},{l:"ADHD",d:"Inattention, hyperactivity, impulsivity. More common in males."}],rt:"Erikson's 8 Stages",rc:"var(--blue)",ri:[{l:"1. Infancy",d:"Trust vs. Mistrust"},{l:"2. Toddler",d:"Autonomy vs. Shame & Doubt"},{l:"3. Preschool",d:"Initiative vs. Guilt"},{l:"4. School-age",d:"Industry vs. Inferiority"},{l:"5. Adolescent",d:"Identity vs. Role Confusion"},{l:"6. Young adult",d:"Intimacy vs. Isolation"},{l:"7. Middle adult",d:"Generativity vs. Stagnation"},{l:"8. Older adult",d:"Ego Integrity vs. Despair"}]},
{id:13,type:"twocol",title:"Defense Mechanisms, Stressors & End of Life",lt:"Defense Mechanisms & Stressors",lc:"var(--amber)",li:[{l:"Denial",d:"Refusing to accept a difficult reality"},{l:"Projection",d:"Attributing own feelings to someone else"},{l:"Rationalization",d:"Justifying unacceptable behavior with logic"},{l:"Displacement",d:"Redirecting emotions toward less-threatening target"},{l:"Regression",d:"Reverting to childlike behavior under stress"},{l:"Stressors",d:"Environmental (pollution, disasters) and socioeconomic (job loss, debt)"}],rt:"Kübler-Ross Stages of Grief",rc:"var(--warm)",ri:[{l:"1. Denial",d:'"No, not me." Support without reinforcing denial.'},{l:"2. Anger",d:'"Why me?" Hostility toward staff. Don\'t take it personally.'},{l:"3. Bargaining",d:'"Yes, but..." Attempts to make deals. Listen and let them express.'},{l:"4. Depression",d:'"Yes, it\'s me." Sadness and withdrawal. Sit with them; offer referrals.'},{l:"5. Acceptance",d:'"I\'m ready." Coming to terms. Offer encouragement.'}]},
{id:14,type:"takeaways",title:"Week Five — Key Takeaways",items:["Cells are the building blocks. Every organelle has a specific function explaining disease at the most basic level.","Body systems don't work in isolation. Disease cascades across systems — homeostasis depends on all working together.","Know directional terms — anterior, posterior, superior, inferior, medial, lateral — used in every clinical documentation.","Medical terminology is built from roots, prefixes, and suffixes. Learning components lets you decode new terms.","Always follow TJC's Do Not Use list. These abbreviations cause real medication errors.","Mental health is physical health. ADHD, depression, anxiety, PTSD affect how patients respond to care.","Recognize defense mechanisms — they're coping strategies, not personal attacks. Respond with empathy.","Know the five stages of grief. Your role is to offer support — not fix what cannot be fixed."]},
{id:15,type:"quiz",title:"Knowledge Check",questions:[{q:"What is the 'power plant' of the cell?",options:["Nucleus","Golgi Apparatus","Mitochondria","Ribosomes"],correct:2,explanation:"Mitochondria convert nutrients into ATP — the cell's usable energy."},{q:"Which body plane divides the body into anterior and posterior?",options:["Sagittal","Transverse","Frontal (Coronal)","Midsagittal"],correct:2,explanation:"The frontal (coronal) plane divides the body into front (anterior) and back (posterior) sections."},{q:"The prefix 'brady-' means:",options:["Fast","Slow","Painful","Without"],correct:1,explanation:"Brady- means slow (e.g., bradycardia = slow heart rate)."},{q:"Which is NOT on TJC's Do Not Use list?",options:["U (units)","cc (mL)","BP (blood pressure)","MS (morphine)"],correct:2,explanation:"BP is a standard, accepted abbreviation. MS, U, and cc are on the Do Not Use list."},{q:"What stage of grief involves hostility toward healthcare staff?",options:["Denial","Anger","Bargaining","Depression"],correct:1,explanation:"Anger stage — 'Why me?' Hostility directed at others including staff. Don't take it personally."},{q:"The SA node is also known as the:",options:["Gatekeeper","Power plant","Pacemaker","Control center"],correct:2,explanation:"The SA node is the heart's natural pacemaker, initiating every normal heartbeat from the right atrium."}]},
{id:16,type:"end",title:"End of Week Five",subtitle:"Understanding the Human Body",message:"The language of medicine and the structure of the human body are the foundation of everything you will do as a medical assistant."}
];

function toggleTOC(){document.getElementById('tocO').classList.toggle('hidden');document.getElementById('tB').classList.toggle('act')}
function closeTOC(){document.getElementById('tocO').classList.add('hidden');document.getElementById('tB').classList.remove('act')}
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'||ev.key===' '){ev.preventDefault();go(cur+1)}if(ev.key==='ArrowLeft'){ev.preventDefault();go(cur-1)}if(ev.key==='Escape')closeTOC()});
function render(){document.getElementById('W').innerHTML=rS(S[cur]);document.getElementById('dots').innerHTML=S.map((_,i)=>`<div class="dot ${i===cur?'c':i<cur?'v':'f'}" onclick="go(${i})"></div>`).join('');document.getElementById('pB').disabled=cur===0;document.getElementById('nB').disabled=cur===total-1;document.getElementById('tocL').innerHTML=S.map((s,i)=>`<div class="ti ${i===cur?'a':''}" onclick="go(${i});closeTOC()" style="color:${i===cur?'var(--accent)':'var(--textMid)'}"><span class="x">${String(i+1).padStart(2,'0')}</span>${e(s.title)}</div>`).join('')}
function rs(){st={objShown:new Set([0]),t0:0,t1:0,t2:0,takeaways:{},qi:0,qs:null,qa:false,qsc:0,qd:false}}rs();
function H(i,t){return `<div class="sh"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${e(t)}</div></div>`}
function F(i){return `<div class="ft"><span class="l">Medical Assistant Program • Week 5</span><span class="r">${i+1} / ${total}</span></div>`}

function rS(s){const m={title:rTitle,objectives:rObj,cards:rCards,twocol:rTwoCol,table:rTbl,tab:rTab,takeaways:rTake,quiz:rQuiz,end:rEnd};return m[s.type]?m[s.type](s,s.id):''}
function rTitle(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px;position:relative"><div style="position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:6px"><div style="width:24px;height:2px;background:var(--accent)"></div><span style="font-size:9px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase">${e(s.subtitle)}</span></div><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">${e(s.week)}</div><h1 style="font-family:var(--ff);font-size:${s.fs||34}px;font-weight:700;color:#fff;margin:0;line-height:1.25;white-space:pre-line">${e(s.title)}</h1><div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center">${s.tags.map(t=>`<span class="tag">${e(t)}</span>`).join('')}</div><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:2px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}">${j+1}</div><div style="font-size:9px;color:var(--text);line-height:1.35;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:4px;font-style:italic">Click to reveal</p>':''}</div>${F(i)}</div>`}
function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:6px">${s.cards.map(c=>`<div class="cd" style="border-left:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rTwoCol(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`).join('')}</div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[15].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[15].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script>
</body>
</html>
