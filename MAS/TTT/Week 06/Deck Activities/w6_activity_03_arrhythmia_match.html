<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Arrhythmia Match-Up</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1a0a0f,#28101a,#180a18);font-family:'DM Sans',sans-serif;padding:24px 16px;color:#ffe4ec}.wrap{max-width:740px;margin:0 auto}.header{text-align:center;margin-bottom:28px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#c07088;font-weight:600;font-size:15px}.badge{display:inline-block;margin-top:12px;background:#28101a;padding:6px 20px;border-radius:20px;border:1px solid rgba(45,212,191,.2);color:#2dd4bf;font-weight:800;font-size:15px}.cols{display:flex;gap:16px;flex-wrap:wrap}.col{flex:1 1 280px;min-width:220px}.cl{font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.cl.a{color:#fb7185}.cl.b{color:#2dd4bf}.card{padding:13px 16px;margin-bottom:7px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;border:2px solid transparent}.card.i{background:#28101a}.card.i.sel{background:rgba(251,113,133,.18);border-color:#fb7185}.card.i.done{background:rgba(52,211,153,.1);border-color:#34d399;opacity:.55;cursor:default}.card.m{background:#201020;font-weight:600;font-size:13px}.card.m.used{background:rgba(52,211,153,.1);border-color:#34d399;opacity:.55;cursor:default}.card.m.wrong{background:rgba(239,83,80,.18);border-color:#ef5350;animation:shake .35s}.dn{text-align:center;background:#28101a;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.dn .big{font-size:56px}.dn h2{font-weight:800;font-size:28px;margin:12px 0 8px}.dn p{color:#34d399;font-weight:700;font-size:16px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#2dd4bf;color:#1a0a0f;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📉</div><h1>Arrhythmia Match-Up</h1><p class="sub">Match each rhythm to its EKG characteristics</p><div class="badge" id="counter">0 / 8 matched</div></div>
<div id="game"><div class="cols"><div class="col" id="ic"><div class="cl a">💓 Rhythm</div></div><div class="col" id="mc"><div class="cl b">🎯 EKG Finding</div></div></div></div>
<div id="doneBox" class="dn" style="display:none"><div class="big">🏆</div><h2>All Matched!</h2><p>V-Tach, V-Fib, and Asystole are emergencies — recognize and act immediately.</p><button class="btn" onclick="resetGame()">🔄 Play Again</button></div></div>
<script>
const P=[{item:"Sinus Bradycardia",match:"HR < 60 bpm; normal P wave before each QRS"},{item:"Sinus Tachycardia",match:"HR > 100 bpm; one P wave before each QRS"},{item:"Atrial Flutter",match:"Sawtooth/picket-fence pattern; multiple flutter waves per QRS"},{item:"Atrial Fibrillation",match:"No distinct P waves; irregular chaotic baseline; irregular QRS spacing"},{item:"V-Tach",match:"Rapid wide QRS complexes; P waves absent; EMERGENCY"},{item:"V-Fib",match:"Chaotic wavy line; no organized waveform; NO PULSE — defibrillate"},{item:"Asystole",match:"Flat line — complete absence of electrical activity"},{item:"PVCs",match:"Ventricles fire early; wide bizarre QRS; >6/min is abnormal"}];
let sh,sel=null,mt={},ct=0;function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function render(){const ic=document.getElementById('ic'),mc=document.getElementById('mc');ic.innerHTML='<div class="cl a">💓 Rhythm</div>';mc.innerHTML='<div class="cl b">🎯 EKG Finding</div>';P.forEach((p,i)=>{const d=document.createElement('div');d.className='card i'+(mt[i]!==undefined?' done':sel===i?' sel':'');d.textContent=(mt[i]!==undefined?'✅ ':'')+p.item;if(mt[i]===undefined)d.onclick=()=>{sel=i;render()};ic.appendChild(d)});sh.forEach((m,i)=>{const d=document.createElement('div');const u=Object.values(mt).includes(i);d.className='card m'+(u?' used':'');d.textContent=(u?'✅ ':'')+m.match;d.id='m-'+i;if(!u)d.onclick=()=>tryM(i);mc.appendChild(d)});document.getElementById('counter').textContent=ct+' / '+P.length+' matched'}
function tryM(mi){if(sel===null)return;if(P[sel].match===sh[mi].match){mt[sel]=mi;ct++;sel=null;render();if(ct===P.length){document.getElementById('game').style.display='none';document.getElementById('doneBox').style.display='block'}}else{const el=document.getElementById('m-'+mi);el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),500)}}
function resetGame(){sel=null;mt={};ct=0;sh=shuffle(P);document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';render()}
sh=shuffle(P);render();
</script></body></html>
