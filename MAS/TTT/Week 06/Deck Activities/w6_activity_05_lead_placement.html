<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Lead Placement Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0e0a22,#181040,#0a0620);font-family:'Outfit',sans-serif;padding:24px 16px;color:#e8e0ff}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#9880c0;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#9880c0;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#a3e635);border-radius:10px;transition:width .4s}.question{background:#1c1040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#9880c0;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#9880c0;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#0e0a22;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📍</div><h1>Lead Placement Quiz</h1><p class="sub">Test your knowledge of electrode and lead placement</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"What color is the RIGHT ARM lead wire?",opts:["Black","Red","White","Green"],a:2,tip:"White = right arm. Black = left arm. Red = left leg. Green = right leg (ground)."},
{q:"V1 is placed at:",opts:["Left side sternum, 4th ICS","Right side sternum, 4th ICS","5th ICS, midclavicular line","5th ICS, midaxillary line"],a:1,tip:"V1 = right side of sternum, 4th intercostal space."},
{q:"Which precordial lead is placed BEFORE V3?",opts:["V2","V4","V5","V6"],a:1,tip:"Place V4 before V3! V3 goes midway between V2 and V4."},
{q:"V4 is placed at the:",opts:["4th ICS, right sternal border","4th ICS, left sternal border","5th ICS, midclavicular line","5th ICS, anterior axillary line"],a:2,tip:"V4 = left chest, 5th ICS, midclavicular line. V3 then goes between V2 and V4."},
{q:"The GREEN lead wire is placed on the:",opts:["Right arm","Left arm","Left leg","Right leg (ground)"],a:3,tip:"Green = right leg = ground lead. It doesn't record — it reduces interference."},
{q:"How many total leads does a standard EKG record?",opts:["6","10","12","15"],a:2,tip:"12 leads total: 6 limb leads (I, II, III, aVR, aVL, aVF) + 6 precordial (V1–V6). 10 electrodes."},
{q:"Limb leads I, II, and III are classified as:",opts:["Unipolar","Augmented","Bipolar","Precordial"],a:2,tip:"Leads I, II, III are bipolar (measure between two limbs). aVR, aVL, aVF are augmented unipolar."},
{q:"V6 is placed at the:",opts:["5th ICS, midclavicular line","5th ICS, anterior axillary line","5th ICS, midaxillary line","4th ICS, left sternal border"],a:2,tip:"V6 = left chest, 5th ICS, midaxillary line — the most lateral precordial lead."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=7?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Wrong electrode placement produces tracings that look like heart disease — accuracy is critical.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script></body></html>
