<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EKG Step-by-Step</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a1a10,#102818,#08140a);font-family:'Sora',sans-serif;padding:24px 16px;color:#e0f5e8}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#6aaa80;font-weight:600;font-size:15px}.badge{display:inline-block;margin-top:12px;background:#102818;padding:6px 20px;border-radius:20px;border:1px solid rgba(52,211,153,.2);color:#34d399;font-weight:800;font-size:15px}.fb{text-align:center;padding:12px 18px;margin-bottom:14px;border-radius:14px}.fb.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.2)}.fb.no{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.2)}.fb strong{font-weight:800;font-size:17px}.fb strong.ok{color:#4ade80}.fb strong.no{color:#fb7185}.fb .tip{color:#6aaa80;font-weight:600;font-size:13px;margin-top:6px}.sl{font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}.sl.d{color:#4ade80}.sl.p{color:#34d399}.pi{display:flex;align-items:center;gap:14px;padding:12px 18px;background:rgba(74,222,128,.06);border-radius:12px;margin-bottom:6px;border:1px solid rgba(74,222,128,.13)}.pn{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(74,222,128,.13);color:#4ade80;font-weight:800;font-size:18px;flex-shrink:0}.pt{font-weight:700;font-size:14px}.pool{display:grid;gap:8px}.po{padding:15px 20px;border-radius:14px;background:#1a3820;border:2px solid rgba(52,211,153,.12);font-weight:700;font-size:14px;cursor:pointer;transition:all .2s}.po:hover{filter:brightness(1.15)}.dn{text-align:center;background:#102818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.dn .big{font-size:56px}.dn h2{font-weight:800;font-size:28px;margin:12px 0 8px}.dn p{color:#6aaa80;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#34d399;color:#0a1a10;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📋</div><h1>EKG Step-by-Step</h1><p class="sub">Tap the steps in the correct order to perform an EKG</p><div class="badge" id="counter">0 / 6 placed</div></div>
<div id="game"></div>
<div id="doneBox" class="dn" style="display:none"><div class="big">🎉</div><h2>Perfect Procedure!</h2><p>Patient communication and preparation take longer than the test itself — a calm patient = cleaner tracing.</p><button class="btn" onclick="resetGame()">🔄 Play Again</button></div></div>
<script>
const ORDER=["Verify identity, undress/drape patient, remove jewelry & electronics","Prepare skin: clean with alcohol, clip hair if needed, position supine","Apply electrodes to all 10 sites; connect limb and precordial leads","Enter patient info, instruct to lie still and breathe normally, press AUTO","Check printout: 10mm standardization mark, Lead I positive R wave, no artifacts","Remove electrodes, inspect skin, have patient sit before standing, route to provider"];
const TIPS=["Two identifiers. Gown opens at front. Remove all interfering items.","No lotions or oils. Supine is standard; semi-Fowler's if patient can't lie flat.","Fleshy areas only. Avoid crossing lead wires. Cord points away from patient.","Machine records all 12 leads in three-channel format automatically.","If Lead I R wave is negative, limb leads are reversed. Recheck.","EKG becomes part of the permanent legal medical record once documented."];
let pool,placed,fbData;function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function init(){pool=shuffle(ORDER);placed=[];fbData=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';render()}
function render(){document.getElementById('counter').textContent=placed.length+' / '+ORDER.length+' placed';const g=document.getElementById('game');let h='';if(fbData){h+='<div class="fb '+(fbData.ok?'ok':'no')+'"><strong class="'+(fbData.ok?'ok':'no')+'">'+(fbData.ok?'✅ Correct!':'❌ Not the next step!')+'</strong>';if(fbData.tip)h+='<div class="tip">'+fbData.tip+'</div>';h+='</div>'}if(placed.length>0){h+='<div style="margin-bottom:20px"><div class="sl d">✅ Completed</div>';placed.forEach((s,i)=>{h+='<div class="pi"><div class="pn">'+(i+1)+'</div><div class="pt">'+s+'</div></div>'});h+='</div>'}if(pool.length>0){h+='<div class="sl p">📋 Tap step #'+(placed.length+1)+'</div><div class="pool">';pool.forEach((s,i)=>{h+='<div class="po" onclick="pick('+i+')">'+s+'</div>'});h+='</div>'}g.innerHTML=h}
function pick(idx){const step=pool[idx];const ni=placed.length;if(step===ORDER[ni]){placed.push(step);pool=pool.filter((_,i)=>i!==idx);fbData={ok:true,tip:TIPS[ni]};render();if(placed.length===ORDER.length)setTimeout(()=>{document.getElementById('game').style.display='none';document.getElementById('doneBox').style.display='block'},1000);else setTimeout(()=>{fbData=null;render()},1500)}else{fbData={ok:false};render();setTimeout(()=>{fbData=null;render()},1200)}}
function resetGame(){init()}init();
</script></body></html>
