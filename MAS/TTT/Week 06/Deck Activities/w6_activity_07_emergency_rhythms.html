<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Emergency Rhythm Response</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#1a0808,#2a1010,#180808);font-family:'Lexend',sans-serif;padding:24px 16px;color:#ffe0e0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#c07070;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#c07070;font-weight:700;font-size:14px}.topbar .sc{color:#ef4444;font-weight:800;font-size:14px}.bar{height:6px;background:#301818;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#ef4444,#fbbf24);border-radius:10px;transition:width .4s}.question{background:#221010;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #ef4444}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#301818;border:2px solid #301818;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.1)}.opt .letter{color:#ef4444;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#221010}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#c07070;font-weight:600;font-size:14px}.done{text-align:center;background:#221010;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#c07070;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#ef4444;color:#fff;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🚨</div><h1>Emergency Rhythm Response</h1><p class="sub">What's the immediate action for each emergent EKG finding?</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"V-Fib on the monitor: chaotic wavy line, patient unresponsive, no pulse.",opts:["Give oxygen and wait","Call 911, begin CPR, defibrillate","Reattach the leads — probably artifact","Run another EKG to confirm"],a:1,tip:"V-Fib = no pulse, unconscious within seconds. CPR + defibrillation is definitive treatment."},
{q:"V-Tach: rapid wide QRS complexes. Patient is conscious but dizzy.",opts:["Wait for it to resolve on its own","Report to provider immediately — may need meds or cardioversion","Have the patient take deep breaths","Rerun the EKG in 15 minutes"],a:1,tip:"V-Tach is life-threatening even with a pulse. Can progress to V-Fib without treatment."},
{q:"The EKG shows a flat line (asystole). The patient is sitting up and talking to you.",opts:["Call 911 and begin CPR","Check that electrodes are attached — likely a disconnected lead","Pronounce the patient","Give epinephrine immediately"],a:1,tip:"First check the patient! If awake and talking, a flat line means a lead is disconnected. Reattach and recheck."},
{q:"A-Fib on the tracing: irregular QRS spacing, no P waves. Patient feels palpitations.",opts:["This is normal — ignore it","Notify the provider — A-Fib carries a high stroke risk","Tell the patient to exercise to reset the rhythm","Disconnect the monitor"],a:1,tip:"A-Fib requires provider notification. High stroke risk — often requires blood thinners."},
{q:"You notice >6 PVCs per minute on a patient's tracing. What do you do?",opts:["Occasional PVCs are always benign — ignore them","Report to provider — >6/min is an abnormal finding","Rerun the EKG — it must be artifact","Ask the patient to cough"],a:1,tip:"Occasional PVCs are common, but >6 per minute is abnormal and must be reported."},
{q:"During stress testing, the patient reports sudden chest pain and SOB.",opts:["Encourage them to push through it","Stop the test and notify the provider immediately","Reduce the treadmill speed slightly","Wait and see if it passes"],a:1,tip:"Chest pain or SOB during stress testing = stop immediately. Cardiac arrest is the most serious risk."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Scenario '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2200)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=5?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>V-Tach, V-Fib, and Asystole are emergencies. Recognize them and act — don\'t wait.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script></body></html>
