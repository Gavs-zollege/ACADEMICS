<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Patient Prep Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0d1a0f,#112010,#0a150c);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#e6f7ea}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:700;font-size:30px;margin:8px 0 4px}.sub{color:#7aab88;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7aab88;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:700;font-size:14px}.bar{height:6px;background:#1c3820;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:10px;transition:width .4s}.question{background:#142818;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a3e635}.question p{font-weight:700;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1c3820;border:2px solid #1c3820;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a3e635;font-weight:700;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#142818}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#7aab88;font-weight:600;font-size:14px}.done{text-align:center;background:#142818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:700;font-size:28px;margin:12px 0}.done p{color:#7aab88;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a3e635;color:#0d1a0f;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🛏️</div><h1>Patient Prep Quiz</h1><p class="sub">Test your knowledge of EKG preparation and patient care</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"The standard position for an EKG is:",opts:["Prone (face down)","Sitting upright at 90°","Supine (lying flat on back)","Standing"],a:2,tip:"Supine is standard. Semi-Fowler's (45°) if the patient can't lie flat (COPD, cardiac)."},
{q:"The patient's gown should open at the:",opts:["Back","Front","Side","It doesn't matter"],a:1,tip:"Front opening provides access to the chest for electrode placement."},
{q:"Before applying electrodes, you should:",opts:["Apply lotion for conductivity","Clean sites with alcohol; clip hair if needed","Wet the skin with cold water","Apply electrodes over clothing"],a:1,tip:"No lotions/oils/powders. Wipe with alcohol. Clip (don't shave) hair for adhesion."},
{q:"The EKG is completely painless because:",opts:["Local anesthesia is applied","The machine only records — no electricity enters the body","The voltage is too low to feel","Electrodes have numbing gel"],a:1,tip:"Explain this to patients to reduce anxiety. The machine RECORDS only."},
{q:"If a patient can't lie flat due to COPD, you should position them in:",opts:["Prone position","Trendelenburg","Semi-Fowler's (45° head elevation)","Left lateral recumbent"],a:2,tip:"Semi-Fowler's accommodates patients with respiratory or cardiac conditions."},
{q:"After the EKG, you should have the patient:",opts:["Stand up immediately","Sit before standing to prevent syncope","Lie still for 10 more minutes","Walk around the room"],a:1,tip:"Sit before standing — prevents vasovagal syncope (fainting)."},
{q:"If the patient reports chest pain after the EKG, you should:",opts:["Tell them it's normal","Notify the provider immediately","Have them take deep breaths","Schedule a follow-up next week"],a:1,tip:"Take chest pain or SOB seriously — notify the provider immediately."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>A calm, well-informed patient produces a cleaner tracing every time.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script></body></html>
