<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Holter & Monitoring Quiz</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Inter',sans-serif;color:#FFF}.wrap{max-width:640px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}.header{text-align:center;margin-bottom:8px;flex-shrink:0}.header .icon{font-size:32px}h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:4px 0 2px}.sub{color:#94A3B8;font-weight:600;font-size:13px}.game-area{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}.topbar{display:flex;justify-content:space-between;margin-bottom:8px}.topbar .qn{color:#94A3B8;font-weight:700;font-size:12px}.topbar .sc{color:#FBBF24;font-weight:800;font-size:12px}.bar{height:3px;background:rgba(255,255,255,0.1);border-radius:10px;margin-bottom:10px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#2DD4BF,#5EEAD4);border-radius:10px;transition:width .4s}.question{background:#132F42;padding:12px 16px;border-radius:12px;margin-bottom:10px;border-left:3px solid #2DD4BF}.question p{font-weight:800;font-size:14px;line-height:1.55;font-family:'Plus Jakarta Sans',sans-serif}.opts{display:grid;gap:6px}.opt{padding:10px 14px;border-radius:10px;background:#132F42;border:1.5px solid rgba(255,255,255,0.12);font-weight:700;font-size:13px;cursor:pointer;transition:all .18s;text-align:left;color:#F1F5F9}.opt:hover{background:#1A3A50;border-color:rgba(255,255,255,0.22)}.opt .letter{color:#2DD4BF;font-weight:800;margin-right:10px}.opt.correct{background:rgba(52,211,153,.15);border-color:#34D399}.opt.wrong{background:rgba(248,113,113,.15);border-color:#F87171}.opt.dimmed{opacity:0.4;cursor:default}.opt .tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:auto;float:right;text-transform:uppercase;letter-spacing:.5px}.opt .tag-c{background:rgba(52,211,153,0.15);color:#34D399}.opt .tag-w{background:rgba(248,113,113,0.15);color:#F87171}.tip{margin-top:8px;padding:10px 14px;border-radius:10px;font-size:12px;line-height:1.5}.tip.ok{background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.2)}.tip.no{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.2)}.tip strong{font-size:13px;display:block;margin-bottom:2px}.tip strong.ok{color:#34D399}.tip strong.no{color:#FCA5A5}.tip span{color:#E2E8F0;font-weight:500}.next-btn{margin-top:8px;width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:transform .12s}.next-btn:hover{transform:translateY(-1px)}.done{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);margin:auto 0}.done .big{font-size:40px}.done h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;margin:8px 0 4px}.done p{color:#E2E8F0;font-weight:500;font-size:13px;margin-bottom:16px;line-height:1.5}.btn{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}.btn-redo{padding:10px 28px;border:1.5px solid #5EEAD4;border-radius:10px;background:transparent;color:#5EEAD4;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:8px}.btn-redo:hover{background:rgba(94,234,212,0.1);transform:translateY(-1px)}</style></head>
<body><div class="wrap"><div class="header"><div class="icon">📱</div><h1>Holter & Monitoring Quiz</h1><p class="sub">Stress tests, Holter monitors & event monitoring</p></div><div id="game" class="game-area"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
var ORIG = [{"q": "A Holter monitor is typically worn for:", "opts": ["1 hour", "24 to 72 hours", "1 week minimum", "30 minutes"], "a": 1, "tip": "24–72 hours per provider order. Event monitors can be worn even longer."}, {"q": "What must the patient keep while wearing a Holter monitor?", "opts": ["A food diary", "An activity diary with times and descriptions", "A medication log only", "Nothing — the device records everything"], "a": 1, "tip": "The diary is critical — accurate results depend on correlating symptoms with activities."}, {"q": "While wearing a Holter monitor, the patient should NOT:", "opts": ["Exercise", "Sleep", "Shower or go near metal detectors", "Drive a car"], "a": 2, "tip": "No showers, no metal detectors, no repositioning electrodes. Resume all other normal activities."}, {"q": "Stress testing evaluates how the heart responds to:", "opts": ["Medications", "Physical exertion", "Emotional stress", "Sleep"], "a": 1, "tip": "Patient exercises on treadmill/bike with continuous cardiac monitoring."}, {"q": "The most serious risk of stress testing is:", "opts": ["Fatigue", "Muscle soreness", "Cardiac arrest", "Dehydration"], "a": 2, "tip": "Stress tests are done where emergency equipment is immediately available."}, {"q": "For patients who cannot exercise during a stress test:", "opts": ["The test is cancelled", "A medication mimics the physiological stress on the heart", "They use lighter weights instead", "Someone moves their legs for them"], "a": 1, "tip": "Pharmacological stress test: medication produces the same cardiac response as exercise."}, {"q": "An echocardiogram uses ___ to evaluate the heart.", "opts": ["Radiation", "Ultrasound (no radiation)", "Radioactive dye", "Electrical impulses"], "a": 1, "tip": "Echo = ultrasound-based. Assesses structure, valves, blood flow. No radiation."}];
var QS=ORIG.slice(),ci=0,score=0,chosen=null,missedIdx=[];
function renderQ(){var g=document.getElementById("game"),q=QS[ci];var h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach(function(o,i){var cls="opt",tag="";if(chosen!==null){if(i===q.a){cls+=" correct";tag='<span class="tag tag-c">'+(chosen===i?"✓ Correct":"✓ Correct Answer")+"</span>";}else if(chosen===i){cls+=" wrong";tag='<span class="tag tag-w">✗ Wrong</span>';}else cls+=" dimmed";}h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':"")+"><span class=\"letter\">"+String.fromCharCode(65+i)+"</span>"+o+tag+"</div>";});h+="</div>";if(chosen!==null){var ok=chosen===q.a;h+='<div class="tip '+(ok?"ok":"no")+'"><strong class="'+(ok?"ok":"no")+'">'+(ok?"✅ Correct!":"❌ Not quite!")+"</strong><span>"+q.tip+"</span></div>";h+='<button class="next-btn" onclick="nextQ()">Next →</button>';}g.innerHTML=h;}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;else missedIdx.push(ci);renderQ();}
function nextQ(){if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()}
function showDone(){document.getElementById("game").style.display="none";var d=document.getElementById("doneBox");d.style.display="block";var html='<div class="big">'+(score>=6?"🏆":"💪")+"</div><h2>"+score+"/"+QS.length+" Correct!</h2><p>The Holter monitor is only as useful as the diary the patient keeps. Education = data quality.</p>";html+='<button class="btn" onclick="reset()">Play Again</button>';if(missedIdx.length>0)html+='<br><button class="btn-redo" onclick="redo()">Redo Missed ('+missedIdx.length+")</button>";d.innerHTML=html;}
function reset(){QS=ORIG.slice();ci=0;score=0;chosen=null;missedIdx=[];document.getElementById("game").style.display="block";document.getElementById("doneBox").style.display="none";renderQ()}
function redo(){var r=[];for(var i=0;i<missedIdx.length;i++)r.push(QS[missedIdx[i]]);QS=r;ci=0;score=0;chosen=null;missedIdx=[];document.getElementById("game").style.display="block";document.getElementById("doneBox").style.display="none";renderQ()}
renderQ();
</script></body></html>
