<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Equipment & Documentation</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#0a1520,#0e1e30,#081520);font-family:'Fredoka',sans-serif;padding:24px 16px;color:#e0f0ff}.wrap{max-width:600px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:700;font-size:28px;margin:8px 0 4px}.sub{color:#6898b8;font-weight:500;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .ct{color:#6898b8;font-weight:700;font-size:14px}.topbar .sc{color:#22d3ee;font-weight:700;font-size:14px}.bar{height:6px;background:#1a3048;border-radius:10px;margin-bottom:24px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#22d3ee,#f97066);border-radius:10px;transition:width .4s}.statement{background:#112030;padding:24px 28px;border-radius:20px;margin-bottom:24px;border-left:4px solid #22d3ee}.statement p{font-weight:600;font-size:19px;line-height:1.7}.blank{display:inline-block;padding:4px 18px;border-radius:10px;margin:0 4px;font-weight:700;min-width:50px;text-align:center}.blank.empty{background:rgba(34,211,238,.15);color:#fbbf24;border-bottom:3px solid #fbbf24}.blank.ok{background:rgba(74,222,128,.2);color:#4ade80;border-bottom:3px solid #4ade80}.blank.no{background:rgba(251,113,133,.2);color:#fb7185;border-bottom:3px solid #fb7185}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid button{padding:14px 18px;border-radius:14px;background:#1a3048;border:2px solid #1a3048;color:#e0f0ff;font-weight:600;font-size:17px;cursor:pointer;font-family:inherit;transition:all .2s}.grid button:hover{filter:brightness(1.15)}.grid button.ok{background:rgba(74,222,128,.13);border-color:#4ade80}.grid button.no{background:rgba(251,113,133,.13);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#112030}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#6898b8;font-weight:500;font-size:14px}.done{text-align:center;background:#112030;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:700;font-size:28px;margin:12px 0}.done p{color:#6898b8;font-weight:500;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#22d3ee;color:#0a1520;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">⚙️</div><h1>Equipment & Documentation</h1><p class="sub">Fill in the blanks about EKG machines and result handling</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const ITEMS=[
{text:"The calibration box should measure |___| mm tall at standard settings.",answer:"10",opts:["5","10","15","25"],tip:"10 mm tall × 5 mm wide. Confirms gain and paper speed are correct."},
{text:"Standard EKG paper speed is |___| mm/second.",answer:"25",opts:["10","15","25","50"],tip:"25 mm/sec is standard. Changes to speed affect all time measurements."},
{text:"Each small square on EKG paper represents |___| seconds.",answer:"0.04",opts:["0.02","0.04","0.1","0.2"],tip:"0.04 seconds per small square. 5 small squares = 1 large square = 0.2 seconds."},
{text:"EKG graph paper is sensitive to |___| and pressure.",answer:"heat",opts:["light","heat","cold","moisture"],tip:"Heat- and pressure-sensitive. Don't press fingernails into it. Handle carefully."},
{text:"Once documented, the EKG becomes part of the patient's permanent |___| record.",answer:"legal medical",opts:["insurance","legal medical","billing","personal"],tip:"It's a legal document. Follow all facility policies for storage and retention."},
{text:"EKG machines are self-|___| — they reset to defaults each time powered on.",answer:"calibrating",opts:["charging","calibrating","updating","cleaning"],tip:"Self-calibrating software runs a self-check on startup. Still verify the calibration box."},
{text:"Standard gain setting is |___| mm per millivolt (mm/mV).",answer:"10",opts:["5","10","20","25"],tip:"10 mm/mV is standard gain (amplitude). This determines the height of waveforms."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),it=ITEMS[ci];const parts=it.text.split('|___|');let bc='blank empty',bt='???';if(chosen!==null){bc='blank '+(chosen===it.answer?'ok':'no');bt=chosen}let h='<div class="topbar"><span class="ct">'+(ci+1)+'/'+ITEMS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/ITEMS.length*100)+'%"></div></div>';h+='<div class="statement"><p>'+parts[0]+'<span class="'+bc+'">'+bt+'</span>'+parts[1]+'</p></div>';h+='<div class="grid">';it.opts.forEach(o=>{let cls='';if(chosen===o)cls=o===it.answer?'ok':'no';h+="<button class=\""+cls+"\" "+(chosen===null?"onclick=\"pick('"+o.replace(/'/g,"\\'")+"')\"":"")+">"+o+"</button>"});h+='</div>';if(chosen!==null){const ok=chosen===it.answer;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Answer: '+it.answer)+'</strong><span>'+it.tip+'</span></div>'}g.innerHTML=h}
function pick(o){if(chosen!==null)return;chosen=o;if(o===ITEMS[ci].answer)score++;renderQ();setTimeout(()=>{if(ci+1<ITEMS.length){ci++;chosen=null;renderQ()}else showDone()},1800)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+ITEMS.length+' Correct!</h2><p>Accuracy and documentation are non-negotiable. The EKG is a permanent part of the medical record.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script></body></html>
