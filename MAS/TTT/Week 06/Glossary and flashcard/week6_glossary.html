<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 6 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 6 Glossary</h1>
  <p class="sub">EKG & Cardiovascular Testing</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"EKG Fundamentals",color:"#E05555",terms:[
    {term:"Electrocardiogram (EKG)",def:"The printed/digital visual representation of the heart's electrical activity over time."},
    {term:"Electrocardiograph",def:"The machine that detects and records the heart's electrical impulses. It only listens and records."},
    {term:"Cardiac Cycle",def:"One complete heartbeat — atrial contraction, ventricular contraction, and full relaxation."},
    {term:"Depolarization",def:"Electrical event causing cardiac muscle to contract. Atrial = P wave; Ventricular = QRS complex."},
    {term:"Repolarization",def:"Recovery phase after contraction. Ventricular repolarization produces the T wave."},
    {term:"12-Lead EKG",def:"Standard EKG using 10 electrodes to record from 12 different angles simultaneously."},
    {term:"Multichannel EKG Machine",def:"Monitors all 12 leads simultaneously. Three-channel format most common in ambulatory care."},
    {term:"Single-Channel EKG Machine",def:"Older machine recording one lead at a time on a continuous strip."},
    {term:"Standardization Mark",def:"Calibration box — must measure 10 mm tall × 5 mm wide to confirm correct settings."},
  ]},
  {name:"Waveforms",color:"#8B6AAE",terms:[
    {term:"P Wave",def:"First waveform — represents atrial depolarization (atria contract, push blood into ventricles)."},
    {term:"QRS Complex",def:"Large waveform — ventricular depolarization (ventricles contract, pump blood out)."},
    {term:"T Wave",def:"Follows QRS — represents ventricular repolarization (ventricles relax and reset)."},
    {term:"U Wave",def:"Small wave after T wave, not always visible. Represents His/Purkinje fiber repolarization."},
    {term:"PR Interval",def:"Time from P wave start to Q wave start. Conduction time through the AV node."},
    {term:"QT Interval",def:"Q wave start to T wave end. Full ventricular depolarization + repolarization duration."},
    {term:"ST Segment",def:"Between S wave end and T wave start. Elevation/depression can indicate ischemia or infarction."},
    {term:"R Wave",def:"First upward deflection in QRS. Should be positive in Lead I; negative = leads attached incorrectly."},
  ]},
  {name:"Leads & Placement",color:"#4A90B8",terms:[
    {term:"Electrode",def:"Adhesive pad with electrolyte gel applied to skin to detect heart's electrical impulses."},
    {term:"Lead Wire",def:"Cable connecting an electrode to the EKG machine. Color-coded for identification."},
    {term:"Bipolar Lead",def:"Records electrical difference between two electrodes. Leads I, II, III are bipolar limb leads."},
    {term:"Unipolar Lead",def:"Records from a single positive electrode with a calculated reference. aVR, aVL, aVF and V1–V6."},
    {term:"Augmented Leads",def:"aVR, aVL, aVF — three unipolar limb leads with electronically amplified signals."},
    {term:"Precordial Leads (V1–V6)",def:"Six chest leads recording from the front of the heart. Placed using anatomical landmarks."},
    {term:"Intercostal Space (ICS)",def:"Space between ribs used as landmarks for chest electrode placement."},
    {term:"Midclavicular Line",def:"Vertical line from mid-clavicle. Used to position V4 at the 5th ICS."},
    {term:"Anterior Axillary Line",def:"Vertical line along front edge of armpit. Used to position V5."},
    {term:"Midaxillary Line",def:"Vertical line through center of armpit. Used to position V6."},
    {term:"Lead Wire Color Code",def:"White=RA, Black=LA, Red=LL, Green=RL. V1–V6: red, yellow, green, blue, orange, purple."},
  ]},
  {name:"Arrhythmias",color:"#E74C6F",terms:[
    {term:"Arrhythmia / Dysrhythmia",def:"Any deviation from normal heart rhythm. Ranges from benign to life-threatening."},
    {term:"Sinus Rhythm",def:"Normal rhythm from SA node — one P wave before each QRS, rate 60–100 bpm."},
    {term:"Sinus Bradycardia",def:"Normal pattern but rate <60 bpm. Often benign in athletes."},
    {term:"Sinus Tachycardia",def:"Normal pattern but rate >100 bpm. Causes: anxiety, fever, pain, dehydration."},
    {term:"Sinus Arrest",def:"SA node fails to fire, creating a pause. Significant if symptomatic or >6 seconds."},
    {term:"Atrial Flutter",def:"Rapid regular atrial firing producing sawtooth pattern with multiple flutter waves per QRS."},
    {term:"Atrial Fibrillation",def:"Chaotic atrial firing — irregularly irregular QRS rhythm. Elevated stroke risk."},
    {term:"PAC",def:"Premature Atrial Contraction — ectopic atrial beat. >6/min is abnormal."},
    {term:"PVC",def:"Premature Ventricular Contraction — wide abnormal QRS. >6/min warrants provider notification."},
    {term:"Ectopic Beat",def:"Any heartbeat originating outside the SA node. PACs and PVCs are ectopic beats."},
  ]},
  {name:"Emergent Rhythms",color:"#E2B94C",terms:[
    {term:"Ventricular Tachycardia",def:"Rapid rhythm from ventricular ectopic site — wide QRS, no P waves, >100 bpm. Life-threatening."},
    {term:"Ventricular Fibrillation",def:"Completely disorganized ventricular activity — no pulse, chaotic baseline. CPR + defibrillation."},
    {term:"Asystole",def:"No electrical activity — flat line. Confirm patient status and electrode connections first."},
    {term:"Cardioversion",def:"Synchronized electrical shock to restore normal rhythm. Used when patient has a pulse."},
    {term:"Defibrillation",def:"Unsynchronized shock for pulseless V-fib or V-tach. Must be performed immediately."},
  ]},
  {name:"Artifacts",color:"#1A8A7D",terms:[
    {term:"Artifact",def:"Any false signal on an EKG that doesn't represent true cardiac activity. Must be eliminated."},
    {term:"Somatic Tremor",def:"Artifact from muscle movement — jagged spikes. Warm and calm the patient to reduce."},
    {term:"AC Interference",def:"60-cycle artifact from electrical interference — uniform fuzzy spiking. Use grounded plug."},
    {term:"Wandering Baseline",def:"Baseline drifts up/down. Caused by breathing, poor electrode contact, or skin lotion."},
    {term:"Interrupted Baseline",def:"Complete break in tracing — flat line from disconnected lead wire. Reattach and reassess."},
  ]},
  {name:"Patient Prep",color:"#6B7B8D",terms:[
    {term:"Supine Position",def:"Standard EKG position — lying flat on back, face up, arms at sides."},
    {term:"Semi-Fowler's Position",def:"Head elevated ~45°. Used when patient can't lie flat (COPD, CHF). Document position used."},
    {term:"Electrolyte Gel",def:"Conductive substance on electrodes facilitating electrical impulse transmission."},
    {term:"Gain (Amplitude)",def:"Controls waveform height. Standard: 10 mm/mV. Changes alter tracing appearance."},
    {term:"Paper Speed",def:"Standard: 25 mm/sec. Each small square = 0.04 seconds. Changes alter waveform width."},
    {term:"EKG Graph Paper",def:"Heat-sensitive paper. Vertical = amplitude; Horizontal = time. Small square = 1 mm."},
    {term:"AUTO Button",def:"Inserts standardization mark and records full 12-lead EKG in correct format."},
  ]},
  {name:"Ambulatory Monitoring",color:"#4CAF90",terms:[
    {term:"Ambulatory Cardiac Monitoring",def:"Records heart activity during normal daily activities to capture intermittent arrhythmias."},
    {term:"Holter Monitor",def:"Portable monitor worn 24–72 hours recording every heartbeat. Patient keeps an activity diary."},
    {term:"Event Monitor",def:"Worn days to weeks — patient-activated when symptoms occur. For infrequent arrhythmias."},
    {term:"Activity Diary",def:"Written log of activities and symptoms during monitoring. Correlates symptoms with EKG."},
    {term:"Stress Test",def:"Patient exercises on treadmill/bike while monitored. Assesses heart response to exertion."},
    {term:"Pharmacological Stress Test",def:"Medication mimics exercise effects for patients who can't safely exercise."},
    {term:"Thallium",def:"Radioactive tracer injected during stress tests to evaluate heart muscle blood flow."},
    {term:"Echocardiogram",def:"Ultrasound of the heart evaluating structure, valve function, and blood flow. No radiation."},
    {term:"Telemetry",def:"Continuous real-time cardiac monitoring in hospital settings via wireless transmission."},
  ]},
  {name:"Equipment & Docs",color:"#C4A84D",terms:[
    {term:"Self-Calibration",def:"Automatic calibration when EKG machine powers on. MA should still verify standardization mark."},
    {term:"Calibration Box",def:"Square at beginning of tracing — 10 mm × 5 mm confirms correct gain and paper speed."},
    {term:"EHR Integration",def:"EKG machines can transmit tracings directly to the electronic health record."},
    {term:"Legal Medical Record",def:"Once documented, an EKG tracing becomes part of the permanent legal medical record."},
    {term:"Hard Copy (EKG)",def:"Printed paper tracing given to provider for interpretation, then scanned into EHR or filed."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
