kground:var(--blueLight);border-color:var(--blue)}.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}. <script>
const S=[{"id":0,"type":"title","title":"Understanding Heart Function\nThrough EKG and Testing","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Six","tags":["Waveforms","Lead Placement","Arrhythmias","Holter Monitoring"],"fs":28},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Describe preparing patients for EKG or ambulatory cardiac monitoring","Identify types of leads and correct anatomical electrode placement","Identify the steps in performing EKG tests","Recognize abnormal or emergent EKG results — arrhythmias and artifacts","Describe assisting with stress testing, Holter monitoring, and event monitoring","Explain transmitting EKG results to the EMR, paper chart, and provider","Describe proper functioning and storage of EKG equipment"]},{"id":2,"type":"twocol","title":"EKG Overview & the Cardiac Cycle","lt":"What Is an EKG?","lc":"var(--warm)","li":[{"l":"Electrocardiograph","d":"The instrument — the machine that records electrical activity."},{"l":"Electrocardiogram","d":"The result — visual representation on paper or digital."},{"l":"Cardiac cycle","d":"One complete heartbeat: atrial contraction, ventricular contraction, relaxation."},{"l":"Why it matters","d":"One of most frequently performed tests. Accurate technique = accurate diagnosis."},{"l":"MA's role","d":"Prepare patient, apply electrodes/leads, run test, check tracing, route to provider."}],"rt":"Electrical Conduction","rc":"var(--blue)","ri":[{"l":"SA Node (pacemaker)","d":"Initiates every normal heartbeat from right atrium."},{"l":"AV Node (gatekeeper)","d":"Short delay before passing impulse to ventricles."},{"l":"Bundle of His","d":"Carries impulse into ventricular septum; splits into branches."},{"l":"Purkinje Fibers","d":"Distribute impulse throughout ventricles causing contraction."},{"l":"EKG connection","d":"Each conduction step = a waveform on the tracing."}]},{"id":3,"type":"cards","title":"EKG Waveforms, Intervals & Segments","cols":4,"cards":[{"title":"P Wave","desc":"Atrial depolarization — atria contracting","color":"#4A90D9"},{"title":"QRS Complex","desc":"Ventricular depolarization — ventricles pumping blood","color":"#D94F4F"},{"title":"T Wave","desc":"Ventricular repolarization — ventricles recovering","color":"#3DAE8E"},{"title":"U Wave","desc":"Not always visible. Bundle of His/Purkinje repolarization","color":"#8896A6"},{"title":"PR Interval","desc":"Start of P to start of Q — atrial to ventricular depolarization time","color":"#E8853D"},{"title":"QT Interval","desc":"Start of Q to end of T — full ventricular depolarization + repolarization","color":"#8B6FC0"},{"title":"ST Segment","desc":"End of S to start of T — pause between depolarization and repolarization","color":"#B8860B"},{"title":"ST Changes","desc":"Elevation or depression may indicate cardiac injury — report immediately","color":"#D94F4F"}]},{"id":4,"type":"tab","title":"Recognizing Abnormal Rhythms","tk":"0","tabs":[{"n":"Bradycardia/Tachycardia","c":"#4A90D9","items":["Sinus Bradycardia: HR <60 bpm. Normal P before each QRS. Often benign in athletes.","Sinus Tachycardia: HR >100 bpm. One P before each QRS. Causes: anxiety, fever, pain.","Sinus Arrest: SA node fails to fire — pause in rhythm. Concerning if >6 seconds."]},{"n":"Atrial Arrhythmias","c":"#E8853D","items":["Atrial Flutter: single site fires rapidly. Sawtooth/picket-fence pattern. Rate-control meds.","A-Fib: rapid, disorganized firing. No distinct P waves. Irregular QRS spacing. Stroke risk — blood thinners.","PACs: atria fire too early. Usually benign. >6/min = abnormal — report."]},{"n":"Ventricular (EMERGENT)","c":"#D94F4F","items":["V-Tach: rapid, wide QRS complexes. No organized P waves. May or may not have pulse. LIFE-THREATENING.","V-Fib: chaotic, disorganized. Ventricles quiver. NO pulse. CPR + defibrillation immediately.","Asystole: flat line. No electrical activity. Check patient first — may be disconnected lead. If unresponsive → 911 + CPR.","PVCs: ventricles fire too early. Occasional = often benign. >6/min = report."]}]},{"id":5,"type":"cards","title":"Artifacts & How to Fix Them","cols":2,"cards":[{"title":"Somatic Tremor","desc":"Irregular spikes from muscle movement (shivering, Parkinson's, anxiety). Fix: warm patient, reduce anxiety, hands under buttocks.","color":"#D94F4F"},{"title":"AC (60-Cycle) Interference","desc":"Regular uniform spiking — fuzzy thick lines. Poor grounding or nearby electronics. Fix: 3-prong plug, no crossed wires, move bed.","color":"#E8853D"},{"title":"Wandering Baseline","desc":"Tracing drifts up/down from center. Breathing movement or poor electrode contact. Fix: clean skin, no lotions, check adhesion.","color":"#4A90D9"},{"title":"Interrupted Baseline","desc":"Flat line where waveforms should be — complete break. Disconnected/broken lead wire. Fix: reattach, inspect all wires regularly.","color":"#8B6FC0"}]},{"id":6,"type":"twocol","title":"Preparing the Patient for an EKG","lt":"Before & During the Test","lc":"var(--accent)","li":[{"l":"Verify identity","d":"Two identifiers — full name and DOB."},{"l":"Undress & drape","d":"Waist up; ankles accessible. Gown opens front. Extra draping for privacy."},{"l":"Remove interference","d":"Jewelry, cell phones, electronics near patient."},{"l":"Position","d":"Supine standard. Semi-Fowler's (45°) if patient can't lie flat."},{"l":"Skin prep","d":"No lotions. Wipe with alcohol. Clip chest hair if needed."},{"l":"During test","d":"Lie still, breathe normally, don't talk. Completely painless."}],"rt":"After the Test","rc":"var(--blue)","ri":[{"l":"Check standardization","d":"Mark must be 10 mm tall."},{"l":"Lead I R wave","d":"Must be positive deflection — negative = limb leads reversed."},{"l":"Remove electrodes","d":"Inspect skin for irritation at each site."},{"l":"Patient safety","d":"Sit before standing to prevent syncope."},{"l":"Chest pain/SOB","d":"Take seriously — notify provider immediately."},{"l":"Route results","d":"Print hard copy and/or save to EHR. Part of legal medical record."}]},{"id":7,"type":"twocol","title":"Lead Types & Electrode Placement","lt":"Limb Leads (6 total)","lc":"var(--warm)","li":[{"l":"Lead I (Bipolar)","d":"Right arm → Left arm"},{"l":"Lead II (Bipolar)","d":"Right arm → Left leg"},{"l":"Lead III (Bipolar)","d":"Left arm → Left leg"},{"l":"aVR/aVL/aVF","d":"Augmented unipolar leads from RA, LA, LL respectively"},{"l":"Wire colors","d":"White=RA, Black=LA, Red=LL, Green=RL(ground)"}],"rt":"Precordial Leads (V1–V6)","rc":"var(--blue)","ri":[{"l":"V1","d":"Right sternum, 4th intercostal space"},{"l":"V2","d":"Left sternum, directly across from V1, 4th ICS"},{"l":"V4 (place before V3)","d":"Left chest, 5th ICS, midclavicular line"},{"l":"V3","d":"Midway between V2 and V4"},{"l":"V5","d":"Left chest, 5th ICS, anterior axillary line"},{"l":"V6","d":"Left chest, 5th ICS, midaxillary line"}]},{"id":8,"type":"step","title":"Running the EKG — Step by Step","steps":[{"n":1,"t":"Apply electrodes & connect leads","d":"Attach to fleshy areas at all 10 sites. Connect limb and precordial leads in correct color order. Avoid crossing wires."},{"n":2,"t":"Set up the machine","d":"Power cord away from patient. Plug in lead cable. Enter patient name, ID, age, sex, weight, height."},{"n":3,"t":"Run the recording","d":"Patient lies still, breathes normally, doesn't speak. Press AUTO. Machine records all 12 leads in three-channel format."},{"n":4,"t":"Check the printout","d":"Standardization mark = 10 mm. Lead I R wave positive. No artifacts. Visible P-QRS-T waveforms."},{"n":5,"t":"Post-procedure care","d":"Disconnect leads. Remove electrodes. Inspect skin. Patient sits before standing. Privacy for redressing."},{"n":6,"t":"Route results to provider","d":"Print and/or save electronically. Upload to EHR or place in paper chart. Becomes part of legal medical record."}]},{"id":9,"type":"twocol","title":"Ambulatory Cardiac Monitoring","lt":"Stress Testing & Echo","lc":"var(--warm)","li":[{"l":"Stress test purpose","d":"Evaluates heart under exertion. Reveals problems not visible at rest."},{"l":"Setting","d":"Hospital or cardiology office with emergency equipment. Cardiac arrest = most serious risk."},{"l":"How it works","d":"Treadmill/bike with continuous monitoring. Thallium dye may be used."},{"l":"Non-exercise option","d":"Medication mimics physiological stress for patients who can't exercise."},{"l":"Echocardiogram","d":"Ultrasound of heart. Assesses structure, valves, blood flow. No radiation."}],"rt":"Holter & Event Monitoring","rc":"var(--accent)","ri":[{"l":"Purpose","d":"Captures cardiac activity during daily life — catches intermittent arrhythmias."},{"l":"Duration","d":"24–72 hours per order. Event monitors worn longer — activated by patient."},{"l":"Patient instructions","d":"Resume all normal activities. Keep activity diary with times. Press event button for symptoms."},{"l":"What to avoid","d":"No showers. Avoid metal detectors. Don't move electrodes."},{"l":"MA role","d":"Apply electrodes per manufacturer guidelines. Patient education determines result quality."}]},{"id":10,"type":"twocol","title":"EKG Equipment, EHR & Documentation","lt":"Equipment Care & Calibration","lc":"var(--blue)","li":[{"l":"Self-calibration","d":"Machine performs self-check every time turned on."},{"l":"Calibration box","d":"10 mm tall × 5 mm wide at standard settings. Confirms gain and speed."},{"l":"Gain & paper speed","d":"Gain = amplitude (10 mm/mV). Speed = 25 mm/sec. Changes affect all measurements."},{"l":"Graph paper","d":"Heat/pressure-sensitive. Each small square = 0.04 sec. 5 small = 1 large."},{"l":"Daily maintenance","d":"Inspect lead wires for fraying. Close electrode pouches. Service per manufacturer."}],"rt":"Transmitting & Documenting","rc":"var(--accent)","ri":[{"l":"Hard copy","d":"Print tracing and hand to provider if not EHR-integrated."},{"l":"Electronic","d":"Integrated machines transmit directly; provider views and signs electronically."},{"l":"Scanning","d":"Paper tracings scanned into EHR or placed in paper chart after review."},{"l":"Legal record","d":"Once documented, EKG is permanent legal medical record."},{"l":"Telemetry","d":"Hospital-based continuous monitoring. Ambulatory: digital transmission and retrieval."}]},{"id":11,"type":"takeaways","title":"Week Six — Key Takeaways","items":["Correct lead placement is critical. Wrong location = tracing that looks like disease — missed or incorrect diagnosis.","P wave = atria, QRS = ventricles contracting, T wave = ventricles recovering. Foundation of every EKG reading.","V-Tach, V-Fib, and asystole are emergencies. Recognize them and act — don't wait for the provider.","Most artifacts are preventable. Clean skin, correct grounding, no crossed wires, electronics off.","Patient communication takes longer than the test. A calm, informed patient produces a cleaner tracing.","Holter monitor is only as useful as the diary. Patient education determines ambulatory monitoring quality.","After EKG: check 10 mm standardization, Lead I positive R wave, no artifacts, visible P-QRS-T.","Once transmitted or scanned, the EKG is a permanent part of the legal medical record."]},{"id":12,"type":"quiz","title":"Knowledge Check","questions":[{"q":"The P wave on an EKG represents:","options":["Ventricular contraction","Atrial depolarization","Ventricular recovery","SA node firing"],"correct":1,"explanation":"The P wave represents atrial depolarization — the electrical signal causing the atria to contract."},{"q":"Which rhythm shows a flat line with no electrical activity?","options":["V-Tach","A-Fib","Asystole","Sinus Bradycardia"],"correct":2,"explanation":"Asystole = complete absence of electrical activity — flat line. Check patient first, then act."},{"q":"What causes a wandering baseline artifact?","options":["Broken lead wire","Muscle tremor","Breathing movement or poor electrode contact","Nearby electronics"],"correct":2,"explanation":"Wandering baseline comes from breathing movement or poor electrode contact (lotions, inadequate skin prep)."},{"q":"V4 should be placed BEFORE V3 because:","options":["V4 is more important","V3 goes midway between V2 and V4","V4 has a higher voltage","It's alphabetical order"],"correct":1,"explanation":"V3 is placed midway between V2 and V4, so you must place V4 first to know where V3 goes."},{"q":"Normal standardization mark height is:","options":["5 mm","10 mm","15 mm","20 mm"],"correct":1,"explanation":"The standardization mark must be 10 mm tall to confirm gain and paper speed are correct."},{"q":"How long can a Holter monitor typically be worn?","options":["4–6 hours","12 hours","24–72 hours","1 week minimum"],"correct":2,"explanation":"Holter monitors are worn 24–72 hours per provider order to capture daily cardiac activity."}]},{"id":13,"type":"end","title":"End of Week Six","subtitle":"EKG and Cardiac Testing","message":"Every waveform tells a story. Your precision in placement, preparation, and recognition can save a life."}];

function rS(s){const m={title:rTitle,objectives:rObj,cards:rCards,twocol:rTC,table:rTbl,tab:rTab,takeaways:rTake,quiz:rQuiz,end:rEnd,step:rStep};return m[s.type]?m[s.type](s,s.id):''}
function rTitle(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px;position:relative"><div style="position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:6px"><div style="width:24px;height:2px;background:var(--accent)"></div><span style="font-size:9px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase">${e(s.subtitle)}</span></div><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">${e(s.week)}</div><h1 style="font-family:var(--ff);font-size:${s.fs||34}px;font-weight:700;color:#fff;margin:0;line-height:1.25;white-space:pre-line">${e(s.title)}</h1><div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center">${s.tags.map(t=>`<span class="tag">${e(t)}</span>`).join('')}</div><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:3px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}">${j+1}</div><div style="font-size:10px;color:var(--text);line-height:1.4;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:4px;font-style:italic">Click to reveal</p>':''}</div>${F(i)}</div>`}
function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb">${s.desc?`<p style="font-size:10px;color:var(--textMid);margin:0 0 8px">${e(s.desc)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:7px">${s.cards.map(c=>`<div class="cd" style="border-${c.b||'left'}:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div>${s.note?`<div class="co co-${s.nt||'a'}" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[12].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[12].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
