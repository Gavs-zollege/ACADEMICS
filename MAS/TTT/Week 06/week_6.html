<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EKG & Cardiac Monitoring</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: rgba(255,255,255,0.025);
    --border: rgba(255,255,255,0.07);
    --text: #c4cedf;
    --text-bright: #e2e8f4;
    --text-muted: #6b7a96;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
  }
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    flex-shrink: 0;
    text-align: center;
    padding: 16px 24px 12px;
  }
  .header h1 {
    font-size: 26px; font-weight: 800;
    color: var(--text-bright); line-height: 1.1; margin-top: 2px;
  }
  .header p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .main {
    flex: 1; overflow: hidden;
    display: flex; gap: 16px;
    padding: 0 24px 16px;
  }
  .sidebar {
    width: 250px; flex-shrink: 0;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    padding-right: 6px;
  }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  .topic-btn {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px; padding: 8px 11px;
    cursor: pointer; transition: all 0.2s ease;
    width: 100%; text-align: left;
    font-family: 'DM Sans', sans-serif; color: var(--text);
  }
  .topic-btn:hover { transform: translateX(2px); }
  .topic-btn .icon { font-size: 18px; flex-shrink: 0; line-height: 1; }
  .topic-btn .label {
    font-size: 13px; font-weight: 500; flex: 1;
    line-height: 1.3; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .topic-btn.active .label { color: var(--text-bright); font-weight: 600; }
  .sidebar-divider {
    height: 1px; background: var(--border);
    margin: 4px 0; flex-shrink: 0;
  }
  .content {
    flex: 1; overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
    display: flex; flex-direction: column;
  }
  .content-header {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .content-header .icon { font-size: 30px; }
  .content-header .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700;
  }
  .content-header .title {
    font-size: 18px; font-weight: 700;
    color: var(--text-bright); line-height: 1.2;
  }
  .content-scroll {
    flex: 1; overflow-y: auto; padding-right: 6px;
  }
  .content-scroll::-webkit-scrollbar { width: 3px; }
  .content-scroll::-webkit-scrollbar-track { background: transparent; }
  .content-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  .point {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(255,255,255,0.025);
    border-radius: 10px; padding: 10px 13px;
    margin-bottom: 7px; border: 1px solid transparent;
    animation: pointIn 0.3s ease both;
  }
  .point .num {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .point p { font-size: 14px; line-height: 1.55; color: var(--text); }
  .takeaway-item {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 13px;
    margin-bottom: 7px;
    animation: pointIn 0.3s ease both;
  }
  .takeaway-item .num {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #E63946, #FF6B35);
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .takeaway-item p { font-size: 14px; line-height: 1.55; color: var(--text); }
  .welcome {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .welcome .big-icon { font-size: 52px; margin-bottom: 14px; }
  .welcome p { font-size: 15px; color: var(--text-muted); line-height: 1.6; max-width: 260px; }
  @keyframes pointIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ===== MOBILE RESPONSIVE ===== */
  @media (max-width: 768px) {
    html, body { overflow: auto; height: auto; }
    .app { height: auto; min-height: 100vh; overflow: visible; }
    .header { padding: 14px 16px 10px; }
    .header h1 { font-size: 22px; }
    .main {
      flex-direction: column;
      padding: 0 12px 16px;
      overflow: visible;
    }
    .sidebar {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 6px;
      padding-right: 0;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .sidebar::-webkit-scrollbar { height: 3px; width: auto; }
    .topic-btn {
      flex-shrink: 0;
      min-width: max-content;
      padding: 7px 12px;
    }
    .sidebar-divider {
      width: 1px; height: auto;
      min-height: 28px;
      margin: 0 2px;
    }
    .content {
      overflow: visible;
      min-height: 60vh;
      padding: 16px;
    }
    .content-scroll { overflow: visible; }
    .point p, .tip-box p, .takeaway-item p { font-size: 13px; }
  }

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>EKG & Cardiac Monitoring</h1>
    <p>Understanding Heart Function Through Testing</p>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content">
      <div class="welcome">
        <div class="big-icon">📚</div>
        <p>Select a topic to explore its key learning points</p>
      </div>
    </div>
  </div>
</div>
<script>
var TOPICS = [
  { id:1, num:"01", icon:"🔍", title:"Preparing Patients for EKG & Cardiac Monitoring", color:"#E63946",
    points:["Verify patient identity with two identifiers — full name and date of birth","Patient undresses from the waist up; lower legs must also be accessible — gown opens at the front","Remove all jewelry and turn off cell phones and electronics near the patient","Position supine (flat on back) for standard EKG; use semi-Fowler\'s (45°) if the patient cannot lie flat","Prep skin with alcohol wipes; no lotions or oils — clip chest hair with surgical clippers if needed for electrode adhesion"] },
  { id:2, num:"02", icon:"🧰", title:"Lead Types & Anatomical Electrode Placement", color:"#457B9D",
    points:["12-lead EKG uses 10 electrodes placed on the limbs and chest to record from 12 angles","Limb leads I, II, III: bipolar — record impulses between two poles (arms and legs)","Augmented leads aVR, aVL, aVF: unipolar — enhanced by two additional poles for clearer waveforms","Chest leads V1–V6: all unipolar — placed in specific anatomical locations from right sternum to midaxillary line","Wire colors: White = right arm, Black = left arm, Red = left leg, Green = right leg (ground)"] },
  { id:3, num:"03", icon:"🌈", title:"Chest Lead Placement — V1 Through V6", color:"#2A9D8F",
    points:["V1: right side of sternum, 4th intercostal space","V2: left side of sternum, directly across from V1, 4th intercostal space","V4: left chest, 5th intercostal space, midclavicular line (place V4 before V3)","V3: midway between V2 and V4 (placed after V4 because it depends on V4\'s position)","V5: left chest, 5th intercostal space, anterior axillary line — V6: same level, midaxillary line"] },
  { id:4, num:"04", icon:"🧪", title:"Steps in Performing an EKG", color:"#8338EC",
    points:["Apply electrodes to fleshy skin areas at all 10 sites; connect limb leads first, then precordial leads","Position the machine so the power cord points away from the patient; enter patient demographics","Instruct the patient: lie still, breathe normally, do not talk during the recording","Press AUTO — the machine inserts a standardization mark and records all 12 leads in three-channel format","Check the printout: 10 mm standardization mark, positive R wave in Lead I, no artifacts, visible P-QRS-T waves"] },
  { id:5, num:"05", icon:"📏", title:"EKG Waveforms & What They Mean", color:"#FF6B35",
    points:["P wave: atrial depolarization — the electrical signal that causes the atria to contract","QRS complex: ventricular depolarization — the large wave that represents the ventricles contracting","T wave: ventricular repolarization — the ventricles recovering and preparing for the next beat","PR interval: time from the start of atrial depolarization to the start of ventricular depolarization","ST segment: from end of ventricular depolarization to start of repolarization — elevation or depression may signal cardiac injury"] },
  { id:6, num:"06", icon:"💉", title:"Recognizing Abnormal EKG Results — Arrhythmias", color:"#E63946",
    points:["Sinus bradycardia: heart rate below 60 bpm — normal P wave before each QRS","Sinus tachycardia: heart rate above 100 bpm — one P wave before each QRS","Atrial flutter: multiple sawtooth flutter waves for each QRS — single rapid atrial site firing","Atrial fibrillation: chaotic fibrillatory waves, irregular QRS spacing — high stroke risk","PACs and PVCs: premature atrial or ventricular beats — more than 6 per minute is abnormal and should be reported"] },
  { id:7, num:"07", icon:"🩸", title:"Emergent EKG Results — Act Immediately", color:"#457B9D",
    points:["Ventricular tachycardia (V-Tach): wide, rapid QRS complexes — patient may or may not have a pulse — life-threatening","Ventricular fibrillation (V-Fib): chaotic, erratic waveforms — no effective pump — no pulse — call 911, begin CPR","Asystole: flat line — no electrical activity — check for disconnected electrode first, then call 911 and begin CPR if unresponsive","V-Tach can progress to V-Fib without treatment — both are cardiac emergencies requiring immediate provider notification","Never assume a flat line is equipment failure without checking the patient first"] },
  { id:8, num:"08", icon:"📋", title:"Identifying & Eliminating Artifacts", color:"#2A9D8F",
    points:["Somatic tremor: irregular spikes from muscle movement — warm the patient, reduce anxiety, reposition hands palms-down","AC (60-cycle) interference: regular uniform spiking — use 3-prong plug, turn off electronics, avoid crossed lead wires","Wandering baseline: tracing drifts up/down — clean skin before electrode placement, check electrode adhesion","Interrupted baseline: flat line break in tracing — caused by a disconnected or broken lead wire; reattach and inspect wires","Most artifacts are preventable — clean skin, proper grounding, and no electronics nearby eliminate the most common issues"] },
  { id:9, num:"09", icon:"🩹", title:"Assisting with Ambulatory Cardiac Monitoring", color:"#8338EC",
    points:["Stress testing: patient exercises on a treadmill or stationary bike with continuous cardiac monitoring and vital sign tracking","MA role in stress testing: apply leads, monitor BP and vital signs, educate patient on pre/post instructions, immediately report chest pain or shortness of breath","Non-exercise stress test: a medication mimics physical cardiac stress for patients who cannot exercise","Holter monitoring: patient wears a portable cardiac monitor continuously for 24–72 hours during normal daily activities","Event monitoring: similar to Holter but longer term — patient presses the event button when they feel symptoms"] },
  { id:10, num:"10", icon:"🏷️", title:"Holter Monitoring — Patient Education", color:"#FF6B35",
    points:["Resume all normal daily activities while wearing the monitor — the goal is to capture what happens in real life","Keep a detailed activity diary: log every activity with the time and a brief description","Press the event button on the monitor if you feel palpitations, dizziness, chest discomfort, or syncope","Do not shower or bathe while wearing the device — water will damage the monitor and electrodes","Avoid metal detectors and other strong electrical or magnetic sources — they can interfere with the recording"] },
  { id:11, num:"11", icon:"⚙️", title:"Transmitting Results to the EHR, Chart & Provider", color:"#E63946",
    points:["Once the EKG is recorded, the ordering provider must review and interpret the tracing before it is filed","Machines integrated with the EHR can transmit the tracing electronically — the provider views and signs off digitally","If not integrated, print the tracing and hand directly to the provider, then scan it into the EHR or file in the paper chart","Follow all facility policies for uploading, archiving, and retaining EKG records","Once documented, the EKG is part of the patient\'s permanent legal medical record — accuracy and completeness are non-negotiable"] },
  { id:12, num:"12", icon:"🔬", title:"EKG Equipment — Proper Functioning & Storage", color:"#457B9D",
    points:["EKG machines are self-calibrating — the software performs a self-check every time the machine is powered on","Check the calibration box at the start of each EKG: it should measure 10 mm tall × 5 mm wide at standard settings","Standard settings: gain = 10 mm/mV, paper speed = 25 mm/second — any changes to these settings affect all measurements","Inspect lead wires regularly for fraying or breaks; close electrode pouches after use to prevent the remaining electrodes from drying out","Service equipment per manufacturer recommendations — and always consult the operation manual before changing any default settings"] },
];

var TAKEAWAYS = [
  "Correct lead placement is critical — a misplaced electrode produces a false tracing that can lead to missed or incorrect diagnoses",
  "Know your waveforms: P = atria contracting, QRS = ventricles contracting, T = ventricles recovering",
  "V-Tach, V-Fib, and asystole are emergencies — recognize them and act without delay",
  "Most artifacts are preventable — clean skin, proper grounding, and electronics turned off solve the majority of problems",
  "The Holter monitor is only as useful as the diary the patient keeps — thorough patient education determines data quality",
  "Once in the chart, the EKG is a permanent legal record — route it correctly and document it accurately every time"
];

var activeId = null;
var sidebar = document.getElementById('sidebar');
var content = document.getElementById('content');

function buildSidebar() {
  TOPICS.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.dataset.id = t.id;
    btn.innerHTML = '<span class="icon">' + t.icon + '</span><span class="label">' + t.title + '</span>';
    btn.addEventListener('click', function() { selectTopic(t.id); });
    btn.addEventListener('mouseenter', function() {
      if (activeId !== t.id) { this.style.background = t.color + '10'; this.style.borderColor = t.color + '55'; }
    });
    btn.addEventListener('mouseleave', function() {
      if (activeId !== t.id) { this.style.background = 'var(--surface)'; this.style.borderColor = 'var(--border)'; }
    });
    sidebar.appendChild(btn);
  });
  var divider = document.createElement('div');
  divider.className = 'sidebar-divider';
  sidebar.appendChild(divider);
  var tkBtn = document.createElement('button');
  tkBtn.className = 'topic-btn';
  tkBtn.dataset.id = 'takeaways';
  tkBtn.innerHTML = '<span class="icon">🎯</span><span class="label">Key Takeaways</span>';
  tkBtn.addEventListener('click', function() { selectTopic('takeaways'); });
  tkBtn.addEventListener('mouseenter', function() {
    if (activeId !== 'takeaways') { this.style.background = 'rgba(255,255,255,0.06)'; this.style.borderColor = 'rgba(255,255,255,0.15)'; }
  });
  tkBtn.addEventListener('mouseleave', function() {
    if (activeId !== 'takeaways') { this.style.background = 'var(--surface)'; this.style.borderColor = 'var(--border)'; }
  });
  sidebar.appendChild(tkBtn);
}

function updateSidebarActive() {
  var btns = sidebar.querySelectorAll('.topic-btn');
  btns.forEach(function(btn) {
    var id = btn.dataset.id;
    var topic = TOPICS.find(function(t) { return t.id == id; });
    var isActive = (id == activeId) || (id === 'takeaways' && activeId === 'takeaways');
    if (isActive) btn.classList.add('active'); else btn.classList.remove('active');
    if (isActive && topic) {
      btn.style.background = topic.color + '20';
      btn.style.borderColor = topic.color;
    } else if (isActive && id === 'takeaways') {
      btn.style.background = 'rgba(255,255,255,0.08)';
      btn.style.borderColor = 'rgba(255,255,255,0.2)';
    } else {
      btn.style.background = 'var(--surface)';
      btn.style.borderColor = 'var(--border)';
    }
  });
}

function renderTopic(t) {
  var html = '<div class="content-header">' +
    '<span class="icon">' + t.icon + '</span>' +
    '<div><div class="tag" style="color:' + t.color + '">TOPIC ' + t.num + '</div>' +
    '<div class="title">' + t.title + '</div></div></div>' +
    '<div class="content-scroll">';
  t.points.forEach(function(p, i) {
    html += '<div class="point" style="border-color:' + t.color + '22;animation-delay:' + (i * 50) + 'ms">' +
      '<div class="num" style="background:' + t.color + '">' + (i + 1) + '</div>' +
      '<p>' + p + '</p></div>';
  });
  html += '</div>';
  return html;
}

function renderTakeaways() {
  var html = '<div class="content-header">' +
    '<span class="icon" style="font-size:30px">🎯</span>' +
    '<div><div class="title">Key Takeaways</div></div></div>' +
    '<div class="content-scroll">';
  TAKEAWAYS.forEach(function(t, i) {
    html += '<div class="takeaway-item" style="animation-delay:' + (i * 50) + 'ms">' +
      '<div class="num">' + (i + 1) + '</div><p>' + t + '</p></div>';
  });
  html += '</div>';
  return html;
}

function selectTopic(id) {
  activeId = id;
  updateSidebarActive();
  if (id === 'takeaways') {
    content.innerHTML = renderTakeaways();
  } else {
    var topic = TOPICS.find(function(t) { return t.id === id; });
    if (topic) content.innerHTML = renderTopic(topic);
  }
  content.style.animation = 'none';
  void content.offsetHeight;
  content.style.animation = 'fadeIn 0.25s ease';
}

buildSidebar();
</script>
</body>
</html>
