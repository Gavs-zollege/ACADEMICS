<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Communication Styles Sorter</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#1c1a2e,#221f38,#1a1830);font-family:'Fredoka',sans-serif;padding:24px 16px;color:#f1f0f7}.wrap{max-width:720px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:700;font-size:30px;margin:8px 0 4px}.sub{color:#8b87a8;font-weight:500;font-size:15px}.score{color:#f59e0b;font-weight:600;font-size:14px;margin-top:8px}.prompt{background:linear-gradient(135deg,rgba(168,139,250,.13),rgba(245,158,11,.13));padding:22px 28px;border-radius:18px;text-align:center;margin-bottom:20px;border:2px solid rgba(168,139,250,.27)}.prompt .label{color:#8b87a8;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:6px}.prompt .item{color:#f1f0f7;font-size:20px;font-weight:700}.prompt .rem{color:#8b87a8;font-size:13px;margin-top:8px}.fb{text-align:center;padding:12px;margin-bottom:14px;border-radius:12px;font-weight:700;font-size:17px}.fb.ok{background:rgba(52,211,153,.13);color:#34d399}.fb.no{background:rgba(251,113,133,.13);color:#fb7185}.buckets{display:flex;gap:12px;flex-wrap:wrap}.bucket{flex:1 1 150px;min-width:140px;background:#272540;border-radius:18px;padding:16px;cursor:pointer;transition:all .2s;min-height:100px;border:2px solid rgba(168,139,250,.15)}.bucket:hover{filter:brightness(1.12)}.bucket h3{font-weight:700;font-size:14px;text-align:center;margin-bottom:8px;color:#a78bfa}.bucket .placed{padding:6px 10px;border-radius:9px;margin-bottom:5px;font-size:12px;font-weight:600;background:rgba(168,139,250,.08);border:1px solid rgba(168,139,250,.12)}.done{text-align:center;background:#272540;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.done .big{font-size:56px}.done h2{font-weight:700;font-size:28px;margin:12px 0 8px}.done .tip{color:#8b87a8;font-weight:500;font-size:15px;margin-bottom:20px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f59e0b;color:#1c1a2e;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🗣️</div><h1>Communication Styles Sorter</h1><p class="sub">Sort each behavior into the correct communication style</p><p class="score" id="sd">Score: 0 / 8</p></div>
<div id="game"><div class="prompt" id="pb"></div><div class="fb" id="fb" style="display:none"></div><div class="buckets" id="br"></div></div>
<div id="doneBox" class="done" style="display:none"></div></div>
<script>
const BN=["Assertive","Passive","Aggressive","Manipulative"];
const ALL=[
{text:"Firm, direct, respectful — proper eye contact and clear language",b:0},{text:"The ideal style in healthcare — the goal in every interaction",b:0},
{text:"Quiet, soft-spoken, hesitant — struggles to express needs",b:1},{text:"Avoids voicing concerns altogether",b:1},
{text:"Loud, abrasive, invades personal space — often from fear or pain",b:2},{text:"Uses large gestures and intimidating tone",b:2},
{text:"Indirect, patronizing, one-sided — hidden goals behind flattery",b:3},{text:"Message feels flattering but isn't genuine",b:3},
];
let rem,bc,sc;function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function init(){rem=shuffle(ALL);bc=BN.map(()=>[]);sc=0;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';render()}
function render(){document.getElementById('sd').textContent='Score: '+sc+' / '+ALL.length;const pb=document.getElementById('pb');if(rem.length>0){pb.style.display='block';pb.innerHTML='<div class="label">Which communication style?</div><div class="item">'+rem[0].text+'</div><div class="rem">'+rem.length+' remaining</div>'}else pb.style.display='none';const br=document.getElementById('br');br.innerHTML='';BN.forEach((n,i)=>{const d=document.createElement('div');d.className='bucket';d.onclick=()=>drop(i);let h='<h3>'+n+'</h3>';bc[i].forEach(t=>{h+='<div class="placed">✅ '+t+'</div>'});d.innerHTML=h;br.appendChild(d)})}
function drop(bi){if(rem.length===0)return;const c=rem[0];const ok=c.b===bi;if(ok){bc[bi].push(c.text);sc++}const f=document.getElementById('fb');f.style.display='block';f.className='fb '+(ok?'ok':'no');f.textContent=ok?'✅ Correct!':'❌ That\'s '+BN[c.b];rem=rem.slice(1);render();if(rem.length===0)setTimeout(showDone,900);setTimeout(()=>{f.style.display='none'},900)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(sc>=7?'🏆':'💪')+'</div><h2>'+sc+'/'+ALL.length+' Correct!</h2><p class="tip">Assertive is the goal. Never match aggression with aggression — stay calm and professional.</p><button class="btn" onclick="init()">🔄 Play Again</button>'}
init();
</script></body></html>
