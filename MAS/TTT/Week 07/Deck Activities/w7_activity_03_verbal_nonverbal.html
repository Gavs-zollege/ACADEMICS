<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Verbal vs Nonverbal Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0f1f17,#132419,#0d1a20);font-family:'Outfit',sans-serif;padding:24px 16px;color:#e8f5ec}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#7da98e;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7da98e;font-weight:700;font-size:14px}.topbar .sc{color:#34d399;font-weight:800;font-size:14px}.bar{height:6px;background:#1e3a28;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#34d399,#fb7185);border-radius:10px;transition:width .4s}.question{background:#162a1f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #34d399}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1e3a28;border:2px solid #1e3a28;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#34d399;font-weight:800;margin-right:12px}.opt.correct{background:rgba(52,211,153,.15);border-color:#34d399}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#162a1f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#34d399}.tip strong.no{color:#fb7185}.tip span{color:#7da98e;font-weight:600;font-size:14px}.done{text-align:center;background:#162a1f;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#7da98e;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#34d399;color:#0f1f17;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">👁️</div><h1>Verbal & Nonverbal Quiz</h1><p class="sub">Test your communication skills knowledge</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"'How are you feeling today?' is an example of:",opts:["Closed-ended question","Open-ended question","Paraphrasing","Summarizing"],a:1,tip:"Open-ended questions invite free sharing. Closed-ended = yes/no or brief answers."},
{q:"If your face shows cheerfulness while delivering bad news, the patient will:",opts:["Feel reassured","Trust your face over your words — creating a disconnect","Not notice","Laugh along"],a:1,tip:"When expressing empathy, look caring — not cheerful. Patients trust the face."},
{q:"Before using therapeutic touch (e.g., shoulder pat), you should always:",opts:["Just do it — it's always comforting","Ask for consent first","Check their chart","Wait for them to ask"],a:1,tip:"Not everyone welcomes touch. Always ask for consent first."},
{q:"When speaking with patients, medical terminology should be replaced with:",opts:["Abbreviations","Lay terms (plain language)","Whispered explanations","Written instructions only"],a:1,tip:"Use plain language with patients. Save medical terms for documentation and clinical colleagues."},
{q:"Invading a patient's personal space will most likely:",opts:["Build trust faster","Shut down communication","Show you care","Help them open up"],a:1,tip:"Give patients room — especially when delivering difficult news."},
{q:"A monotone voice when giving instructions makes the patient feel:",opts:["Calm and relaxed","Disengaged — like you don't care","Focused","Entertained"],a:1,tip:"Match tone to the situation. Calm for anxious patients; clear and direct for instructions."},
{q:"During telehealth visits, nonverbal cues are reduced. To compensate, you should:",opts:["Use more verbal communication and ask patients to repeat back info","Skip the nonverbal part entirely","Type notes instead of talking","Keep the camera off"],a:0,tip:"Verbal must carry more weight virtually. Ask for repeat-back to confirm understanding."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Nonverbal cues speak as loudly as words. Make sure they match your message.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script></body></html>
