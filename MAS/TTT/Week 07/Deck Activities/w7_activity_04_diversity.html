<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Diversity & Inclusion Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0e0a22,#181040,#0a0620);font-family:'Sora',sans-serif;padding:24px 16px;color:#e8e0ff}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#8878b0;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#8878b0;font-weight:700;font-size:14px}.topbar .sc{color:#a78bfa;font-weight:800;font-size:14px}.bar{height:6px;background:#201840;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#fbbf24);border-radius:10px;transition:width .4s}.question{background:#181040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#201840;border:2px solid #201840;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#181040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#8878b0;font-weight:600;font-size:14px}.done{text-align:center;background:#181040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#8878b0;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#0e0a22;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🌍</div><h1>Diversity & Inclusion Quiz</h1><p class="sub">Test your cultural awareness and communication adaptations</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"When a patient has limited English proficiency, you should:",opts:["Speak louder and slower","Use a professional interpreter; family may help if patient consents","Use medical jargon — they'll understand the technical terms","Skip the explanation"],a:1,tip:"Professional interpreter preferred. If family assists, use lay terms, never jargon."},
{q:"Regarding a patient's gender identity and pronouns, you should:",opts:["Assume based on appearance","Ask their preferred name, title, and pronouns","Use 'he' or 'she' based on the chart","Avoid using any pronouns"],a:1,tip:"Ask directly. Never assume marital status or gender identity."},
{q:"A patient with hearing loss enters your office. You should:",opts:["Shout from across the room","Face them so they can lip-read; provide written materials","Speak to their companion instead","Write everything on paper only"],a:1,tip:"Face them directly. Large-print materials for visual impairment; ask how they prefer to be assisted."},
{q:"Stereotypes are ___ and biases are ___.",opts:["Facts; opinions","Assumptions about groups; prejudices against groups","Cultural norms; personal preferences","Helpful; harmless"],a:1,tip:"Both interfere with effective communication and must be actively identified and eliminated."},
{q:"A patient who can't afford care may:",opts:["Always tell you directly","Downplay symptoms or skip treatment","Be unaffected in their care decisions","Refuse all help"],a:1,tip:"Know financial assistance resources and proactively share them when relevant."},
{q:"When a procedure requires clarification about sex characteristics, you should:",opts:["Ask the patient immediately","Check the chart first — ask the patient only if still needed","Assume based on appearance","Skip the question entirely"],a:1,tip:"Chart first, then ask sensitively only if needed. Respect and dignity always."},
{q:"Cultural awareness means:",opts:["Treating everyone exactly the same","Assuming cultural preferences based on ethnicity","Being aware of different views on medicine but never assuming — always ask","Avoiding cultural topics entirely"],a:2,tip:"Be aware of cultural differences, but never assume. Always confirm preferences directly."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>A patient\'s background doesn\'t determine their preferences — always ask.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script></body></html>
