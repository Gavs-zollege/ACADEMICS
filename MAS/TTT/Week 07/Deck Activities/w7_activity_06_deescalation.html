<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>De-Escalation Scenarios</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#1a1810,#1e1b12,#141208);font-family:'Rubik',sans-serif;padding:24px 16px;color:#faf5e8}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#b8a87a;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#b8a87a;font-weight:700;font-size:14px}.topbar .sc{color:#f59e0b;font-weight:800;font-size:14px}.bar{height:6px;background:#332e20;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#fb7185);border-radius:10px;transition:width .4s}.question{background:#252218;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #f59e0b}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#332e20;border:2px solid #332e20;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.1)}.opt .letter{color:#f59e0b;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#252218}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#b8a87a;font-weight:600;font-size:14px}.done{text-align:center;background:#252218;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#b8a87a;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f59e0b;color:#1a1810;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🛑</div><h1>De-Escalation Scenarios</h1><p class="sub">Choose the best response for each challenging situation</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"An angry patient is yelling about a long wait time. Your best response:",opts:["Match their volume so they know you're serious","'I understand this is frustrating. Let me find out what's happening with your appointment.'","Tell them to calm down","Walk away and come back later"],a:1,tip:"Use 'I' statements. Lower your voice. A patient who feels heard is more likely to engage."},
{q:"A patient says 'You seem upset' defensively. A better way to phrase this is:",opts:["'You need to relax'","'I understand this is difficult'","'Everyone gets frustrated'","'That's not my problem'"],a:1,tip:"'I' statements reduce defensiveness. 'I understand' > 'You seem' every time."},
{q:"A difficult conversation escalates beyond your ability to resolve it. You should:",opts:["Keep trying until the patient calms down","Involve a supervisor","Tell the patient to leave","Ignore the situation"],a:1,tip:"When your own efforts aren't working, escalate. Patients have the right to an unbiased party."},
{q:"After a challenging interaction with a patient, you should:",opts:["Forget about it and move on","Document date, time, parties involved, and a summary","Tell your coworkers what happened","Post about it on social media"],a:1,tip:"If it isn't documented, it didn't happen. Document all challenging interactions."},
{q:"In a conflict between two team members, the goal is:",opts:["To determine who is right","A win-win resolution that's respectful and workable for both","To assign blame","To avoid the issue entirely"],a:1,tip:"Find shared goals and build the solution from there. Not about who's right."},
{q:"Patient satisfaction surveys are useful because they:",opts:["Only measure how nice the staff is","Reveal patterns and concerns before they escalate into complaints","Are required by law","Don't actually help"],a:1,tip:"Proactive tool — catches problems early before they become formal complaints."},
{q:"When a patient is being aggressive due to pain, you should:",opts:["Match their energy to show empathy","Stay calm, lower your voice, don't escalate","Ask them to stop being aggressive","Leave the room immediately"],a:1,tip:"Aggression often comes from fear, pain, or frustration. Stay calm — never match it."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Scenario '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div>';h+='<div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}
function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2200)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Focus on the shared goal — not opposing positions. Document everything.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script></body></html>
