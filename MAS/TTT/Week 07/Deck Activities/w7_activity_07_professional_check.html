<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Professional or Not?</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#0e0820,#181030,#0a0618);font-family:'Lexend',sans-serif;padding:24px 16px;color:#e8e0ff}.wrap{max-width:560px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#8878b0;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar span{font-weight:700;font-size:14px}.topbar .ct{color:#8878b0}.topbar .sc{color:#fbbf24}.bar{height:6px;background:#201840;border-radius:10px;margin-bottom:24px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#22d3ee,#fb7185);border-radius:10px;transition:width .4s}.vc{background:linear-gradient(135deg,#181030,#201840);padding:32px 28px;border-radius:24px;text-align:center;margin-bottom:24px;border:2px solid rgba(34,211,238,.15)}.vc .label{color:#22d3ee;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}.vc .text{font-weight:800;font-size:19px;line-height:1.6}.fb{text-align:center;padding:14px;margin-bottom:16px;border-radius:14px;font-weight:800;font-size:18px}.fb.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:#4ade80}.fb.no{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.25);color:#fb7185}.fb .ex{font-weight:600;font-size:14px;color:#8878b0;margin-top:6px}.btns{display:flex;gap:16px}.btns button{flex:1;padding:18px 20px;border-radius:16px;font-weight:800;font-size:18px;cursor:pointer;font-family:inherit;color:#e8e0ff;transition:all .2s}.bp{background:rgba(74,222,128,.12);border:3px solid #4ade80}.bu{background:rgba(251,113,133,.12);border:3px solid #fb7185}.done{text-align:center;background:#181030;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#8878b0;font-weight:600;font-size:15px;margin-bottom:24px}.btn-r{padding:14px 36px;border:none;border-radius:14px;background:#22d3ee;color:#0e0820;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">✅</div><h1>Professional or Not?</h1><p class="sub">Is this behavior professional or unprofessional?</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const ITEMS=[
{text:"The MA arrives 10 minutes late and skips the morning huddle.",pro:false,why:"Be on time, follow through on commitments, take ownership. Punctuality is foundational."},
{text:"The MA uses 'I' statements during a difficult conversation with a patient.",pro:true,why:"'I understand this is frustrating' reduces defensiveness and keeps the conversation productive."},
{text:"The MA discusses a coworker's personal life with another staff member during lunch.",pro:false,why:"Gossip and drama have no place in healthcare. Keep personal relationships outside the workplace."},
{text:"The MA paraphrases what the patient said to confirm understanding before relaying it to the provider.",pro:true,why:"Paraphrasing confirms understanding and prevents miscommunication."},
{text:"The MA shares a patient's PHI with a caller without verifying their identity.",pro:false,why:"HIPAA violation. Always confirm identity before sharing any patient information."},
{text:"The MA documents a challenging patient interaction with date, time, and summary.",pro:true,why:"Documentation protects everyone. If it isn't documented, it didn't happen."},
{text:"The MA uses medical jargon when explaining a procedure to a patient.",pro:false,why:"Use lay terms (plain language) with patients. Save medical terminology for clinical colleagues."},
{text:"The MA positions themselves at the patient's eye level during a conversation.",pro:true,why:"Talking down to patients (literally) creates a power imbalance. Meet them at their level."},
{text:"The MA tells an aggressive patient 'You need to calm down.'",pro:false,why:"Telling someone to calm down escalates the situation. Use 'I understand this is difficult' instead."},
{text:"The MA checks audio and video before a telehealth visit begins.",pro:true,why:"Technical problems waste visit time. Check everything before the patient connects."},
];
let ci=0,score=0,chosen=null;
function renderQ(){const g=document.getElementById('game'),it=ITEMS[ci];let h='<div class="topbar"><span class="ct">'+(ci+1)+' / '+ITEMS.length+'</span><span class="sc">Score: '+score+'</span></div>';h+='<div class="bar"><div class="bar-fill" style="width:'+(ci/ITEMS.length*100)+'%"></div></div>';h+='<div class="vc"><div class="label">Scenario '+(ci+1)+'</div><div class="text">'+it.text+'</div></div>';if(chosen!==null){const ok=chosen===it.pro;h+='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ It\'s actually '+(it.pro?'Professional':'Unprofessional'))+'<div class="ex">'+it.why+'</div></div>'}h+='<div class="btns"><button class="bp" '+(chosen===null?'onclick="pick(true)"':'')+'>✅ Professional</button><button class="bu" '+(chosen===null?'onclick="pick(false)"':'')+'>❌ Unprofessional</button></div>';g.innerHTML=h}
function pick(isPro){if(chosen!==null)return;chosen=isPro;if(isPro===ITEMS[ci].pro)score++;renderQ();setTimeout(()=>{if(ci+1<ITEMS.length){ci++;chosen=null;renderQ()}else showDone()},2200)}
function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=8?'🏆':'💪')+'</div><h2>'+score+'/'+ITEMS.length+' Correct!</h2><p>The MA is often the patient\'s first contact. That first impression sets the tone for everything.</p><button class="btn-r" onclick="reset()">🔄 Try Again</button>'}
function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}
renderQ();
</script></body></html>
