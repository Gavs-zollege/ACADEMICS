<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Professional or Not?</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}
body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Inter',sans-serif;color:#FFF}
.wrap{max-width:560px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}
.header{text-align:center;margin-bottom:8px;flex-shrink:0}
.header .icon{font-size:32px}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:4px 0 2px}
.sub{color:#94A3B8;font-weight:600;font-size:13px}
.game-area{flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}
.topbar{display:flex;justify-content:space-between;margin-bottom:8px}
.topbar span{font-weight:700;font-size:12px}
.topbar .ct{color:#94A3B8}
.topbar .sc{color:#FBBF24}
.bar{height:3px;background:rgba(255,255,255,0.1);border-radius:10px;margin-bottom:10px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#2DD4BF,#38BDF8);border-radius:10px;transition:width .4s}
.scenario{background:#132F42;padding:16px 20px;border-radius:14px;text-align:center;margin-bottom:10px;border:1.5px solid rgba(255,255,255,0.12)}
.scenario .label{color:#2DD4BF;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:2px;margin-bottom:6px}
.scenario .text{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:15px;line-height:1.55}
.fb{text-align:center;padding:8px;margin-bottom:6px;border-radius:10px;font-weight:700;font-size:13px}
.fb.ok{background:rgba(52,211,153,.15);color:#34D399}
.fb.no{background:rgba(248,113,113,.15);color:#FCA5A5}
.fb .explain{font-weight:500;font-size:12px;color:#E2E8F0;margin-top:4px}
.btns{display:flex;gap:10px;margin-bottom:6px}
.btns button{flex:1;padding:12px;border-radius:12px;font-weight:800;font-size:16px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;color:#FFF;transition:all .18s;border:2px solid}
.btn-a{background:rgba(52,211,153,.1);border-color:rgba(52,211,153,.4)}
.btn-a:hover{background:rgba(52,211,153,.18)}
.btn-b{background:rgba(248,113,113,.1);border-color:rgba(248,113,113,.4)}
.btn-b:hover{background:rgba(248,113,113,.18)}
.btns button:disabled{cursor:default;opacity:0.4}
.btns button.is-answer{border-color:#34D399;border-width:2.5px;opacity:1}
.btns button.pick-wrong{background:rgba(248,113,113,.25);border-color:#F87171;opacity:1}
.tag{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin-left:6px;text-transform:uppercase;letter-spacing:.5px;display:inline-block}
.tag-c{background:rgba(52,211,153,0.15);color:#34D399}
.tag-w{background:rgba(248,113,113,0.15);color:#F87171}
.next-btn{width:100%;padding:10px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:700;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;transition:transform .12s}
.next-btn:hover{transform:translateY(-1px)}
.done{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);margin:auto 0}
.done .big{font-size:40px}
.done h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;margin:8px 0 4px}
.done p{color:#E2E8F0;font-weight:500;font-size:13px;margin-bottom:16px;line-height:1.5}
.btn-r{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}
.btn-r:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}
.btn-redo{padding:10px 28px;border:1.5px solid #5EEAD4;border-radius:10px;background:transparent;color:#5EEAD4;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:8px}
.btn-redo:hover{background:rgba(94,234,212,0.1);transform:translateY(-1px)}
</style></head>
<body><div class="wrap"><div class="header"><div class="icon">✅</div><h1>Professional or Not?</h1><p class="sub">Is this behavior professional or unprofessional?</p></div><div id="game" class="game-area"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
var ORIG = [{"text": "The MA arrives 10 minutes late and skips the morning huddle.", "correct": false, "why": "Be on time, follow through on commitments, take ownership. Punctuality is foundational."}, {"text": "The MA uses ‘I’ statements during a difficult conversation with a patient.", "correct": true, "why": "‘I understand this is frustrating’ reduces defensiveness and keeps the conversation productive."}, {"text": "The MA discusses a coworker’s personal life with another staff member during lunch.", "correct": false, "why": "Gossip and drama have no place in healthcare. Keep personal relationships outside the workplace."}, {"text": "The MA paraphrases what the patient said to confirm understanding before relaying it to the provider.", "correct": true, "why": "Paraphrasing confirms understanding and prevents miscommunication."}, {"text": "The MA shares a patient’s PHI with a caller without verifying their identity.", "correct": false, "why": "HIPAA violation. Always confirm identity before sharing any patient information."}, {"text": "The MA documents a challenging patient interaction with date, time, and summary.", "correct": true, "why": "Documentation protects everyone. If it isn’t documented, it didn’t happen."}, {"text": "The MA uses medical jargon when explaining a procedure to a patient.", "correct": false, "why": "Use lay terms (plain language) with patients. Save medical terminology for clinical colleagues."}, {"text": "The MA positions themselves at the patient’s eye level during a conversation.", "correct": true, "why": "Talking down to patients (literally) creates a power imbalance. Meet them at their level."}, {"text": "The MA tells an aggressive patient ‘You need to calm down.’", "correct": false, "why": "Telling someone to calm down escalates the situation. Use ‘I understand this is difficult’ instead."}, {"text": "The MA checks audio and video before a telehealth visit begins.", "correct": true, "why": "Technical problems waste visit time. Check everything before the patient connects."}];
var ITEMS = ORIG.slice(), ci = 0, score = 0, chosen = null, missedIdx = [];

function renderQ() {
  var g = document.getElementById("game"), it = ITEMS[ci];
  var h = '<div class="topbar"><span class="ct">' + (ci+1) + ' / ' + ITEMS.length + '</span><span class="sc">Score: ' + score + '</span></div>';
  h += '<div class="bar"><div class="bar-fill" style="width:' + (ci/ITEMS.length*100) + '%"></div></div>';
  h += '<div class="scenario"><div class="label">Scenario ' + (ci+1) + '</div><div class="text">' + it.text + '</div></div>';

  if (chosen !== null) {
    var ok = chosen === it.correct;
    var actual = it.correct ? "CORRECT practice" : "an ERROR";
    h += '<div class="fb ' + (ok ? "ok" : "no") + '">' + (ok ? "✅ Correct!" : "❌ Wrong — it’s actually " + actual) + '<div class="explain">' + it.why + '</div></div>';
  }

  var aCls = "btn-a", bCls = "btn-b", aTag = "", bTag = "", dis = chosen !== null ? "disabled" : "";
  if (chosen !== null) {
    if (it.correct) { aCls += " is-answer"; aTag = chosen === true ? '<span class="tag tag-c">✓ Correct</span>' : '<span class="tag tag-c">✓ Answer</span>'; }
    if (!it.correct) { bCls += " is-answer"; bTag = chosen === false ? '<span class="tag tag-c">✓ Correct</span>' : '<span class="tag tag-c">✓ Answer</span>'; }
    if (chosen === true && !it.correct) { aCls += " pick-wrong"; aTag = '<span class="tag tag-w">✗ Wrong</span>'; }
    if (chosen === false && it.correct) { bCls += " pick-wrong"; bTag = '<span class="tag tag-w">✗ Wrong</span>'; }
  }

  h += '<div class="btns"><button class="' + aCls + '" ' + dis + ' ' + (chosen === null ? 'onclick="pick(true)"' : "") + '>✅ Professional" + aTag + "</button>';
  h += '<button class="' + bCls + '" ' + dis + ' ' + (chosen === null ? 'onclick="pick(false)"' : "") + '>❌ Unprofessional" + bTag + "</button></div>';
  if (chosen !== null) h += '<button class="next-btn" onclick="nextQ()">Next →</button>';
  g.innerHTML = h;
}

function pick(v) { if (chosen !== null) return; chosen = v; if (v === ITEMS[ci].correct) score++; else missedIdx.push(ci); renderQ(); }
function nextQ() { if (ci+1 < ITEMS.length) { ci++; chosen = null; renderQ(); } else showDone(); }

function showDone() {
  document.getElementById("game").style.display = "none";
  var d = document.getElementById("doneBox"); d.style.display = "block";
  var html = '<div class="big">' + (score >= 8 ? "🏆" : "💪") + "</div>";
  html += "<h2>" + score + "/" + ITEMS.length + " Correct!</h2>";
  html += "<p>The MA is often the patient’s first contact. That first impression sets the tone for everything.</p>";
  html += '<button class="btn-r" onclick="reset()">Play Again</button>';
  if (missedIdx.length > 0) html += '<br><button class="btn-redo" onclick="redo()">Redo Missed (' + missedIdx.length + ")</button>";
  d.innerHTML = html;
}

function reset() { ITEMS = ORIG.slice(); ci = 0; score = 0; chosen = null; missedIdx = []; document.getElementById("game").style.display = "block"; document.getElementById("doneBox").style.display = "none"; renderQ(); }
function redo() { var r = []; for (var i = 0; i < missedIdx.length; i++) r.push(ITEMS[missedIdx[i]]); ITEMS = r; ci = 0; score = 0; chosen = null; missedIdx = []; document.getElementById("game").style.display = "block"; document.getElementById("doneBox").style.display = "none"; renderQ(); }
renderQ();
</script></body></html>
