<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Five Pillars of Professionalism</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0d1a0f,#112010,#0a150c);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#e6f7ea}.wrap{max-width:740px;margin:0 auto}.header{text-align:center;margin-bottom:28px}.icon{font-size:44px}h1{font-weight:700;font-size:30px;margin:8px 0 4px}.sub{color:#7aab88;font-weight:600;font-size:15px}.badge{display:inline-block;margin-top:12px;background:#142818;padding:6px 20px;border-radius:20px;border:1px solid rgba(163,230,53,.2);color:#a3e635;font-weight:700;font-size:15px}.cols{display:flex;gap:16px;flex-wrap:wrap}.col{flex:1 1 280px;min-width:220px}.cl{font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.cl.a{color:#a3e635}.cl.b{color:#fbbf24}.card{padding:14px 18px;margin-bottom:8px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;border:2px solid transparent}.card.i{background:#142818}.card.i.sel{background:rgba(163,230,53,.15);border-color:#a3e635}.card.i.done{background:rgba(74,222,128,.1);border-color:#4ade80;opacity:.55;cursor:default}.card.m{background:#1c3820;font-weight:600;font-size:14px}.card.m.used{background:rgba(74,222,128,.1);border-color:#4ade80;opacity:.55;cursor:default}.card.m.wrong{background:rgba(251,113,133,.15);border-color:#fb7185;animation:shake .35s}.dn{text-align:center;background:#142818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.dn .big{font-size:56px}.dn h2{font-weight:700;font-size:28px;margin:12px 0 8px}.dn p{color:#4ade80;font-weight:700;font-size:16px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a3e635;color:#0d1a0f;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🏛️</div><h1>Five Pillars of Professionalism</h1><p class="sub">Match each pillar to its description</p><div class="badge" id="counter">0 / 5 matched</div></div>
<div id="game"><div class="cols"><div class="col" id="ic"><div class="cl a">🏛️ Pillar</div></div><div class="col" id="mc"><div class="cl b">🎯 Description</div></div></div></div>
<div id="doneBox" class="dn" style="display:none"><div class="big">🏆</div><h2>All Matched!</h2><p>Professional presence sets the tone for every patient encounter. Make that first impression count.</p><button class="btn" onclick="resetGame()">🔄 Play Again</button></div></div>
<script>
const P=[{item:"Behaviors",match:"Actions and conduct that reflect professionalism in practice"},{item:"Appearance",match:"Follow facility dress code — your look is the first message"},{item:"Communication",match:"Tone, attitude, and word selection reflect you and the organization"},{item:"Work Ethic",match:"Be on time, follow through on commitments, take ownership"},{item:"Relationships",match:"Keep personal relationships outside the work environment"}];
let sh,sel=null,mt={},ct=0;function shuffle(a){return[...a].sort(()=>Math.random()-.5)}
function render(){const ic=document.getElementById('ic'),mc=document.getElementById('mc');ic.innerHTML='<div class="cl a">🏛️ Pillar</div>';mc.innerHTML='<div class="cl b">🎯 Description</div>';P.forEach((p,i)=>{const d=document.createElement('div');d.className='card i'+(mt[i]!==undefined?' done':sel===i?' sel':'');d.textContent=(mt[i]!==undefined?'✅ ':'')+p.item;if(mt[i]===undefined)d.onclick=()=>{sel=i;render()};ic.appendChild(d)});sh.forEach((m,i)=>{const d=document.createElement('div');const u=Object.values(mt).includes(i);d.className='card m'+(u?' used':'');d.textContent=(u?'✅ ':'')+m.match;d.id='m-'+i;if(!u)d.onclick=()=>tryM(i);mc.appendChild(d)});document.getElementById('counter').textContent=ct+' / '+P.length+' matched'}
function tryM(mi){if(sel===null)return;if(P[sel].match===sh[mi].match){mt[sel]=mi;ct++;sel=null;render();if(ct===P.length){document.getElementById('game').style.display='none';document.getElementById('doneBox').style.display='block'}}else{const el=document.getElementById('m-'+mi);el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),500)}}
function resetGame(){sel=null;mt={};ct=0;sh=shuffle(P);document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';render()}
sh=shuffle(P);render();
</script></body></html>
