<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 7 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 7 Glossary</h1>
  <p class="sub">Communication & Customer Service</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Fundamentals",color:"#6B7B8D",terms:[
    {term:"Communication Cycle",def:"Message sent by sender, transmitted through a channel, received and interpreted by receiver."},
    {term:"Therapeutic Communication",def:"Structured approach building trust — empathy, rephrasing, open-ended questions, summarizing."},
    {term:"Active Listening",def:"Being fully present — nonjudgmental body language, paraphrasing, allowing speaker to finish."},
    {term:"Paraphrasing",def:"Restating in your own words to confirm accurate understanding of the message."},
    {term:"Empathy",def:"Recognizing and acknowledging another's feelings. Distinct from sympathy. Builds trust."},
    {term:"Probing Question",def:"Open-ended question gathering more detail. 'Can you tell me more about when the pain started?'"},
    {term:"Open-Ended Question",def:"Invites detailed response, not yes/no. 'How have you been feeling since your last visit?'"},
    {term:"Closed-Ended Question",def:"Seeks brief, specific answer. 'Are you currently taking aspirin?' or 'What is your address?'"},
  ]},
  {name:"Comm Styles",color:"#8B6AAE",terms:[
    {term:"Assertive Communication",def:"Direct, clear, respectful — the ideal healthcare style. Confident without being aggressive."},
    {term:"Passive Communication",def:"Quiet, hesitant, submissive. Draw them out with open-ended questions and reassurance."},
    {term:"Aggressive Communication",def:"Loud, abrasive, physically intrusive. Stay calm, lower your voice, never match the aggression."},
    {term:"Manipulative Communication",def:"Indirect with a hidden agenda. Stay professional, focus on facts."},
    {term:"Visual Communicator",def:"Prefers written materials, diagrams, demonstrations. Responds well to visual aids."},
    {term:"Auditory Communicator",def:"Learns best through listening and verbal explanation. Benefits from repetition."},
    {term:"Kinesthetic Communicator",def:"Learns through hands-on experience and physical activity. Responds to demonstrations."},
  ]},
  {name:"Nonverbal",color:"#4A90B8",terms:[
    {term:"Nonverbal Communication",def:"Body language, facial expressions, eye contact, posture, gestures, space, touch. Trusted over verbal when they conflict."},
    {term:"Body Language",def:"Physical gestures, posture, movement, and expressions conveying messages before words are spoken."},
    {term:"Eye Contact",def:"Signals engagement, attentiveness, and trustworthiness. Avoiding it can signal discomfort."},
    {term:"Personal Space",def:"Physical distance during interaction. Invading it causes discomfort. Cultural norms vary."},
    {term:"Therapeutic Touch",def:"Deliberate, caring physical gesture of comfort. Always ask consent first."},
    {term:"Haptics",def:"The study and use of touch as communication — handshakes, reassuring touches on arm/shoulder."},
  ]},
  {name:"Diversity & Bias",color:"#E05555",terms:[
    {term:"Stereotype",def:"Oversimplified assumption about a person based on group membership. Must be actively eliminated."},
    {term:"Bias",def:"Conscious or unconscious prejudice influencing how information is sent and received."},
    {term:"Generalization",def:"Broad assumption about an individual based on limited group info. Always verify directly."},
    {term:"Cultural Competence",def:"Ability to effectively communicate with patients from diverse cultural backgrounds."},
    {term:"Psychosocial Care",def:"Addressing psychological, social, and spiritual needs — not just physical. Improves outcomes."},
    {term:"Gender Identity",def:"A person's internal sense of their gender. Ask preferred name, pronouns, and title — never assume."},
    {term:"Preferred Pronouns",def:"Pronouns a person uses (she/her, he/him, they/them). Asking is a basic act of respect."},
    {term:"Interpreter",def:"Qualified professional facilitating communication across languages. Legally required. Never use children."},
  ]},
  {name:"Phone & Written",color:"#1A8A7D",terms:[
    {term:"HIPAA",def:"Federal law protecting patient health information. Verify caller identity before sharing any PHI."},
    {term:"Five P's of Phone Etiquette",def:"Polite, Prepared, to the Point, Perceptive, cooPerative."},
    {term:"Full Block Format",def:"Business letter with all elements flush left. Most common in healthcare."},
    {term:"Modified Block Format",def:"Body left-justified; date, closing, and signature begin at center."},
    {term:"Simplified Format",def:"All text left-justified, no salutation or closing. For specific circumstances."},
    {term:"Certified Mail",def:"Provides proof of mailing and delivery. Used for critical patient notifications."},
    {term:"Letterhead",def:"Official stationery with organization name, logo, address. Required for formal correspondence."},
    {term:"Business Correspondence",def:"Any formal written communication — must be error-free, professional, HIPAA-compliant."},
  ]},
  {name:"Conflict & Service",color:"#E74C6F",terms:[
    {term:"Conflict Management",def:"Structured process — active listening, identifying shared goals, working toward win-win resolution."},
    {term:"De-Escalation",def:"Techniques to reduce tension — lower voice, calm demeanor, open body language, give space to speak."},
    {term:"\"I\" Statement",def:"Express your perspective, not judgments. 'I understand this is frustrating' vs 'You're being difficult.'"},
    {term:"Cause-and-Effect Analysis",def:"Identifying potential problem causes and effects to implement preventive measures."},
    {term:"Risk Management",def:"Identifying, evaluating, and reducing potential risks to patient safety and employee well-being."},
    {term:"Incident / Event Report",def:"Formal documentation of unusual occurrences — date, time, persons, description, actions taken."},
    {term:"Patient Satisfaction Survey",def:"Tool measuring patient experience to identify patterns and improve care proactively."},
    {term:"Win-Win Resolution",def:"Outcome where all parties feel core concerns addressed. Shift from positions to shared goals."},
  ]},
  {name:"Team & Professionalism",color:"#E2B94C",terms:[
    {term:"Health Care Surrogate",def:"Person legally authorized to make healthcare decisions for an incapacitated patient."},
    {term:"Crucial Conversation",def:"High-stakes conversation with strong emotions or significant consequences. Requires extra preparation."},
    {term:"Release of Information",def:"Signed patient authorization permitting PHI sharing with specified individuals."},
    {term:"Professional Presence",def:"Overall impression through appearance, communication, behavior, and attitude."},
    {term:"Professionalism",def:"Standard of conduct — behaviors, appearance, communication, work ethic. Present in every interaction."},
    {term:"Personal Boundaries",def:"Professional limits — don't share personal stories or other patients' experiences."},
    {term:"Closed Captioning (Telehealth)",def:"Live written captions during virtual visits. Offer to patients with hearing loss."},
    {term:"Scope of Practice",def:"Defined actions a healthcare professional is legally authorized to perform. Stay within limits."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
