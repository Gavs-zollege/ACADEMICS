kground:var(--blueLight);border-color:var(--blue)}.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}. <script>
const S=[{"id":0,"type":"title","title":"Communication and Customer\nService for Healthcare Professionals","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Seven","tags":["Therapeutic Communication","Diversity","Conflict Resolution","Professionalism"],"fs":24},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Recognize diversity of patient cultures and backgrounds when providing care","Identify stereotypes and biases and interact appropriately with all individuals","Modify verbal and nonverbal communication for diverse audiences","Adjust communication based on special considerations and visit type","Clarify and relay communication between patients and providers","Use HIPAA guidelines when communicating by telephone","Prepare professional written and electronic communications","Handle challenging customer service situations effectively","Apply conflict management and complaint resolution strategies","Engage in crucial conversations with patients, caregivers, and staff","Facilitate teamwork and team engagement","Demonstrate professionalism in all aspects of the role"]},{"id":2,"type":"twocol","title":"Therapeutic Communication & Active Listening","lt":"Therapeutic Communication","lc":"var(--accent)","li":[{"l":"What it is","d":"Skills to build trust, comfort, and genuine therapeutic relationship."},{"l":"Core techniques","d":"Empathy, rephrasing, open questions, pausing, summarizing."},{"l":"Why it matters","d":"Builds trust and encourages patient participation in care decisions."},{"l":"Communication cycle","d":"Sender, receiver, intended meaning — succeeds when all three align."},{"l":"Scope boundaries","d":"Stay in scope — no personal stories, other patients' experiences."}],"rt":"Active Listening","rc":"var(--blue)","ri":[{"l":"More than hearing","d":"Being fully present — aware of what's said, how, and what it means."},{"l":"What it looks like","d":"Nonjudgmental posture, eye contact, nodding, no interrupting."},{"l":"Body language","d":"Face and posture signal engagement or disinterest."},{"l":"Reflect & clarify","d":"Paraphrase back to confirm understanding. Ask if unclear."},{"l":"When to use silence","d":"Well-timed pause lets patient process difficult messages."}]},{"id":3,"type":"cards","title":"Communication Styles & How to Respond","cols":2,"cards":[{"title":"Assertive (Ideal)","desc":"Firm, direct, respectful. Proper eye contact, clear language. Respond in kind — assertive and respectful.","color":"#3DAE8E"},{"title":"Passive","desc":"Quiet, hesitant, avoids voicing concerns. Draw out gently with open-ended questions. Be patient and reassuring.","color":"#4A90D9"},{"title":"Aggressive","desc":"Loud, abrasive, invades space. Often from fear or pain. Stay calm — lower your voice. Never match aggression.","color":"#D94F4F"},{"title":"Manipulative","desc":"Indirect, patronizing, hidden goals. Feels flattering but isn't genuine. Stay grounded, professional, fact-focused.","color":"#E8853D"}]},{"id":4,"type":"twocol","title":"Verbal & Nonverbal Communication","lt":"Verbal Skills","lc":"var(--accent)","li":[{"l":"Open-ended questions","d":"\"How are you feeling?\" — invite patients to share freely."},{"l":"Closed-ended","d":"\"Do you have a sore throat?\" — confirm specific facts."},{"l":"Paraphrasing","d":"Repeat in your own words to confirm understanding."},{"l":"Tone and pitch","d":"Match to situation — calm for anxious; clear for instructions."},{"l":"Lay terms","d":"Plain language with patients. Medical terms for documentation."}],"rt":"Nonverbal Skills","rc":"var(--purple)","ri":[{"l":"Body language","d":"Posture, eye contact, expressions, gestures — must match words."},{"l":"Eye contact","d":"Signals engagement and interest. Avoiding = discomfort."},{"l":"Personal space","d":"Invading shuts down communication. Give room for difficult news."},{"l":"Therapeutic touch","d":"Gentle shoulder touch can comfort — always ask consent first."},{"l":"Message alignment","d":"If face says something different, patients trust the face."}]},{"id":5,"type":"cards","title":"Diversity, Culture & Special Considerations","cols":3,"cards":[{"title":"Stereotypes vs. Biases","desc":"Stereotypes = assumptions about groups. Biases = prejudices. Both interfere — identify and eliminate.","color":"#D94F4F"},{"title":"Cultural Awareness","desc":"Different views on medicine, pain, gender roles. Never assume — always ask treatment preferences.","color":"#E8853D"},{"title":"Gender Identity","desc":"Ask preferred name, title, pronouns. Don't assume marital status or gender. Check chart first.","color":"#8B6FC0"},{"title":"Language & Interpretation","desc":"Professional interpreter for limited English. Family may assist if patient consents. Use lay terms.","color":"#4A90D9"},{"title":"Physical & Sensory Needs","desc":"Face hearing-impaired patients. Large print for visual impairment. Ask how they prefer assistance.","color":"#3DAE8E"},{"title":"Economic Considerations","desc":"Patients may downplay symptoms or skip treatment. Know financial assistance resources. Share proactively.","color":"#B8860B"}]},{"id":6,"type":"twocol","title":"Telephone & Written Communication","lt":"Telephone Etiquette & HIPAA","lc":"var(--warm)","li":[{"l":"Polite","d":"Soft, warm tone — never monotone or rushed."},{"l":"Prepared","d":"Names, dates, details ready before calling."},{"l":"To the Point","d":"Concise — don't wander from purpose."},{"l":"Perceptive","d":"Respect caller's time; avoid irrelevant topics."},{"l":"Cooperative","d":"If you can't help, find someone who can."},{"l":"HIPAA","d":"Confirm identity before sharing any PHI. Follow facility policy."}],"rt":"Written & Electronic Communication","rc":"var(--blue)","ri":[{"l":"Email","d":"Secure only. Subject line, salutation, closing. No slang."},{"l":"Business letter","d":"Full block standard in healthcare: all lines flush left, on letterhead."},{"l":"Letter styles","d":"Full block, modified block, modified with indent, simplified."},{"l":"Certified mail","d":"Used to verify receipt — e.g., abnormal results when other contact failed."},{"l":"Legal record","d":"All written communication = permanent medical record. Accuracy non-negotiable."}]},{"id":7,"type":"twocol","title":"In-Person & Telehealth Visits","lt":"In-Person Visits","lc":"var(--accent)","li":[{"l":"Full nonverbal cues","d":"Use facial expressions, posture, therapeutic touch intentionally."},{"l":"Room setup","d":"Ensure room is ready for visit type before patient arrives."},{"l":"Positioning","d":"At patient's level whenever possible — avoid talking down."},{"l":"Both types","d":"Ask for questions. Give time to respond. Document method used."}],"rt":"Telehealth (Virtual) Visits","rc":"var(--purple)","ri":[{"l":"Tech check","d":"Audio and video before visit — technical problems waste time."},{"l":"Reduced cues","d":"Verbal communication must carry more weight virtually."},{"l":"Engagement","d":"Eye contact with camera. Attentive expressions."},{"l":"Comprehension","d":"Ask patient to repeat back — harder to assess virtually."},{"l":"Closed captions","d":"Available on some platforms — useful for hearing loss."}]},{"id":8,"type":"twocol","title":"Handling Challenging Situations & Conflict","lt":"De-Escalation & Difficult Conversations","lc":"var(--warm)","li":[{"l":"Stay calm","d":"Never match negative energy. Lower voice, slow speech."},{"l":"Use \"I\" statements","d":"\"I understand this is frustrating\" — reduces defensiveness."},{"l":"Listen first","d":"Let patient fully express concern before responding."},{"l":"Set boundaries","d":"Professional and respectful. Escalate to supervisor if needed."},{"l":"Document","d":"Date, time, parties, summary. If not documented, it didn't happen."}],"rt":"Conflict Management & Resolution","rc":"var(--accent)","ri":[{"l":"Underlying goals","d":"Parties often share more common ground than they realize."},{"l":"Resolution process","d":"Each party expresses concerns. Active listening. Identify solutions."},{"l":"Win-win","d":"Goal isn't who's right — it's respectful, workable conclusion."},{"l":"Patient surveys","d":"Proactive tool — reveals patterns before they escalate."},{"l":"When to escalate","d":"If resolution fails, involve supervisor. Patients have the right to be heard."}]},{"id":9,"type":"cards","title":"Teamwork, Professionalism & Presence","cols":2,"desc":"The MA is often the first person a patient encounters — make that first impression count.","cards":[{"title":"Effective Teamwork","desc":"Each role matters equally. Open communication reduces errors. No gossip or drama. Emotions must never compromise care.","color":"#3DAE8E"},{"title":"Professional Presence","desc":"Follow dress code. Tone/attitude reflect you and org. Be on time, follow through. Personal relationships stay outside work.","color":"#4A90D9"},{"title":"The Five Pillars","desc":"Behaviors, Appearance, Communication, Work Ethic, and Relationships — the foundation of professionalism.","color":"#8B6FC0"},{"title":"Patient Outcomes","desc":"A team that communicates well produces better outcomes and a healthier work environment for everyone.","color":"#E8853D"}]},{"id":10,"type":"takeaways","title":"Week Seven — Key Takeaways","items":["Assertive communication is the goal — firm, respectful, clear, direct. Never match aggression.","Nonverbal cues speak as loudly as words. Make sure your face, posture, and language match your message.","Recognize and eliminate stereotypes and biases. A patient's background doesn't determine preferences — always ask.","All phone and written communication must follow HIPAA. Verify identity before sharing any PHI.","In conflict, focus on the shared goal — not opposing positions. Common ground leads to win-win.","Document all challenging interactions: date, time, parties, summary. If not documented, it didn't happen.","Gossip, drama, and negativity have no place in healthcare teams. Good communication = better outcomes.","The MA is often the first contact. That first impression sets the tone for the entire experience."]},{"id":11,"type":"quiz","title":"Knowledge Check","questions":[{"q":"Which communication style is the ideal in healthcare?","options":["Passive","Aggressive","Assertive","Manipulative"],"correct":2,"explanation":"Assertive — firm, direct, and respectful. The goal in every interaction."},{"q":"What should you do FIRST when a patient becomes aggressive?","options":["Match their energy","Call security","Stay calm and lower your voice","Leave the room"],"correct":2,"explanation":"Stay calm — lower your voice and slow your speech. Never match aggression."},{"q":"When leaving a voicemail for a patient, you should NEVER:","options":["State your name","Give the callback number","Leave clinical details","Mention the practice name"],"correct":2,"explanation":"Never leave clinical details on voicemail — it could violate HIPAA."},{"q":"The 'I' statement technique helps because it:","options":["Places blame clearly","Reduces defensiveness","Shows authority","Ends the conversation faster"],"correct":1,"explanation":"'I' statements (e.g., 'I understand this is frustrating') reduce defensiveness and keep conversations productive."},{"q":"If verbal and nonverbal messages conflict, patients will trust:","options":["The words","The tone","The facial expression / body language","Neither"],"correct":2,"explanation":"If your face says something different than your words, patients trust the face."},{"q":"When should a conflict be escalated to a supervisor?","options":["Immediately, every time","Only if the patient requests it","When your own resolution attempts haven't worked","Never — MAs handle all conflicts"],"correct":2,"explanation":"Escalate when your own attempts at resolution have not worked. Patients have the right to be heard by an unbiased party."}]},{"id":12,"type":"end","title":"End of Week Seven","subtitle":"Communication & Customer Service","message":"Every word, gesture, and expression shapes the patient experience. Communicate with purpose, empathy, and professionalism."}];

function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:3px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}">${j+1}</div><div style="font-size:10px;color:var(--text);line-height:1.4;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:4px;font-style:italic">Click to reveal</p>':''}</div>${F(i)}</div>`}
function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb">${s.desc?`<p style="font-size:10px;color:var(--textMid);margin:0 0 8px">${e(s.desc)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:7px">${s.cards.map(c=>`<div class="cd" style="border-${c.b||'left'}:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div>${s.note?`<div class="co co-${s.nt||'a'}" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[11].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[11].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
