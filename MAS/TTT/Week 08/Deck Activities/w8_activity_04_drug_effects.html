<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Drug Effects Quiz</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0f1f17,#132419,#0d1a20);font-family:'Outfit',sans-serif;padding:24px 16px;color:#e8f5ec}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#7da98e;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7da98e;font-weight:700;font-size:14px}.topbar .sc{color:#34d399;font-weight:800;font-size:14px}.bar{height:6px;background:#1e3a28;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#34d399,#fb7185);border-radius:10px;transition:width .4s}.question{background:#162a1f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #34d399}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1e3a28;border:2px solid #1e3a28;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#34d399;font-weight:800;margin-right:12px}.opt.correct{background:rgba(52,211,153,.15);border-color:#34d399}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#162a1f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#34d399}.tip strong.no{color:#fb7185}.tip span{color:#7da98e;font-weight:600;font-size:14px}.done{text-align:center;background:#162a1f;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#7da98e;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#34d399;color:#0f1f17;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">⚗️</div><h1>Drug Effects Quiz</h1><p class="sub">Side effects, adverse effects, indications & contraindications</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"Sedation from diphenhydramine (Benadryl) is an example of a:",opts:["Therapeutic effect","Side effect — predictable, undesirable, but not harmful","Adverse effect","Contraindication"],a:1,tip:"Side effects are predictable and undesirable but not harmful. Sedation is expected with Benadryl."},
{q:"Angioedema (facial swelling) from lisinopril is an example of:",opts:["A therapeutic effect","A side effect","An adverse effect — unintended and potentially harmful","An indication"],a:2,tip:"Adverse effects are unintended AND potentially harmful. Angioedema requires immediate care."},
{q:"A 'contraindication' means:",opts:["The drug is recommended","A condition that makes the drug inadvisable or dangerous","The drug has no side effects","The drug works faster"],a:1,tip:"Most common contraindication: prior allergic reaction (hypersensitivity)."},
{q:"The 'indication' for metformin is:",opts:["Pain relief","High blood pressure","Reducing blood glucose (Type 2 diabetes)","Allergies"],a:2,tip:"Indication = the condition the drug is prescribed to treat. Metformin = oral hypoglycemic."},
{q:"Grapefruit can affect medications by:",opts:["Making them taste better","Altering how the drug works — increasing toxicity or reducing effectiveness","It has no effect on medications","Only affecting antibiotics"],a:1,tip:"Food-drug interactions are real. Grapefruit, tyramine-rich foods, and supplements can all alter drug effects."},
{q:"The 'therapeutic effect' of a drug is:",opts:["Any effect it produces","The intended, beneficial action — the reason it was prescribed","Only the side effects","The long-term effect after years of use"],a:1,tip:"Therapeutic = the reason it was prescribed. Everything else is a side or adverse effect."},
{q:"LASA medications (look-alike/sound-alike) should be:",opts:["Stored next to each other for convenience","Stored in separate locations and checked 3 times","Only dispensed by physicians","Ignored — they're not a real concern"],a:1,tip:"Tall-man lettering + separate storage + 3 label checks prevent LASA errors."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Know the difference between side effects (expected) and adverse effects (harmful). Report adverse effects immediately.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
