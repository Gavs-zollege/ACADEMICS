<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dosage Calculations</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a0e1e,#101830,#0a1020);font-family:'Sora',sans-serif;padding:24px 16px;color:#e8ecff}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#7888b0;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7888b0;font-weight:700;font-size:14px}.topbar .sc{color:#fbbf24;font-weight:800;font-size:14px}.bar{height:6px;background:#182040;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#818cf8,#fbbf24);border-radius:10px;transition:width .4s}.question{background:#101830;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #818cf8}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#182040;border:2px solid #182040;font-weight:700;font-size:18px;cursor:pointer;transition:all .2s;text-align:center}.opt:hover{filter:brightness(1.15)}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#101830}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#7888b0;font-weight:600;font-size:14px}.done{text-align:center;background:#101830;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#7888b0;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#fbbf24;color:#0a0e1e;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🧮</div><h1>Dosage Calculations</h1><p class="sub">Solve each dosage problem</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"Order: 50 mg. Available: 25 mg/capsule. How many capsules?",opts:["1","2","3","4"],a:1,tip:"(50 ÷ 25) × 1 = 2 capsules. Desired ÷ Have × Quantity."},
{q:"1 teaspoon = how many mL?",opts:["2.5 mL","5 mL","10 mL","15 mL"],a:1,tip:"1 tsp = 5 mL. 1 tbsp = 15 mL. 1 oz = 30 mL."},
{q:"Patient weighs 110 lbs. Convert to kg.",opts:["40 kg","50 kg","55 kg","60 kg"],a:1,tip:"110 ÷ 2.2 = 50 kg. Always divide pounds by 2.2."},
{q:"Order: 500 mg. Available: 250 mg/tablet. How many tablets?",opts:["1","1.5","2","2.5"],a:2,tip:"500 ÷ 250 = 2 tablets."},
{q:"1 tablespoon = how many mL?",opts:["5 mL","10 mL","15 mL","30 mL"],a:2,tip:"1 tbsp = 15 mL = 3 teaspoons."},
{q:"Convert 2,000 mg to grams.",opts:["0.2 g","2 g","20 g","200 g"],a:1,tip:"Move decimal 3 places left: 2,000 mg = 2 g. (÷ 1,000)"},
{q:"Patient weighs 176 lbs. Weight in kg?",opts:["70 kg","80 kg","88 kg","90 kg"],a:1,tip:"176 ÷ 2.2 = 80 kg."},
{q:"Order: 0.5 g. Available: 250 mg tablets. How many tablets?",opts:["1","2","3","4"],a:1,tip:"0.5 g = 500 mg. 500 ÷ 250 = 2 tablets. Convert units first!"},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=7?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Desired ÷ Have × Quantity. Always convert units first. Double-check every calculation.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
