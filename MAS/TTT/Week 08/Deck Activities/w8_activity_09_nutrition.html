<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Nutrition Quiz</title><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0d1a0f,#112010,#0a150c);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#e6f7ea}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:700;font-size:30px;margin:8px 0 4px}.sub{color:#7aab88;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7aab88;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:700;font-size:14px}.bar{height:6px;background:#1c3820;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:10px;transition:width .4s}.question{background:#142818;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a3e635}.question p{font-weight:700;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1c3820;border:2px solid #1c3820;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a3e635;font-weight:700;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#142818}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#7aab88;font-weight:600;font-size:14px}.done{text-align:center;background:#142818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:700;font-size:28px;margin:12px 0}.done p{color:#7aab88;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a3e635;color:#0d1a0f;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🥗</div><h1>Nutrition Quiz</h1><p class="sub">Macronutrients, vitamins, food labels & dietary guidelines</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"Protein provides how many calories per gram?",opts:["2 cal/g","4 cal/g","7 cal/g","9 cal/g"],a:1,tip:"Protein = 4 cal/g. Carbs = 4 cal/g. Fat = 9 cal/g (most calorie-dense)."},
{q:"Fat provides how many calories per gram?",opts:["4 cal/g","7 cal/g","9 cal/g","12 cal/g"],a:2,tip:"Fat = 9 cal/g — the most calorie-dense macronutrient."},
{q:"Fat-soluble vitamins are:",opts:["B and C","A, D, E, K","Iron and calcium","B12 and folate"],a:1,tip:"A, D, E, K are fat-soluble (stored in fat). B and C are water-soluble."},
{q:"On a food label, ingredients are listed in:",opts:["Alphabetical order","Descending order by amount","Random order","Calorie order"],a:1,tip:"First ingredient = most abundant. Check sodium, cholesterol, saturated fat for heart health."},
{q:"The primary energy source for the body is:",opts:["Protein","Fat","Carbohydrates","Vitamins"],a:2,tip:"Carbs = primary energy. Simple (sugars) vs. complex (fiber, whole grains). Excess stored as glycogen, then fat."},
{q:"For diabetic patients, dietary guidelines emphasize:",opts:["High sugar, low fat","Limit added sugars, consistent small meals, prioritize fiber and lean protein","No restrictions needed","High carb diet"],a:1,tip:"The plate method: limit sugars/refined carbs, eat consistent small meals, prioritize fiber and lean protein."},
{q:"Celiac disease requires a strict:",opts:["Low-sodium diet","Gluten-free diet (no wheat, barley, rye)","Dairy-free diet","High-protein diet"],a:1,tip:"Strict gluten-free: avoid wheat, barley, rye. Prevent cross-contact. Opt for naturally gluten-free whole foods."},
{q:"Water makes up what percentage of the human body?",opts:["20–30%","30–40%","50–80%","90–95%"],a:2,tip:"50–80% of the body. Essential for transport, waste removal, temperature regulation. Aim for 2–3 L/day."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=7?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Nutrition directly impacts disease management. Know the dietary guidelines for common conditions.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
