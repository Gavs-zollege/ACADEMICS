<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Healthcare Team & Models</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#1a0f20,#241530,#150a1c);font-family:'Manrope',sans-serif;padding:24px 16px;color:#f0e4ff}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#a080c0;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#a080c0;font-weight:700;font-size:14px}.topbar .sc{color:#a78bfa;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1840;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#f472b6);border-radius:10px;transition:width .4s}.question{background:#1c1030;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1840;border:2px solid #2a1840;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1030}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#a080c0;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1030;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#a080c0;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#1a0f20;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🏥</div><h1>Healthcare Team & Models</h1><p class="sub">Providers, settings, and payment models</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"A DO (Doctor of Osteopathic Medicine) differs from an MD by also using:",opts:["Surgery only","Osteopathic manipulative therapy","Alternative medicine exclusively","Nursing protocols"],a:1,tip:"DOs have all MD training PLUS osteopathic manipulative therapy (OMT)."},
{q:"A PA (Physician Assistant) practices:",opts:["Independently in all states","Under MD/DO supervision","Only in hospitals","Without prescribing rights"],a:1,tip:"PAs practice under physician supervision. NPs may be independent in some states."},
{q:"The PCMH (Patient-Centered Medical Home) model:",opts:["Is hospital-only","Has a PCP leading an interprofessional team coordinating all care","Doesn't include MAs","Is only for pediatrics"],a:1,tip:"PCMH: PCP leads a team for coordinated, whole-person care. MAs are integral to this model."},
{q:"Value-based care (Quadruple Aim) rewards:",opts:["Volume of services provided","Prevention, outcomes, and efficiency over volume","Only surgical procedures","Number of patients seen per day"],a:1,tip:"Quadruple Aim: better outcomes, lower cost, better patient experience, provider well-being."},
{q:"Most MA work occurs in which care setting?",opts:["Inpatient (hospital)","Outpatient / ambulatory","Home health","Hospice"],a:1,tip:"Ambulatory/outpatient clinics are where most MAs practice."},
{q:"Hospice care focuses on:",opts:["Curing terminal illness","End-of-life comfort care","Rehabilitation","Emergency treatment"],a:1,tip:"Hospice = comfort and quality of life for patients with terminal illness. Not curative."},
{q:"Fee-for-service payment means:",opts:["Providers are paid a salary regardless","Providers are billed per service rendered","Patients pay nothing","Insurance covers everything automatically"],a:1,tip:"Fee-for-service = payment per service. Contrast with value-based = payment for outcomes."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Know your team, your setting, and how healthcare is paid for — it affects every aspect of your role.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
