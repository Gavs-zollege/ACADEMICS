<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 8 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 8 Glossary</h1>
  <p class="sub">Foundational Knowledge & Basic Science</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Healthcare Systems",color:"#6B7B8D",terms:[
    {term:"Scope of Practice",def:"Legally authorized duties based on education, credentials, and state regulations. Varies by state."},
    {term:"Ambulatory / Outpatient Care",def:"Healthcare where the patient is not admitted overnight — offices, urgent care, clinics."},
    {term:"Inpatient Care",def:"Healthcare provided while admitted to a hospital overnight for serious conditions."},
    {term:"PCMH",def:"Patient-Centered Medical Home — PCP-led team coordinating all aspects of a patient's care."},
    {term:"Hospice Care",def:"End-of-life care focused on comfort and dignity rather than curative treatment."},
    {term:"Home Health",def:"Skilled healthcare delivered at home for patients with difficulty leaving. Must be provider-ordered."},
    {term:"Mobile Health Unit",def:"Transportable healthcare bringing services to underserved communities."},
    {term:"Telehealth",def:"Remote healthcare via technology. Good for follow-ups and chronic conditions, not physical exams."},
    {term:"Patient Portal",def:"Secure web-based EHR feature for patients to view health info and message the care team."},
    {term:"Fee-for-Service",def:"Payment model reimbursing each service, test, or procedure performed."},
    {term:"Value-Based Care",def:"Payment model rewarding outcomes and cost reduction over volume. Quadruple Aim."},
    {term:"HMO",def:"Managed care requiring PCP, referrals for specialists, and precertification for procedures."},
    {term:"PPO",def:"Managed care with more flexibility — no PCP required, can self-refer to specialists."},
    {term:"Patient Navigation",def:"Expanded MA role guiding patients through the healthcare system and identifying barriers."},
  ]},
  {name:"Credentials",color:"#4A90B8",terms:[
    {term:"Medical Doctor (MD)",def:"Allopathic physician — diagnose, prescribe, perform surgery. 4 yr undergrad + 4 yr med school + residency."},
    {term:"Doctor of Osteopathy (DO)",def:"Equivalent to MD with additional osteopathic manipulative therapy training. Holistic approach."},
    {term:"Physician Assistant (PA)",def:"Midlevel provider practicing under MD/DO supervision. Can diagnose and prescribe."},
    {term:"Nurse Practitioner (NP)",def:"Advanced practice RN with graduate training. Can diagnose and prescribe. May practice independently."},
    {term:"LPN / LVN",def:"Licensed nurse with ~1 year training. Limited scope — vitals, basic wound care, some medications."},
    {term:"Registered Nurse (RN)",def:"Licensed nurse with associate's or bachelor's degree. Broad clinical practice scope."},
    {term:"Licensure",def:"Mandatory state-issued authorization to practice a regulated profession."},
    {term:"Certification",def:"Voluntary credential from passing a national exam. Increases job placement and wages."},
    {term:"Continuing Education",def:"Post-certification education to maintain knowledge. NHA requires 10 hrs or retest every 2 years."},
    {term:"CMA / RMA",def:"Two most recognized MA credentials: CMA (AAMA) and RMA (AMT). National certification exams."},
  ]},
  {name:"Pharmacology",color:"#E05555",terms:[
    {term:"Pharmacology",def:"Study of medications — classifications, mechanisms, therapeutic effects, side effects, interactions."},
    {term:"Medication Classification",def:"Grouping drugs by therapeutic action. Some belong to multiple classes."},
    {term:"Analgesic",def:"Relieves pain. OTC: acetaminophen, ibuprofen. Rx: hydrocodone, codeine, gabapentin."},
    {term:"Antihypertensive",def:"Lowers blood pressure. ACE inhibitors, beta-blockers, ARBs, calcium channel blockers, diuretics."},
    {term:"Diuretic",def:"Increases urine production to eliminate excess fluid. Furosemide, hydrochlorothiazide."},
    {term:"Oral Hypoglycemic",def:"Lowers blood glucose in type 2 diabetes. First-line: metformin. Also glyburide, pioglitazone."},
    {term:"Antibiotic",def:"Treats bacterial infections. Amoxicillin, ciprofloxacin. Ineffective against viruses."},
    {term:"Anticoagulant",def:"Slows/prevents blood clotting. Warfarin, apixaban, heparin. Increased bleeding risk."},
    {term:"Bronchodilator",def:"Relaxes airway muscles to improve airflow. Albuterol (rescue), theophylline (long-acting)."},
    {term:"Antilipemic",def:"Lowers cholesterol/triglycerides. Atorvastatin (statin), fenofibrate, cholestyramine."},
    {term:"OTC Medication",def:"Purchased without prescription. Still report during intake. Acetaminophen, ibuprofen, diphenhydramine."},
  ]},
  {name:"Controlled Substances",color:"#E74C6F",terms:[
    {term:"Controlled Substances Act",def:"Federal law classifying substances into five schedules. Enforced by the DEA."},
    {term:"Schedule I",def:"Highest abuse potential, no accepted medical use. Heroin, LSD, mescaline."},
    {term:"Schedule II",def:"High abuse potential, accepted use. No refills. Morphine, oxycodone, fentanyl, amphetamine."},
    {term:"Schedule III",def:"Moderate potential. 5 refills in 6 months. Ketamine, anabolic steroids, acetaminophen/codeine."},
    {term:"Schedule IV",def:"Low potential. 5 refills in 6 months. Tramadol, benzodiazepines (diazepam, alprazolam)."},
    {term:"Schedule V",def:"Lowest potential. Limited narcotic preparations. Diphenoxylate/atropine, pregabalin."},
  ]},
  {name:"Drug Safety",color:"#8B6AAE",terms:[
    {term:"Therapeutic Effect",def:"The intended, beneficial action of a medication — the reason it was prescribed."},
    {term:"Side Effect",def:"Predictable, unintended response. Nearly unavoidable at standard doses. Often subsides."},
    {term:"Adverse Effect",def:"Unintended, harmful response that may require discontinuing the drug or emergency care."},
    {term:"Indication",def:"The specific condition for which a medication is prescribed."},
    {term:"Contraindication",def:"A condition making a medication inadvisable or dangerous. Most common: prior allergy."},
    {term:"Drug Interaction",def:"A medication's effect changed by another drug, food, or supplement taken simultaneously."},
    {term:"Hypersensitivity",def:"Immune response to a medication — mild (rash) to life-threatening (anaphylaxis)."},
    {term:"Anaphylaxis",def:"Severe allergic reaction — airway spasm, swelling, BP drop. Requires immediate epinephrine."},
    {term:"LASA Medications",def:"Look-Alike/Sound-Alike drugs with similar names creating administration error risk."},
    {term:"Tall-Man Lettering",def:"Capitalizing differing letters in similar drug names: hydrOXYzine vs hydrALAzine."},
  ]},
  {name:"Dosage Calculations",color:"#E2B94C",terms:[
    {term:"Metric System",def:"Standard medical measurement. Units change by factors of 1,000. kg, g, mg, mcg; L, mL."},
    {term:"Household Measurements",def:"1 tsp = 5 mL; 1 tbsp = 15 mL; 1 fl oz = 30 mL; 1 cup = 240 mL; 2.2 lb = 1 kg."},
    {term:"Ratio and Proportion",def:"Known relationship to solve unknown: 25 mg/1 cap = 50 mg/x cap → x = 2 capsules."},
    {term:"Desired-Over-Have Formula",def:"(Desired ÷ On hand) × Quantity = Amount to give."},
    {term:"Pediatric Dosing by Weight",def:"Convert lb to kg (÷ 2.2), multiply by mg/kg/day, divide by doses/day, calculate volume."},
    {term:"Body Surface Area (BSA)",def:"Most accurate pediatric dose calculation using nomogram. (Child BSA ÷ 1.7) × adult dose."},
    {term:"Half-Life",def:"Time for drug concentration to reduce by half. Determines dosing intervals."},
  ]},
  {name:"Pharmacokinetics",color:"#1A8A7D",terms:[
    {term:"Pharmacokinetics",def:"How the body processes a drug: Absorption, Distribution, Metabolism, Excretion (ADME)."},
    {term:"Absorption",def:"Drug converted to usable form and moved into bloodstream. IV = fastest; oral = slowest."},
    {term:"Distribution",def:"Bloodstream carries drug to tissues/organs. Blood-brain and placental barriers limit some drugs."},
    {term:"Metabolism",def:"Liver converts active drug to inactive metabolites. Affected by age, organ health, genetics."},
    {term:"Excretion",def:"Elimination via kidneys (urine primarily). Also feces, sweat, breast milk, exhaled air."},
    {term:"Rights of Medication Admin",def:"Seven rights: patient, medication, dose, time, route, technique, documentation."},
    {term:"Three Label Checks",def:"Check label 3 times: (1) removing from storage, (2) preparing dose, (3) returning/discarding."},
    {term:"Intradermal (ID) Injection",def:"Into superficial skin layers at 10–15°. Used for allergy and TB testing. Inner forearm."},
    {term:"Subcutaneous (SQ) Injection",def:"Into fat layer at 45°. Upper arm, abdomen, buttocks, thighs. Insulin, heparin, some vaccines."},
    {term:"Intramuscular (IM) Injection",def:"Deep into muscle at 90°. Deltoid, vastus lateralis, ventrogluteal. Vaccines, antibiotics."},
  ]},
  {name:"Nutrition",color:"#4CAF90",terms:[
    {term:"Macronutrients",def:"Protein (4 cal/g), carbohydrates (4 cal/g), fats (9 cal/g). The three calorie-containing nutrients."},
    {term:"Protein",def:"Amino acid molecules for tissue repair, immune function, fluid balance. Essential during growth/recovery."},
    {term:"Carbohydrate",def:"Primary energy source. Simple = quick energy; Complex = sustained energy + digestive health."},
    {term:"Fat (Lipid)",def:"9 cal/g. Essential for vitamin absorption (A,D,E,K), hormones, cell membranes. Unsaturated = healthier."},
    {term:"Fat-Soluble Vitamins",def:"A, D, E, K — stored in fat/liver. Toxicity possible with excess. A = headaches; D = kidney failure."},
    {term:"Water-Soluble Vitamins",def:"B vitamins and C. Excess excreted in urine. Very high B3/B6 doses can cause adverse effects."},
    {term:"MyPlate",def:"USDA nutrition tool at myplate.gov. Individualized recommendations by age, sex, activity."},
    {term:"Food Label",def:"Nutrition facts panel. Check serving size first — amounts listed are per serving, not per package."},
    {term:"Dietary Supplement",def:"Vitamins, minerals, herbs, amino acids. FDA regulates loosely. Patients must disclose during intake."},
    {term:"Anorexia Nervosa",def:"Self-starvation, extreme fear of weight gain. Life-threatening. Report to provider immediately."},
    {term:"Bulimia Nervosa",def:"Binge-purge cycles. Electrolyte imbalances, tooth erosion, esophageal damage. Psychotherapy + nutrition."},
    {term:"Binge Eating Disorder",def:"Repeated large food consumption without purging. Leads to obesity and comorbidities."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
