kground:var(--blueLight);border-color:var(--blue)}.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}. <script>
const S=[{"id":0,"type":"title","title":"Understanding the Science\\nBehind Healthcare","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Eight","tags":["Healthcare Systems","Pharmacology","Dosage Calculations","Nutrition"],"fs":30},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Identify MA roles, responsibilities, scope of practice, and titles","Identify roles and credentials of medical providers and allied health personnel","Differentiate licensing vs. certification and identify maintenance requirements","Describe types of healthcare organizations and delivery models","Identify technology-based methods for providing healthcare","Differentiate fee-for-service and value-based payment models","Differentiate general versus specialty healthcare","Describe ancillary services and complementary therapies","Identify medication classifications, indications, and common medications","Describe controlled substance schedules","Differentiate side effects, adverse effects, indications, and contraindications","Compute metric/standard measurements, dosage calculations, and conversions","Identify medication formulations, routes, and look-alike/sound-alike medications","Describe pharmacokinetics and the rights of medication administration","Identify dietary nutrients, guidelines, food labels, vitamins, and eating disorders"]},{"id":2,"type":"twocol","title":"The Medical Assistant — Roles, Scope & Credentials","lt":"Administrative & Clinical Duties","lc":"var(--accent)","li":[{"l":"Administrative","d":"Scheduling, registration, records, insurance claims, copays, correspondence."},{"l":"Clinical","d":"Vitals, patient prep, lab specimens, diagnostic testing, immunizations."},{"l":"Scope of practice","d":"Under physician supervision. Tasks allowed by state law and org policy."},{"l":"Certification","d":"Not required in most states but improves placement, wages, and career."},{"l":"Renewal","d":"NHA: every 2 years — retake exam or 10 hours CE."}],"rt":"Credentials & Certifications","rc":"var(--blue)","ri":[{"l":"CMA (AAMA) / RMA (AMT)","d":"Most widely recognized. Required by many employers and gov programs."},{"l":"CMAA","d":"Medical administrative assistant."},{"l":"CPT","d":"Phlebotomy technician."},{"l":"CET","d":"EKG technician."},{"l":"CBCS / CEHRS","d":"Billing & coding / Electronic health records specialist."}]},{"id":3,"type":"twocol","title":"Healthcare Team, Delivery Models & Payment","lt":"Providers & Allied Health","lc":"var(--warm)","li":[{"l":"Providers","d":"MD, DO, PA (under MD/DO), NP (independent in some states), RN, LPN/LVN."},{"l":"Allied Health","d":"Lab techs, pharmacy techs, PT, OT, radiology techs, receptionists."},{"l":"Care Settings","d":"Outpatient/ambulatory (most MA work), inpatient, home health, hospice."},{"l":"PCMH","d":"PCP leads interprofessional team coordinating all care aspects. MAs integral."}],"rt":"Technology & Payment Models","rc":"var(--blue)","ri":[{"l":"Telehealth","d":"Good for follow-ups, chronic conditions, education. In-person for exams, new pain."},{"l":"Patient Portals","d":"Direct access to results, messaging, scheduling."},{"l":"Fee-for-service","d":"Providers billed per service rendered."},{"l":"Value-based care","d":"Rewards prevention, outcomes, efficiency over volume (Quadruple Aim)."},{"l":"Other models","d":"HMO, PPO, POS, capitation, managed care."}]},{"id":4,"type":"table","title":"Medication Classifications & Examples","hd":["Classification","Indication","Common Examples"],"rows":[["Analgesics","Pain relief","Acetaminophen, hydrocodone, codeine"],["Antibiotics","Bacterial infections","Amoxicillin, ciprofloxacin"],["Antihypertensives","Lower blood pressure","Metoprolol, lisinopril, valsartan"],["Anti-inflammatories","Reduce inflammation","Ibuprofen, celecoxib, naproxen"],["Antidepressants","Relieve depression","Fluoxetine, duloxetine, doxepin"],["Diuretics","Eliminate excess fluid","Furosemide, hydrochlorothiazide"],["Oral Hypoglycemics","Reduce blood glucose","Metformin, glyburide, pioglitazone"],["Bronchodilators","Relax airway muscles","Albuterol, theophylline"],["Anticoagulants","Delay blood clotting","Warfarin, apixaban, heparin"],["Antilipemics","Lower cholesterol","Atorvastatin, fenofibrate"],["Hormone Replacements","Stabilize deficiencies","Levothyroxine, insulin, estrogen"]]},{"id":5,"type":"twocol","title":"Controlled Substances & Drug Effects","lt":"CSA Schedules","lc":"var(--warm)","li":[{"l":"Schedule I","d":"No medical use. Highest abuse. Heroin, LSD, cannabis (federal)."},{"l":"Schedule II","d":"High abuse/dependence. Morphine, oxycodone, fentanyl. Secured steel cabinet."},{"l":"Schedule III","d":"Moderate potential. Ketamine, buprenorphine, acetaminophen with codeine."},{"l":"Schedule IV","d":"Low potential. Tramadol, benzodiazepines (diazepam, alprazolam)."},{"l":"Schedule V","d":"Lowest potential. Diphenoxylate with atropine, pregabalin."}],"rt":"Drug Effects — Key Distinctions","rc":"var(--blue)","ri":[{"l":"Therapeutic effect","d":"Intended, beneficial action — the reason it was prescribed."},{"l":"Side effect","d":"Predictable, undesirable but not harmful (e.g., sedation)."},{"l":"Adverse effect","d":"Unintended and potentially harmful (e.g., angioedema). Requires care."},{"l":"Indication","d":"Symptom or condition the medication treats."},{"l":"Contraindication","d":"Condition making medication inadvisable (most common: allergy)."},{"l":"Drug interactions","d":"Meds, foods (grapefruit), or supplements can alter drug effects."}]},{"id":6,"type":"twocol","title":"Dosage Calculations & Pharmacokinetics","lt":"Measurements & Calculations","lc":"var(--accent)","li":[{"l":"Metric system","d":"Weight: kg, g, mg, mcg. Volume: L, mL. Move decimal 3 places per step."},{"l":"Standard conversions","d":"1 tsp=5 mL | 1 tbsp=15 mL | 1 oz=30 mL | 2.2 lb=1 kg"},{"l":"Ratio/proportion","d":"If 25 mg = 1 cap, then 50 mg = ? → 2 capsules"},{"l":"Desired ÷ Have × Qty","d":"(50 mg ÷ 25 mg) × 1 cap = 2 capsules"},{"l":"Pediatric by weight","d":"Convert lb→kg (÷2.2), × mg/kg/day, ÷ doses/day, calc volume."}],"rt":"Pharmacokinetics (ADME) & 7 Rights","rc":"var(--purple)","ri":[{"l":"Absorption","d":"Drug → bloodstream. IV = fastest; oral = slowest."},{"l":"Distribution","d":"Bloodstream → tissues. Blood-brain and placental barriers."},{"l":"Metabolism","d":"Liver converts to metabolites. Age, health, genetics affect rate."},{"l":"Excretion","d":"Kidneys eliminate most metabolites. Half-life = dosing interval."},{"l":"7 Rights","d":"Patient, Medication, Dose, Time, Route, Technique, Documentation"}]},{"id":7,"type":"twocol","title":"Routes, Formulations & LASA Medications","lt":"Routes of Administration","lc":"var(--blue)","li":[{"l":"Oral (PO)","d":"Tablets, capsules, liquids. Most common; GI absorption."},{"l":"Topical","d":"Creams, patches, ointments, gels applied to skin."},{"l":"Intradermal (ID)","d":"Into skin layers; 10–15° angle (TB test)."},{"l":"Subcutaneous (SQ)","d":"Under skin into fat; 45° angle (insulin)."},{"l":"Intramuscular (IM)","d":"Into muscle; 90° angle (vaccines — deltoid, vastus lateralis)."},{"l":"Inhalation","d":"Aerosols, dry powders directly into lungs."}],"rt":"LASA & Storage","rc":"var(--warm)","ri":[{"l":"clonidine ↔ KlonoPIN","d":"Different drugs — similar names."},{"l":"hydroxyzine ↔ hydralazine","d":"Check label 3 times; use tall-man lettering."},{"l":"hydrocodone ↔ hydromorphone","d":"Store LASA meds in separate locations."},{"l":"Schedule II storage","d":"Secured steel cabinet — locked inner and outer doors."},{"l":"Expiration dates","d":"Always check. Never administer expired medications."},{"l":"Disposal","d":"Per facility and DEA guidelines. Never flush unless directed."}]},{"id":8,"type":"twocol","title":"Nutrition — Macronutrients, Vitamins & Labels","lt":"Major Nutrients","lc":"var(--accent)","li":[{"l":"Water","d":"50–80% of body. Transport, waste removal, temp regulation. 2–3 L/day."},{"l":"Protein (4 cal/g)","d":"Amino acids — tissue repair, muscle, immune function."},{"l":"Carbs (4 cal/g)","d":"Primary energy. Simple (sugars) vs. complex (fiber, whole grains)."},{"l":"Fats (9 cal/g)","d":"Energy reserve, hormones, vitamin absorption. Unsaturated = healthy."},{"l":"Vitamins","d":"Fat-soluble: A, D, E, K. Water-soluble: B vitamins, C."}],"rt":"Labels & Disease-Specific Diets","rc":"var(--blue)","ri":[{"l":"Serving size","d":"Calories and nutrients are per serving, not per package."},{"l":"MyPlate","d":"Personalized dietary guidance based on age, sex, height, weight, activity."},{"l":"Diabetes","d":"Limit added sugars/refined carbs. Consistent small meals. Plate method."},{"l":"Kidney Disease","d":"Limit sodium (<2,300 mg). Cautious with protein. Monitor phosphorus/potassium."},{"l":"Celiac Disease","d":"Strict gluten-free (no wheat, barley, rye). Prevent cross-contact."}]},{"id":9,"type":"cards","title":"Eating Disorders","cols":3,"cards":[{"title":"Anorexia Nervosa","desc":"Self-starvation, extreme fear of weight gain, distorted body image, amenorrhea. Life-threatening — report to provider.","color":"#D94F4F"},{"title":"Bulimia Nervosa","desc":"Binge-purge cycle (vomiting, laxatives). Mood swings, guilt. Electrolyte imbalance, esophageal damage, tooth erosion.","color":"#E8853D"},{"title":"Binge Eating Disorder","desc":"Chronic overeating without purging. Leads to obesity. Eating rapidly, alone, past fullness due to shame/guilt.","color":"#8B6FC0"}]},{"id":10,"type":"takeaways","title":"Week Eight — Key Takeaways","items":["MAs work under physician supervision — only tasks allowed by state law and org policy. Know your state's rules.","Certification improves job placement, wages, and career options. Renewal requires ongoing education.","Medication classification is based on therapeutic action. Some meds belong to multiple classes.","Schedule II controlled substances: hand-signed, strictly stored, no refills, 90-day check-ins.","Always perform three label checks and the seven rights of medication administration.","Pharmacokinetics (ADME): absorption, distribution, metabolism, excretion. Liver metabolizes; kidneys excrete."]},{"id":11,"type":"quiz","title":"Knowledge Check","questions":[{"q":"Which controlled substance schedule has NO accepted medical use?","options":["Schedule I","Schedule II","Schedule III","Schedule V"],"correct":0,"explanation":"Schedule I has no accepted medical use and the highest abuse potential (heroin, LSD, cannabis federally)."},{"q":"The 'desired over have' formula is used for:","options":["Vital sign calculations","Insurance billing","Dosage calculations","Lab reference ranges"],"correct":2,"explanation":"(Desired ÷ Have) × Quantity = Dose. A core formula for medication dosage calculations."},{"q":"Which vitamin group is fat-soluble?","options":["B vitamins and C","A, D, E, K","Only vitamin D","All vitamins are water-soluble"],"correct":1,"explanation":"Fat-soluble vitamins are A, D, E, and K. Water-soluble are B vitamins and C."},{"q":"How many rights of medication administration are there?","options":["Five","Six","Seven","Eight"],"correct":2,"explanation":"Seven rights: Patient, Medication, Dose, Time, Route, Technique, and Documentation."},{"q":"What does ADME stand for in pharmacokinetics?","options":["Administration, Dispensing, Monitoring, Evaluation","Absorption, Distribution, Metabolism, Excretion","Assessment, Diagnosis, Management, Education","Analysis, Detection, Measurement, Elimination"],"correct":1,"explanation":"ADME = Absorption, Distribution, Metabolism, Excretion — how drugs move through the body."},{"q":"1 teaspoon equals how many milliliters?","options":["2.5 mL","5 mL","10 mL","15 mL"],"correct":1,"explanation":"1 tsp = 5 mL. Other conversions: 1 tbsp = 15 mL, 1 oz = 30 mL."}]},{"id":12,"type":"end","title":"End of Week Eight","subtitle":"The Science Behind Healthcare","message":"From pharmacology to nutrition, the science you've learned this week connects every clinical decision to the patient's wellbeing."}];

function rTitle(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px;position:relative"><div style="position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:6px"><div style="width:24px;height:2px;background:var(--accent)"></div><span style="font-size:9px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase">${e(s.subtitle)}</span></div><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">${e(s.week)}</div><h1 style="font-family:var(--ff);font-size:${s.fs||34}px;font-weight:700;color:#fff;margin:0;line-height:1.25;white-space:pre-line">${e(s.title)}</h1><div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center">${s.tags.map(t=>`<span class="tag">${e(t)}</span>`).join('')}</div><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:3px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}">${j+1}</div><div style="font-size:10px;color:var(--text);line-height:1.4;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:4px;font-style:italic">Click to reveal</p>':''}</div>${F(i)}</div>`}
function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb">${s.desc?`<p style="font-size:10px;color:var(--textMid);margin:0 0 8px">${e(s.desc)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:7px">${s.cards.map(c=>`<div class="cd" style="border-${c.b||'left'}:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div>${s.note?`<div class="co co-${s.nt||'a'}" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[11].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[11].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
