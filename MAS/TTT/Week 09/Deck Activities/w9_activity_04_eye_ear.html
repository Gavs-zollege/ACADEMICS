<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Eye & Ear Procedures</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#14082a,#1c1040,#100828);font-family:'Outfit',sans-serif;padding:24px 16px;color:#ece0ff}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#9880c0;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#9880c0;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#a3e635);border-radius:10px;transition:width .4s}.question{background:#1c1040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#9880c0;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#9880c0;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#14082a;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">👁️</div><h1>Eye & Ear Procedures</h1><p class="sub">Test your instillation and irrigation knowledge</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"For ADULT ear drops, pull the pinna:",opts:["Outward and DOWNWARD","Outward and UPWARD","Straight back","Don't pull at all"],a:1,tip:"Adults = UP. Children = DOWN. The direction determines whether drops reach the canal."},
{q:"For CHILDREN/INFANTS ear drops, pull the pinna:",opts:["Outward and UPWARD","Outward and DOWNWARD","Straight out","Press inward"],a:1,tip:"Children = DOWN. Adults = UP. Opposite directions!"},
{q:"Eye irrigation flows from which direction?",opts:["Outer to inner corner","Inner (medial) to outer (lateral) canthus","Top to bottom","Any direction is fine"],a:1,tip:"Always inner to outer — prevents contamination of the other eye or tear duct."},
{q:"After ear instillation, the patient should remain on their side for:",opts:["1 minute","5 minutes","15 minutes","30 minutes"],a:1,tip:"5 minutes on the side to let drops absorb. Insert loose cotton ball if ordered."},
{q:"When instilling eye drops, the applicator should be held:",opts:["Touching the eye for precision","About ½ inch above the conjunctival sac","2 inches above the eye","Against the eyelid"],a:1,tip:"½ inch above the sac. NEVER touch the eye or skin with the applicator — prevents contamination."},
{q:"Eye ointment is applied along the lower lid moving from:",opts:["Outer to inner corner","Inner to outer corner","Center outward","Any direction"],a:1,tip:"Thin ribbon from inner to outer corner along the inside edge of the lower lid."},
{q:"After ear irrigation, instruct the patient to lie on the irrigated side for:",opts:["5 minutes","10 minutes","15 minutes","30 minutes"],a:2,tip:"15 minutes on the irrigated side to allow residual solution to drain."},
{q:"Only ___ ophthalmic medications may be used in the eye.",opts:["Otic","Sterile ophthalmic","Any liquid","Topical skin"],a:1,tip:"ONLY sterile ophthalmic medications. Follow strict sterile technique throughout."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=7?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Ear pinna direction is critical: UP for adults, DOWN for children. Eye irrigation: inner to outer.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
