<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Exam Room Prep Quiz</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#091a1a,#0e2828,#061518);font-family:'Sora',sans-serif;padding:24px 16px;color:#e0fff5}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#60aa98;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#60aa98;font-weight:700;font-size:14px}.topbar .sc{color:#2dd4bf;font-weight:800;font-size:14px}.bar{height:6px;background:#123838;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#2dd4bf,#fb7185);border-radius:10px;transition:width .4s}.question{background:#0e2424;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #2dd4bf}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#123838;border:2px solid #123838;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#2dd4bf;font-weight:800;margin-right:12px}.opt.correct{background:rgba(52,211,153,.15);border-color:#34d399}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#0e2424}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#34d399}.tip strong.no{color:#fb7185}.tip span{color:#60aa98;font-weight:600;font-size:14px}.done{text-align:center;background:#0e2424;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#60aa98;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#2dd4bf;color:#091a1a;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🏥</div><h1>Exam Room Prep Quiz</h1><p class="sub">Room setup, patient prep & special populations</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"The FIRST thing to check each morning before patients arrive is:",opts:["The break room","The day's schedule — patient names and reasons for visits","Your email","The supply closet"],a:1,tip:"The schedule tells you what rooms, equipment, and supplies to prepare in advance."},
{q:"Between every patient, you must:",opts:["Just change the table paper","Disinfect all surfaces, allow to dry, replace paper and pillow cover, discard disposables","Spray air freshener","Only clean if visibly soiled"],a:1,tip:"Full disinfection between every patient — counters, chair, equipment, exam table."},
{q:"Before entering an exam room, you should always:",opts:["Walk right in","Knock and ask permission","Open the door slowly and peek","Send a text message"],a:1,tip:"Always knock and ask. Never enter without patient consent. Introduce yourself and verify identity."},
{q:"A child should NEVER be left alone on:",opts:["A chair","The exam table, scale, or anywhere with a fall risk","The floor","A couch"],a:1,tip:"Never leave a child unattended on the exam table. Fall risk is too high."},
{q:"When assisting a patient with a physical disability, you should:",opts:["Immediately help without asking","Ask how they prefer to be assisted — never assume","Move their wheelchair without permission","Avoid offering help entirely"],a:1,tip:"Observe, offer, but let the patient do as much independently as possible. Always ask first."},
{q:"When communicating with older adults, avoid:",opts:["Speaking clearly","Condescending terms like 'sweetie' or 'honey'","Making eye contact","Allowing extra time"],a:1,tip:"Even well-meaning terms like 'sweetie' are disrespectful. Use their name. Allow extra time."},
{q:"After a procedure, before the patient leaves, always provide:",opts:["A bill only","Follow-up, aftercare, and referral information","Nothing — they'll call if needed","A survey"],a:1,tip:"Assist off the table, provide privacy, give follow-up/aftercare/referral info before departure."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Review the schedule before patients arrive. Prepare the right room with the right equipment in advance.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
