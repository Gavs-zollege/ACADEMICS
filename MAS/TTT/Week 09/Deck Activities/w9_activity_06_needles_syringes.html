<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Needles & Syringes Match</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>*{margin:0;padding:0;box-sizing:border-box}body{height:100vh;overflow:hidden;background:#0B1D2C;font-family:'Inter',sans-serif;color:#FFF}.wrap{max-width:740px;margin:0 auto;height:100vh;display:flex;flex-direction:column;padding:12px 16px 0}.header{text-align:center;margin-bottom:8px;flex-shrink:0}.header .icon{font-size:32px}h1{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:22px;margin:4px 0 2px}.sub{color:#94A3B8;font-weight:600;font-size:13px}.badge{display:inline-block;margin-top:4px;background:#132F42;padding:4px 14px;border-radius:20px;border:1px solid rgba(45,212,191,.25);color:#2DD4BF;font-weight:800;font-size:12px}.game-area{flex:1;min-height:0;display:flex;flex-direction:column}.fb-bar{text-align:center;padding:6px;margin-bottom:6px;border-radius:8px;font-weight:700;font-size:12px;flex-shrink:0}.fb-bar.ok{background:rgba(52,211,153,.15);color:#34D399}.fb-bar.no{background:rgba(248,113,113,.15);color:#FCA5A5}.cols{display:flex;gap:10px;flex-wrap:wrap;flex:1;min-height:0;overflow-y:auto;padding-bottom:8px}.col{flex:1 1 280px;display:flex;flex-direction:column}.col-label{font-weight:800;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;flex-shrink:0}.col-label.items{color:#2DD4BF}.col-label.matches{color:#FBBF24}.card{padding:8px 12px;margin-bottom:5px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer;transition:all .18s;border:2px solid transparent}.card.item{background:#132F42}.card.item:hover{background:#1A3A50}.card.item.selected{background:rgba(45,212,191,.12);border-color:#2DD4BF}.card.item.matched{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.25);opacity:.5;cursor:default}.card.match{background:#1A3A50;font-weight:600;font-size:11px}.card.match:hover{background:#1F4560}.card.match.used{background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.25);opacity:.5;cursor:default}.card.match.wrong{background:rgba(248,113,113,.15);border-color:#F87171;animation:shake .35s}.card.match.correct-flash{background:rgba(52,211,153,.15);border-color:#34D399;animation:pulse .4s}.done{text-align:center;background:#132F42;border-radius:18px;padding:28px;border:2px solid rgba(52,211,153,.25);margin:auto 0}.done .big{font-size:40px}.done h2{font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:24px;margin:8px 0 4px}.done p{color:#E2E8F0;font-weight:500;font-size:13px;margin-bottom:16px;line-height:1.5}.btn{padding:10px 30px;border:none;border-radius:10px;background:linear-gradient(135deg,#14B8A6,#0D9488);color:white;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif}.btn:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(20,184,166,0.4)}.btn-redo{padding:10px 28px;border:1.5px solid #5EEAD4;border-radius:10px;background:transparent;color:#5EEAD4;font-weight:800;font-size:14px;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:8px}.btn-redo:hover{background:rgba(94,234,212,0.1);transform:translateY(-1px)}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,211,153,0.4)}100%{box-shadow:0 0 0 8px rgba(52,211,153,0)}}</style></head>
<body><div class="wrap"><div class="header"><div class="icon">🔬</div><h1>Needles & Syringes Match</h1><p class="sub">Match each term to its description</p><div class="badge" id="counter">0 / 7 matched</div></div>
<div id="game" class="game-area"><div class="fb-bar" id="feedback" style="display:none"></div><div class="cols"><div class="col" id="itemsCol"><div class="col-label items">📌 Term</div></div><div class="col" id="matchesCol"><div class="col-label matches">🎯 Description</div></div></div></div>
<div id="doneBox" class="done" style="display:none"></div></div>
<script>
var PAIRS=[{"item": "Higher gauge number", "match": "Smaller lumen (opening) — 25G is thinner than 18G"}, {"item": "Tuberculin syringe", "match": "0.5–1 mL, calibrated in 0.01 mL for precise small doses"}, {"item": "Insulin syringe", "match": "Calibrated in units — U-100 only with U-100 insulin"}, {"item": "Multi-dose vial", "match": "Wipe stopper with alcohol; expires 28 days after opening"}, {"item": "Ampule", "match": "Snap neck; use filter needle to prevent glass fragments"}, {"item": "Bevel position", "match": "Always insert bevel-side UP for smoother penetration"}, {"item": "One-handed scoop", "match": "Only method to recap UNUSED needles if absolutely needed"}];var ACTIVE=PAIRS.slice();var shuffled,selected=null,matched={},count=0,mistakes=0,missedPairs={};
function shuffle(a){return[].concat(a).sort(function(){return Math.random()-.5})}
function render(){var ic=document.getElementById("itemsCol"),mc=document.getElementById("matchesCol");ic.innerHTML='<div class="col-label items">📌 Term</div>';mc.innerHTML='<div class="col-label matches">🎯 Description</div>';ACTIVE.forEach(function(p,i){var d=document.createElement("div");d.className="card item"+(matched[i]!==undefined?" matched":selected===i?" selected":"");d.textContent=(matched[i]!==undefined?"✅ ":"")+p.item;if(matched[i]===undefined)d.onclick=function(){selected=i;render()};ic.appendChild(d)});shuffled.forEach(function(m,i){var d=document.createElement("div");var used=false;for(var k in matched){if(matched[k]===i){used=true;break}}d.className="card match"+(used?" used":"");d.textContent=(used?"✅ ":"")+m.match;d.id="m-"+i;if(!used)d.onclick=function(){tryMatch(i)};mc.appendChild(d)});document.getElementById("counter").textContent=count+" / "+ACTIVE.length+" matched";}
function tryMatch(mi){if(selected===null)return;var fb=document.getElementById("feedback");if(ACTIVE[selected].match===shuffled[mi].match){matched[selected]=mi;count++;fb.style.display="block";fb.className="fb-bar ok";fb.textContent="✅ "+ACTIVE[selected].item+" → "+shuffled[mi].match;selected=null;render();if(count===ACTIVE.length)setTimeout(showDone,800);setTimeout(function(){fb.style.display="none"},1200)}else{missedPairs[selected]=true;mistakes++;fb.style.display="block";fb.className="fb-bar no";fb.textContent="❌ "+ACTIVE[selected].item+" → "+ACTIVE[selected].match;var el=document.getElementById("m-"+mi);el.classList.add("wrong");for(var si=0;si<shuffled.length;si++){if(shuffled[si].match===ACTIVE[selected].match){var ce=document.getElementById("m-"+si);if(ce)ce.classList.add("correct-flash");break}}setTimeout(function(){el.classList.remove("wrong");var all=document.querySelectorAll(".correct-flash");for(var j=0;j<all.length;j++)all[j].classList.remove("correct-flash");fb.style.display="none"},1500)}}
function showDone(){document.getElementById("game").style.display="none";var d=document.getElementById("doneBox");d.style.display="block";var mc=Object.keys(missedPairs).length;var html='<div class="big">'+(mistakes===0?"🎉":"⭐")+"</div><h2>"+(mistakes===0?"Perfect Match!":count+"/"+ACTIVE.length+" Matched")+"</h2><p>Higher gauge = smaller needle. Always insert bevel-up. Used needles go directly into sharps.</p>";html+='<button class="btn" onclick="resetGame()">Play Again</button>';if(mc>0)html+='<br><button class="btn-redo" onclick="redoMissed()">Redo Missed ('+mc+")</button>";d.innerHTML=html;}
function resetGame(){ACTIVE=PAIRS.slice();selected=null;matched={};count=0;mistakes=0;missedPairs={};shuffled=shuffle(ACTIVE);document.getElementById("game").style.display="flex";document.getElementById("doneBox").style.display="none";render()}
function redoMissed(){var r=[];for(var k in missedPairs)r.push(ACTIVE[parseInt(k)]);ACTIVE=r;selected=null;matched={};count=0;mistakes=0;missedPairs={};shuffled=shuffle(ACTIVE);document.getElementById("game").style.display="flex";document.getElementById("doneBox").style.display="none";render()}
shuffled=shuffle(ACTIVE);render();
</script></body></html>
