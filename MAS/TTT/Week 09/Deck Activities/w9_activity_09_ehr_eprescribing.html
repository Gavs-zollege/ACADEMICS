<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EHR & E-Prescribing</title><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0d1a0f,#112010,#0a150c);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#e6f7ea}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:700;font-size:30px;margin:8px 0 4px}.sub{color:#7aab88;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7aab88;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:700;font-size:14px}.bar{height:6px;background:#1c3820;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:10px;transition:width .4s}.question{background:#142818;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a3e635}.question p{font-weight:700;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1c3820;border:2px solid #1c3820;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a3e635;font-weight:700;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#142818}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#7aab88;font-weight:600;font-size:14px}.done{text-align:center;background:#142818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:700;font-size:28px;margin:12px 0}.done p{color:#7aab88;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a3e635;color:#0d1a0f;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">💻</div><h1>EHR & E-Prescribing</h1><p class="sub">CPOE, electronic prescriptions & telehealth</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"The key difference between EMR and EHR is:",opts:["They're the same thing","EMR = single organization; EHR = shared across multiple providers","EMR is digital; EHR is paper","EHR is older technology"],a:1,tip:"EMR = within one practice. EHR = extends across organizations for coordinated care."},
{q:"CPOE (Computerized Provider Order Entry) eliminates:",opts:["The need for providers","Handwriting errors in orders","Patient consent","Insurance verification"],a:1,tip:"Electronic orders for meds, labs, radiology, referrals. Flags drug interactions and allergies."},
{q:"E-prescribing controlled substances requires:",opts:["A fax machine","DEA-approved EPCS software","A paper backup","Nothing special"],a:1,tip:"EPCS = Electronic Prescribing for Controlled Substances. DEA-approved software required."},
{q:"Required elements for an electronic prescription include:",opts:["Only the drug name","DEA number, provider phone, date/time, pharmacy name","Patient's email","Insurance authorization number"],a:1,tip:"DEA number, provider phone, date/time of transmission, and pharmacy name are all required."},
{q:"Telehealth is appropriate for all of the following EXCEPT:",opts:["Chronic condition follow-ups","Behavioral health visits","Physical examinations requiring palpation","Dermatology consultations"],a:2,tip:"Physical exams, new pain, and hands-on diagnostic testing require in-person visits."},
{q:"During a telehealth visit, the MA should:",opts:["Skip the history since it's virtual","Gather history, med list, and remind patient to have self-reported vitals ready","Only handle scheduling","Avoid asking questions"],a:1,tip:"Confirm tech, test connection, gather history and meds, remind patient about vitals."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=5?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>EHR, CPOE, and e-prescribing reduce errors — but accuracy depends on the person entering the data.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
