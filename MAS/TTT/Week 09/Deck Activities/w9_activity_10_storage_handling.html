<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Storage & Handling</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#180a12,#26101c,#120816);font-family:'Manrope',sans-serif;padding:24px 16px;color:#ffe8f2}.wrap{max-width:600px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#b87090;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .ct{color:#b87090;font-weight:700;font-size:14px}.topbar .sc{color:#4ade80;font-weight:700;font-size:14px}.bar{height:6px;background:#301828;border-radius:10px;margin-bottom:24px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#f472b6,#4ade80);border-radius:10px;transition:width .4s}.statement{background:#220e18;padding:24px 28px;border-radius:20px;margin-bottom:24px;border-left:4px solid #f472b6}.statement p{font-weight:700;font-size:19px;line-height:1.7}.blank{display:inline-block;padding:4px 18px;border-radius:10px;margin:0 4px;font-weight:700;min-width:50px;text-align:center}.blank.empty{background:rgba(244,114,182,.15);color:#fbbf24;border-bottom:3px solid #fbbf24}.blank.ok{background:rgba(74,222,128,.2);color:#4ade80;border-bottom:3px solid #4ade80}.blank.no{background:rgba(251,113,133,.2);color:#fb7185;border-bottom:3px solid #fb7185}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid button{padding:14px 18px;border-radius:14px;background:#301828;border:2px solid #301828;color:#ffe8f2;font-weight:700;font-size:17px;cursor:pointer;font-family:inherit;transition:all .2s}.grid button:hover{filter:brightness(1.15)}.grid button.ok{background:rgba(74,222,128,.13);border-color:#4ade80}.grid button.no{background:rgba(251,113,133,.13);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#220e18}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#b87090;font-weight:600;font-size:14px}.done{text-align:center;background:#220e18;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#b87090;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f472b6;color:#180a12;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🌡️</div><h1>Storage & Handling</h1><p class="sub">Fill in the blanks about medication and vaccine storage</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const ITEMS=[
{text:"Vaccine refrigerator temperature should be maintained at |___| °C.",answer:"2–8",opts:["0–2","2–8","8–12","10–15"],tip:"2–8°C is the standard range. Check and log daily."},
{text:"Multi-dose vials expire |___| days after opening.",answer:"28",opts:["7","14","28","90"],tip:"28 days. Always write the opening date on the vial."},
{text:"Medications should be rotated by expiration date — |___| expiring first.",answer:"soonest",opts:["latest","soonest","newest","largest"],tip:"Soonest-expiring first (FIFO). Never administer expired medications."},
{text:"Controlled substance logs require a daily count by |___| people.",answer:"two",opts:["one","two","three","any"],tip:"Two people must count daily. All use logged in a logbook or electronic sign-off."},
{text:"Freezer temperatures (if storing vaccines) must be checked |___| daily.",answer:"twice",opts:["once","twice","three times","weekly"],tip:"Twice daily for freezers. Once daily for refrigerators. Log all temperatures."},
{text:"The injection site should be cleaned with alcohol for |___| seconds.",answer:"30",opts:["5","10","30","60"],tip:"30 seconds of friction cleaning. Allow to fully air dry before injecting."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),it=ITEMS[ci];const parts=it.text.split('|___|');let bc='blank empty',bt='???';if(chosen!==null){bc='blank '+(chosen===it.answer?'ok':'no');bt=chosen}let h='<div class="topbar"><span class="ct">'+(ci+1)+'/'+ITEMS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/ITEMS.length*100)+'%"></div></div><div class="statement"><p>'+parts[0]+'<span class="'+bc+'">'+bt+'</span>'+parts[1]+'</p></div><div class="grid">';it.opts.forEach(o=>{let cls='';if(chosen===o)cls=o===it.answer?'ok':'no';h+="<button class=\""+cls+"\" "+(chosen===null?"onclick=\"pick('"+o.replace(/'/g,"\\'")+"')\"":"")+">"+o+"</button>"});h+='</div>';if(chosen!==null){const ok=chosen===it.answer;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Answer: '+it.answer)+'</strong><span>'+it.tip+'</span></div>'}g.innerHTML=h}function pick(o){if(chosen!==null)return;chosen=o;if(o===ITEMS[ci].answer)score++;renderQ();setTimeout(()=>{if(ci+1<ITEMS.length){ci++;chosen=null;renderQ()}else showDone()},1800)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=5?'🏆':'💪')+'</div><h2>'+score+'/'+ITEMS.length+' Correct!</h2><p>Proper storage protects medication integrity. Check temps daily, rotate stock, never use expired meds.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
