<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 9 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 9 Glossary</h1>
  <p class="sub">General Patient Care — Foundations</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Exam Room & Safety",color:"#E05555",terms:[
    {term:"Examination Room",def:"Clinical space for assessment. Cleaned between patients, table paper replaced after every encounter."},
    {term:"Supplies",def:"Disposable single-use items — table paper, gowns, tongue depressors, gloves, syringes."},
    {term:"Equipment",def:"Durable reusable items requiring cleaning, maintenance, calibration. Stethoscope, BP cuff, otoscope."},
    {term:"Sphygmomanometer",def:"Blood pressure measurement instrument — cuff, gauge, and stethoscope. Must be appropriate size."},
    {term:"Otoscope",def:"Handheld instrument with light and lens to examine the ear canal and tympanic membrane."},
    {term:"Ophthalmoscope",def:"Handheld instrument to examine the interior of the eye — retina, optic disc, blood vessels."},
    {term:"Standard Precautions",def:"Infection control for every patient — hand hygiene, PPE, sharps handling, biohazard disposal."},
    {term:"ADA",def:"Americans with Disabilities Act — requires healthcare facilities be accessible to individuals with disabilities."},
  ]},
  {name:"Positioning",color:"#6B7B8D",terms:[
    {term:"Supine Position",def:"Flat on back, arms at sides. Used for anterior body exams. Drape chest to feet."},
    {term:"Prone Position",def:"Face down on stomach. Used for back exams. Drape upper back to feet."},
    {term:"Dorsal Recumbent",def:"On back, knees bent, feet flat. Relaxes abdomen. Used for head, chest, vaginal, rectal exams."},
    {term:"Lithotomy Position",def:"Feet in locked stirrups, patient at table edge. Used for vaginal exams and Pap tests."},
    {term:"Fowler's Position",def:"Sitting upright at 90°. Used for head, neck, upper body exams and breathing difficulty."},
    {term:"Semi-Fowler's Position",def:"Head raised ~45°. Used post-surgical and for breathing/back difficulties."},
    {term:"Left Lateral Position",def:"Lying on left side, right leg bent up. Used for rectal exams and enemas."},
    {term:"Knee-Chest Position",def:"Kneeling with buttocks elevated. Used for proctologic and sigmoidoscopy exams."},
    {term:"Draping",def:"Paper/cloth cover protecting patient privacy. Expose only the minimum area needed for exam."},
  ]},
  {name:"Med Routes",color:"#8B6AAE",terms:[
    {term:"Nonparenteral (Enteral)",def:"Drug delivered through GI tract — oral, sublingual, buccal, rectal. Most common method."},
    {term:"Parenteral",def:"Bypasses GI tract — injection, topical, transdermal, inhalation. For faster/precise dosing."},
    {term:"Oral (PO) Route",def:"Swallowed, absorbed through stomach/intestines. Most common route. Consider food timing."},
    {term:"Sublingual Route",def:"Under the tongue, absorbed through mucous membranes. Rapid onset. Example: nitroglycerin."},
    {term:"Buccal Route",def:"Between cheek and gum, absorbed through mucous membrane. No eating/drinking until absorbed."},
    {term:"Topical Route",def:"Applied to skin/mucous membrane surface. Acts locally. Creams, ointments, gels."},
    {term:"Transdermal Route",def:"Adhesive patch delivering medication through skin systemically. Slow, sustained release."},
    {term:"Inhalation Route",def:"Inhaled into lungs or through nose. Rapid respiratory delivery. Bronchodilators."},
    {term:"MAR",def:"Medication Administration Record — legal document of every medication given. Completed after administration."},
  ]},
  {name:"Injection Technique",color:"#E74C6F",terms:[
    {term:"Intradermal (ID)",def:"Between epidermis and dermis at 5–15°, bevel up. ≤0.1 mL. Wheal must form. TB/allergy testing."},
    {term:"Subcutaneous (SC)",def:"Into fat tissue at 45°. Pinch skin. ≤1.5 mL. Arm, abdomen, thigh. Insulin, heparin. Don't massage."},
    {term:"Intramuscular (IM)",def:"Deep into muscle at 90°. Stretch skin taut. Deltoid ≤1 mL, ventrogluteal/VL ≤3 mL. No aspiration needed."},
    {term:"Deltoid Site",def:"Upper arm, 1–2 inches below acromion process. ≤1 mL. Not for infants/children <3."},
    {term:"Ventrogluteal Site",def:"Outer hip — safest IM site. Greatest muscle thickness, no major nerves/vessels. ≤3 mL."},
    {term:"Vastus Lateralis Site",def:"Outer thigh, middle third. Preferred for infants/children <3. ≤3 mL in adults."},
    {term:"Needle Gauge",def:"Higher number = smaller opening. Selection based on medication viscosity and injection type."},
    {term:"Bevel",def:"Angled needle tip. Must face upward for ID/SC injections for proper delivery and wheal formation."},
    {term:"Wheal",def:"Pale raised bubble confirming correct intradermal injection. No wheal = too deep, must repeat."},
    {term:"Aspiration",def:"Pulling plunger back to check for blood. CDC no longer recommends for IM injections."},
    {term:"One-Handed Scoop Method",def:"Recapping unused needles one-handed. Used needles must never be recapped."},
  ]},
  {name:"Syringes & Sterile",color:"#4A90B8",terms:[
    {term:"Hypodermic Syringe",def:"General-purpose, calibrated in mL. 3 mL most common. Used for IM, SC, other injections."},
    {term:"Tuberculin Syringe",def:"Narrow 0.5–1 mL syringe calibrated in hundredths. For very small volumes and TB/heparin doses."},
    {term:"Insulin Syringe",def:"Calibrated in units (U-100), not mL. Fixed non-detachable needle. Only for insulin."},
    {term:"Vial",def:"Sealed container with rubber stopper. Inject air equal to withdrawal volume. Single or multi-dose."},
    {term:"Multi-Dose Vial",def:"Multiple doses. Wipe before each use. Write opened date. Expires 28 days unless stated otherwise."},
    {term:"Ampule",def:"Sealed glass single-dose container. Snap neck open. Use filter needle to withdraw medication."},
    {term:"Filter Needle",def:"Prevents glass/rubber particles from entering syringe. Replace with standard needle before injection."},
    {term:"Reconstitution",def:"Adding liquid diluent to powdered medication to create injectable solution. Verify diluent type/volume."},
    {term:"Sharps Container",def:"Puncture-resistant container at point of use. Drop used needles directly in — never transport uncapped."},
  ]},
  {name:"Eye & Ear",color:"#1A8A7D",terms:[
    {term:"Eye Instillation",def:"Sterile drops/ointment into eye. Patient looks up, lower lid pulled down. Don't touch applicator to eye."},
    {term:"Conjunctival Sac",def:"Pocket formed when lower eyelid is pulled down — where eye drops are instilled."},
    {term:"Canthus",def:"Corner of the eye. Inner = near nose; outer = near ear. Irrigation flows inner to outer."},
    {term:"Eye Irrigation",def:"Warmed sterile solution flushing the eye. Inner to outer canthus. Separate equipment per eye."},
    {term:"Ear Instillation",def:"Drops into ear canal. Adults: pull pinna outward/upward. Children: outward/downward. Stay 5 min."},
    {term:"Pinna (Auricle)",def:"Visible outer ear. Manipulated during instillation/irrigation to straighten canal."},
    {term:"Cerumen",def:"Earwax. Impacted cerumen blocks canal. Removed by ear irrigation when necessary."},
    {term:"Ear Irrigation",def:"Warmed solution sprayed into ear canal to remove impacted cerumen. Otoscope exam follows."},
  ]},
  {name:"EHR & E-Prescribing",color:"#E2B94C",terms:[
    {term:"EMR",def:"Electronic Medical Record — digital chart within a single organization. Not designed for external sharing."},
    {term:"EHR",def:"Electronic Health Record — extends across organizations for coordinated, continuous care."},
    {term:"CPOE",def:"Computerized Provider Order Entry — electronic orders reducing handwriting and transcription errors."},
    {term:"CDSS",def:"Clinical Decision Support — real-time checks for interactions, allergies, incorrect doses, duplicates."},
    {term:"E-Prescribing",def:"Electronic prescription transmission from EHR to pharmacy. Reduces errors and fraud risk."},
    {term:"EPCS",def:"Electronic Prescriptions for Controlled Substances — requires DEA-approved software for both sides."},
    {term:"MAR (EHR)",def:"Electronic medication record. CPOE orders auto-populate. MA completes after administration."},
    {term:"Telehealth",def:"Remote healthcare via technology. Doesn't alter standard of practice or legal obligations."},
    {term:"Telemedicine",def:"Subset of telehealth — specifically remote clinical provider-to-patient services."},
    {term:"Remote Patient Monitoring",def:"Real-time health data from wearables/home devices transmitted to the care team."},
  ]},
  {name:"Med Safety & Storage",color:"#4CAF90",terms:[
    {term:"Allergic Reaction",def:"Immune response to an allergen — mild (hives) to severe (anaphylaxis). Confirm allergies every visit."},
    {term:"Anaphylaxis",def:"Severe systemic reaction — airway spasm, swelling, BP drop. First-line: epinephrine IM. Call 911."},
    {term:"Epinephrine (EpiPen)",def:"IM into upper outer thigh. Hold 10 seconds, massage site. Supportive — not a substitute for 911."},
    {term:"Sterile Field",def:"Area free of all microorganisms. If any doubt about sterility, treat as unsterile and replace."},
    {term:"Biohazard Container",def:"For blood/infectious material contaminated items. Separate from sharps container."},
    {term:"Storage Temperature",def:"Room: 20–25°C. Refrigerated: 2–8°C (dedicated medical fridge). Frozen: –50 to –15°C. Daily temp logs."},
    {term:"Expiration Date",def:"After this date, medication is not guaranteed effective or safe. Never administer expired meds."},
    {term:"Medication Disposition Record",def:"Log documenting removal/disposal of expired, discontinued, or contaminated medications."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
