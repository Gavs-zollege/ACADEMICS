<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 9 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {--text:#0e0e1a;--text-secondary:#3a3a50;--surface-1:#e0e0ec;--surface-2:#d0d0dd;--border:#c0c0cc;--bg:#d8d8e4;--card-shadow:0 2px 12px rgba(26,26,46,0.06);--font-body:'DM Sans',-apple-system,sans-serif;--font-display:'Playfair Display',Georgia,serif}
  @media(prefers-color-scheme:dark){:root{--text:#e4e4f0;--text-secondary:#9898b0;--surface-1:#1c1c2e;--surface-2:#282840;--border:#363650;--bg:#111122;--card-shadow:0 2px 12px rgba(0,0,0,0.3)}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;font-weight:600}
  .app{max-width:640px;margin:0 auto;padding:28px 18px 60px}
  .header{text-align:center;margin-bottom:28px}
  .header-tag{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#C0392B;margin-bottom:6px}
  .header h1{font-family:var(--font-display);font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;line-height:1.1}
  .header p{font-size:13px;color:var(--text-secondary)}
  .search-wrap{position:relative;margin-bottom:20px}
  .search-wrap input{width:100%;padding:14px 18px 14px 46px;border-radius:14px;border:2px solid var(--border);background:var(--surface-1);color:var(--text);font-size:15px;outline:none;font-family:var(--font-body);transition:border-color .2s}
  .search-wrap input:focus{border-color:#C0392B}
  .search-wrap .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.4}
  .cat-btn{width:100%;padding:14px 18px;border-radius:14px;border:2px solid var(--border);background:var(--surface-1);cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;font-family:var(--font-body)}
  .cat-btn:hover{border-color:#aaa}
  .cat-btn .emoji{font-size:22px}
  .cat-btn .name{font-weight:700;color:var(--text);font-size:15px}
  .cat-btn .count{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
  .cat-btn .arrow{font-size:14px;color:var(--text-secondary);transition:transform .25s}
  .cat-btn.open .arrow{transform:rotate(180deg)}
  .term-card{padding:13px 16px;border-radius:11px;background:var(--surface-1);border:2px solid transparent;cursor:pointer;transition:all .15s}
  .term-card:hover{border-color:var(--border)}
  .term-card .term-name{font-weight:800;font-size:14px;color:var(--text)}
  .term-card .term-def{margin:10px 0 4px;font-size:13px;line-height:1.65;color:var(--text-secondary);font-weight:600}
  .result-card{padding:14px 18px;border-radius:12px;background:var(--surface-1);cursor:pointer;border:2px solid var(--border);transition:all .2s}
  .result-card .row{display:flex;align-items:center;gap:10px}
  .result-card .r-emoji{font-size:20px}
  .result-card .r-term{font-weight:700;color:var(--text);font-size:15px}
  .result-card .r-cat{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
  .result-card .r-def{margin:12px 0 4px 30px;font-size:14px;line-height:1.6;color:var(--text-secondary)}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-tag">Medical Assistant Program</div>
    <h1>Week 9 Glossary</h1>
    <p id="header-subtitle"></p>
  </div>
  <div id="browse-mode"></div>
</div>
<script>
const CATEGORIES = [
  {
    name: "Exam Room Preparation & Patient Safety", emoji: "🛏️", color: "#C0392B",
    terms: [
      { term: "Examination Room", def: "A clinical space used for patient assessment and procedures. Must be stocked with appropriate supplies and equipment before each patient arrives. All surfaces must be cleaned with the proper disinfectant and allowed to dry between patients. Table paper is replaced after every patient encounter." },
      { term: "Supplies", def: "Disposable items used during patient examination and treatment that are discarded after a single use. Examples include examination table paper, paper drapes and gowns, tongue depressors, alcohol pads, bandages, disposable gloves, and single-use syringes and needles." },
      { term: "Equipment", def: "Durable, reusable items used during examinations that require routine cleaning, maintenance, and calibration. Must be stored properly and not left on countertops or within patient reach. Examples: stethoscope, sphygmomanometer, thermometer, pulse oximeter, reflex hammer, otoscope, and ophthalmoscope." },
      { term: "Sphygmomanometer", def: "The medical instrument used to measure blood pressure. Consists of an inflatable cuff, a pressure gauge, and, in manual versions, a stethoscope. Also called a blood pressure cuff. Must be the appropriate size for the patient's arm to ensure accurate readings." },
      { term: "Otoscope", def: "A handheld diagnostic instrument with a light and magnifying lens used to examine the external ear canal and tympanic membrane (eardrum). Also used to view the ear canal before and after ear irrigation to assess for cerumen blockage or foreign bodies." },
      { term: "Ophthalmoscope", def: "A handheld instrument with a light source and various lenses used to examine the interior of the eye, particularly the retina, optic disc, and blood vessels. Used in neurological and ophthalmological assessments." },
      { term: "Standard Precautions", def: "A set of infection control practices applied to every patient encounter, regardless of suspected infection status. Includes hand hygiene, use of personal protective equipment (PPE), proper handling of sharps, and appropriate disposal of biohazardous waste. Designed to protect both patients and healthcare workers." },
      { term: "Americans with Disabilities Act (ADA)", def: "Federal legislation requiring that public facilities — including healthcare offices — be accessible to individuals with disabilities. Standards address doorway width, placement of door handles, grab bars and handrails, spatial accommodations for wheelchairs, and floor surfaces." },
    ],
  },
  {
    name: "Patient Positioning & Draping", emoji: "🧍", color: "#2C3E50",
    terms: [
      { term: "Supine Position", def: "The patient lies flat on their back with arms at the sides and feet supported by the extended exam table. Also called the horizontal recumbent position. Used for examinations of the anterior body — head, chest, and abdomen. Drape from the chest to the feet." },
      { term: "Prone Position", def: "The patient lies face down, flat on the stomach, with the head turned to one side. Used for back examinations and certain surgical procedures. Drape from the upper back to over the feet." },
      { term: "Dorsal Recumbent Position", def: "The patient lies flat on the back with knees bent and feet flat on the exam table. Relieves strain on the lower back and relaxes abdominal muscles. Used for head, neck, chest, vaginal, rectal, and perineal examinations. Drape from the neck to the feet." },
      { term: "Lithotomy Position", def: "Similar to dorsal recumbent, but with the patient's feet placed in locked stirrups at the end of the table, and the patient slid to the table edge. Used for vaginal examinations, Pap tests, and procedures requiring a speculum. Drape from under the arms to the ankles. Stirrups must be locked before the patient positions." },
      { term: "Fowler's Position", def: "The patient sits upright with the head of the examination table raised to a 90-degree angle. Used for examinations of the head, neck, and upper body, and for patients who have difficulty breathing in a supine position. Drape over the lap and legs." },
      { term: "Semi-Fowler's Position", def: "A modified Fowler's position with the head of the table raised to approximately 45 degrees. Used for post-surgical examinations, patients with breathing difficulties, and patients with lower back injuries. Drape over the lap and legs." },
      { term: "Left Lateral Position", def: "The patient lies on their left side with the right leg sharply bent upward and the left leg slightly bent. The right arm is flexed near the head for support. Formerly called Sims' position. Used for rectal examinations, enemas, rectal temperatures, and perineal/pelvic examinations. Drape from the shoulders to below the knees at an angle." },
      { term: "Knee-Chest Position", def: "The patient begins prone, then rises to a kneeling position with thighs perpendicular to the table and buttocks elevated. Head is turned to one side. Used for proctologic exams, sigmoidoscopy, and rectal and vaginal examinations." },
      { term: "Draping", def: "The placement of a paper or cloth cover over a patient during an examination or procedure to protect their privacy, maintain comfort, and limit exposure to only the area being examined. The amount of the patient exposed should be the minimum necessary for the provider to perform the exam." },
    ],
  },
  {
    name: "Medication Administration — Routes & Forms", emoji: "💊", color: "#7D3C98",
    terms: [
      { term: "Nonparenteral (Enteral) Administration", def: "Any route of medication administration that delivers the drug through or to the gastrointestinal tract. Includes oral (swallowed), sublingual (under the tongue), buccal (between the cheek and gum), and rectal routes. The most common and convenient method of medication delivery for most patients." },
      { term: "Parenteral Administration", def: "Any route of medication administration that bypasses the gastrointestinal tract. Most commonly refers to injection (intradermal, subcutaneous, intramuscular, intravenous), but also includes topical, transdermal, inhalation, and vaginal routes. Used when faster absorption, precise dosing, or GI avoidance is required." },
      { term: "Oral (PO) Route", def: "Medication taken by mouth and swallowed — the most common administration route. Absorbed through the stomach and intestines. Timing considerations include whether the medication should be taken with food, on an empty stomach, or separated from other medications (e.g., antacids)." },
      { term: "Sublingual Route", def: "Medication placed under the tongue and absorbed directly through the mucous membranes into the bloodstream — bypassing the GI tract. Results in rapid onset of action. Example: nitroglycerin for acute angina." },
      { term: "Buccal Route", def: "Medication placed between the cheek and the gum and absorbed through the mucous membrane. Provides rapid absorption similar to sublingual. The patient should not eat, drink, or smoke until the medication is fully absorbed." },
      { term: "Topical Route", def: "Medication applied directly to the skin or mucous membrane surface. Acts locally at the site of application rather than systemically. Administered as creams, ointments, gels, or emulsions." },
      { term: "Transdermal Route", def: "Medication delivered through the skin and absorbed into the bloodstream for a systemic effect. Administered as an adhesive patch. Provides slow, sustained, controlled release of the medication. Examples: nicotine patches, fentanyl patches, nitroglycerin patches." },
      { term: "Inhalation Route", def: "Medication inhaled through the mouth into the lungs or through the nose and absorbed through the nasal mucous membrane. Provides rapid delivery to the respiratory system. Used for bronchodilators (albuterol inhalers) and other respiratory medications." },
      { term: "Medication Administration Record (MAR)", def: "The legal record documenting every medication administered to a patient. Must include the medication name, dose, route, date and time of administration, ordering provider's name, frequency and duration, patient allergies, and any reaction or reason a dose was withheld. Always completed after — never before — administration." },
    ],
  },
  {
    name: "Injection Technique & Needle Safety", emoji: "💉", color: "#922B21",
    terms: [
      { term: "Intradermal (ID) Injection", def: "An injection administered between the layers of the skin — between the epidermis and dermis — at a 5 to 15 degree angle with the bevel facing up. Common site: inner forearm, measured one hand-width above the wrist and one hand-width below the elbow. Volume: 0.1 mL or less. A wheal (fluid bubble) must form under the skin — do not massage, bandage, or apply pressure to the site. Used for TB skin tests and allergy testing." },
      { term: "Subcutaneous (SC/SQ) Injection", def: "An injection administered beneath the skin into the adipose (fat) tissue at a 45-degree angle. The skin must be gently pinched to ensure the medication reaches the fat layer rather than the muscle. Common sites: upper outer arm, abdomen, and upper thigh. Maximum volume: 1.5 mL. Used for insulin, heparin, some vaccines, and allergy medications. Do not massage the site." },
      { term: "Intramuscular (IM) Injection", def: "An injection administered deep into muscle tissue at a 90-degree angle, using a dart-like smooth insertion motion. The skin is stretched taut (not pinched) before insertion. Common sites: deltoid (≤1 mL), ventrogluteal (≤3 mL), vastus lateralis (≤3 mL, preferred for children under 3). Used for vaccines, antibiotics, hormones, and other medications. CDC no longer recommends aspiration before IM injection." },
      { term: "Deltoid Site", def: "The deltoid muscle of the upper arm — the most commonly used IM injection site because it is easily accessible. The injection site should be 1 to 2 inches below the acromion process (bony tip of the shoulder). Can hold a maximum of 1 mL of medication. Should not be used for infants or children younger than 3 years." },
      { term: "Ventrogluteal Site", def: "The gluteus medius and minimus muscles of the outer hip. Considered the safest IM injection site because it provides the greatest muscle thickness, is free of major nerves and blood vessels, and has a narrower fat layer. Can hold up to 3 mL. Preferred for oily or irritating solutions and for patients of all ages. Located by placing the heel of the hand on the greater trochanter and spreading the fingers — inject in the V between the index and middle finger." },
      { term: "Vastus Lateralis Site", def: "The lateral (outer) thigh muscle used for IM injections. The injection is given in the middle third of the muscle, between one hand-width above the knee and one hand-width below the greater trochanter. Preferred site for infants and children younger than 3 years. Can hold up to 3 mL in adults." },
      { term: "Needle Gauge", def: "A measurement of the size of the needle's lumen (opening). Counterintuitively, a higher gauge number means a smaller opening. Example: a 25 G needle has a smaller lumen than an 18 G needle. Selection is based on medication viscosity (thick medications need lower gauge/larger lumen) and injection type." },
      { term: "Bevel", def: "The angled, slanted tip of a needle that allows it to pierce the skin smoothly. When performing ID or SC injections, the bevel must face upward to allow for controlled delivery of the medication and proper wheal formation." },
      { term: "Wheal", def: "A small, pale, raised bubble of fluid that forms under the skin during a correctly performed intradermal injection. The wheal confirms that the medication was delivered into the correct skin layer (the dermis) rather than into subcutaneous tissue. If no wheal forms, the injection was too deep and must be repeated." },
      { term: "Aspiration (Injection)", def: "The practice of pulling back on the syringe plunger after inserting the needle to check for blood before injecting — historically used to confirm the needle has not entered a blood vessel. The CDC no longer recommends aspiration prior to intramuscular injections, as the veins and arteries accessible at standard IM injection sites are too small for inadvertent IV entry." },
      { term: "One-Handed Scoop Method", def: "A technique for recapping an unused (clean, sterile) needle without using two hands — which carries a high risk of needlestick. The cap is placed on a flat surface and the needle is inserted into the opening using one hand only. Used only for needles that have not yet been used on a patient. Used needles must never be recapped." },
    ],
  },
  {
    name: "Syringes, Vials & Sterile Technique", emoji: "🧴", color: "#1A5276",
    terms: [
      { term: "Hypodermic Syringe", def: "A general-purpose syringe available in a range of sizes from 0.5 mL to 60 mL or larger. Calibrated in milliliters. The 3 mL size is the most commonly used for medication administration. Used for IM, SC, and other injections." },
      { term: "Tuberculin Syringe", def: "A narrow, 0.5 mL or 1 mL syringe calibrated in hundredths (0.01 mL) and tenths (0.1 mL) of a milliliter. Used for very small volumes — such as heparin or intradermal skin tests (TB). Recommended for any dose less than 0.5 mL to ensure accurate measurement. Also used in pediatric medication administration." },
      { term: "Insulin Syringe", def: "A syringe designed exclusively for insulin administration, calibrated in units rather than milliliters. Marked U-100 — used only with U-100 insulin (100 units = 1 mL). Insulin syringes have fixed, non-detachable needles. Never use a regular syringe to administer insulin." },
      { term: "Vial", def: "A sealed plastic or glass container with a rubber stopper (diaphragm) on top, used for parenteral medications. Available as single-dose (safest option) or multi-dose. Air must be injected into the vial equal to the volume of medication being withdrawn to prevent a vacuum." },
      { term: "Multi-Dose Vial", def: "A medication vial designed to provide more than one dose of a medication. Must be wiped with an alcohol swab before every use. The opened date must be written on the vial — most multi-dose vials expire 28 days after opening unless the manufacturer specifies otherwise. Never use the same syringe on more than one patient from a shared vial." },
      { term: "Ampule", def: "A sealed glass container designed to hold a single dose of medication. Has a constricted neck that is snapped open using an alcohol wipe or ampule protector. A filter needle is used to withdraw the medication to prevent glass fragments from entering the syringe. The filter needle must be replaced with a new needle before injection." },
      { term: "Filter Needle", def: "A specialized needle with a built-in filter membrane used when withdrawing medication from an ampule. Prevents glass or rubber particles from being drawn into the syringe. Must be discarded and replaced with a standard needle before administering the medication to the patient." },
      { term: "Reconstitution", def: "The process of adding a liquid diluent (such as sterile water or normal saline) to a powdered medication to create a solution for injection. The amount of diluent used determines the concentration of the final solution. Always verify the diluent type and volume in the manufacturer's instructions." },
      { term: "Sharps Container", def: "A puncture-resistant, leak-proof container used for the safe disposal of needles, syringes, lancets, and other sharp objects. Sharps containers must be located at the point of use — used needles should be dropped directly into the container and never transported uncapped to another location." },
    ],
  },
  {
    name: "Eye & Ear Procedures", emoji: "👁️", color: "#1E8449",
    terms: [
      { term: "Eye Instillation (Ocular/Ophthalmic Administration)", def: "The administration of a sterile medication — drops, cream, or ointment — directly into the eye. Only sterile ophthalmic medications may be used. The patient looks upward, and the lower eyelid is gently pulled down to expose the conjunctival sac. Drops are dispensed approximately ½ inch above the sac. Ointment is applied as a thin ribbon along the inner edge of the lower lid, moving from inner to outer corner." },
      { term: "Conjunctival Sac", def: "The small pocket formed when the lower eyelid is gently pulled downward. The site into which eye drops are instilled during ophthalmic administration. The applicator tip must not touch the conjunctiva, eyelid, or any other surface to maintain sterility." },
      { term: "Canthus", def: "The corner of the eye where the upper and lower eyelids meet. The inner canthus is the corner closest to the nose; the outer (lateral) canthus is the corner toward the ear. Eye irrigation and drop instillation flow from inner to outer canthus." },
      { term: "Eye Irrigation", def: "The use of a warmed sterile solution to flush the eye — used to remove foreign bodies or chemical irritants. Requires sterile technique throughout. Solution flows from the inner to the outer canthus in a steady stream directed at the lower conjunctiva. After irrigation, the eyelid is dried from inner to outer corner. Separate sterile equipment must be used for each eye." },
      { term: "Ear Instillation (Otic Administration)", def: "The administration of prescribed drops into the ear canal. The patient lies on their side with the affected ear facing upward. For adults: pull the pinna outward and upward to straighten the ear canal. For infants and children: pull the pinna outward and downward. The applicator is held ½ inch above the canal, and prescribed drops are instilled. The patient remains in position for at least 5 minutes." },
      { term: "Pinna (Auricle)", def: "The visible outer portion of the ear — the cartilage-and-skin structure on the outside of the head. Manipulated during ear instillation and irrigation to straighten the ear canal for better medication distribution and visualization. Direction of pull differs between adults and children." },
      { term: "Cerumen", def: "The medical term for earwax — the naturally occurring, waxy substance produced by glands in the outer ear canal. Normal cerumen migrates outward on its own, but impacted cerumen can block the canal and interfere with hearing and otoscope visualization. Removed by ear irrigation when necessary." },
      { term: "Ear Irrigation", def: "The use of a warmed solution sprayed into the ear canal to remove impacted cerumen or a foreign body. The disposable tip is inserted toward the top of the ear canal. After completion, residual solution is allowed to drain, a loose cotton ball is placed in the canal, and the patient lies on the irrigated side for 15 minutes. An otoscope examination follows to confirm clearance if allowed by facility policy." },
    ],
  },
  {
    name: "EHR, CPOE & Electronic Prescribing", emoji: "💻", color: "#D4AC0D",
    terms: [
      { term: "Electronic Medical Record (EMR)", def: "A digital version of a patient's medical history and records used within a single healthcare organization. Contains the same clinical information as a traditional paper chart but in a searchable, updatable digital format. Not designed to be shared outside of the originating organization." },
      { term: "Electronic Health Record (EHR)", def: "A broader digital record that contains a patient's EMR and extends across multiple healthcare organizations and providers. Designed to be shared securely with specialists, laboratories, hospitals, and other care team members to support coordinated, continuous care." },
      { term: "Computerized Provider Order Entry (CPOE)", def: "An electronic system that allows providers to enter medical orders — medications, laboratory tests, imaging studies, and referrals — directly into a computer rather than on paper or verbally. Reduces handwriting errors, eliminates transcription mistakes, speeds order delivery, and integrates with clinical decision support tools." },
      { term: "Clinical Decision Support System (CDSS)", def: "An electronic tool integrated into the EHR or CPOE system that provides real-time guidance to clinicians at the point of order entry. Automatically checks for medication interactions, allergies, incorrect dosages, and duplicate orders. More advanced systems can prevent over-prescribing and alert providers to required procedures." },
      { term: "Electronic Prescribing (E-Prescribing)", def: "The electronic creation and secure transmission of prescriptions from a provider's EHR to the patient's pharmacy — without paper. Reduces prescription errors, increases efficiency, and reduces the risk of prescription fraud or diversion. Requires DEA-approved software for controlled substance prescriptions (EPCS)." },
      { term: "Electronic Prescriptions for Controlled Substances (EPCS)", def: "A DEA regulation effective June 1, 2010, that allows (and in many states requires) providers to prescribe controlled substances electronically. Both the prescribing provider's system and the receiving pharmacy's system must use DEA-approved, third-party audited software for the electronic prescription to be valid." },
      { term: "Medication Administration Record (MAR) — EHR Context", def: "In an EHR-based workflow, the MAR is an electronic form within the patient's record documenting all medications administered during a visit or stay. Orders entered through CPOE automatically populate the MAR framework. The administering MA must still complete the MAR entry after administration with all required details, including lot number, route, site, and patient response." },
      { term: "Telehealth", def: "Healthcare services delivered remotely using technology — most commonly via video call — allowing providers to evaluate and treat patients without an in-person visit. Effective for wellness visits, chronic condition management, behavioral health, dermatology, and low-acuity urgent care. Does not alter the provider's or MA's standard of practice, scope of practice, or legal obligations." },
      { term: "Telemedicine", def: "A subset of telehealth that refers specifically to remote clinical services — provider-to-patient video visits and online clinical consultations. Distinguished from telehealth, which is broader and includes health education, remote monitoring, administrative meetings, and provider training." },
      { term: "Remote Patient Monitoring", def: "A telehealth technology that allows providers to receive real-time health data from a patient's wearable or home device — such as heart rate monitors, continuous glucose monitors, or blood pressure cuffs — without an in-person visit. Data is transmitted electronically to the care team for review." },
    ],
  },
  {
    name: "Medication Safety & Storage", emoji: "🔐", color: "#117A65",
    terms: [
      { term: "Allergic Reaction", def: "An abnormal immune response to an allergen — a substance capable of triggering hypersensitivity in some individuals. Reactions range from mild (hives, itching, nasal congestion) to moderate (abdominal pain, coughing, swelling) to severe (anaphylaxis). Medication allergy status must be confirmed and documented at every patient visit and before any medication is administered." },
      { term: "Anaphylaxis / Anaphylactic Shock", def: "A severe, potentially life-threatening systemic allergic reaction. Symptoms include weakness, sweating, dyspnea, hypotension, arrhythmia, difficulty swallowing, and convulsions. Can occur within minutes of allergen exposure. First-line treatment: epinephrine administered as an IM injection into the upper thigh. Call 911 immediately after administering epinephrine." },
      { term: "Epinephrine (EpiPen)", def: "The first-line emergency medication for anaphylactic shock. Administered as an intramuscular (IM) injection into the upper outer thigh — can be given through clothing in an emergency. Hold the injector in place for at least 10 seconds, then massage the site. Always followed by calling 911, as the autoinjector is supportive emergency care and not a substitute for advanced medical treatment." },
      { term: "Sterile Field", def: "A designated area that has been established and maintained free of all microorganisms. Any item or surface within the sterile field must be sterile. An item is either sterile or unsterile — if there is any doubt, treat it as unsterile and discard or replace it before using." },
      { term: "Biohazard Container", def: "A labeled, puncture-resistant, leak-proof container used for disposing of items contaminated with blood or other potentially infectious materials — such as blood-soaked gloves, used specimen swabs, and contaminated gowns. Distinguished from a sharps container, which is specifically for needles and sharps. Both are regulated as medical waste." },
      { term: "Medication Storage Temperature", def: "Room temperature medications are stored at 20–25°C (68–77°F). Refrigerated medications require 2–8°C (35–46°F) — stored in a dedicated medical refrigerator, not one used for food. Frozen medications require –50 to –15°C (–58 to 5°F). Temperature logs must be checked daily for refrigerated medications and twice daily when storing vaccines." },
      { term: "Medication Expiration Date", def: "The date determined by the manufacturer through stability testing, after which the medication is no longer guaranteed to be effective or safe in its original sealed container. Expired medications must never be administered. Once the original container is opened, the expiration date may no longer apply — check manufacturer guidelines for opened containers and document the opened date on multi-dose vials." },
      { term: "Medication Disposition Record", def: "A log documenting the removal and disposal of medications from storage — including expired, discontinued, contaminated, or unlabeled medications. Required by regulatory standards whenever a medication is removed from storage for any reason other than administration. Controlled substance disposals require additional documentation and witness co-signature." },
    ],
  }
];

const ALL_TERMS = CATEGORIES.flatMap((cat, ci) =>
  cat.terms.map(t => ({ ...t, category: cat.name, emoji: cat.emoji, color: cat.color, catIndex: ci }))
);
let browseSearch = '';
let browseOpenCat = null;
let browseOpenTerm = null;
document.getElementById('header-subtitle').textContent =
  `General Patient Care — Foundations · ${ALL_TERMS.length} terms across ${CATEGORIES.length} topics`;
renderBrowse();
function renderBrowse() {
  const el = document.getElementById('browse-mode');
  const query = browseSearch.trim().toLowerCase();
  let html = `<div class="search-wrap"><span class="icon">🔍</span><input type="text" placeholder="Search ${ALL_TERMS.length}+ terms…" value="${escHtml(browseSearch)}" oninput="browseSearch=this.value; browseOpenTerm=null; renderBrowse();" /></div>`;
  if (query) {
    const filtered = ALL_TERMS.filter(t => t.term.toLowerCase().includes(query) || t.def.toLowerCase().includes(query));
    if (filtered.length === 0) {
      html += `<p style="text-align:center;color:var(--text-secondary);padding:20px">No terms found — try different keywords!</p>`;
    } else {
      html += `<div style="display:flex;flex-direction:column;gap:6px">`;
      filtered.forEach((t, i) => {
        const isOpen = browseOpenTerm === `s-${i}`;
        html += `<div class="result-card" onclick="browseOpenTerm=browseOpenTerm==='s-${i}'?null:'s-${i}'; renderBrowse();" style="border-color:${isOpen ? t.color : 'var(--border)'}"><div class="row"><span class="r-emoji">${t.emoji}</span><span class="r-term">${escHtml(t.term)}</span><span class="r-cat" style="background:${t.color}22;color:${t.color}">${escHtml(t.category)}</span></div>${isOpen ? `<p class="r-def">${escHtml(t.def)}</p>` : ''}</div>`;
      });
      html += `</div>`;
    }
  } else {
    html += `<div style="display:flex;flex-direction:column;gap:8px">`;
    CATEGORIES.forEach((cat, ci) => {
      const isOpen = browseOpenCat === ci;
      html += `<div><button class="cat-btn${isOpen ? ' open' : ''}" onclick="browseOpenCat=browseOpenCat===${ci}?null:${ci}; browseOpenTerm=null; renderBrowse();" style="border-color:${isOpen ? cat.color : 'var(--border)'};background:${isOpen ? cat.color + '12' : 'var(--surface-1)'}"><span class="emoji">${cat.emoji}</span><span class="name">${escHtml(cat.name)}</span><span class="count" style="color:${cat.color};background:${cat.color}22">${cat.terms.length}</span><span class="arrow">▼</span></button>`;
      if (isOpen) {
        html += `<div style="display:flex;flex-direction:column;gap:4px;margin-top:6px;margin-left:20px">`;
        cat.terms.forEach((t, ti) => {
          const tKey = `${ci}-${ti}`;
          const tOpen = browseOpenTerm === tKey;
          html += `<div class="term-card" onclick="browseOpenTerm=browseOpenTerm==='${tKey}'?null:'${tKey}'; renderBrowse();" style="border-color:${tOpen ? cat.color : 'transparent'}"><span class="term-name">${escHtml(t.term)}</span>${tOpen ? `<p class="term-def">${escHtml(t.def)}</p>` : ''}</div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  }
  el.innerHTML = html;
}
function escHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
</script>
</body>
</html>
