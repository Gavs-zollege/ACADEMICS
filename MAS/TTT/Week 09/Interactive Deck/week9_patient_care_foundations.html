s:center}.dot{height:5px;border-radius:3px;cursor:pointer;transition:all .3s}.dot.c{width:16px;background:var(--accent)}.dot.v{width:5px;background:var(--darkSub)}.dot.f{width:5px;background:rgba(0,0,0,.12)}.to{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center}.tp{background:#fff;border-radius:12px;padding:24px 20px;max-height:70vh;overflow-y:auto;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.tt{font-family:var(--ff);font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px}.ti{font-size:12px;padding:6px 10px;border-radius:5px;cursor:pointer;margin-bottom:1px;transition:all .15s}.ti:hover{background:var(--slideAlt)}.ti.a{color:var(--accent);background:var(--accentLight);font-weight:700}.ti .x{color:var(--textLight);margin-right:8px;font-weight:600;font-size:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.fr{display:flex;gap:16px}.cd{background:var(--slideAlt);border-radius:6px;padding:10px 12px}table{width:100%;border-collapse:collapse;font-size:10px}th{padding:5px 8px;text-align:left;font-weight:700;font-size:8px;letter-spacing:.5px;text-transform:uppercase}td{padding:5px 8px;font-size:10px;color:var(--text)}.thd th{background:var(--headerBg);color:#fff}tr.al{background:var(--slideAlt)}.tb{display:flex;gap:0;margin-bottom:10px;border-bottom:2px solid var(--border)}.tbtn{font-size:10px;font-weight:500;color:var(--textMid);background:none;border:none;border-bottom:3px solid transparent;padding:5px 10px;margin-bottom:-2px;transition:all .2s}.tbtn.a{font-weight:700;color:var(--accent)}.co{border-radius:6px;padding:8px 12px;border-left:3px solid}.co-a{background:var(--accentLight);border-color:var(--accent)}.co-w{background:var(--warmLight);border-color:var(--warm)}.co-am{background:var(--amberLight);border-color:var(--amber)}.co-b{background:var(--blueLight);border-color:var(--blue)}.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}. <script>
const S=[{"id":0,"type":"title","title":"General Patient Care:\\nFoundations","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Nine","tags":["Exam Room Prep","Positioning","Injections","Eye & Ear Care","EHR & Telehealth"],"fs":32},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Prepare the examination and procedure room","Prepare the patient for procedures and provide patient education","Assist the provider with general and specialty examinations — positioning and draping","Prepare and administer medications using nonparenteral routes","Prepare and administer medications using parenteral routes with patient safety","Manage supplies for injections, medication logs, controlled substances, and immunizations","Perform ear and eye instillation and irrigation","Operate basic functions of an EMR/EHR system","Enter orders using computerized provider order entry (CPOE)","Conduct telehealth or virtual screenings","Follow guidelines for electronic prescriptions, refills, telephone, fax, and email orders"]},{"id":2,"type":"twocol","title":"Preparing the Examination Room","lt":"Room Setup & Supplies","lc":"var(--accent)","li":[{"l":"Review the schedule first","d":"Check patient name and reason for visit — prep room, equipment, supplies."},{"l":"Standard furniture","d":"Exam table, pillow, footstool, supply cupboard, chair, stool, sharps/biohazard containers, sink."},{"l":"Disposable supplies","d":"Table paper, gowns, drapes, gloves, tongue depressors, alcohol pads, syringes."},{"l":"Diagnostic equipment","d":"Thermometer, stethoscope, BP cuff, pulse ox, reflex hammer, otoscope, ophthalmoscope."},{"l":"Between every patient","d":"Disinfect all surfaces, allow to dry, replace table paper, change pillow cover, discard disposables."}],"rt":"Preparing the Patient","rc":"var(--blue)","ri":[{"l":"Knock and ask permission","d":"Introduce yourself, identify with two identifiers, never enter without consent."},{"l":"Explain plainly","d":"Simple language, not jargon. Encourage questions, acknowledge anxiety."},{"l":"Gown and drape","d":"Restroom first. Correct gown size. Explain opening direction."},{"l":"Urine sample","d":"If needed, give complete step-by-step instructions before restroom."},{"l":"After procedure","d":"Assist off table. Provide privacy. Give follow-up, aftercare, referral info."}]},{"id":3,"type":"cards","title":"Special Patient Populations","cols":3,"cards":[{"title":"Older Adults","desc":"Extra time for meds review and questions. Speak slowly, clearly. No condescending terms. Assist on/off table.","color":"#4A90D9"},{"title":"Physical Disabilities","desc":"Observe and offer help — but let patient do what they can. Ask before touching wheelchair. Lock wheels for transfers.","color":"#3DAE8E"},{"title":"Children","desc":"Establish rapport at eye level. No baby talk with older kids. Role-play can help. Never leave alone on exam table.","color":"#E8853D"}]},{"id":4,"type":"table","title":"Patient Positioning & Draping","hd":["Position","Used For","Draping"],"rows":[["Supine","Head, chest, abdominal exams","Chest to feet"],["Prone","Back exams; some surgical","Upper back to over feet"],["Dorsal Recumbent","Head, neck, vaginal, rectal","Neck to feet; knees bent"],["Lithotomy","Vaginal exams, Pap test","Under arms to ankles; stirrups"],["Fowler's (90°)","Head/neck exams; breathing difficulty","Over lap and legs"],["Semi-Fowler's (45°)","Post-surgical; breathing problems","Over lap and legs"],["Left Lateral","Rectal exams, enemas","Shoulders to below knees"],["Knee-Chest","Proctologic, sigmoidoscopy","Upper back to below knees"]]},{"id":5,"type":"cards","title":"Parenteral Injections — Types, Sites & Technique","cols":3,"cards":[{"title":"Intradermal (ID)","desc":"5–15° | 25–27G, ¼–½ inch | ≤0.1 mL. Inner forearm. Bevel up. Wheal must form for TB test. Do NOT massage.","color":"#4A90D9"},{"title":"Subcutaneous (SC)","desc":"45° | 23–25G, 5/8 inch | ≤1.5 mL. Upper arm, abdomen, thigh. Pinch 1 inch of skin. Rotate insulin sites.","color":"#3DAE8E"},{"title":"Intramuscular (IM)","desc":"90° | 22–25G, 1–1½ inch | ≤3 mL. Deltoid (≤1 mL), ventrogluteal (≤3 mL), vastus lateralis. CDC: no aspiration.","color":"#D94F4F"}]},{"id":6,"type":"twocol","title":"Needles, Syringes, Vials & Sterile Technique","lt":"Needles, Syringes & Vials","lc":"var(--accent)","li":[{"l":"Needle gauge","d":"Higher gauge = smaller lumen. 18G > 25G. Select by viscosity and injection type."},{"l":"Needle length","d":"5/16 to 1½ inches. Longer for larger/obese patients."},{"l":"Syringe types","d":"Hypodermic (0.5–60+ mL), tuberculin (0.5–1 mL), insulin (U-100 only)."},{"l":"Multi-dose vials","d":"Wipe stopper with alcohol. Inject air = volume being withdrawn. Expire 28 days after opening."},{"l":"Ampules","d":"Snap with alcohol swab. Filter needle to prevent glass. Replace before injection."}],"rt":"Sterile Technique & Sharps Safety","rc":"var(--warm)","ri":[{"l":"Never share","d":"Never share a needle or syringe between patients."},{"l":"Contamination","d":"Any non-sterile surface contact = discard the needle."},{"l":"Recapping","d":"Only unused needles using one-handed scoop method."},{"l":"Sharps disposal","d":"Used needles directly into sharps container — never regular trash."},{"l":"Injection site prep","d":"Clean with alcohol 30 sec; allow to fully dry."},{"l":"Post-injection","d":"Patient waits 20–30 min to monitor for allergic reactions."}]},{"id":7,"type":"twocol","title":"9 Rights, Dosage & Documentation","lt":"Nine Rights of Medication Administration","lc":"var(--accent)","li":[{"l":"1. Right Patient","d":"Two identifiers — full name and DOB."},{"l":"2. Right Medication","d":"Three-label checks (before, during, after)."},{"l":"3. Right Form","d":"Tablet, liquid, capsule, cream — must match order."},{"l":"4. Right Dose","d":"Calculate and double-check before preparing."},{"l":"5. Right Route","d":"Oral, IM, SQ, ID — must match prescription."},{"l":"6. Right Time","d":"Confirm timing (empty stomach, with food)."},{"l":"7. Right Technique","d":"Correct angle, site, prep, approach."},{"l":"8. Right Education","d":"Explain medication, purpose, side effects, allergies."},{"l":"9. Right Documentation","d":"Document AFTER administration, never before."}],"rt":"MAR & Medication Logs","rc":"var(--blue)","ri":[{"l":"MAR","d":"Legal record of all medications given. Completed every time. Near med storage."},{"l":"What goes in MAR","d":"Date, time, drug, dose, route, provider, frequency, duration, allergies, reactions."},{"l":"Controlled substance logs","d":"Double lock storage. Daily count by two people. All use logged."},{"l":"Immunization logs","d":"Vaccine name, lot #, manufacturer, expiration, site, route, date, consent."},{"l":"Storage documentation","d":"Refrigerator (2–8°C) checked daily. Freezer twice daily. Log temps. Rotate by expiration."}]},{"id":8,"type":"tab","title":"Eye & Ear — Instillation and Irrigation","tk":"0","tabs":[{"n":"Eye Drops/Ointment","c":"#4A90D9","items":["Patient sits back or supine, head tilted, eyes open looking at ceiling","Pull down lower eyelid to expose conjunctival sac","Dispense drops ½ inch above sac — don't touch eye or skin","Ointment: thin ribbon along lower lid, inner to outer corner","Only sterile ophthalmic medications — strict sterile technique"]},{"n":"Eye Irrigation","c":"#3DAE8E","items":["Flush foreign bodies or chemical irritants — sterile solution","Warm solution to body temperature before use","Flow from inner (medial) to outer (lateral) canthus","Examine return basin for debris after irrigation","Use separate sterile equipment for each eye"]},{"n":"Ear Drops","c":"#E8853D","items":["Patient lies on side, affected ear upward","Adults: pull pinna outward and UPWARD","Children/infants: pull pinna outward and DOWNWARD","Hold applicator ½ inch above canal; patient stays on side 5 min","Insert loose cotton ball if ordered"]},{"n":"Ear Irrigation","c":"#8B6FC0","items":["Removes impacted cerumen or foreign objects","Patient sitting or lying, affected ear up; waterproof drape","Insert tip toward top of canal; spray until goal achieved","Allow residual to drain; loose cotton ball in canal","Patient lies on irrigated side 15 min; examine with otoscope"]}]},{"id":9,"type":"cards","title":"EHR, CPOE, E-Prescribing & Telehealth","cols":2,"cards":[{"title":"EMR vs. EHR","desc":"EMR: digital record within one org. EHR: extends across multiple orgs/providers for coordinated care.","color":"#4A90D9"},{"title":"CPOE","desc":"Electronic orders for meds, labs, radiology, referrals. Eliminates handwriting errors. Flags interactions/allergies.","color":"#3DAE8E"},{"title":"E-Prescribing","desc":"Electronic to pharmacy. DEA-approved EPCS for controlled substances. Many states mandate for all meds.","color":"#E8853D"},{"title":"Telehealth","desc":"Wellness visits, chronic follow-ups, behavioral health. MA: confirm tech, test connection, gather history, remind self-vitals.","color":"#8B6FC0"}]},{"id":10,"type":"takeaways","title":"Week Nine — Key Takeaways","items":["Review the day's schedule before any patient arrives — knowing the reason lets you prep the right room and equipment.","Never leave a child unattended on an exam table. Never assume what assistance a disabled patient needs — always ask.","Patient positioning is a clinical skill — wrong positioning wastes time and prevents accurate exam findings.","The nine rights of medication administration are non-negotiable — every single time, without shortcuts.","Ear instillation: pull pinna UP for adults, DOWN for children — direction affects whether drops reach the canal.","Used needles go directly into sharps — never recap, never on a countertop, never in a biohazard bag.","EHR, CPOE, and e-prescribing reduce errors — but accuracy of data entry is only as good as the person entering it.","If it isn't documented, it didn't happen — always record medication administration AFTER it's given."]},{"id":11,"type":"quiz","title":"Knowledge Check","questions":[{"q":"What angle is used for an intramuscular injection?","options":["10–15°","45°","90°","5–15°"],"correct":2,"explanation":"IM injections use a 90° angle — like a dart, smooth and steady into the muscle."},{"q":"For ear instillation in children, you pull the pinna:","options":["Upward and outward","Downward and outward","Straight back","You don't move the pinna"],"correct":1,"explanation":"Children/infants: pull the pinna outward and DOWNWARD — opposite from adults (upward)."},{"q":"How many rights of medication administration are there?","options":["Five","Seven","Nine","Ten"],"correct":2,"explanation":"Nine rights: Patient, Medication, Form, Dose, Route, Time, Technique, Education, Documentation."},{"q":"Multi-dose vials expire how long after opening?","options":["7 days","14 days","28 days","90 days"],"correct":2,"explanation":"Multi-dose vials expire 28 days after opening — write the date when first opened."},{"q":"When should medication administration be documented?","options":["Before giving the medication","During the procedure","After the medication is given","At the end of the shift"],"correct":2,"explanation":"Always document AFTER administration — never before. This is the 9th right."},{"q":"Which patient position uses stirrups?","options":["Supine","Prone","Lithotomy","Fowler's"],"correct":2,"explanation":"Lithotomy uses stirrups — used for vaginal exams, Pap tests, and pelvic procedures."}]},{"id":12,"type":"end","title":"End of Week Nine","subtitle":"General Patient Care: Foundations","message":"Every patient encounter starts with preparation. The skills you've built this week — from room setup to injection technique — are the foundation of safe, competent care."}];

function rTitle(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px;position:relative"><div style="position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:6px"><div style="width:24px;height:2px;background:var(--accent)"></div><span style="font-size:9px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase">${e(s.subtitle)}</span></div><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">${e(s.week)}</div><h1 style="font-family:var(--ff);font-size:${s.fs||34}px;font-weight:700;color:#fff;margin:0;line-height:1.25;white-space:pre-line">${e(s.title)}</h1><div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center">${s.tags.map(t=>`<span class="tag">${e(t)}</span>`).join('')}</div><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:${s.objectives.length>12?'2':'3'}px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}" style="min-width:${s.objectives.length>12?'20':'22'}px;height:${s.objectives.length>12?'20':'22'}px;font-size:${s.objectives.length>12?'9':'10'}px">${j+1}</div><div style="font-size:${s.objectives.length>12?'9':'10'}px;color:var(--text);line-height:1.35;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:3px;font-style:italic">Click to reveal</p>':''}</div>${F(i)}</div>`}
function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb">${s.desc?`<p style="font-size:10px;color:var(--textMid);margin:0 0 8px">${e(s.desc)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:7px">${s.cards.map(c=>`<div class="cd" style="border-${c.b||'left'}:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div>${s.note?`<div class="co co-${s.nt||'a'}" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${s.note?`<div style="font-size:9px;color:var(--textMid);font-style:italic;margin-top:4px">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[11].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[11].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
