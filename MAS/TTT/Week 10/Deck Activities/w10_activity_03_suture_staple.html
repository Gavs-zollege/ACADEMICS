<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Suture & Staple Removal</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#14082a,#1c1040,#100828);font-family:'Outfit',sans-serif;padding:24px 16px;color:#ece0ff}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#9880c0;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#9880c0;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#a3e635);border-radius:10px;transition:width .4s}.question{background:#1c1040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#9880c0;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#9880c0;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#14082a;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">✂️</div><h1>Suture & Staple Removal</h1><p class="sub">Test your removal technique knowledge</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"Before removing sutures, you should first:",opts:["Cut immediately","Inspect wound for approximation, drainage, and healing","Count the sutures","Ask the patient to remove them"],a:1,tip:"Assess first. If concerns, alert the provider BEFORE proceeding."},
{q:"When removing sutures, you should remove them:",opts:["All at once","Every other one first, watching the wound line between removals","From both ends simultaneously","Only the ones the patient points to"],a:1,tip:"Alternate removal lets you watch for gaping or separation between each removal."},
{q:"Never pull suture material that was outside the skin back through because:",opts:["It hurts more","It drags surface contamination into the tissue","The thread will break","It's too difficult"],a:1,tip:"Always pull through in the direction that keeps external suture material out of the wound."},
{q:"Staple removal begins with which staple?",opts:["The first one","The second one — to protect wound edges at both ends","The middle one","The last one"],a:1,tip:"Start with the second staple. This protects the wound edges at both ends."},
{q:"Removed staples go in the:",opts:["Regular trash","Biohazard bag","Sharps container — they're metal","Recycling bin"],a:2,tip:"Staples = metal = sharps container. Sutures go in biohazard waste."},
{q:"If crusted blood covers the sutures, you should:",opts:["Pull harder","Soak with saline before removal to avoid tearing tissue","Use a scalpel to cut through it","Leave them in longer"],a:1,tip:"Soak with sterile saline first. Never force removal through dried exudate."},
{q:"After all sutures/staples are removed, you must:",opts:["Send the patient home immediately","Count and document number removed; clean wound; dress as ordered","Just apply a bandage","Nothing further is needed"],a:1,tip:"Count, document, clean with antiseptic, dress as ordered. Butterfly closures may reinforce."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Every other one first. Stop immediately if gaping, bleeding, or drainage appears.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
