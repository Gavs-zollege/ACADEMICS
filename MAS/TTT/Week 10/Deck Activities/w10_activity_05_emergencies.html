<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Emergency Response Quiz</title><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#1a0808,#2a1010,#180808);font-family:'Rubik',sans-serif;padding:24px 16px;color:#ffe0e0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#c07070;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#c07070;font-weight:700;font-size:14px}.topbar .sc{color:#ef4444;font-weight:800;font-size:14px}.bar{height:6px;background:#301818;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#ef4444,#fbbf24);border-radius:10px;transition:width .4s}.question{background:#221010;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #ef4444}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#301818;border:2px solid #301818;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.1)}.opt .letter{color:#ef4444;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#221010}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#c07070;font-weight:600;font-size:14px}.done{text-align:center;background:#221010;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#c07070;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#ef4444;color:#fff;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🚨</div><h1>Emergency Response Quiz</h1><p class="sub">First aid, shock, seizures, choking & burns</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"For anaphylactic shock, the first medication to administer is:",opts:["Aspirin","Epinephrine (EpiPen) IM into upper thigh","Nitroglycerin","Albuterol"],a:1,tip:"EpiPen IM into the upper thigh immediately. Call 911 — anaphylaxis is life-threatening."},
{q:"During a seizure, you should NEVER:",opts:["Lower the patient to the floor","Put anything in their mouth","Turn them on their side after","Move objects away"],a:1,tip:"Do NOT put anything in the mouth. Lower to floor, clear objects, turn to side after."},
{q:"For a choking infant (<1 year), the correct technique is:",opts:["Abdominal thrusts (Heimlich)","5 back slaps followed by 5 chest thrusts","CPR immediately","Finger sweep"],a:1,tip:"Infants: 5 back slaps + 5 chest thrusts. NO abdominal thrusts on infants."},
{q:"For severe hypoglycemia (patient unconscious), you should:",opts:["Give oral glucose","Administer glucagon injection — do not give oral glucose","Give water with sugar","Wait for them to wake up"],a:1,tip:"Unconscious = glucagon injection. Never give oral glucose to an unconscious patient (aspiration risk)."},
{q:"For a syncope (fainting) patient, an ammonia capsule should be waved:",opts:["Directly under the nose","6 inches away from the nose","Against their lips","Behind their ear"],a:1,tip:"6 inches from the nose — never directly under it. It's an irritant, not a medication."},
{q:"For minor burns, the first step is:",opts:["Apply ice directly","Cool running water for 10 minutes — not ice","Break blisters for drainage","Apply butter or oil"],a:1,tip:"Cool running water 10 min. No ice, no butter. Don't break blisters. Cover loosely."},
{q:"The 'golden hour' in emergency medicine refers to:",opts:["The first hour of a shift","The most critical hour after injury or symptom onset","The time to call insurance","The time between appointments"],a:1,tip:"The first hour is the most critical for survival. Rapid, organized response saves lives."},
{q:"An AED must be accessible within ___ minutes from anywhere in the office.",opts:["1","3","5","10"],a:1,tip:"3 minutes maximum. Check pads and battery per facility schedule."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Scenario '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2200)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=7?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Know the emergency plan before you need it. Practice drills regularly. The golden hour is real.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
