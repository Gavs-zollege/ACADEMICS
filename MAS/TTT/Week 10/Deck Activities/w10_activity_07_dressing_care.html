<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Wound Dressing Quiz</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a1a10,#102818,#08140a);font-family:'Sora',sans-serif;padding:24px 16px;color:#e0f5e8}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#6aaa80;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#6aaa80;font-weight:700;font-size:14px}.topbar .sc{color:#34d399;font-weight:800;font-size:14px}.bar{height:6px;background:#1a3820;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#fbbf24);border-radius:10px;transition:width .4s}.question{background:#122818;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #34d399}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1a3820;border:2px solid #1a3820;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#34d399;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#122818}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#6aaa80;font-weight:600;font-size:14px}.done{text-align:center;background:#122818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#6aaa80;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#34d399;color:#0a1a10;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🩹</div><h1>Wound Dressing Quiz</h1><p class="sub">Dressing technique, cleaning, and bandaging</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"Dressings are ___ and directly cover the wound. Bandages are ___ and cover dressings.",opts:["Non-sterile; sterile","Sterile; non-sterile","Both sterile","Both non-sterile"],a:1,tip:"Dressing = sterile, touches wound. Bandage = non-sterile, covers dressing. Never reverse."},
{q:"When cleaning a wound, you should clean from:",opts:["Outside inward","Center outward — new swab for each pass","Top to bottom only","Any direction is fine"],a:1,tip:"Center outward. Use a new swab for each pass. Discard after one wipe."},
{q:"If a dressing is stuck to the wound, you should:",opts:["Pull it off quickly","Soak in sterile saline before removing","Leave it on permanently","Cut around it"],a:1,tip:"Soak in sterile saline or water. Pulling dry dressings tears new tissue."},
{q:"After bandaging, you must check:",opts:["The patient's temperature","Circulation distal to the bandage — capillary refill, color, sensation","The bandage brand","Nothing further"],a:1,tip:"Never bandage so tight that circulation is restricted. Check refill, color, sensation."},
{q:"When applying a sterile dressing, never ___ across the wound.",opts:["Look","Drag — it introduces microorganisms","Press","Tape"],a:1,tip:"Place dressing without dragging. Dragging introduces new microorganisms to the wound bed."},
{q:"Discharge instructions should be given:",opts:["Verbally only","In writing only","Both written AND verbal","Only if the patient asks"],a:2,tip:"Always both. Anxious patients won't retain everything they hear in a single conversation."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=5?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Dressings are sterile, bandages are not. Clean center-out. Never drag across the wound.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
