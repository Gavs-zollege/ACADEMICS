<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Call the Provider If...</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#180a12,#26101c,#120816);font-family:'Manrope',sans-serif;padding:24px 16px;color:#ffe8f2}.wrap{max-width:560px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#b87090;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar span{font-weight:700;font-size:14px}.topbar .ct{color:#b87090}.topbar .sc{color:#fbbf24}.bar{height:6px;background:#301828;border-radius:10px;margin-bottom:24px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#f472b6,#4ade80);border-radius:10px;transition:width .4s}.vc{background:linear-gradient(135deg,#220e18,#301828);padding:32px 28px;border-radius:24px;text-align:center;margin-bottom:24px;border:2px solid rgba(244,114,182,.15)}.vc .label{color:#f472b6;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:2px;margin-bottom:10px}.vc .text{font-weight:800;font-size:19px;line-height:1.6}.fb{text-align:center;padding:14px;margin-bottom:16px;border-radius:14px;font-weight:800;font-size:18px}.fb.ok{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);color:#4ade80}.fb.no{background:rgba(251,113,133,.1);border:1px solid rgba(251,113,133,.25);color:#fb7185}.fb .ex{font-weight:600;font-size:14px;color:#b87090;margin-top:6px}.btns{display:flex;gap:16px}.btns button{flex:1;padding:18px 20px;border-radius:16px;font-weight:800;font-size:18px;cursor:pointer;font-family:inherit;color:#ffe8f2;transition:all .2s}.bp{background:rgba(244,114,182,.12);border:3px solid #f472b6}.bn{background:rgba(74,222,128,.12);border:3px solid #4ade80}.done{text-align:center;background:#220e18;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#b87090;font-weight:600;font-size:15px;margin-bottom:24px}.btn-r{padding:14px 36px;border:none;border-radius:14px;background:#f472b6;color:#180a12;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📋</div><h1>Call the Provider If...</h1><p class="sub">Should the patient call the provider for this symptom?</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const ITEMS=[
{text:"Mild soreness at the incision site that decreases over time",call:false,why:"Normal post-op. Mild, decreasing soreness is expected healing."},
{text:"Fever of 100°F (37.7°C) or higher",call:true,why:"Fever after a procedure may indicate infection. Call the provider."},
{text:"Unusual pain or a burning sensation at the wound site",call:true,why:"Unusual pain or burning could signal infection or complication."},
{text:"Slight bruising around the incision",call:false,why:"Minor bruising is common and expected after surgical procedures."},
{text:"Swelling, redness, or discoloration at the site",call:true,why:"Signs of possible infection or wound complication. Report immediately."},
{text:"Drainage with an unpleasant odor",call:true,why:"Foul-smelling drainage is a classic sign of infection. Call right away."},
{text:"Nausea or vomiting after the procedure",call:true,why:"Could indicate a reaction to anesthesia, medications, or a complication."},
{text:"A small amount of dry scabbing over the incision line",call:false,why:"Scabbing is normal wound healing — the proliferative phase at work."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),it=ITEMS[ci];let h='<div class="topbar"><span class="ct">'+(ci+1)+' / '+ITEMS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/ITEMS.length*100)+'%"></div></div><div class="vc"><div class="label">Post-Op Symptom</div><div class="text">'+it.text+'</div></div>';if(chosen!==null){const ok=chosen===it.call;h+='<div class="fb '+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Actually: '+(it.call?'CALL the provider':'Normal — no call needed'))+'<div class="ex">'+it.why+'</div></div>'}h+='<div class="btns"><button class="bp" '+(chosen===null?'onclick="pick(true)"':'')+'>📞 Call Provider</button><button class="bn" '+(chosen===null?'onclick="pick(false)"':'')+'>✅ Normal</button></div>';g.innerHTML=h}function pick(shouldCall){if(chosen!==null)return;chosen=shouldCall;if(shouldCall===ITEMS[ci].call)score++;renderQ();setTimeout(()=>{if(ci+1<ITEMS.length){ci++;chosen=null;renderQ()}else showDone()},2200)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=7?'🏆':'💪')+'</div><h2>'+score+'/'+ITEMS.length+' Correct!</h2><p>Always give discharge instructions in writing AND verbally. Patients must know when to call.</p><button class="btn-r" onclick="reset()">🔄 Play Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
