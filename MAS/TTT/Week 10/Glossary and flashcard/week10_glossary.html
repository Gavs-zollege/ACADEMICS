<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 10 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 10 Glossary</h1>
  <p class="sub">General Patient Care — Applied Skills</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Sterile Technique",color:"#6B7B8D",terms:[
    {term:"Surgical Asepsis",def:"Practices maintaining a microorganism-free environment during invasive procedures. Sterile handwashing, gloves, strict field management."},
    {term:"Sterile Field",def:"Area completely free of microorganisms — typically a Mayo stand with sterile drape. If any doubt, treat as non-sterile."},
    {term:"Mayo Stand",def:"Movable stainless steel tray used as sterile field surface. Disinfected, dried, positioned above waist height."},
    {term:"Autoclave",def:"Primary sterilization method — high-temperature steam under pressure destroys all microorganisms including spores."},
    {term:"Sterilization Indicator",def:"Chemical tape that changes color when properly sterilized. Check color and date before opening any sterile packet."},
    {term:"1-Inch Border Rule",def:"The outermost 1 inch of a sterile drape is considered non-sterile. No items may be placed in this zone."},
    {term:"Sterile Packet Opening",def:"Open flap farthest from body first, then sides, then closest flap. Never reach over the field."},
  ]},
  {name:"Wound Closure",color:"#8B6AAE",terms:[
    {term:"Suture",def:"Thread closing tissue after surgery/injury. Absorbable (dissolves 5–20 days) or nonabsorbable (must be removed 5–6 days)."},
    {term:"Absorbable Suture",def:"Broken down by body enzymes — no removal needed. Used for internal tissue layers."},
    {term:"Nonabsorbable Suture",def:"Must be physically removed. Nylon, silk, polyester, stainless steel. Remove within 5–14 days."},
    {term:"Surgical Staples",def:"Stainless steel fasteners for high-tension wounds. Removed with specialized remover within 4–14 days."},
    {term:"Suture Removal",def:"Cut below knot close to skin. Remove every other first, then remaining. Never pull outside material through skin."},
    {term:"Staple Removal",def:"Start with second staple, not first. Squeeze remover to bend staple and free legs. Discard in sharps container."},
    {term:"Butterfly Closure",def:"Adhesive strip reinforcing wounds after suture/staple removal or for small, low-tension wounds."},
    {term:"Skin Adhesive",def:"Cyanoacrylate adhesive creating waterproof bond over small lacerations. No removal needed."},
    {term:"Wound Dehiscence",def:"Separation of wound edges after closure. Stop removal immediately and notify provider if noticed."},
  ]},
  {name:"Office Procedures",color:"#E05555",terms:[
    {term:"Biopsy",def:"Tissue sample removal for microscopic exam. MA prepares and labels specimen container correctly."},
    {term:"Incision and Drainage",def:"Procedure to relieve pus buildup from an abscess. Discharge may be cultured for antibiotic selection."},
    {term:"Cryosurgery",def:"Destroying abnormal tissue with intense cold (liquid nitrogen). Removes warts, skin lesions, cervical changes."},
    {term:"Colposcopy",def:"Magnified exam of vagina/cervix using colposcope. Lithotomy position. Used when Pap smear is abnormal."},
    {term:"Endoscopy",def:"Flexible lighted tube with camera views inside hollow organs. Colonoscopy, EGD, cystoscopy."},
    {term:"Foreign Body Removal",def:"Surgical removal of embedded objects using forceps. Sterile field required. Prevents infection."},
  ]},
  {name:"Wounds & Bleeding",color:"#E74C6F",terms:[
    {term:"Abrasion",def:"Skin rubbed/scraped away by friction. Generally heals without scarring. Road rash, rug burn."},
    {term:"Incision",def:"Clean smooth wound from sharp instrument. Can cause significant bleeding and scarring."},
    {term:"Laceration",def:"Jagged, torn edges from blunt force. Profuse bleeding, may require suturing."},
    {term:"Puncture Wound",def:"Deep narrow wound from pointed object. Minimal external bleeding but high infection risk."},
    {term:"Hemorrhage",def:"Excessive uncontrolled bleeding. Arterial (bright red, spurting), venous (dark, steady), capillary (minimal)."},
    {term:"Arterial Bleeding",def:"Most dangerous — bright red, spurting with heartbeat. Apply firm direct pressure, elevate. Tourniquet if needed."},
    {term:"Tourniquet",def:"Tight band above bleeding site to stop arterial hemorrhage when direct pressure fails. Document time applied."},
    {term:"Dressing",def:"Sterile covering applied directly over wound. Protects, absorbs drainage, promotes healing."},
    {term:"Bandage",def:"Non-sterile wrap over a dressing. Holds it in place, applies pressure. Firm but not circulation-restricting."},
    {term:"Evisceration",def:"Organs protrude through separated wound. Cover with sterile moist dressing. Call 911. Do not push back in."},
  ]},
  {name:"Wound Healing",color:"#4A90B8",terms:[
    {term:"Inflammatory Phase",def:"Days 1–4. Pain, swelling, redness, warmth. Immune response activates, blood clot forms to seal wound."},
    {term:"Proliferative Phase",def:"Days 4–21. Fibrin threads draw edges together, new cells rebuild tissue, scab (eschar) forms."},
    {term:"Maturation Phase",def:"Day 21 to 2 years. Collagen strengthens closure forming scar. Scar gradually fades and thins."},
    {term:"Inflammation",def:"Protective response — redness, swelling, warmth, pain. Normal in healing; excessive = possible infection."},
    {term:"Signs of Infection",def:"Increased redness, swelling, purulent drainage, foul odor, fever ≥100°F, increasing pain. Report to provider."},
    {term:"Eschar",def:"Dry dark crust/scab over healing wound. Protective barrier. In burns = hard black dead tissue."},
    {term:"Dehiscence",def:"Wound edges separate after closure. May indicate infection, excessive tension, or poor healing."},
  ]},
  {name:"Emergency Response",color:"#1A8A7D",terms:[
    {term:"Golden Hour",def:"First hour after trauma is most critical for survival. Rapid organized response improves outcomes."},
    {term:"Shock",def:"Cardiovascular failure to deliver adequate blood flow. Pale, clammy, rapid pulse. Always call 911."},
    {term:"Anaphylactic Shock",def:"Severe systemic allergic reaction. Hives, swelling, breathing difficulty. Epinephrine IM, then 911."},
    {term:"Seizure",def:"Uncontrolled brain electrical activity. Lower to floor, don't restrain, move objects, turn on side."},
    {term:"Postictal Phase",def:"Recovery after seizure — confusion, fatigue, headache. Normal part of seizure, not separate emergency."},
    {term:"Syncope",def:"Brief loss of consciousness (fainting). Lower to floor, elevate legs, aromatic ammonia ~6 inches from nose."},
    {term:"Severe Hypoglycemia",def:"Dangerously low glucose. Conscious: give sugar by mouth. Unconscious: glucagon injection, never oral."},
    {term:"Glucagon",def:"Injectable medication for severe hypoglycemia when patient can't take oral glucose. Stimulates liver glucose release."},
    {term:"First-Degree Burn",def:"Epidermis only — redness like sunburn. Cool water 10 min, aloe vera, loose cover."},
    {term:"Second-Degree Burn",def:"Through epidermis into dermis — blisters, red/mottled. Cool water, don't break blisters, sterile dressing."},
    {term:"Third-Degree Burn",def:"All skin layers + nerves. Charred or white, painless. Always call 911."},
    {term:"Fourth-Degree Burn",def:"Through skin into muscle/bone. Painless, life-threatening. Prolonged flame/electricity/chemical exposure."},
  ]},
  {name:"MSK Injuries",color:"#E2B94C",terms:[
    {term:"Sprain",def:"Ligament injury from overstretching/tearing. Ankles, wrists common. Pain, swelling, bruising. RICE treatment."},
    {term:"Strain",def:"Muscle or tendon injury. Acute or gradual. Lower back, hamstrings common. Pain, spasms. RICE treatment."},
    {term:"RICE Protocol",def:"Rest, Ice (20 min), Compression (elastic bandage), Elevation (above heart level). Standard sprain/strain first aid."},
    {term:"Dislocation",def:"Bone displaced from joint socket. Shoulder most common. Visible deformity, severe pain. Don't reposition — emergency."},
    {term:"Fracture",def:"Bone break. Closed = skin intact. Open (compound) = bone through skin, high infection risk. Immobilize, ice, control bleeding."},
    {term:"Open Fracture",def:"Broken bone penetrates through skin. High infection risk. Emergency care required. Don't clean or push bone back."},
  ]},
  {name:"Emergency Prep",color:"#4CAF90",terms:[
    {term:"Emergency Action Plan",def:"Written protocol for office emergencies. Who calls 911, equipment locations, evacuation routes, staff roles."},
    {term:"Crash Cart",def:"Portable emergency equipment/medications. Accessible within 3 min. Checked monthly for completeness and expiration."},
    {term:"AED",def:"Automated External Defibrillator — analyzes rhythm and delivers shock for V-fib/pulseless V-tach. Check pads/battery regularly."},
    {term:"Naloxone (Narcan)",def:"Reverses opioid overdose by blocking opioid receptors. IM, nasal, or IV. Effects temporary — always call 911."},
    {term:"Emergency Drill",def:"Practice simulation of emergency scenarios to test team response and identify protocol gaps."},
    {term:"CPR",def:"Chest compressions + rescue breaths maintaining circulation/oxygen. All MAs should be certified. Initiate immediately if no pulse."},
  ]},
  {name:"DMEPOS",color:"#C4A84D",terms:[
    {term:"DME",def:"Durable Medical Equipment — reusable, prescribed, for home use, ≥3 year lifespan. Wheelchairs, CPAP, oxygen."},
    {term:"DMEPOS",def:"DME + Prosthetics, Orthotics, Supplies. Coverage defined by CMS. May require prior authorization."},
    {term:"Prosthetics",def:"Artificial devices replacing missing body parts — most commonly limbs. May require prior auth for coverage."},
    {term:"Orthotics",def:"External devices supporting/aligning movable body parts — braces, splints, orthopedic insoles."},
    {term:"Prior Authorization (DMEPOS)",def:"Insurance approval request before providing DMEPOS item. Required for items on CMS required list."},
    {term:"DME MAC",def:"Medicare Administrative Contractor reviewing DMEPOS prior auth requests and claims. Denials can be appealed."},
    {term:"Medical Necessity Docs",def:"Clinical documentation justifying DMEPOS order — diagnosis, condition requiring item, home use confirmation."},
    {term:"Face-to-Face Encounter",def:"Required in-person visit within 6 months before certain high-cost DMEPOS orders like power wheelchairs."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
