kground:var(--blueLight);border-color:var(--blue)}.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}. <script>
const S=[{"id":0,"type":"title","title":"General Patient Care:\\nApplied Skills","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Ten","tags":["Sterile Field","Surgical Assist","Wound Care","Emergencies","DMEPOS"],"fs":32},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Prepare and maintain a sterile field","Perform staple and suture removal","Assist with surgical interventions and discharge instructions","Administer first aid and basic wound care","Identify and respond to emergency and priority situations","Assist the provider with patients presenting with minor and traumatic injury","Order and identify DMEPOS and obtain prior authorization"]},{"id":2,"type":"twocol","title":"Preparing & Maintaining a Sterile Field","lt":"Setting Up the Sterile Field","lc":"var(--accent)","li":[{"l":"Mayo stand prep","d":"Disinfect, dry, above waist height, at least 12 inches from body."},{"l":"Open packaging","d":"Farthest flap first, then sides, then closest — never reach over field."},{"l":"1-inch border rule","d":"Outermost inch is non-sterile. Never place items in this zone."},{"l":"Sterilization indicators","d":"Check autoclave tape color change and date before every use."},{"l":"Adding items mid-procedure","d":"Open packet and drop item onto field — don't touch inner wrapper or field."}],"rt":"Non-Negotiable Rules","rc":"var(--warm)","ri":[{"l":"Never leave unattended","d":"Unattended = contaminated. Period."},{"l":"Never reach over it","d":"Air currents and particle fallout contaminate the surface."},{"l":"Never turn your back","d":"Outside line of sight = contamination cannot be confirmed."},{"l":"No gray zone","d":"If any doubt about sterility — treat as non-sterile and replace."},{"l":"Sterile hands only","d":"Only surgical-scrubbed, sterile-gloved individuals may touch the field."}]},{"id":3,"type":"twocol","title":"Minor Office Surgeries & Wound Closure","lt":"Common Office Procedures","lc":"var(--blue)","li":[{"l":"Biopsy","d":"Tissue removal for microscopic exam — diagnose cancer, skin conditions."},{"l":"Incision & Drainage (I&D)","d":"Lance abscess to release pus. Discharge may be cultured."},{"l":"Cryosurgery","d":"Destroy abnormal tissue with liquid nitrogen — cervical changes, skin lesions."},{"l":"Foreign Body Removal","d":"Embedded objects (splinters, glass, metal) using forceps."},{"l":"Colposcopy","d":"Magnified exam of vaginal/cervical tissue in lithotomy position."}],"rt":"Wound Closure Options","rc":"var(--accent)","ri":[{"l":"Sutures","d":"Absorbable (dissolve 5–20 days) or nonabsorbable (removed 5–6 days)."},{"l":"Surgical staples","d":"High-tension areas (trunk, scalp); removed 4–14 days."},{"l":"Sterile tapes","d":"Low-tension wounds like small facial cuts; non-allergenic."},{"l":"Skin adhesives","d":"Cyanoacrylate-based; instant, strong, flexible bond with moisture."}]},{"id":4,"type":"twocol","title":"Suture & Staple Removal","lt":"Suture Removal","lc":"var(--accent)","li":[{"l":"Assess first","d":"Inspect for approximation, drainage, healing before touching a suture."},{"l":"Soak if needed","d":"Saline soak for crusting blood or exudate before removal."},{"l":"Cut close to skin","d":"Suture scissors below knot, as close to skin as possible."},{"l":"Every other first","d":"Remove alternate sutures, observe wound line, then remove rest."},{"l":"Critical rule","d":"Never pull outside suture material back through skin — drags contamination."}],"rt":"Staple Removal","rc":"var(--blue)","ri":[{"l":"Start with second staple","d":"Not the first — protects wound edges at both ends."},{"l":"Technique","d":"Lower jaw under staple, squeeze fully closed — bends and pulls edges out."},{"l":"Every other staple","d":"Alternating removal while watching wound line."},{"l":"Staples → sharps","d":"Metal → sharps container. Sutures → biohazard waste."},{"l":"After removal","d":"Count and document. Stop if gaping/bleeding. Clean, dry, dress, butterfly if indicated."}]},{"id":5,"type":"twocol","title":"Discharge Instructions & Wound Healing","lt":"Postoperative Instructions","lc":"var(--warm)","li":[{"l":"Written AND verbal","d":"Patients are anxious — won't retain everything they hear."},{"l":"Activity restrictions","d":"Bathing, exercise, lifting — explain clearly and specifically."},{"l":"Wound care","d":"How to change dressing, what to apply, observe for infection."},{"l":"Medications","d":"Name, dose, timing, storage, side effects to watch."},{"l":"Call provider if","d":"Unusual pain, swelling, redness, drainage with odor, fever ≥100°F, nausea."}],"rt":"Wound Healing — Three Phases","rc":"var(--accent)","ri":[{"l":"Phase 1: Inflammatory (Days 1–4)","d":"Pain, swelling. Blood clot forms to seal wound. Immune response begins."},{"l":"Phase 2: Proliferative (Days 4–21)","d":"Fibrin threads bridge edges. New cells multiply. Scab forms."},{"l":"Phase 3: Maturation (Day 21–2 years)","d":"Cells strengthen and tighten closure. Scar forms, gradually fades."},{"l":"Complications to watch","d":"Infection, hemorrhage, dehiscence (edges separate), evisceration (organs protrude)."}]},{"id":6,"type":"tab","title":"First Aid & Emergency Response","tk":"0","tabs":[{"n":"Shock & Seizure","c":"#D94F4F","items":["Shock: lay flat, elevate legs, monitor pulse, CPR if needed, call 911","Anaphylaxis: EpiPen IM into upper thigh immediately","Seizure: lower to floor, don't restrain, move objects, turn on side","After seizure (postictal): let rest — confusion and exhaustion are normal","Do NOT put anything in patient's mouth during seizure"]},{"n":"Choking & Hypoglycemia","c":"#E8853D","items":["Adults/children >1 yr: abdominal thrusts (Heimlich maneuver)","Infants <1 yr: 5 back slaps + 5 chest thrusts — NO abdominal thrusts","If unresponsive: begin CPR — compressions can dislodge obstruction","Mild hypoglycemia: food or high-sugar liquid","Severe (unconscious): glucagon injection — no oral glucose. Call 911"]},{"n":"Syncope & Burns","c":"#4A90D9","items":["Syncope: lower to floor, elevate legs, ammonia 6 inches from nose","Do not leave patient alone; notify provider","Minor burns: cool running water 10 min — not ice. Aloe, cover loosely","Do not break blisters — increases infection risk","Major/3rd-4th degree: call 911, don't remove stuck clothing, watch for shock"]}]},{"id":7,"type":"twocol","title":"Wound Types & Hemorrhage Control","lt":"Four Types of Wounds","lc":"var(--blue)","li":[{"l":"Abrasion","d":"Skin rubbed away — usually heals without scarring."},{"l":"Incision","d":"Clean cut from scalpel/sharp — may bleed heavily; scarring if deep."},{"l":"Laceration","d":"Jagged, torn edges — profuse bleeding and scarring."},{"l":"Puncture","d":"Small entry from needle/nail — minimal external bleeding but high infection risk."}],"rt":"Hemorrhage Control & Dressings","rc":"var(--warm)","ri":[{"l":"Arterial","d":"Bright red, spurting. Most dangerous. Firm pressure, elevate, tourniquet if needed."},{"l":"Venous","d":"Dark red, steady. Gauze, pressure, elevate."},{"l":"Capillary","d":"Slow, minimal — usually clots on its own."},{"l":"Dressing vs. bandage","d":"Dressings = sterile, touch wound. Bandages = non-sterile, cover dressing."},{"l":"Wound cleaning","d":"Center outward. New swab each pass. Sterile gloves. Don't drag dressing."}]},{"id":8,"type":"twocol","title":"Emergency Preparedness & DMEPOS","lt":"Emergency Kit (Crash Cart)","lc":"var(--warm)","li":[{"l":"AED","d":"Accessible within 3 min from anywhere. Check pads and battery regularly."},{"l":"Airway management","d":"Oxygen, suction, ambu-bag for respiratory emergencies."},{"l":"Emergency meds","d":"Epinephrine, naloxone, nitroglycerin, albuterol, atropine, morphine, normal saline."},{"l":"Pediatric meds","d":"Clearly labeled, separate bags, dosed for children."},{"l":"Monthly checks","d":"Inventory, expiration dates, AED verification — documented."}],"rt":"DMEPOS & Prior Authorization","rc":"var(--blue)","ri":[{"l":"Qualifies if","d":"Medical purpose, prescribed, durable, ≥3-year lifespan, used at home."},{"l":"Examples","d":"CPAP, O₂ concentrators, wheelchairs, crutches, prosthetics, hospital beds."},{"l":"Prior auth","d":"Submit to insurance before item is furnished. CMS maintains the Master List."},{"l":"If denied","d":"Provider may appeal with additional clinical documentation."},{"l":"MA role","d":"Submit auth requests, teach patients to use equipment, coordinate delivery."}]},{"id":9,"type":"takeaways","title":"Week Ten — Key Takeaways","items":["A sterile field is sterile or it isn't — no in-between. If in doubt, replace it.","Remove sutures/staples every other one first, watching the wound line. Stop if gaping or bleeding.","Give discharge instructions in writing AND verbally — patients rarely retain everything.","The golden hour is real — organized, rapid response saves lives. Know the plan before you need it.","Dressings are sterile (touch wound). Bandages are non-sterile (cover dressings). Always in this order.","Arterial bleeding: bright red, spurting, most dangerous. Firm pressure immediately.","Crash cart checked monthly — inventory, expirations, AED pads/battery. Documented.","DMEPOS prior auth must be submitted before the item is furnished. Denials can be appealed."]},{"id":10,"type":"quiz","title":"Knowledge Check","questions":[{"q":"When opening a sterile package, which flap do you open first?","options":["Closest to you","Farthest from you","Left side","Right side"],"correct":1,"explanation":"Open the flap farthest from you first, then sides, then closest — to avoid reaching over the field."},{"q":"How do you know if a wrapped instrument is still sterile?","options":["It feels clean","Packaging is intact, dry, and within 30 days","The autoclave tape is present","The instrument looks shiny"],"correct":1,"explanation":"Double-wrapped packages are sterile for 30 days if intact, dry, and undamaged."},{"q":"Arterial bleeding is characterized by:","options":["Dark red, steady flow","Slow, minimal oozing","Bright red, spurting","Clear fluid drainage"],"correct":2,"explanation":"Arterial: bright red, spurting — highest pressure, most life-threatening."},{"q":"For infant choking, you perform:","options":["Abdominal thrusts (Heimlich)","5 back slaps + 5 chest thrusts","CPR only","Finger sweep of the mouth"],"correct":1,"explanation":"Infants <1 year: 5 back slaps followed by 5 chest thrusts — NO abdominal thrusts."},{"q":"Removed staples go in which container?","options":["Regular trash","Biohazard bag","Sharps container","Recycling"],"correct":2,"explanation":"Staples are metal — they go in the sharps container. Sutures go in biohazard waste."},{"q":"DMEPOS items must have an expected lifespan of at least:","options":["6 months","1 year","3 years","5 years"],"correct":2,"explanation":"To qualify as DMEPOS, items must have an expected lifespan of at least 3 years."}]},{"id":11,"type":"end","title":"End of Week Ten","subtitle":"General Patient Care: Applied Skills","message":"From sterile fields to crash carts, the applied skills you've practiced this week prepare you to act with precision when it matters most."}];

function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:${s.objectives.length>12?'2':'3'}px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}" style="min-width:${s.objectives.length>12?'20':'22'}px;height:${s.objectives.length>12?'20':'22'}px;font-size:${s.objectives.length>12?'9':'10'}px">${j+1}</div><div style="font-size:${s.objectives.length>12?'9':'10'}px;color:var(--text);line-height:1.35;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:3px;font-style:italic">Click to reveal</p>':''}</div>${F(i)}</div>`}
function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb">${s.desc?`<p style="font-size:10px;color:var(--textMid);margin:0 0 8px">${e(s.desc)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:7px">${s.cards.map(c=>`<div class="cd" style="border-${c.b||'left'}:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div>${s.note?`<div class="co co-${s.nt||'a'}" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${s.note?`<div style="font-size:9px;color:var(--textMid);font-style:italic;margin-top:4px">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[10].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[10].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
