<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Patient Care: Applied Skills</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: rgba(255,255,255,0.025);
    --border: rgba(255,255,255,0.07);
    --text: #c4cedf;
    --text-bright: #e2e8f4;
    --text-muted: #6b7a96;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
  }
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    flex-shrink: 0;
    text-align: center;
    padding: 16px 24px 12px;
  }
  .header h1 {
    font-size: 26px; font-weight: 800;
    color: var(--text-bright); line-height: 1.1; margin-top: 2px;
  }
  .header p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .main {
    flex: 1; overflow: hidden;
    display: flex; gap: 16px;
    padding: 0 24px 16px;
  }
  .sidebar {
    width: 250px; flex-shrink: 0;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    padding-right: 6px;
  }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  .topic-btn {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px; padding: 8px 11px;
    cursor: pointer; transition: all 0.2s ease;
    width: 100%; text-align: left;
    font-family: 'DM Sans', sans-serif; color: var(--text);
  }
  .topic-btn:hover { transform: translateX(2px); }
  .topic-btn .icon { font-size: 18px; flex-shrink: 0; line-height: 1; }
  .topic-btn .label {
    font-size: 13px; font-weight: 500; flex: 1;
    line-height: 1.3; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .topic-btn.active .label { color: var(--text-bright); font-weight: 600; }
  .sidebar-divider {
    height: 1px; background: var(--border);
    margin: 4px 0; flex-shrink: 0;
  }
  .content {
    flex: 1; overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
    display: flex; flex-direction: column;
  }
  .content-header {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .content-header .icon { font-size: 30px; }
  .content-header .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700;
  }
  .content-header .title {
    font-size: 18px; font-weight: 700;
    color: var(--text-bright); line-height: 1.2;
  }
  .content-scroll {
    flex: 1; overflow-y: auto; padding-right: 6px;
  }
  .content-scroll::-webkit-scrollbar { width: 3px; }
  .content-scroll::-webkit-scrollbar-track { background: transparent; }
  .content-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  .point {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(255,255,255,0.025);
    border-radius: 10px; padding: 10px 13px;
    margin-bottom: 7px; border: 1px solid transparent;
    animation: pointIn 0.3s ease both;
  }
  .point .num {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .point p { font-size: 14px; line-height: 1.55; color: var(--text); }
  .takeaway-item {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 13px;
    margin-bottom: 7px;
    animation: pointIn 0.3s ease both;
  }
  .takeaway-item .num {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #E63946, #FF6B35);
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .takeaway-item p { font-size: 14px; line-height: 1.55; color: var(--text); }
  .welcome {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .welcome .big-icon { font-size: 52px; margin-bottom: 14px; }
  .welcome p { font-size: 15px; color: var(--text-muted); line-height: 1.6; max-width: 260px; }
  @keyframes pointIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ===== MOBILE RESPONSIVE ===== */
  @media (max-width: 768px) {
    html, body { overflow: auto; height: auto; }
    .app { height: auto; min-height: 100vh; overflow: visible; }
    .header { padding: 14px 16px 10px; }
    .header h1 { font-size: 22px; }
    .main {
      flex-direction: column;
      padding: 0 12px 16px;
      overflow: visible;
    }
    .sidebar {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 6px;
      padding-right: 0;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .sidebar::-webkit-scrollbar { height: 3px; width: auto; }
    .topic-btn {
      flex-shrink: 0;
      min-width: max-content;
      padding: 7px 12px;
    }
    .sidebar-divider {
      width: 1px; height: auto;
      min-height: 28px;
      margin: 0 2px;
    }
    .content {
      overflow: visible;
      min-height: 60vh;
      padding: 16px;
    }
    .content-scroll { overflow: visible; }
    .point p, .tip-box p, .takeaway-item p { font-size: 13px; }
  }

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>General Patient Care: Applied Skills</h1>
    <p>Sterile Field, Wound Care, Emergencies & DMEPOS</p>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content">
      <div class="welcome">
        <div class="big-icon">📚</div>
        <p>Select a topic to explore its key learning points</p>
      </div>
    </div>
  </div>
</div>
<script>
var TOPICS = [
  { id:1, num:"01", icon:"🔍", title:"Prepare & Maintain a Sterile Field", color:"#E63946",
    points:["A sterile field is a microorganism-free work area used during invasive procedures — it must be set up and protected throughout the entire procedure","Use a Mayo stand: disinfect the tray, allow it to dry, and position it slightly above waist height and at least 12 inches from the body","Open sterile packets correctly — farthest flap first, then sides, then the flap closest to you last — never reach over the field once it is open","The 1-inch border around any sterile drape is non-sterile — no items may be placed in this zone","Core rules: never leave the field unattended, never turn your back on it, never reach over it — if there is any doubt about sterility, treat the item as non-sterile and replace it"] },
  { id:2, num:"02", icon:"🧰", title:"Perform Staple & Suture Removal", color:"#457B9D",
    points:["Before touching anything, assess the wound — look for proper approximation of edges, presence of drainage, and signs of healing; notify the provider if anything looks wrong","Soak with saline first if the wound has crusting blood or dried exudate — do not attempt removal on a wound that needs to be soaked first","Suture removal: cut below the knot as close to the skin as possible; remove every other suture first while watching the wound line; never pull outside suture material back through the skin","Staple removal: begin with the second staple; place the lower jaw under the staple, squeeze handles fully closed without lifting — this bends the staple and pulls it free","After all sutures or staples are removed: count and document the total number; clean the wound, dress as ordered; staples go in the sharps container, sutures go in biohazard waste"] },
  { id:3, num:"03", icon:"🌈", title:"Assist with Surgical Interventions & Discharge Instructions", color:"#2A9D8F",
    points:["Before the procedure: assemble all instruments and supplies, set up the sterile field, and confirm all items are properly sterilized with current autoclave indicators","During the procedure: add items to the sterile field as directed and hand sterile instruments to the provider only while wearing sterile gloves after a proper surgical scrub","Common office procedures: biopsy, incision and drainage (I&D), foreign body removal, cryosurgery, and colposcopy — each requires specific instruments and sterile setup","Discharge instructions must be both verbal AND written — patients are anxious after procedures and will not reliably retain spoken instructions alone","Instruct the patient to contact the provider for: fever ≥100°F, unusual pain or burning, swelling or redness, any drainage (especially with odor), or nausea and vomiting"] },
  { id:4, num:"04", icon:"🧪", title:"Administer First Aid & Basic Wound Care", color:"#8338EC",
    points:["Four wound types: abrasion (skin rubbed away), incision (clean cut), laceration (jagged tear), and puncture (small but high infection risk) — identification guides treatment","Hemorrhage control by type: arterial (bright red, spurting — apply firm pressure, elevate, tourniquet above site if needed); venous (steady dark flow — pressure and elevation); capillary (minimal — clots on its own)","Wound cleaning: work from the center outward using a new swab for each pass; never go back over an already-cleaned area; allow to dry before dressing","Dressings are sterile and cover the wound directly; bandages are non-sterile and cover the dressing — always apply in this order; never bandage so tightly that circulation is compromised","Three phases of wound healing: inflammatory (days 1–4, clot forms), proliferative (days 4–21, new cells and scab form), maturation (day 21 to 2 years, scar forms and fades)"] },
  { id:5, num:"05", icon:"📏", title:"Identify & Respond to Emergency & Priority Situations", color:"#FF6B35",
    points:["The golden hour: the first 60 minutes after injury or sudden illness onset is the most critical for patient survival — rapid, organized response is essential","Shock: lay the patient flat, elevate legs (unless contraindicated), monitor pulse, call 911; anaphylactic shock: EpiPen (epinephrine IM, upper thigh) immediately — then 911","Seizure: lower to the floor, do not restrain, move objects away, turn to the side — after the seizure, let the patient rest; confusion and exhaustion in the postictal phase are expected","Choking: adults and children >1 year = abdominal thrusts; infants <1 year = 5 back slaps then 5 chest thrusts (no abdominal thrusts); if unresponsive, begin CPR","Burns: minor = cool running water 10 minutes, then moisturizer, loose dressing; major = call 911, do not remove stuck clothing, cover loosely, watch for signs of shock"] },
  { id:6, num:"06", icon:"💉", title:"Emergency Preparedness — The Crash Cart & the Plan", color:"#E63946",
    points:["Every office must have a written emergency action plan that all staff have read, practiced, and can execute — knowing the plan before an emergency is the only way to respond effectively","The crash cart (emergency kit) must contain: AED, oxygen supply, ambu-bag, airway/suction device, surgical instruments, and emergency medications","Emergency medications include: epinephrine (anaphylaxis), naloxone (opioid overdose), nitroglycerin (chest pain), albuterol nebulizer (respiratory distress), atropine (bradycardia), morphine (pain), normal saline (IV hydration)","Pediatric medications must be clearly labeled, weight-appropriate, and stored separately — especially critical in allergy and pediatric practices","The crash cart must be checked monthly: inventory, medication expiration dates, AED pad expiration, and battery charge — all documented; a crashed cart that isn\'t maintained is not a crash cart"] },
  { id:7, num:"07", icon:"🩸", title:"Assist the Provider with Minor & Traumatic Injury", color:"#457B9D",
    points:["When a patient presents with trauma: obtain the chief complaint and vital signs, assist the provider as directed, and document findings accurately","Sprains and strains are treated with RICE: Rest, Ice, Compression, Elevation — plus anti-inflammatory medications; physical therapy may follow for severe cases","Dislocations are emergencies — the joint is visibly out of place and extremely painful; immobilize and refer for advanced care; do not attempt to reposition it","Fractures: control bleeding (pressure and elevation), immobilize the injured area, apply ice in cloth to reduce swelling — open fractures (bone visible through skin) carry high infection risk","MA responsibilities in trauma care: clean wounds, prepare sterile fields for procedures, apply bandages, administer injections, educate on infection signs, and schedule follow-up"] },
  { id:8, num:"08", icon:"📋", title:"Order & Identify DMEPOS — Obtain Prior Authorization", color:"#2A9D8F",
    points:["DMEPOS stands for Durable Medical Equipment, Prosthetics, Orthotics, and Supplies — items that serve a medical purpose, are prescribed by a provider, can be used repeatedly, and are used in the home","Common DMEPOS examples: CPAP machines, oxygen concentrators, wheelchairs, crutches, hospital beds, prosthetic limbs, orthotics, dialysis machines, bath chairs, and commodes","To qualify for insurance coverage: the provider must document the patient\'s diagnosis and the medical necessity for the item — some items (e.g., power wheelchairs) require a face-to-face visit within 6 months","Prior authorization: submitted to the DME MAC (Durable Medical Equipment Medicare Administrative Contractor) before the item is furnished; required for high-cost items on CMS\'s Required Prior Authorization List","If authorization is denied, the provider may appeal — the MA often assists by organizing additional clinical documentation; a denied auth does not mean the patient cannot get the item"] },
];

var TAKEAWAYS = [
  "A sterile field is either sterile or it isn\'t — when in doubt, replace the item and start over without hesitation",
  "Remove sutures and staples every other one first, watching the wound line after every removal; stop immediately if gaping, bleeding, or drainage appears",
  "Discharge instructions must always be written AND verbal — patients rarely retain everything they hear in a single anxious conversation after a procedure",
  "The golden hour is real — every second of organized, rapid emergency response matters; know the plan, know your role, and know where the crash cart is",
  "Dressings are sterile and touch the wound; bandages are non-sterile and cover the dressing — always in this order, never dragged across the wound",
  "Prior authorization for DMEPOS must happen before the item reaches the patient — a denied request can be appealed, but it takes time and documentation"
];

var activeId = null;
var sidebar = document.getElementById('sidebar');
var content = document.getElementById('content');

function buildSidebar() {
  TOPICS.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.dataset.id = t.id;
    btn.innerHTML = '<span class="icon">' + t.icon + '</span><span class="label">' + t.title + '</span>';
    btn.addEventListener('click', function() { selectTopic(t.id); });
    btn.addEventListener('mouseenter', function() {
      if (activeId !== t.id) { this.style.background = t.color + '10'; this.style.borderColor = t.color + '55'; }
    });
    btn.addEventListener('mouseleave', function() {
      if (activeId !== t.id) { this.style.background = 'var(--surface)'; this.style.borderColor = 'var(--border)'; }
    });
    sidebar.appendChild(btn);
  });
  var divider = document.createElement('div');
  divider.className = 'sidebar-divider';
  sidebar.appendChild(divider);
  var tkBtn = document.createElement('button');
  tkBtn.className = 'topic-btn';
  tkBtn.dataset.id = 'takeaways';
  tkBtn.innerHTML = '<span class="icon">🎯</span><span class="label">Key Takeaways</span>';
  tkBtn.addEventListener('click', function() { selectTopic('takeaways'); });
  tkBtn.addEventListener('mouseenter', function() {
    if (activeId !== 'takeaways') { this.style.background = 'rgba(255,255,255,0.06)'; this.style.borderColor = 'rgba(255,255,255,0.15)'; }
  });
  tkBtn.addEventListener('mouseleave', function() {
    if (activeId !== 'takeaways') { this.style.background = 'var(--surface)'; this.style.borderColor = 'var(--border)'; }
  });
  sidebar.appendChild(tkBtn);
}

function updateSidebarActive() {
  var btns = sidebar.querySelectorAll('.topic-btn');
  btns.forEach(function(btn) {
    var id = btn.dataset.id;
    var topic = TOPICS.find(function(t) { return t.id == id; });
    var isActive = (id == activeId) || (id === 'takeaways' && activeId === 'takeaways');
    if (isActive) btn.classList.add('active'); else btn.classList.remove('active');
    if (isActive && topic) {
      btn.style.background = topic.color + '20';
      btn.style.borderColor = topic.color;
    } else if (isActive && id === 'takeaways') {
      btn.style.background = 'rgba(255,255,255,0.08)';
      btn.style.borderColor = 'rgba(255,255,255,0.2)';
    } else {
      btn.style.background = 'var(--surface)';
      btn.style.borderColor = 'var(--border)';
    }
  });
}

function renderTopic(t) {
  var html = '<div class="content-header">' +
    '<span class="icon">' + t.icon + '</span>' +
    '<div><div class="tag" style="color:' + t.color + '">TOPIC ' + t.num + '</div>' +
    '<div class="title">' + t.title + '</div></div></div>' +
    '<div class="content-scroll">';
  t.points.forEach(function(p, i) {
    html += '<div class="point" style="border-color:' + t.color + '22;animation-delay:' + (i * 50) + 'ms">' +
      '<div class="num" style="background:' + t.color + '">' + (i + 1) + '</div>' +
      '<p>' + p + '</p></div>';
  });
  html += '</div>';
  return html;
}

function renderTakeaways() {
  var html = '<div class="content-header">' +
    '<span class="icon" style="font-size:30px">🎯</span>' +
    '<div><div class="title">Key Takeaways</div></div></div>' +
    '<div class="content-scroll">';
  TAKEAWAYS.forEach(function(t, i) {
    html += '<div class="takeaway-item" style="animation-delay:' + (i * 50) + 'ms">' +
      '<div class="num">' + (i + 1) + '</div><p>' + t + '</p></div>';
  });
  html += '</div>';
  return html;
}

function selectTopic(id) {
  activeId = id;
  updateSidebarActive();
  if (id === 'takeaways') {
    content.innerHTML = renderTakeaways();
  } else {
    var topic = TOPICS.find(function(t) { return t.id === id; });
    if (topic) content.innerHTML = renderTopic(topic);
  }
  content.style.animation = 'none';
  void content.offsetHeight;
  content.style.animation = 'fadeIn 0.25s ease';
}

buildSidebar();
</script>
</body>
</html>
