<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Preventive Screenings Quiz</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0e0a22,#181040,#0a0620);font-family:'Outfit',sans-serif;padding:24px 16px;color:#e8e0ff}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#9880c0;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#9880c0;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#a3e635);border-radius:10px;transition:width .4s}.question{background:#1c1040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#9880c0;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#9880c0;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#0e0a22;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🔍</div><h1>Preventive Screenings Quiz</h1><p class="sub">When to screen and who to screen</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"Mammograms are recommended annually starting at age:",opts:["30","35","40","50"],a:2,tip:"ACS recommends annual mammograms starting at age 40."},
{q:"Colorectal cancer screening begins at age:",opts:["40","45","50","55"],a:1,tip:"Starting at 45 — FOBT or colonoscopy. Positive FOBT requires colonoscopy."},
{q:"Pap tests for ages 21–29 are recommended every:",opts:["1 year","2 years","3 years","5 years"],a:2,tip:"Every 3 years ages 21–29. Ages 30–65: every 3–5 years with HPV co-test."},
{q:"Lung cancer screening (LDCT) is for patients aged 50–80 with:",opts:["Any smoking history","≥20 pack-year history (current or quit within 15 years)","Family history only","No specific criteria"],a:1,tip:"≥20 pack-year smoking history, current or quit within 15 years. Annual LDCT."},
{q:"HIV screening is recommended for all patients aged:",opts:["18–45","15–65","21–50","Only high-risk"],a:1,tip:"All ages 15–65. Younger adolescents and older adults at increased risk also screened."},
{q:"Hepatitis C one-time screening is recommended for those born:",opts:["1935–1955","1945–1965","1955–1975","1965–1985"],a:1,tip:"Born 1945–1965, IV drug use history, or blood transfusion before 1992."},
{q:"Abdominal aortic aneurysm ultrasound screening is for:",opts:["All adults over 50","Males ages 65–75 who have ever smoked","All females over 60","Anyone with high BP"],a:1,tip:"One-time ultrasound for male patients 65–75 who have ever smoked."},
{q:"Diabetes screening for average-risk adults is recommended every:",opts:["1 year","2 years","3 years","5 years"],a:2,tip:"Every 3 years for adults. More frequently based on risk factors or medical history."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=7?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Knowing when and who to screen is as important as the screening itself. Risk factors change timelines.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
