<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Community Resources Quiz</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0f1f17,#132419,#0d1a20);font-family:'Sora',sans-serif;padding:24px 16px;color:#e8f5ec}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#7da98e;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7da98e;font-weight:700;font-size:14px}.topbar .sc{color:#34d399;font-weight:800;font-size:14px}.bar{height:6px;background:#1e3a28;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#34d399,#fb7185);border-radius:10px;transition:width .4s}.question{background:#162a1f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #34d399}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1e3a28;border:2px solid #1e3a28;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#34d399;font-weight:800;margin-right:12px}.opt.correct{background:rgba(52,211,153,.15);border-color:#34d399}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#162a1f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#34d399}.tip strong.no{color:#fb7185}.tip span{color:#7da98e;font-weight:600;font-size:14px}.done{text-align:center;background:#162a1f;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#7da98e;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#34d399;color:#0f1f17;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🌐</div><h1>Community Resources & Transitions</h1><p class="sub">Resources, referrals & care coordination</p></div>
<div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"A community resource library should be updated at least every:",opts:["1 month","3 months","6 months","1 year"],a:2,tip:"Update at least every 6 months. Post in office and on the practice website."},
{q:"Before scheduling a specialist referral, the MA should first:",opts:["Just schedule the appointment","Check that the specialist accepts the patient's insurance","Ask the patient to find a specialist themselves","Wait for the provider to call"],a:1,tip:"Always verify insurance acceptance. Give patient the specialist's contact info. Follow up."},
{q:"When patients move between providers without clear communication, the risk of ___ increases.",opts:["Patient satisfaction","Rehospitalization and medication errors","Lower costs","Faster recovery"],a:1,tip:"Poor transitions = rehospitalization, med errors, poor outcomes. Clear communication is critical."},
{q:"Pre-visit planning should include checking all EXCEPT:",opts:["Due dates for screenings","Immunization status","The patient's social media","Expiring prescriptions"],a:2,tip:"Check screenings, immunizations, chronic disease labs, and prescription refills — not social media."},
{q:"All patient education and community resource referrals must be:",opts:["Kept private from the chart","Documented in the medical record","Only discussed verbally","Shared on the office bulletin board"],a:1,tip:"If it isn't documented, it didn't happen. Record all education and referrals."},
{q:"Barriers to care include all of the following EXCEPT:",opts:["Behavioral and cultural factors","Physical limitations","Environmental stressors","Having too many doctors"],a:3,tip:"Behavioral, biological, environmental, physical, and cultural factors all affect adherence."},
{q:"The MA's role in patient education is to:",opts:["Give independent recommendations","Reinforce provider instructions and assess comprehension","Diagnose conditions","Prescribe treatment changes"],a:1,tip:"MAs are not authorized to give recommendations — but reinforce instructions and assess understanding."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Community resources are part of the care plan. Update regularly and document every referral.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
