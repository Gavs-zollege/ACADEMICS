<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Disease Prevention</title><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#091a1a,#0e2626,#0a1820);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#e0f5f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:700;font-size:30px;margin:8px 0 4px}.sub{color:#6aaa98;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#6aaa98;font-weight:700;font-size:14px}.topbar .sc{color:#2dd4bf;font-weight:700;font-size:14px}.bar{height:6px;background:#123838;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#2dd4bf,#fbbf24);border-radius:10px;transition:width .4s}.question{background:#0e2424;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #2dd4bf}.question p{font-weight:700;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#123838;border:2px solid #123838;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#2dd4bf;font-weight:700;margin-right:12px}.opt.correct{background:rgba(52,211,153,.15);border-color:#34d399}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#0e2424}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#34d399}.tip strong.no{color:#fb7185}.tip span{color:#6aaa98;font-weight:600;font-size:14px}.done{text-align:center;background:#0e2424;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.done .big{font-size:56px}.done h2{font-weight:700;font-size:28px;margin:12px 0}.done p{color:#6aaa98;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#2dd4bf;color:#091a1a;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🛡️</div><h1>Disease Prevention</h1><p class="sub">Handwashing, vaccination & communicable disease</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"The #1 most effective communicable disease prevention tool:",opts:["Antibiotics","Proper handwashing technique","Masks alone","Avoiding all public places"],a:1,tip:"Handwashing is the single most effective prevention tool."},{q:"When coughing, cough into your:",opts:["Hand","Elbow","A tissue at arm's length","The air"],a:1,tip:"Elbow, not hand. Hands spread germs to everything you touch."},{q:"Which is a reportable disease?",opts:["Common cold","Allergies","Tuberculosis (TB)","Headache"],a:2,tip:"TB, E. coli, Hep B/C, HIV, COVID-19, Lyme disease must be reported."},{q:"High-touch surfaces should be:",opts:["Cleaned weekly","Disinfected regularly","Cleaned only if visibly dirty","Replaced monthly"],a:1,tip:"Regularly disinfect doorknobs, counters, exam tables, shared equipment."},{q:"Staying home when sick protects:",opts:["Your job","Others from becoming infected","Your insurance","Your schedule"],a:1,tip:"Stay home to protect others. Basic communicable disease prevention."},{q:"Vaccinations should follow the:",opts:["Patient preference only","CDC immunization schedule","Office manager's choice","Insurance requirements"],a:1,tip:"CDC immunization schedule is the standard for all age groups."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=5?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Handwashing, vaccination, and reporting are the foundations of disease prevention.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
