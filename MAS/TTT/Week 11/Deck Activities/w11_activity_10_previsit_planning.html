<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pre-Visit Planning</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0d1a0f,#112010,#0a150c);font-family:'Sora',sans-serif;padding:24px 16px;color:#e6f7ea}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#7aab88;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7aab88;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:800;font-size:14px}.bar{height:6px;background:#1c3820;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:10px;transition:width .4s}.question{background:#142818;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a3e635}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1c3820;border:2px solid #1c3820;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a3e635;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#142818}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#7aab88;font-weight:600;font-size:14px}.done{text-align:center;background:#142818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#7aab88;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a3e635;color:#0d1a0f;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">✅</div><h1>Pre-Visit Planning</h1><p class="sub">What to check before the patient arrives</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Pre-visit planning should happen:",opts:["During the visit","Days before — review charts in advance","After the visit","Only for new patients"],a:1,tip:"Review charts days before: screenings, immunizations, labs, refills."},{q:"Check for due dates on all EXCEPT:",opts:["Pap smears and mammograms","Immunizations","Patient's social media activity","HbA1c and diabetic foot checks"],a:2,tip:"Check screenings, immunizations, chronic disease labs, and Rx refills."},{q:"Expiring prescriptions found during review should be:",opts:["Ignored","Flagged for renewal at the visit","Deleted","Auto-refilled by the MA"],a:1,tip:"Flag so the provider can address them during the visit."},{q:"The purpose of pre-visit planning is:",opts:["Shorter visits","Ensuring nothing falls through the cracks","Less MA work","Insurance verification"],a:1,tip:"Comprehensive care: every screening, immunization, and refill addressed."},{q:"Clinical Quality Measures are tracked using:",opts:["Paper only","Electronic tracking tools in the EHR","Patient surveys only","Phone calls"],a:1,tip:"EHR-based tools identify treatments, processes, outcomes for quality."},{q:"MAs assist with CQMs by:",opts:["Making treatment decisions","Ensuring accurate data capture in the EHR","Diagnosing conditions","Prescribing medications"],a:1,tip:"Accurate data entry by MAs directly supports required quality reporting."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=5?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Pre-visit planning ensures nothing falls through the cracks. Review charts days in advance.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
