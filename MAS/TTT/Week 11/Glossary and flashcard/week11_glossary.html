<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 11 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 11 Glossary</h1>
  <p class="sub">Communicating & Educating Patients</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Team-Based Care",color:"#E05555",terms:[
    {term:"Team-Based Health Care",def:"Professionals collaborating with shared accountability for coordinated, high-quality patient care."},
    {term:"PCMH",def:"Patient-Centered Medical Home — PCP-led team coordinating all care. 5 core functions: comprehensive, patient-centered, coordinated, accessible, quality/safety."},
    {term:"ACO",def:"Accountable Care Organization — provider network jointly accountable for quality and cost of care for a defined population."},
    {term:"Pay for Performance",def:"Payment tied to quality/outcomes rather than volume. Rewards keeping patients healthy and meeting benchmarks."},
    {term:"Comprehensive Care",def:"PCMH function — entire team addresses all medical, behavioral, and preventive needs. Whole person care."},
    {term:"Coordinated Care",def:"PCMH function — managing communication across all care settings via EHR technology."},
    {term:"Accessible Services",def:"PCMH function — open scheduling, extended hours, portal messaging, after-hours phone access."},
  ]},
  {name:"Healthcare Team",color:"#6B7B8D",terms:[
    {term:"Primary Care Provider",def:"First provider for care — coordinates preventive services, chronic conditions, referrals. MD, DO, NP, PA."},
    {term:"Specialist",def:"Provider with specific area expertise — cardiologist, dermatologist, oncologist. Referred by PCP."},
    {term:"Advanced Practice Nurse",def:"Graduate-level nurse — NP, CNM, CNS, CRNA. Can diagnose and prescribe. Independent in some states."},
    {term:"Case Manager",def:"RN or social worker overseeing complex patients — tracks progress, coordinates services, ensures safe transitions."},
    {term:"Registered Dietitian",def:"Nutrition expert — meal planning for specific conditions, affordable healthy food options for low-income patients."},
    {term:"Social Worker",def:"Assists with emotional, financial, logistical challenges — transportation, housing, financial assistance, hospice."},
    {term:"Speech-Language Pathologist",def:"Treats disorders of speech, language, voice, and swallowing after stroke, TBI, or developmental delays."},
    {term:"Occupational Therapist",def:"Helps regain daily living activities — dressing, bathing, cooking, work tasks after disability/injury."},
    {term:"Physical Therapist",def:"Restores movement, reduces pain, prevents injury. Hands-on therapy, exercise, electrical stimulation."},
  ]},
  {name:"Screenings",color:"#8B6AAE",terms:[
    {term:"Preventive Care",def:"Services preventing illness and detecting disease early — exams, screenings, immunizations, health coaching."},
    {term:"Pre-Visit Planning",def:"Reviewing records before appointment to identify overdue screenings, immunizations, pending labs."},
    {term:"FOBT",def:"Fecal Occult Blood Test — detects hidden stool blood for colorectal cancer screening. Age 45+ average risk."},
    {term:"Colonoscopy",def:"Scope visualizing entire colon. Detects and removes precancerous polyps. Recommended age 45+."},
    {term:"Mammogram",def:"Breast x-ray detecting cancer including tumors too small to feel. Annual starting at age 40."},
    {term:"Pap Test",def:"Cervical cancer screening — cells collected from cervix. Every 3 years ages 21–29; 3–5 years ages 30–65."},
    {term:"LDCT",def:"Low-Dose CT for lung cancer — ages 50–80 with 20+ pack-year smoking history."},
    {term:"DEXA Scan",def:"Bone density test for osteoporosis risk. Recommended for at-risk postmenopausal patients under 65."},
    {term:"AAA Screening",def:"One-time aortic ultrasound for males 65–75 who have ever smoked. Undetected AAA can rupture fatally."},
    {term:"Clinical Quality Measures",def:"Electronic tools tracking/reporting healthcare quality — screenings, treatments, outcomes. MAs support via EHR documentation."},
  ]},
  {name:"Community Resources",color:"#1A8A7D",terms:[
    {term:"Community Resource Library",def:"Organized collection of local resources for patient referral. Updated every 6 months."},
    {term:"Continuity of Care",def:"Consistent coordinated care across time and providers — history, meds, plans carried forward seamlessly."},
    {term:"Care Coordination",def:"Organizing patient care activities and sharing info among all participants for safe, efficient delivery."},
    {term:"Referral",def:"Provider direction for specialist/service. MA verifies insurance, contacts office, follows up on appointment."},
    {term:"Transitional Care",def:"Services ensuring safe movement between care settings. Poor transitions cause preventable rehospitalization."},
    {term:"Social Determinants of Health",def:"Non-medical factors influencing health — employment, housing, food, education, transportation, income."},
    {term:"Barrier to Care",def:"Any obstacle preventing a patient from following treatment or accessing care. Key MA responsibility to identify."},
    {term:"WIC",def:"Women, Infants, Children program — nutrition education, breastfeeding support, food for income-eligible families."},
  ]},
  {name:"Patient Education",color:"#4A90B8",terms:[
    {term:"Patient Adherence",def:"Degree patient follows treatment recommendations — medications, appointments, lifestyle changes. Better adherence = better outcomes."},
    {term:"Medication Reconciliation",def:"Comparing current meds against all ordered meds to identify discrepancies. Performed every encounter."},
    {term:"Patient Education",def:"Structured process providing knowledge and skills for self-management. Tailored, plain language, reinforced."},
    {term:"Return Demonstration",def:"Patient physically performs a skill after MA demonstrates. Confirms safe at-home ability."},
    {term:"Teach-Back Method",def:"Patient restates info in own words to confirm understanding and identify gaps."},
    {term:"Auditory Learning",def:"Best absorbs through listening. Speak clearly, read instructions aloud, allow verbal Q&A."},
    {term:"Visual Learning",def:"Best absorbs through reading/seeing. Provide diagrams, charts, written instructions, videos."},
    {term:"Kinesthetic Learning",def:"Best absorbs through hands-on practice. Demonstrate then have patient perform (return demonstration)."},
    {term:"Health Literacy",def:"Ability to obtain and understand health info for appropriate decisions. Low literacy = major adherence barrier."},
  ]},
  {name:"Telehealth",color:"#E2B94C",terms:[
    {term:"Telehealth",def:"Digital technologies delivering healthcare services, education, and admin support without in-person visits."},
    {term:"Telemedicine",def:"Subset of telehealth — specifically remote clinical provider-to-patient services via video."},
    {term:"Live Video Visit",def:"Real-time two-way video between patient and provider. Most common telehealth form. MA may assist."},
    {term:"Remote Patient Monitoring",def:"Home devices transmit real-time health data (BP, glucose, cardiac) to care team between visits."},
    {term:"Asynchronous Telehealth",def:"Store-and-forward — patient data sent electronically for provider review at a later time."},
    {term:"Patient Portal",def:"Secure web-based EHR access — records, labs, messages, refills, scheduling. Supports engagement 24/7."},
    {term:"HIPAA (Telehealth)",def:"All digital patient communications must use HIPAA-compliant platforms. Verify authorization before sharing."},
  ]},
  {name:"Disease Prevention",color:"#E74C6F",terms:[
    {term:"Communicable Disease",def:"Infectious illness transmitted person-to-person directly or indirectly. Healthcare must prevent and report."},
    {term:"Mandatory Reporting",def:"Legal obligation to report certain diseases to public health — TB, HIV, hepatitis, E. coli, COVID-19."},
    {term:"Standard Precautions",def:"Minimum infection prevention for every encounter — hand hygiene, PPE, sharps safety, respiratory hygiene."},
    {term:"Hand Hygiene",def:"Single most effective infection prevention method. Soap/water ≥20 sec or alcohol sanitizer. Before and after every patient."},
    {term:"Immunization",def:"Vaccine administration stimulating immune protection. CDC maintains schedules. MA reviews status every visit."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
