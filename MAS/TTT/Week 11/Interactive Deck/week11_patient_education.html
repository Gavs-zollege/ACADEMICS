<script>
const S=[{"id":0,"type":"title","title":"Communicating & Educating\nPatients for Better Outcomes","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Eleven","tags":["Team-Based Care","Preventive Screenings","Community Resources","Patient Education"],"fs":28},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Review patient records prior to a visit to ensure care is comprehensively addressed","Ensure preventive maintenance and screenings are documented in the patient record","Identify timelines and track recommendations for screenings and preventive maintenance","Assist the provider in researching and supplying information on community resources","Coordinate with providers and community-based organizations for continuity of care","Facilitate patient adherence to optimize health outcomes","Participate in team-based patient care (PCMH and ACO)","Participate in the transition of care for patients","Provide patient education via telehealth and virtual visit systems"]},{"id":2,"type":"twocol","title":"Team-Based Care — PCMH & ACO","lt":"Patient-Centered Medical Home (PCMH)","lc":"var(--accent)","li":[{"l":"Comprehensive care","d":"Whole patient focus. Entire team participates, not just physician."},{"l":"Patient-centered","d":"Patient and family are core partners. Individual needs guide approach."},{"l":"Coordinated care","d":"PCP oversees all specialty, hospital, home, community services."},{"l":"Accessible services","d":"Open scheduling, extended hours, patient portal tools."},{"l":"Quality and safety","d":"Evidence-based medicine, safety data, patient satisfaction measurement."}],"rt":"Accountable Care Organization (ACO)","rc":"var(--blue)","ri":[{"l":"What is an ACO?","d":"Network of providers jointly accountable for quality and cost of care."},{"l":"Beyond clinic walls","d":"Emphasis on public health and disease prevention at population level."},{"l":"Community outreach","d":"Smoking cessation, weight loss, nutrition education — open to public."},{"l":"vs. PCMH","d":"PCMH = one practice. ACO = many practices with shared financial accountability."},{"l":"Pay for performance","d":"Quality-based payment. Everyone works at top of credential."}]},{"id":3,"type":"table","title":"Preventive Screenings & Timelines","hd":["Screening","When & Who"],"rows":[["Blood Pressure","Ongoing; higher risk with obesity, family history, prior elevated"],["Breast Cancer (Mammogram)","Annually starting at age 40 (ACS)"],["Cervical Cancer (Pap)","Every 3 yrs ages 21–29; every 3–5 yrs ages 30–65 (HPV co-test)"],["Colorectal Cancer","Starting at age 45 — FOBT or colonoscopy"],["Cholesterol","More frequent with family history of high cholesterol/heart disease"],["Lung Cancer (LDCT)","Annual, ages 50–80 with ≥20-pack-year smoking history"],["Diabetes (Glucose)","Every 3 years for adults; more frequently based on risk"],["Bone Density","Postmenopausal patients <65 at increased osteoporosis risk"],["HIV Screening","All ages 15–65; younger/older at increased risk also screened"],["Hepatitis C","One-time for those born 1945–1965, IV drug use, pre-1992 transfusion"],["Dental Exam","Annually (ADA); oral health impacts systemic health"]]},{"id":4,"type":"twocol","title":"Community Resources & Care Transitions","lt":"Community Resource Library","lc":"var(--accent)","li":[{"l":"Clinical","d":"Home health, long-term care, mental health, hospice, community health centers."},{"l":"Non-clinical","d":"Food pantries, transportation, fuel/weatherization, employment, financial resources."},{"l":"Disability services","d":"TASH, National Disability Rights Network, The Arc, AAIDD."},{"l":"How to build the list","d":"Name, address, phone, website, contact person. Update every 6 months."},{"l":"Barriers to care","d":"Behavioral, biological, environmental, physical, cultural factors all affect adherence."}],"rt":"Coordinating Care & Transitions","rc":"var(--blue)","ri":[{"l":"Why transitions matter","d":"Poor communication between providers → rehospitalization, med errors, poor outcomes."},{"l":"Keys to good transition","d":"Communicate history, meds, special needs to receiving provider."},{"l":"Referral process","d":"Check specialist accepts insurance. Give patient contact info. Follow up."},{"l":"Pre-visit planning","d":"Review chart days before: screenings, immunizations, labs, refills."},{"l":"Document everything","d":"All education, referrals, coordination must be in the medical record."}]},{"id":5,"type":"twocol","title":"Patient Education — Learning Styles & Delivery","lt":"Three Learning Styles","lc":"var(--purple)","li":[{"l":"Auditory","d":"Learns by hearing. Speak clearly, read instructions aloud, allow questions."},{"l":"Visual","d":"Learns by reading/seeing. Diagrams, charts, written instructions, videos."},{"l":"Kinesthetic","d":"Learns by doing. Demonstrate skill, then patient practices (return demo)."}],"rt":"Effective Delivery & Adherence","rc":"var(--accent)","ri":[{"l":"Setting","d":"Quiet, private — distractions block learning."},{"l":"Communication","d":"Even pace, eye contact, plain language — no jargon."},{"l":"Written materials","d":"Always send home — patients remember very little from one session."},{"l":"Assess understanding","d":"Ask patient to restate information in their own words."},{"l":"Facilitating adherence","d":"Follow-up calls, pill organizers, phone reminders, appointment reminders."}]},{"id":6,"type":"twocol","title":"Telehealth, Healthy Lifestyle & Disease Prevention","lt":"Telehealth & Healthy Lifestyle","lc":"var(--blue)","li":[{"l":"Telehealth","d":"Live video, data exchange, remote monitoring. Opens specialty care to rural areas."},{"l":"MA role (virtual)","d":"Set up encounter, resolve tech issues, document, provide education, schedule follow-ups."},{"l":"Nutrition","d":"Limit fats and sodium (<2,300 mg). Increase fruits, vegetables, fiber."},{"l":"Exercise","d":"40 min moderate-to-vigorous 3–4×/week. 7–8 hours sleep nightly."},{"l":"Avoid","d":"Tobacco, illicit drugs, excessive alcohol. Practice safe sex."}],"rt":"Communicable Disease Prevention","rc":"var(--warm)","ri":[{"l":"Reportable diseases","d":"TB, E. coli, Hepatitis B/C/D/E, HIV, gonococcal infections, COVID-19."},{"l":"Handwashing","d":"Single most effective prevention tool."},{"l":"Cough/sneeze","d":"Into the elbow — not the hand."},{"l":"Surfaces","d":"Disinfect frequently touched surfaces regularly."},{"l":"Stay home","d":"When sick, to protect others."},{"l":"Vaccinations","d":"Keep current per CDC immunization schedule."}]},{"id":7,"type":"takeaways","title":"Week Eleven — Key Takeaways","items":["In PCMH and ACO models, the patient's health is everyone's responsibility. Every team member communicates openly.","Pre-visit planning begins before the patient arrives — review screenings, immunizations, labs, and prescription refills.","Knowing when and who to screen is as important as the screening itself — risk factors change the timeline.","Community resources are part of the care plan — identify, document, and update your resource library regularly.","Patient education must match the learning style — auditory, visual, or kinesthetic. Always assess comprehension.","Telehealth is not a lesser standard — same professionalism, scope, HIPAA, and documentation requirements apply.","Transitions between providers are high-risk moments. Clear communication reduces rehospitalization.","All education, referrals, and coordination must be documented — if it isn't documented, it didn't happen."]},{"id":8,"type":"quiz","title":"Knowledge Check","questions":[{"q":"In a PCMH model, who coordinates all patient care?","options":["The specialist","The PCP","The insurance company","The hospital"],"correct":1,"explanation":"The PCP leads the interprofessional team coordinating all aspects of care in a PCMH model."},{"q":"At what age should colorectal cancer screening begin?","options":["Age 40","Age 45","Age 50","Age 55"],"correct":1,"explanation":"Colorectal screening starts at age 45 via FOBT or colonoscopy."},{"q":"Which learning style involves having the patient practice a skill?","options":["Auditory","Visual","Kinesthetic","Cognitive"],"correct":2,"explanation":"Kinesthetic learners learn by doing — demonstrate the skill, then have the patient perform a return demonstration."},{"q":"How often should a community resource library be updated?","options":["Monthly","Every 6 months","Annually","Every 3 years"],"correct":1,"explanation":"Update at least every 6 months to ensure accurate contact information and available services."},{"q":"What is the single most effective tool for communicable disease prevention?","options":["Wearing masks","Vaccination","Proper handwashing","Social distancing"],"correct":2,"explanation":"Proper handwashing is the single most effective prevention tool for communicable disease."},{"q":"Pap tests begin at what age regardless of sexual activity?","options":["Age 18","Age 21","Age 25","Age 30"],"correct":1,"explanation":"Pap tests begin at age 21 regardless of sexual activity."}]},{"id":9,"type":"end","title":"End of Week Eleven","subtitle":"Communicating & Educating Patients","message":"Patient education isn't an add-on — it's the bridge between clinical care and patient outcomes. Every conversation, resource, and follow-up call moves the needle."}];

function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${s.note?`<div style="font-size:9px;color:var(--textMid);font-style:italic;margin-top:4px">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[8].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[8].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
