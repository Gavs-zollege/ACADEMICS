<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mandatory Reporting Quiz</title><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#1a0808,#2a1010,#180808);font-family:'Rubik',sans-serif;padding:24px 16px;color:#ffe0e0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#c07070;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#c07070;font-weight:700;font-size:14px}.topbar .sc{color:#ef4444;font-weight:800;font-size:14px}.bar{height:6px;background:#301818;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#ef4444,#fbbf24);border-radius:10px;transition:width .4s}.question{background:#221010;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #ef4444}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#301818;border:2px solid #301818;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.1)}.opt .letter{color:#ef4444;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#221010}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#c07070;font-weight:600;font-size:14px}.done{text-align:center;background:#221010;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#c07070;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#ef4444;color:#fff;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🚨</div><h1>Mandatory Reporting Quiz</h1><p class="sub">Abuse recognition, types & reporting obligations</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"Mandatory reporting requires healthcare professionals to report:",opts:["Only proven abuse","Suspected abuse — certainty is not required","Only physical abuse","Only child abuse"],a:1,tip:"Report SUSPICION, not certainty. Good-faith reporting is legally protected."},
{q:"Which is NOT one of the five types of abuse?",opts:["Physical","Emotional/Verbal","Financial/Economic","Occupational"],a:3,tip:"Five types: Physical, Verbal/Emotional, Psychological, Sexual, Economic."},
{q:"A child presents with bruising on the back and buttocks. The parent's explanation doesn't match. You should:",opts:["Accept the explanation","Report suspected abuse — inconsistent explanations are a red flag","Ask the child to explain privately","Wait for another visit"],a:1,tip:"Suspicious/inconsistent injury explanations are a key sign. Report immediately."},
{q:"Gunshot wounds and stabbings must be reported because they are:",opts:["Medical emergencies only","Criminal acts that require mandatory reporting","Only reported if fatal","At the patient's discretion"],a:1,tip:"Criminal acts: gunshot wounds, stabbings, sexual assault — all mandatory reports."},
{q:"Signs of elder abuse or neglect include:",opts:["Good hygiene","Poor hygiene, malnutrition, unexplained bruising, missed medical appointments","Active social life","Regular medication adherence"],a:1,tip:"Poor hygiene, malnutrition, unexplained injuries, and dental neglect are all red flags."},
{q:"A healthcare worker who reports suspected abuse in good faith is:",opts:["At risk of being sued","Legally protected from lawsuits","Required to prove abuse first","Personally liable if wrong"],a:1,tip:"Good-faith reporters are legally protected. The law requires reporting suspicion, not proof."},
{q:"Communicable diseases that must be reported include:",opts:["Common cold and seasonal flu","TB, HIV, Hepatitis B/C, meningitis, COVID-19","Headaches and back pain","Allergic reactions"],a:1,tip:"TB, HIV, Hep B/C, meningitis, STIs, foodborne illness, COVID-19 — per facility protocol."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=6?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Mandatory reporting is a legal obligation, not a choice. Report suspicion — not proven abuse.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
