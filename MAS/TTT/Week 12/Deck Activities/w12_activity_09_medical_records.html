<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Medical Records & Release</title><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0d1a0f,#112010,#0a150c);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#e6f7ea}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:700;font-size:30px;margin:8px 0 4px}.sub{color:#7aab88;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#7aab88;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:700;font-size:14px}.bar{height:6px;background:#1c3820;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:10px;transition:width .4s}.question{background:#142818;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a3e635}.question p{font-weight:700;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1c3820;border:2px solid #1c3820;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a3e635;font-weight:700;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#142818}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#7aab88;font-weight:600;font-size:14px}.done{text-align:center;background:#142818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:700;font-size:28px;margin:12px 0}.done p{color:#7aab88;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a3e635;color:#0d1a0f;font-weight:700;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📁</div><h1>Medical Records & Release</h1><p class="sub">Ownership, access & release rules</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"Who OWNS the physical medical record?",opts:["The patient","The healthcare facility","The insurance company","The government"],a:1,tip:"The facility owns the physical record. The patient owns the information inside it."},
{q:"Who OWNS the data inside the medical record?",opts:["The facility","The provider","The patient","The insurance company"],a:2,tip:"Patients own their health information and can review, copy, and request corrections."},
{q:"Records can be released WITHOUT a signed release for:",opts:["Family member requests","Court orders (subpoena), criminal acts, communicable diseases, workers comp","Any phone caller","Employer requests"],a:1,tip:"Criminal acts, court orders, communicable diseases, and workers comp are exceptions."},
{q:"A patient requests copies of their records. You should:",opts:["Refuse — records are confidential","Require a signed release form, then provide copies","Give them verbally only","Charge them and refuse if they can't pay"],a:1,tip:"Patients have the RIGHT to copies. Signed release form protects confidentiality."},
{q:"HIPAA requires providers to share patient info with family members:",opts:["Always — families should know everything","Only if the patient has designated them as an authorized representative","Whenever the family asks","Only during emergencies"],a:1,tip:"HIPAA does NOT require sharing with family unless they're designated as authorized."},
{q:"A subpoena duces tecum is:",opts:["A prescription order","A court order requiring medical records as legal evidence","A patient consent form","An insurance authorization"],a:1,tip:"Records ordered by a court as evidence. One of the exceptions to signed release requirements."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=5?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Facility owns the record. Patient owns the data. Written consent required to share — with limited exceptions.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
