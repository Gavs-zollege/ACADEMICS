<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Cultural Competency & Bias</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(160deg,#1a0f20,#241530,#150a1c);font-family:'Manrope',sans-serif;padding:24px 16px;color:#f0e4ff}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#a080c0;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#a080c0;font-weight:700;font-size:14px}.topbar .sc{color:#f472b6;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1840;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#f472b6);border-radius:10px;transition:width .4s}.question{background:#1c1030;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #f472b6}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1840;border:2px solid #2a1840;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#f472b6;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1030}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#a080c0;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1030;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#a080c0;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f472b6;color:#1a0f20;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🌍</div><h1>Cultural Competency & Bias</h1><p class="sub">Equitable care, bias awareness & diversity</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[
{q:"Cultural competency is best described as:",opts:["A one-time training","An ongoing learning process for delivering care to diverse populations","Treating everyone identically","Avoiding cultural topics"],a:1,tip:"It's ongoing — not a destination. Culture influences values, communication, and health decisions."},
{q:"Implicit (unconscious) bias is more dangerous than explicit bias because:",opts:["It's more common","It's harder to recognize and address since it operates below awareness","It's illegal","It only affects certain groups"],a:1,tip:"Unconscious bias is hidden — you may not know you have it. Self-reflection is the first step."},
{q:"Bias in healthcare is limited to race.",opts:["True","False — age, gender, weight, religion, orientation, and disability are all subject to bias","Only in certain states","Only for certain providers"],a:1,tip:"Bias affects ALL groups: race, age, gender identity, weight, religion, sexual orientation, disability."},
{q:"The first step toward providing equitable care is:",opts:["Avoiding all discussions about culture","Confronting your own biases","Treating everyone exactly the same","Following only facility policies"],a:1,tip:"Self-awareness is the foundation. Confront your own biases before you can provide equitable care."},
{q:"Cultural competency considers all of the following EXCEPT:",opts:["Race and ethnicity","Religion and language","Sexual orientation and gender identity","The patient's credit score"],a:3,tip:"Race, ethnicity, sex, age, religion, language, orientation, gender identity, education — not finances."},
{q:"When a patient's cultural beliefs conflict with medical recommendations, the MA should:",opts:["Override the patient's wishes","Respect autonomy — provide information and let the patient decide","Refuse to treat them","Report them to administration"],a:1,tip:"Autonomy: patients decide. Provide complete information without pressure or coercion."},
];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=5?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Every patient deserves equitable, unbiased care regardless of background, identity, or beliefs.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
