<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 12 Flashcards — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #e4e4f0;
    --text-secondary: #9898b0;
    --surface-1: #1c1c2e;
    --surface-2: #282840;
    --border: #363650;
    --bg: #0d0d1a;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.35);
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-display: 'Playfair Display', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: #C0392B; margin-bottom: 6px;
  }
  .header h1 {
    font-family: var(--font-display); font-size: 32px; font-weight: 900;
    letter-spacing: -1px; margin-bottom: 6px; line-height: 1.1;
  }
  .header p { font-size: 13px; color: var(--text-secondary); }
  .flashcard {
    width: 100%; max-width: 500px; min-height: 250px; border-radius: 22px;
    cursor: pointer; padding: 34px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12); transition: all .35s cubic-bezier(.4,0,.2,1);
    user-select: none; position: relative; margin: 0 auto;
  }
  .flashcard .label {
    position: absolute; top: 16px; left: 20px; font-size: 11px;
    font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; opacity: .7;
  }
  .flashcard .hint {
    position: absolute; top: 16px; right: 20px; font-size: 11px; opacity: .5;
  }
  .flashcard h2 {
    margin: 0; font-family: var(--font-display); font-size: 26px;
    font-weight: 900; line-height: 1.2; letter-spacing: -.5px;
  }
  .flashcard .def-text {
    margin: 0; font-size: 15px; line-height: 1.65; color: var(--text-secondary);
  }
  .progress-bar {
    height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 6px; transition: width .3s;
  }
  .pill {
    padding: 8px 16px; border-radius: 24px; font-weight: 700;
    cursor: pointer; font-size: 13px; transition: all .2s; font-family: var(--font-body);
  }
  .pill-primary {
    border: none; color: #fff; padding: 13px 34px; font-size: 15px;
    border-radius: 30px; letter-spacing: .3px;
  }
  .pill-outline {
    background: transparent; border: 2px solid;
  }
  .chip {
    padding: 8px 14px; border-radius: 20px; border: 2px solid;
    font-weight: 600; cursor: pointer; font-size: 13px; transition: all .2s;
    font-family: var(--font-body); white-space: nowrap;
  }
  .flex-center { display: flex; align-items: center; justify-content: center; }
  .text-center { text-align: center; }
  .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
  .mt-20 { margin-top: 20px; } .mt-24 { margin-top: 24px; }
  .mb-6 { margin-bottom: 6px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; } .mb-24 { margin-bottom: 24px; }
  .gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-tag">Medical Assistant Program</div>
    <h1>Week 12 Flashcards</h1>
    <p id="header-subtitle"></p>
  </div>
  <div id="flash-mode"></div>
</div>
<script>
const CATEGORIES = [
  {
    name: "Patient Rights & Healthcare Law", emoji: "⚖️", color: "#C0392B",
    terms: [
      { term: "Patient's Bill of Rights", def: "A set of guarantees developed by the American Hospital Association (AHA) in 1973 and now adopted in various forms by hospitals, medical practices, insurance companies, and governments. It establishes the rights and responsibilities of patients and healthcare providers, including the right to respectful treatment, understandable information, privacy, access to records, and informed decision-making." },
      { term: "Affordable Care Act (ACA)", def: "A federal law signed in 2010 that represents a major healthcare reform effort — expanding access to affordable health insurance, strengthening consumer protections, emphasizing prevention and wellness, and working to reduce the overall cost of healthcare in the United States. Also informally known as 'Obamacare.'" },
      { term: "Health Insurance Portability and Accountability Act (HIPAA)", def: "A federal law enacted in 1996 that gives patients rights over their health information and sets strict rules and limits on who may access or receive protected health information (PHI). HIPAA applies to PHI in all forms — electronic, written, and oral. Covered entities (health plans, clearinghouses, and providers) must comply." },
      { term: "Protected Health Information (PHI)", def: "Any individually identifiable health information held or transmitted by a covered entity — in any format, including electronic, paper, or spoken. Examples include a patient's name combined with their diagnosis, treatment records, billing records, or test results. PHI is protected under HIPAA from unauthorized disclosure." },
      { term: "HITECH Act", def: "The Health Information Technology for Economic and Clinical Health Act, which extends and strengthens HIPAA's enforcement in the digital space. It holds business associates and vendors directly liable for HIPAA compliance, prohibits the sale of PHI, and established a tiered civil and criminal penalty system for violations involving electronic health information." },
      { term: "Emergency Medical Treatment and Active Labor Act (EMTALA)", def: "A federal law enacted in 1986 requiring any hospital emergency department that receives Medicare or Medicaid funding to provide an appropriate medical screening and stabilizing treatment to any patient who presents — regardless of their ability to pay or insurance status. Enacted to eliminate 'patient dumping,' in which facilities refused care based on diagnosis cost or financial status." },
      { term: "Clinical Laboratory Improvement Act (CLIA)", def: "A federal law enacted in 1988 that establishes quality standards for all laboratory testing performed on human specimens — including physician office labs — to ensure accuracy, reliability, and timeliness of results. Administered by the FDA, which determines test complexity categories and certification requirements." },
      { term: "Americans with Disabilities Act (ADA)", def: "A federal law enacted in 1990 that prohibits discrimination against qualified individuals with disabilities in employment, public accommodations, and services. Requires employers to provide 'reasonable accommodations' to enable employees with disabilities to perform their job successfully, unless doing so would impose undue hardship." },
      { term: "No Surprises Act (NSA)", def: "A federal law protecting patients who have group health plan or individual insurance coverage from unexpected out-of-network medical bills — particularly for emergency services from out-of-network providers or facilities. Bans surprise bills when the patient had no opportunity to choose an in-network provider in advance." },
      { term: "Genetic Information Nondiscrimination Act (GINA)", def: "A federal law enacted in 2008 that prohibits discrimination based on genetic information in the context of health insurance and employment. Protects individuals from being denied coverage or jobs based on genetic test results or family medical history." },
      { term: "Good Samaritan Act", def: "State laws that protect bystanders who provide reasonable emergency assistance to an injured or ill person from civil liability — even if their actions inadvertently contribute to further injury or death. Designed to encourage people to help in emergencies without fear of lawsuits." },
    ],
  },
  {
    name: "Privacy, Confidentiality & Medical Records", emoji: "🔒", color: "#2471A3",
    terms: [
      { term: "Administrative Safeguards (HIPAA)", def: "Written policies, procedures, and training programs that document how a covered entity complies with HIPAA privacy and security requirements. The foundation of a HIPAA compliance program — must be documented in writing and regularly reviewed and updated." },
      { term: "Physical Safeguards (HIPAA)", def: "Controls over the physical environment where protected health information is stored or accessed — including locked file rooms, controlled access to workstations, screen positioning to prevent unauthorized viewing, visitor sign-in logs, and secure disposal of paper records." },
      { term: "Technical Safeguards (HIPAA)", def: "Digital security measures used to protect electronic PHI — including password-protected systems, data encryption, user access controls, automatic log-out on idle workstations, audit logs that track who accessed patient information and when." },
      { term: "Medical Record Ownership", def: "The legal distinction between who owns the physical medical record versus who owns the information within it. The healthcare facility or provider owns the medical record as a legal document — it must remain with the facility. However, the patient owns their health data and has the right to inspect, copy, and request corrections to their information." },
      { term: "Release of Information (ROI)", def: "The process by which a patient's medical records are shared with another party. Requires a signed authorization form from the patient in most circumstances. Exceptions exist for court orders, criminal investigations, communicable disease reporting, and workers' compensation mandated examinations." },
      { term: "Subpoena Duces Tecum", def: "A legal court order requiring a person to appear in court and bring specific documents — such as medical records — as evidence. When a medical record is legally ordered through this process, the record may be released without the patient's written authorization." },
      { term: "Breach of Confidentiality", def: "The unauthorized disclosure of protected health information to a party who does not have a legal right to access it. May result in HIPAA penalties, civil liability, and damage to the patient-provider relationship. Both intentional and unintentional disclosures can constitute a breach." },
      { term: "Covered Entity", def: "An organization or individual required to comply with HIPAA regulations — specifically health insurance companies (health plans), healthcare clearinghouses, and healthcare providers who transmit health information electronically. Employers who maintain employee health records are generally not considered covered entities under HIPAA." },
    ],
  },
  {
    name: "Consent", emoji: "✍️", color: "#7D3C98",
    terms: [
      { term: "Consent", def: "A patient's voluntary, informed agreement to receive a proposed medical examination, treatment, or procedure. Valid consent must be free of force or fraud, given by a person with sufficient mental capacity, and based on adequate information about what is being agreed to." },
      { term: "Implied Consent", def: "Consent inferred from a patient's actions, conduct, or circumstances rather than explicit verbal or written communication. Example: a patient opens their mouth when the MA asks about taking a temperature. Implied consent also applies in emergencies — the law assumes a reasonable person would consent to life-saving treatment if they were conscious and able to." },
      { term: "Expressed Consent", def: "Consent given directly through spoken words or a written document. Example: a patient verbally agrees to receive an injection and specifies which arm. Expressed consent is the most common form used in routine clinical practice." },
      { term: "Informed Consent", def: "The most legally significant type of consent — a clear, voluntary agreement made by a competent adult after the provider has fully disclosed the nature of the procedure, all risks and benefits, expected outcomes, available alternatives, and the consequences of refusing treatment. Failure to obtain informed consent may constitute medical negligence. Signed informed consent documents are legally required before non-emergency procedures." },
      { term: "Patient Autonomy", def: "The right of a competent adult patient to make their own healthcare decisions — including the right to refuse treatment — free from coercion, pressure, or undue influence. Healthcare providers are obligated to respect patient autonomy even when they disagree with the patient's choice." },
      { term: "Competency (Consent Context)", def: "The legal and cognitive capacity of a patient to understand and make their own healthcare decisions. A competent adult must be oriented to time and place, able to understand the information provided, and capable of communicating a decision. Competency may be affected by mental illness, intoxication, severe pain, or altered consciousness." },
      { term: "Emancipated Minor", def: "A person under the age of 18 who has been granted legal adult status by a court — enabling them to make their own medical, financial, and housing decisions without parental consent. Courts grant emancipated status on the basis of military enlistment, financial self-sufficiency, independent living, or legal marriage." },
    ],
  },
  {
    name: "Advance Directives", emoji: "📜", color: "#C2185B",
    terms: [
      { term: "Advance Directive", def: "A legal document in which a person records their healthcare wishes and/or designates a representative to make decisions on their behalf — to be used when they are no longer able to communicate or make decisions independently. Advance directives are legally valid throughout the United States and do not expire until officially revoked or changed by the patient." },
      { term: "Living Will", def: "A type of advance directive in which the patient specifies in writing which medical treatments they want and which they do not want — and under what conditions those decisions apply. Common decisions addressed include CPR, mechanical ventilation, dialysis, artificial nutrition and hydration, organ donation, and pain management." },
      { term: "Durable Power of Attorney for Healthcare (DPOA)", def: "A legal document that designates a healthcare agent or proxy — a trusted person — to make medical decisions on the patient's behalf when they are unable to do so. More flexible than a living will; the agent can make decisions not specifically addressed in the document, including hospital admissions, treatment choices, record access, and post-death arrangements." },
      { term: "Healthcare Agent (Healthcare Proxy)", def: "The individual designated in a durable power of attorney for healthcare to make medical decisions on behalf of the patient when the patient is incapacitated. The agent is expected to make the decisions the patient would have made, not the decisions the agent would personally prefer. Must communicate with the same authority as the patient regarding treatment acceptance or refusal." },
      { term: "Do-Not-Resuscitate Order (DNR)", def: "A legal medical order instructing healthcare providers not to perform CPR or advanced cardiac life support (ACLS) if the patient's heart stops or they stop breathing. A DNR does not affect any other treatment — the patient can continue to receive chemotherapy, antibiotics, dialysis, pain management, or any other ongoing care." },
      { term: "POLST (Physician Orders for Life-Sustaining Treatment)", def: "A set of actionable medical orders — not simply a patient preference document — that translates a patient's advance care wishes into immediate clinical orders. POLST forms travel with the patient across care settings (home, hospital, nursing facility) and can be acted on by any healthcare provider. Typically used for patients with serious illness or advanced age." },
    ],
  },
  {
    name: "Law Types, Torts & Malpractice", emoji: "⚖️", color: "#D68910",
    terms: [
      { term: "Criminal Law", def: "The body of law concerned with offenses against society — violations of state or federal criminal statutes or codes. Remedies include monetary fines, imprisonment, and in severe cases, capital punishment. Healthcare professionals may face criminal prosecution for practicing without a license, falsifying credentials, or performing procedures without consent." },
      { term: "Misdemeanor", def: "A lesser criminal offense typically punishable by monetary fines and/or imprisonment of one year or less. In healthcare, misdemeanors might include minor violations of licensure or documentation rules." },
      { term: "Felony", def: "A serious criminal offense punishable by fines and/or imprisonment for more than one year. For healthcare professionals, a felony conviction may also result in permanent revocation of their professional license. Examples include fraud, practicing medicine without a license, or battery." },
      { term: "Civil Law", def: "The body of law that protects the private rights of individuals — including contracts, property, privacy, labor, and family matters. A person harmed by a civil wrong (tort) may sue the responsible party for monetary damages. Civil law penalties are almost exclusively financial." },
      { term: "Tort", def: "A wrongful act that causes harm to another person but is not a criminal offense — it is a civil wrong. Torts may be intentional (deliberately harmful) or unintentional (negligent). Healthcare professionals are most commonly involved in unintentional torts, or negligence." },
      { term: "Intentional Tort", def: "A deliberate act that violates the legal rights of another person. Healthcare examples include assault (threatening a patient), battery (performing a procedure without consent), defamation of character (making false damaging statements), and invasion of privacy (unauthorized disclosure of patient information)." },
      { term: "Negligence", def: "An unintentional tort in which a person fails to act with the level of care that a reasonable person would have exercised under similar circumstances — resulting in harm to another. In healthcare, negligence does not require intent to harm; it is the result of failing to meet the expected standard of care." },
      { term: "Malpractice", def: "A form of negligence committed by a licensed professional — in healthcare, this means a provider caused patient injury through improper diagnosis, treatment, or postoperative care, or through a breach of patient confidentiality. Malpractice requires proof that a standard of care was breached and that the breach directly caused measurable harm." },
      { term: "Standard of Care", def: "The level and type of care that a reasonably competent healthcare professional with equivalent training and experience would provide under the same or similar circumstances. The central question in any malpractice case: 'Would a similarly qualified provider have done the same thing under the same conditions?'" },
      { term: "Four Ds of Negligence", def: "The four elements that must all be proven for a successful negligence (malpractice) claim: (1) Duty of Care — a legal obligation existed; (2) Dereliction — the provider failed to meet that duty; (3) Direct Cause — the breach directly caused the harm; (4) Damages — the patient suffered measurable harm that can be compensated financially. All four must be present." },
      { term: "Battery (Healthcare Context)", def: "An intentional tort — and potentially a criminal offense — that occurs when a healthcare provider makes unconsented physical contact with a patient. Performing any procedure without the patient's consent, even if the procedure itself is clinically appropriate, may constitute battery." },
      { term: "Assault (Healthcare Context)", def: "An intentional tort in which a person is threatened or placed in fear of immediate unconsented physical contact — even if no actual contact occurs. In healthcare, verbally threatening a patient with a procedure they have not agreed to may constitute assault." },
    ],
  },
  {
    name: "Mandatory Reporting & Abuse", emoji: "📢", color: "#148F77",
    terms: [
      { term: "Mandatory Reporting", def: "A legal obligation requiring specific professionals — including healthcare providers — to report defined events or conditions to appropriate authorities, regardless of patient consent. Mandatory reporting is designed to protect patients, vulnerable populations, and the general public. Failure to report when required is itself a legal violation." },
      { term: "Notifiable Disease", def: "A disease or condition that healthcare providers are legally required to report to local, state, or federal health authorities when diagnosed. The CDC maintains a national list of more than 120 notifiable diseases, including tuberculosis, HIV/AIDS, meningitis, sexually transmitted infections, COVID-19, E. coli, and foodborne illness. Timely reporting supports outbreak detection and public health response." },
      { term: "Mandated Reporter", def: "A person who is legally required by state law to report suspected abuse or neglect to the appropriate authorities. In healthcare, mandated reporters typically include physicians, nurses, nurse practitioners, physician assistants, dentists, and medical assistants. Mandated reporters are legally protected from civil liability when they report in good faith." },
      { term: "Child Abuse", def: "Physical, emotional, psychological, or sexual maltreatment or neglect of a person under the age of 18. Every state has mandatory reporting laws requiring healthcare professionals to report suspected child abuse — not just confirmed abuse. Signs include unexplained injuries, inconsistent explanations, repeated emergency visits, poor hygiene, and developmental delays." },
      { term: "Elder Abuse", def: "The mistreatment or neglect of an older adult — typically defined as age 60 or 65 and older, depending on state law. May be physical, emotional, psychological, sexual, or financial in nature. All states have mandatory reporting requirements for elder abuse; healthcare professionals are commonly named as required reporters." },
      { term: "Intimate Partner Violence (IPV)", def: "A pattern of behavior in which one partner uses physical, sexual, emotional, or economic abuse to control the other. Many states require or encourage healthcare providers to screen for and report intimate partner violence. Covers all genders and all types of intimate relationships." },
      { term: "Good Faith Reporting", def: "The legal protection extended to mandated reporters who report suspected abuse in good faith — meaning they had reasonable suspicion based on their observations, not malicious intent. A good-faith report made without proof of abuse will not result in civil or criminal liability for the reporter, even if the report is ultimately unsubstantiated." },
    ],
  },
  {
    name: "Ethics & Professional Codes", emoji: "🧭", color: "#1A5276",
    terms: [
      { term: "Ethics", def: "The principles, rules, and moral standards that govern a person's or group's behavior — defining what is right and wrong, what is appropriate conduct, and what obligations are owed to others. In healthcare, ethics guide clinical decisions, professional interactions, and organizational policies." },
      { term: "Medical Ethics", def: "A branch of ethics specifically focused on the moral principles and obligations of healthcare professionals in their care of patients. Uses moral analysis alongside clinical facts to determine the ethically appropriate course of action in complex patient care situations." },
      { term: "Autonomy (Ethics)", def: "The principle that competent patients have the right to make their own healthcare decisions — free from coercion, pressure, or manipulation. Healthcare providers must ensure patients have complete and understandable information to make informed choices, then respect those choices even when they disagree." },
      { term: "Justice (Ethics)", def: "The ethical principle that healthcare decisions should be consistent and fair — that patients in similar situations should have access to the same care and that limited resources should be distributed equitably. Requires consideration of fair distribution, competing needs, individual rights, and existing legislation." },
      { term: "Beneficence", def: "The ethical principle of actively doing good — acting in the patient's best interest. In clinical practice, this means considering the patient's pain, mental and physical suffering, risk of disability, and quality of life when making treatment decisions. What is 'best' should reflect the patient's own values, not solely the provider's judgment." },
      { term: "Nonmaleficence", def: "The ethical principle of 'first, do no harm' — the obligation to avoid causing unnecessary pain, injury, or suffering to a patient. Because most treatments carry some risk or adverse effects, nonmaleficence requires careful weighing of potential benefits against potential harm." },
      { term: "Personal Ethics", def: "An individual's own moral beliefs about right and wrong — shaped by family upbringing, life experience, culture, religion, and education. Personal ethics influence a person's behavior in all areas of life, including the workplace, and may change over time as experiences and perspectives evolve." },
      { term: "Professional Ethics", def: "The standards of conduct and moral obligations specific to a profession — established through education, training, certification codes, organizational policies, and legal requirements. Professional ethics govern how MAs should act toward patients, employers, and colleagues. Examples include certification codes of conduct and employee handbooks." },
    ],
  },
  {
    name: "Cultural Competency & Bias", emoji: "🌍", color: "#CA6F1E",
    terms: [
      { term: "Cultural Competence", def: "The ability of a healthcare provider or organization to effectively deliver services that meet the social, cultural, and linguistic needs of a diverse patient population. Cultural competence is an ongoing, active learning process — not a one-time training — and requires self-awareness, knowledge, and practical skills for interacting with patients from backgrounds different from one's own." },
      { term: "Culture", def: "The shared beliefs, values, practices, norms, language, and worldview of a group or community — often learned and passed down across generations. Culture shapes how patients understand illness, make health decisions, communicate with providers, and relate to the healthcare system. It includes race, ethnicity, national origin, religion, language, gender, and many other shared identities." },
      { term: "Explicit Bias (Conscious Bias)", def: "A known prejudice or preference that a person is aware they hold — a deliberate attitude toward a particular group. Explicit bias is easier to address than implicit bias because the person can recognize and examine it. In healthcare, explicit bias can directly affect the quality of care a patient receives." },
      { term: "Implicit Bias (Unconscious Bias)", def: "A hidden preference, attitude, or stereotype that operates below conscious awareness — influencing judgments and behavior without the person realizing it. Often more dangerous in healthcare than explicit bias because the provider does not recognize that their behavior is being shaped by it. Regular self-reflection and ongoing training are essential to identifying and reducing implicit bias." },
      { term: "Health Disparities", def: "Preventable differences in health outcomes and access to care experienced by socially disadvantaged groups — including differences based on race, ethnicity, income, education, gender, disability, geographic location, or sexual orientation. Bias in healthcare — both explicit and implicit — contributes to health disparities." },
      { term: "Diversity", def: "The range of human differences within a population or group — including race, ethnicity, national origin, age, sex, gender identity, sexual orientation, religion, language, education, disability, and socioeconomic status. Providing equitable care to a diverse patient population requires awareness of and respect for these differences." },
      { term: "Implied", def: "Inferred from actions or circumstances" },
      { term: "Expressed", def: "Spoken or written words" },
      { term: "Informed", def: "Voluntary agreement after full disclosure" },
      { term: "Autonomy", def: "Patients have the right to make their own healthcare decisions — free of pressure, coercion, or manipulation" },
      { term: "Justice", def: "Healthcare decisions must be consistent and fair; similar patients deserve equal access to the same quality of care" },
      { term: "Beneficence", def: "Act in the patient's best interest — 'do the most good'; weigh treatment benefits against the patient's pain, suffering, and quality of life" },
      { term: "Nonmaleficence", def: "First, do no harm — avoid causing unnecessary injury, pain, or suffering; carefully weigh risk against benefit" },
    ],
  },
];
const ALL_TERMS = CATEGORIES.flatMap((cat, ci) =>
  cat.terms.map(t => ({ ...t, category: cat.name, emoji: cat.emoji, color: cat.color, catIndex: ci }))
);
let flashDeck = [];
let flashIdx = 0;
let flashFlipped = false;
let flashKnown = 0;
let flashLearning = 0;
let flashDone = false;
let flashSelectedCats = new Set(CATEGORIES.map((_, i) => i));
let flashStarted = false;
document.getElementById('header-subtitle').textContent =
  `Law & Ethics in Healthcare \u00b7 ${ALL_TERMS.length} terms across ${CATEGORIES.length} topics`;
renderFlash();
function startFlashDeck() {
  const terms = CATEGORIES.flatMap((cat, ci) =>
    flashSelectedCats.has(ci) ? cat.terms.map(t => ({ ...t, color: cat.color, emoji: cat.emoji, category: cat.name })) : []
  );
  flashDeck = shuffle([...terms]);
  flashIdx = 0; flashFlipped = false; flashKnown = 0; flashLearning = 0; flashDone = false; flashStarted = true;
  renderFlash();
}
function flashToggleCat(i) {
  if (flashSelectedCats.has(i)) {
    if (flashSelectedCats.size > 1) flashSelectedCats.delete(i);
  } else { flashSelectedCats.add(i); }
  renderFlash();
}
function flashMark(isKnown) {
  if (isKnown) flashKnown++; else flashLearning++;
  if (flashIdx + 1 >= flashDeck.length) { flashDone = true; renderFlash(); return; }
  flashIdx++; flashFlipped = false; renderFlash();
}
function renderFlash() {
  const el = document.getElementById('flash-mode');
  if (!flashStarted || flashDeck.length === 0) {
    let html = `<div class="text-center" style="padding:40px 0">
      <p style="font-size:18px;margin-bottom:20px;color:var(--text)">Select categories and start studying!</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px">`;
    CATEGORIES.forEach((c, i) => {
      const sel = flashSelectedCats.has(i);
      html += `<button class="chip" onclick="flashToggleCat(${i})"
        style="border-color:${c.color};background:${sel ? c.color : 'transparent'};color:${sel ? '#fff' : c.color}">
        ${c.emoji} ${escHtml(c.name)}</button>`;
    });
    html += `</div>
      <button class="pill-primary" style="background:#E74C3C" onclick="startFlashDeck()">Shuffle & Start \u2192</button>
    </div>`;
    el.innerHTML = html; return;
  }
  if (flashDone) {
    const total = flashKnown + flashLearning;
    const pct = Math.round((flashKnown / total) * 100);
    const emoji = pct >= 80 ? '\ud83c\udf89' : pct >= 50 ? '\ud83d\udcaa' : '\ud83d\udcd6';
    el.innerHTML = `
      <div class="text-center" style="padding:40px 0">
        <div style="font-size:48px;margin-bottom:12px">${emoji}</div>
        <h3 style="margin:0 0 8px">Round Complete!</h3>
        <p style="color:var(--text-secondary);font-size:15px;margin:0 0 24px">
          ${flashKnown} knew it \u00b7 ${flashLearning} still learning \u00b7 ${pct}% mastery
        </p>
        <div style="width:100%;max-width:300px;height:10px;border-radius:10px;background:var(--surface-2);margin:0 auto 24px;overflow:hidden">
          <div style="width:${pct}%;height:100%;border-radius:10px;background:linear-gradient(90deg,#27AE60,#2ECC71);transition:width .6s"></div>
        </div>
        <button class="pill-primary" style="background:#3498DB" onclick="flashDeck=[];flashStarted=false;flashDone=false;renderFlash()">New Round</button>
      </div>`;
    return;
  }
  const card = flashDeck[flashIdx];
  const pctProgress = ((flashIdx / flashDeck.length) * 100);
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;padding:12px 0">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;width:100%">
        <span style="font-size:13px;color:var(--text-secondary);font-weight:600">${flashIdx + 1}/${flashDeck.length}</span>
        <div class="progress-bar" style="flex:1"><div class="fill" style="width:${pctProgress}%;background:${card.color}"></div></div>
        <span style="font-size:12px;color:var(--text-secondary)">\u2713${flashKnown} \u2717${flashLearning}</span>
      </div>
      <div class="flashcard" onclick="flashFlipped=!flashFlipped;renderFlash();"
           style="background:${flashFlipped ? 'var(--surface-1)' : card.color};color:${flashFlipped ? 'var(--text)' : '#fff'}">
        <span class="label">${flashFlipped ? 'Definition' : card.emoji + ' ' + escHtml(card.category)}</span>
        <span class="hint">${flashFlipped ? '' : 'tap to flip'}</span>
        ${!flashFlipped
          ? `<h2>${escHtml(card.term)}</h2>`
          : `<p class="def-text">${escHtml(card.def)}</p>`
        }
      </div>
      ${flashFlipped ? `
        <div style="display:flex;gap:12px;margin-top:20px">
          <button class="pill pill-outline" style="border-color:#E74C3C;color:#E74C3C;padding:12px 28px;font-size:14px" onclick="flashMark(false)">Still Learning</button>
          <button class="pill-primary" style="background:#27AE60;padding:12px 28px;font-size:14px" onclick="flashMark(true)">Got It! \u2713</button>
        </div>` : ''}
    </div>`;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
