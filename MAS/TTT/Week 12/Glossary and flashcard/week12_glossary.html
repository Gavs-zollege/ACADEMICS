<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 12 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}.search-wrap input:focus{border-color:var(--red)}.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}.cat-btn:hover{opacity:.85}.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}.item:last-child{border-bottom:none}.item:hover{background:var(--surface2)}.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}.item-left{display:flex;align-items:center;gap:10px}.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}.item.open .item-bar{opacity:1}.item-term{font-size:20px;font-weight:700;color:#fff}.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}.item.open .item-def{display:block}.item.open .item-term{color:var(--red-light)}.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}.pg-btn:disabled{opacity:.3;cursor:default}.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}.pg-dot.active{background:var(--red-light);transform:scale(1.3)}.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 12 Glossary</h1>
  <p class="sub">Law & Ethics in Healthcare</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Patient Rights",color:"#E05555",terms:[
    {term:"Patient's Bill of Rights",def:"A set of guarantees developed by the American Hospital Association (AHA) in 1973 and now adopted in various forms by hospitals."},
    {term:"Affordable Care Act (ACA)",def:"A federal law signed in 2010 that represents a major healthcare reform effort — expanding access to affordable health insurance."},
    {term:"Health Insurance Portability and Accountability Act (HIPAA)",def:"A federal law enacted in 1996 that gives patients rights over their health information and sets strict rules and limits on who ..."},
    {term:"Protected Health Information (PHI)",def:"Any individually identifiable health information held or transmitted by a covered entity — in any format, including electronic."},
    {term:"HITECH Act",def:"The Health Information Technology for Economic and Clinical Health Act."},
    {term:"Emergency Medical Treatment and Active Labor Act (EMTALA)",def:"A federal law enacted in 1986 requiring any hospital emergency department that receives Medicare or Medicaid funding to provide..."},
    {term:"Clinical Laboratory Improvement Act (CLIA)",def:"A federal law enacted in 1988 that establishes quality standards for all laboratory testing performed on human specimens — incl..."},
    {term:"Americans with Disabilities Act (ADA)",def:"A federal law enacted in 1990 that prohibits discrimination against qualified individuals with disabilities in employment."},
    {term:"No Surprises Act (NSA)",def:"A federal law protecting patients who have group health plan or individual insurance coverage from unexpected out-of-network me..."},
    {term:"Genetic Information Nondiscrimination Act (GINA)",def:"A federal law enacted in 2008 that prohibits discrimination based on genetic information in the context of health insurance and..."},
    {term:"Good Samaritan Act",def:"State laws that protect bystanders who provide reasonable emergency assistance to an injured or ill person from civil liability..."}
  ]},
  {name:"Privacy & Records",color:"#6B7B8D",terms:[
    {term:"Administrative Safeguards (HIPAA)",def:"Written policies, procedures, and training programs that document how a covered entity complies with HIPAA privacy and security..."},
    {term:"Physical Safeguards (HIPAA)",def:"Controls over the physical environment where protected health information is stored or accessed — including locked file rooms."},
    {term:"Technical Safeguards (HIPAA)",def:"Digital security measures used to protect electronic PHI — including password-protected systems, data encryption."},
    {term:"Medical Record Ownership",def:"The legal distinction between who owns the physical medical record versus who owns the information within it."},
    {term:"Release of Information (ROI)",def:"The process by which a patient's medical records are shared with another party."},
    {term:"Subpoena Duces Tecum",def:"A legal court order requiring a person to appear in court and bring specific documents — such as medical records — as evidence."},
    {term:"Breach of Confidentiality",def:"The unauthorized disclosure of protected health information to a party who does not have a legal right to access it."},
    {term:"Covered Entity",def:"An organization or individual required to comply with HIPAA regulations — specifically health insurance companies (health plans)."}
  ]},
  {name:"Consent",color:"#8B6AAE",terms:[
    {term:"Consent",def:"A patient's voluntary, informed agreement to receive a proposed medical examination, treatment, or procedure."},
    {term:"Implied Consent",def:"Consent inferred from a patient's actions, conduct, or circumstances rather than explicit verbal or written communication."},
    {term:"Expressed Consent",def:"Consent given directly through spoken words or a written document."},
    {term:"Informed Consent",def:"The most legally significant type of consent — a clear."},
    {term:"Patient Autonomy",def:"The right of a competent adult patient to make their own healthcare decisions — including the right to refuse treatment — free ..."},
    {term:"Competency (Consent Context)",def:"The legal and cognitive capacity of a patient to understand and make their own healthcare decisions."},
    {term:"Emancipated Minor",def:"A person under the age of 18 who has been granted legal adult status by a court — enabling them to make their own medical."}
  ]},
  {name:"Advance Directives",color:"#E74C6F",terms:[
    {term:"Advance Directive",def:"A legal document in which a person records their healthcare wishes and/or designates a representative to make decisions on thei..."},
    {term:"Living Will",def:"A type of advance directive in which the patient specifies in writing which medical treatments they want and which they do not ..."},
    {term:"Durable Power of Attorney for Healthcare (DPOA)",def:"A legal document that designates a healthcare agent or proxy — a trusted person — to make medical decisions on the patient's be..."},
    {term:"Healthcare Agent (Healthcare Proxy)",def:"The individual designated in a durable power of attorney for healthcare to make medical decisions on behalf of the patient when..."},
    {term:"Do-Not-Resuscitate Order (DNR)",def:"A legal medical order instructing healthcare providers not to perform CPR or advanced cardiac life support (ACLS) if the patien..."},
    {term:"POLST (Physician Orders for Life-Sustaining Treatment)",def:"A set of actionable medical orders — not simply a patient preference document — that translates a patient's advance care wishes..."}
  ]},
  {name:"Law & Malpractice",color:"#4A90B8",terms:[
    {term:"Criminal Law",def:"The body of law concerned with offenses against society — violations of state or federal criminal statutes or codes."},
    {term:"Misdemeanor",def:"A lesser criminal offense typically punishable by monetary fines and/or imprisonment of one year or less."},
    {term:"Felony",def:"A serious criminal offense punishable by fines and/or imprisonment for more than one year."},
    {term:"Civil Law",def:"The body of law that protects the private rights of individuals — including contracts, property, privacy, labor."},
    {term:"Tort",def:"A wrongful act that causes harm to another person but is not a criminal offense — it is a civil wrong."},
    {term:"Intentional Tort",def:"A deliberate act that violates the legal rights of another person."},
    {term:"Negligence",def:"An unintentional tort in which a person fails to act with the level of care that a reasonable person would have exercised under..."},
    {term:"Malpractice",def:"A form of negligence committed by a licensed professional — in healthcare."},
    {term:"Standard of Care",def:"The level and type of care that a reasonably competent healthcare professional with equivalent training and experience would pr..."},
    {term:"Four Ds of Negligence",def:"The four elements that must all be proven for a successful negligence (malpractice) claim: (1) Duty of Care — a legal obligatio..."},
    {term:"Battery (Healthcare Context)",def:"An intentional tort — and potentially a criminal offense — that occurs when a healthcare provider makes unconsented physical co..."},
    {term:"Assault (Healthcare Context)",def:"An intentional tort in which a person is threatened or placed in fear of immediate unconsented physical contact — even if no ac..."}
  ]},
  {name:"Reporting & Abuse",color:"#1A8A7D",terms:[
    {term:"Mandatory Reporting",def:"A legal obligation requiring specific professionals — including healthcare providers — to report defined events or conditions t..."},
    {term:"Notifiable Disease",def:"A disease or condition that healthcare providers are legally required to report to local, state."},
    {term:"Mandated Reporter",def:"A person who is legally required by state law to report suspected abuse or neglect to the appropriate authorities."},
    {term:"Child Abuse",def:"Physical, emotional, psychological, or sexual maltreatment or neglect of a person under the age of 18."},
    {term:"Elder Abuse",def:"The mistreatment or neglect of an older adult — typically defined as age 60 or 65 and older, depending on state law."},
    {term:"Intimate Partner Violence (IPV)",def:"A pattern of behavior in which one partner uses physical, sexual, emotional, or economic abuse to control the other."},
    {term:"Good Faith Reporting",def:"The legal protection extended to mandated reporters who report suspected abuse in good faith — meaning they had reasonable susp..."}
  ]},
  {name:"Ethics & Codes",color:"#E2B94C",terms:[
    {term:"Ethics",def:"The principles, rules, and moral standards that govern a person's or group's behavior — defining what is right and wrong."},
    {term:"Medical Ethics",def:"A branch of ethics specifically focused on the moral principles and obligations of healthcare professionals in their care of pa..."},
    {term:"Autonomy (Ethics)",def:"The principle that competent patients have the right to make their own healthcare decisions — free from coercion, pressure."},
    {term:"Justice (Ethics)",def:"The ethical principle that healthcare decisions should be consistent and fair — that patients in similar situations should have..."},
    {term:"Beneficence",def:"The ethical principle of actively doing good — acting in the patient's best interest."},
    {term:"Nonmaleficence",def:"The ethical principle of 'first, do no harm' — the obligation to avoid causing unnecessary pain, injury."},
    {term:"Personal Ethics",def:"An individual's own moral beliefs about right and wrong — shaped by family upbringing, life experience, culture, religion."},
    {term:"Professional Ethics",def:"The standards of conduct and moral obligations specific to a profession — established through education, training."}
  ]},
  {name:"Cultural Competency",color:"#4CAF90",terms:[
    {term:"Cultural Competence",def:"The ability of a healthcare provider or organization to effectively deliver services that meet the social, cultural."},
    {term:"Culture",def:"The shared beliefs, values, practices, norms, language."},
    {term:"Explicit Bias (Conscious Bias)",def:"A known prejudice or preference that a person is aware they hold — a deliberate attitude toward a particular group."},
    {term:"Implicit Bias (Unconscious Bias)",def:"A hidden preference, attitude, or stereotype that operates below conscious awareness — influencing judgments and behavior witho..."},
    {term:"Health Disparities",def:"Preventable differences in health outcomes and access to care experienced by socially disadvantaged groups — including differen..."},
    {term:"Diversity",def:"The range of human differences within a population or group — including race, ethnicity, national origin, age, sex."}
  ]}
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
