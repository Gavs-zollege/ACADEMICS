<script>
const S=[{"id":0,"type":"title","title":"Doing the Right Thing:\\nLaw & Ethics in Healthcare","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Twelve","tags":["Patient Rights","HIPAA","Consent","Directives","Ethics","Cultural Competency"],"fs":28},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Identify legal and regulatory requirements","Identify patient consent as needed","Identify professional codes of ethics","Describe and differentiate medical directives","Describe patient privacy and confidentiality, including medical records","Identify legal requirements regarding reportable violations or incidents","Identify personal or religious beliefs and values and provide unbiased care"]},{"id":2,"type":"twocol","title":"Patient's Bill of Rights & Key Laws","lt":"Patient's Bill of Rights (AHA)","lc":"var(--accent)","li":[{"l":"Fair treatment","d":"Dignity regardless of background, diagnosis, or ability to pay."},{"l":"Understandable info","d":"Clear explanations of diagnosis, treatment plan, and prognosis."},{"l":"Informed decisions","d":"Ask about procedures, risks, alternatives — may refuse treatment."},{"l":"Privacy","d":"Exams, case discussions, and records are private."},{"l":"Access to records","d":"Right to review and receive copies of medical and billing records."}],"rt":"Key Healthcare Laws","rc":"var(--blue)","ri":[{"l":"HIPAA (1996)","d":"Protects PHI — electronic, written, oral. Written consent to share."},{"l":"HITECH Act","d":"Expands HIPAA for e-data. Business associates directly liable."},{"l":"ACA","d":"Expanded affordable insurance, consumer protections, prevention focus."},{"l":"EMTALA (1986)","d":"ERs must screen/stabilize any patient regardless of ability to pay."},{"l":"ADA (1990)","d":"Prohibits discrimination; reasonable accommodations required."},{"l":"CLIA (1988)","d":"Regulates all labs for accuracy, safety, and timeliness."}]},{"id":3,"type":"twocol","title":"HIPAA, Privacy & Medical Records","lt":"HIPAA's Three Safeguards","lc":"var(--warm)","li":[{"l":"Administrative","d":"Written policies documenting how facility complies with HIPAA."},{"l":"Physical","d":"Controls over who physically accesses areas with PHI."},{"l":"Technical","d":"Digital security — passwords, encryption, access logs, auto log-out."},{"l":"Who owns the record","d":"Facility owns physical record. Patient owns their information."},{"l":"Patient rights","d":"Inspect, review, receive copies, request corrections."}],"rt":"When Records Released Without Consent","rc":"var(--blue)","ri":[{"l":"Criminal acts","d":"Abuse, stabbings, gunshots, sexual assault."},{"l":"Court order","d":"Subpoena duces tecum — records as legal evidence."},{"l":"Communicable diseases","d":"CDC or local health departments may require disclosure."},{"l":"Workers' comp","d":"Employer insurance mandated examinations."},{"l":"Standard process","d":"Signed release form required. Limits sharing to authorized providers."}]},{"id":4,"type":"tab","title":"Consent Types & Advance Directives","tk":"0","tabs":[{"n":"Consent Types","c":"#4A90D9","items":[{"l":"Implied","d":"Inferred from actions (opening mouth). Also applies in emergencies when unconscious."},{"l":"Expressed","d":"Verbal or written agreement. Most common day-to-day consent."},{"l":"Informed","d":"Detailed voluntary agreement after risks, outcomes, and alternatives explained. Competent adult required."},{"l":"Minors","d":"Parent/guardian consents. Exceptions: birth control, pregnancy, STI treatment, substance abuse."},{"l":"Emancipated minor","d":"Military, financially self-supporting, independent living, or married. Makes own decisions."}]},{"n":"Advance Directives","c":"#3DAE8E","items":[{"l":"Living Will","d":"Specifies which treatments the patient wants (CPR, ventilator, dialysis, organ donation)."},{"l":"DPOA","d":"Names healthcare agent to make decisions when patient cannot."},{"l":"DNR Order","d":"Withhold CPR and advanced cardiac life support. Other treatments continue."},{"l":"POLST","d":"Medical order translating patient wishes into standing clinical orders across care settings."}]}]},{"id":5,"type":"twocol","title":"Criminal vs. Civil Law, Torts & Malpractice","lt":"Criminal Law","lc":"var(--warm)","li":[{"l":"Misdemeanors","d":"Lesser offenses — fines and/or ≤1 year imprisonment."},{"l":"Felonies","d":"Serious — larger fines, >1 year prison. May lose license."},{"l":"Healthcare examples","d":"Practicing without license, falsifying credentials, procedures without consent."}],"rt":"Civil Law & The Four Ds","rc":"var(--blue)","ri":[{"l":"Civil law","d":"Protects private rights — contracts, property, privacy, family."},{"l":"Intentional tort","d":"Deliberate: assault, battery, defamation, invasion of privacy."},{"l":"Negligence","d":"Failure to act reasonably where duty was owed."},{"l":"D1: Duty of Care","d":"A legal obligation existed between provider and patient."},{"l":"D2: Dereliction","d":"Provider failed to meet expected standard of care."},{"l":"D3: Direct Cause","d":"Breach directly caused the patient's harm."},{"l":"D4: Damages","d":"Patient suffered real, measurable, compensable harm."}]},{"id":6,"type":"twocol","title":"Mandatory Reporting & Recognizing Abuse","lt":"What Must Be Reported","lc":"var(--warm)","li":[{"l":"Required reports","d":"Births, deaths, communicable diseases, criminal acts, child/elder abuse, IPV."},{"l":"Five types of abuse","d":"Physical, verbal/emotional, psychological, sexual, economic."},{"l":"Signs in children","d":"Inconsistent explanations, repeated ER visits, bruising on back/buttocks, developmental delays."},{"l":"Signs in older adults","d":"Poor hygiene, malnutrition, unexplained injuries, neglected care."},{"l":"Key rule","d":"Report SUSPECTED abuse — not proven. Good-faith reporting is legally protected."}],"rt":"Ethics & Cultural Competency","rc":"var(--accent)","ri":[{"l":"Autonomy","d":"Patients make own decisions free of pressure."},{"l":"Justice","d":"Fair, consistent, equitable access to care."},{"l":"Beneficence","d":"Act in patient's best interest — 'do the most good.'"},{"l":"Nonmaleficence","d":"'First, do no harm.' Weigh risks against benefits."},{"l":"Cultural competency","d":"Deliver care meeting diverse needs — ongoing learning process."},{"l":"Bias","d":"Explicit (conscious) and implicit (unconscious). Confront your own first."}]},{"id":7,"type":"takeaways","title":"Week Twelve — Key Takeaways","items":["HIPAA gives patients rights over their health information — three safeguards (administrative, physical, technical) must be in place.","The facility owns the record. The patient owns the data and has the right to review, copy, and correct it.","Informed consent requires a competent adult to voluntarily agree after receiving complete information.","Advance directives (living will, DPOA, DNR, POLST) remain valid until officially changed.","The Four Ds of Negligence — Duty, Dereliction, Direct Cause, Damages — must all be proven for malpractice.","Mandatory reporting is a legal obligation — suspected abuse, communicable diseases, criminal acts must be reported.","The four ethics principles — autonomy, justice, beneficence, nonmaleficence — guide every clinical decision.","Cultural competency and confronting bias are ongoing responsibilities — every patient deserves equitable care."]},{"id":8,"type":"quiz","title":"Knowledge Check","questions":[{"q":"Which HIPAA safeguard includes passwords and encryption?","options":["Administrative","Physical","Technical","Procedural"],"correct":2,"explanation":"Technical safeguards include passwords, encryption, access logs, and automatic log-out."},{"q":"A DNR order means:","options":["Stop all treatments","Withhold CPR and advanced cardiac life support only","Discharge the patient","No medications"],"correct":1,"explanation":"DNR withholds CPR and ACLS. Other treatments (chemo, dialysis, antibiotics) continue."},{"q":"All four of which elements must be proven for malpractice?","options":["Duty, Delay, Damage, Death","Duty, Dereliction, Direct Cause, Damages","Diagnosis, Default, Damages, Disposition","Documentation, Duty, Death, Damages"],"correct":1,"explanation":"The Four Ds: Duty, Dereliction of Duty, Direct Cause, and Damages."},{"q":"An emancipated minor can be declared by a court if they are:","options":["Age 16 or older","Married, in the military, or financially independent","Attending college","Employed part-time"],"correct":1,"explanation":"Courts grant emancipation for marriage, military service, financial self-support, or independent living."},{"q":"Mandatory reporting of abuse requires:","options":["Proof of abuse","Suspicion of abuse","A confession from the abuser","Physical evidence only"],"correct":1,"explanation":"Report SUSPECTED abuse — not proven. Good-faith reporting is legally protected."},{"q":"Which ethical principle means 'first, do no harm'?","options":["Autonomy","Justice","Beneficence","Nonmaleficence"],"correct":3,"explanation":"Nonmaleficence = 'first, do no harm.' Providers must weigh risks against benefits."}]},{"id":9,"type":"end","title":"End of Week Twelve","subtitle":"Law & Ethics in Healthcare","message":"Every consent obtained, every record protected, every bias confronted — the legal and ethical foundations of healthcare protect patients and define your professional integrity."}];

function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${s.note?`<div style="font-size:9px;color:var(--textMid);font-style:italic;margin-top:4px">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[8].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[8].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
