<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Law & Ethics in Healthcare</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c14;
    --surface: rgba(255,255,255,0.025);
    --border: rgba(255,255,255,0.07);
    --text: #c4cedf;
    --text-bright: #e2e8f4;
    --text-muted: #6b7a96;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
  }
  .app {
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    flex-shrink: 0;
    text-align: center;
    padding: 16px 24px 12px;
  }
  .header h1 {
    font-size: 26px; font-weight: 800;
    color: var(--text-bright); line-height: 1.1; margin-top: 2px;
  }
  .header p { font-size: 13px; color: var(--text-muted); margin-top: 3px; }
  .main {
    flex: 1; overflow: hidden;
    display: flex; gap: 16px;
    padding: 0 24px 16px;
  }
  .sidebar {
    width: 250px; flex-shrink: 0;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 4px;
    padding-right: 6px;
  }
  .sidebar::-webkit-scrollbar { width: 3px; }
  .sidebar::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  .topic-btn {
    display: flex; align-items: center; gap: 9px;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px; padding: 8px 11px;
    cursor: pointer; transition: all 0.2s ease;
    width: 100%; text-align: left;
    font-family: 'DM Sans', sans-serif; color: var(--text);
  }
  .topic-btn:hover { transform: translateX(2px); }
  .topic-btn .icon { font-size: 18px; flex-shrink: 0; line-height: 1; }
  .topic-btn .label {
    font-size: 13px; font-weight: 500; flex: 1;
    line-height: 1.3; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .topic-btn.active .label { color: var(--text-bright); font-weight: 600; }
  .sidebar-divider {
    height: 1px; background: var(--border);
    margin: 4px 0; flex-shrink: 0;
  }
  .content {
    flex: 1; overflow: hidden;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
    display: flex; flex-direction: column;
  }
  .content-header {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
  }
  .content-header .icon { font-size: 30px; }
  .content-header .tag {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700;
  }
  .content-header .title {
    font-size: 18px; font-weight: 700;
    color: var(--text-bright); line-height: 1.2;
  }
  .content-scroll {
    flex: 1; overflow-y: auto; padding-right: 6px;
  }
  .content-scroll::-webkit-scrollbar { width: 3px; }
  .content-scroll::-webkit-scrollbar-track { background: transparent; }
  .content-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 2px; }
  .point {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(255,255,255,0.025);
    border-radius: 10px; padding: 10px 13px;
    margin-bottom: 7px; border: 1px solid transparent;
    animation: pointIn 0.3s ease both;
  }
  .point .num {
    width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .point p { font-size: 14px; line-height: 1.55; color: var(--text); }
  .takeaway-item {
    display: flex; gap: 10px; align-items: flex-start;
    background: rgba(255,255,255,0.025);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 13px;
    margin-bottom: 7px;
    animation: pointIn 0.3s ease both;
  }
  .takeaway-item .num {
    width: 24px; height: 24px; border-radius: 50%;
    background: linear-gradient(135deg, #E63946, #FF6B35);
    display: flex; align-items: center; justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; color: #fff; flex-shrink: 0;
  }
  .takeaway-item p { font-size: 14px; line-height: 1.55; color: var(--text); }
  .welcome {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
  }
  .welcome .big-icon { font-size: 52px; margin-bottom: 14px; }
  .welcome p { font-size: 15px; color: var(--text-muted); line-height: 1.6; max-width: 260px; }
  @keyframes pointIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* ===== MOBILE RESPONSIVE ===== */
  @media (max-width: 768px) {
    html, body { overflow: auto; height: auto; }
    .app { height: auto; min-height: 100vh; overflow: visible; }
    .header { padding: 14px 16px 10px; }
    .header h1 { font-size: 22px; }
    .main {
      flex-direction: column;
      padding: 0 12px 16px;
      overflow: visible;
    }
    .sidebar {
      width: 100%;
      flex-direction: row;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 6px;
      padding-right: 0;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .sidebar::-webkit-scrollbar { height: 3px; width: auto; }
    .topic-btn {
      flex-shrink: 0;
      min-width: max-content;
      padding: 7px 12px;
    }
    .sidebar-divider {
      width: 1px; height: auto;
      min-height: 28px;
      margin: 0 2px;
    }
    .content {
      overflow: visible;
      min-height: 60vh;
      padding: 16px;
    }
    .content-scroll { overflow: visible; }
    .point p, .tip-box p, .takeaway-item p { font-size: 13px; }
  }

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Law & Ethics in Healthcare</h1>
    <p>Doing the Right Thing</p>
  </div>
  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content">
      <div class="welcome">
        <div class="big-icon">📚</div>
        <p>Select a topic to explore its key learning points</p>
      </div>
    </div>
  </div>
</div>
<script>
var TOPICS = [
  { id:1, num:"01", icon:"🔍", title:"Identify Legal & Regulatory Requirements", color:"#E63946",
    points:["Healthcare is one of the most heavily regulated industries because people\'s lives and health are directly at stake — federal, state, and local agencies all set rules that MAs must follow","HIPAA (1996): protects patient health information (PHI) in all forms — electronic, written, and oral; gives patients rights over their information and sets strict limits on who may access it","HITECH Act: extends HIPAA into the digital space — holds vendors and business associates directly liable for breaches and strengthens enforcement penalties for electronic data misuse","EMTALA (1986): emergency departments receiving Medicare or Medicaid must screen and provide stabilizing care for any patient, regardless of ability to pay — eliminating \'patient dumping\'","Additional laws MAs encounter: ACA (expanded insurance access), ADA (disability protections), CLIA (laboratory standards), CSA (controlled substance scheduling), and the No Surprises Act (billing transparency)"] },
  { id:2, num:"02", icon:"🧰", title:"Identify Patient Consent", color:"#457B9D",
    points:["Consent is a patient\'s voluntary agreement to receive care — it must be given freely, without pressure, and by a person with sufficient mental capacity to understand what they are agreeing to","Implied consent: inferred from a patient\'s actions rather than words — opening the mouth for a thermometer, rolling up a sleeve for an injection; also assumed in emergencies for unconscious patients","Expressed consent: given verbally or in writing — the patient says \'yes, go ahead\' or signs a consent form; the most common type used in routine clinical interactions","Informed consent: the most legally significant type — the provider must fully explain the procedure, all risks and benefits, expected outcomes, and available alternatives before the patient agrees; failure to obtain it can constitute medical negligence","Minors (under 18) generally require parental consent — two exceptions: (1) seeking birth control, STI treatment, pregnancy care, or substance abuse treatment; (2) emancipated minors (military, married, financially independent, or court-declared) may consent independently"] },
  { id:3, num:"03", icon:"🌈", title:"Identify Professional Codes of Ethics", color:"#2A9D8F",
    points:["Ethics are the moral principles that govern a person\'s behavior and guide decisions about right and wrong — in healthcare, they are the foundation of every clinical interaction","Personal ethics: an individual\'s own values about right and wrong — shaped by family, culture, religion, and experience; they influence how a person shows up at work and handles difficult situations","Professional ethics: standards established for a profession through training, codes of conduct, and organizational policies — including employee handbooks, certification codes, and the Hippocratic Oath","Medical ethics narrows the focus to the patient relationship — it uses moral analysis to define a healthcare provider\'s duties and obligations and examines what actions are ethically justified in clinical care","Four core principles of medical ethics: autonomy (patients decide for themselves), justice (equitable treatment for all), beneficence (act in the patient\'s best interest), nonmaleficence (first, do no harm)"] },
  { id:4, num:"04", icon:"🧪", title:"Describe & Differentiate Medical Directives", color:"#8338EC",
    points:["Advance directives are legal documents that communicate a patient\'s healthcare wishes when they are no longer able to speak for themselves — they go into effect only when the patient cannot make or communicate decisions","Living will: specifies which treatments the patient wants and which they do not — CPR, mechanical ventilation, dialysis, tube feeding, organ donation — and under what conditions each decision applies","Durable Power of Attorney for Healthcare (DPOA): names a healthcare agent or proxy to make medical decisions on the patient\'s behalf — more flexible than a living will; the agent can decide on hospital admission, treatment, record access, and arrangements after death","Do-Not-Resuscitate (DNR): a specific legal order to withhold CPR and advanced cardiac life support — does NOT stop other treatments; the patient can still receive chemotherapy, dialysis, antibiotics, and any other ongoing care","POLST (Physician Orders for Life-Sustaining Treatment): a medical order — not just a preference — that travels with the patient across care settings; advance directives do not expire and remain valid until the patient officially changes them"] },
  { id:5, num:"05", icon:"📏", title:"Describe Patient Privacy, Confidentiality & Medical Records", color:"#FF6B35",
    points:["HIPAA is the cornerstone of patient privacy law — it gives patients the right to access their records, request corrections, and know who has viewed their information; covered entities must comply","Three HIPAA safeguards: administrative (written policies and procedures), physical (locked areas, controlled access), and technical (passwords, encryption, audit logs for electronic systems)","Record ownership: the healthcare facility owns the physical medical record as a legal document — but the patient owns the information inside it and has the right to inspect, copy, and correct their data","A signed release form is required for standard record transfers — without it, records can only be released for court orders (subpoena), criminal investigations, communicable disease reporting, or workers\' compensation mandates","HIPAA does not require sharing information with family or friends unless they are formally designated as the patient\'s authorized representative — always verify authorization before releasing any PHI"] },
  { id:6, num:"06", icon:"💉", title:"Identify Legal Requirements for Reportable Violations & Incidents", color:"#E63946",
    points:["Mandatory reporting is a legal obligation — not optional — requiring healthcare professionals to report specific events to the appropriate authorities to protect patients and the public","Always reportable: births, deaths, communicable and notifiable diseases (TB, HIV, meningitis, STIs, COVID-19, E. coli, foodborne illness), assaults, and criminal acts such as gunshot wounds and stabbings","Abuse reporting: every state mandates reporting of suspected child abuse, elder abuse, and neglect — many states also require reporting of intimate partner violence; the law requires reporting suspicion, not proven abuse","Anyone who reports suspected abuse in good faith is legally protected from lawsuits — the MA does not need to prove it occurred; they only need reasonable suspicion based on what they observe","The Four Ds of Negligence establish when legal liability arises: Duty of Care, Dereliction of that duty, Direct Cause connecting the breach to the harm, and measurable Damages — all four must be present for a malpractice case"] },
  { id:7, num:"07", icon:"🩸", title:"Personal Beliefs, Values & Providing Unbiased Care", color:"#457B9D",
    points:["MAs will care for patients from every background — race, ethnicity, sex, age, religion, language, sexual orientation, gender identity, and more; every patient deserves the same quality of care regardless of who they are","Cultural competence is the ability to deliver healthcare that genuinely meets the needs of a diverse population — it is an ongoing learning process, not a one-time training, and includes understanding how culture shapes health decisions","Explicit (conscious) bias: a recognized preference or prejudice that a person is aware of holding; explicit biases are easier to address because the person can identify them","Implicit (unconscious) bias: a hidden preference that operates below conscious awareness — often more dangerous in healthcare because the person providing care does not realize it is influencing their behavior","Confronting personal biases is a professional responsibility — bias is not limited to race; age, weight, religion, gender identity, sexual orientation, and disability are all subject to bias that can undermine equitable patient care"] },
];

var TAKEAWAYS = [
  "HIPAA gives patients rights over their health information — three safeguards (administrative, physical, technical) must protect it; written consent is required to share PHI in almost all circumstances",
  "Informed consent is not just a signature on a form — it requires a competent adult to voluntarily agree after receiving complete information about risks, benefits, and all available alternatives",
  "Advance directives do not expire — a living will, DPOA, DNR, or POLST remains valid until the patient officially changes it; every MA must understand what each document means and how to respond",
  "Mandatory reporting of abuse is triggered by reasonable suspicion, not proven fact — good-faith reporting is legally protected; failure to report is a legal violation",
  "The four principles of medical ethics — autonomy, justice, beneficence, nonmaleficence — are not abstract ideals; they are the practical foundation of every patient interaction and clinical decision",
  "Cultural competence and confronting bias are ongoing professional obligations — every patient deserves equitable, unbiased care regardless of their background, identity, beliefs, or ability to pay"
];

var activeId = null;
var sidebar = document.getElementById('sidebar');
var content = document.getElementById('content');

function buildSidebar() {
  TOPICS.forEach(function(t) {
    var btn = document.createElement('button');
    btn.className = 'topic-btn';
    btn.dataset.id = t.id;
    btn.innerHTML = '<span class="icon">' + t.icon + '</span><span class="label">' + t.title + '</span>';
    btn.addEventListener('click', function() { selectTopic(t.id); });
    btn.addEventListener('mouseenter', function() {
      if (activeId !== t.id) { this.style.background = t.color + '10'; this.style.borderColor = t.color + '55'; }
    });
    btn.addEventListener('mouseleave', function() {
      if (activeId !== t.id) { this.style.background = 'var(--surface)'; this.style.borderColor = 'var(--border)'; }
    });
    sidebar.appendChild(btn);
  });
  var divider = document.createElement('div');
  divider.className = 'sidebar-divider';
  sidebar.appendChild(divider);
  var tkBtn = document.createElement('button');
  tkBtn.className = 'topic-btn';
  tkBtn.dataset.id = 'takeaways';
  tkBtn.innerHTML = '<span class="icon">🎯</span><span class="label">Key Takeaways</span>';
  tkBtn.addEventListener('click', function() { selectTopic('takeaways'); });
  tkBtn.addEventListener('mouseenter', function() {
    if (activeId !== 'takeaways') { this.style.background = 'rgba(255,255,255,0.06)'; this.style.borderColor = 'rgba(255,255,255,0.15)'; }
  });
  tkBtn.addEventListener('mouseleave', function() {
    if (activeId !== 'takeaways') { this.style.background = 'var(--surface)'; this.style.borderColor = 'var(--border)'; }
  });
  sidebar.appendChild(tkBtn);
}

function updateSidebarActive() {
  var btns = sidebar.querySelectorAll('.topic-btn');
  btns.forEach(function(btn) {
    var id = btn.dataset.id;
    var topic = TOPICS.find(function(t) { return t.id == id; });
    var isActive = (id == activeId) || (id === 'takeaways' && activeId === 'takeaways');
    if (isActive) btn.classList.add('active'); else btn.classList.remove('active');
    if (isActive && topic) {
      btn.style.background = topic.color + '20';
      btn.style.borderColor = topic.color;
    } else if (isActive && id === 'takeaways') {
      btn.style.background = 'rgba(255,255,255,0.08)';
      btn.style.borderColor = 'rgba(255,255,255,0.2)';
    } else {
      btn.style.background = 'var(--surface)';
      btn.style.borderColor = 'var(--border)';
    }
  });
}

function renderTopic(t) {
  var html = '<div class="content-header">' +
    '<span class="icon">' + t.icon + '</span>' +
    '<div><div class="tag" style="color:' + t.color + '">TOPIC ' + t.num + '</div>' +
    '<div class="title">' + t.title + '</div></div></div>' +
    '<div class="content-scroll">';
  t.points.forEach(function(p, i) {
    html += '<div class="point" style="border-color:' + t.color + '22;animation-delay:' + (i * 50) + 'ms">' +
      '<div class="num" style="background:' + t.color + '">' + (i + 1) + '</div>' +
      '<p>' + p + '</p></div>';
  });
  html += '</div>';
  return html;
}

function renderTakeaways() {
  var html = '<div class="content-header">' +
    '<span class="icon" style="font-size:30px">🎯</span>' +
    '<div><div class="title">Key Takeaways</div></div></div>' +
    '<div class="content-scroll">';
  TAKEAWAYS.forEach(function(t, i) {
    html += '<div class="takeaway-item" style="animation-delay:' + (i * 50) + 'ms">' +
      '<div class="num">' + (i + 1) + '</div><p>' + t + '</p></div>';
  });
  html += '</div>';
  return html;
}

function selectTopic(id) {
  activeId = id;
  updateSidebarActive();
  if (id === 'takeaways') {
    content.innerHTML = renderTakeaways();
  } else {
    var topic = TOPICS.find(function(t) { return t.id === id; });
    if (topic) content.innerHTML = renderTopic(topic);
  }
  content.style.animation = 'none';
  void content.offsetHeight;
  content.style.animation = 'fadeIn 0.25s ease';
}

buildSidebar();
</script>
</body>
</html>
