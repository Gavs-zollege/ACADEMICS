<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pediatric Injection Sites</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#14082a,#1c1040,#100828);font-family:'Sora',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#a78bfa;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#fb7185);border-radius:10px;transition:width .4s}.question{background:#1c1040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">💉</div><h1>Pediatric Injection Sites</h1><p class="sub">Site selection, needle sizing & safety by age</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"The preferred IM site for infants (0–12 months) is:",opts:["Deltoid","Ventrogluteal","Vastus lateralis (outer thigh)","Dorsogluteal"],a:2,tip:"Vastus lateralis ALWAYS for infants. Deltoid is too small — axillary nerve risk."},{q:"The deltoid becomes appropriate for IM injections after age:",opts:["1 year","2 years","3 years (with adequate muscle mass)","6 months"],a:2,tip:"After age 3, IF adequate muscle mass is present. Assess before choosing."},{q:"Needle length for infant IM injections is:",opts:["1/4 inch","5/8 to 1 inch","1.5 inches","2 inches"],a:1,tip:"5/8 to 1 inch for infants. Must reach muscle, not just fat."},{q:"Pediatric dosages are calculated by:",opts:["Age only","Height only","Weight — convert lb to kg, then apply mg/kg dose","Estimation"],a:2,tip:"Weight-based: lb ÷ 2.2 = kg, then multiply by mg/kg. Always double-check."},{q:"Why is the deltoid never used for infants?",opts:["Too painful","Muscle is too small — risk of axillary nerve injury","Not enough blood flow","Parents refuse"],a:1,tip:"Infant deltoid is underdeveloped. Axillary nerve injury is a real risk."},{q:"After a pediatric injection, the child should wait:",opts:["5 minutes","10 minutes","20–30 minutes for observation","They can leave immediately"],a:2,tip:"20–30 minutes to monitor for allergic reactions. Document any reactions."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Great work on Week 13! You are getting job-ready.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
