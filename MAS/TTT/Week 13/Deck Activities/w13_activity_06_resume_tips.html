<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Resume Tips Quiz</title><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a1628,#0e1d38,#081428);font-family:'Lexend',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#60a5fa;font-weight:800;font-size:14px}.bar{height:6px;background:#1a3060;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#fb7185);border-radius:10px;transition:width .4s}.question{background:#112240;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #60a5fa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1a3060;border:2px solid #1a3060;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#60a5fa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#112240}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#112240;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#60a5fa;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📄</div><h1>Resume Tips Quiz</h1><p class="sub">Building a resume that gets you hired</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"A clinical externship should be listed on your resume under:",opts:["Education only","Experience — it counts as professional experience","References","Not at all"],a:1,tip:"Your practicum IS professional experience for entry-level roles. Include it."},{q:"Resume action verbs should be:",opts:["Passive (responsible for, helped with)","Strong and active (performed, administered, documented, coordinated)","Informal (did stuff, worked on)","Vague (assisted)"],a:1,tip:"Strong verbs: performed, assisted, documented, administered, educated, coordinated."},{q:"An entry-level MA resume should be:",opts:["2–3 pages minimum","One page with clean formatting","As long as needed","Decorated with colors and graphics"],a:1,tip:"One page. Consistent font (10–12pt). Clean margins. No photos or colored text."},{q:"Before submitting your resume, you should:",opts:["Just spell-check it","Proofread twice, then have someone else proofread it","Submit it immediately","Print it on colored paper"],a:1,tip:"A single typo on a healthcare resume signals poor attention to detail."},{q:"Skills should be organized as:",opts:["One long list","Two columns: Clinical and Administrative","Alphabetically","By personal preference"],a:1,tip:"Two columns: Clinical (vitals, phlebotomy, EKG) and Administrative (scheduling, billing, coding)."},{q:"Only list skills you have:",opts:["Heard about","Actually been trained or clinically practiced on","Seen someone else do","Read about online"],a:1,tip:"Employers will ask you to demonstrate listed skills. Be honest."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Great work on Week 13! You are getting job-ready.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
