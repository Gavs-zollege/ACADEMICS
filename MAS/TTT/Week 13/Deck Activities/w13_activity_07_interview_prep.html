<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Interview Prep Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:       #0d0910;
    --surface:  #160d1e;
    --surface2: #1f1430;
    --border:   #2c1d42;
    --pink:     #f472b6;
    --pink2:    #fb7185;
    --green:    #4ade80;
    --red:      #fb7185;
    --text:     #f0eaf8;
    --muted:    #7c6e90;
  }

  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'DM Sans', sans-serif;
    color: var(--text);
    padding: 32px 16px 64px;
    position: relative;
    overflow-x: hidden;
  }

  /* Ambient glow blobs */
  body::before, body::after {
    content: '';
    position: fixed;
    border-radius: 50%;
    filter: blur(80px);
    pointer-events: none;
    z-index: 0;
  }
  body::before {
    width: 420px; height: 420px;
    background: rgba(244,114,182,0.12);
    top: -80px; right: -100px;
  }
  body::after {
    width: 320px; height: 320px;
    background: rgba(74,222,128,0.06);
    bottom: 60px; left: -80px;
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ── Header ── */
  .header {
    text-align: center;
    margin-bottom: 32px;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(244,114,182,0.1);
    border: 1px solid rgba(244,114,182,0.3);
    border-radius: 99px;
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    color: var(--pink);
    letter-spacing: .06em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  h1 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: clamp(26px, 6vw, 36px);
    line-height: 1.1;
    background: linear-gradient(135deg, #fff 30%, var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  .sub {
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
  }

  /* ── Top bar ── */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .qn {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .sc {
    font-family: 'Syne', sans-serif;
    font-size: 14px;
    font-weight: 800;
    color: var(--pink);
  }

  /* ── Progress bar ── */
  .bar {
    height: 4px;
    background: var(--border);
    border-radius: 10px;
    margin-bottom: 22px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--pink), var(--pink2));
    border-radius: 10px;
    transition: width .5s cubic-bezier(.4,0,.2,1);
  }

  /* ── Category chip ── */
  .cat {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--pink);
    background: rgba(244,114,182,0.1);
    border: 1px solid rgba(244,114,182,0.2);
    border-radius: 6px;
    padding: 3px 9px;
    margin-bottom: 12px;
  }

  /* ── Question card ── */
  .question {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--pink);
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 14px;
  }
  .question p {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 17px;
    line-height: 1.55;
    color: var(--text);
  }

  /* ── Options ── */
  .opts { display: grid; gap: 9px; }

  .opt {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    padding: 15px 18px;
    border-radius: 12px;
    background: var(--surface2);
    border: 1.5px solid var(--border);
    font-weight: 500;
    font-size: 14.5px;
    line-height: 1.5;
    cursor: pointer;
    transition: border-color .2s, background .2s, transform .1s;
    text-align: left;
  }
  .opt:hover { border-color: rgba(244,114,182,0.5); background: #221636; transform: translateY(-1px); }
  .opt:active { transform: translateY(0); }

  .letter {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    width: 26px; height: 26px;
    border-radius: 7px;
    background: rgba(244,114,182,0.12);
    border: 1px solid rgba(244,114,182,0.25);
    color: var(--pink);
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 13px;
  }

  .opt.correct {
    background: rgba(74,222,128,0.08);
    border-color: var(--green);
  }
  .opt.correct .letter {
    background: rgba(74,222,128,0.15);
    border-color: var(--green);
    color: var(--green);
  }
  .opt.wrong {
    background: rgba(251,113,133,0.08);
    border-color: var(--red);
  }
  .opt.wrong .letter {
    background: rgba(251,113,133,0.15);
    border-color: var(--red);
    color: var(--red);
  }
  .opt.disabled { cursor: default; transform: none !important; }

  /* ── Tip ── */
  .tip {
    margin-top: 14px;
    padding: 16px 18px;
    border-radius: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    animation: fadeUp .3s ease;
  }
  .tip-head {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Syne', sans-serif;
    font-size: 15px;
    font-weight: 800;
    margin-bottom: 7px;
  }
  .tip-head.ok { color: var(--green); }
  .tip-head.no { color: var(--red); }
  .tip-body { color: var(--muted); font-size: 13.5px; line-height: 1.6; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Done screen ── */
  .done {
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 48px 32px;
    animation: fadeUp .4s ease;
    display: none;
  }
  .done-emoji { font-size: 60px; margin-bottom: 16px; display: block; }
  .done h2 {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 30px;
    background: linear-gradient(135deg, #fff 30%, var(--pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .done-msg { color: var(--muted); font-size: 14.5px; margin-bottom: 8px; }
  .score-bar-wrap { margin: 20px auto 28px; max-width: 300px; }
  .score-label { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .score-bar { height: 8px; background: var(--border); border-radius: 10px; overflow: hidden; }
  .score-bar-fill { height: 100%; background: linear-gradient(90deg, var(--pink), #4ade80); border-radius: 10px; transition: width 1s ease; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 14px 32px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--pink), var(--pink2));
    color: #0d0910;
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    letter-spacing: .02em;
    transition: opacity .2s, transform .1s;
    box-shadow: 0 4px 20px rgba(244,114,182,0.3);
  }
  .btn:hover { opacity: .9; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="badge">🎤 Week 13</div>
    <h1>Interview Prep Quiz</h1>
    <p class="sub">STAR method · Presentation · Follow-up</p>
  </div>
  <div id="game"></div>
  <div id="doneBox" class="done"></div>
</div>

<script>
const QS = [
  {
    cat: "STAR Method",
    q: "What does the 'S' in the STAR interview method stand for?",
    opts: ["Strategy", "Situation", "Strength", "Summary"],
    a: 1,
    tip: "STAR = Situation, Task, Action, Result. You open by setting the scene — giving context so the interviewer understands the background of your example."
  },
  {
    cat: "STAR Method",
    q: "In the STAR method, which component describes what YOU specifically did — not your team?",
    opts: ["Task", "Result", "Action", "Situation"],
    a: 2,
    tip: "The Action step is critical. Use 'I' statements here, not 'we'. Interviewers want to know your individual contribution, even in a team setting."
  },
  {
    cat: "STAR Method",
    q: "An interviewer asks: 'Tell me about a time you resolved a conflict.' Which is the BEST Result statement?",
    opts: [
      "We talked it out and things improved.",
      "I avoided the person afterward to reduce tension.",
      "I facilitated a meeting, aligned on shared goals, and the team shipped on time with both engineers satisfied.",
      "My manager said it was fine."
    ],
    a: 2,
    tip: "Strong results are specific and measurable. Quantify outcomes (on time, both satisfied) and show lasting impact. Vague results weaken an otherwise good story."
  },
  {
    cat: "STAR Method",
    q: "When is it acceptable to use a hypothetical ('I would…') instead of a real example in a behavioral question?",
    opts: [
      "Always — it sounds more polished.",
      "Only if explicitly told the role is brand-new.",
      "Almost never; real examples are always strongly preferred.",
      "When your real example might reflect badly on a former employer."
    ],
    a: 2,
    tip: "Behavioral questions ask for real past behavior because it predicts future behavior. Hypotheticals feel ungrounded. If you lack a direct example, adapt a transferable one and note the context."
  },
  {
    cat: "STAR Method",
    q: "How long should a well-structured STAR answer typically run in a standard interview?",
    opts: ["30–45 seconds", "1–2 minutes", "3–5 minutes", "As long as needed to tell the full story"],
    a: 1,
    tip: "Aim for 1–2 minutes per answer. Long enough to show depth, short enough to keep the interviewer engaged. Practice trimming filler — if it doesn't add to S, T, A, or R, cut it."
  },
  {
    cat: "Presentation Skills",
    q: "You're presenting data to a non-technical audience. What's the most important thing to prioritize?",
    opts: [
      "Including all raw numbers so they have full context.",
      "Leading with the key insight and using visuals to support it.",
      "Using technical jargon to appear credible.",
      "Reading directly from your slides so nothing is missed."
    ],
    a: 1,
    tip: "Lead with the 'so what' — the insight or decision you want them to take away. Visuals should support, not repeat, what you say. Non-technical audiences lose interest in data dumps quickly."
  },
  {
    cat: "Presentation Skills",
    q: "Which of the following is the BEST way to handle a question you don't know the answer to during a presentation?",
    opts: [
      "Make an educated guess and commit confidently.",
      "Deflect with humor and move on.",
      "Acknowledge honestly that you'll find out and follow up with the answer.",
      "Say 'that's out of scope' and continue."
    ],
    a: 2,
    tip: "Honesty builds trust. 'Great question — I don't have that number on hand but I'll send it over by end of day' is a professional, credible response. Never bluff; experienced audiences will notice."
  },
  {
    cat: "Presentation Skills",
    q: "What is the primary purpose of a 'hook' at the start of a professional presentation?",
    opts: [
      "To demonstrate your research depth upfront.",
      "To grab attention and make the audience care about what's coming.",
      "To give a full preview of every slide.",
      "To introduce all team members before the content begins."
    ],
    a: 1,
    tip: "A hook (a surprising stat, a question, a short story) earns attention in the first 30 seconds. People decide early whether to mentally check in or check out. Make them care before you explain."
  },
  {
    cat: "Presentation Skills",
    q: "During a job interview presentation, you notice your slide deck has a typo on an important slide. What should you do?",
    opts: [
      "Stop, apologize extensively, and try to fix it live.",
      "Acknowledge it briefly if noticed, correct verbally, and continue with confidence.",
      "Pretend it isn't there — mentioning it draws more attention.",
      "Skip the slide entirely."
    ],
    a: 1,
    tip: "A brief, calm acknowledgment shows professionalism and self-awareness. Over-apologizing amplifies the mistake. Your poise under pressure is part of what's being evaluated."
  },
  {
    cat: "Follow-Up",
    q: "How soon after an interview should you send a thank-you email?",
    opts: ["Within 24 hours", "3–5 business days", "Only if you want the job badly", "After you hear back from them"],
    a: 0,
    tip: "Send a thank-you within 24 hours while the conversation is fresh — both for you and the interviewer. Personalize it with something specific you discussed. It reinforces your interest and sets you apart."
  },
  {
    cat: "Follow-Up",
    q: "What should a strong thank-you email include beyond just 'thanks for your time'?",
    opts: [
      "A list of your qualifications again in full.",
      "A reference to something specific discussed, your continued enthusiasm, and a brief reminder of the value you bring.",
      "A request for feedback on your performance.",
      "Questions about salary and start date."
    ],
    a: 1,
    tip: "Personalization is the differentiator. Reference a topic you bonded on or a challenge they mentioned — it shows you were listening. Keep it short: 3–5 sentences max."
  },
  {
    cat: "Follow-Up",
    q: "The interviewer said you'd hear back 'within a week.' It's been 10 days with no response. What's the best move?",
    opts: [
      "Send a follow-up email expressing continued interest and asking for a status update.",
      "Assume you didn't get it and move on.",
      "Call the main company line every day until you reach someone.",
      "Wait another two weeks before doing anything."
    ],
    a: 0,
    tip: "A polite follow-up after the stated timeline is entirely appropriate and shows initiative. Keep it brief: confirm your interest, reference your interview date, and ask if there's an updated timeline."
  },
  {
    cat: "Follow-Up",
    q: "You receive a rejection email after a final-round interview. What is the most strategic response?",
    opts: [
      "Reply expressing frustration about the unfair process.",
      "Do nothing — there's no point in responding to a rejection.",
      "Reply graciously, thank them for the opportunity, and express interest in future roles.",
      "Ask them to reconsider and list reasons you're the better candidate."
    ],
    a: 2,
    tip: "Industries are small. A gracious rejection response leaves a lasting positive impression and keeps the door open for future opportunities. Hiring managers sometimes reach back out months later for new roles."
  },
  {
    cat: "General Strategy",
    q: "Before an interview, which preparation step is MOST likely to differentiate you from other candidates?",
    opts: [
      "Memorizing your entire resume word for word.",
      "Researching the company's recent news, challenges, and how your role fits their goals.",
      "Preparing generic answers to common questions.",
      "Choosing the most formal outfit possible."
    ],
    a: 1,
    tip: "Candidates who connect their experience to the company's current context stand out immediately. Read recent press releases, their blog, or earnings notes. Reference something specific — it signals genuine interest."
  },
  {
    cat: "General Strategy",
    q: "At the end of an interview, you're asked 'Do you have any questions for us?' What is the worst response?",
    opts: [
      "'What does success look like in this role in the first 90 days?'",
      "'How would you describe the team culture?'",
      "'No, I think you've covered everything.'",
      "'What are the biggest challenges someone in this role would face?'"
    ],
    a: 2,
    tip: "Saying no signals low curiosity or low interest. Always prepare 3–5 thoughtful questions. The best ones show you've done research and are thinking about how you'll actually succeed in the role."
  }
];

let ci = 0, score = 0, chosen = null;

function renderQ() {
  const g = document.getElementById('game');
  const q = QS[ci];
  const pct = (ci / QS.length * 100).toFixed(1);

  let h = `
    <div class="topbar">
      <span class="qn">Question ${ci + 1} of ${QS.length}</span>
      <span class="sc">⭐ ${score}</span>
    </div>
    <div class="bar"><div class="bar-fill" style="width:${pct}%"></div></div>
    <div class="cat">${q.cat}</div>
    <div class="question"><p>${q.q}</p></div>
    <div class="opts">
  `;

  q.opts.forEach((o, i) => {
    let cls = 'opt';
    if (chosen !== null) {
      cls += ' disabled';
      if (i === q.a) cls += ' correct';
      else if (chosen === i) cls += ' wrong';
    }
    const click = chosen === null ? `onclick="answer(${i})"` : '';
    h += `<div class="${cls}" ${click}>
      <span class="letter">${String.fromCharCode(65 + i)}</span>
      <span>${o}</span>
    </div>`;
  });

  h += `</div>`;

  if (chosen !== null) {
    const ok = chosen === q.a;
    h += `<div class="tip">
      <div class="tip-head ${ok ? 'ok' : 'no'}">${ok ? '✅ Correct!' : '❌ Not quite'}</div>
      <div class="tip-body">${q.tip}</div>
    </div>`;
  }

  g.innerHTML = h;
}

function answer(i) {
  if (chosen !== null) return;
  chosen = i;
  if (i === QS[ci].a) score++;
  renderQ();
  setTimeout(() => {
    if (ci + 1 < QS.length) {
      ci++; chosen = null; renderQ();
    } else {
      showDone();
    }
  }, 2600);
}

function showDone() {
  document.getElementById('game').style.display = 'none';
  const d = document.getElementById('doneBox');
  const pct = Math.round(score / QS.length * 100);
  let emoji = '💪', msg = 'Keep practicing — every rep gets you closer to your dream job.';
  if (pct === 100) { emoji = '🏆'; msg = 'Perfect score! You\'re fully interview-ready.'; }
  else if (pct >= 80) { emoji = '🎯'; msg = 'Great work! A little more polish and you\'ll nail it.'; }
  else if (pct >= 60) { emoji = '📈'; msg = 'Solid foundation — review the tips and go again.'; }

  d.style.display = 'block';
  d.innerHTML = `
    <span class="done-emoji">${emoji}</span>
    <h2>${score} / ${QS.length} Correct</h2>
    <p class="done-msg">${msg}</p>
    <div class="score-bar-wrap">
      <div class="score-label"><span>0%</span><span>${pct}%</span><span>100%</span></div>
      <div class="score-bar"><div class="score-bar-fill" id="sbf" style="width:0%"></div></div>
    </div>
    <button class="btn" onclick="reset()">🔄 Try Again</button>
  `;
  setTimeout(() => {
    const sb = document.getElementById('sbf');
    if (sb) sb.style.width = pct + '%';
  }, 100);
}

function reset() {
  ci = 0; score = 0; chosen = null;
  document.getElementById('game').style.display = 'block';
  document.getElementById('doneBox').style.display = 'none';
  renderQ();
}

renderQ();
</script>
</body>
</html>
