<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Injection Site Quick-Ref</title><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(150deg,#0d1a0f,#112010,#0a150c);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#edf2f7}.wrap{max-width:740px;margin:0 auto}.header{text-align:center;margin-bottom:28px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#888;font-weight:600;font-size:15px}.badge{display:inline-block;margin-top:12px;background:#142818;padding:6px 20px;border-radius:20px;border:1px solid #a3e63533;color:#a3e635;font-weight:800;font-size:15px}.cols{display:flex;gap:16px;flex-wrap:wrap}.col{flex:1 1 280px;min-width:220px}.cl{font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.cl.a{color:#a3e635}.cl.b{color:#fbbf24}.card{padding:13px 16px;margin-bottom:7px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;border:2px solid transparent}.card.i{background:#142818}.card.i.sel{background:#a3e63522;border-color:#a3e635}.card.i.done{background:rgba(52,211,153,.1);border-color:#34d399;opacity:.55;cursor:default}.card.m{background:#142818;font-weight:600;font-size:13px}.card.m.used{background:rgba(52,211,153,.1);border-color:#34d399;opacity:.55;cursor:default}.card.m.wrong{background:rgba(251,113,133,.18);border-color:#fb7185;animation:shake .35s}.dn{text-align:center;background:#142818;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.dn .big{font-size:56px}.dn h2{font-weight:800;font-size:28px;margin:12px 0 8px}.dn p{color:#34d399;font-weight:700;font-size:16px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a3e635;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📋</div><h1>Injection Site Quick-Ref</h1><p class="sub">Match each age group to the correct IM site & needle</p><div class="badge" id="counter">0 matched</div></div>
<div id="game"><div class="cols"><div class="col" id="ic"><div class="cl a">📌 Item</div></div><div class="col" id="mc"><div class="cl b">🎯 Match</div></div></div></div>
<div id="doneBox" class="dn" style="display:none"><div class="big">🏆</div><h2>All Matched!</h2><p>Great work!</p><button class="btn" onclick="resetGame()">🔄 Play Again</button></div></div>
<script>
const P=[{item:"Newborn/Infant (0–12 mo)",match:"Vastus lateralis | 5/8–1 inch | Never deltoid"},{item:"Toddler (1–3 years)",match:"Vastus lateralis preferred | 1 inch | Deltoid not recommended"},{item:"Child (3–10 years)",match:"Deltoid (if adequate mass) or vastus lateralis | 1 inch"},{item:"Adolescent (11–18 years)",match:"Deltoid preferred | 1–1.5 inch | Same approach as adults"},{item:"Adult",match:"Deltoid (≤1 mL) or ventrogluteal (≤3 mL) | 1–1.5 inch | 90° always"}];
let sh,sel=null,mt={},ct=0;function shuffle(a){return[...a].sort(()=>Math.random()-.5)}function render(){const ic=document.getElementById('ic'),mc=document.getElementById('mc');ic.innerHTML='<div class="cl a">📌 Item</div>';mc.innerHTML='<div class="cl b">🎯 Match</div>';P.forEach((p,i)=>{const d=document.createElement('div');d.className='card i'+(mt[i]!==undefined?' done':sel===i?' sel':'');d.textContent=(mt[i]!==undefined?'✅ ':'')+p.item;if(mt[i]===undefined)d.onclick=()=>{sel=i;render()};ic.appendChild(d)});sh.forEach((m,i)=>{const d=document.createElement('div');const u=Object.values(mt).includes(i);d.className='card m'+(u?' used':'');d.textContent=(u?'✅ ':'')+m.match;d.id='m-'+i;if(!u)d.onclick=()=>tryM(i);mc.appendChild(d)});document.getElementById('counter').textContent=ct+' / '+P.length+' matched'}function tryM(mi){if(sel===null)return;if(P[sel].match===sh[mi].match){mt[sel]=mi;ct++;sel=null;render();if(ct===P.length){document.getElementById('game').style.display='none';document.getElementById('doneBox').style.display='block'}}else{const el=document.getElementById('m-'+mi);el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),500)}}function resetGame(){sel=null;mt={};ct=0;sh=shuffle(P);document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';render()}sh=shuffle(P);render();
</script></body></html>
