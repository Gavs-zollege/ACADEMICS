<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sterile Field Rules</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0e0820,#181030,#0a0618);font-family:'Plus+Jakarta+Sans',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#22d3ee;font-weight:800;font-size:14px}.bar{height:6px;background:#201840;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#22d3ee,#fb7185);border-radius:10px;transition:width .4s}.question{background:#181030;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #22d3ee}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#201840;border:2px solid #201840;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#22d3ee;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#181030}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#181030;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#22d3ee;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🧤</div><h1>Sterile Field Rules</h1><p class="sub">Correct or contaminated? Classify each scenario.</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"You turn your back on the sterile field for 5 seconds to grab gauze. The field is:",opts:["Still sterile","Contaminated — any moment outside line of sight means contamination can't be confirmed","Fine if no one touched it","Only contaminated if someone walked by"],a:1,tip:"Never turn your back. If the field is outside your line of sight, replace it."},{q:"You open a sterile packet and the autoclave tape has NOT changed color. You should:",opts:["Use it anyway — the tape sometimes fails","Do NOT use it — treat as non-sterile and replace","Ask a coworker if it looks okay","Check the expiration date instead"],a:1,tip:"No color change = not sterilized. Replace immediately."},{q:"A sterile gloved hand accidentally touches the Mayo stand leg. The glove is:",opts:["Still sterile — the stand is clean","Contaminated — change the glove immediately","Fine if wiped with alcohol","Only contaminated if visibly dirty"],a:1,tip:"Any non-sterile surface contact = contamination. Change the glove."},{q:"You need to add an instrument mid-procedure. You should:",opts:["Reach over the field to place it","Open the packet and drop the item onto the field without touching it","Hand it directly to the provider with bare hands","Place it on the 1-inch border"],a:1,tip:"Open and drop carefully. Never reach over the field or touch the inner wrapper."},{q:"The outermost inch of the sterile drape is considered:",opts:["The cleanest part","Non-sterile — never place instruments in the border zone","Sterile if the drape is new","Only non-sterile if visibly soiled"],a:1,tip:"The 1-inch border is ALWAYS non-sterile. Keep all instruments inside it."},{q:"Only individuals who may handle instruments in the sterile field are those who have:",opts:["Washed their hands with soap","Performed a surgical scrub and are wearing sterile gloves","Put on clean exam gloves","Used hand sanitizer"],a:1,tip:"Surgical scrub + sterile gloves = the only people who touch the sterile field."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Great work on Week 13! You are getting job-ready.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
