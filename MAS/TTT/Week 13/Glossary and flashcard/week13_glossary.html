<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 13 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}.search-wrap input:focus{border-color:var(--red)}.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}.cat-btn:hover{opacity:.85}.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}.item:last-child{border-bottom:none}.item:hover{background:var(--surface2)}.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}.item-left{display:flex;align-items:center;gap:10px}.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}.item.open .item-bar{opacity:1}.item-term{font-size:20px;font-weight:700;color:#fff}.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}.item.open .item-def{display:block}.item.open .item-term{color:var(--red-light)}.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}.pg-btn:disabled{opacity:.3;cursor:default}.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}.pg-dot.active{background:var(--red-light);transform:scale(1.3)}.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 13 Glossary</h1>
  <p class="sub">Minor Surgical Skills & Job Readiness</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Instruments & Sterile",color:"#E05555",terms:[
    {term:"Surgical Asepsis",def:"The practice of maintaining a completely microorganism-free environment during any invasive procedure."},
    {term:"Sterile Field",def:"A microorganism-free work surface — typically a draped Mayo stand — used during surgical and invasive procedures."},
    {term:"Mayo Stand",def:"A height-adjustable, movable stainless steel instrument tray used as the sterile field surface during minor office procedures."},
    {term:"Autoclave",def:"The primary sterilization method for reusable surgical instruments."},
    {term:"Sterilization Indicator Tape",def:"Chemical indicator tape is applied to sterile instrument packets before autoclaving."},
    {term:"Scalpel",def:"A small, sharp surgical knife used by the provider to make precise incisions through skin and tissue."},
    {term:"Tissue Forceps",def:"Tweezers-like surgical instruments used to grasp, hold, or manipulate tissue during a procedure."},
    {term:"Hemostatic Forceps",def:"Locking clamp instruments used to control bleeding by clamping blood vessels."},
    {term:"Needle Holder",def:"A locking surgical instrument used by the provider to grasp and drive a suture needle through tissue during wound closure."},
    {term:"Retractor",def:"A surgical instrument used to hold back tissue, skin, or organs to expose the operative site and give the provider a clear view."}
  ]},
  {name:"Wound Closure & Removal",color:"#6B7B8D",terms:[
    {term:"Wound Closure",def:"The process of bringing the edges of an open wound together to prevent infection, control bleeding, promote healing."},
    {term:"Suture",def:"Sterile thread or other material used to close and hold tissue together during healing."},
    {term:"Suture Removal Technique",def:"Cut each suture below the knot and as close to the skin surface as possible using suture scissors."},
    {term:"Surgical Staples",def:"Stainless steel fasteners applied with a surgical stapler to close wounds under high tension, such as on the scalp, trunk."},
    {term:"Staple Removal Technique",def:"Place the lower jaw of the sterile staple remover beneath the staple to be removed and squeeze the handles fully closed without..."},
    {term:"Wound Dehiscence",def:"Partial or complete separation of wound edges after closure — a complication that may indicate infection, excessive tension."},
    {term:"Butterfly Closure (Steri-Strip)",def:"A narrow adhesive strip used to reinforce wound edges after suture or staple removal, or as a primary closure for small."},
    {term:"Wound Irrigation",def:"The process of flushing a wound with sterile saline or an antiseptic solution to remove debris, bacteria."}
  ]},
  {name:"Office Procedures",color:"#8B6AAE",terms:[
    {term:"Biopsy",def:"The surgical removal of a small tissue sample for microscopic laboratory examination — used to diagnose cancer, skin conditions."},
    {term:"Punch Biopsy",def:"A type of skin biopsy that uses a circular cutting tool (punch) to remove a cylindrical core of skin tissue for examination."},
    {term:"Incision and Drainage (I & D)",def:"A minor surgical procedure in which the provider makes an incision into an abscess to release accumulated pus and relieve press..."},
    {term:"Cryosurgery",def:"The destruction of abnormal tissue using intense cold — typically liquid nitrogen applied via a cryoprobe or spray."},
    {term:"Specimen Container & Requisition",def:"Every biopsy or surgical specimen must be placed in a correctly labeled container (patient name, date of birth."}
  ]},
  {name:"Pediatric Measurements",color:"#E74C6F",terms:[
    {term:"Recumbent Length",def:"The measurement of an infant or young child's body length while lying flat — used from birth through 24 months."},
    {term:"Standing Height (Stature)",def:"The vertical measurement of a patient from the floor to the top of the head."},
    {term:"Head Circumference",def:"The measurement of the largest circumference of the skull — taken just above the eyebrows anteriorly and around the occipital p..."},
    {term:"CDC Growth Chart",def:"A standardized set of percentile curves used to track a child's growth over time, based on nationally representative data."},
    {term:"Percentile",def:"A statistical ranking that indicates where a child's measurement falls relative to others of the same age and sex."},
    {term:"Body Mass Index (BMI) — Pediatric",def:"A calculated ratio of weight to height squared used to screen for underweight, healthy weight, overweight."}
  ]},
  {name:"Pediatric Injections",color:"#4A90B8",terms:[
    {term:"Vastus Lateralis (Pediatric IM Site)",def:"The preferred intramuscular injection site for infants and children under 3 years of age."},
    {term:"Deltoid (Pediatric IM Site)",def:"The muscle of the upper arm that becomes an appropriate IM injection site in children over 3 years of age once sufficient muscl..."},
    {term:"Weight-Based Dosing",def:"A method of calculating a patient's medication dose based on their body weight, expressed as a dose per kilogram (mg/kg)."},
    {term:"Axillary Nerve",def:"A nerve that runs close to the deltoid muscle in the upper arm."},
    {term:"Immunization Schedule",def:"The CDC-published schedule of recommended vaccines by age — from birth through adulthood."},
    {term:"Vaccine Information Statement (VIS)",def:"A CDC-produced document that explains the benefits and risks of a specific vaccine."}
  ]},
  {name:"Pap Test & GYN",color:"#1A8A7D",terms:[
    {term:"Pap Test (Pap Smear)",def:"A cervical cancer screening procedure that collects cells from the cervix for laboratory analysis."},
    {term:"Lithotomy Position",def:"The patient examination position used for pelvic and vaginal procedures, including the Pap test."},
    {term:"Vaginal Speculum",def:"A hinged, duck-billed instrument inserted into the vaginal canal to spread the walls apart and allow visualization of the cervix."},
    {term:"ThinPrep (Liquid-Based Cytology)",def:"The most commonly used Pap test collection method. The collection brush or spatula is rinsed directly into a vial of preservati..."},
    {term:"Specimen Labeling (Pap Test)",def:"All specimen containers and slides must be labeled before collection begins — never after."},
    {term:"Cervical Cytology Requisition",def:"The laboratory order form that must accompany every Pap test specimen."},
    {term:"HPV Co-Test",def:"A laboratory test performed on the same cervical specimen as the Pap test to detect high-risk strains of human papillomavirus (..."}
  ]},
  {name:"Resume & Job Prep",color:"#E2B94C",terms:[
    {term:"Professional Resume",def:"A concise, professionally formatted document that summarizes a job applicant's education, certifications, skills."},
    {term:"Professional Summary",def:"A 2–3 sentence statement at the top of the resume that briefly introduces the applicant."},
    {term:"Clinical Skills Section",def:"A dedicated section of the MA resume listing specific hands-on clinical competencies acquired through training and practicum."},
    {term:"Administrative Skills Section",def:"A dedicated section of the MA resume listing office and administrative competencies."},
    {term:"Action Verbs (Resume)",def:"Strong, specific verbs used to begin each bullet point under experience sections — demonstrating what the applicant actively di..."},
    {term:"Externship / Clinical Practicum (Resume)",def:"The supervised clinical training component completed during an MA program — counts as professional experience on a resume for e..."}
  ]},
  {name:"Interview Skills",color:"#4CAF90",terms:[
    {term:"STAR Method",def:"A structured framework for answering behavioral interview questions — questions that ask candidates to describe a past situation."},
    {term:"Behavioral Interview Question",def:"An interview question that asks the candidate to describe a specific past experience to predict future behavior."},
    {term:"Professional Presentation",def:"The overall impression a candidate makes during an interview — including appearance, punctuality, communication."},
    {term:"Follow-Up Thank-You",def:"A brief, professional email sent to the interviewer within 24 hours of a job interview."},
    {term:"Salary Research",def:"The practice of researching typical compensation ranges for a specific role and location before a job interview."},
    {term:"Transferable Skills",def:"Skills developed in one context that apply directly in another — including customer service, communication, attention to detail."}
  ]}
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
