const S=[{"id":0,"type":"title","title":"Learning Minor Surgical\\nSkills & Getting Job-Ready","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Thirteen","tags":["Surgical Assist","Pediatric Care","Pap Set-Up","Resume Review","Mock Interviews"],"fs":28},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Set up and maintain a sterile field for minor office surgical procedures","Identify and handle common surgical instruments used in office-based procedures","Perform or assist with suture and staple removal following correct technique","Obtain accurate pediatric measurements and plot findings on a growth chart","Select appropriate injection site, needle size, and dose calculation for pediatric patients","Assemble supplies and correctly position the patient for a Pap test","Prepare a professional, employer-ready resume","Demonstrate confident, professional responses to common MA interview questions"]},{"id":2,"type":"twocol","title":"Minor Surgical Assistance","lt":"Sterile Field & Instruments","lc":"var(--accent)","li":[{"l":"Mayo stand prep","d":"Disinfect, dry, above waist, 12 inches from body. Farthest flap first."},{"l":"Sterilization indicators","d":"Check autoclave tape color change and date before every use."},{"l":"Instrument ID","d":"Scalpel, tissue forceps, hemostatic forceps (Kelly, mosquito), needle holder, retractors, scissors."},{"l":"Passing instruments","d":"Only surgical-scrubbed, sterile-gloved individuals handle instruments in the field."},{"l":"Contamination protocol","d":"Any doubt = non-sterile. Replace immediately."}],"rt":"Common Procedures & Wound Closure","rc":"var(--blue)","ri":[{"l":"Biopsy","d":"Punch biopsy kit or scalpel tray, specimen container with formalin. Label before procedure."},{"l":"I&D","d":"Sterile field with scalpel, forceps, packing, culture swabs, dressing supplies."},{"l":"Suture/staple removal","d":"Every other first. Stop if gaping, bleeding, or discharge."},{"l":"Cryosurgery","d":"Cryoprobe and liquid nitrogen applicator. Educate about burning/stinging."},{"l":"Wound closure types","d":"Sutures (thread), staples (high-tension), tapes (low-tension), adhesives (moisture-activated)."}]},{"id":3,"type":"twocol","title":"Pediatric Measurements & Injections","lt":"Measurements by Age Group","lc":"var(--warm)","li":[{"l":"Newborns/infants (0–24 mo)","d":"Infant scale (undressed), recumbent length, head circumference at widest point."},{"l":"Toddlers (2–3 yrs)","d":"Begin standing height. Weight on standing scale. Head circumference stops after age 3."},{"l":"Children (3+ yrs)","d":"Standing height (stadiometer), weight, BMI. Plot on CDC growth chart every visit."},{"l":"Vital signs","d":"HR faster, RR faster, BP lower than adults. Age-appropriate cuffs and reference charts."},{"l":"Growth chart trends","d":"Sudden percentile drop is more significant than a single low number."}],"rt":"Pediatric Injections","rc":"var(--blue)","ri":[{"l":"0–12 months","d":"Vastus lateralis (outer thigh), 5/8–1 inch needle. Never deltoid."},{"l":"1–3 years","d":"Vastus lateralis preferred, 1 inch needle."},{"l":"3–10 years","d":"Deltoid (if adequate mass) or vastus lateralis, 1 inch."},{"l":"Adolescent","d":"Deltoid preferred, 1–1½ inch. Same approach as adults."},{"l":"Dosage by weight","d":"lb → kg (÷ 2.2), × mg/kg/day, ÷ doses/day. Always double-check."}]},{"id":4,"type":"twocol","title":"Pap Test Set-Up & Protocol","lt":"Supplies & Positioning","lc":"var(--purple)","li":[{"l":"Equipment","d":"Exam table with locked stirrups, vaginal speculum (correct size), cervical brush/spatula."},{"l":"Specimen collection","d":"ThinPrep vial or glass slide with fixative. Water-based lubricant only."},{"l":"Positioning","d":"Lithotomy. Lock stirrups first. Both feet simultaneously. Buttocks to edge."},{"l":"Draping","d":"Under arms to ankles. Maintain privacy. Explain each step before touching."},{"l":"Screening timeline","d":"Age 21 start. 21–29: every 3 yrs. 30–65: every 3–5 yrs with HPV co-test."}],"rt":"Specimen Labeling & Education","rc":"var(--accent)","ri":[{"l":"Label BEFORE collection","d":"Patient name, DOB, collection date, provider name — on container before procedure."},{"l":"ThinPrep","d":"Brush/spatula rinsed into preservative vial — not on glass slide."},{"l":"Requisition form","d":"Demographics, LMP, clinical indication, prior abnormal Pap, HPV status."},{"l":"Results timeline","d":"1–2 weeks typically. Tell patient how the office will contact them."},{"l":"Documentation","d":"All education, patient questions, and specimen details in the medical record."}]},{"id":5,"type":"twocol","title":"Resume & Interview Preparation","lt":"Resume Essentials","lc":"var(--accent)","li":[{"l":"Contact info","d":"Full name, phone, professional email, city/state. LinkedIn optional."},{"l":"Professional summary","d":"3 sentences max: who you are, what you offer, what you seek. Lead with value."},{"l":"Certifications","d":"CMA, RMA, or NHA prominently. Include certifying body and expiration date."},{"l":"Skills","d":"Two columns: clinical (vitals, phlebotomy, EKG) and administrative (scheduling, billing, coding)."},{"l":"Experience","d":"Include externship. Action verbs: performed, assisted, documented, administered."},{"l":"Formatting","d":"One page. Consistent font (Calibri, Arial, 10–12pt). No photos or colored text. Proofread twice."}],"rt":"Interview Tips","rc":"var(--blue)","ri":[{"l":"Tell me about yourself","d":"Professional, under 2 minutes. Training → why you want this role."},{"l":"Difficult patient scenario","d":"Use STAR method: Situation, Task, Action, Result."},{"l":"What if you're unsure?","d":"They want to see you ask for help rather than guess."},{"l":"Professional appearance","d":"Clean scrubs or professional attire. Arrive 10–15 minutes early."},{"l":"Have questions ready","d":"'What does a typical day look like?' 'What qualities do your best MAs share?'"},{"l":"Follow up","d":"Thank-you email within 24 hours — still rare enough to be memorable."}]},{"id":6,"type":"takeaways","title":"Week Thirteen — Key Takeaways","items":["Sterile field: when in doubt, replace the item. No guessing allowed in surgical setup.","Vastus lateralis is the go-to IM site for infants/children under 3. Deltoid too underdeveloped.","Pediatric dosages by weight: lb → kg (÷ 2.2), apply mg/kg dose, always double-check.","Label Pap specimen container BEFORE collection — name, DOB, date, provider name.","Your resume is a clinical document — precision matters. One typo signals the wrong things.","STAR method turns vague interview stories into compelling answers. Practice out loud.","Plot every pediatric measurement on the CDC growth chart. Note the trend over time.","Thank-you email within 24 hours of an interview — demonstrates follow-through."]},{"id":7,"type":"quiz","title":"Knowledge Check","questions":[{"q":"What is the preferred IM injection site for a 6-month-old infant?","options":["Deltoid","Ventrogluteal","Vastus lateralis","Dorsogluteal"],"correct":2,"explanation":"Vastus lateralis (outer thigh) — the deltoid is too small and risks axillary nerve injury."},{"q":"Pap test specimen labels should be prepared:","options":["After the collection","During the procedure","Before the collection begins","When the lab picks it up"],"correct":2,"explanation":"Label BEFORE collection — patient name, DOB, collection date, and provider name."},{"q":"What does the STAR interview method stand for?","options":["Skills, Training, Ability, Results","Situation, Task, Action, Result","Summary, Timeline, Assessment, Review","Strengths, Techniques, Approach, Response"],"correct":1,"explanation":"STAR: Situation → Task → Action → Result. Structures behavioral interview answers."},{"q":"Head circumference is routinely measured until what age?","options":["12 months","24 months","36 months (age 3)","5 years"],"correct":2,"explanation":"Head circumference is tracked from birth to 36 months (age 3)."},{"q":"In lithotomy position, what must be locked BEFORE the patient places their feet?","options":["The exam table wheels","The stirrups","The door","The supply cabinet"],"correct":1,"explanation":"Lock stirrups before the patient places their feet — safety is non-negotiable."},{"q":"To convert pediatric weight from lb to kg, you:","options":["Multiply by 2.2","Divide by 2.2","Multiply by 1.8","Divide by 1.8"],"correct":1,"explanation":"Divide by 2.2 to convert lb to kg."}]},{"id":8,"type":"end","title":"End of Week Thirteen","subtitle":"Minor Surgical Skills & Getting Job-Ready","message":"From sterile fields to interview prep — this week bridges clinical competency and professional readiness. You're almost there."}];

function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${s.note?`<div style="font-size:9px;color:var(--textMid);font-style:italic;margin-top:4px">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[7].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[7].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
