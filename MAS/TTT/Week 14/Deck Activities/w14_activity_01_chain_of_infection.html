<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Chain of Infection</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(150deg,#0b1e2d,#0f2a3d,#162040);font-family:'Nunito',sans-serif;padding:24px 16px;color:#edf2f7}.wrap{max-width:740px;margin:0 auto}.header{text-align:center;margin-bottom:28px}.icon{font-size:44px}h1{font-weight:900;font-size:30px;margin:8px 0 4px}.sub{color:#7b9ab5;font-weight:700;font-size:15px}.badge{display:inline-block;margin-top:12px;background:#112d3f;padding:6px 20px;border-radius:20px;border:1px solid rgba(45,212,191,.2);color:#2dd4bf;font-weight:800;font-size:15px}.cols{display:flex;gap:16px;flex-wrap:wrap}.col{flex:1 1 280px;min-width:220px}.cl{font-weight:800;font-size:13px;letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}.cl.a{color:#2dd4bf}.cl.b{color:#fbbf24}.card{padding:14px 18px;margin-bottom:8px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;border:2px solid transparent}.card.i{background:#112d3f}.card.i.sel{background:rgba(255,107,107,.15);border-color:#ff6b6b}.card.i.done{background:rgba(52,211,153,.1);border-color:#34d399;opacity:.55;cursor:default}.card.m{background:#112d3f;font-weight:600;font-size:13px}.card.m.used{background:rgba(52,211,153,.1);border-color:#34d399;opacity:.55;cursor:default}.card.m.wrong{background:rgba(239,83,80,.18);border-color:#ef5350;animation:shake .35s}.dn{text-align:center;background:#112d3f;border-radius:24px;padding:40px;border:2px solid rgba(52,211,153,.25)}.dn .big{font-size:56px}.dn h2{font-weight:900;font-size:28px;margin:12px 0 8px}.dn p{color:#34d399;font-weight:700;font-size:16px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#2dd4bf;color:#0b1e2d;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🔗</div><h1>Chain of Infection Match</h1><p class="sub">Match each link to its description</p><div class="badge" id="counter">0 / 6 matched</div></div>
<div id="game"><div class="cols"><div class="col" id="ic"><div class="cl a">🔗 Link</div></div><div class="col" id="mc"><div class="cl b">🎯 Description</div></div></div></div>
<div id="doneBox" class="dn" style="display:none"><div class="big">🏆</div><h2>All Matched!</h2><p>Break ANY link and transmission stops. Every infection control action targets one of these six links.</p><button class="btn" onclick="resetGame()">🔄 Play Again</button></div></div>
<script>
const P=[{item:"1. Infectious Agent",match:"The pathogen — virus, bacteria, fungus, or parasite"},{item:"2. Reservoir",match:"Where the pathogen lives and multiplies — patients, surfaces, equipment"},{item:"3. Portal of Exit",match:"How it leaves — body fluids, respiratory droplets, blood, skin"},{item:"4. Mode of Transmission",match:"How it travels — direct contact, indirect, droplet, or airborne"},{item:"5. Portal of Entry",match:"How it enters — open wounds, mouth, nose, eyes, urinary tract"},{item:"6. Susceptible Host",match:"A person vulnerable due to immune status, age, or health"}];
let sh,sel=null,mt={},ct=0;function shuffle(a){return[...a].sort(()=>Math.random()-.5)}function render(){const ic=document.getElementById('ic'),mc=document.getElementById('mc');ic.innerHTML='<div class="cl a">🔗 Link</div>';mc.innerHTML='<div class="cl b">🎯 Description</div>';P.forEach((p,i)=>{const d=document.createElement('div');d.className='card i'+(mt[i]!==undefined?' done':sel===i?' sel':'');d.textContent=(mt[i]!==undefined?'✅ ':'')+p.item;if(mt[i]===undefined)d.onclick=()=>{sel=i;render()};ic.appendChild(d)});sh.forEach((m,i)=>{const d=document.createElement('div');const u=Object.values(mt).includes(i);d.className='card m'+(u?' used':'');d.textContent=(u?'✅ ':'')+m.match;d.id='m-'+i;if(!u)d.onclick=()=>tryM(i);mc.appendChild(d)});document.getElementById('counter').textContent=ct+' / '+P.length+' matched'}function tryM(mi){if(sel===null)return;if(P[sel].match===sh[mi].match){mt[sel]=mi;ct++;sel=null;render();if(ct===P.length){document.getElementById('game').style.display='none';document.getElementById('doneBox').style.display='block'}}else{const el=document.getElementById('m-'+mi);el.classList.add('wrong');setTimeout(()=>el.classList.remove('wrong'),500)}}function resetGame(){sel=null;mt={};ct=0;sh=shuffle(P);document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';render()}sh=shuffle(P);render();
</script></body></html>
