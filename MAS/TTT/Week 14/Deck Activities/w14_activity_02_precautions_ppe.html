<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Precautions & PPE Quiz</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1c1a2e,#221f38,#1a1830);font-family:'Fredoka',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#f59e0b;font-weight:800;font-size:14px}.bar{height:6px;background:#332850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#fb7185);border-radius:10px;transition:width .4s}.question{background:#272540;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #f59e0b}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#332850;border:2px solid #332850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#f59e0b;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#272540}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#272540;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f59e0b;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🧤</div><h1>Precautions & PPE Quiz</h1><p class="sub">Standard precautions, transmission tiers & PPE</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Universal precautions apply to:",opts:["Only patients with known infections","Blood, body fluids, and human tissue from EVERY patient","Only surgical patients","Only immunocompromised patients"],a:1,tip:"Treat every patient as potentially infectious — regardless of known status."},{q:"Airborne precautions require:",opts:["Surgical mask only","N95 respirator + gown + negative pressure room","Just gloves","No special precautions"],a:1,tip:"N95 (fit-tested) for TB, measles, chickenpox. A surgical mask is NOT equivalent."},{q:"Contact precautions require:",opts:["Gloves + gown for direct/indirect touch","N95 respirator only","No PPE","Just hand sanitizer"],a:0,tip:"Gloves + gown when touching the patient or contaminated surfaces."},{q:"Employers must provide PPE:",opts:["Only if employees pay for it","At no cost to the employee","Only for full-time staff","Only during flu season"],a:1,tip:"All PPE provided at no cost. Plus a written exposure control plan and Hep B vaccine within 10 days."},{q:"When doffing gloves, the key step is:",opts:["Pull both off at once","Grasp palm of non-dominant glove, pull inside-out, then peel dominant glove over it","Shake them off into the trash","Wash them and reuse"],a:1,tip:"Inside-out removal prevents touching contaminated surfaces. Wash hands after."},{q:"Goggles or face shields are required when:",opts:["Always during patient care","Blood, body fluid, or chemical splatter could reach eyes, nose, or mouth","Only during surgery","Only in the lab"],a:1,tip:"Any splash risk: lab procedures, irrigation, surgical assist, chemical handling."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Every infection control action breaks a link in the chain. Keep patients safe.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
