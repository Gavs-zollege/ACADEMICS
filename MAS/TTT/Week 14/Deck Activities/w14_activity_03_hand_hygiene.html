<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Hand Hygiene Quiz</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0f1f17,#132419,#0d1a20);font-family:'Outfit',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#34d399;font-weight:800;font-size:14px}.bar{height:6px;background:#1e3a28;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#34d399,#fb7185);border-radius:10px;transition:width .4s}.question{background:#162a1f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #34d399}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1e3a28;border:2px solid #1e3a28;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#34d399;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#162a1f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#162a1f;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#34d399;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🧼</div><h1>Hand Hygiene Quiz</h1><p class="sub">When to wash vs. sanitize & proper technique</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Hand sanitizer (≥60% alcohol) is acceptable:",opts:["After contact with blood","Before and after patient contact when hands are not visibly soiled","After using the restroom","When hands are visibly dirty"],a:1,tip:"Sanitizer works for routine patient contact. Soap and water required for blood, visible soil, restroom."},{q:"Soap and water is REQUIRED (not optional) after:",opts:["Touching a clean surface","Contact with blood or body fluids","Checking a patient's blood pressure","Answering the phone"],a:1,tip:"Blood/body fluids, aseptic procedures, glove removal, visible soil, restroom, eating = soap and water."},{q:"Proper handwashing friction should last:",opts:["5 seconds","10 seconds","15–20 seconds","60 seconds"],a:2,tip:"15–20 seconds of friction. Circular motions, interlacing fingers, cleaning around wrists."},{q:"Artificial nails are not permitted in clinical settings because:",opts:["They look unprofessional","They harbor more bacteria than natural nails","They interfere with glove fit only","Patients find them distracting"],a:1,tip:"Artificial nails harbor significantly more bacteria. One plain band ring is the only jewelry exception."},{q:"After washing, turn off non-foot-operated faucets with:",opts:["Your clean hands","A dry paper towel","Your elbow","Leave the water running"],a:1,tip:"Paper towel to turn off faucet, then discard in covered waste. Prevents recontamination."},{q:"Keep fingertips ___ than wrists during handwashing.",opts:["Higher","Lower — so water flows away from clean areas","At the same level","It doesn't matter"],a:1,tip:"Lower. Water should flow from cleanest (wrists) to dirtiest (fingertips) and into the drain."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Every infection control action breaks a link in the chain. Keep patients safe.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
