<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Autoclave & Sterilization</title><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1a1810,#1e1b12,#141208);font-family:'Rubik',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#f59e0b;font-weight:800;font-size:14px}.bar{height:6px;background:#332e20;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#fb7185);border-radius:10px;transition:width .4s}.question{background:#252218;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #f59e0b}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#332e20;border:2px solid #332e20;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#f59e0b;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#252218}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#252218;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f59e0b;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">♨️</div><h1>Autoclave & Sterilization</h1><p class="sub">Temperature, wrapping, indicators & storage</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Autoclave temperature must reach:",opts:["180–200°F","212°F (boiling)","250–270°F","300°F"],a:2,tip:"250–270°F. Unwrapped: 20 min. Wrapped: 30 min. Follow manufacturer guidelines."},{q:"Hinged instruments should be wrapped:",opts:["In the closed position","In the OPEN position with gauze between tips","Without wrapping","Standing upright"],a:1,tip:"Open position lets steam reach all surfaces. Gauze between tips prevents cutting through packaging."},{q:"Wrapped autoclaved packages remain sterile for:",opts:["7 days","14 days","30 days if intact, dry, and undamaged","Indefinitely"],a:2,tip:"30 days if packaging stays intact, dry, and stored correctly. Any damage = resterilize."},{q:"Biological indicators contain:",opts:["Chemical dyes","Live bacterial spores — the most stringent sterilization test","pH strips","Temperature sensors"],a:1,tip:"Live spores verify the autoclave is functioning. Used for routine quality checks."},{q:"Chemical indicator tape on the outside confirms:",opts:["Sterility of contents","That proper temperature and time were reached on the outside","That the package is sealed","Nothing — it's decorative"],a:1,tip:"Tape confirms external exposure. The INTERNAL indicator strip confirms steam penetrated inside."},{q:"Chemical sterilization (for heat-sensitive items) requires submersion for:",opts:["30 minutes","2 hours","8 hours with closed lid","15 minutes"],a:2,tip:"8 hours, fully submerged, closed lid. Items are NOT sterile once removed from the solution."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Every infection control action breaks a link in the chain. Keep patients safe.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
