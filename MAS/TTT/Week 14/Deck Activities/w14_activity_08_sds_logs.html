<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>SDS & Compliance Logs</title><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0d1a0f,#112010,#0a150c);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:30px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#a3e635;font-weight:800;font-size:14px}.bar{height:6px;background:#1c3820;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a3e635,#fb7185);border-radius:10px;transition:width .4s}.question{background:#142818;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a3e635}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1c3820;border:2px solid #1c3820;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a3e635;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#142818}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#142818;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a3e635;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📋</div><h1>SDS & Compliance Logs</h1><p class="sub">Safety Data Sheets, QC & maintenance logs</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"OSHA requires a Safety Data Sheet (SDS) for:",opts:["Only hazardous chemicals","Every chemical used in the workplace","Only cleaning products","Only lab reagents"],a:1,tip:"Every chemical. Standardized format for quick access to hazard and first-aid info."},{q:"Refrigerator temperature for medication/vaccine storage should be:",opts:["32–36°F","36–46°F","46–55°F","Room temperature"],a:1,tip:"36–46°F (2–8°C). Checked and logged daily when meds or vaccines are stored."},{q:"The autoclave/sterilization log must include:",opts:["Just the date","Date, contents, temperature, cycle time, and operator initials","Only the operator name","Nothing — it's optional"],a:1,tip:"Complete log: date, contents, temp reached, cycle time, initials. Confirms sterilization."},{q:"The sharps injury log is required by:",opts:["The AMA","OSHA — every needlestick must be documented","The CDC only","It's voluntary"],a:1,tip:"OSHA-required. Kept confidential. Retained for 5 years."},{q:"QC control samples should be run:",opts:["Once a month","Before patient specimens when new supplies are opened","Only if results look wrong","Annually"],a:1,tip:"Run controls before patient samples and each time new testing supplies are opened."},{q:"All compliance logs are considered:",opts:["Internal notes only","Legal compliance documents — inaccurate entries put everyone at risk","Optional records","Only reviewed during inspections"],a:1,tip:"Every log is a legal document. Missing or inaccurate entries = compliance risk."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Every infection control action breaks a link in the chain. Keep patients safe.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
