<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 14 Flashcards — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #e4e4f0;
    --text-secondary: #9898b0;
    --surface-1: #1c1c2e;
    --surface-2: #282840;
    --border: #363650;
    --bg: #0d0d1a;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.35);
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-display: 'Playfair Display', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: #C0392B; margin-bottom: 6px;
  }
  .header h1 {
    font-family: var(--font-display); font-size: 32px; font-weight: 900;
    letter-spacing: -1px; margin-bottom: 6px; line-height: 1.1;
  }
  .header p { font-size: 13px; color: var(--text-secondary); }
  .flashcard {
    width: 100%; max-width: 500px; min-height: 250px; border-radius: 22px;
    cursor: pointer; padding: 34px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12); transition: all .35s cubic-bezier(.4,0,.2,1);
    user-select: none; position: relative; margin: 0 auto;
  }
  .flashcard .label {
    position: absolute; top: 16px; left: 20px; font-size: 11px;
    font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; opacity: .7;
  }
  .flashcard .hint {
    position: absolute; top: 16px; right: 20px; font-size: 11px; opacity: .5;
  }
  .flashcard h2 {
    margin: 0; font-family: var(--font-display); font-size: 26px;
    font-weight: 900; line-height: 1.2; letter-spacing: -.5px;
  }
  .flashcard .def-text {
    margin: 0; font-size: 15px; line-height: 1.65; color: var(--text-secondary);
  }
  .progress-bar {
    height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 6px; transition: width .3s;
  }
  .pill {
    padding: 8px 16px; border-radius: 24px; font-weight: 700;
    cursor: pointer; font-size: 13px; transition: all .2s; font-family: var(--font-body);
  }
  .pill-primary {
    border: none; color: #fff; padding: 13px 34px; font-size: 15px;
    border-radius: 30px; letter-spacing: .3px;
  }
  .pill-outline {
    background: transparent; border: 2px solid;
  }
  .chip {
    padding: 8px 14px; border-radius: 20px; border: 2px solid;
    font-weight: 600; cursor: pointer; font-size: 13px; transition: all .2s;
    font-family: var(--font-body); white-space: nowrap;
  }
  .flex-center { display: flex; align-items: center; justify-content: center; }
  .text-center { text-align: center; }
  .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
  .mt-20 { margin-top: 20px; } .mt-24 { margin-top: 24px; }
  .mb-6 { margin-bottom: 6px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; } .mb-24 { margin-bottom: 24px; }
  .gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-tag">Medical Assistant Program</div>
    <h1>Week 14 Flashcards</h1>
    <p id="header-subtitle"></p>
  </div>
  <div id="flash-mode"></div>
</div>
<script>
const CATEGORIES = [
  {
    name: "Chain of Infection & Transmission", emoji: "🔗", color: "#C0392B",
    terms: [
      { term: "Pathogen", def: "A microorganism — virus, bacterium, fungus, or parasite — capable of causing disease in a susceptible host. Not all microorganisms are pathogenic; those that do not cause disease are called nonpathogens. Common pathogens encountered in the medical office include rhinovirus, influenza, E. coli, Candida albicans, and MRSA." },
      { term: "Chain of Infection", def: "The six-link sequence that must be fully connected for a communicable disease to spread: (1) infectious agent, (2) reservoir, (3) portal of exit, (4) mode of transmission, (5) portal of entry, and (6) susceptible host. Breaking any single link in the chain stops transmission and halts the infectious process." },
      { term: "Reservoir", def: "The environment in which a pathogen lives, multiplies, and survives long enough to be transmitted to a new host. In a clinical setting, the reservoir is most often the patient but can also be contaminated equipment, exam tables, door handles, or other inanimate surfaces (fomites)." },
      { term: "Portal of Exit", def: "The route by which a pathogen leaves its reservoir. Common portals of exit from the human body include respiratory secretions (coughing, sneezing), blood and body fluids, feces, skin lesions, and reproductive secretions." },
      { term: "Mode of Transmission", def: "The mechanism by which a pathogen travels from the reservoir to a new host. Direct transmission involves immediate physical contact with the source. Indirect transmission involves an intermediate step — a contaminated surface, object, or vector — between the source and the new host." },
      { term: "Portal of Entry", def: "The route by which a pathogen enters a new host. Common portals of entry include the mouth (ingestion), nose (inhalation), eyes (mucous membrane contact), broken skin or open wounds, and the urinary or reproductive tracts." },
      { term: "Susceptible Host", def: "A person who lacks adequate resistance to a specific pathogen and may develop infection if exposed. Factors that increase susceptibility include compromised immunity, chronic illness, advanced age, malnutrition, stress, and recent surgery or invasive procedures." },
      { term: "Communicable Disease", def: "An infectious illness that can be transmitted from one person or source to another — directly or indirectly. Examples include influenza, tuberculosis, chickenpox, strep throat, pertussis, and COVID-19. Certain communicable diseases are legally reportable to public health authorities." },
      { term: "Sign vs. Symptom", def: "A sign is an objective, observable manifestation of illness that can be perceived and measured by others — fever, swollen lymph nodes, skin eruptions, tachycardia. A symptom is a subjective experience that only the patient can perceive or report — chills, fatigue, headache, sore throat, chest tightness." },
    ],
  },
  {
    name: "Standard, Universal & Transmission-Based Precautions", emoji: "🔗", color: "#2471A3",
    terms: [
      { term: "Universal Precautions", def: "A set of infection control practices that treat every patient's blood and certain body fluids as potentially infectious for bloodborne pathogens — regardless of the patient's known or suspected diagnosis. Applies to blood, human tissue, cerebrospinal fluid, amniotic fluid, pleural fluid, vaginal secretions, semen, and any body fluid visibly contaminated with blood." },
      { term: "Standard Precautions", def: "The current CDC baseline for infection prevention — an expansion of universal precautions that applies to blood, all body fluids (regardless of visible blood), non-intact skin, and mucous membranes. Applied to every patient during every encounter, regardless of infection status. Includes hand hygiene, appropriate PPE use, safe handling of sharps, and respiratory hygiene." },
      { term: "Contact Precautions", def: "Transmission-based precautions used when a patient is known or suspected to have an infection that spreads through direct or indirect physical contact. Requires gloves and gown upon room entry. Examples: MRSA, C. difficile, wound infections with multi-drug-resistant organisms. The exam room must be disinfected after use." },
      { term: "Droplet Precautions", def: "Transmission-based precautions for pathogens that spread through large respiratory droplets produced by coughing, sneezing, or talking — typically within 3 feet of the source. Requires a surgical mask and gloves. Examples: influenza, pertussis, strep throat. Patient should be masked and moved to an exam room immediately upon arrival." },
      { term: "Airborne Precautions", def: "The most restrictive transmission-based precautions — used when a pathogen can remain suspended in the air and spread across longer distances. Requires an N95 respirator (not a surgical mask), gloves, gown, and an airborne infection isolation room (negative pressure). Examples: tuberculosis, measles, varicella (chickenpox)." },
      { term: "Exposure Categories (I, II, III)", def: "OSHA's classification of job tasks by risk of bloodborne pathogen exposure. Category I: tasks that likely involve blood or body fluid contact (e.g., minor surgical procedures, venipuncture). Category II: tasks that do not normally involve exposure but may (e.g., CPR) — precautions still required. Category III: tasks with no expected exposure risk (e.g., taking vital signs) — no PPE required." },
    ],
  },
  {
    name: "Personal Protective Equipment (PPE)", emoji: "🧤", color: "#7D3C98",
    terms: [
      { term: "Personal Protective Equipment (PPE)", def: "Specialized clothing and equipment worn by healthcare professionals to protect themselves from exposure to blood, body fluids, infectious materials, and hazardous chemicals. Employers are required by OSHA to provide PPE at no cost to employees who have occupational exposure risk. Includes gloves, gowns, masks, respirators, goggles, and face shields." },
      { term: "Donning", def: "The process of correctly putting on personal protective equipment before potential exposure. The standard order for donning full PPE is: gown → mask or respirator → goggles or face shield → gloves. Proper donning technique prevents self-contamination before the task begins." },
      { term: "Doffing", def: "The process of safely removing contaminated personal protective equipment after completing a task. The critical principle is that the outside of contaminated PPE must never touch bare skin. Standard doffing order: gloves → goggles/face shield → gown → mask/respirator. Hands must be washed or sanitized immediately after doffing." },
      { term: "Non-Sterile Glove Doffing Technique", def: "Grasp the palm of the non-dominant glove with the dominant gloved hand and pull it off inside-out. Hold the removed glove in the dominant hand. Slide two fingers of the ungloved hand under the cuff of the dominant glove — never touching the outer contaminated surface. Pull the dominant glove off inside-out over the first glove. Discard and wash hands." },
      { term: "N95 Respirator", def: "A tight-fitting face mask that filters at least 95% of airborne particles. Required for airborne precautions (tuberculosis, measles, varicella) — a standard surgical mask does not provide equivalent protection. Must be fit-tested for each individual user before use to ensure an adequate seal." },
      { term: "Exposure Control Plan", def: "A written document, required by OSHA, detailing an employer's plan to protect employees from occupational exposure to bloodborne pathogens. Must be updated annually and reviewed with all employees upon hire and yearly. Includes engineering controls, workplace practice controls, PPE requirements, hepatitis B vaccination protocols, and post-exposure follow-up procedures." },
    ],
  },
  {
    name: "Hand Hygiene", emoji: "🧼", color: "#C2185B",
    terms: [
      { term: "Hand Hygiene", def: "The single most important and evidence-based practice for preventing the transmission of infectious diseases in healthcare settings. Includes both handwashing with soap and water and the use of alcohol-based hand sanitizer. Performed before and after every patient contact, after removing gloves, and whenever hands may be contaminated." },
      { term: "Medical Handwashing Technique", def: "Remove all jewelry except a plain band. Wet hands with lukewarm water, apply 3 mL (approximately 3 pumps) of soap, and lather with friction for a minimum of 15–20 seconds. Keep fingertips pointed downward, interlace fingers, scrub around the wrists, and pay particular attention to the nail area. Rinse wrist to fingertip. Dry with a paper towel and turn off non-foot-operated faucets with the paper towel." },
      { term: "Alcohol-Based Hand Sanitizer", def: "A hand hygiene product containing a minimum of 60% alcohol that can be used as an alternative to handwashing when hands are not visibly soiled. Effective for routine decontamination before and after patient contact, after touching contaminated surfaces, and between contact with clean and dirty body sites. Cannot replace soap and water when hands are visibly contaminated or after contact with C. difficile spores." },
      { term: "When Soap and Water Is Required", def: "Soap and water must be used — alcohol-based sanitizer is not sufficient — after contact with blood or body fluids, before performing aseptic procedures such as blood draws or medication administration, after glove removal, when hands are visibly soiled, after using the restroom, and before and after eating." },
      { term: "Artificial Nails (Clinical Setting)", def: "Prohibited for healthcare professionals working in clinical settings. Research consistently shows that individuals with artificial nails harbor significantly more bacteria under and around their nails than those with natural nails — even after proper handwashing. Represent an infection control risk particularly during procedures involving patient contact or sterile technique." },
    ],
  },
  {
    name: "Medical Asepsis, Sanitization & Disinfection", emoji: "✨", color: "#D68910",
    terms: [
      { term: "Asepsis", def: "The state of being free from pathogenic microorganisms. The goal of infection control practices — ranging from handwashing to sterilization — is to achieve and maintain asepsis in the clinical environment. There are two levels: medical (clean) asepsis and surgical (sterile) asepsis." },
      { term: "Medical Asepsis (Clean Technique)", def: "A set of practices designed to reduce the number of pathogenic microorganisms in the environment and prevent their growth and spread. Does not create a completely pathogen-free environment but significantly breaks the chain of infection. Used in daily clinical practice — handwashing, surface disinfection between patients, glove use, and laboratory clean/dirty separation." },
      { term: "Surgical Asepsis (Sterile Technique)", def: "The complete elimination of all microorganisms and their spores from instruments, equipment, and the immediate environment during invasive procedures. Required for wound care, surgical procedures, endoscopy, and catheter insertion. All instruments and PPE must be sterile, and the sterile field must be maintained without compromise throughout the procedure." },
      { term: "Sanitization", def: "The first step in instrument processing — the mechanical removal of visible debris (blood, body fluids, tissue) from instruments and equipment using detergent and water. Does not kill all microorganisms but reduces their number and removes organic material that would interfere with disinfection or sterilization. Always performed before disinfection or sterilization." },
      { term: "Ultrasonic Sanitization", def: "A method of instrument cleaning that uses high-frequency sound waves to loosen and remove debris from instruments — rather than friction. Preferred for delicate instruments that could be damaged by manual scrubbing and reduces the risk of sharps injuries during cleaning. Items are still disinfected or sterilized after ultrasonic sanitization." },
      { term: "Disinfection", def: "The process of destroying most pathogenic microorganisms on inanimate surfaces and instruments — but not bacterial spores. Less thorough than sterilization. Three levels: low-level (exam tables, countertops — example: hydrogen peroxide), intermediate-level (stethoscopes, BP cuffs — example: isopropyl alcohol), and high-level (endoscopes — example: Cidex OPA)." },
      { term: "Low-Level Disinfection", def: "Destroys most vegetative bacteria and some viruses and fungi. Used on non-critical items that contact intact skin but not mucous membranes — exam tables, countertops, blood pressure cuffs, stethoscopes. Example disinfectant: hydrogen peroxide or quaternary ammonium compounds." },
      { term: "Intermediate-Level Disinfection", def: "Destroys vegetative bacteria, most viruses, and fungi — but does not reliably kill bacterial spores. Used on semi-critical items that contact mucous membranes or non-intact skin. Examples: stethoscopes, thermometers, percussion hammers. Example disinfectant: isopropyl alcohol (70%)." },
      { term: "High-Level Disinfection", def: "Destroys all microorganisms except a small number of bacterial spores. Required for semi-critical instruments that contact mucous membranes and cannot be sterilized by heat — most commonly flexible endoscopes. Example disinfectant: Cidex OPA (glutaraldehyde-based solution). Instruments must be fully submerged for the required contact time." },
      { term: "Safety Data Sheet (SDS)", def: "A standardized document, required by OSHA for every chemical used in the workplace, providing information on hazard identification, safe handling and storage, first-aid measures for accidental exposure, required PPE, spill response, and emergency procedures. All employees must know where SDS documents are stored and how to locate them quickly." },
    ],
  },
  {
    name: "Sterilization", emoji: "♨️", color: "#148F77",
    terms: [
      { term: "Sterilization", def: "The complete destruction of all living microorganisms — including resistant bacterial endospores — using physical or chemical methods. The highest level of microbial control. Required for all instruments that penetrate the skin or enter sterile body cavities. Must be preceded by sanitization and disinfection to be fully effective." },
      { term: "Autoclave", def: "The primary sterilization method used in ambulatory healthcare settings. Uses pressurized, high-temperature steam (250–270°F) to destroy all microorganisms and their spores. Unwrapped items require 20 minutes; wrapped items require 30 minutes. The most widely accepted and cost-effective method for sterilizing heat-tolerant instruments." },
      { term: "Chemical Indicator Tape", def: "Autoclave tape applied to the outside of instrument packages before sterilization. Contains a chemical that changes color (lines turn black) only when the correct temperature and time are reached, confirming sterilization was achieved. Must be checked along with the sterilization date before every packaged instrument is opened or used." },
      { term: "Internal Indicator Strip", def: "A chemical indicator strip placed inside the instrument package before autoclaving. Confirms that steam actually penetrated to the interior of the package — not just the outer surface — and reached the required conditions. Both an external indicator tape and an internal strip should be used together for reliable verification." },
      { term: "Biological Indicator", def: "The most stringent and definitive sterilization test — contains known quantities of viable bacterial spores (typically Geobacillus stearothermophilus). If the spores are killed, sterilization was achieved. Used for routine quality control testing of autoclave function, typically on a weekly basis or per facility protocol." },
      { term: "Sterilization Wrapping", def: "The packaging used to maintain sterility of instruments after autoclaving. May be disposable double-layer autoclave paper or peel-apart polypropylene pouches. Must be free of tears or holes before use. All packages must be labeled with the sterilization date, time, MA initials, and the instrument contained." },
      { term: "Sterile Package Shelf Life", def: "The period during which an autoclaved item is considered sterile. Most facilities follow the guideline that double-layer wrapped packages are sterile for 30 days if stored in a dry, covered area and the packaging remains intact. Any package with watermarks, tears, or punctures — regardless of the sterilization date — must be rewrapped and resterilized before use." },
      { term: "Chemical Sterilization", def: "A sterilization method using chemical solutions for instruments that cannot tolerate autoclave heat — such as flexible endoscopes. Instruments are fully submerged in a precisely measured chemical bath (such as activated glutaraldehyde) for 8 hours with a closed lid, then removed with forceps and thoroughly rinsed. Once removed from the solution, items are no longer considered sterile." },
    ],
  },
  {
    name: "Biohazard Disposal & OSHA Compliance", emoji: "☣️", color: "#1A5276",
    terms: [
      { term: "Biohazardous Waste", def: "Any waste material that contains or may contain infectious agents capable of causing disease — including blood, body fluids, contaminated instruments, used PPE, sharps, and materials from procedures on infected patients. Must be identified with the biohazard symbol and disposed of in OSHA-compliant containers. Cannot be disposed of in regular trash." },
      { term: "Sharps Container", def: "A rigid, puncture-proof, leak-proof, closable container specifically designed for the disposal of needles, lancets, scalpel blades, and any other sharp objects used in patient care. Must be clearly labeled with the biohazard symbol. Items must be dropped in — never pushed or forced. Sealed and replaced when two-thirds full." },
      { term: "Biohazard Bag", def: "A leak-proof, labeled bag made of impermeable polyethylene or polypropylene used to dispose of soft contaminated waste — gloves, gauze, bandages, dressings, and disposable gowns that have contacted blood or body fluids. If the outside of the bag is contaminated or the bag's integrity is compromised, it must be placed inside a second biohazard bag (double-bagged)." },
      { term: "Biohazard Box", def: "A larger, rigid biohazard-labeled container for bulkier contaminated items such as table covers, large disposable gowns, and other waste that does not fit in a standard biohazard bag. Must have a lid that is replaced after each use. Disposed of by a licensed biohazard waste management company." },
      { term: "Needle Safety and Prevention Act (2000)", def: "A federal law requiring healthcare facilities to use safety-engineered sharp devices that help prevent needlestick injuries, and to maintain a detailed sharps injury log documenting every needlestick and sharps-related injury involving contaminated instruments. Facilities must also implement work practice controls to reduce exposure risk." },
      { term: "Biohazard Symbol", def: "The internationally recognized warning symbol — a trefoil symbol in orange or red-orange — required on all containers, bags, and equipment holding potentially infectious materials. Required by OSHA on sharps containers, biohazard bags, refrigerators or freezers storing blood products, and any equipment that could expose individuals to infectious material." },
      { term: "OSHA Bloodborne Pathogens Standard (1991)", def: "A federal regulation establishing legal requirements for protecting healthcare workers from occupational exposure to bloodborne pathogens including HIV and hepatitis B and C. Requires employers to provide PPE, maintain an exposure control plan, offer hepatitis B vaccination, provide post-exposure follow-up, maintain exposure logs, and train employees annually." },
    ],
  },
  {
    name: "Post-Exposure & Quality Control", emoji: "🏥", color: "#CA6F1E",
    terms: [
      { term: "Exposure Incident", def: "A specific eye, mouth, mucous membrane, or non-intact skin contact — or a needlestick or sharps injury — involving blood, body fluids, or other potentially infectious materials. Triggers mandatory immediate response: wash or irrigate the affected area, report to the supervisor immediately, complete an incident exposure form, and receive a medical evaluation." },
      { term: "Post-Exposure Follow-Up", def: "The employer-funded response required after an exposure incident. Includes a confidential medical evaluation, laboratory testing as indicated, hepatitis B vaccination offer (if not already immune), post-exposure prophylaxis (PEP) for potential HIV exposure if indicated, counseling, and a written medical opinion provided to the employee within 15 days." },
      { term: "Eyewash Station", def: "Emergency equipment providing a continuous, low-pressure stream of water for irrigating the eyes and face after a chemical or biological splash. Must be accessible in all laboratory areas. All staff must know the location before an emergency occurs. Must be inspected and flushed monthly to ensure proper working order and remove stagnant water." },
      { term: "Sharps Injury Log", def: "A confidential record required by OSHA documenting each needlestick or sharps injury involving contaminated instruments. Must include the type and brand of device involved, location of the incident, and a description of how the exposure occurred. Retained for 5 years. Used to identify patterns and improve workplace safety controls." },
      { term: "Temperature Log", def: "A daily record of refrigerator and freezer temperatures in areas where vaccines, medications, blood specimens, and test kits are stored. Refrigerators must be maintained between 36°F and 46°F. Required for CLIA compliance. Deviations from acceptable temperature ranges must be documented and acted upon to protect the integrity of stored materials." },
      { term: "Quality Control (QC)", def: "The systematic process of monitoring and verifying the accuracy and reliability of laboratory testing. Includes running control samples before patient specimens, calibrating equipment per manufacturer guidelines, checking reagent expiration dates, and logging all results. Required for CLIA compliance. Ensures that results reported to providers and patients are accurate." },
      { term: "Autoclave / Sterilization Log", def: "A record documenting each autoclave cycle — including the date, load contents, temperature reached, exposure time, and operator initials. Confirms that sterilization conditions were achieved and provides a traceable record for quality assurance. Required as part of the facility's sterilization quality control program." },
      { term: "Low-Level", def: "Most vegetative bacteria; some viruses and fungi" },
      { term: "Intermediate-Level", def: "Vegetative bacteria, most viruses and fungi — not spores" },
      { term: "High-Level", def: "All microorganisms except a small number of bacterial spores" },
      { term: "Sharps Container", def: "Needles, lancets, scalpel blades, broken glass — any sharp object used in patient care" },
      { term: "Biohazard Bag", def: "Contaminated gloves, gauze, bandages, dressings, disposable gowns — soft items with blood/body fluid contact" },
      { term: "Biohazard Box", def: "Bulkier contaminated items — table covers, large disposable gowns, and items too large for a bag" },
    ],
  },
];
const ALL_TERMS = CATEGORIES.flatMap((cat, ci) =>
  cat.terms.map(t => ({ ...t, category: cat.name, emoji: cat.emoji, color: cat.color, catIndex: ci }))
);
let flashDeck = [];
let flashIdx = 0;
let flashFlipped = false;
let flashKnown = 0;
let flashLearning = 0;
let flashDone = false;
let flashSelectedCats = new Set(CATEGORIES.map((_, i) => i));
let flashStarted = false;
document.getElementById('header-subtitle').textContent =
  `Infection Control Practices \u00b7 ${ALL_TERMS.length} terms across ${CATEGORIES.length} topics`;
renderFlash();
function startFlashDeck() {
  const terms = CATEGORIES.flatMap((cat, ci) =>
    flashSelectedCats.has(ci) ? cat.terms.map(t => ({ ...t, color: cat.color, emoji: cat.emoji, category: cat.name })) : []
  );
  flashDeck = shuffle([...terms]);
  flashIdx = 0; flashFlipped = false; flashKnown = 0; flashLearning = 0; flashDone = false; flashStarted = true;
  renderFlash();
}
function flashToggleCat(i) {
  if (flashSelectedCats.has(i)) {
    if (flashSelectedCats.size > 1) flashSelectedCats.delete(i);
  } else { flashSelectedCats.add(i); }
  renderFlash();
}
function flashMark(isKnown) {
  if (isKnown) flashKnown++; else flashLearning++;
  if (flashIdx + 1 >= flashDeck.length) { flashDone = true; renderFlash(); return; }
  flashIdx++; flashFlipped = false; renderFlash();
}
function renderFlash() {
  const el = document.getElementById('flash-mode');
  if (!flashStarted || flashDeck.length === 0) {
    let html = `<div class="text-center" style="padding:40px 0">
      <p style="font-size:18px;margin-bottom:20px;color:var(--text)">Select categories and start studying!</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px">`;
    CATEGORIES.forEach((c, i) => {
      const sel = flashSelectedCats.has(i);
      html += `<button class="chip" onclick="flashToggleCat(${i})"
        style="border-color:${c.color};background:${sel ? c.color : 'transparent'};color:${sel ? '#fff' : c.color}">
        ${c.emoji} ${escHtml(c.name)}</button>`;
    });
    html += `</div>
      <button class="pill-primary" style="background:#E74C3C" onclick="startFlashDeck()">Shuffle & Start \u2192</button>
    </div>`;
    el.innerHTML = html; return;
  }
  if (flashDone) {
    const total = flashKnown + flashLearning;
    const pct = Math.round((flashKnown / total) * 100);
    const emoji = pct >= 80 ? '\ud83c\udf89' : pct >= 50 ? '\ud83d\udcaa' : '\ud83d\udcd6';
    el.innerHTML = `
      <div class="text-center" style="padding:40px 0">
        <div style="font-size:48px;margin-bottom:12px">${emoji}</div>
        <h3 style="margin:0 0 8px">Round Complete!</h3>
        <p style="color:var(--text-secondary);font-size:15px;margin:0 0 24px">
          ${flashKnown} knew it \u00b7 ${flashLearning} still learning \u00b7 ${pct}% mastery
        </p>
        <div style="width:100%;max-width:300px;height:10px;border-radius:10px;background:var(--surface-2);margin:0 auto 24px;overflow:hidden">
          <div style="width:${pct}%;height:100%;border-radius:10px;background:linear-gradient(90deg,#27AE60,#2ECC71);transition:width .6s"></div>
        </div>
        <button class="pill-primary" style="background:#3498DB" onclick="flashDeck=[];flashStarted=false;flashDone=false;renderFlash()">New Round</button>
      </div>`;
    return;
  }
  const card = flashDeck[flashIdx];
  const pctProgress = ((flashIdx / flashDeck.length) * 100);
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;padding:12px 0">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;width:100%">
        <span style="font-size:13px;color:var(--text-secondary);font-weight:600">${flashIdx + 1}/${flashDeck.length}</span>
        <div class="progress-bar" style="flex:1"><div class="fill" style="width:${pctProgress}%;background:${card.color}"></div></div>
        <span style="font-size:12px;color:var(--text-secondary)">\u2713${flashKnown} \u2717${flashLearning}</span>
      </div>
      <div class="flashcard" onclick="flashFlipped=!flashFlipped;renderFlash();"
           style="background:${flashFlipped ? 'var(--surface-1)' : card.color};color:${flashFlipped ? 'var(--text)' : '#fff'}">
        <span class="label">${flashFlipped ? 'Definition' : card.emoji + ' ' + escHtml(card.category)}</span>
        <span class="hint">${flashFlipped ? '' : 'tap to flip'}</span>
        ${!flashFlipped
          ? `<h2>${escHtml(card.term)}</h2>`
          : `<p class="def-text">${escHtml(card.def)}</p>`
        }
      </div>
      ${flashFlipped ? `
        <div style="display:flex;gap:12px;margin-top:20px">
          <button class="pill pill-outline" style="border-color:#E74C3C;color:#E74C3C;padding:12px 28px;font-size:14px" onclick="flashMark(false)">Still Learning</button>
          <button class="pill-primary" style="background:#27AE60;padding:12px 28px;font-size:14px" onclick="flashMark(true)">Got It! \u2713</button>
        </div>` : ''}
    </div>`;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
