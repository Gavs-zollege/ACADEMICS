<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 14 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}.search-wrap input:focus{border-color:var(--red)}.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}.cat-btn:hover{opacity:.85}.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}.item:last-child{border-bottom:none}.item:hover{background:var(--surface2)}.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}.item-left{display:flex;align-items:center;gap:10px}.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}.item.open .item-bar{opacity:1}.item-term{font-size:20px;font-weight:700;color:#fff}.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}.item.open .item-def{display:block}.item.open .item-term{color:var(--red-light)}.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}.pg-btn:disabled{opacity:.3;cursor:default}.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}.pg-dot.active{background:var(--red-light);transform:scale(1.3)}.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 14 Glossary</h1>
  <p class="sub">Infection Control Practices</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Chain of Infection",color:"#E05555",terms:[
    {term:"Pathogen",def:"A microorganism — virus, bacterium, fungus, or parasite — capable of causing disease in a susceptible host."},
    {term:"Chain of Infection",def:"The six-link sequence that must be fully connected for a communicable disease to spread: (1) infectious agent, (2) reservoir."},
    {term:"Reservoir",def:"The environment in which a pathogen lives, multiplies, and survives long enough to be transmitted to a new host."},
    {term:"Portal of Exit",def:"The route by which a pathogen leaves its reservoir. Common portals of exit from the human body include respiratory secretions (..."},
    {term:"Mode of Transmission",def:"The mechanism by which a pathogen travels from the reservoir to a new host."},
    {term:"Portal of Entry",def:"The route by which a pathogen enters a new host. Common portals of entry include the mouth (ingestion), nose (inhalation)."},
    {term:"Susceptible Host",def:"A person who lacks adequate resistance to a specific pathogen and may develop infection if exposed."},
    {term:"Communicable Disease",def:"An infectious illness that can be transmitted from one person or source to another — directly or indirectly."},
    {term:"Sign vs. Symptom",def:"A sign is an objective, observable manifestation of illness that can be perceived and measured by others — fever."}
  ]},
  {name:"Standard, Universal & Trans-Based Precautions",color:"#6B7B8D",terms:[
    {term:"Universal Precautions",def:"A set of infection control practices that treat every patient's blood and certain body fluids as potentially infectious for blo..."},
    {term:"Standard Precautions",def:"The current CDC baseline for infection prevention — an expansion of universal precautions that applies to blood."},
    {term:"Contact Precautions",def:"Transmission-based precautions used when a patient is known or suspected to have an infection that spreads through direct or in..."},
    {term:"Droplet Precautions",def:"Transmission-based precautions for pathogens that spread through large respiratory droplets produced by coughing, sneezing."},
    {term:"Airborne Precautions",def:"The most restrictive transmission-based precautions — used when a pathogen can remain suspended in the air and spread across lo..."},
    {term:"Exposure Categories (I, II, III)",def:"OSHA's classification of job tasks by risk of bloodborne pathogen exposure."}
  ]},
  {name:"PPE (PPE)",color:"#8B6AAE",terms:[
    {term:"Personal Protective Equipment (PPE)",def:"Specialized clothing and equipment worn by healthcare professionals to protect themselves from exposure to blood, body fluids."},
    {term:"Donning",def:"The process of correctly putting on personal protective equipment before potential exposure."},
    {term:"Doffing",def:"The process of safely removing contaminated personal protective equipment after completing a task."},
    {term:"Non-Sterile Glove Doffing Technique",def:"Grasp the palm of the non-dominant glove with the dominant gloved hand and pull it off inside-out."},
    {term:"N95 Respirator",def:"A tight-fitting face mask that filters at least 95% of airborne particles."},
    {term:"Exposure Control Plan",def:"A written document, required by OSHA, detailing an employer's plan to protect employees from occupational exposure to bloodborn..."}
  ]},
  {name:"Hand Hygiene",color:"#E74C6F",terms:[
    {term:"Hand Hygiene",def:"The single most important and evidence-based practice for preventing the transmission of infectious diseases in healthcare sett..."},
    {term:"Medical Handwashing Technique",def:"Remove all jewelry except a plain band. Wet hands with lukewarm water, apply 3 mL (approximately 3 pumps) of soap."},
    {term:"Alcohol-Based Hand Sanitizer",def:"A hand hygiene product containing a minimum of 60% alcohol that can be used as an alternative to handwashing when hands are not..."},
    {term:"When Soap and Water Is Required",def:"Soap and water must be used — alcohol-based sanitizer is not sufficient — after contact with blood or body fluids."},
    {term:"Artificial Nails (Clinical Setting)",def:"Prohibited for healthcare professionals working in clinical settings."}
  ]},
  {name:"Asepsis & Disinfection",color:"#4A90B8",terms:[
    {term:"Asepsis",def:"The state of being free from pathogenic microorganisms."},
    {term:"Medical Asepsis (Clean Technique)",def:"A set of practices designed to reduce the number of pathogenic microorganisms in the environment and prevent their growth and s..."},
    {term:"Surgical Asepsis (Sterile Technique)",def:"The complete elimination of all microorganisms and their spores from instruments, equipment."},
    {term:"Sanitization",def:"The first step in instrument processing — the mechanical removal of visible debris (blood, body fluids."},
    {term:"Ultrasonic Sanitization",def:"A method of instrument cleaning that uses high-frequency sound waves to loosen and remove debris from instruments — rather than..."},
    {term:"Disinfection",def:"The process of destroying most pathogenic microorganisms on inanimate surfaces and instruments — but not bacterial spores."},
    {term:"Low-Level Disinfection",def:"Destroys most vegetative bacteria and some viruses and fungi."},
    {term:"Intermediate-Level Disinfection",def:"Destroys vegetative bacteria, most viruses, and fungi — but does not reliably kill bacterial spores."},
    {term:"High-Level Disinfection",def:"Destroys all microorganisms except a small number of bacterial spores."},
    {term:"Safety Data Sheet (SDS)",def:"A standardized document, required by OSHA for every chemical used in the workplace."}
  ]},
  {name:"Sterilization",color:"#1A8A7D",terms:[
    {term:"Sterilization",def:"The complete destruction of all living microorganisms — including resistant bacterial endospores — using physical or chemical m..."},
    {term:"Autoclave",def:"The primary sterilization method used in ambulatory healthcare settings."},
    {term:"Chemical Indicator Tape",def:"Autoclave tape applied to the outside of instrument packages before sterilization."},
    {term:"Internal Indicator Strip",def:"A chemical indicator strip placed inside the instrument package before autoclaving."},
    {term:"Biological Indicator",def:"The most stringent and definitive sterilization test — contains known quantities of viable bacterial spores (typically Geobacil..."},
    {term:"Sterilization Wrapping",def:"The packaging used to maintain sterility of instruments after autoclaving."},
    {term:"Sterile Package Shelf Life",def:"The period during which an autoclaved item is considered sterile."},
    {term:"Chemical Sterilization",def:"A sterilization method using chemical solutions for instruments that cannot tolerate autoclave heat — such as flexible endoscopes."}
  ]},
  {name:"Biohazard & OSHA",color:"#E2B94C",terms:[
    {term:"Biohazardous Waste",def:"Any waste material that contains or may contain infectious agents capable of causing disease — including blood, body fluids."},
    {term:"Sharps Container",def:"A rigid, puncture-proof, leak-proof, closable container specifically designed for the disposal of needles, lancets."},
    {term:"Biohazard Bag",def:"A leak-proof, labeled bag made of impermeable polyethylene or polypropylene used to dispose of soft contaminated waste — gloves."},
    {term:"Biohazard Box",def:"A larger, rigid biohazard-labeled container for bulkier contaminated items such as table covers, large disposable gowns."},
    {term:"Needle Safety and Prevention Act (2000)",def:"A federal law requiring healthcare facilities to use safety-engineered sharp devices that help prevent needlestick injuries."},
    {term:"Biohazard Symbol",def:"The internationally recognized warning symbol — a trefoil symbol in orange or red-orange — required on all containers, bags."},
    {term:"OSHA Bloodborne Pathogens Standard (1991)",def:"A federal regulation establishing legal requirements for protecting healthcare workers from occupational exposure to bloodborne..."}
  ]},
  {name:"Post-Exposure & QC",color:"#4CAF90",terms:[
    {term:"Exposure Incident",def:"A specific eye, mouth, mucous membrane, or non-intact skin contact — or a needlestick or sharps injury — involving blood."},
    {term:"Post-Exposure Follow-Up",def:"The employer-funded response required after an exposure incident."},
    {term:"Eyewash Station",def:"Emergency equipment providing a continuous, low-pressure stream of water for irrigating the eyes and face after a chemical or b..."},
    {term:"Sharps Injury Log",def:"A confidential record required by OSHA documenting each needlestick or sharps injury involving contaminated instruments."},
    {term:"Temperature Log",def:"A daily record of refrigerator and freezer temperatures in areas where vaccines, medications, blood specimens."},
    {term:"Quality Control (QC)",def:"The systematic process of monitoring and verifying the accuracy and reliability of laboratory testing."},
    {term:"Autoclave / Sterilization Log",def:"A record documenting each autoclave cycle — including the date, load contents, temperature reached, exposure time."}
  ]}
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
