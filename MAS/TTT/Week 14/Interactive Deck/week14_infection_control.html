s:center}.dot{height:5px;border-radius:3px;cursor:pointer;transition:all .3s}.dot.c{width:16px;background:var(--accent)}.dot.v{width:5px;background:var(--darkSub)}.dot.f{width:5px;background:rgba(0,0,0,.12)}.to{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center}.tp{background:#fff;border-radius:12px;padding:24px 20px;max-height:70vh;overflow-y:auto;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.tt{font-family:var(--ff);font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px}.ti{font-size:12px;padding:6px 10px;border-radius:5px;cursor:pointer;margin-bottom:1px;transition:all .15s}.ti:hover{background:var(--slideAlt)}.ti.a{color:var(--accent);background:var(--accentLight);font-weight:700}.ti .x{color:var(--textLight);margin-right:8px;font-weight:600;font-size:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.fr{display:flex;gap:16px}.cd{background:var(--slideAlt);border-radius:6px;padding:10px 12px}table{width:100%;border-collapse:collapse;font-size:10px}th{padding:5px 8px;text-align:left;font-weight:700;font-size:8px;letter-spacing:.5px;text-transform:uppercase}td{padding:5px 8px;font-size:10px;color:var(--text)}.thd th{background:var(--headerBg);color:#fff}tr.al{background:var(--slideAlt)}.tb{display:flex;gap:0;margin-bottom:10px;border-bottom:2px solid var(--border)}.tbtn{font-size:10px;font-weight:500;color:var(--textMid);background:none;border:none;border-bottom:3px solid transparent;padding:5px 10px;margin-bottom:-2px;transition:all .2s}.tbtn.a{font-weight:700;color:var(--accent)}.co{border-radius:6px;padding:8px 12px;border-left:3px solid}.co-a{background:var(--accentLight);border-color:var(--accent)}.co-w{background:var(--warmLight);border-color:var(--warm)}.co-am{background:var(--amberLight);border-color:var(--amber)}.co-b{background:var(--blueLight);border-color:var(--blue)}.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}.sb-s.a{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

<script>
const S=[{"id":0,"type":"title","title":"Keeping Patients Safe:\nInfection Control Practices","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Fourteen","tags":["Precautions","PPE","Hand Hygiene","Disinfection","Sterilization","Biohazard"],"fs":26},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Adhere to standard and universal precautions and infection control guidelines","Adhere to regulations and guidelines related to infectious diseases","Follow guidelines for PPE use, including correct donning and doffing","Adhere to hand hygiene guidelines","Perform disinfection and sanitization","Perform sterilization of medical equipment","Perform appropriate aseptic techniques for various clinical situations","Dispose of biohazardous materials correctly per OSHA guidelines","Follow post-exposure guidelines including needle safety and eyewash station use"]},{"id":2,"type":"cards","title":"The Chain of Infection","cols":3,"desc":"Break ANY link and transmission stops. Every infection control action targets one of these six links.","cards":[{"title":"1. Infectious Agent","desc":"The pathogen — virus, bacteria, fungus, or parasite that causes disease.","color":"#D94F4F"},{"title":"2. Reservoir","desc":"Where pathogen lives and multiplies — patients, exam tables, equipment.","color":"#E8853D"},{"title":"3. Portal of Exit","desc":"How pathogen leaves — body fluids, respiratory droplets, blood, skin.","color":"#B8860B"},{"title":"4. Mode of Transmission","desc":"How it travels — direct contact, indirect contact, droplet, or airborne.","color":"#4A90D9"},{"title":"5. Portal of Entry","desc":"How it enters — wounds, mouth, nose, eyes, intestines, urinary/reproductive tract.","color":"#3DAE8E"},{"title":"6. Susceptible Host","desc":"Person whose immune status, age, or health makes them vulnerable.","color":"#8B6FC0"}]},{"id":3,"type":"twocol","title":"Standard Precautions & PPE","lt":"Precautions & Exposure Categories","lc":"var(--warm)","li":[{"l":"Universal precautions","d":"Treat every patient as potentially infectious — blood, body fluids, human tissue."},{"l":"Contact precautions","d":"Gloves + gown for direct/indirect touch."},{"l":"Droplet precautions","d":"Mask + gloves for coughing/sneezing illnesses."},{"l":"Airborne precautions","d":"N95 + gown + negative pressure room (TB, measles, chickenpox)."},{"l":"Exposure categories","d":"Cat I: splash risk. Cat II: no usual risk but precautions needed. Cat III: no PPE."}],"rt":"PPE Equipment","rc":"var(--blue)","ri":[{"l":"Gloves","d":"Blood, body fluids, contaminated surfaces, injections, venipuncture. Nitrile for latex allergy."},{"l":"Gown","d":"When clothing/skin exposed to splashes — dressing changes, surgical assist."},{"l":"Mask/Respirator","d":"Surgical mask (droplet) or fit-tested N95 (airborne: TB, measles, varicella)."},{"l":"Goggles/Face Shield","d":"Blood, body fluid, or chemical splatter risk to eyes/nose/mouth."},{"l":"Employer obligations","d":"PPE at no cost. Written exposure control plan. Hep B vaccine within 10 days."}]},{"id":4,"type":"twocol","title":"Hand Hygiene — Most Important Action","lt":"Proper Handwashing Technique","lc":"var(--accent)","li":[{"l":"Remove jewelry","d":"Rings, bracelets, watches. No artificial nails in clinical settings."},{"l":"Wet hands, 3 pumps soap","d":"Lukewarm water. ~3 mL of soap."},{"l":"Lather 15–20 seconds","d":"Circular motions, interlace fingers, clean wrists. Friction lifts organisms."},{"l":"Focus on nails","d":"Microbes concentrate under/near nails. Fingertips lower than wrist."},{"l":"Rinse, dry, paper towel faucet","d":"Dry with paper towel. Turn off non-foot faucets with paper towel."}],"rt":"Sanitizer vs. Soap & Water","rc":"var(--blue)","ri":[{"l":"Sanitizer OK for","d":"Before/after patient contact, after contaminated surfaces (not visibly soiled), between body sites."},{"l":"Soap & water REQUIRED","d":"After blood/body fluids, before aseptic procedures, after glove removal."},{"l":"Also required","d":"Visibly soiled hands, after restroom, before/after eating."}]},{"id":5,"type":"twocol","title":"Sanitization, Disinfection & Sterilization","lt":"Sanitization & Disinfection Levels","lc":"var(--accent)","li":[{"l":"Sanitization","d":"Removes visible debris. Step 1 before disinfecting/sterilizing. Thick utility gloves."},{"l":"Low-level disinfection","d":"Most bacteria, some viruses/fungi. Exam tables, countertops. Hydrogen peroxide."},{"l":"Intermediate-level","d":"Bacteria, most viruses/fungi — not spores. Stethoscopes, BP cuffs. Isopropyl alcohol."},{"l":"High-level disinfection","d":"All microorganisms except some spores. Endoscopes. Cidex OPA (glutaraldehyde)."},{"l":"Cleaning order","d":"Hand hygiene → table paper → exam table → sink → countertop → keyboard."}],"rt":"Sterilization — Autoclave","rc":"var(--blue)","ri":[{"l":"Temperature/time","d":"250–270°F. Unwrapped: 20 min. Wrapped: 30 min."},{"l":"Wrapping","d":"Double-ply autoclave paper or peel-apart pouches. Hinged instruments open with gauze."},{"l":"Labeling","d":"Date, time, initials, instrument name. Indicator strip inside. Autoclave tape to seal."},{"l":"Sterile storage","d":"Dry, covered areas. Valid 30 days if intact, dry, undamaged."},{"l":"Indicators","d":"Chemical tape (outside), internal strip (inside), biological spores (most stringent QC)."}]},{"id":6,"type":"twocol","title":"Biohazard Disposal & Post-Exposure","lt":"Right Container Every Time","lc":"var(--warm)","li":[{"l":"Sharps container","d":"Needles, lancets, scalpel blades, broken glass, any sharp edge."},{"l":"Biohazard bag (red/orange)","d":"Gloves, gauze, dressings, table paper, disposable gowns."},{"l":"Biohazard box","d":"Larger contaminated items — table covers, bulky waste."},{"l":"Never recap used needles","d":"Drop directly into sharps container."},{"l":"Seal at fill line","d":"Replace when two-thirds full. Use needle safety devices."}],"rt":"Post-Exposure Steps","rc":"var(--blue)","ri":[{"l":"Immediately wash/flush","d":"Needlestick: soap and water. Splash: water. Eye: eyewash station."},{"l":"Report immediately","d":"Notify supervisor. 500K sharps exposures/year. Triggers medical eval."},{"l":"Incident form","d":"Confidential. Records maintained employment + 30 years."},{"l":"Medical evaluation","d":"Employer provides at no cost. Hep B vaccine offered. Written opinion in 15 days."},{"l":"Eyewash station","d":"Accessible in every lab. Monthly inspection. Staff must know location."}]},{"id":7,"type":"cards","title":"Safety Data Sheets & Logs","cols":2,"desc":"Every log is a legal compliance document. Inaccurate or missing entries put the facility, patients, and you at risk.","cards":[{"title":"SDS (Safety Data Sheets)","desc":"OSHA requires for every chemical. Hazard ID, first-aid measures, PPE required, spill cleanup, storage.","color":"#D94F4F"},{"title":"Temperature Log","desc":"Daily refrigerator (36–46°F) and freezer when meds/vaccines stored. Required for CLIA compliance.","color":"#4A90D9"},{"title":"Equipment Maintenance Log","desc":"Tracks routine servicing, calibration, repairs. Per manufacturer guidelines.","color":"#3DAE8E"},{"title":"Sharps Injury Log","desc":"OSHA required. Every needlestick documented. Confidential. Retained 5 years.","color":"#E8853D"},{"title":"Autoclave / Sterilization Log","desc":"Each cycle: date, contents, temp reached, cycle time, operator initials.","color":"#8B6FC0"},{"title":"QC / Reagent Control Log","desc":"Control sample results each time new supplies opened. Required for lab compliance.","color":"#B8860B"}]},{"id":8,"type":"takeaways","title":"Week Fourteen — Key Takeaways","items":["Breaking ANY link in the chain of infection stops transmission — every handwash, glove change, disinfected surface is a broken link.","Treat every patient as potentially infectious — universal precautions are not optional.","Soap and water is not interchangeable with sanitizer — after blood/body fluids and before aseptic procedures, only soap and water.","Sanitize first, then disinfect or sterilize — the process is less effective if visible debris isn't removed first.","Never recap a used needle — ever. Drop directly into sharps container immediately.","Wrapped autoclaved packages are sterile for 30 days if dry, intact, and stored correctly.","Post-exposure reporting must happen immediately — employer-funded medical evaluation is time-sensitive.","Every log you complete is a legal compliance document. Inaccurate or missing entries put everyone at risk."]},{"id":9,"type":"quiz","title":"Knowledge Check","questions":[{"q":"How many links are in the chain of infection?","options":["Four","Five","Six","Seven"],"correct":2,"explanation":"Six links: infectious agent, reservoir, portal of exit, mode of transmission, portal of entry, susceptible host."},{"q":"When is soap and water REQUIRED instead of hand sanitizer?","options":["Before patient contact","After touching a doorknob","After contact with blood or body fluids","Between examining two patients"],"correct":2,"explanation":"After blood/body fluids, before aseptic procedures, after glove removal — only soap and water."},{"q":"What is the minimum autoclave time for wrapped instruments?","options":["10 minutes","20 minutes","30 minutes","45 minutes"],"correct":2,"explanation":"Wrapped items: 30 minutes at 250–270°F. Unwrapped items: 20 minutes."},{"q":"N95 respirators are required for which precaution level?","options":["Standard","Contact","Droplet","Airborne"],"correct":3,"explanation":"Airborne precautions (TB, measles, varicella) require fit-tested N95 respirators."},{"q":"Sharps containers should be replaced when they reach:","options":["One-quarter full","Half full","Two-thirds full","Completely full"],"correct":2,"explanation":"Seal and replace when two-thirds full — never push items down to make more room."},{"q":"How long are wrapped sterilized packages considered sterile?","options":["7 days","14 days","30 days","90 days"],"correct":2,"explanation":"30 days if packaging stays intact, dry, and undamaged."}]},{"id":10,"type":"end","title":"End of Week Fourteen","subtitle":"Infection Control Practices","message":"Infection control is not a separate task — it's woven into every action you take. Every hand washed, every needle disposed, every surface disinfected protects a life."}];
const total=S.length;let cur=0;let st={};

function render(){document.getElementById('W').innerHTML=rS(S[cur]);document.getElementById('dots').innerHTML=S.map((_,i)=>`<div class="dot ${i===cur?'c':i<cur?'v':'f'}" onclick="go(${i})"></div>`).join('');document.getElementById('pB').disabled=cur===0;document.getElementById('nB').disabled=cur===total-1;document.getElementById('tocL').innerHTML=S.map((s,i)=>`<div class="ti ${i===cur?'a':''}" onclick="go(${i});closeTOC()" style="color:${i===cur?'var(--accent)':'var(--textMid)'}"><span class="x">${String(i+1).padStart(2,'0')}</span>${e(s.title)}</div>`).join('')}
function rs(){st={objShown:new Set([0]),t0:0,t1:0,t2:0,t3:0,t4:0,stp:0,takeaways:{},qi:0,qs:null,qa:false,qsc:0,qd:false}}rs();
function H(i,t){return `<div class="sh"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${e(t)}</div></div>`}
function F(i){return `<div class="ft"><span class="l">Medical Assistant Program • Week 14</span><span class="r">${i+1} / ${total}</span></div>`}
function rS(s){const m={title:rTitle,objectives:rObj,cards:rCards,twocol:rTC,table:rTbl,tab:rTab,takeaways:rTake,quiz:rQuiz,end:rEnd,step:rStep};return m[s.type]?m[s.type](s,s.id):''}

function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:${s.objectives.length>12?'2':'3'}px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}" style="min-width:${s.objectives.length>12?'20':'22'}px;height:${s.objectives.length>12?'20':'22'}px;font-size:${s.objectives.length>12?'9':'10'}px">${j+1}</div><div style="font-size:${s.objectives.length>12?'9':'10'}px;color:var(--text);line-height:1.35;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:3px;font-style:italic">Click to reveal</p>':''}</div>${F(i)}</div>`}
function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb">${s.desc?`<p style="font-size:10px;color:var(--textMid);margin:0 0 8px">${e(s.desc)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:7px">${s.cards.map(c=>`<div class="cd" style="border-${c.b||'left'}:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div>${s.note?`<div class="co co-${s.nt||'a'}" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${s.note?`<div style="font-size:9px;color:var(--textMid);font-style:italic;margin-top:4px">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[9].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[9].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
