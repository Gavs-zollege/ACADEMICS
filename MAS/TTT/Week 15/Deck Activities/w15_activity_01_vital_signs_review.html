<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vital Signs Review</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0b1e2d,#0f2a3d,#162040);font-family:'Nunito',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#2dd4bf;font-weight:800;font-size:14px}.bar{height:6px;background:#1a3d50;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#2dd4bf,#fb7185);border-radius:10px;transition:width .4s}.question{background:#112d3f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #2dd4bf}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1a3d50;border:2px solid #1a3d50;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#2dd4bf;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#112d3f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#112d3f;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#2dd4bf;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">❤️</div><h1>Vital Signs Review</h1><p class="sub">CCMA Domain 1: Clinical fundamentals</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Normal adult resting heart rate is:",opts:["40–60 bpm","60–100 bpm","100–120 bpm","80–110 bpm"],a:1,tip:"60–100 bpm. Brady- = <60. Tachy- = >100. Radial artery most common site."},{q:"Stage 1 hypertension is defined as:",opts:["<120/80","120–129/<80","130–139/80–89","≥140/90"],a:2,tip:"Stage 1: 130–139/80–89. Stage 2: ≥140/90. Normal: <120/80."},{q:"The most accurate temperature method is:",opts:["Oral","Tympanic","Rectal","Axillary"],a:2,tip:"Rectal > temporal > tympanic > oral > axillary (least accurate)."},{q:"SpO2 below ___% is considered critical.",opts:["98","95","90","85"],a:2,tip:"<95% warrants intervention. <90% is critical. Nail polish and cold affect readings."},{q:"A headache is an example of a:",opts:["Objective finding","Vital sign","Subjective symptom — reported by the patient","Diagnosis"],a:2,tip:"Subjective = patient-reported (pain, nausea, dizziness). Objective = measurable (BP, temp, rash)."},{q:"Blood pressure is measured with the patient:",opts:["Standing","Seated, arm at heart level, rested 5 minutes","Lying flat","Walking"],a:1,tip:"Seated, arm supported at heart level, rested 5 min. First Korotkoff = systolic, last = diastolic."},{q:"Pain is assessed using:",opts:["Blood pressure readings","Patient self-rating 0–10 scale","Temperature","Respiratory rate"],a:1,tip:"Pain is subjective. Use 0–10 numeric scale or Wong-Baker FACES for children."},{q:"Respiratory rate should be counted:",opts:["While telling the patient you are counting","Without telling the patient to prevent altered breathing","Only for 15 seconds","With a stethoscope always"],a:1,tip:"Count without telling patient. 30 sec × 2 or full minute. Normal: 12–20."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Keep reviewing — you are getting CCMA exam ready!</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
