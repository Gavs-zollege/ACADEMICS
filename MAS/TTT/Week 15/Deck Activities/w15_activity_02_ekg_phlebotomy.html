<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EKG & Phlebotomy Review</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1a0a0f,#28101a,#180a18);font-family:'DM+Sans',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#fb7185;font-weight:800;font-size:14px}.bar{height:6px;background:#351828;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#fb7185,#fb7185);border-radius:10px;transition:width .4s}.question{background:#28101a;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #fb7185}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#351828;border:2px solid #351828;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#fb7185;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#28101a}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#28101a;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#fb7185;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🩸</div><h1>EKG & Phlebotomy Review</h1><p class="sub">CCMA Domain 1: Specimens & diagnostics</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"EKG lead V1 is placed at:",opts:["Left midclavicular, 5th ICS","Right of sternum, 4th ICS","Left of sternum, 4th ICS","Mid-axillary, 5th ICS"],a:1,tip:"V1 = right of sternum, 4th ICS. V4 = left midclavicular, 5th ICS. Place V4 before V3."},{q:"The correct venipuncture order of draw after cultures is:",opts:["Red, green, lavender, blue","Blue, red, green, lavender, gray","Green, blue, red, lavender","Lavender, red, blue, green"],a:1,tip:"Sterile → Blue → Red → Green → Lavender → Gray. Blue BEFORE red."},{q:"The vein of first choice for venipuncture is:",opts:["Cephalic","Basilic","Median cubital","Dorsal hand"],a:2,tip:"Median cubital — least painful, least likely to roll. Check both arms."},{q:"For a clean-catch midstream UA, the patient should:",opts:["Collect the first stream","Clean area, void a small amount, then collect the middle stream","Fill the container completely","Collect the last stream only"],a:1,tip:"Clean → void into toilet → collect midstream in sterile container."},{q:"HbA1c monitors glucose control over:",opts:["24 hours","1 week","3 months — does NOT require fasting","1 year"],a:2,tip:"3-month average glucose. No fasting required. Used to monitor diabetes management."},{q:"24-hour urine collection: the first morning void is:",opts:["Collected first","Discarded — then collect everything after for 24 hours","The most important sample","Tested separately"],a:1,tip:"Discard first void. Collect ALL urine for the next 24 hours. Keep refrigerated."},{q:"A capillary draw requires wiping away the first drop because:",opts:["It is too thick","It contains tissue fluid that contaminates the sample","It clots too fast","The lancet is not sterile"],a:1,tip:"First drop = tissue fluid contamination. Test with the second drop."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Keep reviewing — you are getting CCMA exam ready!</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
