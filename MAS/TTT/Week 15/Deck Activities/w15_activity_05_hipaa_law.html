<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>HIPAA & Law Review</title><link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a0e1e,#101830,#0a1020);font-family:'Rubik',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#fbbf24;font-weight:800;font-size:14px}.bar{height:6px;background:#182040;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#fb7185);border-radius:10px;transition:width .4s}.question{background:#101830;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #fbbf24}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#182040;border:2px solid #182040;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#fbbf24;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#101830}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#101830;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#fbbf24;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">⚖️</div><h1>HIPAA & Law Review</h1><p class="sub">CCMA Domain 4: Privacy, consent & reporting</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Which is NOT a HIPAA violation?",opts:["Sharing info without consent","Discussing patient in public area","Filing records in a secure location","Accessing records without authorization"],a:2,tip:"Secure filing = compliance. Public discussion = violation. Unauthorized access = violation."},{q:"Accidental PHI disclosure — MA should:",opts:["Do nothing","Report breach to supervisor immediately","Apologize to patient only","Ignore if unintentional"],a:1,tip:"Report immediately regardless of intent. Document the breach."},{q:"Informed consent requires:",opts:["Just a signature","Competent patient + full information + voluntary agreement","Verbal agreement only","Family consent"],a:1,tip:"Three elements: competence, complete information (risks/benefits/alternatives), voluntary."},{q:"DPOA (Durable Power of Attorney):",opts:["Specifies treatments directly","Names a PERSON to make decisions when patient cannot","Is the same as a living will","Expires after 1 year"],a:1,tip:"DPOA names an agent. Living will specifies treatments. Neither expires without revocation."},{q:"Mandatory reporting of suspected abuse requires:",opts:["Proof of abuse before reporting","Only suspicion — certainty is not required","A court order","Patient permission"],a:1,tip:"Report SUSPICION. Good-faith reporters are legally protected."},{q:"When a patient refuses treatment, the MA should:",opts:["Convince them to comply","Document refusal and inform the physician immediately","Ignore the refusal","Call the family"],a:1,tip:"Document fully in the record. Notify the provider. Never proceed without consent."},{q:"Minors can consent independently for:",opts:["All procedures","STI treatment, birth control, pregnancy care, substance abuse treatment","Only emergencies","Only dental care"],a:1,tip:"Limited exceptions allow minor consent. Verify state-specific requirements."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Keep reviewing — you are getting CCMA exam ready!</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
