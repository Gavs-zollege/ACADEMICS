<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Ethics & Professionalism</title><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#14082a,#1c1040,#100828);font-family:'Lexend',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#f472b6;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#f472b6,#fb7185);border-radius:10px;transition:width .4s}.question{background:#1c1040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #f472b6}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#f472b6;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f472b6;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🧭</div><h1>Ethics & Professionalism</h1><p class="sub">CCMA Domain 4: Principles & scope of practice</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Nonmaleficence means:",opts:["Do the most good","First, do no harm","Respect patient decisions","Treat all fairly"],a:1,tip:"Nonmaleficence = do no harm. Beneficence = do the most good."},{q:"When unsure how to perform a procedure, you should:",opts:["Ask a colleague","Consult the supervising provider — never guess","Try your best","Look it up online"],a:1,tip:"Always consult the supervising provider. Never guess. Scope of practice."},{q:"A colleague makes a derogatory comment about a patient. You should:",opts:["Ignore it","Report to supervisor or manager","Join in","Tell the patient"],a:1,tip:"Report unprofessional behavior. Never ignore it."},{q:"Autonomy in medical ethics means:",opts:["The provider decides everything","Patients make their own decisions free of coercion","Insurance determines treatment","The hospital sets all rules"],a:1,tip:"Autonomy = patient self-determination. Provide info, let them decide."},{q:"Justice in healthcare means:",opts:["Punishing bad providers","Fair, consistent care — similar patients get similar treatment","Only treating insured patients","Following orders without question"],a:1,tip:"Justice = equitable care. Resources distributed fairly."},{q:"The MA scope of practice is defined by:",opts:["The MA themselves","State law and organizational policy — under physician supervision","Other MAs in the office","The insurance company"],a:1,tip:"State law + facility policy + physician supervision. Varies by state."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Keep reviewing — you are getting CCMA exam ready!</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
