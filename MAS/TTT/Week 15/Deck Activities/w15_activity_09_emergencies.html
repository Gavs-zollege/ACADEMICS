<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Emergencies & Care Review</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1a0808,#2a1010,#180808);font-family:'Plus+Jakarta+Sans',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#ef4444;font-weight:800;font-size:14px}.bar{height:6px;background:#301818;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#ef4444,#fb7185);border-radius:10px;transition:width .4s}.question{background:#221010;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #ef4444}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#301818;border:2px solid #301818;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#ef4444;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#221010}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#221010;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#ef4444;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🚨</div><h1>Emergencies & Care Review</h1><p class="sub">CCMA Domain 1: First aid & wound care</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"During a seizure, NEVER:",opts:["Clear the area","Put anything in the patient's mouth","Turn them on their side after","Call for help"],a:1,tip:"NEVER put anything in the mouth. NEVER restrain. Protect, clear, side-position after."},{q:"Anaphylaxis first response:",opts:["Give aspirin","Administer epinephrine + call 911","Apply ice","Wait and observe"],a:1,tip:"Epinephrine IM + 911 immediately. Anaphylaxis is life-threatening within minutes."},{q:"Fire emergency protocol R.A.C.E. stands for:",opts:["Run, Alert, Call, Exit","Rescue, Alarm, Confine, Extinguish/Evacuate","Report, Assess, Control, Evaluate","React, Act, Contain, Escape"],a:1,tip:"Rescue → Alarm → Confine (close doors) → Extinguish or Evacuate."},{q:"Heavy bleeding from a laceration — first action:",opts:["Apply a tourniquet immediately","Apply direct pressure with a sterile dressing","Elevate without pressure","Clean the wound first"],a:1,tip:"Direct pressure first. Firm, continuous. Add gauze on top if saturated. Then elevate."},{q:"Third-degree burns destroy:",opts:["Only the epidermis","Epidermis and dermis","The entire skin layer — no pain (nerve damage)","Only subcutaneous fat"],a:2,tip:"Full thickness: all skin layers destroyed. No pain (nerves damaged). White/leathery/charred."},{q:"Dressings are ___ and bandages are ___.",opts:["Non-sterile; sterile","Sterile; non-sterile — dressing touches wound, bandage covers it","Interchangeable","Both sterile"],a:1,tip:"Dressing = sterile, touches wound. Bandage = non-sterile, covers dressing. Never reverse."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Keep reviewing — you are getting CCMA exam ready!</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
