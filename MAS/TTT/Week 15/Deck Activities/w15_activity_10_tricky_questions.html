<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Commonly Missed Questions</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a1628,#0e1d38,#081428);font-family:'Fredoka',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#60a5fa;font-weight:800;font-size:14px}.bar{height:6px;background:#1a3060;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#fb7185);border-radius:10px;transition:width .4s}.question{background:#112240;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #60a5fa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1a3060;border:2px solid #1a3060;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#60a5fa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#112240}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#112240;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#60a5fa;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🏆</div><h1>Commonly Missed Questions</h1><p class="sub">The trickiest CCMA exam topics — know these cold</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Which vessel carries oxygenated blood FROM lungs TO heart?",opts:["Pulmonary artery","Pulmonary vein","Aorta","Superior vena cava"],a:1,tip:"Pulmonary VEIN = oxygenated, TO heart. Most commonly missed question."},{q:"Order of draw: which comes FIRST — blue or red?",opts:["Red before blue","Blue before red (coagulation tubes first)","They can be in any order","Green before both"],a:1,tip:"Blue BEFORE red. Coagulation tubes must be drawn before chemistry tubes."},{q:"ID injection angle is ___, not ___.",opts:["45°, not 90°","90°, not 45°","10–15°, not 45°","30°, not 15°"],a:2,tip:"ID = 10–15°. SC = 45°. IM = 90°. One of the most commonly reversed answers."},{q:"HbA1c requires fasting.",opts:["True","False — it monitors 3-month average, no fasting needed","Only for Type 1 diabetes","Only if glucose is high"],a:1,tip:"HbA1c does NOT require fasting. It measures 3-month glucose average."},{q:"Filing records in a secure location is a HIPAA violation.",opts:["True","False — secure filing is compliance, not a violation","Only for electronic records","Depends on the state"],a:1,tip:"Secure filing = proper compliance. Discussing patients in public = violation."},{q:"When unsure about a procedure, the correct action is:",opts:["Ask a colleague","Consult the supervising provider","Try your best","Look it up online during the procedure"],a:1,tip:"Always consult the supervising provider. Not just a colleague. Never guess."},{q:"For language barriers, the best approach is:",opts:["Speak louder and slower","Use a professional interpreter — never family for clinical translation","Use gestures only","Skip the explanation"],a:1,tip:"Professional interpreter required. Never use family members for clinical translation."},{q:"Myocardial infarction means:",opts:["Heart inflammation","Heart attack — death of heart muscle tissue","Heart murmur","Slow heart rate"],a:1,tip:"MI = heart attack. Myocarditis = inflammation. Don't confuse -itis with infarction."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Keep reviewing — you are getting CCMA exam ready!</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
