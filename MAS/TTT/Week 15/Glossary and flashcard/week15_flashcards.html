<title>Week 15 Flashcards — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;0,9..40,900;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #e4e4f0;
    --text-secondary: #9898b0;
    --surface-1: #1c1c2e;
    --surface-2: #282840;
    --border: #363650;
    --bg: #0d0d1a;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.35);
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-display: 'Playfair Display', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: #C0392B; margin-bottom: 6px;
  }
  .header h1 {
    font-family: var(--font-display); font-size: 32px; font-weight: 900;
    letter-spacing: -1px; margin-bottom: 6px; line-height: 1.1;
  }
  .header p { font-size: 13px; color: var(--text-secondary); }
  .flashcard {
    width: 100%; max-width: 500px; min-height: 250px; border-radius: 22px;
    cursor: pointer; padding: 34px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12); transition: all .35s cubic-bezier(.4,0,.2,1);
    user-select: none; position: relative; margin: 0 auto;
  }
  .flashcard .label {
    position: absolute; top: 16px; left: 20px; font-size: 11px;
    font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; opacity: .7;
  }
  .flashcard .hint {
    position: absolute; top: 16px; right: 20px; font-size: 11px; opacity: .5;
  }
  .flashcard h2 {
    margin: 0; font-family: var(--font-display); font-size: 26px;
    font-weight: 900; line-height: 1.2; letter-spacing: -.5px;
  }
  .flashcard .def-text {
    margin: 0; font-size: 15px; line-height: 1.65; color: var(--text-secondary);
  }
  .progress-bar {
    height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 6px; transition: width .3s;
  }
  .pill {
    padding: 8px 16px; border-radius: 24px; font-weight: 700;
    cursor: pointer; font-size: 13px; transition: all .2s; font-family: var(--font-body);
  }
  .pill-primary {
    border: none; color: #fff; padding: 13px 34px; font-size: 15px;
    border-radius: 30px; letter-spacing: .3px;
  }
  .pill-outline {
    background: transparent; border: 2px solid;
  }
  .chip {
    padding: 8px 14px; border-radius: 20px; border: 2px solid;
    font-weight: 600; cursor: pointer; font-size: 13px; transition: all .2s;
    font-family: var(--font-body); white-space: nowrap;
  }
  .flex-center { display: flex; align-items: center; justify-content: center; }
  .text-center { text-align: center; }
  .mt-8 { margin-top: 8px; } .mt-12 { margin-top: 12px; } .mt-16 { margin-top: 16px; }
  .mt-20 { margin-top: 20px; } .mt-24 { margin-top: 24px; }
  .mb-6 { margin-bottom: 6px; } .mb-12 { margin-bottom: 12px; } .mb-16 { margin-bottom: 16px; }
  .mb-20 { margin-bottom: 20px; } .mb-24 { margin-bottom: 24px; }
  .gap-4 { gap: 4px; } .gap-6 { gap: 6px; } .gap-8 { gap: 8px; } .gap-12 { gap: 12px; }
  .hidden { display: none !important; }
</style>

<body>
<div class="app" id="app">
  <div class="header">
    <div class="header-tag">Medical Assistant Program</div>
    <h1>Week 15 Flashcards</h1>
    <p id="header-subtitle"></p>
  </div>
  <div id="flash-mode"></div>
</div>
<script>
const CATEGORIES = [
  {
    name: "Vital Signs & Clinical Measurements", emoji: "❤️", color: "#C0392B",
    terms: [
      { term: "Vital Signs", def: "The four primary physiologic measurements that indicate the basic functioning of the body: heart rate (pulse), blood pressure, respiratory rate, and body temperature. Oxygen saturation (SpO2) and pain are widely considered the fifth and sixth vital signs. Vital signs provide essential baseline data and identify changes in a patient's condition over time." },
      { term: "Heart Rate (Pulse)", def: "The number of times the heart beats per minute, typically measured at the radial artery on the wrist. Normal adult range: 60–100 beats per minute. Bradycardia = below 60 bpm. Tachycardia = above 100 bpm. Always document rate, rhythm (regular or irregular), and strength (strong, weak, or thready). Use the apical site when a radial pulse is irregular." },
      { term: "Bradycardia", def: "A resting heart rate below 60 beats per minute in an adult. May be normal in well-trained athletes. In clinical settings, bradycardia may indicate cardiac dysfunction, medication effects, or vagal stimulation. The prefix brady- means slow." },
      { term: "Tachycardia", def: "A resting heart rate above 100 beats per minute in an adult. May result from fever, pain, dehydration, anxiety, medications, or cardiac conditions. The prefix tachy- means fast. A pulse of 130 bpm is tachycardia, not a normal finding." },
      { term: "Blood Pressure", def: "The force of blood against arterial walls. Recorded as systolic (heart contracting) over diastolic (heart relaxing), expressed in mmHg. Normal adult: less than 120/80 mmHg. Stage 1 HTN: 130–139/80–89. Stage 2 HTN: ≥140/90. Hypotension: systolic below 90 mmHg. The first Korotkoff sound heard = systolic; the last sound heard = diastolic." },
      { term: "Korotkoff Sounds", def: "The sounds heard through a stethoscope while measuring blood pressure with a sphygmomanometer. Five phases: Phase 1 = first sound heard (sharp tapping) = systolic pressure. Phase 5 = sound disappears completely = diastolic pressure. Produced by turbulent blood flow as the cuff is slowly deflated." },
      { term: "Respiratory Rate", def: "The number of breaths taken per minute. Normal adult range: 12–20 breaths per minute. Tachypnea = above 20. Bradypnea = below 12. Apnea = cessation of breathing. Always count without telling the patient — announcing the count causes the patient to consciously alter their breathing pattern, producing inaccurate results." },
      { term: "Body Temperature", def: "The measurement of the body's heat. Normal oral average: 98.6°F (37°C). Normal range: 97.0–99.0°F. Accuracy order (most to least accurate): rectal > temporal artery > tympanic > oral > axillary. Fever (pyrexia) = temperature above 100.4°F. Hypothermia = temperature below 95°F." },
      { term: "Pulse Oximetry (SpO2)", def: "A noninvasive measurement of blood oxygen saturation using a pulse oximeter sensor typically placed on the finger or toe. Normal adult range: 95–100%. Below 95% warrants intervention; below 90% is a critical value requiring immediate action. Factors that reduce accuracy include nail polish, cold extremities, poor perfusion, and carbon monoxide poisoning." },
      { term: "Pain Scale", def: "A standardized tool used to assess and document a patient's subjective pain experience. The numeric scale (0–10) is most commonly used in adult care — 0 = no pain, 10 = worst possible pain. The Wong-Baker FACES scale uses illustrated faces and is appropriate for children or patients who cannot communicate numerically. Pain is considered the fifth vital sign." },
    ],
  },
  {
    name: "EKG & Cardiovascular Testing", emoji: "📈", color: "#2471A3",
    terms: [
      { term: "12-Lead EKG (Electrocardiogram)", def: "A diagnostic test that records the heart's electrical activity from 12 different perspectives using 10 electrodes placed on the skin (4 limb leads and 6 chest/precordial leads). Produces 12 distinct views of the heart's electrical conduction system. Used to detect arrhythmias, myocardial infarction, and conduction abnormalities." },
      { term: "Precordial (Chest) Leads", def: "The six chest electrodes placed in specific anatomical positions to record the heart's electrical activity in the horizontal plane. V1: right of the sternum, 4th intercostal space. V2: left of the sternum, 4th ICS. V3: between V2 and V4. V4: left midclavicular line, 5th ICS. V5: anterior axillary line, 5th ICS. V6: midaxillary line, 5th ICS." },
      { term: "Limb Leads", def: "The four electrodes placed on the extremities for a 12-lead EKG. RA: right arm. LA: left arm. RL: right leg (ground electrode). LL: left leg. These four electrodes produce 6 of the 12 leads (I, II, III, aVR, aVL, aVF). The right leg electrode is the ground and does not generate a lead on its own." },
      { term: "Intercostal Space (ICS)", def: "The space between two adjacent ribs, numbered by the rib above it. Used as anatomical landmarks for placing precordial EKG electrodes. The 4th and 5th intercostal spaces along the left chest are the primary reference points for V1 through V6 lead placement." },
      { term: "EKG Artifact", def: "Unwanted interference or noise in an EKG tracing that makes interpretation difficult or impossible. Common causes: patient movement or shivering, loose or poorly attached electrodes, dry electrode gel, electrical interference from nearby equipment, and incorrect lead placement. Prevented by ensuring good skin contact, correct placement, and instructing the patient to lie still." },
      { term: "Cardiac Conduction System", def: "The specialized electrical system that coordinates the heartbeat. SA node (sinoatrial node) = the heart's natural pacemaker, located in the right atrium. AV node = delays the signal before it passes to the ventricles. Bundle of His, left and right bundle branches, and Purkinje fibers complete transmission to the ventricular muscle." },
      { term: "Myocardial Infarction (MI)", def: "The medical term for a heart attack — complete or near-complete blockage of a coronary artery causing death of heart muscle tissue due to oxygen deprivation. NOT the same as myocarditis (inflammation of the heart muscle). Key distinction: -itis means inflammation; infarction means tissue death from loss of blood supply." },
    ],
  },
  {
    name: "Phlebotomy & Specimen Collection", emoji: "🩸", color: "#7D3C98",
    terms: [
      { term: "Venipuncture", def: "The clinical procedure of puncturing a vein with a needle to obtain a blood sample for laboratory testing. The median cubital vein in the antecubital fossa (elbow crease) is the vein of choice for most adults. The cephalic and basilic veins are acceptable alternatives. The patient should be seated with the arm fully extended and supported on a flat surface." },
      { term: "Order of Draw", def: "The required sequence in which blood collection tubes must be filled during venipuncture to prevent cross-contamination of additives between tubes. Standard order: sterile (blood cultures) → light blue (sodium citrate, coagulation) → red/gold SST (serum separator) → green (heparin) → lavender/purple (EDTA, CBC) → gray (sodium fluoride, glucose). Mnemonic: Stop Looking Right Now Later." },
      { term: "Antecubital Fossa", def: "The triangular hollow at the bend of the elbow, which contains the median cubital vein, cephalic vein, and basilic vein. This is the preferred site for venipuncture in adults due to the accessibility, size, and stability of these veins. Also called the elbow crease." },
      { term: "Capillary Blood Draw (Fingerstick)", def: "A method of obtaining a small blood sample by puncturing the capillaries in the fingertip with a lancet. Performed on the side of the fingertip in adults. The heel is used for infants. The first drop of blood must be wiped away — it may be diluted with tissue fluid and give inaccurate results. Clean the site with alcohol and allow it to dry completely before lancing." },
      { term: "Clean-Catch Midstream Urine (CCMU)", def: "A method of collecting a urine specimen that minimizes contamination from bacteria on the skin. Procedure: clean the genital area with a sterile wipe → void a small amount into the toilet to flush out urethral bacteria → collect the middle portion of the urinary stream in the sterile container → seal and label the container immediately." },
      { term: "24-Hour Urine Collection", def: "A method of collecting all urine produced over a 24-hour period to measure total output of a substance (such as creatinine, protein, or hormones). Instructions: discard the very first morning void → collect ALL urine for the next 24 hours → keep the container refrigerated throughout → return the entire container for testing at the end of the collection period." },
      { term: "Fasting Blood Glucose (FBG)", def: "A blood glucose test performed after the patient has fasted for 8–12 hours. Water is permitted; all caloric food and beverages must be avoided. A fasting glucose level above 126 mg/dL on two separate occasions meets the diagnostic criteria for diabetes mellitus. Different from HbA1c, which does not require fasting." },
      { term: "Hemoglobin A1c (HbA1c)", def: "A blood test that reflects the average blood glucose level over the preceding 2–3 months by measuring the percentage of hemoglobin that has glucose attached to it. Used to monitor long-term glucose control in patients with diabetes. Does NOT require fasting. An HbA1c of 6.5% or above on two occasions meets the diagnostic threshold for diabetes." },
      { term: "Throat Culture", def: "A diagnostic specimen collected by swabbing the posterior pharynx and tonsillar pillars to detect the presence of Group A Streptococcus bacteria (the cause of strep throat). The swab must contact the back of the throat — avoid the tongue, teeth, lips, and inner cheeks, which would contaminate the specimen with normal oral flora." },
    ],
  },
  {
    name: "Injections & Medication Administration", emoji: "💊", color: "#C2185B",
    terms: [
      { term: "Intradermal (ID) Injection", def: "An injection administered into the superficial layers of the dermis (skin). Technique: bevel up, 10–15° angle. Needle: 25–27 gauge, ¼–½ inch. Volume: ≤0.1 mL. A raised wheal (bleb) must form to confirm correct placement. Used for TB skin testing (Mantoux test) and allergy testing. Do NOT massage after — this disperses the antigen and invalidates the test." },
      { term: "Subcutaneous (SC/SQ) Injection", def: "An injection administered into the fatty tissue layer beneath the skin. Technique: 45° angle, pinch 1 inch of skin before inserting. Needle: 23–25 gauge, 5/8 inch. Volume: ≤1.5 mL. Common sites: upper outer arm, abdomen, and upper thigh. Used for insulin, low-molecular-weight heparins, and some vaccines. Rotate insulin injection sites within the same region to prevent lipodystrophy." },
      { term: "Intramuscular (IM) Injection", def: "An injection administered deep into muscle tissue to allow rapid absorption of the medication into the bloodstream. Technique: 90° angle, stretch the skin taut, insert in a smooth dart-like motion. Needle: 22–25 gauge, 1–1½ inch. Volume: up to 3 mL. Deltoid (adults ≤1 mL); vastus lateralis (preferred for infants and children under 3, ≤3 mL); ventrogluteal (adults, ≤3 mL)." },
      { term: "Needle Gauge", def: "The size of the needle's interior opening (lumen), expressed as a number. Higher gauge number = smaller opening. 18 gauge is larger than 25 gauge. Gauge is selected based on the viscosity of the medication and the type of injection. Thicker medications (such as some vaccines and hormonal injections) require a larger-bore (lower gauge number) needle." },
      { term: "Nine Rights of Medication Administration", def: "A safety checklist performed before every medication administration: (1) Right Patient — two identifiers (name and date of birth). (2) Right Medication — three label checks. (3) Right Form — tablet, liquid, injectable. (4) Right Dose — calculate and verify. (5) Right Route — oral, IM, SQ, etc. (6) Right Time. (7) Right Technique. (8) Right Education — explain the medication to the patient. (9) Right Documentation — always document AFTER administration, never before." },
      { term: "Three Label Checks", def: "A medication safety practice requiring the MA to verify the medication label against the prescription three times: (1) when removing the medication from storage, (2) when preparing the dose, and (3) when returning the container to storage or discarding it. Also check the expiration date at every check. Never administer expired medication." },
      { term: "Medication Administration Record (MAR)", def: "The legal, permanent record of all medications administered to a patient. Must be completed every time a medication is given and must include: date, time, drug name, dose, route, provider's name, frequency, and patient allergies. Document any adverse reactions. If a medication was not given, document the reason. Always document AFTER giving the medication — never in advance." },
      { term: "Look-Alike/Sound-Alike (LASA) Medications", def: "Medications with names or packaging that closely resemble other medications, creating a significant risk of administration errors. High-risk pairs: clonidine ↔ KlonoPIN (clonazepam brand), hydroxyzine ↔ hydralazine, hydrocodone ↔ hydromorphone. Prevention: use tall-man lettering (hydrOXYzine vs. hydrALAzine), perform triple label checks, store LASA drugs in separate locations, and never abbreviate medication names." },
      { term: "Transdermal Patch", def: "A drug delivery system in which medication is absorbed through the skin over an extended period. Apply to clean, dry, hair-free skin — avoid bony prominences, skin folds, and areas of friction. Rotate application sites with each new patch. Remove the old patch before applying a new one. Wash hands before and after application. Used for hormone therapy, pain management, nicotine replacement, and cardiac medications." },
    ],
  },
  {
    name: "Pharmacology & Dosage Calculations", emoji: "💊", color: "#D68910",
    terms: [
      { term: "Pharmacokinetics (ADME)", def: "The study of how the body processes a medication through four phases: Absorption (drug moves from administration site into bloodstream — IV is fastest, oral is slowest), Distribution (bloodstream carries drug to tissues — blood-brain and placental barriers may limit delivery), Metabolism (liver converts active drug to metabolites — rate is affected by age, organ health, and genetics), and Excretion (kidneys eliminate metabolites through urine — impaired kidney function may require dose adjustment)." },
      { term: "Controlled Substances Act (CSA)", def: "A federal law that classifies substances with potential for abuse into five schedules based on their medical use and abuse potential. Enforced by the Drug Enforcement Administration (DEA). Schedule I has the highest abuse potential and no accepted medical use (heroin, LSD). Schedule II has high abuse risk with accepted medical use and requires hand-signed prescriptions, locked storage, and no refills (oxycodone, fentanyl, amphetamine)." },
      { term: "Desired-Over-Have Formula", def: "A dosage calculation method: (Desired dose ÷ Dose on hand) × Quantity = Amount to give. Example: ordered 50 mg; on hand is 25 mg per capsule → (50 ÷ 25) × 1 = 2 capsules. This formula works for oral solids and liquids. Always verify the calculation before preparing the medication and never estimate or round without a provider order to do so." },
      { term: "Metric System (Medication)", def: "The standard measurement system used for medications. Weight units: kg (kilogram) → g (gram) → mg (milligram) → mcg (microgram). Each step is a factor of 1,000. To convert to a smaller unit, multiply by 1,000 (move decimal right three places). To convert to a larger unit, divide by 1,000 (move decimal left three places). Volume units: L (liter) → mL (milliliter). 1 L = 1,000 mL." },
      { term: "Standard (Household) Conversions", def: "Common measurement equivalencies used for oral liquid medications: 1 teaspoon (tsp) = 5 mL │ 1 tablespoon (tbsp) = 15 mL │ 1 fluid ounce = 30 mL │ 1 cup = 240 mL │ 2.2 pounds = 1 kilogram. Memorize these for the exam — they appear frequently in dosage calculation questions." },
      { term: "Side Effect", def: "A predictable, unintended — but not necessarily harmful — response to a medication at standard therapeutic doses. Side effects are nearly unavoidable and are distinct from adverse effects. Example: sedation caused by diphenhydramine (Benadryl) is a side effect. Most side effects decrease as the body adjusts to the medication." },
      { term: "Adverse Effect", def: "An unintended, harmful response to a medication that may require discontinuing the drug or seeking immediate medical care. More serious than a side effect. Example: angioedema (severe facial and throat swelling) from lisinopril is a rare but potentially fatal adverse effect. Adverse effects must be documented and reported to the provider." },
      { term: "Contraindication", def: "A condition, disease, or circumstance that makes a particular medication or treatment inadvisable or potentially dangerous. The most common contraindication is a prior hypersensitivity (allergic) reaction to the medication or a component of it. Always review the patient's allergy history before administering any medication." },
      { term: "Half-Life", def: "The time required for the concentration of a drug in the body to be reduced by 50% through metabolism and excretion. Half-life determines how frequently a medication must be dosed to maintain therapeutic blood levels. A medication with a long half-life may accumulate in the body; a short half-life may require more frequent dosing." },
    ],
  },
  {
    name: "Patient Positioning & Clinical Procedures", emoji: "🛏️", color: "#148F77",
    terms: [
      { term: "Supine Position", def: "The patient lies flat on their back with arms at the sides. Used for head, neck, chest, and abdominal exams; anterior x-rays; CPR; and many surgical procedures. The most anatomically neutral position for a patient at rest. Draping covers from the chest to the feet; expose only the area being examined." },
      { term: "Prone Position", def: "The patient lies face down with the head turned to one side. Used for back exams, spine assessments, and certain surgical procedures. Draping covers from the upper back to the feet. Not appropriate for patients with respiratory difficulty, late pregnancy, or recent abdominal surgery." },
      { term: "Dorsal Recumbent Position", def: "The patient lies on their back with knees bent and feet flat on the table. Used for head, neck, chest, abdominal, vaginal, rectal, and perineal examinations. Similar to supine but with bent knees. Draping covers from the neck to the feet." },
      { term: "Lithotomy Position", def: "The patient lies on their back with legs elevated and feet placed in stirrups at the end of the table. Used for vaginal exams, Pap tests, pelvic procedures, cystoscopy, and some rectal exams. The most anatomically exposed position — always use thorough draping and explain the position clearly before asking the patient to assume it. The patient slides to the edge of the table before placing feet in stirrups." },
      { term: "Fowler's Position", def: "The patient sits upright at 90 degrees. Used for head, neck, and upper body exams; patients with dyspnea or heart failure; and patients who must not lie flat. Semi-Fowler's is a modified version at approximately 45 degrees, used for post-surgical care, breathing problems, and lower back injuries. Draping covers the lap and legs." },
      { term: "Left Lateral (Sims) Position", def: "The patient lies on their left side with the right knee drawn forward. Used for rectal exams, enemas, rectal temperature measurement, and certain pelvic exams. Draping is positioned diagonally from the shoulder to below the knees, with a corner that the provider can lift to access the perianal area while maintaining maximum privacy." },
      { term: "Knee-Chest Position", def: "The patient kneels on the exam table with the chest flat against the table surface and the hips elevated. The thighs are perpendicular to the table. Used for proctologic exams, sigmoidoscopy, and some rectal and vaginal examinations. This position requires good mobility — always assess patient ability before requesting this position and never leave the patient alone." },
      { term: "Pap Test (Pap Smear)", def: "A cervical cancer screening procedure in which cells are collected from the cervix using a brush and/or spatula during a pelvic exam in the lithotomy position. Equipment: speculum, collection device (brush/spatula or liquid-based collection tool). Do not apply lubricant to the speculum before collecting — it may interfere with the specimen. Label the slide or vial immediately after collection." },
    ],
  },
  {
    name: "Emergency Response & Wound Care", emoji: "🩹", color: "#1A5276",
    terms: [
      { term: "Anaphylaxis", def: "A severe, potentially life-threatening systemic allergic reaction that can occur within minutes of exposure to an allergen. Signs: hives, facial and throat swelling (angioedema), difficulty breathing, rapid drop in blood pressure. Response: administer epinephrine injection (if available per facility protocol) AND call 911 immediately. Keep the patient supine with legs elevated if tolerated. Do not delay the epinephrine — anaphylaxis can be fatal within minutes." },
      { term: "Seizure Management", def: "Steps to follow when a patient experiences a seizure: move nearby objects away from the patient to prevent injury → do NOT restrain the patient → do NOT place anything in the mouth (this does not prevent biting and can cause injury to the patient or the provider) → protect the head → position the patient on their side after the seizure ends to prevent aspiration → call for help → never leave the patient alone → document the duration and characteristics of the episode." },
      { term: "R.A.C.E. (Fire Response)", def: "The standard emergency sequence for responding to a fire in a healthcare setting. R = Rescue: remove people in immediate danger from the area. A = Alarm: activate the fire alarm. C = Confine: close all doors and windows to contain the fire and smoke. E = Extinguish: use a fire extinguisher only if trained and it is safe to do so, or Evacuate. Use P.A.S.S. for the fire extinguisher: Pull pin, Aim low, Squeeze handle, Sweep side to side." },
      { term: "Wound Healing Phases", def: "The four stages of tissue repair: (1) Hemostasis — immediate vasoconstriction and clot formation to stop bleeding. (2) Inflammation — increased blood flow, redness, swelling, and warmth as immune cells arrive to clean the wound (days 1–4). (3) Proliferation — fibroblasts lay down collagen, new blood vessels form, and the wound contracts (days 4–21). (4) Remodeling (Maturation) — scar tissue matures and strengthens over weeks to years." },
      { term: "Burn Classification", def: "Burns are classified by depth of tissue involvement. First degree (superficial): epidermis only — redness, pain, no blisters (sunburn). Second degree (partial thickness): epidermis and dermis — blisters, moist surface, intense pain. Third degree (full thickness): destroys all skin layers — no pain (nerve destruction), white, leathery, or charred appearance; requires skin grafting. Fourth degree: involves underlying muscle, fascia, or bone." },
      { term: "Direct Pressure (Bleeding Control)", def: "The first and most effective intervention for controlling active bleeding from a laceration or wound. Apply firm, continuous direct pressure with a sterile dressing. Do not lift the dressing to check — adding more gauze on top if the original becomes saturated maintains the clotting process. Elevate the extremity above heart level if no fracture is suspected. Call for emergency assistance while maintaining pressure." },
    ],
  },
  {
    name: "Laboratory Tests & Diagnostics", emoji: "🧪", color: "#CA6F1E",
    terms: [
      { term: "Complete Blood Count (CBC)", def: "A comprehensive blood test that evaluates all major blood cell lines: red blood cells (RBCs), white blood cells (WBCs), hemoglobin, hematocrit, and platelets. Used to screen for anemia, infection, immune disorders, clotting problems, and leukemia. Does not require fasting. Collected in a lavender/purple (EDTA) tube." },
      { term: "Basic Metabolic Panel (BMP)", def: "A panel of 8 blood tests measuring kidney function (BUN and creatinine), electrolytes (sodium, potassium, chloride, and carbon dioxide/bicarbonate), blood glucose, and calcium. Used to evaluate kidney function, electrolyte balance, and acid-base status. Ordered for routine health screening, hospital admission, and monitoring of chronic conditions." },
      { term: "Comprehensive Metabolic Panel (CMP)", def: "An expanded version of the BMP that includes all BMP components plus liver function tests: ALT, AST, alkaline phosphatase, bilirubin, albumin, and total protein. Used to assess both kidney and liver function simultaneously. Ordered for routine health screening and monitoring of patients on hepatotoxic medications such as statins or acetaminophen." },
      { term: "Lipid Panel", def: "A blood test measuring total cholesterol, LDL (low-density lipoprotein — 'bad' cholesterol), HDL (high-density lipoprotein — 'good' cholesterol), and triglycerides. Used to assess cardiovascular risk. Requires 9–12 hours of fasting before the draw. Collected in a gold SST or red tube." },
      { term: "Liver Function Tests (LFTs)", def: "A panel of blood tests evaluating liver health and function, including ALT (alanine aminotransferase), AST (aspartate aminotransferase), alkaline phosphatase, total and direct bilirubin, albumin, and total protein. Used to detect liver disease, monitor patients on hepatotoxic medications, and evaluate jaundice." },
      { term: "Thyroid Stimulating Hormone (TSH)", def: "A blood test that measures the level of TSH produced by the pituitary gland, which controls the thyroid gland's production of T3 and T4. Elevated TSH indicates hypothyroidism (underactive thyroid). Suppressed TSH indicates hyperthyroidism (overactive thyroid). It is the most sensitive test for detecting thyroid dysfunction." },
      { term: "X-Ray (Radiograph)", def: "A diagnostic imaging technique that uses radiation to create images of dense internal structures. Best for detecting bone fractures, joint abnormalities, lung pathology (pneumonia, pneumothorax), and foreign objects. The fastest and most widely available imaging modality in ambulatory care. Patients should remove metal objects and jewelry before the exam. Contraindicated in pregnancy when non-urgent." },
      { term: "Magnetic Resonance Imaging (MRI)", def: "A diagnostic imaging technique using magnetic fields and radio waves to produce detailed images of soft tissue. No ionizing radiation. Best for brain, spinal cord, ligaments, tendons, cartilage, and internal organs. Contraindicated for patients with metal implants, pacemakers, or cochlear implants. Patients undergoing MRI must be screened for all metallic items." },
      { term: "Ultrasound (Sonography)", def: "A diagnostic imaging technique using high-frequency sound waves to produce real-time images of soft tissue and organ structures. No ionizing radiation. Used for pregnancy (fetal development and anatomy), abdominal organs (gallbladder, liver, kidneys), cardiac function (echocardiography), and vascular assessment. Requires preparation instructions such as a full bladder for pelvic ultrasounds." },
    ],
  },
  {
    name: "HIPAA, Law & Patient Rights", emoji: "⚖️", color: "#1E8449",
    terms: [
      { term: "HIPAA (Health Insurance Portability and Accountability Act)", def: "A federal law enacted in 1996 establishing national standards for protecting the privacy and security of patient health information. The Privacy Rule governs use and disclosure of PHI. The Security Rule governs electronic PHI (ePHI). HITECH (2009) strengthened HIPAA by extending requirements to business associates and increasing penalties for breaches." },
      { term: "Protected Health Information (PHI)", def: "Any individually identifiable health information in any format — electronic, paper, or verbal — that is created, received, maintained, or transmitted by a covered entity. Includes name, date of birth, address, phone number, email, Social Security number, diagnosis, treatment information, and any other data that could identify a patient." },
      { term: "HIPAA Violation", def: "Any action that results in the unauthorized use or disclosure of PHI. Violations include: discussing patient details in public areas, accessing records without authorization, leaving records unsecured, sharing PHI without consent, and sending PHI to the wrong recipient. Not violations: filing records securely, sharing PHI for treatment with authorized care team members, or disclosing with a signed patient release." },
      { term: "Minimum Necessary Standard", def: "A HIPAA principle requiring that only the minimum amount of PHI necessary to accomplish the intended purpose is used, disclosed, or requested. Applies to all disclosures except those to treating providers. MAs should share only the information relevant to the specific clinical or administrative need — not an entire medical record when a single data point will do." },
      { term: "Mandatory Reporting", def: "A legal obligation to report certain events to public health or law enforcement authorities, regardless of patient consent. Reportable events include: suspected child or elder abuse or neglect (suspicion alone is sufficient — do not wait for confirmed evidence), communicable disease diagnoses (TB, HIV, gonorrhea, COVID-19), gunshot or stab wounds, and court-ordered situations." },
      { term: "Informed Consent", def: "A legal and ethical process in which a competent patient voluntarily agrees to a procedure or treatment after receiving complete information about its risks, benefits, alternatives, and the right to refuse. Three requirements: (1) the patient must be mentally and legally competent, (2) complete information must be provided, and (3) consent must be truly voluntary and free from coercion. Written documentation is required for procedures." },
      { term: "Advance Directive", def: "A legal document in which a competent adult specifies their healthcare wishes in advance, in case they become unable to communicate those wishes. Types: Living will (written treatment preferences); Durable Power of Attorney for Healthcare/DPOA (names a healthcare agent to decide on the patient's behalf); DNR (do not resuscitate); POLST (Physician Orders for Life-Sustaining Treatment — actionable medical orders). None expire unless officially revoked." },
      { term: "Durable Power of Attorney (DPOA)", def: "An advance directive that designates a specific person (healthcare agent or proxy) to make medical decisions on the patient's behalf if they become incapacitated. More flexible than a living will because the agent can respond to circumstances that the patient may not have anticipated. The DPOA names WHO decides; the living will specifies WHAT the decisions are." },
      { term: "Patient Autonomy", def: "The ethical and legal right of a competent adult patient to make their own informed healthcare decisions, including the right to refuse recommended treatments. MAs must respect and document the patient's decision without judgment or coercion. A patient may refuse treatment even when the provider strongly recommends it. Document refusals completely in the medical record and notify the physician immediately." },
    ],
  },
  {
    name: "Medical Ethics & Professionalism", emoji: "🧭", color: "#2C3E50",
    terms: [
      { term: "Non-Maleficence", def: "The foundational bioethical principle meaning 'do no harm.' Every clinical action — including withholding unnecessary or harmful treatments — must be evaluated against its potential to cause harm. MAs uphold this principle by following correct technique, adhering to scope of practice, verifying medications and doses, and reporting errors or concerns immediately." },
      { term: "Beneficence", def: "The bioethical principle of acting in the patient's best interest — not simply avoiding harm, but taking positive steps to promote well-being. In MA practice: providing accurate health education, offering preventive care reminders, administering medications correctly, and advocating for the patient's needs within the care team." },
      { term: "Justice (Medical Ethics)", def: "The bioethical principle of treating all patients fairly and equitably regardless of socioeconomic status, race, religion, gender, age, sexual orientation, or disability. Healthcare resources and quality of care should be allocated without discrimination. MAs demonstrate justice by providing the same level of professional, compassionate care to every patient they encounter." },
      { term: "Scope of Practice", def: "The specific actions, tasks, and procedures a healthcare professional is legally authorized and competent to perform, as defined by state law, employer policy, and professional standards. MAs work under physician supervision and may only perform tasks they are trained, authorized, and state-approved to do. When unsure: consult the supervising provider. Never guess or proceed without guidance." },
      { term: "Professionalism", def: "The consistent demonstration of a standard of conduct expected of all healthcare workers, encompassing appearance, communication, behavior, work ethic, relationships, and ethical decision-making. Professionalism is not situational — it applies in every interaction, with every patient and colleague, regardless of the circumstances. Includes punctuality, respectful communication, appropriate dress, and maintaining confidentiality." },
      { term: "Therapeutic Communication", def: "A structured, purposeful approach to communication in healthcare that builds trust, comfort, and a therapeutic relationship between the MA and the patient. Core techniques: active listening, paraphrasing, open-ended questions, probing questions, empathy, and silence. Directly impacts patient satisfaction, adherence to treatment, and health outcomes." },
      { term: "Teach-Back Method", def: "A health literacy verification technique in which the MA asks the patient to explain or demonstrate what they just learned, in their own words. Example: 'Can you walk me through how you would take this medication at home?' Used to confirm understanding rather than assuming comprehension based on a nod or 'yes.' Effective for medication instructions, discharge teaching, and procedure preparation." },
    ],
  },
  {
    name: "Administrative Functions & Insurance", emoji: "🗂️", color: "#922B21",
    terms: [
      { term: "Preauthorization (Precertification)", def: "A process in which the healthcare provider obtains approval from the patient's insurance company before performing a procedure, ordering a diagnostic test, or admitting a patient. Confirms that the planned service is covered under the patient's insurance policy. Does NOT guarantee zero cost to the patient. Failing to obtain required preauthorization may result in denial of the claim." },
      { term: "Primary Insurance", def: "The insurance plan that is billed first when a patient has more than one insurance policy. The primary insurer processes the claim and pays its portion first. The remaining balance is then submitted to the secondary insurer. In a two-insurer situation, primary insurance is always billed before secondary insurance, regardless of the amount each covers." },
      { term: "Explanation of Benefits (EOB)", def: "A document sent by the insurance company to the subscriber (and often the provider) after a claim is processed. Shows: the services billed, the amount the insurer allowed, the amount the insurer paid, and the amount the patient is responsible for paying. If a partial payment is received, the MA should contact the insurance company to determine the reason before writing off any balance." },
      { term: "Third-Party Payer", def: "Any entity other than the patient or the healthcare provider that pays for medical services — most commonly a health insurance company, Medicare, Medicaid, or an employer-sponsored plan. The patient is the first party; the provider is the second party; the insurer is the third party." },
      { term: "EHR (Electronic Health Record)", def: "A digital record of a patient's health information that extends across multiple healthcare organizations and providers — including specialists, hospitals, and laboratories. Allows authorized providers to view and update a shared record, improving care coordination and reducing duplicate testing. Distinct from an EMR (Electronic Medical Record), which is used only within a single organization." },
      { term: "CPOE (Computerized Provider Order Entry)", def: "A technology system that allows providers to enter medical orders electronically — including medications, laboratory tests, radiology orders, and referrals. Eliminates handwriting errors and integrates clinical decision support tools that flag drug interactions, allergies, and out-of-range dosages. MAs may enter order information into CPOE for the provider to review and authorize." },
      { term: "Medical Record Documentation Standards", def: "Rules that govern how entries are made in the patient's medical record: use black or dark blue ink; date and time every entry; never use correction fluid — draw one line through errors, write 'error,' initial, and enter the correction; leave no blank lines between entries; late entries must be labeled as such with the current date and time of entry; 'if it isn't documented, it didn't happen.'" },
    ],
  },
  {
    name: "Infection Control & Safety", emoji: "🦠", color: "#6C3483",
    terms: [
      { term: "Chain of Infection", def: "The six-step sequence that must remain intact for a communicable disease to spread: (1) infectious agent (pathogen), (2) reservoir (where the pathogen lives and multiplies), (3) portal of exit (how the pathogen leaves the reservoir), (4) mode of transmission (how it travels to a new host — contact, droplet, or airborne), (5) portal of entry (how it enters the new host), (6) susceptible host. Breaking any one link stops transmission." },
      { term: "Standard Precautions", def: "The current baseline infection prevention protocol applied to every patient, every encounter, regardless of diagnosis or known infection status. Treats all blood, body fluids, non-intact skin, and mucous membranes as potentially infectious. Includes hand hygiene, appropriate PPE selection, safe sharps handling, and respiratory hygiene/cough etiquette." },
      { term: "Transmission-Based Precautions", def: "Additional infection control measures used when a patient has a known or suspected infection spread by a specific route. Contact precautions: gown and gloves for direct/indirect contact transmission (MRSA, C. difficile). Droplet precautions: surgical mask for respiratory droplet transmission (influenza, pertussis). Airborne precautions: N95 respirator and negative pressure room for airborne transmission (TB, measles, varicella)." },
      { term: "Autoclave", def: "The primary sterilization method used in ambulatory healthcare settings. Uses pressurized steam at 250–270°F to destroy all living microorganisms including resistant endospores. Unwrapped items: 20 minutes. Wrapped items: 30 minutes. Verify sterilization with chemical indicator tape (lines turn black), internal indicator strips, and periodic biological indicators (spore tests — the most rigorous QC test). Sterile packages are valid for 30 days if dry and intact." },
      { term: "Disinfection Levels", def: "Three levels of disinfection based on the microorganisms destroyed. Low-level: kills most bacteria, some viruses and fungi — used on exam tables and countertops (example: hydrogen peroxide). Intermediate-level: kills bacteria, most viruses, and fungi but not spores — used on stethoscopes and BP cuffs (example: isopropyl alcohol 70%). High-level: kills all microorganisms except a small number of spores — used on endoscopes (example: Cidex OPA)." },
      { term: "Post-Exposure Protocol", def: "The immediate steps required after a needlestick, sharps injury, or splash exposure to potentially infectious material. Immediately wash the wound with soap and water (or flush eyes/mucous membranes with water). Report to the supervisor right away. Complete an incident exposure form. Receive a confidential medical evaluation (provided at no cost to the employee). Hepatitis B vaccination and post-exposure prophylaxis (PEP) may be initiated based on the assessment." },
      { term: "Sharps Container", def: "A rigid, puncture-proof, leak-proof, closable container specifically designed for the safe disposal of needles, lancets, scalpel blades, broken glass, and any other sharp objects used in patient care. Must be labeled with the biohazard symbol. NEVER recap a used needle — drop it directly into the sharps container at the point of use. Seal and replace when two-thirds full." },
    ],
  },
  {
    name: "Medical Terminology", emoji: "📖", color: "#117A65",
    terms: [
      { term: "brady- (prefix)", def: "Means slow. Clinical examples: bradycardia (slow heart rate, below 60 bpm); bradypnea (slow respiratory rate, below 12 breaths/min). The prefix brady- is one of the most commonly tested medical terminology items on the CCMA exam — never confuse it with tachy- (fast)." },
      { term: "tachy- (prefix)", def: "Means fast. Clinical examples: tachycardia (fast heart rate, above 100 bpm); tachypnea (fast respiratory rate, above 20 breaths/min). The opposite of brady-. Both prefixes are applied across multiple body systems to indicate abnormal rate changes." },
      { term: "hypo- (prefix)", def: "Means below, beneath, or deficient. Clinical examples: hypoglycemia (low blood sugar); hypotension (low blood pressure); hypothyroidism (underactive thyroid — low thyroid hormone production); hypothermia (dangerously low body temperature). The opposite of hyper-." },
      { term: "hyper- (prefix)", def: "Means above, excessive, or elevated. Clinical examples: hyperglycemia (high blood sugar); hypertension (high blood pressure — the most common chronic condition in adults); hyperthyroidism (overactive thyroid — excessive hormone production). The opposite of hypo-." },
      { term: "-itis (suffix)", def: "Means inflammation. Clinical examples: appendicitis (inflammation of the appendix); pericarditis (inflammation of the pericardium — the tissue around the heart); arthritis (inflammation of the joints); myocarditis (inflammation of the heart muscle — distinct from myocardial infarction, which is tissue death from blocked blood supply)." },
      { term: "-ectomy (suffix)", def: "Means surgical removal of a structure. Clinical examples: appendectomy (surgical removal of the appendix); tonsillectomy (surgical removal of the tonsils); thyroidectomy (surgical removal of the thyroid gland); hysterectomy (surgical removal of the uterus). Always implies a surgical intervention." },
      { term: "-pathy (suffix)", def: "Means disease or disorder of a body part or system. Clinical examples: neuropathy (disease of the nervous system — often causing numbness or tingling, commonly seen in diabetes); cardiomyopathy (disease of the heart muscle); nephropathy (kidney disease); retinopathy (disease of the retina)." },
      { term: "-scope (suffix)", def: "Means an instrument used for visual examination of a body cavity or structure. Clinical examples: otoscope (instrument for examining the ear canal); ophthalmoscope (instrument for examining the interior of the eye); endoscope (instrument for examining internal body cavities); stethoscope (instrument for auscultating heart and lung sounds)." },
      { term: "-ology (suffix)", def: "Means the study of a field or body system. Clinical examples: cardiology (study of the heart); neurology (study of the nervous system — NOT bones or muscles); dermatology (study of the skin); gastroenterology (study of the GI tract); hematology (study of blood); oncology (study of cancer). Used to describe both the medical specialty and the field of scientific study." },
      { term: "Myocardial Infarction vs. Myocarditis", def: "Two frequently confused terms. Myocardial infarction (MI) = a heart attack — death of heart muscle tissue caused by complete or near-complete blockage of a coronary artery. The suffix -infarction indicates tissue death from loss of blood supply. Myocarditis = inflammation (-itis) of the heart muscle, most commonly caused by a viral infection. These are two distinct conditions with different causes, presentations, and treatments." },
      { term: "Dyspnea", def: "Difficulty or labored breathing, often described by the patient as 'shortness of breath' or 'trouble breathing.' A subjective symptom that must be reported to the provider. Common causes: asthma, COPD, heart failure, pulmonary embolism, anxiety, and anemia. Distinguished from apnea (cessation of breathing) and tachypnea (rapid but not necessarily difficult breathing)." },
      { term: "Dysphagia", def: "Difficulty swallowing. A symptom, not a diagnosis, that may indicate esophageal obstruction, neurologic conditions (stroke, ALS), or structural abnormalities. Must be reported to the provider. Patients with dysphagia may be at risk for aspiration — the entry of food or liquid into the airway. Distinguished from dysphonia (difficulty speaking) and dysphasia (impaired language processing)." },
      { term: "Temperature", def: "97–99°F (oral avg 98.6)" },
      { term: "peri-", def: "Around / surrounding" },
    ],
  },
];
const ALL_TERMS = CATEGORIES.flatMap((cat, ci) =>
  cat.terms.map(t => ({ ...t, category: cat.name, emoji: cat.emoji, color: cat.color, catIndex: ci }))
);
let flashDeck = [];
let flashIdx = 0;
let flashFlipped = false;
let flashKnown = 0;
let flashLearning = 0;
let flashDone = false;
let flashSelectedCats = new Set(CATEGORIES.map((_, i) => i));
let flashStarted = false;
document.getElementById('header-subtitle').textContent =
  `CCMA Exam Readiness & Review \u00b7 ${ALL_TERMS.length} terms across ${CATEGORIES.length} topics`;
renderFlash();
function startFlashDeck() {
  const terms = CATEGORIES.flatMap((cat, ci) =>
    flashSelectedCats.has(ci) ? cat.terms.map(t => ({ ...t, color: cat.color, emoji: cat.emoji, category: cat.name })) : []
  );
  flashDeck = shuffle([...terms]);
  flashIdx = 0; flashFlipped = false; flashKnown = 0; flashLearning = 0; flashDone = false; flashStarted = true;
  renderFlash();
}
function flashToggleCat(i) {
  if (flashSelectedCats.has(i)) {
    if (flashSelectedCats.size > 1) flashSelectedCats.delete(i);
  } else { flashSelectedCats.add(i); }
  renderFlash();
}
function flashMark(isKnown) {
  if (isKnown) flashKnown++; else flashLearning++;
  if (flashIdx + 1 >= flashDeck.length) { flashDone = true; renderFlash(); return; }
  flashIdx++; flashFlipped = false; renderFlash();
}
function renderFlash() {
  const el = document.getElementById('flash-mode');
  if (!flashStarted || flashDeck.length === 0) {
    let html = `<div class="text-center" style="padding:40px 0">
      <p style="font-size:18px;margin-bottom:20px;color:var(--text)">Select categories and start studying!</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px">`;
    CATEGORIES.forEach((c, i) => {
      const sel = flashSelectedCats.has(i);
      html += `<button class="chip" onclick="flashToggleCat(${i})"
        style="border-color:${c.color};background:${sel ? c.color : 'transparent'};color:${sel ? '#fff' : c.color}">
        ${c.emoji} ${escHtml(c.name)}</button>`;
    });
    html += `</div>
      <button class="pill-primary" style="background:#E74C3C" onclick="startFlashDeck()">Shuffle & Start \u2192</button>
    </div>`;
    el.innerHTML = html; return;
  }
  if (flashDone) {
    const total = flashKnown + flashLearning;
    const pct = Math.round((flashKnown / total) * 100);
    const emoji = pct >= 80 ? '\ud83c\udf89' : pct >= 50 ? '\ud83d\udcaa' : '\ud83d\udcd6';
    el.innerHTML = `
      <div class="text-center" style="padding:40px 0">
        <div style="font-size:48px;margin-bottom:12px">${emoji}</div>
        <h3 style="margin:0 0 8px">Round Complete!</h3>
        <p style="color:var(--text-secondary);font-size:15px;margin:0 0 24px">
          ${flashKnown} knew it \u00b7 ${flashLearning} still learning \u00b7 ${pct}% mastery
        </p>
        <div style="width:100%;max-width:300px;height:10px;border-radius:10px;background:var(--surface-2);margin:0 auto 24px;overflow:hidden">
          <div style="width:${pct}%;height:100%;border-radius:10px;background:linear-gradient(90deg,#27AE60,#2ECC71);transition:width .6s"></div>
        </div>
        <button class="pill-primary" style="background:#3498DB" onclick="flashDeck=[];flashStarted=false;flashDone=false;renderFlash()">New Round</button>
      </div>`;
    return;
  }
  const card = flashDeck[flashIdx];
  const pctProgress = ((flashIdx / flashDeck.length) * 100);
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;padding:12px 0">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;width:100%">
        <span style="font-size:13px;color:var(--text-secondary);font-weight:600">${flashIdx + 1}/${flashDeck.length}</span>
        <div class="progress-bar" style="flex:1"><div class="fill" style="width:${pctProgress}%;background:${card.color}"></div></div>
        <span style="font-size:12px;color:var(--text-secondary)">\u2713${flashKnown} \u2717${flashLearning}</span>
      </div>
      <div class="flashcard" onclick="flashFlipped=!flashFlipped;renderFlash();"
           style="background:${flashFlipped ? 'var(--surface-1)' : card.color};color:${flashFlipped ? 'var(--text)' : '#fff'}">
        <span class="label">${flashFlipped ? 'Definition' : card.emoji + ' ' + escHtml(card.category)}</span>
        <span class="hint">${flashFlipped ? '' : 'tap to flip'}</span>
        ${!flashFlipped
          ? `<h2>${escHtml(card.term)}</h2>`
          : `<p class="def-text">${escHtml(card.def)}</p>`
        }
      </div>
      ${flashFlipped ? `
        <div style="display:flex;gap:12px;margin-top:20px">
          <button class="pill pill-outline" style="border-color:#E74C3C;color:#E74C3C;padding:12px 28px;font-size:14px" onclick="flashMark(false)">Still Learning</button>
          <button class="pill-primary" style="background:#27AE60;padding:12px 28px;font-size:14px" onclick="flashMark(true)">Got It! \u2713</button>
        </div>` : ''}
    </div>`;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
</html>
