<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 15 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}.search-wrap input:focus{border-color:var(--red)}.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}.cat-btn:hover{opacity:.85}.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}.item:last-child{border-bottom:none}.item:hover{background:var(--surface2)}.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}.item-left{display:flex;align-items:center;gap:10px}.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}.item.open .item-bar{opacity:1}.item-term{font-size:20px;font-weight:700;color:#fff}.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}.item.open .item-def{display:block}.item.open .item-term{color:var(--red-light)}.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}.pg-btn:disabled{opacity:.3;cursor:default}.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}.pg-dot.active{background:var(--red-light);transform:scale(1.3)}.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 15 Glossary</h1>
  <p class="sub">CCMA Exam Readiness & Review</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Vital Signs",color:"#E05555",terms:[
    {term:"Vital Signs",def:"The four primary physiologic measurements that indicate the basic functioning of the body: heart rate (pulse), blood pressure."},
    {term:"Heart Rate (Pulse)",def:"The number of times the heart beats per minute, typically measured at the radial artery on the wrist."},
    {term:"Bradycardia",def:"A resting heart rate below 60 beats per minute in an adult. May be normal in well-trained athletes."},
    {term:"Tachycardia",def:"A resting heart rate above 100 beats per minute in an adult."},
    {term:"Blood Pressure",def:"The force of blood against arterial walls. Recorded as systolic (heart contracting) over diastolic (heart relaxing)."},
    {term:"Korotkoff Sounds",def:"The sounds heard through a stethoscope while measuring blood pressure with a sphygmomanometer."},
    {term:"Respiratory Rate",def:"The number of breaths taken per minute. Normal adult range: 12–20 breaths per minute. Tachypnea = above 20. Bradypnea = below 12."},
    {term:"Body Temperature",def:"The measurement of the body's heat. Normal oral average: 98.6°F (37°C). Normal range: 97.0–99.0°F."},
    {term:"Pulse Oximetry (SpO2)",def:"A noninvasive measurement of blood oxygen saturation using a pulse oximeter sensor typically placed on the finger or toe."},
    {term:"Pain Scale",def:"A standardized tool used to assess and document a patient's subjective pain experience."}
  ]},
  {name:"EKG & Cardio",color:"#6B7B8D",terms:[
    {term:"12-Lead EKG (Electrocardiogram)",def:"A diagnostic test that records the heart's electrical activity from 12 different perspectives using 10 electrodes placed on the..."},
    {term:"Precordial (Chest) Leads",def:"The six chest electrodes placed in specific anatomical positions to record the heart's electrical activity in the horizontal pl..."},
    {term:"Limb Leads",def:"The four electrodes placed on the extremities for a 12-lead EKG. RA: right arm. LA: left arm. RL: right leg (ground electrode)."},
    {term:"Intercostal Space (ICS)",def:"The space between two adjacent ribs, numbered by the rib above it."},
    {term:"EKG Artifact",def:"Unwanted interference or noise in an EKG tracing that makes interpretation difficult or impossible."},
    {term:"Cardiac Conduction System",def:"The specialized electrical system that coordinates the heartbeat."},
    {term:"Myocardial Infarction (MI)",def:"The medical term for a heart attack — complete or near-complete blockage of a coronary artery causing death of heart muscle tis..."}
  ]},
  {name:"Phlebotomy",color:"#8B6AAE",terms:[
    {term:"Venipuncture",def:"The clinical procedure of puncturing a vein with a needle to obtain a blood sample for laboratory testing."},
    {term:"Order of Draw",def:"The required sequence in which blood collection tubes must be filled during venipuncture to prevent cross-contamination of addi..."},
    {term:"Antecubital Fossa",def:"The triangular hollow at the bend of the elbow, which contains the median cubital vein, cephalic vein, and basilic vein."},
    {term:"Capillary Blood Draw (Fingerstick)",def:"A method of obtaining a small blood sample by puncturing the capillaries in the fingertip with a lancet."},
    {term:"Clean-Catch Midstream Urine (CCMU)",def:"A method of collecting a urine specimen that minimizes contamination from bacteria on the skin."},
    {term:"24-Hour Urine Collection",def:"A method of collecting all urine produced over a 24-hour period to measure total output of a substance (such as creatinine."},
    {term:"Fasting Blood Glucose (FBG)",def:"A blood glucose test performed after the patient has fasted for 8–12 hours."},
    {term:"Hemoglobin A1c (HbA1c)",def:"A blood test that reflects the average blood glucose level over the preceding 2–3 months by measuring the percentage of hemoglo..."},
    {term:"Throat Culture",def:"A diagnostic specimen collected by swabbing the posterior pharynx and tonsillar pillars to detect the presence of Group A Strep..."}
  ]},
  {name:"Injections & Meds",color:"#E74C6F",terms:[
    {term:"Intradermal (ID) Injection",def:"An injection administered into the superficial layers of the dermis (skin). Technique: bevel up, 10–15° angle."},
    {term:"Subcutaneous (SC/SQ) Injection",def:"An injection administered into the fatty tissue layer beneath the skin."},
    {term:"Intramuscular (IM) Injection",def:"An injection administered deep into muscle tissue to allow rapid absorption of the medication into the bloodstream."},
    {term:"Needle Gauge",def:"The size of the needle's interior opening (lumen), expressed as a number. Higher gauge number = smaller opening."},
    {term:"Nine Rights of Medication Administration",def:"A safety checklist performed before every medication administration: (1) Right Patient — two identifiers (name and date of birth)."},
    {term:"Three Label Checks",def:"A medication safety practice requiring the MA to verify the medication label against the prescription three times: (1) when rem..."},
    {term:"Medication Administration Record (MAR)",def:"The legal, permanent record of all medications administered to a patient."},
    {term:"Look-Alike/Sound-Alike (LASA) Medications",def:"Medications with names or packaging that closely resemble other medications, creating a significant risk of administration errors."},
    {term:"Transdermal Patch",def:"A drug delivery system in which medication is absorbed through the skin over an extended period."}
  ]},
  {name:"Pharmacology",color:"#4A90B8",terms:[
    {term:"Pharmacokinetics (ADME)",def:"The study of how the body processes a medication through four phases: Absorption (drug moves from administration site into bloo..."},
    {term:"Controlled Substances Act (CSA)",def:"A federal law that classifies substances with potential for abuse into five schedules based on their medical use and abuse pote..."},
    {term:"Desired-Over-Have Formula",def:"A dosage calculation method: (Desired dose ÷ Dose on hand) × Quantity = Amount to give."},
    {term:"Metric System (Medication)",def:"The standard measurement system used for medications. Weight units: kg (kilogram) → g (gram) → mg (milligram) → mcg (microgram)."},
    {term:"Standard (Household) Conversions",def:"Common measurement equivalencies used for oral liquid medications: 1 teaspoon (tsp) = 5 mL │ 1 tablespoon (tbsp) = 15 mL │ 1 fl..."},
    {term:"Side Effect",def:"A predictable, unintended — but not necessarily harmful — response to a medication at standard therapeutic doses."},
    {term:"Adverse Effect",def:"An unintended, harmful response to a medication that may require discontinuing the drug or seeking immediate medical care."},
    {term:"Contraindication",def:"A condition, disease, or circumstance that makes a particular medication or treatment inadvisable or potentially dangerous."},
    {term:"Half-Life",def:"The time required for the concentration of a drug in the body to be reduced by 50% through metabolism and excretion."}
  ]},
  {name:"Positioning & Procedures",color:"#1A8A7D",terms:[
    {term:"Supine Position",def:"The patient lies flat on their back with arms at the sides."},
    {term:"Prone Position",def:"The patient lies face down with the head turned to one side."},
    {term:"Dorsal Recumbent Position",def:"The patient lies on their back with knees bent and feet flat on the table."},
    {term:"Lithotomy Position",def:"The patient lies on their back with legs elevated and feet placed in stirrups at the end of the table."},
    {term:"Fowler's Position",def:"The patient sits upright at 90 degrees. Used for head, neck."},
    {term:"Left Lateral (Sims) Position",def:"The patient lies on their left side with the right knee drawn forward."},
    {term:"Knee-Chest Position",def:"The patient kneels on the exam table with the chest flat against the table surface and the hips elevated."},
    {term:"Pap Test (Pap Smear)",def:"A cervical cancer screening procedure in which cells are collected from the cervix using a brush and/or spatula during a pelvic..."}
  ]},
  {name:"Emergency & Wounds",color:"#E2B94C",terms:[
    {term:"Anaphylaxis",def:"A severe, potentially life-threatening systemic allergic reaction that can occur within minutes of exposure to an allergen."},
    {term:"Seizure Management",def:"Steps to follow when a patient experiences a seizure: move nearby objects away from the patient to prevent injury → do NOT rest..."},
    {term:"R.A.C.E. (Fire Response)",def:"The standard emergency sequence for responding to a fire in a healthcare setting."},
    {term:"Wound Healing Phases",def:"The four stages of tissue repair: (1) Hemostasis — immediate vasoconstriction and clot formation to stop bleeding."},
    {term:"Burn Classification",def:"Burns are classified by depth of tissue involvement."},
    {term:"Direct Pressure (Bleeding Control)",def:"The first and most effective intervention for controlling active bleeding from a laceration or wound."}
  ]},
  {name:"Lab & Diagnostics",color:"#4CAF90",terms:[
    {term:"Complete Blood Count (CBC)",def:"A comprehensive blood test that evaluates all major blood cell lines: red blood cells (RBCs), white blood cells (WBCs)."},
    {term:"Basic Metabolic Panel (BMP)",def:"A panel of 8 blood tests measuring kidney function (BUN and creatinine), electrolytes (sodium, potassium, chloride."},
    {term:"Comprehensive Metabolic Panel (CMP)",def:"An expanded version of the BMP that includes all BMP components plus liver function tests: ALT, AST, alkaline phosphatase."},
    {term:"Lipid Panel",def:"A blood test measuring total cholesterol, LDL (low-density lipoprotein — 'bad' cholesterol)."},
    {term:"Liver Function Tests (LFTs)",def:"A panel of blood tests evaluating liver health and function, including ALT (alanine aminotransferase)."},
    {term:"Thyroid Stimulating Hormone (TSH)",def:"A blood test that measures the level of TSH produced by the pituitary gland."},
    {term:"X-Ray (Radiograph)",def:"A diagnostic imaging technique that uses radiation to create images of dense internal structures."},
    {term:"Magnetic Resonance Imaging (MRI)",def:"A diagnostic imaging technique using magnetic fields and radio waves to produce detailed images of soft tissue."},
    {term:"Ultrasound (Sonography)",def:"A diagnostic imaging technique using high-frequency sound waves to produce real-time images of soft tissue and organ structures."}
  ]},
  {name:"HIPAA & Law",color:"#E8976A",terms:[
    {term:"HIPAA (Health Insurance Portability and Accountability Act)",def:"A federal law enacted in 1996 establishing national standards for protecting the privacy and security of patient health informa..."},
    {term:"Protected Health Information (PHI)",def:"Any individually identifiable health information in any format — electronic, paper, or verbal — that is created, received."},
    {term:"HIPAA Violation",def:"Any action that results in the unauthorized use or disclosure of PHI."},
    {term:"Minimum Necessary Standard",def:"A HIPAA principle requiring that only the minimum amount of PHI necessary to accomplish the intended purpose is used, disclosed."},
    {term:"Mandatory Reporting",def:"A legal obligation to report certain events to public health or law enforcement authorities, regardless of patient consent."},
    {term:"Informed Consent",def:"A legal and ethical process in which a competent patient voluntarily agrees to a procedure or treatment after receiving complet..."},
    {term:"Advance Directive",def:"A legal document in which a competent adult specifies their healthcare wishes in advance."},
    {term:"Durable Power of Attorney (DPOA)",def:"An advance directive that designates a specific person (healthcare agent or proxy) to make medical decisions on the patient's b..."},
    {term:"Patient Autonomy",def:"The ethical and legal right of a competent adult patient to make their own informed healthcare decisions."}
  ]},
  {name:"Ethics & Professionalism",color:"#C4A84D",terms:[
    {term:"Non-Maleficence",def:"The foundational bioethical principle meaning 'do no harm."},
    {term:"Beneficence",def:"The bioethical principle of acting in the patient's best interest — not simply avoiding harm."},
    {term:"Justice (Medical Ethics)",def:"The bioethical principle of treating all patients fairly and equitably regardless of socioeconomic status, race, religion, gender."},
    {term:"Scope of Practice",def:"The specific actions, tasks, and procedures a healthcare professional is legally authorized and competent to perform."},
    {term:"Professionalism",def:"The consistent demonstration of a standard of conduct expected of all healthcare workers, encompassing appearance, communication."},
    {term:"Therapeutic Communication",def:"A structured, purposeful approach to communication in healthcare that builds trust, comfort."},
    {term:"Teach-Back Method",def:"A health literacy verification technique in which the MA asks the patient to explain or demonstrate what they just learned."}
  ]},
  {name:"Admin & Insurance",color:"#5B8CDB",terms:[
    {term:"Preauthorization (Precertification)",def:"A process in which the healthcare provider obtains approval from the patient's insurance company before performing a procedure."},
    {term:"Primary Insurance",def:"The insurance plan that is billed first when a patient has more than one insurance policy."},
    {term:"Explanation of Benefits (EOB)",def:"A document sent by the insurance company to the subscriber (and often the provider) after a claim is processed."},
    {term:"Third-Party Payer",def:"Any entity other than the patient or the healthcare provider that pays for medical services — most commonly a health insurance ..."},
    {term:"EHR (Electronic Health Record)",def:"A digital record of a patient's health information that extends across multiple healthcare organizations and providers — includ..."},
    {term:"CPOE (Computerized Provider Order Entry)",def:"A technology system that allows providers to enter medical orders electronically — including medications, laboratory tests."},
    {term:"Medical Record Documentation Standards",def:"Rules that govern how entries are made in the patient's medical record: use black or dark blue ink; date and time every entry; ..."}
  ]},
  {name:"Infection Control",color:"#7D6AAE",terms:[
    {term:"Chain of Infection",def:"The six-step sequence that must remain intact for a communicable disease to spread: (1) infectious agent (pathogen)."},
    {term:"Standard Precautions",def:"The current baseline infection prevention protocol applied to every patient, every encounter."},
    {term:"Transmission-Based Precautions",def:"Additional infection control measures used when a patient has a known or suspected infection spread by a specific route."},
    {term:"Autoclave",def:"The primary sterilization method used in ambulatory healthcare settings."},
    {term:"Disinfection Levels",def:"Three levels of disinfection based on the microorganisms destroyed."},
    {term:"Post-Exposure Protocol",def:"The immediate steps required after a needlestick, sharps injury, or splash exposure to potentially infectious material."},
    {term:"Sharps Container",def:"A rigid, puncture-proof, leak-proof, closable container specifically designed for the safe disposal of needles, lancets."}
  ]},
  {name:"Medical Terminology",color:"#3A9E8F",terms:[
    {term:"brady- (prefix)",def:"Means slow. Clinical examples: bradycardia (slow heart rate, below 60 bpm); bradypnea (slow respiratory rate."},
    {term:"tachy- (prefix)",def:"Means fast. Clinical examples: tachycardia (fast heart rate, above 100 bpm); tachypnea (fast respiratory rate."},
    {term:"hypo- (prefix)",def:"Means below, beneath, or deficient. Clinical examples: hypoglycemia (low blood sugar); hypotension (low blood pressure); hypoth..."},
    {term:"hyper- (prefix)",def:"Means above, excessive, or elevated. Clinical examples: hyperglycemia (high blood sugar); hypertension (high blood pressure — t..."},
    {term:"-itis (suffix)",def:"Means inflammation. Clinical examples: appendicitis (inflammation of the appendix); pericarditis (inflammation of the pericardi..."},
    {term:"-ectomy (suffix)",def:"Means surgical removal of a structure. Clinical examples: appendectomy (surgical removal of the appendix); tonsillectomy (surgi..."},
    {term:"-pathy (suffix)",def:"Means disease or disorder of a body part or system. Clinical examples: neuropathy (disease of the nervous system — often causin..."},
    {term:"-scope (suffix)",def:"Means an instrument used for visual examination of a body cavity or structure."},
    {term:"-ology (suffix)",def:"Means the study of a field or body system. Clinical examples: cardiology (study of the heart); neurology (study of the nervous ..."},
    {term:"Myocardial Infarction vs. Myocarditis",def:"Two frequently confused terms. Myocardial infarction (MI) = a heart attack — death of heart muscle tissue caused by complete or..."},
    {term:"Dyspnea",def:"Difficulty or labored breathing, often described by the patient as 'shortness of breath' or 'trouble breathing."},
    {term:"Dysphagia",def:"Difficulty swallowing. A symptom, not a diagnosis, that may indicate esophageal obstruction, neurologic conditions (stroke, ALS)."},
    {term:"Vital Sign",def:"Normal Adult Range | Abnormal Values | Assessment Method/Notes |"},
    {term:"Heart Rate",def:"60–100 bpm | Bradycardia <60; Tachycardia >100 | Radial artery (1 min) |"},
    {term:"Blood Pressure",def:"<120/80 mmHg | Stage 1 HTN ≥130/80; Stage 2 ≥140/90 | Brachial artery, seated |"},
    {term:"Respiratory Rate",def:"12–20 breaths/min | Tachypnea >20; Bradypnea <12 | Count 1 min (unannounced) |"},
    {term:"Temperature",def:"97–99°F (oral avg 98.6) | Fever >100.4°F; Hypothermia <95°F | Rectal = most accurate |"},
    {term:"SpO2 (Pulse Ox)",def:"95–100% | <95% warrants action; <90% critical | Finger or toe sensor |"},
    {term:"Pain Scale",def:"Patient-rated 0–10 | Document exact patient rating | Numeric or FACES scale |"}
  ]}
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
