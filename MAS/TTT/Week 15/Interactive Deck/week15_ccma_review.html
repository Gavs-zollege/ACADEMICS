*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}:root{--ff:"Libre Baskerville","Georgia",serif;--fs:"Source Sans 3","Segoe UI",sans-serif;--slideBg:#FFF;--slideAlt:#F6F8FB;--dark:#0D2137;--darkSub:#1B3A57;--accent:#0F7B6C;--accentLight:#E6F5F2;--warm:#D94F4F;--warmLight:#FDF0F0;--amber:#D4880F;--amberLight:#FFF7E6;--blue:#2B6CB0;--blueLight:#EBF2FA;--purple:#6B46A8;--text:#1A202C;--textMid:#4A5568;--textLight:#8896A6;--border:#E2E8F0;--headerBg:#0D2137}body{background:#E8ECF0;font-family:var(--fs);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px 24px}button{cursor:pointer;font-family:var(--fs)}.sw{width:100%;max-width:960px}.sf{width:100%;aspect-ratio:16/9;border-radius:6px;box-shadow:0 8px 40px rgba(0,0,0,.18);overflow:hidden;position:relative;display:flex;flex-direction:column;animation:sF .35s ease-out}.sf.dk{background:var(--headerBg)}.sf:not(.dk){background:var(--slideBg)}.sh{background:var(--headerBg);padding:10px 28px 8px;display:flex;align-items:center;gap:10px;flex-shrink:0}.sh .n{font-size:9px;font-weight:700;color:var(--accent);background:rgba(15,123,108,.15);border-radius:3px;padding:2px 7px;letter-spacing:1px}.sh .t{font-family:var(--ff);font-size:13px;font-weight:700;color:#fff}.sb{flex:1;padding:12px 28px 8px;overflow:hidden}.ft{display:flex;justify-content:space-between;align-items:center;padding:0 28px 6px;flex-shrink:0}.ft .l{font-size:8px;color:var(--textLight);letter-spacing:1px;text-transform:uppercase}.ft .r{font-size:9px;font-weight:600;color:var(--textLight)}.ctrls{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:960px;margin-top:14px}.cb{font-size:12px;font-weight:600;color:#4A5568;background:rgba(0,0,0,.05);border:none;border-radius:8px;padding:8px 18px;transition:all .2s}.cb:hover:not(:disabled){filter:brightness(1.08)}.cb:disabled{opacity:.3;cursor:default}.cb.act{background:var(--dark);color:#fff}.dots{display:flex;gap:3px;align-items:center}.dot{height:5px;border-radius:3px;cursor:pointer;transition:all .3s}.dot.c{width:16px;background:var(--accent)}.dot.v{width:5px;background:var(--darkSub)}.dot.f{width:5px;background:rgba(0,0,0,.12)}.to{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center}.tp{background:#fff;border-radius:12px;padding:24px 20px;max-height:70vh;overflow-y:auto;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.tt{font-family:var(--ff);font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px}.ti{font-size:12px;padding:6px 10px;border-radius:5px;cursor:pointer;margin-bottom:1px;transition:all .15s}.ti:hover{background:var(--slideAlt)}.ti.a{color:var(--accent);background:var(--accentLight);font-weight:700}.ti .x{color:var(--textLight);margin-right:8px;font-weight:600;font-size:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.fr{display:flex;gap:16px}.cd{background:var(--slideAlt);border-radius:6px;padding:10px 12px}table{width:100%;border-collapse:collapse;font-size:10px}th{padding:5px 8px;text-align:left;font-weight:700;font-size:8px;letter-spacing:.5px;text-transform:uppercase}td{padding:5px 8px;font-size:10px;color:var(--text)}.thd th{background:var(--headerBg);color:#fff}tr.al{background:var(--slideAlt)}.tb{display:flex;gap:0;margin-bottom:10px;border-bottom:2px solid var(--border)}.tbtn{font-size:10px;font-weight:500;color:var(--textMid);background:none;border:none;border-bottom:3px solid transparent;padding:5px 10px;margin-bottom:-2px;transition:all .2s}.tbtn.a{font-weight:700;color:var(--accent)}.co{border-radius:6px;padding:8px 12px;border-left:3px solid}.co-a{background:var(--accentLight);border-color:var(--accent)}.co-w{background:var(--warmLight);border-color:var(--warm)}.co-am{background:var(--amberLight);border-color:var(--amber)}.co-b{background:var(--blueLight);border-color:var(--blue)}.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}.sb-s.a{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

<script>
const S=[{"id":0,"type":"title","title":"CCMA Exam\nReadiness & Review","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Fifteen","tags":["Comprehensive Review — All 14 Weeks Covered"],"fs":34},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Recall normal ranges for all adult vital signs including HR, BP, RR, temp, SpO₂, and pain","Identify correct EKG lead placement for all 12 leads","Describe order of draw, vein of choice, and specimen collection procedures","Compare ID, SC, and IM injection routes by site, gauge, angle, and max volume","Identify medication classifications, controlled substance schedules, ADME, and 9 rights","Apply dosage calculation formulas and metric/standard conversions","Describe patient positioning for clinical examinations","Explain wound care, burn classification, emergency response, and R.A.C.E.","Identify common lab tests and diagnostic imaging studies","Summarize HIPAA requirements, PHI violations, and breach reporting","Distinguish consent types, advance directives, and mandatory reporting obligations","Apply four medical ethics principles to clinical scenarios","Describe scheduling, insurance billing, EOB, preauthorization, and documentation rules","Explain infection control: chain of infection, precautions, PPE, sterilization, biohazard disposal","Demonstrate therapeutic communication, teach-back, and professional standards","Apply medical terminology across clinical and administrative contexts"]},{"id":2,"type":"cards","title":"Exam Blueprint — Five Domains","cols":5,"cards":[{"title":"Domain 1 (~40%)","desc":"Patient Care & Clinical Procedures: vitals, EKG, injections, specimens, wounds, positioning, sterile field","color":"#D94F4F","b":"top"},{"title":"Domain 2 (~20%)","desc":"Administrative: scheduling, insurance, billing, coding, records, EHR, CPOE, inventory","color":"#4A90D9","b":"top"},{"title":"Domain 3 (~15%)","desc":"Medical Terminology & Anatomy: prefixes, suffixes, roots, body systems, directional terms","color":"#3DAE8E","b":"top"},{"title":"Domain 4 (~15%)","desc":"Law, Ethics & Rights: HIPAA, consent, directives, mandatory reporting, ethics principles","color":"#E8853D","b":"top"},{"title":"Domain 5 (~10%)","desc":"Infection Control & Safety: chain of infection, precautions, PPE, hand hygiene, sterilization, biohazard","color":"#8B6FC0","b":"top"}]},{"id":3,"type":"table","title":"Vital Signs — Complete Reference","hd":["Vital Sign","Normal Adult","Key Exam Facts"],"rows":[["Heart Rate","60–100 bpm","Radial artery most common. Brady- <60, Tachy- >100. Apical if irregular."],["Blood Pressure","<120/80 mmHg","1st Korotkoff = systolic; last = diastolic. Stage 1: 130–139/80–89. Seated, arm at heart level."],["Respiratory Rate","12–20 breaths/min","Count without telling patient. Tachypnea >20. Bradypnea <12."],["Temperature","97.0–99.0°F","Accuracy: rectal > temporal > tympanic > oral > axillary. Pinna UP (adult), DOWN (child)."],["SpO₂","95–100%","<95% = intervention; <90% = critical. Nail polish and cold affect accuracy."],["Pain","Patient-rated 0–10","Subjective. Document patient's own rating. Wong-Baker FACES for children."]]},{"id":4,"type":"tab","title":"Injections, Order of Draw & Specimens","tk":"0","tabs":[{"n":"Injection Routes","c":"#D94F4F","items":[{"l":"ID (10–15°)","d":"25–27G, ¼–½ inch, ≤0.1 mL. Inner forearm. Wheal must form for TB test."},{"l":"SC (45°)","d":"23–25G, 5/8 inch, ≤1.5 mL. Upper arm, abdomen, thigh. Pinch 1 inch."},{"l":"IM Deltoid (90°)","d":"22–25G, 1–1½ inch, ≤1 mL. Adults only."},{"l":"IM Vastus Lat (90°)","d":"22–25G, 1–1½ inch, ≤3 mL. Preferred for infants/children <3."}]},{"n":"Order of Draw","c":"#E8853D","items":["Yellow (Sterile): Blood cultures — first to prevent contamination","Light Blue: Coagulation (PT, PTT) — must be filled completely","Red / Gold SST: Chemistry, serology — invert 5×","Green (Heparin): Electrolytes, BMP, ammonia — invert 8×","Lavender (EDTA): CBC, blood bank — invert 8×","Gray (Fluoride): Glucose tolerance, blood alcohol — invert 8×","Mnemonic: Stop Looking Right Now Later (Sterile-Blue-Red-Green-Lavender-Gray)"]},{"n":"Specimen Collection","c":"#3DAE8E","items":[{"l":"Venipuncture","d":"Median cubital vein first choice. Seated, arm extended."},{"l":"Capillary (fingerstick)","d":"Side of fingertip. Wipe first drop; use second. Alcohol — let dry."},{"l":"Clean-catch UA","d":"Clean area → void small amount → collect midstream in sterile container."},{"l":"24-hour urine","d":"Discard first void → collect ALL for 24 hours → refrigerate."},{"l":"Fasting glucose","d":"8–12 hours fasting. Water OK. HbA1c does NOT require fasting."}]}]},{"id":5,"type":"table","title":"Medical Terminology — High-Yield","hd":["Prefix/Suffix","Meaning","Example","Definition"],"rows":[["brady-","Slow","Bradycardia","Heart rate <60 bpm"],["tachy-","Fast","Tachycardia","Heart rate >100 bpm"],["hypo-","Below/deficient","Hypoglycemia","Low blood sugar"],["hyper-","Above/excessive","Hyperglycemia","High blood sugar"],["peri-","Around","Pericardium","Tissue around the heart"],["intra-","Within","Intradermal","Within the skin layers"],["gastro-","Stomach","Gastroenteritis","Inflammation of stomach/intestines"],["-itis","Inflammation","Appendicitis","Inflammation of appendix"],["-ectomy","Surgical removal","Appendectomy","Removal of appendix"],["-pathy","Disease","Neuropathy","Nerve disease"],["-scope","Viewing instrument","Otoscope","Instrument for viewing ear"],["-algia","Pain","Neuralgia","Nerve pain"],["-plasty","Surgical repair","Rhinoplasty","Repair of the nose"]]},{"id":6,"type":"twocol","title":"Anatomy — High-Yield Body Systems","lt":"Cardiovascular & Respiratory","lc":"var(--warm)","li":[{"l":"Heart chambers","d":"4 chambers. Right = deoxy to lungs. Left = oxy to body via aorta."},{"l":"Key fact","d":"Pulmonary VEIN carries oxygenated blood FROM lungs TO heart."},{"l":"Conduction","d":"SA node (pacemaker) → AV → Bundle of His → Purkinje. Medulla controls HR/RR."},{"l":"Respiratory tract","d":"Upper: nose, pharynx, larynx, trachea. Lower: bronchi, bronchioles, alveoli."},{"l":"Breathing","d":"Diaphragm contracts → air in. Relaxes → air out."}],"rt":"GI & Nervous Systems","rc":"var(--blue)","ri":[{"l":"GI tract","d":"Mouth → esophagus → stomach → small intestine → large intestine → rectum → anus."},{"l":"Key fact","d":"Small intestine = primary nutrient ABSORPTION. Large intestine = water absorption."},{"l":"Pancreas","d":"Produces insulin (beta cells) and digestive enzymes. NOT the liver."},{"l":"CNS vs PNS","d":"CNS: brain + spinal cord. PNS: all nerves outside CNS."},{"l":"Brain regions","d":"Cerebrum = thinking. Cerebellum = balance. Medulla = vital sign regulation."}]},{"id":7,"type":"table","title":"Pharmacology — Classifications & Schedules","hd":["Classification","Indication","Examples"],"rows":[["Analgesics","Pain relief","Acetaminophen, hydrocodone, codeine"],["Antibiotics","Bacterial infections","Amoxicillin, ciprofloxacin"],["Antihypertensives","Lower BP","Metoprolol, lisinopril, HCTZ"],["Anti-inflammatories","Reduce inflammation","Ibuprofen, naproxen, aspirin"],["Diuretics","Eliminate fluid","Furosemide, HCTZ"],["Oral Hypoglycemics","Lower glucose (Type 2)","Metformin, glyburide"],["Bronchodilators","Relax airways","Albuterol, theophylline"],["Anticoagulants","Prevent clotting","Warfarin, heparin, apixaban"]],"note":"Schedule I: no medical use (heroin). II: high abuse, locked (morphine, fentanyl). III–V: decreasing abuse potential. 9 Rights apply every time. Document AFTER administration."},{"id":8,"type":"table","title":"Patient Positioning Reference","hd":["Position","Used For","Key Detail"],"rows":[["Supine","Head, chest, abdominal exams","Chest to feet draping"],["Prone","Back exams, posterior surgery","Face to one side"],["Dorsal Recumbent","Vaginal, rectal, perineal","Knees bent, feet flat"],["Lithotomy","Pap test, pelvic exams","Stirrups; buttocks to edge"],["Fowler's (90°)","Breathing difficulty","Over lap and legs"],["Semi-Fowler's (45°)","Post-surgical, respiratory","Over lap and legs"],["Left Lateral Sims","Rectal exams, enemas","Diagonal drape"],["Knee-Chest","Proctologic, sigmoidoscopy","Thighs perpendicular"]]},{"id":9,"type":"twocol","title":"Wound Care, Burns & Emergency Response","lt":"Wound Healing & Burns","lc":"var(--warm)","li":[{"l":"Healing phases","d":"Hemostasis (clotting) → Inflammation (days 1–4) → Proliferation (new tissue) → Remodeling (scar)."},{"l":"1st degree burn","d":"Epidermis only — redness, pain, no blisters."},{"l":"2nd degree","d":"Epidermis + dermis — blistering, moist, painful."},{"l":"3rd degree","d":"Full thickness — no pain (nerve damage), white/leathery/charred."},{"l":"Seizure","d":"Protect/clear area. Don't restrain. Nothing in mouth. Side position after."}],"rt":"Emergency Response","rc":"var(--blue)","ri":[{"l":"Anaphylaxis","d":"Epinephrine IM + call 911 immediately. Do not delay."},{"l":"Fire (R.A.C.E.)","d":"Rescue → Alarm → Confine → Extinguish/Evacuate."},{"l":"Fire extinguisher (P.A.S.S.)","d":"Pull pin → Aim low → Squeeze → Sweep."},{"l":"Heavy bleeding","d":"Direct pressure with sterile dressing. Don't lift to check. Elevate."},{"l":"Key principle","d":"Safety first — act, then document. Never delay safety action."}]},{"id":10,"type":"tab","title":"HIPAA, Consent & Ethics","tk":"1","tabs":[{"n":"HIPAA & Records","c":"#D94F4F","items":[{"l":"HIPAA protects","d":"All PHI — electronic, paper, verbal. Filing securely = NOT a violation."},{"l":"Violations","d":"Discussing in public, accessing without authorization."},{"l":"Breach response","d":"Report to supervisor immediately — intent doesn't matter."},{"l":"Record ownership","d":"Facility owns record. Patient owns data — right to review, copy, correct."},{"l":"Release","d":"Signed authorization required. Exceptions: abuse, court order, communicable disease."}]},{"n":"Consent & Directives","c":"#4A90D9","items":[{"l":"Informed consent","d":"Competent adult + full info (risks, benefits, alternatives) + voluntary."},{"l":"Implied","d":"Inferred from actions. Also applies in emergencies when unconscious."},{"l":"Minors","d":"Parent/guardian. Exceptions: STI, birth control, pregnancy, substance abuse, emancipated."},{"l":"Living Will","d":"Patient's written treatment instructions."},{"l":"DPOA","d":"Names healthcare agent to decide. DNR: no CPR/ACLS. POLST: medical orders."}]},{"n":"Ethics & Reporting","c":"#3DAE8E","items":[{"l":"Nonmaleficence","d":"Do no harm."},{"l":"Beneficence","d":"Act in patient's best interest."},{"l":"Autonomy","d":"Patient's right to decide — including refusal."},{"l":"Justice","d":"Treat all patients fairly and equitably."},{"l":"Mandatory reporting","d":"Suspected abuse (suspicion sufficient), communicable diseases, criminal acts."},{"l":"Patient refusal","d":"Document fully and inform physician immediately."}]}]},{"id":11,"type":"tab","title":"Infection Control & Administrative Skills","tk":"2","tabs":[{"n":"Infection Control","c":"#8B6FC0","items":["Chain of infection: 6 links — break ANY one to stop transmission","Soap & water REQUIRED: after blood/body fluids, before aseptic procedures, after gloves","PPE donning: gown → mask → goggles → gloves. Doffing: reverse (gloves first)","N95 for airborne (TB, measles, varicella). Surgical mask NOT sufficient","Autoclave: 250–270°F. Wrapped: 30 min. Sterile 30 days if dry/intact","Sharps: never recap. Seal container at 2/3 full. Biohazard bag for contaminated soft items"]},{"n":"Administrative","c":"#4A90D9","items":[{"l":"Scheduling","d":"Verify DOB, insurance, reason, provider availability. Insurance before appointment."},{"l":"Insurance","d":"Primary billed first. Secondary covers remainder. Preauth ≠ guaranteed zero cost."},{"l":"EOB","d":"Amount billed, insurer paid, patient owes. Investigate partial payments."},{"l":"Record rules","d":"Black/dark blue ink. Date/time every entry. No white-out. Late entries labeled."},{"l":"EHR/CPOE","d":"EMR = one org. EHR = cross-org. CPOE flags interactions. E-prescribing mandated in many states."}]},{"n":"Communication","c":"#3DAE8E","items":[{"l":"Therapeutic techniques","d":"Active listening, paraphrasing, open-ended questions, empathy."},{"l":"Assertive style","d":"Ideal — direct, clear, respectful. Match this energy."},{"l":"Aggressive patient","d":"Stay calm, lower voice, never match aggression."},{"l":"Language barrier","d":"Professional interpreter ALWAYS. Never family for clinical translation."},{"l":"Teach-back","d":"Patient explains in own words. Assess comprehension before leaving."},{"l":"Scope of practice","d":"When unsure: consult supervising provider. Never guess."}]}]},{"id":12,"type":"cards","title":"Commonly Missed — Know These Cold","cols":2,"cards":[{"title":"Clinical Tricky Points","desc":"Pulmonary VEIN carries oxy blood FROM lungs. Rectal temp = most accurate. Blue BEFORE Red in order of draw. ID = 10–15° (not SC). Brady = slow. Mild illness ≠ vaccine contraindication. Seizure: nothing in mouth. 24hr urine: discard FIRST void. Capillary: wipe FIRST drop. Multi-dose vial = 28 days.","color":"#D94F4F"},{"title":"Administrative & Ethics Tricky Points","desc":"Filing records securely = NOT a HIPAA violation. Report accidental PHI breaches immediately. DPOA names a PERSON; living will specifies DECISIONS. MI = heart attack (not myocarditis). HbA1c = no fasting. Pap = cervical cancer. When unsure: consult supervising provider FIRST. 'Ignore' and 'do nothing' are NEVER correct on the exam.","color":"#4A90D9"}]},{"id":13,"type":"cards","title":"Exam Day Strategy","cols":3,"cards":[{"title":"Read All Answers First","desc":"First answer that sounds right may not be BEST. Exam writers include partially correct distractors. Read all four, then choose.","color":"#3DAE8E"},{"title":"HIPAA/Ethics Questions","desc":"Correct answer almost always = report, document, or consult supervisor. 'Ignore' and 'do nothing' are never correct.","color":"#E8853D"},{"title":"Scope of Practice","desc":"When unsure: ALWAYS consult supervising provider. Never guess, never proceed without guidance. 'Ask a colleague' alone is incomplete.","color":"#4A90D9"},{"title":"'All of the Above'","desc":"If all individual choices are clinically accurate, 'all of the above' is usually correct. Eliminate only if one option is wrong.","color":"#8B6FC0"},{"title":"Safety-First Emergencies","desc":"Prioritize patient safety. Act first, document after. Seizure: clear area. Anaphylaxis: epi + 911. Bleeding: direct pressure.","color":"#D94F4F"},{"title":"Communication Questions","desc":"Best answers: active listening, simple language, professional interpreter. Never speak louder. Never use family to translate clinical content.","color":"#B8860B"}]},{"id":14,"type":"quiz","title":"Practice Questions — Part 1","questions":[{"q":"Normal resting heart rate for an adult?","options":["40–60 bpm","60–100 bpm","100–120 bpm","80–110 bpm"],"correct":1,"explanation":"Normal adult HR is 60–100 bpm."},{"q":"Which carries oxygenated blood FROM lungs TO heart?","options":["Pulmonary artery","Pulmonary vein","Aorta","Superior vena cava"],"correct":1,"explanation":"Pulmonary VEIN carries oxygenated blood from lungs to heart — a common trick question."},{"q":"Which is NOT a HIPAA violation?","options":["Sharing info without consent","Discussing patient in public","Filing records in a secure location","Accessing records without authorization"],"correct":2,"explanation":"Filing records securely is proper HIPAA compliance — not a violation."},{"q":"Patient refuses treatment. MA should:","options":["Convince patient to comply","Document refusal & inform physician","Ignore and proceed","Ask to sign a release"],"correct":1,"explanation":"Document the refusal fully and immediately inform the physician."},{"q":"Proper order of draw for venipuncture?","options":["Red, green, lavender, blue","Blue, red, green, lavender","Green, blue, red, lavender","Lavender, red, blue, green"],"correct":1,"explanation":"Blue (coagulation) before Red. Order: Yellow → Blue → Red → Green → Lavender → Gray."},{"q":"First step AFTER a needlestick exposure?","options":["Complete incident form","Wash wound with soap and water","Notify supervisor","Contact patient's provider"],"correct":1,"explanation":"Immediately wash with soap and water — then report, then document."}]},{"id":15,"type":"quiz","title":"Practice Questions — Part 2","questions":[{"q":"Correct needle gauge for IM injection?","options":["16–18 gauge","21–23 gauge","25–27 gauge","30–32 gauge"],"correct":1,"explanation":"IM: 21–23 gauge (22–25G range). ID uses 25–27G."},{"q":"Surface contaminated with body fluids — MA should:","options":["Wipe with dry cloth","Use healthcare-approved disinfectant","Spray with water","Apply hand sanitizer to surface"],"correct":1,"explanation":"Use an approved disinfectant — not just water or sanitizer."},{"q":"EKG lead V1 placement?","options":["Right sternum, 2nd ICS","Right sternum, 4th ICS","Left midclavicular, 5th ICS","Mid-axillary, 5th ICS"],"correct":1,"explanation":"V1 = right of sternum, 4th intercostal space."},{"q":"Brain area regulating heart rate and breathing?","options":["Cerebrum","Cerebellum","Medulla oblongata","Hippocampus"],"correct":2,"explanation":"Medulla oblongata regulates vital signs — HR and RR."},{"q":"Term 'bradycardia' means:","options":["Slow heart rate","Rapid heart rate","Abnormal rhythm","High blood pressure"],"correct":0,"explanation":"Brady- = slow. Bradycardia = heart rate <60 bpm."},{"q":"Fasting blood glucose — patient fasts for:","options":["2 hours","4 hours","8–12 hours","24 hours"],"correct":2,"explanation":"8–12 hours fasting. Water allowed. HbA1c does NOT require fasting."}]},{"id":16,"type":"takeaways","title":"Final Review Reminders","items":["HR: 60–100 bpm. Brady <60. Tachy >100. Radial artery routine. Apical if irregular.","Order of draw: Blue → Red → Green → Lavender → Gray. HbA1c: no fasting. Median cubital first.","IM: 21–23G, 90°, deltoid (≤1 mL) or vastus lateralis (<3 yrs). Never recap used needles.","HIPAA: filing securely = NOT violation. Public discussion = IS. Report accidental disclosures immediately.","Seizure: clear area, don't restrain, nothing in mouth. Anaphylaxis: epi + 911. Fire: R.A.C.E.","Informed consent: competent + full info + voluntary. Minors need parent except STI/pregnancy/emancipated.","Communication: calm, simple language, professional interpreter. Never family for clinical translation.","When unsure: consult supervising provider. Never guess. Scope of practice varies by state.","Pulmonary VEIN = oxy FROM lungs. Medulla = HR/RR. Small intestine = absorption. Pancreas = insulin.","Autoclave: 30 min wrapped, sterile 30 days if dry/intact. Sharps sealed at 2/3 full. Never recap."]},{"id":17,"type":"end","title":"You Are Ready","subtitle":"CCMA Exam Readiness & Review","message":"Trust your preparation. Read every answer before choosing. Safety first in emergencies. Report and document when in doubt. You've got this."}];
const total=S.length;let cur=0;let st={};
function e(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function go(n){if(n<0||n>=total)return;cur=n;render()}
function toggleTOC(){document.getElementById('tocO').classList.toggle('hidden');document.getElementById('tB').classList.toggle('act')}
function closeTOC(){document.getElementById('tocO').classList.add('hidden');document.getElementById('tB').classList.remove('act')}
document.addEventListener('keydown',ev=>{if(ev.key==='ArrowRight'||ev.key===' '){ev.preventDefault();go(cur+1)}if(ev.key==='ArrowLeft'){ev.preventDefault();go(cur-1)}if(ev.key==='Escape')closeTOC()});
function render(){document.getElementById('W').innerHTML=rS(S[cur]);document.getElementById('dots').innerHTML=S.map((_,i)=>`<div class="dot ${i===cur?'c':i<cur?'v':'f'}" onclick="go(${i})"></div>`).join('');document.getElementById('pB').disabled=cur===0;document.getElementById('nB').disabled=cur===total-1;document.getElementById('tocL').innerHTML=S.map((s,i)=>`<div class="ti ${i===cur?'a':''}" onclick="go(${i});closeTOC()" style="color:${i===cur?'var(--accent)':'var(--textMid)'}"><span class="x">${String(i+1).padStart(2,'0')}</span>${e(s.title)}</div>`).join('')}
function rs(){st={objShown:new Set([0]),t0:0,t1:0,t2:0,t3:0,t4:0,stp:0,takeaways:{},qi:0,qs:null,qa:false,qsc:0,qd:false}}rs();
function H(i,t){return `<div class="sh"><div class="n">${String(i+1).padStart(2,'0')}</div><div class="t">${e(t)}</div></div>`}
function F(i){return `<div class="ft"><span class="l">Medical Assistant Program • Week 15</span><span class="r">${i+1} / ${total}</span></div>`}
function rS(s){const m={title:rTitle,objectives:rObj,cards:rCards,twocol:rTC,table:rTbl,tab:rTab,takeaways:rTake,quiz:rQuiz,end:rEnd,step:rStep};return m[s.type]?m[s.type](s,s.id):''}
function rTitle(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px;position:relative"><div style="position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:6px"><div style="width:24px;height:2px;background:var(--accent)"></div><span style="font-size:9px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase">${e(s.subtitle)}</span></div><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">${e(s.week)}</div><h1 style="font-family:var(--ff);font-size:${s.fs||34}px;font-weight:700;color:#fff;margin:0;line-height:1.25;white-space:pre-line">${e(s.title)}</h1><div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center">${s.tags.map(t=>`<span class="tag">${e(t)}</span>`).join('')}</div><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:${s.objectives.length>12?'2':'3'}px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}" style="min-width:${s.objectives.length>12?'20':'22'}px;height:${s.objectives.length>12?'20':'22'}px;font-size:${s.objectives.length>12?'9':'10'}px">${j+1}</div><div style="font-size:${s.objectives.length>12?'9':'10'}px;color:var(--text);line-height:1.35;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:3px;font-style:italic">Click to reveal</p>':''}</div>${F(i)}</div>`}
function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb">${s.desc?`<p style="font-size:10px;color:var(--textMid);margin:0 0 8px">${e(s.desc)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:7px">${s.cards.map(c=>`<div class="cd" style="border-${c.b||'left'}:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div>${s.note?`<div class="co co-${s.nt||'a'}" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${s.note?`<div style="font-size:9px;color:var(--textMid);font-style:italic;margin-top:4px">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;const qSlide=S[cur];if(qSlide&&qSlide.questions&&j===qSlide.questions[st.qi].correct)st.qsc++;render()}
function nQ(){const qSlide=S[cur];if(st.qi<qSlide.questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
