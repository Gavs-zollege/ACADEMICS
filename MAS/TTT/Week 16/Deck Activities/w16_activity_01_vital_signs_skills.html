<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Vital Signs Skills Check</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0b1e2d,#0f2a3d,#162040);font-family:'Nunito',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#2dd4bf;font-weight:800;font-size:14px}.bar{height:6px;background:#1a3d50;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#2dd4bf,#fb7185);border-radius:10px;transition:width .4s}.question{background:#112d3f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #2dd4bf}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1a3d50;border:2px solid #1a3d50;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#2dd4bf;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#112d3f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#112d3f;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#2dd4bf;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">❤️</div><h1>Vital Signs Skills Check</h1><p class="sub">Technique, documentation & abnormal findings</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"When counting pulse, never use your:",opts:["Index finger","Middle finger","Thumb — it has its own pulse that interferes","Ring finger"],a:2,tip:"Use 2–3 fingertips (index + middle). The thumb has its own pulse."},{q:"Pulse documentation should include:",opts:["Rate only","Rate, rhythm, and strength","Rate and time only","Just normal or abnormal"],a:1,tip:"Always document rate (bpm), rhythm (regular/irregular), and strength (strong/weak/thready)."},{q:"BP cuff size should cover ___ of the upper arm circumference.",opts:["50%","60%","80%","100%"],a:2,tip:"80% coverage. Too small = falsely high reading. Too large = falsely low."},{q:"You should count respirations:",opts:["After telling the patient","Without telling the patient — count right after pulse","Only with a stethoscope","For exactly 10 seconds"],a:1,tip:"Count without announcing. Patient will alter their breathing if they know."},{q:"SpO2 below ___% requires immediate intervention.",opts:["98%","95%","90%","85%"],a:2,tip:"<95% warrants attention. <90% is critical — report and intervene immediately."},{q:"Pain assessment is documented as:",opts:["Your estimation of their pain level","The patient exact self-reported 0–10 number","Normal or abnormal","Mild, moderate, or severe only"],a:1,tip:"Pain is subjective. Document the patient exact number. Never estimate for them."},{q:"Before taking blood pressure, the patient should rest for:",opts:["No rest needed","2 minutes","5 minutes with feet flat and arm at heart level","15 minutes"],a:2,tip:"5 minutes, seated, feet flat, arm supported at heart level. Cuff on bare skin."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Trust your training. Follow the steps. You are ready.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
