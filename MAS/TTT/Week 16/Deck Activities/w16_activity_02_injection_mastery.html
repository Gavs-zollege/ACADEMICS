<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Injection Technique Mastery</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1a0a0f,#28101a,#180a18);font-family:'DM+Sans',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#fb7185;font-weight:800;font-size:14px}.bar{height:6px;background:#351828;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#fb7185,#fb7185);border-radius:10px;transition:width .4s}.question{background:#28101a;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #fb7185}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#351828;border:2px solid #351828;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#fb7185;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#28101a}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#28101a;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#fb7185;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">💉</div><h1>Injection Technique Mastery</h1><p class="sub">Sites, angles, gauges & safety for all routes</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"ID injection: a wheal (bleb) must form. If no wheal appears, it means:",opts:["The injection was successful","The injection was placed too deep — invalid","The medication was absorbed too fast","The needle was too large"],a:1,tip:"No wheal = too deep. The bleb confirms correct intradermal placement."},{q:"For SC injection, you should ___ at least 1 inch of skin before inserting.",opts:["Stretch","Pinch — then release after needle is seated","Slap","Massage"],a:1,tip:"Pinch to lift subcutaneous tissue away from muscle. Release after needle is in."},{q:"After an ID injection (TB test), you should NOT:",opts:["Circle the site with a marker","Tell patient to return in 48–72 hours","Massage, bandage, or rub the site","Document the injection"],a:2,tip:"No massage, no bandage, no rubbing. This disperses the antigen and invalidates the test."},{q:"Deltoid IM maximum volume is:",opts:["0.5 mL","1 mL","2 mL","3 mL"],a:1,tip:"Deltoid max = 1 mL. For larger volumes, use ventrogluteal (up to 3 mL)."},{q:"The injection site should be cleaned with alcohol for ___ seconds.",opts:["5","15","30 — then allow to fully air dry","60"],a:2,tip:"30 seconds outward circular motion. Let it dry completely before injecting."},{q:"After any injection, the patient should wait:",opts:["They can leave immediately","5 minutes","20–30 minutes for observation","1 hour"],a:2,tip:"20–30 minutes to monitor for allergic reactions. Document any reactions."},{q:"Insulin injection sites should be rotated within the same region to prevent:",opts:["Bruising","Lipodystrophy — fatty lumps from repeated injections","Infection","Scarring"],a:1,tip:"Rotate within the region (e.g., different spots on the abdomen) to prevent lipodystrophy."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Trust your training. Follow the steps. You are ready.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
