<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Communication & Professionalism</title><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1a0f20,#241530,#150a1c);font-family:'Lexend',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#f472b6;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1840;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#f472b6,#fb7185);border-radius:10px;transition:width .4s}.question{background:#1c1030;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #f472b6}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1840;border:2px solid #2a1840;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#f472b6;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1030}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1030;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f472b6;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">💬</div><h1>Communication & Professionalism</h1><p class="sub">Patient prep, explanations & professional conduct</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Before any procedure, you should first:",opts:["Start the procedure immediately","Knock, introduce yourself, verify identity with 2 identifiers, and explain","Ask the patient to undress","Check the chart only"],a:1,tip:"Knock → introduce → verify (name + DOB) → explain in plain language. Every time."},{q:"When explaining a procedure, use:",opts:["Medical terminology to sound professional","Plain, simple language the patient can understand","As few words as possible","Written instructions only"],a:1,tip:"Plain language always. Save medical terms for documentation and clinical colleagues."},{q:"If a patient appears anxious during a procedure, you should:",opts:["Ignore it and continue","Pause, acknowledge their concern, and adjust your approach","Speed up to get it over with","Tell them not to worry"],a:1,tip:"Pause, acknowledge, adjust. A tense patient affects readings and their experience."},{q:"After every encounter, before leaving the room:",opts:["Just walk out","Tell the patient what comes next, answer questions, and thank them","Leave a note on the counter","Send them a text later"],a:1,tip:"Close professionally: next steps, answer questions, assist off table if needed, thank them."},{q:"Documentation should happen:",opts:["From memory an hour later","Immediately after the encounter — never from memory later","Before the procedure","At the end of the shift"],a:1,tip:"Document immediately after. Include time, initials, findings, and any patient concerns."},{q:"During your skills assessment, if you make a mistake:",opts:["Pretend it didn't happen","Acknowledge it calmly and correct it — self-correction shows clinical judgment","Start over from the beginning","Ask to skip that station"],a:1,tip:"Self-correction demonstrates critical thinking. Evaluators value it highly."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Trust your training. Follow the steps. You are ready.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
