<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Final Skills Review</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a1628,#0e1d38,#081428);font-family:'Fredoka',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#60a5fa;font-weight:800;font-size:14px}.bar{height:6px;background:#1a3060;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#fb7185);border-radius:10px;transition:width .4s}.question{background:#112240;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #60a5fa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1a3060;border:2px solid #1a3060;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#60a5fa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#112240}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#112240;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#60a5fa;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🏆</div><h1>Final Skills Review</h1><p class="sub">Comprehensive review — everything from Week 16</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Radial pulse is found on the ___ side of the wrist.",opts:["Pinky","Thumb side — below the base of the thumb","Center","Back of the wrist"],a:1,tip:"Thumb side, below the base of the thumb. Use index + middle fingers, never the thumb."},{q:"After taking oral temperature, wait ___ minutes if patient had hot/cold drink.",opts:["5","10","15","30"],a:2,tip:"15 minutes after hot or cold food/drink for accurate oral temperature reading."},{q:"SC injection: after the needle is seated, ___ the pinch before injecting.",opts:["Maintain","Release","Tighten","It does not matter"],a:1,tip:"Release the pinch after the needle is in but before injecting. Inject slowly and steadily."},{q:"V3 is placed:",opts:["Right of sternum, 4th ICS","Between V2 and V4 (diagonal midpoint)","Left midclavicular, 5th ICS","Mid-axillary, 5th ICS"],a:1,tip:"V3 = directly between V2 and V4. That is why V4 is placed first."},{q:"The most common source of EKG errors is:",opts:["Machine malfunction","Misplaced leads","Patient movement","Power surges"],a:1,tip:"Misplaced leads are the #1 source of EKG errors. Double-check all 10 positions."},{q:"Venipuncture needle angle is ___ with bevel ___.",opts:["45° bevel down","90° bevel up","15–30° bevel up","10–15° bevel down"],a:2,tip:"15–30° bevel up for venipuncture. Smooth single-motion insertion."},{q:"The skills assessment evaluates technique, safety, communication, and:",opts:["Speed","Memorization","Documentation — all four matter equally","Appearance only"],a:2,tip:"All four components weighted equally. Technical accuracy alone is not enough."},{q:"Trust your preparation. Follow the steps. You are:",opts:["Not ready yet","Ready — the skills are in your hands","Going to fail","Underprepared"],a:1,tip:"You have trained for 16 weeks. Trust your preparation and let it show. You are ready. 🎓"}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>Trust your training. Follow the steps. You are ready.</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
