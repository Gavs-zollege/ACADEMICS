<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 16 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}.search-wrap input:focus{border-color:var(--red)}.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}.cat-btn:hover{opacity:.85}.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}.item:last-child{border-bottom:none}.item:hover{background:var(--surface2)}.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}.item-left{display:flex;align-items:center;gap:10px}.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}.item.open .item-bar{opacity:1}.item-term{font-size:20px;font-weight:700;color:#fff}.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}.item.open .item-def{display:block}.item.open .item-term{color:var(--red-light)}.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}.pg-btn:disabled{opacity:.3;cursor:default}.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}.pg-dot.active{background:var(--red-light);transform:scale(1.3)}.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 16 Glossary</h1>
  <p class="sub">Building Competency Through Skills Practice</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Vital Signs",color:"#E05555",terms:[
    {term:"Radial Pulse Assessment",def:"The routine method for measuring heart rate in adults using the radial artery located on the thumb side of the wrist."},
    {term:"Apical Pulse",def:"A pulse measurement taken by placing a stethoscope directly over the apex of the heart (left lower chest, 5th intercostal space."},
    {term:"Pulse Deficit",def:"The difference between the apical pulse rate and the radial pulse rate, measured simultaneously by two providers."},
    {term:"Korotkoff Sounds",def:"The five phases of sound heard through a stethoscope while measuring blood pressure by auscultation."},
    {term:"Sphygmomanometer",def:"The instrument used to measure blood pressure, consisting of an inflatable cuff, a pressure gauge (either aneroid or mercury)."},
    {term:"Tachypnea",def:"An abnormally fast respiratory rate, defined in adults as more than 20 breaths per minute."},
    {term:"Bradypnea",def:"An abnormally slow respiratory rate, defined in adults as fewer than 12 breaths per minute."},
    {term:"Auscultation (Respiratory Count)",def:"The practice of counting the respiratory rate without informing the patient — done immediately after measuring the pulse while ..."},
    {term:"Pulse Oximetry (SpO2)",def:"A noninvasive measurement of arterial oxygen saturation using a light-emitting sensor, typically placed on the finger or toe."},
    {term:"Numeric Pain Rating Scale",def:"A standardized tool in which the patient rates their current pain on a scale from 0 (no pain) to 10 (worst possible pain)."},
    {term:"Pyrexia (Fever)",def:"An elevated body temperature above 100.4°F (38°C). Indicates an immune system response, most commonly to infection."},
    {term:"Temperature Measurement Routes",def:"Oral: most common in cooperative adults — wait 15 minutes after hot or cold intake."}
  ]},
  {name:"Injections",color:"#6B7B8D",terms:[
    {term:"Intradermal (ID) Injection — Technique",def:"The most superficial injection route, delivering medication into the dermis (middle layer of skin)."},
    {term:"Wheal (Bleb)",def:"The small, raised, pale bump that forms beneath the skin surface during a correctly performed intradermal injection."},
    {term:"Subcutaneous (SC/SQ) Injection — Technique",def:"An injection into the fatty tissue layer beneath the dermis."},
    {term:"Lipodystrophy",def:"An abnormal change in subcutaneous fat tissue at a frequently injected site — may appear as localized thickening (hypertrophy) ..."},
    {term:"Intramuscular (IM) Injection — Deltoid",def:"An injection into the deltoid muscle of the upper arm, located 2–3 finger-widths below the acromion process of the shoulder."},
    {term:"Intramuscular (IM) Injection — Vastus Lateralis",def:"An injection into the anterolateral aspect of the thigh."},
    {term:"Ventrogluteal IM Site",def:"An intramuscular injection site located in the gluteus medius muscle at the hip."},
    {term:"Bevel-Up Technique",def:"The standard needle orientation during injection and venipuncture — the slanted, angled tip of the needle faces upward."},
    {term:"Z-Track Technique",def:"An IM injection technique used for irritating or staining medications (such as iron dextran) to prevent medication from leaking..."},
    {term:"Medication Reconstitution",def:"The process of dissolving a powdered medication in a liquid diluent to create an injectable solution."}
  ]},
  {name:"EKG & Leads",color:"#8B6AAE",terms:[
    {term:"12-Lead EKG (Electrocardiogram)",def:"A noninvasive diagnostic test that records the heart's electrical activity from 12 different viewpoints using 10 electrodes — 4..."},
    {term:"Precordial (Chest) Leads — V1–V6",def:"The six chest electrodes that record the heart's electrical activity in the horizontal plane."},
    {term:"Limb Leads",def:"The four electrodes applied to the extremities (or torso if mobility is limited): RA (right arm/upper right torso)."},
    {term:"Intercostal Space (ICS)",def:"The anatomical space between two adjacent ribs, numbered by the rib directly above."},
    {term:"Acromion Process",def:"The bony prominence at the top of the shoulder where the scapula meets the clavicle, forming the highest point of the shoulder."},
    {term:"EKG Artifact",def:"Unwanted interference or distortion in the EKG tracing that makes accurate interpretation difficult or impossible."},
    {term:"Lead Misplacement",def:"An EKG error caused by attaching an electrode to the incorrect anatomical position."},
    {term:"Sinus Rhythm",def:"The normal cardiac rhythm originating from the sinoatrial (SA) node — the heart's natural pacemaker located in the right atrium."},
    {term:"P Wave",def:"The first waveform on an EKG tracing, representing atrial depolarization — the electrical impulse spreading through the atria b..."},
    {term:"QRS Complex",def:"The waveform on an EKG tracing that represents ventricular depolarization — the electrical impulse spreading through the ventri..."}
  ]},
  {name:"Phlebotomy",color:"#E74C6F",terms:[
    {term:"Median Cubital Vein",def:"The vein of first choice for routine venipuncture in adults, located in the antecubital fossa (elbow crease)."},
    {term:"Antecubital Fossa",def:"The triangular hollow on the anterior (front) surface of the arm at the bend of the elbow."},
    {term:"Tourniquet Application",def:"A constricting band applied 3–4 inches above the antecubital fossa to slow venous return."},
    {term:"Order of Draw",def:"The required sequence for filling blood collection tubes during venipuncture to prevent additive cross-contamination between tu..."},
    {term:"Hemolysis",def:"The breakdown of red blood cells with release of their contents (including potassium, hemoglobin."},
    {term:"Hematoma",def:"A collection of blood that leaks from a punctured vein into the surrounding tissue."},
    {term:"Specimen Labeling Protocol",def:"The required process for labeling blood collection tubes immediately at the bedside after the draw — never before collection or..."},
    {term:"Capillary Blood Collection",def:"The collection of a small blood sample from capillaries near the skin surface using a lancet to puncture the fingertip (adults)..."},
    {term:"Hemolytic Specimen (Rejection)",def:"A blood specimen in which red blood cell breakdown has occurred, causing the serum or plasma to appear pink or red."},
    {term:"Blood Culture Collection",def:"The collection of blood specimens for microbiological culture to identify the presence and type of bacteria or fungi causing a ..."}
  ]},
  {name:"Clinical Safety",color:"#4A90B8",terms:[
    {term:"Hand Hygiene Protocol",def:"The most evidence-based practice for preventing the spread of healthcare-associated infections."},
    {term:"Two-Identifier Patient Verification",def:"The required process of confirming a patient's identity using two independent identifiers before performing any procedure."},
    {term:"Sharps Safety Protocol",def:"The required sequence of actions when handling sharp instruments used in patient care."},
    {term:"PPE Donning and Doffing",def:"Personal protective equipment must be put on (donned) and removed (doffed) in a specific sequence to prevent self-contamination."},
    {term:"Aseptic Technique",def:"A collection of practices designed to prevent the introduction of pathogens into sterile or clean tissue during clinical proced..."},
    {term:"Sterile Technique vs. Medical Asepsis",def:"Sterile technique (surgical asepsis) eliminates all microorganisms from instruments and the immediate environment — required fo..."},
    {term:"Post-Exposure Protocol",def:"The immediate actions required after occupational exposure to blood, body fluids."},
    {term:"Site Disinfection for Injection/Venipuncture",def:"The process of cleaning the skin at an injection or venipuncture site before needle insertion."}
  ]},
  {name:"Professional Comms",color:"#1A8A7D",terms:[
    {term:"Patient Preparation for Procedures",def:"The process of preparing a patient physically and psychologically before performing any clinical skill."},
    {term:"Procedural Explanation (Informed Verbal Consent)",def:"The brief, clear explanation provided to a patient before a clinical procedure — describing what you are going to do."},
    {term:"Active Listening During Procedures",def:"The practice of remaining fully attentive to a patient's verbal and nonverbal communication throughout a clinical skill — not j..."},
    {term:"Post-Procedure Communication",def:"The standardized set of communications completed after every clinical skill: tell the patient what you found or observed (withi..."},
    {term:"De-escalation Techniques",def:"Communication strategies used to reduce tension, anxiety, or agitation in a patient or family member."},
    {term:"Teach-Back Verification",def:"A communication technique used to confirm that a patient has understood the instructions they received."},
    {term:"Professional Boundaries in Clinical Practice",def:"The defined limits that maintain a therapeutic, professional relationship between a healthcare worker and the patient."}
  ]},
  {name:"Externship",color:"#E2B94C",terms:[
    {term:"Clinical Externship",def:"A supervised, unpaid clinical experience in a real healthcare setting that is required for completion of the Medical Assistant ..."},
    {term:"Externship Hours Requirement",def:"The minimum number of supervised clinical hours that must be completed and documented at an approved externship site to fulfill..."},
    {term:"CCMA (Certified Clinical Medical Assistant)",def:"A nationally recognized professional credential awarded by the National Healthcareer Association (NHA) upon successful completi..."},
    {term:"Certification Examination Eligibility",def:"The set of requirements that must be met before a student may sit for the CCMA certification exam."},
    {term:"Scope of Practice (Externship)",def:"The specific tasks and procedures a Medical Assistant student is authorized to perform during the clinical externship."},
    {term:"Clinical Supervision",def:"The direct or indirect oversight of a student's clinical activities by a licensed provider or credentialed healthcare professio..."},
    {term:"Professional Reference (Externship)",def:"A professional who can speak to a job applicant's clinical skills, work ethic, reliability, communication."},
    {term:"Continuing Education (CE)",def:"Educational activities completed after initial certification to maintain current knowledge and fulfill recertification requirem..."}
  ]},
  {name:"Skills Assessment",color:"#4CAF90",terms:[
    {term:"Competency Evaluation",def:"A structured assessment in which a student or employee demonstrates their ability to perform a specific clinical skill accurately."},
    {term:"Skills Checkoff",def:"A formalized performance evaluation in which a student demonstrates a specific clinical skill to an evaluator who documents whe..."},
    {term:"Return Demonstration",def:"A patient education technique in which a patient is asked to perform a skill or procedure back to the MA after being taught — c..."},
    {term:"Self-Correction in Clinical Skills",def:"The ability of a student or clinician to recognize an error mid-procedure, stop, acknowledge it."},
    {term:"Deliberate Practice",def:"A focused, intentional approach to skills practice in which a learner specifically targets weak areas."},
    {term:"Clinical Documentation Accuracy",def:"The standard requiring that all entries in the patient's medical record are complete, truthful, timely, and properly formatted."},
    {term:"Certification Exam Strategy",def:"The approach a student takes to preparing for and performing on a national certification examination."}
  ]}
];
const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
