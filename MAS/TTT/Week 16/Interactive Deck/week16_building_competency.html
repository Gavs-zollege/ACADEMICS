s:center}.dot{height:5px;border-radius:3px;cursor:pointer;transition:all .3s}.dot.c{width:16px;background:var(--accent)}.dot.v{width:5px;background:var(--darkSub)}.dot.f{width:5px;background:rgba(0,0,0,.12)}.to{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:500;display:flex;align-items:center;justify-content:center}.tp{background:#fff;border-radius:12px;padding:24px 20px;max-height:70vh;overflow-y:auto;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.tt{font-family:var(--ff);font-size:16px;font-weight:700;color:var(--text);margin-bottom:12px}.ti{font-size:12px;padding:6px 10px;border-radius:5px;cursor:pointer;margin-bottom:1px;transition:all .15s}.ti:hover{background:var(--slideAlt)}.ti.a{color:var(--accent);background:var(--accentLight);font-weight:700}.ti .x{color:var(--textLight);margin-right:8px;font-weight:600;font-size:10px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:6px}.fr{display:flex;gap:16px}.cd{background:var(--slideAlt);border-radius:6px;padding:10px 12px}table{width:100%;border-collapse:collapse;font-size:10px}th{padding:5px 8px;text-align:left;font-weight:700;font-size:8px;letter-spacing:.5px;text-transform:uppercase}td{padding:5px 8px;font-size:10px;color:var(--text)}.thd th{background:var(--headerBg);color:#fff}tr.al{background:var(--slideAlt)}.tb{display:flex;gap:0;margin-bottom:10px;border-bottom:2px solid var(--border)}.tbtn{font-size:10px;font-weight:500;color:var(--textMid);background:none;border:none;border-bottom:3px solid transparent;padding:5px 10px;margin-bottom:-2px;transition:all .2s}.tbtn.a{font-weight:700;color:var(--accent)}.co{border-radius:6px;padding:8px 12px;border-left:3px solid}.co-a{background:var(--accentLight);border-color:var(--accent)}.co-w{background:var(--warmLight);border-color:var(--warm)}.co-am{background:var(--amberLight);border-color:var(--amber)}.co-b{background:var(--blueLight);border-color:var(--blue)}.tag{font-size:10px;font-weight:600;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:4px 12px;letter-spacing:.5px}@keyframes sF{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}.hidden{display:none!important}.or{display:flex;gap:10px;align-items:flex-start;opacity:.25;cursor:pointer;transition:opacity .4s}.or.s{opacity:1}.oc{min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700}.oc.on{background:var(--accent);color:#fff}.oc.off{background:var(--border);color:var(--textLight)}.qo{font-size:11px;text-align:left;padding:9px 12px;border-radius:6px;border:2px solid var(--border);background:var(--slideAlt);color:var(--text);transition:all .25s;width:100%;display:block;margin-bottom:4px}.qo:hover:not(.d){border-color:var(--accent)}.qo.cr{background:var(--accent);color:#fff;font-weight:700;border-color:var(--accent)}.qo.wr{background:var(--warm);color:#fff;font-weight:700;border-color:var(--warm)}.tw{display:flex;gap:8px;align-items:flex-start;padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:var(--slideAlt);cursor:pointer;transition:all .25s}.tw.ck{background:var(--accentLight);border-color:var(--accent)}.tw .bx{min-width:16px;height:16px;border-radius:3px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--accent);flex-shrink:0}.tw.ck .bx{border-color:var(--accent)}.tw .lb{font-size:10px;color:var(--text);line-height:1.45}.tw.ck .lb{color:var(--accent);text-decoration:line-through}.sb-s{font-size:10px;text-align:left;border-radius:5px;padding:5px 9px;min-width:130px;transition:all .2s;border:1px solid var(--border);background:transparent;color:var(--textMid);font-weight:500}.sb-s.a{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}

<script>
const S=[{"id":0,"type":"title","title":"Building Competency\\nThrough Skills Practice","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Sixteen","tags":["Vital Signs","Injections","EKG","Phlebotomy","Externship Completion"],"fs":28},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Demonstrate accurate measurement and documentation of all adult vital signs","Perform ID, SC, and IM injections with correct site, gauge, angle, and technique","Set up and perform a 12-lead EKG with correct electrode placement and artifact correction","Perform venipuncture and capillary draws following correct order of draw and labeling","Apply clinical safety standards — hand hygiene, PPE, patient ID, sharps disposal, sterile technique","Demonstrate professional communication — patient prep, procedure explanation, post-procedure instructions","Submit all remaining externship hours to complete the MA program"]},{"id":2,"type":"cards","title":"What Week Sixteen Is All About","cols":2,"desc":"Everything from the last 15 weeks comes together. This is about demonstrating what you can actually do.","cards":[{"title":"❤️ Vital Signs","desc":"All six vital signs with correct technique, documentation, and abnormal value identification.","color":"#D94F4F"},{"title":"💉 Injection Practice","desc":"ID, SC, and IM at correct site, angle, gauge — with proper patient prep and sharps safety.","color":"#4A90D9"},{"title":"📋 EKG Practice","desc":"12-lead EKG with all 10 electrodes correctly placed — identify and resolve artifact.","color":"#3DAE8E"},{"title":"🔬 Phlebotomy Practice","desc":"Venipuncture in correct order of draw — label tubes, sterile technique, site care.","color":"#8B6FC0"}]},{"id":3,"type":"tab","title":"Vital Signs — Skills Practice Checklist","tk":"0","tabs":[{"n":"Heart Rate & BP","c":"#D94F4F","items":[{"l":"Radial artery","d":"Thumb side of wrist. Two-three fingertips (never thumb). Count 30 sec × 2 or full minute."},{"l":"Document","d":"Rate (beats/min), rhythm (regular/irregular), strength (strong/weak/thready)."},{"l":"Normal HR","d":"60–100 bpm. Report anything outside this range."},{"l":"BP setup","d":"Seated, feet flat, arm at heart level. Rest 5 min. Correct cuff = 80% arm circumference."},{"l":"BP technique","d":"Inflate 20–30 mmHg above lost radial pulse. Deflate 2–3 mmHg/sec. 1st Korotkoff = systolic, last = diastolic."},{"l":"Normal BP","d":"<120/80. Document both numbers and which arm."}]},{"n":"RR, Temp, SpO₂, Pain","c":"#4A90D9","items":[{"l":"RR","d":"Count without telling patient. Watch chest rise/fall. Note rate, rhythm, depth. Normal: 12–20."},{"l":"Technique","d":"Count right after pulse — patient thinks you're still checking pulse."},{"l":"Temperature","d":"Tympanic: pull pinna up and back (adult). Oral: wait 15 min after hot/cold drink. Temporal: swipe forehead."},{"l":"SpO₂","d":"Dry, unpolished finger. Let reading stabilize. Normal: 95–100%. Below 90% = critical."},{"l":"Pain","d":"Ask patient to rate 0–10. Document their exact number — never estimate."},{"l":"Document","d":"All six vital signs together with time and initials."}]}]},{"id":4,"type":"tab","title":"Injection Practice — Technique by Route","tk":"1","tabs":[{"n":"ID & SC","c":"#4A90D9","items":[{"l":"ID (10–15°)","d":"25–27G, ¼–½ inch, ≤0.1 mL. Inner forearm. Bevel UP. Wheal must form — no massage/bandage."},{"l":"ID follow-up","d":"Circle site with marker. Return for reading 48–72 hours."},{"l":"SC (45°)","d":"23–25G, 5/8 inch, ≤1.5 mL. Upper arm, abdomen, upper thigh."},{"l":"SC technique","d":"Pinch ≥1 inch of skin. Insert at 45°. Release pinch after needle seated."},{"l":"Insulin sites","d":"Rotate within same region to prevent lipodystrophy."}]},{"n":"IM Deltoid & Vastus Lat","c":"#D94F4F","items":[{"l":"Deltoid (90°)","d":"22–25G, 1–1½ inch, ≤1 mL. Adults only. 2–3 finger-widths below acromion."},{"l":"Vastus Lateralis (90°)","d":"22–25G, 1–1½ inch, ≤3 mL. Preferred for infants/children <3."},{"l":"Location","d":"Middle third of anterolateral thigh — mid-thigh toward outer surface."},{"l":"Technique","d":"Spread skin taut (don't pinch). Dart-like motion. Inject slowly."},{"l":"Post-injection","d":"Firm pressure with gauze. Don't recap. Patient waits 20–30 min."}]},{"n":"Prep & Sharps Safety","c":"#3DAE8E","items":[{"l":"Hand hygiene first","d":"Wash/sanitize before touching any medication or supply."},{"l":"Nine rights","d":"Patient → Medication → Form → Dose → Route → Time → Technique → Education → Documentation."},{"l":"Three label checks","d":"When removing from storage, when preparing dose, when returning/discarding container."},{"l":"Site prep","d":"Alcohol swab, outward circular motion, let dry 30 sec."},{"l":"NEVER recap used needle","d":"Drop directly into sharps container. Seal at 2/3 full."},{"l":"Post-exposure","d":"Wash with soap and water immediately → report → incident form → medical eval."}]}]},{"id":5,"type":"table","title":"EKG Practice — Lead Placement","hd":["Lead","Correct Placement"],"rows":[["V1","Right of sternum, 4th intercostal space"],["V2","Left of sternum, 4th intercostal space"],["V3","Directly between V2 and V4 (diagonal midpoint)"],["V4","Left midclavicular line, 5th intercostal space"],["V5","Anterior axillary line, 5th ICS (same level as V4)"],["V6","Midaxillary line, 5th ICS (same level as V4/V5)"],["RA","Right arm (White wire)"],["LA","Left arm (Black wire)"],["RL","Right leg (Green wire) — ground only"],["LL","Left leg (Red wire)"]],"note":"Use fresh electrodes for every patient. Misplaced leads are the most common EKG error. Wipe skin with alcohol, let dry, clip hair if needed."},{"id":6,"type":"twocol","title":"Phlebotomy Practice — Venipuncture & Capillary","lt":"Venipuncture Steps","lc":"var(--accent)","li":[{"l":"1. Verify patient","d":"Two identifiers (name + DOB). Review test order for required tubes."},{"l":"2. Tourniquet","d":"3–4 inches above antecubital. Palpate median cubital. ≤1 min."},{"l":"3. Clean site","d":"Alcohol swab, outward circular motion. Let dry 30 sec."},{"l":"4. Insert","d":"Bevel up, 15–30° angle, smooth motion. Release tourniquet when blood flows."},{"l":"5. Fill tubes","d":"Correct order of draw. Invert gently — never shake (hemolysis)."},{"l":"6. Withdraw","d":"Gauze over site, remove needle, pressure. Sharps container immediately."},{"l":"7. Label","d":"At bedside: name, DOB, date, time, initials. Never pre-label."}],"rt":"Capillary & Order of Draw","rc":"var(--blue)","ri":[{"l":"Site","d":"Side of fingertip — not pad or center. Clean with alcohol, let dry."},{"l":"First drop","d":"Wipe away (diluted with tissue fluid). Use second drop."},{"l":"Don't squeeze","d":"Milking dilutes specimen with tissue fluid."},{"l":"Order of Draw","d":"Yellow (sterile) → Blue (coagulation) → Red/Gold (chemistry) → Green (heparin) → Lavender (EDTA) → Gray (fluoride)."},{"l":"Mnemonic","d":"Stop Looking Right Now Later."},{"l":"Bandage","d":"Keep on 15+ minutes. No heavy lifting with that arm."}]},{"id":7,"type":"twocol","title":"Skills Assessment & Externship Completion","lt":"What the Assessment Evaluates","lc":"var(--warm)","li":[{"l":"Technical accuracy","d":"Correct steps in correct sequence."},{"l":"Patient safety","d":"Hand hygiene, PPE, patient ID, sharps protocols."},{"l":"Communication","d":"Clear explanation before each procedure."},{"l":"Documentation","d":"Accurate values and correct format."},{"l":"Professionalism","d":"Errors acknowledged calmly and corrected."}],"rt":"Externship & Certification","rc":"var(--accent)","ri":[{"l":"Submit hours this week","d":"All remaining externship hours required for program completion."},{"l":"Log accurately","d":"Don't wait until final day. Contact coordinator with any questions."},{"l":"After completion","d":"Eligible to sit for CCMA certification exam."},{"l":"Bring to interviews","d":"Transcript, program completion docs, hours log."},{"l":"Professionalism","d":"Arrive on time. Never perform unauthorized tasks. Ask questions — supervisors respect it."}]},{"id":8,"type":"cards","title":"Professional Clinical Skills — Every Encounter","cols":3,"cards":[{"title":"Greet & Identify","desc":"Knock first. Introduce yourself. Two identifiers before touching patient or starting any procedure.","color":"#4A90D9"},{"title":"Explain Before You Act","desc":"Tell patient what you'll do and why — plain language. Never touch without warning.","color":"#3DAE8E"},{"title":"Observe & Respond","desc":"Watch for nonverbal pain, anxiety, discomfort. Pause, acknowledge, adjust.","color":"#E8853D"},{"title":"Close Professionally","desc":"Tell patient what's next. Answer questions. Assist as needed. Thank them.","color":"#8B6FC0"},{"title":"Document Promptly","desc":"Immediately after encounter. Time, initials, all findings and actions. Never from memory later.","color":"#D94F4F"},{"title":"Infection Control","desc":"Hand hygiene before/after everything. Clean vs. dirty sides. Sharps within arm's reach. Disinfect between patients.","color":"#B8860B"}]},{"id":9,"type":"takeaways","title":"Week Sixteen — Key Takeaways","items":["This is your final skills lab — approach every repetition as if it's the real assessment.","Vital signs: document rate, rhythm, strength for pulse. Count RR without announcing. Pain = patient's number.","Injections: know angle, gauge, volume, and site for each route. NEVER recap used needles. Wait 20–30 min post-injection.","EKG: V1/V2 at 4th ICS flanking sternum. V4 at left midclavicular 5th ICS. Fresh electrodes every patient.","Phlebotomy: median cubital first. Correct order of draw. Label at bedside immediately. Invert gently, never shake.","Skills assessment evaluates technique, safety, communication, AND documentation together — not technique alone.","Submit all remaining externship hours this week. Incomplete hours block program completion and certification.","You have trained for this. Trust your preparation, follow the steps, and perform with professionalism."]},{"id":10,"type":"quiz","title":"Knowledge Check","questions":[{"q":"What is the maximum volume for a deltoid IM injection?","options":["0.5 mL","1 mL","2 mL","3 mL"],"correct":1,"explanation":"Deltoid maximum is 1 mL. Use ventrogluteal or vastus lateralis for volumes up to 3 mL."},{"q":"During venipuncture, when should you release the tourniquet?","options":["Before inserting the needle","As soon as blood flow begins","After all tubes are filled","When applying the bandage"],"correct":1,"explanation":"Release the tourniquet as soon as blood flow begins — never leave on >1 minute."},{"q":"Where is EKG lead V4 placed?","options":["Right of sternum, 4th ICS","Left of sternum, 4th ICS","Left midclavicular line, 5th ICS","Midaxillary line, 5th ICS"],"correct":2,"explanation":"V4 = left midclavicular line, 5th intercostal space."},{"q":"When should you document vital signs?","options":["Before measuring them","At the end of the shift","Immediately after the encounter","The next morning"],"correct":2,"explanation":"Document immediately after — never from memory later."},{"q":"What should you do if you make a mistake during the skills assessment?","options":["Pretend it didn't happen","Stop and start over completely","Acknowledge it and correct it calmly","Ask to reschedule"],"correct":2,"explanation":"Self-correction demonstrates clinical judgment — exactly what evaluators want to see."},{"q":"The mnemonic for venipuncture order of draw is:","options":["Stop Looking Right Now Later","Start Loading Red Next Last","Some Like Red Not Lime","Stop Lifting Run Not Lay"],"correct":0,"explanation":"Stop Looking Right Now Later = Sterile (Yellow) → Blue → Red → Green → Lavender → Gray."}]},{"id":11,"type":"end","title":"End of Week Sixteen","subtitle":"Building Competency Through Skills Practice","message":"From Week One to Week Sixteen — every skill, every principle, every patient interaction has built you into the medical assistant you are about to become. Trust your training. You are ready."}];

function rTitle(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px;position:relative"><div style="position:absolute;top:24px;left:32px;display:flex;align-items:center;gap:6px"><div style="width:24px;height:2px;background:var(--accent)"></div><span style="font-size:9px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase">${e(s.subtitle)}</span></div><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:3px;text-transform:uppercase;margin-bottom:12px">${e(s.week)}</div><h1 style="font-family:var(--ff);font-size:${s.fs||34}px;font-weight:700;color:#fff;margin:0;line-height:1.25;white-space:pre-line">${e(s.title)}</h1><div style="display:flex;gap:8px;margin-top:24px;flex-wrap:wrap;justify-content:center">${s.tags.map(t=>`<span class="tag">${e(t)}</span>`).join('')}</div><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
function rObj(s,i){const sh=st.objShown;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="display:flex;flex-direction:column;gap:${s.objectives.length>12?'2':'3'}px">${s.objectives.map((o,j)=>`<div class="or ${sh.has(j)?'s':''}" onclick="for(let x=0;x<=${j};x++)st.objShown.add(x);render()"><div class="oc ${sh.has(j)?'on':'off'}" style="min-width:${s.objectives.length>12?'20':'22'}px;height:${s.objectives.length>12?'20':'22'}px;font-size:${s.objectives.length>12?'9':'10'}px">${j+1}</div><div style="font-size:${s.objectives.length>12?'9':'10'}px;color:var(--text);line-height:1.35;padding-top:2px">${e(o)}</div></div>`).join('')}</div>${sh.size<s.objectives.length?'<p style="font-size:9px;color:var(--textLight);margin-top:3px;font-style:italic">Click to reveal</p>':''}</div>${F(i)}</div>`}
function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb">${s.desc?`<p style="font-size:10px;color:var(--textMid);margin:0 0 8px">${e(s.desc)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:7px">${s.cards.map(c=>`<div class="cd" style="border-${c.b||'left'}:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div>${s.note?`<div class="co co-${s.nt||'a'}" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${s.note?`<div style="font-size:9px;color:var(--textMid);font-style:italic;margin-top:4px">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;if(j===S[10].questions[st.qi].correct)st.qsc++;render()}
function nQ(){if(st.qi<S[10].questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
