<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Labs Final: Injections</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1a0a0f,#28101a,#180a18);font-family:'DM+Sans',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#fb7185;font-weight:800;font-size:14px}.bar{height:6px;background:#351828;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#fb7185,#fb7185);border-radius:10px;transition:width .4s}.question{background:#28101a;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #fb7185}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#351828;border:2px solid #351828;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#fb7185;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#28101a}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#28101a;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#fb7185;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">💉</div><h1>Labs Final: Injections</h1><p class="sub">Final assessment — all routes, safety & sharps</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Before preparing any injection, complete these steps in order:",opts:["Gloves → inject → document","Hand hygiene → gloves → 9 rights → 3 label checks → site prep → explain to patient","Just check the medication name","Prepare the syringe → then verify the patient"],a:1,tip:"Full sequence: hygiene → gloves → rights → labels → site prep → patient explanation."},{q:"ID injection: if no wheal (bleb) forms, the injection was:",opts:["Successful","Placed too deep — the test is invalid","Given at the wrong site","Too slow"],a:1,tip:"No wheal = subcutaneous, not intradermal. The TB test is invalid and must be repeated."},{q:"SC injection technique: pinch skin, insert at 45°, then ___ before injecting.",opts:["Pinch harder","Release the pinch after the needle is seated","Massage the area","Withdraw slightly"],a:1,tip:"Release the pinch after the needle is in, before pushing the plunger. Inject slowly."},{q:"IM deltoid: locate the site by measuring:",opts:["At the elbow","2–3 finger-widths below the acromion process","At the shoulder joint itself","Middle of the upper arm"],a:1,tip:"2–3 finger-widths below the acromion. Spread skin taut. Insert at 90° dart-like."},{q:"After withdrawing the needle, you should:",opts:["Recap it carefully","Drop it directly into the sharps container — never recap","Set it on the tray","Hand it to the evaluator"],a:1,tip:"Directly into sharps. No recapping. No setting down. Immediate disposal."},{q:"The patient asks what medication you are giving. You should:",opts:["Tell them it is confidential","Explain the medication name, purpose, and common side effects","Say you are not sure","Tell them to ask the doctor later"],a:1,tip:"Right Education = explain medication, purpose, side effects. Patient education is a RIGHT."},{q:"What action will STOP an assessment immediately?",opts:["A slightly incorrect angle","Recapping a used needle","Forgetting to document one value","Being nervous"],a:1,tip:"Recapping a used needle, wrong patient (no ID check), skipping hand hygiene, or no consent."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared for 17 weeks. Trust your training. You are ready. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
