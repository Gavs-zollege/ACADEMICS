<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Labs Final: EKG</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0e0a22,#181040,#0a0620);font-family:'Outfit',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#a78bfa;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#fb7185);border-radius:10px;transition:width .4s}.question{background:#181040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#181040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#181040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📈</div><h1>Labs Final: EKG</h1><p class="sub">Final assessment — all 10 leads, artifacts & correction</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Before placing electrodes, prepare the skin by:",opts:["Just pressing them on","Alcohol swab → let dry → clip excess hair if needed → apply fresh electrodes","Applying lotion for better contact","Wetting the skin with water"],a:1,tip:"Clean with alcohol, let dry, remove excess hair. Fresh electrodes every patient."},{q:"V1 is placed ___ and V2 is placed ___.",opts:["Both on the left side","V1 right of sternum 4th ICS; V2 left of sternum 4th ICS","Both at the 5th ICS","V1 at midclavicular; V2 at mid-axillary"],a:1,tip:"V1 and V2 flank the sternum at the 4th intercostal space. Right and left."},{q:"Which precordial lead should be placed FIRST to ensure V3 is correct?",opts:["V1","V2","V4 — then V3 goes between V2 and V4","V6"],a:2,tip:"Place V4 first (left midclavicular, 5th ICS). Then V3 = midpoint between V2 and V4."},{q:"The tracing shows a wandering, drifting baseline. Most likely cause:",opts:["Electrical interference","Patient breathing deeply or moving","Loose lead wire","Incorrect paper speed"],a:1,tip:"Wandering baseline = movement or breathing. Have patient relax, breathe normally, stay still."},{q:"Uniform, regular spiking across all leads indicates:",opts:["Somatic tremor","AC (60-cycle) electrical interference — unplug nearby equipment","A normal finding","Lead reversal"],a:1,tip:"Uniform spiking = electrical interference. Check power cord, unplug non-essential devices."},{q:"If artifact appears during the assessment, you should:",opts:["Submit it and explain the artifact","Stop, identify the cause, correct it, and re-run the tracing","Ignore it — artifact is normal","Ask the patient to hold their breath"],a:1,tip:"Never submit artifact. Identify → correct → re-run. Evaluators want to see troubleshooting."},{q:"After the EKG, tell the patient:",opts:["Nothing — just remove the electrodes","What comes next, remove electrodes gently, and clean any residue","The results of the EKG","To remove the electrodes themselves"],a:1,tip:"Explain next steps, remove electrodes gently, clean residue. Close professionally."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared for 17 weeks. Trust your training. You are ready. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
