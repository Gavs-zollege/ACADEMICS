<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Labs Final: Phlebotomy</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0f1f17,#132419,#0d1a20);font-family:'Sora',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#34d399;font-weight:800;font-size:14px}.bar{height:6px;background:#1e3a28;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#34d399,#fb7185);border-radius:10px;transition:width .4s}.question{background:#162a1f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #34d399}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1e3a28;border:2px solid #1e3a28;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#34d399;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#162a1f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#162a1f;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#34d399;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🩸</div><h1>Labs Final: Phlebotomy</h1><p class="sub">Final assessment — venipuncture, order of draw & labeling</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"After verifying patient ID, the next step is:",opts:["Insert the needle","Apply tourniquet 3–4 inches above the antecubital fossa and palpate for the vein","Label the tubes","Put on gloves first, then apply tourniquet"],a:2,tip:"Gloves on → tourniquet → palpate → clean → insert. Tourniquet max 1 minute."},{q:"The median cubital vein is preferred because it is:",opts:["The largest vein in the body","Firm, straight, anchored, and least likely to roll","Always visible","The only vein in the arm"],a:1,tip:"Least painful, least likely to roll. Check both arms. Cephalic and basilic are alternatives."},{q:"After blood flow begins, immediately:",opts:["Remove the tourniquet","Leave tourniquet on until all tubes are filled","Ask the patient to make a fist repeatedly","Switch arms"],a:0,tip:"Release tourniquet as soon as blood flows. Prolonged tourniquet = hemoconcentration."},{q:"Tubes should be inverted gently — never shaken — because shaking causes:",opts:["Better mixing","Hemolysis — destroys red blood cells and invalidates results","Faster clotting","No effect"],a:1,tip:"Gentle inversion mixes anticoagulant. Shaking destroys cells (hemolysis)."},{q:"Label tubes:",opts:["Before the draw starts","At the bedside immediately after collection — with name, DOB, date, time, initials","Back at the lab","Only if the lab requests it"],a:1,tip:"Label at bedside immediately after draw. Never pre-label. Never label elsewhere."},{q:"After removing the needle, apply ___ and instruct the patient to ___.",opts:["Nothing; leave immediately","Firm pressure with gauze; keep bandage on 15+ minutes, no heavy lifting","A Band-Aid only; they can leave","Ice; elevate the arm for 1 hour"],a:1,tip:"Firm pressure → bandage → 15 min minimum → no heavy lifting with that arm."},{q:"For a capillary draw, the correct technique is:",opts:["Squeeze the finger hard to get blood","Lance the side of fingertip, wipe first drop, use second drop, don't squeeze","Lance the center of the finger pad","Use the thumb for the largest sample"],a:1,tip:"Side of fingertip. Wipe first drop (tissue fluid). Use second drop. Never squeeze."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared for 17 weeks. Trust your training. You are ready. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
