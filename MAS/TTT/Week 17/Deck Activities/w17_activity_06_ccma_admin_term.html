<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CCMA Practice: Admin & Terms</title><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a1628,#0e1d38,#081428);font-family:'Lexend',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#60a5fa;font-weight:800;font-size:14px}.bar{height:6px;background:#1a3060;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#fb7185);border-radius:10px;transition:width .4s}.question{background:#112240;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #60a5fa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1a3060;border:2px solid #1a3060;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#60a5fa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#112240}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#112240;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#60a5fa;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📋</div><h1>CCMA Practice: Admin & Terms</h1><p class="sub">Domains 2 & 3 practice questions</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"The prefix hyper- means:",opts:["Below/deficient","Above/excessive","Around","Within"],a:1,tip:"Hyper- = above/excessive. Hypo- = below/deficient. Never confuse them."},{q:"The suffix -algia means:",opts:["Inflammation","Study of","Pain","Surgical removal"],a:2,tip:"-algia = pain. Neuralgia = nerve pain. Myalgia = muscle pain."},{q:"EMR is used within ___ organization(s). EHR extends across ___.",opts:["Multiple; one","One; multiple organizations for coordinated care","They are the same thing","Neither stores patient data"],a:1,tip:"EMR = single organization. EHR = shared across multiple providers and organizations."},{q:"Preauthorization confirms:",opts:["Zero patient cost","That the procedure is covered before it is performed","An appointment is scheduled","A referral was completed"],a:1,tip:"Confirms coverage before the procedure. Does NOT guarantee zero out-of-pocket cost."},{q:"Medical record documentation errors are corrected by:",opts:["Using white-out","Drawing one line through the error, writing correction, date, time, initials","Erasing and rewriting","Removing the page"],a:1,tip:"Single line + write correct info + date/time/initials. Never use white-out."},{q:"The Five Ps of telephone etiquette are:",opts:["Patient, Provider, Phone, Protocol, Payment","Polite, Prepared, to the Point, Perceptive, cooPerative","Please, Patience, Professionalism, Privacy, Protocol","None of these"],a:1,tip:"Polite, Prepared, Point, Perceptive, Cooperative. Warm tone, focused, helpful."},{q:"Peri- means ___ and epi- means ___.",opts:["Before; after","Around/surrounding; upon/above","Inside; outside","Slow; fast"],a:1,tip:"Pericardium = around the heart. Epidermis = upon/above the skin."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared for 17 weeks. Trust your training. You are ready. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
