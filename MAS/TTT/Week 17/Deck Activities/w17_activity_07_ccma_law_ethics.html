<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CCMA Practice: Law & Ethics</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#14082a,#1c1040,#100828);font-family:'Manrope',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#f472b6;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#f472b6,#fb7185);border-radius:10px;transition:width .4s}.question{background:#1c1040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #f472b6}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#f472b6;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#1c1040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#1c1040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f472b6;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">⚖️</div><h1>CCMA Practice: Law & Ethics</h1><p class="sub">Domain 4 practice questions (~15% of exam)</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"HIPAA Privacy Rule protects:",opts:["Healthcare costs","Patient confidentiality — PHI in electronic, paper, or verbal form","Provider salaries","Insurance premiums"],a:1,tip:"PHI in ALL formats. Confidentiality is the purpose — not cost or access."},{q:"A colleague discusses a patient in the elevator. This is:",opts:["Acceptable if no names are used","A HIPAA violation — public area discussion of patient info","Only wrong if a family member overhears","Fine between coworkers"],a:1,tip:"Discussing patient details in any public area = HIPAA violation. Always."},{q:"Advance directives (living will, DPOA, DNR, POLST):",opts:["Expire after 1 year","Never expire unless officially revoked by the patient","Must be renewed annually","Are only valid in hospitals"],a:1,tip:"None expire without revocation. Valid across all care settings."},{q:"A DNR order means:",opts:["Stop all treatment","No CPR or advanced cardiac life support — other treatments continue","No medications","Discharge the patient"],a:1,tip:"DNR = no CPR/ACLS. Chemo, dialysis, antibiotics, and other treatments continue."},{q:"When a patient refuses treatment, the MA should:",opts:["Convince them to change their mind","Document the refusal fully and notify the physician immediately","Proceed anyway","Ignore the refusal"],a:1,tip:"Document fully. Notify provider. Autonomy: patients have the right to refuse."},{q:"Scope of practice: when unsure about a procedure, always:",opts:["Ask a colleague","Consult the supervising provider — never guess","Try your best","Skip it"],a:1,tip:"Supervising provider. Not just a colleague. Never guess. Never proceed without guidance."},{q:"Beneficence means:",opts:["Do no harm","Act in the patient's best interest — do the most good","Treat all fairly","Respect autonomy"],a:1,tip:"Beneficence = do the most good. Nonmaleficence = do no harm. Know both."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared for 17 weeks. Trust your training. You are ready. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
