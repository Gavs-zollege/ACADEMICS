<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Assessment Strategy</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1c1a2e,#221f38,#1a1830);font-family:'Fredoka',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#f59e0b;font-weight:800;font-size:14px}.bar{height:6px;background:#332850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#f59e0b,#fb7185);border-radius:10px;transition:width .4s}.question{background:#272540;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #f59e0b}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#332850;border:2px solid #332850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#f59e0b;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#272540}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#272540;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#f59e0b;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🎯</div><h1>Assessment Strategy</h1><p class="sub">How to approach stations, handle mistakes & perform your best</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"The best approach at every assessment station is:",opts:["Rush to finish quickly","Slow, deliberate, and methodical — accuracy over speed","Only do what is asked, skip safety steps","Memorize a script"],a:1,tip:"Speed is not evaluated. Accuracy and safety are. Deliberate beats rushed."},{q:"If you make a mistake during the assessment:",opts:["Hide it and keep going","Stop, acknowledge it calmly, correct it, and continue","Start the entire station over","Ask to skip that station"],a:1,tip:"Self-correction = clinical judgment. Evaluators value it. Hiding errors = the opposite."},{q:"Narrating your steps out loud during assessment:",opts:["Looks unprofessional","Demonstrates critical thinking and keeps you on track","Is not allowed","Wastes time"],a:1,tip:"Talking through actions shows thinking. I am verifying the patient name and DOB is perfect."},{q:"Between stations, you should:",opts:["Rush to the next one","Hand hygiene → restock → mentally reset. Each station is a fresh start","Skip cleanup to save time","Review your mistakes from the last station"],a:1,tip:"Reset completely. Hand hygiene, restock, clear your head. Fresh start every station."},{q:"Patient communication during assessment is:",opts:["Optional if technique is correct","Evaluated as seriously as technique — explain before, during, and after","Only needed for injections","Not part of the grade"],a:1,tip:"Communication is graded equally with technique. A correct procedure without communication is incomplete."},{q:"Feeling nervous before your assessment means:",opts:["You are underprepared","You care — the best-performing students prepared thoroughly, not felt most confident","You should postpone","Something is wrong"],a:1,tip:"Nerves = you care. Preparation = you are ready. Trust your 17 weeks of training."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared for 17 weeks. Trust your training. You are ready. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
