<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Certification & Next Steps</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a0e1e,#101830,#0a1020);font-family:'Plus+Jakarta+Sans',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#fbbf24;font-weight:800;font-size:14px}.bar{height:6px;background:#182040;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#fbbf24,#fb7185);border-radius:10px;transition:width .4s}.question{background:#101830;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #fbbf24}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#182040;border:2px solid #182040;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#fbbf24;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#101830}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#101830;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#fbbf24;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🎓</div><h1>Certification & Next Steps</h1><p class="sub">CCMA readiness, career launch & professional growth</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Before sitting for the CCMA exam, confirm:",opts:["Nothing — just show up","Program completion + externship hours verified + eligibility confirmed","Only your address","Just your certification fee"],a:1,tip:"Coursework + labs + externship hours all verified. Contact coordinator if anything is outstanding."},{q:"CCMA certification requires renewal every:",opts:["1 year","2 years — through retesting or continuing education","5 years","It never expires"],a:1,tip:"Every 2 years. NHA: retest or 10 hours CE. Use CE to genuinely stay current."},{q:"Your most valuable first professional reference is:",opts:["A friend","Your externship clinical supervisor","A family member","Your high school teacher"],a:1,tip:"Your clinical supervisor saw your skills, work ethic, and professionalism with real patients."},{q:"On the CCMA exam, safety and ethics questions almost always require:",opts:["Doing nothing","Reporting, documenting, or consulting a supervisor","Ignoring the issue","Asking a colleague only"],a:1,tip:"Report, document, consult supervisor. Ignore and do nothing are never correct."},{q:"When the exam asks about a procedure you are unsure of, the answer is:",opts:["Try your best","Consult the supervising provider — never guess","Ask a colleague","Look it up online"],a:1,tip:"Always the supervising provider. Not just a colleague. Never proceed without guidance."},{q:"Read every answer option before choosing because:",opts:["It wastes time","The first plausible answer may not be the BEST answer — distractors are designed to trap","All answers are usually the same","It is required by the testing center"],a:1,tip:"Read all four. Exam writers include partially correct distractors. The BEST answer wins."},{q:"After passing your CCMA exam, you transition from:",opts:["Student to intern","Student to practicing clinician — certified and career-ready","Student to researcher","Student to volunteer"],a:1,tip:"Certified Clinical Medical Assistant. The habits you built across 17 weeks are your foundation."},{q:"The single most important thing to remember on exam day:",opts:["Memorize everything","Trust your preparation — you trained for 17 weeks. You are ready.","Guess on every question","Skip the hard questions"],a:1,tip:"You came in learning to take a blood pressure. You leave as a clinical professional. Go demonstrate it. 🎓"}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared for 17 weeks. Trust your training. You are ready. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
