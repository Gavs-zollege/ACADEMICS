<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 17 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}.search-wrap input:focus{border-color:var(--red)}.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}.cat-btn:hover{opacity:.85}.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}.item:last-child{border-bottom:none}.item:hover{background:var(--surface2)}.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}.item-left{display:flex;align-items:center;gap:10px}.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}.item.open .item-bar{opacity:1}.item-term{font-size:20px;font-weight:700;color:#fff}.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}.item.open .item-def{display:block}.item.open .item-term{color:var(--red-light)}.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}.pg-btn:disabled{opacity:.3;cursor:default}.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}.pg-dot.active{background:var(--red-light);transform:scale(1.3)}.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 17 Glossary</h1>
  <p class="sub">Demonstrating Your Clinical Skills</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Final Assessment",color:"#E05555",terms:[
    {term:"Labs Final (Comprehensive Skills Assessment)",def:"The culminating hands-on evaluation at the end of the Medical Assistant program in which students demonstrate their ability to ..."},
    {term:"Observed Skills Assessment",def:"A formal evaluation format in which a trained evaluator directly watches a student or employee perform a clinical skill in real..."},
    {term:"Skills Checkoff",def:"A formalized pass/fail demonstration in which a student performs a specific clinical skill for an evaluator who scores each ste..."},
    {term:"Competency Evaluation",def:"A structured, criterion-referenced assessment measuring whether a student or clinical employee can perform the required tasks o..."},
    {term:"Self-Correction During Assessment",def:"The act of recognizing an error mid-procedure, stopping, acknowledging it calmly and clearly."},
    {term:"Critical Error (Assessment)",def:"A specific, high-priority mistake during a skills assessment that immediately compromises patient safety."},
    {term:"Documentation During Assessment",def:"The requirement to record all clinical findings, procedures performed."},
    {term:"Station Reset (Between Skills)",def:"The required process of returning a skills assessment station to a clean, organized."}
  ]},
  {name:"Vital Signs",color:"#6B7B8D",terms:[
    {term:"Radial Pulse — Assessment Documentation",def:"When documenting a pulse obtained at the radial artery, record all three components: rate (beats per minute)."},
    {term:"Apical-Radial Pulse Deficit",def:"The numerical difference between the apical heart rate (counted at the apex of the heart with a stethoscope) and the radial pul..."},
    {term:"Korotkoff Sounds — Clinical Application",def:"The five phases of sound produced by turbulent blood flow as a sphygmomanometer cuff is slowly deflated during blood pressure m..."},
    {term:"Respiratory Rate — Unannounced Count",def:"The clinical practice of counting the respiratory rate immediately after measuring the pulse."},
    {term:"SpO2 — Critical Values and Limitations",def:"Oxygen saturation (SpO2) measured by pulse oximetry is considered normal between 95–100%."},
    {term:"Pain — Subjective Vital Sign",def:"Pain is the fifth vital sign and is entirely subjective — meaning only the patient can rate it."}
  ]},
  {name:"Injections",color:"#8B6AAE",terms:[
    {term:"Intradermal Injection — Wheal Confirmation",def:"The small, raised, pale bump (bleb or wheal) that must form in the skin immediately following a correctly performed intradermal..."},
    {term:"Subcutaneous Injection — Skin Pinch Technique",def:"The required technique for subcutaneous injection in which at least one full inch of skin is gathered between the thumb and for..."},
    {term:"Intramuscular Injection — Skin Stretch Technique",def:"The technique used for intramuscular injection in which the skin over the injection site is spread taut with the nondominant ha..."},
    {term:"Lipodystrophy — Prevention Through Site Rotation",def:"The abnormal change in subcutaneous fat tissue at repeatedly injected sites."},
    {term:"Z-Track Injection Technique",def:"An intramuscular injection technique used for medications that are irritating or may stain subcutaneous tissue (such as iron de..."},
    {term:"Medication Reconstitution",def:"The process of dissolving a lyophilized (freeze-dried) powdered medication in a specified liquid diluent to produce an injectab..."},
    {term:"Anaphylaxis — Post-Injection Response",def:"A severe, systemic, potentially life-threatening allergic reaction that may occur following administration of any injectable me..."}
  ]},
  {name:"EKG & Tracing",color:"#E74C6F",terms:[
    {term:"Precordial Lead Placement — V1 through V6",def:"The six chest electrodes placed in specific anatomical positions to record the heart's electrical activity in the horizontal pl..."},
    {term:"Limb Lead Placement",def:"The four electrodes applied to the extremities or torso for the 12-lead EKG."},
    {term:"Lead Misplacement vs. Artifact",def:"Two distinct EKG quality problems with different causes and consequences."},
    {term:"Intercostal Space (ICS) Identification",def:"The technique for accurately locating the correct intercostal spaces for precordial electrode placement."},
    {term:"Midclavicular Line",def:"An imaginary vertical line extending downward from the midpoint of the clavicle (collarbone)."},
    {term:"Anterior and Midaxillary Lines",def:"Two vertical anatomical reference lines used to position V5 and V6 precordial electrodes."},
    {term:"Sinus Rhythm vs. Sinus Arrhythmia",def:"Normal sinus rhythm: rate 60–100 bpm, regular rhythm, P wave precedes every QRS, consistent PR interval."},
    {term:"Artifact — Common Causes and Corrections",def:"Unwanted interference or noise in an EKG tracing that prevents accurate interpretation."}
  ]},
  {name:"Phlebotomy",color:"#4A90B8",terms:[
    {term:"Order of Draw — Assessment Application",def:"The required sequence for filling blood collection tubes during venipuncture: sterile/blood cultures (yellow) → light blue (sod..."},
    {term:"Tube Inversion — Correct Technique",def:"The gentle end-over-end mixing of a blood collection tube after filling."},
    {term:"Hematoma Prevention",def:"A hematoma is a collection of blood in the tissue surrounding a venipuncture site, causing painful bruising and swelling."},
    {term:"Bedside Tube Labeling Protocol",def:"The mandatory practice of labeling all blood collection tubes immediately at the patient's bedside after the draw is complete —..."},
    {term:"Hemolysis — Causes and Clinical Impact",def:"The breakdown of red blood cells with release of their intracellular contents into the serum or plasma."},
    {term:"Venipuncture Angle and Needle Orientation",def:"The correct needle insertion technique for venipuncture: bevel (the angled opening) must face upward."},
    {term:"Capillary Blood Collection — Technique Standards",def:"The correct technique for collecting a fingerstick blood sample: use the side of the distal fingertip (not the center pad — the..."}
  ]},
  {name:"Clinical Safety",color:"#1A8A7D",terms:[
    {term:"Hand Hygiene — Before and After Every Contact",def:"The single most evidence-based practice for preventing healthcare-associated infections."},
    {term:"Two-Identifier Verification — Every Procedure",def:"The patient safety requirement to confirm a patient's identity using two independent identifiers before performing any clinical..."},
    {term:"Sharps Safety — Immediate Disposal",def:"The requirement to drop used needles, lancets, scalpel blades, and broken glass directly into a puncture-resistant."},
    {term:"Site Disinfection — Complete Drying Requirement",def:"The clinical standard requiring that an injection or venipuncture site cleaned with an alcohol swab be allowed to dry completel..."},
    {term:"PPE — Donning and Doffing Sequence",def:"Personal protective equipment must be applied (donned) and removed (doffed) in a specific sequence to prevent self-contamination."},
    {term:"Aseptic Technique During Procedures",def:"The collection of practices designed to prevent the introduction of pathogens into the patient's tissue or bloodstream during c..."},
    {term:"Post-Exposure Protocol — Needlestick",def:"The mandatory sequence of actions required immediately following an occupational needlestick or sharps injury: (1) do not panic..."}
  ]},
  {name:"Professional Comms",color:"#E2B94C",terms:[
    {term:"Pre-Procedure Patient Preparation",def:"The required set of communications completed before beginning any clinical skill at the assessment or in clinical practice: kno..."},
    {term:"Procedural Narration",def:"The practice of talking through clinical steps out loud during an observed skills assessment or during actual patient care — de..."},
    {term:"Nonverbal Communication During Procedures",def:"The continuous communication that occurs between a clinician and patient through body language, facial expressions, eye contact."},
    {term:"Post-Procedure Instructions (Aftercare)",def:"The standardized set of verbal instructions provided to the patient after a clinical procedure is completed."},
    {term:"Scope of Practice in Communication",def:"The professional boundary that defines what a medical assistant may and may not communicate to patients about their clinical fi..."},
    {term:"De-escalation — Upset or Anxious Patient",def:"Communication strategies used to reduce tension, fear."},
    {term:"Teach-Back Method — Final Confirmation",def:"A communication technique used to verify that a patient has genuinely understood the information or instructions they received."}
  ]},
  {name:"CCMA Prep",color:"#4CAF90",terms:[
    {term:"CCMA (Certified Clinical Medical Assistant)",def:"A nationally recognized professional credential awarded by the National Healthcareer Association (NHA) upon successful completi..."},
    {term:"Certification Examination Eligibility",def:"The set of requirements a student must fulfill before sitting for the CCMA certification exam."},
    {term:"CCMA Exam Blueprint — Domain Weighting",def:"The five content domains tested on the CCMA certification exam and their approximate percentage of exam questions: Patient Care..."},
    {term:"Exam Strategy — Reading Every Answer",def:"The single most important test-taking principle for multiple-choice examinations: read all four answer choices before selecting..."},
    {term:"Exam Strategy — Safety and Ethics Questions",def:"A reliable pattern in CCMA certification exam questions involving patient safety, HIPAA, ethics."},
    {term:"Practice Examination — Diagnostic Use",def:"A full-length practice test modeled after the CCMA certification exam."},
    {term:"Continuing Education (CE) for Recertification",def:"Structured learning activities completed after initial certification to maintain current knowledge and fulfill the requirements..."}
  ]},
  {name:"Career Readiness",color:"#E8976A",terms:[
    {term:"Professional Reference (Clinical Supervisor)",def:"A person who can speak directly from firsthand professional observation to a job applicant's clinical skills, work habits."},
    {term:"Externship as Professional Audition",def:"The recognition that a clinical externship functions simultaneously as a learning experience and as an extended job interview —..."},
    {term:"CCMA Credential — Employer Significance",def:"The CCMA designation communicates to every prospective employer that the holder has completed an accredited training program."},
    {term:"Scope of Practice — First Job",def:"The state-defined and employer-defined boundaries of the tasks and procedures a Medical Assistant is authorized to perform in a..."},
    {term:"Clinical Habits as Professional Identity",def:"The consistent, automatic professional behaviors that define a medical assistant's clinical character — developed through train..."},
    {term:"Interprofessional Collaboration",def:"The practice of healthcare professionals from different disciplines working together in a coordinated."},
    {term:"Deliberate Practice — Career-Long Standard",def:"The ongoing commitment to intentional, focused skills development throughout a professional career — not only during training."}
  ]}
];
const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
