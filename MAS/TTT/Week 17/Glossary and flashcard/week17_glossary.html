<title>Week 17 Glossary — Medical Assistant Program</title>

<style>
  :root {--text:#0e0e1a;--text-secondary:#3a3a50;--surface-1:#e0e0ec;--surface-2:#d0d0dd;--border:#c0c0cc;--bg:#d8d8e4;--card-shadow:0 2px 12px rgba(26,26,46,0.06);--font-body:'DM Sans',-apple-system,sans-serif;--font-display:'Playfair Display',Georgia,serif}
  @media(prefers-color-scheme:dark){:root{--text:#e4e4f0;--text-secondary:#9898b0;--surface-1:#1c1c2e;--surface-2:#282840;--border:#363650;--bg:#111122;--card-shadow:0 2px 12px rgba(0,0,0,0.3)}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;font-weight:600}
  .app{max-width:640px;margin:0 auto;padding:28px 18px 60px}
  .header{text-align:center;margin-bottom:28px}
  .header-tag{font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:#C0392B;margin-bottom:6px}
  .header h1{font-family:var(--font-display);font-size:32px;font-weight:900;letter-spacing:-1px;margin-bottom:6px;line-height:1.1}
  .header p{font-size:13px;color:var(--text-secondary)}
  .search-wrap{position:relative;margin-bottom:20px}
  .search-wrap input{width:100%;padding:14px 18px 14px 46px;border-radius:14px;border:2px solid var(--border);background:var(--surface-1);color:var(--text);font-size:15px;outline:none;font-family:var(--font-body);transition:border-color .2s}
  .search-wrap input:focus{border-color:#C0392B}
  .search-wrap .icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.4}
  .cat-btn{width:100%;padding:14px 18px;border-radius:14px;border:2px solid var(--border);background:var(--surface-1);cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;font-family:var(--font-body)}
  .cat-btn:hover{border-color:#aaa}
  .cat-btn .emoji{font-size:22px}
  .cat-btn .name{font-weight:700;color:var(--text);font-size:15px}
  .cat-btn .count{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:20px}
  .cat-btn .arrow{font-size:14px;color:var(--text-secondary);transition:transform .25s}
  .cat-btn.open .arrow{transform:rotate(180deg)}
  .term-card{padding:13px 16px;border-radius:11px;background:var(--surface-1);border:2px solid transparent;cursor:pointer;transition:all .15s}
  .term-card:hover{border-color:var(--border)}
  .term-card .term-name{font-weight:800;font-size:14px;color:var(--text)}
  .term-card .term-def{margin:10px 0 4px;font-size:13px;line-height:1.65;color:var(--text-secondary);font-weight:600}
  .result-card{padding:14px 18px;border-radius:12px;background:var(--surface-1);cursor:pointer;border:2px solid var(--border);transition:all .2s}
  .result-card .row{display:flex;align-items:center;gap:10px}
  .result-card .r-emoji{font-size:20px}
  .result-card .r-term{font-weight:700;color:var(--text);font-size:15px}
  .result-card .r-cat{margin-left:auto;font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600}
  .result-card .r-def{margin:12px 0 4px 30px;font-size:14px;line-height:1.6;color:var(--text-secondary)}
  .hidden{display:none!important}
</style>

<script>
const CATEGORIES = [
  {
    name: "Final Assessment & Competency Evaluation", emoji: "✅", color: "#C0392B",
    terms: [
      { term: "Labs Final (Comprehensive Skills Assessment)", def: "The culminating hands-on evaluation at the end of the Medical Assistant program in which students demonstrate their ability to perform core clinical procedures accurately, safely, and professionally under direct observation. The assessment evaluates not only technical technique but also patient communication, adherence to safety protocols, and documentation. It mirrors the real clinical environment in which MAs will practice." },
      { term: "Observed Skills Assessment", def: "A formal evaluation format in which a trained evaluator directly watches a student or employee perform a clinical skill in real time, scoring each component of the procedure against a standardized checklist. Differs from a written exam — it assesses what a person can do, not just what they know. Observed assessments are used throughout clinical training and credentialing to confirm practice-ready competence." },
      { term: "Skills Checkoff", def: "A formalized pass/fail demonstration in which a student performs a specific clinical skill for an evaluator who scores each step against a predefined criteria list. Used to verify that a student has achieved the minimum level of competency required to safely perform the skill in a clinical setting. A passed skills check-off in training confirms readiness to perform the skill under supervision at the externship site." },
      { term: "Competency Evaluation", def: "A structured, criterion-referenced assessment measuring whether a student or clinical employee can perform the required tasks of their role to a defined standard of safety, accuracy, and professionalism. In MA programs, competency evaluations cover clinical skills (vital signs, injections, EKG, phlebotomy), safety behaviors (hand hygiene, sharps disposal, PPE), patient communication, and documentation. Competency must be demonstrated — not assumed." },
      { term: "Self-Correction During Assessment", def: "The act of recognizing an error mid-procedure, stopping, acknowledging it calmly and clearly, and implementing the correct action before continuing. Self-correction is viewed positively by evaluators because it demonstrates clinical judgment, patient safety awareness, and professional accountability. The appropriate response to any error: pause — state what happened — correct it — continue. Attempting to hide or minimize an error is a critical assessment failure." },
      { term: "Critical Error (Assessment)", def: "A specific, high-priority mistake during a skills assessment that immediately compromises patient safety, regardless of how well the rest of the procedure was performed. Examples: recapping a used needle, performing a procedure without patient identity verification, skipping hand hygiene in a way that creates direct contamination risk, or administering a medication without completing the required safety checks. Critical errors typically result in automatic failure of the skill station." },
      { term: "Documentation During Assessment", def: "The requirement to record all clinical findings, procedures performed, and patient responses accurately and immediately after each assessed skill is completed — never before and never reconstructed from memory later. Assessment documentation must include the exact values measured, the time of the procedure, and the student's initials. If an error is made: draw one line through it, write 'error,' initial it, and enter the correction. Never use correction fluid." },
      { term: "Station Reset (Between Skills)", def: "The required process of returning a skills assessment station to a clean, organized, and properly stocked state between patient encounters. Includes: performing hand hygiene, discarding all used supplies in the appropriate waste container, replacing any depleted supplies, disinfecting all contact surfaces (exam table, counter, equipment handles), and taking a moment to clear focus before the next skill begins. Station reset is itself an evaluated behavior in many assessment formats." },
    ],
  },
  {
    name: "Vital Signs — Applied Assessment Skills", emoji: "❤️", color: "#922B21",
    terms: [
      { term: "Radial Pulse — Assessment Documentation", def: "When documenting a pulse obtained at the radial artery, record all three components: rate (beats per minute), rhythm (regular or irregular), and strength (strong, weak, or thready). A rate alone is insufficient documentation. If the radial pulse is irregular, switch to the apical site and count for a full 60 seconds. If the apical rate differs from the radial rate, document both and report the pulse deficit to the provider." },
      { term: "Apical-Radial Pulse Deficit", def: "The numerical difference between the apical heart rate (counted at the apex of the heart with a stethoscope) and the radial pulse rate (counted at the wrist), measured simultaneously by two healthcare providers. A deficit of more than a few beats indicates that some heartbeats are not generating sufficient force to produce a palpable peripheral pulse — a clinically significant finding associated with atrial fibrillation and other cardiac conditions requiring immediate provider notification." },
      { term: "Korotkoff Sounds — Clinical Application", def: "The five phases of sound produced by turbulent blood flow as a sphygmomanometer cuff is slowly deflated during blood pressure measurement. Phase I = first sound heard (sharp, clear tapping) = the systolic pressure reading. Phase V = the point at which sound completely disappears = the diastolic pressure reading. The cuff must deflate at 2–3 mmHg per second. Deflating too quickly causes underestimation of the true reading." },
      { term: "Respiratory Rate — Unannounced Count", def: "The clinical practice of counting the respiratory rate immediately after measuring the pulse, without informing the patient that the assessment has shifted from pulse to breathing. Patients who are told their breathing is being counted will consciously alter their respiratory pattern — producing an inaccurate result. By continuing to hold the patient's wrist as if still counting the pulse, the MA prevents this behavioral change. Count for one full minute; note rate, rhythm, and depth." },
      { term: "SpO2 — Critical Values and Limitations", def: "Oxygen saturation (SpO2) measured by pulse oximetry is considered normal between 95–100%. Values below 95% warrant clinical intervention; values below 90% are a critical finding requiring immediate provider notification. Accuracy is reduced by nail polish, artificial nails, peripheral vasoconstriction, cold extremities, anemia, carbon monoxide exposure, and excessive patient movement. Always allow the reading to stabilize before documenting and remove nail polish if needed for an accurate reading." },
      { term: "Pain — Subjective Vital Sign", def: "Pain is the fifth vital sign and is entirely subjective — meaning only the patient can rate it. The MA's role is to ask, listen, and document the patient's exact numeric rating (0–10) without adjustment, interpretation, or judgment. Never estimate a patient's pain level based on their appearance, behavior, or diagnosis. Never round, adjust, or omit the pain rating in documentation. If a patient declines to rate their pain, document their refusal accurately." },
    ],
  },
  {
    name: "Injection Technique & Parenteral Skills", emoji: "💉", color: "#7D3C98",
    terms: [
      { term: "Intradermal Injection — Wheal Confirmation", def: "The small, raised, pale bump (bleb or wheal) that must form in the skin immediately following a correctly performed intradermal injection, confirming that the medication was deposited within the dermis rather than the subcutaneous tissue below. If no wheal forms, the needle was placed too deep — the test is invalid and must be repeated at a different site. Do not massage, apply pressure, bandage, or rub the site after an intradermal injection — this disperses the antigen and invalidates the test result." },
      { term: "Subcutaneous Injection — Skin Pinch Technique", def: "The required technique for subcutaneous injection in which at least one full inch of skin is gathered between the thumb and forefinger of the nondominant hand before needle insertion. The pinch elevates the subcutaneous fat layer away from the underlying muscle, ensuring correct tissue depth for the injection. The pinch is released after the needle is fully seated — before the medication is injected. The injection is then completed, the needle withdrawn cleanly, and gentle pressure applied with dry gauze." },
      { term: "Intramuscular Injection — Skin Stretch Technique", def: "The technique used for intramuscular injection in which the skin over the injection site is spread taut with the nondominant hand rather than pinched. Stretching the skin (as opposed to pinching) ensures that the needle is inserted into muscle tissue rather than superficial fat, and reduces resistance during insertion. Used for deltoid and vastus lateralis IM sites. The needle is inserted in a smooth, dart-like motion at 90° perpendicular to the skin surface." },
      { term: "Lipodystrophy — Prevention Through Site Rotation", def: "The abnormal change in subcutaneous fat tissue at repeatedly injected sites, resulting in localized thickening (hypertrophy) or loss of fat (lipoatrophy). Prevented by systematically rotating injection sites within the same anatomical region at each visit. Patients who self-administer insulin are particularly at risk. Injecting into a lipodystrophic site produces inconsistent absorption and unpredictable drug levels. Document the site used at each visit and instruct the patient on rotation technique." },
      { term: "Z-Track Injection Technique", def: "An intramuscular injection technique used for medications that are irritating or may stain subcutaneous tissue (such as iron dextran). Technique: use the nondominant hand to pull the skin 1–1½ inches laterally from the injection site before inserting the needle at 90°. Maintain the lateral displacement throughout the injection. After withdrawing the needle, release the skin — the displaced tissue slides back over the injection tract, sealing it and preventing medication from tracking back toward the surface." },
      { term: "Medication Reconstitution", def: "The process of dissolving a lyophilized (freeze-dried) powdered medication in a specified liquid diluent to produce an injectable solution. Requires precise technique: inject the correct volume of diluent into the powder vial, gently rotate or roll the vial to dissolve — never shake, as shaking may denature proteins or create foam. Verify the solution is clear and free of visible particles before drawing up. Write the reconstitution date, time, and concentration on the vial. Use or discard per manufacturer guidelines." },
      { term: "Anaphylaxis — Post-Injection Response", def: "A severe, systemic, potentially life-threatening allergic reaction that may occur following administration of any injectable medication or vaccine. Signs: hives, facial and throat swelling (angioedema), difficulty breathing, rapid drop in blood pressure. Onset can occur within minutes. All patients should remain under observation for 20–30 minutes after any injection. Response: administer epinephrine (per facility protocol) and call 911 immediately. Do not delay treatment — anaphylaxis can progress to respiratory arrest within minutes." },
    ],
  },
  {
    name: "EKG — Lead Placement & Tracing Quality", emoji: "📈", color: "#2C3E50",
    terms: [
      { term: "Precordial Lead Placement — V1 through V6", def: "The six chest electrodes placed in specific anatomical positions to record the heart's electrical activity in the horizontal plane. V1: right of sternum, 4th intercostal space. V2: left of sternum, 4th ICS. V3: diagonal midpoint between V2 and V4. V4: left midclavicular line, 5th ICS. V5: anterior axillary line, 5th ICS (exact same horizontal level as V4). V6: midaxillary line, 5th ICS (exact same horizontal level as V4 and V5). V5 and V6 must never be placed above or below V4." },
      { term: "Limb Lead Placement", def: "The four electrodes applied to the extremities or torso for the 12-lead EKG. RA (right arm or upper right torso), LA (left arm or upper left torso), RL (right leg or lower right torso — the ground electrode; does not generate a lead independently), and LL (left leg or lower left torso — generates inferior leads II, III, and aVF). Limb leads must be placed on soft tissue and not over bony prominences. If limb placement is not possible (amputation, cast, IV site), move the electrode to the corresponding torso quadrant." },
      { term: "Lead Misplacement vs. Artifact", def: "Two distinct EKG quality problems with different causes and consequences. Artifact: visible distortion, noise, or wandering baseline in the tracing caused by patient movement, poor electrode adhesion, electrical interference, or dry gel — the tracing looks wrong and cannot be read. Lead misplacement: electrodes placed in incorrect anatomical positions, producing a clean-looking but clinically incorrect waveform — can mimic myocardial infarction or mask real findings. Lead misplacement is the more dangerous error because it is invisible without careful positioning verification." },
      { term: "Intercostal Space (ICS) Identification", def: "The technique for accurately locating the correct intercostal spaces for precordial electrode placement. Start at the sternal angle (angle of Louis) — the horizontal ridge felt on the sternum approximately 1.5 inches below the jugular notch. The rib just below the sternal angle is the 2nd rib; the space below it is the 2nd ICS. Count down from there: 2nd ICS → 3rd ICS → 4th ICS (for V1 and V2) → 5th ICS (for V4, V5, V6). Counting from the clavicle alone is unreliable." },
      { term: "Midclavicular Line", def: "An imaginary vertical line extending downward from the midpoint of the clavicle (collarbone), used as the anatomical landmark for placing the V4 precordial electrode. V4 is placed at the intersection of the midclavicular line and the 5th intercostal space on the left chest. This line varies between patients based on body habitus — always identify it by palpating the midpoint of the actual clavicle rather than estimating visually." },
      { term: "Anterior and Midaxillary Lines", def: "Two vertical anatomical reference lines used to position V5 and V6 precordial electrodes. Anterior axillary line: extends downward from the fold of the armpit at the front edge of the underarm muscle (V5 is placed here at the 5th ICS level). Midaxillary line: extends downward from the midpoint of the axilla (armpit) — V6 is placed here at the same 5th ICS level. All three leads (V4, V5, V6) must be on the same horizontal level." },
      { term: "Sinus Rhythm vs. Sinus Arrhythmia", def: "Normal sinus rhythm: rate 60–100 bpm, regular rhythm, P wave precedes every QRS, consistent PR interval. Sinus arrhythmia: the rate varies slightly (typically speeding up with inhalation and slowing with exhalation) but the P wave still precedes every QRS — a normal variant, especially in younger and athletic patients. Distinct from pathological arrhythmias (atrial fibrillation, ventricular tachycardia) which require immediate provider notification." },
      { term: "Artifact — Common Causes and Corrections", def: "Unwanted interference or noise in an EKG tracing that prevents accurate interpretation. Common causes and corrections: Patient movement/shivering — instruct the patient to lie completely still, breathe normally, and relax arms and legs. Loose electrode — press all edges firmly; replace with a fresh electrode if adhesion is poor. Dry electrode gel — always use fresh, properly stored electrodes. Electrical interference — unplug non-essential nearby equipment. Body hair — clip or shave the site before electrode placement. If artifact persists after corrective steps, re-run the tracing." },
    ],
  },
  {
    name: "Phlebotomy — Applied Assessment Skills", emoji: "🩸", color: "#1A5276",
    terms: [
      { term: "Order of Draw — Assessment Application", def: "The required sequence for filling blood collection tubes during venipuncture: sterile/blood cultures (yellow) → light blue (sodium citrate — must be completely filled to maintain the correct 9:1 blood-to-anticoagulant ratio) → red/gold SST (serum separator) → green (heparin) → lavender/purple (EDTA) → gray (fluoride). Mnemonic: Stop Looking Right Now Later. Incorrect order of draw produces additive cross-contamination, which alters test results — a specimen-level patient safety error." },
      { term: "Tube Inversion — Correct Technique", def: "The gentle end-over-end mixing of a blood collection tube after filling, required to ensure proper contact between blood and the tube's additive (anticoagulant, separator gel, or glycolytic inhibitor). The number of inversions varies by tube type (typically 5–10 times). Gentle inversion is slow and deliberate — the tube is turned completely upside-down and back. NEVER shake a tube — shaking causes hemolysis (red blood cell breakdown), which invalidates test results for many analytes including potassium, LDH, and AST." },
      { term: "Hematoma Prevention", def: "A hematoma is a collection of blood in the tissue surrounding a venipuncture site, causing painful bruising and swelling. Prevention: confirm the needle is fully inside the vein before blood flow is expected; release the tourniquet before withdrawing the needle; apply firm continuous pressure for a minimum of 2 minutes after needle withdrawal; instruct the patient not to bend the arm at the elbow (which can redirect pressure away from the puncture site). Never release pressure to check the site before adequate hemostasis is achieved." },
      { term: "Bedside Tube Labeling Protocol", def: "The mandatory practice of labeling all blood collection tubes immediately at the patient's bedside after the draw is complete — never in advance, never at the nurses' station, never from memory. Each label must include: the patient's full name, date of birth, collection date and time, and the collector's initials. Pre-labeled tubes must never be used — the risk of attaching the correct label to the wrong specimen (a critical patient safety event) exists any time labeling is separated from collection." },
      { term: "Hemolysis — Causes and Clinical Impact", def: "The breakdown of red blood cells with release of their intracellular contents into the serum or plasma, turning the specimen visibly pink or red. Causes: shaking tubes, drawing blood too rapidly through a small-gauge needle, contaminating the site with alcohol (injecting before the site is dry), prolonged tourniquet time, and vigorous mixing. Impact: falsely elevates potassium, LDH, AST, phosphorus, and magnesium — producing results that may lead to incorrect clinical decisions. A hemolyzed specimen must be recollected." },
      { term: "Venipuncture Angle and Needle Orientation", def: "The correct needle insertion technique for venipuncture: bevel (the angled opening) must face upward. Insert at a 15–30° angle to the skin surface — steep enough to enter the vein but not so steep that the needle passes through the posterior wall. A smaller angle (15°) is appropriate for superficial, fragile, or small veins. A steeper angle (20–30°) is appropriate for deeper, well-anchored veins. Once blood flow is confirmed, lower the needle angle slightly to prevent through-puncture." },
      { term: "Capillary Blood Collection — Technique Standards", def: "The correct technique for collecting a fingerstick blood sample: use the side of the distal fingertip (not the center pad — the pad has more nerve endings and less blood flow). Clean with alcohol and allow to dry completely before lancing. Perform the lancet puncture quickly and confidently. Wipe away the first drop of blood — it is diluted with tissue fluid and may contain alcohol residue. Collect from the second drop. Do not squeeze or milk the finger — compression dilutes the specimen with interstitial fluid, altering results." },
    ],
  },
  {
    name: "Clinical Safety Standards — Applied Practice", emoji: "🛡️", color: "#1E8449",
    terms: [
      { term: "Hand Hygiene — Before and After Every Contact", def: "The single most evidence-based practice for preventing healthcare-associated infections, required at five specific moments: before patient contact, before an aseptic procedure, after body fluid exposure risk, after patient contact, and after contact with the patient's environment. Soap and water is required when hands are visibly soiled, after using the restroom, and after contact with blood or body fluids. Alcohol-based sanitizer (≥60% alcohol) is acceptable for all other moments. Artificial nails and nail extensions are prohibited in clinical practice." },
      { term: "Two-Identifier Verification — Every Procedure", def: "The patient safety requirement to confirm a patient's identity using two independent identifiers before performing any clinical procedure, administering any medication, or collecting any specimen. Standard identifiers: full legal name and date of birth. This verification must occur before each individual procedure — not only once at the start of an encounter. Never accept a room number, bed assignment, or wristband alone. Ask the patient to state their name and date of birth — do not ask 'Is your name John Smith?' (a leading question that invites a reflexive yes)." },
      { term: "Sharps Safety — Immediate Disposal", def: "The requirement to drop used needles, lancets, scalpel blades, and broken glass directly into a puncture-resistant, leak-proof sharps container immediately after use — at the point of care, without any intermediate steps. The sharps container must be within arm's reach before any procedure that involves a sharp instrument begins. NEVER recap a used needle under any circumstances. NEVER place used sharps in regular trash, on a countertop, or in a biohazard bag. Seal the container and replace it when two-thirds full." },
      { term: "Site Disinfection — Complete Drying Requirement", def: "The clinical standard requiring that an injection or venipuncture site cleaned with an alcohol swab be allowed to dry completely before needle insertion — a minimum of 30 seconds. Injecting through a site that is still wet with alcohol causes unnecessary pain, may introduce alcohol into the tissue, and does not achieve the antimicrobial effect of full evaporation. Never blow on the site to speed drying — this reintroduces bacteria. Fanning the site with a piece of gauze is also not acceptable technique." },
      { term: "PPE — Donning and Doffing Sequence", def: "Personal protective equipment must be applied (donned) and removed (doffed) in a specific sequence to prevent self-contamination. Donning order: gown → mask or respirator → goggles or face shield → gloves. Doffing order: gloves first (peel off inside-out without touching the outer contaminated surface) → goggles/face shield → gown → mask or respirator. Perform hand hygiene immediately after completing the full doffing sequence. Every step in the doffing process is designed to prevent the contaminated outer surface from touching clean skin or mucous membranes." },
      { term: "Aseptic Technique During Procedures", def: "The collection of practices designed to prevent the introduction of pathogens into the patient's tissue or bloodstream during clinical procedures. Key principles for injection and venipuncture: perform hand hygiene before every procedure; maintain a clean/dirty separation on the work surface; clean the site with alcohol in an outward circular motion and allow full drying; never touch the needle shaft, tip, or sterile field after preparation; do not place a prepared needle down on any surface before use; discard and replace any needle or supply that contacts a non-sterile surface." },
      { term: "Post-Exposure Protocol — Needlestick", def: "The mandatory sequence of actions required immediately following an occupational needlestick or sharps injury: (1) do not panic — remove yourself from the situation; (2) wash the wound site thoroughly with soap and water for at least 15 minutes; (3) if a splash to eyes or mucous membranes occurred, flush with large volumes of water; (4) report to the supervisor immediately; (5) go to occupational health or the emergency department for a confidential medical evaluation — at no cost to the employee; (6) complete an incident/exposure form; (7) follow up per facility protocol for testing and prophylaxis as indicated." },
    ],
  },
  {
    name: "Professional Communication — Assessment Standard", emoji: "🗣️", color: "#D4AC0D",
    terms: [
      { term: "Pre-Procedure Patient Preparation", def: "The required set of communications completed before beginning any clinical skill at the assessment or in clinical practice: knock before entering; introduce yourself by full name and professional role; verify the patient's identity with two identifiers; explain the procedure in plain, clear language without medical jargon; describe what the patient will feel; invite questions and answer them honestly; obtain verbal consent; and warn the patient immediately before any touch, equipment application, or needle insertion. This sequence is an evaluated clinical behavior — not a courtesy." },
      { term: "Procedural Narration", def: "The practice of talking through clinical steps out loud during an observed skills assessment or during actual patient care — describing what you are doing and why as you do it. Serves two purposes: it demonstrates to the evaluator that each step is intentional and informed (not accidental), and it keeps the clinician anchored to the correct sequence of the procedure. Example: 'I've verified your identity, cleaned the site, and I'm going to take the blood pressure now — you'll feel the cuff tighten on your arm.'" },
      { term: "Nonverbal Communication During Procedures", def: "The continuous communication that occurs between a clinician and patient through body language, facial expressions, eye contact, posture, and physical space — independent of any words spoken. During clinical skills: a grimace, a sharp intake of breath, tension in the arm, or a patient pulling away are all nonverbal communications that require an immediate response. Pause, make eye contact, acknowledge what you observed, and adjust before proceeding. Ignoring nonverbal distress signals is both unsafe and unprofessional." },
      { term: "Post-Procedure Instructions (Aftercare)", def: "The standardized set of verbal instructions provided to the patient after a clinical procedure is completed. Content is procedure-specific: after venipuncture — 'Keep the bandage on for at least 15 minutes and avoid heavy lifting with this arm for a few hours.' After injection — 'You may feel mild soreness at the site for a day or two; apply a cool compress if needed.' After an EKG — 'You can get dressed now — the procedure is complete and the results will go to your provider.' Aftercare instructions are part of the clinical procedure and must be documented." },
      { term: "Scope of Practice in Communication", def: "The professional boundary that defines what a medical assistant may and may not communicate to patients about their clinical findings and results. MAs may: report measured values (temperature is 98.8°F), describe what was done (the EKG tracing has been sent to your provider), and provide aftercare instructions for completed procedures. MAs may NOT: interpret diagnostic results, offer a medical opinion about findings, suggest a diagnosis, or predict treatment — these actions fall outside the MA scope of practice and may constitute practicing medicine without a license." },
      { term: "De-escalation — Upset or Anxious Patient", def: "Communication strategies used to reduce tension, fear, or agitation in a patient or family member before or during a clinical procedure. Core techniques: lower your own voice rather than raising it; give the person physical space; maintain calm, steady eye contact; use validating language without agreeing with misinformation ('I understand this feels stressful — let me explain what I'm going to do step by step'); avoid defensive or dismissive responses; never match the patient's agitation level. A calm MA is itself a de-escalation tool." },
      { term: "Teach-Back Method — Final Confirmation", def: "A communication technique used to verify that a patient has genuinely understood the information or instructions they received, by asking them to explain or demonstrate it back in their own words or actions. Correct application: 'Before I let you go, can you walk me through how you'll care for this site when you get home?' Incorrect application: 'Do you understand?' (a closed question that invites a reflexive yes without confirming comprehension). Teach-back is particularly important for wound care instructions, medication administration teaching, and post-procedure self-care." },
    ],
  },
  {
    name: "CCMA Certification & Exam Preparation", emoji: "📝", color: "#117A65",
    terms: [
      { term: "CCMA (Certified Clinical Medical Assistant)", def: "A nationally recognized professional credential awarded by the National Healthcareer Association (NHA) upon successful completion of a standardized certification examination. Demonstrates to employers that the holder has completed an accredited Medical Assistant program, met defined competency standards in both clinical and administrative skills, and passed a rigorous national assessment. Certification is renewed every two years through continuing education or re-examination." },
      { term: "Certification Examination Eligibility", def: "The set of requirements a student must fulfill before sitting for the CCMA certification exam, including successful completion of an accredited Medical Assistant program, documentation of required clinical externship hours, and verification of program completion by the institution. Students must confirm all requirements are met and documented before the exam date. Unresolved program requirements — including incomplete externship hours — may delay or prevent eligibility." },
      { term: "CCMA Exam Blueprint — Domain Weighting", def: "The five content domains tested on the CCMA certification exam and their approximate percentage of exam questions: Patient Care & Clinical Procedures (~40%) — the largest domain, covering vital signs, injections, EKG, phlebotomy, specimen collection, wound care, positioning, and patient safety. Administrative & Practice Management (~20%). Medical Terminology & Anatomy (~15%). Law, Ethics & Patient Rights (~15%). Infection Control & Safety (~10%). Domain weighting should guide final exam preparation priorities." },
      { term: "Exam Strategy — Reading Every Answer", def: "The single most important test-taking principle for multiple-choice examinations: read all four answer choices before selecting a response. Exam writers deliberately include distractors — plausible-sounding but incorrect options — designed to attract students who select the first answer that sounds right without reading the rest. The correct answer is often not the most obvious one. Reading all choices prevents premature selection and allows comparison between similar options." },
      { term: "Exam Strategy — Safety and Ethics Questions", def: "A reliable pattern in CCMA certification exam questions involving patient safety, HIPAA, ethics, or scope of practice scenarios: the correct answer almost always involves reporting, documenting, or consulting the supervising provider. Answers that involve ignoring a problem, doing nothing, guessing at a procedure, or bypassing the chain of command are almost never correct. When in doubt on a safety or ethics question: choose the answer that protects the patient and involves appropriate communication with the supervising provider." },
      { term: "Practice Examination — Diagnostic Use", def: "A full-length practice test modeled after the CCMA certification exam, used to identify knowledge strengths and gaps before the real assessment. The value of a practice examination lies not in the score itself but in the analysis of incorrect answers: which domains produced the most errors, which question types were consistently missed, and whether missed questions reflect a knowledge gap or a test-taking error (misread question, careless selection). This analysis directs the final targeted review period." },
      { term: "Continuing Education (CE) for Recertification", def: "Structured learning activities completed after initial certification to maintain current knowledge and fulfill the requirements for credential renewal. CCMA-certified MAs must complete 10 hours of approved continuing education or retake the certification exam every two years to maintain active certification status. CE activities may include accredited online courses, webinars, in-person workshops, journal modules, and professional development programs relevant to medical assisting and clinical care." },
    ],
  },
  {
    name: "Career Readiness & Professional Development", emoji: "🎓", color: "#6C3483",
    terms: [
      { term: "Professional Reference (Clinical Supervisor)", def: "A person who can speak directly from firsthand professional observation to a job applicant's clinical skills, work habits, reliability, communication, and patient care — typically a licensed healthcare provider or clinical manager who supervised the applicant during externship or employment. A clinical supervisor reference is the most valuable reference a new MA graduate can provide, because it is based on observed performance with real patients in a real clinical environment — not academic performance alone." },
      { term: "Externship as Professional Audition", def: "The recognition that a clinical externship functions simultaneously as a learning experience and as an extended job interview — giving the clinical site and its staff direct, sustained observation of the student's clinical ability, professionalism, reliability, and communication. Many MA graduates receive their first job offer from their externship site. Every shift — punctuality, dress, initiative, accuracy, and patient interactions — contributes to a professional reputation that begins before the formal job search does." },
      { term: "CCMA Credential — Employer Significance", def: "The CCMA designation communicates to every prospective employer that the holder has completed an accredited training program, passed a nationally standardized competency exam, and met a recognized clinical and administrative benchmark for medical assisting. Certified MAs typically receive higher starting wages, broader scope of responsibility, and faster career advancement than uncertified colleagues in the same setting. Government programs may require MA certification for EHR data entry and certain clinical functions." },
      { term: "Scope of Practice — First Job", def: "The state-defined and employer-defined boundaries of the tasks and procedures a Medical Assistant is authorized to perform in a specific clinical setting. Scope of practice varies by state and by facility — what is permitted at one employer or in one state may not be permitted at another. In every new clinical role: review the facility's MA scope of practice policy, confirm authorization with the supervising provider before performing any unfamiliar task, and never assume that training alone is sufficient authorization to act independently." },
      { term: "Clinical Habits as Professional Identity", def: "The consistent, automatic professional behaviors that define a medical assistant's clinical character — developed through training and reinforced through deliberate practice. Core clinical habits include: performing hand hygiene before every patient contact without being reminded, verifying patient identity before every procedure as a non-negotiable first step, documenting accurately and immediately after every clinical action, and communicating with patients before, during, and after every procedure as a standard — not a courtesy. These habits protect patients and define the quality of care a clinician delivers every day." },
      { term: "Interprofessional Collaboration", def: "The practice of healthcare professionals from different disciplines working together in a coordinated, mutually respectful manner to deliver comprehensive patient care. In the clinical setting, MAs collaborate daily with physicians, NPs, PAs, nurses, lab technicians, front-office staff, and billing personnel. Effective interprofessional collaboration requires clear communication, defined role boundaries, mutual respect, and the willingness to ask questions and share observations — particularly when a patient safety concern is identified." },
      { term: "Deliberate Practice — Career-Long Standard", def: "The ongoing commitment to intentional, focused skills development throughout a professional career — not only during training. Deliberate practice requires identifying specific areas for improvement, seeking feedback from supervisors and colleagues, making targeted adjustments, and repeating the skill under realistic conditions. Clinical competence is not static: it must be actively maintained, updated as guidelines change, and expanded as new responsibilities are taken on. The best clinicians continue to practice deliberately for the entirety of their careers." },
    ],
  }
];

const ALL_TERMS = CATEGORIES.flatMap((cat, ci) =>
  cat.terms.map(t => ({ ...t, category: cat.name, emoji: cat.emoji, color: cat.color, catIndex: ci }))
);
let browseSearch = '';
let browseOpenCat = null;
let browseOpenTerm = null;
document.getElementById('header-subtitle').textContent =
  `Demonstrating Your Clinical Skills · ${ALL_TERMS.length} terms across ${CATEGORIES.length} topics`;
renderBrowse();
function renderBrowse() {
  const el = document.getElementById('browse-mode');
  const query = browseSearch.trim().toLowerCase();
  let html = `<div class="search-wrap"><span class="icon">🔍</span><input type="text" placeholder="Search ${ALL_TERMS.length}+ terms…" value="${escHtml(browseSearch)}" oninput="browseSearch=this.value; browseOpenTerm=null; renderBrowse();" /></div>`;
  if (query) {
    const filtered = ALL_TERMS.filter(t => t.term.toLowerCase().includes(query) || t.def.toLowerCase().includes(query));
    if (filtered.length === 0) {
      html += `<p style="text-align:center;color:var(--text-secondary);padding:20px">No terms found — try different keywords!</p>`;
    } else {
      html += `<div style="display:flex;flex-direction:column;gap:6px">`;
      filtered.forEach((t, i) => {
        const isOpen = browseOpenTerm === `s-${i}`;
        html += `<div class="result-card" onclick="browseOpenTerm=browseOpenTerm==='s-${i}'?null:'s-${i}'; renderBrowse();" style="border-color:${isOpen ? t.color : 'var(--border)'}"><div class="row"><span class="r-emoji">${t.emoji}</span><span class="r-term">${escHtml(t.term)}</span><span class="r-cat" style="background:${t.color}22;color:${t.color}">${escHtml(t.category)}</span></div>${isOpen ? `<p class="r-def">${escHtml(t.def)}</p>` : ''}</div>`;
      });
      html += `</div>`;
    }
  } else {
    html += `<div style="display:flex;flex-direction:column;gap:8px">`;
    CATEGORIES.forEach((cat, ci) => {
      const isOpen = browseOpenCat === ci;
      html += `<div><button class="cat-btn${isOpen ? ' open' : ''}" onclick="browseOpenCat=browseOpenCat===${ci}?null:${ci}; browseOpenTerm=null; renderBrowse();" style="border-color:${isOpen ? cat.color : 'var(--border)'};background:${isOpen ? cat.color + '12' : 'var(--surface-1)'}"><span class="emoji">${cat.emoji}</span><span class="name">${escHtml(cat.name)}</span><span class="count" style="color:${cat.color};background:${cat.color}22">${cat.terms.length}</span><span class="arrow">▼</span></button>`;
      if (isOpen) {
        html += `<div style="display:flex;flex-direction:column;gap:4px;margin-top:6px;margin-left:20px">`;
        cat.terms.forEach((t, ti) => {
          const tKey = `${ci}-${ti}`;
          const tOpen = browseOpenTerm === tKey;
          html += `<div class="term-card" onclick="browseOpenTerm=browseOpenTerm==='${tKey}'?null:'${tKey}'; renderBrowse();" style="border-color:${tOpen ? cat.color : 'transparent'}"><span class="term-name">${escHtml(t.term)}</span>${tOpen ? `<p class="term-def">${escHtml(t.def)}</p>` : ''}</div>`;
        });
        html += `</div>`;
      }
      html += `</div>`;
    });
    html += `</div>`;
  }
  el.innerHTML = html;
}
function escHtml(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
</script>
</body>
</html>
