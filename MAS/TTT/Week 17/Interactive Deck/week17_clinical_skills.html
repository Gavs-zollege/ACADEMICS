const S=[{"id":0,"type":"title","title":"Demonstrating\\nYour Clinical Skills","subtitle":"MEDICAL ASSISTANT PROGRAM","week":"Week Seventeen","tags":["Labs Final","CCMA Practice Test","Certification Readiness","Next Steps"],"fs":32},{"id":1,"type":"objectives","title":"Learning Objectives","objectives":["Demonstrate mastery of core clinical skills — vital signs, injections, EKG, and phlebotomy — in a formal observed assessment","Perform each skill with accurate technique, correct sequencing, safety protocols, and professional patient communication","Apply clinical safety standards — hand hygiene, two-identifier verification, PPE use, and sharps disposal","Complete the final full-length CCMA practice examination to identify remaining knowledge gaps","Reflect on your growth across the full Medical Assistant program","Identify next steps toward CCMA certification, job placement, and professional development"]},{"id":2,"type":"cards","title":"This Week — Three Components","cols":3,"cards":[{"title":"1. Labs Final","desc":"Comprehensive observed clinical skills assessment — the hands-on capstone of your training. Evaluated on technique, safety, communication, and documentation.","color":"#D94F4F"},{"title":"2. Final CCMA Practice Test","desc":"Full-length practice exam modeled after the CCMA certification. Confirm readiness and identify any last areas for review.","color":"#4A90D9"},{"title":"3. Reflection & Next Steps","desc":"Recognize your growth. Identify your path to certification, job applications, and carry professionalism forward.","color":"#3DAE8E"}]},{"id":3,"type":"tab","title":"Labs Final — Core Skills Being Assessed","tk":"0","tabs":[{"n":"Vital Signs","c":"#D94F4F","items":["Measure and document all six: HR (rate, rhythm, strength), BP (cuff technique, Korotkoff sounds), RR (unannounced count), temperature, SpO₂, pain (patient's exact rating)","Identify any value outside normal adult range — document and report as you would clinically","Patient communication throughout: explain each assessment before beginning, handle equipment with care and confidence"]},{"n":"Injections","c":"#4A90D9","items":["Demonstrate at least one route: ID (10–15°, wheal required), SC (45°, skin pinch), or IM (90°, deltoid/vastus lateralis)","Complete all pre-injection steps: hand hygiene, gloves, nine rights, three label checks, site cleaning, patient explanation","Demonstrate correct sharps disposal: used needle drops directly into sharps container — no recapping, ever"]},{"n":"EKG","c":"#3DAE8E","items":["Apply all 10 electrodes correctly: V1–V6 precordial leads plus RA, LA, RL, LL limb leads","Proper skin prep: alcohol swab, allow to dry, press edges firmly, fresh electrodes","Identify most likely artifact cause and describe correction before rerunning"]},{"n":"Phlebotomy","c":"#8B6FC0","items":["Venipuncture: two IDs, tourniquet, median cubital first, site cleaning, bevel up 15–30°, correct order of draw, gentle inversion","Label all tubes immediately at bedside — never pre-label. Name, DOB, date, time, initials","Capillary draw if assessed: side of fingertip, wipe first drop, use second, don't squeeze"]}]},{"id":4,"type":"twocol","title":"What Evaluators Are Looking For","lt":"Technique, Safety & Communication","lc":"var(--warm)","li":[{"l":"Technique & accuracy","d":"Correct steps in correct order. Right angle/site for injections, correct electrode positions, proper order of draw."},{"l":"Patient safety","d":"Hand hygiene, two-identifier verification, correct PPE, immediate sharps disposal, complete site disinfection."},{"l":"Communication","d":"Introduce yourself, verify identity, explain plainly, warn before needle, acknowledge discomfort, give aftercare."},{"l":"Documentation","d":"Record accurately and immediately. Date, time, exact values, initials. One-line error correction, never white-out."},{"l":"Professionalism","d":"Evaluators expect students, not seasoned clinicians. Self-correction shows clinical judgment."}],"rt":"What Will Stop an Assessment","rc":"var(--warm)","ri":[{"l":"Recapping a used needle","d":"Critical safety violation — immediate stop."},{"l":"Wrong patient","d":"Performing procedure without verifying identity."},{"l":"Skipping hand hygiene","d":"In a way that creates direct contamination risk."},{"l":"No patient communication","d":"Performing a skill without any explanation or consent."},{"l":"Key principle","d":"These represent the highest-priority safety standards in clinical care."}]},{"id":5,"type":"twocol","title":"Day-of Assessment Strategy","lt":"Before Each Station","lc":"var(--accent)","li":[{"l":"Arrive early","d":"Organized, dressed as a clinician. Assessment begins before the first station."},{"l":"Set up deliberately","d":"Sharps container within arm's reach, gloves accessible, alcohol swabs ready."},{"l":"Read instructions fully","d":"Confirm what is being asked before acting. Misread instructions = avoidable errors."},{"l":"Start with hand hygiene","d":"Safety requirement and mental reset. Signals readiness."},{"l":"Narrate your steps","d":"Talking through actions demonstrates critical thinking. 'I'm verifying the patient's name and DOB.'"}],"rt":"During & After Each Station","rc":"var(--blue)","ri":[{"l":"Slow is smooth","d":"Speed is not evaluated. Deliberate approach > rushing."},{"l":"Mistakes happen","d":"Pause, state what happened calmly, correct it, continue. Hiding errors = worse."},{"l":"Communication required","d":"Explain before, warn before touch, close with instructions. Incomplete without it."},{"l":"Document before leaving","d":"Time, findings, procedure, initials. Documentation is part of the skill."},{"l":"Reset between stations","d":"Hand hygiene, restock, clear your head. Each station is a fresh start."}]},{"id":6,"type":"twocol","title":"Using Practice Test Results & Your Growth","lt":"How to Use Practice Test Results","lc":"var(--blue)","li":[{"l":"Review every incorrect answer","d":"Understanding WHY is more valuable than the score itself."},{"l":"Identify patterns","d":"3 HIPAA misses + 2 controlled substance misses = specific review target."},{"l":"Don't panic","d":"A missed question = a gap to close. A low domain score = a review target. Both are useful."},{"l":"Confirm strengths too","d":"Domains you scored well on — confirm you know them cold."},{"l":"Allow review time","d":"Don't sit for the certification exam without reviewing practice results first."}],"rt":"Reflecting on Your Growth","rc":"var(--accent)","ri":[{"l":"New language","d":"You now read charts, interpret labs, recognize med classifications, navigate healthcare systems."},{"l":"Skills from scratch","d":"Vital signs, injections, EKG, phlebotomy, sterile technique — all built through repetition."},{"l":"Professional habits","d":"Hand hygiene, identity verification, sharps disposal — now automatic. These define practicing MAs."},{"l":"Ready ≠ fearless","d":"Nervousness is evidence you care, not evidence you're unprepared."},{"l":"Beginning, not end","d":"Labs Final and CCMA exam are the starting line. Habits carry forward for your entire career."}]},{"id":7,"type":"step","title":"Your Path to CCMA Certification","steps":[{"n":1,"t":"Confirm program completion","d":"All coursework, labs, and externship hours submitted and verified. Contact coordinator if anything is outstanding."},{"n":2,"t":"Verify certification eligibility","d":"Program completion documentation and externship hours on file. Meet all requirements to sit for the CCMA exam."},{"n":3,"t":"Final exam preparation","d":"Review practice test results. Target weak domains. Run through commonly missed questions. Sleep the night before."},{"n":4,"t":"Sit for the CCMA exam","d":"Read every question carefully. Read all four answers. In safety/ethics scenarios, prioritize patient safety and proper reporting. Trust your preparation."},{"n":5,"t":"Launch your career","d":"Externship supervisor = first reference. CCMA credential = your qualification. Clinical habits = your foundation. All three start here."},{"n":6,"t":"Keep growing","d":"CCMA renewal every 2 years. Use CE credits to genuinely stay current. The best MAs are always learning."}]},{"id":8,"type":"takeaways","title":"Week Seventeen — Key Takeaways","items":["Labs Final evaluates technique, safety, communication, and documentation equally — not technique alone.","Begin every station with hand hygiene and patient identity verification — without exception.","If you make a mistake: stop, acknowledge it calmly, correct it, continue. Self-correction = clinical judgment.","The CCMA practice test is diagnostic. Review every incorrect answer, identify patterns, target weak areas.","After this program, you carry 17 weeks of clinical habits into every healthcare setting you work in.","CCMA path: confirm completion → verify eligibility → targeted review → sit for exam with confidence.","Your externship supervisor is your most powerful first professional reference.","You came in learning to take a blood pressure. You're leaving as a clinical professional. Go demonstrate it."]},{"id":9,"type":"quiz","title":"Knowledge Check","questions":[{"q":"What should you do FIRST at every skills assessment station?","options":["Set up supplies","Perform hand hygiene","Read the instructions","Introduce yourself to the patient"],"correct":1,"explanation":"Hand hygiene is both a safety requirement and a mental reset — it must happen before everything else."},{"q":"If you make a mistake during the assessment, you should:","options":["Pretend it didn't happen","Start the entire station over","Acknowledge it calmly, correct it, and continue","Ask to skip to the next station"],"correct":2,"explanation":"Self-correction demonstrates clinical judgment — exactly what evaluators want to see."},{"q":"Which action would immediately STOP an assessment?","options":["Documenting after the procedure","Recapping a used needle","Taking extra time on a station","Asking the evaluator a question"],"correct":1,"explanation":"Recapping a used needle is a critical safety violation — one of the few actions that stops an assessment."},{"q":"When reviewing practice test results, the most valuable step is:","options":["Memorizing the correct answers","Understanding WHY each incorrect answer was wrong","Only reviewing questions you got right","Retaking the test immediately"],"correct":1,"explanation":"Understanding why an answer is correct is more valuable than the score. It closes knowledge gaps."},{"q":"What does 'ready' actually mean for the CCMA exam?","options":["Feeling completely confident with zero anxiety","Having completed training, practiced skills, and prepared thoroughly","Memorizing every possible question","Being able to perform skills faster than anyone"],"correct":1,"explanation":"Ready means trained, practiced, and prepared — not fearless. Nervousness is evidence you care."},{"q":"CCMA certification requires renewal every:","options":["1 year","2 years","3 years","5 years"],"correct":1,"explanation":"CCMA certification requires renewal every 2 years — use CE hours to genuinely stay current."}]},{"id":10,"type":"end","title":"End of Week Seventeen","subtitle":"Demonstrating Your Clinical Skills","message":"You came into this program learning how to take a blood pressure. You are leaving it as a clinical professional — capable, credentialed, and ready for the work ahead."}];

function rCards(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb">${s.desc?`<p style="font-size:10px;color:var(--textMid);margin:0 0 8px">${e(s.desc)}</p>`:''}<div style="display:grid;grid-template-columns:repeat(${s.cols||3},1fr);gap:7px">${s.cards.map(c=>`<div class="cd" style="border-${c.b||'left'}:3px solid ${c.color||'var(--accent)'}"><div style="font-size:10px;font-weight:700;color:${c.color||'var(--text)'};margin-bottom:2px">${e(c.title)}</div><div style="font-size:9px;color:var(--textMid);line-height:1.4">${e(c.desc)}</div></div>`).join('')}</div>${s.note?`<div class="co co-${s.nt||'a'}" style="margin-top:6px;font-size:9px;color:var(--text)">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTC(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr" style="gap:14px"><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.lc||'var(--accent)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.lt)}</div>${s.li.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.lc||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div><div style="flex:1"><div style="font-size:10px;font-weight:700;color:${s.rc||'var(--blue)'};margin-bottom:6px;text-transform:uppercase;letter-spacing:1px">${e(s.rt)}</div>${s.ri.map(it=>`<div style="margin-bottom:3px"><span style="font-size:9px;font-weight:700;color:${s.rc||'var(--blue)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div></div>${F(i)}</div>`}
function rTbl(s,i){return `<div class="sf">${H(i,s.title)}<div class="sb"><table><thead><tr class="thd">${s.hd.map(h=>`<th>${e(h)}</th>`).join('')}</tr></thead><tbody>${s.rows.map((r,j)=>`<tr ${j%2?'class="al"':''}>${r.map((c,k)=>`<td style="${k===0?'font-weight:700;color:var(--accent)':''}">${e(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>${s.note?`<div style="font-size:9px;color:var(--textMid);font-style:italic;margin-top:4px">${e(s.note)}</div>`:''}</div>${F(i)}</div>`}
function rTab(s,i){const k=s.tk||'0';const t=st['t'+k];const tabs=s.tabs;const tab=tabs[t];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="tb">${tabs.map((tb,j)=>`<button class="tbtn ${t===j?'a':''}" onclick="st.t${k}=${j};render()" style="${t===j?'font-weight:700;color:'+(tb.c||'var(--accent)')+';border-bottom-color:'+(tb.c||'var(--accent)'):''}"> ${e(tb.n)}</button>`).join('')}</div><div style="background:var(--slideAlt);border-radius:8px;padding:14px 18px;min-height:160px">${tab.items.map(it=>typeof it==='string'?`<div style="font-size:10px;color:var(--textMid);line-height:1.7;padding-left:14px;position:relative"><span style="position:absolute;left:0;color:${tab.c||'var(--accent)'};font-weight:700">›</span>${e(it)}</div>`:`<div style="margin-bottom:3px"><span style="font-size:10px;font-weight:700;color:${tab.c||'var(--accent)'}">${e(it.l)}: </span><span style="font-size:9px;color:var(--textMid)">${e(it.d)}</span></div>`).join('')}</div></div>${F(i)}</div>`}
function rStep(s,i){const p=st.stp;const c=s.steps[p];return `<div class="sf">${H(i,s.title)}<div class="sb"><div class="fr"><div style="display:flex;flex-direction:column;gap:3px">${s.steps.map((step,j)=>`<button class="sb-s ${p===j?'a':''}" onclick="st.stp=${j};render()" style="min-width:140px"><span style="font-weight:700;margin-right:4px">${step.n}.</span>${e(step.t)}</button>`).join('')}</div><div style="flex:1;background:var(--accentLight);border-radius:8px;padding:18px 22px;border-left:3px solid var(--accent)"><div style="font-family:var(--ff);font-size:16px;font-weight:700;color:var(--accent);margin-bottom:4px">Step ${c.n}</div><div style="font-family:var(--ff);font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px">${e(c.t)}</div><div style="font-size:11px;color:var(--textMid);line-height:1.7">${e(c.d)}</div></div></div></div>${F(i)}</div>`}
function rTake(s,i){const ch=st.takeaways;const dn=Object.values(ch).filter(Boolean).length;return `<div class="sf">${H(i,s.title)}<div class="sb"><div style="font-size:10px;font-weight:600;color:var(--accent);margin-bottom:8px">${dn}/${s.items.length} reviewed</div><div class="g2" style="gap:5px">${s.items.map((it,j)=>`<div class="tw ${ch[j]?'ck':''}" onclick="st.takeaways[${j}]=!st.takeaways[${j}];render()"><div class="bx">${ch[j]?'✓':''}</div><div class="lb">${e(it)}</div></div>`).join('')}</div></div>${F(i)}</div>`}
function rQuiz(s,i){const{qi,qs,qa:ans,qsc,qd}=st;if(qd){const pct=Math.round((qsc/s.questions.length)*100);return `<div class="sf">${H(i,'Quiz Results')}<div class="sb" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center"><div style="font-family:var(--ff);font-size:60px;font-weight:700;color:${pct>=80?'var(--accent)':'var(--amber)'}">${pct}%</div><div style="font-size:16px;font-weight:600">${qsc}/${s.questions.length} Correct</div><button onclick="st.qi=0;st.qs=null;st.qa=false;st.qsc=0;st.qd=false;render()" style="font-size:12px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:6px;padding:10px 24px;cursor:pointer;margin-top:18px">Retake</button></div>${F(i)}</div>`}const q=s.questions[qi];return `<div class="sf">${H(i,`Q${qi+1}/${s.questions.length}`)}<div class="sb"><div class="fr"><div style="flex:1"><div style="font-family:var(--ff);font-size:14px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:12px">${e(q.q)}</div><div style="display:flex;flex-direction:column;gap:4px">${q.options.map((opt,j)=>{const r=ans&&j===q.correct;const w=ans&&j===qs&&j!==q.correct;return `<button class="qo${ans?' d':''}${r?' cr':''}${w?' wr':''}" onclick="pQ(${j})">${String.fromCharCode(65+j)}.  ${e(opt)}</button>`}).join('')}</div></div><div style="flex:1;display:flex;flex-direction:column;justify-content:center">${ans?`<div style="background:${qs===q.correct?'var(--accentLight)':'var(--warmLight)'};border-radius:8px;padding:16px 14px;border-left:3px solid ${qs===q.correct?'var(--accent)':'var(--warm)'}"><div style="font-size:11px;font-weight:700;color:${qs===q.correct?'var(--accent)':'var(--warm)'};margin-bottom:5px">${qs===q.correct?'✓ Correct!':'✗ Incorrect'}</div><div style="font-size:10px;color:var(--textMid);line-height:1.6">${e(q.explanation)}</div><button onclick="nQ()" style="font-size:10px;font-weight:700;color:#fff;background:var(--accent);border:none;border-radius:5px;padding:7px 16px;cursor:pointer;margin-top:8px">${qi<s.questions.length-1?'Next →':'Results →'}</button></div>`:`<div style="text-align:center;color:var(--textLight);font-size:11px;font-style:italic">Select an answer</div>`}</div></div></div>${F(i)}</div>`}
function pQ(j){if(st.qa)return;st.qs=j;st.qa=true;const qSlide=S[9];if(qSlide&&qSlide.questions&&j===qSlide.questions[st.qi].correct)st.qsc++;render()}
function nQ(){const qSlide=S[9];if(st.qi<qSlide.questions.length-1){st.qi++;st.qs=null;st.qa=false}else st.qd=true;render()}
function rEnd(s){return `<div class="sf dk"><div style="flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:30px 50px"><div style="font-size:11px;font-weight:700;color:var(--accent);letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">${e(s.title)}</div><h1 style="font-family:var(--ff);font-size:30px;font-weight:700;color:#fff;margin:0 0 16px">${e(s.subtitle)}</h1><p style="font-size:12px;color:rgba(255,255,255,0.6);max-width:480px;line-height:1.6">${e(s.message)}</p><div style="position:absolute;bottom:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),var(--blue),var(--purple))"></div></div></div>`}
render();
</script></body></html>
