<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Clinical Procedures Final</title><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0b1e2d,#0f2a3d,#162040);font-family:'Nunito',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#2dd4bf;font-weight:800;font-size:14px}.bar{height:6px;background:#1a3d50;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#2dd4bf,#fb7185);border-radius:10px;transition:width .4s}.question{background:#112d3f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #2dd4bf}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1a3d50;border:2px solid #1a3d50;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#2dd4bf;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#112d3f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#112d3f;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#2dd4bf;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">❤️</div><h1>Clinical Procedures Final</h1><p class="sub">Domain 1 (~40%): Vitals, injections, EKG & phlebotomy</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Normal adult BP is:",opts:["<130/90","<120/80 mmHg","<140/90","<110/70"],a:1,tip:"<120/80 = normal. Stage 1 HTN: ≥130/80. Stage 2: ≥140/90."},{q:"ID injection: if no wheal forms, the test is:",opts:["Valid","Invalid — placed too deep, must be repeated","Still readable at 48 hours","Not affected"],a:1,tip:"No wheal = too deep (subcutaneous). The intradermal test is invalid."},{q:"EKG V4 is placed at:",opts:["Right of sternum, 4th ICS","Left of sternum, 4th ICS","Left midclavicular line, 5th ICS","Mid-axillary line, 5th ICS"],a:2,tip:"V4 = left midclavicular, 5th ICS. Place V4 BEFORE V3."},{q:"Order of draw after blood cultures:",opts:["Red → Blue → Green","Blue → Red → Green → Lavender → Gray","Green → Red → Blue","Any order"],a:1,tip:"Blue (coag) before Red (chemistry). Stop Looking Right Now Later."},{q:"Rectal temperature is the ___ method.",opts:["Least accurate","Most accurate","Same as oral","Not recommended"],a:1,tip:"Most accurate. Order: rectal > temporal > tympanic > oral > axillary."},{q:"IM vastus lateralis is preferred for infants because:",opts:["It is less painful","The deltoid is too small — axillary nerve risk","Parents prefer it","It requires a smaller needle"],a:1,tip:"Largest muscle mass in infants. Deltoid too underdeveloped before age 3."},{q:"After venipuncture, tubes should be:",opts:["Shaken vigorously","Gently inverted the required number of times — never shaken","Left still","Centrifuged immediately"],a:1,tip:"Gentle inversion mixes additives. Shaking causes hemolysis."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared. You have practiced. Now go earn your CCMA. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
