<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Terminology & Anatomy Final</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0e0a22,#181040,#0a0620);font-family:'Outfit',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#a78bfa;font-weight:800;font-size:14px}.bar{height:6px;background:#2a1850;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#a78bfa,#fb7185);border-radius:10px;transition:width .4s}.question{background:#181040;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #a78bfa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#2a1850;border:2px solid #2a1850;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#a78bfa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#181040}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#181040;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#a78bfa;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🧬</div><h1>Terminology & Anatomy Final</h1><p class="sub">Domain 3 (~15%): Prefixes, suffixes & body systems</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Pulmonary VEIN carries ___ blood ___ the heart.",opts:["Deoxygenated; away from","Oxygenated; FROM lungs TO","Oxygenated; away from","Deoxygenated; to"],a:1,tip:"Pulmonary vein = oxygenated, TO heart. Pulmonary artery = deoxygenated, TO lungs."},{q:"Myocardial infarction means:",opts:["Heart inflammation","Heart attack — death of heart muscle tissue","Heart murmur","Slow heart rate"],a:1,tip:"Infarction = tissue death. Myocarditis (-itis) = inflammation. Never confuse these."},{q:"The SA node is the heart's:",opts:["Valve","Pacemaker — initiates the electrical impulse","Chamber","Blood vessel"],a:1,tip:"SA node = natural pacemaker. AV node → Bundle of His → Purkinje fibers complete conduction."},{q:"Small intestine primary function:",opts:["Water absorption","Nutrient absorption","Bile production","Insulin production"],a:1,tip:"Small intestine = nutrient absorption. Large intestine = water absorption."},{q:"Insulin is produced by the:",opts:["Liver","Gallbladder","Pancreas (beta cells)","Adrenal glands"],a:2,tip:"Pancreas beta cells. Liver produces bile. Gallbladder stores bile."},{q:"The prefix brady- means:",opts:["Fast","Slow","Above","Below"],a:1,tip:"Brady- = slow (bradycardia <60). Tachy- = fast (tachycardia >100)."},{q:"The suffix -ectomy means:",opts:["Inflammation","Pain","Surgical removal","Study of"],a:2,tip:"-ectomy = removal. Appendectomy = removal of appendix. -itis = inflammation."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared. You have practiced. Now go earn your CCMA. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
