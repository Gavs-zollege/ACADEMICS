<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Infection Control Final</title><link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#091a1a,#0e2626,#0a1820);font-family:'Sora',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#2dd4bf;font-weight:800;font-size:14px}.bar{height:6px;background:#123838;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#2dd4bf,#fb7185);border-radius:10px;transition:width .4s}.question{background:#0e2424;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #2dd4bf}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#123838;border:2px solid #123838;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#2dd4bf;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#0e2424}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#0e2424;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#2dd4bf;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🧤</div><h1>Infection Control Final</h1><p class="sub">Domain 5 (~10%): PPE, sterilization & post-exposure</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"PPE doffing order (removal):",opts:["Mask first","Gloves first (inside-out) → goggles → gown → mask","Gown first","Any order"],a:1,tip:"Gloves (most contaminated) first → goggles → gown → mask last. Hand hygiene after."},{q:"Autoclave packages remain sterile for:",opts:["7 days","14 days","30 days if dry, intact, and properly stored","Indefinitely"],a:2,tip:"30 days. Any moisture, tear, or damage = resterilize before use."},{q:"Chain of infection: breaking ___ link(s) stops transmission.",opts:["All 6","At least 3","ANY single link","Only the first"],a:2,tip:"Break any ONE link and transmission stops. Every IC action targets a specific link."},{q:"N95 respirators are required for:",opts:["All patients","Airborne precautions — TB, measles, varicella","Droplet only","Contact only"],a:1,tip:"Airborne pathogens require fit-tested N95 + negative pressure room. Surgical mask is NOT enough."},{q:"After a needlestick, the FIRST action is:",opts:["Fill out paperwork","Wash the wound with soap and water immediately","Call the patient","Notify your insurance"],a:1,tip:"Wash immediately → report to supervisor → incident form → medical evaluation (no cost)."},{q:"Soap and water is REQUIRED (not sanitizer) after:",opts:["Routine patient contact","Contact with blood or body fluids","Touching clean equipment","Using the computer"],a:1,tip:"Blood/body fluids, aseptic procedures, glove removal, visible soil, restroom = soap and water."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared. You have practiced. Now go earn your CCMA. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
