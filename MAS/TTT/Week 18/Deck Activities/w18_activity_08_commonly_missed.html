<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Commonly Missed — Final</title><link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#1a0808,#2a1010,#180808);font-family:'Quicksand',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#ef4444;font-weight:800;font-size:14px}.bar{height:6px;background:#301818;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#ef4444,#fb7185);border-radius:10px;transition:width .4s}.question{background:#221010;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #ef4444}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#301818;border:2px solid #301818;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#ef4444;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#221010}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#221010;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#ef4444;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">⚠️</div><h1>Commonly Missed — Final</h1><p class="sub">The trickiest CCMA questions — last chance review</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Which vessel carries oxygenated blood FROM lungs TO heart?",opts:["Pulmonary artery","Pulmonary vein","Aorta","Vena cava"],a:1,tip:"Pulmonary VEIN = oxygenated, TO heart. #1 most missed question."},{q:"Order of draw: blue comes ___ red.",opts:["After","BEFORE — coagulation tubes drawn before chemistry","At the same time","It does not matter"],a:1,tip:"Blue BEFORE red. Always. Coagulation tubes first after cultures."},{q:"ID injection angle is ___, NOT ___.",opts:["45°, not 90°","90°, not 45°","10–15°, not 45° or 90°","30°, not 15°"],a:2,tip:"ID = 10–15°. Most commonly reversed with SC (45°) on the exam."},{q:"Mild cold symptoms are ___ a vaccine contraindication.",opts:["Always","NOT — prior anaphylaxis to the vaccine IS","Sometimes","Only in children"],a:1,tip:"Mild illness = NOT a contraindication. Prior anaphylaxis = IS."},{q:"Pap smear screens for:",opts:["Lung cancer","Blood glucose","Cervical cancer","Breast cancer"],a:2,tip:"Cervical cancer screening. Begins at age 21. Not glucose, not lung, not breast."},{q:"Iron supplements are best absorbed:",opts:["With food","On an empty stomach","With dairy","Before bed"],a:1,tip:"Empty stomach for best absorption. Unlike most antibiotics which are taken with food."},{q:"When verbal and nonverbal communication contradict, people trust:",opts:["The verbal message","The nonverbal message","Neither","Both equally"],a:1,tip:"Nonverbal wins. Body language, facial expressions, and tone override words."}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared. You have practiced. Now go earn your CCMA. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
