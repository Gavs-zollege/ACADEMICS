<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>CCMA Mini Exam Simulation</title><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0f1f17,#132419,#0d1a20);font-family:'Plus+Jakarta+Sans',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#34d399;font-weight:800;font-size:14px}.bar{height:6px;background:#1e3a28;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#34d399,#fb7185);border-radius:10px;transition:width .4s}.question{background:#162a1f;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #34d399}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1e3a28;border:2px solid #1e3a28;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#34d399;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#162a1f}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#162a1f;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#34d399;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">📝</div><h1>CCMA Mini Exam Simulation</h1><p class="sub">10 mixed-domain questions — exam conditions</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Normal SpO2 range:",opts:["85–90%","90–95%","95–100%","98–100% only"],a:2,tip:"95–100% normal. <95% intervention. <90% critical."},{q:"Tachypnea is defined as respiratory rate:",opts:["<12","12–20",">20","<8"],a:2,tip:"Tachypnea >20. Bradypnea <12. Normal 12–20."},{q:"HIPAA Privacy Rule protects:",opts:["Healthcare costs","PHI confidentiality in all formats","Provider salaries","Insurance premiums"],a:1,tip:"PHI in electronic, paper, and verbal form. Confidentiality is the purpose."},{q:"Autoclave temperature must reach:",opts:["180°F","212°F","250–270°F","300°F"],a:2,tip:"250–270°F. Unwrapped: 20 min. Wrapped: 30 min."},{q:"Clean-catch UA collects the ___ stream.",opts:["First","Middle","Last","Any"],a:1,tip:"Clean → void into toilet → collect midstream."},{q:"Beneficence means:",opts:["Do no harm","Act in the patient best interest","Respect autonomy","Treat all fairly"],a:1,tip:"Beneficence = do the most good. Nonmaleficence = do no harm."},{q:"Tourniquet max time during venipuncture:",opts:["30 seconds","1 minute","3 minutes","5 minutes"],a:1,tip:"1 minute max. Release as soon as blood flows."},{q:"A colleague discusses a patient in the cafeteria. This is:",opts:["Acceptable between coworkers","A HIPAA violation — public area","Fine if no names used","Only wrong if overheard"],a:1,tip:"Any public area discussion of patient info = HIPAA violation. Always."},{q:"After removing PPE, the LAST step is:",opts:["Remove mask","Wash hands immediately","Remove gown","Remove goggles"],a:1,tip:"Hand hygiene is always the final step after complete doffing."},{q:"The CCMA credential belongs to:",opts:["Your employer","You — earned through preparation and effort","Your school","The testing company"],a:1,tip:"Your credential. Your career. Your foundation. Go earn it. 🎓"}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared. You have practiced. Now go earn your CCMA. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
