<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>You Are Ready</title><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet"><style>*{margin:0;padding:0;box-sizing:border-box}body{min-height:100vh;background:linear-gradient(155deg,#0a1628,#0e1d38,#081428);font-family:'Fredoka',sans-serif;padding:24px 16px;color:#f0f0f0}.wrap{max-width:640px;margin:0 auto}.header{text-align:center;margin-bottom:24px}.icon{font-size:44px}h1{font-weight:800;font-size:28px;margin:8px 0 4px}.sub{color:#999;font-weight:600;font-size:15px}.topbar{display:flex;justify-content:space-between;margin-bottom:12px}.topbar .qn{color:#999;font-weight:700;font-size:14px}.topbar .sc{color:#60a5fa;font-weight:800;font-size:14px}.bar{height:6px;background:#1a3060;border-radius:10px;margin-bottom:20px;overflow:hidden}.bar-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#fb7185);border-radius:10px;transition:width .4s}.question{background:#112240;padding:22px 24px;border-radius:18px;margin-bottom:20px;border-left:4px solid #60a5fa}.question p{font-weight:800;font-size:18px;line-height:1.6}.opts{display:grid;gap:10px}.opt{padding:15px 20px;border-radius:14px;background:#1a3060;border:2px solid #1a3060;font-weight:700;font-size:15px;cursor:pointer;transition:all .2s;text-align:left}.opt:hover{filter:brightness(1.15)}.opt .letter{color:#60a5fa;font-weight:800;margin-right:12px}.opt.correct{background:rgba(74,222,128,.15);border-color:#4ade80}.opt.wrong{background:rgba(251,113,133,.15);border-color:#fb7185}.tip{margin-top:16px;padding:14px 20px;border-radius:14px;background:#112240}.tip strong{font-size:16px;display:block;margin-bottom:6px}.tip strong.ok{color:#4ade80}.tip strong.no{color:#fb7185}.tip span{color:#999;font-weight:600;font-size:14px}.done{text-align:center;background:#112240;border-radius:24px;padding:40px;border:2px solid rgba(74,222,128,.25)}.done .big{font-size:56px}.done h2{font-weight:800;font-size:28px;margin:12px 0}.done p{color:#999;font-weight:600;font-size:15px;margin-bottom:24px}.btn{padding:14px 36px;border:none;border-radius:14px;background:#60a5fa;color:#111;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit}</style></head><body>
<div class="wrap"><div class="header"><div class="icon">🎓</div><h1>You Are Ready</h1><p class="sub">Final confidence check — trust your 18 weeks of training</p></div><div id="game"></div><div id="doneBox" class="done" style="display:none"></div></div>
<script>
const QS=[{q:"Feeling nervous before the exam means:",opts:["You are not ready","You care — the best students prepared thoroughly, not felt most confident","You should postpone","Something is wrong"],a:1,tip:"Nerves = you care. Preparation = you are ready. Trust your training."},{q:"You have completed ___ weeks of clinical training.",opts:["8","12","16","18 — with labs, externship, and comprehensive review"],a:3,tip:"18 weeks of focused training. Skills practice. Externship. Review. You are trained."},{q:"The exam tests topics:",opts:["You have never seen before","Outside your program","You have studied and practiced throughout the program","That require medical school"],a:2,tip:"Everything on the exam is something you trained for. No surprises."},{q:"Your strongest exam tool is:",opts:["Memorization","Your 18 weeks of preparation and clinical instincts","Guessing techniques","Anxiety"],a:1,tip:"Your training. Your practice. Your habits. Trust them when facing each question."},{q:"After passing, you become a:",opts:["Student intern","Certified Clinical Medical Assistant — credentialed and career-ready","Volunteer","Researcher"],a:1,tip:"CCMA. A nationally recognized credential. A career starting line."},{q:"The habits you built across this program:",opts:["Only matter during exams","Are the foundation of every patient you will ever care for","Are temporary","Will need to be relearned"],a:1,tip:"Hand hygiene, patient ID, documentation, sharps safety — these protect real patients forever."},{q:"This credential belongs to:",opts:["Your school","Your employer","You — earned through effort, practice, and 18 weeks of hard work","The testing center"],a:2,tip:"Yours. The habits belong to your patients. Go earn your CCMA — then go take excellent care of people. 🎓"}];
let ci=0,score=0,chosen=null;function renderQ(){const g=document.getElementById('game'),q=QS[ci];let h='<div class="topbar"><span class="qn">Q '+(ci+1)+'/'+QS.length+'</span><span class="sc">Score: '+score+'</span></div><div class="bar"><div class="bar-fill" style="width:'+(ci/QS.length*100)+'%"></div></div><div class="question"><p>'+q.q+'</p></div><div class="opts">';q.opts.forEach((o,i)=>{let cls='opt';if(chosen!==null&&i===q.a)cls+=' correct';else if(chosen===i&&i!==q.a)cls+=' wrong';h+='<div class="'+cls+'" '+(chosen===null?'onclick="answer('+i+')"':'')+'><span class="letter">'+String.fromCharCode(65+i)+'</span>'+o+'</div>'});h+='</div>';if(chosen!==null){const ok=chosen===q.a;h+='<div class="tip"><strong class="'+(ok?'ok':'no')+'">'+(ok?'✅ Correct!':'❌ Not quite!')+'</strong><span>'+q.tip+'</span></div>'}g.innerHTML=h}function answer(i){if(chosen!==null)return;chosen=i;if(i===QS[ci].a)score++;renderQ();setTimeout(()=>{if(ci+1<QS.length){ci++;chosen=null;renderQ()}else showDone()},2000)}function showDone(){document.getElementById('game').style.display='none';const d=document.getElementById('doneBox');d.style.display='block';d.innerHTML='<div class="big">'+(score>=QS.length-1?'🏆':score>=QS.length-3?'⭐':'💪')+'</div><h2>'+score+'/'+QS.length+' Correct!</h2><p>You have prepared. You have practiced. Now go earn your CCMA. 🎓</p><button class="btn" onclick="reset()">🔄 Try Again</button>'}function reset(){ci=0;score=0;chosen=null;document.getElementById('game').style.display='block';document.getElementById('doneBox').style.display='none';renderQ()}renderQ();
</script></body></html>
