<style>
  :root {
    --text: #e4e4f0;
    --text-secondary: #9898b0;
    --surface-1: #1c1c2e;
    --surface-2: #282840;
    --border: #363650;
    --bg: #0d0d1a;
    --card-shadow: 0 2px 12px rgba(0,0,0,0.35);
    --font-body: 'DM Sans', -apple-system, sans-serif;
    --font-display: 'Playfair Display', Georgia, serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .app {
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 18px 60px;
  }
  .header { text-align: center; margin-bottom: 28px; }
  .header-tag {
    font-size: 11px; font-weight: 700; letter-spacing: 3px;
    text-transform: uppercase; color: #C0392B; margin-bottom: 6px;
  }
  .header h1 {
    font-family: var(--font-display); font-size: 32px; font-weight: 900;
    letter-spacing: -1px; margin-bottom: 6px; line-height: 1.1;
  }
  .header p { font-size: 13px; color: var(--text-secondary); }
  .flashcard {
    width: 100%; max-width: 500px; min-height: 250px; border-radius: 22px;
    cursor: pointer; padding: 34px; display: flex; flex-direction: column;
    justify-content: center; align-items: center; text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.12); transition: all .35s cubic-bezier(.4,0,.2,1);
    user-select: none; position: relative; margin: 0 auto;
  }
  .flashcard .label {
    position: absolute; top: 16px; left: 20px; font-size: 11px;
    font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; opacity: .7;
  }
  .flashcard .hint {
    position: absolute; top: 16px; right: 20px; font-size: 11px; opacity: .5;
  }
  .flashcard h2 {
    margin: 0; font-family: var(--font-display); font-size: 26px;
    font-weight: 900; line-height: 1.2; letter-spacing: -.5px;
  }
  .flashcard .def-text {
    margin: 0; font-size: 15px; line-height: 1.65; color: var(--text-secondary);
  }
  .progress-bar {
    height: 6px; border-radius: 6px; background: var(--surface-2); overflow: hidden;
  }
  .progress-bar .fill {
    height: 100%; border-radius: 6px; transition: width .3s;
  }
  .pill {
    padding: 8px 16px; border-radius: 24px; font-weight: 700;
    cursor: pointer; font-size: 13px; transition: all .2s; font-family: var(--font-body);
  }
  .pill-primary {
    border: none; color: #fff; padding: 13px 34px; font-size: 15px;
    border-radius: 30px; letter-spacing: .3px;
  }
  .pill-outline {
    background: transparent; border: 2px solid;
  }
  .chip {
    padding: 8px 14px; border-radius: 20px; border: 2px solid;
    font-weight: 600; cursor: pointer; font-size: 13px; transition: all .2s;
    font-family: var(--font-body); white-space: nowrap;
  }
  .text-center { text-align: center; }
  .hidden { display: none !important; }

<script>
const CATEGORIES = [
  {
    name: "CCMA Certification & Examination", emoji: "📝", color: "#C0392B",
    terms: [
      { term: "CCMA (Certified Clinical Medical Assistant)", def: "A nationally recognized professional credential awarded upon successful completion of the CCMA certification examination administered by the National Healthcareer Association (NHA). Demonstrates to employers, patients, and licensing authorities that the holder has met a defined standard of clinical and administrative competency in the medical assisting field. Renewal is required every two years through approved continuing education hours or by retaking the certification examination." },
      { term: "Certification Examination", def: "A standardized, nationally normed assessment designed to verify that a candidate has achieved the minimum level of knowledge and skill required for safe, competent professional practice. The CCMA certification exam is developed by subject-matter experts and aligned to a validated job task analysis of the medical assisting role. All questions are vetted for clinical accuracy, fairness, and alignment to real-world MA practice before appearing on the live exam." },
      { term: "Certification Eligibility", def: "The set of requirements a candidate must fulfill before sitting for the CCMA certification exam. Requirements include: successful completion of an accredited Medical Assistant training program, documentation of required clinical externship hours, and program completion verification by the institution. Candidates should confirm all eligibility requirements are met and documented prior to the examination date. Unresolved program requirements may delay or prevent access to the exam." },
      { term: "Exam Blueprint (Content Outline)", def: "The official document that describes the content domains, topic areas, and approximate question distribution of the CCMA certification examination. The blueprint is publicly available and is the authoritative guide for what will and will not appear on the exam. Domain weightings for the CCMA exam: Patient Care & Clinical Procedures (~40%), Administrative & Practice Management (~20%), Medical Terminology & Anatomy (~15%), Law, Ethics & Patient Rights (~15%), Infection Control & Safety (~10%)." },
      { term: "Domain Weighting", def: "The percentage of exam questions allocated to each content domain on the CCMA certification exam. Domain weighting reflects the relative importance and frequency of each knowledge area in actual MA practice. The domain with the highest weighting — Patient Care & Clinical Procedures at approximately 40% — reflects the fact that clinical skills form the majority of a medical assistant's daily work and carry the greatest patient safety implications." },
      { term: "Proctored Examination", def: "A standardized test administered under the supervision of a qualified proctor — either in person at a testing center or remotely through a secure proctoring platform. Proctoring ensures testing integrity by verifying the test-taker's identity, monitoring the examination environment, and ensuring that all testing rules are followed. All instructions provided by the proctor or testing platform must be followed completely and precisely from the beginning to the end of the examination session." },
      { term: "Remote Proctoring", def: "A testing delivery method in which a candidate completes a certification examination at a personal computer under real-time surveillance by a remote proctor using webcam, microphone, and screen-sharing technology. Requires specific technical requirements (operating system, browser, camera, microphone) that must be verified before the exam date. If a technical issue occurs during a remote-proctored exam, the candidate must follow the prescribed support protocol provided by the testing platform — not improvise a resolution." },
      { term: "Academic Integrity (Testing)", def: "The commitment to completing a certification examination honestly and independently — using only the knowledge and skills developed through legitimate study and training, without assistance from any unauthorized source, person, or material. Academic integrity in professional credentialing is not merely an ethical standard — it is the foundation on which the credential's meaning rests. A certification earned through dishonesty does not demonstrate competency and may result in credential revocation and professional consequences." },
      { term: "Continuing Education (CE) for Recertification", def: "Structured, approved learning activities completed after initial certification to maintain currency in clinical knowledge and satisfy the requirements for credential renewal. NHA-certified MAs must complete 10 hours of approved continuing education or retake the certification exam every two years to maintain active CCMA status. CE activities may include accredited online modules, webinars, in-person workshops, professional conferences, and journal-based learning programs relevant to medical assisting." },
    ],
  },
  {
    name: "Exam-Taking Strategy & Critical Thinking", emoji: "📝", color: "#2471A3",
    terms: [
      { term: "Multiple-Choice Examination Strategy", def: "A structured approach to answering multiple-choice questions that maximizes accuracy and minimizes preventable errors. Core principles: read the entire question stem before reading the answer choices; read all four answer choices before selecting one; identify and apply the domain the question belongs to; eliminate clearly incorrect options before comparing the remaining choices; and change an answer only when there is a specific, concrete reason to do so — not because of general uncertainty." },
      { term: "Question Stem Analysis", def: "The practice of fully reading and analyzing the question stem — the information preceding the answer choices — before evaluating any answer option. Key elements to identify: the clinical scenario or context, the specific action being requested, any qualifying words that change the correct answer (FIRST, BEST, NOT, EXCEPT, ALWAYS, NEVER), and the domain the question tests. Missing a qualifying word is one of the most common causes of avoidable errors on certification exams." },
      { term: "Qualifying Words (Exam)", def: "Specific words in a multiple-choice question stem that fundamentally alter which answer is correct. FIRST: asks for the immediate priority action — often a safety step rather than the most medically sophisticated one. BEST: asks for the most complete or appropriate response — not merely a correct one. NOT / EXCEPT: asks which answer does not belong — inverts the question. ALWAYS / NEVER: introduces absolute statements that may eliminate otherwise-plausible answers. These words must be identified before evaluating answer choices." },
      { term: "Distractor (Answer Choice)", def: "An incorrect answer option on a multiple-choice exam that is deliberately constructed to appear plausible to an underprepared or hasty test-taker. Distractors are designed by test writers to distinguish between candidates who have mastered the material and those who have only superficial familiarity with it. The presence of a convincing distractor is the reason that reading all four answer choices before selecting is essential — the first answer that sounds right is often a distractor." },
      { term: "Test-Taking Fatigue Management", def: "Strategies for maintaining cognitive performance and decision-making quality across the full length of a certification examination. Key practices: maintain a steady, deliberate pace rather than rushing early or slowing dramatically late; flag uncertain questions and return to them rather than dwelling on them in sequence; take brief mental resets between difficult questions by closing your eyes for a moment or taking a slow breath; and trust that preparation-based recall is more reliable late in an exam than anxiety-driven second-guessing." },
      { term: "Answer-Change Protocol", def: "The principle governing when a previously selected exam answer should be reconsidered. Research consistently shows that initial instincts on multiple-choice exams are correct more often than changed answers. An answer should be changed when: you identify that you misread a key word in the question stem (FIRST, NOT, EXCEPT); you recall a specific clinical fact that directly contradicts your original choice; or you complete a subsequent question that provides relevant clarifying information. Answers should not be changed due to general anxiety, uncertainty, or the feeling that you have selected the same letter too many times." },
      { term: "Domain-Based Reasoning", def: "The exam strategy of identifying which of the five CCMA content domains a question belongs to before evaluating answer choices — then applying the characteristic reasoning patterns of that domain. Patient safety and infection control questions: safety first, report to supervisor. HIPAA questions: disclosure without consent is a violation; secure filing is not. Ethics questions: apply non-maleficence, beneficence, autonomy, and justice. Scope of practice questions: consult the supervising provider before proceeding. Identifying the domain activates the correct reasoning framework." },
    ],
  },
  {
    name: "Clinical Procedures — Final Review", emoji: "🏥", color: "#7D3C98",
    terms: [
      { term: "Vital Signs — Normal Adult Ranges", def: "The six vital signs and their normal adult ranges: Heart rate: 60–100 bpm (bradycardia <60; tachycardia >100). Blood pressure: <120/80 mmHg (Stage 1 HTN ≥130/80; Stage 2 HTN ≥140/90). Respiratory rate: 12–20 breaths/min (tachypnea >20; bradypnea <12). Temperature: 97–99°F, oral average 98.6°F. SpO2: 95–100% (below 90% = critical, report immediately). Pain: patient-rated 0–10 — document the exact number stated." },
      { term: "Injection Route Summary", def: "The five injection routes and their defining specifications: Intradermal (ID): 10–15°, bevel up, 25–27 G, ¼–½ inch, ≤0.1 mL — wheal must form, never massage. Subcutaneous (SC): 45°, 23–25 G, 5/8 inch, ≤1.5 mL — pinch skin, release before injecting. IM Deltoid: 90°, 22–25 G, 1–1½ inch, ≤1 mL — adults only. IM Vastus Lateralis: 90°, 22–25 G, 1–1½ inch, ≤3 mL — preferred for infants and children under 3. IM Ventrogluteal: 90°, 22–25 G, 1½ inch, ≤3 mL — safest IM site for adults." },
      { term: "12-Lead EKG — Lead Positions", def: "The 10 electrode positions generating 12 leads: V1 — right of sternum, 4th ICS. V2 — left of sternum, 4th ICS. V3 — diagonal midpoint between V2 and V4. V4 — left midclavicular line, 5th ICS. V5 — anterior axillary line, same level as V4. V6 — midaxillary line, same level as V4 and V5. RA: right arm/upper right torso. LA: left arm/upper left torso. RL: right leg/lower right torso (ground only — generates no lead). LL: left leg/lower left torso." },
      { term: "Order of Draw", def: "The required venipuncture tube collection sequence to prevent additive cross-contamination: Sterile/blood cultures (yellow) → Light Blue (sodium citrate, coagulation — fill completely) → Red/Gold SST (chemistry, serology) → Green (heparin, BMP) → Lavender/Purple (EDTA, CBC) → Gray (fluoride, glucose). Mnemonic: Stop Looking Right Now Later. Tubes must be inverted gently the required number of times immediately after filling — NEVER shaken, as shaking causes hemolysis." },
      { term: "Pharmacokinetics — ADME Summary", def: "The four phases of drug processing: Absorption — drug moves from the administration site into the bloodstream; IV fastest, oral slowest. Distribution — bloodstream delivers the drug to tissues; blood-brain and placental barriers limit delivery to some sites. Metabolism — liver converts active drug to metabolites; rate affected by age, organ health, genetics. Excretion — kidneys eliminate metabolites through urine; impaired kidney function may require dose adjustment. Half-life determines dosing frequency." },
      { term: "Controlled Substances — Schedule Summary", def: "DEA Schedule classifications: Schedule I: no accepted medical use, highest abuse potential (heroin, LSD). Schedule II: high abuse risk, accepted medical use; hand-signed Rx, locked storage, no refills (oxycodone, fentanyl, amphetamine). Schedule III: moderate potential; up to 5 refills in 6 months (ketamine, acetaminophen/codeine). Schedule IV: low potential; up to 5 refills in 6 months (tramadol, benzodiazepines). Schedule V: lowest potential (diphenoxylate/atropine, guaifenesin/codeine)." },
      { term: "Patient Positioning Summary", def: "Eight clinical examination positions: Supine (flat on back) — head/chest/abdominal exams. Prone (face down) — back exams. Dorsal Recumbent (knees bent, feet flat) — vaginal/rectal/perineal exams. Lithotomy (legs in stirrups) — pelvic exams, Pap test. Fowler's (90° upright) — breathing difficulty. Semi-Fowler's (45°) — post-surgical care. Left Lateral/Sims (left side) — rectal exams, enemas. Knee-Chest (kneeling, chest down) — proctologic exams, sigmoidoscopy." },
    ],
  },
  {
    name: "Administrative Functions — Final Review", emoji: "🗂️", color: "#C2185B",
    terms: [
      { term: "Insurance Billing — Key Terms", def: "Third-party payer: the insurance company (not the patient or provider). Primary insurance: billed first. Secondary insurance: covers remaining balance after primary pays. Preauthorization: insurer approval obtained before a procedure — does not guarantee zero patient cost. EOB (Explanation of Benefits): document showing amount billed, amount paid, and patient responsibility. Coordination of benefits: the process for determining which insurer pays first when a patient has multiple policies." },
      { term: "Medical Record Documentation Rules", def: "Core standards for all medical record entries: use black or dark blue ink; date and time every entry; never use correction fluid — draw one line through errors, write 'error,' initial, and enter the correction; leave no blank lines between entries; late entries must be labeled with current date and time of entry; document immediately after the procedure — never before and never from memory hours later. The legal standard: 'if it isn't documented, it didn't happen.'" },
      { term: "Telephone Etiquette — Five P's", def: "The professional telephone communication framework: Polite — use a warm, clear tone; smile while speaking because it comes through in the voice. Prepared — have all relevant patient and schedule information ready before picking up. to the Point — stay focused on the purpose of the call without wandering. Perceptive — respect the caller's time; do not repeat information unnecessarily. cooPerative — provide what the caller needs, or find someone who can. Correct greeting: 'Thank you for calling [practice name], this is [your name], how may I assist you?'" },
      { term: "EHR vs. EMR", def: "EMR (Electronic Medical Record): a digital patient record used and maintained within a single healthcare organization. EHR (Electronic Health Record): extends across multiple organizations and providers — allows authorized providers at different facilities to view and contribute to a shared patient record, improving care coordination and reducing duplicate testing. CPOE (Computerized Provider Order Entry): allows providers to enter orders electronically; MAs may enter order information for provider authorization; integrates clinical decision support to flag drug interactions and dosage errors." },
      { term: "Scheduling — Pre-Appointment Verification", def: "The required steps before booking any patient appointment: verify the patient's full name, date of birth, insurance information, and chief complaint. Insurance eligibility must be confirmed before the appointment — not during check-in. For new patients, verify coverage and any authorization requirements before booking certain procedure types. Document the chief complaint accurately. Confirm provider availability. Reduce no-shows by sending a reminder call or automated message 24–48 hours before the appointment." },
    ],
  },
  {
    name: "Law, Ethics & HIPAA — Final Review", emoji: "🧭", color: "#D68910",
    terms: [
      { term: "HIPAA — Violations vs. Permitted Actions", def: "Violations: discussing patient details in public areas, hallways, or elevators (even without names); accessing records without authorization; sharing PHI without consent; leaving records unsecured; sending PHI to the wrong recipient. Not violations: filing records in a locked, secure location; sharing PHI with the treating care team for treatment purposes; disclosing with a signed patient release form; mandatory reporting to public health authorities. Minimum necessary standard: share only the PHI needed for the specific purpose." },
      { term: "Informed Consent — Three Requirements", def: "Valid informed consent requires: (1) a legally and mentally competent patient — they must have decision-making capacity; (2) complete disclosure — the patient receives full information about the procedure, its risks, benefits, alternatives, and the right to refuse; (3) voluntariness — consent is given freely without coercion or undue pressure. Written documentation is required for procedures. Verbal consent alone is insufficient. Implied consent applies in life-threatening emergencies when the patient cannot respond." },
      { term: "Advance Directives — Four Types", def: "Living will: the patient's written instructions about specific treatments they do or do not want if they become incapacitated. Durable Power of Attorney (DPOA): names a specific person to make healthcare decisions on the patient's behalf. DNR (Do Not Resuscitate): instructs providers not to perform CPR or advanced cardiac life support. POLST (Physician Orders for Life-Sustaining Treatment): actionable medical orders that travel with the patient across all care settings. None expire unless officially revoked in writing by the patient while competent." },
      { term: "Mandatory Reporting Obligations", def: "Legal requirements to report specific information to public health or law enforcement authorities without patient consent: suspected child or elder abuse or neglect (suspicion alone is sufficient — do not wait for confirmed evidence); reportable communicable diseases (TB, HIV, gonorrhea, COVID-19, others per state guidelines); injuries from violence (gunshot wounds, stabbings); and court-ordered disclosures. Failure to report is a legal violation. The MA's role is to report to the supervising provider and document — not to investigate independently." },
      { term: "Medical Ethics — Four Principles", def: "The four foundational bioethical principles: Non-maleficence — do no harm; every clinical action must be evaluated against its potential to harm the patient. Beneficence — act in the patient's best interest; take positive steps to promote well-being. Autonomy — respect the patient's right to make their own informed decisions, including the right to refuse treatment. Justice — treat all patients fairly and equitably regardless of race, gender, religion, age, socioeconomic status, or disability. When these principles appear to conflict, the clinical team works collaboratively to identify the most ethical course of action." },
      { term: "Scope of Practice — Final Principle", def: "The state-defined and employer-defined boundary of tasks a medical assistant is legally authorized and competent to perform. MAs work under physician supervision and may never independently diagnose, prescribe, or perform tasks they have not been specifically trained for and authorized to do. When a situation or task is outside the MA's training or authorization: consult the supervising provider before proceeding. Never guess, never act on a colleague's suggestion alone, and never proceed based on confidence alone. This is the defining principle of safe, ethical MA practice." },
    ],
  },
  {
    name: "Infection Control — Final Review", emoji: "🦠", color: "#148F77",
    terms: [
      { term: "Standard Precautions — Core Elements", def: "The baseline infection prevention protocol applied to every patient, every encounter, regardless of diagnosis: hand hygiene (the single most effective infection prevention measure); appropriate PPE (gloves for body fluid contact; gown, mask, eye protection when splash risk exists); safe needle and sharps handling (immediate disposal in puncture-proof sharps containers, never recap); respiratory hygiene and cough etiquette; and safe injection practices (one needle, one syringe, one patient — never reuse). Standard precautions treat all blood and body fluids as potentially infectious." },
      { term: "Transmission-Based Precautions — Three Tiers", def: "Additional precautions added on top of standard precautions when a patient has a known or suspected infection: Contact precautions (MRSA, C. difficile, wound infections): gown and gloves for any contact with the patient or their environment. Droplet precautions (influenza, pertussis, meningitis): surgical mask when within 3–6 feet of the patient. Airborne precautions (tuberculosis, measles, varicella): N95 respirator (fitted and tested) and placement in a negative-pressure room. A surgical mask is NOT sufficient for airborne precautions." },
      { term: "Hand Hygiene — Five Moments", def: "The WHO-defined five moments when hand hygiene is required: (1) before patient contact; (2) before an aseptic or clean procedure; (3) after body fluid exposure risk; (4) after patient contact; (5) after contact with the patient's immediate environment. Soap and water is required when hands are visibly soiled, after using the restroom, and after contact with blood or body fluids. Alcohol-based sanitizer (≥60% alcohol) is acceptable for all other moments. Gloves do not replace hand hygiene — sanitize after every glove removal." },
      { term: "PPE Donning and Doffing — Full Sequence", def: "Donning order (putting on): gown → mask or N95 respirator → goggles or face shield → gloves. Doffing order (removing): gloves first (peel off inside-out, touching only the cuff) → goggles or face shield → gown (roll away from the body) → mask or respirator. Perform hand hygiene immediately after completing the doffing sequence. The doffing sequence is designed to ensure the most contaminated items (gloves) are removed first while protecting the face and hands from cross-contamination during removal." },
      { term: "Disinfection Levels — Applied Summary", def: "Three levels based on microorganisms destroyed: Low-level disinfection: kills most bacteria, some viruses, some fungi — used for environmental surfaces (exam tables, countertops, chairs) using EPA-registered products such as hydrogen peroxide or dilute bleach. Intermediate-level: kills bacteria, most viruses, fungi, mycobacteria, but not spores — used for non-critical patient care items (stethoscopes, BP cuffs) using 70% isopropyl alcohol. High-level: kills all microorganisms except large numbers of spores — used for semi-critical items (endoscopes) using glutaraldehyde (Cidex OPA)." },
      { term: "Autoclave Sterilization — Key Parameters", def: "Steam sterilization under pressure at 250–270°F. Unwrapped items: minimum 20 minutes. Wrapped items: minimum 30 minutes. Hinged instruments must be stored and sterilized open. Quality verification: chemical indicator tape (turns dark/black when steam reached the package exterior) and internal indicator strips (confirm steam penetration inside); biological indicators (spore tests) are the most rigorous QC measure. Sterile package integrity: packages remain sterile for 30 days if dry, intact, and stored in a clean, closed environment." },
    ],
  },
  {
    name: "Medical Terminology & Anatomy — Final Review", emoji: "📖", color: "#1A5276",
    terms: [
      { term: "High-Yield Prefixes — Final Review", def: "Brady- (slow): bradycardia, bradypnea. Tachy- (fast): tachycardia, tachypnea. Hypo- (below/deficient): hypoglycemia, hypotension, hypothyroidism. Hyper- (above/excessive): hyperglycemia, hypertension, hyperthyroidism. Peri- (around): pericardium, peritoneum, periosteum. Epi- (upon/above): epidermis, epigastric. Intra- (within): intradermal, intravenous, intramuscular. Pre- (before): preoperative, prenatal. Gastro- (stomach): gastroenteritis, gastroscopy. Neuro- (nerve): neurology, neuropathy, neuralgia." },
      { term: "High-Yield Suffixes — Final Review", def: "-itis (inflammation): appendicitis, pericarditis, myocarditis (inflammation, NOT infarction). -ectomy (surgical removal): appendectomy, tonsillectomy, thyroidectomy. -pathy (disease/disorder): neuropathy, cardiomyopathy, nephropathy. -scope (viewing instrument): otoscope, ophthalmoscope, endoscope, stethoscope. -ology (study of): cardiology, neurology, gastroenterology, dermatology. -algia (pain): neuralgia, myalgia, arthralgia. -plasty (surgical repair): rhinoplasty, angioplasty, arthroplasty. -stenosis (narrowing): arteriosclerosis, pyloric stenosis." },
      { term: "Cardiovascular Anatomy — High-Yield Facts", def: "Heart chambers: right atrium and right ventricle (receive and pump deoxygenated blood to lungs via pulmonary artery). Left atrium and left ventricle (receive oxygenated blood from lungs via pulmonary VEIN, pump to body via aorta). Critical distinction: the pulmonary VEIN carries oxygenated blood FROM the lungs TO the heart — the artery carries deoxygenated blood the other direction. SA node = the heart's natural pacemaker (right atrium). Medulla oblongata regulates heart rate and respiratory rate." },
      { term: "Gastrointestinal Anatomy — High-Yield Facts", def: "The GI tract in sequence: mouth → esophagus → stomach → small intestine (duodenum, jejunum, ileum) → large intestine (cecum, colon, rectum) → anus. Small intestine: the primary site of nutrient absorption. Large intestine: water absorption and waste consolidation. Liver: produces bile (for fat digestion) and metabolizes most medications. Gallbladder: stores bile. Pancreas: produces insulin (beta cells — regulates blood glucose) and digestive enzymes. Insulin is produced by the pancreas — not the liver." },
      { term: "Myocardial Infarction vs. Myocarditis", def: "Two frequently confused, clinically distinct conditions. Myocardial infarction (MI) = a heart attack — death of heart muscle tissue caused by complete or near-complete blockage of a coronary artery cutting off blood supply. The suffix -infarction indicates tissue death from ischemia. Myocarditis = inflammation (-itis) of the myocardium (heart muscle), most commonly caused by a viral infection. Different causes, different presentations, different treatments. On the certification exam: when a question mentions a heart attack, it is describing an MI — not myocarditis." },
      { term: "Respiratory Anatomy — High-Yield Facts", def: "Upper respiratory tract: nose, pharynx, larynx, trachea. Lower respiratory tract: bronchi, bronchioles, alveoli. The alveoli are the site of gas exchange — oxygen moves from inhaled air into the bloodstream; carbon dioxide moves from the bloodstream into the alveoli to be exhaled. Inhalation: the diaphragm contracts and flattens → the thoracic cavity expands → air rushes in. Exhalation: the diaphragm relaxes → the thoracic cavity compresses → air is pushed out. Normal adult respiratory rate: 12–20 breaths per minute." },
    ],
  },
  {
    name: "Career Readiness & Professional Identity", emoji: "⭐", color: "#CA6F1E",
    terms: [
      { term: "CCMA as a Professional Credential", def: "The Certified Clinical Medical Assistant designation communicates to every employer in the healthcare field that the holder has: completed an accredited training program, met a nationally defined competency standard in both clinical and administrative skills, and passed a rigorous independent assessment. Certified MAs consistently receive higher starting wages, broader scope of responsibility, faster career advancement, and greater employer preference than uncertified colleagues performing the same role." },
      { term: "Professional Identity as a Medical Assistant", def: "The internalized sense of role, values, and standards that defines how a medical assistant approaches every patient encounter, every documentation task, every safety protocol, and every professional interaction. Professional identity is not a credential or a title — it is the sum of the habits, values, and clinical judgment built through training and practice. It includes: the automatic hand hygiene, the instinct to verify identity before every procedure, the commitment to accurate documentation, and the understanding that the patient's safety and dignity are always the first priority." },
      { term: "Clinical Habits as Lasting Professional Assets", def: "The consistent, automatic professional behaviors that define a medical assistant's daily practice — built through deliberate training and reinforced through repetition. Core clinical habits that carry forward into every role: hand hygiene before every patient contact, two-identifier verification before every procedure, immediate sharps disposal after every needle use, accurate and prompt documentation after every clinical action, and professional communication before, during, and after every patient encounter. These habits protect patients every day and represent the practical expression of the training completed in this program." },
      { term: "Interprofessional Collaboration", def: "The practice of working cooperatively and respectfully with healthcare professionals from different disciplines — physicians, nurses, NPs, PAs, lab technicians, billing staff, and administrative personnel — to deliver coordinated, high-quality patient care. Effective interprofessional collaboration requires clear, professional communication; well-defined role boundaries; mutual respect across disciplines; and the willingness to raise patient safety concerns regardless of hierarchy. MAs are core members of the interprofessional team, not peripheral support staff." },
      { term: "Long-Term Professional Development", def: "The ongoing commitment to learning, skill expansion, and practice improvement throughout a clinical career — not only during initial training. Professional development includes: completing CE credits as genuine learning rather than credential maintenance; staying current with evolving clinical guidelines and standards of practice; seeking feedback from clinical supervisors and colleagues; taking on expanded responsibilities as competency grows; and approaching every patient encounter with the same curiosity and care that characterized the first week of training. The best medical assistants are always improving." },
      { term: "Growth Mindset in Clinical Practice", def: "The belief that clinical skill, professional judgment, and patient care quality can be continuously developed through effort, feedback, and deliberate practice — rather than remaining fixed at the level achieved at certification. Clinicians with a growth mindset ask questions when uncertain, seek feedback after difficult encounters, view mistakes as learning opportunities rather than evidence of inadequacy, and invest in continued education. This mindset is particularly important in healthcare, where guidelines change, technology evolves, and each patient encounter presents a unique clinical situation." },
      { term: "From Student to Clinician — The Transition", def: "The professional and psychological shift that occurs when a person completes a training program and moves from learning clinical skills to practicing them independently under supervision. This transition is marked not by a single moment — passing an exam, receiving a credential — but by the internalization of professional values, clinical judgment, and the habits that define competent, safe practice. The transition began not at the end of the program but at every moment when a student chose to practice correctly rather than take shortcuts — and it continues forward for the entire length of a clinical career." },
      { term: "Topic / Question", def: "Must-Know Answer for the Exam" },
      { term: "Normal HR / brady / tachy", def: "60–100 bpm. Bradycardia <60. Tachycardia >100. Document: rate, rhythm, AND strength — all three every time." },
      { term: "Normal BP / HTN stages", def: "<120/80 mmHg. Stage 1 HTN ≥130/80. Stage 2 HTN ≥140/90. First Korotkoff = systolic; last sound = diastolic." },
      { term: "Normal RR / tachypnea / bradypnea", def: "12–20 breaths/min. Tachypnea >20. Bradypnea <12. Count without telling the patient — immediately after the pulse." },
      { term: "Temperature accuracy order", def: "Rectal (most accurate) > temporal > tympanic > oral > axillary (least accurate)." },
      { term: "SpO2 normal / critical", def: "Normal: 95–100%. Below 95% = intervention needed. Below 90% = CRITICAL — report immediately." },
      { term: "ID injection — angle and key rule", def: "10–15°, bevel up, 25–27 G, ≤0.1 mL. Wheal MUST form. Never massage, bandage, or apply pressure after." },
      { term: "SC injection — angle and technique", def: "45°, 23–25 G, 5/8\", ≤1.5 mL. Pinch at least 1 inch of skin. Release the pinch before injecting." },
      { term: "IM — deltoid vs. vastus lateralis", def: "Deltoid: adults only, ≤1 mL, 90°. Vastus lateralis: infants/children <3 years, ≤3 mL, 90°." },
      { term: "EKG — V1 and V2 positions", def: "V1: right of sternum, 4th ICS. V2: left of sternum, 4th ICS. Both flank the sternum." },
      { term: "EKG — V4 and V5/V6 rule", def: "V4: left midclavicular line, 5th ICS. V5 and V6 must be at the exact same horizontal level as V4." },
      { term: "Order of draw mnemonic", def: "Stop Looking Right Now Later: Sterile → Light Blue → Red/Gold → Green → Lavender → Gray." },
      { term: "Tube rule — never shake", def: "NEVER shake a blood collection tube — shaking causes hemolysis. Gently invert the required number of times." },
      { term: "Capillary draw — first drop", def: "Wipe away the first drop (diluted with tissue fluid). Collect from the second drop only." },
      { term: "Pulmonary vein vs. artery", def: "Pulmonary VEIN: oxygenated blood FROM lungs TO heart. Pulmonary ARTERY: deoxygenated blood from heart to lungs." },
      { term: "Small intestine function", def: "Primary site of nutrient ABSORPTION. Pancreas = insulin production. Liver = bile production. Gallbladder = bile storage." },
      { term: "MI vs. myocarditis", def: "MI = heart attack (tissue death from blocked artery). Myocarditis = inflammation of heart muscle (-itis). Never confuse." },
      { term: "HIPAA — violation vs. not", def: "Filing records securely = NOT a violation. Discussing patients in public = IS a violation. Accidental breach = report immediately." },
      { term: "Consent — three requirements", def: "Competent patient + complete information (risks, benefits, alternatives, right to refuse) + voluntary — all three required." },
      { term: "Scope of practice — key rule", def: "When in doubt: consult the supervising provider before proceeding. Never guess. Never act on a colleague's word alone." },
      { term: "Sharps disposal — the only rule", def: "NEVER recap a used needle. Drop directly into the sharps container at the point of care. No exceptions. Ever." },
      { term: "Read all four answers first", def: "Do not select an answer until you have read all four options. The first one that sounds right may not be the best one — read, compare, then choose." },
      { term: "Watch for qualifying words", def: "FIRST = immediate priority. BEST = most complete answer. NOT / EXCEPT = the answer that does not belong. ALWAYS / NEVER = absolute — narrow the field carefully." },
      { term: "Safety questions — the pattern", def: "The answer that protects the patient AND involves the supervising provider is almost always correct. Answers that ignore, delay, or bypass chain of command are almost never correct." },
      { term: "Scope of practice questions", def: "When a task is outside your training or authorization: consult the supervising provider. Never guess. Never act on a colleague's suggestion alone. This is the correct answer every time." },
      { term: "HIPAA questions — the rule", def: "Secure filing, treating team access, and signed-release disclosures = NOT violations. Public discussion, unauthorized access, breach without reporting = violations." },
      { term: "'All of the above' option", def: "If two of the individual options are clearly correct, 'all of the above' is very likely the right choice. Only eliminate it when you can confirm that one option is factually wrong." },
      { term: "Flag and return to hard questions", def: "Do not spend excessive time on a single uncertain question. Flag it, move forward, and return after completing the rest. Fresh perspective often reveals the answer." },
      { term: "Answer every question", def: "There is no penalty for an incorrect answer on the CCMA exam. A blank answer is always wrong. An educated guess has a nonzero probability of being correct." },
      { term: "Change answers carefully", def: "Change your answer only if you misread a qualifying word or recall a specific conflicting fact. Vague anxiety is not a reason to change a carefully selected answer." },
      { term: "Trust your training", def: "You are applying 18 weeks of clinical and administrative training — not guessing. When uncertain, return to domain-based reasoning: what does safety require? What does scope of practice require?" },
    ],
  },
];
const ALL_TERMS = CATEGORIES.flatMap((cat, ci) =>
  cat.terms.map(t => ({ ...t, category: cat.name, emoji: cat.emoji, color: cat.color, catIndex: ci }))
);
let flashDeck = [];
let flashIdx = 0;
let flashFlipped = false;
let flashKnown = 0;
let flashLearning = 0;
let flashDone = false;
let flashSelectedCats = new Set(CATEGORIES.map((_, i) => i));
let flashStarted = false;
document.getElementById('header-subtitle').textContent =
  `Final Review & CCMA Exam Success \u00b7 ${ALL_TERMS.length} terms across ${CATEGORIES.length} topics`;
renderFlash();
function startFlashDeck() {
  const terms = CATEGORIES.flatMap((cat, ci) =>
    flashSelectedCats.has(ci) ? cat.terms.map(t => ({ ...t, color: cat.color, emoji: cat.emoji, category: cat.name })) : []
  );
  flashDeck = shuffle([...terms]);
  flashIdx = 0; flashFlipped = false; flashKnown = 0; flashLearning = 0; flashDone = false; flashStarted = true;
  renderFlash();
}
function flashToggleCat(i) {
  if (flashSelectedCats.has(i)) {
    if (flashSelectedCats.size > 1) flashSelectedCats.delete(i);
  } else { flashSelectedCats.add(i); }
  renderFlash();
}
function flashMark(isKnown) {
  if (isKnown) flashKnown++; else flashLearning++;
  if (flashIdx + 1 >= flashDeck.length) { flashDone = true; renderFlash(); return; }
  flashIdx++; flashFlipped = false; renderFlash();
}
function renderFlash() {
  const el = document.getElementById('flash-mode');
  if (!flashStarted || flashDeck.length === 0) {
    let html = `<div class="text-center" style="padding:40px 0">
      <p style="font-size:18px;margin-bottom:20px;color:var(--text)">Select categories and start studying!</p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:24px">`;
    CATEGORIES.forEach((c, i) => {
      const sel = flashSelectedCats.has(i);
      html += `<button class="chip" onclick="flashToggleCat(${i})"
        style="border-color:${c.color};background:${sel ? c.color : 'transparent'};color:${sel ? '#fff' : c.color}">
        ${c.emoji} ${escHtml(c.name)}</button>`;
    });
    html += `</div>
      <button class="pill-primary" style="background:#E74C3C" onclick="startFlashDeck()">Shuffle & Start \u2192</button>
    </div>`;
    el.innerHTML = html; return;
  }
  if (flashDone) {
    const total = flashKnown + flashLearning;
    const pct = Math.round((flashKnown / total) * 100);
    const emoji = pct >= 80 ? '\ud83c\udf89' : pct >= 50 ? '\ud83d\udcaa' : '\ud83d\udcd6';
    el.innerHTML = `
      <div class="text-center" style="padding:40px 0">
        <div style="font-size:48px;margin-bottom:12px">${emoji}</div>
        <h3 style="margin:0 0 8px">Round Complete!</h3>
        <p style="color:var(--text-secondary);font-size:15px;margin:0 0 24px">
          ${flashKnown} knew it \u00b7 ${flashLearning} still learning \u00b7 ${pct}% mastery
        </p>
        <div style="width:100%;max-width:300px;height:10px;border-radius:10px;background:var(--surface-2);margin:0 auto 24px;overflow:hidden">
          <div style="width:${pct}%;height:100%;border-radius:10px;background:linear-gradient(90deg,#27AE60,#2ECC71);transition:width .6s"></div>
        </div>
        <button class="pill-primary" style="background:#3498DB" onclick="flashDeck=[];flashStarted=false;flashDone=false;renderFlash()">New Round</button>
      </div>`;
    return;
  }
  const card = flashDeck[flashIdx];
  const pctProgress = ((flashIdx / flashDeck.length) * 100);
  el.innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;padding:12px 0">
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;width:100%">
        <span style="font-size:13px;color:var(--text-secondary);font-weight:600">${flashIdx + 1}/${flashDeck.length}</span>
        <div class="progress-bar" style="flex:1"><div class="fill" style="width:${pctProgress}%;background:${card.color}"></div></div>
        <span style="font-size:12px;color:var(--text-secondary)">\u2713${flashKnown} \u2717${flashLearning}</span>
      </div>
      <div class="flashcard" onclick="flashFlipped=!flashFlipped;renderFlash();"
           style="background:${flashFlipped ? 'var(--surface-1)' : card.color};color:${flashFlipped ? 'var(--text)' : '#fff'}">
        <span class="label">${flashFlipped ? 'Definition' : card.emoji + ' ' + escHtml(card.category)}</span>
        <span class="hint">${flashFlipped ? '' : 'tap to flip'}</span>
        ${!flashFlipped
          ? `<h2>${escHtml(card.term)}</h2>`
          : `<p class="def-text">${escHtml(card.def)}</p>`
        }
      </div>
      ${flashFlipped ? `
        <div style="display:flex;gap:12px;margin-top:20px">
          <button class="pill pill-outline" style="border-color:#E74C3C;color:#E74C3C;padding:12px 28px;font-size:14px" onclick="flashMark(false)">Still Learning</button>
          <button class="pill-primary" style="background:#27AE60;padding:12px 28px;font-size:14px" onclick="flashMark(true)">Got It! \u2713</button>
        </div>` : ''}
    </div>`;
}
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}
function escHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}
</script>
</body>
