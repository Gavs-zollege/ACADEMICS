<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Week 18 Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:13px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}.search-wrap input:focus{border-color:var(--red)}.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}.cat-btn{padding:3px 9px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:11px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}.cat-btn:hover{opacity:.85}.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}.item:last-child{border-bottom:none}.item:hover{background:var(--surface2)}.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}.item-left{display:flex;align-items:center;gap:10px}.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}.item.open .item-bar{opacity:1}.item-term{font-size:20px;font-weight:700;color:#fff}.item-cat{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}.item.open .item-def{display:block}.item.open .item-term{color:var(--red-light)}.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}.pg-btn:disabled{opacity:.3;cursor:default}.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}.pg-dot.active{background:var(--red-light);transform:scale(1.3)}.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Week 18 Glossary</h1>
  <p class="sub">Final Review & CCMA Exam Success</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"CCMA Certification",color:"#E05555",terms:[
    {term:"CCMA (Certified Clinical Medical Assistant)",def:"A nationally recognized professional credential awarded upon successful completion of the CCMA certification examination admini..."},
    {term:"Certification Examination",def:"A standardized, nationally normed assessment designed to verify that a candidate has achieved the minimum level of knowledge an..."},
    {term:"Certification Eligibility",def:"The set of requirements a candidate must fulfill before sitting for the CCMA certification exam."},
    {term:"Exam Blueprint (Content Outline)",def:"The official document that describes the content domains, topic areas."},
    {term:"Domain Weighting",def:"The percentage of exam questions allocated to each content domain on the CCMA certification exam."},
    {term:"Proctored Examination",def:"A standardized test administered under the supervision of a qualified proctor — either in person at a testing center or remotel..."},
    {term:"Remote Proctoring",def:"A testing delivery method in which a candidate completes a certification examination at a personal computer under real-time sur..."},
    {term:"Academic Integrity (Testing)",def:"The commitment to completing a certification examination honestly and independently — using only the knowledge and skills devel..."},
    {term:"Continuing Education (CE) for Recertification",def:"Structured, approved learning activities completed after initial certification to maintain currency in clinical knowledge and s..."}
  ]},
  {name:"Exam Strategy",color:"#6B7B8D",terms:[
    {term:"Multiple-Choice Examination Strategy",def:"A structured approach to answering multiple-choice questions that maximizes accuracy and minimizes preventable errors."},
    {term:"Question Stem Analysis",def:"The practice of fully reading and analyzing the question stem — the information preceding the answer choices — before evaluatin..."},
    {term:"Qualifying Words (Exam)",def:"Specific words in a multiple-choice question stem that fundamentally alter which answer is correct."},
    {term:"Distractor (Answer Choice)",def:"An incorrect answer option on a multiple-choice exam that is deliberately constructed to appear plausible to an underprepared o..."},
    {term:"Test-Taking Fatigue Management",def:"Strategies for maintaining cognitive performance and decision-making quality across the full length of a certification examinat..."},
    {term:"Answer-Change Protocol",def:"The principle governing when a previously selected exam answer should be reconsidered."},
    {term:"Domain-Based Reasoning",def:"The exam strategy of identifying which of the five CCMA content domains a question belongs to before evaluating answer choices ..."}
  ]},
  {name:"Clinical Procedures",color:"#8B6AAE",terms:[
    {term:"Vital Signs — Normal Adult Ranges",def:"The six vital signs and their normal adult ranges: Heart rate: 60–100 bpm (bradycardia <60; tachycardia >100)."},
    {term:"Injection Route Summary",def:"The five injection routes and their defining specifications: Intradermal (ID): 10–15°, bevel up, 25–27 G, ¼–½ inch, ≤0."},
    {term:"12-Lead EKG — Lead Positions",def:"The 10 electrode positions generating 12 leads: V1 — right of sternum, 4th ICS. V2 — left of sternum, 4th ICS."},
    {term:"Order of Draw",def:"The required venipuncture tube collection sequence to prevent additive cross-contamination: Sterile/blood cultures (yellow) → L..."},
    {term:"Pharmacokinetics — ADME Summary",def:"The four phases of drug processing: Absorption — drug moves from the administration site into the bloodstream; IV fastest."},
    {term:"Controlled Substances — Schedule Summary",def:"DEA Schedule classifications: Schedule I: no accepted medical use, highest abuse potential (heroin, LSD)."},
    {term:"Patient Positioning Summary",def:"Eight clinical examination positions: Supine (flat on back) — head/chest/abdominal exams. Prone (face down) — back exams."}
  ]},
  {name:"Admin Functions",color:"#E74C6F",terms:[
    {term:"Insurance Billing — Key Terms",def:"Third-party payer: the insurance company (not the patient or provider). Primary insurance: billed first."},
    {term:"Medical Record Documentation Rules",def:"Core standards for all medical record entries: use black or dark blue ink; date and time every entry; never use correction flui..."},
    {term:"Telephone Etiquette — Five P's",def:"The professional telephone communication framework: Polite — use a warm."},
    {term:"EHR vs. EMR",def:"EMR (Electronic Medical Record): a digital patient record used and maintained within a single healthcare organization."},
    {term:"Scheduling — Pre-Appointment Verification",def:"The required steps before booking any patient appointment: verify the patient's full name, date of birth, insurance information."}
  ]},
  {name:"Law & Ethics",color:"#4A90B8",terms:[
    {term:"HIPAA — Violations vs. Permitted Actions",def:"Violations: discussing patient details in public areas, hallways."},
    {term:"Informed Consent — Three Requirements",def:"Valid informed consent requires: (1) a legally and mentally competent patient — they must have decision-making capacity; (2) co..."},
    {term:"Advance Directives — Four Types",def:"Living will: the patient's written instructions about specific treatments they do or do not want if they become incapacitated."},
    {term:"Mandatory Reporting Obligations",def:"Legal requirements to report specific information to public health or law enforcement authorities without patient consent: susp..."},
    {term:"Medical Ethics — Four Principles",def:"The four foundational bioethical principles: Non-maleficence — do no harm; every clinical action must be evaluated against its ..."},
    {term:"Scope of Practice — Final Principle",def:"The state-defined and employer-defined boundary of tasks a medical assistant is legally authorized and competent to perform."}
  ]},
  {name:"Infection Control",color:"#1A8A7D",terms:[
    {term:"Standard Precautions — Core Elements",def:"The baseline infection prevention protocol applied to every patient, every encounter."},
    {term:"Transmission-Based Precautions — Three Tiers",def:"Additional precautions added on top of standard precautions when a patient has a known or suspected infection: Contact precauti..."},
    {term:"Hand Hygiene — Five Moments",def:"The WHO-defined five moments when hand hygiene is required: (1) before patient contact; (2) before an aseptic or clean procedur..."},
    {term:"PPE Donning and Doffing — Full Sequence",def:"Donning order (putting on): gown → mask or N95 respirator → goggles or face shield → gloves."},
    {term:"Disinfection Levels — Applied Summary",def:"Three levels based on microorganisms destroyed: Low-level disinfection: kills most bacteria, some viruses."},
    {term:"Autoclave Sterilization — Key Parameters",def:"Steam sterilization under pressure at 250–270°F. Unwrapped items: minimum 20 minutes. Wrapped items: minimum 30 minutes."}
  ]},
  {name:"Med Terminology",color:"#E2B94C",terms:[
    {term:"High-Yield Prefixes — Final Review",def:"Brady- (slow): bradycardia, bradypnea. Tachy- (fast): tachycardia, tachypnea."},
    {term:"High-Yield Suffixes — Final Review",def:"-itis (inflammation): appendicitis, pericarditis, myocarditis (inflammation, NOT infarction)."},
    {term:"Cardiovascular Anatomy — High-Yield Facts",def:"Heart chambers: right atrium and right ventricle (receive and pump deoxygenated blood to lungs via pulmonary artery)."},
    {term:"Gastrointestinal Anatomy — High-Yield Facts",def:"The GI tract in sequence: mouth → esophagus → stomach → small intestine (duodenum, jejunum, ileum) → large intestine (cecum."},
    {term:"Myocardial Infarction vs. Myocarditis",def:"Two frequently confused, clinically distinct conditions."},
    {term:"Respiratory Anatomy — High-Yield Facts",def:"Upper respiratory tract: nose, pharynx, larynx, trachea. Lower respiratory tract: bronchi, bronchioles, alveoli."}
  ]},
  {name:"Career Readiness",color:"#4CAF90",terms:[
    {term:"CCMA as a Professional Credential",def:"The Certified Clinical Medical Assistant designation communicates to every employer in the healthcare field that the holder has..."},
    {term:"Professional Identity as a Medical Assistant",def:"The internalized sense of role, values, and standards that defines how a medical assistant approaches every patient encounter."},
    {term:"Clinical Habits as Lasting Professional Assets",def:"The consistent, automatic professional behaviors that define a medical assistant's daily practice — built through deliberate tr..."},
    {term:"Interprofessional Collaboration",def:"The practice of working cooperatively and respectfully with healthcare professionals from different disciplines — physicians."},
    {term:"Long-Term Professional Development",def:"The ongoing commitment to learning, skill expansion."},
    {term:"Growth Mindset in Clinical Practice",def:"The belief that clinical skill, professional judgment, and patient care quality can be continuously developed through effort."},
    {term:"From Student to Clinician — The Transition",def:"The professional and psychological shift that occurs when a person completes a training program and moves from learning clinica..."}
  ]}
];
const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
