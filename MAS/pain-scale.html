<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pain Scale Activity</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #f0f4f8;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 1.5rem;
    letter-spacing: 2px;
    color: #333;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  p.subtitle {
    color: #666;
    margin-bottom: 24px;
    font-size: 0.95rem;
  }
  #canvas-wrap {
    position: relative;
    background: white;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.12);
    padding: 30px 20px 20px;
    width: 100%;
    max-width: 720px;
  }
  canvas { display: block; width: 100%; cursor: pointer; }

  #feedback {
    margin-top: 20px;
    width: 100%;
    max-width: 720px;
    border-radius: 16px;
    padding: 20px 28px;
    font-size: 1rem;
    display: none;
    animation: fadeIn 0.3s ease;
    transition: background 0.3s;
  }
  #feedback.show { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  #feedback .score {
    font-size: 2.5rem;
    font-weight: 800;
    margin-bottom: 4px;
  }
  #feedback .label {
    font-size: 1.3rem;
    font-weight: 700;
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  #feedback .desc {
    font-size: 0.95rem;
    line-height: 1.6;
    opacity: 0.9;
  }
  #feedback .emoji-big {
    font-size: 3rem;
    float: right;
    margin-left: 16px;
  }

  #reset-btn {
    margin-top: 16px;
    padding: 10px 28px;
    border: none;
    border-radius: 30px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: #333;
    color: white;
    display: none;
    transition: background 0.2s;
  }
  #reset-btn:hover { background: #555; }
  #reset-btn.show { display: inline-block; }

  /* ================= GUIDED TOUR ================= */
  .tour-hidden{ display:none !important; }
  #tourHighlight{
    position:fixed; z-index:9998; border-radius:50%; pointer-events:none;
    box-shadow: 0 0 0 9999px rgba(20,20,30,0.55);
    border: 3px solid #333;
    transition: top .4s cubic-bezier(.4,0,.2,1), left .4s cubic-bezier(.4,0,.2,1),
                width .4s cubic-bezier(.4,0,.2,1), height .4s cubic-bezier(.4,0,.2,1);
  }
  #tourHighlight.tour-box{ border-radius:14px; }
  #tourTooltip{
    position:fixed; z-index:10001; background:#fff; border-radius:14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    width:290px; max-width:88vw; padding:20px 22px;
    font-family:'Segoe UI',sans-serif;
    border: 1px solid #e2e8f0;
    transition: top .35s ease, left .35s ease;
  }
  #tourTooltip .tour-step-count{
    font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
    color:#333; margin-bottom:6px;
  }
  #tourTooltip h3{ font-size:16px; font-weight:700; color:#222; margin:0 0 8px; }
  #tourTooltip p{ font-size:13px; line-height:1.55; color:#666; margin:0 0 16px; }
  #tourTooltip .tour-actions{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #tourTooltip .tour-right{ display:flex; align-items:center; gap:10px; }
  #tourTooltip button.tour-btn{
    background:#333; color:#fff; border:none; border-radius:20px;
    padding:9px 16px; font-weight:600; font-size:13px; cursor:pointer; font-family:inherit;
  }
  #tourTooltip button.tour-btn:hover{ background:#555; }
  #tourTooltip button.tour-btn-secondary{
    background:transparent; color:#999; border:none;
    font-size:12.5px; font-weight:600; cursor:pointer; padding:9px 2px; font-family:inherit;
  }
  #tourTooltip button.tour-btn-secondary:hover{ color:#222; text-decoration:underline; }
  #tourReplayBtn{
    position:fixed; bottom:20px; right:20px; z-index:9997;
    background:#333; color:#fff; border:none; border-radius:999px;
    padding:12px 20px; font-weight:600; font-size:13px; cursor:pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.35);
    display:flex; align-items:center; gap:8px; font-family:inherit;
  }
  #tourReplayBtn:hover{ background:#555; }
</style>
</head>
<body>

<div id="tourHighlight" class="tour-hidden"></div>
<div id="tourTooltip" class="tour-hidden">
  <div class="tour-step-count" id="tourStepCount"></div>
  <h3 id="tourTitle"></h3>
  <p id="tourText"></p>
  <div class="tour-actions">
    <button class="tour-btn-secondary" id="tourSkip">Skip tour</button>
    <div class="tour-right">
      <button class="tour-btn-secondary" id="tourBack">Back</button>
      <button class="tour-btn" id="tourNext">Next</button>
    </div>
  </div>
</div>
<button id="tourReplayBtn" class="tour-hidden">&#9654; Replay Tutorial</button>

<h1>Categorical Pain Scale</h1>
<p class="subtitle">Click on a face to record your pain level</p>

<div id="canvas-wrap">
  <canvas id="c" height="220"></canvas>
</div>

<div id="feedback"></div>
<button id="reset-btn" onclick="reset()">↩ Try Again</button>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

const FACES = [
  {
    label: 'No Pain',
    score: 0,
    color: '#3dbe6e',
    border: '#2fa05b',
    mouth: 'smile',
    tears: false,
    emoji: '😄',
    desc: 'You feel completely comfortable. No discomfort at all.',
    bg: '#d4f5e2', text: '#1a6e3c'
  },
  {
    label: 'Hurts a Little',
    score: 2,
    color: '#5cb85c',
    border: '#4a9a4a',
    mouth: 'slight-smile',
    tears: false,
    emoji: '🙂',
    desc: 'Minor discomfort that is barely noticeable and easy to ignore.',
    bg: '#dff0d8', text: '#2d6a2d'
  },
  {
    label: 'Hurts a Little More',
    score: 4,
    color: '#c8c800',
    border: '#a0a000',
    mouth: 'flat',
    tears: false,
    emoji: '😐',
    desc: 'Noticeable pain that is distracting but you can still do most activities.',
    bg: '#fefbd8', text: '#706a00'
  },
  {
    label: 'Hurts Even More',
    score: 6,
    color: '#f0a000',
    border: '#c88000',
    mouth: 'frown',
    tears: false,
    emoji: '😟',
    desc: 'Significant pain that makes it hard to concentrate. Daily tasks feel difficult.',
    bg: '#fde9c0', text: '#7a4d00'
  },
  {
    label: 'Hurts a Whole Lot',
    score: 8,
    color: '#e86020',
    border: '#c04810',
    mouth: 'frown',
    tears: false,
    emoji: '😣',
    desc: 'Very severe pain that interferes with all activities. Hard to function normally.',
    bg: '#fdd0b0', text: '#7a2800'
  },
  {
    label: 'Hurts Worst',
    score: 10,
    color: '#e84040',
    border: '#c02020',
    mouth: 'frown',
    tears: true,
    emoji: '😭',
    desc: 'The worst possible pain. Unbearable — you cannot do anything and need immediate help.',
    bg: '#fcc0c0', text: '#7a0000'
  }
];

let selected = null;
let hovered = null;
let positions = [];

function getLayout() {
  const W = canvas.offsetWidth || 680;
  canvas.width = W * window.devicePixelRatio;
  canvas.height = 220 * window.devicePixelRatio;
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  const w = W;
  const h = 220;
  const r = Math.min(w / 6 / 2 - 10, 62);
  const cy = h / 2 - 18;
  positions = FACES.map((f, i) => ({
    x: (w / 6) * i + w / 12,
    y: cy,
    r
  }));
  return { w, h, r, cy };
}

function drawFace(f, pos, state) {
  const { x, y, r } = pos;
  const scale = state === 'selected' ? 1.13 : state === 'hover' ? 1.07 : 1;
  const sr = r * scale;

  ctx.save();

  if (state !== 'normal') {
    ctx.shadowColor = 'rgba(0,0,0,0.25)';
    ctx.shadowBlur = 14;
  }

  ctx.beginPath();
  ctx.arc(x, y, sr, 0, Math.PI * 2);
  ctx.fillStyle = f.color;
  ctx.fill();
  ctx.lineWidth = state === 'selected' ? 4 : 2.5;
  ctx.strokeStyle = state === 'selected' ? '#222' : f.border;
  ctx.stroke();
  ctx.shadowBlur = 0;

  const eyeOff = sr * 0.28;
  const eyeY = y - sr * 0.15;
  const eyeR = sr * 0.09;
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(x - eyeOff, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + eyeOff, eyeY, eyeR, 0, Math.PI * 2); ctx.fill();

  ctx.strokeStyle = '#333';
  ctx.lineWidth = sr * 0.07;
  ctx.lineCap = 'round';
  const my = y + sr * 0.18;
  const mw = sr * 0.45;

  if (f.mouth === 'smile') {
    ctx.beginPath();
    ctx.arc(x, my - sr*0.05, mw, 0.15 * Math.PI, 0.85 * Math.PI);
    ctx.stroke();
  } else if (f.mouth === 'slight-smile') {
    ctx.beginPath();
    ctx.arc(x, my, mw * 0.9, 0.1 * Math.PI, 0.9 * Math.PI);
    ctx.stroke();
  } else if (f.mouth === 'flat') {
    ctx.beginPath();
    ctx.moveTo(x - mw, my + sr * 0.12);
    ctx.lineTo(x + mw, my + sr * 0.12);
    ctx.stroke();
  } else if (f.mouth === 'frown') {
    ctx.beginPath();
    ctx.arc(x, my + sr * 0.38, mw, 1.15 * Math.PI, 1.85 * Math.PI);
    ctx.stroke();
  }

  if (f.tears) {
    ctx.fillStyle = '#60a8e0';
    [[x - eyeOff, eyeY + eyeR], [x + eyeOff, eyeY + eyeR]].forEach(([tx, ty]) => {
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.bezierCurveTo(tx - sr*0.06, ty + sr*0.18, tx + sr*0.06, ty + sr*0.22, tx, ty + sr*0.32);
      ctx.closePath();
      ctx.fill();
    });
  }

  if (state === 'selected') {
    ctx.beginPath();
    ctx.arc(x, y, sr + 6, 0, Math.PI * 2);
    ctx.strokeStyle = '#222';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 3]);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.restore();
}

function drawLabel(f, pos, state) {
  const { x, r } = pos;
  const { h } = getSize();
  const labelY = h - 28;
  ctx.fillStyle = state === 'selected' ? '#111' : '#555';
  ctx.font = `${state === 'selected' ? 'bold' : '600'} ${Math.max(10, r * 0.26)}px Segoe UI, sans-serif`;
  ctx.textAlign = 'center';
  const words = f.label.split(' ');
  const line1 = words.slice(0, 2).join(' ');
  const line2 = words.slice(2).join(' ');
  ctx.fillText(line1, x, labelY - 12);
  if (line2) ctx.fillText(line2, x, labelY + 2);
}

let _size = {};
function getSize() { return _size; }

function draw() {
  const { w, h } = getLayout();
  _size = { w, h };
  ctx.clearRect(0, 0, w, h);
  FACES.forEach((f, i) => {
    const state = selected === i ? 'selected' : hovered === i ? 'hover' : 'normal';
    drawFace(f, positions[i], state);
    drawLabel(f, positions[i], state);
  });
}

function hitTest(mx, my) {
  for (let i = 0; i < positions.length; i++) {
    const { x, y, r } = positions[i];
    const dx = mx - x, dy = my - y;
    if (dx*dx + dy*dy <= (r * 1.15) * (r * 1.15)) return i;
  }
  return -1;
}

function getMousePos(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.offsetWidth / rect.width;
  return {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleX
  };
}

canvas.addEventListener('mousemove', e => {
  const { x, y } = getMousePos(e);
  const idx = hitTest(x, y);
  if (idx !== hovered) { hovered = idx; canvas.style.cursor = idx >= 0 ? 'pointer' : 'default'; draw(); }
});
canvas.addEventListener('mouseleave', () => { hovered = null; draw(); });

canvas.addEventListener('click', e => {
  const { x, y } = getMousePos(e);
  const idx = hitTest(x, y);
  if (idx < 0) return;
  selected = idx;
  draw();
  showFeedback(idx);
});

canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.offsetWidth / rect.width;
  const x = (t.clientX - rect.left) * scaleX;
  const y = (t.clientY - rect.top) * scaleX;
  const idx = hitTest(x, y);
  if (idx < 0) return;
  selected = idx;
  draw();
  showFeedback(idx);
}, { passive: false });

function showFeedback(idx) {
  const f = FACES[idx];
  const fb = document.getElementById('feedback');
  fb.style.background = f.bg;
  fb.style.color = f.text;
  fb.style.border = `2px solid ${f.border}`;
  fb.innerHTML = `
    <span class="emoji-big">${f.emoji}</span>
    <div class="score">Score: ${f.score}/10</div>
    <div class="label">${f.label}</div>
    <div class="desc">${f.desc}</div>
  `;
  fb.className = 'show';
  document.getElementById('reset-btn').className = 'show';
  fb.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function reset() {
  selected = null;
  hovered = null;
  draw();
  const fb = document.getElementById('feedback');
  fb.className = '';
  document.getElementById('reset-btn').className = '';
}

window.addEventListener('resize', draw);
draw();
</script>

<script>
(function(){
  const highlightBox = document.getElementById('tourHighlight');
  const tooltip = document.getElementById('tourTooltip');
  const stepCountEl = document.getElementById('tourStepCount');
  const titleEl = document.getElementById('tourTitle');
  const textEl = document.getElementById('tourText');
  const nextBtn = document.getElementById('tourNext');
  const backBtn = document.getElementById('tourBack');
  const skipBtn = document.getElementById('tourSkip');
  const replayBtn = document.getElementById('tourReplayBtn');

  function q(sel){ return document.querySelector(sel); }

  function faceRect(idx){
    const pos = positions[idx];
    if(!pos) return null;
    const rect = canvas.getBoundingClientRect();
    const scaleX = rect.width / (_size.w || rect.width);
    const scaleY = rect.height / (_size.h || rect.height);
    const cx = rect.left + pos.x * scaleX;
    const cy = rect.top + pos.y * scaleY;
    const pr = pos.r * scaleX;
    return { left: cx - pr, top: cy - pr, width: pr * 2, height: pr * 2 };
  }

  function demoSelect(){
    selected = 5;
    draw();
    showFeedback(5);
  }

  function resetToDefault(){
    reset();
  }

  const steps = [
    {
      selector: 'h1',
      placement: 'bottom',
      title: 'Welcome to the Pain Scale',
      text: "Click the face that best matches your pain level, from No Pain to Hurts Worst. Click Next to see how it works."
    },
    {
      selector: '#canvas-wrap',
      placement: 'bottom',
      title: 'Read the scale',
      text: 'The six faces run left to right from least to most severe, each with a score from 0 to 10.'
    },
    {
      getRect: () => faceRect(5),
      boxShape: 'circle',
      placement: 'bottom',
      title: 'Tap a face to select it',
      text: 'Click any face to select it \u2014 it gets a bold outline and a dashed ring, like this one.',
      before: () => demoSelect(),
      delay: 300
    },
    {
      selector: '#feedback',
      placement: 'bottom',
      title: 'See your result',
      text: 'The panel below shows the score, the label, and a short description of what that level of pain feels like.'
    },
    {
      selector: '#reset-btn',
      placement: 'top',
      title: 'Try again',
      text: 'Use this button anytime to clear your selection and choose again.'
    }
  ];

  let current = -1;

  function showStep(i){
    if(i < 0) i = 0;
    if(i >= steps.length){ endTour(); return; }
    current = i;
    const step = steps[i];
    const wait = step.delay !== undefined ? step.delay : (step.before ? 300 : 60);
    if(step.before) step.before();
    setTimeout(() => renderStep(step, i), wait);
  }

  function renderStep(step, i){
    let rect = null;
    if(step.getRect){
      rect = step.getRect();
      highlightBox.classList.toggle('tour-box', step.boxShape === 'box');
    } else if(step.selector){
      const target = q(step.selector);
      if(target) rect = target.getBoundingClientRect();
      highlightBox.classList.add('tour-box');
    }

    tooltip.classList.remove('tour-hidden');
    stepCountEl.textContent = `Step ${i + 1} of ${steps.length}`;
    titleEl.textContent = step.title;
    textEl.textContent = step.text;
    backBtn.style.visibility = i === 0 ? 'hidden' : 'visible';
    nextBtn.textContent = i === steps.length - 1 ? 'Finish' : 'Next';

    if(rect){
      highlightBox.classList.remove('tour-hidden');
      const pad = 8;
      highlightBox.style.top = (rect.top - pad) + 'px';
      highlightBox.style.left = (rect.left - pad) + 'px';
      highlightBox.style.width = (rect.width + pad * 2) + 'px';
      highlightBox.style.height = (rect.height + pad * 2) + 'px';
      positionTooltip(rect, step.placement);
    } else {
      highlightBox.classList.add('tour-hidden');
      const ttRect = tooltip.getBoundingClientRect();
      tooltip.style.top = (window.innerHeight / 2 - ttRect.height / 2) + 'px';
      tooltip.style.left = (window.innerWidth / 2 - ttRect.width / 2) + 'px';
    }
  }

  function positionTooltip(rect, placement){
    const ttRect = tooltip.getBoundingClientRect();
    const margin = 16;
    let top, left;

    if(placement === 'bottom'){
      top = rect.bottom + margin;
      left = rect.left;
    } else {
      top = rect.top - ttRect.height - margin;
      left = rect.left;
    }

    if(top < margin){ top = rect.bottom + margin; }
    if(top + ttRect.height > window.innerHeight - margin){ top = rect.top - ttRect.height - margin; }

    left = Math.min(Math.max(margin, left), window.innerWidth - ttRect.width - margin);
    top = Math.min(Math.max(margin, top), window.innerHeight - ttRect.height - margin);

    tooltip.style.top = top + 'px';
    tooltip.style.left = left + 'px';
  }

  function startTour(){
    replayBtn.classList.add('tour-hidden');
    resetToDefault();
    setTimeout(() => showStep(0), 200);
  }

  function endTour(){
    tooltip.classList.add('tour-hidden');
    highlightBox.classList.add('tour-hidden');
    resetToDefault();
    replayBtn.classList.remove('tour-hidden');
  }

  nextBtn.addEventListener('click', () => showStep(current + 1));
  backBtn.addEventListener('click', () => showStep(current - 1));
  skipBtn.addEventListener('click', endTour);
  replayBtn.addEventListener('click', startTour);

  document.addEventListener('keydown', (e) => {
    if(tooltip.classList.contains('tour-hidden')) return;
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){
      e.preventDefault();
      showStep(current + 1);
    } else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
      e.preventDefault();
      showStep(current - 1);
    }
  });

  window.addEventListener('resize', () => {
    if(current >= 0 && current < steps.length) renderStep(steps[current], current);
  });

  window.addEventListener('load', () => setTimeout(startTour, 500));
})();
</script>

</body>
</html>
