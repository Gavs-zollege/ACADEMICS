<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>General Patient Care Foundations</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0c12;--s1:#10131c;--s2:#161a26;--s3:#1e2333;--s4:#272d40;
  --ac:#ff7a55;--ac2:#4d9ef7;
  --tx:#e4e8f0;--txd:#8890a6;--txf:#4a5270;
  --spa:#ff7a55;--spb:#4d9ef7;
  --glow-a:rgba(255,122,85,.25);--glow-b:rgba(77,158,247,.2);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ===== LANDING ===== */
#landing{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;cursor:pointer;position:relative}
#landing::before{content:'';position:absolute;width:600px;height:600px;top:25%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,122,85,.05),transparent 70%);pointer-events:none}
.cover-art{width:200px;height:200px;border-radius:24px;background:linear-gradient(145deg,#1a1228 0%,#1e1432 30%,#261a3a 60%,#1a1228 100%);margin:0 auto 28px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04)}
.cover-art::before{content:'🏥';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;filter:grayscale(.2)}
.cover-art::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,122,85,.08),rgba(77,158,247,.08));pointer-events:none}
#landing h1{font-family:'DM Serif Display',serif;font-size:clamp(1.3rem,4.5vw,1.9rem);color:var(--tx);line-height:1.25;letter-spacing:-.01em;margin-bottom:6px}
#landing .sub{color:var(--txd);font-size:.82rem;margin-bottom:28px;line-height:1.5;max-width:340px;font-weight:400}
.play-cta{display:inline-flex;align-items:center;gap:10px;background:var(--ac);color:#fff;padding:14px 34px;border-radius:60px;font-size:.95rem;font-weight:600;transition:all .25s;box-shadow:0 6px 24px var(--glow-a)}
.play-cta:hover{transform:translateY(-2px);box-shadow:0 10px 36px var(--glow-a)}
.play-cta svg{width:18px;height:18px;fill:#fff}
#landing .hint{color:var(--txf);font-size:.68rem;margin-top:14px;letter-spacing:.03em}

/* ===== PLAYER ===== */
#player{display:none;height:100%;flex-direction:column;max-width:480px;margin:0 auto;padding:0 20px;position:relative}
#player.show{display:flex}

/* ===== COVER + WAVEFORM AREA ===== */
.art-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0}
.art-area .cover-art{width:clamp(180px,55vw,260px);height:clamp(180px,55vw,260px);border-radius:20px;flex-shrink:0;position:relative;z-index:1}
#waveCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.6}

/* Transcript overlay on top of art area */
.transcript-wrap{position:absolute;inset:0;z-index:2;background:rgba(10,12,18,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:opacity .35s;display:flex;flex-direction:column;overflow:hidden}
.transcript-wrap.hidden{opacity:0;pointer-events:none}

.transcript-scroll{flex:1;overflow-y:auto;padding:20px 16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 92%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 92%,transparent 100%)}
.transcript-scroll::-webkit-scrollbar{width:3px}
.transcript-scroll::-webkit-scrollbar-track{background:transparent}
.transcript-scroll::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}

.t-line{
  padding:8px 12px;
  border-radius:10px;
  margin-bottom:4px;
  cursor:pointer;
  transition:background .25s, opacity .25s;
  display:flex;
  gap:10px;
  align-items:flex-start;
  opacity:.35;
}
.t-line:hover{background:rgba(255,255,255,.03);opacity:.6}
.t-line.active{opacity:1;background:rgba(255,255,255,.04)}
.t-line.past{opacity:.45}

.t-time{
  font-size:.65rem;
  color:var(--txf);
  font-variant-numeric:tabular-nums;
  font-weight:500;
  min-width:36px;
  padding-top:3px;
  flex-shrink:0;
}
.t-line.active .t-time{color:var(--txd)}

.t-speaker{
  width:3px;
  border-radius:2px;
  min-height:18px;
  align-self:stretch;
  flex-shrink:0;
  opacity:.5;
  transition:opacity .25s;
}
.t-line.active .t-speaker{opacity:1}
.t-speaker.s0{background:var(--spa)}
.t-speaker.s1{background:var(--spb)}

.t-text{
  font-family:'DM Sans',sans-serif;
  font-size:.82rem;
  line-height:1.55;
  color:var(--txf);
  transition:color .25s;
}
.t-line.active .t-text{color:var(--tx)}
.t-line.past .t-text{color:var(--txd)}

/* ===== INFO BELOW ART ===== */
.track-info{text-align:center;padding:20px 0 0;flex-shrink:0}
.track-info h2{font-family:'DM Serif Display',serif;font-size:clamp(1.05rem,3.5vw,1.35rem);color:var(--tx);font-weight:400;line-height:1.3;margin-bottom:4px}
.track-info .chapter{font-size:.78rem;color:var(--ac);font-weight:500;letter-spacing:.02em;transition:all .3s}
.track-info .meta{font-size:.68rem;color:var(--txf);margin-top:4px}

/* ===== PROGRESS ===== */
.prog{flex-shrink:0;padding:16px 0 4px}
.bar{position:relative;height:4px;background:var(--s2);border-radius:2px;overflow:visible;cursor:pointer}
.bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--ac);border-radius:2px;pointer-events:none;transition:width .1s linear}
.bar-head{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;pointer-events:none;transition:left .1s linear,opacity .2s;transform:translate(-50%,-50%);box-shadow:0 0 10px var(--glow-a);opacity:0}
.bar:hover .bar-head{opacity:1}
.trow{display:flex;justify-content:space-between;font-size:.68rem;color:var(--txf);font-variant-numeric:tabular-nums;font-weight:500;margin-top:6px}

/* ===== CONTROLS ===== */
.ctrl{display:flex;align-items:center;justify-content:center;gap:20px;padding:8px 0;flex-shrink:0}
.cb{background:none;border:none;color:var(--txd);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;width:44px;height:44px}
.cb:hover{color:var(--tx);transform:scale(1.08)}
.cb svg{width:22px;height:22px;fill:currentColor}
.cb-play{width:60px;height:60px;background:var(--ac);color:#fff;box-shadow:0 4px 20px var(--glow-a)}
.cb-play:hover{transform:scale(1.06)}
.cb-play svg{width:26px;height:26px;fill:currentColor}
.sp{font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:18px;background:var(--s2);color:var(--txd);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;min-width:40px}
.sp:hover{background:var(--s3);color:var(--tx)}

/* ===== BOTTOM BAR ===== */
.bottom-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:4px 0 12px;flex-shrink:0}
.bottom-btn{
  display:flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:20px;
  background:var(--s1);border:1px solid var(--s3);
  color:var(--txd);font-size:.72rem;font-weight:500;
  cursor:pointer;transition:all .25s;
  font-family:'DM Sans',sans-serif;
}
.bottom-btn:hover{border-color:var(--s4);color:var(--tx)}
.bottom-btn.on{border-color:var(--ac);color:var(--ac)}
.bottom-btn svg{width:14px;height:14px;fill:currentColor}

.leg{display:flex;justify-content:center;gap:14px}
.leg span{display:flex;align-items:center;gap:4px;font-size:.64rem;color:var(--txf);font-weight:400}
.ldot{width:5px;height:5px;border-radius:50%;display:inline-block}

@media(max-width:600px){
  #player{padding:0 16px}
  .art-area .cover-art{width:clamp(160px,50vw,220px);height:clamp(160px,50vw,220px)}
  .cb-play{width:54px;height:54px}
  .cb-play svg{width:22px;height:22px}
  .ctrl{gap:16px}
}
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing" onclick="startPlayer()">
  <div class="cover-art"></div>
  <h1>General Patient<br>Care Foundations</h1>
  <div class="sub">Patient positioning, injection techniques, dignity protocols, body mechanics, and the precision behind every clinical interaction.</div>
  <div class="play-cta">
    <svg viewBox="0 0 24 24"><polygon points="8,5 20,12 8,19"/></svg>
    Play Episode
  </div>
  <div class="hint">22 min · Embedded audio</div>
</div>

<!-- PLAYER -->
<div id="player">

  <!-- ART + WAVEFORM + KARAOKE -->
  <div class="art-area" id="artArea">
    <canvas id="waveCanvas"></canvas>
    <div class="cover-art" id="coverArt"></div>
    <!-- TRANSCRIPT OVERLAY -->
    <div class="transcript-wrap hidden" id="transcriptWrap">
      <div class="transcript-scroll" id="transcriptScroll"></div>
    </div>
  </div>

  <!-- TRACK INFO -->
  <div class="track-info">
    <h2>General Patient Care Foundations</h2>
    <div class="chapter" id="chapLabel">Introduction — The Exam Room</div>

  <!-- PROGRESS -->
  <div class="prog">

      <div class="bar-fill" id="barFill"></div>
      <div class="bar-head" id="barHead"></div>
    </div>
    <div class="trow"><span id="tCur">0:00</span><span id="tTot">0:00</span></div>
  </div>

  <!-- CONTROLS -->
  <div class="ctrl">
    <button class="sp" id="spBtn" onclick="cycleSpd()">1×</button>
    <button class="cb" onclick="skip(-15)" title="Back 15s">
      <svg viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="10" y="16.5" font-size="7.5" font-weight="700" fill="currentColor" font-family="sans-serif" text-anchor="middle">15</text></svg>
    </button>
    <button class="cb cb-play" id="playBtn" onclick="togglePlay()">
      <svg viewBox="0 0 24 24" id="pIco"><polygon points="8,5 20,12 8,19"/></svg>
    </button>
    <button class="cb" onclick="skip(15)" title="Forward 15s">
      <svg viewBox="0 0 24 24"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="14" y="16.5" font-size="7.5" font-weight="700" fill="currentColor" font-family="sans-serif" text-anchor="middle">15</text></svg>
    </button>
    <button class="sp" style="visibility:hidden">1×</button>
  </div>

  <!-- BOTTOM -->
  <div class="bottom-bar">
    <button class="bottom-btn" id="modeText" onclick="toggleTranscribe()">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      Transcript
    </button>
    <div class="leg">
      <span><span class="ldot" style="background:var(--spa)"></span> Host A</span>
      <span><span class="ldot" style="background:var(--spb)"></span> Host B</span>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const SEG=[{"s":0.00,"e":6.72,"t":"Have you ever sat on that incredibly crinkly table paper in a clinic just waiting for the provider","sp":1},
{"s":6.72,"e":11.84,"t":"and wondered what is actually happening behind the scenes? The crinkly paper. We all know that exact sound.","sp":1},
{"s":11.84,"e":16.72,"t":"Right. You're sitting there in a gown that you know never quite close as all the way the heck.","sp":0},
{"s":16.72,"e":21.28,"t":"Never. But the thing is, while you feel like you're just sort of passively waiting,","sp":1},
{"s":21.28,"e":26.08,"t":"there's this massive, highly calculated choreography happening all around you.","sp":0},
{"s":26.48,"e":29.52,"t":"Welcome to our Deep Dive.","sp":0},
{"s":29.52,"e":35.12,"t":"Today, we're looking at a really fascinating set of presentation slides from week nine of a medical","sp":0},
{"s":35.12,"e":39.44,"t":"assistant program. Yeah, specifically focusing on general patient care foundation.","sp":1},
{"s":39.44,"e":45.84,"t":"Exactly. And our mission today is basically to decode this invisible blueprint of a medical visit.","sp":0},
{"s":45.84,"e":50.56,"t":"Because, I mean, from the psychology of how they prep you to the literal geometry of how they","sp":0},
{"s":50.56,"e":55.68,"t":"give you an injection, there is so much deliberate engineering design just to keep you safe.","sp":1},
{"s":55.68,"e":60.88,"t":"It's honestly a phenomenal amount of hidden architecture. When you look at these clinical","sp":1},
{"s":60.88,"e":66.40,"t":"protocols for medical assistance, it's this meticulous system of like physical physics,","sp":0},
{"s":66.40,"e":73.28,"t":"human psychology, and digital safeguards. Every single interaction is governed by a framework","sp":0},
{"s":73.28,"e":78.88,"t":"designed to minimize risk. I kept thinking of it like a theater production. The clinic schedule is","sp":1},
{"s":78.88,"e":83.36,"t":"essentially ascript, right? And the medical assistant is the stage manager. That is a perfect","sp":1},
{"s":84.32,"e":87.92,"t":"analogy, actually. Because they review that schedule every single morning. And they aren't just","sp":1},
{"s":87.92,"e":92.80,"t":"looking at who's coming in. They're looking at the chief complaints. So they can predict exactly","sp":1},
{"s":92.80,"e":97.60,"t":"what physical props are needed before the patient even walks through the door. Right. And it's not just","sp":1},
{"s":97.60,"e":103.12,"t":"grabbing the props. The diagnostic equipment doesn't just need to be in the room. It has to be calibrated.","sp":0},
{"s":103.12,"e":107.84,"t":"Oh, like the blood pressure cuff. Exactly. A sphig momentometer, the blood pressure cuff.","sp":0},
{"s":107.84,"e":112.88,"t":"If it's improperly calibrated, you could literally end up with a false hypertension diagnosis.","sp":0},
{"s":113.04,"e":119.28,"t":"They are setting out specific drapes, specific syringees, resetting biohazard containers.","sp":1},
{"s":119.28,"e":125.28,"t":"Because if the stage manager fails to set the scene, the provider basically walks into chaos.","sp":1},
{"s":125.28,"e":130.72,"t":"Absolutely. But you know, setting the physical stage is only half the battle. These protocols","sp":1},
{"s":130.72,"e":135.60,"t":"place this enormous emphasis on psychological preparation, too. Which makes sense because I imagine","sp":0},
{"s":135.60,"e":141.04,"t":"the clinical mechanics of an exam are kind of useless if the patient is like absolutely panicking.","sp":1},
{"s":141.04,"e":146.64,"t":"Exactly. Anxiety actually alters vital science in inhibits communication. So the interaction","sp":0},
{"s":146.64,"e":151.84,"t":"has to begin with building an immediate baseline of trust. Which seems basic, but the source","sp":0},
{"s":151.84,"e":156.96,"t":"details exactly how to do it. Knocking before entering, getting consent to proceed,","sp":1},
{"s":156.96,"e":162.08,"t":"and checking to distinct identifiers like full name and data birth. Right. To completely eliminate","sp":1},
{"s":162.08,"e":167.20,"t":"identity errors, and also stripping away the medical jargon. Yeah, the jargon is huge. And I noticed","sp":1},
{"s":167.20,"e":171.92,"t":"the guidelines dive really deep into how this psychological approach completely alters depending","sp":1},
{"s":171.92,"e":177.04,"t":"on who the patient is. Like with older adults, the protocol mandates slowing down the pace.","sp":1},
{"s":177.04,"e":181.68,"t":"Which is crucial for things like medication reviews, just allowing that extra processing time.","sp":0},
{"s":181.68,"e":188.16,"t":"But there was this one strict rule that stood out to me. The absolute prohibition on terms like","sp":0},
{"s":188.16,"e":193.28,"t":"sweetie or honey, even if the medical assistant is just trying to be compassionate.","sp":1},
{"s":193.28,"e":198.56,"t":"Yeah, because terms of endearment in a clinical setting almost always cross the line into","sp":0},
{"s":198.56,"e":203.12,"t":"evangelization. Think about it. When a patient is sitting on that exam table,","sp":0},
{"s":204.08,"e":208.00,"t":"they're already stripped of their normal clothing. Right. They're already vulnerable.","sp":0},
{"s":208.00,"e":212.48,"t":"They've lost a lot of their environmental control. Yeah. So using a term like sweetie,","sp":0},
{"s":212.48,"e":217.20,"t":"subtly chips away at their remaining dignity. Wow. Yeah. I didn't think of it that way. The protocol","sp":0},
{"s":217.20,"e":224.56,"t":"is clear. Use proper names and maintain a professional calm tone. It reinforces their autonomy","sp":0},
{"s":224.56,"e":228.72,"t":"and keeps that power dynamic balanced. But then the strategy flips entirely when you have a","sp":0},
{"s":228.72,"e":233.28,"t":"pediatric patient. Oh, completely. The protocol mandates dropping down to their physical","sp":1},
{"s":233.28,"e":237.04,"t":"eye level. You use roleplay. Right. Like maybe having them point to where it hurts on a","sp":0},
{"s":237.04,"e":241.52,"t":"stuffed animal instead of on themselves. Right. But there's a really interesting tension there","sp":0},
{"s":241.52,"e":247.04,"t":"because while you are playing with them, the guidelines strongly advise against using","sp":0},
{"s":247.04,"e":251.68,"t":"baby talk with older children because kids totally know when you're talking down to them.","sp":0},
{"s":251.68,"e":256.72,"t":"They are hyper aware of it. Yeah. Baby talk instantly registers as condescension to them","sp":0},
{"s":256.72,"e":261.60,"t":"and that destroys whatever trust you just build with the stuffed animal. Makes total sense. And","sp":0},
{"s":261.60,"e":266.48,"t":"then alongside that psychological stuff, there's the physical reality of pediatrics. Like the","sp":1},
{"s":266.48,"e":272.72,"t":"absolute cardinal rule never ever leave a child unattended on an exam table or a scale. Never.","sp":0},
{"s":273.20,"e":278.72,"t":"The center of gravity for a toddler is entirely different from an adult. They're extreme fall","sp":1},
{"s":278.72,"e":283.60,"t":"risks in an unfamiliar environment. Which actually brings me to a protocol regarding patients with","sp":1},
{"s":283.60,"e":288.00,"t":"physical disabilities and this one felt completely counterintuitive to me. Oh, the wheelchair","sp":1},
{"s":288.00,"e":294.24,"t":"transfer protocol. Yes. Because my instinct and I think like just human instinct in general is","sp":1},
{"s":294.24,"e":299.12,"t":"to immediately rush in and physically help someone who is struggling to maneuver a wheelchair into","sp":1},
{"s":299.12,"e":304.24,"t":"an exam space. Sure. We want to be helpful. Right. But the clinical directive is to observe,","sp":1},
{"s":304.24,"e":312.16,"t":"ask before touching the patient or their mobility device and just allow them maximum independence. Yes. But why hold back? It feels almost, I don't know, borderline","sp":0},
{"s":312.16,"e":316.88,"t":"rude to just stand there and watch someone work harder than they need to. Right. I get that.","sp":1},
{"s":316.88,"e":322.00,"t":"But it really comes down to liability and mechanical safety. A wheelchair is essentially an","sp":1},
{"s":322.00,"e":328.72,"t":"extension of that patient's personal space and more importantly, it's their primary center of balance.","sp":0},
{"s":329.60,"e":334.48,"t":"If you just grab the handles of a chair without warning them, you alter their center of gravity","sp":0},
{"s":334.48,"e":338.88,"t":"immediately. You're actually risking a fall. Oh, wow. Because they're compensating for a balance","sp":0},
{"s":338.88,"e":343.28,"t":"point that you just suddenly shifted. Exactly. And furthermore, transferring from a wheelchair to","sp":0},
{"s":343.28,"e":350.16,"t":"an exam table isn't just a simple lift. It is a highly calculated mechanical process. The wheels","sp":1},
{"s":350.16,"e":355.12,"t":"must be locked. The angle of the chair relative to the table has to be completely precise. Right.","sp":0},
{"s":355.12,"e":360.48,"t":"And it often requires a two person pivot technique. Right. So intervening blindly just out of","sp":0},
{"s":360.48,"e":365.28,"t":"politeness is actually dangerous for both the patient and the assistant. That is so fascinating.","sp":0},
{"s":365.28,"e":370.80,"t":"It's like being a medical diplomat. So, okay, once that psychological and physical baseline is","sp":1},
{"s":370.80,"e":376.64,"t":"established, the actual exam begins. And looking at these protocols, it's like gravity is being","sp":1},
{"s":376.64,"e":381.84,"t":"wielded as a medical instrument. That's a great way to put it. The geometry of patient positioning","sp":1},
{"s":381.92,"e":387.76,"t":"is incredibly precise. Because we all know the basic anatomical positions. You know,","sp":1},
{"s":387.76,"e":393.20,"t":"supine for lying flat on your back, prone for face down. But the draping requirements tied","sp":0},
{"s":393.20,"e":398.08,"t":"to these positions really show this constant balancing act. The balance between getting the right","sp":0},
{"s":398.08,"e":403.20,"t":"clinical angle for the provider and maintaining the patient's modesty. Right. Like in the","sp":0},
{"s":403.20,"e":408.16,"t":"lethottomy position, which is used for pelvic exams with the stirrups, the drape has to extend","sp":0},
{"s":408.16,"e":412.64,"t":"all the way from under the arms down to the ankles. And in a prone position, it covers from","sp":1},
{"s":412.64,"e":417.44,"t":"the upper back down over the feet. The assistant is constantly managing that visual field,","sp":1},
{"s":417.44,"e":422.16,"t":"so the physician has access. But the patient feels minimally exposed. Let's talk about the","sp":0},
{"s":422.16,"e":426.48,"t":"fowlers positions, though, because this is where the physics really, really fascinated me.","sp":1},
{"s":427.04,"e":433.52,"t":"You have fowlers position, which is this sharp 90 degree upright sitting angle. Right. And then","sp":1},
{"s":433.60,"e":439.36,"t":"semi-fowlers, which is a 45 degree angle. Now if I compare this to like an adjustable smart bed,","sp":1},
{"s":439.36,"e":446.48,"t":"I completely understand why sitting up feels better when you have a terrible test called. Sure, we'll do that. But from a strict clinical standpoint,","sp":0},
{"s":447.36,"e":452.96,"t":"why does the literal angle like the difference between a 45 degrees and 90 degrees","sp":1},
{"s":452.96,"e":458.00,"t":"matter so much to the provider for a patient's breathing? It's all about how it changes the","sp":1},
