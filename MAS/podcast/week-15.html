<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CCMA Exam Readiness & Review</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0a0c12;--s1:#10131c;--s2:#161a26;--s3:#1e2333;--s4:#272d40;
  --ac:#ff7a55;--ac2:#4d9ef7;
  --tx:#e4e8f0;--txd:#8890a6;--txf:#4a5270;
  --spa:#ff7a55;--spb:#4d9ef7;
  --glow-a:rgba(255,122,85,.25);--glow-b:rgba(77,158,247,.2);
}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

/* ===== LANDING ===== */
#landing{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;cursor:pointer;position:relative}
#landing::before{content:'';position:absolute;width:600px;height:600px;top:25%;left:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(255,122,85,.05),transparent 70%);pointer-events:none}
.cover-art{width:200px;height:200px;border-radius:24px;background:linear-gradient(145deg,#1a1228 0%,#1e1432 30%,#261a3a 60%,#1a1228 100%);margin:0 auto 28px;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.04)}
.cover-art::before{content:'🎓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:72px;filter:grayscale(.2)}
.cover-art::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,122,85,.08),rgba(77,158,247,.08));pointer-events:none}
#landing h1{font-family:'DM Serif Display',serif;font-size:clamp(1.3rem,4.5vw,1.9rem);color:var(--tx);line-height:1.25;letter-spacing:-.01em;margin-bottom:6px}
#landing .sub{color:var(--txd);font-size:.82rem;margin-bottom:28px;line-height:1.5;max-width:340px;font-weight:400}
.play-cta{display:inline-flex;align-items:center;gap:10px;background:var(--ac);color:#fff;padding:14px 34px;border-radius:60px;font-size:.95rem;font-weight:600;transition:all .25s;box-shadow:0 6px 24px var(--glow-a)}
.play-cta:hover{transform:translateY(-2px);box-shadow:0 10px 36px var(--glow-a)}
.play-cta svg{width:18px;height:18px;fill:#fff}
#landing .hint{color:var(--txf);font-size:.68rem;margin-top:14px;letter-spacing:.03em}

/* ===== PLAYER ===== */
#player{display:none;height:100%;flex-direction:column;max-width:480px;margin:0 auto;padding:0 20px;position:relative}
#player.show{display:flex}

/* ===== COVER + WAVEFORM AREA ===== */
.art-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;min-height:0}
.art-area .cover-art{width:clamp(180px,55vw,260px);height:clamp(180px,55vw,260px);border-radius:20px;flex-shrink:0;position:relative;z-index:1}
#waveCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:0;opacity:.6}

/* Transcript overlay on top of art area */
.transcript-wrap{position:absolute;inset:0;z-index:2;background:rgba(10,12,18,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:opacity .35s;display:flex;flex-direction:column;overflow:hidden}
.transcript-wrap.hidden{opacity:0;pointer-events:none}

.transcript-scroll{flex:1;overflow-y:auto;padding:20px 16px;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 92%,transparent 100%);-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 8%,#000 92%,transparent 100%)}
.transcript-scroll::-webkit-scrollbar{width:3px}
.transcript-scroll::-webkit-scrollbar-track{background:transparent}
.transcript-scroll::-webkit-scrollbar-thumb{background:var(--s3);border-radius:3px}

.t-line{
  padding:8px 12px;
  border-radius:10px;
  margin-bottom:4px;
  cursor:pointer;
  transition:background .25s, opacity .25s;
  display:flex;
  gap:10px;
  align-items:flex-start;
  opacity:.35;
}
.t-line:hover{background:rgba(255,255,255,.03);opacity:.6}
.t-line.active{opacity:1;background:rgba(255,255,255,.04)}
.t-line.past{opacity:.45}

.t-time{
  font-size:.65rem;
  color:var(--txf);
  font-variant-numeric:tabular-nums;
  font-weight:500;
  min-width:36px;
  padding-top:3px;
  flex-shrink:0;
}
.t-line.active .t-time{color:var(--txd)}

.t-speaker{
  width:3px;
  border-radius:2px;
  min-height:18px;
  align-self:stretch;
  flex-shrink:0;
  opacity:.5;
  transition:opacity .25s;
}
.t-line.active .t-speaker{opacity:1}
.t-speaker.s0{background:var(--spa)}
.t-speaker.s1{background:var(--spb)}

.t-text{
  font-family:'DM Sans',sans-serif;
  font-size:.82rem;
  line-height:1.55;
  color:var(--txf);
  transition:color .25s;
}
.t-line.active .t-text{color:var(--tx)}
.t-line.past .t-text{color:var(--txd)}

/* ===== INFO BELOW ART ===== */
.track-info{text-align:center;padding:20px 0 0;flex-shrink:0}
.track-info h2{font-family:'DM Serif Display',serif;font-size:clamp(1.05rem,3.5vw,1.35rem);color:var(--tx);font-weight:400;line-height:1.3;margin-bottom:4px}
.track-info .chapter{font-size:.78rem;color:var(--ac);font-weight:500;letter-spacing:.02em;transition:all .3s}
.track-info .meta{font-size:.68rem;color:var(--txf);margin-top:4px}

/* ===== PROGRESS ===== */
.prog{flex-shrink:0;padding:16px 0 4px}
.bar{position:relative;height:4px;background:var(--s2);border-radius:2px;overflow:visible;cursor:pointer}
.bar-fill{position:absolute;top:0;left:0;height:100%;background:var(--ac);border-radius:2px;pointer-events:none;transition:width .1s linear}
.bar-head{position:absolute;top:50%;width:12px;height:12px;border-radius:50%;background:#fff;pointer-events:none;transition:left .1s linear,opacity .2s;transform:translate(-50%,-50%);box-shadow:0 0 10px var(--glow-a);opacity:0}
.bar:hover .bar-head{opacity:1}
.trow{display:flex;justify-content:space-between;font-size:.68rem;color:var(--txf);font-variant-numeric:tabular-nums;font-weight:500;margin-top:6px}

/* ===== CONTROLS ===== */
.ctrl{display:flex;align-items:center;justify-content:center;gap:20px;padding:8px 0;flex-shrink:0}
.cb{background:none;border:none;color:var(--txd);cursor:pointer;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all .2s;width:44px;height:44px}
.cb:hover{color:var(--tx);transform:scale(1.08)}
.cb svg{width:22px;height:22px;fill:currentColor}
.cb-play{width:60px;height:60px;background:var(--ac);color:#fff;box-shadow:0 4px 20px var(--glow-a)}
.cb-play:hover{transform:scale(1.06)}
.cb-play svg{width:26px;height:26px;fill:currentColor}
.sp{font-size:.72rem;font-weight:700;padding:5px 12px;border-radius:18px;background:var(--s2);color:var(--txd);border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;min-width:40px}
.sp:hover{background:var(--s3);color:var(--tx)}

/* ===== BOTTOM BAR ===== */
.bottom-bar{display:flex;align-items:center;justify-content:center;gap:16px;padding:4px 0 12px;flex-shrink:0}
.bottom-btn{
  display:flex;align-items:center;gap:5px;
  padding:7px 14px;border-radius:20px;
  background:var(--s1);border:1px solid var(--s3);
  color:var(--txd);font-size:.72rem;font-weight:500;
  cursor:pointer;transition:all .25s;
  font-family:'DM Sans',sans-serif;
}
.bottom-btn:hover{border-color:var(--s4);color:var(--tx)}
.bottom-btn.on{border-color:var(--ac);color:var(--ac)}
.bottom-btn svg{width:14px;height:14px;fill:currentColor}

.leg{display:flex;justify-content:center;gap:14px}
.leg span{display:flex;align-items:center;gap:4px;font-size:.64rem;color:var(--txf);font-weight:400}
.ldot{width:5px;height:5px;border-radius:50%;display:inline-block}

@media(max-width:600px){
  #player{padding:0 16px}
  .art-area .cover-art{width:clamp(160px,50vw,220px);height:clamp(160px,50vw,220px)}
  .cb-play{width:54px;height:54px}
  .cb-play svg{width:22px;height:22px}
  .ctrl{gap:16px}
}
</style>
</head>
<body>

<!-- LANDING -->
<div id="landing" onclick="startPlayer()">
  <div class="cover-art"></div>
  <h1>CCMA Exam<br>Readiness & Review</h1>
  <div class="sub">A comprehensive review covering clinical protocols, phlebotomy, pharmacology, HIPAA, and everything you need for CCMA certification.</div>
  <div class="play-cta">
    <svg viewBox="0 0 24 24"><polygon points="8,5 20,12 8,19"/></svg>
    Play Episode
  </div>
  <div class="hint">24 min · Embedded audio</div>
</div>

<!-- PLAYER -->
<div id="player">

  <!-- ART + WAVEFORM + KARAOKE -->
  <div class="art-area" id="artArea">
    <canvas id="waveCanvas"></canvas>
    <div class="cover-art" id="coverArt"></div>
    <!-- TRANSCRIPT OVERLAY -->
    <div class="transcript-wrap hidden" id="transcriptWrap">
      <div class="transcript-scroll" id="transcriptScroll"></div>
    </div>
  </div>

  <!-- TRACK INFO -->
  <div class="track-info">

  <!-- PROGRESS -->

      <div class="bar-fill" id="barFill"></div>
      <div class="bar-head" id="barHead"></div>

  <!-- CONTROLS -->
  <div class="ctrl">

      <svg viewBox="0 0 24 24"><path d="M11.99 5V1l-5 5 5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6h-2c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/><text x="10" y="16.5" font-size="7.5" font-weight="700" fill="currentColor" font-family="sans-serif" text-anchor="middle">15</text></svg>
    </button>
    <button class="cb cb-play" id="playBtn" onclick="togglePlay()">
      <svg viewBox="0 0 24 24" id="pIco"><polygon points="8,5 20,12 8,19"/></svg>
    </button>
    <button class="cb" onclick="skip(15)" title="Forward 15s">
      <svg viewBox="0 0 24 24"><path d="M12.01 5V1l5 5-5 5V7c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6h2c0 4.42-3.58 8-8 8s-8-3.58-8-8 3.58-8 8-8z"/><text x="14" y="16.5" font-size="7.5" font-weight="700" fill="currentColor" font-family="sans-serif" text-anchor="middle">15</text></svg>
    </button>
    <button class="sp" style="visibility:hidden">1×</button>
  </div>

  <!-- BOTTOM -->
  <div class="bottom-bar">
    <button class="bottom-btn" id="modeText" onclick="toggleTranscribe()">
      <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h14l4 4V4c0-1.1-.9-2-2-2zm-2 12H6v-2h12v2zm0-3H6V9h12v2zm0-3H6V6h12v2z"/></svg>
      Transcript
    </button>
    <div class="leg">
      <span><span class="ldot" style="background:var(--spa)"></span> Host A</span>
      <span><span class="ldot" style="background:var(--spb)"></span> Host B</span>
    </div>
  </div>
</div>

<script>
// ===== DATA =====
const SEG=[{"s":0.00,"e":8.40,"t":"You know that that very specific sound like the crinkle of that giant roll of paper when you finally sit down on an exam table at the doctor's office.","sp":1},
{"s":8.40,"e":14.40,"t":"Yeah, everybody knows that sound. Right. You're just sitting there maybe swinging your legs a little bit waiting for the provider to walk in.","sp":1},
{"s":14.40,"e":21.60,"t":"And there's usually that that faint smell of rubbing alcohol in the air. Definitely. It feels like a pause.","sp":1},
{"s":21.60,"e":28.80,"t":"Exactly. It feels like nothing is really happening yet. But, well, what if I told you that by the time you're sitting on that crinkly paper,","sp":0},
{"s":29.12,"e":36.40,"t":"an intensely rigorous, highly choreographed sequence of events has already taken place all around you.","sp":0},
{"s":36.88,"e":42.72,"t":"Because we often think of a routine checkup as, you know, a fairly simple administrative process.","sp":0},
{"s":42.72,"e":46.32,"t":"You sign in, you get your way checked, you go to a room. Yeah, pretty standard stuff.","sp":1},
{"s":46.32,"e":52.00,"t":"But what is actually happening to get you safely onto that table is, I mean, it's a master class and","sp":0},
{"s":52.00,"e":57.68,"t":"extreme precision. It's a hidden operation running in the background of every single clinic.","sp":0},
{"s":57.68,"e":63.44,"t":"And that is our mission for you today in this deep dive. We've got our hands on a week 15 review deck","sp":0},
{"s":63.44,"e":67.44,"t":"for the CCMA, which is the certified clinical medical assistant exam.","sp":0},
{"s":67.44,"e":72.80,"t":"Right. Think of this as the comprehensive review, you know, the master blueprint of everything","sp":1},
{"s":72.80,"e":77.28,"t":"these frontline professionals need to know before they are even allowed to interact with patients.","sp":1},
{"s":77.28,"e":82.72,"t":"We're going to decode the exact protocols medical professionals used to keep you safe.","sp":0},
{"s":83.36,"e":88.88,"t":"Okay, let's unpack this because the sheer volume of invisible work that happens before the","sp":1},
{"s":88.88,"e":95.36,"t":"doctor even steps into the room is staggering. It really is. And to appreciate the scope of this role,","sp":0},
{"s":95.36,"e":103.04,"t":"you have to realize that medical assistants operate at this very intense intersection. They're bridging clinical science with legal administration.","sp":0},
{"s":103.04,"e":110.24,"t":"So they aren't just taking your height and saying, hello. Not at all. They are constantly synthesizing these diverse high-stakes sets of data in real time.","sp":0},
{"s":110.88,"e":117.52,"t":"They are balancing the physical geometry of your anatomy with the complex chemistry of your blood.","sp":0},
{"s":117.52,"e":125.44,"t":"All while staying within an invisible, highly punitive force field of federal law. So let's start with the very first thing they do when they call your name in the waiting room.","sp":1},
{"s":125.44,"e":130.08,"t":"They have to read your body's dashboard. But even before they take your vitals,","sp":1},
{"s":130.08,"e":136.64,"t":"they're directing how you physically position your body on that exam table. Right. Because positioning matters.","sp":1},
{"s":136.64,"e":141.44,"t":"Yeah, I was looking through the notes and they're all these very specific clinical terms","sp":1},
{"s":141.44,"e":147.28,"t":"for how a patient lies down. Patient positioning is critical. It dictates what kind of","sp":0},
{"s":147.28,"e":152.96,"t":"exam can safely be performed and it affects the body's internal pressure.","sp":0},
{"s":152.96,"e":158.24,"t":"Like how so? Well, if they need to examine your abdomen, they'll place you in the supine position.","sp":0},
{"s":158.88,"e":166.32,"t":"Which means lying flat on your back facing the ceiling. Okay. But if they need to examine your spine, they use the prone position lying flat on your stomach.","sp":0},
{"s":166.88,"e":172.08,"t":"And if a patient comes in struggling to breathe, lying them flat is actually dangerous.","sp":1},
{"s":172.08,"e":176.40,"t":"Because it restricts their lungs, right? Exactly. So the assistant will immediately put them in","sp":1},
{"s":176.40,"e":181.36,"t":"fallers position, which is sitting up at a 90 degree angle to maximize lung expansion.","sp":0},
{"s":181.36,"e":185.60,"t":"So even just telling you how to sit is a clinical decision? It absolutely is.","sp":1},
{"s":185.60,"e":193.12,"t":"And once you're in the right position, they establish your baseline vital signs. I mean, before a medical professional can safely do anything else,","sp":0},
{"s":193.12,"e":197.68,"t":"they have to know what normal looks like for your body in that exact moment. Right. They're","sp":0},

{"s":202.88,"e":209.20,"t":"where the normal threshold is less than 120 over 80. Plus a respiratory rate of 12 to 20","sp":1},
{"s":209.20,"e":214.32,"t":"breaths per minute. And of course, your temperature. Which temperature is a great example of how","sp":0},
{"s":214.32,"e":218.96,"t":"nuance these baselines are, isn't it? Oh, completely. It isn't as simple as just grabbing","sp":0},

{"s":224.00,"e":229.20,"t":"accuracy hierarchy based on where they take that measurement. Right. The notes say rectal","sp":0},

{"s":233.68,"e":239.04,"t":"because it's internal? Pretty much. Yeah. It measures the body's true core heat free from any","sp":1},
{"s":239.04,"e":244.64,"t":"external environmental factors. Like the AC in the room or whatever. Exactly. From there,","sp":0},
{"s":244.64,"e":250.00,"t":"the accuracy cascades down depending on how exposed the measurement side is. So you have the","sp":1},

{"s":254.72,"e":260.00,"t":"followed by oral in the mouth. And at the very bottom of the hierarchy is axillary under the armpit.","sp":1},
{"s":260.00,"e":264.48,"t":"Right. That's the least accurate method because the skin surface is constantly fluctuating","sp":0},
{"s":264.48,"e":268.96,"t":"based on room temperature or the patient's clothing. That makes sense. Then there's the fifth","sp":0},
{"s":268.96,"e":274.56,"t":"vital sign in the notes. Pain. Oh, yes. Raided on the scale of 0 to 10 by the patient or using the","sp":0},
{"s":274.56,"e":278.88,"t":"little long-baker faces. You know, the drawn expressions going from a happy smile to","sp":0},
{"s":278.88,"e":284.56,"t":"crying specifically for kids. Yes. The face is scale. But if I can push back for a second,","sp":0},
{"s":284.56,"e":289.12,"t":"if pain is completely subjective to the person feeling it, how on earth does a clinical","sp":1},
{"s":289.12,"e":293.76,"t":"exam test for it objectively? I mean, how can someone document a symptom they can't measure","sp":1},
{"s":293.76,"e":298.40,"t":"with a cuff for a dial? Well, the clinical protocol here dictates the exact opposite of what","sp":1},
{"s":298.40,"e":303.04,"t":"you might expect from a scientific process. Yeah. The absolute rule for medical assistants","sp":1},
{"s":303.12,"e":310.56,"t":"is to never ever interpret the patient's pain. Really, never interpret it. Never. You always","sp":1},
{"s":310.56,"e":316.24,"t":"document the patient's own rating precisely because it is subjective. If a patient is sitting there","sp":0},
{"s":316.88,"e":321.84,"t":"smiling, you know, casually checking their phone, but they tell the assistant their pain is an 8 out","sp":0},
{"s":321.84,"e":328.16,"t":"of 10. The assistant documents in 8. Wow. Even if they look totally fine. Right. The goal is","sp":1},
{"s":328.16,"e":333.92,"t":"recording the patient's lived experience, not a clinician's external observation of that experience.","sp":0},
{"s":333.92,"e":338.32,"t":"So you're literally capturing their reality as they report it. Exactly. And to understand the","sp":0},
{"s":338.32,"e":343.04,"t":"mechanics behind that reality, these assistants have to know the body inside and out. I notice the","sp":0},
{"s":343.04,"e":347.28,"t":"review deck has these specific anatomy questions that seem designed to trip people out. Oh,","sp":0},
{"s":347.28,"e":351.84,"t":"definitely. An anatomy is full of anomalies. Yeah. The body apparently has some wild exceptions to","sp":1},
{"s":351.84,"e":358.00,"t":"its own rules. A classic example tested on the CCMA involves the vascular system. So generally,","sp":0},
{"s":358.08,"e":363.60,"t":"arteries carry fresh oxygenated blood away from the heart out to the body. Right. And veins carry","sp":1},
{"s":363.60,"e":368.64,"t":"the depleted deoxygenated blood back. Yeah. But the pulmonary vein breaks this rule entirely.","sp":1},
{"s":368.64,"e":374.40,"t":"It is the only vein in the entire human body that carries oxygenated blood. Simply because","sp":0},
{"s":374.40,"e":380.80,"t":"it's specific job is bringing that freshly oxygenated blood from the lungs directly back into the","sp":1},
{"s":380.80,"e":387.12,"t":"heart to be pumped out. Oh, wow. That's a great trivia fact. There's also this intense focus in","sp":0},
{"s":387.12,"e":392.96,"t":"the notes on a specific structure at the base of the brain called the medulla obligata. Right.","sp":1},
{"s":392.96,"e":397.20,"t":"When we talk about all those baseline vital signs we just went through, the heart rate, the rhythmic","sp":0},
{"s":397.20,"e":403.44,"t":"breathing, the blood pressure, the medulla obligata is the exact command set of responsible for","sp":0},
{"s":403.44,"e":408.08,"t":"regulating them involuntarily. So it's like the idle setting on a car engine. That's a great way to","sp":1},
{"s":408.08,"e":411.92,"t":"put it. It just keeps the pistons firing and everything running in the background without us having to","sp":1},
{"s":411.92,"e":416.96,"t":"actively think about it. I mean, if you had to consciously remember to trigger your diaphragm","sp":1},
{"s":416.96,"e":422.00,"t":"for those 12 to 20 breaths every single minute, you'd never be able to sleep or get anything else done.","sp":1},
{"s":422.00,"e":427.60,"t":"Exactly. And establishing that baseline monitoring that idle setting is what tells the clinician","sp":0},
{"s":427.60,"e":432.16,"t":"if it's safe to move on to physical interventions. They need to know the system is stable before","sp":0},

{"s":437.68,"e":442.40,"t":"I was looking at the section on injections and there is a surprising amount of geometry involved.","sp":0},
{"s":442.40,"e":446.64,"t":"Oh, a tonne geometry. I always assumed giving a shot was just a matter of, you know,","sp":1},
{"s":447.12,"e":452.88,"t":"pushing the needle in, but the notes emphasize very specific angles. Why is it an injection just","sp":1},
{"s":452.88,"e":458.96,"t":"a standard motion every time? Well, the angle determines which tissue layer the medication enters","sp":0},
