<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, #1a3a5c 0%, #0d6efd22 100%);
    background-color: #1a3a5c;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 18px 10px 30px;
  }
  h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 800;
    margin-bottom: 6px;
    letter-spacing: 1px;
    text-align: center;
  }
  .subtitle {
    color: #b8d4f0;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 16px;
    text-align: center;
  }
  .main {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    width: 100%;
    max-width: 860px;
  }
  .figure-wrap {
    position: relative;
    flex-shrink: 0;
  }
  svg.body-svg {
    display: block;
  }
  .drop-zone {
    position: absolute;
    background: rgba(255,255,255,0.13);
    border: 2.5px dashed #7ec8f7;
    border-radius: 8px;
    min-width: 130px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s;
    font-size: 13px;
    font-weight: 800;
    color: #d0eaff;
    white-space: nowrap;
    padding: 0 8px;
  }
  .drop-zone:hover { background: rgba(126,200,247,0.22); }
  .drop-zone.correct {
    background: rgba(34,197,94,0.22);
    border: 2.5px solid #22c55e;
    color: #22c55e;
  }
  .drop-zone.wrong {
    background: rgba(239,68,68,0.22);
    border: 2.5px solid #ef4444;
    animation: shake 0.35s;
  }
  @keyframes shake {
    0%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}100%{transform:translateX(0)}
  }
  .label-bank {
    background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(126,200,247,0.3);
    border-radius: 14px;
    padding: 16px 14px;
    width: 190px;
    flex-shrink: 0;
  }
  .label-bank h2 {
    color: #7ec8f7;
    font-size: 14px;
    font-weight: 800;
    margin-bottom: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    text-align: center;
  }
  .label-item {
    background: #1e5fa8;
    color: #fff;
    font-size: 13px;
    font-weight: 800;
    border-radius: 7px;
    padding: 8px 10px;
    margin-bottom: 8px;
    cursor: grab;
    text-align: center;
    border: 1.5px solid #4a9fd4;
    user-select: none;
    transition: opacity 0.2s, background 0.2s;
  }
  .label-item:hover { background: #2471c8; }
  .label-item.used { opacity: 0.25; pointer-events: none; }
  .label-item.dragging { opacity: 0.5; }

  .connector {
    position: absolute;
    pointer-events: none;
  }

  .btns {
    display: flex;
    gap: 12px;
    margin-top: 18px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    background: #1e5fa8;
    color: #fff;
    border: none;
    border-radius: 9px;
    padding: 10px 24px;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    transition: background 0.2s;
  }
  button:hover { background: #2471c8; }
  button.reset-btn { background: #7c3aed; }
  button.reset-btn:hover { background: #6d28d9; }
  button.result-btn { background: #0f766e; }
  button.result-btn:hover { background: #0d5c55; }

  .result-box {
    display: none;
    background: rgba(255,255,255,0.09);
    border: 2px solid #7ec8f7;
    border-radius: 12px;
    padding: 16px 24px;
    margin-top: 16px;
    color: #fff;
    text-align: center;
    max-width: 500px;
    width: 100%;
  }
  .result-box h3 { font-size: 20px; font-weight: 800; margin-bottom: 8px; }
  .result-box .score { font-size: 36px; font-weight: 900; color: #22c55e; }
  .result-box p { font-size: 14px; color: #b8d4f0; font-weight: 700; margin-top: 6px; }
  .result-box .miss { color: #fbbf24; font-size: 13px; font-weight: 800; margin-top: 8px; }

  .dot {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #f97316;
    border: 2px solid #fff;
    transform: translate(-50%, -50%);
    z-index: 5;
    pointer-events: none;
  }

  /* ================= GUIDED TOUR ================= */
  .tour-hidden{ display:none !important; }
  #tourHighlight{
    position:fixed; z-index:9998; border-radius:14px; pointer-events:none;
    box-shadow: 0 0 0 9999px rgba(10,20,35,0.72);
    border: 2px solid #f97316;
    transition: top .4s cubic-bezier(.4,0,.2,1), left .4s cubic-bezier(.4,0,.2,1),
                width .4s cubic-bezier(.4,0,.2,1), height .4s cubic-bezier(.4,0,.2,1);
  }
  #tourTooltip{
    position:fixed; z-index:10001; background:#0e2947; border-radius:14px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    width:290px; max-width:88vw; padding:20px 22px;
    font-family: Arial, sans-serif;
    border: 1.5px solid #7ec8f7;
    transition: top .35s ease, left .35s ease;
  }
  #tourTooltip .tour-step-count{
    font-size:11px; font-weight:800; letter-spacing:0.06em; text-transform:uppercase;
    color:#7ec8f7; margin-bottom:6px;
  }
  #tourTooltip h3{ font-size:16px; font-weight:800; color:#fff; margin:0 0 8px; }
  #tourTooltip p{ font-size:13px; line-height:1.55; color:#b8d4f0; margin:0 0 16px; }
  #tourTooltip .tour-actions{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  #tourTooltip .tour-right{ display:flex; align-items:center; gap:10px; }
  #tourTooltip button.tour-btn{
    background:#1e5fa8; color:#fff; border:none; border-radius:9px;
    padding:9px 16px; font-weight:800; font-size:13px; cursor:pointer; font-family:inherit;
  }
  #tourTooltip button.tour-btn:hover{ background:#2471c8; }
  #tourTooltip button.tour-btn-secondary{
    background:transparent; color:#7c9cc0; border:none;
    font-size:12.5px; font-weight:700; cursor:pointer; padding:9px 2px; font-family:inherit;
  }
  #tourTooltip button.tour-btn-secondary:hover{ color:#fff; text-decoration:underline; }
  #tourReplayBtn{
    position:fixed; bottom:20px; right:20px; z-index:9997;
    background:#1e5fa8; color:#fff; border:none; border-radius:999px;
    padding:12px 20px; font-weight:800; font-size:13px; cursor:pointer;
    box-shadow: 0 8px 24px rgba(30,95,168,.45);
    display:flex; align-items:center; gap:8px; font-family:inherit;
  }
  #tourReplayBtn:hover{ background:#2471c8; }
</style>
</head>
<body>
<div id="tourHighlight" class="tour-hidden"></div>
<div id="tourTooltip" class="tour-hidden">
  <div class="tour-step-count" id="tourStepCount"></div>
  <h3 id="tourTitle"></h3>
  <p id="tourText"></p>
  <div class="tour-actions">
    <button class="tour-btn-secondary" id="tourSkip">Skip tour</button>
    <div class="tour-right">
      <button class="tour-btn-secondary" id="tourBack">Back</button>
      <button class="tour-btn" id="tourNext">Next</button>
    </div>
  </div>
</div>
<button id="tourReplayBtn" class="tour-hidden">&#9654; Replay Tutorial</button>

<h1>Pulse Sites — Drag & Label</h1>
<div class="subtitle">Drag each label to the correct pulse site on the body</div>

<div class="main">

    <div class="drop-zone" id="dz-popliteal" data-answer="Popliteal Artery" style="top:426px;left:2px;min-width:130px;"></div>

  <!-- Label bank -->
  <div class="label-bank">
    <h2>Labels</h2>

      <div class="label-item" draggable="true" data-label="Carotid">Carotid</div>

      <div class="label-item" draggable="true" data-label="Femoral">Femoral</div>

<div class="btns">
  <button class="reset-btn" onclick="resetAll()">Reset</button>
  <button class="result-btn" onclick="showResult()">Show Result</button>
</div>

<div class="result-box" id="resultBox">
  <h3>Your Score</h3>
  <div class="score" id="scoreDisplay"></div>
  <p id="scoreMsg"></p>
  <div class="miss" id="missList"></div>
</div>

<script>
  let dragging = null;
  const correct = {};

  document.querySelectorAll('.label-item').forEach(item => {
    item.addEventListener('dragstart', e => {
      dragging = item;
      item.classList.add('dragging');
      e.dataTransfer.setData('text/plain', item.dataset.label);
    });
    item.addEventListener('dragend', () => {
      item.classList.remove('dragging');
    });
  });

  document.querySelectorAll('.drop-zone').forEach(zone => {
    zone.addEventListener('dragover', e => e.preventDefault());
    zone.addEventListener('drop', e => {
      e.preventDefault();
      const label = e.dataTransfer.getData('text/plain');
      const answer = zone.dataset.answer;
      if (zone.classList.contains('correct')) return;
      if (label === answer) {
        zone.textContent = label;
        zone.classList.add('correct');
        zone.classList.remove('wrong');
        correct[zone.id] = true;
        if (dragging) dragging.classList.add('used');
      } else {
        zone.classList.add('wrong');
        setTimeout(() => zone.classList.remove('wrong'), 400);
      }
    });
  });

  function resetAll() {
    document.querySelectorAll('.drop-zone').forEach(z => {
      z.classList.remove('correct','wrong');
      z.textContent = '';
    });
    document.querySelectorAll('.label-item').forEach(i => i.classList.remove('used'));
    for (let k in correct) delete correct[k];
    document.getElementById('resultBox').style.display = 'none';
  }

  function showResult() {
    const total = document.querySelectorAll('.drop-zone').length;
    const done = Object.keys(correct).length;
    const rb = document.getElementById('resultBox');
    rb.style.display = 'block';
    document.getElementById('scoreDisplay').textContent = done + ' / ' + total;
    if (done === total) {
      document.getElementById('scoreMsg').textContent = 'Perfect! You labeled all pulse sites correctly!';
      document.getElementById('missList').textContent = '';
    } else {
      document.getElementById('scoreMsg').textContent = 'Keep going! Complete the remaining labels.';
      const missed = [];
      document.querySelectorAll('.drop-zone').forEach(z => {
        if (!z.classList.contains('correct')) missed.push(z.dataset.answer);
      });
      document.getElementById('missList').textContent = 'Still needed: ' + missed.join(', ');
    }
    rb.scrollIntoView({behavior:'smooth'});
  }
</script>

<script>
(function(){
  const highlightBox = document.getElementById('tourHighlight');
  const tooltip = document.getElementById('tourTooltip');
  const stepCountEl = document.getElementById('tourStepCount');
  const titleEl = document.getElementById('tourTitle');
  const textEl = document.getElementById('tourText');
  const nextBtn = document.getElementById('tourNext');
  const backBtn = document.getElementById('tourBack');
  const skipBtn = document.getElementById('tourSkip');
  const replayBtn = document.getElementById('tourReplayBtn');

  function q(sel){ return document.querySelector(sel); }

  function simulateDrop(zoneEl, label){
    if(!zoneEl || zoneEl.classList.contains('correct')) return;
    const answer = zoneEl.dataset.answer;
    if(label === answer){
      zoneEl.textContent = label;
      zoneEl.classList.add('correct');
      zoneEl.classList.remove('wrong');
      correct[zoneEl.id] = true;
      const item = document.querySelector('.label-item[data-label="' + label + '"]');
      if(item) item.classList.add('used');
    } else {
      zoneEl.classList.add('wrong');
      setTimeout(() => zoneEl.classList.remove('wrong'), 400);
    }
  }

  function demoCorrectDrop(){
    simulateDrop(document.getElementById('dz-carotid'), 'Carotid');
  }

  function demoWrongDrop(){
    simulateDrop(document.getElementById('dz-radial'), 'Femoral');
  }

  function previewResult(){
    showResult();
  }

  function resetToDefault(){
    resetAll();
  }

  const steps = [
    {
      selector: '.subtitle',
      placement: 'bottom',
      title: 'Welcome to Pulse Sites',
      text: "Drag each label from the bank to its matching pulse site on the body diagram. Click Next to see how it works."
    },
    {
      selector: '.label-bank',
      placement: 'left',
      title: 'The label bank',
      text: 'These are the pulse sites you\u2019ll place \u2014 drag one onto the body where you think it belongs.'
    },
    {
      selector: '#dz-carotid',
      placement: 'bottom',
      title: 'A correct match',
      text: 'Drop a label on the right spot and it locks in green with the name filled in.',
      before: () => demoCorrectDrop(),
      delay: 300
    },
    {
      selector: '#dz-radial',
      placement: 'bottom',
      title: 'A wrong match',
      text: 'Drop it on the wrong spot and you\u2019ll see a quick red shake \u2014 it clears a moment later so you can try again.',
      before: () => demoWrongDrop(),
      delay: 300
    },
    {
      selector: '.btns',
      placement: 'top',
      title: 'Reset or check your score',
      text: 'Use Reset to clear everything and start over, or Show Result to see how many you\u2019ve gotten right so far.'
    },
    {
      selector: '#resultBox',
      placement: 'top',
      title: 'Your score',
      text: 'This shows how many sites you\u2019ve correctly labeled, and lists which ones are still needed.',
      before: () => previewResult(),
      delay: 300
    }
  ];

  let current = -1;

  function showStep(i){
    if(i < 0) i = 0;
    if(i >= steps.length){ endTour(); return; }
    current = i;
    const step = steps[i];
    const wait = step.delay !== undefined ? step.delay : (step.before ? 300 : 60);
    if(step.before) step.before();
    setTimeout(() => renderStep(step, i), wait);
  }

  function renderStep(step, i){
    const target = q(step.selector);
    tooltip.classList.remove('tour-hidden');
    stepCountEl.textContent = `Step ${i + 1} of ${steps.length}`;
    titleEl.textContent = step.title;
    textEl.textContent = step.text;
    backBtn.style.visibility = i === 0 ? 'hidden' : 'visible';
    nextBtn.textContent = i === steps.length - 1 ? 'Finish' : 'Next';

    if(target){
      highlightBox.classList.remove('tour-hidden');
      const rect = target.getBoundingClientRect();
      const pad = 8;
      highlightBox.style.top = (rect.top - pad) + 'px';
      highlightBox.style.left = (rect.left - pad) + 'px';
      highlightBox.style.width = (rect.width + pad * 2) + 'px';
      highlightBox.style.height = (rect.height + pad * 2) + 'px';
      positionTooltip(rect, step.placement);
    } else {
      highlightBox.classList.add('tour-hidden');
      const ttRect = tooltip.getBoundingClientRect();
      tooltip.style.top = (window.innerHeight / 2 - ttRect.height / 2) + 'px';
      tooltip.style.left = (window.innerWidth / 2 - ttRect.width / 2) + 'px';
    }
  }

  function positionTooltip(rect, placement){
    const ttRect = tooltip.getBoundingClientRect();
    const margin = 16;
    let top, left;

    if(placement === 'left'){
      left = rect.left - ttRect.width - margin;
      top = rect.top;
      if(left < margin){ left = rect.right + margin; }
    } else if(placement === 'bottom'){
      top = rect.bottom + margin;
      left = rect.left;
    } else {
      top = rect.top - ttRect.height - margin;
      left = rect.left;
    }

    if(top < margin){ top = rect.bottom + margin; }
    if(top + ttRect.height > window.innerHeight - margin){ top = rect.top - ttRect.height - margin; }

    left = Math.min(Math.max(margin, left), window.innerWidth - ttRect.width - margin);
    top = Math.min(Math.max(margin, top), window.innerHeight - ttRect.height - margin);

    tooltip.style.top = top + 'px';
    tooltip.style.left = left + 'px';
  }

  function startTour(){
    replayBtn.classList.add('tour-hidden');
    resetToDefault();
    setTimeout(() => showStep(0), 200);
  }

  function endTour(){
    tooltip.classList.add('tour-hidden');
    highlightBox.classList.add('tour-hidden');
    resetToDefault();
    replayBtn.classList.remove('tour-hidden');
  }

  nextBtn.addEventListener('click', () => showStep(current + 1));
  backBtn.addEventListener('click', () => showStep(current - 1));
  skipBtn.addEventListener('click', endTour);
  replayBtn.addEventListener('click', startTour);

  document.addEventListener('keydown', (e) => {
    if(tooltip.classList.contains('tour-hidden')) return;
    if(e.key === 'ArrowRight' || e.key === 'ArrowDown'){
      e.preventDefault();
      showStep(current + 1);
    } else if(e.key === 'ArrowLeft' || e.key === 'ArrowUp'){
      e.preventDefault();
      showStep(current - 1);
    }
  });

  window.addEventListener('resize', () => {
    if(current >= 0 && current < steps.length) renderStep(steps[current], current);
  });

  window.addEventListener('load', () => setTimeout(startTour, 500));
})();
</script>

</body>
</html>
