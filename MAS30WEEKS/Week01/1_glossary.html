<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Class Glossary — Medical Assistant Program</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:11px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--muted)}
.search-wrap input{width:100%;padding:10px 14px 10px 38px;border-radius:10px;font-size:13px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:3px 8px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:11px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow-y:auto;padding:4px 0;-webkit-overflow-scrolling:touch}
.items::-webkit-scrollbar{width:4px}
.items::-webkit-scrollbar-track{background:transparent}
.items::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.item{padding:8px 14px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.item-left{display:flex;align-items:flex-start;gap:10px;min-width:0;flex:1}
.item-bar{width:3px;min-height:18px;align-self:stretch;border-radius:2px;opacity:.3;transition:opacity .2s;flex-shrink:0}
.item.open .item-bar{opacity:1}
.item-term{font-size:16px;font-weight:700;color:#fff;word-wrap:break-word}
.item-cat{font-size:8px;padding:2px 7px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap;flex-shrink:0}
.item-def{margin-top:6px;margin-left:14px;padding-top:6px;border-top:1px solid var(--border);font-size:13px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:8px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:5px 14px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;max-width:200px}
.pg-dot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">Medical Assistant Program</div>
  <h1>Pre-Class Glossary</h1>
  <p class="sub">The Role of the Medical Assistant in Today's Health Care System</p>
  <div class="search-wrap"><span>⌕</span><input type="text" id="search" placeholder="Search terms or definitions..."></div>
  <div class="filters" id="filters"></div>
  <div class="top-bar"><div class="count" id="count"></div></div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const CATEGORIES=[
  {name:"Role & Profession",color:"#E05555",terms:[
    {term:"Medical Assistant (MA)",def:"A healthcare professional trained to perform both administrative and clinical tasks in medical settings such as clinics, hospitals, and urgent care centers."},
    {term:"Scope of Practice",def:"The legally defined range of duties, procedures, and actions a medical assistant is permitted to perform based on their training and state regulations."},
    {term:"Core Responsibilities",def:"The essential duties of an MA — including scheduling, patient records, billing, vital signs, patient prep, and assisting providers — always within legal scope."},
  ]},
  {name:"Health Care Settings",color:"#4A90B8",terms:[
    {term:"Outpatient Clinic",def:"A medical facility where patients receive care, diagnostic tests, or treatments without being admitted overnight to a hospital."},
    {term:"Urgent Care Center",def:"A walk-in facility providing immediate care for non-life-threatening conditions, typically with extended hours beyond regular office practice."},
    {term:"Health Care Environments",def:"The variety of settings where MAs work — including outpatient clinics, hospitals, and urgent care centers — each with unique workflows and staffing."},
  ]},
  {name:"Payment Models",color:"#1A8A7D",terms:[
    {term:"Fee-for-Service",def:"A payment model in which healthcare providers are reimbursed for each individual service or procedure they deliver to a patient."},
    {term:"Capitation",def:"A payment arrangement where a provider receives a set amount per patient over a specific period, regardless of the number of services provided."},
    {term:"Value-Based Care",def:"A reimbursement model that ties payment to the quality and outcomes of care rather than the volume of services rendered."},
    {term:"Reimbursement",def:"The payment a healthcare provider receives from an insurance company or government program for services rendered to a patient."},
  ]},
  {name:"Clinical Skills",color:"#E2B94C",terms:[
    {term:"Vital Signs",def:"Measurements of the body's essential functions — including temperature, pulse, respiration rate, and blood pressure — used to assess a patient's general health."},
    {term:"Patient Education",def:"The process of informing patients about their conditions, treatments, medications, and self-care strategies to improve health outcomes."},
    {term:"Care Coordination",def:"The organized effort to manage patient care activities, ensuring appropriate services are delivered in the right sequence with proper communication across providers."},
  ]},
  {name:"Documentation",color:"#4CAF90",terms:[
    {term:"Electronic Health Record (EHR)",def:"A digital version of a patient's medical chart containing their history, diagnoses, medications, treatment plans, and test results."},
    {term:"Medical Coding",def:"The process of translating healthcare diagnoses, procedures, and services into standardized alphanumeric codes for billing and documentation."},
  ]},
  {name:"Teamwork & Patient Care",color:"#C4A84D",terms:[
    {term:"Collaborative Care",def:"A team-based approach to healthcare in which physicians, nurses, medical assistants, and other professionals work together to provide comprehensive patient treatment."},
    {term:"Cultural Competency",def:"The ability of healthcare providers to effectively deliver services that meet the social, cultural, and linguistic needs of diverse patient populations."},
    {term:"Social Determinants of Health",def:"Non-medical factors — such as income, education, housing, and neighborhood conditions — that influence overall health and well-being."},
  ]},
];

const glossary=[];const catNames=["All"];const catColors={};
CATEGORIES.forEach(cat=>{catNames.push(cat.name);catColors[cat.name]=cat.color;cat.terms.forEach(t=>glossary.push({term:t.term,definition:t.def,category:cat.name}));});
let filter="All",search="",openIdx=null,currentPage=0;const PER_PAGE=4;
function renderFilters(){document.getElementById('filters').innerHTML=catNames.map(c=>{const col=c==="All"?"#7a7f90":(catColors[c]||"#888");const active=filter===c;return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c.replace(/'/g,"\\'")}')">${c}</button>`;}).join('');}
function getFiltered(){const s=search.toLowerCase();return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));}
function renderList(){const filtered=getFiltered();const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));if(currentPage>=totalPages)currentPage=totalPages-1;if(currentPage<0)currentPage=0;const start=currentPage*PER_PAGE;const pageItems=filtered.slice(start,start+PER_PAGE);document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' · Page '+(currentPage+1)+' of '+totalPages;if(!filtered.length){document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';document.getElementById('pager').innerHTML='';return;}document.getElementById('list').innerHTML=pageItems.map(g=>{const col=catColors[g.category]||"#888";const origIdx=glossary.indexOf(g);const isOpen=openIdx===origIdx;return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})"><div class="item-head"><div class="item-left"><div class="item-bar" style="background:${col}"></div><span class="item-term">${g.term}</span></div><span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span></div><div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div></div>`;}).join('');let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button><div class="pg-dots">`;for(let p=0;p<totalPages;p++){ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;}ph+=`</div><button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;document.getElementById('pager').innerHTML=ph;}
function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
