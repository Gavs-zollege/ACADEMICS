<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anatomy &amp; Physiology — True or False</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:16px 20px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:12px;flex-shrink:0;}h1{font-size:26px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:12px;margin-top:4px;}.game-area{flex:1;display:flex;flex-direction:column;justify-content:center;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:12px;flex-shrink:0;}.step{height:8px;border-radius:4px;transition:all .3s;}.sc{background:var(--card);border-radius:12px;padding:20px 20px;border:1px solid var(--border);margin-bottom:14px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:12px;right:16px;font-size:11px;color:var(--dim);font-family:'Geologica',sans-serif;}.st{font-size:17px;line-height:1.5;padding-right:30px;}.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;flex-shrink:0;}.tf{border:2px solid;cursor:pointer;font-family:'Geologica',sans-serif;font-weight:700;font-size:16px;border-radius:10px;padding:16px;color:var(--text);transition:all .2s;}.tf:hover{transform:scale(1.03);}.fb{padding:12px 16px;border-radius:10px;margin-bottom:10px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:13px;font-weight:600;margin-bottom:2px;}.fb-d{font-family:'Geologica',sans-serif;font-size:12px;color:var(--dim);line-height:1.4;}.nw{text-align:center;flex-shrink:0;}.bn{padding:10px 32px;border-radius:8px;border:none;background:var(--gold);color:var(--bg);font-size:13px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:52px;font-weight:700;color:var(--gold);margin:10px 0 6px;}.rm{font-size:14px;font-family:'Geologica',sans-serif;margin-bottom:24px;}.br{padding:12px 36px;border-radius:10px;border:none;background:var(--teal);color:var(--text);font-size:14px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>True or False</h1><p class="sub">Anatomy &amp; Physiology — Is each statement true or false?</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="btns" id="btns"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {s:"Anatomy is the study of how the body functions, while physiology is the study of body structures.",a:false,e:"It's the opposite. Anatomy is the study of body structures (what parts are and where they're located). Physiology is the study of how the body functions and how systems work together."},
  {s:"In anatomical position, the body stands upright, faces forward, with arms at sides and palms facing forward.",a:true,e:"Correct — anatomical position is the standard reference used in healthcare. The body is upright, facing forward, arms at the sides with palms facing forward."},
  {s:"The transverse plane divides the body into left and right halves.",a:false,e:"The transverse plane divides the body into upper (superior) and lower (inferior) portions. It's the sagittal plane that divides the body into left and right."},
  {s:"The skeletal system produces blood cells and stores minerals in addition to providing structural support.",a:true,e:"Correct — bone marrow produces red and white blood cells. Bones also store calcium and phosphorus, and provide the structural framework that protects vital organs."},
  {s:"Arteries carry blood away from the heart, while veins carry blood back to the heart.",a:true,e:"Correct — arteries carry oxygenated blood away from the heart to the body. Veins return deoxygenated blood back to the heart. Capillaries connect the two for gas exchange."},
  {s:"The endocrine system communicates using electrical impulses sent through nerves.",a:false,e:"The endocrine system communicates using hormones released by glands into the bloodstream. It's the nervous system that uses electrical impulses through nerves."},
  {s:"Smooth muscle is voluntary and is responsible for moving your arms and legs.",a:false,e:"Smooth muscle is involuntary — it lines the walls of organs like the stomach and blood vessels. Skeletal muscle is the voluntary type responsible for moving limbs."},
  {s:"The four types of body tissues are epithelial, connective, muscle, and nervous.",a:true,e:"Correct — the four fundamental tissue types are epithelial (covers surfaces), connective (supports and connects), muscle (enables movement), and nervous (transmits signals)."},
  {s:"The respiratory system's primary function is to filter blood and produce urine.",a:false,e:"Filtering blood and producing urine is the function of the urinary system. The respiratory system handles gas exchange — delivering oxygen and removing carbon dioxide."},
  {s:"Body systems work independently and a failure in one system does not affect others.",a:false,e:"Body systems are interconnected and interdependent. A failure in one system often affects others. For example, cardiovascular failure impacts oxygen delivery to every organ system."},
];
let idx=0,answer=null,score=0;
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?20:8;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="st">"${q.s}"</div>`;if(answer===null){document.getElementById('btns').innerHTML=`<button class="tf" onclick="pick(true)" style="background:rgba(56,201,122,.1);border-color:rgba(56,201,122,.3)">✓ TRUE</button><button class="tf" onclick="pick(false)" style="background:rgba(224,85,85,.1);border-color:rgba(224,85,85,.3)">✗ FALSE</button>`;document.getElementById('btns').style.display='grid';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const tB=q.a===true?'var(--success)':answer===true?'var(--error)':'var(--surface)';const fB=q.a===false?'var(--success)':answer===false?'var(--error)':'var(--surface)';document.getElementById('btns').innerHTML=`<button class="tf" style="background:${tB};border-color:${tB};opacity:${answer!==true&&q.a!==true?'.4':'1'};cursor:default">✓ TRUE</button><button class="tf" style="background:${fB};border-color:${fB};opacity:${answer!==false&&q.a!==false?'.4':'1'};cursor:default">✗ FALSE</button>`;const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent!":pct>=60?"Good effort — review the tricky ones.":"Keep studying!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
