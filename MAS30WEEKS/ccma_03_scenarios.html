<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCMA Exam Essentials — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">CCMA Exam Essentials — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"Before administering a vaccine, the MA should FIRST:",choices:["Document the dose in the chart","Verify the patient's identity","Apply a bandage to the injection site","Ask the patient if they want water"],a:1,e:"Always verify the patient's identity first before any procedure. This is a fundamental safety step — administering a vaccine to the wrong patient is a serious medical error. Safety first, then proceed."},
  {q:"A patient hands you their insurance card at check-in. What should you do FIRST?",choices:["Make a copy of the card","Verify eligibility and coverage","Collect the co-pay","File the card in the chart"],a:1,e:"Before copying or collecting payment, verify that the insurance is active and eligible for the scheduled services. This prevents claim denials and ensures the patient understands their financial responsibility."},
  {q:"You're 30 minutes into the CCMA exam and hit a question you can't answer. What's the best strategy?",choices:["Spend 5 minutes working through it carefully","Mark it and move on, then come back later","Guess 'C' and forget about it","Skip it entirely and never return to it"],a:1,e:"Mark tough questions and move on. Spending too long on one question eats into time for easier ones. Come back to flagged questions after completing the rest — you may find clues in later questions."},
  {q:"During an exam question, you notice two answer choices that both seem correct. How should you decide?",choices:["Always choose the longer answer","Pick the one that prioritizes patient safety","Choose the first one you read","Go with whichever sounds more clinical"],a:1,e:"When two answers seem correct, choose the one that prioritizes patient safety. The CCMA exam is designed to test your ability to put safety first, follow scope of practice, and use professional judgment."},
  {q:"A CCMA exam question asks what to do when a patient is found unresponsive. What's the MA's FIRST action?",choices:["Begin chest compressions immediately","Check for responsiveness and call for help","Administer epinephrine","Document the incident"],a:1,e:"The first step is to check for responsiveness and call for help. Don't jump to invasive interventions — that's a common exam trap. Assess the situation first, then follow emergency protocols."},
  {q:"You're preparing for the CCMA exam and it's the week before test day. Which study approach is best?",choices:["Start learning entirely new material","Take a practice test, review anatomy and normal ranges, and review high-yield facts","Only study the topics you're already good at","Skip studying — you either know it or you don't"],a:1,e:"The week before: take a practice test to identify weak areas, review anatomy and normal ranges, go through your top high-yield facts, rest, hydrate, and stay calm. Focused review beats cramming."},
  {q:"An exam question describes a situation where the provider asks you to perform a procedure you haven't been trained on. What should the MA do?",choices:["Attempt it anyway to show initiative","Politely decline and explain it's outside your scope of practice","Ask another MA to teach you quickly","Ignore the request and move on"],a:1,e:"Never perform a procedure outside your training or scope of practice. Politely decline and explain. On the CCMA exam, choosing an action outside MA scope is one of the most common traps."},
  {q:"On exam day, you realize you forgot your confirmation email but have your government ID. What should you do?",choices:["Go home and reschedule the exam","Arrive at the testing center and explain the situation — your ID may be sufficient","Call NHA and ask them to email your results instead","Panic and skip the exam entirely"],a:1,e:"Don't panic. Arrive at the testing center with your government ID and explain. Most testing centers can verify your registration. Always try to bring both, but your ID is the most critical item."},
  {q:"You encounter a question about EKG lead V4 placement. Which description is correct?",choices:["Right sternal border, 4th intercostal space","Midclavicular line, 5th intercostal space","Left midaxillary line, 5th intercostal space","Positioned between V2 and V3"],a:1,e:"V4 is placed at the midclavicular line at the 5th intercostal space. EKG lead placement is a high-yield clinical topic — know all 12 leads. This is a direct recall question commonly seen on the CCMA."},
  {q:"Which action best protects patient privacy in a medical office?",choices:["Calling patients by their full name in the waiting room lobby","Discussing lab results with a coworker in the hallway","Storing charts face down and logging out of the EHR when stepping away","Leaving the EHR open so the next MA can access it quickly"],a:2,e:"Storing charts face down and logging out of EHR systems protects patient privacy under HIPAA. Never call full names in public areas, discuss results in hallways, or leave systems unlocked."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"You're exam ready!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
