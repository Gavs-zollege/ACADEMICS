<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mastering CCMA Scenarios — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Mastering CCMA Scenarios — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A hematoma forms rapidly after venipuncture begins. The patient winces in pain. What should the MA do FIRST?",choices:["Apply a warm compress over the needle","Continue the draw from a different angle","Stop the draw, remove the needle, and apply pressure","Ask the patient to make a fist harder"],a:2,e:"When a hematoma forms during a blood draw, stop immediately, remove the needle, and apply direct pressure to the site. Continuing the draw will worsen the hematoma. Safety first — protect the patient from further injury."},
  {q:"A toddler is crying and resisting during a vaccination. The caregiver looks overwhelmed. What is the MOST appropriate action?",choices:["Hold the child down yourself","Cancel the vaccination","Ask the caregiver to help hold the child securely and calmly","Give the vaccine while the child is moving"],a:2,e:"Ask the caregiver to help restrain the child gently and securely. This ensures safety and comfort for both the child and the caregiver. Never give an injection while a patient is moving — it increases the risk of injury."},
  {q:"A patient approaches the front desk and says, 'I've been waiting 20 minutes!' They appear visibly upset. What should the MA say?",choices:["'The doctor is always busy, please be patient.'","'I'm sorry for the delay. Let me check your status and update you.'","'Everyone has to wait. Take a seat.'","'It's not my fault — talk to the scheduler.'"],a:1,e:"Acknowledge the patient's frustration, apologize for the delay, and take action. The communication formula is: Acknowledge → Assist → Resolve. Empathy and professionalism de-escalate most situations. Never dismiss or blame others."},
  {q:"A patient who speaks limited English needs to understand their discharge instructions. What should you do?",choices:["Speak louder and slower","Ask a family member to translate","Use a certified medical interpreter","Skip the instructions and give them in writing only"],a:2,e:"Always use a certified medical interpreter for patients with language barriers. Do NOT use family members — they may omit, alter, or add information. Accurate communication is essential for patient safety and informed consent."},
  {q:"You accidentally brush your hand over a sterile field while preparing for a procedure. No one else noticed. What do you do?",choices:["Continue — it was just a brief touch","Tell the provider it's still clean","Stop and replace the sterile field","Spray it with alcohol"],a:2,e:"Once a sterile field is contaminated, it must be replaced entirely. It doesn't matter how brief the contact was or whether anyone noticed. Integrity in sterile technique protects the patient from infection. Always self-report contamination."},
  {q:"An HMO patient arrives for a specialist visit but has no referral on file. What is the correct action?",choices:["See the patient anyway and bill later","Send the patient home without options","Call the PCP to obtain a referral or reschedule the appointment","Tell the patient their insurance is worthless"],a:2,e:"HMO plans require referrals for specialist visits. Contact the patient's primary care provider to obtain a referral. If one cannot be obtained, offer to reschedule. Never see the patient without proper authorization — the claim will be denied."},
  {q:"A patient calls and says, 'Can you just tell me my lab results?' You check and see the results are abnormal. What should you say?",choices:["Read the results and explain what they mean","'They look a little abnormal but don't worry.'","'Your provider will review these results with you.'","'I can't tell you anything. Goodbye.'"],a:2,e:"MAs cannot interpret or disclose abnormal lab results. The correct response directs the patient to their provider. Be professional and empathetic: 'Your provider will review these results with you. They'll be in touch soon.' Never dismiss or hang up on a patient."},
  {q:"You're about to administer a medication and the dosage on the order seems unusually high compared to what you've seen before. What should you do?",choices:["Give it — the provider wrote the order","Ask another MA if it seems right","Clarify the order with the provider before administering","Reduce the dose yourself to what seems normal"],a:2,e:"Never assume a medication order is correct if something seems off. Clarify directly with the provider before administering. The SAFE strategy says: Act within scope and Follow correct procedure. MAs do not modify medication orders independently."},
  {q:"A coworker enters the blood draw room without gloves. They're about to begin a venipuncture. What should you do?",choices:["Ignore it — they'll probably be fine","Wait until after the draw to mention it","Instruct them to put on gloves before starting","Report them to HR immediately"],a:2,e:"Infection control always comes first. Instruct your coworker to put on gloves before beginning the blood draw. PPE is required for any procedure involving potential blood or body fluid exposure. Address it immediately — not after the fact."},
  {q:"A patient collapses in the office waiting room. Staff members are nearby. What should the MA do FIRST?",choices:["Run to get the AED","Call 911 immediately","Check responsiveness and call for help","Start chest compressions"],a:2,e:"The first step in any emergency is to assess the situation: check if the patient is responsive and call for help. This follows the SAFE strategy — Safety first. Do not assume cardiac arrest; check responsiveness before beginning CPR or retrieving the AED."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Scenario mastery achieved!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
