<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCMA Final Clinical Skills Bootcamp — Multiple Choice</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.st{font-size:13px;line-height:1.45;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Multiple Choice</h1><p class="sub">Final Clinical Skills Bootcamp — Select the best answer.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"What is the normal adult resting pulse range?",choices:["40–60 bpm","60–100 bpm","80–120 bpm","100–160 bpm"],a:1,e:"The normal adult resting pulse is 60–100 bpm. A pulse below 50 or above 120 in an adult is a red flag requiring immediate provider notification. 80–120 is the normal range for children, and 100–160 is for infants."},
  {q:"During blood pressure measurement, the cuff should be placed:",choices:["Directly over the antecubital space","1 inch above the antecubital space","On the forearm below the elbow","Anywhere on the upper arm"],a:1,e:"The BP cuff must be placed 1 inch above the antecubital space with the arm at heart level. Incorrect placement gives inaccurate readings. The cuff should also be the correct size for the patient's arm circumference."},
  {q:"Which is the correct order of draw immediately after blood cultures?",choices:["Red/gold, green, lavender, gray","Lavender, light blue, green, gray","Light blue, red/gold, green, lavender, gray","Green, lavender, light blue, gray"],a:2,e:"After blood cultures, the order is: light blue → red/gold → green → lavender → gray. This sequence prevents cross-contamination of tube additives and ensures accurate lab results."},
  {q:"What angle is used for a subcutaneous (SC) injection?",choices:["5–15 degrees","30 degrees","45 degrees","90 degrees"],a:2,e:"Subcutaneous injections are given at a 45° angle with the skin pinched. The maximum SC volume is 1 mL. Intradermal is 5–15°, and intramuscular is 90°."},
  {q:"Where is chest lead V1 placed on an EKG?",choices:["4th intercostal space, left sternal border","5th intercostal space, midclavicular line","4th intercostal space, right sternal border","Anterior axillary line"],a:2,e:"V1 is placed at the 4th intercostal space at the right sternal border. V2 is at the 4th ICS left sternal border. V1 and V2 placement are the most commonly tested EKG topics on the CCMA exam."},
  {q:"A patient's SpO₂ reads 87%. What should the MA do FIRST?",choices:["Document and continue the visit","Recheck in 10 minutes","Notify the provider immediately","Ask the patient to take deep breaths"],a:2,e:"An SpO₂ below 90% is a critical finding requiring immediate provider notification. Normal SpO₂ is 95–100%. Do not delay by rechecking or continuing routine procedures — this is an urgent situation."},
  {q:"What is the maximum volume that can be injected into the deltoid muscle?",choices:["0.5 mL","1 mL","2 mL","3 mL"],a:1,e:"The deltoid muscle can accommodate a maximum of 1 mL. The vastus lateralis holds up to 2 mL, and the ventrogluteal site — the safest IM site — can hold 2–3 mL."},
  {q:"Which specimen label element is NOT required?",choices:["Patient name and DOB","Date and time of collection","Provider's home address","Collector's initials"],a:2,e:"Required specimen label elements are: patient name, DOB, date/time of collection, collector's initials, and test ordered. The provider's home address is never a labeling requirement. Labels must be applied at the bedside — never pre-label tubes."},
  {q:"What does the 'O' in OLDCARTS stand for?",choices:["Operation","Origin","Onset","Outcome"],a:2,e:"OLDCARTS is a symptom assessment mnemonic: Onset, Location, Duration, Characteristics, Aggravating factors, Relieving factors, Timing, and Severity. It helps the MA collect thorough symptom history during intake."},
  {q:"A wandering baseline artifact on an EKG is corrected by:",choices:["Providing a blanket for warmth","Removing nearby electronics","Tightening or replacing electrodes","Reconnecting a loose lead"],a:2,e:"Wandering baseline is caused by loose or poorly attached electrodes. The fix is to tighten or replace them. Somatic tremor → blanket; AC interference → remove electronics; interrupted baseline → reconnect loose leads."},
  {q:"During venipuncture, the needle should be inserted at what angle?",choices:["5–15 degrees","15–30 degrees","45 degrees","90 degrees"],a:1,e:"Venipuncture needles are inserted at 15–30 degrees. A 45° angle is for subcutaneous injections, and 90° is for intramuscular. Inserting at too steep an angle risks going through the vein and causing a hematoma."},
  {q:"What is the FIRST step of the complete intake sequence?",choices:["Take vital signs","Verify two patient identifiers","Collect reason for visit","Greet the patient"],a:3,e:"The correct intake sequence begins with greeting the patient, then verifying 2 identifiers, collecting reason for visit, taking vital signs, medication reconciliation, allergies, and documentation. A professional greeting sets the tone for the entire visit."},
  {q:"Which IM injection site is preferred for infants?",choices:["Deltoid","Ventrogluteal","Dorsogluteal","Vastus lateralis"],a:3,e:"The vastus lateralis (outer thigh) is the preferred IM injection site for infants because it is well-developed even in newborns. The deltoid is too small in infants, and the ventrogluteal is the safest site for adults."},
  {q:"A patient begins to feel dizzy and pale during a blood draw. What should the MA do?",choices:["Continue the draw quickly","Stop the draw and protect the patient's head","Ask the patient to stand up","Apply a cold towel to the arm"],a:1,e:"Signs of fainting during phlebotomy include pallor, sweating, and dizziness. The MA must immediately stop the draw and protect the patient's head. Continuing the draw or asking the patient to stand could result in injury from a fall."},
  {q:"When performing an intradermal injection, a wheal should form. If no wheal appears, the MA should:",choices:["Document the injection as complete","Massage the site to create a wheal","Repeat the injection on the opposite arm","Apply pressure until a wheal forms"],a:2,e:"If no wheal forms during an intradermal injection (such as a TB test), the injection was likely too deep. The MA must repeat the injection on the opposite arm. A visible wheal confirms proper intradermal placement."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent work!":pct>=60?"Good effort — review what you missed.":"Keep studying the material!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
