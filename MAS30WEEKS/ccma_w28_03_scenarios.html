<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCMA Final Clinical Skills Bootcamp — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Final Clinical Skills Bootcamp — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"You're taking a patient's blood pressure and the cuff seems too small for their arm. The reading comes back as 158/96. What should you do?",choices:["Report the reading as-is","Use the correct cuff size and remeasure","Ask the patient if they feel hypertensive","Document and move on to the next patient"],a:1,e:"A cuff that is too small will produce a falsely high reading. You must select the correct cuff size for the patient's arm circumference and remeasure. Accurate BP depends on proper technique — cuff size, arm at heart level, and slow deflation at 2–3 mmHg/sec."},
  {q:"You're performing an EKG and notice the V2 electrode keeps falling off. The patient has a hairy chest. What is the best course of action?",choices:["Tape over the electrode","Skip V2 and estimate the reading","Clean the skin, dry it, and replace the electrode","Press harder on the electrode"],a:2,e:"When electrodes won't stick, the skin must be properly prepared: clean, dry, and if necessary, lightly shave the area. Taping or pressing harder won't produce a clean tracing. Skipping a lead is never acceptable — all 12 leads are required."},
  {q:"A patient collapses in the waiting room and is unresponsive. What is your FIRST action?",choices:["Begin chest compressions immediately","Check responsiveness and call for help","Move the patient to an exam room","Take their blood pressure"],a:1,e:"For an unresponsive patient, the first action is to check responsiveness and call for help (activate EMS/call 911). Then assess for breathing and pulse. Do not move the patient unnecessarily or delay by taking vitals — follow emergency response protocol."},
  {q:"You collected a urine specimen for a drug screen, but you notice the toilet was recently flushed and the water in the collection area is clear. What should you do?",choices:["Accept the specimen anyway","Add bluing agent to the toilet water next time","Reject the specimen and recollect properly","Test the specimen and note the issue"],a:2,e:"Drug screen specimens require chain-of-custody protocols. If the collection environment was compromised (toilet flushed, access to water), the specimen must be rejected and recollected under proper conditions to prevent tampering."},
  {q:"You're drawing blood and a hematoma begins forming at the puncture site. What is your immediate action?",choices:["Push the needle in deeper","Continue the draw — hematomas are normal","Stop the draw immediately and apply pressure for 2–3 minutes","Switch to a larger needle"],a:2,e:"A hematoma during venipuncture means blood is leaking into surrounding tissue. Stop the draw immediately, remove the needle, and apply direct pressure for 2–3 minutes. Never continue drawing through a hematoma — it worsens the injury and compromises results."},
  {q:"You're preparing to give an IM injection in the deltoid. The provider's order calls for 2.5 mL of medication. What should you do?",choices:["Inject all 2.5 mL into the deltoid","Split the dose between both deltoids","Contact the provider — the deltoid maximum is 1 mL","Use a longer needle to accommodate the volume"],a:2,e:"The deltoid can hold a maximum of 1 mL. An order for 2.5 mL in the deltoid exceeds the site limit. Contact the provider to clarify — they may want to use the ventrogluteal site (2–3 mL capacity) or split the dose."},
  {q:"A patient with diabetes has a blood glucose reading of 52 mg/dL. They are conscious but shaky and confused. What should you do?",choices:["Administer insulin","Give the patient orange juice and document","Notify the provider immediately","Tell the patient to eat lunch and come back"],a:2,e:"A glucose of 52 mg/dL is hypoglycemia — a medical emergency. The MA must notify the provider immediately. Do NOT give insulin (that would lower glucose further). While the provider may order juice or glucose tablets, the MA's first action is to notify the provider."},
  {q:"You realize after printing an EKG that the limb leads were placed on the wrong extremities. The tracing looks unusual. What do you do?",choices:["Note the error on the tracing and file it","Correct the lead placement and repeat the entire EKG","Show the provider and let them decide","Discard the tracing without telling anyone"],a:1,e:"Incorrect lead placement produces inaccurate tracings that could lead to misdiagnosis. Correct the placement and repeat the entire EKG from the beginning. Never file an inaccurate tracing and never hide the error — patient safety depends on accurate results."},
  {q:"During intake, a patient reports sudden onset chest pain rated 8/10 with shortness of breath. What is the MA's FIRST action?",choices:["Complete the OLDCARTS assessment","Take a full set of vital signs","Stay with the patient and call for immediate help","Offer the patient water and a comfortable position"],a:2,e:"Chest pain with shortness of breath is a potential cardiac emergency. Stay with the patient and call for immediate clinical help. Do not leave the patient to finish paperwork, take full vitals, or perform a detailed assessment — get the provider involved immediately."},
  {q:"A blood culture is ordered. You clean the site with alcohol only. Is this acceptable?",choices:["Yes — alcohol is sufficient for all blood draws","No — blood cultures require a sterile prep protocol","It depends on the patient's infection status","Yes — but only if you use two alcohol wipes"],a:1,e:"Blood cultures require a sterile collection protocol, not just an alcohol wipe. Improper skin preparation is the leading cause of blood culture contamination, which leads to false-positive results and unnecessary treatment. Follow the facility's sterile prep protocol exactly."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Scenario mastery achieved!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
