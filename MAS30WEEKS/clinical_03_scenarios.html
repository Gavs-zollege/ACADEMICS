<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clinical Mastery Review — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Clinical Mastery Review — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"You're about to administer a vaccine. What should you do FIRST?",choices:["Draw up the medication","Document the dose in the chart","Verify the patient's identity using two identifiers","Apply a bandage to the injection site"],a:2,e:"Always verify patient identity using two identifiers before any procedure. Administering a vaccine to the wrong patient is a serious safety error. Identity verification comes before everything else."},
  {q:"During a blood draw, you notice a hematoma forming at the puncture site. What's your immediate action?",choices:["Continue — it's normal for a small hematoma to form","Switch to a butterfly needle and keep drawing","Stop the draw immediately and apply direct pressure","Massage the area to disperse the blood"],a:2,e:"Stop the draw immediately and apply direct pressure. Continuing will worsen the hematoma. Never massage a hematoma — this can increase bruising and tissue damage."},
  {q:"You administer a TB test but no wheal forms at the injection site. What does this indicate?",choices:["The test was successful — wheals aren't always necessary","The injection was given too deep — it should be repeated","The patient is immune to TB","The medication was expired"],a:1,e:"If no wheal forms, the injection was likely given too deep (subcutaneous instead of intradermal). The test needs to be repeated because without a wheal, the antigen wasn't properly placed in the dermal layer."},
  {q:"You're recording an EKG and notice a wandering baseline on the tracing. What should you do?",choices:["Continue recording — the provider will interpret it","Check for patient movement and tighten loose electrodes","Restart the machine completely","Remove all leads and begin from scratch"],a:1,e:"A wandering baseline is usually caused by patient movement or loose leads. Tighten the electrodes, ask the patient to remain still and breathe normally. You don't need to restart the entire setup."},
  {q:"A patient refuses a vaccine that the provider ordered. What should the MA do?",choices:["Administer it anyway — it's a provider order","Respect the patient's decision, document the refusal, and inform the provider","Tell the patient they're making a dangerous choice","Ignore the refusal and reschedule"],a:1,e:"Patients have the right to refuse treatment. Respect their decision, document the refusal clearly in the chart, and inform the provider. Never force or guilt a patient into accepting a procedure."},
  {q:"You're setting up a sterile field for a procedure. What's the correct first step?",choices:["Put on sterile gloves","Open the sterile pack away from your body","Reach over the field to position instruments","Pour solutions directly onto the sterile drape"],a:1,e:"Open the sterile pack away from your body first. Then put on gloves. Never reach over the sterile field, and never pour liquids directly onto it. Anything below waist level is considered contaminated."},
  {q:"While performing venipuncture, you miss the vein on the first attempt. What's the correct next step?",choices:["Dig around with the needle to locate the vein","Withdraw slightly and redirect the needle once","Pull out and immediately try the same site again","Ask the patient to hold still and push the needle deeper"],a:1,e:"Withdraw slightly and redirect once. If you still can't access the vein, stop the attempt entirely. Never dig, fish, or probe with the needle — this causes pain, tissue damage, and potential nerve injury."},
  {q:"You need to give an IM injection in the deltoid. What's the maximum volume you can inject at this site?",choices:["0.5 mL","1 mL","3 mL","5 mL"],a:1,e:"The deltoid can handle a maximum of 1 mL for IM injections. For larger volumes (2–3 mL), use the ventrogluteal or vastus lateralis sites. Exceeding volume limits causes pain and poor absorption."},
  {q:"A blood specimen needs to be sent to the lab. You realize you forgot to label it at the bedside. What should you do?",choices:["Label it at the nurse's station from memory","Discard the specimen and recollect with proper labeling","Send it unlabeled with a note attached","Ask a coworker to label it for you"],a:1,e:"An unlabeled specimen must be discarded and recollected. Labeling must happen at the bedside with two patient identifiers, time, date, and collector initials. Mislabeled specimens can lead to dangerous errors."},
  {q:"You discover a chemical spill on the floor of the exam room. What's your FIRST action?",choices:["Clean it up with paper towels immediately","Put on appropriate PPE before cleaning","Call the fire department","Leave the room and lock the door"],a:1,e:"Always put on appropriate PPE (gloves, gown, face protection if needed) before cleaning any spill. Then use the proper disinfectant per your office's exposure control plan. OSHA requires PPE for spill response."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Clinical mastery achieved!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
