<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Heart &amp; Vascular System — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Heart &amp; Vascular System — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A patient's EKG shows an absent P wave and an irregular rhythm. Based on your A&P knowledge, which part of the conduction system is likely not functioning properly?",choices:["The Purkinje fibers","The Bundle of His","The SA node — the P wave represents atrial depolarization it initiates","The aortic valve"],a:2,e:"The P wave on an EKG represents atrial depolarization, which is initiated by the SA node. An absent P wave suggests the SA node is not firing properly, so the atria aren't contracting in a coordinated way."},
  {q:"You're preparing a patient for an echocardiogram. The patient asks what the test will show. What is the best explanation?",choices:["It measures the electrical activity of your heart","It uses sound waves to create images of your heart's structure and how it pumps","It takes X-ray images of your blood vessels","It measures your blood oxygen levels"],a:1,e:"An echocardiogram uses ultrasound (sound waves) to visualize the heart's chambers, valves, and pumping function in real time. An EKG measures electrical activity, and angiography images blood vessels."},
  {q:"A patient complains of leg swelling and you notice their veins appear distended. Based on vascular anatomy, what mechanism may be failing?",choices:["The arterial walls are too thick","The one-way valves in the veins may be failing, allowing blood to pool","The capillaries are exchanging too much oxygen","The SA node is sending impulses too slowly"],a:1,e:"Veins contain one-way valves that prevent backflow. When these valves fail (venous insufficiency), blood pools in the legs due to gravity, causing swelling and visible distended veins (varicose veins)."},
  {q:"A provider mentions a patient has atherosclerosis. Based on your cardiovascular knowledge, which blood vessels are affected and how?",choices:["Veins become inflamed and clot","Capillaries widen and leak fluid","Arteries have plaque buildup that narrows them and restricts blood flow","The heart valves calcify and stop opening"],a:2,e:"Atherosclerosis is the buildup of fatty deposits (plaque) inside artery walls. This narrows the arteries, restricts blood flow, and can lead to serious complications like heart attacks and strokes."},
  {q:"A patient is diagnosed with a myocardial infarction (heart attack). Which blood vessels supply the heart muscle itself with oxygen?",choices:["The pulmonary arteries","The vena cavae","The coronary arteries — blockage here causes heart attacks","The carotid arteries"],a:2,e:"The coronary arteries supply oxygen-rich blood to the heart muscle (myocardium). A myocardial infarction occurs when a coronary artery becomes blocked, cutting off blood supply and causing heart tissue to die."},
  {q:"While reviewing a patient's chart, you see 'DVT' noted in the history. What cardiovascular condition does this refer to?",choices:["Dilated Ventricular Tachycardia","Deep Vein Thrombosis — a blood clot in a deep vein, usually in the leg","Decreased Vascular Tension","Diastolic Valve Thickening"],a:1,e:"DVT stands for Deep Vein Thrombosis — a blood clot that forms in a deep vein, most commonly in the legs. It's dangerous because the clot can break loose and travel to the lungs (pulmonary embolism)."},
  {q:"A patient has a blood pressure reading of 180/110. The provider says this is hypertension. Which part of the vascular system is under excessive pressure?",choices:["The veins returning blood to the heart","The capillary beds in the lungs","The arteries — high pressure in arteries defines hypertension","The heart's conduction system"],a:2,e:"Blood pressure measures the force of blood against arterial walls. Hypertension (high blood pressure) means the arteries are under excessive pressure, which over time can damage vessel walls and lead to heart disease, stroke, or kidney damage."},
  {q:"You're assisting with a patient who needs an angiography. What does this diagnostic procedure visualize?",choices:["The heart's electrical conduction pathway","The inside of blood vessels using dye and imaging to detect blockages","The tissue layers of the heart wall","The oxygen levels in different blood vessels"],a:1,e:"Angiography involves injecting contrast dye into blood vessels and using imaging (usually X-ray) to visualize the inside of arteries and veins. It detects blockages, narrowing, and other vascular abnormalities."},
  {q:"A patient asks why the left ventricle wall is thicker than the right ventricle. What is the anatomical reason?",choices:["The left ventricle pumps blood to the lungs, which requires more force","The left ventricle pumps blood to the entire body through systemic circulation, requiring more force","The right ventricle doesn't pump blood — it only receives it","There is no difference in wall thickness"],a:1,e:"The left ventricle has a thicker muscular wall because it must generate enough pressure to pump blood through the entire systemic circulation to all organs and tissues. The right ventricle only pumps to the nearby lungs, requiring less force."},
  {q:"During patient intake, you notice the patient has swollen ankles and shortness of breath. These could be signs of which cardiovascular condition?",choices:["Atherosclerosis only","Heart failure — the heart can't pump blood efficiently","A normal response to exercise","An overactive SA node"],a:1,e:"Heart failure means the heart can't pump blood efficiently enough to meet the body's needs. Fluid backs up in the lungs (causing shortness of breath) and in the extremities (causing edema/swelling), especially in the ankles and legs."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent clinical thinking!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
