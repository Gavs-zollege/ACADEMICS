<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Patient Interviews &amp; Telehealth — Multiple Choice</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}
  .wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}
  .header{text-align:center;margin-bottom:8px;flex-shrink:0;}
  h1{font-size:24px;color:var(--gold);}
  .sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}
  .game-area{flex:1;display:flex;flex-direction:column;min-height:0;}
  .steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}
  .step{height:6px;border-radius:3px;transition:all .3s;}
  .sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}
  .sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}
  .st{font-size:13px;line-height:1.45;padding-right:26px;}
  .opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}
  .opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}
  .opt:hover{border-color:var(--gold);transform:scale(1.02);}
  .opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}
  .fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}
  .fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}
  .fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}
  .nw{text-align:center;flex-shrink:0;}
  .bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}
  .results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}
  .rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}
  .rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}
  .br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Multiple Choice</h1><p class="sub">Select the best answer for each question.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"What is the first thing an MA should do before beginning a patient interview?",choices:["Start asking about symptoms immediately","Check the EHR for outstanding orders or test results","Take the patient's blood pressure","Call the provider into the room"],a:1,e:"Reviewing the EHR before the interview ensures you're aware of pending orders, results, and the visit's purpose — setting you up for a thorough interaction."},
  {q:"How many patient identifiers should be used to verify a patient's identity?",choices:["1","2","3","None — just use their chart"],a:1,e:"Two patient identifiers (such as name and date of birth) are required to confirm the correct patient and prevent medical errors."},
  {q:"What is the 'chief complaint' in a patient interview?",choices:["The provider's diagnosis","The main reason the patient is visiting today","A list of all the patient's medications","The patient's insurance information"],a:1,e:"The chief complaint is the primary symptom or reason that brought the patient in. It guides the entire visit and is documented in the patient's own words."},
  {q:"Which type of question is best for documenting the chief complaint?",choices:["Closed yes/no questions","Leading questions","Open-ended questions","Multiple choice questions"],a:2,e:"Open-ended questions like 'What are your symptoms?' and 'What brings you in today?' allow patients to describe their concerns in detail."},
  {q:"Which of the following is NOT typically part of a medical history update?",choices:["Allergies","Current medications","The patient's favorite food","Family history"],a:2,e:"Medical history updates include allergies, current medications (RX, OTC, vitamins), surgical history, family history, and social history."},
  {q:"What screening tools might an MA administer during a patient interview?",choices:["GAD-7, PHQ-9, Fall Risk, MMSE","X-rays and MRIs","Blood draws and cultures","Surgical consent forms"],a:0,e:"Screening tools like GAD-7 (anxiety), PHQ-9 (depression), Fall Risk assessments, and MMSE (cognitive) are commonly administered by MAs during interviews."},
  {q:"What is a key limitation of telehealth visits compared to in-person visits?",choices:["You can't verify patient identity","No physical exams or procedures can be performed","You can't document in the EHR","Screenings cannot be conducted"],a:1,e:"Telehealth's main limitation is the inability to perform hands-on physical exams or procedures. MAs adapt by collecting self-reported data like home BP and weight."},
  {q:"When starting a telehealth visit, when should the MA call the patient?",choices:["After the appointment time","10-15 minutes before the appointment","The day before only","Only if the patient calls first"],a:1,e:"Per clinic protocol, MAs typically call 10-15 minutes before the scheduled appointment to prepare the patient and begin the interview process."},
  {q:"How should an MA conclude a telehealth visit?",choices:["Hang up immediately after the provider finishes","Provide follow-up guidance and let the patient disconnect first","Skip documentation since it was virtual","Transfer the call without explanation"],a:1,e:"Professional closure includes following provider instructions, providing follow-up guidance, ending the call courteously, and allowing the patient to disconnect first."},
  {q:"Why is dialogue more important than a checklist approach during patient interviews?",choices:["It takes less time","It builds rapport and captures more accurate, detailed information","It avoids the need for documentation","Patients prefer not answering questions"],a:1,e:"Dialogue fosters trust and encourages patients to share important details they might not offer with simple yes/no checklist questions, improving care quality."},
];
let idx=0,answer=null,score=0;
const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent work!":pct>=60?"Good effort — review what you missed.":"Keep studying the material!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
