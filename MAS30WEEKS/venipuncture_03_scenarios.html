<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Routine Venipuncture — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Routine Venipuncture & Capillary Collection — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"You are about to draw blood from a patient. You check their wristband and it says 'Jane Smith, DOB 04/15/1982.' You ask the patient to state their name and they say 'Jane Smith.' Is this sufficient identification?",choices:["Yes — the name matches the wristband","No — you need two identifiers; ask for their date of birth as well","Yes — one identifier is enough for routine draws","No — you should check their insurance card instead"],a:1,e:"You must verify identity with TWO identifiers. The patient stated their name (one identifier), but you still need a second — such as date of birth. Ask them to state their DOB and confirm it matches the wristband before proceeding."},
  {q:"You've positioned your patient, applied the tourniquet, and located a vein. As you prepare to insert the needle, the patient pulls their arm away and says 'I changed my mind — I don't want the blood draw.' What do you do?",choices:["Explain the test is important and proceed anyway","Hold their arm firmly and insert quickly","Respect their decision, document the refusal, and notify the provider","Ask a coworker to hold the patient's arm"],a:2,e:"A patient has the right to refuse any procedure. You must respect their decision, document the refusal in the chart, and notify the ordering provider. Forcing a procedure violates patient rights and ethical standards."},
  {q:"You're collecting multiple tubes from a patient. After filling the light blue top tube, you need to fill a gold/SST tube next. However, you accidentally reach for a lavender tube. What's the concern?",choices:["No concern — tube order doesn't matter","Additive carryover could contaminate the gold tube and affect results","The lavender tube will be underfilled","The needle will clog"],a:1,e:"The order of draw exists to prevent additive carryover between tubes. Drawing a lavender (EDTA) tube before the gold/SST could transfer EDTA into the SST tube, potentially affecting chemistry results. Always follow the correct order: blood cultures → light blue → red → gold/SST → green → lavender → gray."},
  {q:"You're performing a heel stick on a 3-month-old infant for newborn screening. The baby's foot feels cold. What should you do before puncturing?",choices:["Puncture immediately — warming wastes time","Warm the site with a warm cloth or heel warmer for a few minutes","Switch to a fingertip puncture instead","Use a larger lancet to get more blood flow"],a:1,e:"Cold extremities produce poor blood flow, leading to inadequate specimens and the need for repeated sticks. Warming the heel with a warm cloth or commercial heel warmer for a few minutes increases blood flow and ensures a better capillary specimen."},
  {q:"During a venipuncture, you notice the patient is becoming pale, sweating, and says they feel dizzy. You've already filled two of four required tubes. What's your next action?",choices:["Quickly fill the remaining two tubes before they faint","Stop the procedure, remove the needle, apply pressure, and lower their head","Tell the patient to take deep breaths while you continue","Call for help but keep drawing"],a:1,e:"These are signs of syncope (fainting). Patient safety always comes first. Stop the procedure immediately, remove the needle, apply pressure to the site, and lower the patient's head. You can recollect the remaining tubes after the patient has recovered."},
  {q:"You've completed a blood draw and removed the needle. The patient asks if they can leave immediately because they're in a hurry. What should you do?",choices:["Let them go — the draw is finished","Ask them to wait briefly while you observe for complications and ensure bleeding has stopped","Tell them to come back if there's a problem","Have them sign a waiver and leave"],a:1,e:"Post-collection care requires observing the patient briefly before dismissal. You need to ensure bleeding has stopped, apply a bandage, and instruct the patient to keep the site clean and dry. Rushing dismissal risks complications like hematoma or continued bleeding."},
  {q:"A nervous patient tells you they always faint during blood draws and asks to lie down. You're in a chair-only draw station. How should you handle this?",choices:["Tell them to tough it out — it'll be quick","Proceed in the chair but have them look away","Find a location where the patient can lie down, or recline the chair if possible","Skip the draw and tell them to come back another day"],a:2,e:"Patient safety and comfort are priorities. For patients with a history of syncope, having them lie down significantly reduces fainting risk. Find a bed or reclining chair. Using a calm tone and explaining each step also helps reduce anxiety, as the lecture emphasizes."},
  {q:"You accidentally stick yourself with a contaminated needle after completing a blood draw. What should you do?",choices:["Wash the area and continue working — it happens sometimes","Immediately wash the site, report the incident, and follow your facility's exposure protocol","Put on a new pair of gloves and ignore it","Apply hand sanitizer to the wound"],a:1,e:"A needlestick is a serious exposure incident. You must immediately wash the wound with soap and water, report the incident to your supervisor, and follow your facility's bloodborne pathogen exposure protocol. This may include baseline testing and follow-up. Never ignore a needlestick."},
  {q:"You're about to draw blood and notice the sharps container next to your station is three-quarters full. Should you proceed?",choices:["Yes — it's not completely full yet","No — replace it; sharps containers should be replaced when three-quarters full","Yes — just be careful when disposing the needle","No — only use brand new sharps containers"],a:1,e:"Sharps containers should be replaced when they reach the three-quarters full line. Overfilled containers increase the risk of needlestick injuries when disposing of sharps. Replace it before proceeding with the draw. Safety compliance prevents injuries."},
  {q:"The lab reports that your patient's specimen is hemolyzed and needs to be recollected. The patient is frustrated about being stuck again. How do you handle this?",choices:["Blame the lab for being too picky","Apologize sincerely, explain that the sample needs to be recollected for accurate results, and use careful technique","Tell them it's not your fault and draw again quickly","Have someone else do the redraw so you don't have to face the patient"],a:1,e:"Professionalism means taking responsibility and communicating clearly. Apologize for the inconvenience, explain that hemolysis affects result accuracy and a new sample ensures proper diagnosis. Use careful technique — avoid shaking tubes, use proper needle gauge, and draw smoothly to prevent hemolysis this time."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent clinical thinking!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
