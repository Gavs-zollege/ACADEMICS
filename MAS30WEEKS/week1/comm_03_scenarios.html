<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Communication Essentials — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}
  .wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}
  .header{text-align:center;margin-bottom:8px;flex-shrink:0;}
  h1{font-size:24px;color:var(--gold);}
  .sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}
  .game-area{flex:1;display:flex;flex-direction:column;min-height:0;}
  .steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}
  .step{height:6px;border-radius:3px;transition:all .3s;}
  .sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}
  .sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}
  .scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}
  .st{font-size:13px;line-height:1.4;padding-right:26px;}
  .opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}
  .opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}
  .opt:hover{border-color:var(--gold);transform:scale(1.02);}
  .opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}
  .fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}
  .fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}
  .fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}
  .nw{text-align:center;flex-shrink:0;}
  .bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}
  .results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}
  .rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}
  .rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}
  .br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Read each scenario and choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A patient seems anxious but says 'I'm fine' when asked. Their arms are crossed and they avoid eye contact. What should you do?",choices:["Take their word for it and move on","Gently acknowledge their body language and offer to talk","Ignore the nonverbal cues — words matter more","Tell them they don't look fine"],a:1,e:"Nonverbal cues often reveal more than words. Gently acknowledging what you observe shows empathy and opens the door for honest communication."},
  {q:"You're taking a health history and need detailed information about a patient's symptoms. Which question is best?",choices:["Do you have a headache?","Are you in pain — yes or no?","Can you describe what you've been experiencing?","Is it your stomach?"],a:2,e:"Open questions like 'Can you describe...' encourage patients to share detailed, thoughtful responses rather than simple yes/no answers."},
  {q:"A patient who is hard of hearing arrives for their appointment. How should you communicate with them?",choices:["Shout from the hallway","Face them directly, speak clearly, and offer written materials","Speak faster so the appointment doesn't run long","Ask a family member to relay all information"],a:1,e:"Facing the patient, speaking clearly, and providing written materials are appropriate adaptations for patients with hearing impairments."},
  {q:"You answer a phone call from a patient who is upset about a long wait for results. What's the best approach?",choices:["Put them on hold immediately","Listen calmly, acknowledge their frustration, and provide a clear next step","Tell them to call back when they've calmed down","Transfer them without explanation"],a:1,e:"Professional phone etiquette means staying calm, validating their concern, and guiding them toward a resolution with politeness and clarity."},
  {q:"A grieving family member in the waiting room starts crying after receiving bad news. What should you do?",choices:["Pretend you didn't notice","Offer a quiet, empathetic presence and ask if they need anything","Tell them to stop crying because it's a public space","Immediately start explaining the next medical steps"],a:1,e:"End-of-life and grief situations call for empathetic presence. Offering quiet support and asking what they need respects their emotional state."},
  {q:"During a patient interview, you realize you've been doing most of the talking. What should you adjust?",choices:["Keep talking — you're the professional","Pause, ask open questions, and practice active listening","Switch to only closed questions","End the interview early"],a:1,e:"Effective patient interviews require a balance. Pausing to ask open questions and actively listening ensures the patient feels heard."},
  {q:"A coworker sends you a patient message with several spelling errors and unclear instructions. What do you do?",choices:["Forward it to the patient as-is","Clarify with the coworker and ensure the message is clear before sending","Ignore the errors — the patient will figure it out","Rewrite it entirely without consulting them"],a:1,e:"Clear, accurate written communication is a mark of professionalism. Clarifying with the author ensures the patient receives correct information."},
  {q:"You notice a patient from a different culture seems uncomfortable with direct eye contact during your conversation. How do you respond?",choices:["Insist on eye contact — it shows respect","Adapt your approach and be mindful of cultural communication differences","Assume they're being rude","Stop talking to them entirely"],a:1,e:"Cultural differences affect communication norms. Adapting your approach shows respect and helps build trust with diverse patients."},
  {q:"You're feeling extremely stressed after a difficult shift and your next patient is asking a lot of questions. What do you do?",choices:["Snap at them to hurry up","Take a brief breath, manage your stress, and respond with patience","Tell them you're too busy for questions","Rush through answers without listening"],a:1,e:"Stress management is crucial for effective communication. Taking a moment to reset allows you to remain patient, clear, and empathetic."},
  {q:"A patient asks you to explain their diagnosis but you know the physician hasn't discussed it yet. What's the best response?",choices:["Explain the diagnosis yourself to save time","Let them know the physician will discuss it, and offer to note their questions","Refuse to say anything and walk away","Make up a simplified explanation"],a:1,e:"Communicating within your scope while supporting the patient shows professionalism. Noting their questions helps the physician address concerns."},
];
let idx=0,answer=null,score=0;
const letters=['A','B','C','D'];
function render(){
  const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});
  document.getElementById('steps').innerHTML=sh;
  document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;
  if(answer===null){
    let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});
    document.getElementById('opts').innerHTML=oh;
    document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';
  }
}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;
  const btns=document.getElementById('opts').children;
  for(let i=0;i<btns.length;i++){
    btns[i].style.cursor='default';btns[i].onclick=null;
    if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}
    else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}
    else{btns[i].style.opacity='.4';}
  }
  const fb=document.getElementById('fba');fb.style.display='block';
  fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;
  document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';
}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';
  const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';
  const msg=pct>=80?"Excellent communication skills!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";
  r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
