<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Eye & Ear Procedures — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Eye &amp; Ear Procedures — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A patient comes in for a visual acuity test. They're wearing glasses. How do you proceed?",choices:["Test only without glasses","Test only with glasses","Test each eye separately, then both — with and without corrective lenses","Have them remove glasses and squint"],a:2,e:"Visual acuity is tested each eye separately and then both together, with and without corrective lenses. This gives the provider a complete picture of the patient's vision."},
  {q:"You're preparing to irrigate a patient's ear but notice in the chart they have a history of a ruptured eardrum. What do you do?",choices:["Proceed carefully with lower pressure","Stop and inform the provider before proceeding","Use ear drops instead of irrigation","Irrigate the other ear only"],a:1,e:"Ear irrigation is contraindicated in patients with a ruptured tympanic membrane. Always review the patient history and notify the provider before proceeding."},
  {q:"While administering eye drops, the dropper tip accidentally touches the patient's eyelash. What should you do?",choices:["Continue — eyelashes are not contaminated","Wipe the tip with alcohol and continue","Discard the dropper and use a new sterile one","Rinse the tip with saline and continue"],a:2,e:"Once the dropper tip contacts any surface, it is considered contaminated. A new sterile dropper must be used to prevent introducing bacteria into the eye."},
  {q:"A patient reports sudden hearing loss in one ear and dizziness after ear irrigation. What's your immediate action?",choices:["Continue irrigation more gently","Stop irrigation immediately and notify the provider","Give the patient water and wait","Document and schedule a follow-up"],a:1,e:"Sudden hearing loss and dizziness during ear irrigation are warning signs of possible tympanic membrane damage or caloric response. Stop immediately and alert the provider."},
  {q:"You're testing a patient's visual acuity and they can't read the largest letter on the Snellen chart from 20 feet. What do you do?",choices:["Record the result as 20/200 and move on","Move the patient closer until they can read the top line and document the distance","Tell them they need glasses","Skip the test and refer to ophthalmology"],a:1,e:"If the patient can't read the largest letter at 20 feet, move them closer and document the distance at which they can read it (e.g., 10/200). This provides useful clinical data."},
  {q:"A provider orders ear drops for a patient. The patient is sitting upright. How should you position them?",choices:["Keep them upright — position doesn't matter","Have them lie down with the affected ear facing up","Have them tilt their head back","Have them lie face down"],a:1,e:"The patient should lie on their side with the affected ear facing upward so the drops can travel into the ear canal by gravity. They should remain in this position for 2–5 minutes."},
  {q:"During an audiometry test, the patient keeps responding even when no tone is played. How do you handle this?",choices:["Record all responses as valid","Reinstruct the patient to respond only when they hear a tone","End the test — results are invalid","Increase the volume for all tones"],a:1,e:"False-positive responses require reinstructing the patient. Clearly explain they should only respond when they actually hear a tone, then restart that portion of the test."},
  {q:"You need to perform eye irrigation on a patient who got a chemical splash. Which direction should the solution flow?",choices:["From outer to inner corner of the eye","From the inner canthus to the outer canthus","Directly onto the pupil","It doesn't matter — just flush quickly"],a:1,e:"Solution should flow from the inner canthus (near the nose) to the outer canthus to prevent contaminating the other eye and the nasolacrimal duct."},
  {q:"A patient asks if they can use the same bottle of eye drops for both eyes. What do you advise?",choices:["Yes — it's the same person, so cross-contamination isn't a concern","No — if one eye is infected, using the same bottle can spread infection to the other eye","Only if the drops are preservative-free","Only if they wash the tip between eyes"],a:1,e:"If one eye is infected, using the same dropper can transfer pathogens to the healthy eye. Separate bottles should be used, or the provider should give specific instructions."},
  {q:"After an ear irrigation, you notice the patient's ear canal is red and the patient reports pain. What do you do?",choices:["Apply more irrigation to soothe the area","Document the findings and report to the provider immediately","Tell the patient it's normal and will pass","Apply ear drops to reduce redness"],a:1,e:"Redness and pain after irrigation may indicate irritation or injury to the ear canal. Document the patient's response and report findings to the provider for evaluation."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent clinical judgment!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
