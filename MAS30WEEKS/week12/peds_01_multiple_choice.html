<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pediatric Office Practices — Multiple Choice</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:30px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:14px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:12px;color:var(--dim);font-family:'Geologica',sans-serif;}.st{font-size:16px;line-height:1.45;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:15px;border-radius:8px;padding:9px 11px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:26px;height:26px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:14px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:14px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:9px 30px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:15px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:16px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:11px 34px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Multiple Choice</h1><p class="sub">Pediatric Office Practices — Select the best answer.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"What is the preferred injection site for an infant receiving an immunization?",choices:["Deltoid muscle","Dorsogluteal","Vastus lateralis","Ventrogluteal"],a:2,e:"The vastus lateralis (outer thigh) is the preferred IM injection site for infants because it is the most developed muscle at that age and provides safe, effective absorption."},
  {q:"How should an infant's pulse be measured?",choices:["Radial pulse for 30 seconds","Apical pulse with a stethoscope","Carotid pulse for 15 seconds","Brachial pulse by palpation"],a:1,e:"Infants should have an apical pulse taken using a stethoscope placed on the chest at the left midclavicular line for a full 60 seconds, as peripheral pulses can be difficult to palpate."},
  {q:"Until what age should head circumference be measured at well-child visits?",choices:["6 months","12 months","Age 3","Age 5"],a:2,e:"Head circumference is routinely measured until age 3 to monitor brain growth and detect conditions like microcephaly or hydrocephalus early."},
  {q:"Which developmental screening tool is commonly used in pediatric offices?",choices:["Snellen chart","Glasgow Coma Scale","Ages and Stages Questionnaire (ASQ)","Mini-Mental State Exam"],a:2,e:"The ASQ is a parent-completed questionnaire used to screen developmental milestones in children. The Denver II is another common tool used in pediatric settings."},
  {q:"What must be documented when administering a pediatric vaccine?",choices:["Only the vaccine name","Vaccine name, lot number, expiration date, site, and route","Just the date given","The brand name only"],a:1,e:"Complete vaccine documentation includes the vaccine name, manufacturer, lot number, expiration date, dose, injection site, route, date administered, and the person who gave it."},
  {q:"Which of the following is a legal requirement when treating pediatric patients?",choices:["The child must give verbal consent","Parent or legal guardian consent is required","Consent is only needed for surgery","No consent is needed for routine care"],a:1,e:"Minors cannot legally consent to their own medical care in most situations. A parent or legal guardian must provide informed consent before treatment or procedures."},
  {q:"How should respirations be counted in an infant?",choices:["Watch the chest rise and fall","Count abdominal movements","Ask the parent to count","Use a pulse oximeter only"],a:1,e:"Infants are abdominal breathers, so respirations are counted by observing the rise and fall of the abdomen rather than the chest."},
  {q:"What is the correct blood pressure cuff requirement for a pediatric patient?",choices:["Use an adult cuff — it works for all ages","Use a pediatric-sized cuff appropriate for the child's arm","Blood pressure isn't taken on children","Any cuff size is acceptable"],a:1,e:"A properly sized pediatric cuff must be used — the bladder should cover 80% of the arm circumference. An incorrect size will produce inaccurate readings."},
  {q:"Which common pediatric screening uses a fingerstick?",choices:["Vision screening","Audiometry","Lead and hemoglobin testing","Developmental screening"],a:2,e:"Lead and hemoglobin levels are tested via fingerstick capillary blood draw. These screenings help detect lead poisoning and anemia, which are common pediatric concerns."},
  {q:"What should the MA do if they suspect child abuse during a visit?",choices:["Discuss it with the parent directly","Document observations and report to the provider","Ignore it unless the child says something","Call the police immediately without telling anyone"],a:1,e:"Medical assistants are mandatory reporters. They should document objective observations and report concerns to the provider, who will follow mandatory reporting protocols."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent work!":pct>=60?"Good effort — review what you missed.":"Keep studying the material!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
