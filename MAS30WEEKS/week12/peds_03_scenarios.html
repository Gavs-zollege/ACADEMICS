<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pediatric Office Practices — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:30px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:14px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:12px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:16px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:15px;border-radius:8px;padding:9px 11px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:26px;height:26px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:14px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:14px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:9px 30px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:15px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:16px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:11px 34px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Pediatric Office Practices — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A 4-month-old infant is due for vaccinations. The parent asks where the injection will be given. What do you tell them?",choices:["In the baby's arm (deltoid)","In the baby's outer thigh (vastus lateralis)","In the baby's buttock","Wherever is easiest to reach"],a:1,e:"The vastus lateralis (outer thigh) is the recommended IM injection site for infants. The muscle is well-developed at this age and provides safe, effective absorption."},
  {q:"You're taking vitals on a 2-month-old. The baby is crying and fussy. How do you count respirations?",choices:["Wait until the baby stops crying, then observe abdominal movement","Count chest movements while the baby cries","Skip respirations — they can't be counted accurately on infants","Ask the parent what the baby's normal rate is"],a:0,e:"Crying alters respiratory rate. Wait until the infant is calm, then count abdominal movements for a full 60 seconds to get an accurate respiratory rate."},
  {q:"A parent brings in their 2-year-old for a well-child visit. The child is screaming and clinging to the parent. What's your approach?",choices:["Take the child from the parent to begin the exam quickly","Use a calm, friendly tone and allow the child to stay with the parent","Tell the child to stop crying — it won't hurt","Ignore the child and speak only to the parent"],a:1,e:"Young children often experience separation anxiety. Use a calm voice, allow the child to stay with the caregiver, and use distraction techniques like toys or visual aids."},
  {q:"You need to measure the weight of a 6-month-old infant. What method do you use?",choices:["Have the parent hold the baby on a standing scale","Use an infant scale with the baby undressed","Estimate based on age","Use a standing scale with shoes removed"],a:1,e:"Infants should be weighed on a dedicated infant scale, undressed (or in a clean diaper only), to get an accurate weight for growth chart plotting."},
  {q:"A child's growth measurements fall below the 5th percentile on the CDC growth chart. What should you do?",choices:["Tell the parent the child is underweight","Document the findings and alert the provider","Recommend a diet plan to the parent","Reweigh the child and change the result"],a:1,e:"Measurements outside the normal range should be accurately documented and reported to the provider. The MA should not diagnose or recommend treatment plans."},
  {q:"You're preparing to give a 5-year-old an injection. The child looks scared. What's the best approach?",choices:["Just do it quickly before they know what happened","Explain what will happen in simple, honest terms and offer distraction","Tell them it won't hurt at all","Have someone hold the child down without explanation"],a:1,e:"Honest, age-appropriate communication builds trust. Explain the procedure simply, offer distraction (counting, a toy), and praise the child's cooperation afterward."},
  {q:"A 10-year-old arrives for a checkup. The parent mentions the child hasn't had any vaccines. What is your role?",choices:["Lecture the parent about the importance of vaccines","Document the parent's concern and inform the provider about the immunization status","Refuse to see the patient","Administer catch-up vaccines without an order"],a:1,e:"The MA documents the immunization history, informs the provider, and respects the parent's rights. The provider will discuss catch-up scheduling and consent."},
  {q:"While collecting history, a mother mentions her toddler has been running a fever and has a rash. What should you consider?",choices:["It's probably nothing — toddlers get rashes all the time","This could be a communicable illness — follow infection control protocols and alert the provider","Give the child Tylenol immediately","Send the family home and tell them to come back when the rash clears"],a:1,e:"Fever with rash can indicate communicable illness (measles, chickenpox, etc.). Follow infection control protocols, isolate if necessary, and alert the provider immediately."},
  {q:"You need to take the blood pressure of a 7-year-old but only an adult cuff is available. What do you do?",choices:["Use the adult cuff — it's close enough","Do not take the BP; locate a pediatric cuff first","Skip blood pressure entirely","Wrap the adult cuff twice around the arm"],a:1,e:"An improperly sized cuff produces inaccurate readings. You must locate the correct pediatric-sized cuff before attempting to measure blood pressure."},
  {q:"After giving an immunization, a child develops hives and difficulty breathing within minutes. What do you do?",choices:["Tell the parent to monitor at home","Recognize this as a possible anaphylactic reaction — alert the provider and follow emergency protocols immediately","Give another dose of vaccine to counteract the reaction","Apply a cold compress and wait"],a:1,e:"Hives and difficulty breathing post-vaccination indicate a possible allergic/anaphylactic reaction. Alert the provider immediately, prepare emergency equipment (EpiPen, oxygen), and follow office emergency protocols."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent pediatric care knowledge!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
