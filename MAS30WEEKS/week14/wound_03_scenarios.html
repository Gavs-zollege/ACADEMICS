<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wound Care — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Wound Care — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A patient comes in with a small, clean cut on their forearm. The provider asks you to close it with Steri-Strips. What's the correct application?",choices:["Place strips parallel to the wound","Clean and dry the wound, approximate edges, apply strips perpendicular to the wound","Apply strips directly over the scab without cleaning","Use Steri-Strips only if the wound is still bleeding heavily"],a:1,e:"Steri-Strips are applied perpendicular to the wound after cleaning and drying. The wound edges are gently brought together before placing the strips to hold them closed."},
  {q:"You're preparing to clean a wound and notice the sterile gauze packaging is slightly torn. What do you do?",choices:["Use it anyway — a small tear doesn't matter","Discard it and open a new sterile package","Tape the tear closed and proceed","Ask the patient if they mind"],a:1,e:"Any breach in sterile packaging means the item is contaminated. Discard it immediately and use a new, intact sterile package to prevent wound infection."},
  {q:"A patient presents 10 days after having sutures placed on their chin. The provider orders suture removal. You notice redness and pus around two of the sutures. What should you do?",choices:["Remove all sutures as ordered","Stop and notify the provider about the signs of infection before proceeding","Remove only the infected sutures","Clean the area and proceed with removal"],a:1,e:"Signs of infection (redness, pus) must be reported to the provider before suture removal. The provider may want to culture the site, prescribe antibiotics, or modify the plan."},
  {q:"While assessing a wound, you notice thick, green drainage with a foul odor. How do you document this?",choices:["\"Wound looks fine\"","\"Purulent drainage noted with foul odor\"","\"Some drainage present\"","\"Wound is infected\" (your diagnosis)"],a:1,e:"Document objective findings: purulent drainage with foul odor. MAs describe what they observe — they do not diagnose. The provider makes the clinical determination."},
  {q:"A patient asks if they can use butterfly bandages instead of getting sutures for a deep cut on their knee. What do you explain?",choices:["Sure — butterfly closures work on any wound","Butterfly closures aren't appropriate for deep wounds or areas with high tension like joints; the provider will determine the best closure","Just use super glue instead","It depends on the patient's preference only"],a:1,e:"Deep wounds over joints need stronger closure methods. Butterfly closures can't withstand the tension from movement and are only for small, superficial, low-tension wounds."},
  {q:"You're setting up supplies for a wound care procedure. What supplies should you prepare?",choices:["Just gloves and a bandage","Sterile gloves, gauze, saline, antiseptic, appropriate dressing, and tape","Whatever is closest in the supply room","Only what the patient brings from home"],a:1,e:"Proper wound care setup includes sterile gloves, gauze pads, saline or approved cleanser, antiseptic (if ordered), appropriate dressings, and adhesive tape — all checked for sterility."},
  {q:"A patient returns for staple removal. You begin using the staple remover and the patient reports significant pain. What do you do?",choices:["Tell them to tough it out — it's almost done","Stop, assess the situation, and notify the provider","Continue quickly to get it over with","Apply ice and keep removing"],a:1,e:"Significant pain during staple removal could indicate the wound hasn't healed adequately or there's an underlying issue. Stop the procedure and notify the provider."},
  {q:"You're educating a patient about home wound care after a laceration repair. What key instructions should you include?",choices:["Keep the wound uncovered and let air get to it","Keep the wound clean and dry, change dressings as directed, watch for infection signs, don't pick at it, and return for follow-up","Just leave the bandage on until the follow-up visit","Soak the wound in water daily to keep it clean"],a:1,e:"Proper home care instructions include keeping the wound clean and dry, changing dressings as instructed, monitoring for infection signs, avoiding picking/scratching, and returning for follow-up."},
  {q:"During wound cleaning, you accidentally touch the sterile gauze to the edge of the non-sterile tray. What should you do?",choices:["Continue — brief contact is acceptable","Discard the gauze and use a new sterile piece","Wipe it with alcohol and continue","It's fine as long as the patient doesn't notice"],a:1,e:"Once sterile supplies contact a non-sterile surface, they're contaminated. Discard and replace to maintain aseptic technique and prevent wound infection."},
  {q:"A patient's wound from 2 weeks ago shows no improvement — the edges aren't closing and there's no granulation tissue. What phase of healing might be impaired?",choices:["Inflammatory phase","Proliferative phase","Maturation phase","The wound is healing normally"],a:1,e:"The proliferative phase (3–24 days) is when granulation tissue forms and wound edges begin contracting. Lack of progress at 2 weeks suggests this phase may be impaired — report to the provider."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent wound care knowledge!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
