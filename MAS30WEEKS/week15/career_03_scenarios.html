<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Readiness — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Career Readiness — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"An interviewer asks: 'Tell me about yourself.' How should you respond?",choices:["Share your entire life story starting from childhood","Give a brief professional summary highlighting your MA training, skills, and career goals","Say 'I don't know what to say' and wait","Talk about your hobbies and favorite shows"],a:1,e:"Keep it professional and concise. Summarize your education, relevant skills, and why you're excited about the MA role — not personal details unrelated to the job."},
  {q:"You realize you have a typo on your resume the morning of your interview. What do you do?",choices:["Ignore it — no one will notice","Correct it, reprint, and bring the updated version","Cross it out with pen during the interview","Cancel the interview until it's perfect"],a:1,e:"Fix and reprint immediately. Typos can signal carelessness to employers. Always proofread your resume multiple times and have someone else review it too."},
  {q:"The interviewer asks: 'What is your greatest weakness?' What's the best approach?",choices:["Say you have no weaknesses","Mention a genuine area for growth and explain what you're doing to improve","Say you're a perfectionist — interviewers love that","Refuse to answer the question"],a:1,e:"The best approach is honesty with a growth mindset. Share a real area you're working on and the specific steps you're taking to improve — it shows self-awareness."},
  {q:"You're writing your career objective for an externship application. Which is the strongest option?",choices:["'I need an externship to graduate.'","'Motivated MA student seeking an externship to apply clinical and administrative skills in a patient-centered environment.'","'Looking for any job available.'","'I want to work somewhere nice.'"],a:1,e:"A strong objective is specific, professional, and shows what you bring. It should mention your training, skills, and the type of environment you want to contribute to."},
  {q:"During an interview, the interviewer asks about a time you dealt with a difficult situation. How do you structure your answer?",choices:["Just say 'I handle things well' without an example","Use the STAR method: describe the Situation, your Task, the Action you took, and the Result","Make up a dramatic story to impress them","Say you've never had a difficult situation"],a:1,e:"The STAR method provides structure. A specific, real example with a clear situation, your role, what you did, and the positive outcome is far more convincing than a vague answer."},
  {q:"You finished your interview and felt it went well. The next day, what should you do?",choices:["Wait for them to contact you — don't seem too eager","Send a brief, polite thank-you email expressing appreciation and interest","Call every hour to check on the decision","Send a long email recapping everything you said"],a:1,e:"A short thank-you email within 24 hours is professional and expected. Thank them for their time, mention something specific from the conversation, and restate your interest."},
  {q:"You're applying for an MA position that emphasizes phlebotomy and EKGs. How should you tailor your resume?",choices:["Use the same generic resume for every application","Highlight phlebotomy and EKG skills prominently in your skills section","Remove those skills since they're too specific","Only list administrative skills"],a:1,e:"Always tailor your resume to match the job description. If the role emphasizes specific clinical skills, make sure those are prominently featured in your skills section."},
  {q:"On interview day, you realize you forgot to bring a copy of your resume. What's the best move?",choices:["Apologize and ask if they have one on file","Wing it and hope they don't ask","Cancel the interview","Tell them resumes are outdated"],a:0,e:"Politely acknowledge it and ask if they have a copy. In the future, always bring multiple copies. Forgetting your resume is a common mistake to avoid — but staying calm matters most."},
  {q:"An interviewer asks: 'Why did you choose to become a Medical Assistant?' What type of answer are they looking for?",choices:["'Because it was the shortest program available'","A genuine answer showing passion for patient care, healthcare, and helping others","'My parents told me to'","'I couldn't get into nursing school'"],a:1,e:"Employers want to hear genuine motivation — your passion for patient care, interest in healthcare, desire to help others, or a personal experience that inspired you."},
  {q:"You're preparing for your first externship interview. Which combination of preparation steps is best?",choices:["Just show up and be yourself — no prep needed","Research the site, practice common questions, prepare your outfit, and bring resume and certifications","Only practice your handshake","Read their website once and that's enough"],a:1,e:"Thorough preparation includes researching the facility, practicing interview questions (including STAR answers), choosing professional attire, and bringing your resume and certifications."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"You're interview ready!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
