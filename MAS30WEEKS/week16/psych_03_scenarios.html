<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychology in Medical Assisting — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Psychology in Medical Assisting — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A patient in the waiting room is visibly shaking, speaking rapidly, and appears very anxious about an upcoming blood draw. How should you respond?",choices:["Tell them to calm down — it's not a big deal","Ignore them and call them back when it's their turn","Speak calmly, explain the procedure clearly, and allow time for questions","Tell them they can leave if they're too scared"],a:2,e:"Patients with anxiety need calm reassurance. Speak slowly, explain what will happen step by step, and allow them to ask questions. Never dismiss or minimize their fears."},
  {q:"A patient recently diagnosed with a chronic illness seems withdrawn, avoids eye contact, and has low energy. What should you do?",choices:["Diagnose them with depression and recommend therapy","Observe and document the behaviors objectively, then report to the provider","Tell them to cheer up because it could be worse","Ignore it — they're probably just tired"],a:1,e:"These may be signs of depression. Your role is to observe objectively, document what you see (flat affect, low energy, poor eye contact), and report to the provider. Never diagnose."},
  {q:"A teenager comes in for a check-up and asks that their parent not be in the room. The parent insists on staying. What's the best approach?",choices:["Always side with the parent — they're in charge","Tell the teen their feelings don't matter","Respect the teen's need for privacy while involving the provider to navigate the situation","Force the parent to leave immediately"],a:2,e:"Adolescents have psychological needs for privacy and autonomy. Work with the provider to balance the teen's needs with parental involvement — it's about respect and trust."},
  {q:"A coworker tells you private details about a patient's mental health treatment in the break room. What do you do?",choices:["Listen and share what you know too","Politely remind them that mental health information is protected by HIPAA","Ignore it — what happens in the break room stays there","Post about it on social media anonymously"],a:1,e:"Mental health information is protected under HIPAA. Politely remind your coworker that sharing patient information outside of clinical need is a violation of patient privacy and facility policy."},
  {q:"You're caring for an elderly patient who just lost their spouse. The patient is angry and snapping at you. How should you respond?",choices:["Snap back — you don't deserve to be treated that way","Understand that anger is a stage of grief, remain calm, and listen without judgment","Tell them their anger is inappropriate","Refuse to continue caring for them"],a:1,e:"Anger is one of the five stages of grief. The patient is processing loss. Stay calm, listen without judgment, and maintain professional boundaries while showing empathy."},
  {q:"You've been feeling emotionally drained, losing empathy for patients, and dreading coming to work. What's the best response?",choices:["Push through it — everyone feels this way","Recognize these as signs of burnout and seek support, practice self-care, and set healthy boundaries","Quit your job immediately","Take your frustration out on difficult patients"],a:1,e:"These are classic signs of burnout: emotional exhaustion, reduced empathy, and decreased satisfaction. Address it through self-care, time management, seeking support, and setting healthy boundaries."},
  {q:"A patient from a different cultural background refuses a treatment you know is standard care. What do you do?",choices:["Force them to comply — doctor knows best","Respect their beliefs, try to understand their perspective, and communicate concerns to the provider","Argue with them until they agree","Document that the patient is being difficult"],a:1,e:"Cultural competence means respecting diversity and understanding that beliefs influence healthcare decisions. Avoid assumptions, listen respectfully, and involve the provider in finding a solution."},
  {q:"A patient tells you they don't understand what medication they're supposed to take or why. You've already explained it once. What should you do?",choices:["Repeat the exact same explanation louder","Assess their readiness to learn, adapt your explanation style, and check understanding","Tell them to just read the paperwork at home","Say it's not your problem — they should ask the doctor"],a:1,e:"Patient education requires assessing readiness to learn and adapting your style. Use simpler language, visual aids, or teach-back methods. Reinforcing understanding is a key part of compliance."},
  {q:"During a busy shift, a patient starts crying in the exam room and says they feel overwhelmed by their diagnosis. What should you do?",choices:["Tell them you're too busy right now and they need to compose themselves","Listen empathetically, validate their feelings, and maintain professional boundaries","Start crying with them to show solidarity","Leave the room immediately and pretend it didn't happen"],a:1,e:"Use therapeutic communication: listen actively, validate their emotions, and show empathy. Maintain professional boundaries — be supportive without oversharing or making it about yourself."},
  {q:"You suspect a patient may be experiencing substance misuse based on their behavior and appearance. What is the appropriate action?",choices:["Confront the patient directly and accuse them","Document your objective observations and report to the provider","Ignore it — it's not your concern","Tell other staff members about your suspicion in the hallway"],a:1,e:"Document observable behaviors objectively (slurred speech, unsteady gait, etc.) and report to the provider. Never confront, accuse, or gossip. Substance use disorders affect safety and treatment outcomes."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent clinical judgment!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
