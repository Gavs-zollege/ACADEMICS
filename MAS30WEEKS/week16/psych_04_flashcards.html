<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Psychology in Medical Assisting — Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:16px 20px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:12px;flex-shrink:0;}h1{font-size:26px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:12px;margin-top:4px;}.card-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;}.counter{font-family:'Geologica',sans-serif;font-size:12px;color:var(--dim);margin-bottom:12px;}.flip-container{width:100%;max-width:460px;height:260px;perspective:1000px;cursor:pointer;margin-bottom:20px;}.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}.flip-container.flipped .flip-inner{transform:rotateY(180deg);}.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;border:1px solid var(--border);}.card-front{background:var(--card);}.card-front .label{font-family:'Geologica',sans-serif;font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600;}.card-front .term{font-size:22px;line-height:1.4;font-weight:600;}.card-front .hint{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);margin-top:16px;}.card-back{background:var(--surface);transform:rotateY(180deg);}.card-back .label{font-family:'Geologica',sans-serif;font-size:10px;color:var(--success);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600;}.card-back .definition{font-family:'Geologica',sans-serif;font-size:14px;line-height:1.55;color:var(--text);font-weight:400;}.nav{display:flex;gap:12px;align-items:center;flex-shrink:0;}.nav-btn{padding:10px 28px;border-radius:8px;border:none;font-size:13px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;transition:all .2s;}.nav-btn:hover{transform:scale(1.04);}.prev-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);}.next-btn{background:var(--gold);color:var(--bg);}.progress{display:flex;gap:4px;justify-content:center;margin-bottom:14px;flex-shrink:0;}.dot{width:8px;height:8px;border-radius:50%;transition:all .3s;}.shuffle-btn{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);background:none;border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;margin-top:14px;transition:all .2s;}.shuffle-btn:hover{border-color:var(--gold);color:var(--gold);}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Flashcards</h1><p class="sub">Psychology in Medical Assisting — Tap the card to reveal the answer.</p></div>
  <div class="card-area">
    <div class="counter" id="counter"></div>
    <div class="progress" id="progress"></div>
    <div class="flip-container" id="flipCard" onclick="flipCard()">
      <div class="flip-inner" id="flipInner">
        <div class="card-face card-front" id="front"></div>
        <div class="card-face card-back" id="back"></div>
      </div>
    </div>
    <div class="nav">
      <button class="nav-btn prev-btn" onclick="prev()">← Back</button>
      <button class="nav-btn next-btn" onclick="nextCard()">Next →</button>
    </div>
    <button class="shuffle-btn" onclick="shuffle()">⟳ Shuffle Cards</button>
  </div>
</div>
<script>
const CARDS=[
  {t:"Psychology",d:"The scientific study of thoughts, emotions, and behavior. In healthcare, it focuses on how patients respond to stress, illness, and change."},
  {t:"Psychiatry",d:"A medical specialty that diagnoses mental health disorders and prescribes medications. Unlike psychology, it is a branch of medicine."},
  {t:"Maslow's Hierarchy of Needs",d:"A five-level model: physiological needs, safety, love/belonging, esteem, and self-actualization. Lower needs must be met before higher ones."},
  {t:"Therapeutic Communication",d:"Purposeful communication focused on patient needs. Includes active listening, open-ended questions, clarification, empathy, and validation."},
  {t:"Non-Therapeutic Communication",d:"Communication that blocks trust: giving unsolicited advice, judging, criticizing, interrupting, or changing the subject."},
  {t:"Active Listening",d:"Fully focusing on the patient's words, body language, and emotions. Involves eye contact, nodding, and reflecting back what they said."},
  {t:"Stages of Grief (Kübler-Ross)",d:"Five stages: Denial, Anger, Bargaining, Depression, Acceptance. Not everyone experiences all stages or in this order."},
  {t:"Anxiety Disorders",d:"Conditions involving excessive worry or fear that may interfere with daily activities. Common in healthcare settings, often triggered by procedures or results."},
  {t:"Depression",d:"A common mental health disorder involving flat or sad affect, low energy, poor eye contact, and changes in sleep or appetite. Often linked to chronic illness."},
  {t:"Emotional Intelligence (EI)",d:"The ability to recognize and manage your own emotions and respond to others. Includes self-awareness, self-regulation, empathy, and social skills."},
  {t:"Burnout",d:"A state of emotional exhaustion, reduced empathy, and decreased job satisfaction caused by prolonged workplace stress. Prevented through self-care and boundaries."},
  {t:"Cultural Competence",d:"Understanding and respecting diversity in patients' cultural beliefs, health practices, and values. Avoid assumptions and stereotypes."},
  {t:"Trauma-Informed Care",d:"An approach that recognizes the impact of trauma on patients, promotes safety and trust, and avoids actions that could re-traumatize."},
  {t:"Professional Boundaries",d:"Ethical limits in the MA-patient relationship. Be supportive but not personal, avoid oversharing, and maintain ethical standards."},
  {t:"Nonverbal Communication",d:"Messages conveyed without words: facial expressions, body posture, eye contact, gestures, and personal space awareness."},
  {t:"Perception of Illness",d:"How a patient interprets their illness — influenced by culture, beliefs, and past experiences. Fear and misunderstanding can reduce compliance."},
  {t:"Patient Compliance",d:"A patient's willingness to follow treatment plans. Influenced by trust, understanding, education, and the quality of the provider-patient relationship."},
  {t:"HIPAA and Mental Health",d:"Mental health information is protected under HIPAA. It can only be shared with authorized individuals, and facility policies must be followed strictly."},
  {t:"Conflict Resolution",d:"Handling disagreements professionally: stay calm, listen actively, seek solutions collaboratively, and involve a supervisor if needed."},
  {t:"Documentation of Behavior",d:"Recording patient behavior using objective language. Describe what you observed without personal opinions or diagnostic labels."},
];
let cards=[...CARDS],idx=0,flipped=false;
function render(){document.getElementById('counter').textContent=`Card ${idx+1} of ${cards.length}`;let ph='';cards.forEach((_,i)=>{const bg=i===idx?'var(--gold)':'var(--border)';ph+=`<div class="dot" style="background:${bg}"></div>`;});document.getElementById('progress').innerHTML=ph;const c=cards[idx];document.getElementById('front').innerHTML=`<div class="label">Term</div><div class="term">${c.t}</div><div class="hint">Tap to reveal</div>`;document.getElementById('back').innerHTML=`<div class="label">Definition</div><div class="definition">${c.d}</div>`;if(flipped)document.getElementById('flipCard').classList.add('flipped');else document.getElementById('flipCard').classList.remove('flipped');}
function flipCard(){flipped=!flipped;if(flipped)document.getElementById('flipCard').classList.add('flipped');else document.getElementById('flipCard').classList.remove('flipped');}
function nextCard(){flipped=false;idx=(idx+1)%cards.length;render();}
function prev(){flipped=false;idx=(idx-1+cards.length)%cards.length;render();}
function shuffle(){flipped=false;for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}idx=0;render();}
render();
</script>
</body>
</html>
