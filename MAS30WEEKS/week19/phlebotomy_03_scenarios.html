<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Phlebotomist — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">The Professional Phlebotomist — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A patient appears very anxious and says they're scared of needles. What is the best approach?",choices:["Tell them to toughen up — it will be over quickly","Explain the procedure calmly, use active listening, and reassure them throughout","Skip the draw and tell the doctor the patient refused","Ask a coworker to hold the patient down"],a:1,e:"Good bedside manner includes explaining procedures calmly, active listening, responding to patient anxiety, and maintaining clear, professional interaction. Compassion and empathy are key traits of a phlebotomist."},
  {q:"You accidentally stick yourself with a used needle while disposing of it. What should you do first?",choices:["Wash the area and continue working — report it at the end of your shift","Immediately tell your supervisor and follow post-exposure protocols","Keep it to yourself to avoid getting in trouble","Apply a bandage and hope for the best"],a:1,e:"You must report injuries immediately to your supervisor. Post-exposure protocols include filing incident reports and getting medical follow-up right away. Delays can compromise treatment effectiveness."},
  {q:"A coworker asks you to share a patient's lab results because they're curious about the case. What do you do?",choices:["Share the results — they work in healthcare too","Politely decline and explain that HIPAA prohibits sharing patient info without authorization","Post the results on the department board so everyone can learn","Tell them to ask the patient directly"],a:1,e:"HIPAA requires you to protect patient information and only access records when necessary for your own job duties. You should never share patient info without proper permission, even with coworkers."},
  {q:"You realize you forgot to label a specimen tube immediately after the draw. The patient has already left. What should you do?",choices:["Label it from memory — you remember the patient","Discard the specimen and arrange for a redraw","Ask another phlebotomist to label it for you","Send it to the lab unlabeled and attach a note"],a:1,e:"An unlabeled or improperly labeled specimen cannot be used — it risks misidentification. The correct action is to discard it and arrange for a new draw. Accurate labeling at the bedside is essential for patient safety."},
  {q:"You notice the sharps container at your station is nearly full. A patient is waiting for a draw. What do you do?",choices:["Overfill the container — one more needle won't hurt","Replace the sharps container before performing the draw","Use a regular trash can for the needle just this once","Push the needle deeper into the full container"],a:1,e:"Sharps containers should never be overfilled. They should be replaced when they reach the fill line. Using a regular trash can or overfilling creates serious needlestick injury risks for you and others."},
  {q:"A patient tells you they have the right to refuse the blood draw. How should you respond?",choices:["Inform them that refusing is not an option once the doctor orders a test","Respect their right to refuse, document it, and notify the ordering provider","Draw the blood anyway while they're distracted","Tell them they'll be discharged from the hospital if they refuse"],a:1,e:"Patients have the ethical and legal right to refuse any procedure, including blood draws. The phlebotomist should respect this right, document the refusal accurately, and inform the ordering provider."},
  {q:"You're about to draw blood and realize the requisition form has a different patient name than the person in front of you. What do you do?",choices:["Draw the blood anyway — it's probably just a clerical error","Stop the procedure, verify the patient's identity, and resolve the discrepancy before proceeding","Cross out the wrong name and write in the correct one","Ask the patient to confirm they are the name on the form"],a:1,e:"Patient identity verification is critical. You must stop and resolve any discrepancies before proceeding. Double-checking requisition forms for correct patient info and ordered tests is a key compliance protocol."},
  {q:"A new coworker is about to recap a used needle. What should you do?",choices:["Mind your own business — they'll learn eventually","Politely stop them and remind them to never recap needles, then show proper disposal","Help them recap it more safely using one hand","Report them to HR immediately without saying anything"],a:1,e:"Never recapping needles is a critical safety rule. Recapping can lead to accidental needlestick injuries. The best response is to intervene politely, educate your coworker, and demonstrate proper sharps disposal."},
  {q:"You made an error during a blood draw — you missed the vein and had to restick. How should you document this?",choices:["Don't mention it — only document successful draws","Note the difficult draw and missed vein in the patient's record","Change the records to show only one successful stick","Ask the patient not to mention it to anyone"],a:1,e:"Accurate recordkeeping requires you to document all procedures, including any issues like difficult draws, missed veins, or patient reactions. You should only chart what you actually did — never falsify or omit information."},
  {q:"You overhear a fellow phlebotomist discussing a patient's HIV test results in the cafeteria. What is the appropriate action?",choices:["Join the conversation — it's an interesting case","Privately remind them that discussing patient information in public areas violates HIPAA","Ignore it — it's not your responsibility","Post about the situation on social media to raise awareness"],a:1,e:"Discussing patient information in public areas is a HIPAA violation. The appropriate action is to privately remind your colleague about patient confidentiality. Violations can result in fines, legal action, and loss of certification."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent clinical thinking!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
