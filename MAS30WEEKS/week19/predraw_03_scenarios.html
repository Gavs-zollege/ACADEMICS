<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before the Draw — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Before the Draw — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"You enter a patient's room and ask, 'Are you Mrs. Johnson?' The patient nods yes. However, the wristband says a different name. What should you do?",choices:["Proceed — the patient confirmed the name","Stop the procedure, re-verify identity using two identifiers, and resolve the discrepancy","Draw the blood and fix the paperwork later","Ask the nurse to sort it out after the draw"],a:1,e:"You must stop immediately and re-verify the patient's identity. Patients may answer 'yes' to the wrong name due to confusion, hearing issues, or language barriers. Always ask the patient to state their own name and DOB."},
  {q:"You're about to draw blood and notice the collection tubes on your tray expired last month. The patient is ready and waiting. What do you do?",choices:["Use the expired tubes — they're probably still fine","Apologize to the patient, discard the expired tubes, and get unexpired ones before proceeding","Draw with the expired tubes and make a note on the requisition","Ask the patient if they mind expired tubes"],a:1,e:"Expired tubes may have degraded additives that compromise specimen quality and test accuracy. Always check expiration dates and replace expired supplies before proceeding, even if it causes a brief delay."},
  {q:"You've applied the tourniquet and are having trouble finding a vein. It's been about 2 minutes. The patient looks uncomfortable. What should you do?",choices:["Keep the tourniquet on — you'll find it eventually","Release the tourniquet, wait 2 minutes, and try again","Tighten the tourniquet more for better vein visibility","Ask the patient to pump their fist rapidly and continuously"],a:1,e:"The tourniquet must not stay on longer than 1 minute. Release it, allow circulation to recover for about 2 minutes, then reapply. Never ask the patient to pump their fist excessively, as it can alter lab values."},
  {q:"A requisition says the patient needs a fasting glucose test. The patient tells you they had breakfast an hour ago. What do you do?",choices:["Draw the blood anyway — the lab can adjust for it","Inform the patient about the fasting requirement and contact the ordering provider for guidance","Skip the draw entirely without telling anyone","Tell the patient it doesn't matter"],a:1,e:"Fasting is a special requirement that affects test accuracy. You should inform the patient, document the situation, and contact the ordering provider to determine whether to proceed or reschedule the draw."},
  {q:"You've cleaned the venipuncture site with alcohol, but then the patient shifts their arm and your finger accidentally touches the clean area. What now?",choices:["Proceed — a brief touch won't cause contamination","Re-clean the site with 70% isopropyl alcohol and allow it to air dry again","Wipe the area with a dry gauze pad and continue","Blow on the area to re-sterilize it"],a:1,e:"Touching the site after cleaning contaminates it. You must re-clean with 70% isopropyl alcohol using concentric circular motions and allow the site to air dry completely before proceeding."},
  {q:"You're preparing supplies for a blood draw and realize you don't have a sharps container within arm's reach. What should you do?",choices:["Proceed and walk the used needle to a container across the room","Position a sharps container within arm's reach before starting the draw","Use a regular waste bin temporarily","Cap the needle and dispose of it later"],a:1,e:"A sharps container must be within arm's reach before beginning any blood draw. Walking with an uncapped used needle or temporarily using a regular waste bin creates serious needlestick injury risks."},
  {q:"A patient tells you they feel dizzy and lightheaded right before the draw. How should you proceed?",choices:["Draw quickly before they faint","Recline the patient or have them lie down, assess their comfort, and proceed only when they're stable","Tell them dizziness is normal and continue","Cancel the draw entirely and send them home"],a:1,e:"Patient positioning and comfort are critical safety measures. If a patient feels dizzy, recline or lay them down to prevent fainting and injury. Assess their comfort and ensure they're stable before proceeding with the draw."},
  {q:"You realize you selected a lavender-top tube, but the requisition calls for a light blue-top tube. You haven't drawn yet. What do you do?",choices:["Use the lavender tube — they're interchangeable","Replace it with the correct light blue-top tube before drawing","Draw with the lavender tube and relabel it","Mix both tube types together"],a:1,e:"Color-coded tubes contain different additives for different tests. Using the wrong tube will produce invalid results. Always verify tube selection matches the requisition before the draw. Tubes are never interchangeable."},
  {q:"You approach a patient and they appear confused, unable to state their name or DOB. No wristband is visible. What do you do?",choices:["Draw the blood based on the room number","Do not draw — verify identity through other means such as a nurse or wristband check before proceeding","Guess the identity based on the requisition schedule","Proceed and label the tube with the room number"],a:1,e:"You must never rely on room number alone. If the patient cannot state identifiers and has no wristband, do not proceed. Verify identity through nursing staff, the chart, or another reliable method before drawing."},
  {q:"You're about to start a draw and realize you forgot to perform hand hygiene. Your gloves are already on. What should you do?",choices:["The gloves are enough protection — proceed","Remove the gloves, perform hand hygiene, then put on fresh gloves","Sanitize over the gloves — it's the same thing","Proceed and wash hands after the draw instead"],a:1,e:"Hand hygiene must be performed before AND after patient contact, and before gloving. Remove the gloves, wash or sanitize your hands properly, then apply a fresh pair of gloves before touching the patient."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent clinical thinking!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
