<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Before the Draw — Match &amp; Order</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);overflow-y:auto;}.wrap{max-width:560px;margin:0 auto;padding:16px 20px;min-height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:14px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:4px;}.round-info{text-align:center;margin-bottom:10px;flex-shrink:0;}.round-title{font-family:'Geologica',sans-serif;font-size:13px;color:var(--gold);font-weight:600;}.round-desc{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);margin-top:2px;}.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;}.match-item{border:2px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'Geologica',sans-serif;font-size:11px;line-height:1.35;cursor:pointer;transition:all .2s;text-align:center;min-height:48px;display:flex;align-items:center;justify-content:center;}.match-item:hover{border-color:var(--gold);transform:scale(1.02);}.match-item.selected{border-color:var(--gold);background:rgba(226,185,76,.1);}.match-item.correct{border-color:var(--success);background:rgba(56,201,122,.1);cursor:default;}.match-item.wrong{border-color:var(--error);background:rgba(224,85,85,.1);animation:shake .4s;}.left-col{background:var(--card);color:var(--gold);font-weight:600;}.right-col{background:var(--surface);color:var(--text);font-weight:400;}@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}.score-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-family:'Geologica',sans-serif;font-size:12px;}.score-val{color:var(--gold);font-weight:600;}.matches-left{color:var(--dim);}.fb-area{min-height:36px;margin-bottom:8px;}.fb-msg{font-family:'Geologica',sans-serif;font-size:11px;padding:8px 12px;border-radius:8px;line-height:1.35;}.next-round{text-align:center;margin:12px 0;}.nr-btn{padding:10px 32px;border-radius:8px;border:none;background:var(--gold);color:var(--bg);font-size:13px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;padding:40px 0;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Match &amp; Order</h1><p class="sub">Before the Draw — Match terms with their descriptions.</p></div>
  <div id="app"></div>
</div>
<script>
const ROUNDS=[
  {title:"Round 1: Patient ID & Requisition",desc:"Match each step to its description.",pairs:[
    {term:"Two Identifiers",def:"Name and date of birth — used to verify the patient before every draw"},
    {term:"Requisition Review",def:"Verify test orders, patient info, special requirements, and correct tubes"},
    {term:"Fasting Requirement",def:"A special pre-test condition where the patient must not eat before the draw"},
    {term:"STAT Order",def:"An urgent test that must be collected and processed immediately"},
    {term:"Never Use Room Number",def:"Room assignments change — they are not reliable patient identifiers"},
  ]},
  {title:"Round 2: Site Prep & Equipment",desc:"Match each procedure to its purpose.",pairs:[
    {term:"70% Isopropyl Alcohol",def:"The solution used to cleanse the venipuncture site before the draw"},
    {term:"Concentric Circular Motion",def:"The outward-moving pattern used when cleaning the puncture site"},
    {term:"Air Dry Completely",def:"Required after cleaning — never blow, fan, or touch the site"},
    {term:"Tourniquet (3–4 inches above)",def:"Applied above the draw site to make veins more prominent"},
    {term:"Check Expiration Dates",def:"Ensures tubes and supplies have not degraded and will produce valid results"},
  ]},
  {title:"Round 3: Safety & Positioning",desc:"Match each concept to its role.",pairs:[
    {term:"Hand Hygiene",def:"Performed before and after every patient contact — required before gloving"},
    {term:"Palpation",def:"More reliable than sight — feeling for vein depth, direction, and resilience"},
    {term:"Patient Positioning",def:"Seat or recline the patient with arm supported to prevent fainting"},
    {term:"Pre-Draw Safety Check",def:"Final confirmation of identity, supplies, patient comfort, and order of draw"},
    {term:"Sharps Container Placement",def:"Must be within arm's reach before starting any blood draw procedure"},
  ]},
];
let round=0,score=0,totalPairs=0,selectedLeft=null,selectedRight=null,matched=0;
ROUNDS.forEach(r=>totalPairs+=r.pairs.length);
function shuffleArr(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function renderRound(){const r=ROUNDS[round];matched=0;selectedLeft=null;selectedRight=null;const leftItems=shuffleArr(r.pairs.map((p,i)=>({id:i,text:p.term})));const rightItems=shuffleArr(r.pairs.map((p,i)=>({id:i,text:p.def})));const app=document.getElementById('app');app.innerHTML=`<div class="round-info"><div class="round-title">${r.title}</div><div class="round-desc">${r.desc}</div></div><div class="score-bar"><span class="score-val">Score: ${score}</span><span class="matches-left" id="ml">${r.pairs.length} matches remaining</span></div><div class="match-grid" id="grid"></div><div class="fb-area" id="fba"></div>`;const grid=document.getElementById('grid');leftItems.forEach(l=>{const el=document.createElement('div');el.className='match-item left-col';el.dataset.id=l.id;el.dataset.side='left';el.textContent=l.text;el.onclick=()=>selectItem(el);grid.appendChild(el);const rel=document.createElement('div');rel.className='match-item right-col';const ri=rightItems.shift();rel.dataset.id=ri.id;rel.dataset.side='right';rel.textContent=ri.text;rel.onclick=()=>selectItem(rel);grid.appendChild(rel);});}
function selectItem(el){if(el.classList.contains('correct'))return;const side=el.dataset.side;if(side==='left'){document.querySelectorAll('.left-col.selected').forEach(e=>e.classList.remove('selected'));selectedLeft=el;el.classList.add('selected');}else{document.querySelectorAll('.right-col.selected').forEach(e=>e.classList.remove('selected'));selectedRight=el;el.classList.add('selected');}if(selectedLeft&&selectedRight)checkMatch();}
function checkMatch(){const lid=selectedLeft.dataset.id;const rid=selectedRight.dataset.id;const fb=document.getElementById('fba');if(lid===rid){selectedLeft.classList.remove('selected');selectedRight.classList.remove('selected');selectedLeft.classList.add('correct');selectedRight.classList.add('correct');selectedLeft.onclick=null;selectedRight.onclick=null;score++;matched++;document.querySelector('.score-val').textContent=`Score: ${score}`;const rem=ROUNDS[round].pairs.length-matched;document.getElementById('ml').textContent=rem>0?`${rem} matches remaining`:'All matched!';fb.innerHTML=`<div class="fb-msg" style="background:rgba(56,201,122,.06);border:1px solid rgba(56,201,122,.2);color:var(--success)">✓ Correct match!</div>`;if(matched===ROUNDS[round].pairs.length){setTimeout(()=>{if(round+1<ROUNDS.length){fb.innerHTML='';document.getElementById('app').innerHTML+=`<div class="next-round"><button class="nr-btn" onclick="nextRound()">Next Round →</button></div>`;}else{showResults();}},600);}}else{selectedLeft.classList.add('wrong');selectedRight.classList.add('wrong');fb.innerHTML=`<div class="fb-msg" style="background:rgba(224,85,85,.06);border:1px solid rgba(224,85,85,.2);color:var(--error)">✗ Not a match — try again.</div>`;setTimeout(()=>{selectedLeft.classList.remove('selected','wrong');selectedRight.classList.remove('selected','wrong');selectedLeft=null;selectedRight=null;},700);return;}selectedLeft=null;selectedRight=null;}
function nextRound(){round++;renderRound();}
function showResults(){const pct=score/totalPairs*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Outstanding pre-draw knowledge!":pct>=60?"Good work — review what tripped you up.":"Keep studying and try again!";document.getElementById('app').innerHTML=`<div class="results"><div class="rs">${score}/${totalPairs}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="resetGame()">Play Again</button></div>`;}
function resetGame(){round=0;score=0;renderRound();}
renderRound();
</script>
</body>
</html>
