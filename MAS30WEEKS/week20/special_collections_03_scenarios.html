<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Collections & Specimen Processing — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Special Collections & Specimen Processing — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A provider orders blood cultures on a patient with a high fever. The nurse tells you they're about to start IV antibiotics. What should you do?",choices:["Let the nurse start antibiotics first since they have priority","Collect the blood cultures immediately — before antibiotics are given","Wait until the antibiotics are finished, then draw the cultures","Ask the patient which they'd prefer first"],a:1,e:"Blood cultures MUST be collected before antibiotics are administered. Antibiotics in the bloodstream can kill bacteria, causing false-negative results. Communicate with the nurse that you need to draw cultures first — this is time-critical."},
  {q:"You've thoroughly cleansed the venipuncture site for a blood culture. Just before inserting the needle, you can't clearly feel the vein. What should you do?",choices:["Palpate the vein again to relocate it — accuracy matters","Do NOT re-palpate; insert based on your initial assessment or re-cleanse and start over","Ask the patient to pump their fist to make the vein more visible","Skip the blood culture and notify the provider"],a:1,e:"You must NEVER palpate after site cleansing for blood cultures. Touching the cleansed area introduces skin bacteria and risks contamination. If you can't locate the vein, you must re-cleanse the entire site before palpating again."},
  {q:"You're performing a Glucose Tolerance Test. The patient's 1-hour draw is scheduled for 9:15 AM, but you're running behind on another patient. It's now 9:20 AM. What do you do?",choices:["Draw at 9:20 — five minutes won't matter","Skip the 1-hour draw and just do the 2-hour draw","Draw immediately and document the exact time — notify the provider about the delay","Restart the entire GTT from the beginning"],a:2,e:"Exact timing is critical for GTT results. Draw immediately, document the actual time of the draw, and notify the provider about the delay. Incorrect timing can invalidate results. The prevention strategy is to prioritize timed draws and plan your schedule accordingly."},
  {q:"You're collecting a urine specimen for a workplace drug screen. The patient asks to use the restroom privately and will hand you the cup when done. Is this acceptable?",choices:["Yes — privacy is a patient right during any specimen collection","No — chain-of-custody requires the specimen to remain observed and documented continuously","Yes — as long as you label it in front of them afterward","No — but only because the restroom isn't close enough to the lab"],a:1,e:"Chain-of-custody collections for drug/alcohol screening require continuous documentation and observation. The specimen must remain in sight, sealed, and observed from collection to transport. Any break in custody invalidates the specimen for legal purposes."},
  {q:"You collect a bilirubin specimen from a newborn. A coworker offers to transport it to the lab in an open carrier. What's the problem?",choices:["Open carriers are fine for transport","Bilirubin is light-sensitive and must be protected from light during transport","The specimen needs to be frozen, not transported at room temperature","Newborn specimens don't need special handling"],a:1,e:"Bilirubin breaks down when exposed to light, producing falsely low results. The specimen must be wrapped in foil or placed in an amber tube and transported in a light-protected container. Always follow required temperature and light guidelines for specimen transport."},
  {q:"A STAT order comes in for a patient's potassium level. You have three routine draws ahead of it. How should you prioritize?",choices:["Complete the routine draws first since they were ordered earlier","Process the STAT draw immediately — it takes priority over routine orders","Add it to the end of your routine list","Wait for the provider to confirm urgency"],a:1,e:"STAT means immediately and takes priority over all routine work. Delays in STAT collections can significantly impact patient care — the provider needs those results urgently for clinical decisions. Complete the STAT draw first, then return to your routine list."},
  {q:"You've just collected blood into three tubes. You get distracted by a coworker and walk to the nurses' station to chat before labeling. What's wrong with this?",choices:["Nothing — you can label tubes at the nurses' station","The tubes should have been labeled at the bedside in front of the patient","You should have labeled them in the lab instead","The issue is the chatting, not the labeling location"],a:1,e:"Specimens must be labeled in front of the patient immediately after collection. Walking away with unlabeled tubes risks mislabeling — one of the most common and dangerous specimen collection errors. Labels must include patient name, DOB, date/time, and your initials."},
  {q:"You're running a rapid strep test (POCT) and the quality control check fails. The patient is waiting and the provider wants results quickly. What should you do?",choices:["Run the patient's test anyway — QC failures are rare and probably a fluke","Do not run the patient test; troubleshoot the QC failure, use a new kit, or send the specimen to the lab","Report the result as 'inconclusive' and let the provider decide","Skip QC and document that it was unavailable"],a:1,e:"Point-of-care tests require quality control checks, and you cannot run a patient test when QC has failed. Troubleshoot the issue, try a new test kit, or send the specimen to the lab for standard testing. Running a patient test with failed QC could produce inaccurate results."},
  {q:"A patient's blood specimen needs to be refrigerated and transported to an off-site lab. You place it on the counter and plan to pack it after lunch. What's the risk?",choices:["No risk — specimens are stable at room temperature for hours","The specimen may degrade, producing inaccurate results — transport promptly following temperature guidelines","The only risk is that someone might knock it over","Refrigerated specimens can wait up to 24 hours at room temperature"],a:1,e:"Specimens that require refrigeration must be stored and transported at the correct temperature promptly. Leaving a refrigerated specimen at room temperature allows analytes to degrade, producing inaccurate results. Follow temperature guidelines and transport specimens without delay."},
  {q:"You notice that the specimen label you printed says 'John Smith, DOB 03/15/1990' but the requisition says 'John Smith, DOB 03/15/1980.' The name matches. Should you proceed?",choices:["Yes — the name matches, and the DOB is close enough","No — the label must match the requisition exactly; correct the discrepancy before proceeding","Yes — just cross out the wrong DOB and write the correct one","No — discard the specimen and redraw entirely"],a:1,e:"Labels must match the requisition EXACTLY. A DOB discrepancy — even by one digit — could mean this is a different patient entirely. Stop, verify the correct information, print a corrected label, and ensure everything matches before the specimen leaves the bedside."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent clinical thinking!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
