<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Collections & Specimen Processing — Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:16px 20px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:12px;flex-shrink:0;}h1{font-size:26px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:12px;margin-top:4px;}.card-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;}.counter{font-family:'Geologica',sans-serif;font-size:12px;color:var(--dim);margin-bottom:12px;}.flip-container{width:100%;max-width:460px;height:260px;perspective:1000px;cursor:pointer;margin-bottom:20px;}.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}.flip-container.flipped .flip-inner{transform:rotateY(180deg);}.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;border:1px solid var(--border);}.card-front{background:var(--card);}.card-front .label{font-family:'Geologica',sans-serif;font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600;}.card-front .term{font-size:22px;line-height:1.4;font-weight:600;}.card-front .hint{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);margin-top:16px;}.card-back{background:var(--surface);transform:rotateY(180deg);}.card-back .label{font-family:'Geologica',sans-serif;font-size:10px;color:var(--success);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600;}.card-back .definition{font-family:'Geologica',sans-serif;font-size:14px;line-height:1.55;color:var(--text);font-weight:400;}.nav{display:flex;gap:12px;align-items:center;flex-shrink:0;}.nav-btn{padding:10px 28px;border-radius:8px;border:none;font-size:13px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;transition:all .2s;}.nav-btn:hover{transform:scale(1.04);}.prev-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);}.next-btn{background:var(--gold);color:var(--bg);}.progress{display:flex;gap:4px;justify-content:center;margin-bottom:14px;flex-shrink:0;}.dot{width:8px;height:8px;border-radius:50%;transition:all .3s;}.shuffle-btn{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);background:none;border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;margin-top:14px;transition:all .2s;}.shuffle-btn:hover{border-color:var(--gold);color:var(--gold);}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Flashcards</h1><p class="sub">Special Collections & Specimen Processing — Tap the card to reveal the answer.</p></div>
  <div class="card-area">
    <div class="counter" id="counter"></div>
    <div class="progress" id="progress"></div>
    <div class="flip-container" id="flipCard" onclick="flipCard()">
      <div class="flip-inner" id="flipInner">
        <div class="card-face card-front" id="front"></div>
        <div class="card-face card-back" id="back"></div>
      </div>
    </div>
    <div class="nav">
      <button class="nav-btn prev-btn" onclick="prev()">← Back</button>
      <button class="nav-btn next-btn" onclick="nextCard()">Next →</button>
    </div>
    <button class="shuffle-btn" onclick="shuffle()">⟳ Shuffle Cards</button>
  </div>
</div>
<script>
const CARDS=[
  {t:"Special Collections",d:"Collections requiring additional steps beyond routine venipuncture. Often time-sensitive, legally regulated, or contamination-prone. Used for critical diagnoses, therapy monitoring, or legal purposes."},
  {t:"Blood Cultures",d:"Used to detect bacteremia and sepsis. Must be collected BEFORE antibiotics. Require strict aseptic technique. Contamination causes false-positives and unnecessary antibiotic use."},
  {t:"Blood Culture Steps",d:"Hand hygiene → don gloves → extended scrub of site → disinfect bottle tops with alcohol → collect aerobic first, then anaerobic (straight needle) → label at bedside. Never palpate after cleansing."},
  {t:"Aerobic vs. Anaerobic Bottles",d:"With a straight needle: fill aerobic bottle first, then anaerobic. With a butterfly needle: fill anaerobic first. This prevents air from the tubing from affecting the anaerobic environment."},
  {t:"Glucose Tolerance Test (GTT)",d:"Used to diagnose diabetes and gestational diabetes. Requires fasting before initial draw. Multiple timed draws after glucose ingestion. Exact timing must be documented — incorrect timing invalidates results."},
  {t:"Timed Collections",d:"Blood draws that must occur at strictly scheduled times. Timing is critical because results depend on when the specimen was collected relative to medication, meals, or other events. Accurate time documentation is required."},
  {t:"STAT Collections",d:"Means immediately — highest priority. Requires immediate draw AND rapid transport to the lab. Delays can significantly impact patient care. STAT orders take priority over all routine work."},
  {t:"Chain-of-Custody",d:"Used for legal testing (drug/alcohol screening). Requires verified patient ID, continuous documentation from collection to transport, and specimens must remain sealed and observed. Any break invalidates the specimen."},
  {t:"Specimen Labeling",d:"Label in front of the patient at bedside. Include: patient name, DOB, date/time of collection, collector initials. Labels must match requisition exactly. Mislabeling is one of the most common errors."},
  {t:"Specimen Transport",d:"Follow temperature guidelines: room temp, refrigerated, or frozen. Protect light-sensitive specimens. Transport promptly to prevent degradation. Follow chain-of-custody rules when applicable."},
  {t:"Light-Sensitive Specimens",d:"Certain analytes (like bilirubin) degrade when exposed to light, causing falsely low results. Wrap in foil or use amber-colored containers during transport and storage."},
  {t:"Temperature-Sensitive Specimens",d:"Some specimens must be kept at room temperature, others refrigerated or frozen. Incorrect storage temperature causes analyte degradation and inaccurate results. Follow guidelines for each test."},
  {t:"Point-of-Care Testing (POCT)",d:"CLIA-waived bedside tests including glucose, hCG (pregnancy), rapid strep, and rapid flu. Require quality control checks. Results documented immediately. Follow manufacturer instructions exactly."},
  {t:"CLIA-Waived Tests",d:"Simple laboratory tests approved for point-of-care use under CLIA regulations. Despite their simplicity, they still require quality control checks and proper documentation of results."},
  {t:"Quality Control (QC)",d:"Checks performed before running patient tests to verify that testing equipment and reagents are working correctly. If QC fails, patient tests must NOT be performed until the issue is resolved."},
  {t:"Common Collection Errors",d:"Inadequate aseptic technique, incorrect timing or missed draws, improper labeling or documentation, delayed transport or incorrect storage. Prevention: slow down, verify, follow protocol."},
  {t:"Contamination Prevention",d:"For blood cultures: extended site cleansing, never re-palpate after cleaning, disinfect bottle tops. For all specimens: proper hand hygiene, clean technique, and following established protocols."},
  {t:"Error Prevention Strategy",d:"Follow protocols exactly — no shortcuts. Double-check timing, labeling, and transport. Maintain aseptic technique at all times. Communicate clearly with providers and lab staff."},
  {t:"Centrifugation",d:"The process of spinning blood specimens to separate cellular components from serum or plasma. Required for many chemistry and coagulation tests. Specimens must clot fully (if applicable) before spinning."},
  {t:"Consequences of Errors",d:"Invalid results → specimen rejection → redraws → delayed treatment → patient dissatisfaction. In legal collections, errors can invalidate evidence. In blood cultures, contamination leads to unnecessary antibiotics."},
];
let cards=[...CARDS],idx=0,flipped=false;
function render(){document.getElementById('counter').textContent=`Card ${idx+1} of ${cards.length}`;let ph='';cards.forEach((_,i)=>{const bg=i===idx?'var(--gold)':'var(--border)';ph+=`<div class="dot" style="background:${bg}"></div>`;});document.getElementById('progress').innerHTML=ph;const c=cards[idx];document.getElementById('front').innerHTML=`<div class="label">Term</div><div class="term">${c.t}</div><div class="hint">Tap to reveal</div>`;document.getElementById('back').innerHTML=`<div class="label">Definition</div><div class="definition">${c.d}</div>`;if(flipped)document.getElementById('flipCard').classList.add('flipped');else document.getElementById('flipCard').classList.remove('flipped');}
function flipCard(){flipped=!flipped;if(flipped)document.getElementById('flipCard').classList.add('flipped');else document.getElementById('flipCard').classList.remove('flipped');}
function nextCard(){flipped=false;idx=(idx+1)%cards.length;render();}
function prev(){flipped=false;idx=(idx-1+cards.length)%cards.length;render();}
function shuffle(){flipped=false;for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}idx=0;render();}
render();
</script>
</body>
</html>
