<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Processing Specimens — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Processing Specimens — Phlebotomy Responsibilities After Collection</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"You just collected a lactic acid specimen. A coworker says the ice machine is broken and suggests transporting it at room temperature. What should you do?",choices:["Transport at room temperature — a short delay won't matter","Find an alternative ice source immediately; lactic acid must be chilled in crushed ice right away","Place the specimen in the refrigerator instead","Hold the specimen until the ice machine is fixed"],a:1,e:"Lactic acid specimens must be placed in crushed ice immediately after collection. Room temperature transport causes rapid analyte degradation. Find ice from another unit, a nearby store, or an alternative source — do not delay or compromise the temperature requirement."},
  {q:"You collect a lavender top tube for a CBC and notice it's only about half full. The patient has difficult veins and you're hesitant to restick. What's the best course of action?",choices:["Send it anyway — the lab can work with less blood","Note 'short draw' on the label and send it","Recognize that underfilled anticoagulant tubes may clot; attempt to recollect properly","Add saline to the tube to increase the volume"],a:2,e:"Underfilled anticoagulant tubes have an incorrect blood-to-additive ratio, which can cause the specimen to clot and be rejected. You should attempt to recollect properly. Labeling a short draw does not fix the chemistry issue."},
  {q:"A nurse calls and says the provider needs a peak drug level drawn on a patient. She's not sure when the medication was given. How should you handle this?",choices:["Draw it now — timing doesn't matter for drug levels","Coordinate with the nurse to determine exact medication administration time before drawing","Skip the draw and tell the nurse to order it later","Draw it and let the lab figure out the timing"],a:1,e:"Peak and trough drug levels are time-sensitive draws that depend on when the medication was administered. You must coordinate with the nurse to determine the exact administration time so you draw at the correct interval. Being assertive about proper collection timing is part of your responsibility."},
  {q:"You run a glucose test on a POCT meter and get a critically low reading of 35 mg/dL. What should you do first?",choices:["Rerun the test to make sure it's accurate","Report the critical value immediately to a licensed provider","Document the result in the chart and move to your next patient","Wait for the lab to confirm the result before notifying anyone"],a:1,e:"Critical POCT values must be reported immediately to a licensed provider — patient safety depends on rapid response. Document the time of result, name of person notified, and your name/credentials. Some facilities require read-back verification for high-risk values."},
  {q:"You're preparing a chain-of-custody specimen for a workplace drug screen. The tamper-evident seal on the specimen bag is defective and won't seal properly. What do you do?",choices:["Use tape to seal the bag and initial over it","Get a new tamper-evident bag; the seal must be intact for legal validity","Send it as-is — the documentation matters more than the seal","Ask the patient to sign the defective bag as a witness"],a:1,e:"Chain of custody requires sealed tamper-evident specimen bags. A defective seal compromises the legal integrity of the specimen. Get a new bag and ensure it seals properly. Any break in security — including a defective seal — can invalidate the specimen in court."},
  {q:"The lab rejects a specimen you collected, noting 'hemolyzed — recollect.' The patient is upset about being stuck again. How do you handle this?",choices:["Tell the patient the lab made a mistake","Explain that the specimen needs to be recollected for accurate results, apologize for the inconvenience, and use careful technique","Blame the transport team for rough handling","Refuse to redraw and document the rejection"],a:1,e:"Professionalism means taking responsibility. Explain clearly that hemolysis produces inaccurate results and a new specimen ensures proper care. Apologize for the inconvenience and use careful technique to prevent hemolysis — avoid shaking tubes, use proper gauge, and draw smoothly."},
  {q:"You're scanning a specimen barcode in the LIS and notice the barcode doesn't match the patient's requisition. The patient name on both is the same. What should you do?",choices:["Send it — the name matches","Stop and investigate the discrepancy before proceeding","Re-scan it a few times to see if the system corrects itself","Cross out the barcode and write the correct MRN by hand"],a:1,e:"Always verify that specimen barcodes match both the requisition and the patient ID. A mismatched barcode — even with the same name — could mean a different patient, a system error, or a labeling mistake. Stop, investigate, and correct the issue before sending."},
  {q:"A cold agglutinin specimen arrives at your processing station. It was collected 20 minutes ago and has been sitting in the pneumatic tube system at room temperature. Is this acceptable?",choices:["Yes — 20 minutes is within acceptable limits","No — cold agglutinin specimens must be kept warm at 37°C; this specimen may be compromised","Yes — pneumatic tubes maintain adequate temperature","No — but only because it should have been frozen"],a:1,e:"Cold agglutinin specimens must be kept warm at 37°C from collection through testing. A specimen that has cooled to room temperature in the pneumatic tube system may have caused the cold-reactive antibodies to bind, producing false results. This specimen likely needs to be recollected."},
  {q:"You need to send an ABG specimen to the lab. The pneumatic tube system has a 10-minute transit time, and the lab is a 3-minute walk away. Which transport method should you choose?",choices:["Pneumatic tube — it's the standard method","Hand-deliver it; ABGs must be tested within 15–30 minutes, and the faster route matters","Either method is fine — both are under 30 minutes","Hold it until you have other specimens going to the lab"],a:1,e:"ABGs are extremely time-sensitive (15–30 minute testing window). While both methods fall within the window, hand-delivery at 3 minutes preserves more testing time than the 10-minute pneumatic system. Always choose the fastest reliable method for time-critical specimens."},
  {q:"A provider calls asking for a patient's lab results. You don't recognize the provider's voice. How should you handle this?",choices:["Read the results — they said they're a provider","Verify the provider's identity before sharing any results, per HIPAA","Ask the provider to call back later","Transfer them to the lab director"],a:1,e:"HIPAA requires you to verify provider identity before sharing patient results. Ask for their name, credentials, and callback number. Document the communication thoroughly. Protecting patient privacy is a core responsibility regardless of how urgent the request seems."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent clinical thinking!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
