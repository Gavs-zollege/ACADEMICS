<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrative Excellence Review — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Administrative Excellence Review — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"An angry patient approaches the front desk complaining about a long wait time. What should you do FIRST?",choices:["Tell them to calm down","Listen to their concern and empathize","Call the office manager immediately","Ignore them until they stop complaining"],a:1,e:"Use the LEAP method: Listen first, then Empathize, Apologize professionally, and Problem-solve. Telling a patient to calm down escalates the situation. Always keep your tone calm even if the patient is upset."},
  {q:"You're verifying insurance before a patient's appointment and the insurance company cannot confirm eligibility. What's your next step?",choices:["Cancel the appointment immediately","Tell the patient their insurance is invalid","Document the issue and inform the patient of their options","Proceed and assume coverage"],a:2,e:"Document the issue and contact the patient to discuss options — they may need to provide updated insurance information, pay out-of-pocket, or reschedule. Never assume coverage, and never cancel without communicating first."},
  {q:"A coworker asks you about a patient's diagnosis because they're curious. What should you do?",choices:["Share the information since they work at the same office","Politely decline — they're not involved in that patient's care","Check with the patient first","Share only the diagnosis, not the treatment plan"],a:1,e:"This is a HIPAA violation. Only staff directly involved in a patient's care should access their information. Politely decline and explain that sharing would violate patient privacy. Curiosity is never a valid reason to access PHI."},
  {q:"The provider is double-booked and running 45 minutes behind. A patient is upset about the delay. What should you do?",choices:["Tell them 'the doctor is always busy'","Apologize, explain the delay, and offer to reschedule or wait","Ignore the complaint — delays are normal","Ask the patient to leave and come back tomorrow"],a:1,e:"Acknowledge the delay, apologize professionally, and offer options: wait, reschedule, or see an alternative provider if available. Document the scheduling conflict in the EHR. Communication and empathy prevent escalation."},
  {q:"You notice an incorrect ICD-10 code was entered on a claim before submission. What should you do?",choices:["Submit it anyway — the insurance company will catch it","Correct the code before submitting the claim","Delete the entire claim and start over","Ignore it — coding isn't the MA's responsibility"],a:1,e:"Correct the code before submission. Submitting incorrect codes leads to claim denials, delayed payments, and potential compliance issues. Accuracy in coding ensures correct billing and reduces rework. MAs play a key role in catching errors."},
  {q:"A patient asks you to explain their bill. They don't understand why they owe money after insurance paid. What's the best approach?",choices:["Tell them to call their insurance company","Explain the deductible, copay, and coinsurance in clear language","Say 'that's just how insurance works'","Refuse to discuss financial matters"],a:1,e:"Use clear, empathetic language to explain how deductibles, copays, and coinsurance work. Offer payment plan options if available. Avoid judgment and personal opinions about fees. Financial transparency builds patient trust."},
  {q:"You receive a phone call from a patient's family member requesting test results. What do you do?",choices:["Give them the results — they're family","Ask the patient's permission or check for an authorization on file","Tell them to come into the office in person","Hang up immediately"],a:1,e:"PHI cannot be shared with family members without the patient's written authorization. Check for a signed release on file. If none exists, politely explain that you cannot share the information and suggest the patient call directly."},
  {q:"A patient's referral wasn't obtained before their specialist visit. The claim was denied. What should the MA do?",choices:["Tell the patient it's their fault","Obtain the referral retroactively if possible and resubmit","Delete the claim permanently","Ignore it — denied claims can't be fixed"],a:1,e:"Contact the referring provider to obtain a retroactive referral, then correct and resubmit the claim. Missing referrals are a common denial reason, especially with HMO plans. Always verify referral requirements during insurance verification before the visit."},
  {q:"You're checking in a patient and they hand you an expired insurance card. What's the correct action?",choices:["Accept it and proceed as normal","Ask if they have an updated card or current policy number","Turn them away from the appointment","Charge them the full self-pay rate immediately"],a:1,e:"Ask for an updated card or current policy information. You can also call the insurance company to verify active coverage. Don't turn patients away or charge full price without first attempting to verify their current coverage status."},
  {q:"A patient leaves a voicemail asking you to call back with their lab results. What should you do?",choices:["Call back and leave the results on their voicemail","Call back, verify the patient's identity, and share results only with the patient directly","Text the results to the number on file","Post the results on the patient portal without calling"],a:1,e:"Call back, verify the patient's identity using two identifiers, and share results only with the patient directly. Never leave detailed medical information on a voicemail — it could be overheard by others, violating HIPAA. The patient portal is also appropriate if the office uses one."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Administrative mastery achieved!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
