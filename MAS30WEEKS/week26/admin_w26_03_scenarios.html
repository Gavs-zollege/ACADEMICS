<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrative Skills — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">Administrative Skills for Medical Assistants — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"You're at the front desk and a new patient arrives but doesn't have their insurance card. They say they know their policy number. What should you do?",choices:["Turn them away and ask them to come back with the card","Accept the policy number, call the insurer to verify coverage, and proceed","Skip insurance verification entirely","Tell them they must pay full self-pay price"],a:1,e:"Accept the policy number and call the insurance company to verify coverage. Your goal is to help the patient be seen. Turning patients away or skipping verification should not be the first response. Always attempt to verify before taking drastic action."},
  {q:"The phones are ringing nonstop during a busy morning. A patient on hold has been waiting for 3 minutes. What do you do?",choices:["Keep them on hold until you're free","Hang up and hope they call back","Check back with them, apologize for the wait, and ask if they can continue holding","Transfer them to voicemail without telling them"],a:2,e:"Always check back with patients on hold. Apologize for the wait and ask if they'd like to continue holding or receive a callback. Never leave a caller on hold indefinitely — good phone etiquette requires periodic check-ins and clear communication."},
  {q:"A provider asks you to schedule a patient for a follow-up, but the schedule is fully booked for the next two weeks. What's the best approach?",choices:["Tell the patient there's nothing available","Double-book without telling the provider","Offer the next available slot, add them to a waitlist, and inform the provider of the delay","Schedule them with a different provider without asking"],a:2,e:"Offer the next available appointment, put the patient on a cancellation waitlist, and communicate the scheduling gap to the provider. The provider may want to adjust the timeframe or approve double-booking for medical necessity. Always keep the provider informed."},
  {q:"You notice that a coworker has left a patient's chart open on a shared computer screen in a hallway. What should you do?",choices:["Ignore it — it's not your responsibility","Close the chart or log out of the EHR and remind your coworker about HIPAA","Take a photo of the screen as evidence","Announce it loudly so everyone knows"],a:1,e:"Protect patient privacy by closing the chart or logging out of the EHR immediately. Then privately remind your coworker about HIPAA requirements for securing records. MAs must always log out of systems when stepping away and avoid leaving records visible in public areas."},
  {q:"A patient calls asking about their lab results. The provider has not yet reviewed them. What should you do?",choices:["Read the results to the patient anyway","Tell the patient the results are normal to reassure them","Explain that the provider needs to review the results first and give a timeframe for callback","Refuse to discuss anything and hang up"],a:2,e:"Lab results must be reviewed by the provider before being shared with the patient. Let the patient know the results are pending provider review and give them an estimated timeframe for a callback. Never share unreviewed results or make clinical interpretations."},
  {q:"During patient check-in, a returning patient says their address and phone number have changed. What's the correct action?",choices:["Tell them to update it themselves online later","Update the demographic information in the system immediately","Ignore it — the old info is probably fine","Write it on a sticky note for later"],a:1,e:"Update the information in the EHR immediately during check-in. Accurate demographics are essential for billing, correspondence, and emergency contact. Part of every check-in should include verifying and updating the patient's address, phone, insurance, and emergency contacts."},
  {q:"You're processing a claim and notice the diagnosis code doesn't match the procedure that was performed. What should you do?",choices:["Submit it anyway — the insurance company will figure it out","Flag the mismatch, consult with the provider or coding team, and correct before submitting","Delete the claim entirely","Change the diagnosis code yourself to something that matches"],a:1,e:"Mismatched codes are a common reason for claim denials. Flag the issue and consult with the provider or coding specialist to ensure the correct codes are used. Never change diagnosis codes without provider input, and never submit claims you know are incorrect."},
  {q:"A patient is upset because they received a bill they weren't expecting. They don't understand why they owe money after insurance paid. How should you handle this?",choices:["Tell them 'that's just how insurance works' and move on","Explain their deductible, copay, and coinsurance clearly and offer payment plan options","Refuse to discuss financial matters","Tell them to call their insurance company"],a:1,e:"Use clear, empathetic language to explain how their insurance benefits work — deductibles, copays, and coinsurance. Offer payment plan options if your office provides them. Financial transparency builds patient trust and is a key administrative responsibility."},
  {q:"You receive a fax with a referral for a patient, but the referral is missing the provider's signature. What do you do?",choices:["Accept it and file it anyway","Contact the referring office to request a completed referral with the signature","Throw it away","Tell the patient their referral was denied"],a:1,e:"An incomplete referral can cause claim denials and scheduling issues. Contact the referring office to request the missing signature. Document your follow-up. Never accept incomplete documents or discard them — always work to resolve the issue."},
  {q:"It's the end of the day and you realize that office supplies are running low — specifically printer paper and exam table paper. What's the appropriate action?",choices:["Wait until supplies completely run out before ordering","Note the low inventory and place an order or notify the person responsible","Use personal supplies from home","Ignore it — someone else will notice"],a:1,e:"Inventory management is an administrative duty. Monitor stock levels proactively, note what's running low, and either place an order or notify the designated person. Waiting until supplies run out disrupts office operations and patient care."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Administrative mastery achieved!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
