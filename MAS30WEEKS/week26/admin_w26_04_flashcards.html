<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrative Skills — Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:16px 20px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:12px;flex-shrink:0;}h1{font-size:26px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:12px;margin-top:4px;}.card-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;}.counter{font-family:'Geologica',sans-serif;font-size:12px;color:var(--dim);margin-bottom:12px;}.flip-container{width:100%;max-width:460px;height:260px;perspective:1000px;cursor:pointer;margin-bottom:20px;}.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}.flip-container.flipped .flip-inner{transform:rotateY(180deg);}.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;border:1px solid var(--border);}.card-front{background:var(--card);}.card-front .label{font-family:'Geologica',sans-serif;font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600;}.card-front .term{font-size:22px;line-height:1.4;font-weight:600;}.card-front .hint{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);margin-top:16px;}.card-back{background:var(--surface);transform:rotateY(180deg);}.card-back .label{font-family:'Geologica',sans-serif;font-size:10px;color:var(--success);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600;}.card-back .definition{font-family:'Geologica',sans-serif;font-size:14px;line-height:1.55;color:var(--text);font-weight:400;}.nav{display:flex;gap:12px;align-items:center;flex-shrink:0;}.nav-btn{padding:10px 28px;border-radius:8px;border:none;font-size:13px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;transition:all .2s;}.nav-btn:hover{transform:scale(1.04);}.prev-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);}.next-btn{background:var(--gold);color:var(--bg);}.progress{display:flex;gap:4px;justify-content:center;margin-bottom:14px;flex-shrink:0;}.dot{width:8px;height:8px;border-radius:50%;transition:all .3s;}.shuffle-btn{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);background:none;border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;margin-top:14px;transition:all .2s;}.shuffle-btn:hover{border-color:var(--gold);color:var(--gold);}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Flashcards</h1><p class="sub">Administrative Skills for Medical Assistants — Tap the card to reveal the answer.</p></div>
  <div class="card-area">
    <div class="counter" id="counter"></div>
    <div class="progress" id="progress"></div>
    <div class="flip-container" id="flipCard" onclick="flipCard()">
      <div class="flip-inner" id="flipInner">
        <div class="card-face card-front" id="front"></div>
        <div class="card-face card-back" id="back"></div>
      </div>
    </div>
    <div class="nav">
      <button class="nav-btn prev-btn" onclick="prev()">← Back</button>
      <button class="nav-btn next-btn" onclick="nextCard()">Next →</button>
    </div>
    <button class="shuffle-btn" onclick="shuffle()">⟳ Shuffle Cards</button>
  </div>
</div>
<script>
const CARDS=[
  {t:"Administrative vs Clinical Duties",d:"Administrative: scheduling, phone management, EHR documentation, billing/coding, inventory, office management. Clinical: vital signs, assisting with exams, specimen collection, procedural support. MAs may do both depending on the practice."},
  {t:"Soft Skills for MAs",d:"Excellent communication · Empathy & customer service · Time management · Professionalism · Adaptability · Teamwork. These soft skills are just as important as technical knowledge in the administrative role."},
  {t:"Hard Skills for MAs",d:"EHR/EMR proficiency · Accurate data entry · Medical terminology · Billing & coding basics · Insurance verification · Documentation skills. These are the technical competencies tested on certification exams."},
  {t:"HIPAA & Confidentiality",d:"Protect patient privacy by: securing written and electronic records · avoiding sharing info with unauthorized individuals · using private areas for phone calls · logging out of EHR systems. Violations may result in termination or legal consequences."},
  {t:"Patient Intake — Front Desk",d:"Greet patients warmly · Confirm identity (two identifiers) · Update demographics & insurance · Collect copays · Manage new patient forms · Notify clinical staff of arrivals. Accuracy here prevents downstream billing issues."},
  {t:"Phone Etiquette Standards",d:"1) Answer within 3 rings · 2) Use professional greeting (office name + your name) · 3) Verify patient identity · 4) Document all messages accurately · 5) Follow office call-routing rules. Never place on hold without asking."},
  {t:"Types of Calls MAs Handle",d:"Appointment scheduling · Medication refill requests · Provider messages · Lab results (if allowed) · Insurance questions · Emergency triage (directed to provider or 911). Document every call with time, details, and outcome."},
  {t:"Scheduling Systems",d:"Time-specified: most common, set intervals · Wave: patients seen in order of arrival · Modified wave: every 15–30 min · Cluster: group similar visits · Double-booking: only for urgent cases. Know the differences for the exam."},
  {t:"Managing Patient Flow",d:"Monitor waiting times · Communicate delays to patients · Prepare charts ahead of time · Coordinate between providers, labs, and exam rooms · Document wait times when required. Efficient flow improves patient satisfaction."},
  {t:"EHR Capabilities",d:"Document patient data · Enter orders per provider direction · Track immunizations · Update medication lists · Review lab results · Send/receive secure messages. Accuracy is essential — errors can affect patient care and billing."},
  {t:"Charting Best Practices",d:"Document immediately after action · Use correct abbreviations · Stick to facts only · Avoid personal opinions · Do not leave blanks · Correct errors properly (single line + initials + date, no white-out). EHR: addendum only, never delete."},
  {t:"Medical Records Management",d:"Chart creation · Filing and retrieval · Record audits · Release of information (ROI) procedures · Tracking referrals. Follow strict privacy and security protocols for all records — paper and electronic."},
  {t:"Insurance Terminology",d:"Deductible: pay before insurance kicks in · Copay: fixed per-visit fee · Coinsurance: % shared after deductible · Out-of-pocket max: yearly spending limit · Referral: permission to see specialist · Prior authorization: insurer approval before service."},
  {t:"Insurance Verification Process",d:"Confirm coverage · Verify effective dates · Check eligibility for specific services · Determine copay/deductible amounts · Note referrals or authorization needs. Do this BEFORE the appointment to prevent claim denials."},
  {t:"Billing & Coding Basics",d:"ICD-10: diagnosis codes (the 'why') · CPT: procedure codes (the 'what') · HCPCS: supply & medication codes · Superbills combine visit info for billing · MAs assist with claim submission and managing denials."},
  {t:"Common Coding Errors",d:"Upcoding (billing higher than performed) · Undercoding · Missing modifiers · Incorrect diagnosis codes · Mismatched provider documentation. These errors delay reimbursement and can trigger compliance issues."},
  {t:"Financial Responsibilities",d:"Copay collection · Payment posting · Issuing receipts · Explaining account balances clearly · Setting up payment plans (office-specific). Use empathy and clear language — no judgment about fees."},
  {t:"Supplies & Inventory",d:"Order office supplies · Monitor stock levels · Rotate inventory by expiration date · Check in shipments · Maintain organized storage. Proactive inventory management prevents disruptions to office operations."},
  {t:"Professionalism Standards",d:"Use a calm tone · Maintain confidentiality · Dress appropriately · Be punctual · Avoid office gossip · Show respect to patients and coworkers. Professionalism is demonstrated in every interaction."},
  {t:"Common Challenges & Solutions",d:"Angry patients → remain calm, listen, empathize · Scheduling conflicts → offer alternatives, communicate with provider · Insurance issues → double-check eligibility, assist patients · High call volume → prioritize urgent calls, document clearly."},
];
let cards=[...CARDS],idx=0,flipped=false;
function render(){document.getElementById('counter').textContent=`Card ${idx+1} of ${cards.length}`;let ph='';cards.forEach((_,i)=>{const bg=i===idx?'var(--gold)':'var(--border)';ph+=`<div class="dot" style="background:${bg}"></div>`;});document.getElementById('progress').innerHTML=ph;const c=cards[idx];document.getElementById('front').innerHTML=`<div class="label">Term</div><div class="term">${c.t}</div><div class="hint">Tap to reveal</div>`;document.getElementById('back').innerHTML=`<div class="label">Definition</div><div class="definition">${c.d}</div>`;if(flipped)document.getElementById('flipCard').classList.add('flipped');else document.getElementById('flipCard').classList.remove('flipped');}
function flipCard(){flipped=!flipped;if(flipped)document.getElementById('flipCard').classList.add('flipped');else document.getElementById('flipCard').classList.remove('flipped');}
function nextCard(){flipped=false;idx=(idx+1)%cards.length;render();}
function prev(){flipped=false;idx=(idx-1+cards.length)%cards.length;render();}
function shuffle(){flipped=false;for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}idx=0;render();}
render();
</script>
</body>
</html>
