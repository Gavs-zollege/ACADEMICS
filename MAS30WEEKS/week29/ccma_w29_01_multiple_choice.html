<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCMA Comprehensive Review — Multiple Choice</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.st{font-size:13px;line-height:1.45;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Multiple Choice</h1><p class="sub">CCMA Comprehensive Review — Select the best answer.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"A patient's blood pressure reads 188/112. What should the MA do FIRST?",choices:["Recheck in 5 minutes","Notify the provider immediately","Ask the patient to relax and recheck later","Document and continue intake"],a:1,e:"A BP above 180/110 is a hypertensive crisis. The MA must notify the provider immediately. Do not delay by rechecking or continuing routine intake — this is an urgent finding that requires immediate clinical attention."},
  {q:"Which injection angle is correct for an intradermal (ID) injection?",choices:["90 degrees","45 degrees","5–15 degrees","30 degrees"],a:2,e:"Intradermal injections are given at a 5–15° angle, just beneath the epidermis. This shallow angle is necessary to produce the characteristic wheal used in TB and allergy testing. 45° is subcutaneous; 90° is intramuscular."},
  {q:"What is the correct order of draw after blood cultures?",choices:["Lavender, green, light blue, gray","Light blue, red/gold, green, lavender, gray","Green, red/gold, lavender, light blue, gray","Red/gold, light blue, green, gray, lavender"],a:1,e:"The correct order of draw is: blood cultures → light blue → red/gold → green → lavender → gray. This order prevents cross-contamination of additives between tubes and ensures accurate test results."},
  {q:"A patient reports shortness of breath and appears cyanotic. What is the MA's immediate action?",choices:["Tell the patient to take deep breaths","Measure vital signs","Call for clinical staff/provider immediately","Offer water"],a:2,e:"Cyanosis with shortness of breath indicates a potentially life-threatening emergency. The MA must call for clinical help immediately. Do not delay with vitals or comfort measures — this patient needs urgent medical intervention."},
  {q:"Which tube additive is found in a lavender-top tube?",choices:["Sodium citrate","Heparin","EDTA","Sodium fluoride"],a:2,e:"Lavender-top tubes contain EDTA, which is the anticoagulant used for CBC (complete blood count) testing. Light blue contains sodium citrate, green contains heparin, and gray contains sodium fluoride."},
  {q:"During a telephone triage call, a patient reports chest pressure. What should the MA do?",choices:["Schedule the next available appointment","Ask them to rate the pain","Advise them to hang up and call 911","Place them on hold to ask the provider"],a:2,e:"Chest pressure is a potential cardiac emergency. The MA should advise the patient to hang up and call 911 immediately. Do not delay by scheduling, asking follow-up questions, or placing them on hold — every second matters."},
  {q:"The MA discovers the vaccine refrigerator reads 58°F. What is the FIRST action?",choices:["Adjust the thermostat","Move vaccines to the freezer","Notify the provider or clinical supervisor","Ignore unless it happens again"],a:2,e:"Vaccines must be stored at 36–46°F. A reading of 58°F indicates a storage failure. The MA must notify the provider or supervisor immediately so compromised vaccines can be assessed. Never move vaccines to the freezer or simply adjust without reporting."},
  {q:"What are the 7 Rights of Medication Administration?",choices:["Patient, drug, dose, route, time, documentation, refusal","Patient, drug, dose, route, time, reason, response","Patient, drug, dose, site, time, documentation, refusal","Patient, drug, dose, route, frequency, documentation, consent"],a:0,e:"The 7 Rights are: Right patient, Right drug, Right dose, Right route, Right time, Right documentation, and Right to refuse. These must be verified before every medication administration to ensure patient safety."},
  {q:"A patient presents with a deep laceration. What is the FIRST action by the MA?",choices:["Apply direct pressure","Clean debris from wound","Apply antibiotic ointment","Ask patient to flex the limb"],a:0,e:"For a deep laceration, the MA's first priority is to control bleeding by applying direct pressure. Cleaning and treatment come after bleeding is controlled. Safety first — hemorrhage control is the immediate concern."},
  {q:"Which procedure requires the MA to wear a face shield AND gloves at minimum?",choices:["Ear irrigation","Venipuncture","Wound irrigation","Visual acuity test"],a:2,e:"Wound irrigation creates a splash risk with blood and body fluids, requiring both a face shield and gloves. Standard venipuncture requires gloves only. Ear irrigation may need eye protection but wound irrigation has the highest splash risk."},
  {q:"When preparing for a spirometry test, the MA should instruct the patient to:",choices:["Breathe normally through the nose","Take a deep breath and exhale forcefully into the device","Hold breath for 10 seconds before exhalation","Exhale slowly through pursed lips"],a:1,e:"Spirometry requires a maximal effort: the patient takes the deepest breath possible and then exhales as hard and fast as they can into the mouthpiece. Normal breathing, breath-holding, or slow exhalation will produce inaccurate results."},
  {q:"A patient reports new swelling and redness at their injection site from yesterday. What should the MA do FIRST?",choices:["Apply ice","Document and notify the provider","Give antihistamine","Reassure patient it's normal"],a:1,e:"New swelling and redness at an injection site could indicate an adverse reaction or infection. The MA must document the findings and notify the provider. MAs do not independently treat or dismiss symptoms — report to the provider."},
  {q:"A provider asks the MA to obtain a urine specimen from a toddler. What collection method is MOST appropriate?",choices:["First morning void","Clean-catch midstream","24-hour collection","Pediatric urine collection bag"],a:3,e:"Toddlers cannot follow clean-catch instructions or cooperate with timed collections. A pediatric urine collection bag is the appropriate method for collecting urine from infants and toddlers who are not toilet trained."},
  {q:"The sharps container is completely full. What is the appropriate action?",choices:["Push contents down to make room","Remove and replace the container","Leave it for the next shift","Tape it closed and continue using it"],a:1,e:"A full sharps container must be closed, removed from service, and replaced with a new one. Never push contents down, tape it closed, or leave it overfilled — these actions create needlestick injury risks. Replace when 2/3 full."},
  {q:"An irregular pulse is detected during intake. How should the MA count it?",choices:["Count for 15 seconds and multiply by 4","Count for 30 seconds and multiply by 2","Count for a full 60 seconds","Estimate based on rhythm"],a:2,e:"When a pulse is irregular, the MA must count for a full 60 seconds to get an accurate rate. Shorter counts with multipliers are only acceptable for regular rhythms. An irregular pulse may also warrant an apical measurement."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Excellent work!":pct>=60?"Good effort — review what you missed.":"Keep studying the material!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
