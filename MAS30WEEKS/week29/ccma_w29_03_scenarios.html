<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCMA Comprehensive Review — What Would You Do?</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:10px 16px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:8px;flex-shrink:0;}h1{font-size:24px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:11px;margin-top:2px;}.game-area{flex:1;display:flex;flex-direction:column;min-height:0;}.steps{display:flex;gap:3px;justify-content:center;margin-bottom:6px;flex-shrink:0;}.step{height:6px;border-radius:3px;transition:all .3s;}.sc{background:var(--card);border-radius:10px;padding:10px 14px;border:1px solid var(--border);margin-bottom:6px;position:relative;flex-shrink:0;}.sc .num{position:absolute;top:8px;right:12px;font-size:10px;color:var(--dim);font-family:'Geologica',sans-serif;}.scenario-label{font-family:'Geologica',sans-serif;font-size:9px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:3px;font-weight:600;}.st{font-size:13px;line-height:1.4;padding-right:26px;}.opts{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;flex-shrink:0;}.opt{border:2px solid var(--border);cursor:pointer;font-family:'Geologica',sans-serif;font-weight:500;font-size:12px;border-radius:8px;padding:8px 10px;color:var(--text);background:var(--card);transition:all .2s;text-align:left;display:flex;align-items:center;gap:8px;line-height:1.3;}.opt:hover{border-color:var(--gold);transform:scale(1.02);}.opt .letter{width:22px;height:22px;border-radius:5px;background:var(--surface);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:10px;flex-shrink:0;color:var(--gold);}.fb{padding:8px 12px;border-radius:8px;margin-bottom:6px;flex-shrink:0;}.fb-t{font-family:'Geologica',sans-serif;font-size:11px;font-weight:600;margin-bottom:1px;}.fb-d{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);line-height:1.35;}.nw{text-align:center;flex-shrink:0;}.bn{padding:8px 28px;border-radius:7px;border:none;background:var(--gold);color:var(--bg);font-size:12px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}.results{text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;}.rs{font-size:48px;font-weight:700;color:var(--gold);margin:8px 0 4px;}.rm{font-size:13px;font-family:'Geologica',sans-serif;margin-bottom:20px;}.br{padding:10px 32px;border-radius:8px;border:none;background:var(--teal);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer;}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>What Would You Do?</h1><p class="sub">CCMA Comprehensive Review — Choose the best response.</p></div>
  <div class="game-area" id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="opts" id="opts"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"You're about to perform venipuncture and the tourniquet has been on for over a minute. The patient's veins look good. What should you do?",choices:["Proceed quickly since the vein is visible","Release the tourniquet, wait 2 minutes, then reapply","Leave it on — it's not a concern","Tighten it more for a better vein"],a:1,e:"A tourniquet left on longer than 1 minute causes hemoconcentration, which alters lab results. Release it, wait 2 minutes to allow blood flow to normalize, then reapply before performing the draw."},
  {q:"A patient with diabetes has a blood glucose of 48 mg/dL. They appear confused and sweaty. What is your FIRST action?",choices:["Give insulin immediately","Document the result and continue intake","Notify the provider immediately","Tell the patient to eat something and go home"],a:2,e:"A glucose of 48 mg/dL is dangerously low (hypoglycemia) — this is a medical emergency. Notify the provider immediately. Never give insulin for low blood sugar, and never send a patient home with a critical lab value."},
  {q:"You're assisting with a sterile procedure and notice your gloved hand briefly touched the edge of the sterile drape's outer 1-inch border. The provider didn't see it. What do you do?",choices:["Continue — the border is close enough to sterile","Mention it after the procedure","Stop and replace the sterile field immediately","Spray the area with antiseptic"],a:2,e:"The outer 1-inch border of a sterile drape is considered contaminated. Any contact means the field is compromised. Stop immediately and replace the entire sterile field. Always self-report — integrity protects the patient."},
  {q:"You're performing an EKG and notice the V1 electrode was placed on the wrong intercostal space. The tracing has already started. What should you do?",choices:["Finish the tracing and note the error","Move the lead and repeat the entire EKG","Leave it — it's close enough","Tell the patient the test is cancelled"],a:1,e:"Incorrect lead placement produces inaccurate readings that could lead to misdiagnosis. Correct the V1 placement to the 4th intercostal space at the right sternal border and repeat the entire EKG from the beginning."},
  {q:"A coworker is about to start a blood draw but hasn't put on gloves. The patient is already prepped. What do you do?",choices:["Ignore it — they'll be careful","Wait and mention it after the draw","Instruct them to put on gloves before starting","File a formal complaint with HR immediately"],a:2,e:"PPE is required for any procedure involving potential blood exposure. Address it immediately and professionally — tell your coworker to put on gloves before starting. Infection control cannot wait until after the procedure."},
  {q:"A patient calls asking for their lab results. You pull them up and see several abnormal values. What should you say?",choices:["Read the results and explain what's abnormal","'Don't worry, they're probably fine.'","'Your provider will review these results with you. They'll be in touch soon.'","'I can't help you with that. Goodbye.'"],a:2,e:"MAs cannot interpret or disclose abnormal lab results to patients. Direct the patient to their provider professionally and with empathy. Never dismiss their concern or be rude — maintain professionalism while staying within your scope."},
  {q:"You're administering a medication and notice the dose on the order seems much higher than what you've seen before for this drug. What should you do?",choices:["Give it — the provider wrote the order","Ask another MA if it looks right","Clarify the order with the provider before administering","Reduce the dose to what seems reasonable"],a:2,e:"If a medication order seems unusual, ALWAYS clarify with the provider before administering. MAs do not modify orders independently and should never assume an order is correct if something seems off. The 7 Rights include verifying the right dose."},
  {q:"A patient arrives for a specialist visit but their HMO insurance shows no referral on file. They insist they were told to come in. What do you do?",choices:["See the patient and worry about the referral later","Send the patient home","Call the PCP's office to obtain a referral or reschedule","Tell the patient their insurance won't cover the visit ever"],a:2,e:"HMO plans require referrals for specialist visits. Contact the PCP to obtain one. If it can't be obtained immediately, offer to reschedule. Never see the patient without authorization (the claim will be denied) and never turn them away without offering a solution."},
  {q:"A seizure patient is actively convulsing on the exam table. Staff are nearby. What is your FIRST action?",choices:["Hold the patient down to stop the seizure","Place something in their mouth to prevent biting","Protect the patient's head and clear the area of hazards","Begin CPR immediately"],a:2,e:"During a seizure, protect the patient from injury: cushion their head and clear nearby objects. Never restrain a seizing patient or put anything in their mouth. Call for help and time the seizure. CPR is not indicated during an active seizure."},
  {q:"You discover an expired vial of medication in the supply cabinet that a provider has asked you to administer. What do you do?",choices:["Use it — it probably still works","Administer half the dose to be safe","Discard the expired vial and obtain a new one","Give it and document the expiration date"],a:2,e:"Expired medications must never be administered. Discard the vial properly and obtain a new, unexpired one. Administering expired medication violates the Right Drug principle of the 7 Rights and could harm the patient."},
];
let idx=0,answer=null,score=0;const letters=['A','B','C','D'];
function render(){const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?18:7;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});document.getElementById('steps').innerHTML=sh;document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="scenario-label">Scenario</div><div class="st">${q.q}</div>`;if(answer===null){let oh='';q.choices.forEach((c,i)=>{oh+=`<button class="opt" onclick="pick(${i})"><span class="letter">${letters[i]}</span>${c}</button>`;});document.getElementById('opts').innerHTML=oh;document.getElementById('opts').style.display='flex';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';}}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;const btns=document.getElementById('opts').children;for(let i=0;i<btns.length;i++){btns[i].style.cursor='default';btns[i].onclick=null;if(i===q.a){btns[i].style.borderColor='var(--success)';btns[i].style.background='rgba(56,201,122,.1)';btns[i].querySelector('.letter').style.background='var(--success)';btns[i].querySelector('.letter').style.color='#fff';}else if(i===v&&!c){btns[i].style.borderColor='var(--error)';btns[i].style.background='rgba(224,85,85,.1)';btns[i].querySelector('.letter').style.background='var(--error)';btns[i].querySelector('.letter').style.color='#fff';}else{btns[i].style.opacity='.4';}}const fb=document.getElementById('fba');fb.style.display='block';fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='flex';const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';const msg=pct>=80?"Scenario mastery achieved!":pct>=60?"Good instincts — review what you missed.":"Review the material and try again!";r.innerHTML=`<div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='flex';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
