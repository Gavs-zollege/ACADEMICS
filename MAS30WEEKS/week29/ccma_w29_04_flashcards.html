<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CCMA Comprehensive Review — Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>:root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}*{margin:0;padding:0;box-sizing:border-box;}html,body{height:100%;overflow:hidden;}body{background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}.wrap{max-width:560px;margin:0 auto;padding:16px 20px;height:100%;display:flex;flex-direction:column;}.header{text-align:center;margin-bottom:12px;flex-shrink:0;}h1{font-size:26px;color:var(--gold);}.sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:12px;margin-top:4px;}.card-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;}.counter{font-family:'Geologica',sans-serif;font-size:12px;color:var(--dim);margin-bottom:12px;}.flip-container{width:100%;max-width:460px;height:260px;perspective:1000px;cursor:pointer;margin-bottom:20px;}.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;}.flip-container.flipped .flip-inner{transform:rotateY(180deg);}.card-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;text-align:center;border:1px solid var(--border);}.card-front{background:var(--card);}.card-front .label{font-family:'Geologica',sans-serif;font-size:10px;color:var(--gold);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600;}.card-front .term{font-size:22px;line-height:1.4;font-weight:600;}.card-front .hint{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);margin-top:16px;}.card-back{background:var(--surface);transform:rotateY(180deg);}.card-back .label{font-family:'Geologica',sans-serif;font-size:10px;color:var(--success);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600;}.card-back .definition{font-family:'Geologica',sans-serif;font-size:14px;line-height:1.55;color:var(--text);font-weight:400;}.nav{display:flex;gap:12px;align-items:center;flex-shrink:0;}.nav-btn{padding:10px 28px;border-radius:8px;border:none;font-size:13px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;transition:all .2s;}.nav-btn:hover{transform:scale(1.04);}.prev-btn{background:var(--surface);color:var(--text);border:1px solid var(--border);}.next-btn{background:var(--gold);color:var(--bg);}.progress{display:flex;gap:4px;justify-content:center;margin-bottom:14px;flex-shrink:0;}.dot{width:8px;height:8px;border-radius:50%;transition:all .3s;}.shuffle-btn{font-family:'Geologica',sans-serif;font-size:11px;color:var(--dim);background:none;border:1px solid var(--border);border-radius:6px;padding:6px 14px;cursor:pointer;margin-top:14px;transition:all .2s;}.shuffle-btn:hover{border-color:var(--gold);color:var(--gold);}</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Flashcards</h1><p class="sub">CCMA Comprehensive Review — Tap the card to reveal the answer.</p></div>
  <div class="card-area">
    <div class="counter" id="counter"></div>
    <div class="progress" id="progress"></div>
    <div class="flip-container" id="flipCard" onclick="flipCard()">
      <div class="flip-inner" id="flipInner">
        <div class="card-face card-front" id="front"></div>
        <div class="card-face card-back" id="back"></div>
      </div>
    </div>
    <div class="nav">
      <button class="nav-btn prev-btn" onclick="prev()">← Back</button>
      <button class="nav-btn next-btn" onclick="nextCard()">Next →</button>
    </div>
    <button class="shuffle-btn" onclick="shuffle()">⟳ Shuffle Cards</button>
  </div>
</div>
<script>
const CARDS=[
  {t:"Normal Vital Sign Ranges",d:"BP: <120/80 · Pulse: 60–100 bpm · Resp: 12–20/min · SpO₂: 95–100% · Temp: 97.6–99.6°F · Pain: 0–10 scale. Know these cold — abnormal values trigger immediate action."},
  {t:"When to Notify Provider Immediately",d:"BP >180/110 · Pulse <50 or >120 · Resp <10 or >24 · SpO₂ <90% · New confusion · Chest pain or SOB. Critical values = immediate notification, no delays."},
  {t:"Injection Angles",d:"Intradermal (ID): 5–15° · Subcutaneous (SC): 45° · Intramuscular (IM): 90°. ID must produce a wheal. SC rotates sites. IM inserts swiftly, injects slowly."},
  {t:"IM Injection Sites & Volumes",d:"Deltoid: 1 mL max · Ventrogluteal: safest site, 2–3 mL · Vastus lateralis: preferred for infants. Use Z-track technique for irritating medications."},
  {t:"Order of Draw",d:"Blood cultures → Light blue → Red/Gold → Green → Lavender → Gray. Must memorize this sequence — prevents cross-contamination of tube additives."},
  {t:"Tube Additives",d:"Lavender: EDTA (CBC) · Light blue: Sodium citrate (coag studies) · Green: Heparin (chemistry) · Gray: Sodium fluoride (glucose). Each additive serves a specific test purpose."},
  {t:"Venipuncture Steps",d:"1. Identify patient · 2. Apply tourniquet · 3. Select site · 4. Clean with alcohol · 5. Insert 15–30° · 6. Fill tubes · 7. Release tourniquet · 8. Remove needle · 9. Apply pressure · 10. Label at bedside."},
  {t:"Hemoconcentration",d:"Caused by tourniquet left on >1 minute. Falsely elevates lab values. Solution: release tourniquet, wait 2 minutes, reapply. Also caused by excessive fist pumping."},
  {t:"EKG Chest Lead Placement",d:"V1: 4th ICS, right sternal border · V2: 4th ICS, left sternal border · V3: between V2 & V4 · V4: 5th ICS, midclavicular · V5: anterior axillary · V6: midaxillary."},
  {t:"EKG Artifact Types & Fixes",d:"Wandering baseline → tighten electrodes · Somatic tremor → provide blanket · AC interference → remove electronics · Interrupted baseline → reconnect lead. Address the cause, not just the machine."},
  {t:"7 Rights of Medication Administration",d:"Right patient · Right drug · Right dose · Right route · Right time · Right documentation · Right to refuse. Verify ALL seven before every administration."},
  {t:"Insulin Administration Rules",d:"SC injection only · Rotate injection sites · Mix clear before cloudy · Do NOT shake the vial — gently roll it. Never give insulin for hypoglycemia."},
  {t:"Standard Precautions",d:"Apply to ALL patients, ALL the time. Gloves with blood/body fluids · Hand hygiene before and after · Sharps safety · PPE based on exposure risk. Not just for 'known' infections."},
  {t:"Isolation Types",d:"Contact: gloves + gown (MRSA, C. diff) · Droplet: surgical mask (flu, pertussis) · Airborne: N95 respirator (TB, measles, chickenpox). Match PPE to transmission route."},
  {t:"Sharps Container Rules",d:"Never recap needles · Use red sharps container · Replace when 2/3 full · Never push contents down · Never overfill. Overfilled containers = needlestick injury risk."},
  {t:"HIPAA Essentials",d:"Protect PHI (protected health information) · Minimum necessary rule · Lock screens when stepping away · Never discuss patients in public areas · Violations carry serious penalties."},
  {t:"Insurance & Billing Codes",d:"ICD-10: diagnosis codes · CPT: procedure codes · HCPCS: supplies & equipment. Premium = monthly cost · Copay = fixed fee · Deductible = amount before coverage kicks in."},
  {t:"Documentation Rules",d:"Be objective and timely · Single-line corrections (initial + date) · No white-out ever · EHR: addendum only · Never delete entries. If wrong chart: addendum explaining the error."},
  {t:"Specimen Labeling Requirements",d:"Patient name · DOB · Date and time of collection · Collector's initials · Test name. Label at the bedside, never pre-label tubes. Mislabeled = rejected."},
  {t:"Emergency Action Priorities",d:"Unresponsive → activate EMS · Chest pain → stay with patient, call for help · Seizure → protect head, clear area · Hypoglycemia → notify provider · Deep laceration → apply direct pressure first."},
];
let cards=[...CARDS],idx=0,flipped=false;
function render(){document.getElementById('counter').textContent=`Card ${idx+1} of ${cards.length}`;let ph='';cards.forEach((_,i)=>{const bg=i===idx?'var(--gold)':'var(--border)';ph+=`<div class="dot" style="background:${bg}"></div>`;});document.getElementById('progress').innerHTML=ph;const c=cards[idx];document.getElementById('front').innerHTML=`<div class="label">Term</div><div class="term">${c.t}</div><div class="hint">Tap to reveal</div>`;document.getElementById('back').innerHTML=`<div class="label">Answer</div><div class="definition">${c.d}</div>`;if(flipped)document.getElementById('flipCard').classList.add('flipped');else document.getElementById('flipCard').classList.remove('flipped');}
function flipCard(){flipped=!flipped;if(flipped)document.getElementById('flipCard').classList.add('flipped');else document.getElementById('flipCard').classList.remove('flipped');}
function nextCard(){flipped=false;idx=(idx+1)%cards.length;render();}
function prev(){flipped=false;idx=(idx-1+cards.length)%cards.length;render();}
function shuffle(){flipped=false;for(let i=cards.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}idx=0;render();}
render();
</script>
</body>
</html>
