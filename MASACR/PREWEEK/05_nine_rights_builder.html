<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nine Rights Builder — General Patient Care</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0d1117; --surface: #131b27; --card: #161f2e;
  --border: rgba(255,255,255,0.08); --gold: #e8b84b;
  --text: #e8eef5; --muted: #7a8fa6; --green: #4caf82; --red: #e05a5a;
}
html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; }

/* Full-viewport grid */
.page {
  height: 100vh;
  overflow: hidden;
  display: grid;
  grid-template-rows: auto auto 1fr auto;
}

/* ── ROW 1: HEADER ── */
.hdr { text-align: center; padding: 16px 20px 8px; }
.hdr h1 { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800; color: var(--gold); margin-bottom: 3px; }
.hdr p  { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
.dots  { display: flex; align-items: center; gap: 5px; justify-content: center; }
.dot   { width: 8px; height: 5px; border-radius: 3px; background: var(--border); }
.dot.a { width: 28px; background: var(--gold); }

/* ── ROW 2: TIMER ── */
.timer-row {
  display: flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 20px 8px;
}
.timer-chip { padding: 4px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); font-size: 12px; font-weight: 700; color: var(--text); }
.timer-dot  { width: 6px; height: 6px; border-radius: 50%; background: var(--green); animation: blink 1s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* ── ROW 3: MAIN BODY ── */
.body { display: flex; min-height: 0; overflow: hidden; }

/* SLOTS — 9 rows filling height */
.slots {
  flex: 1;
  display: grid;
  grid-template-rows: repeat(9, 1fr);
  gap: 5px;
  padding: 8px 10px 8px 16px;
  min-height: 0;
  overflow: hidden;
}
.slot {
  display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; padding: 6px 12px;
  transition: all 0.2s;
  min-height: 0;
}
.slot.drag-over { border-color: rgba(232,184,75,0.5); background: rgba(232,184,75,0.04); }
.slot.correct   { border-color: rgba(76,175,130,0.55); background: rgba(76,175,130,0.04); }
.slot.wrong     { border-color: rgba(224,90,90,0.55);  background: rgba(224,90,90,0.04); animation: shake 0.3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 30%{transform:translateX(-5px)} 70%{transform:translateX(5px)} }
.slot-num {
  width: 26px; height: 26px; border-radius: 7px;
  background: var(--card); border: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; color: var(--muted); flex-shrink: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
.slot.correct .slot-num { border-color: var(--green); color: var(--green); }
.slot.wrong   .slot-num { border-color: var(--red);   color: var(--red); }
.slot-inner { flex: 1; min-width: 0; }
.slot-placed { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-desc   { font-size: 11px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slot-empty  { font-size: 12px; color: var(--border); font-style: italic; }

/* CHIP BANK */
.chip-bank {
  width: 190px; flex-shrink: 0;
  background: var(--surface); border-left: 1px solid var(--border);
  display: grid;
  grid-template-rows: auto repeat(9, 1fr);
  gap: 5px;
  padding: 8px 10px;
  min-height: 0;
  overflow: hidden;
}
.bank-lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 0 4px; align-self: center; }
.chip {
  padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--card); font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 12px; font-weight: 700; color: var(--text);
  cursor: grab; user-select: none; transition: all 0.2s;
  display: flex; align-items: center;
  min-height: 0;
}
.chip:hover  { border-color: rgba(232,184,75,0.4); }
.chip.dragging { opacity: 0.35; }
.chip.used   { opacity: 0.22; border-style: dashed; pointer-events: none; }

/* ── ROW 4: BOTTOM BAR ── */
.bottom {
  background: var(--surface); border-top: 1px solid var(--border);
  padding: 10px 20px; display: flex; align-items: center; justify-content: center; gap: 12px;
}
.btn { padding: 9px 22px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; font-family: 'Plus Jakarta Sans', sans-serif; transition: all 0.2s; }
.btn-gold    { background: var(--gold); color: #0d1117; }
.btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-outline:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }

/* OVERLAY */
.overlay { position: fixed; inset: 0; background: rgba(8,12,20,0.88); z-index: 50; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.overlay.show { opacity: 1; pointer-events: all; }
.result-box { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 40px 56px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.r-big   { font-size: 50px; font-weight: 800; color: var(--gold); font-family: 'Plus Jakarta Sans', sans-serif; }
.r-title { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 18px; font-weight: 800; }
.r-time  { font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<div class="page">

  <!-- ROW 1: HEADER -->
  <div class="hdr">
    <h1>Nine Rights Builder</h1>
    <p>Drag each Right into its correct numbered slot.</p>
    <div class="dots"><div class="dot a"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  </div>

  <!-- ROW 2: TIMER -->
  <div class="timer-row">
    <div class="timer-dot"></div>
    <div class="timer-chip" id="timerChip">0:00</div>
  </div>

  <!-- ROW 3: MAIN -->
  <div class="body">
    <div class="slots" id="slots"></div>
    <div class="chip-bank" id="chipBank">
      <div class="bank-lbl">Drag to slot →</div>
      <!-- chips injected here -->
    </div>
  </div>

  <!-- ROW 4: BOTTOM -->
  <div class="bottom">
    <button class="btn btn-outline" onclick="reset()">Reset</button>
    <button class="btn btn-gold"    onclick="check()">Check Answers</button>
  </div>

</div>

<div class="overlay" id="overlay">
  <div class="result-box">
    <div class="r-big"   id="rBig"></div>
    <div class="r-title" id="rTitle"></div>
    <div class="r-time"  id="rTime"></div>
    <button class="btn btn-gold" onclick="reset()" style="margin-top:8px">Try Again</button>
  </div>
</div>

<script>
const RIGHTS=[
  {num:1,name:"Right Patient",    desc:"Two identifiers: full name and date of birth.",key:"patient"},
  {num:2,name:"Right Medication", desc:"Three-label checks: selecting, preparing, discarding.",key:"medication"},
  {num:3,name:"Right Form",       desc:"Confirm form (tablet, liquid, cream) matches order.",key:"form"},
  {num:4,name:"Right Dose",       desc:"Calculate D÷H×Q and double-check before preparing.",key:"dose"},
  {num:5,name:"Right Route",      desc:"Confirm route (oral, IM, SC, ID) matches prescription.",key:"route"},
  {num:6,name:"Right Time",       desc:"Confirm timing — with food, empty stomach, interval.",key:"time"},
  {num:7,name:"Right Technique",  desc:"Correct angle, site prep, and skin approach.",key:"technique"},
  {num:8,name:"Right Education",  desc:"Explain medication, purpose, side effects, allergies.",key:"education"},
  {num:9,name:"Right Documentation",desc:"Document AFTER administration — never before.",key:"documentation"},
];

let placements={},dragging=null,startTime=null,timerInterval=null,shuffled=[];
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function getR(k){return RIGHTS.find(r=>r.key===k)||{};}

function renderSlots(){
  document.getElementById('slots').innerHTML=RIGHTS.map(r=>`
    <div class="slot" id="slot-${r.num}" ondragover="dov(event)" ondrop="dp(event,${r.num})" ondragleave="dl(event)">
      <div class="slot-num">${r.num}</div>
      <div class="slot-inner">
        ${placements[r.num]
          ?`<div class="slot-placed">${getR(placements[r.num]).name}</div><div class="slot-desc">${r.desc}</div>`
          :`<div class="slot-empty">Drop a Right here…</div>`}
      </div>
    </div>`).join('');
}
function renderChips(){
  const bank=document.getElementById('chipBank');
  // Keep the label, replace chips
  const existingLabel=bank.querySelector('.bank-lbl');
  bank.innerHTML='';
  bank.appendChild(existingLabel);
  shuffled.forEach(k=>{
    const div=document.createElement('div');
    div.className='chip'+(Object.values(placements).includes(k.key)?' used':'');
    div.id='chip-'+k.key;
    div.draggable=true;
    div.textContent=k.name;
    div.ondragstart=()=>ds(k.key);
    div.ondragend=de;
    bank.appendChild(div);
  });
}
function ds(k){
  dragging=k;
  if(!startTime){startTime=Date.now();startTimer();}
  setTimeout(()=>{const el=document.getElementById('chip-'+k);if(el)el.classList.add('dragging');},0);
}
function de(){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('dragging'));}
function dov(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dl(e){e.currentTarget.classList.remove('drag-over');}
function dp(e,n){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(!dragging)return;
  Object.keys(placements).forEach(k=>{if(placements[k]===dragging)delete placements[k];});
  placements[n]=dragging;dragging=null;renderSlots();renderChips();
}
function check(){
  let ok=0;
  RIGHTS.forEach(r=>{
    const el=document.getElementById('slot-'+r.num);
    if(!el)return;
    el.classList.remove('correct','wrong');
    if(!placements[r.num])return;
    if(placements[r.num]===r.key){el.classList.add('correct');ok++;}
    else{el.classList.add('wrong');}
  });
  if(Object.keys(placements).length===9){
    clearInterval(timerInterval);
    const elapsed=Math.round((Date.now()-startTime)/1000);
    const m=Math.floor(elapsed/60),s=elapsed%60;
    setTimeout(()=>{
      document.getElementById('rBig').textContent=ok+'/9';
      document.getElementById('rTitle').textContent=ok===9?'🏆 All Nine Rights Correct!':ok>=7?'⭐ Almost Perfect!':'📚 Review & Try Again';
      document.getElementById('rTime').textContent='Completed in '+m+':'+(s+'').padStart(2,'0');
      document.getElementById('overlay').classList.add('show');
    },600);
  }
}
function startTimer(){
  timerInterval=setInterval(()=>{
    const e=Math.round((Date.now()-startTime)/1000);
    const m=Math.floor(e/60),s=e%60;
    document.getElementById('timerChip').textContent=m+':'+(s+'').padStart(2,'0');
  },1000);
}
function reset(){
  placements={};dragging=null;startTime=null;clearInterval(timerInterval);
  document.getElementById('timerChip').textContent='0:00';
  document.getElementById('overlay').classList.remove('show');
  shuffled=shuffle(RIGHTS.map(r=>({key:r.key,name:r.name})));
  renderSlots();renderChips();
}
reset();
</script>
</body>
</html>
