<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Nutrition Essentials</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:rgba(255,255,255,.07);--red:#e05a3a;--text:#ffffff;--muted:#6b7280;--muted2:#9ca3af;--green:#4caf82;--rose:#e05a5a;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.page{height:100vh;overflow:hidden;display:grid;grid-template-rows:auto auto auto 1fr auto;padding:0 20px;max-width:660px;margin:0 auto;}
.hdr{text-align:center;padding:18px 0 6px;}
.hdr-eye{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:4px;}
.hdr h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;color:var(--text);margin-bottom:3px;}
.hdr p{font-size:12px;color:var(--muted2);margin-bottom:8px;}
.dots{display:flex;align-items:center;gap:5px;justify-content:center;}
.dot{width:8px;height:5px;border-radius:3px;background:var(--border);transition:all .3s;}
.dot.a{width:26px;background:var(--red);}
.dot.d{background:var(--green);}
.deck-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 0 4px;}
.deck-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;}
.deck-btn.active{background:rgba(224,90,58,.12);border-color:var(--red);color:var(--text);}
.card-area{width:100%;display:flex;align-items:center;justify-content:center;padding:6px 0;min-height:0;}
.card-scene{width:min(540px,96vw);height:clamp(150px,26vh,230px);perspective:1000px;cursor:pointer;}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
.card-inner.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 30px;text-align:center;}
.card-front{background:var(--surface);border:1px solid var(--border);}
.card-back{background:var(--card);border:1px solid rgba(224,90,58,.25);transform:rotateY(180deg);}
.face-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.face-label.back{color:var(--red);}
.face-term{font-family:'Plus Jakarta Sans',sans-serif;font-size:clamp(15px,2.8vw,20px);font-weight:800;color:var(--text);line-height:1.2;}
.face-def{font-size:clamp(11px,1.5vw,13px);color:var(--muted2);line-height:1.55;}
.face-cat{font-size:10px;color:var(--red);margin-top:8px;font-weight:600;}
.btn-row{display:flex;align-items:center;gap:12px;justify-content:center;padding:4px 0;}
.verdict-btn{padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;}
.verdict-btn.know{border-color:rgba(76,175,130,.5);color:var(--green);}
.verdict-btn.know:hover{background:rgba(76,175,130,.1);}
.verdict-btn.learn{border-color:rgba(224,90,90,.5);color:var(--rose);}
.verdict-btn.learn:hover{background:rgba(224,90,90,.1);}
.card-counter{font-size:12px;color:var(--muted);min-width:52px;text-align:center;}
.end-box{display:none;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 44px;text-align:center;width:min(420px,94vw);margin:0 auto;}
.end-box.show{display:flex;}
.end-pct{font-size:46px;font-weight:800;color:var(--red);font-family:'Plus Jakarta Sans',sans-serif;}
.end-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;}
.end-sub{font-size:12px;color:var(--muted);}
.end-btns{display:flex;gap:8px;margin-top:4px;}
.restart-btn{padding:9px 20px;border-radius:9px;border:none;background:var(--red);color:#fff;font-size:12px;font-weight:800;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}
.restart-btn.outline{background:transparent;border:1px solid var(--border);color:var(--muted);}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="hdr-eye">Nutrition Essentials</div>
    <h1>Flashcards</h1>
    <p>Flip the card — then mark how well you know it.</p>
    <div class="dots" id="dots"></div>
  </div>
  <div class="deck-row">
    <button class="deck-btn active" onclick="setDeck('all',this)">All Topics</button>
    <button class="deck-btn" onclick="setDeck('Nutrients',this)">Nutrients</button>
    <button class="deck-btn" onclick="setDeck('Deficiencies',this)">Deficiencies</button>
    <button class="deck-btn" onclick="setDeck('Therapeutic Diets',this)">Therapeutic Diets</button>
    <button class="deck-btn" onclick="setDeck('Chronic Disease',this)">Chronic Disease</button>
    <button class="deck-btn" onclick="setDeck('MA Scope',this)">MA Scope</button>
  </div>
  <div class="card-area" id="cardArea">
    <div class="card-scene" onclick="flip()">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="face-label">Tap to reveal answer</div>
          <div class="face-term" id="fTerm"></div>
        </div>
        <div class="card-face card-back">
          <div class="face-label back">Answer</div>
          <div class="face-def" id="bDef"></div>
          <div class="face-cat" id="bCat"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="btn-row" id="btnRow">
    <button class="verdict-btn learn" onclick="mark(false)">✗ Still Learning</button>
    <div class="card-counter" id="counter">1 / 32</div>
    <button class="verdict-btn know" onclick="mark(true)">✓ Got It</button>
  </div>
  <div class="end-box" id="endBox" style="grid-row:3/5;">
    <div class="end-pct" id="endPct"></div>
    <div class="end-title" id="endTitle"></div>
    <div class="end-sub" id="endSub"></div>
    <div class="end-btns">
      <button class="restart-btn" onclick="restart()">Restart</button>
      <button class="restart-btn outline" onclick="reviewMissed()">Review Missed</button>
    </div>
  </div>
</div>
<script>
const ALL=[
  {cat:"Nutrients",term:"Six Essential Nutrients",def:"Carbohydrates, proteins, fats, vitamins, minerals, and water. Each serves critical roles in energy, growth, regulation, and protection."},
  {cat:"Nutrients",term:"Carbohydrates — Calories & Role",def:"4 kcal/g. Primary energy source. 45–65% of daily calories. Simple = rapid glucose rise. Complex = slower, steadier glucose."},
  {cat:"Nutrients",term:"Proteins — Calories & Role",def:"4 kcal/g. Builds/repairs tissue; makes enzymes and hormones. ~0.8 g/kg/day for healthy adults. Complete proteins have all 9 essential amino acids."},
  {cat:"Nutrients",term:"Fats — Calories & Role",def:"9 kcal/g — most energy-dense. 20–35% of daily calories. Stores energy and absorbs fat-soluble vitamins A, D, E, K."},
  {cat:"Nutrients",term:"Fat-Soluble Vitamins",def:"A, D, E, K. Stored in body fat — can accumulate to toxic levels. Require dietary fat for absorption. Monitor Vitamin K in anticoagulated patients."},
  {cat:"Nutrients",term:"Water-Soluble Vitamins",def:"B complex and C. Not stored — excess excreted in urine. Must be consumed regularly. Vegans at high risk for B12 deficiency."},
  {cat:"Nutrients",term:"Fiber Recommendations",def:"25 g/day for women, 38 g/day for men. Aids digestion, lowers LDL, stabilizes blood glucose. Found in whole grains, legumes, fruits, vegetables."},
  {cat:"Nutrients",term:"MyPlate Breakdown",def:"Vegetables 30%, Grains 30%, Fruits 20%, Protein 20%, with a dairy side. Half the plate = produce. Half of grains = whole grains."},
  {cat:"Deficiencies",term:"Iron-Deficiency Anemia — Signs",def:"Fatigue, pallor, brittle nails, pica, tachycardia. Most common nutritional deficiency. At risk: women of childbearing age, vegetarians, pregnant patients."},
  {cat:"Deficiencies",term:"Vitamin D Deficiency — Signs",def:"Bone pain, muscle weakness, frequent infections, depression. At risk: indoor workers, elderly, obese patients, darker skin tones."},
  {cat:"Deficiencies",term:"Vitamin B12 Deficiency — Signs",def:"Fatigue, numbness/tingling, memory issues, glossitis (inflamed tongue). At risk: vegans, elderly, metformin users, post-gastric bypass patients."},
  {cat:"Deficiencies",term:"Folate (B9) Deficiency — Signs",def:"Megaloblastic anemia, mouth sores. Critical in pregnancy: neural tube defects (spina bifida). At risk: pregnant women, alcohol users, methotrexate patients."},
  {cat:"Deficiencies",term:"Calcium Deficiency — Signs",def:"Muscle cramps, osteoporosis, dental problems, seizures (severe). At risk: post-menopausal women, lactose-intolerant patients, elderly. Requires Vitamin D for absorption."},
  {cat:"Deficiencies",term:"Protein-Energy Malnutrition — Signs",def:"Muscle wasting, poor wound healing, edema, hair loss. At risk: elderly, post-surgical, cancer patients, eating disorder patients."},
  {cat:"Deficiencies",term:"Scurvy (Vitamin C Deficiency)",def:"Poor wound healing, bleeding gums, fatigue. Vitamin C is essential for collagen synthesis and immune function. Found in citrus, peppers, strawberries."},
  {cat:"Therapeutic Diets",term:"Diabetic / Carb-Controlled Diet",def:"For Type 2 Diabetes and pre-diabetes. Limits added sugars and refined carbs. Carb counting: ~45–60g per meal. MA reinforces but does NOT modify."},
  {cat:"Therapeutic Diets",term:"Low-Sodium Diet",def:"For hypertension, CHF, CKD, edema. Limits sodium to <2,000 mg/day. Avoid processed foods, canned soups, restaurant meals."},
  {cat:"Therapeutic Diets",term:"Renal / CKD Diet",def:"For Chronic Kidney Disease. Limits potassium, phosphorus, sodium, and sometimes protein. Stage-dependent — always refer complex cases to an RD."},
  {cat:"Therapeutic Diets",term:"DASH Diet",def:"Dietary Approaches to Stop Hypertension. For CAD, HTN, hyperlipidemia. High fruits/vegetables/fiber, low saturated fat and sodium. Evidence-based for BP reduction."},
  {cat:"Therapeutic Diets",term:"Gluten-Free Diet",def:"Eliminates wheat, barley, and rye. Required for celiac disease — even trace exposure causes intestinal damage. Cross-contamination is a real clinical concern."},
  {cat:"Therapeutic Diets",term:"Clear vs. Full Liquid Diet",def:"Clear: broth, water, gelatin. Full: adds milk, pudding, cream soups. Both used pre/post-operative or in acute GI illness. Document type in intake."},
  {cat:"Chronic Disease",term:"Nutrition & Type 2 Diabetes",def:"Low-glycemic, carb-controlled, high-fiber diet. Reduces HbA1c over time. MA documents carb intake, reinforces glucose monitoring, flags HbA1c trends."},
  {cat:"Chronic Disease",term:"Nutrition & Cardiovascular Disease",def:"DASH or Mediterranean diet. Low saturated fat and sodium, high omega-3s and fiber. MA documents sodium intake, notes lipid panel trends."},
  {cat:"Chronic Disease",term:"Nutrition & Obesity / Metabolic Syndrome",def:"Calorie-aware, nutrient-dense eating. Avoid ultra-processed foods. MA records weight every visit, documents dietary history accurately, supports without shaming."},
  {cat:"Chronic Disease",term:"Nutrition & CKD",def:"Restrict potassium, phosphorus, sodium; adjust protein by stage. MA notes CMP/BMP lab values, flags dietary non-compliance, reinforces fluid restrictions."},
  {cat:"MA Scope",term:"Within MA Nutrition Scope",def:"Document dietary history and 24-hour recall; reinforce provider education; provide approved materials (MyPlate, diet sheets); record weight/BMI; note food allergies."},
  {cat:"MA Scope",term:"Outside MA Nutrition Scope",def:"Creating/modifying meal plans, diagnosing deficiencies, recommending supplements or dosages, contradicting provider instructions, performing medical nutrition therapy (RD only)."},
  {cat:"MA Scope",term:"When to Refer to an RD",def:"Complex conditions (CKD, eating disorders, cancer), pregnancy, pediatric nutrition needs, or any patient requiring a structured individualized meal plan."},
  {cat:"MA Scope",term:"24-Hour Food Recall",def:"A dietary assessment tool where the patient recalls all foods and beverages consumed in the past 24 hours. MA documents this during intake — does not interpret."},
  {cat:"MA Scope",term:"BMI — Body Mass Index",def:"Weight (kg) / Height (m²). Screening tool — not a diagnostic. MA measures and records at every visit. Values: <18.5 underweight, 18.5–24.9 normal, 25–29.9 overweight, ≥30 obese."},
];
let deck=[],cur=0,gotCount=0,missed=[],activeDeck='all',flipped=false;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function setDeck(d,el){document.querySelectorAll('.deck-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');activeDeck=d;initDeck();}
function initDeck(){deck=activeDeck==='all'?shuffle([...ALL]):shuffle(ALL.filter(c=>c.cat===activeDeck));cur=0;gotCount=0;missed=[];flipped=false;document.getElementById('endBox').classList.remove('show');document.getElementById('cardArea').style.display='';document.getElementById('btnRow').style.display='';renderCard();}
function renderCard(){if(cur>=deck.length){showEnd();return;}const c=deck[cur];document.getElementById('fTerm').textContent=c.term;document.getElementById('bDef').textContent=c.def;document.getElementById('bCat').textContent=c.cat;document.getElementById('counter').textContent=(cur+1)+' / '+deck.length;flipped=false;document.getElementById('cardInner').classList.remove('flipped');buildDots();}
function buildDots(){const n=Math.min(deck.length,16);document.getElementById('dots').innerHTML=Array.from({length:n},(_,i)=>`<div class="dot ${i<cur?'d':i===cur?'a':''}"></div>`).join('');}
function flip(){flipped=!flipped;document.getElementById('cardInner').classList.toggle('flipped',flipped);}
function mark(known){if(known)gotCount++;else missed.push(deck[cur]);cur++;renderCard();}
function showEnd(){document.getElementById('cardArea').style.display='none';document.getElementById('btnRow').style.display='none';const pct=Math.round((gotCount/deck.length)*100);document.getElementById('endPct').textContent=pct+'%';document.getElementById('endTitle').textContent=pct>=80?'🎉 Excellent Work!':pct>=60?'👍 Good Progress':'📚 Keep Studying';document.getElementById('endSub').textContent='You completed '+deck.length+' cards this session.';document.getElementById('endBox').classList.add('show');}
function restart(){initDeck();}
function reviewMissed(){if(!missed.length){restart();return;}deck=shuffle([...missed]);cur=0;gotCount=0;missed=[];flipped=false;document.getElementById('endBox').classList.remove('show');document.getElementById('cardArea').style.display='';document.getElementById('btnRow').style.display='';renderCard();}
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();flip();}if(e.key==='ArrowRight')mark(true);if(e.key==='ArrowLeft')mark(false);});
initDeck();
</script>
</body>
</html>
