<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True or False — Science Behind Healthcare</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg:#0d0d0d; --surface:#141414; --card:#1a1a1a; --border:rgba(255,255,255,.07);
  --red:#e05a3a; --text:#ffffff; --muted:#6b7280; --muted2:#9ca3af;
  --green:#4caf82; --rose:#e05a5a;
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.page{height:100vh;overflow:hidden;display:grid;grid-template-rows:auto auto auto 1fr auto auto;padding:0 20px;max-width:660px;margin:0 auto;}
.hdr{text-align:center;padding:18px 0 8px;}
.hdr-eye{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:4px;}
.hdr h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;color:var(--text);margin-bottom:3px;}
.hdr p{font-size:12px;color:var(--muted2);margin-bottom:8px;}
.dots{display:flex;align-items:center;gap:5px;justify-content:center;}
.dot{width:8px;height:5px;border-radius:3px;background:var(--border);transition:all .3s;}
.dot.a{width:26px;background:var(--red);}
.dot.d{background:var(--green);}
.hud{display:flex;gap:10px;justify-content:center;padding:4px 0 8px;}
.hud-chip{padding:4px 13px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid;}
.hud-chip.s{background:rgba(224,90,58,.1);color:var(--red);border-color:rgba(224,90,58,.4);}
.hud-chip.st{background:rgba(76,175,130,.1);color:var(--green);border-color:rgba(76,175,130,.4);}
.cat-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(59,163,184,.12);color:#3ba3b8;width:fit-content;margin-bottom:6px;}
.q-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.q-text{font-size:13px;color:var(--text);line-height:1.65;}
.q-num{font-size:11px;color:var(--muted);font-weight:600;flex-shrink:0;}
.opts-area{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;justify-content:center;}
.opt{width:100%;text-align:left;padding:14px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:14px;}
.opt:hover:not(:disabled){border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.03);}
.opt:disabled{cursor:default;}
.opt.correct{border-color:rgba(76,175,130,.55);background:rgba(76,175,130,.08);}
.opt.wrong{border-color:rgba(224,90,90,.55);background:rgba(224,90,90,.08);}
.opt-letter{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;}
.opt.correct .opt-letter{border-color:var(--green);color:var(--green);background:rgba(76,175,130,.12);}
.opt.wrong .opt-letter{border-color:var(--rose);color:var(--rose);background:rgba(224,90,90,.12);}
.fb{padding:10px 16px;border-radius:10px;font-size:12px;line-height:1.55;display:none;margin:4px 0 0;}
.fb.show{display:block;}
.fb.ok{background:rgba(76,175,130,.1);border:1px solid rgba(76,175,130,.3);}
.fb.no{background:rgba(224,90,90,.1);border:1px solid rgba(224,90,90,.3);}
.fb strong{display:block;margin-bottom:3px;}
.fb.ok strong{color:var(--green);}
.fb.no strong{color:var(--rose);}
.next-btn{padding:10px 26px;border-radius:10px;border:none;background:var(--red);color:#fff;font-size:13px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;display:none;margin:8px auto 10px;width:fit-content;}
.next-btn.show{display:block;}
.end-box{display:none;flex-direction:column;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 48px;text-align:center;grid-row:1/7;align-self:center;}
.end-box.show{display:flex;}
.end-pct{font-size:50px;font-weight:800;color:var(--red);font-family:'Plus Jakarta Sans',sans-serif;}
.end-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;}
.end-sub{font-size:12px;color:var(--muted);}
.end-stats{display:flex;gap:14px;}
.stat{padding:10px 18px;border-radius:10px;text-align:center;}
.stat.g{background:rgba(76,175,130,.1);}
.stat.r{background:rgba(224,90,90,.1);}
.stat-n{font-size:22px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;}
.stat.g .stat-n{color:var(--green);}
.stat.r .stat-n{color:var(--rose);}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px;}
.restart-btn{padding:10px 24px;border-radius:10px;border:none;background:var(--red);color:#fff;font-size:13px;font-weight:800;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;margin-top:4px;}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="hdr-eye">Science Behind Healthcare</div>
    <h1>True or False</h1>
    <p>Select the best answer for each question.</p>
    <div class="dots" id="dots"></div>
  </div>
  <div class="hud">
    <div class="hud-chip s">Score: <span id="sc">0</span></div>
    <div class="hud-chip st">🔥 Streak: <span id="str">0</span></div>
  </div>
  <div id="qArea">
    <div class="cat-pill" id="catPill"></div>
    <div class="q-box">
      <div class="q-text" id="qText"></div>
      <div class="q-num" id="qNum"></div>
    </div>
  </div>
  <div class="opts-area" id="opts"></div>
  <div class="fb" id="fb"></div>
  <button class="next-btn" id="nextBtn" onclick="next()">Next →</button>
  <div class="end-box" id="endBox">
    <div class="end-pct" id="endPct"></div>
    <div class="end-title" id="endTitle"></div>
    <div class="end-sub" id="endSub"></div>
    <div class="end-stats">
      <div class="stat g"><div class="stat-n" id="eOk">0</div><div class="stat-l">Correct</div></div>
      <div class="stat r"><div class="stat-n" id="eNo">0</div><div class="stat-l">Incorrect</div></div>
    </div>
    <button class="restart-btn" onclick="init()">Play Again</button>
  </div>
</div>
<script>
const QS=[
  {cat:"Scientific Method",stmt:"A hypothesis is a conclusion drawn after a study has been completed.",correct:false,ok:"FALSE — A hypothesis is made BEFORE the study as a testable prediction. Conclusions are drawn after data analysis.",no:"A hypothesis is a testable prediction made BEFORE the experiment — not a conclusion drawn after."},
  {cat:"Scientific Method",stmt:"In a double-blind study, both participants and researchers are unaware of who received the treatment.",correct:true,ok:"TRUE — Double-blind design ensures neither side knows the treatment assignment, eliminating both participant and observer bias.",no:"TRUE — Double-blind means both participants and researchers are blinded to group assignment, eliminating bias from both sides."},
  {cat:"Scientific Method",stmt:"A p-value of 0.03 means the treatment is effective in 97% of patients.",correct:false,ok:"FALSE — p=0.03 means there is a 3% chance the result occurred by chance. It says nothing about how many patients benefit.",no:"p-value measures probability of a chance result, NOT efficacy percentage. p=0.03 = 3% chance the result was random."},
  {cat:"EBP",stmt:"Evidence-based practice means the provider's personal clinical experience is irrelevant.",correct:false,ok:"FALSE — EBP integrates THREE elements: best research evidence, clinical expertise, AND patient values. Clinical experience is essential.",no:"EBP requires all three: research evidence + clinical expertise + patient values. Experience is a core pillar, not irrelevant."},
  {cat:"EBP",stmt:"Systematic reviews and meta-analyses represent the highest level of evidence.",correct:true,ok:"TRUE — They sit at Level 1 in the hierarchy of evidence, synthesizing all available research for the strongest possible conclusions.",no:"TRUE — Level 1 evidence = systematic reviews and meta-analyses. They combine data from many studies, providing the strongest conclusions."},
  {cat:"Body Systems",stmt:"Homeostasis means the body's internal environment remains absolutely constant and unchanging.",correct:false,ok:"FALSE — Homeostasis maintains a STABLE RANGE, not absolute constancy. Values fluctuate within normal limits — the body continuously self-corrects.",no:"Homeostasis maintains stability within normal ranges — not absolute constancy. The body continuously self-corrects within those ranges."},
  {cat:"Body Systems",stmt:"When blood glucose rises above normal, the pancreas releases glucagon to bring it back down.",correct:false,ok:"FALSE — Elevated blood glucose triggers INSULIN release (to lower it). Glucagon is released when blood glucose falls too LOW.",no:"Rising blood glucose → INSULIN (lowers it). Falling blood glucose → glucagon (raises it). These are opposite responses."},
  {cat:"Body Systems",stmt:"The respiratory system contributes to blood pH regulation by controlling CO2 levels.",correct:true,ok:"TRUE — Faster breathing exhales more CO2 (raises pH); slower breathing retains CO2 (lowers pH). The lungs are a key pH regulator.",no:"TRUE — CO2 dissolves in blood to form carbonic acid. The respiratory system adjusts CO2 levels to regulate blood pH."},
  {cat:"Pathophysiology",stmt:"Acute inflammation is always harmful and should be suppressed immediately.",correct:false,ok:"FALSE — Acute inflammation is PROTECTIVE — it's the body's first defense against injury and infection. Chronic inflammation is the harmful form.",no:"Acute inflammation is protective (wound healing, fighting infection). Chronic inflammation causes long-term tissue damage."},
  {cat:"Pathophysiology",stmt:"Infarction refers to complete tissue death caused by blocked blood supply.",correct:true,ok:"TRUE — Infarction = irreversible tissue death from complete blood flow blockage. MI (heart) and CVA (brain) are common examples.",no:"TRUE — Infarction = tissue death from complete blockage of blood supply. Ischemia (reduced flow) can progress to infarction."},
  {cat:"Pathophysiology",stmt:"All neoplasms (tumors) are malignant and capable of spreading to other organs.",correct:false,ok:"FALSE — Neoplasms can be benign (non-invasive, do not metastasize) or malignant. Malignant tumors are the ones capable of invasion and metastasis.",no:"Neoplasms can be benign (non-invasive) or malignant (invasive, metastatic). Not all tumors spread."},
  {cat:"Pharmacology",stmt:"Pharmacokinetics describes what the drug does to the body, such as its mechanism of action.",correct:false,ok:"FALSE — Pharmacokinetics = what the BODY does to the drug (ADME). Pharmacodynamics = what the drug does to the body.",no:"Pharmacokinetics = what the BODY does to the drug (Absorption, Distribution, Metabolism, Excretion). Pharmacodynamics is the drug's effect on the body."},
  {cat:"Pharmacology",stmt:"The first-pass effect means oral medications may have lower bioavailability than IV medications.",correct:true,ok:"TRUE — Oral drugs are metabolized by the liver before reaching systemic circulation, reducing bioavailability. IV drugs bypass this.",no:"TRUE — First-pass effect: oral drugs pass through the liver and are partially metabolized before reaching systemic circulation."},
  {cat:"Pharmacology",stmt:"A drug with a narrow therapeutic window requires more frequent monitoring because the margin between effective and toxic doses is small.",correct:true,ok:"TRUE — Warfarin, digoxin, and lithium have narrow therapeutic windows — even small dose changes can cause under- or over-treatment.",no:"TRUE — Narrow therapeutic window = small margin between effective and toxic dose. Close monitoring (labs, drug levels) is essential."},
  {cat:"Clinical Trials",stmt:"Phase IV clinical trials occur before FDA approval to confirm the drug is safe enough for release.",correct:false,ok:"FALSE — Phase IV is POST-MARKET surveillance — it occurs AFTER FDA approval. It monitors for rare side effects in the general population.",no:"Phase IV occurs AFTER FDA approval. Pre-clinical through Phase III happen before approval. Phase IV detects rare effects in large populations."},
];
let questions=[],cur=0,score=0,streak=0,wrong=0,answered=false;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function init(){questions=shuffle(QS);cur=0;score=0;streak=0;wrong=0;answered=false;document.getElementById('endBox').classList.remove('show');document.getElementById('qArea').style.display='';document.getElementById('opts').style.display='';document.getElementById('fb').className='fb';document.getElementById('nextBtn').className='next-btn';updateHUD();render();}
function render(){answered=false;const q=questions[cur];document.getElementById('catPill').textContent=q.cat;document.getElementById('qText').textContent=q.stmt;document.getElementById('qNum').textContent='Q'+(cur+1);document.getElementById('opts').innerHTML=`<button class="opt" id="optT" onclick="pick(true)"><span class="opt-letter">T</span>True</button><button class="opt" id="optF" onclick="pick(false)"><span class="opt-letter">F</span>False</button>`;document.getElementById('fb').className='fb';document.getElementById('nextBtn').className='next-btn';buildDots();}
function buildDots(){const n=questions.length;document.getElementById('dots').innerHTML=Array.from({length:n},(_,i)=>`<div class="dot ${i<cur?'d':i===cur?'a':''}"></div>`).join('');}
function pick(userTrue){if(answered)return;answered=true;const q=questions[cur];const isRight=(userTrue===q.correct);document.getElementById('optT').disabled=true;document.getElementById('optF').disabled=true;if(q.correct)document.getElementById('optT').classList.add('correct');else document.getElementById('optF').classList.add('correct');if(!isRight){if(userTrue)document.getElementById('optT').classList.add('wrong');else document.getElementById('optF').classList.add('wrong');}const fb=document.getElementById('fb');if(isRight){score++;streak++;fb.innerHTML=`<strong>✓ Correct!</strong>${q.ok}`;fb.className='fb ok show';}else{wrong++;streak=0;fb.innerHTML=`<strong>✗ Incorrect.</strong>${q.no}`;fb.className='fb no show';}updateHUD();document.getElementById('nextBtn').className='next-btn show';}
function next(){cur++;if(cur>=questions.length){showEnd();return;}render();}
function showEnd(){const pct=Math.round((score/questions.length)*100);document.getElementById('qArea').style.display='none';document.getElementById('opts').style.display='none';document.getElementById('fb').className='fb';document.getElementById('nextBtn').className='next-btn';document.getElementById('endPct').textContent=pct+'%';document.getElementById('endTitle').textContent=pct===100?'🏆 Perfect Score!':pct>=80?'🌟 Sharp Thinking!':pct>=60?'👍 Good Work':'📚 Review & Retry';document.getElementById('endSub').textContent='You answered '+questions.length+' true/false statements.';document.getElementById('eOk').textContent=score;document.getElementById('eNo').textContent=wrong;document.getElementById('endBox').classList.add('show');}
function updateHUD(){document.getElementById('sc').textContent=score;document.getElementById('str').textContent=streak;}
init();
</script>
</body>
</html>
