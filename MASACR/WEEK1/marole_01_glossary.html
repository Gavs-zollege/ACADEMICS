<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossary — Role of the Medical Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:rgba(255,255,255,.07);--red:#e05a3a;--red-dim:rgba(224,90,58,.15);--text:#fff;--muted:#6b7280;--muted2:#9ca3af;--pill-bg:rgba(255,255,255,.06);--pill-border:rgba(255,255,255,.12);}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.page{height:100vh;overflow:hidden;display:grid;grid-template-rows:auto auto auto 1fr;max-width:820px;margin:0 auto;padding:0 32px;}
.hdr{padding:26px 0 12px;}
.hdr-eye{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:6px;}
.hdr h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:36px;font-weight:800;color:var(--text);margin-bottom:3px;line-height:1.05;}
.hdr-sub{font-size:13px;color:var(--muted2);}
.search-wrap{padding:10px 0 8px;}
.search-inner{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;}
.search-icon{color:var(--muted);font-size:14px;}
.search-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;}
.search-input::placeholder{color:var(--muted);}
.filter-area{padding-bottom:8px;}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.pill{padding:4px 12px;border-radius:999px;border:1px solid var(--pill-border);background:var(--pill-bg);color:var(--muted2);font-size:11px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap;}
.pill:hover{border-color:rgba(255,255,255,.22);color:var(--text);}
.pill.active{background:var(--red-dim);border-color:var(--red);color:var(--text);font-weight:600;}
.term-count{font-size:11px;color:var(--muted);}
.list-area{min-height:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.term-list{flex:1;overflow:hidden;}
.term-row{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;gap:14px;}
.term-row:last-child{border-bottom:none;}
.term-row:hover{background:rgba(255,255,255,.03);}
.term-left{display:flex;align-items:center;gap:12px;min-width:0;}
.red-bar{width:3px;border-radius:2px;background:var(--red);flex-shrink:0;}
.term-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-badge{flex-shrink:0;padding:2px 9px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--red-dim);color:var(--red);white-space:nowrap;}
.pager{background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:11px 22px;flex-shrink:0;}
.pager-btn{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;}
.pager-btn:hover:not(:disabled){border-color:rgba(255,255,255,.2);color:var(--text);}
.pager-btn:disabled{opacity:.3;cursor:default;}
.pager-dots{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;max-width:420px;}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;border:none;padding:0;transition:all .2s;}
.pdot.active{background:var(--red);transform:scale(1.3);}
.pdot.near{background:rgba(255,255,255,.3);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:26px 30px;max-width:500px;width:90%;transform:translateY(10px);transition:transform .2s;}
.overlay.open .modal{transform:translateY(0);}
.m-badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--red-dim);color:var(--red);margin-bottom:10px;}
.m-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:800;color:var(--text);margin-bottom:10px;}
.m-def{font-size:13px;color:var(--muted2);line-height:1.68;margin-bottom:10px;}
.m-note{background:rgba(224,90,58,.1);border-left:2px solid var(--red);padding:9px 12px;border-radius:0 7px 7px 0;font-size:12px;color:var(--text);line-height:1.6;display:none;}
.m-note.show{display:block;}
.m-note strong{color:var(--red);}
.m-close{margin-top:14px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;transition:all .18s;}
.m-close:hover{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="hdr-eye">Week 1 — Role of the Medical Assistant in Today's Health Care System</div>
    <h1>Glossary</h1>
    <div class="hdr-sub">MA Role · Scope · Duties · Legal · Certification · Care Team</div>
  </div>
  <div class="search-wrap">
    <div class="search-inner">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="searchInput" placeholder="Search terms or definitions…" oninput="onSearch()">
    </div>
  </div>
  <div class="filter-area">
    <div class="pills" id="pills"></div>
    <div class="term-count" id="termCount"></div>
  </div>
  <div class="list-area" id="listArea">
    <div class="term-list" id="termList"></div>
    <div class="pager" id="pager">
      <button class="pager-btn" id="btnPrev" onclick="changePage(-1)">← Prev</button>
      <div class="pager-dots" id="pagerDots"></div>
      <button class="pager-btn" id="btnNext" onclick="changePage(1)">Next →</button>
    </div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal">
    <div class="m-badge" id="mBadge"></div>
    <div class="m-name" id="mName"></div>
    <div class="m-def" id="mDef"></div>
    <div class="m-note" id="mNote"></div>
    <button class="m-close" onclick="closeModal()">Close</button>
  </div>
</div>
<script>
const TERMS=[
  {cat:"MA Role",name:"Medical Assistant (MA)",def:"A multiskilled allied health professional who performs both administrative and clinical tasks in a variety of health care settings — primarily outpatient and ambulatory care.",note:"MAs are the fastest-growing healthcare occupation — 750,000+ employed in the U.S. with 18% projected growth over the next decade (BLS 2024)."},
  {cat:"MA Role",name:"Administrative Duties",def:"Non-clinical MA responsibilities: scheduling, patient check-in, insurance verification, collecting co-pays, maintaining EHR records, managing referrals, answering phones, billing support, and inventory.",note:"Administrative competency = financial stability of the clinic. Insurance verification and prior authorizations directly affect whether a patient receives care."},
  {cat:"MA Role",name:"Clinical Duties",def:"Patient-facing MA responsibilities: rooming patients, obtaining vitals, preparing patients for exams, assisting during procedures, administering injections, performing basic lab tests, collecting specimens, ECGs, and patient education.",note:"MAs are cross-trained — this dual administrative/clinical role is what makes them uniquely valuable in outpatient settings."},
  {cat:"MA Role",name:"Rooming a Patient",def:"The process of escorting a patient to the exam room, obtaining chief complaint and history, measuring and recording vital signs, and preparing the patient for the provider's examination.",note:"Rooming is one of the most important MA functions — the information you collect directly shapes the provider's clinical assessment."},
  {cat:"MA Role",name:"Patient-Centered Care",def:"Treating the whole person — not just the condition. Integrates the patient's values, preferences, and needs into every clinical interaction. Includes respect, clear communication, and privacy.",note:"How MAs put it into practice: Greet → Listen → Explain → Confirm → Document → Follow Up. Every step of the visit matters."},
  {cat:"Scope",name:"Scope of Practice",def:"The range of tasks an MA is legally authorized to perform, defined by state law, facility policy, provider supervision, and the MA's training and credentialing.",note:"<strong>Key principles:</strong> Scope varies by STATE. Facility policy may be MORE restrictive. 'I don't know' is always safer than guessing. Violations risk patient harm AND legal liability."},
  {cat:"Scope",name:"Within MA Scope",def:"Measuring and recording vital signs, administering injections (with training), performing venipuncture, operating ECG machines, collecting and processing specimens, documenting in the medical record, providing education as directed by provider.",note:"Everything within scope requires provider delegation for clinical tasks. You perform, the provider authorizes."},
  {cat:"Scope",name:"Outside MA Scope",def:"Diagnosing conditions, prescribing or recommending medications, ordering lab tests or imaging independently, interpreting lab or diagnostic results, performing triage independently, making clinical decisions without delegation.",note:"If a patient asks for a diagnosis or medical advice, redirect respectfully: 'I can note that for the provider' — never speculate or guess."},
  {cat:"Scope",name:"Provider Delegation",def:"The act of a licensed provider (MD, DO, NP, PA) authorizing an MA to perform a specific clinical task. MAs may only perform delegated clinical tasks under provider supervision.",note:"Delegation does not eliminate MA responsibility. If you perform a task incorrectly, you bear individual accountability for the error."},
  {cat:"Legal",name:"Respondeat Superior",def:"Latin for 'let the master answer.' Employers are held liable for employees' negligent acts performed within the scope of employment. If you act outside scope, YOU bear individual liability.",note:"Acting within scope = shared liability. Acting outside scope = YOUR liability. This is why scope of practice is not negotiable."},
  {cat:"Legal",name:"Standard of Care",def:"The level of care a reasonably competent MA with similar training would provide under the same circumstances. You are held to the standard of a trained, certified MA — not a nurse or untrained person.",note:"Standard of care is the legal benchmark for MA performance. Deviating below this standard = negligence."},
  {cat:"Legal",name:"Negligence",def:"Failure to act with the standard of care, resulting in patient harm. Requires: duty, breach of duty, causation, and damages. Examples: wrong medication dose, mislabeled specimen, failure to report abnormal vitals.",note:"Negligence doesn't require intent. An honest mistake that harms a patient can still constitute negligence if it falls below the standard of care."},
  {cat:"Legal",name:"Informed Consent",def:"Patients must be fully informed of risks, benefits, and alternatives before agreeing to treatment. MAs witness consent signatures but do NOT explain procedures or obtain consent — that is the provider's legal responsibility.",note:"The MA's role in consent: witness the signature and ensure the patient has had time to ask questions. Never explain risks or interpret the consent form to the patient."},
  {cat:"Legal",name:"Mandatory Reporting",def:"MAs are required by law to report suspected abuse, neglect, or exploitation of children, elderly, and vulnerable adults. Failure to report is itself a crime. Reasonable suspicion is sufficient — proof is not required.",note:"You are a mandatory reporter as soon as you begin working in a clinical role. Document your concern and report — do not investigate independently."},
  {cat:"Certification",name:"CMA (AAMA)",def:"Certified Medical Assistant — awarded by the American Association of Medical Assistants (AAMA). Exam: 200 MCQs, 3 hours. Eligibility: graduate of CAAHEP or ABHES-accredited program. Recertification: 60 CEUs every 5 years.",note:"Oldest and most widely recognized MA credential. Strongly preferred by many employers in traditional outpatient settings."},
  {cat:"Certification",name:"CCMA (NHA)",def:"Certified Clinical Medical Assistant — awarded by the National Healthcareer Association (NHA). Exam: 150 MCQs, 2 hours. Eligibility: training + externship OR 1 year experience. Recertification: 14 CEUs/year.",note:"Zollege's primary certification pathway. Fastest-growing MA credential with strong industry recognition and broad employer acceptance."},
  {cat:"Certification",name:"RMA (AMT)",def:"Registered Medical Assistant — awarded by the American Medical Technologists (AMT). Exam: 210 MCQs, 2.5 hours. Eligibility: accredited program + experience OR military training. Recertification: 30 CEUs every 3 years.",note:"Well-recognized nationally with broader eligibility pathways. Strong in specialty clinical settings."},
  {cat:"Care Team",name:"Inpatient vs. Outpatient",def:"Inpatient = patient admitted overnight or longer (hospitals). Outpatient = patient comes and goes same day (clinics, offices, urgent care). MAs work primarily in outpatient settings.",note:"90%+ of MAs work in outpatient settings. The MA is central to the ambulatory care model — the primary clinical worker in most clinic visits."},
  {cat:"Care Team",name:"Primary Care vs. Specialty Care",def:"Primary care (family medicine, internal medicine, pediatrics) provides first contact and preventive care. Specialty care (cardiology, dermatology, OB/GYN) focuses on specific conditions. MAs adapt their focus to the specialty.",note:"An MA in cardiology focuses on ECGs and cardiac medications. An MA in OB/GYN focuses on pelvic exams, prenatal care, and reproductive health. The core skills are the same — the context changes."},
  {cat:"Care Team",name:"The Patient Visit — MA's Steps",def:"1. Pre-Visit: confirm appointment, pull chart, prep room. 2. Check-In: greet, verify demographics/insurance. 3. Rooming: escort, vitals, chief complaint. 4. Provider: assist as directed. 5. Check-Out: schedule follow-up, referrals. 6. Post-Visit: complete documentation.",note:"The MA owns the workflow at every step except the provider's exam. Every step is an opportunity to demonstrate professionalism and patient-centered care."},
  {cat:"Care Team",name:"EHR Proficiency",def:"Electronic Health Record competency is now a core MA requirement. MAs use EHRs for documentation, order entry, communication, and scheduling. 40% of MA roles now require EHR proficiency.",note:"The EHR is the MA's primary documentation tool. Accurate EHR documentation directly affects billing, patient safety, and care continuity."},
];
const CATS=['All','MA Role','Scope','Legal','Certification','Care Team'];
const PER_PAGE=4;
let activeCat='All',searchQ='',currentPage=0,filtered=[];
function buildPills(){document.getElementById('pills').innerHTML=CATS.map(c=>`<button class="pill ${c===activeCat?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');}
function setFilter(c){activeCat=c;currentPage=0;buildPills();applyFilter();}
function onSearch(){searchQ=document.getElementById('searchInput').value.toLowerCase();currentPage=0;applyFilter();}
function applyFilter(){filtered=TERMS.filter(t=>{const mc=activeCat==='All'||t.cat===activeCat;const mq=!searchQ||t.name.toLowerCase().includes(searchQ)||t.def.toLowerCase().includes(searchQ);return mc&&mq;});renderPage();}
function renderPage(){
  const total=filtered.length,totalPages=Math.max(1,Math.ceil(total/PER_PAGE));
  if(currentPage>=totalPages)currentPage=totalPages-1;
  const items=filtered.slice(currentPage*PER_PAGE,currentPage*PER_PAGE+PER_PAGE);
  document.getElementById('termCount').textContent=`${total} term${total!==1?'s':''} · Page ${currentPage+1} of ${totalPages}`;
  const la=document.getElementById('listArea'),pg=document.getElementById('pager');
  const rowH=Math.floor((la.clientHeight-pg.offsetHeight)/PER_PAGE),barH=Math.floor(rowH*.38);
  document.getElementById('termList').innerHTML=items.map(t=>`<div class="term-row" style="height:${rowH}px" onclick="openModal(${filtered.indexOf(t)})"><div class="term-left"><div class="red-bar" style="height:${barH}px"></div><div class="term-name">${t.name}</div></div><div class="cat-badge">${t.cat}</div></div>`).join('');
  document.getElementById('pagerDots').innerHTML=Array.from({length:totalPages},(_,i)=>`<button class="pdot${i===currentPage?' active':Math.abs(i-currentPage)<=2?' near':''}" onclick="goPage(${i})"></button>`).join('');
  document.getElementById('btnPrev').disabled=currentPage===0;document.getElementById('btnNext').disabled=currentPage>=totalPages-1;
}
function changePage(d){currentPage=Math.max(0,Math.min(Math.max(1,Math.ceil(filtered.length/PER_PAGE))-1,currentPage+d));renderPage();}
function goPage(n){currentPage=n;renderPage();}
function openModal(i){const t=filtered[i];document.getElementById('mBadge').textContent=t.cat;document.getElementById('mName').textContent=t.name;document.getElementById('mDef').textContent=t.def;const n=document.getElementById('mNote');if(t.note){n.innerHTML=t.note;n.className='m-note show';}else{n.className='m-note';}document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function maybeClose(e){if(e.target===document.getElementById('overlay'))closeModal();}
buildPills();applyFilter();
window.addEventListener('resize',renderPage);
</script>
</body>
</html>
