<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards — Role of the Medical Assistant</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:rgba(255,255,255,.07);--red:#e05a3a;--text:#fff;--muted:#6b7280;--muted2:#9ca3af;--green:#4caf82;--rose:#e05a5a;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.page{height:100vh;overflow:hidden;display:grid;grid-template-rows:auto auto auto 1fr auto;padding:0 20px;max-width:660px;margin:0 auto;}
.hdr{text-align:center;padding:18px 0 6px;}
.hdr-eye{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:4px;}
.hdr h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;margin-bottom:3px;}
.hdr p{font-size:12px;color:var(--muted2);margin-bottom:8px;}
.dots{display:flex;align-items:center;gap:5px;justify-content:center;}
.dot{width:8px;height:5px;border-radius:3px;background:var(--border);transition:all .3s;}
.dot.a{width:26px;background:var(--red);}
.dot.d{background:var(--green);}
.deck-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding:10px 0 4px;}
.deck-btn{padding:4px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:10px;font-weight:600;cursor:pointer;transition:all .2s;}
.deck-btn.active{background:rgba(224,90,58,.12);border-color:var(--red);color:var(--text);}
.card-area{width:100%;display:flex;align-items:center;justify-content:center;padding:6px 0;min-height:0;}
.card-scene{width:min(540px,96vw);height:clamp(150px,26vh,230px);perspective:1000px;cursor:pointer;}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1);}
.card-inner.flipped{transform:rotateY(180deg);}
.card-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px 30px;text-align:center;}
.card-front{background:var(--surface);border:1px solid var(--border);}
.card-back{background:var(--card);border:1px solid rgba(224,90,58,.25);transform:rotateY(180deg);}
.face-label{font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;}
.face-label.back{color:var(--red);}
.face-term{font-family:'Plus Jakarta Sans',sans-serif;font-size:clamp(14px,2.6vw,20px);font-weight:800;color:var(--text);line-height:1.2;}
.face-def{font-size:clamp(11px,1.5vw,13px);color:var(--muted2);line-height:1.55;}
.face-cat{font-size:10px;color:var(--red);margin-top:8px;font-weight:600;}
.btn-row{display:flex;align-items:center;gap:12px;justify-content:center;padding:4px 0;}
.verdict-btn{padding:10px 20px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.verdict-btn.know{border-color:rgba(76,175,130,.5);color:var(--green);}
.verdict-btn.know:hover{background:rgba(76,175,130,.1);}
.verdict-btn.learn{border-color:rgba(224,90,90,.5);color:var(--rose);}
.verdict-btn.learn:hover{background:rgba(224,90,90,.1);}
.card-counter{font-size:12px;color:var(--muted);min-width:52px;text-align:center;}
.end-box{display:none;flex-direction:column;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 44px;text-align:center;width:min(420px,94vw);margin:0 auto;}
.end-box.show{display:flex;}
.end-pct{font-size:46px;font-weight:800;color:var(--red);}
.end-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;}
.end-sub{font-size:12px;color:var(--muted);}
.end-btns{display:flex;gap:8px;margin-top:4px;}
.restart-btn{padding:9px 20px;border-radius:9px;border:none;background:var(--red);color:#fff;font-size:12px;font-weight:800;cursor:pointer;}
.restart-btn.outline{background:transparent;border:1px solid var(--border);color:var(--muted);}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="hdr-eye">Role of the Medical Assistant</div>
    <h1>Flashcards</h1>
    <p>Flip the card — then mark how well you know it.</p>
    <div class="dots" id="dots"></div>
  </div>
  <div class="deck-row">
    <button class="deck-btn active" onclick="setDeck('all',this)">All</button>
    <button class="deck-btn" onclick="setDeck('Role & Duties',this)">Role & Duties</button>
    <button class="deck-btn" onclick="setDeck('Scope',this)">Scope of Practice</button>
    <button class="deck-btn" onclick="setDeck('Legal',this)">Legal</button>
    <button class="deck-btn" onclick="setDeck('Certification',this)">Certification</button>
    <button class="deck-btn" onclick="setDeck('Care Team',this)">Care Team</button>
  </div>
  <div class="card-area" id="cardArea">
    <div class="card-scene" onclick="flip()">
      <div class="card-inner" id="cardInner">
        <div class="card-face card-front">
          <div class="face-label">Tap to reveal</div>
          <div class="face-term" id="fTerm"></div>
        </div>
        <div class="card-face card-back">
          <div class="face-label back">Answer</div>
          <div class="face-def" id="bDef"></div>
          <div class="face-cat" id="bCat"></div>
        </div>
      </div>
    </div>
  </div>
  <div class="btn-row" id="btnRow">
    <button class="verdict-btn learn" onclick="mark(false)">✗ Still Learning</button>
    <div class="card-counter" id="counter">1 / 30</div>
    <button class="verdict-btn know" onclick="mark(true)">✓ Got It</button>
  </div>
  <div class="end-box" id="endBox" style="grid-row:3/5;">
    <div class="end-pct" id="endPct"></div>
    <div class="end-title" id="endTitle"></div>
    <div class="end-sub" id="endSub"></div>
    <div class="end-btns">
      <button class="restart-btn" onclick="restart()">Restart</button>
      <button class="restart-btn outline" onclick="reviewMissed()">Review Missed</button>
    </div>
  </div>
</div>
<script>
const ALL=[
  {cat:"Role & Duties",term:"Medical Assistant",def:"A multiskilled allied health professional performing both administrative and clinical tasks. Fastest-growing healthcare occupation — 750,000+ employed, 18% projected growth."},
  {cat:"Role & Duties",term:"Administrative Duties",def:"Scheduling, patient check-in, insurance verification, co-pay collection, EHR maintenance, referrals, phones, billing support, inventory management."},
  {cat:"Role & Duties",term:"Clinical Duties",def:"Rooming patients, vital signs, exam prep, assisting providers, injections, basic lab tests, specimen collection, ECGs, patient education under provider direction."},
  {cat:"Role & Duties",term:"Rooming a Patient",def:"Escort to exam room → vital signs → chief complaint and history → prepare for provider. This is one of the most critical MA functions."},
  {cat:"Role & Duties",term:"Patient-Centered Care",def:"Treating the whole person. Greet → Listen → Explain → Confirm → Document → Follow Up. Integrates patient values, preferences, and needs into every interaction."},
  {cat:"Role & Duties",term:"EHR Proficiency",def:"Now a core MA competency. MAs are primary EHR users — documentation, order entry, communication, scheduling. 40% of MA roles require EHR proficiency."},
  {cat:"Scope",term:"Scope of Practice",def:"Tasks legally authorized by state law, facility policy, provider supervision, and training. Varies by state. Certification does NOT override state law."},
  {cat:"Scope",term:"Within Scope — Examples",def:"Vital signs, injections (delegated), venipuncture, ECGs, specimen collection, point-of-care testing, documentation, patient education as directed."},
  {cat:"Scope",term:"Outside Scope — Always",def:"Diagnosing conditions, prescribing medications, ordering labs/imaging independently, interpreting results, triage without supervision, clinical decisions without delegation."},
  {cat:"Scope",term:"Provider Delegation",def:"A licensed provider authorizes the MA to perform a specific clinical task. MAs may only perform delegated clinical tasks under provider supervision."},
  {cat:"Scope",term:"'I don't know'",def:"Always safer than guessing. When in doubt about scope, ask the provider. Violating scope risks patient harm AND individual legal liability for the MA."},
  {cat:"Legal",term:"Respondeat Superior",def:"'Let the master answer.' Employers liable for employee errors within scope. Act OUTSIDE scope = individual MA liability. Stay in scope = shared liability."},
  {cat:"Legal",term:"Standard of Care",def:"The level of care a reasonably competent MA with similar training would provide. You are held to this standard — not a nurse, not an untrained person."},
  {cat:"Legal",term:"Negligence",def:"Failure to meet the standard of care resulting in patient harm. Requires: duty, breach, causation, damages. Examples: wrong dose, mislabeled specimen, failure to report abnormal vitals."},
  {cat:"Legal",term:"Informed Consent",def:"Provider's responsibility — not MA's. MAs WITNESS the signature only. Never explain risks or obtain consent independently."},
  {cat:"Legal",term:"Mandatory Reporting",def:"Required by law: report suspected abuse, neglect, or exploitation of children, elderly, or vulnerable adults. Failure to report = crime. Reasonable suspicion is sufficient."},
  {cat:"Legal",term:"HIPAA in the MA Role",def:"Every MA handles PHI daily. Violations = civil fines ($100–$50,000/violation), criminal penalties up to 10 years, termination. Social media posts about patients = violation."},
  {cat:"Certification",term:"CMA (AAMA)",def:"Certified Medical Assistant. 200 MCQs, 3 hours. Requires CAAHEP/ABHES-accredited program. Recertification: 60 CEUs every 5 years. Oldest, most widely recognized."},
  {cat:"Certification",term:"CCMA (NHA)",def:"Certified Clinical Medical Assistant. 150 MCQs, 2 hours. Zollege's primary pathway. Fastest-growing credential. Recertification: 14 CEUs/year."},
  {cat:"Certification",term:"RMA (AMT)",def:"Registered Medical Assistant. 210 MCQs, 2.5 hours. Broader eligibility (program + experience OR military training). Recertification: 30 CEUs every 3 years."},
  {cat:"Care Team",term:"Inpatient vs. Outpatient",def:"Inpatient = admitted overnight (hospitals). Outpatient = same-day care (clinics, offices, urgent care). 90%+ of MAs work in outpatient settings."},
  {cat:"Care Team",term:"Primary vs. Specialty Care",def:"Primary = family medicine, internal medicine, pediatrics (first contact). Specialty = cardiology, dermatology, OB/GYN. MAs adapt their clinical focus to the specialty."},
  {cat:"Care Team",term:"Patient Visit Workflow (6 Steps)",def:"1. Pre-Visit (prep). 2. Check-In (greet, demographics). 3. Rooming (vitals, CC). 4. Provider (assist). 5. Check-Out (follow-up, referrals). 6. Post-Visit (documentation)."},
  {cat:"Care Team",term:"MA vs. RN Boundaries",def:"MAs do not take nursing orders. Scope boundaries apply even when RNs ask MAs to perform tasks. Mutual respect — but scope is non-negotiable."},
  {cat:"Care Team",term:"Telehealth — Evolving MA Role",def:"MA assists with virtual patient setup, pre-visit intake, and documentation for remote visits. Telehealth MA positions grew 3x post-pandemic — a growing distinct skill set."},
];
let deck=[],cur=0,gotCount=0,missed=[],activeDeck='all',flipped=false;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function setDeck(d,el){document.querySelectorAll('.deck-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');activeDeck=d;initDeck();}
function initDeck(){deck=activeDeck==='all'?shuffle([...ALL]):shuffle(ALL.filter(c=>c.cat===activeDeck));cur=0;gotCount=0;missed=[];flipped=false;document.getElementById('endBox').classList.remove('show');document.getElementById('cardArea').style.display='';document.getElementById('btnRow').style.display='';renderCard();}
function renderCard(){if(cur>=deck.length){showEnd();return;}const c=deck[cur];document.getElementById('fTerm').textContent=c.term;document.getElementById('bDef').textContent=c.def;document.getElementById('bCat').textContent=c.cat;document.getElementById('counter').textContent=(cur+1)+' / '+deck.length;flipped=false;document.getElementById('cardInner').classList.remove('flipped');buildDots();}
function buildDots(){const n=Math.min(deck.length,16);document.getElementById('dots').innerHTML=Array.from({length:n},(_,i)=>`<div class="dot ${i<cur?'d':i===cur?'a':''}"></div>`).join('');}
function flip(){flipped=!flipped;document.getElementById('cardInner').classList.toggle('flipped',flipped);}
function mark(known){if(known)gotCount++;else missed.push(deck[cur]);cur++;renderCard();}
function showEnd(){document.getElementById('cardArea').style.display='none';document.getElementById('btnRow').style.display='none';const pct=Math.round((gotCount/deck.length)*100);document.getElementById('endPct').textContent=pct+'%';document.getElementById('endTitle').textContent=pct>=80?'🎉 Excellent!':pct>=60?'👍 Good Progress':'📚 Keep Studying';document.getElementById('endSub').textContent='Completed '+deck.length+' cards.';document.getElementById('endBox').classList.add('show');}
function restart(){initDeck();}
function reviewMissed(){if(!missed.length){restart();return;}deck=shuffle([...missed]);cur=0;gotCount=0;missed=[];flipped=false;document.getElementById('endBox').classList.remove('show');document.getElementById('cardArea').style.display='';document.getElementById('btnRow').style.display='';renderCard();}
document.addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'){e.preventDefault();flip();}if(e.key==='ArrowRight')mark(true);if(e.key==='ArrowLeft')mark(false);});
initDeck();
</script>
</body>
</html>
