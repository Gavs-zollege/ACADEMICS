<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossary — Professionalism in the Clinical Setting</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:rgba(255,255,255,.07);--red:#e05a3a;--red-dim:rgba(224,90,58,.15);--text:#fff;--muted:#6b7280;--muted2:#9ca3af;--pill-bg:rgba(255,255,255,.06);--pill-border:rgba(255,255,255,.12);}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.page{height:100vh;overflow:hidden;display:grid;grid-template-rows:auto auto auto 1fr;max-width:820px;margin:0 auto;padding:0 32px;}
.hdr{padding:26px 0 12px;}
.hdr-eye{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:6px;}
.hdr h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:36px;font-weight:800;color:var(--text);margin-bottom:3px;line-height:1.05;}
.hdr-sub{font-size:13px;color:var(--muted2);}
.search-wrap{padding:10px 0 8px;}
.search-inner{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;}
.search-icon{color:var(--muted);font-size:14px;}
.search-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;}
.search-input::placeholder{color:var(--muted);}
.filter-area{padding-bottom:8px;}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.pill{padding:4px 12px;border-radius:999px;border:1px solid var(--pill-border);background:var(--pill-bg);color:var(--muted2);font-size:11px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap;}
.pill:hover{border-color:rgba(255,255,255,.22);color:var(--text);}
.pill.active{background:var(--red-dim);border-color:var(--red);color:var(--text);font-weight:600;}
.term-count{font-size:11px;color:var(--muted);}
.list-area{min-height:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.term-list{flex:1;overflow:hidden;}
.term-row{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;gap:14px;}
.term-row:last-child{border-bottom:none;}
.term-row:hover{background:rgba(255,255,255,.03);}
.term-left{display:flex;align-items:center;gap:12px;min-width:0;}
.red-bar{width:3px;border-radius:2px;background:var(--red);flex-shrink:0;}
.term-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-badge{flex-shrink:0;padding:2px 9px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--red-dim);color:var(--red);white-space:nowrap;}
.pager{background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:11px 22px;flex-shrink:0;}
.pager-btn{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;}
.pager-btn:hover:not(:disabled){border-color:rgba(255,255,255,.2);color:var(--text);}
.pager-btn:disabled{opacity:.3;cursor:default;}
.pager-dots{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;max-width:420px;}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;border:none;padding:0;transition:all .2s;}
.pdot.active{background:var(--red);transform:scale(1.3);}
.pdot.near{background:rgba(255,255,255,.3);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:26px 30px;max-width:500px;width:90%;transform:translateY(10px);transition:transform .2s;}
.overlay.open .modal{transform:translateY(0);}
.m-badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--red-dim);color:var(--red);margin-bottom:10px;}
.m-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:800;color:var(--text);margin-bottom:10px;}
.m-def{font-size:13px;color:var(--muted2);line-height:1.68;margin-bottom:10px;}
.m-note{background:rgba(224,90,58,.1);border-left:2px solid var(--red);padding:9px 12px;border-radius:0 7px 7px 0;font-size:12px;color:var(--text);line-height:1.6;display:none;}
.m-note.show{display:block;}
.m-note strong{color:var(--red);}
.m-close{margin-top:14px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;transition:all .18s;}
.m-close:hover{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="hdr-eye">Week 1 — Professionalism in the Clinical Setting</div>
    <h1>Glossary</h1>
    <div class="hdr-sub">Appearance · Communication · HIPAA · Ethics · Conflict · Time Management</div>
  </div>
  <div class="search-wrap">
    <div class="search-inner">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="searchInput" placeholder="Search terms or definitions…" oninput="onSearch()">
    </div>
  </div>
  <div class="filter-area">
    <div class="pills" id="pills"></div>
    <div class="term-count" id="termCount"></div>
  </div>
  <div class="list-area" id="listArea">
    <div class="term-list" id="termList"></div>
    <div class="pager" id="pager">
      <button class="pager-btn" id="btnPrev" onclick="changePage(-1)">← Prev</button>
      <div class="pager-dots" id="pagerDots"></div>
      <button class="pager-btn" id="btnNext" onclick="changePage(1)">Next →</button>
    </div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal">
    <div class="m-badge" id="mBadge"></div>
    <div class="m-name" id="mName"></div>
    <div class="m-def" id="mDef"></div>
    <div class="m-note" id="mNote"></div>
    <button class="m-close" onclick="closeModal()">Close</button>
  </div>
</div>
<script>
const TERMS=[
  {cat:"Professionalism",name:"Professionalism",def:"The consistent demonstration of conduct, aims, and qualities that mark a competent, ethical, and respectful member of a healthcare team.",note:"Professionalism is not just clinical skill — it includes appearance, communication, attitude, reliability, and how you respond under pressure."},
  {cat:"Professionalism",name:"Competence",def:"Being skilled, knowledgeable, and committed to continuous learning. A core pillar of professionalism — MAs must know what they are doing and stay current.",note:"Competence includes knowing your scope of practice — knowing what you CAN do is as important as knowing what you CANNOT."},
  {cat:"Professionalism",name:"Integrity",def:"Being honest, ethical, and trustworthy in all situations — even when no one is watching. Never falsifying documentation or cutting corners.",note:"<strong>Never falsify documentation.</strong> Falsifying a chart is fraud — a federal crime that can result in termination, loss of certification, and criminal prosecution."},
  {cat:"Professionalism",name:"Accountability",def:"Taking ownership of your mistakes, following through on commitments, and not making excuses when errors occur. A defining trait of a professional.",note:"When you make an error — report it immediately and honestly. Covering up a mistake is far more damaging than acknowledging it."},
  {cat:"Appearance",name:"Dress Code Standards",def:"Professional MA appearance: clean, properly fitted scrubs in the approved facility color; closed-toe non-slip shoes; minimal jewelry; ID badge visible at all times.",note:"Visible tattoos must be covered per policy. Facial piercings removed per policy. Natural nails only — no acrylics/gel in clinical settings (infection control)."},
  {cat:"Appearance",name:"Personal Hygiene Standards",def:"Daily bathing, deodorant, clean trimmed nails, minimal or no fragrance, and hair secured away from face. Non-negotiable in patient care settings.",note:"Minimal perfume/cologne is required because patients may have allergies, nausea, or chemical sensitivities. Strong fragrances in clinical settings are unprofessional."},
  {cat:"Communication",name:"Professional Verbal Communication",def:"Greeting patients by name, using a warm and calm tone, speaking clearly without slang, asking open-ended questions, and summarizing to confirm understanding.",note:"Never gossip about patients or colleagues. Never use dismissive language or sarcasm. The patient remembers how you made them feel."},
  {cat:"Communication",name:"Non-Verbal Communication",def:"Body language, eye contact, facial expressions, and physical presence. Maintaining eye contact, open posture, and knocking before entering all signal respect.",note:"Crossed arms = closed/defensive. Phone in hand = distracted. Speaking with your back to the patient = disrespectful. All of these are visible to patients."},
  {cat:"Communication",name:"Written / Digital Communication",def:"Using correct spelling and grammar, being brief and professional in emails, using approved EMR templates, and never using emoji in clinical records.",note:"<strong>Never delete or alter chart entries.</strong> Mistakes must be corrected with a single line through the error, initialed, and dated — not erased or whited-out."},
  {cat:"Communication",name:"Telephone Protocol",def:"Answer by the 3rd ring; state facility name, your name, and department; ask 'How may I help you?'; listen without interrupting; verify caller identity before sharing information.",note:"Never eat, chew gum, or whisper on a professional call. Document every message with date, time, and your name. Never do a dead transfer (transfer without staying on)."},
  {cat:"HIPAA",name:"HIPAA",def:"Health Insurance Portability and Accountability Act (1996). Federal law that protects individually identifiable health information (PHI). Every MA must understand and comply.",note:"<strong>Penalties:</strong> Civil fines $100–$50,000 per violation. Criminal penalties up to 10 years in prison. Immediate termination. Permanent career damage."},
  {cat:"HIPAA",name:"Protected Health Information (PHI)",def:"Any individually identifiable health information — includes name, address, DOB, phone, medical record numbers, diagnoses, treatment info, photos, and billing data.",note:"PHI must be protected in ALL forms: spoken conversations, written documents, electronic records, photos, and texts. Even a name + diagnosis is PHI."},
  {cat:"HIPAA",name:"HIPAA Violations — Common Examples",def:"Leaving the EMR open and unattended, discussing patients in public areas, posting on social media about work, texting patient info on personal phones.",note:"Social media posts can violate HIPAA even if no patient name is used — if the information is identifiable. Photos taken in clinical areas may violate HIPAA."},
  {cat:"HIPAA",name:"Mandatory Reporting",def:"MAs are required by law to report suspected abuse, neglect, or exploitation of children, elderly persons, and vulnerable adults. Failure to report is itself a crime.",note:"You do NOT need proof — reasonable suspicion is sufficient to trigger mandatory reporting. This is a legal obligation, not a choice."},
  {cat:"Ethics",name:"Scope of Practice",def:"The range of tasks an MA is legally authorized to perform, defined by state law, facility policy, provider supervision, and the MA's training and credentialing.",note:"Never perform a task beyond your scope, regardless of who asks. 'I don't know' and 'let me confirm with the provider' are always the safer answers."},
  {cat:"Ethics",name:"Professional Boundaries",def:"MAs must maintain appropriate boundaries with patients at all times — no accepting gifts, no exchanging personal contact information, no personal relationships with patients.",note:"If a patient asks you to connect on social media — politely decline, explain the professional boundary policy, and document the interaction in the visit notes."},
  {cat:"Ethics",name:"Dual Relationships",def:"Having a personal relationship (friend, family member, romantic partner) with a patient is a professional and ethical conflict of interest. MAs should not treat people they have personal relationships with.",note:"Emotional involvement compromises objectivity, judgment, and professional boundaries. If this situation arises, notify your supervisor and recuse yourself from the case."},
  {cat:"Ethics",name:"Cultural Sensitivity",def:"Treating every patient with equal respect regardless of race, religion, gender, age, disability, or lifestyle. Recognizing that implicit bias affects care quality.",note:"Cultural competence is not optional — it is a professional and ethical obligation. Adapt your communication style and approach to the individual patient's background."},
  {cat:"Conflict",name:"Receiving Constructive Criticism",def:"Listen without interrupting or becoming defensive → thank the person → ask clarifying questions → acknowledge what you can do differently → follow up to show it was taken seriously.",note:"Receiving feedback professionally is a career skill. How you respond to criticism reveals more about your professionalism than almost anything else."},
  {cat:"Conflict",name:"Conflict Resolution Steps",def:"Stay calm, address the issue privately, use 'I' statements, focus on the problem not the person, involve a supervisor if resolution isn't reached, document if necessary.",note:"When to escalate immediately: harassment, workplace violence, patient safety compromise, illegal activity, or HIPAA violations by staff."},
  {cat:"Time Management",name:"Punctuality Standards",def:"Arrive 10–15 minutes before your shift. Notify your supervisor ASAP if you will be late — call, do not text. Call at least 1–2 hours before your shift if calling out.",note:"Attendance and punctuality are the #1 reasons MAs lose externship placements. Being unreliable puts patients and teammates at risk."},
  {cat:"Time Management",name:"Task Prioritization",def:"Urgent patient needs come before administrative work. Complete tasks fully before starting new ones. Document in real time — do not rely on memory at the end of the shift.",note:"Anticipate the flow: know what's coming next in the schedule. Stock rooms, clean, and prep charts during lulls — don't wait to be asked."},
  {cat:"Time Management",name:"Burnout Warning Signs",def:"Chronic lateness, frequent absences, disengagement, irritability, cynicism, and making more errors than usual. Signals that support is needed.",note:"EAP (Employee Assistance Programs) are confidential resources available through employers. Seeking support is a sign of self-awareness — not weakness."},
];
const CATS=['All','Professionalism','Appearance','Communication','HIPAA','Ethics','Conflict','Time Management'];
const PER_PAGE=4;
let activeCat='All',searchQ='',currentPage=0,filtered=[];
function buildPills(){document.getElementById('pills').innerHTML=CATS.map(c=>`<button class="pill ${c===activeCat?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');}
function setFilter(c){activeCat=c;currentPage=0;buildPills();applyFilter();}
function onSearch(){searchQ=document.getElementById('searchInput').value.toLowerCase();currentPage=0;applyFilter();}
function applyFilter(){filtered=TERMS.filter(t=>{const mc=activeCat==='All'||t.cat===activeCat;const mq=!searchQ||t.name.toLowerCase().includes(searchQ)||t.def.toLowerCase().includes(searchQ);return mc&&mq;});renderPage();}
function renderPage(){
  const total=filtered.length,totalPages=Math.max(1,Math.ceil(total/PER_PAGE));
  if(currentPage>=totalPages)currentPage=totalPages-1;
  const items=filtered.slice(currentPage*PER_PAGE,currentPage*PER_PAGE+PER_PAGE);
  document.getElementById('termCount').textContent=`${total} term${total!==1?'s':''} · Page ${currentPage+1} of ${totalPages}`;
  const la=document.getElementById('listArea'),pg=document.getElementById('pager');
  const rowH=Math.floor((la.clientHeight-pg.offsetHeight)/PER_PAGE),barH=Math.floor(rowH*.38);
  document.getElementById('termList').innerHTML=items.map(t=>`<div class="term-row" style="height:${rowH}px" onclick="openModal(${filtered.indexOf(t)})"><div class="term-left"><div class="red-bar" style="height:${barH}px"></div><div class="term-name">${t.name}</div></div><div class="cat-badge">${t.cat}</div></div>`).join('');
  document.getElementById('pagerDots').innerHTML=Array.from({length:totalPages},(_,i)=>`<button class="pdot${i===currentPage?' active':Math.abs(i-currentPage)<=2?' near':''}" onclick="goPage(${i})"></button>`).join('');
  document.getElementById('btnPrev').disabled=currentPage===0;document.getElementById('btnNext').disabled=currentPage>=totalPages-1;
}
function changePage(d){currentPage=Math.max(0,Math.min(Math.max(1,Math.ceil(filtered.length/PER_PAGE))-1,currentPage+d));renderPage();}
function goPage(n){currentPage=n;renderPage();}
function openModal(i){const t=filtered[i];document.getElementById('mBadge').textContent=t.cat;document.getElementById('mName').textContent=t.name;document.getElementById('mDef').textContent=t.def;const n=document.getElementById('mNote');if(t.note){n.innerHTML=t.note;n.className='m-note show';}else{n.className='m-note';}document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function maybeClose(e){if(e.target===document.getElementById('overlay'))closeModal();}
buildPills();applyFilter();
window.addEventListener('resize',renderPage);
</script>
</body>
</html>
