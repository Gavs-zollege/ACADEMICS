<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glossary — Infection Control in Healthcare</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:rgba(255,255,255,.07);--red:#e05a3a;--red-dim:rgba(224,90,58,.15);--text:#fff;--muted:#6b7280;--muted2:#9ca3af;--pill-bg:rgba(255,255,255,.06);--pill-border:rgba(255,255,255,.12);}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.page{height:100vh;overflow:hidden;display:grid;grid-template-rows:auto auto auto 1fr;max-width:820px;margin:0 auto;padding:0 32px;}
.hdr{padding:24px 0 12px;}
.hdr-eye{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:6px;}
.hdr h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:34px;font-weight:800;color:var(--text);margin-bottom:3px;line-height:1.05;}
.hdr-sub{font-size:13px;color:var(--muted2);}
.search-wrap{padding:10px 0 8px;}
.search-inner{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;}
.search-icon{color:var(--muted);font-size:14px;}
.search-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:13px;}
.search-input::placeholder{color:var(--muted);}
.filter-area{padding-bottom:8px;}
.pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.pill{padding:4px 12px;border-radius:999px;border:1px solid var(--pill-border);background:var(--pill-bg);color:var(--muted2);font-size:11px;font-weight:500;cursor:pointer;transition:all .18s;white-space:nowrap;}
.pill:hover{border-color:rgba(255,255,255,.22);color:var(--text);}
.pill.active{background:var(--red-dim);border-color:var(--red);color:var(--text);font-weight:600;}
.term-count{font-size:11px;color:var(--muted);}
.list-area{min-height:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
.term-list{flex:1;overflow:hidden;}
.term-row{display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;gap:14px;}
.term-row:last-child{border-bottom:none;}
.term-row:hover{background:rgba(255,255,255,.03);}
.term-left{display:flex;align-items:center;gap:12px;min-width:0;}
.red-bar{width:3px;border-radius:2px;background:var(--red);flex-shrink:0;}
.term-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cat-badge{flex-shrink:0;padding:2px 9px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--red-dim);color:var(--red);white-space:nowrap;}
.pager{background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:11px 22px;flex-shrink:0;}
.pager-btn{padding:6px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--muted2);font-size:12px;font-weight:600;cursor:pointer;transition:all .18s;}
.pager-btn:hover:not(:disabled){border-color:rgba(255,255,255,.2);color:var(--text);}
.pager-btn:disabled{opacity:.3;cursor:default;}
.pager-dots{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center;max-width:420px;}
.pdot{width:7px;height:7px;border-radius:50%;background:var(--border);cursor:pointer;border:none;padding:0;transition:all .2s;}
.pdot.active{background:var(--red);transform:scale(1.3);}
.pdot.near{background:rgba(255,255,255,.3);}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.87);z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal{background:var(--card);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:26px 30px;max-width:500px;width:90%;transform:translateY(10px);transition:transform .2s;}
.overlay.open .modal{transform:translateY(0);}
.m-badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--red-dim);color:var(--red);margin-bottom:10px;}
.m-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:19px;font-weight:800;color:var(--text);margin-bottom:10px;}
.m-def{font-size:13px;color:var(--muted2);line-height:1.68;margin-bottom:10px;}
.m-note{background:rgba(224,90,58,.1);border-left:2px solid var(--red);padding:9px 12px;border-radius:0 7px 7px 0;font-size:12px;color:var(--text);line-height:1.6;display:none;}
.m-note.show{display:block;}
.m-note strong{color:var(--red);}
.m-close{margin-top:14px;width:100%;padding:8px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:12px;cursor:pointer;transition:all .18s;}
.m-close:hover{border-color:var(--red);color:var(--red);}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="hdr-eye">Week 2 — Infection Control in Healthcare</div>
    <h1>Glossary</h1>
    <div class="hdr-sub">Chain of Infection · Transmission · Hand Hygiene · PPE · Asepsis · HAIs/OSHA</div>
  </div>
  <div class="search-wrap">
    <div class="search-inner">
      <span class="search-icon">⌕</span>
      <input class="search-input" id="searchInput" placeholder="Search terms or definitions…" oninput="onSearch()">
    </div>
  </div>
  <div class="filter-area">
    <div class="pills" id="pills"></div>
    <div class="term-count" id="termCount"></div>
  </div>
  <div class="list-area" id="listArea">
    <div class="term-list" id="termList"></div>
    <div class="pager" id="pager">
      <button class="pager-btn" id="btnPrev" onclick="changePage(-1)">← Prev</button>
      <div class="pager-dots" id="pagerDots"></div>
      <button class="pager-btn" id="btnNext" onclick="changePage(1)">Next →</button>
    </div>
  </div>
</div>
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal">
    <div class="m-badge" id="mBadge"></div>
    <div class="m-name" id="mName"></div>
    <div class="m-def" id="mDef"></div>
    <div class="m-note" id="mNote"></div>
    <button class="m-close" onclick="closeModal()">Close</button>
  </div>
</div>
<script>
const TERMS=[
  {cat:"Chain of Infection",name:"Chain of Infection",def:"The six-link sequence required for disease transmission: Infectious Agent, Reservoir, Portal of Exit, Mode of Transmission, Portal of Entry, Susceptible Host. Breaking any one link stops transmission.",note:"This concept underlies ALL infection control practice — every intervention (hand hygiene, PPE, isolation) targets breaking one or more links."},
  {cat:"Chain of Infection",name:"Reservoir",def:"Where the pathogen lives and multiplies — can be humans, animals, or the environment. Broken by treating infected individuals and environmental cleaning.",note:"A reservoir doesn't have to be a sick person — contaminated equipment or surfaces can serve as reservoirs too."},
  {cat:"Chain of Infection",name:"Portal of Entry / Exit",def:"Portal of Exit = how the pathogen leaves its reservoir (coughing, wounds, secretions). Portal of Entry = how it enters a new host (mucous membranes, broken skin, inhalation).",note:"PPE breaks portal of entry (gloves, masks protect your entry points) while covering coughs breaks portal of exit."},
  {cat:"Chain of Infection",name:"Susceptible Host",def:"A person who lacks sufficient resistance to the infectious agent. Broken by vaccines, good nutrition, immunizations, and reducing individual risk factors.",note:"Immunocompromised patients, infants, and the elderly are typically more susceptible hosts requiring extra precautions."},
  {cat:"Transmission",name:"Contact Transmission",def:"Direct contact = pathogen transfers person-to-person through touch, blood, body fluids. Indirect contact = transfer via contaminated objects (fomites) like doorknobs or equipment.",note:"Prevented by gloves, gowns, hand hygiene, dedicated equipment, and Contact Precautions."},
  {cat:"Transmission",name:"Droplet Transmission",def:"Large respiratory droplets (>5µm) expelled during coughing, sneezing, or talking. These droplets travel less than 6 feet before settling.",note:"Prevented by a surgical mask and eye protection within 3 feet, plus Droplet Precautions."},
  {cat:"Transmission",name:"Airborne Transmission",def:"Very small particles (≤5µm) that remain suspended in air for hours and can travel long distances beyond the immediate patient area.",note:"Prevented by N95 respirator and a negative-pressure isolation room — Airborne Precautions."},
  {cat:"Transmission",name:"Vehicle & Vector Transmission",def:"Vehicle = contaminated food, water, medications, or blood products transmit the pathogen. Vector = arthropods (mosquitoes, ticks, fleas) carry pathogens between hosts.",note:"Prevented by safe food handling, safe injection practices, insect control, and proper storage protocols."},
  {cat:"Hand Hygiene",name:"WHO 5 Moments of Hand Hygiene",def:"Before touching a patient, before a clean/aseptic procedure, after body fluid exposure risk, after touching a patient, and after touching patient surroundings.",note:"80% of infections are transmitted by contaminated hands. Proper hand hygiene reduces HAIs by 30–50%."},
  {cat:"Hand Hygiene",name:"Soap & Water vs. ABHR",def:"Use soap and water when hands are visibly soiled, after C. diff contact, after restroom use, or before eating. Use alcohol-based hand rub (ABHR) for routine care when hands are not visibly soiled.",note:"C. diff spores are NOT killed by ABHR — soap and water mechanical removal is required for this specific organism."},
  {cat:"Hand Hygiene",name:"20-Second Hand Washing Technique",def:"Wet hands → apply soap, lathering backs/between fingers/nails → scrub at least 20 seconds → rinse thoroughly → dry with paper towel, using the towel to turn off the faucet.",note:"20 seconds is roughly the time it takes to sing 'Happy Birthday' twice — a commonly used timing reference."},
  {cat:"Precautions",name:"Standard Precautions",def:"The minimum infection prevention practices applied to ALL patients at ALL times, regardless of diagnosis. Treats every patient's blood and body fluids as potentially infectious.",note:"Includes hand hygiene, gloves, mask/eye protection when indicated, gown when indicated, safe injection practices, sharps disposal, environmental cleaning, and respiratory hygiene."},
  {cat:"Precautions",name:"Transmission-Based Precautions",def:"Additional precautions layered ON TOP of Standard Precautions for known or suspected pathogens: Contact, Droplet, and Airborne.",note:"These are added based on the specific organism's known transmission route — never a replacement for Standard Precautions, always in addition."},
  {cat:"PPE",name:"Donning Sequence",def:"1. Hand hygiene 2. Gown 3. Mask or respirator 4. Eye protection/face shield 5. Gloves (last — pulled over gown cuffs to create a seal).",note:"Gloves go on LAST during donning because they need to seal over the gown cuffs."},
  {cat:"PPE",name:"Doffing Sequence",def:"1. Gloves (most contaminated, removed first) 2. Hand hygiene 3. Gown 4. Hand hygiene 5. Eye protection 6. Mask/respirator 7. Hand hygiene (final step).",note:"<strong>Doffing is riskier than donning.</strong> Gloves come off FIRST because they're the most contaminated item — opposite order from donning."},
  {cat:"Asepsis",name:"Medical Asepsis (Clean Technique)",def:"Reduces the number and spread of microorganisms. The standard for most routine MA tasks: hand hygiene, gloves, clean equipment, proper waste disposal, cleaning exam rooms.",note:"Medical asepsis is the default for the vast majority of everyday MA clinical tasks."},
  {cat:"Asepsis",name:"Surgical Asepsis (Sterile Technique)",def:"Eliminates ALL microorganisms from an area. Required for any procedure breaking the skin or entering a sterile body cavity: sterile gloves, drapes, instruments, sterile field maintenance.",note:"<strong>If in doubt, it's contaminated.</strong> When uncertain about sterility, always replace the item — never assume it's still sterile."},
  {cat:"Asepsis",name:"Sterile Field Rules",def:"Never turn your back on a sterile field. Moisture contaminates sterility (strike-through). Sterile items touch only sterile items. The outer 1-inch border of a drape is non-sterile. Gloved hands stay above waist level.",note:"An unobserved sterile field is considered contaminated — you must maintain constant visual supervision of any open sterile field."},
  {cat:"HAIs & OSHA",name:"Healthcare-Associated Infections (HAIs)",def:"Infections acquired during the course of receiving healthcare treatment, not present at admission. 1 in 31 hospital patients have an HAI; 70% are preventable.",note:"Common HAIs include CAUTI (catheter-associated UTI), CLABSI (central line bloodstream infection), VAP (ventilator-associated pneumonia), SSI (surgical site infection), and C. diff colitis."},
  {cat:"HAIs & OSHA",name:"OSHA Bloodborne Pathogen Standard",def:"Federal regulation requiring employers to protect workers from occupational exposure to blood and OPIM (Other Potentially Infectious Materials).",note:"Components: written Exposure Control Plan, engineering controls (safety sharps), work practice controls (no recapping), employer-provided PPE at no cost, Hepatitis B vaccination offered free, and a post-exposure protocol."},
  {cat:"HAIs & OSHA",name:"Post-Exposure Protocol",def:"The required sequence after a sharps injury or bloodborne pathogen exposure: immediate first aid → report to supervisor → medical evaluation → documentation.",note:"Post-exposure prophylaxis is time-sensitive — reporting and seeking medical evaluation immediately is critical for effectiveness."},
];
const CATS=['All','Chain of Infection','Transmission','Hand Hygiene','Precautions','PPE','Asepsis','HAIs & OSHA'];
const PER_PAGE=4;
let activeCat='All',searchQ='',currentPage=0,filtered=[];
function buildPills(){document.getElementById('pills').innerHTML=CATS.map(c=>`<button class="pill ${c===activeCat?'active':''}" onclick="setFilter('${c}')">${c}</button>`).join('');}
function setFilter(c){activeCat=c;currentPage=0;buildPills();applyFilter();}
function onSearch(){searchQ=document.getElementById('searchInput').value.toLowerCase();currentPage=0;applyFilter();}
function applyFilter(){filtered=TERMS.filter(t=>{const mc=activeCat==='All'||t.cat===activeCat;const mq=!searchQ||t.name.toLowerCase().includes(searchQ)||t.def.toLowerCase().includes(searchQ);return mc&&mq;});renderPage();}
function renderPage(){
  const total=filtered.length,totalPages=Math.max(1,Math.ceil(total/PER_PAGE));
  if(currentPage>=totalPages)currentPage=totalPages-1;
  const items=filtered.slice(currentPage*PER_PAGE,currentPage*PER_PAGE+PER_PAGE);
  document.getElementById('termCount').textContent=`${total} term${total!==1?'s':''} · Page ${currentPage+1} of ${totalPages}`;
  const la=document.getElementById('listArea'),pg=document.getElementById('pager');
  const rowH=Math.floor((la.clientHeight-pg.offsetHeight)/PER_PAGE),barH=Math.floor(rowH*.38);
  document.getElementById('termList').innerHTML=items.map(t=>`<div class="term-row" style="height:${rowH}px" onclick="openModal(${filtered.indexOf(t)})"><div class="term-left"><div class="red-bar" style="height:${barH}px"></div><div class="term-name">${t.name}</div></div><div class="cat-badge">${t.cat}</div></div>`).join('');
  document.getElementById('pagerDots').innerHTML=Array.from({length:totalPages},(_,i)=>`<button class="pdot${i===currentPage?' active':Math.abs(i-currentPage)<=2?' near':''}" onclick="goPage(${i})"></button>`).join('');
  document.getElementById('btnPrev').disabled=currentPage===0;document.getElementById('btnNext').disabled=currentPage>=totalPages-1;
}
function changePage(d){currentPage=Math.max(0,Math.min(Math.max(1,Math.ceil(filtered.length/PER_PAGE))-1,currentPage+d));renderPage();}
function goPage(n){currentPage=n;renderPage();}
function openModal(i){const t=filtered[i];document.getElementById('mBadge').textContent=t.cat;document.getElementById('mName').textContent=t.name;document.getElementById('mDef').textContent=t.def;const n=document.getElementById('mNote');if(t.note){n.innerHTML=t.note;n.className='m-note show';}else{n.className='m-note';}document.getElementById('overlay').classList.add('open');}
function closeModal(){document.getElementById('overlay').classList.remove('open');}
function maybeClose(e){if(e.target===document.getElementById('overlay'))closeModal();}
buildPills();applyFilter();
window.addEventListener('resize',renderPage);
</script>
</body>
</html>
