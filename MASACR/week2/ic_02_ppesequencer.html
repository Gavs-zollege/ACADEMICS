<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PPE Sequencer — Infection Control in Healthcare</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:rgba(255,255,255,.07);--red:#e05a3a;--text:#fff;--muted:#6b7280;--muted2:#9ca3af;--green:#4caf82;--rose:#e05a5a;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.page{height:100vh;overflow:hidden;display:grid;grid-template-rows:auto auto auto 1fr auto;padding:0 20px;max-width:680px;margin:0 auto;}
.hdr{text-align:center;padding:16px 0 6px;}
.hdr-eye{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:3px;}
.hdr h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:21px;font-weight:800;margin-bottom:2px;}
.hdr p{font-size:12px;color:var(--muted2);margin-bottom:8px;}
.mode-row{display:flex;gap:8px;justify-content:center;padding-bottom:6px;}
.mode-btn{padding:6px 16px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted2);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;}
.mode-btn.active{background:rgba(224,90,58,.12);border-color:var(--red);color:var(--text);}
.timer-chip{padding:5px 16px;border-radius:20px;border:1px solid var(--border);background:var(--surface);font-size:13px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:8px;margin:0 auto;width:fit-content;}
.timer-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.body{display:flex;gap:0;overflow:hidden;min-height:0;}
.slots{flex:1;display:grid;gap:6px;padding:10px 14px 10px 18px;overflow:hidden;min-height:0;}
.slot{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:8px 14px;transition:all .2s;min-height:0;}
.slot.drag-over{border-color:rgba(224,90,58,.5);background:rgba(224,90,58,.04);}
.slot.correct{border-color:rgba(76,175,130,.55);background:rgba(76,175,130,.04);}
.slot.wrong{border-color:rgba(224,90,90,.55);background:rgba(224,90,90,.04);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0)}30%{transform:translateX(-5px)}70%{transform:translateX(5px)}}
.slot-num{width:24px;height:24px;border-radius:6px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:var(--muted);flex-shrink:0;}
.slot.correct .slot-num{border-color:var(--green);color:var(--green);}
.slot.wrong .slot-num{border-color:var(--rose);color:var(--rose);}
.slot-inner{flex:1;min-width:0;}
.slot-placed{font-family:'Plus Jakarta Sans',sans-serif;font-size:12px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.slot-empty{font-size:11px;color:var(--border);font-style:italic;}
.chip-bank{width:190px;flex-shrink:0;background:var(--surface);border-left:1px solid var(--border);display:grid;gap:6px;padding:10px;overflow:hidden;min-height:0;align-content:start;}
.bank-lbl{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:0 4px;}
.chip{padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--card);font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;color:var(--text);cursor:grab;user-select:none;transition:all .2s;}
.chip:hover{border-color:rgba(224,90,58,.4);}
.chip.dragging{opacity:.35;}
.chip.used{opacity:.22;border-style:dashed;pointer-events:none;}
.bottom{background:var(--surface);border-top:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;justify-content:center;gap:12px;}
.btn{padding:9px 22px;border-radius:10px;font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s;}
.btn-red{background:var(--red);color:#fff;}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--muted);}
.btn-outline:hover{border-color:rgba(255,255,255,.2);color:var(--text);}
.overlay{position:fixed;inset:0;background:rgba(8,12,20,.88);z-index:50;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
.overlay.show{opacity:1;pointer-events:all;}
.result-box{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:40px 52px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;}
.r-big{font-size:48px;font-weight:800;color:var(--red);}
.r-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;}
.r-time{font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="hdr-eye">Infection Control in Healthcare</div>
    <h1>PPE Sequencer</h1>
    <p>Drag each step into the correct order.</p>
    <div class="mode-row">
      <button class="mode-btn active" onclick="setMode('don',this)">Donning</button>
      <button class="mode-btn" onclick="setMode('doff',this)">Doffing</button>
    </div>
    <div class="timer-chip"><div class="timer-dot"></div><span id="timerChip">0:00</span></div>
  </div>
  <div class="body">
    <div class="slots" id="slots"></div>
    <div class="chip-bank" id="chipBank"><div class="bank-lbl">Drag to slot →</div></div>
  </div>
  <div class="bottom">
    <button class="btn btn-outline" onclick="reset()">Reset</button>
    <button class="btn btn-red" onclick="check()">Check Sequence</button>
  </div>
</div>
<div class="overlay" id="overlay">
  <div class="result-box">
    <div class="r-big" id="rBig"></div>
    <div class="r-title" id="rTitle"></div>
    <div class="r-time" id="rTime"></div>
    <button class="btn btn-red" onclick="reset()" style="margin-top:8px">Try Again</button>
  </div>
</div>
<script>
const SEQUENCES={
  don:[
    {step:"Hand Hygiene",key:"hygiene1"},
    {step:"Gown",key:"gown"},
    {step:"Mask or Respirator",key:"mask"},
    {step:"Eye Protection / Face Shield",key:"eyes"},
    {step:"Gloves",key:"gloves"},
  ],
  doff:[
    {step:"Gloves (most contaminated)",key:"gloves"},
    {step:"Hand Hygiene",key:"hygiene1"},
    {step:"Gown",key:"gown"},
    {step:"Hand Hygiene",key:"hygiene2"},
    {step:"Eye Protection",key:"eyes"},
    {step:"Mask / Respirator",key:"mask"},
    {step:"Hand Hygiene (final)",key:"hygiene3"},
  ]
};

let mode='don', placements={}, dragging=null, startTime=null, timerInterval=null, shuffled=[];
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function getSeq(){return SEQUENCES[mode];}
function getItem(k){return getSeq().find(s=>s.key===k)||{};}

function setMode(m,el){
  mode=m;
  document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  reset();
}

function renderSlots(){
  const seq=getSeq();
  document.getElementById('slots').style.gridTemplateRows=`repeat(${seq.length},1fr)`;
  document.getElementById('slots').innerHTML=seq.map((s,i)=>`
    <div class="slot" id="slot-${i}" ondragover="dov(event)" ondrop="dp(event,${i})" ondragleave="dl(event)">
      <div class="slot-num">${i+1}</div>
      <div class="slot-inner">
        ${placements[i]?`<div class="slot-placed">${getItem(placements[i]).step}</div>`:`<div class="slot-empty">Drop step ${i+1} here…</div>`}
      </div>
    </div>`).join('');
}
function renderChips(){
  const bank=document.getElementById('chipBank');
  const label=bank.querySelector('.bank-lbl');
  bank.innerHTML='';
  bank.appendChild(label);
  bank.style.gridTemplateRows=`auto repeat(${getSeq().length},1fr)`;
  shuffled.forEach(item=>{
    const div=document.createElement('div');
    div.className='chip'+(Object.values(placements).includes(item.key)?' used':'');
    div.draggable=true;
    div.textContent=item.step;
    div.id='chip-'+item.key;
    div.ondragstart=()=>ds(item.key);
    div.ondragend=de;
    bank.appendChild(div);
  });
}
function ds(k){dragging=k;if(!startTime){startTime=Date.now();startTimer();}setTimeout(()=>{const el=document.getElementById('chip-'+k);if(el)el.classList.add('dragging');},0);}
function de(){document.querySelectorAll('.chip').forEach(c=>c.classList.remove('dragging'));}
function dov(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function dl(e){e.currentTarget.classList.remove('drag-over');}
function dp(e,idx){
  e.preventDefault();e.currentTarget.classList.remove('drag-over');
  if(!dragging)return;
  Object.keys(placements).forEach(k=>{if(placements[k]===dragging)delete placements[k];});
  placements[idx]=dragging;dragging=null;renderSlots();renderChips();
}
function check(){
  let ok=0;
  const seq=getSeq();
  seq.forEach((s,i)=>{
    const el=document.getElementById('slot-'+i);
    if(!el)return;
    el.classList.remove('correct','wrong');
    if(!placements[i])return;
    if(placements[i]===s.key){el.classList.add('correct');ok++;}
    else{el.classList.add('wrong');}
  });
  if(Object.keys(placements).length===seq.length){
    clearInterval(timerInterval);
    const elapsed=Math.round((Date.now()-startTime)/1000);
    const m=Math.floor(elapsed/60),s=elapsed%60;
    setTimeout(()=>{
      document.getElementById('rBig').textContent=ok+'/'+seq.length;
      document.getElementById('rTitle').textContent=ok===seq.length?'🏆 Perfect Sequence!':ok>=seq.length-1?'⭐ Almost Perfect!':'📚 Review the Order';
      document.getElementById('rTime').textContent='Completed in '+m+':'+(s+'').padStart(2,'0');
      document.getElementById('overlay').classList.add('show');
    },600);
  }
}
function startTimer(){timerInterval=setInterval(()=>{const e=Math.round((Date.now()-startTime)/1000);const m=Math.floor(e/60),s=e%60;document.getElementById('timerChip').textContent=m+':'+(s+'').padStart(2,'0');},1000);}
function reset(){
  placements={};dragging=null;startTime=null;clearInterval(timerInterval);
  document.getElementById('timerChip').textContent='0:00';
  document.getElementById('overlay').classList.remove('show');
  shuffled=shuffle(getSeq());
  renderSlots();renderChips();
}
reset();
</script>
</body>
</html>
