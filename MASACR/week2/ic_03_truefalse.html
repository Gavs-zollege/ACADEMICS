<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>True or False — Infection Control in Healthcare</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--bg:#0d0d0d;--surface:#141414;--card:#1a1a1a;--border:rgba(255,255,255,.07);--red:#e05a3a;--text:#fff;--muted:#6b7280;--muted2:#9ca3af;--green:#4caf82;--rose:#e05a5a;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.page{height:100vh;overflow:hidden;display:grid;grid-template-rows:auto auto auto 1fr auto auto;padding:0 20px;max-width:660px;margin:0 auto;}
.hdr{text-align:center;padding:18px 0 8px;}
.hdr-eye{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:4px;}
.hdr h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:22px;font-weight:800;margin-bottom:3px;}
.hdr p{font-size:12px;color:var(--muted2);margin-bottom:8px;}
.dots{display:flex;align-items:center;gap:5px;justify-content:center;}
.dot{width:8px;height:5px;border-radius:3px;background:var(--border);transition:all .3s;}
.dot.a{width:26px;background:var(--red);}
.dot.d{background:var(--green);}
.hud{display:flex;gap:10px;justify-content:center;padding:4px 0 8px;}
.hud-chip{padding:4px 13px;border-radius:20px;font-size:11px;font-weight:700;border:1px solid;}
.hud-chip.s{background:rgba(224,90,58,.1);color:var(--red);border-color:rgba(224,90,58,.4);}
.hud-chip.st{background:rgba(76,175,130,.1);color:var(--green);border-color:rgba(76,175,130,.4);}
.cat-pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:rgba(59,163,184,.12);color:#3ba3b8;width:fit-content;margin-bottom:6px;}
.q-box{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;}
.q-text{font-size:13px;color:var(--text);line-height:1.65;}
.q-num{font-size:11px;color:var(--muted);font-weight:600;flex-shrink:0;}
.opts-area{display:flex;flex-direction:column;gap:8px;min-height:0;overflow:hidden;justify-content:center;}
.opt{width:100%;text-align:left;padding:14px 18px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;gap:14px;}
.opt:hover:not(:disabled){border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.03);}
.opt:disabled{cursor:default;}
.opt.correct{border-color:rgba(76,175,130,.55);background:rgba(76,175,130,.08);}
.opt.wrong{border-color:rgba(224,90,90,.55);background:rgba(224,90,90,.08);}
.opt-letter{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted);flex-shrink:0;}
.opt.correct .opt-letter{border-color:var(--green);color:var(--green);background:rgba(76,175,130,.12);}
.opt.wrong .opt-letter{border-color:var(--rose);color:var(--rose);background:rgba(224,90,90,.12);}
.fb{padding:10px 16px;border-radius:10px;font-size:12px;line-height:1.55;display:none;margin:4px 0 0;}
.fb.show{display:block;}
.fb.ok{background:rgba(76,175,130,.1);border:1px solid rgba(76,175,130,.3);}
.fb.no{background:rgba(224,90,90,.1);border:1px solid rgba(224,90,90,.3);}
.fb strong{display:block;margin-bottom:3px;}
.fb.ok strong{color:var(--green);}
.fb.no strong{color:var(--rose);}
.next-btn{padding:10px 26px;border-radius:10px;border:none;background:var(--red);color:#fff;font-size:13px;font-weight:800;cursor:pointer;display:none;margin:8px auto 10px;width:fit-content;}
.next-btn.show{display:block;}
.end-box{display:none;flex-direction:column;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:36px 48px;text-align:center;grid-row:1/7;align-self:center;}
.end-box.show{display:flex;}
.end-pct{font-size:50px;font-weight:800;color:var(--red);}
.end-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;}
.end-sub{font-size:12px;color:var(--muted);}
.end-stats{display:flex;gap:14px;}
.stat{padding:10px 18px;border-radius:10px;text-align:center;}
.stat.g{background:rgba(76,175,130,.1);}
.stat.r{background:rgba(224,90,90,.1);}
.stat-n{font-size:22px;font-weight:800;}
.stat.g .stat-n{color:var(--green);}
.stat.r .stat-n{color:var(--rose);}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px;}
.restart-btn{padding:10px 24px;border-radius:10px;border:none;background:var(--red);color:#fff;font-size:13px;font-weight:800;cursor:pointer;margin-top:4px;}
</style>
</head>
<body>
<div class="page">
  <div class="hdr">
    <div class="hdr-eye">Infection Control in Healthcare</div>
    <h1>True or False</h1>
    <p>Select the best answer for each question.</p>
    <div class="dots" id="dots"></div>
  </div>
  <div class="hud"><div class="hud-chip s">Score: <span id="sc">0</span></div><div class="hud-chip st">🔥 Streak: <span id="str">0</span></div></div>
  <div id="qArea">
    <div class="cat-pill" id="catPill"></div>
    <div class="q-box"><div class="q-text" id="qText"></div><div class="q-num" id="qNum"></div></div>
  </div>
  <div class="opts-area" id="opts"></div>
  <div class="fb" id="fb"></div>
  <button class="next-btn" id="nextBtn" onclick="next()">Next →</button>
  <div class="end-box" id="endBox">
    <div class="end-pct" id="endPct"></div>
    <div class="end-title" id="endTitle"></div>
    <div class="end-sub" id="endSub"></div>
    <div class="end-stats"><div class="stat g"><div class="stat-n" id="eOk">0</div><div class="stat-l">Correct</div></div><div class="stat r"><div class="stat-n" id="eNo">0</div><div class="stat-l">Incorrect</div></div></div>
    <button class="restart-btn" onclick="init()">Play Again</button>
  </div>
</div>
<script>
const QS=[
  {cat:"Chain of Infection",stmt:"Breaking just one link in the chain of infection is enough to stop disease transmission.",correct:true,ok:"TRUE — All six links must be intact for transmission to occur. Breaking any single link (agent, reservoir, exit, transmission, entry, host) stops the chain.",no:"TRUE — Disease transmission requires ALL six links. Breaking any one of them — agent, reservoir, exit, transmission route, entry, or host susceptibility — stops transmission."},
  {cat:"Hand Hygiene",stmt:"Alcohol-based hand rub (ABHR) is effective against C. difficile spores.",correct:false,ok:"FALSE — ABHR does NOT kill C. diff spores. Soap and water mechanical washing is required for C. diff — this is a critical exception to standard ABHR use.",no:"FALSE — C. diff spores are resistant to alcohol-based hand rub. Soap and water hand hygiene is required after contact with C. diff patients."},
  {cat:"Hand Hygiene",stmt:"Proper hand hygiene can reduce healthcare-associated infections by 30–50%.",correct:true,ok:"TRUE — Hand hygiene is the single most powerful infection control intervention, reducing HAIs by 30–50% when performed correctly and consistently.",no:"TRUE — Hand hygiene reduces HAIs by 30–50%. About 80% of infections are transmitted by contaminated hands — making this the #1 intervention."},
  {cat:"Transmission",stmt:"Droplet transmission involves particles that remain suspended in the air for hours and travel long distances.",correct:false,ok:"FALSE — That description is AIRBORNE transmission. Droplet transmission involves larger particles (>5µm) that travel less than 6 feet before settling.",no:"FALSE — Airborne particles (≤5µm) stay suspended for hours and travel far. Droplets (>5µm) are heavier and fall within 6 feet — a key distinction."},
  {cat:"Precautions",stmt:"Standard Precautions only need to be applied to patients with a known infectious diagnosis.",correct:false,ok:"FALSE — Standard Precautions apply to ALL patients, at ALL times, regardless of known diagnosis. Every patient's blood and body fluids are treated as potentially infectious.",no:"FALSE — Standard Precautions are universal — applied to every patient regardless of diagnosis. Transmission-Based Precautions are the ones added for known/suspected infections."},
  {cat:"PPE",stmt:"During PPE donning, gloves should be put on first to protect your hands immediately.",correct:false,ok:"FALSE — Gloves are put on LAST during donning, after gown, mask, and eye protection — pulled over the gown cuffs to create a proper seal.",no:"FALSE — Donning order: Hand hygiene → Gown → Mask → Eye protection → Gloves (last). Gloves go on last to seal over the gown cuffs."},
  {cat:"PPE",stmt:"During PPE doffing, gloves should be removed first because they are the most contaminated item.",correct:true,ok:"TRUE — Gloves are removed first during doffing, peeled inside-out, because they accumulate the most contamination during patient care.",no:"TRUE — Doffing order reverses risk priority: gloves come off first (most contaminated), followed by gown, then face protection, then mask — with hand hygiene between steps."},
  {cat:"Asepsis",stmt:"If you are uncertain whether an item in a sterile field is still sterile, you should assume it is sterile unless visibly contaminated.",correct:false,ok:"FALSE — The rule is 'if in doubt, it's contaminated.' Never assume sterility when uncertain — always replace the item rather than risk using a compromised sterile field.",no:"FALSE — The governing rule is the opposite: when in doubt, treat it as contaminated and replace it. Assuming sterility without certainty risks a surgical site infection."},
  {cat:"Asepsis",stmt:"A sterile field can be left briefly unattended as long as no one touches it.",correct:false,ok:"FALSE — An unobserved sterile field is considered contaminated. You must never turn your back on a sterile field — constant visual supervision is required.",no:"FALSE — Turning your back on a sterile field — even briefly — means it must be considered contaminated. Continuous observation is a non-negotiable rule of sterile technique."},
  {cat:"HAIs & OSHA",stmt:"Approximately 70% of healthcare-associated infections (HAIs) are preventable.",correct:true,ok:"TRUE — 70% of HAIs are preventable through proper infection control practices — hand hygiene, sterile technique, and appropriate precautions.",no:"TRUE — Despite HAIs affecting 1 in 31 hospital patients and costing $30B annually, 70% are preventable with consistent infection control practice."},
  {cat:"HAIs & OSHA",stmt:"Under OSHA's Bloodborne Pathogen Standard, employees must pay for their own Hepatitis B vaccination if they want it.",correct:false,ok:"FALSE — OSHA requires employers to offer the Hepatitis B vaccine to all at-risk employees AT NO COST. Employees are never required to pay for it.",no:"FALSE — Hepatitis B vaccination must be offered free of charge to at-risk employees under OSHA's Bloodborne Pathogen Standard. Employer-provided PPE is also required at no cost."},
  {cat:"Sterile Technique",stmt:"The outer 1-inch border of a sterile drape is considered sterile and safe to use.",correct:false,ok:"FALSE — The outer 1-inch edge of any sterile drape is considered NON-sterile by convention. Only the area inside that border is treated as the usable sterile field.",no:"FALSE — The 1-inch border rule states that the outer edge of a sterile drape is non-sterile. Only the interior area within that border counts as the sterile field."},
];
let questions=[],cur=0,score=0,streak=0,wrong=0,answered=false;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function init(){questions=shuffle(QS);cur=0;score=0;streak=0;wrong=0;answered=false;document.getElementById('endBox').classList.remove('show');document.getElementById('qArea').style.display='';document.getElementById('opts').style.display='';document.getElementById('fb').className='fb';document.getElementById('nextBtn').className='next-btn';updateHUD();render();}
function render(){answered=false;const q=questions[cur];document.getElementById('catPill').textContent=q.cat;document.getElementById('qText').textContent=q.stmt;document.getElementById('qNum').textContent='Q'+(cur+1);document.getElementById('opts').innerHTML=`<button class="opt" id="optT" onclick="pick(true)"><span class="opt-letter">T</span>True</button><button class="opt" id="optF" onclick="pick(false)"><span class="opt-letter">F</span>False</button>`;document.getElementById('fb').className='fb';document.getElementById('nextBtn').className='next-btn';buildDots();}
function buildDots(){document.getElementById('dots').innerHTML=Array.from({length:questions.length},(_,i)=>`<div class="dot ${i<cur?'d':i===cur?'a':''}"></div>`).join('');}
function pick(userTrue){if(answered)return;answered=true;const q=questions[cur];const isRight=(userTrue===q.correct);document.getElementById('optT').disabled=true;document.getElementById('optF').disabled=true;if(q.correct)document.getElementById('optT').classList.add('correct');else document.getElementById('optF').classList.add('correct');if(!isRight){if(userTrue)document.getElementById('optT').classList.add('wrong');else document.getElementById('optF').classList.add('wrong');}const fb=document.getElementById('fb');if(isRight){score++;streak++;fb.innerHTML=`<strong>✓ Correct!</strong>${q.ok}`;fb.className='fb ok show';}else{wrong++;streak=0;fb.innerHTML=`<strong>✗ Incorrect.</strong>${q.no}`;fb.className='fb no show';}updateHUD();document.getElementById('nextBtn').className='next-btn show';}
function next(){cur++;if(cur>=questions.length){showEnd();return;}render();}
function showEnd(){const pct=Math.round((score/questions.length)*100);document.getElementById('qArea').style.display='none';document.getElementById('opts').style.display='none';document.getElementById('fb').className='fb';document.getElementById('nextBtn').className='next-btn';document.getElementById('endPct').textContent=pct+'%';document.getElementById('endTitle').textContent=pct===100?'🏆 Perfect!':pct>=80?'🌟 Sharp Thinking!':pct>=60?'👍 Good Work':'📚 Review & Retry';document.getElementById('endSub').textContent='You answered '+questions.length+' true/false statements.';document.getElementById('eOk').textContent=score;document.getElementById('eNo').textContent=wrong;document.getElementById('endBox').classList.add('show');}
function updateHUD(){document.getElementById('sc').textContent=score;document.getElementById('str').textContent=streak;}
init();
</script>
</body>
</html>
