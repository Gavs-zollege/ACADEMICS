<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Makeup Class Tour</title>
<style>
:root{
  --navy:#06365F; --navy-d:#04223d; --blue:#4A8FD1; --blue-l:#e8f1fb; --gold:#F2B33D; --gold-d:#c98a12; --gold-l:#fff6e3;
  --ink:#1c2533; --muted:#5d6878; --line:#e2e7ee; --bg:#eef2f7; --ok:#1f8f52; --ok-l:#e5f5ec; --bad:#c2412d; --bad-l:#fdeae6;
  --head:Cambria,Georgia,"Times New Roman",serif; --body:Calibri,"Segoe UI",Carlito,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--body);color:var(--ink);background:var(--bg);overflow:hidden}
button{font-family:inherit}
.app{height:100vh;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:14px;padding:14px}

/* ===== Stage ===== */
.stagewrap{display:flex;flex-direction:column;min-width:0;min-height:0}
.browser{flex:1;display:flex;flex-direction:column;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 10px 30px rgba(6,54,95,.14),0 1px 3px rgba(6,54,95,.1);min-height:0}
.chrome{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#f3f5f8;border-bottom:1px solid var(--line);flex-shrink:0}
.lights{display:flex;gap:6px}.lights i{width:10px;height:10px;border-radius:50%;background:#d8dde4}
.lights i:nth-child(1){background:#f26b5e}.lights i:nth-child(2){background:#f5bf4f}.lights i:nth-child(3){background:#5fc454}
.url{flex:1;background:#fff;border:1px solid var(--line);border-radius:16px;padding:4px 12px;font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.url b{color:var(--ink);font-weight:600}
.lock{color:var(--ok)}
.viewport{flex:1;position:relative;min-height:0;display:grid;place-items:center;background:#fff;overflow:hidden}
.stage{position:relative;overflow:hidden}
.layer{position:absolute;left:0;top:0;transform-origin:0 0;transition:transform .7s cubic-bezier(.65,0,.35,1)}
.layer img{display:block;width:100%;height:100%;user-select:none;-webkit-user-drag:none}
.layer svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.dim{fill:rgba(4,34,61,.58);transition:opacity .4s}
.hole{transition:all .6s cubic-bezier(.65,0,.35,1)}
.ring{fill:none;stroke:var(--gold);stroke-width:3;transition:all .6s cubic-bezier(.65,0,.35,1);filter:drop-shadow(0 0 6px rgba(242,179,61,.8))}
.ring.pulse{animation:ring 1.6s ease-in-out infinite}
@keyframes ring{0%,100%{stroke-opacity:1;stroke-width:3}50%{stroke-opacity:.45;stroke-width:6}}
.hot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:8px}
.hot:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.tap{position:absolute;width:34px;height:34px;margin:-17px 0 0 -17px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 0 rgba(242,179,61,.7);animation:tap 1.6s infinite;pointer-events:none;display:grid;place-items:center;color:var(--navy-d);font-size:15px;font-weight:700}
@keyframes tap{0%{box-shadow:0 0 0 0 rgba(242,179,61,.7)}70%{box-shadow:0 0 0 18px rgba(242,179,61,0)}100%{box-shadow:0 0 0 0 rgba(242,179,61,0)}}
.shot-fade{animation:fade .45s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}

.tip{position:absolute;max-width:340px;background:var(--navy);color:#fff;border-radius:10px;padding:12px 14px;font-size:.95rem;line-height:1.4;box-shadow:0 8px 24px rgba(4,34,61,.35);transition:left .6s cubic-bezier(.65,0,.35,1),top .6s cubic-bezier(.65,0,.35,1),opacity .3s;z-index:5}
.tip b{color:var(--gold)}
.tip::before{content:"";position:absolute;width:14px;height:14px;background:var(--navy);transform:rotate(45deg);left:var(--ax,24px)}
.tip.below::before{top:-6px}.tip.above::before{bottom:-6px}
.tip .t-click{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:.82rem;color:#cfe2f5}
.miss{position:absolute;z-index:6;background:var(--bad);color:#fff;font-size:.82rem;padding:5px 10px;border-radius:14px;pointer-events:none;opacity:0;transform:translate(-50%,-140%);transition:opacity .2s}
.miss.show{opacity:1}

/* overlay badge in stage (e.g., grade swap) */
.badge{position:absolute;z-index:5;background:#fff;border-radius:12px;padding:14px 16px;box-shadow:0 10px 30px rgba(4,34,61,.35);display:flex;align-items:center;gap:12px;font-size:.95rem}
.pill{padding:6px 12px;border-radius:16px;font-weight:700;white-space:nowrap}
.pill.lab{background:var(--bad-l);color:var(--bad);text-decoration:line-through}
.pill.q{background:var(--ok-l);color:var(--ok)}
.arrow{font-size:1.4rem;color:var(--navy)}

/* full-stage cards (hero / check / finale) */
.card{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:4% 6%;overflow:auto;animation:fade .45s ease}
.hero{background:radial-gradient(1200px 500px at 85% -10%,rgba(74,143,209,.45),transparent 60%),linear-gradient(135deg,var(--navy) 0%,var(--navy-d) 100%);color:#fff}
.eyebrow{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:10px}
.hero h1{font-family:var(--head);font-size:clamp(1.8rem,3.6vw,3rem);line-height:1.08;margin-bottom:12px}
.hero h1 em{color:var(--gold);font-style:normal}
.hero .lead{font-size:clamp(1rem,1.4vw,1.2rem);max-width:640px;color:#d8e6f4;line-height:1.5;margin-bottom:22px}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:880px}
.s3{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:16px;backdrop-filter:blur(2px)}
.s3 .n{width:34px;height:34px;border-radius:50%;background:var(--gold);color:var(--navy-d);display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.s3 h3{font-family:var(--head);font-size:1.2rem;margin-bottom:4px}
.s3 p{font-size:.92rem;color:#cfe0f2;line-height:1.4}
.cta{margin-top:24px;align-self:flex-start;background:var(--gold);color:var(--navy-d);border:0;border-radius:28px;padding:12px 26px;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 6px 18px rgba(242,179,61,.35);transition:transform .15s}
.cta:hover{transform:translateY(-2px)}
.cta:focus-visible{outline:3px solid #fff;outline-offset:3px}

.check{background:linear-gradient(180deg,#fff,#f6f9fc)}
.check h2,.finale h2{font-family:var(--head);color:var(--navy);font-size:clamp(1.5rem,2.6vw,2.2rem);margin-bottom:6px}
.check .sub{color:var(--muted);margin-bottom:16px}
.qgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.qc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 2px 8px rgba(6,54,95,.05)}
.qc .qn{font-size:.75rem;font-weight:800;color:var(--blue);letter-spacing:.1em}
.qc .qt{font-family:var(--head);font-size:1.05rem;color:var(--navy);line-height:1.25;min-height:2.6em}
.opt{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;font-size:.92rem;cursor:pointer;transition:all .15s;line-height:1.3}
.opt:hover:not(:disabled){border-color:var(--blue);background:var(--blue-l)}
.opt:focus-visible{outline:3px solid var(--blue);outline-offset:1px}
.opt.right{border-color:var(--ok);background:var(--ok-l);font-weight:700}
.opt.wrong{border-color:var(--bad);background:var(--bad-l);animation:shake .35s}
.opt:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fb{font-size:.85rem;min-height:2.4em;color:var(--muted);line-height:1.3}
.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}

.finale{background:linear-gradient(135deg,#fff 0%,var(--blue-l) 100%)}
.finale .row{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;max-width:880px;margin:14px 0 18px}
.fs{background:#fff;border-radius:12px;padding:14px;border-top:4px solid var(--blue);box-shadow:0 2px 10px rgba(6,54,95,.08)}
.fs .n{font-weight:800;color:var(--blue);font-size:.8rem;letter-spacing:.1em}
.fs h3{font-family:var(--head);color:var(--navy);font-size:1.15rem;margin:2px 0 4px}
.fs p{font-size:.9rem;color:var(--muted);line-height:1.35}
.quote{font-family:var(--head);font-style:italic;font-size:clamp(1.1rem,1.7vw,1.4rem);color:var(--navy);max-width:760px;line-height:1.4;border-left:4px solid var(--gold);padding-left:14px}
.finale .cta{background:var(--navy);color:#fff;box-shadow:0 6px 18px rgba(6,54,95,.25)}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ===== Coach panel ===== */
.coach{background:#fff;border-radius:12px;box-shadow:0 10px 30px rgba(6,54,95,.10),0 1px 3px rgba(6,54,95,.08);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.brand{background:var(--navy);color:#fff;padding:14px 18px 12px}
.brand .k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700}
.brand .t{font-family:var(--head);font-size:1.2rem;margin-top:2px}
.phases{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:12px 14px 4px}
.ph{text-align:center;font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.04em}
.ph .bar{height:6px;border-radius:4px;background:var(--line);margin-bottom:5px;overflow:hidden}
.ph .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .5s}
.ph.on{color:var(--navy)}
.ph.done .bar i{width:100%;background:var(--ok)}
.ph.on .bar i{background:var(--gold)}
.cbody{flex:1;overflow:auto;padding:12px 18px 6px;min-height:0}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--navy);background:var(--gold-l);border:1px solid #f6dca3;padding:3px 10px;border-radius:12px;margin-bottom:8px}
.cbody h2{font-family:var(--head);color:var(--navy);font-size:1.45rem;line-height:1.18;margin-bottom:8px}
.cbody p{font-size:1rem;line-height:1.5;margin-bottom:9px}
.cbody ul{list-style:none;display:flex;flex-direction:column;gap:7px;margin:4px 0 10px}
.cbody li{display:flex;gap:9px;font-size:.96rem;line-height:1.38}
.cbody li::before{content:"";flex-shrink:0;width:8px;height:8px;border-radius:50%;background:var(--gold);margin-top:7px}
.note{background:var(--blue-l);border-radius:8px;padding:9px 12px;font-size:.92rem;line-height:1.4;color:var(--navy)}
.note.do{background:var(--gold-l);border:1px dashed var(--gold-d)}
.foot{padding:10px 14px 14px;border-top:1px solid var(--line);flex-shrink:0}
.dots{display:flex;gap:4px;justify-content:center;margin-bottom:10px;flex-wrap:wrap}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);transition:all .3s}
.dots i.on{background:var(--gold);width:18px;border-radius:4px}
.dots i.seen{background:var(--blue)}
.navb{display:flex;gap:8px}
.btn{flex:1;border-radius:8px;padding:10px 12px;font-size:.98rem;font-weight:700;cursor:pointer;border:0;transition:all .15s}
.btn.back{flex:0 0 auto;background:#fff;color:var(--navy);border:1.5px solid var(--line)}
.btn.next{background:var(--navy);color:#fff}
.btn.next:hover{background:var(--navy-d)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.kbd{font-size:.75rem;color:var(--muted);text-align:center;margin-top:8px}

@media (max-width:980px){
  body{overflow:auto}
  .app{height:auto;grid-template-columns:1fr;padding:10px}
  .browser{min-height:62vw}
  .steps3,.qgrid,.finale .row{grid-template-columns:1fr}
  .card{position:relative;inset:auto;min-height:62vw}
  .tip{max-width:240px;font-size:.85rem}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="stagewrap">
    <div class="browser">
      <div class="chrome">
        <div class="lights"><i></i><i></i><i></i></div>
        <div class="url" id="url"><span class="lock">🔒</span> learn.zollege.com/courses/<b>DAS-Makeup-Classes</b></div>
      </div>
      <div class="viewport" id="viewport">
        <div class="stage" id="stage">
          <div class="layer" id="layer">
            <img id="shot" alt="">
            <svg id="svg" preserveAspectRatio="none">
              <defs><mask id="m"><rect x="0" y="0" width="100%" height="100%" fill="#fff"/><rect class="hole" id="hole" rx="8" fill="#000"/></mask></defs>
              <rect class="dim" id="dim" x="0" y="0" width="100%" height="100%" mask="url(#m)"/>
              <rect class="ring" id="ring" rx="8"/>
            </svg>
            <button class="hot" id="hot" aria-label="Highlighted area"></button>
            <div class="tap" id="tap" hidden>☝</div>
          </div>
          <div class="tip" id="tip"></div>
          <div class="miss" id="miss">Click the glowing spot</div>
          <div class="badge" id="badge" hidden></div>
        </div>
        <div id="cardhost"></div>
      </div>
    </div>
  </div>

  <aside class="coach" aria-live="polite">
    <div class="brand"><div class="k">DAS · Makeup Classes</div><div class="t">How your makeup class works</div></div>
    <div class="phases" id="phases">
      <div class="ph" data-p="0"><div class="bar"><i></i></div>Start</div>
      <div class="ph" data-p="1"><div class="bar"><i></i></div>1 · Watch</div>
      <div class="ph" data-p="2"><div class="bar"><i></i></div>2 · Practice</div>
      <div class="ph" data-p="3"><div class="bar"><i></i></div>3 · Quiz</div>
    </div>
    <div class="cbody" id="cbody"></div>
    <div class="foot">
      <div class="dots" id="dots"></div>
      <div class="navb">
        <button class="btn back" id="back">←</button>
        <button class="btn next" id="next">Next →</button>
      </div>
      <div class="kbd">Tip: use ← → arrow keys</div>
    </div>
  </aside>
</div>

const $ = id => document.getElementById(id);
let i = 0, seen = new Set([0]), checkDone = 0;

/* ---------- Layout math ---------- */
function fitStage(img){
  const vp = $('viewport').getBoundingClientRect();
  const k = Math.min(vp.width / img.w, vp.height / img.h);
  const W = img.w * k, H = img.h * k;
  const st = $('stage'); st.style.width = W+'px'; st.style.height = H+'px';
  const ly = $('layer'); ly.style.width = W+'px'; ly.style.height = H+'px';
  return {k, W, H};
}
function render(){
  const s = STEPS[i];
  seen.add(i);
  // coach
  const host = $('cardhost');
  if(s.card){ $('stage').style.display='none'; host.innerHTML = CARDS[s.card](); bindCard(s.card); $('url').innerHTML = '<span class="lock">🔒</span> learn.zollege.com/courses/<b>DAS-Makeup-Classes</b>'; }
  else { host.innerHTML=''; $('stage').style.display=''; place(true); }
  $('cbody').innerHTML = COACH(s);
  $('cbody').scrollTop = 0;
  // phases
  document.querySelectorAll('.ph').forEach(p=>{
    const n = +p.dataset.p; p.classList.toggle('on', n===s.phase); p.classList.toggle('done', n<s.phase || (i===STEPS.length-1));
    const inPhase = STEPS.map((x,j)=>[x,j]).filter(([x])=>x.phase===n).map(([,j])=>j);
    const pct = n<s.phase ? 100 : n>s.phase ? 0 : ((inPhase.indexOf(i)+1)/inPhase.length*100);
    p.querySelector('i').style.width = pct+'%';
  });
  // dots
  $('dots').innerHTML = STEPS.map((_,j)=>`<i class="${j===i?'on':seen.has(j)?'seen':''}"></i>`).join('');
  $('back').disabled = i===0;
  const last = i===STEPS.length-1;
  $('next').textContent = last ? 'Start over ↺' : s.card==='hero' ? 'Start the tour →' : s.card==='check' ? (checkDone>=3?'Finish →':'Answer all 3 to finish') : 'Next →';
  $('next').disabled = s.card==='check' && checkDone<3;
}
let curImg = null;
function place(changed){
  const s = STEPS[i]; if(!s || s.card) return;
  const img = IMG[s.img];
  const {k, W, H} = fitStage(img);
  const shot = $('shot');
  if(curImg !== s.img){ shot.src = img.src; shot.alt = 'Screenshot of the Canvas page: '+s.h; shot.classList.remove('shot-fade'); void shot.offsetWidth; shot.classList.add('shot-fade'); curImg = s.img; $('url').innerHTML = '<span class="lock">🔒</span> learn.zollege.com/'+img.url; }
  const svg = $('svg'); svg.setAttribute('viewBox', `0 0 ${img.w} ${img.h}`);
  const [x,y,w,h] = s.t, pad = 6;
  for(const id of ['hole','ring']){ const r=$(id); r.setAttribute('x',x-pad); r.setAttribute('y',y-pad); r.setAttribute('width',w+pad*2); r.setAttribute('height',h+pad*2); }
  $('ring').classList.toggle('pulse', !!s.click);
  // camera
  const z = s.zoom || 1;
  const cx = (x+w/2)*k*z, cy = (y+h/2)*k*z;
  let tx = W/2 - cx, ty = H/2 - cy;
  tx = Math.min(0, Math.max(W - W*z, tx)); ty = Math.min(0, Math.max(H - H*z, ty));
  $('layer').style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
  // hotspot
  const hot = $('hot');
  Object.assign(hot.style,{left:(x-pad)*k+'px',top:(y-pad)*k+'px',width:(w+pad*2)*k+'px',height:(h+pad*2)*k+'px',display:s.click?'block':'none'});
  hot.setAttribute('aria-label', s.click ? 'Click here: '+s.h : '');
  const tap = $('tap'); tap.hidden = !s.click || w < 200;
  if(s.click){ tap.style.left = (x + w - Math.min(30, w/2))*k+'px'; tap.style.top = (y+h/2)*k+'px'; }
  // target rect on screen (after camera)
  const sx = tx + (x-pad)*k*z, sy = ty + (y-pad)*k*z, sw = (w+pad*2)*k*z, sh = (h+pad*2)*k*z;
  // tooltip
  const tip = $('tip');
  if(s.tip){
    tip.style.display=''; tip.innerHTML = s.tip + (s.click? `<div class="t-click">☝ Click the glowing area to continue</div>`:'');
    const tw = Math.min(340, W*0.8); tip.style.maxWidth = tw+'px';
    const th = tip.offsetHeight, tww = tip.offsetWidth;
    let left = Math.max(10, Math.min(W - tww - 10, sx + Math.min(40, sw/2 - 20)));
    let top, cls;
    if(sy + sh + th + 18 < H){ top = sy + sh + 12; cls='below'; }
    else if(sy - th - 18 > 0){ top = sy - th - 12; cls='above'; }
    else { top = Math.max(10, Math.min(H - th - 10, sy + sh/2 - th/2)); cls='side'; left = sx > W/2 ? Math.max(10, sx - tww - 14) : Math.min(W - tww - 10, sx + sw + 14); }
    tip.className = 'tip '+cls; tip.style.left = left+'px'; tip.style.top = top+'px';
    const ax = Math.max(14, Math.min(tww - 28, sx + Math.min(sw/2, 60) - left));
    tip.style.setProperty('--ax', ax+'px');
  } else tip.style.display='none';
  // badge
  const b = $('badge');
  if(s.badge){ b.hidden=false; b.innerHTML = `<span class="pill lab">Missed lab grade</span><span class="arrow">➜</span><span class="pill q">Makeup quiz grade</span>`;
    b.style.left = Math.max(10,(W - b.offsetWidth)/2)+'px'; b.style.top = Math.max(10, H*0.38)+'px'; }
  else b.hidden = true;
}
function COACH(s){
  if(s.card==='hero') return `<span class="tag">Welcome</span><h2>Your fresh start begins here</h2>
    <p>This tour walks you through a real makeup week in Canvas, using <b>Week 1</b> as the example.</p>
    <p>It takes about 3 minutes. Click the glowing spots on the screen as you go, just like you would in the real course.</p>`;
  if(s.card==='check') return `<span class="tag">Quick check</span><h2>Do you know the routine?</h2><p>Answer the three questions on the screen to finish the tour.</p>
    <div class="note"><b>${checkDone}</b> of 3 correct</div>`;
  if(s.card==='finale') return `<span class="tag">You're ready</span><h2>Three steps and you're back on track</h2>
    <p>Go to <b>Modules</b>, open the week you missed, and start with the Introduction.</p><div class="note">Questions? Use <b>Support</b> in the left menu of Canvas.</div>`;
  return `<span class="tag">${s.tag}</span><h2>${s.h}</h2>${s.c}`;
}
const CARDS = {
  hero:()=>`<div class="card hero">
    <div class="eyebrow">Dental Assisting · Makeup Classes</div>
    <h1>Catch up. Keep going.<br><em>Graduate.</em></h1>
    <p class="lead">Showing up today tells us you're ready to keep going. Every makeup class works the same way: three steps and you're back on track.</p>
    <div class="steps3">
      <div class="s3"><div class="n">1</div><h3>Watch</h3><p>The live in-class recording. Get comfortable and take notes.</p></div>
      <div class="s3"><div class="n">2</div><h3>Practice</h3><p>Five interactive activities to lock in what you learned.</p></div>
      <div class="s3"><div class="n">3</div><h3>Quiz</h3><p>Your quiz grade replaces the lab grade for the missed class.</p></div>
    </div>
    <button class="cta" id="go">Take the tour of Week 1 →</button></div>`,
  check:()=>`<div class="card check">
    <h2>Quick check</h2><p class="sub">Three questions. Pick the best answer for each.</p>
    <div class="qgrid">${QUIZ.map((q,n)=>`<div class="qc" data-a="${q.a}" data-n="${n}"><div class="qn">QUESTION ${n+1}</div><div class="qt">${q.q}</div>
      ${q.o.map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}<div class="fb" aria-live="polite"></div></div>`).join('')}</div></div>`,
  finale:()=>`<div class="card finale"><div class="confetti" id="conf"></div>
    <div class="eyebrow" style="color:var(--gold-d)">Tour complete</div>
    <h2>You've got this, and we're cheering you on.</h2>
    <div class="row">
      <div class="fs"><div class="n">STEP 1</div><h3>Watch</h3><p>The full class recording, with notes.</p></div>
      <div class="fs"><div class="n">STEP 2</div><h3>Practice</h3><p>All five activities. Click Next only when finished.</p></div>
      <div class="fs"><div class="n">STEP 3</div><h3>Quiz</h3><p>Replaces the lab grade and restores good standing.</p></div>
    </div>
    <p class="quote">Remember why you started. Patients are waiting for someone just like you: caring, skilled, and ready to help.</p>
    <button class="cta" id="again">Watch the tour again ↺</button></div>`
};
const QUIZ = [
  {q:'What should you do first in a makeup week?', o:['Take the quiz to see what you know','Read the Introduction, then watch the recording','Skip straight to the activities'], a:1,
   why:['The quiz comes last, after you\'ve watched and practiced.','Right! Start with the checklist, then watch the class.','The activities make more sense after the recording.']},
  {q:'When should you click "Next" on an activity page?', o:['As soon as the page opens','After reading the welcome message','After you\'ve finished the activity'], a:2,
   why:['Clicking early means you skip the practice.','Reading the welcome is just the start. Finish the activity first.','Exactly. Finish first, then click Next.']},
  {q:'What does your makeup quiz grade do?', o:['Replaces the lab grade for the class you missed','Adds extra credit to your final exam','Nothing. It\'s only practice'], a:0,
   why:['Yes! It puts you back in good standing with the attendance policy.','It doesn\'t add extra credit. It replaces the missed lab grade.','The activities are practice. The quiz counts.']}
];
function bindCard(kind){
  if(kind==='hero') $('go').onclick = go;
  if(kind==='finale'){ $('again').onclick = ()=>{ i=0; checkDone=0; seen=new Set([0]); render(); }; confetti(); }
  if(kind==='check'){
    checkDone = 0;
    document.querySelectorAll('.qc').forEach(qc=>{
      const a=+qc.dataset.a, q=QUIZ[+qc.dataset.n], fb=qc.querySelector('.fb');
      qc.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
        const j=+b.dataset.j;
        if(j===a){ b.classList.add('right'); qc.querySelectorAll('.opt').forEach(x=>x.disabled=true); fb.className='fb ok'; fb.textContent=q.why[j]; checkDone++; $('cbody').innerHTML=COACH(STEPS[i]); render2(); }
        else { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); fb.className='fb no'; fb.textContent=q.why[j]+' Try again.'; }
      });
    });
  }
}
function render2(){ const done = checkDone>=3; $('next').disabled = !done; $('next').textContent = done?'Finish →':'Answer all 3 to finish'; }
function confetti(){
  const c=$('conf'); if(!c) return; const cols=['#F2B33D','#4A8FD1','#06365F','#1f8f52'];
  for(let n=0;n<70;n++){ const e=document.createElement('i'); e.style.left=Math.random()*100+'%'; e.style.background=cols[n%4];
    e.style.animationDuration=(2.2+Math.random()*2)+'s'; e.style.animationDelay=(Math.random()*.8)+'s'; e.style.transform=`rotate(${Math.random()*360}deg)`; c.appendChild(e); }
}
function go(){ if(i<STEPS.length-1){ i++; render(); } else { i=0; checkDone=0; seen=new Set([0]); render(); } }
function back(){ if(i>0){ i--; render(); } }
$('next').onclick = go; $('back').onclick = back;
$('hot').onclick = e=>{ e.stopPropagation(); go(); };
$('layer').addEventListener('click', e=>{
  const s=STEPS[i]; if(!s.click || e.target.id==='hot') return;
  const m=$('miss'), r=$('stage').getBoundingClientRect(); m.style.left=(e.clientX-r.left)+'px'; m.style.top=(e.clientY-r.top)+'px';
  m.classList.add('show'); clearTimeout(m._t); m._t=setTimeout(()=>m.classList.remove('show'),1100);
});
document.addEventListener('keydown', e=>{
  if(e.target.closest('.opt')) return;
  if(e.key==='ArrowRight' && !$('next').disabled) go();
  if(e.key==='ArrowLeft') back();
});
window.addEventListener('resize', ()=>place(false));
// preload
Object.values(IMG).forEach(o=>{ const im=new Image(); im.src=o.src; });
render();
