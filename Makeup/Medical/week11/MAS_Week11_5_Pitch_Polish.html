<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pitch Polish</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0c1a2b;--panel:#13263c;--panel2:#1a3250;--line:#284563;--teal:#2ec4b6;--teal-d:#062b28;--gold:#f4b942;--text:#eaf2f8;--muted:#9ab0c5;--bad:#ef6f6c;--good:#4fd1a5}
*{box-sizing:border-box}
button{font-family:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(1200px 600px at 85% -10%,#16314f 0%,transparent 60%),var(--bg);color:var(--text);font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;font-size:17px}
h1,h2,h3,.disp{font-family:'Lexend',system-ui,sans-serif;letter-spacing:-.01em}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;border-bottom:1px solid var(--line);flex:none}
.ttl h1{font-size:clamp(18px,2.1vw,25px);margin:0;font-weight:600}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 14px;text-align:center;min-width:76px}
.stat b{display:block;font-family:'Lexend',sans-serif;font-size:20px;color:var(--gold);font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 28px;gap:14px}
footer{flex:none;padding:8px 28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.btn{font:600 16px 'Lexend',sans-serif;border:0;border-radius:10px;padding:11px 22px;cursor:pointer;background:var(--teal);color:var(--teal-d);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2b1d00}
.btn:disabled{opacity:.4;cursor:default;filter:none;transform:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{height:6px;background:var(--panel);border-radius:6px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .35s}
.fb{border-radius:12px;padding:12px 16px;font-size:16px;line-height:1.4;background:var(--panel);border-left:4px solid var(--line);min-height:52px}
.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}
.fb strong{font-family:'Lexend',sans-serif}
.ov{position:fixed;inset:0;background:rgba(6,14,24,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.hide{display:none}
.card-ov{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 34px;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.card-ov h2{margin:0 0 6px;font-size:clamp(24px,3vw,34px)}
.card-ov .big{font-family:'Lexend',sans-serif;font-size:clamp(40px,6vw,64px);color:var(--gold);font-weight:700;margin:6px 0}
.card-ov p{color:var(--muted);line-height:1.5;margin:8px 0}
.card-ov ul{text-align:left;color:var(--text);line-height:1.55;padding-left:22px;margin:12px 0 20px}
.card-ov .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.review{text-align:left;font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-top:10px;max-height:26vh;overflow:auto}
.review div{padding:3px 0}.review b{color:var(--text)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;color:var(--text);background:var(--bg)}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){body{font-size:15px}header{padding:8px 20px}main{padding:10px 20px;gap:10px}}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.6vh,16px);max-width:1150px;width:100%;margin:0 auto}
.hp{font:600 clamp(17px,2vw,23px) Lexend,sans-serif;text-align:center;line-height:1.35}
.hp small{display:block;font:400 15px 'Source Sans 3',sans-serif;color:var(--muted);margin-top:4px}
.hgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ht{position:relative;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:12px 14px 12px 44px;color:var(--text);font-size:clamp(14px,1.3vw,16px);line-height:1.3;cursor:pointer;min-height:clamp(58px,10vh,84px)}
.ht::before{content:'';position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;border-radius:5px;border:2px solid var(--line);background:var(--bg)}
.ht.sel{border-color:var(--gold)}.ht.sel::before{background:var(--gold);border-color:var(--gold)}
.ht:hover{border-color:var(--teal)}
.ht.found{border-color:var(--good);background:#123a35}.ht.found::before{content:'\2713';background:var(--good);border-color:var(--good);color:#06291d;font:700 13px Lexend;display:flex;align-items:center;justify-content:center}
.ht.missed{border-color:var(--gold);background:#3a2f12;border-style:dashed}
.ht.false{border-color:var(--bad);background:#3a1a22}.ht.false::before{content:'\2715';background:var(--bad);border-color:var(--bad);color:#2a0608;font:700 12px Lexend;display:flex;align-items:center;justify-content:center}
.ht.safe{opacity:.55}
.foot{display:flex;gap:12px;align-items:stretch}.foot .fb{flex:1}
.legend{font-size:13px;color:var(--muted);display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
.legend b{font-weight:600}
</style></head><body>
<header><div class="ttl"><h1>Pitch Polish</h1><p>Week 11 &nbsp;|&nbsp; Job Ready: Turn Your Hours Into a Pitch</p></div><div class="stats"><div class="stat"><b id="sc">0</b><span>Points</span></div><div class="stat"><b id="st">0</b><span>Found</span></div><div class="stat"><b id="pr">0</b><span>Scene</span></div></div></header>
<main><div class="bar"><i id="bar"></i></div>
<div class="stage"><div class="hp" id="hp"></div><div class="hgrid" id="hg"></div><div class="legend" id="lg"><span><b style="color:var(--good)">Green</b> caught</span><span><b style="color:var(--gold)">Gold dashed</b> missed</span><span><b style="color:var(--bad)">Red</b> false alarm</span></div><div class="foot"><div class="fb" id="fb"></div><button class="btn gold" id="sb">Submit</button><button class="btn" id="nx" style="display:none">Next</button></div></div>

</main>
<footer><span>Medical Assistant Certificate Program</span><span>Submit at least 3 job applications in HSS this week. The 24-hour rule applies to jobs too.</span></footer>
<div class="ov" id="ov"><div class="card-ov" id="ovc"></div></div>
<script>const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ov=$('#ov'),ovc=$('#ovc');
function showOv(html){ovc.innerHTML=html;ov.classList.remove('hide');const b=ovc.querySelector('button');if(b)b.focus()}
function hideOv(){ov.classList.add('hide')}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

const CFG={"ask": "Find the # weak spots. Leave the strong moves unselected.", "endTitle": "Pitch polished!", "intro": {"h": "Pitch Polish", "p": "You’ve been doing the job for weeks at your externship. Now spot what helps and what hurts in your interview answers and job search.", "rules": ["2 scenes. Select every weak answer or risky habit.", "+15 for each one you catch, −5 for each false alarm.", "After you submit, tap any card to see why."]}, "end": {"hi": "Polished and job-ready!", "mid": "Good eye. Review what you missed.", "lo": "Strong answers are specific. Strong habits are consistent. Try again."}, "rounds": [{"scene": "Scene 1: Interview answers", "tiles": [{"t": "“At my externship I handle vitals, intake, and EKG setup for about 40 patients a week.”", "bad": false, "why": "Specific numbers make your experience real."}, {"t": "“I did some stuff at my externship.”", "bad": true, "why": "Too vague. Name the skills and how often."}, {"t": "“I’ve completed over 25 venipunctures with my preceptor.”", "bad": false, "why": "Concrete and impressive."}, {"t": "“I’m just a student, so I don’t really know much.”", "bad": true, "why": "Sells yourself short. You have real experience."}, {"t": "“I chart patient intake in the EHR every shift.”", "bad": false, "why": "Shows a current, relevant skill."}, {"t": "“My last office was a mess and the staff were terrible.”", "bad": true, "why": "Never badmouth a site in an interview."}, {"t": "“I’m comfortable with injections, including IM and SubQ.”", "bad": false, "why": "Clear and specific."}, {"t": "“Whatever you need, I guess.”", "bad": true, "why": "Sounds unsure. Be confident about what you bring."}, {"t": "“I learned to stay calm when a patient fainted during a draw.”", "bad": false, "why": "A real example shows judgment."}]}, {"scene": "Scene 2: Your job search habits", "tiles": [{"t": "Applying to a job in HSS 3 days after it was sent", "bad": true, "why": "The 24-hour rule now covers job opportunities."}, {"t": "Submitting 3 applications in HSS this week", "bad": false, "why": "That meets this week’s goal."}, {"t": "Booking a resume session with Candace", "bad": false, "why": "Use the support available to you."}, {"t": "Letting calls from unknown numbers go to a full voicemail box", "bad": true, "why": "Employers call. Answer professionally and keep your voicemail clear."}, {"t": "Practicing your one-sentence externship pitch out loud", "bad": false, "why": "Practice builds confidence."}, {"t": "Only applying to jobs at your externship site", "bad": true, "why": "Keep options open. Apply broadly."}, {"t": "Updating your resume with your externship skills", "bad": false, "why": "Your new experience belongs on it."}, {"t": "Waiting until after the CCMA exam to start applying", "bad": true, "why": "Start now. Jobs take time."}, {"t": "Following up after an interview with a thank-you message", "bad": false, "why": "Professional and memorable."}]}]};
function intro(){showOv('<h2>'+CFG.intro.h+'</h2><p>'+CFG.intro.p+'</p><ul>'+CFG.intro.rules.map(r=>'<li>'+r+'</li>').join('')+'</ul><div class="row"><button class="btn" onclick="start()">'+(CFG.intro.go||'Start')+'</button></div>')}
function endScreen(o){const pct=o.pct;const m=CFG.end||{};const msg=pct>=85?(m.hi||'Outstanding work!'):pct>=60?(m.mid||'Nice job. Review the ones you missed and try again.'):(m.lo||'Keep practicing. Replay to lock it in.');
 showOv('<h2>'+(o.title||'Activity complete!')+'</h2><div class="big">'+o.big+'</div><p>'+o.line+'</p><p>'+msg+'</p>'+(o.review&&o.review.length?'<div class="review">'+o.review.map(r=>'<div>'+r+'</div>').join('')+'</div>':'')+'<div class="row"><button class="btn" onclick="start()">Play again</button></div>')}
function setStat(id,v){const e=document.getElementById(id);if(e)e.textContent=v}
function setBar(f){$('#bar').style.width=Math.round(f*100)+'%'}
function fbSet(cls,html){const f=$('#fb');f.className='fb'+(cls?' '+cls:'');f.innerHTML=html}

let R=[],ri=0,score=0,locked=false,found=0,totalBad=0,falses=0,missed=[];const NR=CFG.rounds.length;
function hud(){setStat('sc',score);setStat('st',found+'/'+totalBad);setStat('pr',Math.min(ri+1,NR)+'/'+NR);setBar(ri/NR)}
function start(){hideOv();R=CFG.rounds;ri=0;score=0;found=0;falses=0;missed=[];totalBad=R.reduce((a,r)=>a+r.tiles.filter(t=>t.bad).length,0);show()}
function show(){const r=R[ri];locked=false;const n=r.tiles.filter(t=>t.bad).length;$('#hp').innerHTML=r.scene+'<small>'+CFG.ask.replace('#',n)+'</small>';
 const g=$('#hg');g.innerHTML='';shuffle(r.tiles).forEach(t=>{const b=document.createElement('button');b.className='ht';b.textContent=t.t;b._t=t;b.setAttribute('aria-pressed','false');b.onclick=()=>tap(b);g.appendChild(b)});
 $('#lg').style.visibility='hidden';fbSet('',CFG.hint||'Select every problem you spot, then submit.');$('#sb').style.display='';$('#nx').style.display='none';cnt();hud()}
function cnt(){const s=document.querySelectorAll('.ht.sel').length;$('#sb').textContent='Submit ('+s+' flagged)'}
function tap(b){if(locked){fbSet(b._t.bad?'ok':'',(b._t.bad?'<strong>Problem:</strong> ':'<strong>This one is fine:</strong> ')+b._t.why);return}b.classList.toggle('sel');b.setAttribute('aria-pressed',b.classList.contains('sel'));cnt()}
function submit(){locked=true;let f=0,fl=0,ms=0;document.querySelectorAll('.ht').forEach(b=>{const s=b.classList.contains('sel'),bad=b._t.bad;b.classList.remove('sel');
 if(s&&bad){b.classList.add('found');f++}else if(s&&!bad){b.classList.add('false');fl++}else if(bad){b.classList.add('missed');ms++;missed.push(b._t)}else b.classList.add('safe')});
 const pts=Math.max(0,f*15-fl*5);score+=pts;found+=f;falses+=fl;$('#lg').style.visibility='visible';
 fbSet(ms||fl?'no':'ok','<strong>You caught '+f+' of '+(f+ms)+(fl?', with '+fl+' false alarm'+(fl>1?'s':''):'')+'. +'+pts+'</strong> Tap any card to see why.');
 $('#sb').style.display='none';const nx=$('#nx');nx.style.display='';nx.textContent=ri<NR-1?'Next scene':'See results';hud()}
$('#sb').onclick=submit;
$('#nx').onclick=()=>{ri++;if(ri<NR)show();else{setBar(1);endScreen({title:CFG.endTitle,big:score,pct:Math.max(0,(found-falses)/totalBad*100),line:'Found '+found+' of '+totalBad+' &nbsp;|&nbsp; False alarms: '+falses,review:missed.map(m=>'<b>'+m.t+'</b> \u2192 '+m.why)})}};
intro();
</script></body></html>
