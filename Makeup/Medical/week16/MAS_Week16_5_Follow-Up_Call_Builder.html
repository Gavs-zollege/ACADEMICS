<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Follow-Up Call Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0c1a2b;--panel:#13263c;--panel2:#1a3250;--line:#284563;--teal:#2ec4b6;--teal-d:#062b28;--gold:#f4b942;--text:#eaf2f8;--muted:#9ab0c5;--bad:#ef6f6c;--good:#4fd1a5}
*{box-sizing:border-box}
button{font-family:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(1200px 600px at 85% -10%,#16314f 0%,transparent 60%),var(--bg);color:var(--text);font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;font-size:17px}
h1,h2,h3,.disp{font-family:'Lexend',system-ui,sans-serif;letter-spacing:-.01em}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;border-bottom:1px solid var(--line);flex:none}
.ttl h1{font-size:clamp(18px,2.1vw,25px);margin:0;font-weight:600}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 14px;text-align:center;min-width:76px}
.stat b{display:block;font-family:'Lexend',sans-serif;font-size:20px;color:var(--gold);font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 28px;gap:14px}
footer{flex:none;padding:8px 28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.btn{font:600 16px 'Lexend',sans-serif;border:0;border-radius:10px;padding:11px 22px;cursor:pointer;background:var(--teal);color:var(--teal-d);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2b1d00}
.btn:disabled{opacity:.4;cursor:default;filter:none;transform:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{height:6px;background:var(--panel);border-radius:6px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .35s}
.fb{border-radius:12px;padding:12px 16px;font-size:16px;line-height:1.4;background:var(--panel);border-left:4px solid var(--line);min-height:52px}
.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}
.fb strong{font-family:'Lexend',sans-serif}
.ov{position:fixed;inset:0;background:rgba(6,14,24,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.hide{display:none}
.card-ov{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 34px;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.card-ov h2{margin:0 0 6px;font-size:clamp(24px,3vw,34px)}
.card-ov .big{font-family:'Lexend',sans-serif;font-size:clamp(40px,6vw,64px);color:var(--gold);font-weight:700;margin:6px 0}
.card-ov p{color:var(--muted);line-height:1.5;margin:8px 0}
.card-ov ul{text-align:left;color:var(--text);line-height:1.55;padding-left:22px;margin:12px 0 20px}
.card-ov .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.review{text-align:left;font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-top:10px;max-height:26vh;overflow:auto}
.review div{padding:3px 0}.review b{color:var(--text)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;color:var(--text);background:var(--bg)}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){body{font-size:15px}header{padding:8px 20px}main{padding:10px 20px;gap:10px}}

.wrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 360px;gap:22px;max-width:1200px;width:100%;margin:0 auto}
.left{display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.6vh,16px);min-height:0}
.gp{font:600 14px Lexend,sans-serif;color:var(--teal)}
.gq{font:600 clamp(18px,2.1vw,24px) Lexend,sans-serif;line-height:1.35;margin:0}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:14px;padding:11px 15px;color:var(--text);font-size:clamp(15px,1.4vw,17px);cursor:pointer;line-height:1.35;display:flex;gap:12px}
.opt .k{font:600 13px Lexend,sans-serif;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px;flex:none;height:fit-content}
.opt:hover:not(:disabled){border-color:var(--teal)}.opt:disabled{cursor:default}
.opt.best{border-color:var(--good);background:#123a35}.opt.ok{border-color:var(--gold);background:#3a2f12}.opt.bad{border-color:var(--bad);background:#3a1a22}
.foot{display:flex;gap:12px;align-items:stretch}.foot .fb{flex:1}.fb.mid{border-color:var(--gold)}
.card{background:#f5f1e6;color:#1b2430;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;min-height:0;overflow:hidden}
.card h3{margin:0;font-size:17px;color:#2b3a55;overflow-wrap:anywhere}
.card .line{font-size:15px;line-height:1.45;border-left:4px solid #cfd6e3;padding-left:10px;color:#2a3140}
.card .line.e{color:#8a93a6;font-style:italic}
.card .line.g2{border-color:#2aa58f}.card .line.g1{border-color:#d69a20}.card .line.g0{border-color:#d0545a}
.card .meta{margin-top:auto;font:600 13px Lexend,sans-serif;color:#44506a;display:flex;justify-content:space-between}
@media (max-width:860px){.wrap{grid-template-columns:1fr}.card{display:none}}
</style></head><body>
<header><div class="ttl"><h1>Follow-Up Call Builder</h1><p>Week 16 &nbsp;|&nbsp; Job Ready: Final Push Before Graduation</p></div><div class="stats"><div class="stat"><b id="sc">0</b><span>Points</span></div><div class="stat"><b id="st">0</b><span>Strong</span></div><div class="stat"><b id="pr">0</b><span>Part</span></div></div></header>
<main><div class="bar"><i id="bar"></i></div>
<div class="wrap"><section class="left"><div class="gp" id="gp"></div><p class="gq" id="gq"></p><div class="opts" id="opts"></div><div class="foot"><div class="fb" id="fb"></div><button class="btn" id="nx" style="display:none">Next</button></div></section><aside class="card" id="card"></aside></div>

</main>
<footer><span>Medical Assistant Certificate Program</span><span>Not placed yet doesn’t mean you don’t graduate. Job Ready Qualification is what’s required.</span></footer>
<div class="ov" id="ov"><div class="card-ov" id="ovc"></div></div>
<script>const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ov=$('#ov'),ovc=$('#ovc');
function showOv(html){ovc.innerHTML=html;ov.classList.remove('hide');const b=ovc.querySelector('button');if(b)b.focus()}
function hideOv(){ov.classList.add('hide')}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

const CFG={"cardTitle": "Following up on your oldest application", "finalLabel": "Your follow-up call:", "hint": "Pick the strongest line. Keys A–C work too.", "endTitle": "Call ready!", "intro": {"h": "Follow-Up Call Builder", "p": "Your oldest job application has gone cold. Time to pick up the phone. Build a follow-up call that brings it back to life.", "rules": ["Choose the best line for each of the 5 parts of the call.", "Watch your call come together, with its speaking time.", "Then make the real call today!"]}, "end": {"hi": "That call could restart the conversation. Make the real one today!", "mid": "Good call. Swap in the stronger lines and dial.", "lo": "Be polite, specific, and brief, and ask about next steps. Try again!"}, "slots": [{"label": "1. Introduce yourself", "q": "Someone at the front desk answers.", "opts": [{"t": "“Hi, this is Jordan Lee. I applied for your medical assistant position about two weeks ago.”", "g": 2, "why": "Name, position, and timing. Clear and specific."}, {"t": "“Hi, I applied for a job there.”", "g": 1, "why": "Which job, and who are you?"}, {"t": "“Why haven’t you called me back?”", "g": 0, "why": "Accusatory. It burns the bridge."}]}, {"label": "2. Reason for the call", "q": "What do you ask?", "opts": [{"t": "“I wanted to follow up and see where you are in the hiring process.”", "g": 2, "why": "Polite and purposeful."}, {"t": "“Just checking.”", "g": 1, "why": "Vague."}, {"t": "“Did I get it or not?”", "g": 0, "why": "Too blunt."}]}, {"label": "3. Restate your value", "q": "Add a quick reminder of why you’re a fit.", "opts": [{"t": "“I’m finishing my externship, where I’ve done vitals, EKGs, and blood draws every shift.”", "g": 2, "why": "A quick, specific value reminder."}, {"t": "“I really need a job.”", "g": 1, "why": "About you, not them."}, {"t": "(skip it)", "g": 0, "why": "A missed chance to stand out."}]}, {"label": "4. Next step", "q": "How do you move it forward?", "opts": [{"t": "“I’d love the chance to interview. Is there anything else I can send you?”", "g": 2, "why": "Shows interest and offers help."}, {"t": "“Okay, I’ll wait.”", "g": 1, "why": "Passive."}, {"t": "“I’ll keep calling every day until I hear back.”", "g": 0, "why": "That’s pushy."}]}, {"label": "5. Close", "q": "Wrap it up.", "opts": [{"t": "“Thank you for your time. Have a great day.”", "g": 2, "why": "Gracious."}, {"t": "“Bye.”", "g": 1, "why": "Abrupt."}, {"t": "Hang up mid-sentence when you’re put on hold.", "g": 0, "why": "Unprofessional."}]}]};
function intro(){showOv('<h2>'+CFG.intro.h+'</h2><p>'+CFG.intro.p+'</p><ul>'+CFG.intro.rules.map(r=>'<li>'+r+'</li>').join('')+'</ul><div class="row"><button class="btn" onclick="start()">'+(CFG.intro.go||'Start')+'</button></div>')}
function endScreen(o){const pct=o.pct;const m=CFG.end||{};const msg=pct>=85?(m.hi||'Outstanding work!'):pct>=60?(m.mid||'Nice job. Review the ones you missed and try again.'):(m.lo||'Keep practicing. Replay to lock it in.');
 showOv('<h2>'+(o.title||'Activity complete!')+'</h2><div class="big">'+o.big+'</div><p>'+o.line+'</p><p>'+msg+'</p>'+(o.review&&o.review.length?'<div class="review">'+o.review.map(r=>'<div>'+r+'</div>').join('')+'</div>':'')+'<div class="row"><button class="btn" onclick="start()">Play again</button></div>')}
function setStat(id,v){const e=document.getElementById(id);if(e)e.textContent=v}
function setBar(f){$('#bar').style.width=Math.round(f*100)+'%'}
function fbSet(cls,html){const f=$('#fb');f.className='fb'+(cls?' '+cls:'');f.innerHTML=html}

let i=0,score=0,picks=[],locked=true;const S=CFG.slots,N=S.length;
function hud(){setStat('sc',score);setStat('st',picks.filter(p=>p.g===2).length);setStat('pr',Math.min(i+1,N)+'/'+N);setBar(i/N)}
function card(){const w=picks.map(p=>p.t).join(' ').split(/\s+/).filter(Boolean).length;
 $('#card').innerHTML='<h3>'+CFG.cardTitle+'</h3>'+S.map((s,k)=>{const p=picks[k];return '<div class="line '+(p?'g'+p.g:'e')+'">'+(p?p.t:s.label+'\u2026')+'</div>'}).join('')+'<div class="meta"><span>'+w+' words</span>'+(CFG.noTime?'':'<span>\u2248 '+Math.round(w/2.5)+' sec out loud</span>')+'</div>'}
function start(){hideOv();i=0;score=0;picks=[];card();show()}
function show(){const s=S[i];locked=false;$('#gp').textContent=s.label;$('#gq').textContent=s.q;const o=$('#opts');o.innerHTML='';
 shuffle(s.opts).forEach((x,j)=>{const b=document.createElement('button');b.className='opt';b.innerHTML='<span class="k">'+'ABC'[j]+'</span><span>'+x.t+'</span>';b._x=x;b.onclick=()=>pick(b);o.appendChild(b)});
 fbSet('',CFG.hint||'Pick the strongest line.');$('#nx').style.display='none';hud()}
function pick(b){if(locked)return;locked=true;const x=b._x;picks.push(x);score+=[0,10,25][x.g];
 document.querySelectorAll('.opt').forEach(o=>{o.disabled=true;if(o._x.g===2)o.classList.add('best')});if(x.g!==2)b.classList.add(x.g?'ok':'bad');
 fbSet(['no','mid','ok'][x.g],'<strong>'+['Weak choice.','Not bad, but there\u2019s a stronger option.','Strong choice!'][x.g]+'</strong> '+x.why);card();
 const nx=$('#nx');nx.style.display='';nx.textContent=i<N-1?'Next':'Finish';nx.focus();hud()}
$('#nx').onclick=()=>{i++;if(i<N)show();else{setBar(1);const b=picks.filter(p=>p.g===2).length;const w=picks.map(p=>p.t).join(' ').split(/\s+/).length;
 endScreen({title:CFG.endTitle,big:score,pct:score/(N*25)*100,line:b+' of '+N+' strongest choices'+(CFG.noTime?'':' &nbsp;|&nbsp; about '+Math.round(w/2.5)+' seconds'),review:['<b>'+(CFG.finalLabel||'Your final version:')+'</b>'].concat(picks.map(p=>p.t))})}};
addEventListener('keydown',e=>{if(!ov.classList.contains('hide'))return;const k='abc'.indexOf(e.key.toLowerCase());if(k>=0&&!locked){const b=document.querySelectorAll('.opt')[k];if(b)pick(b)}});
intro();
</script></body></html>
