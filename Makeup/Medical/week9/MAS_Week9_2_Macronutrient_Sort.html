<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Macronutrient Sort</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0c1a2b;--panel:#13263c;--panel2:#1a3250;--line:#284563;--teal:#2ec4b6;--teal-d:#062b28;--gold:#f4b942;--text:#eaf2f8;--muted:#9ab0c5;--bad:#ef6f6c;--good:#4fd1a5}
*{box-sizing:border-box}
button{font-family:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(1200px 600px at 85% -10%,#16314f 0%,transparent 60%),var(--bg);color:var(--text);font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;font-size:17px}
h1,h2,h3,.disp{font-family:'Lexend',system-ui,sans-serif;letter-spacing:-.01em}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;border-bottom:1px solid var(--line);flex:none}
.ttl h1{font-size:clamp(18px,2.1vw,25px);margin:0;font-weight:600}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 14px;text-align:center;min-width:76px}
.stat b{display:block;font-family:'Lexend',sans-serif;font-size:20px;color:var(--gold);font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 28px;gap:14px}
footer{flex:none;padding:8px 28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.btn{font:600 16px 'Lexend',sans-serif;border:0;border-radius:10px;padding:11px 22px;cursor:pointer;background:var(--teal);color:var(--teal-d);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2b1d00}
.btn:disabled{opacity:.4;cursor:default;filter:none;transform:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{height:6px;background:var(--panel);border-radius:6px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .35s}
.fb{border-radius:12px;padding:12px 16px;font-size:16px;line-height:1.4;background:var(--panel);border-left:4px solid var(--line);min-height:52px}
.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}
.fb strong{font-family:'Lexend',sans-serif}
.ov{position:fixed;inset:0;background:rgba(6,14,24,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.hide{display:none}
.card-ov{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 34px;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.card-ov h2{margin:0 0 6px;font-size:clamp(24px,3vw,34px)}
.card-ov .big{font-family:'Lexend',sans-serif;font-size:clamp(40px,6vw,64px);color:var(--gold);font-weight:700;margin:6px 0}
.card-ov p{color:var(--muted);line-height:1.5;margin:8px 0}
.card-ov ul{text-align:left;color:var(--text);line-height:1.55;padding-left:22px;margin:12px 0 20px}
.card-ov .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.review{text-align:left;font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-top:10px;max-height:26vh;overflow:auto}
.review div{padding:3px 0}.review b{color:var(--text)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;color:var(--text);background:var(--bg)}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){body{font-size:15px}header{padding:8px 20px}main{padding:10px 20px;gap:10px}}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:clamp(10px,2.2vh,24px)}
.timer{width:min(640px,100%);height:10px;background:var(--panel);border-radius:10px;overflow:hidden}
.timer i{display:block;height:100%;background:var(--gold);width:100%}
.item{width:min(680px,100%);min-height:clamp(100px,18vh,160px);background:var(--panel2);border:2px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 24px;font:600 clamp(19px,2.5vw,28px) Lexend,sans-serif;line-height:1.3;position:relative;animation:pop .18s}
.item small{font:400 14px 'Source Sans 3',sans-serif;color:var(--muted);margin-top:6px}
.item.ok{border-color:var(--good)}.item.no{border-color:var(--bad)}
.mult{position:absolute;top:8px;right:14px;font:600 13px Lexend,sans-serif;color:var(--gold)}
.bins{display:grid;gap:12px;width:min(1000px,100%)}
.bin{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:10px 8px;cursor:pointer;color:var(--text);text-align:center}
.bin:hover{border-color:var(--teal)}.bin:active{transform:scale(.97)}
.bin h3{margin:0;font-size:clamp(15px,1.7vw,20px)}
.bin p{margin:3px 0 0;color:var(--muted);font-size:13px;line-height:1.25}
.bin .kbd{margin-top:5px}
.bin.flash-ok{border-color:var(--good);background:#123a35}.bin.flash-no{border-color:var(--bad);background:#3a1a22}
.stage .fb{width:min(1000px,100%)}
</style></head><body>
<header><div class="ttl"><h1>Macronutrient Sort</h1><p>Week 9 &nbsp;|&nbsp; Basics of Nutrition</p></div><div class="stats"><div class="stat"><b id="sc">0</b><span>Points</span></div><div class="stat"><b id="st">0</b><span>Streak</span></div><div class="stat"><b id="pr">0</b><span>Sorted</span></div></div></header>
<main><div class="bar"><i id="bar"></i></div>
<div class="stage"><div class="timer"><i id="tm"></i></div><div class="item" id="item" aria-live="polite"></div><div class="bins" id="bins"></div><div class="fb" id="fb"></div></div>

</main>
<footer><span>Medical Assistant Certificate Program</span><span>Encourage variety and moderation, and small changes that stick</span></footer>
<div class="ov" id="ov"><div class="card-ov" id="ovc"></div></div>
<script>const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ov=$('#ov'),ovc=$('#ovc');
function showOv(html){ovc.innerHTML=html;ov.classList.remove('hide');const b=ovc.querySelector('button');if(b)b.focus()}
function hideOv(){ov.classList.add('hide')}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

const CFG={"limit": 7000, "hint": "What is this food’s main macronutrient? Keys 1–3 work too.", "endTitle": "Plate sorted!", "intro": {"h": "Macronutrient Sort", "p": "Helping patients understand their plate starts with knowing what’s on it. Sort each food by its main macronutrient.", "rules": ["15 foods, 7 seconds each.", "Sort by main macronutrient: carbohydrate, protein, or fat.", "Fast answers and streaks earn bonus points."]}, "end": {"hi": "Nutrition pro! You’re ready to support patient education.", "mid": "Good sorting. Review the foods you missed.", "lo": "Review the three macronutrients and try again."}, "bins": [{"n": "Carbohydrate", "d": "Main energy source"}, {"n": "Protein", "d": "Builds and repairs tissue"}, {"n": "Fat", "d": "Energy, insulation, vitamins"}], "items": [["Rice", 0, "Rice is mostly carbohydrate."], ["Whole-wheat bread", 0, "Grains are carbohydrate sources."], ["Honey", 0, "Honey is a simple carbohydrate."], ["Pasta", 0, "Pasta is mostly carbohydrate."], ["Oatmeal", 0, "Oats are a complex carbohydrate."], ["Banana", 0, "Fruit is mostly carbohydrate."], ["Chicken breast", 1, "Lean meat is a protein source."], ["Eggs", 1, "Eggs are a protein source."], ["Fish", 1, "Fish is a protein source."], ["Tofu", 1, "Tofu is a plant-based protein."], ["Turkey", 1, "Turkey is a lean protein."], ["Olive oil", 2, "Oils are fats."], ["Butter", 2, "Butter is mostly fat."], ["Avocado", 2, "Avocado is a healthy fat."], ["Walnuts", 2, "Nuts are mostly fat."]]};
function intro(){showOv('<h2>'+CFG.intro.h+'</h2><p>'+CFG.intro.p+'</p><ul>'+CFG.intro.rules.map(r=>'<li>'+r+'</li>').join('')+'</ul><div class="row"><button class="btn" onclick="start()">'+(CFG.intro.go||'Start')+'</button></div>')}
function endScreen(o){const pct=o.pct;const m=CFG.end||{};const msg=pct>=85?(m.hi||'Outstanding work!'):pct>=60?(m.mid||'Nice job. Review the ones you missed and try again.'):(m.lo||'Keep practicing. Replay to lock it in.');
 showOv('<h2>'+(o.title||'Activity complete!')+'</h2><div class="big">'+o.big+'</div><p>'+o.line+'</p><p>'+msg+'</p>'+(o.review&&o.review.length?'<div class="review">'+o.review.map(r=>'<div>'+r+'</div>').join('')+'</div>':'')+'<div class="row"><button class="btn" onclick="start()">Play again</button></div>')}
function setStat(id,v){const e=document.getElementById(id);if(e)e.textContent=v}
function setBar(f){$('#bar').style.width=Math.round(f*100)+'%'}
function fbSet(cls,html){const f=$('#fb');f.className='fb'+(cls?' '+cls:'');f.innerHTML=html}

let q=[],i=0,score=0,streak=0,best=0,right=0,miss=[],t0=0,raf=null,locked=true;const N=CFG.items.length,LIM=CFG.limit||7000;
const binsEl=$('#bins');binsEl.style.gridTemplateColumns='repeat('+(CFG.cols||CFG.bins.length)+',1fr)';
CFG.bins.forEach((b,k)=>{const e=document.createElement('button');e.className='bin';e.innerHTML='<h3>'+b.n+'</h3><p>'+b.d+'</p><span class="kbd">'+(k+1)+'</span>';e.onclick=()=>answer(k);binsEl.appendChild(e)});
function hud(){setStat('sc',score);setStat('st',streak);setStat('pr',i+'/'+N);setBar(i/N)}
function start(){hideOv();q=shuffle(CFG.items);i=0;score=0;streak=0;best=0;right=0;miss=[];fbSet('',CFG.hint);hud();show()}
function show(){const it=q[i],m=1+Math.min(streak,6)*.25;const e=$('#item');e.className='item';e.style.animation='none';void e.offsetWidth;e.style.animation='';
 e.innerHTML=(streak>=2?'<span class="mult">x'+m.toFixed(2)+'</span>':'')+it[0]+'<small>'+(i+1)+' of '+N+'</small>';locked=false;t0=performance.now();cancelAnimationFrame(raf);run()}
function run(){const el=performance.now()-t0;$('#tm').style.width=Math.max(0,100-el/LIM*100)+'%';if(el>=LIM&&!locked){answer(-1);return}if(!locked)raf=requestAnimationFrame(run)}
function answer(k){if(locked)return;locked=true;cancelAnimationFrame(raf);const it=q[i],el=performance.now()-t0,bins=binsEl.children;
 if(k===it[1]){streak++;best=Math.max(best,streak);right++;const pts=Math.round((10+Math.max(0,Math.round((LIM-el)/LIM*10)))*(1+Math.min(streak-1,6)*.25));score+=pts;$('#item').classList.add('ok');bins[k].classList.add('flash-ok');fbSet('ok','<strong>'+it[0]+' \u2192 '+CFG.bins[k].n+'. +'+pts+'</strong> '+it[2])}
 else{streak=0;miss.push(it);$('#item').classList.add('no');if(k>=0)bins[k].classList.add('flash-no');bins[it[1]].classList.add('flash-ok');fbSet('no','<strong>'+(k<0?'Time\u2019s up! ':'Not quite. ')+it[0]+' \u2192 '+CFG.bins[it[1]].n+'.</strong> '+it[2])}
 i++;hud();setTimeout(()=>{[...bins].forEach(b=>b.classList.remove('flash-ok','flash-no'));i<N?show():endScreen({big:score,pct:right/N*100,line:right+' of '+N+' correct &nbsp;|&nbsp; Best streak: '+best,review:miss.map(m=>'<b>'+m[0]+'</b> \u2192 '+CFG.bins[m[1]].n),title:CFG.endTitle})},k===it[1]?800:2000)}
addEventListener('keydown',e=>{if(!ov.classList.contains('hide'))return;const n=parseInt(e.key);if(n>=1&&n<=CFG.bins.length){e.preventDefault();answer(n-1)}});
intro();
</script></body></html>
