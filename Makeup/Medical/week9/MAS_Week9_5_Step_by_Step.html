<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Step by Step</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>:root{--bg:#0c1a2b;--panel:#13263c;--panel2:#1a3250;--line:#284563;--teal:#2ec4b6;--teal-d:#062b28;--gold:#f4b942;--text:#eaf2f8;--muted:#9ab0c5;--bad:#ef6f6c;--good:#4fd1a5}
*{box-sizing:border-box}
button{font-family:inherit}
html,body{height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(1200px 600px at 85% -10%,#16314f 0%,transparent 60%),var(--bg);color:var(--text);font-family:'Source Sans 3',system-ui,-apple-system,'Segoe UI',sans-serif;display:flex;flex-direction:column;font-size:17px}
h1,h2,h3,.disp{font-family:'Lexend',system-ui,sans-serif;letter-spacing:-.01em}
header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 28px;border-bottom:1px solid var(--line);flex:none}
.ttl h1{font-size:clamp(18px,2.1vw,25px);margin:0;font-weight:600}
.ttl p{margin:2px 0 0;color:var(--muted);font-size:14px}
.stats{display:flex;gap:10px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 14px;text-align:center;min-width:76px}
.stat b{display:block;font-family:'Lexend',sans-serif;font-size:20px;color:var(--gold);font-weight:600}
.stat span{font-size:12px;color:var(--muted)}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:16px 28px;gap:14px}
footer{flex:none;padding:8px 28px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.btn{font:600 16px 'Lexend',sans-serif;border:0;border-radius:10px;padding:11px 22px;cursor:pointer;background:var(--teal);color:var(--teal-d);transition:transform .1s,filter .15s}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#2b1d00}
.btn:disabled{opacity:.4;cursor:default;filter:none;transform:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.bar{height:6px;background:var(--panel);border-radius:6px;overflow:hidden;flex:none}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .35s}
.fb{border-radius:12px;padding:12px 16px;font-size:16px;line-height:1.4;background:var(--panel);border-left:4px solid var(--line);min-height:52px}
.fb.ok{border-color:var(--good)}.fb.no{border-color:var(--bad)}
.fb strong{font-family:'Lexend',sans-serif}
.ov{position:fixed;inset:0;background:rgba(6,14,24,.82);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.ov.hide{display:none}
.card-ov{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px 34px;max-width:620px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.card-ov h2{margin:0 0 6px;font-size:clamp(24px,3vw,34px)}
.card-ov .big{font-family:'Lexend',sans-serif;font-size:clamp(40px,6vw,64px);color:var(--gold);font-weight:700;margin:6px 0}
.card-ov p{color:var(--muted);line-height:1.5;margin:8px 0}
.card-ov ul{text-align:left;color:var(--text);line-height:1.55;padding-left:22px;margin:12px 0 20px}
.card-ov .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.review{text-align:left;font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 14px;margin-top:10px;max-height:26vh;overflow:auto}
.review div{padding:3px 0}.review b{color:var(--text)}
.kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;color:var(--text);background:var(--bg)}
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shake{animation:shake .3s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-height:640px){body{font-size:15px}header{padding:8px 20px}main{padding:10px 20px;gap:10px}}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.6vh,16px);max-width:1150px;width:100%;margin:0 auto}
.rp{font:600 clamp(17px,2vw,23px) Lexend,sans-serif;text-align:center;line-height:1.35}
.rp small{display:block;font:400 15px 'Source Sans 3',sans-serif;color:var(--muted);margin-top:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:20px;min-height:0}
.colh{font:600 13px Lexend,sans-serif;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}
.list{display:flex;flex-direction:column;gap:7px}
.ri{display:flex;align-items:center;gap:10px;text-align:left;background:var(--panel2);border:2px solid var(--line);border-radius:12px;padding:8px 12px;color:var(--text);font-size:clamp(14px,1.3vw,16px);line-height:1.3;cursor:pointer;min-height:clamp(38px,6vh,52px)}
.ri:hover:not(:disabled){border-color:var(--teal)}
.ri .num{font:700 14px Lexend,sans-serif;width:26px;height:26px;border-radius:50%;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;color:var(--gold)}
.ri.empty{border-style:dashed;background:transparent;color:var(--muted);cursor:default}
.ri.used{opacity:.25;cursor:default}
.ri.ok{border-color:var(--good);background:#123a35}.ri.no{border-color:var(--bad);background:#3a1a22}
.ri .fix{margin-left:auto;font:600 12px Lexend,sans-serif;color:var(--good);flex:none}
.foot{display:flex;gap:12px;align-items:stretch}.foot .fb{flex:1}
</style></head><body>
<header><div class="ttl"><h1>Step by Step</h1><p>Week 9 &nbsp;|&nbsp; Externship Paperwork, Dosing, and Patient Education</p></div><div class="stats"><div class="stat"><b id="sc">0</b><span>Points</span></div><div class="stat"><b id="st">0</b><span>Perfect</span></div><div class="stat"><b id="pr">0</b><span>Round</span></div></div></header>
<main><div class="bar"><i id="bar"></i></div>
<div class="stage"><div class="rp" id="rp"></div><div class="cols"><div><div class="colh" id="lh"></div><div class="list" id="left"></div></div><div><div class="colh"><span>Choose from</span></div><div class="list" id="right"></div></div></div><div class="foot"><div class="fb" id="fb"></div><button class="btn" id="ck">Check order</button><button class="btn" id="nx" style="display:none">Next</button></div></div>

</main>
<footer><span>Medical Assistant Certificate Program</span><span>Upload your signed externship form to Canvas every week</span></footer>
<div class="ov" id="ov"><div class="card-ov" id="ovc"></div></div>
<script>const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ov=$('#ov'),ovc=$('#ovc');
function showOv(html){ovc.innerHTML=html;ov.classList.remove('hide');const b=ovc.querySelector('button');if(b)b.focus()}
function hideOv(){ov.classList.add('hide')}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

const CFG={"top": "First", "bottom": "Last", "sub": "Tap steps in order, first to last.", "endTitle": "All steps in order!", "intro": {"h": "Step by Step", "p": "Three processes you’ll use right away. Put each in the right order.", "rules": ["3 rounds: externship paperwork, pediatric dosing, and nutrition education.", "Tap steps first to last, then check.", "A perfect order earns a 20-point bonus."]}, "end": {"hi": "You’ve got the process down.", "mid": "Close! Check the steps you swapped.", "lo": "Walk through each process again and retry."}, "rounds": [{"p": "Weekly externship documentation", "short": "Externship paperwork", "items": [{"t": "Enter your office info in Canvas under “Externship Office”"}, {"t": "Print the evaluation form from “Submit Medical Externship Form”"}, {"t": "Your supervisor completes and signs it during the week"}, {"t": "Upload the signed form to Canvas at the end of the week"}, {"t": "Your Academic Advisor documents your hours"}], "why": "Office first, then the weekly cycle of print, sign, upload, and documented hours."}, {"p": "Calculating a pediatric dose (mg/kg/day)", "short": "Pediatric dose", "items": [{"t": "Convert the child’s weight from pounds to kilograms"}, {"t": "Multiply mg/kg by the weight to get the daily dose"}, {"t": "Divide the daily dose by the number of doses per day"}, {"t": "Double-check the math, and ask if anything is unclear"}], "why": "Weight in kg first. Everything else depends on it."}, {"p": "Supporting a patient’s nutrition goals", "short": "Nutrition education", "items": [{"t": "Document weight, BMI, and dietary habits at intake"}, {"t": "Reinforce the provider’s dietary instructions"}, {"t": "Suggest a simple swap, like baked instead of fried"}, {"t": "Encourage a food journal to track progress"}, {"t": "Flag when a registered dietitian referral is needed"}], "why": "Gather information, reinforce the provider, suggest small changes, track, and refer when needed."}]};
function intro(){showOv('<h2>'+CFG.intro.h+'</h2><p>'+CFG.intro.p+'</p><ul>'+CFG.intro.rules.map(r=>'<li>'+r+'</li>').join('')+'</ul><div class="row"><button class="btn" onclick="start()">'+(CFG.intro.go||'Start')+'</button></div>')}
function endScreen(o){const pct=o.pct;const m=CFG.end||{};const msg=pct>=85?(m.hi||'Outstanding work!'):pct>=60?(m.mid||'Nice job. Review the ones you missed and try again.'):(m.lo||'Keep practicing. Replay to lock it in.');
 showOv('<h2>'+(o.title||'Activity complete!')+'</h2><div class="big">'+o.big+'</div><p>'+o.line+'</p><p>'+msg+'</p>'+(o.review&&o.review.length?'<div class="review">'+o.review.map(r=>'<div>'+r+'</div>').join('')+'</div>':'')+'<div class="row"><button class="btn" onclick="start()">Play again</button></div>')}
function setStat(id,v){const e=document.getElementById(id);if(e)e.textContent=v}
function setBar(f){$('#bar').style.width=Math.round(f*100)+'%'}
function fbSet(cls,html){const f=$('#fb');f.className='fb'+(cls?' '+cls:'');f.innerHTML=html}

let R=[],ri=0,score=0,placed=[],pool=[],locked=false,totals=[],perfect=0;const NR=CFG.rounds.length;
function hud(){setStat('sc',score);setStat('st',perfect);setStat('pr',Math.min(ri+1,NR)+'/'+NR);setBar(ri/NR)}
function start(){hideOv();R=CFG.shuffleRounds?shuffle(CFG.rounds):CFG.rounds;ri=0;score=0;perfect=0;totals=[];show()}
function show(){const r=R[ri];locked=false;placed=new Array(r.items.length).fill(null);pool=shuffle(r.items.map((x,k)=>({...x,k})));
 $('#rp').innerHTML=r.p+'<small>'+(r.sub||CFG.sub||'Tap items in order to fill the list. Tap a placed item to send it back.')+'</small>';
 $('#lh').innerHTML='<span>'+(r.top||CFG.top||'First')+'</span><span>'+(r.bottom||CFG.bottom||'Last')+'</span>';fbSet('',r.hint||CFG.hint||'Build your order, then check it.');render();hud()}
function render(){const L=$('#left'),P=$('#right');L.innerHTML='';P.innerHTML='';
 placed.forEach((p,k)=>{const b=document.createElement('button');b.className='ri'+(p?'':' empty');b.innerHTML='<span class="num">'+(k+1)+'</span><span>'+(p?p.t:'\u2026')+'</span>';if(p&&!locked)b.onclick=()=>{placed[k]=null;render()};else b.disabled=!p||locked;L.appendChild(b)});
 pool.forEach(p=>{const used=placed.includes(p);const b=document.createElement('button');b.className='ri'+(used?' used':'');b.innerHTML='<span>'+p.t+'</span>';b.disabled=used||locked;b.onclick=()=>{const k=placed.indexOf(null);if(k>=0){placed[k]=p;render()}};P.appendChild(b)});
 $('#ck').style.display=locked?'none':'';$('#ck').disabled=placed.includes(null)}
function check(){if(locked)return;locked=true;const r=R[ri];let c=0;placed.forEach((p,k)=>{if(p.k===k)c++});const n=r.items.length;const pts=Math.round(c/n*40)+(c===n?20:0);score+=pts;if(c===n)perfect++;totals.push({p:r.short||r.p,c,n});
 render();[...$('#left').children].forEach((b,k)=>{const ok=placed[k].k===k;b.classList.add(ok?'ok':'no');if(!ok)b.insertAdjacentHTML('beforeend','<span class="fix">#'+(placed[k].k+1)+'</span>')});
 fbSet(c===n?'ok':'no','<strong>'+(c===n?'Perfect order! +'+pts:c+' of '+n+' in the right spot. +'+pts)+'</strong> '+(r.why||'')+(c<n?' The green number shows where each red item belongs.':''));
 const nx=$('#nx');nx.style.display='';nx.textContent=ri<NR-1?'Next round':'See results';nx.focus();hud()}
$('#ck').onclick=check;
$('#nx').onclick=()=>{$('#nx').style.display='none';ri++;if(ri<NR)show();else{setBar(1);const tc=totals.reduce((a,t)=>a+t.c,0),tn=totals.reduce((a,t)=>a+t.n,0);endScreen({title:CFG.endTitle,big:score,pct:tc/tn*100,line:perfect+' of '+NR+' rounds perfect &nbsp;|&nbsp; '+tc+' of '+tn+' items placed correctly',review:totals.map(t=>'<b>'+t.p+'</b> \u2192 '+t.c+'/'+t.n)})}};
intro();
</script></body></html>
