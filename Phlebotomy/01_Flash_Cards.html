<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 1 — Flash Cards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;
  --red:#c0392b;--red-light:#e74c3c;--red-glow:rgba(231,76,60,.2);
  --text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;
  --radius:16px;
}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;overflow-x:hidden;}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
header{text-align:center;padding:48px 20px 10px;position:relative;width:100%;max-width:640px;}
header .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:3px;color:var(--red-light);font-weight:700;margin-bottom:10px;}
header h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;line-height:1.1;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{color:var(--dim);font-size:.88rem;margin-top:8px;}
.progress{width:100%;max-width:540px;height:4px;background:var(--border);border-radius:2px;margin:28px auto 0;overflow:hidden;}
.progress-fill{height:100%;background:var(--red);transition:width .5s ease;border-radius:2px;}

.card-area{perspective:1200px;width:100%;max-width:540px;margin:32px auto 0;padding:0 20px;}
.card{width:100%;min-height:260px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,0,.2,1);}
.card.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:var(--radius);display:flex;align-items:center;justify-content:center;padding:36px;text-align:center;line-height:1.7;font-size:1.08rem;}
.front{background:var(--surface);border:1px solid var(--border);font-weight:700;font-size:1.15rem;}
.front::before{content:'Q';position:absolute;top:16px;left:20px;font-family:'Playfair Display',serif;font-size:.85rem;color:var(--red-light);opacity:.7;}
.back{background:linear-gradient(145deg,var(--surface2),rgba(192,57,43,.08));border:1px solid rgba(192,57,43,.35);transform:rotateY(180deg);font-weight:400;color:var(--text);}
.back::before{content:'A';position:absolute;top:16px;left:20px;font-family:'Playfair Display',serif;font-size:.85rem;color:var(--red-light);opacity:.7;}

.hint{text-align:center;color:var(--muted);font-size:.75rem;margin-top:16px;letter-spacing:.5px;}
.counter{text-align:center;color:var(--dim);font-size:.82rem;margin-top:14px;font-weight:600;}
.nav{display:flex;gap:12px;justify-content:center;margin-top:18px;padding-bottom:60px;}
.nav button{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 32px;border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:600;font-family:inherit;transition:all .2s;}
.nav button:hover{border-color:var(--red);background:var(--surface2);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,.4);}
@media(max-width:500px){header h1{font-size:1.7rem;}.face{font-size:.95rem;padding:24px;min-height:220px;}}
</style>
</head>
<body>
<div class="grain"></div>
<header>
  <div class="tag">Activity 1 of 10</div>
  <h1>Flash Cards</h1>
  <p>Tap a card to reveal the answer. 12 essential phlebotomy concepts.</p>
</header>
<div class="progress"><div class="progress-fill" id="prog"></div></div>

<div class="card-area">
  <div class="card" id="card" onclick="this.classList.toggle('flipped')">
    <div class="face front" id="front"></div>
    <div class="face back" id="back"></div>
  </div>
</div>
<div class="hint">Tap card to flip</div>
<div class="counter" id="counter"></div>
<div class="nav">
  <button onclick="go(-1)">← Prev</button>
  <button onclick="go(1)">Next →</button>
</div>

<script>
const cards=[
  {q:"What is the most common venipuncture site?",a:"The median cubital vein in the antecubital fossa."},
  {q:"How far above the site should a tourniquet be placed?",a:"3–4 inches (7–10 cm) above the puncture site."},
  {q:"Maximum time a tourniquet should remain on?",a:"No longer than 1 minute. If delayed, release and reapply after 2 minutes."},
  {q:"What angle should the needle be inserted at?",a:"15–30 degrees."},
  {q:"Why must you let the alcohol dry before puncture?",a:"To reduce contamination risk and prevent stinging and hemolysis."},
  {q:"First tube in the venipuncture order of draw?",a:"Blood cultures (yellow top)."},
  {q:"What does the lavender top tube contain?",a:"EDTA — used for hematology tests like CBC."},
  {q:"What is hemolysis?",a:"Destruction of red blood cells, often caused by wrong gauge needles or excessive force."},
  {q:"What should you do if a patient faints (syncope)?",a:"Stop the procedure immediately and lay the patient down."},
  {q:"What information must be on a specimen label?",a:"Patient name, DOB, date/time of collection, and collector's initials."},
  {q:"What is the capillary order of draw?",a:"Blood gas specimens (CBGs), EDTA, other additive specimens (PST), serum specimens."},
  {q:"Why wipe away the first drop in capillary collection?",a:"The first drop may contain tissue fluid that can contaminate the specimen."},
];
let i=0;
function render(){
  document.getElementById('front').textContent=cards[i].q;
  document.getElementById('back').textContent=cards[i].a;
  document.getElementById('card').classList.remove('flipped');
  document.getElementById('counter').textContent=`${i+1} / ${cards.length}`;
  document.getElementById('prog').style.width=`${((i+1)/cards.length)*100}%`;
}
function go(d){i=(i+d+cards.length)%cards.length;render();}
render();
</script>
</body>
</html>
