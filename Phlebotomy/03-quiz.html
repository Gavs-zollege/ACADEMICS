<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POCT Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0b1120;font-family:'Outfit',sans-serif;color:#ccd}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px}
.tag{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#c0392b;font-weight:700;margin-bottom:8px}
h1{font-family:'Playfair Display',serif;font-size:32px;color:#f0f0f0;margin-bottom:24px}
.info{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px}
.info .sc{color:#27ae60;font-weight:600}
.bar{height:5px;background:#151c2c;border-radius:3px;margin-bottom:32px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#c0392b,#e74c3c);border-radius:3px;transition:width .5s ease}
.question{font-family:'Playfair Display',serif;font-size:22px;color:#f0f0f0;margin-bottom:24px;line-height:1.4}
.opt{padding:16px 20px;border-radius:12px;border:1.5px solid #1e293b;background:#111827;margin-bottom:10px;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .2s}
.opt:hover{background:#1a2236;border-color:#3498db}
.opt.correct{background:#0d2a16;border-color:#27ae60;color:#27ae60;font-weight:600}
.opt.wrong{background:#2a0d0d;border-color:#e74c3c;color:#e74c3c}
.opt.dim{color:#444}
.opt .letter{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #2d3a4d;font-size:12px;font-weight:700;color:#556;flex-shrink:0}
.opt.correct .letter{border-color:#27ae60;color:#27ae60}
.opt.wrong .letter{border-color:#e74c3c;color:#e74c3c}
.next-btn{width:100%;padding:16px;border-radius:12px;border:none;margin-top:8px;background:linear-gradient(135deg,#c0392b,#e74c3c);color:#fff;font-weight:700;font-size:16px;cursor:pointer;display:none}
.result{text-align:center;padding:40px 0}
.result .pct{font-size:72px;font-weight:800;font-family:'Playfair Display',serif;line-height:1}
.result .detail{font-size:18px;color:#8899aa;margin-top:8px}
.result .msg{font-size:24px;font-weight:700;margin-top:16px}
.btn-row{display:flex;gap:12px;margin-top:32px;justify-content:center}
.btn-row button{padding:14px 32px;border-radius:12px;font-weight:600;font-size:15px;cursor:pointer}
.btn-outline{border:1px solid #2d3a4d;background:transparent;color:#8899aa}
.btn-solid{border:none;background:#c0392b;color:#fff;font-weight:700}
.review-card{padding:20px;border-radius:14px;background:#111827;margin-bottom:12px}
.review-card .rq{font-size:14px;font-weight:600;color:#ddd;margin-bottom:12px}
.review-opt{padding:8px 14px;border-radius:8px;margin-bottom:4px;font-size:13px;border:1px solid transparent}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const questions=[
{q:"What does POCT stand for?",opts:["Patient-Ordered Clinical Testing","Point-of-Care Testing","Pre-Operative Cardiac Testing","Post-Operative Care Triage"],ans:1},
{q:"Which CLIA test category can a CPT perform?",opts:["Moderate complexity","High complexity","Waived only","All categories"],ans:2},
{q:"What should you do FIRST if QC results fail?",opts:["Continue testing carefully","Stop patient testing immediately","Call the manufacturer","Recalibrate the device"],ans:1},
{q:"Which hormone does a urine pregnancy test detect?",opts:["Estrogen","Progesterone","hCG","FSH"],ans:2},
{q:"What is NOT required in POCT documentation?",opts:["Patient name and DOB","Test result","Patient's insurance info","Date and time"],ans:2},
{q:"Blood glucose testing is used for all EXCEPT:",opts:["Diabetes management","Emergency assessment","Genetic screening","Routine screening"],ans:2},
{q:"Which is a CLIA-waived test?",opts:["Blood culture","Urinalysis dipstick","CBC with differential","Arterial blood gas"],ans:1},
{q:"Standard Precautions for POCT include:",opts:["Reusing lancets to save costs","Wearing gloves and hand hygiene","Skipping gloves for finger sticks","Sharing meters without cleaning"],ans:1},
{q:"If a glucose meter shows a critically low result, you should:",opts:["Wait and recheck in an hour","Notify the provider immediately","Ignore it if patient feels fine","Adjust the meter settings"],ans:1},
{q:"Failure to follow manufacturer instructions causes:",opts:["Results are still valid","Results are invalidated","Only QC is affected","Nothing significant"],ans:1},
{q:"CLIA regulations ensure all EXCEPT:",opts:["Test accuracy","Reliability of results","Patient safety","Reduced healthcare costs"],ans:3},
{q:"Incomplete documentation of POCT means:",opts:["The test is still valid","The test is invalid","Only a warning is issued","The patient is retested"],ans:1}
];
let idx=0,selected=null,locked=false,score=0,answers=[],phase='quiz';
function render(){
  const app=document.getElementById('app');
  if(phase==='result'){
    const pct=Math.round(score/questions.length*100);
    const col=pct>=80?'#27ae60':pct>=60?'#f1c40f':'#e74c3c';
    const msg=pct>=90?'Outstanding!':pct>=80?'Great work!':pct>=60?'Keep studying!':'Review the material';
    app.innerHTML=`<div class="result"><div class="pct" style="color:${col}">${pct}%</div><div class="detail">${score} of ${questions.length} correct</div><div class="msg" style="color:${col}">${msg}</div><div class="btn-row"><button class="btn-outline" onclick="startReview()">Review Answers</button><button class="btn-solid" onclick="restart()">Retry Quiz</button></div></div>`;
    return;
  }
  if(phase==='review'){
    let html=`<h2 style="font-family:'Playfair Display',serif;font-size:28px;color:#f0f0f0;margin-bottom:24px">Review Answers</h2>`;
    answers.forEach((a,i)=>{
      const q=questions[a.qIdx];
      html+=`<div class="review-card" style="border:1px solid ${a.correct?'#27ae6044':'#e74c3c44'}"><div class="rq">${i+1}. ${q.q}</div>`;
      q.opts.forEach((o,oi)=>{
        let bg='transparent',col='#889',fw=400,bdr='transparent';
        if(oi===q.ans){bg='#27ae6020';col='#27ae60';fw=600;bdr='#27ae6033';}
        else if(oi===a.picked&&!a.correct){bg='#e74c3c20';col='#e74c3c';}
        html+=`<div class="review-opt" style="background:${bg};color:${col};font-weight:${fw};border-color:${bdr}">${o}${oi===q.ans?' ✓':''}${oi===a.picked&&!a.correct?' ✗':''}</div>`;
      });
      html+=`</div>`;
    });
    html+=`<button class="btn-solid" style="width:100%;padding:16px;border-radius:12px;margin-top:12px;font-size:16px" onclick="restart()">Retry Quiz</button>`;
    app.innerHTML=html;return;
  }
  const q=questions[idx];
  let html=`<div class="tag">POCT & CLIA-Waived Procedures</div><h1>Multiple Choice Quiz</h1>`;
  html+=`<div class="info"><span style="color:#667">Question ${idx+1} of ${questions.length}</span><span class="sc">Score: ${score}</span></div>`;
  html+=`<div class="bar"><div class="bar-fill" style="width:${((idx+(locked?1:0))/questions.length)*100}%"></div></div>`;
  html+=`<div class="question">${q.q}</div>`;
  q.opts.forEach((o,i)=>{
    let cls='opt',lc='';
    if(locked){
      if(i===q.ans)cls+=' correct';
      else if(i===selected)cls+=' wrong';
      else cls+=' dim';
    }
    html+=`<div class="${cls}" onclick="pick(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${o}</div>`;
  });
  html+=`<button class="next-btn" id="nextBtn" onclick="next()" style="display:${locked?'block':'none'}">${idx+1>=questions.length?'See Results':'Next Question →'}</button>`;
  app.innerHTML=html;
}
function pick(i){
  if(locked)return;
  selected=i;locked=true;
  const correct=i===questions[idx].ans;
  if(correct)score++;
  answers.push({qIdx:idx,picked:i,correct});
  render();
}
function next(){
  if(idx+1>=questions.length){phase='result';render();return;}
  idx++;selected=null;locked=false;render();
}
function startReview(){phase='review';render()}
function restart(){idx=0;selected=null;locked=false;score=0;answers=[];phase='quiz';render()}
render();
</script>
</body>
</html>
