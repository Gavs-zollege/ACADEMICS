<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POCT Matching Game</title>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;600;700;800&family=Crimson+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(180deg,#0a0a12,#12101e);font-family:'Red Hat Display',sans-serif;color:#eee}
.wrap{max-width:700px;margin:0 auto;padding:40px 20px}
.tag{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#e67e22;font-weight:700;margin-bottom:8px}
h1{font-family:'Crimson Pro',serif;font-size:34px;color:#f0f0f0;font-weight:700;margin-bottom:4px}
.sub{font-size:14px;color:#667;margin-bottom:24px}
.stats{display:flex;gap:20px;margin-bottom:24px}
.stat{padding:10px 20px;border-radius:12px;background:#1a1a2e;border:1px solid #252540;font-size:12px;color:#667}
.stat b{font-size:16px;font-weight:700;margin-left:4px}
.bar{height:4px;background:#1a1a2e;border-radius:2px;margin-bottom:28px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#e67e22,#f1c40f);transition:width .5s ease}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:12px;padding-left:4px}
.card{padding:14px 16px;border-radius:12px;margin-bottom:8px;border:2px solid #252540;background:#151520;cursor:pointer;transition:all .25s;font-size:15px;user-select:none}
.card:hover{transform:translateY(-2px)}
.card.selected-term{background:#1a1a3e;border-color:#e67e22;color:#fff}
.card.selected-def{background:#1a1a3e;border-color:#3498db;color:#fff}
.card.matched{background:#0d2a16;border-color:#27ae6055;color:#27ae60;opacity:.5;cursor:default}
.card.wrong{background:#2a0d0d;border-color:#e74c3c;color:#e74c3c}
.card.dim{cursor:default;opacity:.6}
.def-card{font-size:13px;color:#aab;line-height:1.4}
.complete{text-align:center;padding:48px}
.complete .icon{font-size:56px;margin-bottom:12px}
.complete h2{font-family:'Crimson Pro',serif;font-size:30px;font-weight:700;color:#27ae60}
.complete .det{font-size:15px;color:#889;margin-top:8px}
.complete .acc{font-size:14px;color:#667;margin-top:4px}
.play-btn{margin-top:28px;padding:14px 40px;border-radius:12px;border:none;background:linear-gradient(135deg,#e67e22,#f39c12);color:#fff;font-weight:700;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const pairs=[
{term:"POCT",def:"Testing at or near the patient"},
{term:"CLIA",def:"Federal lab testing regulations"},
{term:"Quality Control",def:"Ensures accurate, reliable results"},
{term:"hCG",def:"Pregnancy test hormone"},
{term:"Critical Value",def:"Requires immediate reporting"},
{term:"Capillary Puncture",def:"Skin puncture for blood sample"},
{term:"Waived Test",def:"Low complexity, CPT-approved"},
{term:"Standard Precautions",def:"Infection control measures"},
{term:"Hypoglycemia",def:"Critically low blood glucose"},
{term:"EMR",def:"Electronic Medical Record system"}
];
let shuffledDefs,selTerm=null,selDef=null,matched=new Set(),attempts=0,wrongT=null,wrongD=null;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function init(){shuffledDefs=shuffle(pairs.map(p=>p.def));selTerm=null;selDef=null;matched=new Set();attempts=0;wrongT=null;wrongD=null;render();}

function clickTerm(i){
  if(matched.has(pairs[i].term)||wrongT!==null)return;
  selTerm=i;
  if(selDef!==null)checkMatch();
  else render();
}
function clickDef(i){
  if(matched.has(pairs.find(p=>p.def===shuffledDefs[i])?.term)||wrongT!==null||selTerm===null)return;
  selDef=i;
  checkMatch();
}
function checkMatch(){
  attempts++;
  const termText=pairs[selTerm].term;
  const defText=shuffledDefs[selDef];
  const correct=pairs.find(p=>p.term===termText&&p.def===defText);
  if(correct){
    matched.add(termText);selTerm=null;selDef=null;render();
    if(matched.size===pairs.length)render();
  }else{
    wrongT=selTerm;wrongD=selDef;render();
    setTimeout(()=>{wrongT=null;wrongD=null;selTerm=null;selDef=null;render();},700);
  }
}
function render(){
  const app=document.getElementById('app');
  if(matched.size===pairs.length){
    app.innerHTML=`<div class="complete"><div class="icon">🏆</div><h2>All Matched!</h2><div class="det">Completed in ${attempts} attempts</div><div class="acc">Accuracy: ${Math.round(pairs.length/attempts*100)}%</div><button class="play-btn" onclick="init()">Play Again</button></div>`;
    return;
  }
  let html=`<div class="tag">POCT & CLIA-Waived Procedures</div><h1>Matching Game</h1><p class="sub">Select a term, then select its matching definition</p>`;
  html+=`<div class="stats"><div class="stat">Matched: <b style="color:#27ae60">${matched.size}/${pairs.length}</b></div><div class="stat">Attempts: <b style="color:#e67e22">${attempts}</b></div></div>`;
  html+=`<div class="bar"><div class="bar-fill" style="width:${matched.size/pairs.length*100}%"></div></div>`;
  html+=`<div class="grid"><div><div class="col-label" style="color:#e67e22">Terms</div>`;
  pairs.forEach((p,i)=>{
    const m=matched.has(p.term);
    let cls='card';
    if(m)cls+=' matched';
    else if(wrongT===i)cls+=' wrong';
    else if(selTerm===i)cls+=' selected-term';
    html+=`<div class="${cls}" onclick="clickTerm(${i})">${p.term}${m?' ✓':''}</div>`;
  });
  html+=`</div><div><div class="col-label" style="color:#3498db">Definitions</div>`;
  shuffledDefs.forEach((d,i)=>{
    const mTerm=pairs.find(p=>p.def===d)?.term;
    const m=matched.has(mTerm);
    let cls='card def-card';
    if(m)cls+=' matched';
    else if(wrongD===i)cls+=' wrong';
    else if(selDef===i)cls+=' selected-def';
    else if(selTerm===null&&!m)cls+=' dim';
    html+=`<div class="${cls}" onclick="clickDef(${i})">${d}${m?' ✓':''}</div>`;
  });
  html+=`</div></div>`;
  app.innerHTML=html;
}
init();
</script>
</body>
</html>
