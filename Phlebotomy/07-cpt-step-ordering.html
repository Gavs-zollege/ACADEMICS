<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPT Exam Review Step Ordering</title>
<link href="https://fonts.googleapis.com/css2?family=Catamaran:wght@400;500;600;700;800;900&family=Noto+Serif+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#edf2f7;font-family:'Noto Serif Display',Georgia,serif;color:#1a2030}
.wrap{max-width:540px;margin:0 auto;padding:40px 20px}
.tag{font-family:'Catamaran',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#3b82f6;font-weight:800;margin-bottom:8px}
h1{font-size:32px;font-weight:700;margin-bottom:4px}
.sub{font-family:'Catamaran',sans-serif;font-size:14px;color:#6a7a90;margin-bottom:24px}
.tabs{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap}
.tab{padding:10px 16px;border-radius:12px;border:1.5px solid #c8d4e0;background:#fff;color:#4a6080;font-family:'Catamaran',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.tab:hover{background:#dce4ee}
.tab.active{background:#3b82f6;border-color:#3b82f6;color:#fff}
.perfect{font-family:'Catamaran',sans-serif;font-size:13px;color:#3b82f6;margin-bottom:16px;font-weight:700}
.step{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;margin-bottom:8px;background:#fff;border:1.5px solid #d0dce8;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.03);transition:all .2s}
.step.correct{background:#ecfdf5;border-color:#22c55e}
.step.wrong{background:#fef2f2;border-color:#ef4444}
.step .num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Catamaran',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.step .text{flex:1;font-family:'Catamaran',sans-serif;font-size:15px;color:#2a3a50;line-height:1.4}
.arrows{display:flex;flex-direction:column;gap:4px}
.arr-btn{width:28px;height:24px;border-radius:6px;border:1px solid #c8d4e0;background:#f0f4f8;cursor:pointer;font-size:11px;color:#6a7a90;display:flex;align-items:center;justify-content:center}
.arr-btn:hover{background:#dce4ee}
.result-box{padding:20px;border-radius:14px;margin-bottom:16px;text-align:center}
.result-box h3{font-family:'Catamaran',sans-serif;font-weight:800;font-size:18px}
.result-box p{font-family:'Catamaran',sans-serif;font-size:13px;color:#6a7a90;margin-top:6px}
.btn-row{display:flex;gap:10px}
.btn-row button{flex:1;padding:14px;border-radius:12px;font-family:'Catamaran',sans-serif;font-weight:700;font-size:15px;cursor:pointer}
.btn-outline{border:1.5px solid #c8d4e0;background:#fff;color:#4a6080}
.btn-solid{border:none;background:#3b82f6;color:#fff}
.check-btn{width:100%;padding:16px;border-radius:12px;border:none;background:#3b82f6;color:#fff;font-family:'Catamaran',sans-serif;font-weight:800;font-size:16px;cursor:pointer}
.mark{font-size:18px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const procedures=[
{title:"Order of Draw",icon:"🧪",steps:["Blood culture bottles","Light blue (citrate)","Red (no additive)","Gold / SST (gel separator)","Green (heparin)","Lavender (EDTA)","Gray (oxalate/fluoride)"]},
{title:"Exposure Incident",icon:"⚠️",steps:["Wash or flush the exposure site immediately","Report the incident to your supervisor","Complete incident documentation","Seek medical evaluation","Complete follow-up testing as directed"]},
{title:"Venipuncture Procedure",icon:"💉",steps:["Identify patient using two identifiers","Obtain informed consent","Apply tourniquet and select vein","Cleanse site with alcohol prep","Insert needle at 15–30° bevel up","Fill tubes in correct order of draw","Release tourniquet before removing needle","Activate safety device and dispose of sharps","Apply pressure and bandage the site","Label tubes at bedside"]},
{title:"Lab Workflow",icon:"🔬",steps:["Physician places order","Phlebotomist collects specimen","Label specimen at bedside","Process specimen (centrifuge if needed)","Transport to laboratory","Laboratory performs testing","Results reported to provider"]}
];
let procIdx=0,items=[],checked=false,perfect=0;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function init(){items=shuffle(procedures[procIdx].steps);checked=false;render();}
function move(from,to){if(checked)return;const n=[...items];const[m]=n.splice(from,1);n.splice(to,0,m);items=n;render();}
function check(){checked=true;if(items.every((it,i)=>it===procedures[procIdx].steps[i]))perfect++;render();}
function setProc(i){procIdx=i;init();}
function render(){
  const app=document.getElementById('app');const p=procedures[procIdx];
  const allRight=checked&&items.every((it,i)=>it===p.steps[i]);const correctCount=checked?items.filter((it,i)=>it===p.steps[i]).length:0;
  let html=`<div class="tag">CPT Exam Preparation</div><h1>Step Ordering</h1><p class="sub">Arrange each procedure in the correct order</p><div class="tabs">`;
  procedures.forEach((pr,i)=>{html+=`<button class="tab ${procIdx===i?'active':''}" onclick="setProc(${i})">${pr.icon} ${pr.title}</button>`;});html+=`</div>`;
  if(perfect>0)html+=`<div class="perfect">⭐ ${perfect} procedure${perfect>1?'s':''} perfected</div>`;
  items.forEach((it,i)=>{const isR=checked&&it===p.steps[i];const isW=checked&&it!==p.steps[i];const nc=checked?(isR?'#22c55e':'#ef4444'):'#3b82f6';
    html+=`<div class="step ${isR?'correct':''}${isW?'wrong':''}" draggable="${!checked}" ondragstart="dragIdx=${i}" ondragover="event.preventDefault()" ondrop="move(dragIdx,${i})"><div class="num" style="background:${nc}15;color:${nc}">${i+1}</div><div class="text">${it}</div>`;
    if(!checked)html+=`<div class="arrows"><button class="arr-btn" onclick="event.stopPropagation();if(${i}>0)move(${i},${i-1})">▲</button><button class="arr-btn" onclick="event.stopPropagation();if(${i}<${items.length-1})move(${i},${i+1})">▼</button></div>`;
    else html+=`<span class="mark">${isR?'✓':'✗'}</span>`;html+=`</div>`;});
  if(checked){html+=`<div class="result-box" style="background:${allRight?'#ecfdf5':'#fff7ed'};border:1.5px solid ${allRight?'#22c55e44':'#f59e0b44'}"><h3 style="color:${allRight?'#16a34a':'#d97706'}">${allRight?'🎉 Perfect Order!':correctCount+'/'+items.length+' correct'}</h3>${!allRight?'<p>Red steps are out of position</p>':''}</div><div class="btn-row"><button class="btn-outline" onclick="init()">Retry</button><button class="btn-solid" onclick="setProc((procIdx+1)%${procedures.length})">Next →</button></div>`;}
  else html+=`<button class="check-btn" onclick="check()">Check Order</button>`;
  app.innerHTML=html;
}
let dragIdx=null;
init();
</script>
</body>
</html>
