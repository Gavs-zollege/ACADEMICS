<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POCT Step Ordering</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500;600;700&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#f2f7f5;font-family:'Lora',Georgia,serif;color:#1a2e22}
.wrap{max-width:540px;margin:0 auto;padding:40px 20px}
.tag{font-family:'Nunito Sans',sans-serif;font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#1a7a3a;font-weight:700;margin-bottom:8px}
h1{font-size:32px;font-weight:700;margin-bottom:4px}
.sub{font-family:'Nunito Sans',sans-serif;font-size:14px;color:#6a8a78;margin-bottom:24px}
.tabs{display:flex;gap:6px;margin-bottom:28px;flex-wrap:wrap}
.tab{padding:10px 16px;border-radius:12px;border:1.5px solid #d0ddd5;background:#fff;color:#4a6a55;font-family:'Nunito Sans',sans-serif;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.tab:hover{background:#e8f0ec}
.tab.active{background:#1a7a3a;border-color:#1a7a3a;color:#fff}
.perfect{font-family:'Nunito Sans',sans-serif;font-size:13px;color:#1a7a3a;margin-bottom:16px;font-weight:600}
.step{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:14px;margin-bottom:8px;background:#fff;border:1.5px solid #e0ece5;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.03);transition:all .2s}
.step:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
.step.correct{background:#edf7f0;border-color:#27ae60}
.step.wrong{background:#fef5f0;border-color:#e74c3c}
.step .num{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Nunito Sans',sans-serif;font-weight:800;font-size:14px;flex-shrink:0}
.step .text{flex:1;font-family:'Nunito Sans',sans-serif;font-size:15px;color:#2a3e30;line-height:1.4}
.arrows{display:flex;flex-direction:column;gap:4px}
.arr-btn{width:28px;height:24px;border-radius:6px;border:1px solid #d0ddd5;background:#f8fcf9;cursor:pointer;font-size:11px;color:#6a8a78;display:flex;align-items:center;justify-content:center;transition:background .15s}
.arr-btn:hover{background:#e0ece5}
.result-box{padding:20px;border-radius:14px;margin-bottom:16px;text-align:center}
.result-box h3{font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:18px}
.result-box p{font-family:'Nunito Sans',sans-serif;font-size:13px;color:#8a7e6e;margin-top:6px}
.btn-row{display:flex;gap:10px}
.btn-row button{flex:1;padding:14px;border-radius:12px;font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:15px;cursor:pointer}
.btn-outline{border:1.5px solid #d0ddd5;background:#fff;color:#4a6a55}
.btn-solid{border:none;background:#1a7a3a;color:#fff}
.check-btn{width:100%;padding:16px;border-radius:12px;border:none;background:#1a7a3a;color:#fff;font-family:'Nunito Sans',sans-serif;font-weight:700;font-size:16px;cursor:pointer}
.mark{font-size:18px;flex-shrink:0}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const procedures=[
{title:"Blood Glucose Testing",icon:"🩸",steps:["Verify patient identity","Perform hand hygiene and apply gloves","Prepare meter and test strip","Perform capillary puncture","Apply blood to strip","Read and record result"]},
{title:"Urine Pregnancy Testing",icon:"🧪",steps:["Verify patient identity","Check expiration date of test kit","Apply specimen as directed","Time test accurately","Read result within reading window","Document result"]},
{title:"QC Failure Response",icon:"⚠️",steps:["Identify that QC results are outside acceptable range","Stop patient testing immediately","Do not report any pending results","Notify supervisor","Document corrective action taken","Resume testing only after QC passes"]},
{title:"POCT Documentation",icon:"📋",steps:["Record patient name and date of birth","Document the test performed","Record the test result","Note the date and time of testing","Add your initials","Enter results into EMR if required"]}
];
let procIdx=0,items=[],checked=false,perfect=0,dragIdx=null;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function init(){items=shuffle(procedures[procIdx].steps);checked=false;render();}
function move(from,to){
  if(checked)return;
  const n=[...items];const[m]=n.splice(from,1);n.splice(to,0,m);items=n;render();
}
function check(){
  checked=true;
  const allRight=items.every((it,i)=>it===procedures[procIdx].steps[i]);
  if(allRight)perfect++;
  render();
}
function retry(){items=shuffle(procedures[procIdx].steps);checked=false;render();}
function nextProc(){procIdx=(procIdx+1)%procedures.length;init();}
function setProc(i){procIdx=i;init();}
function render(){
  const app=document.getElementById('app');
  const p=procedures[procIdx];
  const allRight=checked&&items.every((it,i)=>it===p.steps[i]);
  const correctCount=checked?items.filter((it,i)=>it===p.steps[i]).length:0;
  let html=`<div class="tag">POCT & CLIA-Waived Procedures</div><h1>Step Ordering</h1><p class="sub">Arrange the steps in the correct order</p>`;
  html+=`<div class="tabs">`;
  procedures.forEach((pr,i)=>{
    html+=`<button class="tab ${procIdx===i?'active':''}" onclick="setProc(${i})">${pr.icon} ${pr.title}</button>`;
  });
  html+=`</div>`;
  if(perfect>0)html+=`<div class="perfect">⭐ ${perfect} procedure${perfect>1?'s':''} perfected</div>`;
  items.forEach((it,i)=>{
    const isRight=checked&&it===p.steps[i];
    const isWrong=checked&&it!==p.steps[i];
    const numCol=checked?(isRight?'#27ae60':'#e74c3c'):'#1a7a3a';
    html+=`<div class="step ${isRight?'correct':''}${isWrong?'wrong':''}" draggable="${!checked}" ondragstart="dragIdx=${i}" ondragover="event.preventDefault()" ondrop="move(dragIdx,${i})">
      <div class="num" style="background:${numCol}15;color:${numCol}">${i+1}</div>
      <div class="text">${it}</div>`;
    if(!checked){
      html+=`<div class="arrows"><button class="arr-btn" onclick="event.stopPropagation();if(${i}>0)move(${i},${i-1})">▲</button><button class="arr-btn" onclick="event.stopPropagation();if(${i}<${items.length-1})move(${i},${i+1})">▼</button></div>`;
    }else{
      html+=`<span class="mark">${isRight?'✓':'✗'}</span>`;
    }
    html+=`</div>`;
  });
  if(checked){
    html+=`<div class="result-box" style="background:${allRight?'#edf7f0':'#fffaf5'};border:1.5px solid ${allRight?'#27ae6044':'#e67e2244'}"><h3 style="color:${allRight?'#1a7a3a':'#c06020'}">${allRight?'🎉 Perfect Order!':correctCount+'/'+items.length+' steps correct'}</h3>${!allRight?'<p>Steps highlighted in red are out of position</p>':''}</div>`;
    html+=`<div class="btn-row"><button class="btn-outline" onclick="retry()">Retry</button><button class="btn-solid" onclick="nextProc()">Next Procedure →</button></div>`;
  }else{
    html+=`<button class="check-btn" onclick="check()">Check Order</button>`;
  }
  app.innerHTML=html;
}
init();
</script>
</body>
</html>
