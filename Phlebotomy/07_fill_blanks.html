<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 7 — Fill in the Blanks</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0D19;--card:#111628;--surface:#1A2038;--crimson:#9B2335;--gold:#D4A843;--text:#EDE9DF;--dim:#6E728A;--success:#43B581;--error:#E74C3C;--border:#222640;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:radial-gradient(ellipse at 60% 20%,#151A30,var(--bg));font-family:'Lora',serif;color:var(--text);}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:32px;}
  .label{font-size:11px;letter-spacing:4px;color:var(--crimson);text-transform:uppercase;font-family:'DM Sans',sans-serif;font-weight:600;margin-bottom:8px;}
  h1{font-size:34px;color:var(--gold);}
  .sub{font-family:'DM Sans',sans-serif;color:var(--dim);font-size:14px;margin-top:8px;}
  .prog-row{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .prog-text{font-family:'DM Sans',sans-serif;font-size:13px;color:var(--dim);}
  .prog-bar{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden;}
  .prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--crimson),var(--gold));transition:width .4s;}
  .score-text{color:var(--success);}
  .s-card{background:var(--card);border-radius:14px;padding:32px 24px;border:1px solid var(--border);margin-bottom:20px;}
  .sentence{font-size:20px;line-height:1.7;}
  .blank{display:inline-block;min-width:120px;border-bottom:2px dashed var(--gold);font-weight:600;padding:0 4px;margin:0 4px;}
  .input-row{display:flex;gap:10px;margin-bottom:16px;}
  #ansInput{flex:1;padding:14px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;font-family:'DM Sans',sans-serif;outline:none;}
  #ansInput:focus{border-color:var(--gold);}
  .btn{padding:14px 24px;border-radius:10px;border:none;background:var(--gold);color:var(--bg);font-size:15px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;white-space:nowrap;}
  .btn:hover{filter:brightness(1.1);}
  .hint-link{background:transparent;border:none;color:var(--dim);font-size:13px;font-family:'DM Sans',sans-serif;cursor:pointer;text-decoration:underline;}
  .hint-text{color:var(--gold);font-size:13px;font-family:'DM Sans',sans-serif;margin-top:6px;}
  .feedback{text-align:center;padding:12px 16px;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;}
  .results{text-align:center;padding:40px;}
  .res-score{font-size:56px;font-weight:700;color:var(--gold);}
  .res-msg{font-size:16px;font-family:'DM Sans',sans-serif;margin:8px 0 32px;}
  .btn-retry{padding:14px 40px;border-radius:10px;border:none;background:var(--crimson);color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="label">Activity 7 of 10</div>
    <h1>Fill in the Blanks</h1>
    <p class="sub">Type the missing term to complete each statement.</p>
  </div>
  <div id="game">
    <div class="prog-row">
      <span class="prog-text" id="progPos">1/12</span>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      <span class="prog-text score-text" id="scoreText">0✓</span>
    </div>
    <div class="s-card" id="sCard"></div>
    <div class="input-row">
      <input type="text" id="ansInput" placeholder="Type your answer..." autocomplete="off">
      <button class="btn" id="actionBtn" onclick="doAction()">Check</button>
    </div>
    <div style="text-align:center" id="hintArea"></div>
    <div id="feedbackArea" style="margin-top:12px"></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {s:"The heart is located in the ___ between the lungs.",a:"mediastinum",h:"Starts with 'M'"},
  {s:"The ___ is the thick muscular layer responsible for pumping blood.",a:"myocardium",h:"Starts with 'M'"},
  {s:"The ___ node is the heart's natural pacemaker.",a:"sa",h:"Two letters (abbreviation)"},
  {s:"During ___, the heart relaxes and fills with blood.",a:"diastole",h:"Starts with 'D'"},
  {s:"The ___ carries oxygenated blood from the left ventricle to the body.",a:"aorta",h:"Starts with 'A' — largest artery"},
  {s:"The ___ valve is located between the left atrium and left ventricle.",a:"mitral",h:"Starts with 'M' (also called bicuspid)"},
  {s:"___ fibers distribute electrical impulses throughout the ventricles.",a:"purkinje",h:"Starts with 'P'"},
  {s:"The ___ vena cava returns blood from the upper body.",a:"superior",h:"Starts with 'S'"},
  {s:"The ___ is the smooth inner lining of the heart chambers.",a:"endocardium",h:"Starts with 'E'"},
  {s:"The right ventricle pumps blood to the lungs via the pulmonary ___.",a:"arteries",h:"Starts with 'A'"},
  {s:"Blood pressure reflects the cardiac cycle of systole and ___.",a:"diastole",h:"Starts with 'D'"},
  {s:"The ___ of His conducts impulses from the AV node to the bundle branches.",a:"bundle",h:"Starts with 'B'"},
];
let idx=0,result=null,score=0,showHint=false;
function render(){
  const q=QS[idx];
  document.getElementById('progPos').textContent=`${idx+1}/${QS.length}`;
  document.getElementById('progFill').style.width=`${(idx+1)/QS.length*100}%`;
  document.getElementById('scoreText').textContent=`${score}✓`;
  const parts=q.s.split('___');
  let blankCol=result===null?'var(--gold)':result?'var(--success)':'var(--error)';
  let blankText=result!==null?(result?document.getElementById('ansInput').value:q.a):'___';
  document.getElementById('sCard').innerHTML=`<div class="sentence">${parts[0]}<span class="blank" style="border-color:${blankCol};color:${blankCol}">${blankText}</span>${parts[1]}</div>`;
  const inp=document.getElementById('ansInput');
  const btn=document.getElementById('actionBtn');
  if(result!==null){
    inp.disabled=true;inp.style.borderColor=result?'var(--success)':'var(--error)';
    btn.textContent=idx+1>=QS.length?'Results':'Next →';
  }else{
    inp.disabled=false;inp.style.borderColor='var(--border)';
    btn.textContent='Check';
  }
  // hint
  if(result===null){
    document.getElementById('hintArea').innerHTML=showHint?
      `<button class="hint-link" onclick="toggleHint()">Hide hint</button><div class="hint-text">${q.h}</div>`:
      `<button class="hint-link" onclick="toggleHint()">Need a hint?</button>`;
  }else{document.getElementById('hintArea').innerHTML='';}
  // feedback
  if(result!==null){
    const col=result?'var(--success)':'var(--error)';
    const bg=result?'rgba(67,181,129,.07)':'rgba(231,76,60,.07)';
    const bc=result?'rgba(67,181,129,.2)':'rgba(231,76,60,.2)';
    document.getElementById('feedbackArea').innerHTML=`<div class="feedback" style="background:${bg};border:1px solid ${bc};color:${col}">${result?'Correct!':'The answer is: '+q.a}</div>`;
  }else{document.getElementById('feedbackArea').innerHTML='';}
}
function doAction(){
  if(result!==null){
    if(idx+1>=QS.length){showResults();return;}
    idx++;result=null;showHint=false;
    document.getElementById('ansInput').value='';
    render();document.getElementById('ansInput').focus();
    return;
  }
  const v=document.getElementById('ansInput').value.trim();
  if(!v)return;
  result=v.toLowerCase()===QS[idx].a.toLowerCase();
  if(result)score++;
  render();
}
function toggleHint(){showHint=!showHint;render();}
function showResults(){
  document.getElementById('game').style.display='none';
  const r=document.getElementById('results');r.style.display='block';
  const pct=score/QS.length*100;
  const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';
  const msg=pct>=80?"Excellent recall!":pct>=60?"Good work — practice the ones you missed.":"Review the material and try again.";
  r.innerHTML=`<div class="res-score">${score}/${QS.length}</div><div class="res-msg" style="color:${col}">${msg}</div><button class="btn-retry" onclick="reset()">Try Again</button>`;
}
function reset(){idx=0;result=null;score=0;showHint=false;document.getElementById('ansInput').value='';document.getElementById('game').style.display='block';document.getElementById('results').style.display='none';render();document.getElementById('ansInput').focus();}
document.getElementById('ansInput').addEventListener('keydown',e=>{if(e.key==='Enter')doAction();});
render();
</script>
</body>
</html>
