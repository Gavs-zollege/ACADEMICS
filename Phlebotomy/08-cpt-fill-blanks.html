<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPT Exam Review Fill in the Blanks</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Signika+Negative:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#0c0814;font-family:'JetBrains Mono',monospace;color:#d0c0e0}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px}
.tag{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#c850c0;font-weight:700;margin-bottom:8px}
h1{font-family:'Signika Negative',sans-serif;font-size:30px;font-weight:700;margin-bottom:4px;color:#f0e0f8}
.sub{font-size:13px;color:#5a4068;margin-bottom:28px}
.info{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:#5a4068}
.info .sc{color:#c850c0;font-weight:700}
.bar{height:4px;background:#160e20;border-radius:2px;margin-bottom:36px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#c850c0,#e880d0);transition:width .4s}
.sentence-card{padding:32px 28px;border-radius:16px;margin-bottom:24px;background:#140e20;border:1px solid #2a1e38;font-family:'Signika Negative',sans-serif;font-size:18px;font-weight:500;line-height:2.4;color:#a090c0}
.sentence-card input{display:inline-block;padding:6px 12px;border-radius:8px;font-size:17px;font-weight:700;text-align:center;font-family:'JetBrains Mono',monospace;border:2px solid #2a1e38;background:#0a0610;color:#d0c0e0;outline:none;margin:0 6px;transition:all .2s;vertical-align:baseline}
.sentence-card input:focus{border-color:#c850c0;box-shadow:0 0 0 3px rgba(200,80,192,.2)}
.sentence-card input::placeholder{color:#2a1e38}
.sentence-card input.correct{border-color:#27ae60;background:#27ae6015;color:#27ae60}
.sentence-card input.wrong{border-color:#e74c3c;background:#e74c3c15;color:#e74c3c}
.reveal{padding:16px;border-radius:10px;background:#140e20;border:1px solid #2a1e38;margin-bottom:16px;font-size:12px;color:#5a4068}
.reveal b{color:#c850c0;font-size:14px}
.ok-msg{padding:16px;border-radius:10px;background:#27ae6012;border:1px solid #27ae6033;margin-bottom:16px;text-align:center;font-size:15px;color:#27ae60;font-weight:700}
.action-btn{width:100%;padding:16px;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;font-family:'JetBrains Mono',monospace;transition:all .2s}
.btn-check{border:2px solid #c850c0;background:transparent;color:#c850c0}
.btn-check:disabled{opacity:.5;cursor:default}
.btn-next{border:none;background:linear-gradient(135deg,#c850c0,#9040a0);color:#fff}
.result{text-align:center;padding:40px 0}
.result .pct{font-family:'Signika Negative',sans-serif;font-size:72px;font-weight:700;line-height:1}
.result .det{font-size:15px;color:#5a4068;margin-top:10px}
.result .msg{font-family:'Signika Negative',sans-serif;font-size:22px;font-weight:700;margin-top:16px}
.result button{margin-top:32px;padding:16px 48px;border-radius:8px;border:2px solid #c850c0;background:transparent;color:#c850c0;font-weight:700;font-size:16px;cursor:pointer;font-family:'JetBrains Mono',monospace}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const questions=[
{display:"The CPT exam has {0} scored questions with a 2-hour limit.",answers:["100"]},
{display:"The first tube in the order of draw is always blood {0}.",answers:["cultures"]},
{display:"The needle should enter at {0}–30 degrees with bevel up.",answers:["15"]},
{display:"The tourniquet must remain on for less than {0} minute(s).",answers:["1"]},
{display:"After exposure, the first step is to {0} the site immediately.",answers:["wash"]},
{display:"{0} Precautions are applied to ALL patients.",answers:["Standard"]},
{display:"Patient identity requires two {0} before every draw.",answers:["identifiers"]},
{display:"The antiseptic used for blood culture prep is {0}.",answers:["chlorhexidine"]},
{display:"Specimen {0} is the most common reason for lab errors.",answers:["mislabeling"]},
{display:"QC for POCT must be done {0} patient testing.",answers:["before"]},
{display:"Chain of custody is required for drug screens and blood {0} testing.",answers:["alcohol"]},
{display:"Most laboratory errors occur in the {0}-analytical phase.",answers:["pre"]}
];
let idx=0,checked=false,score=0,done=false,inputs=[];
function getInputs(){return Array.from(document.querySelectorAll('.blank-input')).map(e=>e.value);}
function renderSentence(q){const parts=q.display.split(/\{(\d+)\}/);let html='';parts.forEach(part=>{if(/^\d+$/.test(part)){const n=Number(part);const w=Math.max(100,q.answers[n].length*16);let cls='blank-input';if(checked)cls+=(inputs[n]||'').trim().toLowerCase()===q.answers[n].toLowerCase()?' correct':' wrong';html+=`<input class="${cls}" data-idx="${n}" style="width:${w}px" placeholder="___" value="${inputs[n]||''}" ${checked?'disabled':''}>`;}else html+=part;});return html;}
function render(){
  const app=document.getElementById('app');
  if(done){const pct=Math.round(score/questions.length*100);const col=pct>=80?'#c850c0':pct>=60?'#f1c40f':'#e74c3c';const msg=pct>=90?'Exam ready!':pct>=70?'Solid recall!':'Keep reviewing!';app.innerHTML=`<div class="result"><div class="pct" style="color:${col}">${pct}%</div><div class="det">${score} / ${questions.length} correct</div><div class="msg" style="color:${col}">${msg}</div><button onclick="restart()">Restart</button></div>`;return;}
  const q=questions[idx];let html=`<div class="tag">CPT Exam Preparation</div><h1>Fill in the Blanks</h1><p class="sub">Type the missing word to complete each statement</p><div class="info"><span>${idx+1} / ${questions.length}</span><span class="sc">Score: ${score}</span></div><div class="bar"><div class="bar-fill" style="width:${((idx+(checked?1:0))/questions.length)*100}%"></div></div><div class="sentence-card">${renderSentence(q)}</div>`;
  const allCorrect=checked&&inputs.every((v,i)=>(v||'').trim().toLowerCase()===q.answers[i].toLowerCase());
  if(checked&&!allCorrect)html+=`<div class="reveal">Correct: <b>${q.answers.join(', ')}</b></div>`;
  if(checked&&allCorrect)html+=`<div class="ok-msg">✓ Correct!</div>`;
  if(!checked)html+=`<button class="action-btn btn-check" id="checkBtn" onclick="doCheck()">Check Answer</button>`;
  else html+=`<button class="action-btn btn-next" onclick="next()">${idx+1>=questions.length?'See Results':'Next →'}</button>`;
  app.innerHTML=html;
  if(!checked){const els=document.querySelectorAll('.blank-input');els.forEach(el=>{el.addEventListener('input',()=>{inputs[Number(el.dataset.idx)]=el.value;updateCB();});el.addEventListener('keydown',e=>{if(e.key==='Enter')doCheck();});});if(els.length)els[0].focus();updateCB();}
}
function updateCB(){const btn=document.getElementById('checkBtn');if(!btn)return;const ok=questions[idx].answers.every((_,i)=>(inputs[i]||'').trim());btn.disabled=!ok;btn.style.opacity=ok?1:.5;}
function doCheck(){inputs=getInputs();if(!questions[idx].answers.every((_,i)=>(inputs[i]||'').trim()))return;checked=true;if(inputs.every((v,i)=>(v||'').trim().toLowerCase()===questions[idx].answers[i].toLowerCase()))score++;render();}
function next(){if(idx+1>=questions.length){done=true;render();return;}idx++;checked=false;inputs=[];render();}
function restart(){idx=0;checked=false;score=0;done=false;inputs=[];render();}
render();
</script>
</body>
</html>
