<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Professional Phlebotomist Fill in the Blanks</title>
<link href="https://fonts.googleapis.com/css2?family=Azeret+Mono:wght@400;500;600;700&family=Saira:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:#08081a;font-family:'Azeret Mono',monospace;color:#d0d8f0}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px}
.tag{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#5b8def;font-weight:700;margin-bottom:8px}
h1{font-family:'Saira',sans-serif;font-size:30px;font-weight:800;margin-bottom:4px}
.sub{font-size:13px;color:#3a4a6a;margin-bottom:28px}
.info{display:flex;justify-content:space-between;margin-bottom:8px;font-size:12px;color:#3a4a6a}
.info .sc{color:#5b8def;font-weight:700}
.bar{height:4px;background:#10102a;border-radius:2px;margin-bottom:36px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#5b8def,#3a6ddf);transition:width .4s}
.sentence-card{padding:32px 28px;border-radius:16px;margin-bottom:24px;background:#0e0e24;border:1px solid #1a1a40;font-family:'Saira',sans-serif;font-size:18px;font-weight:500;line-height:2.4;color:#a0b0d0}
.sentence-card input{display:inline-block;padding:6px 12px;border-radius:8px;font-size:17px;font-weight:700;text-align:center;font-family:'Azeret Mono',monospace;border:2px solid #1a1a40;background:#06061a;color:#d0d8f0;outline:none;margin:0 6px;transition:all .2s;vertical-align:baseline}
.sentence-card input:focus{border-color:#5b8def;box-shadow:0 0 0 3px rgba(91,141,239,.2)}
.sentence-card input::placeholder{color:#2a2a50}
.sentence-card input.correct{border-color:#27ae60;background:#27ae6015;color:#27ae60}
.sentence-card input.wrong{border-color:#e74c3c;background:#e74c3c15;color:#e74c3c}
.reveal{padding:16px;border-radius:10px;background:#0e0e24;border:1px solid #1a1a40;margin-bottom:16px;font-size:12px;color:#3a4a6a}
.reveal b{color:#5b8def;font-size:14px}
.ok-msg{padding:16px;border-radius:10px;background:#27ae6012;border:1px solid #27ae6033;margin-bottom:16px;text-align:center;font-size:15px;color:#27ae60;font-weight:700}
.action-btn{width:100%;padding:16px;border-radius:10px;font-weight:700;font-size:16px;cursor:pointer;font-family:'Azeret Mono',monospace;transition:all .2s}
.btn-check{border:2px solid #5b8def;background:transparent;color:#5b8def}
.btn-check:disabled{opacity:.5;cursor:default}
.btn-next{border:none;background:linear-gradient(135deg,#5b8def,#3a6ddf);color:#fff}
.result{text-align:center;padding:40px 0}
.result .pct{font-family:'Saira',sans-serif;font-size:72px;font-weight:800;line-height:1}
.result .det{font-size:15px;color:#3a4a6a;margin-top:10px}
.result .msg{font-family:'Saira',sans-serif;font-size:22px;font-weight:700;margin-top:16px}
.result button{margin-top:32px;padding:16px 48px;border-radius:8px;border:2px solid #5b8def;background:transparent;color:#5b8def;font-weight:700;font-size:16px;cursor:pointer;font-family:'Azeret Mono',monospace}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const questions=[
{display:"Phlebotomists must verify identity using {0} identifiers.",answers:["two"]},
{display:"{0} consent must be obtained before every blood draw.",answers:["Informed"]},
{display:"HIPAA protects patient {0} information.",answers:["health"]},
{display:"Documentation is considered a {0} record.",answers:["legal"]},
{display:"The most important infection control measure is hand {0}.",answers:["hygiene"]},
{display:"Sharps must be disposed of {0} after use.",answers:["immediately"]},
{display:"Phlebotomists should explain procedures using patient-friendly {0}.",answers:["language"]},
{display:"Professional {0} include not sharing personal information with patients.",answers:["boundaries"]},
{display:"Needlestick injuries must be {0} per facility policy.",answers:["reported"]},
{display:"Phlebotomists are {0} of healthcare quality.",answers:["ambassadors"]},
{display:"Providing the same quality of care to all patients is called {0} care.",answers:["equitable"]},
{display:"Professional growth includes accepting {0} and continuing education.",answers:["feedback"]}
];
let idx=0,checked=false,score=0,done=false,inputs=[];
function getInputs(){return Array.from(document.querySelectorAll('.blank-input')).map(e=>e.value);}
function renderSentence(q){const parts=q.display.split(/\{(\d+)\}/);let html='';parts.forEach(part=>{if(/^\d+$/.test(part)){const n=Number(part);const w=Math.max(100,q.answers[n].length*16);let cls='blank-input';if(checked)cls+=(inputs[n]||'').trim().toLowerCase()===q.answers[n].toLowerCase()?' correct':' wrong';html+=`<input class="${cls}" data-idx="${n}" style="width:${w}px" placeholder="___" value="${inputs[n]||''}" ${checked?'disabled':''}>`;}else html+=part;});return html;}
function render(){
  const app=document.getElementById('app');
  if(done){const pct=Math.round(score/questions.length*100);const col=pct>=80?'#5b8def':pct>=60?'#f1c40f':'#e74c3c';const msg=pct>=90?'Excellent recall!':pct>=70?'Solid work!':'Keep practicing!';app.innerHTML=`<div class="result"><div class="pct" style="color:${col}">${pct}%</div><div class="det">${score} / ${questions.length} correct</div><div class="msg" style="color:${col}">${msg}</div><button onclick="restart()">Restart</button></div>`;return;}
  const q=questions[idx];let html=`<div class="tag">The Professional Phlebotomist</div><h1>Fill in the Blanks</h1><p class="sub">Type the missing word to complete each statement</p><div class="info"><span>${idx+1} / ${questions.length}</span><span class="sc">Score: ${score}</span></div><div class="bar"><div class="bar-fill" style="width:${((idx+(checked?1:0))/questions.length)*100}%"></div></div><div class="sentence-card">${renderSentence(q)}</div>`;
  const allCorrect=checked&&inputs.every((v,i)=>(v||'').trim().toLowerCase()===q.answers[i].toLowerCase());
  if(checked&&!allCorrect)html+=`<div class="reveal">Correct: <b>${q.answers.join(', ')}</b></div>`;
  if(checked&&allCorrect)html+=`<div class="ok-msg">✓ Correct!</div>`;
  if(!checked)html+=`<button class="action-btn btn-check" id="checkBtn" onclick="doCheck()">Check Answer</button>`;
  else html+=`<button class="action-btn btn-next" onclick="next()">${idx+1>=questions.length?'See Results':'Next →'}</button>`;
  app.innerHTML=html;
  if(!checked){const els=document.querySelectorAll('.blank-input');els.forEach(el=>{el.addEventListener('input',()=>{inputs[Number(el.dataset.idx)]=el.value;updateCB();});el.addEventListener('keydown',e=>{if(e.key==='Enter')doCheck();});});if(els.length)els[0].focus();updateCB();}
}
function updateCB(){const btn=document.getElementById('checkBtn');if(!btn)return;const ok=questions[idx].answers.every((_,i)=>(inputs[i]||'').trim());btn.disabled=!ok;btn.style.opacity=ok?1:.5;}
function doCheck(){inputs=getInputs();if(!questions[idx].answers.every((_,i)=>(inputs[i]||'').trim()))return;checked=true;if(inputs.every((v,i)=>(v||'').trim().toLowerCase()===questions[idx].answers[i].toLowerCase()))score++;render();}
function next(){if(idx+1>=questions.length){done=true;render();return;}idx++;checked=false;inputs=[];render();}
function restart(){idx=0;checked=false;score=0;done=false;inputs=[];render();}
render();
</script>
</body>
</html>
