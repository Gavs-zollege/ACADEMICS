<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPT Exam Speed Round</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(170deg,#0a0e10,#0e1214,#0a0e10);font-family:'Space Grotesk',sans-serif;color:#d8e0e4;overflow-x:hidden}
.wrap{max-width:560px;margin:0 auto;padding:36px 20px}
.header{text-align:center;margin-bottom:28px}
.tag{font-family:'Teko',sans-serif;font-size:13px;letter-spacing:5px;text-transform:uppercase;color:#a0ff50;margin-bottom:6px}
h1{font-family:'Teko',sans-serif;font-size:48px;font-weight:700;letter-spacing:2px;line-height:1;background:linear-gradient(135deg,#a0ff50,#50d060);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:13px;color:#3a4a44;margin-top:6px}
.start-screen{text-align:center;padding:60px 20px}
.start-screen .icon{font-size:80px;margin-bottom:20px}
.start-screen h2{font-family:'Teko',sans-serif;font-size:36px;font-weight:600;letter-spacing:2px;margin-bottom:8px;color:#e0e8e4}
.start-screen p{color:#4a5a54;font-size:15px;margin-bottom:12px;line-height:1.6}
.domain-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:36px}
.domain-chip{padding:6px 14px;border-radius:8px;font-size:11px;font-weight:600;letter-spacing:.5px}
.start-btn{padding:20px 64px;border-radius:50px;border:none;background:linear-gradient(135deg,#a0ff50,#60c040);color:#0a0e10;font-family:'Teko',sans-serif;font-size:22px;font-weight:700;letter-spacing:3px;cursor:pointer;box-shadow:0 0 50px rgba(160,255,80,.2);transition:transform .2s}
.start-btn:hover{transform:scale(1.05)}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.timer-wrap{display:flex;align-items:baseline;gap:6px}
.timer{font-family:'Teko',sans-serif;font-size:44px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.timer.danger{color:#ff4444;animation:pulse .5s ease infinite alternate}
@keyframes pulse{from{opacity:1}to{opacity:.4}}
.timer-unit{font-family:'Teko',sans-serif;font-size:16px;color:#3a4a44;letter-spacing:2px}
.timer-bar{height:5px;background:#141c1a;border-radius:3px;overflow:hidden;margin-bottom:24px}
.timer-bar-fill{height:100%;border-radius:3px;transition:width .3s linear}
.score-box{text-align:center}
.score-box .val{font-family:'Teko',sans-serif;font-size:36px;font-weight:700;color:#a0ff50;line-height:1}
.score-box .lbl{font-size:10px;color:#3a4a44;letter-spacing:2px;text-transform:uppercase;font-weight:600}
.q-card{padding:28px;border-radius:18px;background:linear-gradient(145deg,#10181a,#141e20);border:1px solid #1e2e28;margin-bottom:18px;box-shadow:0 12px 48px rgba(0,0,0,.3)}
.q-domain{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:10px;padding:4px 12px;border-radius:6px;display:inline-block}
.q-text{font-size:18px;font-weight:600;line-height:1.5;color:#e0ece8}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.opt{padding:16px 14px;border-radius:14px;border:2px solid #1e2e28;background:#0c1412;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;text-align:center;line-height:1.4}
.opt:hover{border-color:#a0ff50;background:#141e1a}
.opt.correct{background:#a0ff5015;border-color:#a0ff50;color:#a0ff50}
.opt.wrong{background:#ff444415;border-color:#ff4444;color:#ff4444}
.opt.dim{opacity:.25}
.streak{text-align:center;font-family:'Teko',sans-serif;font-size:18px;color:#a0ff50;letter-spacing:3px;margin-bottom:8px}
.result{text-align:center;padding:40px 0}
.result .big{font-family:'Teko',sans-serif;font-size:80px;font-weight:700;line-height:1;background:linear-gradient(135deg,#a0ff50,#50d060);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.result .det{font-size:16px;color:#4a5a54;margin-top:12px}
.result .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:28px}
.result .stat{padding:18px;border-radius:14px;background:#10181a;border:1px solid #1e2e28}
.result .stat .sv{font-family:'Teko',sans-serif;font-size:28px;font-weight:700;margin-bottom:2px}
.result .stat .sl{font-size:10px;color:#3a4a44;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.result .grade{margin-top:24px;font-family:'Teko',sans-serif;font-size:28px;font-weight:700;letter-spacing:3px}
.play-btn{margin-top:32px;padding:18px 56px;border-radius:50px;border:none;background:linear-gradient(135deg,#a0ff50,#60c040);color:#0a0e10;font-family:'Teko',sans-serif;font-size:20px;font-weight:700;letter-spacing:3px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const domainColors={
  "Safety":"#ff6b6b","Patient Prep":"#5dade2","Collections":"#a0ff50","Special":"#c084fc","Processing":"#fbbf24","POCT":"#2dd4bf"
};
const allQ=[
{q:"How many scored questions on the NHA CPT exam?",opts:["80","100","120","150"],ans:1,d:"Safety"},
{q:"What is the FIRST step after a needlestick?",opts:["Report to supervisor","Wash immediately","Document it","Call 911"],ans:1,d:"Safety"},
{q:"Standard Precautions apply to:",opts:["High-risk only","Known infections","ALL patients","Surgical only"],ans:2,d:"Safety"},
{q:"OSHA BBP stands for:",opts:["Basic Body Protocol","Bloodborne Pathogens","Blood Bank Procedures","Biohazard Box Plan"],ans:1,d:"Safety"},
{q:"HIPAA protects patient:",opts:["Schedules","Health information","Insurance rates","Parking spots"],ans:1,d:"Safety"},
{q:"Hand hygiene is done:",opts:["Once per shift","Before contact only","Before AND after contact","Only if visibly dirty"],ans:2,d:"Safety"},
{q:"How many patient identifiers are required?",opts:["One","Two","Three","Four"],ans:1,d:"Patient Prep"},
{q:"The two identifiers are name and:",opts:["Room number","Insurance ID","Date of birth","Phone number"],ans:2,d:"Patient Prep"},
{q:"If a patient refuses a draw, you should:",opts:["Proceed anyway","Call security","Stop immediately","Try again later"],ans:2,d:"Patient Prep"},
{q:"Implied consent is shown by:",opts:["Verbal agreement","Signed form","Extending the arm","Doctor's order"],ans:2,d:"Patient Prep"},
{q:"Fasting specimens require abstaining for:",opts:["2–4 hours","8–12 hours","24 hours","No fasting needed"],ans:1,d:"Patient Prep"},
{q:"What tube is FIRST in order of draw?",opts:["Light blue","Red","Blood cultures","Lavender"],ans:2,d:"Collections"},
{q:"What color tube is LAST in order of draw?",opts:["Lavender","Green","Gold","Gray"],ans:3,d:"Collections"},
{q:"Venipuncture needle angle:",opts:["5–10°","15–30°","45–60°","90°"],ans:1,d:"Collections"},
{q:"Tourniquet should be on less than:",opts:["30 seconds","1 minute","3 minutes","5 minutes"],ans:1,d:"Collections"},
{q:"Bevel should face:",opts:["Down","Left","Up","Sideways"],ans:2,d:"Collections"},
{q:"Capillary: wipe away the ____ drop.",opts:["Second","Third","First","Last"],ans:2,d:"Collections"},
{q:"Hematoma is caused by:",opts:["Slow draw","Needle through vein","Patient movement","Wrong tube"],ans:1,d:"Collections"},
{q:"Syncope during a draw means:",opts:["Vein collapse","Fainting","Allergic reaction","Infection"],ans:1,d:"Collections"},
{q:"Light blue tube additive is:",opts:["EDTA","Heparin","Citrate","Fluoride"],ans:2,d:"Collections"},
{q:"Lavender tube additive is:",opts:["Citrate","Heparin","EDTA","None"],ans:2,d:"Collections"},
{q:"Blood culture prep uses:",opts:["Alcohol only","Chlorhexidine","Betadine only","Soap and water"],ans:1,d:"Special"},
{q:"Chain of custody is for:",opts:["All draws","Drug/alcohol tests","Pediatric only","STAT orders"],ans:1,d:"Special"},
{q:"GTT stands for:",opts:["General Tube Test","Glucose Tolerance Test","Gray Top Tube","Guided Testing Tool"],ans:1,d:"Special"},
{q:"STAT means:",opts:["Standard","Scheduled","Immediate/urgent","Special tube"],ans:2,d:"Special"},
{q:"During centrifugation, tubes must be:",opts:["Open","Stacked","Balanced","Inverted"],ans:2,d:"Processing"},
{q:"Specimen rejection reason:",opts:["Patient anxiety","Mislabeling","Small veins","Fasting status"],ans:1,d:"Processing"},
{q:"Most lab errors occur in which phase?",opts:["Analytical","Post-analytical","Pre-analytical","Reporting"],ans:2,d:"Processing"},
{q:"Aliquoting means:",opts:["Discarding excess","Transferring a portion","Labeling tubes","Centrifuging twice"],ans:1,d:"Processing"},
{q:"Lab workflow starts with:",opts:["Collection","Physician order","Transport","Testing"],ans:1,d:"Processing"},
{q:"CLIA-waived tests require QC:",opts:["Weekly","Monthly","Before patient testing","Annually"],ans:2,d:"POCT"},
{q:"Critical values must be reported:",opts:["End of shift","Within 24 hours","Immediately","Weekly"],ans:2,d:"POCT"},
{q:"POCT stands for:",opts:["Post-Op Care Test","Point-of-Care Testing","Pre-Order Clinical Test","Patient Outcome Check"],ans:1,d:"POCT"},
{q:"Mislabeled specimen — correct action:",opts:["Relabel it","Cross out and fix","Discard and recollect","Send with a note"],ans:2,d:"Processing"},
{q:"Safety device on needle activated:",opts:["Before removal","After bandaging","Immediately after use","At end of shift"],ans:2,d:"Safety"}
];
let phase='start',questions=[],qIdx=0,score=0,streak=0,bestStreak=0,timer=60,interval=null,selected=null,locked=false,answered=0;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function startGame(){questions=shuffle(allQ);qIdx=0;score=0;streak=0;bestStreak=0;timer=60;selected=null;locked=false;answered=0;phase='play';render();interval=setInterval(()=>{timer--;const el=document.getElementById('timerEl');if(el){el.textContent=timer;if(timer<=10)el.classList.add('danger');}const bar=document.getElementById('timerBar');if(bar){const pct=timer/60*100;bar.style.width=pct+'%';bar.style.background=timer<=10?'linear-gradient(90deg,#ff4444,#ff6666)':timer<=20?'linear-gradient(90deg,#fbbf24,#fde68a)':'linear-gradient(90deg,#a0ff50,#50d060)';}if(timer<=0){clearInterval(interval);phase='result';render();}},1000);}
function pick(i){if(locked||phase!=='play')return;selected=i;locked=true;answered++;const q=questions[qIdx];if(i===q.ans){score++;streak++;if(streak>bestStreak)bestStreak=streak;}else{streak=0;}render();setTimeout(()=>{if(timer<=0){phase='result';render();return;}qIdx++;if(qIdx>=questions.length){questions=shuffle(allQ);qIdx=0;}selected=null;locked=false;render();},450);}
function render(){
  const app=document.getElementById('app');
  if(phase==='start'){
    let chips='';Object.entries(domainColors).forEach(([d,c])=>{chips+=`<span class="domain-chip" style="background:${c}18;color:${c};border:1px solid ${c}33">${d}</span>`;});
    app.innerHTML=`<div class="header"><div class="tag">CPT Exam Preparation</div><h1>SPEED ROUND</h1></div><div class="start-screen"><div class="icon">⚡</div><h2>60-SECOND CHALLENGE</h2><p>Race through rapid-fire questions covering all 5 CPT exam domains. How many can you answer correctly before time runs out?</p><div class="domain-list">${chips}</div><button class="start-btn" onclick="startGame()">START</button></div>`;return;
  }
  if(phase==='result'){const pct=answered?Math.round(score/answered*100):0;const col=pct>=80?'#a0ff50':pct>=60?'#fbbf24':'#ff4444';const grade=pct>=90?'EXAM READY':pct>=80?'STRONG':pct>=60?'IMPROVING':'KEEP STUDYING';
    app.innerHTML=`<div class="header"><div class="tag">CPT Exam Preparation</div><h1>SPEED ROUND</h1></div><div class="result"><div class="big">${score}</div><div class="det">correct answers in 60 seconds</div><div class="stats-grid"><div class="stat"><div class="sv" style="color:#a0ff50">${answered}</div><div class="sl">Attempted</div></div><div class="stat"><div class="sv" style="color:#fbbf24">${pct}%</div><div class="sl">Accuracy</div></div><div class="stat"><div class="sv" style="color:#c084fc">${bestStreak}</div><div class="sl">Best Streak</div></div></div><div class="grade" style="color:${col}">${grade}</div><button class="play-btn" onclick="startGame()">PLAY AGAIN</button></div>`;return;
  }
  const q=questions[qIdx];const dc=domainColors[q.d]||'#a0ff50';const tCol=timer<=10?'#ff4444':timer<=20?'#fbbf24':'#a0ff50';
  let html=`<div class="hud"><div class="timer-wrap"><div class="timer ${timer<=10?'danger':''}" id="timerEl" style="color:${tCol}">${timer}</div><div class="timer-unit">SEC</div></div><div class="score-box"><div class="val">${score}</div><div class="lbl">Score</div></div></div><div class="timer-bar"><div class="timer-bar-fill" id="timerBar" style="width:${timer/60*100}%;background:linear-gradient(90deg,${tCol},${tCol}88)"></div></div>`;
  if(streak>=3)html+=`<div class="streak">🔥 ${streak} STREAK</div>`;
  html+=`<div class="q-card"><div class="q-domain" style="background:${dc}18;color:${dc}">${q.d}</div><div class="q-text">${q.q}</div></div><div class="opts">`;
  q.opts.forEach((o,i)=>{let cls='opt';if(locked){if(i===q.ans)cls+=' correct';else if(i===selected)cls+=' wrong';else cls+=' dim';}html+=`<div class="${cls}" onclick="pick(${i})">${o}</div>`;});
  html+=`</div>`;app.innerHTML=html;
}
render();
</script>
</body>
</html>
