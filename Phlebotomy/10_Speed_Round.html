<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 10 — Speed Round</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--green:#27ae60;--green-light:#2ecc71;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;--radius:16px;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 20px 60px;display:flex;flex-direction:column;align-items:center;}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:540px;width:100%;}
header{text-align:center;padding:48px 0 28px;}
header .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:3px;color:var(--red-light);font-weight:700;margin-bottom:10px;}
header h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{color:var(--dim);font-size:.88rem;margin-top:8px;}

.timer-display{text-align:center;margin:20px 0 10px;}
.timer-num{font-family:'Playfair Display',serif;font-size:5rem;font-weight:900;line-height:1;transition:color .3s;}
.timer-num.warning{color:var(--red-light);}
.timer-label{color:var(--dim);font-size:.8rem;letter-spacing:1px;margin-top:4px;}
.progress{width:100%;height:6px;background:var(--border);border-radius:3px;margin-bottom:24px;overflow:hidden;}
.progress-fill{height:100%;background:var(--green);transition:width 1s linear;border-radius:3px;}
.progress-fill.warning{background:var(--red);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:32px;text-align:center;min-height:160px;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.q-text{font-size:1.2rem;font-weight:700;line-height:1.4;}
.a-text{color:var(--green-light);font-size:1.05rem;margin-top:14px;display:none;padding:12px;background:rgba(39,174,96,.06);border-radius:8px;}
.a-text.show{display:block;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.btns{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.btn{padding:14px 28px;border-radius:10px;cursor:pointer;font-size:.9rem;font-weight:700;font-family:inherit;transition:all .2s;border:none;}
.btn-blue{background:var(--blue,#3498db);color:#fff;}.btn-blue:hover{opacity:.9;}
.btn-green{background:var(--green);color:#fff;display:none;}.btn-green:hover{background:var(--green-light);}
.btn-red{background:var(--surface);border:1px solid var(--border);color:var(--text);display:none;}.btn-red:hover{border-color:var(--red);}
.btn-start{background:var(--red);color:#fff;font-size:1rem;padding:16px 40px;}.btn-start:hover{background:var(--red-light);}

.scoreboard{display:flex;justify-content:center;gap:40px;margin-top:24px;}
.score-col{text-align:center;}
.score-val{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:900;line-height:1;}
.score-val.green{color:var(--green-light);}
.score-val.red{color:var(--red-light);}
.score-lbl{color:var(--dim);font-size:.75rem;margin-top:4px;letter-spacing:.5px;}

.final{text-align:center;animation:fadeIn .5s ease;}
.final-title{font-family:'Playfair Display',serif;font-size:1.8rem;margin-bottom:8px;color:#fff;}
.final-sub{color:var(--dim);font-size:.9rem;}
.start-area{text-align:center;margin-top:20px;}

#game{display:none;}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
<header>
  <div class="tag">Activity 10 of 10</div>
  <h1>Speed Round</h1>
  <p>Answer as many questions as you can in 60 seconds!</p>
</header>

<div class="start-area" id="startArea">
  <div style="color:var(--dim);font-size:.88rem;margin-bottom:20px;line-height:1.6;">
    Questions will appear one at a time.<br>Click "Show Answer", then mark yourself correct or missed.<br>How many can you get in a minute?
  </div>
  <button class="btn btn-start" onclick="startGame()">Start Timer ⚡</button>
</div>

<div id="game">
  <div class="timer-display">
    <div class="timer-num" id="timerNum">60</div>
    <div class="timer-label">seconds remaining</div>
  </div>
  <div class="progress"><div class="progress-fill" id="prog"></div></div>
  <div class="card" id="card">
    <div class="q-text" id="qText"></div>
    <div class="a-text" id="aText"></div>
  </div>
  <div class="btns">
    <button class="btn btn-blue" id="showBtn" onclick="showAnswer()">Show Answer</button>
    <button class="btn btn-green" id="gotBtn" onclick="mark(true)">✓ Got It</button>
    <button class="btn btn-red" id="missBtn" onclick="mark(false)">✗ Missed</button>
  </div>
  <div class="scoreboard">
    <div class="score-col"><div class="score-val green" id="rightNum">0</div><div class="score-lbl">Correct</div></div>
    <div class="score-col"><div class="score-val red" id="missNum">0</div><div class="score-lbl">Missed</div></div>
  </div>
</div>
</div>

<script>
const questions=[
  {q:"Maximum tourniquet time?",a:"1 minute"},
  {q:"Needle insertion angle?",a:"15–30 degrees"},
  {q:"First tube in venipuncture order?",a:"Blood cultures / Yellow"},
  {q:"Last tube in venipuncture order?",a:"Gray (Glucose)"},
  {q:"Lavender tube additive?",a:"EDTA"},
  {q:"Gray tube is used for?",a:"Glucose testing"},
  {q:"Site prep antiseptic?",a:"70% isopropyl alcohol"},
  {q:"Preferred venipuncture vein?",a:"Median cubital vein"},
  {q:"Invert additive tubes how many times?",a:"5–10 times"},
  {q:"What is syncope?",a:"Fainting"},
  {q:"First step for hematoma?",a:"Stop collection, apply pressure"},
  {q:"Capillary first drop — keep or wipe?",a:"Wipe it away"},
  {q:"Label specimens when?",a:"In patient's presence"},
  {q:"Tourniquet placement distance?",a:"3–4 inches above site"},
  {q:"Light blue tube is for?",a:"Coagulation studies"},
  {q:"Red top tube contains?",a:"No additive (serum)"},
  {q:"SST stands for?",a:"Serum Separator Tube"},
  {q:"What does PPE stand for?",a:"Personal Protective Equipment"},
  {q:"Capillary order — first tube?",a:"Blood gas specimens (CBGs)"},
  {q:"Shooting pain during draw means?",a:"Possible nerve contact — stop immediately"},
];

let shuffled,qi,right,missed,timer,interval,started;

function shuffle(a){return[...a].sort(()=>Math.random()-.5);}

function startGame(){
  document.getElementById('startArea').style.display='none';
  document.getElementById('game').style.display='block';
  shuffled=shuffle(questions);qi=0;right=0;missed=0;timer=60;started=true;
  document.getElementById('rightNum').textContent='0';
  document.getElementById('missNum').textContent='0';
  document.getElementById('timerNum').className='timer-num';
  document.getElementById('prog').className='progress-fill';
  showQ();
  interval=setInterval(()=>{
    timer--;
    document.getElementById('timerNum').textContent=timer;
    document.getElementById('prog').style.width=`${(timer/60)*100}%`;
    if(timer<=10){document.getElementById('timerNum').classList.add('warning');document.getElementById('prog').classList.add('warning');}
    if(timer<=0){clearInterval(interval);endGame();}
  },1000);
}

function showQ(){
  if(qi>=shuffled.length){shuffled=shuffle(questions);qi=0;}
  document.getElementById('qText').textContent=shuffled[qi].q;
  document.getElementById('aText').textContent=shuffled[qi].a;
  document.getElementById('aText').classList.remove('show');
  document.getElementById('showBtn').style.display='';
  document.getElementById('gotBtn').style.display='none';
  document.getElementById('missBtn').style.display='none';
}

function showAnswer(){
  if(!started)return;
  document.getElementById('aText').classList.add('show');
  document.getElementById('showBtn').style.display='none';
  document.getElementById('gotBtn').style.display='';
  document.getElementById('missBtn').style.display='';
}

function mark(correct){
  if(!started||timer<=0)return;
  if(correct)right++;else missed++;
  document.getElementById('rightNum').textContent=right;
  document.getElementById('missNum').textContent=missed;
  qi++;showQ();
}

function endGame(){
  started=false;
  document.getElementById('card').innerHTML=`<div class="final"><div class="final-title">Time's Up!</div><div class="final-sub">${right} correct · ${missed} missed · ${right+missed} total</div></div>`;
  document.getElementById('showBtn').style.display='none';
  document.getElementById('gotBtn').style.display='none';
  document.getElementById('missBtn').style.display='none';
  // Add restart
  const restart=document.createElement('button');
  restart.className='btn btn-start';
  restart.textContent='Play Again ⚡';
  restart.style.marginTop='20px';
  restart.onclick=()=>{
    document.getElementById('card').innerHTML='<div class="q-text" id="qText"></div><div class="a-text" id="aText"></div>';
    startGame();
  };
  document.querySelector('.btns').appendChild(restart);
}
</script>
</body>
</html>
