<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 4 — True or False</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--green:#27ae60;--green-light:#2ecc71;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;--radius:16px;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 20px 60px;}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:640px;margin:0 auto;}
header{text-align:center;padding:48px 0 28px;}
header .week{font-size:.6rem;text-transform:uppercase;letter-spacing:3px;color:var(--muted);font-weight:700;margin-bottom:4px;}
header .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:3px;color:var(--red-light);font-weight:700;margin-bottom:10px;}
header h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{color:var(--dim);font-size:.88rem;margin-top:8px;}
.progress{width:100%;height:4px;background:var(--border);border-radius:2px;margin-bottom:28px;overflow:hidden;}
.progress-fill{height:100%;background:var(--red);transition:width .5s;border-radius:2px;}
.stmt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:14px;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.stmt-num{font-size:.7rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--red-light);font-weight:700;margin-bottom:8px;}
.stmt-text{font-size:1rem;line-height:1.6;margin-bottom:14px;font-weight:500;}
.tf-btns{display:flex;gap:10px;}
.tf-btn{flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);cursor:pointer;font-size:.9rem;font-weight:700;font-family:inherit;transition:all .2s;letter-spacing:.5px;}
.tf-btn:hover{border-color:var(--red);background:rgba(192,57,43,.06);}
.tf-btn.correct-ans{border-color:var(--green);background:rgba(39,174,96,.12);color:var(--green-light);}
.tf-btn.wrong-ans{border-color:var(--red);background:rgba(192,57,43,.12);color:var(--red-light);}
.tf-btn.off{pointer-events:none;opacity:.4;}
.explain{margin-top:10px;font-size:.82rem;color:var(--dim);padding:12px;background:rgba(255,255,255,.02);border-radius:8px;border-left:3px solid var(--green);line-height:1.5;animation:fadeIn .3s ease;}
.score-card{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;margin-top:20px;animation:fadeIn .5s ease;}
.score-num{font-family:'Playfair Display',serif;font-size:4rem;font-weight:900;color:var(--green-light);}
.score-label{color:var(--dim);font-size:.9rem;margin-top:4px;}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
<header>
  <div class="week">Week 5 — Special Blood Collections</div>
  <div class="tag">Activity 4 of 10</div>
  <h1>True or False</h1>
  <p>Read each statement and decide — 10 questions with explanations.</p>
</header>
<div class="progress"><div class="progress-fill" id="prog"></div></div>
<div id="list"></div>
<div id="score"></div>
</div>
<script>
const stmts=[
  {text:"A peripheral blood smear should be prepared using serum from a red-top tube.",answer:false,explain:"Blood smears use fresh EDTA whole blood (lavender top), not serum."},
  {text:"Blood cultures should be collected before the patient receives antibiotics.",answer:true,explain:"Antibiotics may suppress bacteria and lead to false-negative culture results."},
  {text:"The anaerobic blood culture bottle should be filled before the aerobic bottle.",answer:false,explain:"The aerobic bottle is always filled first, then the anaerobic bottle."},
  {text:"Chlorhexidine is the recommended antiseptic for blood culture site preparation.",answer:true,explain:"Chlorhexidine is applied with a 30-second scrub to prevent contamination with skin flora."},
  {text:"Newborn IEM screening uses a venipuncture from the antecubital fossa.",answer:false,explain:"IEM screening uses a heel stick; blood is collected on a Guthrie card."},
  {text:"The Guthrie card should be air-dried for at least 3 hours, laid flat with no stacking.",answer:true,explain:"Proper drying prevents contamination and ensures accurate test results."},
  {text:"During blood donation, approximately 100 mL of blood is collected.",answer:false,explain:"A standard whole blood donation collects approximately 450–500 mL."},
  {text:"Microtainers are used for pediatric and geriatric patients to reduce blood volume drawn.",answer:true,explain:"Microtainers hold 0.5–1 mL and help prevent iatrogenic anemia in vulnerable populations."},
  {text:"Chain of custody documentation is only needed for blood culture specimens.",answer:false,explain:"Chain of custody is required for drug screens and legal testing to ensure specimen integrity."},
  {text:"After cleaning a draw site, you should never touch it again before needle insertion.",answer:true,explain:"Touching the cleaned site reintroduces pathogens and compromises aseptic technique."},
];
let score=0,answered=0;
document.getElementById('list').innerHTML=stmts.map((s,i)=>`
  <div class="stmt" id="s-${i}"><div class="stmt-num">Statement ${i+1}</div>
  <div class="stmt-text">${s.text}</div>
  <div class="tf-btns"><button class="tf-btn" onclick="pick(${i},true)">TRUE</button><button class="tf-btn" onclick="pick(${i},false)">FALSE</button></div></div>
`).join('');
function pick(i,val){
  const btns=document.querySelectorAll(`#s-${i} .tf-btn`);
  if(btns[0].classList.contains('off'))return;
  const correct=val===stmts[i].answer;
  if(correct)score++;answered++;
  btns.forEach(b=>b.classList.add('off'));
  const cIdx=stmts[i].answer?0:1;const uIdx=val?0:1;
  btns[cIdx].classList.remove('off');btns[cIdx].classList.add('correct-ans');
  if(!correct){btns[uIdx].classList.remove('off');btns[uIdx].classList.add('wrong-ans');}
  const exp=document.createElement('div');exp.className='explain';exp.textContent=stmts[i].explain;
  document.getElementById(`s-${i}`).appendChild(exp);
  document.getElementById('prog').style.width=`${(answered/stmts.length)*100}%`;
  if(answered===stmts.length){document.getElementById('score').innerHTML=`<div class="score-card"><div class="score-num">${score}/${stmts.length}</div><div class="score-label">Correct answers</div></div>`;}
}
</script>
</body>
</html>
