<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wk6 Activity 6 — Specimen Workflow Sequencing</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--green:#27ae60;--green-light:#2ecc71;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;--radius:16px;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 20px 60px;}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:560px;margin:0 auto;}
header{text-align:center;padding:48px 0 28px;}
header .week{font-size:.6rem;text-transform:uppercase;letter-spacing:3px;color:var(--muted);font-weight:700;margin-bottom:4px;}
header .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:3px;color:var(--red-light);font-weight:700;margin-bottom:10px;}
header h1{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{color:var(--dim);font-size:.88rem;margin-top:8px;}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap;}
.tab{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px 16px;cursor:pointer;font-size:.78rem;font-weight:600;transition:all .2s;font-family:inherit;color:var(--dim);}
.tab:hover{border-color:var(--red);}
.tab.active{border-color:var(--red);color:var(--red-light);background:rgba(192,57,43,.06);}
.step{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:8px;display:flex;align-items:center;gap:14px;transition:all .25s;}
.step .pos{font-family:'Playfair Display',serif;font-size:1.1rem;color:var(--muted);min-width:24px;text-align:center;}
.step .name{font-size:.88rem;font-weight:600;flex:1;line-height:1.4;}
.step .arrows{display:flex;gap:4px;}
.step .arrows button{background:var(--surface2);border:1px solid var(--border);color:var(--dim);width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:.85rem;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.step .arrows button:hover{border-color:var(--red);color:var(--text);}
.step.correct{border-color:var(--green);background:rgba(39,174,96,.06);}
.step.correct .pos{color:var(--green-light);}
.step.wrong{border-color:var(--red);background:rgba(192,57,43,.06);}
.step.wrong .pos{color:var(--red-light);}
.btns{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.btn{padding:12px 28px;border-radius:10px;cursor:pointer;font-size:.88rem;font-weight:600;font-family:inherit;transition:all .2s;border:none;}
.btn-primary{background:var(--red);color:#fff;}.btn-primary:hover{background:var(--red-light);}
.btn-secondary{background:var(--surface);border:1px solid var(--border);color:var(--text);}.btn-secondary:hover{border-color:var(--red);}
.feedback{text-align:center;margin-top:20px;font-size:1rem;font-weight:600;min-height:28px;}
.feedback.win{color:var(--green-light);font-family:'Playfair Display',serif;font-size:1.3rem;}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
<header>
  <div class="week">Week 6 — Processing Specimens</div>
  <div class="tag">Activity 6 of 10</div>
  <h1>Specimen Workflow Sequencing</h1>
  <p>Arrange each workflow's steps in the correct order.</p>
</header>
<div class="tabs" id="tabs"></div>
<div id="list"></div>
<div class="btns">
  <button class="btn btn-primary" onclick="check()">Check Order</button>
  <button class="btn btn-secondary" onclick="shuffleCurrent()">Shuffle</button>
</div>
<div class="feedback" id="feedback"></div>
</div>
<script>
const procedures=[
  {name:"Post-Collection Processing",steps:[
    "Label specimen at bedside with name, DOB, MRN, date/time, initials",
    "Verify proper tube fill level",
    "Place specimen in biohazard bag with requisition in separate pouch",
    "Check for special handling needs (chill, warm, protect from light)",
    "Flag STAT specimens and communicate to lab",
    "Transport via pneumatic tube, hand-delivery, or courier",
    "Scan barcode into LIS upon lab receipt",
  ]},
  {name:"Critical Value Reporting",steps:[
    "Obtain POCT or lab result flagged as critical",
    "Verify the result and patient identity",
    "Contact a licensed provider immediately",
    "Deliver the critical value verbally",
    "Receive read-back verification from the provider",
    "Document: time, result, person notified, your name/credentials",
  ]},
  {name:"Chain of Custody Collection",steps:[
    "Verify patient identity with photo ID and signature",
    "Witness specimen collection (observed or monitored)",
    "Label and seal specimen in tamper-evident bag",
    "Complete COC documentation form",
    "Document every person who handles the specimen",
    "Maintain secure hand-off tracking until final analysis",
  ]},
];
let currentProc=0,items=[];
function shuffleArr(a){return[...a].sort(()=>Math.random()-.5);}
function renderTabs(){
  document.getElementById('tabs').innerHTML=procedures.map((p,i)=>`<div class="tab${i===currentProc?' active':''}" onclick="switchProc(${i})">${p.name}</div>`).join('');
}
function render(){
  document.getElementById('list').innerHTML=items.map((s,i)=>`
    <div class="step" id="st-${i}"><span class="pos">${i+1}</span>
    <span class="name">${s}</span>
    <span class="arrows"><button onclick="move(${i},-1)">▲</button><button onclick="move(${i},1)">▼</button></span></div>
  `).join('');
}
function move(i,d){const ni=i+d;if(ni<0||ni>=items.length)return;[items[i],items[ni]]=[items[ni],items[i]];render();clearFeedback();}
function switchProc(idx){currentProc=idx;items=shuffleArr(procedures[idx].steps);renderTabs();render();clearFeedback();}
function shuffleCurrent(){items=shuffleArr(procedures[currentProc].steps);render();clearFeedback();}
function clearFeedback(){document.getElementById('feedback').textContent='';document.getElementById('feedback').className='feedback';document.querySelectorAll('.step').forEach(s=>s.classList.remove('correct','wrong'));}
function check(){
  let allRight=true;
  const correct=procedures[currentProc].steps;
  items.forEach((s,i)=>{
    const el=document.getElementById(`st-${i}`);
    if(s===correct[i]){el.classList.add('correct');el.classList.remove('wrong');}
    else{el.classList.add('wrong');el.classList.remove('correct');allRight=false;}
  });
  const fb=document.getElementById('feedback');
  if(allRight){fb.textContent='Perfect sequence! Well done!';fb.className='feedback win';}
  else{fb.textContent='Some steps are out of order. Green = correct position.';fb.style.color='var(--red-light)';}
}
switchProc(0);
</script>
</body>
</html>
