<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wk6 Activity 10 — Speed Round</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--green:#27ae60;--green-light:#2ecc71;--yellow:#f39c12;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;--radius:16px;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 20px 60px;display:flex;flex-direction:column;align-items:center;}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:580px;width:100%;}
header{text-align:center;padding:48px 0 20px;}
header .week{font-size:.6rem;text-transform:uppercase;letter-spacing:3px;color:var(--muted);font-weight:700;margin-bottom:4px;}
header .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:3px;color:var(--red-light);font-weight:700;margin-bottom:10px;}
header h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{color:var(--dim);font-size:.88rem;margin-top:8px;}
.timer-ring{margin:20px auto;width:120px;height:120px;position:relative;}
.timer-ring svg{transform:rotate(-90deg);}
.timer-ring circle{fill:none;stroke-width:6;}
.timer-bg{stroke:var(--border);}
.timer-fg{stroke:var(--green);stroke-linecap:round;transition:stroke-dashoffset .95s linear;}
.timer-fg.warn{stroke:var(--yellow);}
.timer-fg.danger{stroke:var(--red-light);}
.timer-text{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:900;}
.stats{display:flex;justify-content:center;gap:28px;margin-bottom:20px;}
.stat{text-align:center;}
.stat-num{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:900;}
.stat-num.green{color:var(--green-light);}
.stat-num.red{color:var(--red-light);}
.stat-label{font-size:.65rem;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);font-weight:700;margin-top:2px;}
.q-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:14px;animation:fadeIn .3s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.q-text{font-size:1.05rem;font-weight:600;line-height:1.5;margin-bottom:16px;text-align:center;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.opt{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;font-size:.85rem;text-align:center;transition:all .15s;line-height:1.3;font-weight:500;}
.opt:hover{border-color:var(--red);background:rgba(192,57,43,.06);}
.opt.correct{border-color:var(--green);background:rgba(39,174,96,.15);color:var(--green-light);}
.opt.wrong{border-color:var(--red);background:rgba(192,57,43,.15);color:var(--red-light);}
.start-screen{text-align:center;padding:40px 20px;}
.start-btn{background:var(--red);border:none;color:#fff;padding:16px 48px;border-radius:12px;cursor:pointer;font-size:1.1rem;font-weight:700;font-family:inherit;transition:all .2s;letter-spacing:.5px;}
.start-btn:hover{background:var(--red-light);transform:translateY(-2px);box-shadow:0 8px 24px rgba(192,57,43,.4);}
.end-screen{text-align:center;padding:30px;}
.end-score{font-family:'Playfair Display',serif;font-size:4.5rem;font-weight:900;background:linear-gradient(135deg,var(--green-light),#27ae60);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;}
.end-label{color:var(--dim);font-size:.9rem;margin-top:8px;}
.end-detail{color:var(--muted);font-size:.82rem;margin-top:16px;line-height:1.7;}
.hidden{display:none;}
@media(max-width:500px){header h1{font-size:1.7rem;}.opts{grid-template-columns:1fr;}.q-text{font-size:.95rem;}}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
<header>
  <div class="week">Week 6 — Processing Specimens</div>
  <div class="tag">Activity 10 of 10</div>
  <h1>Speed Round</h1>
  <p>60 seconds. 20 rapid-fire questions. How many can you get?</p>
</header>

<div id="startScreen" class="start-screen">
  <p style="color:var(--dim);margin-bottom:24px;">Answer as many questions as you can before time runs out!</p>
  <button class="start-btn" onclick="startGame()">Start Challenge</button>
</div>

<div id="gameArea" class="hidden">
  <div class="timer-ring">
    <svg width="120" height="120"><circle class="timer-bg" cx="60" cy="60" r="52"/><circle class="timer-fg" id="timerCircle" cx="60" cy="60" r="52" stroke-dasharray="326.73" stroke-dashoffset="0"/></svg>
    <div class="timer-text" id="timerText">60</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="stat-num green" id="scoreNum">0</div><div class="stat-label">Correct</div></div>
    <div class="stat"><div class="stat-num red" id="wrongNum">0</div><div class="stat-label">Wrong</div></div>
    <div class="stat"><div class="stat-num" id="qNum" style="color:var(--text)">1/20</div><div class="stat-label">Question</div></div>
  </div>
  <div class="q-card"><div class="q-text" id="qText"></div><div class="opts" id="opts"></div></div>
</div>

<div id="endScreen" class="hidden end-screen"></div>
</div>
<script>
const allQs=[
  {q:"Specimens must be labeled at ___.",opts:["The lab","Bedside","Nurse's station","Your car"],c:1},
  {q:"STAT stands for:",opts:["Standard","Immediate/urgent","Scheduled","Statistical"],c:1},
  {q:"Underfilled anticoagulant tubes may:",opts:["Explode","Clot","Turn green","Evaporate"],c:1},
  {q:"Lactic acid requires what transport?",opts:["Room temp","Warm","Crushed ice","Frozen"],c:2},
  {q:"Cold agglutinin must be kept at:",opts:["4 °C","37 °C","Room temp","-20 °C"],c:1},
  {q:"Bilirubin is sensitive to:",opts:["Sound","Light","Heat","Gravity"],c:1},
  {q:"ABGs must be tested within:",opts:["1 hour","15–30 min","24 hours","4 hours"],c:1},
  {q:"COC stands for:",opts:["Certificate of Care","Chain of Custody","Center of Collection","Code of Conduct"],c:1},
  {q:"COC requires what patient ID?",opts:["Verbal name only","Photo ID + signature","Insurance card","Wristband only"],c:1},
  {q:"COC uses what type of bag?",opts:["Ziplock","Tamper-evident","Paper","Any bag"],c:1},
  {q:"POCT stands for:",opts:["Post-Op Care Test","Point-of-Care Testing","Pre-Order Confirmation","Patient Outcome Check"],c:1},
  {q:"Critical values are reported to:",opts:["The patient","A licensed provider","Front desk","Billing dept"],c:1},
  {q:"Read-back verification means:",opts:["Reading the chart","Receiver repeats value back","Writing it twice","Scanning the barcode"],c:1},
  {q:"Most common specimen rejection cause?",opts:["Wrong patient","Hemolysis","Missing cap","Expired tube"],c:1},
  {q:"LIS generates what for specimens?",opts:["Barcoded labels","Patient meals","Drug doses","Nursing schedules"],c:0},
  {q:"Urgent results may be sent by:",opts:["Text message","Secure fax or phone","Social media","Regular mail"],c:1},
  {q:"Glucose gray-top tubes stabilize for:",opts:["15 min","1–2 hours","24 hours","1 week"],c:1},
  {q:"Pneumatic tubes transport specimens via:",opts:["Water","Air pressure","Gravity","Conveyor belt"],c:1},
  {q:"HIPAA protects patient ___.",opts:["Parking","Privacy","Pets","Property"],c:1},
  {q:"Rejected specimens are logged in the:",opts:["Break room","LIS","Trash can","Waiting room"],c:1},
];
let timer,timeLeft,score,wrong,qIdx,questions,locked;
const circ=326.73;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function startGame(){
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('endScreen').classList.add('hidden');
  document.getElementById('gameArea').classList.remove('hidden');
  questions=shuffle(allQs).slice(0,20);
  timeLeft=60;score=0;wrong=0;qIdx=0;locked=false;
  updateTimer();showQ();
  timer=setInterval(()=>{timeLeft--;updateTimer();if(timeLeft<=0){clearInterval(timer);endGame();}},1000);
}
function updateTimer(){
  document.getElementById('timerText').textContent=timeLeft;
  const offset=circ*(1-timeLeft/60);
  const circle=document.getElementById('timerCircle');
  circle.style.strokeDashoffset=offset;
  circle.classList.remove('warn','danger');
  if(timeLeft<=10)circle.classList.add('danger');
  else if(timeLeft<=20)circle.classList.add('warn');
}
function showQ(){
  if(qIdx>=questions.length){clearInterval(timer);endGame();return;}
  locked=false;
  const q=questions[qIdx];
  document.getElementById('qText').textContent=q.q;
  document.getElementById('qNum').textContent=`${qIdx+1}/20`;
  document.getElementById('opts').innerHTML=q.opts.map((o,i)=>`<div class="opt" onclick="pick(${i})">${o}</div>`).join('');
}
function pick(i){
  if(locked)return;locked=true;
  const opts=document.querySelectorAll('#opts .opt');
  const correct=questions[qIdx].c;
  if(i===correct){score++;opts[i].classList.add('correct');}
  else{wrong++;opts[i].classList.add('wrong');opts[correct].classList.add('correct');}
  document.getElementById('scoreNum').textContent=score;
  document.getElementById('wrongNum').textContent=wrong;
  setTimeout(()=>{qIdx++;showQ();},450);
}
function endGame(){
  document.getElementById('gameArea').classList.add('hidden');
  const total=score+wrong;
  const pct=total>0?Math.round((score/total)*100):0;
  let msg='';
  if(pct>=90)msg='Outstanding! Specimen processing expert!';
  else if(pct>=70)msg='Great job! A few areas to review.';
  else if(pct>=50)msg='Decent effort — review the slides again.';
  else msg='Time to re-study Week 6 material!';
  document.getElementById('endScreen').innerHTML=`
    <div class="end-score">${score}</div>
    <div class="end-label">out of ${total} answered (${pct}%)</div>
    <div class="end-detail">${wrong} wrong · ${20-total} unanswered · ${msg}</div>
    <button class="start-btn" style="margin-top:28px;" onclick="startGame()">Play Again</button>
  `;
  document.getElementById('endScreen').classList.remove('hidden');
}
</script>
</body>
</html>
