<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Collection Language — Activity 1: Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080C14;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#707898;--success:#38C97A;--error:#E05555;--border:#1E2848;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:radial-gradient(ellipse at 20% 10%,#111828,var(--bg));font-family:'Zilla Slab',serif;color:var(--text);}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:32px;}
  .label{font-size:11px;letter-spacing:4px;color:var(--teal);text-transform:uppercase;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;margin-bottom:8px;}
  h1{font-size:34px;font-weight:700;color:var(--gold);}
  .sub{font-family:'Atkinson Hyperlegible',sans-serif;color:var(--dim);font-size:14px;margin-top:8px;}
  .dots{display:flex;justify-content:center;gap:4px;margin-bottom:20px;flex-wrap:wrap;}
  .dot{width:10px;height:10px;border-radius:50%;transition:all .3s;}
  .counter{text-align:center;font-family:'Atkinson Hyperlegible',sans-serif;font-size:13px;color:var(--dim);margin-bottom:16px;}
  .counter .g{color:var(--success);}
  .card{border-radius:16px;padding:48px 32px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .4s;border:1px solid var(--border);}
  .card:hover{box-shadow:0 10px 40px rgba(26,138,125,.15);}
  .card .side{font-size:10px;letter-spacing:3px;text-transform:uppercase;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;margin-bottom:14px;}
  .card .main-term{font-size:26px;font-weight:700;color:var(--gold);text-align:center;line-height:1.4;}
  .card .main-def{font-size:17px;color:var(--text);text-align:center;line-height:1.6;font-family:'Atkinson Hyperlegible',sans-serif;}
  .card .hint{font-size:11px;color:var(--dim);margin-top:18px;font-family:'Atkinson Hyperlegible',sans-serif;}
  .badge{position:absolute;top:12px;left:12px;font-size:10px;background:rgba(56,201,122,.15);color:var(--success);padding:2px 10px;border-radius:8px;font-family:'Atkinson Hyperlegible',sans-serif;font-weight:700;}
  .controls{display:flex;gap:10px;justify-content:center;margin-top:24px;align-items:center;}
  .btn{border:none;cursor:pointer;font-family:inherit;transition:all .2s;border-radius:12px;color:var(--text);font-size:14px;font-weight:600;}
  .btn:hover{transform:translateY(-1px);filter:brightness(1.15);}
  .btn-nav{width:48px;height:48px;background:var(--surface);font-size:20px;}
  .btn-know{padding:12px 28px;}
  .done-box{text-align:center;margin-top:32px;padding:20px;background:rgba(56,201,122,.07);border-radius:12px;border:1px solid rgba(56,201,122,.25);}
  .done-box h2{font-size:22px;color:var(--success);}
  .done-box p{font-family:'Atkinson Hyperlegible',sans-serif;color:var(--dim);font-size:13px;margin-top:4px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    
    <h1>Flashcards</h1>
    <p class="sub">Tap the card to flip. 20 key terms from Blood Collection Language.</p>
  </div>
  <div class="dots" id="dots"></div>
  <div class="counter"><span id="pos">1 of 20</span> · <span class="g" id="mastered">0 mastered</span></div>
  <div class="card" id="card" onclick="flip()"></div>
  <div class="controls">
    <button class="btn btn-nav" onclick="go(-1)">←</button>
    <button class="btn btn-know" id="knowBtn" onclick="toggleKnown()">✓ I Know This</button>
    <button class="btn btn-nav" onclick="go(1)">→</button>
  </div>
  <div class="done-box" id="doneBox" style="display:none"><h2>All cards mastered!</h2><p>You've reviewed every term. Great work!</p></div>
</div>
<script>
const C=[
  {t:"Venipuncture",d:"Puncturing a vein with a needle to collect blood. From 'veni' (vein) + 'puncture' (to pierce)."},
  {t:"Phlebotomy",d:"The practice of cutting into a vein to draw blood. From 'phleb/o' (vein) + '-tomy' (cutting/incision)."},
  {t:"Hemolysis",d:"The destruction or breakdown of red blood cells. From 'hemo-' (blood) + '-lysis' (breakdown)."},
  {t:"Hematoma",d:"A mass of blood pooling under the skin, often from vein trauma during a draw. From 'hemat/o' (blood) + '-oma' (mass/swelling)."},
  {t:"Phlebitis",d:"Inflammation of a vein. From 'phleb/o' (vein) + '-itis' (inflammation)."},
  {t:"Prefix",d:"A word part added to the BEGINNING of a root word to modify its meaning. Examples: hypo-, hyper-, anti-, tachy-."},
  {t:"Root Word",d:"The core part of a medical term that carries the fundamental meaning. Examples: ven (vein), hem/o (blood), erythr/o (red)."},
  {t:"Suffix",d:"A word part added to the END of a root word. Examples: -otomy (cutting), -emia (blood condition), -lysis (breakdown)."},
  {t:"Combining Vowel",d:"Usually the letter 'o' — used to connect a root word to a suffix or another root, making the term easier to pronounce."},
  {t:"Erythrocytes",d:"Red blood cells. From 'erythr/o' (red) + '-cytes' (cells). They carry oxygen throughout the body."},
  {t:"Leukocytes",d:"White blood cells. From 'leuk/o' (white) + '-cytes' (cells). They fight infection."},
  {t:"Thrombocytopenia",d:"A condition of low platelet (clot cell) count. From 'thromb/o' (clot) + '-cyte' (cell) + '-penia' (deficiency)."},
  {t:"Tourniquet",d:"A device used to restrict venous blood flow, making veins more visible and palpable for collection."},
  {t:"Anticoagulant",d:"A substance that prevents blood from clotting. Found in certain collection tubes (e.g., EDTA, heparin)."},
  {t:"Capillary Puncture",d:"Blood collection via a finger stick or heel stick using a lancet, collecting into microcollection tubes."},
  {t:"CBC",d:"Complete Blood Count — a common lab test measuring red cells, white cells, hemoglobin, hematocrit, and platelets."},
  {t:"BMP",d:"Basic Metabolic Panel — a blood test measuring glucose, calcium, electrolytes, and kidney function markers."},
  {t:"PT/INR",d:"Prothrombin Time / International Normalized Ratio — a clotting test used to monitor anticoagulant therapy."},
  {t:"Antecubital",d:"The area in front of (anterior to) the elbow — the most common venipuncture site."},
  {t:"Lancet",d:"A small, sharp device used to puncture the skin for capillary blood collection (finger sticks, heel sticks)."},
];
let idx=0,flipped=false,known=new Set();
function render(){
  const c=C[idx],el=document.getElementById('card');
  el.style.background=flipped?'linear-gradient(135deg,var(--card),#141a30)':'linear-gradient(135deg,rgba(26,138,125,.08),var(--card))';
  el.style.borderColor=flipped?'rgba(226,185,76,.2)':'rgba(26,138,125,.25)';
  el.innerHTML=`${known.has(idx)?'<div class="badge">Mastered</div>':''}<div class="side" style="color:${flipped?'rgba(226,185,76,.6)':'var(--teal)'}">${flipped?'Definition':'Term'}</div><div class="${flipped?'main-def':'main-term'}">${flipped?c.d:c.t}</div><div class="hint">tap to ${flipped?'see term':'reveal'}</div>`;
  let dots='';C.forEach((_,i)=>{const bg=known.has(i)?'var(--success)':i===idx?'var(--gold)':'rgba(26,138,125,.25)';dots+=`<div class="dot" style="background:${bg};transform:${i===idx?'scale(1.3)':'scale(1)'}"></div>`;});
  document.getElementById('dots').innerHTML=dots;
  document.getElementById('pos').textContent=`${idx+1} of ${C.length}`;
  document.getElementById('mastered').textContent=`${known.size} mastered`;
  const kb=document.getElementById('knowBtn');kb.textContent=known.has(idx)?'Unmark':'✓ I Know This';kb.style.background=known.has(idx)?'var(--surface)':'var(--success)';
  document.getElementById('doneBox').style.display=known.size===C.length?'block':'none';
}
function flip(){flipped=!flipped;render();}
function go(d){idx=(idx+d+C.length)%C.length;flipped=false;render();}
function toggleKnown(){known.has(idx)?known.delete(idx):known.add(idx);render();}
render();
</script>
</body>
</html>
