<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Collection Language — Activity 4: True or False</title>
<link href="https://fonts.googleapis.com/css2?family=Brygada+1918:wght@400;600;700&family=Geologica:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Brygada 1918',serif;color:var(--text);}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:32px;}
  .label{font-size:11px;letter-spacing:4px;color:var(--teal);text-transform:uppercase;font-family:'Geologica',sans-serif;font-weight:600;margin-bottom:8px;}
  h1{font-size:34px;color:var(--gold);}
  .sub{font-family:'Geologica',sans-serif;color:var(--dim);font-size:14px;margin-top:8px;}
  .steps{display:flex;gap:4px;justify-content:center;margin-bottom:24px;}
  .step{height:10px;border-radius:5px;transition:all .3s;}
  .sc{background:var(--card);border-radius:14px;padding:32px 24px;border:1px solid var(--border);margin-bottom:24px;position:relative;}
  .sc .num{position:absolute;top:14px;right:18px;font-size:12px;color:var(--dim);font-family:'Geologica',sans-serif;}
  .st{font-size:20px;line-height:1.6;}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  .tf{border:2px solid;cursor:pointer;font-family:'Geologica',sans-serif;font-weight:700;font-size:18px;border-radius:12px;padding:20px;color:var(--text);transition:all .2s;}
  .tf:hover{transform:scale(1.03);}
  .fb{padding:16px 20px;border-radius:12px;margin-bottom:16px;}
  .fb-t{font-family:'Geologica',sans-serif;font-size:14px;font-weight:600;margin-bottom:4px;}
  .fb-d{font-family:'Geologica',sans-serif;font-size:14px;color:var(--dim);line-height:1.5;}
  .nw{text-align:center;}
  .bn{padding:14px 40px;border-radius:10px;border:none;background:var(--gold);color:var(--bg);font-size:15px;font-weight:600;font-family:'Geologica',sans-serif;cursor:pointer;}
  .results{text-align:center;padding:40px 20px;}
  .rs{font-size:60px;font-weight:700;color:var(--gold);margin:16px 0 8px;}
  .rm{font-size:16px;font-family:'Geologica',sans-serif;margin-bottom:32px;}
  .br{padding:14px 40px;border-radius:10px;border:none;background:var(--teal);color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>True or False</h1><p class="sub">Read each statement. Is it true or false?</p></div>
  <div id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="btns" id="btns"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {s:"Medical terms are typically built from Latin or Greek roots.",a:true,e:"Correct — understanding Greek and Latin roots helps you decipher unfamiliar medical terms."},
  {s:"The combining vowel is usually the letter 'a'.",a:false,e:"The combining vowel is usually 'O,' used to connect a root to a suffix or another root word."},
  {s:"'Erythrocytes' means white blood cells.",a:false,e:"Erythrocytes are RED blood cells. 'Erythr/o' means red. White blood cells are leukocytes (leuk/o = white)."},
  {s:"The prefix 'hyper-' means below or low.",a:false,e:"'Hyper-' means ABOVE or HIGH. 'Hypo-' means below or low. Example: Hyperkalemia = high potassium."},
  {s:"Venipuncture means puncturing a vein to draw blood.",a:true,e:"Correct — from 'veni' (vein) + 'puncture' (to pierce)."},
  {s:"A higher gauge number on a needle means a larger needle diameter.",a:false,e:"It's the opposite — a HIGHER gauge number means a SMALLER needle. For example, a 23-gauge needle is smaller than a 21-gauge."},
  {s:"STAT means the specimen should be processed immediately.",a:true,e:"Correct — STAT indicates the highest priority for urgent or emergency testing."},
  {s:"Bilirubin samples must be protected from light.",a:true,e:"Correct — bilirubin degrades when exposed to light, which would give inaccurate results."},
  {s:"The suffix '-itis' means breakdown or destruction.",a:false,e:"'-itis' means INFLAMMATION (e.g., phlebitis = vein inflammation). '-lysis' means breakdown/destruction."},
  {s:"The antecubital area is the most common site for venipuncture.",a:true,e:"Correct — the antecubital fossa (area in front of the elbow) contains the median cubital, cephalic, and basilic veins."},
];
let idx=0,answer=null,score=0;
function render(){
  const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?24:10;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});
  document.getElementById('steps').innerHTML=sh;
  document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="st">"${q.s}"</div>`;
  if(answer===null){
    document.getElementById('btns').innerHTML=`<button class="tf" onclick="pick(true)" style="background:rgba(56,201,122,.1);border-color:rgba(56,201,122,.3)">✓ TRUE</button><button class="tf" onclick="pick(false)" style="background:rgba(224,85,85,.1);border-color:rgba(224,85,85,.3)">✗ FALSE</button>`;
    document.getElementById('btns').style.display='grid';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';
  }
}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;
  const tB=q.a===true?'var(--success)':answer===true?'var(--error)':'var(--surface)';
  const fB=q.a===false?'var(--success)':answer===false?'var(--error)':'var(--surface)';
  document.getElementById('btns').innerHTML=`<button class="tf" style="background:${tB};border-color:${tB};opacity:${answer!==true&&q.a!==true?'.4':'1'};cursor:default">✓ TRUE</button><button class="tf" style="background:${fB};border-color:${fB};opacity:${answer!==false&&q.a!==false?'.4':'1'};cursor:default">✗ FALSE</button>`;
  const fb=document.getElementById('fba');fb.style.display='block';
  fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;
  document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';
}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='block';
  const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';
  const msg=pct>=80?"Excellent!":pct>=60?"Good effort — review the tricky ones.":"Keep studying!";
  r.innerHTML=`<div class="label" style="margin-bottom:16px">Complete</div><div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='block';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
