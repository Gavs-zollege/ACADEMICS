<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Ops — Activity 3: Knowledge Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Slab:wght@400;600;700&family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0D18;--card:#111828;--surface:#1A2040;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1E2848;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:linear-gradient(160deg,var(--bg),#0E1424);font-family:'Josefin Slab',serif;color:var(--text);}
  .wrap{max-width:580px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:24px;}
  .label{font-size:11px;letter-spacing:4px;color:var(--teal);text-transform:uppercase;font-family:'Nunito',sans-serif;font-weight:700;margin-bottom:8px;}
  h1{font-size:34px;color:var(--gold);}
  .prog-row{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .prog-text{font-family:'Nunito',sans-serif;font-size:13px;color:var(--dim);white-space:nowrap;}
  .prog-bar{flex:1;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
  .prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .4s;}
  .score-text{color:var(--success);}
  .q-card{background:var(--card);border-radius:14px;padding:28px 24px;border:1px solid var(--border);}
  .q-text{font-size:20px;line-height:1.5;margin-bottom:24px;}
  .opt{padding:14px 18px;margin-bottom:8px;border-radius:10px;border:1px solid var(--border);font-family:'Nunito',sans-serif;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;}
  .opt:hover{transform:translateX(4px);}
  .opt .ltr{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--dim);flex-shrink:0;}
  .opt.correct{background:rgba(56,201,122,.1);border-color:var(--success);color:var(--success);}
  .opt.correct .ltr{border-color:var(--success);color:var(--success);}
  .opt.wrong{background:rgba(224,85,85,.1);border-color:var(--error);color:var(--error);}
  .opt.wrong .ltr{border-color:var(--error);color:var(--error);}
  .next-w{text-align:center;margin-top:20px;}
  .btn{padding:14px 40px;border-radius:10px;border:none;background:var(--gold);color:var(--bg);font-size:15px;font-weight:600;font-family:'Nunito',sans-serif;cursor:pointer;}
  .btn:hover{filter:brightness(1.1);}
  .results{text-align:center;padding:40px 20px;}
  .grade{font-size:72px;}
  .res-score{font-size:32px;color:var(--gold);}
  .res-msg{font-family:'Nunito',sans-serif;font-size:16px;color:var(--dim);margin:12px 0 32px;}
  .missed-t{font-size:14px;color:var(--error);font-family:'Nunito',sans-serif;font-weight:600;margin-bottom:8px;text-align:left;}
  .missed-i{padding:10px 14px;margin-bottom:6px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:13px;font-family:'Nunito',sans-serif;text-align:left;}
  .missed-i .mq{color:var(--text);margin-bottom:4px;}
  .missed-i .ma{color:var(--success);font-size:12px;}
  .btn-retry{padding:14px 36px;border-radius:10px;border:none;background:var(--teal);color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="label">Activity 3 of 10</div>
    <h1>Knowledge Quiz</h1>
  </div>
  <div id="quiz">
    <div class="prog-row">
      <span class="prog-text" id="pPos">1/15</span>
      <div class="prog-bar"><div class="prog-fill" id="pFill"></div></div>
      <span class="prog-text score-text" id="sText">0✓</span>
    </div>
    <div class="q-card"><div class="q-text" id="qText"></div><div id="opts"></div></div>
    <div class="next-w" id="nw" style="display:none"><button class="btn" id="nBtn" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"What is the first step in the laboratory testing workflow?",o:["Specimen collection","Test ordered by provider","Patient identification","Specimen transport"],a:1},
  {q:"Most laboratory errors occur during which phase?",o:["Analytical (during testing)","Post-analytical (reporting)","Pre-analytical (before testing)","Transport only"],a:2},
  {q:"STAT specimens should be:",o:["Batched with routine orders","Hand-delivered when required","Processed last","Stored until the end of shift"],a:1},
  {q:"Which is NOT a common reason for specimen rejection?",o:["Mislabeling","Hemolysis","Correct tube type","Expired collection time"],a:2},
  {q:"What does LIS stand for?",o:["Lab Instrument Software","Laboratory Information System","Lab Identification Standard","Legal Investigation System"],a:1},
  {q:"Critical values indicate:",o:["Normal results","Life-threatening conditions","Pending orders","Equipment malfunction"],a:1},
  {q:"Chain of custody documentation is required for:",o:["All routine blood work","Drug screens and forensic specimens","Only pediatric draws","STAT orders only"],a:1},
  {q:"When a specimen is rejected, the phlebotomist should:",o:["Discard it and move on","Re-collect after proper notification and documentation","Ignore the rejection","Send it to a different lab"],a:1},
  {q:"Accessioning involves:",o:["Drawing blood from a patient","Assigning a barcode and logging the specimen","Interpreting test results","Scheduling patient appointments"],a:1},
  {q:"What links the EMR and LIS systems?",o:["Physical transport","Accurate data entry","The phlebotomist's memory","Verbal communication only"],a:1},
  {q:"A timed specimen must be collected:",o:["Whenever convenient","At a specific designated time","Only in the morning","After the patient eats"],a:1},
  {q:"Phlebotomists should NEVER:",o:["Label specimens immediately","Communicate issues to the lab","Interpret lab results","Verify order priority"],a:2},
  {q:"Hemolysis is caused by:",o:["Proper technique","Destruction of red blood cells","Too much anticoagulant","Correct tube selection"],a:1},
  {q:"Workflow errors in phlebotomy can lead to:",o:["Faster results","Delayed diagnosis and legal liability","Better patient care","No consequences"],a:1},
  {q:"When reporting critical POCT values, the phlebotomist must:",o:["Wait until end of shift","Notify supervisor or provider immediately","Only document in the chart","Ignore if the patient seems fine"],a:1},
];
let cur=0,score=0,answered=false,answers=[];
function renderQ(){
  const q=QS[cur];document.getElementById('qText').textContent=q.q;
  document.getElementById('pPos').textContent=`${cur+1}/${QS.length}`;
  document.getElementById('pFill').style.width=`${(cur+1)/QS.length*100}%`;
  document.getElementById('sText').textContent=`${score}✓`;
  let h='';q.o.forEach((o,i)=>{h+=`<div class="opt" id="o${i}" onclick="pick(${i})"><div class="ltr">${String.fromCharCode(65+i)}</div><span>${o}</span></div>`;});
  document.getElementById('opts').innerHTML=h;document.getElementById('nw').style.display='none';answered=false;
}
function pick(i){
  if(answered)return;answered=true;const q=QS[cur];const c=i===q.a;if(c)score++;answers.push({idx:cur,picked:i,correct:c});
  q.o.forEach((_,j)=>{const el=document.getElementById('o'+j);el.style.cursor='default';if(j===q.a){el.classList.add('correct');el.querySelector('.ltr').textContent='✓';}else if(j===i&&!c){el.classList.add('wrong');el.querySelector('.ltr').textContent='✗';}});
  document.getElementById('sText').textContent=`${score}✓`;document.getElementById('nw').style.display='block';
  document.getElementById('nBtn').textContent=cur+1>=QS.length?'See Results':'Next →';
}
function next(){if(cur+1>=QS.length){showRes();return;}cur++;renderQ();}
function showRes(){
  document.getElementById('quiz').style.display='none';const r=document.getElementById('results');r.style.display='block';
  const pct=score/QS.length*100;const g=pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';
  const col=pct>=70?'var(--success)':'var(--error)';const msg=pct>=90?"Outstanding!":pct>=70?"Solid — review the missed items.":"Keep studying and retry!";
  const missed=answers.filter(a=>!a.correct);let mh='';
  if(missed.length){mh+='<div style="max-width:400px;margin:0 auto 24px;text-align:left"><div class="missed-t">Missed:</div>';
    missed.forEach(a=>{mh+=`<div class="missed-i"><div class="mq">${QS[a.idx].q}</div><div class="ma">Answer: ${QS[a.idx].o[QS[a.idx].a]}</div></div>`;});mh+='</div>';}
  r.innerHTML=`<div class="grade" style="color:${col}">${g}</div><div class="res-score">${score}/${QS.length}</div><div class="res-msg">${msg}</div>${mh}<button class="btn-retry" onclick="reset()">Retake</button>`;
}
function reset(){cur=0;score=0;answers=[];document.getElementById('quiz').style.display='block';document.getElementById('results').style.display='none';renderQ();}
renderQ();
</script>
</body>
</html>
