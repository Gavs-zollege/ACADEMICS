<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Ops — Activity 8: Error Categories</title>
<link href="https://fonts.googleapis.com/css2?family=Literata:wght@400;600;700&family=Red+Hat+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080C14;--card:#0F1526;--surface:#171E36;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6870A0;--success:#38C97A;--error:#E05555;--border:#1E2848;--warn:#E8976A;--info:#5B8CDB;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:radial-gradient(ellipse at 30% 10%,#111828,var(--bg));font-family:'Literata',serif;color:var(--text);}
  .wrap{max-width:620px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:28px;}
  .label{font-size:11px;letter-spacing:4px;color:var(--teal);text-transform:uppercase;font-family:'Red Hat Display',sans-serif;font-weight:700;margin-bottom:8px;}
  h1{font-size:32px;color:var(--gold);}
  .sub{font-family:'Red Hat Display',sans-serif;color:var(--dim);font-size:14px;margin-top:8px;line-height:1.5;}
  .stats{display:flex;justify-content:center;gap:20px;margin-bottom:24px;font-family:'Red Hat Display',sans-serif;font-size:13px;}
  .item-pool{margin-bottom:24px;}
  .pool-lbl{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-family:'Red Hat Display',sans-serif;font-weight:600;margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{padding:8px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-family:'Red Hat Display',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
  .chip:hover{transform:translateY(-2px);}
  .chip.selected{border-color:var(--gold);background:rgba(226,185,76,.08);color:var(--gold);}
  .chip.correct{border-color:var(--success);background:rgba(56,201,122,.06);color:var(--success);}
  .chip.wrong{border-color:var(--error);background:rgba(224,85,85,.06);color:var(--error);}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  .bucket{background:var(--card);border-radius:12px;padding:16px;border:2px solid var(--border);min-height:120px;transition:all .2s;cursor:pointer;}
  .bucket:hover{border-color:var(--teal);}
  .bucket.highlight{border-color:var(--gold);background:rgba(226,185,76,.04);}
  .bucket-title{font-family:'Red Hat Display',sans-serif;font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .bucket-dot{width:10px;height:10px;border-radius:50%;}
  .bucket-items{display:flex;flex-wrap:wrap;gap:4px;}
  .b-tag{font-family:'Red Hat Display',sans-serif;font-size:11px;padding:4px 10px;border-radius:6px;font-weight:500;}
  .feedback{text-align:center;margin:16px 0;font-family:'Red Hat Display',sans-serif;font-size:14px;padding:12px;border-radius:10px;}
  .ctrls{display:flex;gap:10px;justify-content:center;margin-top:16px;}
  .btn{padding:12px 32px;border-radius:10px;border:none;font-size:14px;font-weight:600;font-family:'Red Hat Display',sans-serif;cursor:pointer;}
  .btn-gold{background:var(--gold);color:var(--bg);}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="label">Activity 8 of 10</div>
    <h1>Error Categories</h1>
    <p class="sub">Tap an item from the pool, then tap the correct category bucket to sort it. Categorize each error or issue as a Pre-Analytical Error or a Specimen Rejection reason.</p>
  </div>
  <div class="stats"><span style="color:var(--success)" id="sc">Sorted: 0/12</span><span style="color:var(--dim)" id="att">Mistakes: 0</span></div>
  <div class="item-pool" id="poolArea"></div>
  <div class="buckets">
    <div class="bucket" id="bucket0" onclick="placeTo(0)">
      <div class="bucket-title"><div class="bucket-dot" style="background:var(--warn)"></div><span style="color:var(--warn)">Pre-Analytical Errors</span></div>
      <div class="bucket-items" id="bi0"></div>
    </div>
    <div class="bucket" id="bucket1" onclick="placeTo(1)">
      <div class="bucket-title"><div class="bucket-dot" style="background:var(--error)"></div><span style="color:var(--error)">Rejection Reasons</span></div>
      <div class="bucket-items" id="bi1"></div>
    </div>
  </div>
  <div id="fb"></div>
  <div class="ctrls"><button class="btn btn-outline" onclick="init()">Reset</button></div>
</div>
<script>
const ITEMS=[
  {t:"Incorrect patient ID",b:0},{t:"Wrong tube type",b:0},{t:"Insufficient volume",b:0},{t:"Improper storage",b:0},{t:"Hemolysis (during collection)",b:0},{t:"Improper transport temperature",b:0},
  {t:"Mislabeled specimen",b:1},{t:"Clotted sample",b:1},{t:"Hemolyzed specimen (received)",b:1},{t:"Expired collection time",b:1},{t:"Unlabeled tube",b:1},{t:"QNS (quantity not sufficient)",b:1},
];
const BNAMES=["Pre-Analytical Error","Rejection Reason"];
const BCOLS=["var(--warn)","var(--error)"];
let pool,placed,selected,mistakes;
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function init(){pool=shuffle([...ITEMS]);placed=[[],[]];selected=null;mistakes=0;render();}
function render(){
  document.getElementById('sc').textContent=`Sorted: ${placed[0].length+placed[1].length}/${ITEMS.length}`;
  document.getElementById('att').textContent=`Mistakes: ${mistakes}`;
  let ph='';
  if(pool.length){ph='<div class="pool-lbl">Items to Sort</div><div class="chips">';
    pool.forEach((item,i)=>{let cls='chip';if(selected===i)cls+=' selected';ph+=`<div class="${cls}" onclick="sel(${i})">${item.t}</div>`;});ph+='</div>';}
  else{ph='<div class="pool-lbl">All items sorted!</div>';}
  document.getElementById('poolArea').innerHTML=ph;
  [0,1].forEach(b=>{
    let bh='';placed[b].forEach(item=>{bh+=`<div class="b-tag" style="background:${BCOLS[b]}15;color:${BCOLS[b]}">${item.t}</div>`;});
    document.getElementById('bi'+b).innerHTML=bh||'<span style="font-family:Red Hat Display,sans-serif;font-size:12px;color:var(--dim)">Drop items here</span>';
  });
  document.getElementById('bucket0').classList.toggle('highlight',selected!==null);
  document.getElementById('bucket1').classList.toggle('highlight',selected!==null);
  if(pool.length===0){
    document.getElementById('fb').innerHTML=`<div class="feedback" style="background:rgba(56,201,122,.06);border:1px solid rgba(56,201,122,.2);color:var(--success)"><strong>All sorted!</strong> ${mistakes===0?'Perfect — no mistakes!':'Completed with '+mistakes+' mistake'+(mistakes>1?'s':'')+'.'}</div>`;
  }else{document.getElementById('fb').innerHTML='';}
}
function sel(i){selected=selected===i?null:i;render();}
function placeTo(b){
  if(selected===null)return;
  const item=pool[selected];
  if(item.b===b){placed[b].push(item);pool.splice(selected,1);selected=null;render();}
  else{mistakes++;
    const chip=document.querySelectorAll('.chip')[selected];if(chip){chip.classList.add('wrong');setTimeout(()=>{chip.classList.remove('wrong');},600);}
    selected=null;render();
  }
}
init();
</script>
</body>
</html>
