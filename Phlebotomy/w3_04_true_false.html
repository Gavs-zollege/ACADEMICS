<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Draw Procedures — True or False</title>
<link href="https://fonts.googleapis.com/css2?family=Vollkorn:wght@400;600;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#090D16;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1C2444;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#141A2E,var(--bg));font-family:'Vollkorn',serif;color:var(--text);}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:32px;}
  h1{font-size:34px;color:var(--gold);}
  .sub{font-family:'Work Sans',sans-serif;color:var(--dim);font-size:14px;margin-top:8px;}
  .steps{display:flex;gap:4px;justify-content:center;margin-bottom:24px;}
  .step{height:10px;border-radius:5px;transition:all .3s;}
  .sc{background:var(--card);border-radius:14px;padding:32px 24px;border:1px solid var(--border);margin-bottom:24px;position:relative;}
  .sc .num{position:absolute;top:14px;right:18px;font-size:12px;color:var(--dim);font-family:'Work Sans',sans-serif;}
  .st{font-size:20px;line-height:1.6;}
  .btns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:24px;}
  .tf{border:2px solid;cursor:pointer;font-family:'Work Sans',sans-serif;font-weight:700;font-size:18px;border-radius:12px;padding:20px;color:var(--text);transition:all .2s;}
  .tf:hover{transform:scale(1.03);}
  .fb{padding:16px 20px;border-radius:12px;margin-bottom:16px;}
  .fb-t{font-family:'Work Sans',sans-serif;font-size:14px;font-weight:600;margin-bottom:4px;}
  .fb-d{font-family:'Work Sans',sans-serif;font-size:14px;color:var(--dim);line-height:1.5;}
  .nw{text-align:center;}
  .bn{padding:14px 40px;border-radius:10px;border:none;background:var(--gold);color:var(--bg);font-size:15px;font-weight:600;font-family:'Work Sans',sans-serif;cursor:pointer;}
  .results{text-align:center;padding:40px 20px;}
  .rs{font-size:60px;font-weight:700;color:var(--gold);margin:16px 0 8px;}
  .rm{font-size:16px;font-family:'Work Sans',sans-serif;margin-bottom:32px;}
  .br{padding:14px 40px;border-radius:10px;border:none;background:var(--teal);color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>True or False</h1><p class="sub">Read each statement. Is it true or false?</p></div>
  <div id="game">
    <div class="steps" id="steps"></div>
    <div class="sc" id="scard"></div>
    <div class="btns" id="btns"></div>
    <div id="fba" style="display:none"></div>
    <div class="nw" id="nw" style="display:none"><button class="bn" id="nb" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {s:"A patient's room number is an acceptable identifier for blood draws.",a:false,e:"NEVER use room number as an identifier. Patients may be moved. Always use full name + date of birth."},
  {s:"The tourniquet should be placed 3–4 inches above the venipuncture site.",a:true,e:"Correct — placing it too close can cause the vein to collapse, and too far reduces effectiveness."},
  {s:"It's okay to leave the tourniquet on for up to 5 minutes if you're having trouble finding a vein.",a:false,e:"The tourniquet should NEVER remain on longer than 1 minute. Prolonged application causes hemoconcentration and inaccurate results."},
  {s:"Palpation is more reliable than visual inspection for locating veins.",a:true,e:"Correct — palpation lets you feel the vein's depth, direction, and resilience, which you can't determine by sight alone."},
  {s:"After cleaning the site with alcohol, you may blow on it to speed drying.",a:false,e:"NEVER blow on or fan the site. This recontaminates it. The site must air dry completely on its own."},
  {s:"Hand hygiene should be performed before AND after every patient contact.",a:true,e:"Correct — hand hygiene is the single most important infection prevention measure."},
  {s:"Gloves only need to be changed if they become visibly soiled.",a:false,e:"Gloves must be changed between EVERY patient, regardless of visible contamination."},
  {s:"The sharps container should be within arm's reach before starting a draw.",a:true,e:"Correct — the sharps container must be accessible for immediate needle disposal after the procedure."},
  {s:"If a patient says 'yes' when you ask 'Are you John Smith?', that's sufficient identification.",a:false,e:"Patients may answer yes to any name. They must STATE their own name and DOB — never just confirm."},
  {s:"Most laboratory errors occur in the pre-analytical phase.",a:true,e:"Correct — the majority of errors happen before testing begins: ID mistakes, wrong tubes, improper technique, and poor site preparation."},
];
let idx=0,answer=null,score=0;
function render(){
  const q=QS[idx];let sh='';QS.forEach((_,i)=>{const w=i===idx?24:10;const bg=i<idx?'var(--success)':i===idx?'var(--gold)':'var(--border)';sh+=`<div class="step" style="width:${w}px;background:${bg}"></div>`;});
  document.getElementById('steps').innerHTML=sh;
  document.getElementById('scard').innerHTML=`<div class="num">Q${idx+1}</div><div class="st">"${q.s}"</div>`;
  if(answer===null){
    document.getElementById('btns').innerHTML=`<button class="tf" onclick="pick(true)" style="background:rgba(56,201,122,.1);border-color:rgba(56,201,122,.3)">✓ TRUE</button><button class="tf" onclick="pick(false)" style="background:rgba(224,85,85,.1);border-color:rgba(224,85,85,.3)">✗ FALSE</button>`;
    document.getElementById('btns').style.display='grid';document.getElementById('fba').style.display='none';document.getElementById('nw').style.display='none';
  }
}
function pick(v){if(answer!==null)return;answer=v;const q=QS[idx];const c=v===q.a;if(c)score++;
  const tB=q.a===true?'var(--success)':answer===true?'var(--error)':'var(--surface)';
  const fB=q.a===false?'var(--success)':answer===false?'var(--error)':'var(--surface)';
  document.getElementById('btns').innerHTML=`<button class="tf" style="background:${tB};border-color:${tB};opacity:${answer!==true&&q.a!==true?'.4':'1'};cursor:default">✓ TRUE</button><button class="tf" style="background:${fB};border-color:${fB};opacity:${answer!==false&&q.a!==false?'.4':'1'};cursor:default">✗ FALSE</button>`;
  const fb=document.getElementById('fba');fb.style.display='block';
  fb.innerHTML=`<div class="fb" style="background:${c?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)'};border:1px solid ${c?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)'}"><div class="fb-t" style="color:${c?'var(--success)':'var(--error)'}">${c?'Correct!':'Incorrect'}</div><div class="fb-d">${q.e}</div></div>`;
  document.getElementById('nw').style.display='block';document.getElementById('nb').textContent=idx+1>=QS.length?'See Results':'Next →';
}
function next(){if(idx+1>=QS.length){showRes();return;}idx++;answer=null;render();}
function showRes(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='block';
  const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';
  const msg=pct>=80?"Excellent!":pct>=60?"Good — review the tricky ones.":"Keep studying!";
  r.innerHTML=`<div style="font-family:Work Sans,sans-serif;font-size:13px;color:var(--teal);letter-spacing:3px;text-transform:uppercase">Complete</div><div class="rs">${score}/${QS.length}</div><div class="rm" style="color:${col}">${msg}</div><button class="br" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;answer=null;score=0;document.getElementById('game').style.display='block';document.getElementById('results').style.display='none';render();}
render();
</script>
</body>
</html>
