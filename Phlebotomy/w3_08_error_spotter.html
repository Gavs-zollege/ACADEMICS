<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Draw Procedures — Error Spotter</title>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;600;700&family=Red+Hat+Display:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080C14;--card:#0F1526;--surface:#171E36;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6870A0;--success:#38C97A;--error:#E05555;--border:#1E2848;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:radial-gradient(ellipse at 30% 10%,#111828,var(--bg));font-family:'Crimson Pro',serif;color:var(--text);}
  .wrap{max-width:620px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:28px;}
  h1{font-size:32px;color:var(--gold);}
  .sub{font-family:'Red Hat Display',sans-serif;color:var(--dim);font-size:14px;margin-top:8px;line-height:1.5;}
  .stats{display:flex;justify-content:center;gap:20px;margin-bottom:24px;font-family:'Red Hat Display',sans-serif;font-size:13px;}
  .pool-lbl{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-family:'Red Hat Display',sans-serif;font-weight:600;margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;}
  .chip{padding:8px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-family:'Red Hat Display',sans-serif;font-size:13px;cursor:pointer;transition:all .2s;}
  .chip:hover{transform:translateY(-2px);}
  .chip.selected{border-color:var(--gold);background:rgba(226,185,76,.08);color:var(--gold);}
  .chip.wrong{border-color:var(--error);background:rgba(224,85,85,.06);color:var(--error);}
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px;}
  .bucket{background:var(--card);border-radius:12px;padding:16px;border:2px solid var(--border);min-height:120px;transition:all .2s;cursor:pointer;}
  .bucket:hover{border-color:var(--teal);}
  .bucket.highlight{border-color:var(--gold);background:rgba(226,185,76,.04);}
  .bucket-title{font-family:'Red Hat Display',sans-serif;font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
  .bucket-dot{width:10px;height:10px;border-radius:50%;}
  .bucket-items{display:flex;flex-wrap:wrap;gap:4px;}
  .b-tag{font-family:'Red Hat Display',sans-serif;font-size:11px;padding:4px 10px;border-radius:6px;font-weight:500;}
  .fb{text-align:center;margin:16px 0;font-family:'Red Hat Display',sans-serif;font-size:14px;padding:12px;border-radius:10px;}
  .ctrls{display:flex;gap:10px;justify-content:center;margin-top:16px;}
  .btn{padding:12px 32px;border-radius:10px;border:none;font-size:14px;font-weight:600;font-family:'Red Hat Display',sans-serif;cursor:pointer;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Error Spotter</h1><p class="sub">Sort each scenario into the correct error category: Identification Error, Equipment Error, Technique Error, or Safety Violation.</p></div>
  <div class="stats"><span style="color:var(--success)" id="sc">Sorted: 0/12</span><span style="color:var(--dim)" id="att">Mistakes: 0</span></div>
  <div id="pa"></div>
  <div class="buckets">
    <div class="bucket" id="b0" onclick="placeTo(0)"><div class="bucket-title"><div class="bucket-dot" style="background:#5B8CDB"></div><span style="color:#5B8CDB">Identification</span></div><div class="bucket-items" id="bi0"></div></div>
    <div class="bucket" id="b1" onclick="placeTo(1)"><div class="bucket-title"><div class="bucket-dot" style="background:#8B6AAE"></div><span style="color:#8B6AAE">Equipment</span></div><div class="bucket-items" id="bi1"></div></div>
    <div class="bucket" id="b2" onclick="placeTo(2)"><div class="bucket-title"><div class="bucket-dot" style="background:#E2B94C"></div><span style="color:#E2B94C">Technique</span></div><div class="bucket-items" id="bi2"></div></div>
    <div class="bucket" id="b3" onclick="placeTo(3)"><div class="bucket-title"><div class="bucket-dot" style="background:#E05555"></div><span style="color:#E05555">Safety</span></div><div class="bucket-items" id="bi3"></div></div>
  </div>
  <div id="fba"></div>
  <div class="ctrls"><button class="btn btn-outline" onclick="init()">Reset</button></div>
</div>
<script>
const ITEMS=[
  {t:"Using room number as ID",b:0},{t:"Patient just says 'yes' to name",b:0},{t:"Skipping requisition review",b:0},
  {t:"Using expired collection tubes",b:1},{t:"Wrong tube for ordered test",b:1},{t:"Sharps container out of reach",b:1},
  {t:"Tourniquet on for 3 minutes",b:2},{t:"Blowing on site to dry it",b:2},{t:"Touching cleaned site before draw",b:2},
  {t:"No hand hygiene before draw",b:3},{t:"Not changing gloves between patients",b:3},{t:"Skipping patient ID re-check",b:3},
];
const BCOLS=["#5B8CDB","#8B6AAE","#E2B94C","#E05555"];
let pool,placed,selected,mistakes;
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function init(){pool=shuffle([...ITEMS]);placed=[[],[],[],[]];selected=null;mistakes=0;render();}
function render(){
  document.getElementById('sc').textContent=`Sorted: ${placed.flat().length}/${ITEMS.length}`;
  document.getElementById('att').textContent=`Mistakes: ${mistakes}`;
  let ph='';
  if(pool.length){ph='<div class="pool-lbl">Scenarios to Sort</div><div class="chips">';
    pool.forEach((item,i)=>{let cls='chip';if(selected===i)cls+=' selected';ph+=`<div class="${cls}" onclick="sel(${i})">${item.t}</div>`;});ph+='</div>';}
  else{ph='<div class="pool-lbl">All scenarios sorted!</div>';}
  document.getElementById('pa').innerHTML=ph;
  [0,1,2,3].forEach(b=>{
    let bh='';placed[b].forEach(item=>{bh+=`<div class="b-tag" style="background:${BCOLS[b]}15;color:${BCOLS[b]}">${item.t}</div>`;});
    document.getElementById('bi'+b).innerHTML=bh||`<span style="font-family:Red Hat Display,sans-serif;font-size:11px;color:var(--dim)">Drop here</span>`;
    document.getElementById('b'+b).classList.toggle('highlight',selected!==null);
  });
  if(pool.length===0){
    document.getElementById('fba').innerHTML=`<div class="fb" style="background:rgba(56,201,122,.06);border:1px solid rgba(56,201,122,.2);color:var(--success)"><strong>All sorted!</strong> ${mistakes===0?'Perfect!':'Completed with '+mistakes+' mistake'+(mistakes>1?'s':'')+'.'}</div>`;
  }else{document.getElementById('fba').innerHTML='';}
}
function sel(i){selected=selected===i?null:i;render();}
function placeTo(b){
  if(selected===null)return;const item=pool[selected];
  if(item.b===b){placed[b].push(item);pool.splice(selected,1);selected=null;render();}
  else{mistakes++;const chips=document.querySelectorAll('.chip');if(chips[selected]){chips[selected].classList.add('wrong');setTimeout(()=>{chips[selected]?.classList.remove('wrong');},600);}selected=null;render();}
}
init();
</script>
</body>
</html>
