<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 1 — Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Source+Sans+3:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0C1A; --card: #161630; --surface: #1E1E3A; --crimson: #8B1A1A;
    --gold: #D4A843; --text: #F0EDE6; --dim: #8A8698; --success: #4CAF50;
    --error: #E74C3C; --border: #252540;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { min-height:100vh; background: radial-gradient(ellipse at 30% 20%, #1a1028 0%, var(--bg) 60%); font-family:'Playfair Display','Georgia',serif; color:var(--text); }
  .wrap { max-width:560px; margin:0 auto; padding:40px 20px; }
  .header { text-align:center; margin-bottom:32px; }
  .label { font-size:11px; letter-spacing:4px; color:var(--crimson); text-transform:uppercase; font-family:'Source Sans 3',sans-serif; font-weight:600; margin-bottom:8px; }
  h1 { font-size:36px; font-weight:900; color:var(--gold); line-height:1.1; }
  .sub { font-family:'Source Sans 3',sans-serif; color:var(--dim); font-size:14px; margin-top:8px; }
  .dots { display:flex; justify-content:center; gap:4px; margin-bottom:24px; flex-wrap:wrap; }
  .dot { width:10px; height:10px; border-radius:50%; transition:all .3s; }
  .counter { text-align:center; font-family:'Source Sans 3',sans-serif; font-size:13px; color:var(--dim); margin-bottom:16px; }
  .counter .g { color:var(--success); }
  .card { border-radius:16px; padding:48px 32px; min-height:220px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative; overflow:hidden; transition:transform .5s cubic-bezier(.4,0,.2,1), box-shadow .3s, border-color .3s; }
  .card:hover { box-shadow:0 12px 48px rgba(139,26,26,.3); }
  .card .corner { position:absolute; top:0; right:0; width:80px; height:80px; }
  .card .side { font-size:10px; letter-spacing:3px; text-transform:uppercase; font-family:'Source Sans 3',sans-serif; font-weight:600; margin-bottom:16px; }
  .card .main-term { font-size:28px; font-weight:700; color:var(--gold); text-align:center; line-height:1.5; }
  .card .main-def { font-size:18px; font-weight:400; color:var(--text); text-align:center; line-height:1.5; font-family:'Source Sans 3',sans-serif; }
  .card .hint { font-size:11px; color:var(--dim); margin-top:20px; font-family:'Source Sans 3',sans-serif; }
  .mastered-badge { position:absolute; top:12px; left:12px; font-size:10px; background:rgba(76,175,80,.2); color:var(--success); padding:2px 10px; border-radius:8px; font-family:'Source Sans 3',sans-serif; font-weight:600; }
  .controls { display:flex; gap:10px; justify-content:center; margin-top:24px; align-items:center; }
  .btn { border:none; cursor:pointer; font-family:inherit; transition:all .2s; border-radius:12px; color:var(--text); font-size:14px; font-weight:600; }
  .btn:hover { transform:translateY(-1px); filter:brightness(1.15); }
  .btn-nav { width:48px; height:48px; background:var(--surface); font-size:20px; }
  .btn-know { padding:12px 28px; }
  .done-box { text-align:center; margin-top:32px; padding:20px; background:rgba(76,175,80,.08); border-radius:12px; border:1px solid rgba(76,175,80,.25); }
  .done-box h2 { font-size:22px; font-weight:700; color:var(--success); }
  .done-box p { font-family:'Source Sans 3',sans-serif; color:var(--dim); font-size:13px; margin-top:4px; }
  @keyframes slideL { 0%{opacity:1;transform:translateX(0)} 100%{opacity:0;transform:translateX(-40px)} }
  @keyframes slideR { 0%{opacity:1;transform:translateX(0)} 100%{opacity:0;transform:translateX(40px)} }
  .slide-l { animation:slideL .2s ease-out; }
  .slide-r { animation:slideR .2s ease-out; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="label">Activity 1 of 10</div>
    <h1>Flashcards</h1>
    <p class="sub">Tap the card to reveal the definition. 20 terms to master.</p>
  </div>
  <div class="dots" id="dots"></div>
  <div class="counter"><span id="pos">1 of 20</span> · <span class="g" id="mastered">0 mastered</span></div>
  <div class="card" id="card" onclick="flip()"></div>
  <div class="controls">
    <button class="btn btn-nav" onclick="go(-1)">←</button>
    <button class="btn btn-know" id="knowBtn" onclick="toggleKnown()">✓ I Know This</button>
    <button class="btn btn-nav" onclick="go(1)">→</button>
  </div>
  <div class="done-box" id="doneBox" style="display:none">
    <h2>All cards mastered!</h2>
    <p>You've reviewed every term. Great work!</p>
  </div>
</div>
<script>
const CARDS=[
  {t:"Epicardium",d:"Outer protective layer of the heart wall that reduces friction."},
  {t:"Myocardium",d:"Thick muscular layer responsible for pumping blood."},
  {t:"Endocardium",d:"Smooth inner lining that reduces resistance to blood flow."},
  {t:"Right Atrium",d:"Receives deoxygenated blood from systemic circulation via the venae cavae."},
  {t:"Right Ventricle",d:"Pumps deoxygenated blood to the lungs via the pulmonary arteries."},
  {t:"Left Atrium",d:"Receives oxygenated blood returning from the lungs via the pulmonary veins."},
  {t:"Left Ventricle",d:"Pumps oxygenated blood to the body via the aorta. Has the thickest wall."},
  {t:"Tricuspid Valve",d:"Located between the right atrium and right ventricle; prevents backflow."},
  {t:"Mitral (Bicuspid) Valve",d:"Located between the left atrium and left ventricle; prevents backflow."},
  {t:"Pulmonary Valve",d:"Controls blood flow from the right ventricle to the pulmonary arteries."},
  {t:"Aortic Valve",d:"Controls blood flow from the left ventricle into the aorta."},
  {t:"SA Node",d:"The heart's natural pacemaker located in the right atrium. Initiates electrical impulses."},
  {t:"AV Node",d:"Delays the electrical impulse to allow complete ventricular filling before contraction."},
  {t:"Bundle of His",d:"Conducts impulses from the AV node to the bundle branches in the interventricular septum."},
  {t:"Purkinje Fibers",d:"Distribute electrical impulses throughout the ventricles for coordinated contraction."},
  {t:"Systole",d:"Phase when the heart contracts and pumps blood out to the body and lungs."},
  {t:"Diastole",d:"Phase when the heart relaxes and fills with blood."},
  {t:"Aorta",d:"The largest artery; carries oxygenated blood from the left ventricle to the body."},
  {t:"Mediastinum",d:"The central compartment of the thorax where the heart is located, between the lungs."},
  {t:"Cardiac Output",d:"The volume of blood the heart pumps per minute; influences venous return and vein accessibility."},
];
let idx=0, flipped=false, known=new Set();
function render(){
  const c=CARDS[idx];
  const el=document.getElementById('card');
  const bg=flipped?'linear-gradient(135deg,var(--card),#1a1535)':'linear-gradient(135deg,rgba(139,26,26,.13),var(--card))';
  const bc=flipped?'rgba(212,168,67,.27)':'rgba(139,26,26,.34)';
  el.style.background=bg;el.style.border='1px solid '+bc;
  el.innerHTML=`
    <div class="corner" style="background:linear-gradient(135deg,transparent 50%,${flipped?'rgba(212,168,67,.06)':'rgba(139,26,26,.06)'} 50%)"></div>
    ${known.has(idx)?'<div class="mastered-badge">Mastered</div>':''}
    <div class="side" style="color:${flipped?'rgba(212,168,67,.6)':'var(--crimson)'}">${flipped?'Definition':'Term'}</div>
    <div class="${flipped?'main-def':'main-term'}">${flipped?c.d:c.t}</div>
    <div class="hint">tap to ${flipped?'see term':'reveal'}</div>`;
  // dots
  let dots='';
  CARDS.forEach((_,i)=>{
    const bg=known.has(i)?'var(--success)':i===idx?'var(--gold)':'rgba(139,26,26,.33)';
    const sc=i===idx?'scale(1.3)':'scale(1)';
    dots+=`<div class="dot" style="background:${bg};transform:${sc}"></div>`;
  });
  document.getElementById('dots').innerHTML=dots;
  document.getElementById('pos').textContent=`${idx+1} of ${CARDS.length}`;
  document.getElementById('mastered').textContent=`${known.size} mastered`;
  const kb=document.getElementById('knowBtn');
  kb.textContent=known.has(idx)?'Unmark':'✓ I Know This';
  kb.style.background=known.has(idx)?'var(--surface)':'var(--success)';
  document.getElementById('doneBox').style.display=known.size===CARDS.length?'block':'none';
}
function flip(){flipped=!flipped;render();}
function go(dir){
  const el=document.getElementById('card');
  el.classList.add(dir===1?'slide-l':'slide-r');
  setTimeout(()=>{el.classList.remove('slide-l','slide-r');idx=(idx+dir+CARDS.length)%CARDS.length;flipped=false;render();},200);
}
function toggleKnown(){known.has(idx)?known.delete(idx):known.add(idx);render();}
render();
</script>
</body>
</html>
