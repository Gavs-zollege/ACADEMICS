<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 10 — Final Review Checklist</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0E1A;--card:#111828;--surface:#1A2040;--crimson:#9B2335;--gold:#D4A843;--text:#EDE9DF;--dim:#6B7090;--success:#43B581;--border:#232A48;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:linear-gradient(180deg,var(--bg),#0D1224);font-family:'Spectral',serif;color:var(--text);}

  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:680px;margin:0 auto;padding:16px 20px;overflow:hidden;}

  /* ── Header ── */
  .header{text-align:center;flex-shrink:0;padding-bottom:12px;}
  .label{font-size:11px;letter-spacing:4px;color:var(--crimson);text-transform:uppercase;font-family:'Inter',sans-serif;font-weight:700;margin-bottom:6px;}
  h1{font-size:30px;color:var(--gold);margin:0;line-height:1.2;}
  .sub{font-family:'Inter',sans-serif;color:var(--dim);font-size:13px;margin-top:6px;}

  /* ── Progress ── */
  .prog-section{flex-shrink:0;margin-bottom:14px;}
  .prog-row{display:flex;justify-content:space-between;font-family:'Inter',sans-serif;font-size:13px;margin-bottom:5px;}
  .prog-bar{height:8px;border-radius:4px;background:var(--border);overflow:hidden;}
  .prog-fill{height:100%;border-radius:4px;transition:width .5s ease,background .5s;}

  /* ── Page Content ── */
  .page-content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;gap:10px;overflow:hidden;}

  /* ── Topic Cards ── */
  .topic{background:var(--card);border-radius:14px;padding:16px 18px;border:1px solid var(--border);transition:all .3s;cursor:pointer;}
  .topic:hover{transform:translateY(-1px);}
  .topic.checked{opacity:.55;}
  .topic-head{display:flex;align-items:center;gap:12px;}
  .check-box{width:28px;height:28px;border-radius:8px;border:2px solid;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:15px;font-weight:700;color:#fff;transition:all .2s;cursor:pointer;}
  .check-box:hover{transform:scale(1.1);}
  .topic-info{flex:1;}
  .topic-title-row{display:flex;align-items:center;gap:10px;}
  .color-bar{width:4px;height:20px;border-radius:2px;flex-shrink:0;}
  .topic-title{font-size:16px;font-weight:600;}
  .topic-meta{font-family:'Inter',sans-serif;font-size:12px;color:var(--dim);margin-top:3px;padding-left:14px;}
  .arrow{color:var(--dim);font-size:16px;transition:transform .2s;user-select:none;}
  .topic.open .arrow{transform:rotate(180deg);}
  .points{margin-top:12px;padding-left:40px;}
  .point{font-family:'Inter',sans-serif;font-size:13px;color:var(--dim);line-height:1.65;padding-left:12px;margin-bottom:5px;}

  /* ── Done Box ── */
  .done-box{text-align:center;padding:24px 20px;border-radius:16px;background:linear-gradient(135deg,rgba(67,181,129,.08),rgba(67,181,129,.03));border:1px solid rgba(67,181,129,.3);}
  .done-emoji{font-size:32px;}
  .done-title{font-size:22px;font-weight:700;color:var(--success);margin-top:6px;}
  .done-text{font-family:'Inter',sans-serif;font-size:13px;color:var(--dim);margin-top:6px;line-height:1.5;}

  /* ── Footer / Nav ── */
  .footer{flex-shrink:0;padding-top:14px;display:flex;flex-direction:column;gap:10px;}
  .page-nav{display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Inter',sans-serif;}
  .nav-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--dim);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
  .nav-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
  .nav-btn:disabled{opacity:.25;cursor:default;}
  .page-dots{display:flex;gap:6px;align-items:center;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .25s;cursor:pointer;}
  .dot.active{background:var(--gold);width:22px;border-radius:4px;}
  .dot:hover:not(.active){background:var(--dim);}
  .page-label{font-size:12px;color:var(--dim);text-align:center;}
  .btn-reset{padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:12px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;align-self:center;}
  .btn-reset:hover{border-color:var(--dim);color:var(--text);}

  /* ── Animations ── */
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .page-content .topic,.page-content .done-box{animation:fadeIn .3s ease both;}
  .page-content .topic:nth-child(2){animation-delay:.05s;}
  .page-content .topic:nth-child(3){animation-delay:.1s;}
  .page-content .topic:nth-child(4){animation-delay:.15s;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="label">Activity 10 of 10</div>
    <h1>Final Review Checklist</h1>
    <p class="sub">Check off each topic as you feel confident. Aim for 100%!</p>
  </div>
  <div class="prog-section">
    <div class="prog-row">
      <span style="color:var(--dim)">Mastery Progress</span>
      <span id="progText" style="font-weight:600"></span>
    </div>
    <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
  </div>
  <div class="page-content" id="pageContent"></div>
  <div class="footer">
    <div class="page-nav">
      <button class="nav-btn" id="prevBtn" onclick="goPage(currentPage-1)">‹</button>
      <div class="page-dots" id="pageDots"></div>
      <button class="nav-btn" id="nextBtn" onclick="goPage(currentPage+1)">›</button>
    </div>
    <div class="page-label" id="pageLabel"></div>
    <button class="btn-reset" onclick="resetAll()">Reset Checklist</button>
  </div>
</div>
<script>
const TOPICS=[
  {title:"Heart Location & Structure",color:"#5B9BD5",points:["Located in the mediastinum between the lungs","Slightly left of the midline","Approximately the size of a fist","Apex points downward and to the left"]},
  {title:"Heart Wall Layers",color:"#E8976A",points:["Epicardium → outer protective layer (visceral pericardium)","Myocardium → thick muscular layer responsible for pumping","Endocardium → smooth inner lining that reduces friction"]},
  {title:"Four Chambers",color:"#8B6AAE",points:["Right atrium: receives deoxygenated blood from venae cavae","Right ventricle: pumps deoxygenated blood to lungs","Left atrium: receives oxygenated blood from pulmonary veins","Left ventricle: pumps oxygenated blood to body (thickest wall)"]},
  {title:"Four Valves",color:"#D4A843",points:["Tricuspid: between RA → RV (3 leaflets)","Pulmonary (semilunar): between RV → pulmonary arteries","Mitral / Bicuspid: between LA → LV (2 leaflets)","Aortic (semilunar): between LV → aorta"]},
  {title:"Major Vessels",color:"#E74C6F",points:["Superior & inferior vena cava → return deoxygenated blood to RA","Pulmonary arteries → carry deoxygenated blood to lungs","Pulmonary veins → carry oxygenated blood to LA","Aorta → largest artery, carries oxygenated blood to body"]},
  {title:"Conduction System",color:"#4CAF90",points:["SA Node → natural pacemaker in the right atrium","AV Node → delays impulse for ventricular filling","Bundle of His → conducts to bundle branches","Bundle Branches → left & right pathways down septum","Purkinje Fibers → distribute impulse through ventricles"]},
  {title:"Cardiac Cycle",color:"#5B8CDB",points:["Systole = contraction phase (heart pumps blood out)","Diastole = relaxation phase (heart fills with blood)","Blood pressure reflects systole/diastole (e.g., 120/80)","Cardiac output = heart rate × stroke volume"]},
  {title:"Phlebotomy Connections",color:"#C4A84D",points:["Cardiac output affects venous return and vein accessibility","Poor circulation → collapsed or fragile veins","Warmth & gravity improve venous access","Adjust technique based on patient's cardiovascular status","Understanding anatomy helps locate veins and anticipate issues"]},
];

// Pages: group topics so each page fits without scrolling
// Page 1: topics 0-2 (3 cards), Page 2: topics 3-5 (3 cards), Page 3: topics 6-7 + completion
const PAGES=[
  {topics:[0,1,2], label:"Heart Basics"},
  {topics:[3,4,5], label:"Valves, Vessels & Conduction"},
  {topics:[6,7], label:"Cycle, Phlebotomy & Review"},
];

let checked=new Set(), openIdx=-1, currentPage=0;

function render(){
  const pct=checked.size/TOPICS.length*100;
  const allDone=checked.size===TOPICS.length;
  document.getElementById('progText').textContent=`${checked.size}/${TOPICS.length} topics (${Math.round(pct)}%)`;
  document.getElementById('progText').style.color=allDone?'var(--success)':'var(--gold)';
  const fill=document.getElementById('progFill');
  fill.style.width=pct+'%';
  fill.style.background=allDone?'var(--success)':'linear-gradient(90deg,var(--crimson),var(--gold))';

  // Render current page topics
  const page=PAGES[currentPage];
  let h='';
  page.topics.forEach(i=>{
    const t=TOPICS[i], isDone=checked.has(i), isOpen=openIdx===i;
    h+=`<div class="topic ${isDone?'checked':''} ${isOpen?'open':''}" id="topic${i}">
      <div class="topic-head">
        <div class="check-box" style="border-color:${isDone?'var(--success)':t.color};background:${isDone?'var(--success)':'transparent'}" onclick="event.stopPropagation();toggleCheck(${i})">${isDone?'✓':''}</div>
        <div class="topic-info" onclick="toggleOpen(${i})">
          <div class="topic-title-row">
            <div class="color-bar" style="background:${t.color}"></div>
            <span class="topic-title" style="color:${isDone?'var(--success)':'var(--gold)'}">${t.title}</span>
          </div>
          ${!isOpen?`<div class="topic-meta">${t.points.length} key points · tap to expand</div>`:''}
        </div>
        <span class="arrow" onclick="toggleOpen(${i})">▾</span>
      </div>
      ${isOpen?`<div class="points">${t.points.map(p=>`<div class="point" style="border-left:2px solid ${t.color}33">${p}</div>`).join('')}</div>`:''}
    </div>`;
  });

  // Show completion on last page when all done
  if(currentPage===PAGES.length-1 && allDone){
    h+=`<div class="done-box">
      <div class="done-emoji">🎓</div>
      <div class="done-title">Review Complete!</div>
      <div class="done-text">You've reviewed all 8 topic areas covering heart anatomy, the vascular system, and phlebotomy connections. You're well-prepared!</div>
    </div>`;
  }

  document.getElementById('pageContent').innerHTML=h;

  // Nav buttons
  document.getElementById('prevBtn').disabled=currentPage===0;
  document.getElementById('nextBtn').disabled=currentPage===PAGES.length-1;

  // Dots
  let dots='';
  PAGES.forEach((_,i)=>{
    dots+=`<div class="dot ${i===currentPage?'active':''}" onclick="goPage(${i})"></div>`;
  });
  document.getElementById('pageDots').innerHTML=dots;
  document.getElementById('pageLabel').textContent=`${page.label} · Page ${currentPage+1} of ${PAGES.length}`;
}

function goPage(p){
  if(p<0||p>=PAGES.length) return;
  openIdx=-1;
  currentPage=p;
  render();
}

function toggleCheck(i){checked.has(i)?checked.delete(i):checked.add(i);render();}

function toggleOpen(i){
  // Close if same, otherwise open new (and close any other)
  openIdx=openIdx===i?-1:i;
  render();
}

function resetAll(){checked=new Set();openIdx=-1;currentPage=0;render();}

render();
</script>
</body>
</html>
