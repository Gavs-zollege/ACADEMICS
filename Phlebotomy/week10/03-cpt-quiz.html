<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPT Exam Review Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Urbanist:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(170deg,#080c18,#0a1020);font-family:'Urbanist',sans-serif;color:#d0d8f0}
.wrap{max-width:560px;margin:0 auto;padding:40px 20px}
.tag{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#ff8c42;font-weight:800;margin-bottom:8px}
h1{font-family:'Bree Serif',serif;font-size:30px;color:#f0f2f8;margin-bottom:24px}
.info{display:flex;justify-content:space-between;margin-bottom:8px;font-size:13px;color:#4a5a78}
.info .sc{color:#ff8c42;font-weight:700}
.bar{height:5px;background:#101828;border-radius:3px;margin-bottom:32px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#ff8c42,#ffb07a);border-radius:3px;transition:width .5s}
.question{font-family:'Bree Serif',serif;font-size:19px;color:#e8ecf4;margin-bottom:24px;line-height:1.5}
.domain-tag{display:inline-block;padding:4px 12px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}
.opt{padding:16px 20px;border-radius:12px;border:1.5px solid #182038;background:#0c1020;margin-bottom:10px;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:14px;transition:all .2s}
.opt:hover{background:#141c30;border-color:#ff8c42}
.opt.correct{background:#0d2a16;border-color:#27ae60;color:#2ecc71;font-weight:600}
.opt.wrong{background:#2a0d10;border-color:#e74c3c;color:#e74c3c}
.opt.dim{color:#2a3448}
.opt .letter{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #2a3448;font-size:12px;font-weight:800;color:#4a5a78;flex-shrink:0}
.opt.correct .letter{border-color:#27ae60;color:#27ae60}
.opt.wrong .letter{border-color:#e74c3c;color:#e74c3c}
.next-btn{width:100%;padding:16px;border-radius:12px;border:none;margin-top:8px;background:linear-gradient(135deg,#ff8c42,#e07030);color:#fff;font-weight:800;font-size:16px;cursor:pointer;display:none}
.result{text-align:center;padding:40px 0}
.result .pct{font-size:72px;font-weight:900;font-family:'Bree Serif',serif;line-height:1}
.result .detail{font-size:18px;color:#4a5a78;margin-top:8px}
.result .msg{font-size:24px;font-weight:800;margin-top:16px}
.btn-row{display:flex;gap:12px;margin-top:32px;justify-content:center}
.btn-row button{padding:14px 32px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer}
.btn-outline{border:1px solid #2a3448;background:transparent;color:#4a5a78}
.btn-solid{border:none;background:#ff8c42;color:#fff;font-weight:800}
.review-card{padding:20px;border-radius:14px;background:#0c1020;margin-bottom:12px;border:1px solid #182038}
.review-card .rq{font-size:14px;font-weight:600;color:#d0d8f0;margin-bottom:12px}
.review-opt{padding:8px 14px;border-radius:8px;margin-bottom:4px;font-size:13px;border:1px solid transparent}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const questions=[
{q:"How many scored questions are on the NHA CPT exam?",opts:["80","100","120","150"],ans:1,domain:"Exam Overview"},
{q:"Which CPT exam domain has the HIGHEST percentage weight?",opts:["Patient Preparation (20%)","Routine Blood Collections (28%)","Safety & Compliance (26%)","Processing & Transport (14%)"],ans:1,domain:"Exam Overview"},
{q:"What is the FIRST step after a needlestick exposure?",opts:["Document the incident","Report to supervisor","Wash the site immediately","Seek medical evaluation"],ans:2,domain:"Safety"},
{q:"Standard Precautions should be applied to:",opts:["Only high-risk patients","Only patients with known infections","All patients regardless of diagnosis","Only during surgical procedures"],ans:2,domain:"Safety"},
{q:"What is the correct order of draw after blood cultures?",opts:["Red → Light blue → Green → Lavender","Light blue → Red → Gold → Green → Lavender → Gray","Green → Lavender → Red → Light blue","Gold → Red → Light blue → Lavender"],ans:1,domain:"Collections"},
{q:"The tourniquet should remain on for no more than:",opts:["30 seconds","1 minute","2 minutes","5 minutes"],ans:1,domain:"Collections"},
{q:"During capillary collection, the first drop of blood should be:",opts:["Collected immediately","Wiped away","Used for the most important test","Ignored"],ans:1,domain:"Collections"},
{q:"Which antiseptic is used for blood culture site prep?",opts:["Isopropyl alcohol","Betadine only","Chlorhexidine","Hydrogen peroxide"],ans:2,domain:"Special"},
{q:"Chain of custody is required for:",opts:["All blood draws","Drug screens and blood alcohol tests","Only pediatric patients","STAT specimens"],ans:1,domain:"Special"},
{q:"A specimen may be REJECTED for all EXCEPT:",opts:["Mislabeling","Patient is fasting","Hemolysis","Insufficient volume"],ans:1,domain:"Processing"},
{q:"During centrifugation, tubes must be:",opts:["Stacked vertically","Balanced opposite each other","Placed randomly","Opened before spinning"],ans:1,domain:"Processing"},
{q:"For CLIA-waived POCT, quality control must be performed:",opts:["Weekly","Monthly","Before patient testing","Only when errors occur"],ans:2,domain:"POCT"}
];
const domainColors={"Exam Overview":"#ff8c42",Safety:"#e74c3c",Collections:"#27ae60",Special:"#8e44ad",Processing:"#3498db",POCT:"#16a085","Patient Prep":"#f1c40f"};
let idx=0,selected=null,locked=false,score=0,answers=[],phase='quiz';
function render(){
  const app=document.getElementById('app');
  if(phase==='result'){const pct=Math.round(score/questions.length*100);const col=pct>=80?'#27ae60':pct>=60?'#f1c40f':'#e74c3c';const msg=pct>=90?'Exam Ready!':pct>=80?'Great work!':pct>=60?'Keep reviewing!':'Focus on weak domains';app.innerHTML=`<div class="result"><div class="pct" style="color:${col}">${pct}%</div><div class="detail">${score} of ${questions.length} correct</div><div class="msg" style="color:${col}">${msg}</div><div class="btn-row"><button class="btn-outline" onclick="startReview()">Review Answers</button><button class="btn-solid" onclick="restart()">Retry Quiz</button></div></div>`;return;}
  if(phase==='review'){let html=`<h2 style="font-family:'Bree Serif',serif;font-size:28px;color:#f0f2f8;margin-bottom:24px">Review Answers</h2>`;answers.forEach((a,i)=>{const q=questions[a.qIdx];html+=`<div class="review-card" style="border-color:${a.correct?'#27ae6044':'#e74c3c44'}"><div class="rq">${i+1}. ${q.q}</div>`;q.opts.forEach((o,oi)=>{let bg='transparent',col='#4a5a78',fw=400,bdr='transparent';if(oi===q.ans){bg='#27ae6020';col='#27ae60';fw=600;bdr='#27ae6033';}else if(oi===a.picked&&!a.correct){bg='#e74c3c20';col='#e74c3c';}html+=`<div class="review-opt" style="background:${bg};color:${col};font-weight:${fw};border-color:${bdr}">${o}${oi===q.ans?' ✓':''}${oi===a.picked&&!a.correct?' ✗':''}</div>`;});html+=`</div>`;});html+=`<button class="btn-solid" style="width:100%;padding:16px;border-radius:12px;margin-top:12px;font-size:16px" onclick="restart()">Retry Quiz</button>`;app.innerHTML=html;return;}
  const q=questions[idx];const dc=domainColors[q.domain]||'#888';
  let html=`<div class="tag">CPT Exam Preparation</div><h1>Practice Quiz</h1><div class="info"><span>Question ${idx+1} of ${questions.length}</span><span class="sc">Score: ${score}</span></div><div class="bar"><div class="bar-fill" style="width:${((idx+(locked?1:0))/questions.length)*100}%"></div></div><div class="domain-tag" style="background:${dc}20;color:${dc}">${q.domain}</div><div class="question">${q.q}</div>`;
  q.opts.forEach((o,i)=>{let cls='opt';if(locked){if(i===q.ans)cls+=' correct';else if(i===selected)cls+=' wrong';else cls+=' dim';}html+=`<div class="${cls}" onclick="pick(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${o}</div>`;});
  html+=`<button class="next-btn" onclick="next()" style="display:${locked?'block':'none'}">${idx+1>=questions.length?'See Results':'Next Question →'}</button>`;app.innerHTML=html;
}
function pick(i){if(locked)return;selected=i;locked=true;if(i===questions[idx].ans)score++;answers.push({qIdx:idx,picked:i,correct:i===questions[idx].ans});render();}
function next(){if(idx+1>=questions.length){phase='result';render();return;}idx++;selected=null;locked=false;render();}
function startReview(){phase='review';render();}
function restart(){idx=0;selected=null;locked=false;score=0;answers=[];phase='quiz';render();}
render();
</script>
</body>
</html>
