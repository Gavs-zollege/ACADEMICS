<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPT Exam Review Matching</title>
<link href="https://fonts.googleapis.com/css2?family=Antic+Didone&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(180deg,#060e0a,#0a1810);font-family:'Outfit',sans-serif;color:#d8e8e0}
.wrap{max-width:700px;margin:0 auto;padding:40px 20px}
.tag{font-size:11px;letter-spacing:2.5px;text-transform:uppercase;color:#a0b8b0;font-weight:700;margin-bottom:8px}
h1{font-family:'Antic Didone',serif;font-size:34px;color:#e8f0ec;margin-bottom:4px}
.sub{font-size:14px;color:#4a6a58;margin-bottom:24px}
.stats{display:flex;gap:20px;margin-bottom:24px}
.stat{padding:10px 20px;border-radius:12px;background:#0c1810;border:1px solid #1a2e24;font-size:12px;color:#4a6a58}
.stat b{font-size:16px;font-weight:700;margin-left:4px}
.bar{height:4px;background:#0c1810;border-radius:2px;margin-bottom:28px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,#a0b8b0,#c0d8d0);transition:width .5s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.col-label{font-size:11px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:12px;padding-left:4px}
.card{padding:14px 16px;border-radius:12px;margin-bottom:8px;border:2px solid #1a2e24;background:#081210;cursor:pointer;transition:all .25s;font-size:14px;user-select:none}
.card:hover{transform:translateY(-2px)}
.card.selected-term{background:#101e18;border-color:#a0b8b0;color:#fff}
.card.selected-def{background:#101e18;border-color:#5dade2;color:#fff}
.card.matched{background:#0d2a16;border-color:#27ae6055;color:#27ae60;opacity:.5;cursor:default}
.card.wrong{background:#2a0d0d;border-color:#e74c3c;color:#e74c3c}
.card.dim{cursor:default;opacity:.6}
.def-card{font-size:13px;color:#90a8a0;line-height:1.4}
.complete{text-align:center;padding:48px}
.complete .icon{font-size:56px;margin-bottom:12px}
.complete h2{font-family:'Antic Didone',serif;font-size:30px;color:#27ae60}
.complete .det{font-size:15px;color:#4a6a58;margin-top:8px}
.play-btn{margin-top:28px;padding:14px 40px;border-radius:12px;border:none;background:linear-gradient(135deg,#a0b8b0,#80a098);color:#fff;font-weight:800;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const pairs=[
{term:"Order of Draw",def:"Cultures → Blue → Red → Gold → Green → Lavender → Gray"},
{term:"Exposure Incident",def:"Wash → Report → Document → Evaluate → Follow-up"},
{term:"Chain of Custody",def:"Legal specimens: drug screens & alcohol"},
{term:"Hemolysis",def:"RBC rupture — common rejection reason"},
{term:"Centrifugation",def:"Spinning to separate blood components"},
{term:"CLIA-Waived",def:"Simple tests with QC before patient testing"},
{term:"Syncope",def:"Fainting — stop draw, position safely"},
{term:"Pre-Analytical Error",def:"Most common lab errors occur here"},
{term:"Chlorhexidine",def:"Antiseptic for blood culture prep"},
{term:"Critical Value",def:"Abnormal result needing immediate reporting"}
];
let shuffledDefs,selTerm=null,selDef=null,matched=new Set(),attempts=0,wrongT=null,wrongD=null;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function init(){shuffledDefs=shuffle(pairs.map(p=>p.def));selTerm=null;selDef=null;matched=new Set();attempts=0;wrongT=null;wrongD=null;render();}
function clickTerm(i){if(matched.has(pairs[i].term)||wrongT!==null)return;selTerm=i;if(selDef!==null)checkMatch();else render();}
function clickDef(i){if(wrongT!==null||selTerm===null)return;const mT=pairs.find(p=>p.def===shuffledDefs[i])?.term;if(matched.has(mT))return;selDef=i;checkMatch();}
function checkMatch(){attempts++;const t=pairs[selTerm].term,d=shuffledDefs[selDef];if(pairs.find(p=>p.term===t&&p.def===d)){matched.add(t);selTerm=null;selDef=null;render();}else{wrongT=selTerm;wrongD=selDef;render();setTimeout(()=>{wrongT=null;wrongD=null;selTerm=null;selDef=null;render();},700);}}
function render(){
  const app=document.getElementById('app');
  if(matched.size===pairs.length){app.innerHTML=`<div class="complete"><div class="icon">🏆</div><h2>All Matched!</h2><div class="det">Completed in ${attempts} attempts — Accuracy: ${Math.round(pairs.length/attempts*100)}%</div><button class="play-btn" onclick="init()">Play Again</button></div>`;return;}
  let html=`<div class="tag">CPT Exam Preparation</div><h1>Matching Game</h1><p class="sub">Select a term, then its matching definition</p>`;
  html+=`<div class="stats"><div class="stat">Matched: <b style="color:#27ae60">${matched.size}/${pairs.length}</b></div><div class="stat">Attempts: <b style="color:#a0b8b0">${attempts}</b></div></div>`;
  html+=`<div class="bar"><div class="bar-fill" style="width:${matched.size/pairs.length*100}%"></div></div>`;
  html+=`<div class="grid"><div><div class="col-label" style="color:#a0b8b0">Terms</div>`;
  pairs.forEach((p,i)=>{const m=matched.has(p.term);let cls='card';if(m)cls+=' matched';else if(wrongT===i)cls+=' wrong';else if(selTerm===i)cls+=' selected-term';html+=`<div class="${cls}" onclick="clickTerm(${i})">${p.term}${m?' ✓':''}</div>`;});
  html+=`</div><div><div class="col-label" style="color:#5dade2">Definitions</div>`;
  shuffledDefs.forEach((d,i)=>{const mT=pairs.find(p=>p.def===d)?.term;const m=matched.has(mT);let cls='card def-card';if(m)cls+=' matched';else if(wrongD===i)cls+=' wrong';else if(selDef===i)cls+=' selected-def';else if(selTerm===null&&!m)cls+=' dim';html+=`<div class="${cls}" onclick="clickDef(${i})">${d}${m?' ✓':''}</div>`;});
  html+=`</div></div>`;app.innerHTML=html;
}
init();
</script>
</body>
</html>
