<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Collection Language — Activity 3: Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;600;700&family=Lexend+Deca:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0A0D18;--card:#111828;--surface:#1A2040;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7090;--success:#38C97A;--error:#E05555;--border:#1E2848;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:linear-gradient(160deg,var(--bg),#0E1424);font-family:'Newsreader',serif;color:var(--text);}
  .wrap{max-width:580px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:24px;}
  .label{font-size:11px;letter-spacing:4px;color:var(--teal);text-transform:uppercase;font-family:'Lexend Deca',sans-serif;font-weight:600;margin-bottom:8px;}
  h1{font-size:34px;color:var(--gold);}
  .prog-row{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .prog-text{font-family:'Lexend Deca',sans-serif;font-size:13px;color:var(--dim);white-space:nowrap;}
  .prog-bar{flex:1;height:5px;border-radius:3px;background:var(--border);overflow:hidden;}
  .prog-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .4s;}
  .q-card{background:var(--card);border-radius:14px;padding:28px 24px;border:1px solid var(--border);}
  .q-text{font-size:20px;line-height:1.5;margin-bottom:24px;}
  .opt{padding:14px 18px;margin-bottom:8px;border-radius:10px;border:1px solid var(--border);font-family:'Lexend Deca',sans-serif;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;}
  .opt:hover{transform:translateX(4px);}
  .opt .ltr{width:28px;height:28px;border-radius:8px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--dim);flex-shrink:0;}
  .opt.correct{background:rgba(56,201,122,.1);border-color:var(--success);color:var(--success);}
  .opt.correct .ltr{border-color:var(--success);color:var(--success);}
  .opt.wrong{background:rgba(224,85,85,.1);border-color:var(--error);color:var(--error);}
  .opt.wrong .ltr{border-color:var(--error);color:var(--error);}
  .nw{text-align:center;margin-top:20px;}
  .btn{padding:14px 40px;border-radius:10px;border:none;background:var(--gold);color:var(--bg);font-size:15px;font-weight:600;font-family:'Lexend Deca',sans-serif;cursor:pointer;}
  .results{text-align:center;padding:40px 20px;}
  .grade{font-size:72px;}
  .res-score{font-size:32px;color:var(--gold);}
  .res-msg{font-family:'Lexend Deca',sans-serif;font-size:16px;color:var(--dim);margin:12px 0 32px;}
  .missed-t{font-size:14px;color:var(--error);font-family:'Lexend Deca',sans-serif;font-weight:600;margin-bottom:8px;text-align:left;}
  .missed-i{padding:10px 14px;margin-bottom:6px;border-radius:8px;background:var(--card);border:1px solid var(--border);font-size:13px;font-family:'Lexend Deca',sans-serif;text-align:left;}
  .missed-i .mq{color:var(--text);margin-bottom:4px;}
  .missed-i .ma{color:var(--success);font-size:12px;}
  .btn-retry{padding:14px 36px;border-radius:10px;border:none;background:var(--teal);color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;margin-top:20px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Knowledge Quiz</h1></div>
  <div id="quiz">
    <div class="prog-row"><span class="prog-text" id="pPos">1/15</span><div class="prog-bar"><div class="prog-fill" id="pFill"></div></div><span class="prog-text" style="color:var(--success)" id="sText">0✓</span></div>
    <div class="q-card"><div class="q-text" id="qText"></div><div id="opts"></div></div>
    <div class="nw" id="nw" style="display:none"><button class="btn" id="nBtn" onclick="next()">Next →</button></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {q:"What does the prefix 'hemo-' mean?",o:["Vein","Blood","Clot","Red"],a:1},
  {q:"The term 'phlebotomy' literally translates to:",o:["Vein study","Blood clotting","Cutting into a vein","Blood condition"],a:2},
  {q:"What does the suffix '-lysis' mean?",o:["Inflammation","Study of","Breakdown/destruction","Cutting"],a:2},
  {q:"'Erythrocytes' refers to:",o:["White blood cells","Platelets","Red blood cells","Plasma proteins"],a:2},
  {q:"The prefix 'hypo-' means:",o:["Above/high","Below/low","Against","Fast"],a:1},
  {q:"What is a tourniquet used for?",o:["Measuring blood pressure","Restricting venous blood flow for collection","Preventing infection","Labeling tubes"],a:1},
  {q:"What does CBC stand for?",o:["Complete Blood Culture","Capillary Blood Collection","Complete Blood Count","Central Blood Chemistry"],a:2},
  {q:"The antecubital area is located:",o:["On the back of the hand","In front of the elbow","On the lateral side of the fingertip","Behind the knee"],a:1},
  {q:"A combining vowel is usually the letter:",o:["A","E","I","O"],a:3},
  {q:"What does 'thromb/o' mean?",o:["Red","White","Clot","Vein"],a:2},
  {q:"A lancet is used for:",o:["Venipuncture","Capillary puncture","Applying a tourniquet","Labeling tubes"],a:1},
  {q:"The suffix '-emia' refers to:",o:["Inflammation","Blood condition","Cutting","Record"],a:1},
  {q:"PT/INR is a test that measures:",o:["Red blood cell count","Blood sugar levels","Clotting time","White blood cell count"],a:2},
  {q:"What does 'brady-' mean?",o:["Fast","Slow","Without","Against"],a:1},
  {q:"A butterfly needle is also called a:",o:["Lancet","Microcollection device","Winged infusion set","Capillary tube"],a:2},
];
let cur=0,score=0,answered=false,answers=[];
function renderQ(){
  const q=QS[cur];document.getElementById('qText').textContent=q.q;
  document.getElementById('pPos').textContent=`${cur+1}/${QS.length}`;
  document.getElementById('pFill').style.width=`${(cur+1)/QS.length*100}%`;
  document.getElementById('sText').textContent=`${score}✓`;
  let h='';q.o.forEach((o,i)=>{h+=`<div class="opt" id="o${i}" onclick="pick(${i})"><div class="ltr">${String.fromCharCode(65+i)}</div><span>${o}</span></div>`;});
  document.getElementById('opts').innerHTML=h;document.getElementById('nw').style.display='none';answered=false;
}
function pick(i){if(answered)return;answered=true;const q=QS[cur];const c=i===q.a;if(c)score++;answers.push({idx:cur,picked:i,correct:c});
  q.o.forEach((_,j)=>{const el=document.getElementById('o'+j);el.style.cursor='default';if(j===q.a){el.classList.add('correct');el.querySelector('.ltr').textContent='✓';}else if(j===i&&!c){el.classList.add('wrong');el.querySelector('.ltr').textContent='✗';}});
  document.getElementById('sText').textContent=`${score}✓`;document.getElementById('nw').style.display='block';
  document.getElementById('nBtn').textContent=cur+1>=QS.length?'See Results':'Next →';
}
function next(){if(cur+1>=QS.length){showRes();return;}cur++;renderQ();}
function showRes(){
  document.getElementById('quiz').style.display='none';const r=document.getElementById('results');r.style.display='block';
  const pct=score/QS.length*100;const g=pct>=90?'A':pct>=80?'B':pct>=70?'C':pct>=60?'D':'F';
  const col=pct>=70?'var(--success)':'var(--error)';const msg=pct>=90?"Outstanding!":pct>=70?"Solid — review missed items.":"Keep studying!";
  const missed=answers.filter(a=>!a.correct);let mh='';
  if(missed.length){mh+='<div style="max-width:400px;margin:0 auto 24px;text-align:left"><div class="missed-t">Missed:</div>';
    missed.forEach(a=>{mh+=`<div class="missed-i"><div class="mq">${QS[a.idx].q}</div><div class="ma">Answer: ${QS[a.idx].o[QS[a.idx].a]}</div></div>`;});mh+='</div>';}
  r.innerHTML=`<div class="grade" style="color:${col}">${g}</div><div class="res-score">${score}/${QS.length}</div><div class="res-msg">${msg}</div>${mh}<button class="btn-retry" onclick="reset()">Retake</button>`;
}
function reset(){cur=0;score=0;answers=[];document.getElementById('quiz').style.display='block';document.getElementById('results').style.display='none';renderQ();}
renderQ();
</script>
</body>
</html>
