<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blood Collection Language — Activity 8: Category Sort</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080C14;--card:#0F1526;--surface:#171E36;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6870A0;--success:#38C97A;--error:#E05555;--border:#1E2848;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:radial-gradient(ellipse at 30% 10%,#111828,var(--bg));font-family:'Playfair Display SC',serif;color:var(--text);}
  .wrap{max-width:620px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:28px;}
  .label{font-size:11px;letter-spacing:4px;color:var(--teal);text-transform:uppercase;font-family:'Manrope',sans-serif;font-weight:700;margin-bottom:8px;}
  h1{font-size:30px;color:var(--gold);}
  .sub{font-family:'Manrope',sans-serif;color:var(--dim);font-size:14px;margin-top:8px;font-variant:normal;text-transform:none;}
  .stats{display:flex;justify-content:center;gap:20px;margin-bottom:24px;font-family:'Manrope',sans-serif;font-size:13px;font-variant:normal;}
  .pool-lbl{font-size:11px;letter-spacing:2px;color:var(--dim);text-transform:uppercase;font-family:'Manrope',sans-serif;font-weight:600;margin-bottom:10px;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:24px;}
  .chip{padding:8px 14px;border-radius:8px;background:var(--surface);border:1px solid var(--border);font-family:'Manrope',sans-serif;font-size:14px;cursor:pointer;transition:all .2s;font-variant:normal;}
  .chip:hover{transform:translateY(-2px);}
  .chip.selected{border-color:var(--gold);background:rgba(226,185,76,.08);color:var(--gold);}
  .chip.wrong{border-color:var(--error);background:rgba(224,85,85,.06);color:var(--error);}
  .buckets{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:20px;}
  .bucket{background:var(--card);border-radius:12px;padding:14px;border:2px solid var(--border);min-height:110px;transition:all .2s;cursor:pointer;}
  .bucket:hover{border-color:var(--teal);}
  .bucket.highlight{border-color:var(--gold);background:rgba(226,185,76,.04);}
  .bucket-title{font-family:'Manrope',sans-serif;font-size:12px;font-weight:700;margin-bottom:10px;text-align:center;font-variant:normal;}
  .bucket-items{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;}
  .b-tag{font-family:'Manrope',sans-serif;font-size:11px;padding:4px 8px;border-radius:6px;font-weight:500;font-variant:normal;}
  .fb{text-align:center;margin:16px 0;font-family:'Manrope',sans-serif;font-size:14px;padding:12px;border-radius:10px;font-variant:normal;}
  .ctrls{display:flex;gap:10px;justify-content:center;margin-top:16px;}
  .btn{padding:12px 32px;border-radius:10px;border:none;font-size:14px;font-weight:600;font-family:'Manrope',sans-serif;cursor:pointer;}
  .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text);}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Category Sort</h1><p class="sub">Tap a word part, then tap the correct category: Prefix, Root, or Suffix.</p></div>
  <div class="stats"><span style="color:var(--success)" id="sc">Sorted: 0/12</span><span style="color:var(--dim)" id="att">Mistakes: 0</span></div>
  <div id="pa"></div>
  <div class="buckets">
    <div class="bucket" id="b0" onclick="placeTo(0)"><div class="bucket-title" style="color:#E05555">Prefixes</div><div class="bucket-items" id="bi0"></div></div>
    <div class="bucket" id="b1" onclick="placeTo(1)"><div class="bucket-title" style="color:#1A8A7D">Roots</div><div class="bucket-items" id="bi1"></div></div>
    <div class="bucket" id="b2" onclick="placeTo(2)"><div class="bucket-title" style="color:#5B8CDB">Suffixes</div><div class="bucket-items" id="bi2"></div></div>
  </div>
  <div id="fba"></div>
  <div class="ctrls"><button class="btn btn-outline" onclick="init()">Reset</button></div>
</div>
<script>
const ITEMS=[
  {t:"Hemo-",b:0},{t:"Hypo-",b:0},{t:"Hyper-",b:0},{t:"Anti-",b:0},
  {t:"Phleb/o",b:1},{t:"Erythr/o",b:1},{t:"Thromb/o",b:1},{t:"Ven/i",b:1},
  {t:"-lysis",b:2},{t:"-itis",b:2},{t:"-emia",b:2},{t:"-otomy",b:2},
];
const BCOLS=["#E05555","#1A8A7D","#5B8CDB"];
let pool,placed,selected,mistakes;
function shuffle(a){return[...a].sort(()=>Math.random()-.5);}
function init(){pool=shuffle([...ITEMS]);placed=[[],[],[]];selected=null;mistakes=0;render();}
function render(){
  document.getElementById('sc').textContent=`Sorted: ${placed[0].length+placed[1].length+placed[2].length}/${ITEMS.length}`;
  document.getElementById('att').textContent=`Mistakes: ${mistakes}`;
  let ph='';
  if(pool.length){ph='<div class="pool-lbl">Word Parts to Sort</div><div class="chips">';
    pool.forEach((item,i)=>{let cls='chip';if(selected===i)cls+=' selected';ph+=`<div class="${cls}" onclick="sel(${i})">${item.t}</div>`;});ph+='</div>';}
  else{ph='<div class="pool-lbl">All items sorted!</div>';}
  document.getElementById('pa').innerHTML=ph;
  [0,1,2].forEach(b=>{
    let bh='';placed[b].forEach(item=>{bh+=`<div class="b-tag" style="background:${BCOLS[b]}15;color:${BCOLS[b]}">${item.t}</div>`;});
    document.getElementById('bi'+b).innerHTML=bh||`<span style="font-family:Manrope,sans-serif;font-size:11px;color:var(--dim);font-variant:normal">Drop here</span>`;
  });
  [0,1,2].forEach(b=>{document.getElementById('b'+b).classList.toggle('highlight',selected!==null);});
  if(pool.length===0){
    document.getElementById('fba').innerHTML=`<div class="fb" style="background:rgba(56,201,122,.06);border:1px solid rgba(56,201,122,.2);color:var(--success)"><strong>All sorted!</strong> ${mistakes===0?'Perfect!':'Completed with '+mistakes+' mistake'+(mistakes>1?'s':'')+'.'}</div>`;
  }else{document.getElementById('fba').innerHTML='';}
}
function sel(i){selected=selected===i?null:i;render();}
function placeTo(b){
  if(selected===null)return;
  const item=pool[selected];
  if(item.b===b){placed[b].push(item);pool.splice(selected,1);selected=null;render();}
  else{mistakes++;const chips=document.querySelectorAll('.chip');if(chips[selected]){chips[selected].classList.add('wrong');setTimeout(()=>{chips[selected]?.classList.remove('wrong');},600);}selected=null;render();}
}
init();
</script>
</body>
</html>
