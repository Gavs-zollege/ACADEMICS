<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lab Ops — Activity 7: Fill in the Blanks</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&family=Public+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#090D18;--card:#10162A;--surface:#181F38;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7088;--success:#38C97A;--error:#E05555;--border:#1E2848;}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{min-height:100vh;background:radial-gradient(ellipse at 60% 20%,#131A30,var(--bg));font-family:'EB Garamond',serif;color:var(--text);}
  .wrap{max-width:560px;margin:0 auto;padding:40px 20px;}
  .header{text-align:center;margin-bottom:32px;}
  .label{font-size:11px;letter-spacing:4px;color:var(--teal);text-transform:uppercase;font-family:'Public Sans',sans-serif;font-weight:600;margin-bottom:8px;}
  h1{font-size:34px;color:var(--gold);}
  .sub{font-family:'Public Sans',sans-serif;color:var(--dim);font-size:14px;margin-top:8px;}
  .prog-row{display:flex;align-items:center;gap:12px;margin-bottom:28px;}
  .prog-text{font-family:'Public Sans',sans-serif;font-size:13px;color:var(--dim);}
  .prog-bar{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden;}
  .prog-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .4s;}
  .score-text{color:var(--success);}
  .s-card{background:var(--card);border-radius:14px;padding:32px 24px;border:1px solid var(--border);margin-bottom:20px;}
  .sentence{font-size:20px;line-height:1.7;}
  .blank{display:inline-block;min-width:120px;border-bottom:2px dashed var(--gold);font-weight:600;padding:0 4px;margin:0 4px;}
  .input-row{display:flex;gap:10px;margin-bottom:16px;}
  #ai{flex:1;padding:14px 18px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:16px;font-family:'Public Sans',sans-serif;outline:none;}
  #ai:focus{border-color:var(--teal);}
  .btn{padding:14px 24px;border-radius:10px;border:none;background:var(--gold);color:var(--bg);font-size:15px;font-weight:600;font-family:'Public Sans',sans-serif;cursor:pointer;white-space:nowrap;}
  .hint-link{background:transparent;border:none;color:var(--dim);font-size:13px;font-family:'Public Sans',sans-serif;cursor:pointer;text-decoration:underline;}
  .hint-text{color:var(--teal);font-size:13px;font-family:'Public Sans',sans-serif;margin-top:6px;}
  .feedback{text-align:center;padding:12px 16px;border-radius:10px;font-family:'Public Sans',sans-serif;font-size:15px;font-weight:600;}
  .results{text-align:center;padding:40px;}
  .res-score{font-size:56px;font-weight:700;color:var(--gold);}
  .res-msg{font-size:16px;font-family:'Public Sans',sans-serif;margin:8px 0 32px;}
  .btn-retry{padding:14px 40px;border-radius:10px;border:none;background:var(--teal);color:var(--text);font-size:16px;font-family:inherit;cursor:pointer;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <div class="label">Activity 7 of 10</div>
    <h1>Fill in the Blanks</h1>
    <p class="sub">Type the missing term to complete each statement.</p>
  </div>
  <div id="game">
    <div class="prog-row">
      <span class="prog-text" id="pp">1/12</span>
      <div class="prog-bar"><div class="prog-fill" id="pf"></div></div>
      <span class="prog-text score-text" id="st">0✓</span>
    </div>
    <div class="s-card" id="sc"></div>
    <div class="input-row"><input type="text" id="ai" placeholder="Type your answer..." autocomplete="off"><button class="btn" id="ab" onclick="doAction()">Check</button></div>
    <div style="text-align:center" id="ha"></div>
    <div id="fa" style="margin-top:12px"></div>
  </div>
  <div id="results" class="results" style="display:none"></div>
</div>
<script>
const QS=[
  {s:"___ specimens require immediate collection, correct labeling, and rapid transport.",a:"stat",h:"Highest priority order type"},
  {s:"Most laboratory errors occur in the ___-analytical phase.",a:"pre",h:"Before testing begins (3 letters)"},
  {s:"The process of receiving and barcoding a specimen in the lab is called ___.",a:"accessioning",h:"Starts with 'A'"},
  {s:"___ is the destruction of red blood cells, often from improper collection.",a:"hemolysis",h:"Starts with 'H'"},
  {s:"The ___ tracks orders, specimen status, results, and timestamps.",a:"lis",h:"Laboratory Information System (abbreviation)"},
  {s:"Critical values indicate ___-threatening conditions.",a:"life",h:"4 letters"},
  {s:"Chain of ___ documentation is required for drug screens and forensic specimens.",a:"custody",h:"Starts with 'C' — continuous tracking"},
  {s:"Specimens may be rejected due to mislabeling, clotting, hemolysis, or expired collection ___.",a:"time",h:"4 letters"},
  {s:"Phlebotomists do not ___ lab results.",a:"interpret",h:"Starts with 'I' — to explain the meaning of"},
  {s:"The ___ is the patient's digital chart, linked to the LIS via accurate data entry.",a:"emr",h:"Electronic Medical Record (abbreviation)"},
  {s:"___ orders must be collected at specific times, such as for peak/trough drug levels.",a:"timed",h:"Starts with 'T'"},
  {s:"Workflow errors can lead to delayed diagnosis and legal ___.",a:"liability",h:"Starts with 'L' — legal responsibility"},
];
let idx=0,result=null,score=0,showHint=false;
function render(){
  const q=QS[idx];document.getElementById('pp').textContent=`${idx+1}/${QS.length}`;
  document.getElementById('pf').style.width=`${(idx+1)/QS.length*100}%`;
  document.getElementById('st').textContent=`${score}✓`;
  const parts=q.s.split('___');let blankCol=result===null?'var(--gold)':result?'var(--success)':'var(--error)';
  let blankText=result!==null?(result?document.getElementById('ai').value:q.a):'___';
  document.getElementById('sc').innerHTML=`<div class="sentence">${parts[0]}<span class="blank" style="border-color:${blankCol};color:${blankCol}">${blankText}</span>${parts[1]||''}</div>`;
  const inp=document.getElementById('ai'),btn=document.getElementById('ab');
  if(result!==null){inp.disabled=true;inp.style.borderColor=result?'var(--success)':'var(--error)';btn.textContent=idx+1>=QS.length?'Results':'Next →';}
  else{inp.disabled=false;inp.style.borderColor='var(--border)';btn.textContent='Check';}
  if(result===null){document.getElementById('ha').innerHTML=showHint?`<button class="hint-link" onclick="toggleH()">Hide hint</button><div class="hint-text">${q.h}</div>`:`<button class="hint-link" onclick="toggleH()">Need a hint?</button>`;}
  else{document.getElementById('ha').innerHTML='';}
  if(result!==null){const col=result?'var(--success)':'var(--error)';const bg=result?'rgba(56,201,122,.06)':'rgba(224,85,85,.06)';const bc=result?'rgba(56,201,122,.2)':'rgba(224,85,85,.2)';
    document.getElementById('fa').innerHTML=`<div class="feedback" style="background:${bg};border:1px solid ${bc};color:${col}">${result?'Correct!':'Answer: '+q.a}</div>`;}
  else{document.getElementById('fa').innerHTML='';}
}
function doAction(){
  if(result!==null){if(idx+1>=QS.length){showResults();return;}idx++;result=null;showHint=false;document.getElementById('ai').value='';render();document.getElementById('ai').focus();return;}
  const v=document.getElementById('ai').value.trim();if(!v)return;
  result=v.toLowerCase()===QS[idx].a.toLowerCase();if(result)score++;render();
}
function toggleH(){showHint=!showHint;render();}
function showResults(){document.getElementById('game').style.display='none';const r=document.getElementById('results');r.style.display='block';
  const pct=score/QS.length*100;const col=pct>=80?'var(--success)':pct>=60?'var(--gold)':'var(--error)';
  const msg=pct>=80?"Excellent recall!":pct>=60?"Good — practice the ones you missed.":"Review the material and try again.";
  r.innerHTML=`<div class="res-score">${score}/${QS.length}</div><div class="res-msg" style="color:${col}">${msg}</div><button class="btn-retry" onclick="reset()">Try Again</button>`;}
function reset(){idx=0;result=null;score=0;showHint=false;document.getElementById('ai').value='';document.getElementById('game').style.display='block';document.getElementById('results').style.display='none';render();document.getElementById('ai').focus();}
document.getElementById('ai').addEventListener('keydown',e=>{if(e.key==='Enter')doAction();});
render();
</script>
</body>
</html>
