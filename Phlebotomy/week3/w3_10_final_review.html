<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pre-Draw Procedures — Final Review</title>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:wght@400;600;700&family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#080C14;--card:#0F1526;--surface:#171E36;--teal:#1A8A7D;--gold:#E2B94C;--text:#ECE8E0;--dim:#6A7098;--success:#38C97A;--error:#E05555;--border:#1E2848;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;}
  body{background:linear-gradient(180deg,var(--bg),#0C1020);font-family:'Gelasio',serif;color:var(--text);}

  .app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:680px;margin:0 auto;padding:16px 20px;overflow:hidden;}

  .header{text-align:center;flex-shrink:0;padding-bottom:10px;}
  h1{font-size:34px;color:var(--gold);line-height:1.2;}
  .sub{font-family:'Lexend',sans-serif;color:var(--dim);font-size:14px;margin-top:6px;line-height:1.5;}

  .prog-box{background:var(--card);border-radius:12px;padding:14px 18px;border:1px solid var(--border);margin-bottom:14px;display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .prog-ring{position:relative;width:52px;height:52px;flex-shrink:0;}
  .prog-ring svg{transform:rotate(-90deg);}
  .prog-ring .bg{stroke:var(--border);stroke-width:5;fill:none;}
  .prog-ring .fg{stroke:var(--success);stroke-width:5;fill:none;stroke-linecap:round;transition:stroke-dashoffset .5s;}
  .prog-pct{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-family:'Lexend',sans-serif;font-size:14px;font-weight:700;color:var(--success);}
  .prog-info{flex:1;}
  .prog-label{font-family:'Lexend',sans-serif;font-size:14px;font-weight:600;}
  .prog-detail{font-family:'Lexend',sans-serif;font-size:13px;color:var(--dim);margin-top:2px;}

  .page-content{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;overflow:hidden;}

  .topic{background:var(--card);border-radius:12px;border:1px solid var(--border);overflow:hidden;transition:all .3s;}
  .topic.open{border-color:rgba(26,138,125,.3);}
  .topic-head{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .2s;}
  .topic-head:hover{background:var(--surface);}
  .topic-check{width:26px;height:26px;border-radius:7px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:13px;cursor:pointer;transition:all .2s;flex-shrink:0;font-family:'Lexend',sans-serif;}
  .topic-check.done{background:var(--success);border-color:var(--success);color:var(--bg);}
  .topic-icon{font-size:20px;flex-shrink:0;}
  .topic-title{flex:1;font-size:18px;font-weight:700;}
  .topic-arrow{color:var(--dim);font-size:14px;transition:transform .3s;font-family:'Lexend',sans-serif;}
  .topic.open .topic-arrow{transform:rotate(180deg);}
  .topic-body{max-height:0;overflow:hidden;transition:max-height .4s ease;}
  .topic.open .topic-body{max-height:600px;}
  .topic-content{padding:0 18px 16px;padding-left:56px;}
  .point{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px;}
  .point-dot{width:6px;height:6px;border-radius:50%;margin-top:8px;flex-shrink:0;}
  .point-text{font-family:'Lexend',sans-serif;font-size:14px;line-height:1.6;color:var(--dim);}
  .point-text strong{color:var(--text);font-weight:600;}
  .key-concept{margin-top:10px;padding:10px 14px;border-radius:8px;background:rgba(226,185,76,.06);border-left:3px solid var(--gold);font-family:'Lexend',sans-serif;font-size:13px;color:var(--gold);line-height:1.5;}

  .done-banner{text-align:center;padding:20px;background:rgba(56,201,122,.06);border-radius:12px;border:1px solid rgba(56,201,122,.2);}
  .done-banner h2{font-size:22px;color:var(--success);}
  .done-banner p{font-family:'Lexend',sans-serif;color:var(--dim);font-size:14px;margin-top:4px;}

  .footer{flex-shrink:0;padding-top:14px;display:flex;flex-direction:column;gap:10px;}
  .page-nav{display:flex;align-items:center;justify-content:center;gap:12px;font-family:'Lexend',sans-serif;}
  .nav-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--dim);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
  .nav-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
  .nav-btn:disabled{opacity:.25;cursor:default;}
  .page-dots{display:flex;gap:6px;align-items:center;}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .25s;cursor:pointer;}
  .dot.active{background:var(--gold);width:22px;border-radius:4px;}
  .dot:hover:not(.active){background:var(--dim);}
  .page-label{font-size:13px;color:var(--dim);text-align:center;font-family:'Lexend',sans-serif;}
  .btn-reset{padding:8px 20px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:13px;font-family:'Lexend',sans-serif;cursor:pointer;transition:all .2s;align-self:center;}
  .btn-reset:hover{border-color:var(--teal);color:var(--text);}

  @keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  .page-content .topic,.page-content .done-banner{animation:fadeIn .3s ease both;}
  .page-content .topic:nth-child(2){animation-delay:.05s;}
  .page-content .topic:nth-child(3){animation-delay:.1s;}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>Final Review</h1>
    <p class="sub">Expand each topic to review key points. Check off topics as you master them.</p>
  </div>
  <div class="prog-box">
    <div class="prog-ring">
      <svg width="52" height="52" viewBox="0 0 56 56"><circle class="bg" cx="28" cy="28" r="24"/><circle class="fg" id="ring" cx="28" cy="28" r="24" stroke-dasharray="150.8" stroke-dashoffset="150.8"/></svg>
      <div class="prog-pct" id="pct">0%</div>
    </div>
    <div class="prog-info"><div class="prog-label" id="plbl">0 of 8 topics reviewed</div><div class="prog-detail">Check off each topic as you master it</div></div>
  </div>
  <div class="page-content" id="pageContent"></div>
  <div class="footer">
    <div class="page-nav">
      <button class="nav-btn" id="prevBtn" onclick="goPage(currentPage-1)">‹</button>
      <div class="page-dots" id="pageDots"></div>
      <button class="nav-btn" id="nextBtn" onclick="goPage(currentPage+1)">›</button>
    </div>
    <div class="page-label" id="pageLabel"></div>
    <button class="btn-reset" onclick="resetAll()">Reset Progress</button>
  </div>
</div>
<script>
const T=[
  {icon:"🎯",title:"Importance of Pre-Draw Procedures",color:"#5B8CDB",points:[
    {t:"<strong>Prevents specimen errors</strong> — most lab errors occur before the needle enters the skin"},
    {t:"<strong>Ensures patient safety</strong> — proper preparation protects patients from harm"},
    {t:"<strong>Improves collection success</strong> — well-prepared draws have higher first-attempt success"},
    {t:"<strong>Reduces redraws</strong> — fewer errors means fewer repeat collections for patients"},
  ],concept:"Key Concept: Professionalism begins before the draw. Preparation prevents errors and safe practice protects everyone."},
  {icon:"🪪",title:"Patient Identification",color:"#E2B94C",points:[
    {t:"<strong>Two identifiers required</strong> — full name AND date of birth, every single time"},
    {t:"<strong>Match patient to requisition</strong> — verify all info matches the lab order"},
    {t:"<strong>Never rely on room number</strong> — patients can be moved or switched"},
    {t:"<strong>Patient must STATE identifiers</strong> — don't ask yes/no questions; use open-ended: 'Tell me your name and date of birth'"},
  ],concept:"If a patient answers 'yes' to a wrong name: STOP, re-verify with open-ended questions, document the near-miss."},
  {icon:"📋",title:"Requisition Review",color:"#8B6AAE",points:[
    {t:"<strong>Verify test orders</strong> — confirm which tests are requested"},
    {t:"<strong>Check patient information</strong> — name, DOB, ID number must all match"},
    {t:"<strong>Identify special requirements</strong> — fasting (8–12 hours), STAT, timed draws"},
    {t:"<strong>Confirm correct tubes and additives</strong> — each test requires specific tube types"},
  ],concept:"The requisition is your roadmap. Errors here cascade into wrong tubes, wrong tests, and rejected specimens."},
  {icon:"🧰",title:"Supply & Equipment Selection",color:"#E8976A",points:[
    {t:"<strong>Correct needle/gauge</strong> — selected based on vein size and patient population (butterfly for small/fragile veins)"},
    {t:"<strong>Collection tubes</strong> — match to requisition; check expiration dates before use"},
    {t:"<strong>Tourniquet, alcohol prep, gauze, bandage</strong> — all within reach before starting"},
    {t:"<strong>Sharps container</strong> — must be within arm's reach for immediate needle disposal"},
  ],concept:"Never start a draw without all supplies gathered and checked. Reaching mid-draw creates contamination and safety risks."},
  {icon:"🔗",title:"Tourniquet Placement & Removal",color:"#E05555",points:[
    {t:"<strong>Place 3–4 inches above</strong> the intended venipuncture site"},
    {t:"<strong>Snug but not painful</strong> — should restrict venous flow without arterial occlusion"},
    {t:"<strong>Maximum 1 minute</strong> — longer causes hemoconcentration and falsely elevated values"},
    {t:"<strong>Remove once blood flows</strong> — release before removing the last tube"},
    {t:"<strong>No excessive fist pumping</strong> — can falsely elevate potassium and other electrolytes"},
  ],concept:"A tourniquet left on too long is one of the most common pre-analytical errors."},
  {icon:"🔍",title:"Site Assessment & Preparation",color:"#1A8A7D",points:[
    {t:"<strong>Palpation > sight</strong> — feel for depth, direction, and resilience with your fingertip"},
    {t:"<strong>Avoid compromised sites</strong> — mastectomy side, IV sites, burns, scars, edema, hematomas"},
    {t:"<strong>Clean with 70% isopropyl alcohol</strong> — use concentric circles moving outward"},
    {t:"<strong>Air dry completely</strong> — do NOT blow, fan, or touch the site after cleaning"},
  ],concept:"Touching the site after cleaning contaminates it. If you touch it, you must clean it again."},
  {icon:"🧤",title:"Hand Hygiene & PPE",color:"#38C97A",points:[
    {t:"<strong>Hand hygiene before AND after</strong> every patient contact — most important infection prevention step"},
    {t:"<strong>Gloves for ALL blood draws</strong> — no exceptions, even for 'quick' draws"},
    {t:"<strong>Change gloves between patients</strong> — even if they appear clean"},
  ],concept:"Hand hygiene is the #1 way to prevent healthcare-associated infections. Before AND after — always."},
  {icon:"✅",title:"Pre-Draw Safety Check & Common Errors",color:"#D47AB5",points:[
    {t:"<strong>Re-confirm patient identity</strong> — yes, a second time, right before the needle"},
    {t:"<strong>Supplies ready</strong> — tubes in order, needle assembled, sharps container positioned"},
    {t:"<strong>Patient comfort assessed</strong> — seated/reclined, arm supported, no signs of anxiety"},
    {t:"<strong>Order of draw verified</strong> — correct tube sequence to prevent additive cross-contamination"},
    {t:"<strong>Common errors to avoid:</strong> skipping patient ID, wrong tube selection, improper tourniquet use, inadequate site cleaning"},
  ],concept:"The final safety check is your last chance to catch errors before the needle enters the skin. Never skip it."},
];

const PAGES=[
  {topics:[0,1,2], label:"Prep, ID & Requisition"},
  {topics:[3,4,5], label:"Supplies, Tourniquet & Site"},
  {topics:[6,7], label:"Hygiene, Safety & Review"},
];

let checked=new Set(), openIdx=-1, currentPage=0;

function render(){
  const n=checked.size, total=T.length, pct=Math.round(n/total*100);
  const circ=150.8;
  document.getElementById('ring').style.strokeDashoffset=circ-(circ*pct/100);
  document.getElementById('pct').textContent=pct+'%';
  document.getElementById('plbl').textContent=`${n} of ${total} topics reviewed`;

  const page=PAGES[currentPage];
  let h='';
  page.topics.forEach(i=>{
    const t=T[i], isOpen=openIdx===i, isDone=checked.has(i);
    h+=`<div class="topic ${isOpen?'open':''}">
      <div class="topic-head" onclick="tog(${i})">
        <div class="topic-check ${isDone?'done':''}" onclick="event.stopPropagation();chk(${i})">${isDone?'✓':''}</div>
        <span class="topic-icon">${t.icon}</span>
        <span class="topic-title" style="${isDone?'color:var(--success)':''}">${t.title}</span>
        <span class="topic-arrow">▾</span>
      </div>
      <div class="topic-body"><div class="topic-content">
        ${t.points.map(p=>`<div class="point"><div class="point-dot" style="background:${t.color}"></div><div class="point-text">${p.t}</div></div>`).join('')}
        ${t.concept?`<div class="key-concept">${t.concept}</div>`:''}
      </div></div>
    </div>`;
  });

  if(currentPage===PAGES.length-1 && n===total){
    h+=`<div class="done-banner" style="display:block"><h2>Review Complete!</h2><p>You've covered all 8 pre-draw topics. You're ready for the exam!</p></div>`;
  }

  document.getElementById('pageContent').innerHTML=h;

  document.getElementById('prevBtn').disabled=currentPage===0;
  document.getElementById('nextBtn').disabled=currentPage===PAGES.length-1;

  let dots='';
  PAGES.forEach((_,i)=>{
    dots+=`<div class="dot ${i===currentPage?'active':''}" onclick="goPage(${i})"></div>`;
  });
  document.getElementById('pageDots').innerHTML=dots;
  document.getElementById('pageLabel').textContent=`${page.label} · Page ${currentPage+1} of ${PAGES.length}`;
}

function goPage(p){
  if(p<0||p>=PAGES.length) return;
  openIdx=-1;
  currentPage=p;
  render();
}

function tog(i){openIdx=openIdx===i?-1:i;render();}
function chk(i){checked.has(i)?checked.delete(i):checked.add(i);render();}
function resetAll(){checked.clear();openIdx=-1;currentPage=0;render();}

render();
</script>
</body>
</html>
