<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 9 — Clinical Scenarios</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--green:#27ae60;--green-light:#2ecc71;--yellow:#f39c12;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;--radius:16px;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 20px 60px;}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:640px;margin:0 auto;}
header{text-align:center;padding:48px 0 28px;}
header .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:3px;color:var(--red-light);font-weight:700;margin-bottom:10px;}
header h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{color:var(--dim);font-size:.88rem;margin-top:8px;}
.progress{width:100%;height:4px;background:var(--border);border-radius:2px;margin-bottom:28px;overflow:hidden;}
.progress-fill{height:100%;background:var(--red);transition:width .5s;border-radius:2px;}
.scenario{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.sc-label{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--yellow);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sc-label::before{content:'🏥';}
.sc-text{font-size:.98rem;line-height:1.65;margin-bottom:16px;color:var(--text);font-weight:500;padding:16px;background:linear-gradient(135deg,var(--surface2),rgba(243,156,18,.03));border-radius:10px;border-left:3px solid var(--yellow);}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;font-size:.88rem;transition:all .2s;line-height:1.4;}
.opt:hover{border-color:var(--red);background:rgba(192,57,43,.06);}
.opt.correct{border-color:var(--green);background:rgba(39,174,96,.12);color:var(--green-light);}
.opt.wrong{border-color:var(--red);background:rgba(192,57,43,.12);color:var(--red-light);opacity:.6;}
.opt.disabled{pointer-events:none;}
.explain{margin-top:12px;font-size:.82rem;color:var(--dim);padding:14px;background:rgba(255,255,255,.02);border-radius:8px;border-left:3px solid var(--green);line-height:1.5;animation:fadeIn .3s ease;}
.score-card{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;margin-top:20px;animation:fadeIn .5s ease;}
.score-num{font-family:'Playfair Display',serif;font-size:4rem;font-weight:900;color:var(--green-light);}
.score-label{color:var(--dim);font-size:.9rem;margin-top:4px;}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
<header>
  <div class="tag">Activity 9 of 10</div>
  <h1>Clinical Scenarios</h1>
  <p>Read each real-world situation and choose the best course of action.</p>
</header>
<div class="progress"><div class="progress-fill" id="prog"></div></div>
<div id="list"></div>
<div id="score"></div>
</div>

<script>
const scenarios=[
  {scenario:"You're about to draw blood from Mrs. Johnson. You notice the lavender-top tubes in your tray expired last month. What do you do?",
   opts:["Use them anyway since they look fine","Replace them with non-expired tubes before proceeding","Draw blood in a red-top tube instead","Ask the patient if she minds expired tubes"],correct:1,
   explain:"Expired tubes may have degraded additives. Always verify expiration dates and replace any expired supplies before collection."},
  {scenario:"During a blood draw, your patient suddenly becomes pale, sweaty, and says they feel dizzy. What is your immediate action?",
   opts:["Tell them to look away and keep drawing","Remove the needle, apply pressure, and have the patient lie down","Call a code blue","Give them water while continuing the draw"],correct:1,
   explain:"These are signs of syncope. Stop the procedure, remove the needle safely, apply pressure, and position the patient to prevent injury."},
  {scenario:"You need to collect a CBC and a coagulation panel. Which tube do you fill first?",
   opts:["Lavender (EDTA) for CBC","Light blue for coagulation","It doesn't matter","Red top first"],correct:1,
   explain:"Per order of draw, light blue (coagulation) is drawn before lavender (EDTA)."},
  {scenario:"After inserting the needle, you notice swelling forming at the puncture site. What complication is this, and what should you do?",
   opts:["Hemolysis — push the needle deeper","Hematoma — stop collection and apply pressure","Normal — continue the draw","Infection — apply antibiotic"],correct:1,
   explain:"Swelling at the site indicates a hematoma. Stop the collection immediately and apply firm pressure."},
  {scenario:"You are performing a capillary collection on a pediatric patient's finger. After puncturing, what should you do with the first drop of blood?",
   opts:["Collect it immediately in the tube","Wipe it away with gauze","Let it air dry","Use it for a glucose reading"],correct:1,
   explain:"The first drop may contain tissue fluid and should be wiped away to ensure an accurate specimen."},
  {scenario:"A patient tells you they have a mastectomy on their left side. Which arm should you use for the blood draw?",
   opts:["Left arm — it's closer","Either arm is fine","Right arm — avoid the mastectomy side","Ask the patient which arm they prefer"],correct:2,
   explain:"Blood draws should not be performed on the same side as a mastectomy due to risk of lymphedema. Use the opposite arm."},
  {scenario:"While drawing blood, the patient reports a sharp, shooting pain down their arm. What should you do?",
   opts:["Continue — some pain is normal","Reposition the needle slightly","Immediately stop and withdraw the needle","Apply more pressure with the tourniquet"],correct:2,
   explain:"Shooting pain suggests a nerve may have been contacted. Stop immediately to prevent nerve injury."},
];
let score=0,answered=0;
document.getElementById('list').innerHTML=scenarios.map((s,si)=>`
  <div class="scenario" id="sc-${si}"><div class="sc-label">Scenario ${si+1} of ${scenarios.length}</div>
  <div class="sc-text">${s.scenario}</div>
  <div class="opts" id="opts-${si}">${s.opts.map((o,oi)=>`<div class="opt" onclick="pick(${si},${oi})">${o}</div>`).join('')}</div></div>
`).join('');

function pick(si,oi){
  const opts=document.querySelectorAll(`#opts-${si} .opt`);
  if(opts[0].classList.contains('disabled'))return;
  opts.forEach((o,i)=>{o.classList.add('disabled');if(i===scenarios[si].correct)o.classList.add('correct');else if(i===oi)o.classList.add('wrong');});
  if(oi===scenarios[si].correct)score++;
  answered++;
  const exp=document.createElement('div');exp.className='explain';exp.textContent=scenarios[si].explain;
  document.getElementById(`sc-${si}`).appendChild(exp);
  document.getElementById('prog').style.width=`${(answered/scenarios.length)*100}%`;
  if(answered===scenarios.length){
    document.getElementById('score').innerHTML=`<div class="score-card"><div class="score-num">${score}/${scenarios.length}</div><div class="score-label">Scenarios handled correctly</div></div>`;
  }
}
</script>
</body>
</html>
