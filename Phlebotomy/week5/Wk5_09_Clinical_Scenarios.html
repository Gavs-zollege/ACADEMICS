<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 9 — Clinical Scenarios</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--green:#27ae60;--green-light:#2ecc71;--yellow:#f39c12;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;--radius:16px;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:640px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100vh;padding:0 20px;overflow:hidden;}
header{text-align:center;padding:20px 0 12px;flex-shrink:0;}
header .week{font-size:.55rem;text-transform:uppercase;letter-spacing:3px;color:var(--muted);font-weight:700;margin-bottom:2px;}
header .tag{font-size:.6rem;text-transform:uppercase;letter-spacing:3px;color:var(--red-light);font-weight:700;margin-bottom:6px;}
header h1{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{color:var(--dim);font-size:.78rem;margin-top:4px;}
.progress{width:100%;height:4px;background:var(--border);border-radius:2px;margin-bottom:12px;overflow:hidden;flex-shrink:0;}
.progress-fill{height:100%;background:var(--red);transition:width .5s;border-radius:2px;}
.card-area{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;}
.scenario{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;display:none;flex-direction:column;animation:fadeIn .4s ease;flex:1;min-height:0;overflow-y:auto;}
.scenario.active{display:flex;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.sc-label{font-size:.65rem;text-transform:uppercase;letter-spacing:2px;color:var(--yellow);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;flex-shrink:0;}
.sc-label::before{content:'🏥';}
.sc-text{font-size:.85rem;line-height:1.55;margin-bottom:12px;color:var(--text);font-weight:500;padding:12px;background:linear-gradient(135deg,var(--surface2),rgba(243,156,18,.03));border-radius:10px;border-left:3px solid var(--yellow);flex-shrink:0;}
.opts{display:flex;flex-direction:column;gap:8px;flex-shrink:0;}
.opt{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;cursor:pointer;font-size:.8rem;transition:all .2s;line-height:1.4;}
.opt:hover{border-color:var(--red);background:rgba(192,57,43,.06);}
.opt.correct{border-color:var(--green);background:rgba(39,174,96,.12);color:var(--green-light);}
.opt.wrong{border-color:var(--red);background:rgba(192,57,43,.12);color:var(--red-light);opacity:.6;}
.opt.disabled{pointer-events:none;}
.explain{margin-top:10px;font-size:.76rem;color:var(--dim);padding:10px;background:rgba(255,255,255,.02);border-radius:8px;border-left:3px solid var(--green);line-height:1.45;animation:fadeIn .3s ease;flex-shrink:0;}
.next-btn{margin-top:10px;padding:10px 24px;background:var(--red);color:#fff;border:none;border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;align-self:flex-end;transition:background .2s;flex-shrink:0;}
.next-btn:hover{background:var(--red-light);}
.score-card{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;animation:fadeIn .5s ease;display:none;flex-direction:column;align-items:center;justify-content:center;flex:1;}
.score-card.active{display:flex;}
.score-num{font-family:'Playfair Display',serif;font-size:4rem;font-weight:900;color:var(--green-light);}
.score-label{color:var(--dim);font-size:.9rem;margin-top:4px;}
.restart-btn{margin-top:20px;padding:10px 28px;background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:10px;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .2s;}
.restart-btn:hover{border-color:var(--red);background:rgba(192,57,43,.06);}
.nav-footer{flex-shrink:0;padding:10px 0 14px;display:flex;justify-content:center;gap:6px;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--border);transition:all .3s;}
.dot.active{background:var(--red);}
.dot.done{background:var(--green);}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
<header>
  <div class="week">Week 5 — Special Blood Collections</div>
  <div class="tag">Activity 9 of 10</div>
  <h1>Clinical Scenarios</h1>
  <p>Read each advanced phlebotomy situation and choose the best action.</p>
</header>
<div class="progress"><div class="progress-fill" id="prog"></div></div>
<div class="card-area" id="cardArea"></div>
<div class="nav-footer" id="dots"></div>
</div>
<script>
const scenarios=[
  {scenario:"A physician orders blood cultures on a febrile patient. The nurse tells you the patient just received their first dose of IV antibiotics 20 minutes ago. What should you document?",
   opts:["Nothing — proceed normally","Note that antibiotics were already administered before collection","Refuse to draw the cultures","Wait 24 hours for the antibiotic to clear"],correct:1,
   explain:"Ideally cultures are collected before antibiotics, but if they've been given, you must document the timing. The lab and physician need this information to interpret results."},
  {scenario:"You're preparing a blood smear and notice small clots forming in the EDTA tube. What should you do?",
   opts:["Use the sample anyway — clots are normal","Remix the tube vigorously to dissolve the clots","Discard the sample and recollect properly","Strain out the clots and prepare the smear"],correct:2,
   explain:"Clotted EDTA blood produces unreliable smears with distorted cell morphology. A new specimen must be collected and properly inverted."},
  {scenario:"You're collecting a urine specimen for drug screening at an employer's request. The patient hands you the cup without you witnessing the collection. What do you do?",
   opts:["Accept it and label it","Request a witnessed recollection per chain of custody protocol","Test it on the spot for temperature","Call the employer for instructions"],correct:1,
   explain:"Chain of custody requires proper witnessing and documentation. An unwitnessed specimen compromises the legal validity of the test."},
  {scenario:"In the NICU, you need to draw blood from a 2 kg premature infant. The orders call for a CBC, CMP, and blood gas. How do you minimize risk?",
   opts:["Use standard adult tubes for efficiency","Use microtainers, batch tests if possible, and log the draw volume","Draw from the umbilical line only","Skip the blood gas since it's least important"],correct:1,
   explain:"To prevent iatrogenic anemia, use microtainers (0.5–1 mL), consolidate tests when possible, and keep a running draw log. Total volume must not exceed 3% of blood volume in 24 hours."},
  {scenario:"You're performing a newborn heel stick for IEM screening. After puncturing, the blood won't flow well. What's your best action?",
   opts:["Squeeze the heel firmly to force blood out","Rewarm the heel and allow gentle flow without squeezing","Puncture the center of the heel for better flow","Switch to a finger stick instead"],correct:1,
   explain:"Rewarm the heel to improve circulation. Excessive squeezing can cause hemolysis and tissue fluid contamination. Never puncture the heel center."},
  {scenario:"A blood donor becomes pale, sweaty, and dizzy during a whole blood donation at 350 mL collected. What is your priority?",
   opts:["Continue collecting to reach 450 mL","Stop collection, lower the donor's head, and monitor vitals","Immediately remove the needle and have them stand up","Give them juice while continuing the draw"],correct:1,
   explain:"These are signs of vasovagal syncope. Stop collection immediately, position the donor safely (lower head or raise legs), and monitor vitals."},
  {scenario:"A patient's sputum specimen arrives at the lab and appears watery and clear. The lab rejects it. Why?",
   opts:["It was collected in the wrong container","The specimen is likely saliva, not true sputum from the lungs","Sputum must be refrigerated before transport","Clear sputum always indicates the patient is healthy"],correct:1,
   explain:"True sputum is thicker and may be colored; watery/clear specimens are usually saliva and are non-diagnostic. The patient needs re-education on proper deep-cough collection technique."},
];
let score=0,current=0;
const cardArea=document.getElementById('cardArea');
const dotsEl=document.getElementById('dots');

// Build dots
dotsEl.innerHTML=scenarios.map((_,i)=>`<div class="dot${i===0?' active':''}" id="dot-${i}"></div>`).join('');

// Build cards
scenarios.forEach((s,si)=>{
  const div=document.createElement('div');
  div.className='scenario'+(si===0?' active':'');
  div.id='sc-'+si;
  div.innerHTML=`<div class="sc-label">Scenario ${si+1} of ${scenarios.length}</div>
  <div class="sc-text">${s.scenario}</div>
  <div class="opts" id="opts-${si}">${s.opts.map((o,oi)=>`<div class="opt" onclick="pick(${si},${oi})">${o}</div>`).join('')}</div>`;
  cardArea.appendChild(div);
});

// Score card
const scoreCard=document.createElement('div');
scoreCard.className='score-card';
scoreCard.id='scoreCard';
cardArea.appendChild(scoreCard);

function pick(si,oi){
  const opts=document.querySelectorAll(`#opts-${si} .opt`);
  if(opts[0].classList.contains('disabled'))return;
  opts.forEach((o,i)=>{o.classList.add('disabled');if(i===scenarios[si].correct)o.classList.add('correct');else if(i===oi)o.classList.add('wrong');});
  if(oi===scenarios[si].correct)score++;

  // Explanation
  const exp=document.createElement('div');exp.className='explain';exp.textContent=scenarios[si].explain;
  document.getElementById('sc-'+si).appendChild(exp);

  // Update progress
  document.getElementById('prog').style.width=`${((si+1)/scenarios.length)*100}%`;
  document.getElementById('dot-'+si).classList.remove('active');
  document.getElementById('dot-'+si).classList.add('done');

  // Next button or show score
  if(si<scenarios.length-1){
    const btn=document.createElement('button');btn.className='next-btn';btn.textContent='Next →';
    btn.onclick=()=>goTo(si+1);
    document.getElementById('sc-'+si).appendChild(btn);
  } else {
    setTimeout(()=>showScore(),600);
  }
}

function goTo(idx){
  document.querySelectorAll('.scenario').forEach(s=>s.classList.remove('active'));
  document.getElementById('sc-'+idx).classList.add('active');
  document.getElementById('dot-'+idx).classList.add('active');
  current=idx;
}

function showScore(){
  document.querySelectorAll('.scenario').forEach(s=>s.classList.remove('active'));
  scoreCard.classList.add('active');
  scoreCard.innerHTML=`<div class="score-num">${score}/${scenarios.length}</div><div class="score-label">Scenarios handled correctly</div><button class="restart-btn" onclick="restart()">Try Again</button>`;
}

function restart(){
  score=0;current=0;
  document.getElementById('prog').style.width='0%';
  scenarios.forEach((_,i)=>{
    const sc=document.getElementById('sc-'+i);
    const expl=sc.querySelector('.explain');if(expl)expl.remove();
    const btn=sc.querySelector('.next-btn');if(btn)btn.remove();
    const opts=sc.querySelectorAll('.opt');
    opts.forEach(o=>{o.classList.remove('disabled','correct','wrong');});
    document.getElementById('dot-'+i).className='dot'+(i===0?' active':'');
  });
  scoreCard.classList.remove('active');
  document.getElementById('sc-0').classList.add('active');
}
</script>
</body>
</html>
