<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activity 9 — Clinical Scenarios</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--green:#27ae60;--green-light:#2ecc71;--yellow:#f39c12;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;--radius:16px;}
body{font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0 20px 60px;}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:640px;margin:0 auto;}
header{text-align:center;padding:48px 0 28px;}
header .week{font-size:.6rem;text-transform:uppercase;letter-spacing:3px;color:var(--muted);font-weight:700;margin-bottom:4px;}
header .tag{font-size:.7rem;text-transform:uppercase;letter-spacing:3px;color:var(--red-light);font-weight:700;margin-bottom:10px;}
header h1{font-family:'Playfair Display',serif;font-size:2.4rem;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{color:var(--dim);font-size:.88rem;margin-top:8px;}
.progress{width:100%;height:4px;background:var(--border);border-radius:2px;margin-bottom:28px;overflow:hidden;}
.progress-fill{height:100%;background:var(--red);transition:width .5s;border-radius:2px;}
.scenario{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;animation:fadeIn .4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
.sc-label{font-size:.7rem;text-transform:uppercase;letter-spacing:2px;color:var(--yellow);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.sc-label::before{content:'🏥';}
.sc-text{font-size:.95rem;line-height:1.65;margin-bottom:16px;color:var(--text);font-weight:500;padding:16px;background:linear-gradient(135deg,var(--surface2),rgba(243,156,18,.03));border-radius:10px;border-left:3px solid var(--yellow);}
.opts{display:flex;flex-direction:column;gap:10px;}
.opt{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:14px 18px;cursor:pointer;font-size:.86rem;transition:all .2s;line-height:1.4;}
.opt:hover{border-color:var(--red);background:rgba(192,57,43,.06);}
.opt.correct{border-color:var(--green);background:rgba(39,174,96,.12);color:var(--green-light);}
.opt.wrong{border-color:var(--red);background:rgba(192,57,43,.12);color:var(--red-light);opacity:.6;}
.opt.disabled{pointer-events:none;}
.explain{margin-top:12px;font-size:.82rem;color:var(--dim);padding:14px;background:rgba(255,255,255,.02);border-radius:8px;border-left:3px solid var(--green);line-height:1.5;animation:fadeIn .3s ease;}
.score-card{text-align:center;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:40px;margin-top:20px;animation:fadeIn .5s ease;}
.score-num{font-family:'Playfair Display',serif;font-size:4rem;font-weight:900;color:var(--green-light);}
.score-label{color:var(--dim);font-size:.9rem;margin-top:4px;}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
<header>
  <div class="week">Week 5 — Special Blood Collections</div>
  <div class="tag">Activity 9 of 10</div>
  <h1>Clinical Scenarios</h1>
  <p>Read each advanced phlebotomy situation and choose the best action.</p>
</header>
<div class="progress"><div class="progress-fill" id="prog"></div></div>
<div id="list"></div>
<div id="score"></div>
</div>
<script>
const scenarios=[
  {scenario:"A physician orders blood cultures on a febrile patient. The nurse tells you the patient just received their first dose of IV antibiotics 20 minutes ago. What should you document?",
   opts:["Nothing — proceed normally","Note that antibiotics were already administered before collection","Refuse to draw the cultures","Wait 24 hours for the antibiotic to clear"],correct:1,
   explain:"Ideally cultures are collected before antibiotics, but if they've been given, you must document the timing. The lab and physician need this information to interpret results."},
  {scenario:"You're preparing a blood smear and notice small clots forming in the EDTA tube. What should you do?",
   opts:["Use the sample anyway — clots are normal","Remix the tube vigorously to dissolve the clots","Discard the sample and recollect properly","Strain out the clots and prepare the smear"],correct:2,
   explain:"Clotted EDTA blood produces unreliable smears with distorted cell morphology. A new specimen must be collected and properly inverted."},
  {scenario:"You're collecting a urine specimen for drug screening at an employer's request. The patient hands you the cup without you witnessing the collection. What do you do?",
   opts:["Accept it and label it","Request a witnessed recollection per chain of custody protocol","Test it on the spot for temperature","Call the employer for instructions"],correct:1,
   explain:"Chain of custody requires proper witnessing and documentation. An unwitnessed specimen compromises the legal validity of the test."},
  {scenario:"In the NICU, you need to draw blood from a 2 kg premature infant. The orders call for a CBC, CMP, and blood gas. How do you minimize risk?",
   opts:["Use standard adult tubes for efficiency","Use microtainers, batch tests if possible, and log the draw volume","Draw from the umbilical line only","Skip the blood gas since it's least important"],correct:1,
   explain:"To prevent iatrogenic anemia, use microtainers (0.5–1 mL), consolidate tests when possible, and keep a running draw log. Total volume must not exceed 3% of blood volume in 24 hours."},
  {scenario:"You're performing a newborn heel stick for IEM screening. After puncturing, the blood won't flow well. What's your best action?",
   opts:["Squeeze the heel firmly to force blood out","Rewarm the heel and allow gentle flow without squeezing","Puncture the center of the heel for better flow","Switch to a finger stick instead"],correct:1,
   explain:"Rewarm the heel to improve circulation. Excessive squeezing can cause hemolysis and tissue fluid contamination. Never puncture the heel center."},
  {scenario:"A blood donor becomes pale, sweaty, and dizzy during a whole blood donation at 350 mL collected. What is your priority?",
   opts:["Continue collecting to reach 450 mL","Stop collection, lower the donor's head, and monitor vitals","Immediately remove the needle and have them stand up","Give them juice while continuing the draw"],correct:1,
   explain:"These are signs of vasovagal syncope. Stop collection immediately, position the donor safely (lower head or raise legs), and monitor vitals."},
  {scenario:"A patient's sputum specimen arrives at the lab and appears watery and clear. The lab rejects it. Why?",
   opts:["It was collected in the wrong container","The specimen is likely saliva, not true sputum from the lungs","Sputum must be refrigerated before transport","Clear sputum always indicates the patient is healthy"],correct:1,
   explain:"True sputum is thicker and may be colored; watery/clear specimens are usually saliva and are non-diagnostic. The patient needs re-education on proper deep-cough collection technique."},
];
let score=0,answered=0;
document.getElementById('list').innerHTML=scenarios.map((s,si)=>`
  <div class="scenario" id="sc-${si}"><div class="sc-label">Scenario ${si+1} of ${scenarios.length}</div>
  <div class="sc-text">${s.scenario}</div>
  <div class="opts" id="opts-${si}">${s.opts.map((o,oi)=>`<div class="opt" onclick="pick(${si},${oi})">${o}</div>`).join('')}</div></div>
`).join('');
function pick(si,oi){
  const opts=document.querySelectorAll(`#opts-${si} .opt`);
  if(opts[0].classList.contains('disabled'))return;
  opts.forEach((o,i)=>{o.classList.add('disabled');if(i===scenarios[si].correct)o.classList.add('correct');else if(i===oi)o.classList.add('wrong');});
  if(oi===scenarios[si].correct)score++;answered++;
  const exp=document.createElement('div');exp.className='explain';exp.textContent=scenarios[si].explain;
  document.getElementById(`sc-${si}`).appendChild(exp);
  document.getElementById('prog').style.width=`${(answered/scenarios.length)*100}%`;
  if(answered===scenarios.length){document.getElementById('score').innerHTML=`<div class="score-card"><div class="score-num">${score}/${scenarios.length}</div><div class="score-label">Scenarios handled correctly</div></div>`;}
}
</script>
</body>
</html>
