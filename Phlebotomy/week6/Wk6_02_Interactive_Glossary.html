<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wk6 Activity 2 — Interactive Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;--radius:16px;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
header{text-align:center;margin-bottom:10px;}
header .week{font-size:10px;text-transform:uppercase;letter-spacing:3px;color:var(--muted);font-weight:700;margin-bottom:2px;}
header .tag{font-size:12px;text-transform:uppercase;letter-spacing:3px;color:var(--red-light);font-weight:700;margin-bottom:4px;}
header h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
header p{color:var(--dim);font-size:14px;margin-top:4px;}
.search{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 18px;color:var(--text);font-size:16px;outline:none;font-family:inherit;margin-bottom:10px;transition:border-color .2s;}
.search:focus{border-color:var(--red);}
.search::placeholder{color:var(--muted);}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.count{color:var(--muted);font-size:13px;letter-spacing:.5px;}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface);}
.items{flex:1;overflow:hidden;padding:4px 0;}
.letter-heading{font-family:'Playfair Display',serif;font-size:22px;color:var(--red-light);padding:8px 16px 4px;border-bottom:1px solid var(--border);font-weight:700;}
.item{padding:10px 16px;cursor:pointer;transition:background .2s;border-bottom:1px solid rgba(37,43,59,.5);}
.item:last-child{border-bottom:none;}
.item:hover{background:var(--surface2);}
.term{font-weight:700;font-size:20px;color:#fff;display:flex;align-items:center;gap:10px;}
.term .arrow{color:var(--muted);font-size:12px;transition:transform .25s;}
.item.open .arrow{transform:rotate(90deg);color:var(--red-light);}
.def{color:var(--dim);font-size:15px;line-height:1.6;max-height:0;overflow:hidden;transition:max-height .35s ease,padding .35s ease;padding:0;}
.item.open .def{max-height:150px;padding-top:6px;}
.empty{text-align:center;color:var(--muted);padding:30px;font-size:15px;}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg);}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s;}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light);}
.pg-btn:disabled{opacity:.3;cursor:default;}
.pg-dots{display:flex;gap:5px;justify-content:center;align-items:center;}
.pg-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s;}
.pg-dot.active{background:var(--red-light);transform:scale(1.3);}
.pg-dot:hover:not(.active){background:var(--dim);}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
<header>
  <div class="week">Week 6 — Processing Specimens</div>
  <div class="tag">Activity 2 of 10</div>
  <h1>Interactive Glossary</h1>
  <p>Search and tap any term to expand its definition.</p>
</header>
<input class="search" id="search" placeholder="Search terms..." />
<div class="top-bar">
  <div class="count" id="count"></div>
</div>
<div class="list-wrap">
  <div class="items" id="list"></div>
  <div class="pager" id="pager"></div>
</div>
</div>
<script>
const glossary=[
  {term:"Amber tube",def:"A light-protected collection tube used for light-sensitive analytes such as bilirubin and Vitamin B6."},
  {term:"Barcode scanning",def:"Using LIS-generated barcoded labels to track specimens, verify identity, and reduce labeling errors."},
  {term:"Biohazard bag",def:"A labeled bag used to transport biological specimens safely, with a separate pouch for the requisition form."},
  {term:"Chain of custody (COC)",def:"A legal documentation process tracking a specimen from collection to final analysis; required for drug screens, blood alcohol, and DNA testing."},
  {term:"Cold agglutinin",def:"A test specimen that must be kept warm at 37 °C during transport to prevent red blood cell clumping."},
  {term:"Critical value",def:"A lab result so abnormal that it may be life-threatening; must be reported immediately to a licensed provider."},
  {term:"EHR (Electronic Health Record)",def:"Digital systems like Epic, Cerner, or Meditech used to store and distribute lab results to providers."},
  {term:"Hemolysis",def:"Destruction of red blood cells releasing hemoglobin into serum; the most common cause of specimen rejection."},
  {term:"HIPAA",def:"Health Insurance Portability and Accountability Act; requires protection of patient health information during result reporting."},
  {term:"Laboratory Information System (LIS)",def:"Software used to generate barcoded labels, log specimens, track test status, and document rejected samples."},
  {term:"Peak / trough levels",def:"Time-sensitive blood draws coordinated with nursing to measure drug levels at their highest (peak) and lowest (trough) concentrations."},
  {term:"Pneumatic tube system",def:"A hospital transport system using air pressure to send specimens from collection points to the laboratory."},
  {term:"Point-of-Care Testing (POCT)",def:"Bedside testing using portable devices such as glucose meters, i-STAT analyzers, and hemoglobin meters."},
  {term:"Read-back verification",def:"A safety practice where the receiver repeats a reported critical value to the sender to confirm accuracy."},
  {term:"Requisition form",def:"A document accompanying a specimen that lists the tests ordered, patient information, and provider details."},
  {term:"Specimen rejection",def:"When a lab refuses to process a specimen due to errors such as hemolysis, clotting, wrong tube, mislabeling, or temperature violation."},
  {term:"STAT specimen",def:"An urgent specimen that must be flagged, communicated to lab staff, and processed immediately."},
  {term:"Tamper-evident bag",def:"A sealed specimen bag used for chain of custody collections that shows visible signs if opened or tampered with."},
].sort((a,b)=>a.term.localeCompare(b.term));

let currentPage=0,openTerm='';
const PER_PAGE=4;

function render(filter=''){
  const f=filter.toLowerCase();
  const filtered=glossary.filter(g=>!f||g.term.toLowerCase().includes(f)||g.def.toLowerCase().includes(f));
  const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  if(currentPage>=totalPages) currentPage=totalPages-1;
  if(currentPage<0) currentPage=0;
  const start=currentPage*PER_PAGE;
  const pageItems=filtered.slice(start,start+PER_PAGE);

  document.getElementById('count').textContent=`${filtered.length} of ${glossary.length} terms · Page ${currentPage+1} of ${totalPages}`;

  if(!filtered.length){
    document.getElementById('list').innerHTML='<div class="empty">No matching terms found.</div>';
    document.getElementById('pager').innerHTML='';
    return;
  }

  let letters={};
  pageItems.forEach(g=>{const l=g.term[0].toUpperCase();if(!letters[l])letters[l]=[];letters[l].push(g);});

  let html='';
  Object.keys(letters).sort().forEach(l=>{
    html+=`<div class="letter-heading">${l}</div>`;
    letters[l].forEach(g=>{
      const isOpen=openTerm===g.term;
      html+=`<div class="item ${isOpen?'open':''}" onclick="togTerm('${g.term.replace(/'/g,"\\'")}')"><div class="term"><span class="arrow">▶</span>${g.term}</div><div class="def" style="${isOpen?'max-height:150px;padding-top:6px':''}">${g.def}</div></div>`;
    });
  });
  document.getElementById('list').innerHTML=html;

  let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button>`;
  ph+=`<div class="pg-dots">`;
  for(let p=0;p<totalPages;p++){
    ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;
  }
  ph+=`</div>`;
  ph+=`<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;
  document.getElementById('pager').innerHTML=ph;
}

function togTerm(t){openTerm=openTerm===t?'':t;render(document.getElementById('search').value);}
function goPage(p){currentPage=p;openTerm='';render(document.getElementById('search').value);}
document.getElementById('search').addEventListener('input',e=>{currentPage=0;openTerm='';render(e.target.value);});
render();
</script>
</body>
</html>
