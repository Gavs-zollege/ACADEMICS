<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POCT Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0b0e14;--surface:#131720;--surface2:#1a1f2e;--border:#252b3b;--red:#c0392b;--red-light:#e74c3c;--text:#e4e2df;--dim:#7a7f90;--muted:#484d5e;}
html,body{height:100%;overflow:hidden !important;font-family:'Source Sans 3',sans-serif;background:var(--bg);color:var(--text);}
.grain{position:fixed;inset:0;pointer-events:none;opacity:.035;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}
.wrap{max-width:680px;margin:0 auto;padding:16px 20px 12px;display:flex;flex-direction:column;height:100dvh;overflow:hidden !important;}
.tag{font-family:'Source Sans 3',sans-serif;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;color:var(--red-light);font-weight:700;margin-bottom:4px;}
h1{font-family:'Playfair Display',serif;font-size:32px;font-weight:900;background:linear-gradient(135deg,#fff 40%,var(--red-light));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:2px;}
.sub{font-size:14px;color:var(--dim);margin-bottom:10px;}
.search-wrap{position:relative;margin-bottom:10px}
.search-wrap span{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:18px;color:var(--muted)}
.search-wrap input{width:100%;padding:12px 16px 12px 44px;border-radius:10px;font-size:16px;border:1px solid var(--border);background:var(--surface);color:var(--text);outline:none;font-family:inherit}
.search-wrap input:focus{border-color:var(--red)}
.search-wrap input::placeholder{color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cat-btn{padding:4px 12px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--dim);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.cat-btn:hover{opacity:.85}
.cat-btn.active{background:var(--cat-bg);border-color:var(--cat-col);color:var(--cat-col)}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.count{font-size:13px;color:var(--dim)}
.list-wrap{border-radius:10px;border:1px solid var(--border);overflow:hidden;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.items{flex:1;overflow:hidden;padding:4px 0}
.item{padding:10px 16px;cursor:pointer;border-bottom:1px solid var(--border);transition:all .25s}
.item:last-child{border-bottom:none}
.item:hover{background:var(--surface2)}
.item.open{background:var(--surface2);box-shadow:0 2px 10px rgba(0,0,0,.15)}
.item-head{display:flex;justify-content:space-between;align-items:center}
.item-left{display:flex;align-items:center;gap:10px}
.item-bar{width:4px;height:22px;border-radius:2px;opacity:.3;transition:opacity .2s}
.item.open .item-bar{opacity:1}
.item-term{font-size:20px;font-weight:700;color:#fff}
.item-cat{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase}
.item-def{margin-top:8px;margin-left:14px;padding-top:8px;border-top:1px solid var(--border);font-size:15px;color:var(--dim);line-height:1.6;font-style:italic;display:none}
.item.open .item-def{display:block}
.item.open .item-term{color:var(--red-light)}
.empty{text-align:center;padding:30px;color:var(--muted);font-size:15px}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--border);background:var(--bg)}
.pg-btn{padding:6px 18px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:inherit;transition:all .2s}
.pg-btn:hover:not(:disabled){border-color:var(--red-light);color:var(--red-light)}
.pg-btn:disabled{opacity:.3;cursor:default}
.pg-dots{display:flex;gap:5px;justify-content:center;align-items:center}
.pg-dot{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .2s}
.pg-dot.active{background:var(--red-light);transform:scale(1.3)}
.pg-dot:hover:not(.active){background:var(--dim)}
</style>
</head>
<body>
<div class="grain"></div>
<div class="wrap">
  <div class="tag">POCT & CLIA-Waived Procedures</div>
  <h1>Glossary</h1>
  <p class="sub">20 terms — search, filter, and explore</p>
  <div class="search-wrap">
    <span>⌕</span>
    <input type="text" id="search" placeholder="Search terms or definitions...">
  </div>
  <div class="filters" id="filters"></div>
  <div class="top-bar">
    <div class="count" id="count"></div>
  </div>
  <div class="list-wrap">
    <div class="items" id="list"></div>
    <div class="pager" id="pager"></div>
  </div>
</div>
<script>
const glossary=[
{term:"POCT",definition:"Point-of-Care Testing — laboratory tests performed at or near the patient for rapid results, rather than in a central laboratory.",category:"Core Concepts"},
{term:"CLIA",definition:"Clinical Laboratory Improvement Amendments — federal regulations governing all laboratory testing performed on humans in the United States, ensuring accuracy and reliability.",category:"Regulations"},
{term:"CPT (Phlebotomy)",definition:"Certified Phlebotomy Technician — a healthcare professional who may perform CLIA-waived POCT, follow manufacturer instructions, perform QC, and report results.",category:"Core Concepts"},
{term:"Waived Test",definition:"A low-complexity laboratory test approved by CLIA for use by non-laboratory personnel. Examples include blood glucose, urine pregnancy, and urinalysis dipstick tests.",category:"Regulations"},
{term:"Moderate Complexity Test",definition:"A CLIA-classified test requiring more training and oversight than waived tests. CPTs may NOT perform these tests.",category:"Regulations"},
{term:"High Complexity Test",definition:"The most complex CLIA-classified test, requiring specialized training and equipment. Only performed in certified laboratories by trained personnel.",category:"Regulations"},
{term:"Quality Control (QC)",definition:"Procedures that ensure POCT results are accurate, reliable, and reproducible. QC must pass before patient testing can proceed.",category:"Quality"},
{term:"Liquid Control Solutions",definition:"A type of quality control material used to verify that a POCT device is producing accurate results within an acceptable range.",category:"Quality"},
{term:"Electronic Controls",definition:"Built-in or external electronic checks used as part of quality control for POCT devices.",category:"Quality"},
{term:"Corrective Action",definition:"Steps taken to identify and resolve a quality control failure before patient testing resumes. Must be documented.",category:"Quality"},
{term:"hCG",definition:"Human Chorionic Gonadotropin — a hormone produced during pregnancy that is detected by urine pregnancy tests.",category:"Clinical"},
{term:"Hypoglycemia",definition:"A critically low blood glucose level that may be life-threatening. Classified as a critical value requiring immediate reporting.",category:"Clinical"},
{term:"Hyperglycemia",definition:"A critically high blood glucose level that may be life-threatening. Classified as a critical value requiring immediate reporting.",category:"Clinical"},
{term:"Critical Value",definition:"A test result that indicates a potentially life-threatening condition. Must be reported immediately and documented per facility policy.",category:"Clinical"},
{term:"Capillary Puncture",definition:"A skin puncture technique (usually on the fingertip) used to collect small blood samples for POCT such as blood glucose testing.",category:"Procedures"},
{term:"Urinalysis Dipstick",definition:"A CLIA-waived test that evaluates urine for glucose, protein, ketones, blood, and pH using a chemically treated strip.",category:"Procedures"},
{term:"Reading Window",definition:"The specific time frame during which a test result must be read for accuracy. Defined by manufacturer instructions.",category:"Procedures"},
{term:"Standard Precautions",definition:"Infection control practices applied to all patient care: hand hygiene, gloves, single-use lancets, cleaning meters between patients, and proper sharps disposal.",category:"Safety"},
{term:"EMR",definition:"Electronic Medical Record — a digital system where POCT results may be entered as part of proper documentation.",category:"Documentation"},
{term:"Manufacturer Instructions",definition:"The official guidelines from the test device manufacturer that must be followed exactly. Includes storage requirements, test timing, specimen volume, and reading windows.",category:"Procedures"}
];
const catColors={"Core Concepts":"#5B8CDB",Regulations:"#E05555",Quality:"#1A8A7D",Clinical:"#E8976A",Procedures:"#8B6AAE",Safety:"#E2B94C",Documentation:"#C4A84D"};
const cats=["All",...new Set(glossary.map(g=>g.category))];
let filter="All",search="",openIdx=null,currentPage=0;
const PER_PAGE=4;

function renderFilters(){
  const el=document.getElementById('filters');
  el.innerHTML=cats.map(c=>{
    const col=c==="All"?"#7a7f90":(catColors[c]||"#888");
    const active=filter===c;
    return `<button class="cat-btn ${active?'active':''}" style="--cat-col:${col};--cat-bg:${col}18;${active?`border-color:${col};color:${col};background:${col}18`:''}" onclick="setFilter('${c}')">${c}</button>`;
  }).join('');
}

function getFiltered(){
  const s=search.toLowerCase();
  return glossary.filter(g=>(filter==="All"||g.category===filter)&&(g.term.toLowerCase().includes(s)||g.definition.toLowerCase().includes(s)));
}

function renderList(){
  const filtered=getFiltered();
  const totalPages=Math.max(1,Math.ceil(filtered.length/PER_PAGE));
  if(currentPage>=totalPages) currentPage=totalPages-1;
  if(currentPage<0) currentPage=0;
  const start=currentPage*PER_PAGE;
  const pageItems=filtered.slice(start,start+PER_PAGE);

  document.getElementById('count').textContent=filtered.length+' term'+(filtered.length!==1?'s':'')+' found · Page '+(currentPage+1)+' of '+totalPages;

  if(!filtered.length){
    document.getElementById('list').innerHTML='<div class="empty">No terms match your search.</div>';
    document.getElementById('pager').innerHTML='';
    return;
  }

  document.getElementById('list').innerHTML=pageItems.map((g,i)=>{
    const col=catColors[g.category]||"#888";
    const origIdx=glossary.indexOf(g);
    const isOpen=openIdx===origIdx;
    return `<div class="item ${isOpen?'open':''}" onclick="toggle(${origIdx})">
      <div class="item-head">
        <div class="item-left">
          <div class="item-bar" style="background:${col}"></div>
          <span class="item-term">${g.term}</span>
        </div>
        <span class="item-cat" style="background:${col}18;color:${col}">${g.category}</span>
      </div>
      <div class="item-def" style="${isOpen?'display:block':''}">${g.definition}</div>
    </div>`;
  }).join('');

  let ph=`<button class="pg-btn" onclick="goPage(${currentPage-1})" ${currentPage===0?'disabled':''}>← Prev</button>`;
  ph+=`<div class="pg-dots">`;
  for(let p=0;p<totalPages;p++){
    ph+=`<div class="pg-dot ${p===currentPage?'active':''}" onclick="goPage(${p})"></div>`;
  }
  ph+=`</div>`;
  ph+=`<button class="pg-btn" onclick="goPage(${currentPage+1})" ${currentPage>=totalPages-1?'disabled':''}>Next →</button>`;
  document.getElementById('pager').innerHTML=ph;
}

function setFilter(c){filter=c;currentPage=0;openIdx=null;renderFilters();renderList();}
function toggle(i){openIdx=openIdx===i?null:i;renderList();}
function goPage(p){currentPage=p;openIdx=null;renderList();}
document.getElementById('search').addEventListener('input',e=>{search=e.target.value;currentPage=0;openIdx=null;renderList();});
renderFilters();renderList();
</script>
</body>
</html>
