<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Advanced Phlebotomy Memory Match</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(170deg,#140c18 0%,#1a1020 50%,#180e14 100%);font-family:'Poppins',sans-serif;color:#f0e8f0}
.wrap{max-width:560px;margin:0 auto;padding:36px 16px}
.header{text-align:center;margin-bottom:28px}
.tag{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:#d4783c;font-weight:700;margin-bottom:8px}
h1{font-family:'Playfair Display',serif;font-size:34px;font-weight:700}
.sub{font-size:13px;color:#6a5870;margin-top:6px}
.stats{display:flex;justify-content:center;gap:20px;margin-bottom:24px}
.stats div{text-align:center}
.stats .val{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stats .lbl{font-size:10px;color:#5a4860;letter-spacing:1.5px;text-transform:uppercase;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{height:110px;perspective:800px;cursor:pointer}
.inner{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.inner.show{transform:rotateY(180deg)}
.face{backface-visibility:hidden;position:absolute;inset:0;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px}
.front{background:linear-gradient(145deg,#201828,#1a1420);border:1.5px solid #302840;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.front span{font-size:26px;color:#3a2848;font-weight:900}
.back{transform:rotateY(180deg);gap:6px}
.back.term{background:linear-gradient(145deg,#201020,#281828);border:1.5px solid #d4783c55}
.back.def{background:linear-gradient(145deg,#101820,#142020);border:1.5px solid #1abc9c44}
.back.wrong-card{border-color:#e74c3c !important}
.back .type{font-size:8px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.back.term .type{color:#d4783c}
.back.def .type{color:#1abc9c}
.back .txt{font-size:11px;font-weight:600;text-align:center;line-height:1.4}
.back.term .txt{color:#e8c8a8}
.back.def .txt{color:#a8d8c8}
.card.matched{opacity:.5}
.complete{text-align:center;padding:36px;border-radius:20px;margin-bottom:24px;background:linear-gradient(145deg,#0d1a14,#1a1028);border:1px solid #27ae6044;box-shadow:0 16px 64px rgba(39,174,96,.1)}
.complete .icon{font-size:48px;margin-bottom:8px}
.complete h2{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:#27ae60}
.complete .det{font-size:14px;color:#7a6888;margin-top:8px}
.complete .msg{font-size:13px;color:#5a4860;margin-top:4px}
.play-btn{margin-top:24px;padding:14px 44px;border-radius:12px;border:none;background:linear-gradient(135deg,#d4783c,#c06030);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.reset-btn{display:block;margin:24px auto 0;padding:10px 28px;border-radius:8px;border:1px solid #302840;background:transparent;color:#6a5870;font-size:12px;font-weight:600;cursor:pointer}
@keyframes matchPulse{0%{transform:rotateY(180deg) scale(1)}50%{transform:rotateY(180deg) scale(1.05)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes shake{0%,100%{transform:rotateY(180deg)}20%{transform:rotateY(180deg) translateX(-4px)}40%{transform:rotateY(180deg) translateX(4px)}60%{transform:rotateY(180deg) translateX(-3px)}80%{transform:rotateY(180deg) translateX(3px)}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const pairData=[
{term:"Rolling Vein",def:"Shifts when pressure applied"},
{term:"Butterfly Needle",def:"Best for small fragile veins"},
{term:"Hemolysis",def:"Red blood cells destroyed"},
{term:"Hematoma",def:"Blood pooled under skin"},
{term:"Syncope",def:"Patient fainting episode"},
{term:"Petechiae",def:"Tiny capillary bleed dots"},
{term:"AV Fistula",def:"Never use for blood draw"},
{term:"Transfer Device",def:"Syringe to tube safely"}
];
let cards=[],flipped=[],matched=new Set(),moves=0,lockBoard=false,timer=0,started=false,complete=false,wrongPair=null,timerInterval=null;
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function buildDeck(){const c=[];pairData.forEach((p,i)=>{c.push({id:'t'+i,pairId:i,text:p.term,type:'term'});c.push({id:'d'+i,pairId:i,text:p.def,type:'def'});});return shuffle(c);}
function fmtTime(s){return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0');}
function init(){cards=buildDeck();flipped=[];matched=new Set();moves=0;lockBoard=false;timer=0;started=false;complete=false;wrongPair=null;if(timerInterval)clearInterval(timerInterval);render();}
function flipCard(idx){
  if(lockBoard||flipped.includes(idx)||matched.has(cards[idx].pairId))return;
  if(!started){started=true;timerInterval=setInterval(()=>{timer++;const el=document.getElementById('timerVal');if(el)el.textContent=fmtTime(timer);},1000);}
  flipped.push(idx);render();
  if(flipped.length===2){moves++;lockBoard=true;const[a,b]=flipped;
    if(cards[a].pairId===cards[b].pairId){matched.add(cards[a].pairId);flipped=[];lockBoard=false;if(matched.size===pairData.length){complete=true;clearInterval(timerInterval);}render();}
    else{wrongPair=[a,b];render();setTimeout(()=>{wrongPair=null;flipped=[];lockBoard=false;render();},900);}
  }
}
function render(){
  const app=document.getElementById('app');
  let html=`<div class="header"><div class="tag">Advanced Phlebotomy</div><h1>Memory Match</h1><p class="sub">Match terms with definitions</p></div>`;
  html+=`<div class="stats"><div><div class="val" style="color:#d4783c">${moves}</div><div class="lbl">Moves</div></div><div><div class="val" id="timerVal" style="color:#5dade2">${fmtTime(timer)}</div><div class="lbl">Time</div></div><div><div class="val" style="color:#27ae60">${matched.size}/${pairData.length}</div><div class="lbl">Pairs</div></div></div>`;
  if(complete){const msg=moves<=pairData.length+4?'⭐ Exceptional!':moves<=pairData.length+8?'Great job!':'Keep practicing!';html+=`<div class="complete"><div class="icon">🎉</div><h2>Complete!</h2><div class="det">${moves} moves in ${fmtTime(timer)}</div><div class="msg">${msg}</div><button class="play-btn" onclick="init()">Play Again</button></div>`;}
  html+=`<div class="grid">`;
  cards.forEach((c,i)=>{const isFlipped=flipped.includes(i);const isMatched=matched.has(c.pairId);const isWrong=wrongPair&&wrongPair.includes(i);const show=isFlipped||isMatched;const anim=isMatched&&show?'matchPulse .4s ease':isWrong?'shake .5s ease':'none';
    html+=`<div class="card ${isMatched?'matched':''}" onclick="flipCard(${i})"><div class="inner ${show?'show':''}" style="animation:${anim}"><div class="face front"><span>?</span></div><div class="face back ${c.type} ${isWrong?'wrong-card':''}"><div class="type">${c.type==='term'?'Term':'Definition'}</div><div class="txt">${c.text}</div></div></div></div>`;
  });
  html+=`</div>`;
  if(started&&!complete)html+=`<button class="reset-btn" onclick="init()">Restart Game</button>`;
  app.innerHTML=html;
}
init();
</script>
</body>
</html>
