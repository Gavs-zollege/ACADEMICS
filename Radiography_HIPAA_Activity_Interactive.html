<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Workplace Scenario Simulator — Radiography Safety & HIPAA</title>
<style>
  :root{
    --navy:#1B2A4A; --teal:#0F6B72; --amber:#C9862B; --red:#A83A3A; --purple:#5B4B8A;
    --gray:#5B6472; --lightbg:#F4F6F8; --border:#E3E7EC; --green:#2E7D4F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{font-family:-apple-system,"Segoe UI",Arial,Helvetica,sans-serif; color:#222; background:#F8F9FB; display:flex; flex-direction:column;}

  header{background:var(--navy); color:#fff; padding:16px 28px 14px; flex-shrink:0;}
  header .top-row{display:flex; justify-content:space-between; align-items:baseline;}
  header h1{margin:0; font-size:19px; font-weight:700;}
  header .sub{font-size:12px; color:#9FB0C9;}
  .dots{display:flex; gap:5px; margin-top:12px; flex-wrap:wrap;}
  .dot{width:18px; height:6px; border-radius:4px; background:#3A4C70; transition:background .15s;}
  .dot.done{background:#5C8B90;}
  .dot.current{background:#fff;}

  main{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:22px 28px;}
  .stage{width:100%; max-width:800px; height:100%; display:flex; flex-direction:column; justify-content:center;}

  .section-tag{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--teal); background:#E7F1F1; padding:4px 10px; border-radius:20px; margin-bottom:14px; align-self:flex-start;
  }
  .section-tag.hipaa{color:var(--purple); background:#EEEAF6;}

  .scard{background:#fff; border:1px solid var(--border); border-radius:14px; padding:24px 28px; box-shadow:0 2px 10px rgba(20,30,50,0.05);}
  .smeta{font-size:12.5px; color:var(--gray); margin-bottom:8px; font-weight:600;}
  .scenario-box{
    background:var(--lightbg); border-left:3px solid var(--gray); padding:12px 16px; border-radius:0 8px 8px 0;
    font-size:15px; line-height:1.45; margin-bottom:16px;
  }
  .prompt{font-size:16.5px; font-weight:700; color:#16233F; margin:0 0 14px;}

  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:flex-start; gap:12px; padding:12px 16px; border:1.5px solid var(--border);
    border-radius:10px; cursor:pointer; font-size:14px; transition:all .12s;
  }
  .opt:hover{border-color:#B9C2CE; background:#FAFBFC;}
  .opt.correct{background:#EAF6EE; border-color:var(--green);}
  .opt.incorrect{background:#FBEAEA; border-color:var(--red);}
  .opt.disabled{cursor:default; pointer-events:none;}
  .opt .letter{font-weight:700; flex-shrink:0;}

  .feedback-box{
    display:none; margin-top:14px; padding:12px 16px; border-radius:8px; font-size:13.5px; line-height:1.45;
  }
  .feedback-box.show{display:block;}
  .feedback-box.correct{background:#EAF6EE; border-left:3px solid var(--green); color:#1e4d31;}
  .feedback-box.incorrect{background:#FBEAEA; border-left:3px solid var(--red); color:#5a2323;}
  .feedback-box b{display:block; margin-bottom:3px;}

  footer{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; border-top:1px solid var(--border); background:#fff;
  }
  .navbtn{background:var(--navy); color:#fff; border:none; padding:11px 22px; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer;}
  .navbtn.secondary{background:#fff; color:var(--navy); border:1.5px solid var(--border);}
  .navbtn:disabled{opacity:.35; cursor:not-allowed;}
  .counter{font-size:13px; color:var(--gray); font-weight:600;}

  .review-wrap{display:flex; flex-direction:column; align-items:center; height:100%; justify-content:center; width:100%;}
  .score-ring{
    width:120px; height:120px; border-radius:50%; background:conic-gradient(var(--amber) var(--pct,0%), #E3E7EC 0);
    display:flex; align-items:center; justify-content:center; margin-bottom:6px;
  }
  .score-ring-inner{width:96px; height:96px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .score-ring-inner .num{font-size:26px; font-weight:800; color:var(--navy); line-height:1;}
  .score-ring-inner .den{font-size:11px; color:var(--gray);}
  .review-title{font-size:16px; font-weight:700; color:var(--navy); margin:8px 0 16px;}
  .grid15{display:grid; grid-template-columns:repeat(5,44px); gap:8px; margin-bottom:20px;}
  .tile{
    width:44px; height:44px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; border:1.5px solid var(--border); color:#fff;
  }
  .tile.right{background:var(--green);}
  .tile.wrong{background:var(--red);}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <h1>Workplace Scenario Simulator</h1>
    <span class="sub">Dental Radiography Safety &amp; HIPAA — apply what you've learned</span>
  </div>
  <div class="dots" id="dots"></div>
</header>

<main><div id="stageContent"></div></main>

<footer id="footerNav">
  <button class="navbtn secondary" id="prevBtn" onclick="go(-1)">← Previous</button>
  <span class="counter" id="counter"></span>
  <button class="navbtn" id="nextBtn" onclick="go(1)" disabled>Next Scenario →</button>
</footer>

<script>
const scenarios = [
  {
    section: "Patient Protection",
    scenario: "A patient asks, \u201cWhy do I need the lead apron and thyroid collar every single time? I just had X-rays taken six months ago at another office.\u201d",
    prompt: "What's the best response?",
    options: [
      "Skip the apron this time since it was recently done elsewhere — one less exposure won't matter.",
      "Explain that shielding is used on every exposure for every patient, regardless of history, as a standard ALARA practice.",
      "Tell them it's optional and let them decide.",
      "Use only the thyroid collar this time to save time.",
    ],
    answer: 1,
    explain: "ALARA-based shielding (lead apron + thyroid collar) is applied on every intraoral and panoramic exposure, without exception — it's not based on how recently the patient had prior imaging elsewhere.",
  },
  {
    section: "Operator Protection",
    scenario: "You're about to take a periapical radiograph. There is no protective barrier in the room, and you're unsure exactly where to stand.",
    prompt: "What should you do?",
    options: [
      "Stand right next to the patient to hold the sensor steady.",
      "Stand at least 6 feet away, at a 90\u2013135\u00b0 angle to the beam.",
      "Stand directly behind the tube head, as close as possible.",
      "Leave the room entirely — operator position doesn't matter with digital sensors.",
    ],
    answer: 1,
    explain: "With no barrier available, the operator should stand at least 6 feet away and at a 90\u2013135\u00b0 angle to the beam — never hold the sensor or tube head in place during exposure.",
  },
  {
    section: "Radiation Dose & Monitoring",
    scenario: "You review your personal dosimeter badge readings and notice this month's reading is unusually high compared to prior months.",
    prompt: "What's the appropriate next step?",
    options: [
      "Ignore it — a single high reading isn't worth addressing.",
      "Throw away the badge and request a new one.",
      "Flag it to your radiation safety officer and review your technique and equipment for possible issues.",
      "Reduce the number of patients you image next month to average it out.",
    ],
    answer: 2,
    explain: "An unexpectedly high dosimeter reading should prompt an immediate review of technique and equipment — it's a signal, not something to dismiss or self-correct informally.",
  },
  {
    section: "Equipment Safety",
    scenario: "During a routine exposure, the x-ray unit makes an unusual noise and the display flickers.",
    prompt: "What is the FIRST thing you should do?",
    options: [
      "Finish this patient's exposures, then mention it to someone later.",
      "Stop use of the unit immediately.",
      "Try a lower exposure setting to see if that resolves it.",
      "Restart the unit and continue as normal.",
    ],
    answer: 1,
    explain: "Step 1 of the malfunction protocol is to stop use immediately — no further exposures on a suspect unit, followed by notifying a supervisor and tagging it out of service.",
  },
  {
    section: "Patient Privacy & PHI",
    scenario: "A patient's adult daughter calls the office asking for details about her mother's recent treatment and upcoming appointment.",
    prompt: "What should you do?",
    options: [
      "Share the details — she's an immediate family member.",
      "Share only the appointment date, since that seems harmless.",
      "Decline to share any PHI unless the patient has authorized this disclosure or the daughter is otherwise verified as authorized.",
      "Ask the daughter to guess details to confirm she already knows them, then confirm.",
    ],
    answer: 2,
    explain: "Family members do not automatically have a right to a patient's PHI. Disclosure requires patient authorization (or the patient being present and not objecting, per office policy) — being related isn't enough on its own.",
  },
  {
    section: "Patient Rights",
    scenario: "A patient submits a written request for a full copy of their dental records, including radiographs, for a second opinion elsewhere.",
    prompt: "What does HIPAA require regarding your response time?",
    options: [
      "There is no required timeframe.",
      "You must respond within 30 days.",
      "You must respond within 24 hours.",
      "You can decline entirely since radiographs are diagnostic images, not records.",
    ],
    answer: 1,
    explain: "Patients have the right to access their records, including radiographs (which count as PHI). Providers must generally respond to such requests within 30 days.",
  },
  {
    section: "Office Compliance",
    scenario: "You overhear a coworker discussing a patient's treatment details in the waiting room, where other patients can hear.",
    prompt: "What's the appropriate action?",
    options: [
      "Ignore it — waiting room chat doesn't count as a PHI disclosure.",
      "Join the conversation since you already know the patient too.",
      "Address it as a privacy concern and, if needed, report it per office HIPAA policy.",
      "Wait to see if the patient notices before doing anything.",
    ],
    answer: 2,
    explain: "Discussing PHI anywhere others could overhear — including a waiting room — is a common HIPAA violation. It should be addressed directly and reported through the office's privacy/breach reporting process if warranted.",
  },
  {
    section: "Patient Privacy & PHI",
    scenario: "You need to send a patient's radiographs to a specialist for a referral, but the referral only concerns one specific tooth.",
    prompt: "What does the Minimum Necessary Standard require here?",
    options: [
      "Send the patient's entire imaging history so the specialist has full context.",
      "Send only the specific images relevant to the referral.",
      "Send nothing — radiographs can never be shared with outside providers.",
      "Send everything in the patient's entire chart, not just images.",
    ],
    answer: 1,
    explain: "The Minimum Necessary Standard means only the PHI relevant to the specific request or purpose should be shared — not a patient's entire imaging history or full chart, when only part of it is needed.",
  },
];

let cur = 0;
let responses = {};

function buildDots(){
  const wrap = document.getElementById('dots');
  wrap.innerHTML = '';
  scenarios.forEach((s,i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (responses[i] !== undefined ? ' done' : '') + (i===cur ? ' current' : '');
    wrap.appendChild(d);
  });
}

function isHipaa(s){
  return ["Patient Privacy & PHI","Patient Rights","Office Compliance","Key Terminology","Introduction to HIPAA"].includes(s.section);
}

function renderScenario(){
  const s = scenarios[cur];
  const stage = document.getElementById('stageContent');
  const chosen = responses[cur];
  let html = '<div class="stage">';
  html += '<span class="section-tag' + (isHipaa(s)?' hipaa':'') + '">' + s.section + '</span>';
  html += '<div class="scard">';
  html += '<div class="smeta">Scenario ' + (cur+1) + ' of ' + scenarios.length + '</div>';
  html += '<div class="scenario-box">' + s.scenario + '</div>';
  html += '<p class="prompt">' + s.prompt + '</p>';
  html += '<div class="options">';
  s.options.forEach((opt,i) => {
    let cls = 'opt';
    if (chosen !== undefined){
      cls += ' disabled';
      if (i === s.answer) cls += ' correct';
      else if (i === chosen) cls += ' incorrect';
    }
    html += '<div class="' + cls + '" onclick="choose(' + i + ')"><span class="letter">' + String.fromCharCode(65+i) + ')</span><span>' + opt + '</span></div>';
  });
  html += '</div>';
  if (chosen !== undefined){
    const isRight = chosen === s.answer;
    html += '<div class="feedback-box show ' + (isRight?'correct':'incorrect') + '"><b>' + (isRight ? '✓ Correct' : '✗ Not quite') + '</b>' + s.explain + '</div>';
  }
  html += '</div></div>';
  stage.innerHTML = html;

  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = chosen === undefined;
  document.getElementById('nextBtn').textContent = cur === scenarios.length - 1 ? (chosen === undefined ? 'Next Scenario →' : 'See Summary →') : 'Next Scenario →';
  document.getElementById('counter').textContent = (cur+1) + ' / ' + scenarios.length;
  buildDots();
}

function choose(i){
  if (responses[cur] !== undefined) return;
  responses[cur] = i;
  renderScenario();
}

function go(dir){
  if (dir === 1 && cur === scenarios.length - 1 && responses[cur] !== undefined){
    showSummary();
    return;
  }
  cur = Math.max(0, Math.min(scenarios.length-1, cur+dir));
  renderScenario();
}

function showSummary(){
  let correct = 0;
  scenarios.forEach((s,i) => { if (responses[i] === s.answer) correct++; });
  const total = scenarios.length;
  const pct = Math.round(correct/total*100);
  const stage = document.getElementById('stageContent');
  let html = '<div class="review-wrap">';
  html += '<div class="score-ring" style="--pct:' + pct + '%"><div class="score-ring-inner"><div class="num">' + correct + '/' + total + '</div><div class="den">correct</div></div></div>';
  html += '<div class="review-title">' + (pct === 100 ? 'Excellent judgment!' : pct >= 70 ? 'Solid decision-making!' : 'Review the explanations and try again.') + '</div>';
  html += '<div class="grid15">';
  scenarios.forEach((s,i) => {
    const cls = responses[i] === s.answer ? 'right' : 'wrong';
    html += '<div class="tile ' + cls + '">' + (i+1) + '</div>';
  });
  html += '</div>';
  html += '<button class="navbtn secondary" onclick="restart()">Restart Simulator</button>';
  html += '</div>';
  stage.innerHTML = html;
  document.getElementById('footerNav').style.display = 'none';
}

function restart(){
  cur = 0;
  responses = {};
  document.getElementById('footerNav').style.display = 'flex';
  renderScenario();
}

renderScenario();
</script>

</body>
</html>
