<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dental Radiography Safety & HIPAA — Quiz</title>
<style>
  :root{
    --navy:#1B2A4A; --teal:#0F6B72; --amber:#C9862B; --red:#A83A3A; --purple:#5B4B8A;
    --gray:#5B6472; --lightbg:#F4F6F8; --border:#E3E7EC; --green:#2E7D4F;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden;}
  body{
    font-family:-apple-system,"Segoe UI",Arial,Helvetica,sans-serif; color:#222;
    display:flex; flex-direction:column; background:#F8F9FB;
  }
  header{background:var(--navy); color:#fff; padding:16px 28px 14px; flex-shrink:0;}
  header .top-row{display:flex; justify-content:space-between; align-items:baseline;}
  header h1{margin:0; font-size:19px; font-weight:700;}
  header .cfr{font-size:12px; color:#9FB0C9;}
  .dots{display:flex; gap:5px; margin-top:12px; flex-wrap:wrap;}
  .dot{width:18px; height:6px; border-radius:4px; background:#3A4C70; cursor:pointer; transition:background .15s;}
  .dot.answered{background:#5C8B90;}
  .dot.current{background:#fff;}

  main{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:22px 28px;}
  .stage{width:100%; max-width:760px; height:100%; display:flex; flex-direction:column; justify-content:center;}

  .section-tag{
    display:inline-block; font-size:11px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
    color:var(--teal); background:#E7F1F1; padding:4px 10px; border-radius:20px; margin-bottom:14px; align-self:flex-start;
  }
  .section-tag.hipaa{color:var(--purple); background:#EEEAF6;}

  .qcard{background:#fff; border:1px solid var(--border); border-radius:14px; padding:26px 30px; box-shadow:0 2px 10px rgba(20,30,50,0.05);}
  .qmeta{font-size:12.5px; color:var(--gray); margin-bottom:6px; font-weight:600;}
  .qtext{font-size:19px; line-height:1.35; margin:0 0 20px; font-weight:600; color:#16233F;}

  .options{display:flex; flex-direction:column; gap:9px;}
  .opt{
    display:flex; align-items:center; gap:12px; padding:12px 16px; border:1.5px solid var(--border);
    border-radius:10px; cursor:pointer; font-size:14.5px; transition:all .12s;
  }
  .opt:hover{border-color:#B9C2CE; background:#FAFBFC;}
  .opt input{accent-color:var(--teal); width:17px; height:17px; flex-shrink:0;}
  .opt.correct{background:#EAF6EE; border-color:var(--green);}
  .opt.incorrect{background:#FBEAEA; border-color:var(--red);}
  .opt.disabled{cursor:default; pointer-events:none;}

  textarea{
    width:100%; height:64px; border:1.5px solid var(--border); border-radius:10px; padding:12px;
    font-family:inherit; font-size:14.5px; resize:none;
  }
  .reveal-btn{
    background:var(--lightbg); color:var(--navy); border:1.5px solid var(--border); padding:9px 16px;
    border-radius:8px; font-size:13px; font-weight:700; cursor:pointer; margin-top:10px;
  }
  .model-answer{
    display:none; margin-top:10px; background:#EFF5F5; border-left:3px solid var(--teal);
    padding:10px 14px; font-size:13.5px; color:#333; border-radius:0 8px 8px 0; line-height:1.4;
  }
  .feedback{margin-top:12px; font-size:13.5px; font-weight:700;}
  .feedback.correct{color:var(--green);}
  .feedback.incorrect{color:var(--red);}

  footer{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
    padding:14px 28px; border-top:1px solid var(--border); background:#fff;
  }
  .navbtn{background:var(--navy); color:#fff; border:none; padding:11px 22px; border-radius:9px; font-size:14px; font-weight:700; cursor:pointer;}
  .navbtn.secondary{background:#fff; color:var(--navy); border:1.5px solid var(--border);}
  .navbtn:disabled{opacity:.35; cursor:not-allowed;}
  .navbtn.finish{background:var(--amber);}
  .counter{font-size:13px; color:var(--gray); font-weight:600;}

  .review-wrap{display:flex; flex-direction:column; align-items:center; height:100%; justify-content:center; width:100%;}
  .score-ring{
    width:120px; height:120px; border-radius:50%; background:conic-gradient(var(--teal) var(--pct,0%), #E3E7EC 0);
    display:flex; align-items:center; justify-content:center; margin-bottom:6px;
  }
  .score-ring-inner{width:96px; height:96px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center;}
  .score-ring-inner .num{font-size:26px; font-weight:800; color:var(--navy); line-height:1;}
  .score-ring-inner .den{font-size:11px; color:var(--gray);}
  .review-title{font-size:16px; font-weight:700; color:var(--navy); margin:8px 0 16px;}
  .grid15{display:grid; grid-template-columns:repeat(5,44px); gap:8px; margin-bottom:20px;}
  .tile{
    width:44px; height:44px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:700; cursor:pointer; border:1.5px solid var(--border); color:#fff;
  }
  .tile.right{background:var(--green);}
  .tile.wrong{background:var(--red);}
  .tile.selfcheck{background:var(--gray);}
  .review-actions{display:flex; gap:10px;}
  .detail-wrap{width:100%; max-width:760px; display:flex; flex-direction:column; height:100%; justify-content:center;}
  .back-link{font-size:13px; color:var(--teal); cursor:pointer; font-weight:700; margin-bottom:10px; align-self:flex-start;}
</style>
</head>
<body>

<header>
  <div class="top-row">
    <h1>Dental Radiography Safety &amp; HIPAA Quiz</h1>
    <span class="cfr">Radiation Protection &amp; Patient Record Confidentiality</span>
  </div>
  <div class="dots" id="dots"></div>
</header>

<main><div id="stageContent"></div></main>

<footer id="footerNav">
  <button class="navbtn secondary" id="prevBtn" onclick="go(-1)">← Previous</button>
  <span class="counter" id="counter"></span>
  <div style="display:flex; gap:10px;">
    <button class="navbtn finish" id="finishBtn" onclick="finishQuiz()">Finish &amp; See Score</button>
    <button class="navbtn" id="nextBtn" onclick="go(1)">Next →</button>
  </div>
</footer>

<script>
const questions = [
  {section:"ALARA & Radiation Protection", type:"mc", text:"What does ALARA stand for?",
    options:["Always Limit Auxiliary Radiation Access","As Low As Reasonably Achievable","Automatic Lead Apron Requirement Alert","Annual Limit for Approved Radiographic Activity"], answer:1},
  {section:"ALARA & Radiation Protection", type:"mc", text:"True or False: ALARA applies only to the patient being imaged, not to the operator.",
    options:["True","False"], answer:1},
  {section:"Patient Protection", type:"mc", text:"Which of the following must be used on every intraoral and panoramic exposure, without exception?",
    options:["Lead apron and thyroid collar","A larger field size for safety margin","A slower-speed film to be cautious","Nothing — modern equipment doesn't require shielding"], answer:0},
  {section:"Patient Protection", type:"short", text:"Why does using the fastest receptor and correct technique the first time matter for patient safety?",
    model:"A retake doubles (or multiplies) the patient's radiation dose unnecessarily — correct technique and the fastest receptor minimize the dose needed to get a diagnostic image on the first try."},
  {section:"Operator Protection", type:"mc", text:"What is the minimum recommended distance an operator should stand from the x-ray unit during exposure if no barrier is available?",
    options:["2 feet","6 feet","15 feet","There is no minimum distance"], answer:1},
  {section:"Operator Protection", type:"mc", text:"If no protective barrier is available, at what angle to the beam should the operator stand?",
    options:["Directly facing the beam","0–45°","90–135°","180°, directly behind the tube head"], answer:2},
  {section:"Radiation Dose & Monitoring", type:"mc", text:"What is the annual occupational whole-body Maximum Permissible Dose (MPD)?",
    options:["1 rem (10 mSv)","5 rem (50 mSv)","25 rem (250 mSv)","There is no annual limit"], answer:1},
  {section:"Radiation Dose & Monitoring", type:"mc", text:"What device tracks an operator's cumulative occupational radiation exposure over time?",
    options:["A film badge from patient charts","A personal dosimeter badge","The x-ray unit's internal counter","A daily sign-in sheet"], answer:1},
  {section:"Equipment Safety", type:"mc", text:"What is the FIRST step upon suspecting an x-ray unit malfunction?",
    options:["Continue carefully and monitor the unit","Stop use immediately","Finish the current patient's exposures first","Reduce exposure time but keep using it"], answer:1},
  {section:"Introduction to HIPAA", type:"mc", text:"Which HIPAA rule specifically sets requirements for protecting electronic PHI (ePHI)?",
    options:["The Privacy Rule (2003)","The Security Rule (2005)","The Portability Rule","The Disclosure Rule"], answer:1},
  {section:"Key Terminology", type:"mc", text:"What does PHI stand for?",
    options:["Personal Health Insurance","Protected Health Information","Patient History Index","Practice Health Inspection"], answer:1},
  {section:"Key Terminology", type:"short", text:"What is the difference between a Covered Entity and a Business Associate under HIPAA?",
    model:"A Covered Entity is an organization that handles PHI directly (providers, health plans, clearinghouses). A Business Associate is a third-party vendor that handles PHI on behalf of a Covered Entity (e.g., billing services, IT support) and must also comply with HIPAA."},
  {section:"Patient Privacy & PHI", type:"mc", text:"True or False: A patient's family member can always access that patient's PHI, simply by being family.",
    options:["True","False"], answer:1},
  {section:"Patient Privacy & PHI", type:"mc", text:"Are dental radiographs considered Protected Health Information (PHI) under HIPAA?",
    options:["Yes — they're governed by the same Privacy and Security Rules as any chart entry","No — only written notes count as PHI","Only if they are stored electronically","Only if the patient specifically requests privacy"], answer:0},
  {section:"Patient Rights", type:"mc", text:"Within how many days must a provider generally respond to a patient's request for a copy of their records?",
    options:["7 days","10 days","30 days","90 days"], answer:2},
];

let cur = 0;
let responses = {};
let mode = "quiz";

function buildDots(){
  const wrap = document.getElementById('dots');
  wrap.innerHTML = '';
  questions.forEach((q,i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (responses[i] !== undefined ? ' answered' : '') + (i===cur && mode==='quiz' ? ' current' : '');
    d.onclick = () => { if(mode==='quiz'){ cur = i; render(); } };
    wrap.appendChild(d);
  });
}

function isHipaa(q){
  return ["Introduction to HIPAA","Key Terminology","Patient Privacy & PHI","Patient Rights","Office Compliance"].includes(q.section);
}

function renderQuestion(){
  const q = questions[cur];
  const stage = document.getElementById('stageContent');
  let html = '<div class="stage">';
  html += '<span class="section-tag' + (isHipaa(q)?' hipaa':'') + '">' + q.section + '</span>';
  html += '<div class="qcard">';
  html += '<div class="qmeta">Question ' + (cur+1) + ' of ' + questions.length + (q.type==='short' ? ' — Self-check (not scored)' : '') + '</div>';
  html += '<p class="qtext">' + q.text + '</p>';

  if (q.type === 'mc'){
    html += '<div class="options" id="optsWrap">';
    q.options.forEach((opt,i) => {
      const chosen = responses[cur] === i;
      html += '<label class="opt" data-idx="'+i+'"><input type="radio" name="opt" value="'+i+'" '+(chosen?'checked':'')+' onchange="selectOption('+i+')"> ' + String.fromCharCode(65+i) + ') ' + opt + '</label>';
    });
    html += '</div><div class="feedback" id="fb"></div>';
  } else {
    const existing = responses[cur] && responses[cur].text ? responses[cur].text : '';
    const revealed = responses[cur] && responses[cur].revealed;
    html += '<textarea id="shortAns" placeholder="Type your answer here...">' + existing + '</textarea>';
    html += '<br><button class="reveal-btn" onclick="revealShort()">' + (revealed ? 'Hide' : 'Reveal') + ' Model Answer</button>';
    html += '<div class="model-answer" id="modelBox" style="display:' + (revealed ? 'block':'none') + '">' + q.model + '</div>';
  }
  html += '</div></div>';
  stage.innerHTML = html;

  if (q.type === 'short'){
    document.getElementById('shortAns').addEventListener('input', (e) => {
      responses[cur] = responses[cur] || {};
      responses[cur].text = e.target.value;
    });
  }

  document.getElementById('prevBtn').disabled = cur === 0;
  document.getElementById('nextBtn').disabled = cur === questions.length - 1;
  document.getElementById('counter').textContent = (cur+1) + ' / ' + questions.length;
}

function selectOption(i){
  responses[cur] = i;
  buildDots();
}

function revealShort(){
  responses[cur] = responses[cur] || {};
  responses[cur].revealed = !responses[cur].revealed;
  buildDots();
  render();
}

function go(dir){
  cur = Math.max(0, Math.min(questions.length-1, cur+dir));
  render();
}

function finishQuiz(){
  mode = 'review';
  render();
}

function retake(){
  responses = {};
  cur = 0;
  mode = 'quiz';
  render();
}

function scoreCount(){
  let correct = 0, total = 0;
  questions.forEach((q,i) => {
    if (q.type === 'mc'){
      total++;
      if (responses[i] === q.answer) correct++;
    }
  });
  return {correct, total};
}

function renderReview(){
  const s = scoreCount();
  const correct = s.correct, total = s.total;
  const pct = Math.round(correct/total*100);
  const stage = document.getElementById('stageContent');
  let html = '<div class="review-wrap">';
  html += '<div class="score-ring" style="--pct:' + pct + '%"><div class="score-ring-inner"><div class="num">' + correct + '/' + total + '</div><div class="den">correct</div></div></div>';
  html += '<div class="review-title">' + (pct === 100 ? 'Perfect score!' : pct >= 70 ? 'Nice work!' : 'Keep practicing — review below.') + '</div>';
  html += '<div class="grid15">';
  questions.forEach((q,i) => {
    let cls = 'selfcheck';
    if (q.type === 'mc'){
      cls = responses[i] === q.answer ? 'right' : 'wrong';
    }
    html += '<div class="tile ' + cls + '" onclick="openDetail(' + i + ')">' + (i+1) + '</div>';
  });
  html += '</div>';
  html += '<div class="review-actions"><button class="navbtn secondary" onclick="retake()">Retake Quiz</button></div>';
  html += '</div>';
  stage.innerHTML = html;
}

function openDetail(i){
  mode = 'detail';
  cur = i;
  render();
}

function renderDetail(){
  const q = questions[cur];
  const stage = document.getElementById('stageContent');
  let html = '<div class="detail-wrap">';
  html += '<span class="back-link" onclick="mode=\'review\'; render();">← Back to results</span>';
  html += '<span class="section-tag' + (isHipaa(q)?' hipaa':'') + '">' + q.section + '</span>';
  html += '<div class="qcard">';
  html += '<div class="qmeta">Question ' + (cur+1) + ' of ' + questions.length + (q.type==='short' ? ' — Self-check' : '') + '</div>';
  html += '<p class="qtext">' + q.text + '</p>';
  if (q.type === 'mc'){
    html += '<div class="options">';
    q.options.forEach((opt,i) => {
      let cls = 'disabled';
      if (i === q.answer) cls += ' correct';
      else if (responses[cur] === i) cls += ' incorrect';
      html += '<label class="opt ' + cls + '"><input type="radio" disabled ' + (responses[cur]===i?'checked':'') + '> ' + String.fromCharCode(65+i) + ') ' + opt + '</label>';
    });
    html += '</div>';
    const isRight = responses[cur] === q.answer;
    html += '<div class="feedback ' + (isRight?'correct':'incorrect') + '">' + (isRight ? '✓ Correct' : (responses[cur] !== undefined ? '✗ Incorrect' : '— Not answered')) + '</div>';
  } else {
    html += '<div class="model-answer" style="display:block;"><b>Model answer:</b> ' + q.model + '</div>';
    if (responses[cur] && responses[cur].text){
      html += '<div style="margin-top:10px; font-size:13px; color:var(--gray);"><b>Your answer:</b> ' + responses[cur].text + '</div>';
    }
  }
  html += '</div></div>';
  stage.innerHTML = html;
}

function render(){
  buildDots();
  const footer = document.getElementById('footerNav');
  if (mode === 'quiz'){
    footer.style.display = 'flex';
    renderQuestion();
  } else if (mode === 'review'){
    footer.style.display = 'none';
    renderReview();
  } else if (mode === 'detail'){
    footer.style.display = 'none';
    renderDetail();
  }
}

render();
</script>

</body>
</html>
