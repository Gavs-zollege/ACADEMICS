<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Personal Action Plan — Activity Timer</title>
<style>
  :root {
    --teal: #0D4B47;
    --teal-dark: #093733;
    --gold: #E8A33D;
    --gold-tint: #FCF1DF;
    --coral: #E15B4E;
    --cream: #FFFFFF;
    --tint: #EAF3F1;
    --ink: #1B2B2A;
    --muted: #5C7370;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Calibri, Roboto, sans-serif;
    background: var(--cream);
    color: var(--ink);
  }
  #app {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    background: var(--cream);
    transition: background 0.6s ease;
  }
  #app.break-mode { background: var(--gold-tint); }

  header {
    flex: 0 0 auto;
    padding: clamp(14px, 2.2vh, 26px) clamp(20px, 4vw, 56px) clamp(8px, 1.4vh, 16px);
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid #DCE9E7;
  }
  .header-left { display: flex; flex-direction: column; gap: 4px; }
  .kicker {
    font-size: clamp(10px, 1.1vw, 13px); font-weight: 700; letter-spacing: 2px;
    color: var(--coral); text-transform: uppercase;
  }
  h1 {
    margin: 0; font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(20px, 2.6vw, 34px); color: var(--teal); font-weight: 700;
  }
  .subtitle { font-size: clamp(11px, 1.1vw, 14px); color: var(--muted); font-style: italic; }
  .clock-box { text-align: right; }
  .clock-label { font-size: clamp(9px, 0.9vw, 11px); color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .clock-time { font-size: clamp(16px, 1.8vw, 22px); font-weight: 700; color: var(--teal); font-variant-numeric: tabular-nums; }

  .progress-track {
    flex: 0 0 auto; height: 8px; background: var(--tint); position: relative; overflow: hidden;
  }
  .progress-fill {
    position: absolute; top: 0; left: 0; height: 100%;
    background: linear-gradient(90deg, var(--teal), var(--gold));
    width: 0%; transition: width 0.4s linear;
  }

  main {
    flex: 1 1 auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: clamp(8px, 2vh, 24px) clamp(20px, 4vw, 56px);
    text-align: center;
    min-height: 0;
    position: relative;
  }

  .step-tag {
    font-size: clamp(11px, 1.1vw, 13px); font-weight: 700; letter-spacing: 2px;
    color: var(--gold); text-transform: uppercase; margin-bottom: 6px;
  }
  .step-tag.break-tag { color: var(--coral); }
  .step-name {
    font-family: Georgia, "Times New Roman", serif; font-weight: 700;
    font-size: clamp(20px, 3.2vw, 40px); color: var(--teal); margin: 0 0 clamp(6px, 1.2vh, 14px);
    max-width: 90%;
  }

  .timer-ring {
    position: relative;
    width: clamp(140px, 22vh, 260px); height: clamp(140px, 22vh, 260px);
    margin: clamp(4px, 1vh, 14px) 0;
    display: flex; align-items: center; justify-content: center;
  }
  .timer-ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
  .timer-ring circle.bg { stroke: var(--tint); }
  .timer-ring circle.fg { stroke: var(--teal); stroke-linecap: round; transition: stroke-dashoffset 0.9s linear, stroke 0.4s ease; }
  #app.break-mode .timer-ring circle.fg { stroke: var(--gold); }
  .timer-ring.flash circle.fg { stroke: var(--coral); }
  .timer-digits {
    font-variant-numeric: tabular-nums;
    font-size: clamp(30px, 5vh, 56px); font-weight: 700; color: var(--ink);
  }
  .timer-sub { font-size: clamp(10px, 1vw, 12px); color: var(--muted); margin-top: 2px; }

  .step-desc {
    max-width: 760px; font-size: clamp(12px, 1.3vw, 16px); color: var(--muted);
    line-height: 1.45; margin: clamp(4px, 1vh, 10px) 0 0;
  }

  .chips {
    flex: 0 0 auto; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
    padding: clamp(6px, 1.4vh, 14px) clamp(20px, 4vw, 56px);
  }
  .chip {
    display: flex; align-items: center; gap: 6px;
    border: 1.5px solid #DCE9E7; border-radius: 999px;
    padding: 6px 14px; font-size: clamp(10px, 1vw, 12.5px); color: var(--muted);
    cursor: pointer; background: var(--cream); transition: all 0.2s ease; white-space: nowrap;
  }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; background: #DCE9E7; flex: 0 0 auto; }
  .chip.done { border-color: var(--teal); color: var(--teal); }
  .chip.done .dot { background: var(--teal); }
  .chip.active { border-color: var(--gold); background: var(--gold-tint); color: var(--teal); font-weight: 700; }
  .chip.active .dot { background: var(--gold); }
  .chip.break-chip.active { border-color: var(--coral); background: #FBEAE8; }
  .chip.break-chip.active .dot { background: var(--coral); }

  footer {
    flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: clamp(10px, 1.8vh, 20px) clamp(20px, 4vw, 56px) clamp(14px, 2.2vh, 26px);
    border-top: 1px solid #DCE9E7;
    flex-wrap: wrap;
  }
  button {
    font-family: inherit; font-size: clamp(12px, 1.1vw, 14.5px); font-weight: 700;
    border-radius: 10px; border: none; padding: 12px 22px; cursor: pointer;
    transition: transform 0.12s ease, opacity 0.12s ease;
  }
  button:active { transform: scale(0.96); }
  button.primary { background: var(--teal); color: #fff; }
  button.primary.pause-state { background: var(--coral); }
  button.secondary { background: var(--tint); color: var(--teal); }
  button.ghost { background: transparent; color: var(--muted); border: 1.5px solid #DCE9E7; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .complete-overlay {
    position: fixed; inset: 0; background: rgba(13,75,71,0.96);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    color: #fff; text-align: center; padding: 40px; z-index: 50;
  }
  .complete-overlay.show { display: flex; }
  .complete-overlay h2 { font-family: Georgia, serif; font-size: clamp(28px, 4vw, 48px); margin: 0 0 12px; color: var(--gold); }
  .complete-overlay p { font-size: clamp(13px, 1.4vw, 17px); color: #CFE3E0; max-width: 600px; margin: 0 0 24px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="header-left">
      <div class="kicker">ACTIVITY · 45 MINUTES TOTAL</div>
      <h1>Personal Action Plan</h1>
      <div class="subtitle">Spans the Tea Break — 11:00–11:45 AM</div>
    </div>
    <div class="clock-box">
      <div class="clock-label">Live Time</div>
      <div class="clock-time" id="wallClock">--:--:--</div>
    </div>
  </header>

  <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

  <main>
    <div class="step-tag" id="stepTag">STEP 1 OF 4</div>
    <div class="step-name" id="stepName"></div>

    <div class="timer-ring" id="timerRing">
      <svg viewBox="0 0 120 120">
        <circle class="bg" cx="60" cy="60" r="52" stroke-width="8" fill="none"></circle>
        <circle class="fg" id="ringFg" cx="60" cy="60" r="52" stroke-width="8" fill="none"
          stroke-dasharray="326.7" stroke-dashoffset="0"></circle>
      </svg>
      <div>
        <div class="timer-digits" id="timerDigits">00:00</div>
        <div class="timer-sub" id="timerSub"></div>
      </div>
    </div>

    <p class="step-desc" id="stepDesc"></p>
  </main>

  <div class="chips" id="chips"></div>

  <footer>
    <button class="ghost" id="prevBtn">← Prev</button>
    <button class="secondary" id="resetBtn">Reset</button>
    <button class="primary" id="startBtn">Start</button>
    <button class="ghost" id="nextBtn">Next →</button>
    <button class="ghost" id="muteBtn">🔊 Sound On</button>
  </footer>

  <div class="complete-overlay" id="completeOverlay">
    <h2>Activity Complete</h2>
    <p>Personal Action Plan is done. Move to the next agenda item when you're ready.</p>
    <button class="secondary" id="closeOverlayBtn">Close</button>
  </div>
</div>

<script>
(function () {
  const steps = [{"name":"Draft Alone","min":15,"desc":"Silently draft your SMART-T action plan using one insight from the World Café.","kind":"work"},{"name":"Tea Break","min":15,"desc":"Step away and recharge. Leave your draft at your seat — we resume with the Consultancy Protocol right after.","kind":"break"},{"name":"Consultancy Protocol","min":10,"desc":"Form trios: Presenter, Coach, Timekeeper — rotate roles so each plan gets structured peer challenge.","kind":"work"},{"name":"Revise","min":5,"desc":"Revise your plan using your coach's toughest question.","kind":"work"}];
  const totalSeconds = 2700;
  const CIRC = 326.7;

  let stepIndex = 0;
  let remaining = steps[0].min * 60;
  let running = false;
  let muted = false;
  let timerId = null;
  let audioCtx = null;

  const app = document.getElementById("app");
  const stepTag = document.getElementById("stepTag");
  const stepName = document.getElementById("stepName");
  const stepDesc = document.getElementById("stepDesc");
  const timerDigits = document.getElementById("timerDigits");
  const timerSub = document.getElementById("timerSub");
  const ringFg = document.getElementById("ringFg");
  const timerRing = document.getElementById("timerRing");
  const progressFill = document.getElementById("progressFill");
  const chipsEl = document.getElementById("chips");
  const startBtn = document.getElementById("startBtn");
  const resetBtn = document.getElementById("resetBtn");
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const muteBtn = document.getElementById("muteBtn");
  const wallClock = document.getElementById("wallClock");
  const completeOverlay = document.getElementById("completeOverlay");
  const closeOverlayBtn = document.getElementById("closeOverlayBtn");

  function fmt(sec) {
    const m = Math.floor(Math.max(sec, 0) / 60);
    const s = Math.max(sec, 0) % 60;
    return String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  }

  function elapsedBeforeStep(idx) {
    let sum = 0;
    for (let i = 0; i < idx; i++) sum += steps[i].min * 60;
    return sum;
  }

  function renderChips() {
    chipsEl.innerHTML = "";
    steps.forEach((s, i) => {
      const chip = document.createElement("div");
      chip.className = "chip" + (s.kind === "break" ? " break-chip" : "") +
        (i < stepIndex ? " done" : "") + (i === stepIndex ? " active" : "");
      chip.innerHTML = '<span class="dot"></span><span>' + (i + 1) + ". " + s.name + " (" + s.min + "m)</span>";
      chip.addEventListener("click", () => jumpTo(i));
      chipsEl.appendChild(chip);
    });
  }

  function render() {
    const step = steps[stepIndex];
    const isBreak = step.kind === "break";
    app.classList.toggle("break-mode", isBreak);
    stepTag.textContent = "STEP " + (stepIndex + 1) + " OF " + steps.length;
    stepTag.className = "step-tag" + (isBreak ? " break-tag" : "");
    stepName.textContent = step.name;
    stepDesc.textContent = step.desc;
    timerDigits.textContent = fmt(remaining);
    timerSub.textContent = "of " + step.min + " min";

    const stepTotal = step.min * 60;
    const frac = stepTotal > 0 ? Math.max(0, remaining) / stepTotal : 0;
    ringFg.setAttribute("stroke-dashoffset", String(CIRC * (1 - frac)));

    const overallElapsed = elapsedBeforeStep(stepIndex) + (stepTotal - Math.max(remaining, 0));
    progressFill.style.width = Math.min(100, (overallElapsed / totalSeconds) * 100) + "%";

    prevBtn.disabled = stepIndex === 0;
    nextBtn.disabled = stepIndex === steps.length - 1;
    renderChips();
  }

  function beep() {
    if (muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18, 0.36].forEach((delay, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = i === 2 ? 880 : 660;
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.25, audioCtx.currentTime + delay + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + delay + 0.16);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + delay);
        osc.stop(audioCtx.currentTime + delay + 0.18);
      });
    } catch (e) {}
  }

  function flash() {
    timerRing.classList.add("flash");
    setTimeout(() => timerRing.classList.remove("flash"), 900);
  }

  function tick() {
    remaining--;
    if (remaining < 0) {
      beep();
      flash();
      if (stepIndex < steps.length - 1) {
        stepIndex++;
        remaining = steps[stepIndex].min * 60;
      } else {
        remaining = 0;
        pause();
        completeOverlay.classList.add("show");
      }
    }
    render();
  }

  function start() {
    if (running) return;
    running = true;
    startBtn.textContent = "Pause";
    startBtn.classList.add("pause-state");
    timerId = setInterval(tick, 1000);
  }
  function pause() {
    running = false;
    startBtn.textContent = "Start";
    startBtn.classList.remove("pause-state");
    if (timerId) clearInterval(timerId);
    timerId = null;
  }
  function reset() {
    pause();
    stepIndex = 0;
    remaining = steps[0].min * 60;
    completeOverlay.classList.remove("show");
    render();
  }
  function jumpTo(i) {
    stepIndex = i;
    remaining = steps[i].min * 60;
    completeOverlay.classList.remove("show");
    render();
  }

  startBtn.addEventListener("click", () => (running ? pause() : start()));
  resetBtn.addEventListener("click", reset);
  prevBtn.addEventListener("click", () => { if (stepIndex > 0) jumpTo(stepIndex - 1); });
  nextBtn.addEventListener("click", () => { if (stepIndex < steps.length - 1) jumpTo(stepIndex + 1); });
  muteBtn.addEventListener("click", () => {
    muted = !muted;
    muteBtn.textContent = muted ? "\ud83d\udd07 Sound Off" : "\ud83d\udd0a Sound On";
  });
  closeOverlayBtn.addEventListener("click", () => completeOverlay.classList.remove("show"));

  function updateClock() {
    const now = new Date();
    wallClock.textContent = now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }
  setInterval(updateClock, 1000);
  updateClock();

  render();
})();
</script>
</body>
</html>
