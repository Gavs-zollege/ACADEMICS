<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Patient Care – Flashcards</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  :root{--navy:#1b3a5c;--gold:#c9a84c;--teal:#2a8fa3;--bg:#0f1e2e;--surface:#162840;--surface2:#1e3550;--text:#e8eef5;--muted:#7a9bbf;--border:#2a4060;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;padding:10px 12px;}

  .badge{display:inline-block;background:var(--gold);color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;margin:4px 0 1px;}
  h1 span{color:var(--gold);}
  .subtitle{color:var(--muted);font-size:12px;}
  header{text-align:center;margin-bottom:8px;}

  .pills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:8px;}
  .pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);transition:all .2s;font-family:'Plus Jakarta Sans',sans-serif;}
  .pill.active{border-color:var(--gold);background:#2a2010;color:var(--gold);}

  .counter-row{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:540px;font-size:12px;color:var(--muted);margin-bottom:4px;}

  .dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:540px;margin-bottom:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--surface2);border:1px solid var(--border);transition:background .3s;}
  .dot.seen{background:var(--teal);}
  .dot.current{background:var(--gold);}

  .card-wrap{width:100%;max-width:540px;perspective:1200px;margin-bottom:10px;}
  .card-inner{position:relative;width:100%;height:200px;transition:transform .6s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d;cursor:pointer;}
  .card-inner.flipped{transform:rotateY(180deg);}
  .card-face{position:absolute;width:100%;height:100%;border-radius:14px;padding:20px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  .front{background:linear-gradient(135deg,#1e3f6a 0%,#162840 100%);border:1.5px solid var(--teal);}
  .back{background:linear-gradient(135deg,#1b3a30 0%,#0f2020 100%);border:1.5px solid var(--gold);transform:rotateY(180deg);}
  .card-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin-bottom:10px;}
  .front .card-label{color:var(--teal);}
  .back .card-label{color:var(--gold);}
  .card-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:15px;font-weight:700;line-height:1.4;color:var(--text);}
  .card-hint{margin-top:10px;font-size:11px;color:var(--muted);}

  .nav-btns{display:flex;gap:10px;align-items:center;max-width:540px;width:100%;}
  .btn{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:13px;cursor:pointer;border:none;border-radius:8px;padding:9px 18px;transition:all .2s;}
  .btn-primary{background:var(--gold);color:var(--navy);}
  .btn-primary:hover{background:#e0ba66;}
  .btn-sec{background:var(--surface2);color:var(--text);flex:1;}
  .btn-sec:hover{background:#2a4a70;}
  .btn-out{background:transparent;border:1.5px solid var(--teal);color:var(--teal);}
  .btn-out:hover{background:var(--teal);color:#fff;}

  #complete{display:none;text-align:center;max-width:540px;width:100%;padding:20px;background:var(--surface);border:1px solid var(--border);border-radius:14px;margin-top:10px;}
  #complete h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:18px;font-weight:800;margin-bottom:8px;}
</style>
</head>
<body>
<header>
  
  <h1>General Patient Care <span>Flashcards</span></h1>
  <p class="subtitle">Click each card to reveal the answer · 28 cards</p>
</header>

<div class="pills">
  <div class="pill active" onclick="filterCat('all',this)">All</div>
  <div class="pill" onclick="filterCat('room',this)">🏥 Room</div>
  <div class="pill" onclick="filterCat('injection',this)">💉 Injections</div>
  <div class="pill" onclick="filterCat('meds',this)">💊 Meds</div>
  <div class="pill" onclick="filterCat('eye-ear',this)">👁️ Eye/Ear</div>
  <div class="pill" onclick="filterCat('ehr',this)">💻 EHR</div>
</div>

<div class="counter-row">
  <span id="card-counter">Card 1 of 28</span>
  <span id="flip-state">Click to reveal →</span>
</div>
<div class="dots" id="dots"></div>

<div class="card-wrap">
  <div class="card-inner" id="card" onclick="flip()">
    <div class="card-face front">
      <div class="card-label">Question / Term</div>
      <div class="card-text" id="front-text"></div>
      <div class="card-hint">👆 Click to flip</div>
    </div>
    <div class="card-face back">
      <div class="card-label">Answer</div>
      <div class="card-text" id="back-text"></div>
    </div>
  </div>
</div>

<div class="nav-btns">
  <button class="btn btn-sec" onclick="prev()">← Prev</button>
  <button class="btn btn-primary" onclick="next()">Next →</button>
  <button class="btn btn-out" onclick="shuffle()">🔀</button>
</div>

<div id="complete">
  <div style="font-size:36px;margin-bottom:8px">🎉</div>
  <h2>All Cards Done!</h2>
  <p style="color:var(--muted);font-size:13px;margin-bottom:12px">Keep practicing to lock in those concepts!</p>
  <button class="btn btn-primary" onclick="resetDeck()">Start Over</button>
</div>

<script>
const allCards=[
  {front:"What is the correct sequence for cleaning between patients?",back:"Disinfect all surfaces → allow to dry → replace table paper → change pillow cover → discard disposables.",cat:"room"},
  {front:"What two identifiers are required to verify a patient?",back:"Full name AND date of birth — always two identifiers, every time.",cat:"room"},
  {front:"What standard diagnostic equipment belongs in every exam room?",back:"Thermometer, stethoscope, BP cuff, pulse oximeter, reflex hammer, otoscope, ophthalmoscope.",cat:"room"},
  {front:"How should you approach a patient before any procedure?",back:"Knock → introduce yourself → identify with two identifiers → explain in plain language.",cat:"room"},
  {front:"What position is used for vaginal exams and Pap tests?",back:"Lithotomy — patient on back, feet in stirrups, slides to edge of table.",cat:"room"},
  {front:"Intradermal (ID) — angle, gauge, max volume?",back:"5–15° | 25–27G, ¼–½ inch | ≤0.1 mL. A wheal must form for TB test to be valid.",cat:"injection"},
  {front:"Subcutaneous (SC) — angle, gauge, max volume?",back:"45° | 23–25G, 5/8 inch | ≤1.5 mL. Pinch ≥1 inch of skin. Do not massage. Rotate sites.",cat:"injection"},
  {front:"Intramuscular (IM) — angle, gauge, max volume?",back:"90° | 22–25G, 1–1½ inch | Up to 3 mL. Stretch skin taut. Insert like a dart.",cat:"injection"},
  {front:"Which injection site is preferred for children under 3?",back:"Vastus lateralis (outer thigh) — the deltoid muscle is underdeveloped in young children.",cat:"injection"},
  {front:"How long should patient wait after injection?",back:"20–30 minutes post-injection to monitor for allergic reactions.",cat:"injection"},
  {front:"How do you handle an ampule?",back:"Snap neck with alcohol swab. Draw with filter needle. Replace filter needle before injecting.",cat:"injection"},
  {front:"Which is larger: 18G or 25G needle?",back:"18G is larger. Higher gauge = smaller lumen. Select based on medication viscosity.",cat:"injection"},
  {front:"What does '3 mL 22G × 1½' on a package mean?",back:"Syringe = 3 mL | Gauge = 22 | Length = 1.5 inches.",cat:"injection"},
  {front:"Dosage formula?",back:"X = (D ÷ H) × Q\nD = Desired dose | H = dose on Hand | Q = Quantity",cat:"meds"},
  {front:"What are the Nine Rights of Medication Administration?",back:"Patient · Medication · Form · Dose · Route · Time · Technique · Education · Documentation",cat:"meds"},
  {front:"MAR — what goes in it?",back:"Date, time, drug name, dose, route, provider name, frequency, duration, allergies, reactions.",cat:"meds"},
  {front:"How must controlled substances be stored?",back:"Double lock. Daily count by two people. All use logged.",cat:"meds"},
  {front:"What goes in an immunization log?",back:"Vaccine name, lot number, manufacturer, expiration, site/route, date, patient consent.",cat:"meds"},
  {front:"Vaccine storage temperatures?",back:"Refrigerator: daily at 2–8°C | Freezer: twice daily. Log temperatures. Rotate by expiration.",cat:"meds"},
  {front:"How do you administer eye drops?",back:"Patient supine → pull lower eyelid → dispense ½ inch above sac → do not touch eye or skin.",cat:"eye-ear"},
  {front:"Direction of eye irrigation flow?",back:"Inner (medial) to outer (lateral) canthus in a steady stream aimed at lower conjunctiva.",cat:"eye-ear"},
  {front:"Ear drops direction — Adults vs Children?",back:"Adults: pull pinna OUTWARD & UPWARD\nChildren: pull pinna OUTWARD & DOWNWARD",cat:"eye-ear"},
  {front:"How long does patient stay on their side after ear drops?",back:"5 minutes. Insert a loose cotton ball if ordered.",cat:"eye-ear"},
  {front:"What is ear irrigation used to remove?",back:"Impacted cerumen (earwax) or foreign objects. Patient lies on irrigated side for 15 min after.",cat:"eye-ear"},
  {front:"EMR vs EHR — what's the difference?",back:"EMR: single organization only.\nEHR: shared across multiple organizations and providers.",cat:"ehr"},
  {front:"What is CPOE?",back:"Computerized Provider Order Entry. Electronic ordering of meds, labs, referrals. Flags drug interactions.",cat:"ehr"},
  {front:"What is required for e-prescribing controlled substances?",back:"DEA-approved EPCS software. DEA number, provider phone, date/time, pharmacy name required.",cat:"ehr"},
  {front:"What are MA telehealth duties?",back:"Confirm tech requirements → test connection → gather history and med list → remind patient to have vitals ready.",cat:"ehr"}
];

let deck=[...allCards],current=0,isFlipped=false,catFilter='all';

function filterCat(cat,el){
  catFilter=cat;
  document.querySelectorAll('.pill').forEach(p=>p.classList.remove('active'));
  el.classList.add('active');
  deck=cat==='all'?[...allCards]:allCards.filter(c=>c.cat===cat);
  current=0;isFlipped=false;
  document.getElementById('complete').style.display='none';
  document.getElementById('card').style.display='block';
  document.querySelector('.nav-btns').style.display='flex';
  buildDots();loadCard();
}

function buildDots(){
  const d=document.getElementById('dots');d.innerHTML='';
  deck.forEach((_,i)=>{
    const dot=document.createElement('div');
    dot.className='dot'+(i===0?' current':'');
    dot.id=`dot-${i}`;d.appendChild(dot);
  });
}

function loadCard(){
  if(current>=deck.length){showComplete();return;}
  const c=deck[current];
  document.getElementById('front-text').textContent=c.front;
  document.getElementById('back-text').textContent=c.back;
  document.getElementById('card-counter').textContent=`Card ${current+1} of ${deck.length}`;
  document.getElementById('flip-state').textContent='Click to reveal →';
  document.getElementById('card').classList.remove('flipped');
  isFlipped=false;
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.className='dot'+(i<current?' seen':i===current?' current':'');
  });
}

function flip(){
  isFlipped=!isFlipped;
  document.getElementById('card').classList.toggle('flipped',isFlipped);
  document.getElementById('flip-state').textContent=isFlipped?'← Click to flip back':'Click to reveal →';
}

function next(){current++;if(current>=deck.length)showComplete();else loadCard();}
function prev(){if(current>0){current--;loadCard();}}
function shuffle(){deck=[...deck].sort(()=>Math.random()-.5);current=0;buildDots();loadCard();}

function showComplete(){
  document.getElementById('card').style.display='none';
  document.querySelector('.nav-btns').style.display='none';
  document.getElementById('complete').style.display='block';
}

function resetDeck(){
  current=0;
  deck=catFilter==='all'?[...allCards]:allCards.filter(c=>c.cat===catFilter);
  document.getElementById('card').style.display='block';
  document.querySelector('.nav-btns').style.display='flex';
  document.getElementById('complete').style.display='none';
  buildDots();loadCard();
}

buildDots();loadCard();
</script>
</body>
</html>
