<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>General Patient Care – True or False</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  :root{--navy:#1b3a5c;--gold:#c9a84c;--teal:#2a8fa3;--bg:#0f1e2e;--surface:#162840;--surface2:#1e3550;--text:#e8eef5;--muted:#7a9bbf;--border:#2a4060;--true:#2db37a;--false:#e05252;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;padding:10px 12px;}

  header{text-align:center;margin-bottom:8px;}
  .badge{display:inline-block;background:var(--gold);color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;margin:4px 0 1px;}
  h1 span{color:var(--gold);}
  .subtitle{color:var(--muted);font-size:12px;}

  .streak-bar{display:flex;align-items:center;gap:8px;max-width:600px;width:100%;margin-bottom:6px;background:var(--surface);border-radius:8px;padding:8px 12px;border:1px solid var(--border);}
  .streak-label{font-size:11px;color:var(--muted);}
  .streak-num{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;color:var(--gold);}
  .streak-spacer{flex:1;}
  .stat-item{text-align:center;}
  .stat-val{font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;}
  .correct-val{color:var(--true);}
  .wrong-val{color:var(--false);}
  .stat-lbl{font-size:10px;color:var(--muted);}
  .divider{width:1px;height:32px;background:var(--border);margin:0 10px;}

  .progress-wrap{width:100%;max-width:600px;background:var(--surface);border-radius:6px;height:6px;margin-bottom:8px;overflow:hidden;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:6px;transition:width .3s;}

  .statement-card{background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:20px 24px;max-width:600px;width:100%;margin-bottom:10px;text-align:center;min-height:130px;display:flex;flex-direction:column;justify-content:center;align-items:center;transition:border-color .3s,background .3s;}
  .statement-card.correct{border-color:var(--true);background:#0f2820;}
  .statement-card.wrong{border-color:var(--false);background:#2a0f0f;}
  .q-label{font-size:10px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;}
  .statement-text{font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;line-height:1.4;}

  .answer-buttons{display:flex;gap:12px;max-width:600px;width:100%;margin-bottom:8px;}
  .tf-btn{flex:1;padding:14px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;font-size:18px;cursor:pointer;border:2.5px solid;border-radius:12px;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--surface2);}
  .tf-btn:disabled{opacity:.5;cursor:default;transform:none!important;}
  .true-btn{border-color:var(--true);color:var(--true);}
  .true-btn:hover:not(:disabled){background:var(--true);color:#fff;transform:scale(1.02);}
  .false-btn{border-color:var(--false);color:var(--false);}
  .false-btn:hover:not(:disabled){background:var(--false);color:#fff;transform:scale(1.02);}

  .feedback-area{max-width:600px;width:100%;min-height:60px;padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.5;display:none;margin-bottom:8px;}
  .correct-fb{background:#0d2820;border:1px solid var(--true);color:#5de8a8;display:block;}
  .wrong-fb{background:#2a0d0d;border:1px solid var(--false);color:#f09090;display:block;}

  .btn-next{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;padding:10px 26px;border-radius:8px;cursor:pointer;border:none;background:var(--gold);color:var(--navy);display:none;transition:all .2s;}
  .btn-next:hover{background:#e0ba66;}

  #score-screen{display:none;text-align:center;max-width:600px;width:100%;}
  .score-ring{width:110px;height:110px;border-radius:50%;border:5px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:16px auto;}
  .score-num{font-family:'Plus Jakarta Sans',sans-serif;font-size:36px;font-weight:800;color:var(--gold);}
  .score-lbl{font-size:12px;color:var(--muted);}
  .score-msg{font-size:18px;font-weight:700;margin-bottom:6px;font-family:'Plus Jakarta Sans',sans-serif;}
  .score-sub{color:var(--muted);font-size:13px;margin-bottom:16px;}
  .btn-restart{background:var(--gold);color:var(--navy);border:none;padding:10px 24px;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;cursor:pointer;}
</style>
</head>
<body>
<header>
  
  <h1>True <span>or</span> False</h1>
  <p class="subtitle">25 statements · Can you spot what's wrong?</p>
</header>

<div class="streak-bar">
  <span style="font-size:16px">🔥</span>
  <div><div class="streak-label">Streak</div><div class="streak-num" id="streak">0</div></div>
  <div class="streak-spacer"></div>
  <div class="stat-item"><div class="stat-val correct-val" id="correct-count">0</div><div class="stat-lbl">Correct</div></div>
  <div class="divider"></div>
  <div class="stat-item"><div class="stat-val wrong-val" id="wrong-count">0</div><div class="stat-lbl">Wrong</div></div>
</div>

<div class="progress-wrap"><div class="progress-bar" id="progress" style="width:4%"></div></div>

<div class="statement-card" id="statement-card">
  <div class="q-label" id="q-label">STATEMENT 1 OF 25</div>
  <div class="statement-text" id="statement-text"></div>
</div>

<div class="answer-buttons">
  <button class="tf-btn true-btn" id="true-btn" onclick="answer(true)">✅ True</button>
  <button class="tf-btn false-btn" id="false-btn" onclick="answer(false)">❌ False</button>
</div>

<div class="feedback-area" id="feedback"></div>
<button class="btn-next" id="next-btn" onclick="nextQ()">Next Statement →</button>

<div id="score-screen">
  <div class="score-ring">
    <div class="score-num" id="final-num">0</div>
    <div class="score-lbl" id="final-lbl">/25</div>
  </div>
  <div class="score-msg" id="score-msg"></div>
  <div class="score-sub" id="score-sub"></div>
  <button class="btn-restart" onclick="restart()">🔄 Play Again</button>
</div>

<script>
const statements=[
  {s:"A medical assistant should review the day's schedule first thing in the morning to prepare the correct equipment for each patient.",ans:true,exp:"Correct! Reviewing the schedule tells you what room, supplies, and equipment are needed before each patient arrives."},
  {s:"You should enter a patient's exam room without knocking if the visit is routine.",ans:false,exp:"False. Always knock and ask permission before entering — regardless of how routine the visit is."},
  {s:"An intradermal injection is given at a 5–15° angle, nearly parallel to the skin.",ans:true,exp:"Correct! The shallow angle keeps the medication in the dermis, producing the wheal required for TB testing."},
  {s:"For a subcutaneous injection, you should pinch at least 1 inch of skin before inserting the needle.",ans:true,exp:"Correct! Pinching ≥1 inch lifts subcutaneous tissue away from muscle, ensuring proper placement."},
  {s:"Higher needle gauge numbers mean a larger needle opening (lumen).",ans:false,exp:"False. Higher gauge = SMALLER lumen. An 18G needle is larger than a 25G needle."},
  {s:"A multi-dose vial can be used indefinitely as long as it is refrigerated.",ans:false,exp:"False. Multi-dose vials expire 28 days after opening, regardless of refrigeration. Write the opening date on the vial."},
  {s:"Medication should always be documented in the MAR AFTER administration, never before.",ans:true,exp:"Correct! This is the 9th Right. Documenting before could lead to double-dosing if the medication isn't given."},
  {s:"After an intradermal TB test, you should massage the site to help the medication absorb.",ans:false,exp:"False. Never massage, bandage, or apply pressure after an ID injection — this disrupts the wheal needed for accurate reading."},
  {s:"The lithotomy position uses stirrups and is used for vaginal exams and Pap tests.",ans:true,exp:"Correct! The patient lies supine with feet in stirrups and slides to the table edge for pelvic procedures."},
  {s:"Used needles should be placed in the biohazard bag after use.",ans:false,exp:"False! Used needles go DIRECTLY into the sharps container — never in a biohazard bag or regular trash."},
  {s:"For ear drop instillation in children, the pinna is pulled outward and UPWARD.",ans:false,exp:"False. For children/infants, pull the pinna outward and DOWNWARD. Adults require outward and UPWARD."},
  {s:"Eye drops should be dispensed directly into the eyeball for best absorption.",ans:false,exp:"False. Dispense drops about ½ inch ABOVE the conjunctival sac — never touch the eye with the applicator."},
  {s:"An EHR (Electronic Health Record) can be shared across multiple healthcare organizations.",ans:true,exp:"Correct! Unlike an EMR, an EHR is designed to share records across providers, labs, specialists, and hospitals."},
  {s:"CPOE allows providers to enter orders electronically, reducing handwriting errors.",ans:true,exp:"Correct! CPOE also integrates clinical decision support to flag drug interactions and dosage errors."},
  {s:"The vastus lateralis is the preferred injection site for children under 3 years old.",ans:true,exp:"Correct! The outer thigh is preferred in young children because their deltoid muscle is underdeveloped."},
  {s:"The dosage formula is: X = (D ÷ H) × Q, where D = desired, H = on hand, Q = quantity.",ans:true,exp:"Correct! This is the standard dosage calculation formula used in medication administration."},
  {s:"An EMR and EHR are the same thing — just different abbreviations.",ans:false,exp:"False. An EMR is limited to one organization. An EHR extends across multiple organizations for coordinated care."},
  {s:"Controlled substances must be stored under double lock and counted daily by two people.",ans:true,exp:"Correct! All controlled substance use must be logged. Shortcuts can lead to serious legal consequences."},
  {s:"After eye irrigation, you dry the eyelid from outer to inner corner.",ans:false,exp:"False. Dry from INNER to OUTER corner (medial to lateral). This prevents debris from contaminating the inner eye."},
  {s:"Older adult patients should be spoken to quickly to respect their time.",ans:false,exp:"False. Allow extra time for older adults — for movement, processing questions, and medication review."},
  {s:"The deltoid muscle can accept intramuscular injections of up to 3 mL.",ans:false,exp:"False. The deltoid is limited to ≤1 mL. Ventrogluteal and vastus lateralis sites can accept up to 3 mL."},
  {s:"A filter needle must be used when drawing medication from a glass ampule.",ans:true,exp:"Correct! The filter needle prevents glass fragments from entering the syringe. Replace before injecting."},
  {s:"The Fowler's position (90°) is appropriate for patients with breathing difficulty.",ans:true,exp:"Correct! The upright position opens the airways and is also used for head, neck, and upper body exams."},
  {s:"After administering an injection, ask the patient to wait at least 5 minutes before leaving.",ans:false,exp:"False. Patients should wait 20–30 minutes post-injection to monitor for allergic reactions."},
  {s:"The left lateral position is used for rectal exams, enemas, and rectal temperatures.",ans:true,exp:"Correct! The patient lies on their left side. This provides optimal access for rectal and perineal exams."}
];

let current=0,score=0,wrong=0,streak=0,answered=false;

function loadQ(){
  const q=statements[current];
  document.getElementById('statement-text').textContent=q.s;
  document.getElementById('q-label').textContent=`STATEMENT ${current+1} OF ${statements.length}`;
  document.getElementById('progress').style.width=`${((current+1)/statements.length)*100}%`;
  document.getElementById('statement-card').className='statement-card';
  document.getElementById('feedback').className='feedback-area';
  document.getElementById('feedback').style.display='none';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('true-btn').disabled=false;
  document.getElementById('false-btn').disabled=false;
  answered=false;
}

function answer(userAns){
  if(answered)return;answered=true;
  const q=statements[current];
  const correct=userAns===q.ans;
  document.getElementById('true-btn').disabled=true;
  document.getElementById('false-btn').disabled=true;
  const card=document.getElementById('statement-card');
  const fb=document.getElementById('feedback');
  if(correct){
    score++;streak++;
    card.className='statement-card correct';
    fb.className='feedback-area correct-fb';
    fb.innerHTML=`✅ <strong>Correct!</strong> ${q.exp}`;
    document.getElementById('correct-count').textContent=score;
  } else {
    wrong++;streak=0;
    card.className='statement-card wrong';
    fb.className='feedback-area wrong-fb';
    fb.innerHTML=`❌ <strong>${userAns?'That\'s False.':'That\'s True.'}</strong> ${q.exp}`;
    document.getElementById('wrong-count').textContent=wrong;
  }
  document.getElementById('streak').textContent=streak;
  document.getElementById('next-btn').style.display='inline-block';
}

function nextQ(){
  current++;
  if(current>=statements.length)showScore();
  else loadQ();
}

function showScore(){
  document.getElementById('statement-card').style.display='none';
  document.querySelector('.answer-buttons').style.display='none';
  document.getElementById('feedback').style.display='none';
  document.getElementById('next-btn').style.display='none';
  document.getElementById('score-screen').style.display='block';
  const pct=Math.round((score/statements.length)*100);
  document.getElementById('final-num').textContent=score;
  document.getElementById('final-lbl').textContent=`/${statements.length}`;
  let msg,sub;
  if(pct>=90){msg='🏆 Expert Level!';sub='Outstanding performance. You really know this material!';}
  else if(pct>=75){msg='👍 Great Job!';sub='Strong showing! Review the ones you missed before class.';}
  else if(pct>=60){msg='📚 Getting There!';sub='Decent foundation. Revisit the slides and try again.';}
  else{msg='💪 Keep Practicing!';sub='Review the pre-class material — you\'ve got this!';}
  document.getElementById('score-msg').textContent=msg;
  document.getElementById('score-sub').textContent=sub;
}

function restart(){
  current=0;score=0;wrong=0;streak=0;answered=false;
  statements.sort(()=>Math.random()-.5);
  document.getElementById('correct-count').textContent='0';
  document.getElementById('wrong-count').textContent='0';
  document.getElementById('streak').textContent='0';
  document.getElementById('score-screen').style.display='none';
  document.getElementById('statement-card').style.display='flex';
  document.querySelector('.answer-buttons').style.display='flex';
  loadQ();
}
loadQ();
</script>
</body>
</html>
