<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Injection Decision Simulator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600&display=swap');
  :root{--navy:#1b3a5c;--gold:#c9a84c;--teal:#2a8fa3;--bg:#0f1e2e;--surface:#162840;--surface2:#1e3550;--text:#e8eef5;--muted:#7a9bbf;--border:#2a4060;--correct:#2db37a;--wrong:#e05252;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  body{display:flex;flex-direction:column;align-items:center;padding:10px 12px;}

  header{text-align:center;margin-bottom:8px;}
  .badge{display:inline-block;background:var(--gold);color:var(--navy);font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:10px;letter-spacing:2px;text-transform:uppercase;padding:3px 10px;border-radius:20px;}
  h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;margin:4px 0 1px;}
  h1 span{color:var(--gold);}
  .subtitle{color:var(--muted);font-size:12px;}

  .progress-row{display:flex;justify-content:space-between;align-items:center;max-width:700px;width:100%;margin-bottom:4px;font-size:12px;color:var(--muted);}
  .progress-wrap{background:var(--surface);border-radius:6px;height:5px;flex:1;margin:0 10px;overflow:hidden;}
  .progress-bar{height:100%;background:linear-gradient(90deg,var(--teal),var(--gold));border-radius:6px;transition:width .4s;}

  .sc-card{background:var(--surface);border:1.5px solid var(--teal);border-radius:12px;padding:14px 18px;max-width:700px;width:100%;margin-bottom:8px;}
  .sc-header{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;}
  .sc-icon{font-size:28px;flex-shrink:0;}
  .sc-meta{}
  .sc-num{font-size:10px;color:var(--teal);font-weight:700;letter-spacing:1px;text-transform:uppercase;}
  .sc-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;font-weight:700;margin:3px 0;}
  .sc-body{font-size:13px;color:#c0d0e0;line-height:1.5;}
  .sc-question{font-size:13px;font-weight:600;color:var(--gold);margin-top:8px;}

  .choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:700px;width:100%;margin-bottom:8px;}
  .choice{background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;cursor:pointer;font-size:12px;line-height:1.4;transition:all .2s;}
  .choice:hover:not(.locked){border-color:var(--teal);background:#1e3f60;}
  .choice .choice-label{font-weight:700;color:var(--muted);font-size:11px;margin-bottom:3px;}
  .choice.correct{border-color:var(--correct);background:#0d2820;}
  .choice.correct .choice-label{color:var(--correct);}
  .choice.wrong{border-color:var(--wrong);background:#2a0d0d;}
  .choice.wrong .choice-label{color:var(--wrong);}
  .choice.locked{cursor:default;}

  .result{display:none;padding:10px 14px;border-radius:8px;font-size:12px;line-height:1.5;max-width:700px;width:100%;margin-bottom:8px;}
  .result.correct-r{background:#0d2820;border:1px solid var(--correct);color:#5de8a8;display:block;}
  .result.wrong-r{background:#2a0d0d;border:1px solid var(--wrong);color:#f09090;display:block;}

  .nav-wrap{text-align:center;}
  .btn-next{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;padding:10px 26px;border-radius:8px;cursor:pointer;border:none;background:var(--gold);color:var(--navy);display:none;transition:all .2s;}
  .btn-next:hover{background:#e0ba66;}

  #complete-card{display:none;text-align:center;max-width:700px;width:100%;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:30px;}
  #complete-card h2{font-family:'Plus Jakarta Sans',sans-serif;font-size:20px;font-weight:800;margin:10px 0 6px;}
</style>
</head>
<body>
<header>
  
  <h1>Injection Decision <span>Simulator</span></h1>
  <p class="subtitle">Real patient scenarios — make the right clinical call</p>
</header>

<div class="progress-row">
  <span id="sc-counter">Scenario 1 of 10</span>
  <div class="progress-wrap"><div class="progress-bar" id="progress" style="width:10%"></div></div>
  <span id="score-badge">Score: 0</span>
</div>

<div class="sc-card" id="scenario-card">
  <div class="sc-header">
    <div class="sc-icon" id="sc-icon">💉</div>
    <div class="sc-meta">
      <div class="sc-num" id="sc-num">SCENARIO 1</div>
      <div class="sc-title" id="sc-title"></div>
    </div>
  </div>
  <div class="sc-body" id="sc-body"></div>
  <div class="sc-question" id="sc-question"></div>
</div>

<div class="choices" id="choices"></div>
<div class="result" id="result-panel"></div>
<div class="nav-wrap"><button class="btn-next" id="next-btn" onclick="nextScenario()">Next Scenario →</button></div>

<div id="complete-card">
  <div style="font-size:44px">🩺</div>
  <h2>All Scenarios Complete!</h2>
  <p style="color:var(--muted);margin-bottom:20px;">Final Score: <strong id="final-score" style="color:var(--gold);font-size:17px"></strong></p>
  <button onclick="restart()" style="background:var(--gold);color:var(--navy);border:none;padding:10px 24px;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:14px;cursor:pointer">🔄 Try Again</button>
</div>

<script>
const scenarios=[
  {icon:"👶",title:"Pediatric MMR Vaccine",body:"A <strong>2-year-old child</strong> needs their MMR vaccine. Volume is <strong>0.5 mL</strong>. Select the correct injection type and site.",choices:[{label:"Option A",text:"IM injection into the deltoid using a 1½ inch needle",correct:false},{label:"Option B",text:"IM injection into the vastus lateralis (outer thigh) using a 1 inch needle",correct:true},{label:"Option C",text:"Subcutaneous injection into the upper arm at 45°",correct:false},{label:"Option D",text:"IM injection into the ventrogluteal with a 1½ inch needle",correct:false}],exp:"The vastus lateralis (outer thigh) is preferred for children under 3 — the deltoid is underdeveloped. A 1 inch needle is appropriate for this age and volume."},
  {icon:"🧪",title:"TB Skin Test Setup",body:"A provider orders a <strong>tuberculin skin test with 0.1 mL of PPD</strong>. Select the correct syringe, needle, and technique.",choices:[{label:"Option A",text:"Tuberculin syringe, 25G ½ inch needle, inject at 45° into upper arm",correct:false},{label:"Option B",text:"Tuberculin syringe, 25G ¼ inch needle, inject at 5–15° on inner forearm — wheal must form",correct:true},{label:"Option C",text:"Hypodermic syringe, 22G 1 inch needle, inject at 90° into deltoid",correct:false},{label:"Option D",text:"Insulin syringe, 27G needle, inject at 5° into the abdomen",correct:false}],exp:"TB tests are intradermal (ID): tuberculin syringe, 25–27G, ¼–½ inch, 5–15° on inner forearm. A wheal MUST form for the test to be valid."},
  {icon:"🏥",title:"Post-Injection Protocol",body:"You just gave a flu shot (IM) to an adult patient. They feel fine and want to leave right away.",choices:[{label:"Option A",text:"Let them go — the injection went well and they feel fine",correct:false},{label:"Option B",text:"Ask them to sit for 5 minutes as a standard precaution",correct:false},{label:"Option C",text:"Ask them to wait 20–30 minutes to monitor for allergic reactions",correct:true},{label:"Option D",text:"Only ask them to wait if they have a history of allergies",correct:false}],exp:"All patients should wait 20–30 minutes post-injection to monitor for allergic reactions — including anaphylaxis. This applies universally, not just to patients with known allergies."},
  {icon:"💊",title:"Ampule Technique",body:"You need <strong>1.5 mL of medication from a glass ampule</strong> for an IM injection into the ventrogluteal site.",choices:[{label:"Option A",text:"Snap neck with bare hands, draw with regular needle, inject immediately",correct:false},{label:"Option B",text:"Snap neck with alcohol swab, draw with filter needle, inject with the same filter needle",correct:false},{label:"Option C",text:"Snap neck with alcohol swab, draw with filter needle, REPLACE needle before injecting",correct:true},{label:"Option D",text:"Use a needleless syringe to draw up from the top of the open ampule",correct:false}],exp:"Always snap the ampule neck using an alcohol swab or protector. Draw with a FILTER NEEDLE to prevent glass fragments. Then REPLACE the filter needle with a standard needle before injecting."},
  {icon:"📋",title:"Multi-Dose Vial Expiration",body:"You open a new multi-dose vial of influenza vaccine today (Monday). A colleague asks when the vial expires.",choices:[{label:"Option A",text:"It expires on the manufacturer's printed date on the label",correct:false},{label:"Option B",text:"It expires 28 days from today — write the opening date on the vial",correct:true},{label:"Option C",text:"It never expires once opened if stored correctly at 2–8°C",correct:false},{label:"Option D",text:"It expires 14 days from the first use",correct:false}],exp:"Multi-dose vials expire 28 days after opening, regardless of the manufacturer's printed expiration date. Always write the opening date on the vial."},
  {icon:"💉",title:"Insulin Injection",body:"A diabetic patient needs their regular insulin injection. Preparing a <strong>subcutaneous insulin injection</strong>.",choices:[{label:"Option A",text:"Use a hypodermic syringe calibrated in mL at 90° into the deltoid",correct:false},{label:"Option B",text:"Use a U-100 insulin syringe, 45° angle, pinch skin, rotate sites within one region",correct:true},{label:"Option C",text:"Use an insulin syringe, 90° angle, massage site after injection",correct:false},{label:"Option D",text:"Use a tuberculin syringe at 45° for small-dose precision",correct:false}],exp:"Insulin requires a U-100 insulin syringe. Inject subcutaneously at 45°, pinch skin, do NOT massage, and rotate sites within one region for consistent absorption."},
  {icon:"⚠️",title:"Needle Contamination",body:"While drawing up medication, the needle accidentally touches the edge of the countertop.",choices:[{label:"Option A",text:"Wipe needle with alcohol swab and proceed — it was brief contact",correct:false},{label:"Option B",text:"Re-cap the needle and use it for a different patient",correct:false},{label:"Option C",text:"Discard the entire syringe and needle, prepare a new one",correct:true},{label:"Option D",text:"Only replace the needle tip, keeping the same syringe",correct:false}],exp:"A needle that touches ANY non-sterile surface — even briefly — is contaminated and must be discarded. There are no exceptions. Prepare a completely new syringe and needle."},
  {icon:"🎯",title:"Reading a Needle Package",body:"A package is labeled <strong>'3 mL 22G × 1½'</strong>. You need to give 2.5 mL IM to a large adult patient.",choices:[{label:"Option A",text:"The package is wrong — 22G is too large for IM injections",correct:false},{label:"Option B",text:"This is appropriate — 3 mL syringe, 22G gauge, 1.5 inch needle",correct:true},{label:"Option C",text:"The 3 mL refers to the needle length, not syringe volume",correct:false},{label:"Option D",text:"This needle is too short for a large adult IM injection",correct:false}],exp:"Package reads: Syringe = 3 mL | Gauge = 22G | Length = 1.5 inches. Ideal for IM in a large adult. 22G is appropriate for IM; 1.5 inch penetrates past fat into muscle."},
  {icon:"📝",title:"MAR Documentation Error",body:"You document a medication in the MAR <em>before</em> giving it, planning to save time. A supervisor catches this.",choices:[{label:"Option A",text:"Acceptable practice — just a timing preference",correct:false},{label:"Option B",text:"Critical error — documentation must always occur AFTER administration",correct:true},{label:"Option C",text:"Fine as long as you give the medication immediately after",correct:false},{label:"Option D",text:"Only a problem for controlled substances",correct:false}],exp:"Documenting BEFORE administration is a serious medication safety error. If the medication is NOT given, the record falsely shows it was administered — which could cause dangerous double-dosing. The 9th Right: always document AFTER."},
  {icon:"🚫",title:"Sharps Disposal",body:"After giving an injection, you need to dispose of the used needle. The sharps container is in another room.",choices:[{label:"Option A",text:"Re-cap the needle using two hands and carry it to the sharps container",correct:false},{label:"Option B",text:"Place it in the biohazard bag temporarily, then transfer later",correct:false},{label:"Option C",text:"Carry the uncapped needle on a tray to the sharps container",correct:true},{label:"Option D",text:"Leave it in the exam room until you have several needles to dispose of at once",correct:false}],exp:"Never re-cap a used needle with two hands (needlestick risk), and never place it in the biohazard bag. Carry uncapped on a tray to the nearest sharps container immediately — or use the one-handed scoop method if re-capping is necessary."}
];

let current=0,score=0;

function load(){
  const sc=scenarios[current];
  document.getElementById('sc-icon').textContent=sc.icon;
  document.getElementById('sc-num').textContent=`SCENARIO ${current+1}`;
  document.getElementById('sc-title').textContent=sc.title;
  document.getElementById('sc-body').innerHTML=sc.body;
  document.getElementById('sc-question').textContent='What is the correct action?';
  document.getElementById('sc-counter').textContent=`Scenario ${current+1} of ${scenarios.length}`;
  document.getElementById('progress').style.width=`${((current+1)/scenarios.length)*100}%`;
  document.getElementById('result-panel').className='result';
  document.getElementById('next-btn').style.display='none';
  const choicesEl=document.getElementById('choices');choicesEl.innerHTML='';
  sc.choices.forEach((c,i)=>{
    const div=document.createElement('div');div.className='choice';
    div.innerHTML=`<div class="choice-label">${c.label}</div>${c.text}`;
    div.onclick=()=>choose(i);choicesEl.appendChild(div);
  });
}

function choose(idx){
  const sc=scenarios[current];
  const tiles=document.querySelectorAll('.choice');
  tiles.forEach(t=>t.classList.add('locked'));
  const result=document.getElementById('result-panel');
  if(sc.choices[idx].correct){
    tiles[idx].classList.add('correct');
    tiles[idx].querySelector('.choice-label').textContent='✅ Correct!';
    result.className='result correct-r';
    result.innerHTML=`✅ <strong>Correct!</strong> ${sc.exp}`;
    score++;document.getElementById('score-badge').textContent=`Score: ${score}`;
  } else {
    tiles[idx].classList.add('wrong');
    tiles[idx].querySelector('.choice-label').textContent='❌ Incorrect';
    const correct=sc.choices.findIndex(c=>c.correct);
    tiles[correct].classList.add('correct');
    tiles[correct].querySelector('.choice-label').textContent='✅ Correct Answer';
    result.className='result wrong-r';
    result.innerHTML=`❌ <strong>Not quite.</strong> ${sc.exp}`;
  }
  document.getElementById('next-btn').style.display='inline-block';
}

function nextScenario(){
  current++;
  if(current>=scenarios.length){
    document.getElementById('scenario-card').style.display='none';
    document.getElementById('choices').style.display='none';
    document.getElementById('result-panel').style.display='none';
    document.querySelector('.nav-wrap').style.display='none';
    document.getElementById('complete-card').style.display='block';
    document.getElementById('final-score').textContent=`${score} / ${scenarios.length}`;
  } else load();
}

function restart(){
  current=0;score=0;
  document.getElementById('score-badge').textContent='Score: 0';
  document.getElementById('scenario-card').style.display='block';
  document.getElementById('choices').style.display='grid';
  document.querySelector('.nav-wrap').style.display='block';
  document.getElementById('complete-card').style.display='none';
  load();
}
load();
</script>
</body>
</html>
