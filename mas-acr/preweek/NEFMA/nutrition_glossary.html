<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nutrition Essentials — Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:10px 14px;gap:8px;background:#0f1e2e;color:#e8eef5;font-family:'Inter',sans-serif}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.15rem;font-weight:800;color:#c9a84c;letter-spacing:.03em;flex-shrink:0}
.top-bar{width:100%;max-width:700px;display:flex;gap:8px;align-items:center;flex-shrink:0}
.search-box{flex:1;padding:9px 14px;border-radius:10px;background:#162840;border:1.5px solid #1e3550;color:#e8eef5;font-family:'Inter',sans-serif;font-size:.88rem;outline:none;transition:border-color .2s}
.search-box::placeholder{color:#4a6a85}
.search-box:focus{border-color:#2a8fa3}
.count-badge{font-family:'Plus Jakarta Sans',sans-serif;font-size:.75rem;color:#8da8c0;white-space:nowrap;flex-shrink:0}
/* Main card */
.card{width:100%;max-width:700px;background:#162840;border-radius:16px;padding:28px 30px;flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;justify-content:center}
.cat-badge{align-self:flex-start;padding:4px 12px;border-radius:99px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.term-name{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.7rem;font-weight:800;color:#e8eef5;line-height:1.2}
.divider{height:2px;background:linear-gradient(90deg,#2a8fa3,transparent);border-radius:99px}
.term-def{font-family:'Inter',sans-serif;font-size:.95rem;color:#c9dbe8;line-height:1.7}
.empty-state{font-family:'Inter',sans-serif;font-size:.9rem;color:#4a6a85;text-align:center;margin:auto}
/* Nav */
.nav-row{display:flex;align-items:center;gap:10px;flex-shrink:0}
.nav-btn{padding:8px 20px;border-radius:8px;background:#1e3550;border:none;color:#e8eef5;font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;font-weight:700;cursor:pointer}
.nav-btn:hover{background:#2a3d55}
.nav-btn:disabled{opacity:.3;cursor:default}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:280px;align-items:center}
.dot{width:6px;height:6px;border-radius:50%;background:#1e3550;transition:all .2s}
.dot.active{background:#c9a84c;transform:scale(1.4)}
.dot.seen{background:#2a8fa3}
.pos-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:.78rem;color:#8da8c0;min-width:54px;text-align:center;flex-shrink:0}
/* Category colors */
.cat-foundations{background:#1e3550;color:#2a8fa3}
.cat-macro{background:#1e2e1e;color:#2db37a}
.cat-vitamins{background:#2e1e1e;color:#e05252}
.cat-guidelines{background:#2e2a1e;color:#c9a84c}
.cat-diets{background:#1e2e2e;color:#5bb8c8}
.cat-deficiencies{background:#2a1e2e;color:#b87cc8}
.cat-chronic{background:#2e2e1e;color:#d4a84c}
.cat-scope{background:#1e2530;color:#7cc8b8}
</style>
</head>
<body>
<h1>Nutrition Essentials — Glossary</h1>
<div class="top-bar">
  <input class="search-box" id="searchBox" placeholder="Search terms..." oninput="onSearch()"/>
  <span class="count-badge" id="countBadge"></span>
</div>
<div class="card" id="card">
  <div class="cat-badge" id="catBadge"></div>
  <div class="term-name" id="termName"></div>
  <div class="divider"></div>
  <div class="term-def" id="termDef"></div>
  <div class="empty-state" id="emptyState" style="display:none">No matching terms found.</div>
</div>
<div class="nav-row">
  <button class="nav-btn" id="prevBtn" onclick="navigate(-1)">← Prev</button>
  <div class="dots" id="dots"></div>
  <span class="pos-label" id="posLabel"></span>
  <button class="nav-btn" id="nextBtn" onclick="navigate(1)">Next →</button>
</div>
<script>
const terms=[
  {term:"Nutrition",def:"The science of how the body takes in, digests, absorbs, and uses food to sustain life, support growth, and prevent disease.",cat:"Foundations"},
  {term:"Macronutrients",def:"Nutrients needed in large amounts that provide energy: carbohydrates (4 kcal/g), proteins (4 kcal/g), and fats (9 kcal/g).",cat:"Foundations"},
  {term:"Micronutrients",def:"Vitamins and minerals needed in small amounts to regulate body processes; include fat-soluble (A, D, E, K) and water-soluble (B complex, C) vitamins.",cat:"Foundations"},
  {term:"Caloric Density",def:"The amount of energy (calories) per gram of a nutrient. Fats = 9 kcal/g; carbohydrates and proteins = 4 kcal/g; alcohol = 7 kcal/g; water = 0.",cat:"Foundations"},
  {term:"Essential Nutrients",def:"The six categories of nutrients the body cannot make in sufficient quantities and must obtain from food: carbohydrates, proteins, fats, vitamins, minerals, and water.",cat:"Foundations"},
  {term:"Carbohydrates",def:"The body's preferred primary energy source. Includes simple sugars (fast-digesting) and complex forms (starches and fiber). Provides 4 kcal/g; RDA: 45–65% of daily calories.",cat:"Macronutrients"},
  {term:"Simple Carbohydrates",def:"Sugars such as glucose, fructose, lactose, and sucrose that are digested rapidly, causing quick blood glucose spikes. Found in fruit, milk, candy, soda, white bread.",cat:"Macronutrients"},
  {term:"Complex Carbohydrates",def:"Starches and fiber made of longer sugar chains. Digested slowly for steadier blood glucose. Found in whole grains, legumes, and vegetables.",cat:"Macronutrients"},
  {term:"Dietary Fiber",def:"Indigestible complex carbohydrate supporting digestion and heart health. RDA: 25–38 g/day. Found in whole grains, fruits, vegetables, and legumes.",cat:"Macronutrients"},
  {term:"Proteins",def:"Macronutrients providing 4 kcal/g that build/repair tissues, produce enzymes and hormones, and support immunity. RDA: ~0.8 g/kg body weight for healthy adults.",cat:"Macronutrients"},
  {term:"Complete Proteins",def:"Proteins containing all 9 essential amino acids. Found in animal products (meat, eggs, dairy) and soy.",cat:"Macronutrients"},
  {term:"Incomplete Proteins",def:"Proteins missing one or more essential amino acids. Found in grains and legumes; can be combined (complementary proteins) to form complete protein.",cat:"Macronutrients"},
  {term:"Fats",def:"Most energy-dense macronutrient at 9 kcal/g. Provides energy storage and enables absorption of fat-soluble vitamins A, D, E, K. RDA: 20–35% of daily calories.",cat:"Macronutrients"},
  {term:"Unsaturated Fats",def:"Heart-healthy fats found in olive oil, nuts, avocado, and fatty fish. Help lower LDL cholesterol.",cat:"Macronutrients"},
  {term:"Saturated Fats",def:"Fats found in butter and red meat that raise LDL (bad) cholesterol. Should be limited in a heart-healthy diet.",cat:"Macronutrients"},
  {term:"Trans Fats",def:"Partially hydrogenated oils — the most harmful dietary fat. Raise LDL and lower HDL. Banned in most food products.",cat:"Macronutrients"},
  {term:"Vitamin A",def:"Fat-soluble vitamin essential for vision, immune function, and skin health. Found in liver, dairy, and orange/yellow produce.",cat:"Vitamins & Minerals"},
  {term:"Vitamin D",def:"Fat-soluble vitamin required for calcium absorption and bone health. Sources: sunlight, fatty fish, fortified dairy. Deficiency causes bone pain and muscle weakness.",cat:"Vitamins & Minerals"},
  {term:"Vitamin E",def:"Fat-soluble antioxidant that supports immune function. Found in nuts, seeds, and vegetable oils.",cat:"Vitamins & Minerals"},
  {term:"Vitamin K",def:"Fat-soluble vitamin essential for blood clotting and bone metabolism. Found in leafy greens and fermented foods.",cat:"Vitamins & Minerals"},
  {term:"Vitamin C",def:"Water-soluble vitamin supporting immune function, wound healing, and iron absorption. Found in citrus, peppers, strawberries. Deficiency causes scurvy.",cat:"Vitamins & Minerals"},
  {term:"Vitamin B12",def:"Water-soluble vitamin needed for red blood cell formation and nerve function. Found in meat, dairy, eggs. Deficiency causes anemia and neuropathy; common in vegans.",cat:"Vitamins & Minerals"},
  {term:"Folate (B9)",def:"Water-soluble vitamin essential for DNA synthesis and fetal neural tube development. Deficiency in pregnancy causes neural tube defects and megaloblastic anemia.",cat:"Vitamins & Minerals"},
  {term:"Iron",def:"Mineral required for hemoglobin production and oxygen transport. Deficiency (iron-deficiency anemia) causes fatigue, pallor, brittle nails, pica, and tachycardia.",cat:"Vitamins & Minerals"},
  {term:"Calcium",def:"Most abundant mineral in the body; essential for bone/tooth strength, muscle contraction, and nerve function. Deficiency leads to osteoporosis and muscle cramps.",cat:"Vitamins & Minerals"},
  {term:"Potassium",def:"Electrolyte mineral regulating heart rhythm, fluid balance, and blood pressure. Found in bananas, potatoes, beans. Deficiency causes muscle weakness and irregular heartbeat.",cat:"Vitamins & Minerals"},
  {term:"MyPlate",def:"USDA's current dietary framework: 30% vegetables, 30% grains, 20% fruits, 20% protein, plus a side of dairy. Half the plate should be produce.",cat:"Dietary Guidelines"},
  {term:"DASH Diet",def:"Dietary Approaches to Stop Hypertension — reduces saturated fat and sodium, increases fiber and produce. Used for hypertension and cardiovascular disease.",cat:"Therapeutic Diets"},
  {term:"Diabetic/Carb-Controlled Diet",def:"Therapeutic diet for Type 2 Diabetes or pre-diabetes. Limits added sugars and refined carbs; carb counting targets ~45–60 g per meal.",cat:"Therapeutic Diets"},
  {term:"Low-Sodium Diet",def:"Restricts sodium to <2,000 mg/day for hypertension, CHF, CKD, or edema. Avoids processed foods and canned soups.",cat:"Therapeutic Diets"},
  {term:"Renal/CKD Diet",def:"For Chronic Kidney Disease — restricts potassium, phosphorus, sodium, and sometimes protein depending on disease stage.",cat:"Therapeutic Diets"},
  {term:"Gluten-Free Diet",def:"Eliminates all wheat, barley, and rye. Required for celiac disease; even trace exposure can cause intestinal damage.",cat:"Therapeutic Diets"},
  {term:"Clear Liquid Diet",def:"Diet consisting of broth, water, and gelatin — used pre/post-operative, for dysphagia, or acute GI illness. Aids digestion and maintains hydration.",cat:"Therapeutic Diets"},
  {term:"Iron-Deficiency Anemia",def:"Most common nutritional deficiency. Signs: fatigue, pallor, brittle nails, pica, tachycardia. At risk: women of childbearing age, vegetarians, pregnant patients.",cat:"Deficiencies"},
  {term:"Scurvy",def:"Vitamin C deficiency disease presenting with poor wound healing, bleeding gums, and bruising.",cat:"Deficiencies"},
  {term:"Protein-Energy Malnutrition",def:"Severe deficiency presenting with muscle wasting, poor wound healing, edema, and hair loss. Common in elderly, post-surgical, cancer, and eating disorder patients.",cat:"Deficiencies"},
  {term:"Type 2 Diabetes (Diet Role)",def:"Managed with low-glycemic, carb-controlled, high-fiber diet. MA role: document carb intake, reinforce glucose monitoring, support provider's carb-counting instructions.",cat:"Chronic Disease"},
  {term:"Medical Nutrition Therapy",def:"Individualized nutrition intervention performed only by a Registered Dietitian (RD). Outside MA scope of practice.",cat:"MA Scope"},
  {term:"24-Hour Food Recall",def:"Dietary history technique where the patient reports all food/drink consumed in the past 24 hours. Within MA scope to document during intake.",cat:"MA Scope"},
  {term:"BMI (Body Mass Index)",def:"Calculation using height and weight to estimate body fat. MAs record height and weight accurately at each visit to support BMI tracking.",cat:"MA Scope"}
];

const catColorMap={
  "Foundations":"cat-foundations",
  "Macronutrients":"cat-macro",
  "Vitamins & Minerals":"cat-vitamins",
  "Dietary Guidelines":"cat-guidelines",
  "Therapeutic Diets":"cat-diets",
  "Deficiencies":"cat-deficiencies",
  "Chronic Disease":"cat-chronic",
  "MA Scope":"cat-scope"
};

let filtered=[...terms];
let current=0;
let seen=new Set();

function renderCard(){
  const card=document.getElementById('card');
  const empty=document.getElementById('emptyState');
  if(!filtered.length){
    document.getElementById('catBadge').textContent='';
    document.getElementById('termName').textContent='';
    document.getElementById('termDef').textContent='';
    empty.style.display='block';
    document.getElementById('posLabel').textContent='';
    document.getElementById('prevBtn').disabled=true;
    document.getElementById('nextBtn').disabled=true;
    document.getElementById('countBadge').textContent='0 terms';
    return;
  }
  empty.style.display='none';
  const t=filtered[current];
  const badge=document.getElementById('catBadge');
  badge.textContent=t.cat;
  badge.className='cat-badge '+(catColorMap[t.cat]||'cat-foundations');
  document.getElementById('termName').textContent=t.term;
  document.getElementById('termDef').textContent=t.def;
  document.getElementById('posLabel').textContent=(current+1)+' / '+filtered.length;
  document.getElementById('countBadge').textContent=filtered.length+' term'+(filtered.length!==1?'s':'');
  document.getElementById('prevBtn').disabled=current===0;
  document.getElementById('nextBtn').disabled=current===filtered.length-1;
  updateDots();
}

function buildDots(){
  const d=document.getElementById('dots');
  d.innerHTML='';
  filtered.forEach((_,i)=>{
    const dot=document.createElement('div');
    dot.className='dot';
    dot.onclick=()=>{current=i;seen.add(i);renderCard();};
    d.appendChild(dot);
  });
  updateDots();
}

function updateDots(){
  document.querySelectorAll('.dot').forEach((d,i)=>{
    d.className='dot'+(i===current?' active':seen.has(i)?' seen':'');
  });
}

function navigate(dir){
  current=Math.max(0,Math.min(filtered.length-1,current+dir));
  seen.add(current);
  renderCard();
}

function onSearch(){
  const q=document.getElementById('searchBox').value.toLowerCase().trim();
  filtered=q?terms.filter(t=>t.term.toLowerCase().includes(q)||t.def.toLowerCase().includes(q)||t.cat.toLowerCase().includes(q)):[...terms];
  current=0; seen=new Set();
  buildDots();
  renderCard();
}

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')navigate(1);
  else if(e.key==='ArrowLeft')navigate(-1);
});

buildDots();
renderCard();
document.getElementById('countBadge').textContent=terms.length+' terms';
</script>
</body>
</html>
