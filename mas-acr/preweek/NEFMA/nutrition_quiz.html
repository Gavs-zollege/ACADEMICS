<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nutrition Essentials — Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:10px 14px;gap:8px;
  background:#0f1e2e;color:#e8eef5;font-family:'Inter',sans-serif}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.15rem;font-weight:800;color:#c9a84c;letter-spacing:.03em;flex-shrink:0}
.prog-wrap{width:100%;max-width:680px;flex-shrink:0}
.prog-meta{display:flex;justify-content:space-between;font-size:.75rem;color:#8da8c0;margin-bottom:4px;font-family:'Plus Jakarta Sans',sans-serif}
.prog-bar{height:6px;background:#162840;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#2a8fa3,#c9a84c);border-radius:99px;transition:width .4s ease}
.card{width:100%;max-width:680px;background:#162840;border-radius:14px;padding:20px 22px;flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.q-num{font-family:'Plus Jakarta Sans',sans-serif;font-size:.75rem;color:#2a8fa3;font-weight:700;letter-spacing:.08em}
.q-text{font-family:'Inter',sans-serif;font-size:.98rem;font-weight:500;color:#e8eef5;line-height:1.5;flex-shrink:0}
.choices{display:flex;flex-direction:column;gap:8px;overflow-y:auto;flex:1;min-height:0;padding-right:2px}
.choices::-webkit-scrollbar{width:4px}
.choices::-webkit-scrollbar-thumb{background:#2a8fa340;border-radius:99px}
.chip{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:10px;background:#0f1e2e;border:2px solid #1e3550;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:.87rem;font-weight:600;color:#e8eef5;transition:border-color .2s,background .2s;text-align:left;width:100%}
.chip:hover:not(.locked){border-color:#2a8fa3;background:#0d2025}
.chip .letter{min-width:22px;height:22px;border-radius:50%;background:#1e3550;display:flex;align-items:center;justify-content:center;font-size:.75rem;flex-shrink:0;margin-top:1px}
.chip.correct{border-color:#2db37a;background:#0d2820;color:#2db37a}
.chip.correct .letter{background:#2db37a;color:#0d2820}
.chip.wrong{border-color:#e05252;background:#2a0d0d;color:#e05252}
.chip.wrong .letter{background:#e05252;color:#fff}
.chip.locked{cursor:default}
.explanation{font-size:.81rem;color:#8da8c0;line-height:1.5;border-left:3px solid #2a8fa3;padding:8px 12px;background:#0f1e2e;border-radius:0 8px 8px 0;flex-shrink:0;display:none}
.explanation.show{display:block}
.next-btn{display:none;width:100%;max-width:680px;padding:11px;border-radius:10px;background:#c9a84c;color:#0f1e2e;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:800;border:none;cursor:pointer;flex-shrink:0;transition:opacity .2s}
.next-btn:hover{opacity:.88}
.next-btn.show{display:block}
.end-screen{display:none;flex:1;min-height:0;align-items:center;justify-content:center;flex-direction:column;gap:16px;width:100%;max-width:680px}
.end-screen.show{display:flex}
.ring-wrap{position:relative;width:130px;height:130px}
.ring-wrap svg{width:130px;height:130px}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif}
.ring-pct{font-size:2rem;font-weight:800;color:#c9a84c}
.ring-label{font-size:.72rem;color:#8da8c0}
.end-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.2rem;font-weight:800;color:#e8eef5}
.end-sub{font-size:.85rem;color:#8da8c0;text-align:center;max-width:340px;line-height:1.5}
.restart-btn{padding:11px 28px;border-radius:10px;background:#c9a84c;color:#0f1e2e;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:800;border:none;cursor:pointer}
.restart-btn:hover{opacity:.88}
</style>
</head>
<body>
<h1>Nutrition Essentials — Quiz</h1>
<div class="prog-wrap" id="progWrap">
  <div class="prog-meta"><span id="qLabel">Question 1 of 20</span><span id="scoreLabel">Score: 0</span></div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:5%"></div></div>
</div>
<div class="card" id="mainCard">
  <div class="q-num" id="qNum">Q1</div>
  <div class="q-text" id="qText"></div>
  <div class="choices" id="choices"></div>
  <div class="explanation" id="explanation"></div>
</div>
<button class="next-btn" id="nextBtn" onclick="nextQ()">Next Question →</button>
<div class="end-screen" id="endScreen">
  <div class="ring-wrap">
    <svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="56" fill="none" stroke="#162840" stroke-width="12"/><circle id="ringCircle" cx="65" cy="65" r="56" fill="none" stroke="#c9a84c" stroke-width="12" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset 1s ease"/></svg>
    <div class="ring-center"><div class="ring-pct" id="ringPct">0%</div><div class="ring-label">Score</div></div>
  </div>
  <div class="end-title" id="endTitle"></div>
  <div class="end-sub" id="endSub"></div>
  <button class="restart-btn" onclick="restart()">Try Again</button>
</div>
<script>
const questions=[
{q:"What is the primary energy source for the brain and muscles?",opts:["Proteins","Fats","Carbohydrates","Vitamins"],ans:2,exp:"Carbohydrates are the body's preferred and most immediate energy source, providing 4 kcal/g. They fuel brain activity and muscle contractions."},
{q:"Which macronutrient provides the most energy per gram?",opts:["Carbohydrates (4 kcal/g)","Proteins (4 kcal/g)","Fats (9 kcal/g)","Water (0 kcal/g)"],ans:2,exp:"Fats provide 9 kcal per gram — more than double that of carbohydrates or protein — making them the most energy-dense macronutrient."},
{q:"According to MyPlate, what percentage of the plate should be vegetables?",opts:["20%","25%","30%","50%"],ans:2,exp:"MyPlate guidelines designate 30% of the plate to vegetables, along with 30% grains, 20% fruits, and 20% protein."},
{q:"Which vitamins are classified as fat-soluble?",opts:["B complex and C","A, D, E, and K","C and K","B12 and Folate"],ans:1,exp:"Vitamins A, D, E, and K are fat-soluble — they require dietary fat for absorption and are stored in body fat, so excess can cause toxicity."},
{q:"What is the recommended daily fiber intake range for adults?",opts:["10–15 g/day","15–25 g/day","25–38 g/day","40–50 g/day"],ans:2,exp:"Adults need 25–38 g of fiber per day. Fiber aids digestion, promotes heart health, and helps stabilize blood sugar levels."},
{q:"Which condition is caused by Vitamin C deficiency?",opts:["Rickets","Scurvy","Pellagra","Beriberi"],ans:1,exp:"Vitamin C deficiency causes scurvy, characterized by poor wound healing and bleeding gums. Vitamin C is essential for collagen synthesis and immune function."},
{q:"What is the recommended daily protein intake for a healthy adult?",opts:["0.2 g/kg body weight","0.5 g/kg body weight","0.8 g/kg body weight","1.5 g/kg body weight"],ans:2,exp:"The RDA for protein is ~0.8 g/kg body weight per day for healthy adults, supporting tissue repair, enzyme production, and immune function."},
{q:"Which type of fat should be completely avoided due to its health risks?",opts:["Saturated fats","Unsaturated fats","Trans fats","Omega-3 fats"],ans:2,exp:"Trans fats (partially hydrogenated oils) raise LDL and lower HDL cholesterol. They are the most harmful type of dietary fat and have been banned in most products."},
{q:"Folate deficiency during pregnancy is most associated with which risk?",opts:["Gestational diabetes","Neural tube defects","Iron-deficiency anemia","Preeclampsia"],ans:1,exp:"Folate (B9) is critical for DNA synthesis and fetal development. Deficiency during early pregnancy significantly increases the risk of neural tube defects like spina bifida."},
{q:"The DASH diet is prescribed primarily for which condition?",opts:["Celiac disease","Type 1 Diabetes","Hypertension and cardiovascular disease","Chronic Kidney Disease"],ans:2,exp:"DASH stands for Dietary Approaches to Stop Hypertension. It emphasizes reducing saturated fat and sodium while increasing fiber and produce."},
{q:"Which nutrient is essential for oxygen transport via hemoglobin?",opts:["Calcium","Iron","Potassium","Vitamin D"],ans:1,exp:"Iron is an essential component of hemoglobin, the protein in red blood cells that carries oxygen. Iron-deficiency anemia causes fatigue, pallor, and tachycardia."},
{q:"What is the maximum recommended daily sodium intake per dietary guidelines?",opts:["1,000 mg","1,500 mg","2,300 mg","3,500 mg"],ans:2,exp:"Current dietary guidelines recommend limiting sodium to less than 2,300 mg per day to reduce risks of hypertension and cardiovascular disease."},
{q:"A patient on a Renal/CKD diet must limit which of the following?",opts:["Vitamin C and iron","Calcium and vitamin D","Potassium, phosphorus, and sodium","Folate and B12"],ans:2,exp:"CKD patients must restrict potassium, phosphorus, sodium, and sometimes protein — all filtered by the kidneys — to prevent dangerous accumulation."},
{q:"Which population group is at highest risk for Vitamin B12 deficiency?",opts:["Children under 5","Athletes","Vegans and vegetarians","Post-menopausal women"],ans:2,exp:"Vitamin B12 is found almost exclusively in animal products. Vegans and vegetarians are at high risk, as are elderly individuals and metformin users."},
{q:"What is within the medical assistant's scope regarding nutrition?",opts:["Creating individualized meal plans","Diagnosing nutritional deficiencies","Documenting dietary history and reinforcing provider education","Prescribing specific supplement dosages"],ans:2,exp:"MAs document dietary history, reinforce provider-given education, and provide approved materials like MyPlate handouts. Diagnosing deficiencies or creating meal plans is outside MA scope."},
{q:"Which carbohydrate type causes a rapid rise in blood glucose?",opts:["Complex carbohydrates","Dietary fiber","Simple carbohydrates","Resistant starch"],ans:2,exp:"Simple carbohydrates (sugars like glucose and fructose) are digested and absorbed rapidly, causing quick spikes in blood glucose — especially important to monitor in diabetic patients."},
{q:"Vitamin D deficiency is most commonly associated with which symptom?",opts:["Bleeding gums","Bone pain and muscle weakness","Megaloblastic anemia","Glossitis"],ans:1,exp:"Vitamin D deficiency presents with bone pain, muscle weakness, frequent infections, and depression. It is common in indoor workers, elderly individuals, and those with darker skin tones."},
{q:"Which therapeutic diet is required for a patient with celiac disease?",opts:["Low-sodium diet","Gluten-free diet","DASH diet","Clear liquid diet"],ans:1,exp:"Celiac disease requires a strict gluten-free diet eliminating wheat, barley, and rye. Even trace exposure can cause intestinal damage in celiac patients."},
{q:"Which food source is a complete protein containing all 9 essential amino acids?",opts:["White rice","Lentils","Eggs","Whole wheat bread"],ans:2,exp:"Complete proteins contain all 9 essential amino acids. Animal sources (meat, eggs, dairy) and soy are complete proteins. Most plant sources are incomplete."},
{q:"When should an MA refer a patient to a Registered Dietitian (RD)?",opts:["When the patient asks about MyPlate","For routine weight recording","For complex conditions like CKD, eating disorders, or pregnancy nutrition","When documenting food allergies"],ans:2,exp:"RD referral is appropriate for complex conditions requiring individualized medical nutrition therapy — including CKD, eating disorders, cancer, pregnancy, and pediatric nutrition needs."}
];
let current=0,score=0,answered=false;
function render(){
  const q=questions[current];
  document.getElementById('qNum').textContent='Q'+(current+1);
  document.getElementById('qText').textContent=q.q;
  document.getElementById('qLabel').textContent='Question '+(current+1)+' of '+questions.length;
  document.getElementById('scoreLabel').textContent='Score: '+score;
  document.getElementById('progFill').style.width=((current/questions.length)*100+5)+'%';
  const cl=document.getElementById('choices');
  cl.innerHTML='';
  ['A','B','C','D'].forEach((letter,i)=>{
    const btn=document.createElement('button');
    btn.className='chip';
    btn.innerHTML='<span class="letter">'+letter+'</span>'+q.opts[i];
    btn.onclick=()=>choose(i,btn);
    cl.appendChild(btn);
  });
  document.getElementById('explanation').classList.remove('show');
  document.getElementById('explanation').textContent='';
  document.getElementById('nextBtn').classList.remove('show');
  answered=false;
}
function choose(idx){
  if(answered)return;
  answered=true;
  const q=questions[current];
  const chips=[...document.querySelectorAll('.chip')];
  chips.forEach(c=>c.classList.add('locked'));
  chips[idx].classList.add(idx===q.ans?'correct':'wrong');
  chips[q.ans].classList.add('correct');
  if(idx===q.ans)score++;
  const exp=document.getElementById('explanation');
  exp.textContent=q.exp;
  exp.classList.add('show');
  document.getElementById('scoreLabel').textContent='Score: '+score;
  const nb=document.getElementById('nextBtn');
  nb.textContent=current===questions.length-1?'See Results →':'Next Question →';
  nb.classList.add('show');
}
function nextQ(){
  current++;
  if(current>=questions.length){showEnd();return;}
  render();
}
function showEnd(){
  document.getElementById('mainCard').style.display='none';
  document.getElementById('progWrap').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  const pct=Math.round((score/questions.length)*100);
  document.getElementById('endScreen').classList.add('show');
  document.getElementById('ringPct').textContent=pct+'%';
  const circ=351.86;
  const rc=document.getElementById('ringCircle');
  rc.style.strokeDashoffset=circ-(circ*(pct/100));
  rc.style.stroke=pct>=80?'#2db37a':pct>=60?'#c9a84c':'#e05252';
  document.getElementById('endTitle').textContent=pct>=80?'Excellent Work! 🎉':pct>=60?'Good Effort! 💪':'Keep Studying 📚';
  document.getElementById('endSub').textContent='You scored '+score+' out of '+questions.length+' correctly. '+(pct>=80?'You have a strong grasp of nutrition essentials.':pct>=60?'Review the areas where you struggled and try again.':'Go back to the slides and review before retrying.');
}
function restart(){
  current=0;score=0;answered=false;
  document.getElementById('mainCard').style.display='flex';
  document.getElementById('progWrap').style.display='block';
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('nextBtn').style.display='';
  render();
}
render();
</script>
</body>
</html>
