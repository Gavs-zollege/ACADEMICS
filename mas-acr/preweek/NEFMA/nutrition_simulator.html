<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Nutrition Essentials — Clinical Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:10px 14px;gap:8px;background:#0f1e2e;color:#e8eef5;font-family:'Inter',sans-serif}
h1{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.15rem;font-weight:800;color:#c9a84c;letter-spacing:.03em;flex-shrink:0}
/* Progress */
.prog-wrap{width:100%;max-width:720px;flex-shrink:0}
.prog-meta{display:flex;justify-content:space-between;font-size:.75rem;color:#8da8c0;margin-bottom:4px;font-family:'Plus Jakarta Sans',sans-serif}
.prog-bar{height:6px;background:#162840;border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,#2a8fa3,#c9a84c);border-radius:99px;transition:width .4s ease}
/* Scenario card */
.scenario-card{width:100%;max-width:720px;background:#162840;border:2px solid #2a8fa3;border-radius:16px;padding:16px 20px;flex-shrink:0}
.scenario-label{font-family:'Plus Jakarta Sans',sans-serif;font-size:.7rem;font-weight:700;color:#2a8fa3;letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px}
.scenario-text{font-family:'Inter',sans-serif;font-size:.88rem;color:#c9dbe8;line-height:1.55}
/* Question */
.question{width:100%;max-width:720px;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:700;color:#e8eef5;flex-shrink:0}
/* Answer grid */
.grid{width:100%;max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:9px;flex:1;min-height:0}
.ans-btn{padding:12px 14px;border-radius:10px;background:#162840;border:2px solid #1e3550;color:#e8eef5;font-family:'Plus Jakarta Sans',sans-serif;font-size:.84rem;font-weight:600;cursor:pointer;transition:border-color .2s,background .2s;text-align:left;display:flex;align-items:flex-start;gap:8px;height:100%;min-height:0;overflow:hidden}
.ans-btn:hover:not(.locked){border-color:#2a8fa3;background:#0d1e2e}
.ans-letter{min-width:22px;height:22px;border-radius:50%;background:#1e3550;display:flex;align-items:center;justify-content:center;font-size:.74rem;flex-shrink:0}
.ans-text{flex:1;line-height:1.4;font-size:.82rem}
.ans-btn.correct{border-color:#2db37a;background:#0d2820;color:#2db37a}
.ans-btn.correct .ans-letter{background:#2db37a;color:#0d2820}
.ans-btn.wrong{border-color:#e05252;background:#2a0d0d;color:#e05252}
.ans-btn.wrong .ans-letter{background:#e05252;color:#fff}
.ans-btn.locked{cursor:default}
.ans-btn.locked:not(.correct):not(.wrong){opacity:.6}
/* Explanation */
.exp-strip{width:100%;max-width:720px;padding:10px 14px;border-radius:10px;border-left:4px solid #2a8fa3;background:#0f1e2e;font-size:.81rem;color:#8da8c0;line-height:1.5;display:none;flex-shrink:0}
.exp-strip.show{display:block}
/* Next */
.next-btn{display:none;width:100%;max-width:720px;padding:11px;border-radius:10px;background:#c9a84c;color:#0f1e2e;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:800;border:none;cursor:pointer;flex-shrink:0}
.next-btn:hover{opacity:.88}
.next-btn.show{display:block}
/* End */
.end-screen{display:none;flex:1;min-height:0;align-items:center;justify-content:center;flex-direction:column;gap:16px;width:100%;max-width:720px}
.end-screen.show{display:flex}
.ring-wrap{position:relative;width:130px;height:130px}
.ring-wrap svg{width:130px;height:130px}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Plus Jakarta Sans',sans-serif}
.ring-pct{font-size:2rem;font-weight:800;color:#c9a84c}
.ring-label{font-size:.72rem;color:#8da8c0}
.end-title{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.2rem;font-weight:800;color:#e8eef5}
.end-sub{font-size:.85rem;color:#8da8c0;text-align:center;max-width:380px;line-height:1.5}
.restart-btn{padding:11px 28px;border-radius:10px;background:#c9a84c;color:#0f1e2e;font-family:'Plus Jakarta Sans',sans-serif;font-size:.95rem;font-weight:800;border:none;cursor:pointer}
.restart-btn:hover{opacity:.88}
</style>
</head>
<body>
<h1>Nutrition Clinical Simulator</h1>
<div class="prog-wrap" id="progWrap">
  <div class="prog-meta"><span id="scLabel">Scenario 1 of 10</span><span id="scoreLabel">Score: 0 / 0</span></div>
  <div class="prog-bar"><div class="prog-fill" id="progFill" style="width:10%"></div></div>
</div>
<div class="scenario-card" id="scenarioCard">
  <div class="scenario-label">Clinical Scenario</div>
  <div class="scenario-text" id="scenarioText"></div>
</div>
<div class="question" id="question"></div>
<div class="grid" id="answerGrid"></div>
<div class="exp-strip" id="expStrip"></div>
<button class="next-btn" id="nextBtn" onclick="nextScenario()">Next Scenario →</button>
<div class="end-screen" id="endScreen">
  <div class="ring-wrap">
    <svg viewBox="0 0 130 130"><circle cx="65" cy="65" r="56" fill="none" stroke="#162840" stroke-width="12"/><circle id="ringCircle" cx="65" cy="65" r="56" fill="none" stroke="#c9a84c" stroke-width="12" stroke-linecap="round" stroke-dasharray="351.86" stroke-dashoffset="351.86" transform="rotate(-90 65 65)" style="transition:stroke-dashoffset 1s ease"/></svg>
    <div class="ring-center"><div class="ring-pct" id="ringPct">0%</div><div class="ring-label">Score</div></div>
  </div>
  <div class="end-title" id="endTitle"></div>
  <div class="end-sub" id="endSub"></div>
  <button class="restart-btn" onclick="restart()">Restart Simulator</button>
</div>
<script>
const scenarios=[
{
  scenario:"Maria, a 58-year-old patient with Type 2 Diabetes, reports drinking 3 sodas per day and skipping breakfast. Her HbA1c has risen from 7.8% to 9.2% since her last visit 3 months ago.",
  q:"As the MA, what is your FIRST priority during this intake visit?",
  opts:["Advise Maria to switch to diet soda and add a daily multivitamin","Create a low-carb meal plan based on her HbA1c result","Accurately document her dietary history, weight, and blood pressure, then alert the provider to worsening labs","Tell Maria her HbA1c means she needs insulin immediately"],
  ans:2,
  exp:"MAs document, don't diagnose or prescribe. Accurately recording dietary history, current weight, and worsening HbA1c gives the provider the information needed. Notifying the provider of lab trend changes is appropriate and within scope."
},
{
  scenario:"A patient on a low-sodium diet for heart failure (CHF) tells you they've been eating canned soup every day because it's easy to prepare. They report slight ankle swelling has returned.",
  q:"What is the most appropriate MA response to document and act on?",
  opts:["Tell the patient canned soup is fine as long as they don't add extra salt","Document the dietary report and ankle swelling; reinforce the provider's low-sodium instructions and flag findings for the provider","Prescribe a water pill to reduce the edema","Suggest switching to a high-potassium diet to counteract the sodium"],
  ans:1,
  exp:"Documenting the symptom (ankle swelling = possible fluid retention) and the dietary non-compliance, then reinforcing provider instructions and flagging for the provider, is the correct MA action. MAs do not prescribe medications or create new diet plans."
},
{
  scenario:"During intake, a 24-year-old vegan patient reports fatigue, numbness in her fingers, and difficulty concentrating. She has been vegan for 3 years and takes no supplements.",
  q:"Which nutritional deficiency should the MA flag as a possible concern for the provider?",
  opts:["Iron deficiency only","Vitamin D and calcium only","Vitamin B12 deficiency, consistent with vegan diet without supplementation","Protein-energy malnutrition due to no animal products"],
  ans:2,
  exp:"Fatigue, numbness, and cognitive symptoms in a long-term vegan without supplementation are classic signs of Vitamin B12 deficiency. B12 is found almost exclusively in animal products. This should be flagged for the provider to order appropriate labs."
},
{
  scenario:"A patient with Chronic Kidney Disease (CKD Stage 4) comes in for a routine visit. During dietary history, they mention eating bananas, potatoes, and tomatoes daily as their main diet.",
  q:"What nutrition concern should the MA document and report to the provider?",
  opts:["High fiber intake that may interfere with medications","Excessive calorie intake from starchy vegetables","High potassium intake — bananas, potatoes, and tomatoes are high-potassium foods restricted in CKD","Insufficient protein intake for wound healing"],
  ans:2,
  exp:"CKD patients must restrict potassium because impaired kidneys cannot adequately filter it. Bananas, potatoes, and tomatoes are all high-potassium foods. This dietary pattern should be documented and flagged — the provider or RD will advise on substitutions."
},
{
  scenario:"A pregnant patient at 8 weeks gestation asks you what nutrient is most important to take as a supplement during early pregnancy for fetal development.",
  q:"Which nutrient would you direct her to ask her provider about, based on evidence-based clinical knowledge?",
  opts:["Vitamin C, to prevent scurvy during pregnancy","Iron, to prevent gestational anemia","Folate (Vitamin B9), to reduce the risk of neural tube defects","Calcium, to prevent preeclampsia"],
  ans:2,
  exp:"Folate is the most critical supplement in early pregnancy for neural tube development. The neural tube closes in the first 28 days — often before a woman knows she's pregnant. MAs can share this evidence-based information and direct the patient to discuss supplementation with their provider."
},
{
  scenario:"An elderly male patient, 74 years old, is admitted to the clinic. He appears thin, has noticeable muscle wasting, and his caregiver reports he's been eating very little for 2 months since a hospitalization.",
  q:"Which nutritional condition is most consistent with these findings, and what should the MA do?",
  opts:["Iron-deficiency anemia; recommend red meat and spinach","Vitamin D deficiency; schedule a bone density scan","Protein-energy malnutrition; document findings and flag for provider — RD referral likely needed","Potassium deficiency; recommend bananas and potatoes"],
  ans:2,
  exp:"Muscle wasting and inadequate intake in an elderly post-hospitalization patient are classic signs of protein-energy malnutrition. The MA should document weight, dietary history, and appearance changes, then alert the provider. RD referral is appropriate for complex nutritional rehabilitation."
},
{
  scenario:"A patient tells you she has been diagnosed with celiac disease and asks if she can still eat oats, barley bread, and rye crackers occasionally.",
  q:"Based on the therapeutic diet guidelines you know, what is the most accurate statement to communicate to the patient?",
  opts:["Oats are fine in unlimited amounts; only barley and rye must be avoided","Occasional exposure is acceptable as long as symptoms are mild","All wheat, barley, and rye must be completely eliminated; even trace exposure can cause intestinal damage","A gluten-free diet is only needed during flares, not continuously"],
  ans:2,
  exp:"The gluten-free diet for celiac disease requires complete elimination of wheat, barley, and rye at all times. Even trace exposure triggers an immune response that damages intestinal villi. The MA can reinforce this education based on provider/diet sheet instructions."
},
{
  scenario:"During intake documentation, a patient mentions she usually eats a diet of primarily white rice, bread, and pasta — very little protein or produce. She reports feeling tired constantly and notices her hair has been falling out.",
  q:"Which combination of deficiencies would be most consistent with her reported dietary pattern?",
  opts:["Vitamin D and calcium deficiency from lack of dairy","Iron and protein deficiency — consistent with low protein and low micronutrient intake","Folate deficiency only, from low leafy green intake","Vitamin K deficiency from low green vegetable intake"],
  ans:1,
  exp:"A diet dominated by refined starches with little protein or produce is likely deficient in both iron (causing fatigue) and protein (causing hair loss and poor tissue maintenance). The MA should document the dietary history and flag these findings for the provider."
},
{
  scenario:"A provider asks the MA to document the dietary intake for a patient on a DASH diet for hypertension. During the review, the patient asks the MA to suggest some specific food swaps to follow the DASH diet better.",
  q:"What is the appropriate MA action?",
  opts:["Provide detailed individualized meal planning guidance based on DASH principles","Refer the patient immediately to the emergency department","Provide approved printed DASH diet materials from the office and direct the patient to discuss specific food swaps with the provider or RD","Tell the patient to search online for DASH diet recipes and return next month"],
  ans:2,
  exp:"MAs can provide approved printed educational materials (like DASH diet handouts) and reinforce provider-given instructions. Creating personalized meal advice or food swap lists goes beyond MA scope — that requires an RD or provider guidance."
},
{
  scenario:"A 16-year-old female patient comes in for an annual wellness visit. Her mother is concerned she's been skipping meals, avoiding all fats and carbohydrates, and has lost 12 lbs in 2 months. The patient denies any concerns.",
  q:"What is the most appropriate MA response to these intake findings?",
  opts:["Reassure the mother that adolescent weight loss is normal","Document the weight loss, dietary patterns, and mother's concerns accurately; flag for the provider — this may require RD and mental health referral","Advise the patient to eat more protein and healthy fats to replace the weight","Calculate the patient's BMI and advise her on appropriate caloric intake"],
  ans:1,
  exp:"Significant weight loss, meal skipping, and avoidance of food groups in an adolescent are red flags for an eating disorder. The MA documents findings accurately and flags them for the provider. This scenario warrants RD referral and possibly mental health support — MAs do not diagnose or treat eating disorders."
}
];

let current=0,score=0,answered=false;

function render(){
  const sc=scenarios[current];
  document.getElementById('scLabel').textContent='Scenario '+(current+1)+' of '+scenarios.length;
  document.getElementById('scoreLabel').textContent='Score: '+score+' / '+current;
  document.getElementById('progFill').style.width=(((current)/scenarios.length)*100+10)+'%';
  document.getElementById('scenarioText').textContent=sc.scenario;
  document.getElementById('question').textContent=sc.q;
  const grid=document.getElementById('answerGrid');
  grid.innerHTML='';
  ['A','B','C','D'].forEach((letter,i)=>{
    const btn=document.createElement('button');
    btn.className='ans-btn';
    btn.innerHTML='<span class="ans-letter">'+letter+'</span><span class="ans-text">'+sc.opts[i]+'</span>';
    btn.onclick=()=>choose(i,btn);
    grid.appendChild(btn);
  });
  document.getElementById('expStrip').classList.remove('show');
  document.getElementById('expStrip').textContent='';
  document.getElementById('nextBtn').classList.remove('show');
  answered=false;
}

function choose(idx){
  if(answered)return;
  answered=true;
  const sc=scenarios[current];
  const btns=[...document.querySelectorAll('.ans-btn')];
  btns.forEach(b=>b.classList.add('locked'));
  btns[idx].classList.add(idx===sc.ans?'correct':'wrong');
  btns[sc.ans].classList.add('correct');
  if(idx===sc.ans)score++;
  const exp=document.getElementById('expStrip');
  exp.textContent=(idx===sc.ans?'✓ Correct: ':'✗ Incorrect. ')+sc.exp;
  exp.classList.add('show');
  document.getElementById('scoreLabel').textContent='Score: '+score+' / '+(current+1);
  const nb=document.getElementById('nextBtn');
  nb.textContent=current===scenarios.length-1?'See Results →':'Next Scenario →';
  nb.classList.add('show');
}

function nextScenario(){
  current++;
  if(current>=scenarios.length){showEnd();return;}
  render();
}

function showEnd(){
  document.getElementById('scenarioCard').style.display='none';
  document.getElementById('question').style.display='none';
  document.getElementById('answerGrid').style.display='none';
  document.getElementById('expStrip').style.display='none';
  document.getElementById('progWrap').style.display='none';
  document.getElementById('nextBtn').style.display='none';
  const pct=Math.round((score/scenarios.length)*100);
  document.getElementById('endScreen').classList.add('show');
  document.getElementById('ringPct').textContent=pct+'%';
  const circ=351.86;
  const rc=document.getElementById('ringCircle');
  rc.style.strokeDashoffset=circ-(circ*(pct/100));
  rc.style.stroke=pct>=80?'#2db37a':pct>=60?'#c9a84c':'#e05252';
  document.getElementById('endTitle').textContent=pct>=80?'Clinical Competence Demonstrated! 🎉':pct>=60?'Good Clinical Reasoning! 💪':'Review Clinical Concepts 📚';
  document.getElementById('endSub').textContent='You correctly resolved '+score+' of '+scenarios.length+' clinical scenarios ('+pct+'%). '+(pct>=80?'Your clinical nutrition decision-making is strong.':'Review the scenarios where you made incorrect choices and revisit the slides on MA scope and therapeutic diets.');
}

function restart(){
  current=0;score=0;answered=false;
  document.getElementById('scenarioCard').style.display='';
  document.getElementById('question').style.display='';
  document.getElementById('answerGrid').style.display='';
  document.getElementById('progWrap').style.display='';
  document.getElementById('endScreen').classList.remove('show');
  render();
}

render();
</script>
</body>
</html>
