<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Behind Healthcare — Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:10px 14px;gap:8px;background:#0f1e2e;color:#e8eef5;font-family:'Inter',sans-serif}
.header{flex-shrink:0;width:100%;max-width:760px}
.title{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;color:#c9a84c;letter-spacing:.3px;margin-bottom:6px}
.filters{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;flex-shrink:0;width:100%;max-width:760px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.pill{white-space:nowrap;padding:5px 13px;border-radius:20px;font-size:11.5px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;border:1.5px solid #1e3a56;background:#162840;color:#6b8aaa;transition:all .18s;flex-shrink:0}
.pill.active{background:#2a8fa3;border-color:#2a8fa3;color:#fff}
.pill:hover:not(.active){border-color:#2a8fa3;color:#2a8fa3}
.card-area{flex:1;min-height:0;width:100%;max-width:760px;perspective:1200px;cursor:pointer}
.card-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,0,.2,1)}
.card-inner.flipped{transform:rotateY(180deg)}
.card-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 32px;gap:14px}
.card-front{background:linear-gradient(135deg,#0d2a3d 0%,#162840 60%,#0e2236 100%);border:1.5px solid #2a8fa3}
.card-back{background:linear-gradient(135deg,#2a1a05 0%,#1e2a0a 40%,#1a2010 100%);border:1.5px solid #c9a84c;transform:rotateY(180deg)}
.face-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;font-family:'Plus Jakarta Sans',sans-serif;opacity:.6}
.card-front .face-label{color:#2a8fa3}
.card-back .face-label{color:#c9a84c}
.cat-badge{padding:4px 12px;border-radius:12px;font-size:10.5px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.4px}
.card-term{font-size:22px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;color:#e8eef5;text-align:center;line-height:1.3}
.hint{font-size:12px;color:#5a7a99;font-family:'Inter',sans-serif;margin-top:4px}
.card-def{font-size:14px;color:#dce8f0;text-align:center;line-height:1.65;font-family:'Inter',sans-serif;font-weight:500}
.controls{flex-shrink:0;width:100%;max-width:760px;display:flex;align-items:center;gap:8px}
.nav-btn{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;border:none;border-radius:9px;padding:9px 18px;cursor:pointer;transition:opacity .2s;flex-shrink:0}
.btn-prev{background:#1e3550;color:#e8eef5}
.btn-next-nav{background:#1e3550;color:#e8eef5}
.btn-shuffle{background:#1e3550;color:#c9a84c;margin-left:auto}
.nav-btn:hover{opacity:.8}
.dots{display:flex;gap:5px;align-items:center;overflow:hidden;flex:1;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:#1e3a56;transition:background .2s,transform .2s;flex-shrink:0}
.dot.active{background:#2a8fa3;transform:scale(1.3)}
.dot.done{background:#c9a84c}
.card-counter{font-size:12px;color:#6b8aaa;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div class="header"><div class="title">Science Behind Healthcare — Flashcards</div></div>
<div class="filters" id="filters"></div>
<div class="card-area" id="cardArea" onclick="flipCard()">
  <div class="card-inner" id="cardInner">
    <div class="card-face card-front">
      <div class="face-label">Tap to reveal</div>
      <div class="cat-badge" id="frontBadge"></div>
      <div class="card-term" id="termText"></div>
      <div class="hint" id="hintText"></div>
    </div>
    <div class="card-face card-back">
      <div class="face-label">Definition</div>
      <div class="card-def" id="defText"></div>
      <div class="cat-badge" id="backBadge"></div>
    </div>
  </div>
</div>
<div class="controls">
  <button class="nav-btn btn-prev" onclick="prev()">← Prev</button>
  <div class="dots" id="dots"></div>
  <div class="card-counter" id="counter">1 / 28</div>
  <button class="nav-btn btn-next-nav" onclick="next()">Next →</button>
  <button class="nav-btn btn-shuffle" onclick="shuffleCards()">⇄ Shuffle</button>
</div>
<script>
const CAT={
  "Scientific Method":["#1a2a10","#7ec870"],
  "EBP & Research":["#0a2225","#2a8fa3"],
  "Body Systems":["#1a1a3a","#6e7ef0"],
  "Homeostasis":["#2a1a05","#c9a84c"],
  "Pathophysiology":["#2a0d0d","#e05252"],
  "Pharmacology":["#1e1a30","#a06fd8"],
  "Clinical Trials":["#1a3a1a","#2db37a"],
  "Critical Thinking":["#1e2a10","#c9a84c"],
};
const allCards=[
  {term:"Scientific Method",cat:"Scientific Method",hint:"6 steps in medicine",def:"A systematic process for building medical knowledge: Observation → Question → Hypothesis → Experiment/Study → Analysis → Conclusion. Ensures clinical protocols are evidence-based rather than assumed to work."},
  {term:"Hypothesis",cat:"Scientific Method",hint:"Testable prediction",def:"A testable, falsifiable prediction formed before a study begins. Example: 'Smokers will have higher rates of bronchitis than non-smokers.' A hypothesis must be falsifiable — it can be proven wrong by data."},
  {term:"Randomized Controlled Trial (RCT)",cat:"Scientific Method",hint:"Gold standard study design",def:"The gold standard of clinical research. Participants are randomly assigned to a treatment group or control group, eliminating selection bias. Random assignment allows researchers to establish causation, not just correlation."},
  {term:"Peer Review",cat:"Scientific Method",hint:"Quality control for research",def:"The process by which independent scientists evaluate a study's methodology and conclusions before publication. Peer review is the quality control mechanism that prevents flawed or fabricated research from entering medical practice."},
  {term:"Evidence-Based Practice (EBP)",cat:"EBP & Research",hint:"3-component integration",def:"The integration of (1) best current research evidence, (2) clinical expertise from training and experience, and (3) individual patient values and needs. EBP is why clinical protocols change over time as better evidence emerges."},
  {term:"Hierarchy of Evidence",cat:"EBP & Research",hint:"Level 1 is strongest",def:"A ranking of study designs by strength of evidence: Level 1 (strongest) = Systematic Reviews & Meta-Analyses; Level 2 = RCTs; Level 3 = Cohort & Case-Control Studies; Level 4 = Case Reports & Expert Opinion; Level 5 (weakest) = Anecdote."},
  {term:"Meta-Analysis",cat:"EBP & Research",hint:"Strongest evidence level",def:"A statistical synthesis of data from multiple independent studies on the same topic. Ranked Level 1 in the hierarchy of evidence — the highest quality because it combines findings across many trials, reducing the chance of any single study's bias affecting the conclusion."},
  {term:"Cardiovascular System",cat:"Body Systems",hint:"Pump + circulation",def:"Pumps blood throughout the body via the heart and blood vessels, delivering oxygen and nutrients to tissues and removing metabolic waste. MAs monitor cardiovascular function through blood pressure, pulse rate, and rhythm at every visit."},
  {term:"Endocrine System",cat:"Body Systems",hint:"Hormonal signaling",def:"Regulates metabolism, growth, mood, and reproduction through hormones secreted by glands (thyroid, adrenal, pancreas, pituitary). Disruption causes chronic conditions: diabetes (pancreas), hypothyroidism (thyroid), Cushing's (adrenal)."},
  {term:"Urinary/Renal System",cat:"Body Systems",hint:"Filtration + fluid balance",def:"Filters blood, regulates fluid and electrolyte balance, and excretes metabolic waste as urine. The kidneys are critical for drug excretion (pharmacokinetics) and are severely affected by diabetes, hypertension, and autoimmune disease."},
  {term:"Homeostasis",cat:"Homeostasis",hint:"Body's self-correction",def:"The body's ability to maintain a stable internal environment despite external changes. The fundamental goal of virtually every physiological process — from temperature regulation to blood glucose control to acid-base balance."},
  {term:"Negative Feedback Loop",cat:"Homeostasis",hint:"Most common mechanism",def:"The primary homeostatic mechanism. When a parameter deviates from normal, the body responds in the OPPOSITE direction to restore balance. Steps: Stimulus → Receptor detects change → Control Center (brain/glands) → Effector responds → Balance restored."},
  {term:"Normal Blood Glucose Range",cat:"Homeostasis",hint:"Insulin & glucagon",def:"70–100 mg/dL fasting. When blood glucose is too HIGH, insulin is released to lower it. When too LOW, glucagon is released to raise it. Both hormones are produced by the pancreas in a classic negative feedback loop."},
  {term:"Normal Blood pH Range",cat:"Homeostasis",hint:"7.35–7.45",def:"Blood pH is tightly maintained at 7.35–7.45. Maintained by respiratory rate (CO2 removal) and kidney bicarbonate adjustments. Values below 7.35 = acidosis; above 7.45 = alkalosis. Even small deviations can be life-threatening."},
  {term:"Pathophysiology",cat:"Pathophysiology",hint:"Bridge: science → clinical",def:"The study of how normal physiological processes are disrupted by disease, injury, or dysfunction. It bridges basic science and clinical medicine — explaining WHY diseases produce the symptoms and lab findings they do."},
  {term:"Inflammation",cat:"Pathophysiology",hint:"Redness, heat, swelling, pain",def:"The body's first-line response to injury or infection. Acute inflammation is short-term and protective (wound healing). Chronic inflammation is damaging — driving atherosclerosis, arthritis, IBD, and many cancers over time."},
  {term:"Ischemia vs. Infarction",cat:"Pathophysiology",hint:"Reduced vs. no blood flow",def:"Ischemia = reduced (but not completely stopped) blood flow to tissue. Infarction = complete blockage causing permanent tissue death. Examples: myocardial infarction (heart attack) and cerebrovascular accident (stroke) require emergency intervention."},
  {term:"Neoplasia",cat:"Pathophysiology",hint:"Uncontrolled cell growth",def:"Abnormal, uncontrolled cell growth caused by mutations in cell-cycle regulatory genes. Benign tumors are non-invasive; malignant tumors are invasive and can metastasize. Cancer stages reflect spread: local → regional → distant metastasis."},
  {term:"Pharmacokinetics (ADME)",cat:"Pharmacology",hint:"What the body does to a drug",def:"How the body processes a drug through four phases: Absorption (enters bloodstream), Distribution (travels to tissues via blood), Metabolism (liver transforms into metabolites), Excretion (removed via kidneys/urine, liver/bile, lungs, or sweat)."},
  {term:"First-Pass Effect",cat:"Pharmacology",hint:"Oral drug potency reduction",def:"When an oral drug is absorbed from the GI tract, it passes through the liver first (via portal circulation), where it is partially metabolized before reaching systemic circulation. This reduces the effective potency of oral medications compared to IV administration."},
  {term:"Pharmacodynamics",cat:"Pharmacology",hint:"What the drug does to the body",def:"The study of how a drug produces its effects on the body — mechanisms of action, receptor binding, dose-response relationships, and therapeutic vs. toxic effects. Example: beta blockers block adrenaline receptors, slowing heart rate."},
  {term:"Therapeutic Window",cat:"Pharmacology",hint:"Effective but not toxic",def:"The dose range between the minimum effective concentration and the toxic concentration. Drugs with narrow therapeutic windows (warfarin, digoxin, lithium, phenytoin) require close laboratory monitoring to ensure patients remain within the safe range."},
  {term:"Anticoagulants — MA Monitoring",cat:"Pharmacology",hint:"Warfarin, heparin, apixaban",def:"Anticoagulants prevent clot formation in AF, DVT, and PE. MAs must: flag significant changes in Vitamin K dietary intake (affects warfarin INR), document any bruising or unusual bleeding, and record INR results at every visit."},
  {term:"Clinical Trial Phases",cat:"Clinical Trials",hint:"Pre-Clinical through Phase IV",def:"Pre-Clinical (lab/animal safety) → Phase I (20–100 humans; safety/dosage) → Phase II (100–300; effectiveness) → Phase III (1,000–3,000; large RCT vs. existing treatment) → FDA Review → Phase IV (post-market surveillance for rare side effects)."},
  {term:"Placebo",cat:"Clinical Trials",hint:"Inactive comparison treatment",def:"An inactive treatment (sugar pill, saline injection) given to the control group in a clinical trial. Used to test whether a drug's effects are real or due to patient expectation (placebo effect). Enables true measurement of drug efficacy."},
  {term:"Statistical Significance (p-value)",cat:"Clinical Trials",hint:"p < 0.05 threshold",def:"A p-value < 0.05 means there is less than a 5% probability that the observed results occurred by random chance. The standard threshold for medical research. A statistically significant result doesn't always mean clinically meaningful — effect size matters too."},
  {term:"Informed Consent in Research",cat:"Clinical Trials",hint:"Ethical requirement",def:"An ethical and legal requirement: research participants must be fully informed of the study's purpose, procedures, risks, and benefits before enrolling. Informed consent protects participant autonomy. MAs may assist with documentation but providers obtain consent."},
  {term:"Red Flags for Misinformation",cat:"Critical Thinking",hint:"7 warning signs",def:"Warning signs that health information is unreliable: no peer-reviewed citations; based on single anecdotes or celebrity endorsements; promises a 'cure' for multiple unrelated conditions; uses fear/urgency to sell; claims 'doctors don't want you to know'; published only on social media or blogs."},
];

let cards=[...allCards],current=0,flipped=false,activeFilter='All';
const filters=['All',...Object.keys(CAT)];

function buildFilters(){
  const wrap=document.getElementById('filters');
  filters.forEach(f=>{
    const btn=document.createElement('button');
    btn.className='pill'+(f==='All'?' active':'');
    btn.textContent=f;
    btn.addEventListener('click',()=>setFilter(f));
    wrap.appendChild(btn);
  });
}
function setFilter(f){
  activeFilter=f;
  document.querySelectorAll('.pill').forEach(p=>p.classList.toggle('active',p.textContent===f));
  cards=f==='All'?[...allCards]:allCards.filter(c=>c.cat===f);
  current=0;flipped=false;renderCard();buildDots();
}
function buildDots(){
  const wrap=document.getElementById('dots');wrap.innerHTML='';
  cards.forEach((c,i)=>{const d=document.createElement('div');d.className='dot'+(i===current?' active':i<current?' done':'');wrap.appendChild(d);});
}
function renderCard(){
  const c=cards[current];
  const [bg,fg]=CAT[c.cat]||['#162840','#2a8fa3'];
  document.getElementById('termText').textContent=c.term;
  document.getElementById('hintText').textContent=c.hint||'';
  document.getElementById('defText').textContent=c.def;
  [document.getElementById('frontBadge'),document.getElementById('backBadge')].forEach(b=>{b.textContent=c.cat;b.style.background=bg;b.style.color=fg;});
  document.getElementById('counter').textContent=(current+1)+' / '+cards.length;
  flipped=false;document.getElementById('cardInner').classList.remove('flipped');
  buildDots();
}
function flipCard(){flipped=!flipped;document.getElementById('cardInner').classList.toggle('flipped',flipped);}
function prev(){if(current>0){current--;renderCard();}}
function next(){if(current<cards.length-1){current++;renderCard();}}
function shuffleCards(){for(let i=cards.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[cards[i],cards[j]]=[cards[j],cards[i]];}current=0;renderCard();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();else if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard();}});
buildFilters();renderCard();
</script>
</body>
</html>
