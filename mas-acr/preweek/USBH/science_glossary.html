<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Behind Healthcare — Glossary</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:10px 14px;gap:8px;background:#0f1e2e;color:#e8eef5;font-family:'Inter',sans-serif}
.header{flex-shrink:0;width:100%;max-width:760px;display:flex;align-items:center;gap:10px}
.title{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;color:#c9a84c;letter-spacing:.3px;flex:1}
.total-count{font-size:11.5px;color:#6b8aaa;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;white-space:nowrap}
.search-wrap{flex-shrink:0;width:100%;max-width:760px;position:relative}
.search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#4a6a88;font-size:14px;pointer-events:none}
.search-input{width:100%;padding:10px 14px 10px 36px;border-radius:10px;border:1.5px solid #1e3a56;background:#162840;color:#e8eef5;font-size:13.5px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
.search-input:focus{border-color:#2a8fa3}
.search-input::placeholder{color:#4a6a88}
.term-card{flex:1;min-height:0;width:100%;max-width:760px;background:#162840;border-radius:14px;border:1.5px solid #1e3a56;display:flex;flex-direction:column;padding:24px 28px;gap:16px;overflow:hidden}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-shrink:0}
.term-name{font-size:26px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;color:#e8eef5;line-height:1.2}
.cat-badge{padding:5px 14px;border-radius:12px;font-size:11px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.4px;flex-shrink:0;margin-top:4px}
.term-body{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.section-label{font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#4a6a88;font-family:'Plus Jakarta Sans',sans-serif}
.term-def{font-size:14.5px;color:#b0c4d8;line-height:1.65;font-family:'Inter',sans-serif}
.term-extra{font-size:13px;color:#7a9cc0;line-height:1.6;font-family:'Inter',sans-serif}
.extra-block{background:#0f1e2e;border-radius:10px;padding:12px 16px;border:1px solid #1e3a56;flex-shrink:0}
.no-results{flex:1;min-height:0;width:100%;max-width:760px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.no-results.show{display:flex}
.no-results-icon{font-size:36px}
.no-results-text{font-size:14px;color:#4a6a88;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600}
.bottom{flex-shrink:0;width:100%;max-width:760px;display:flex;align-items:center;gap:8px}
.nav-btn{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;border:none;border-radius:9px;padding:9px 18px;cursor:pointer;background:#1e3550;color:#e8eef5;transition:opacity .2s;flex-shrink:0}
.nav-btn:hover{opacity:.8}
.nav-btn:disabled{opacity:.35;cursor:default}
.dots-wrap{flex:1;display:flex;gap:4px;justify-content:center;align-items:center;overflow:hidden}
.dot{width:6px;height:6px;border-radius:50%;background:#1e3a56;transition:background .2s,transform .2s;flex-shrink:0}
.dot.active{background:#2a8fa3;transform:scale(1.35)}
.dot.visited{background:#c9a84c}
.pos-label{font-size:12px;color:#6b8aaa;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div class="header">
  <div class="title">Science Behind Healthcare — Glossary</div>
  <div class="total-count" id="totalCount">40 terms</div>
</div>
<div class="search-wrap">
  <span class="search-icon">🔍</span>
  <input class="search-input" id="searchInput" type="text" placeholder="Search terms…" oninput="onSearch()">
</div>
<div class="term-card" id="termCard">
  <div class="card-top">
    <div class="term-name" id="termName"></div>
    <div class="cat-badge" id="catBadge"></div>
  </div>
  <div class="term-body">
    <div><div class="section-label">Definition</div><div class="term-def" id="termDef"></div></div>
    <div class="extra-block" id="extraBlock" style="display:none">
      <div class="section-label" id="extraLabel"></div>
      <div class="term-extra" id="termExtra"></div>
    </div>
  </div>
</div>
<div class="no-results" id="noResults"><div class="no-results-icon">🔎</div><div class="no-results-text">No terms match your search</div></div>
<div class="bottom">
  <button class="nav-btn" id="btnPrev" onclick="prev()">← Prev</button>
  <div class="dots-wrap" id="dotsWrap"></div>
  <div class="pos-label" id="posLabel">1 / 40</div>
  <button class="nav-btn" id="btnNext" onclick="next()">Next →</button>
</div>
<script>
const CAT={
  "Scientific Method":["#1a2a10","#7ec870"],
  "EBP & Research":["#0a2225","#2a8fa3"],
  "Body Systems":["#1a1a3a","#6e7ef0"],
  "Homeostasis":["#2a1a05","#c9a84c"],
  "Pathophysiology":["#2a0d0d","#e05252"],
  "Pharmacology":["#1e1a30","#a06fd8"],
  "Clinical Trials":["#1a3a1a","#2db37a"],
  "Critical Thinking":["#162840","#c9a84c"],
};
const allTerms=[
  {term:"Scientific Method",cat:"Scientific Method",def:"A systematic, step-by-step process for building reliable medical knowledge: Observation → Question → Hypothesis → Experiment/Study → Analysis → Conclusion/Publication.",extra:"In medicine, the scientific method ensures clinical protocols exist because they have been rigorously tested — not simply assumed to work or based on tradition.",extraLabel:"Clinical Relevance"},
  {term:"Observation",cat:"Scientific Method",def:"The first step of the scientific method — a clinician or researcher notices a pattern or anomaly. Example: patients who smoke appear to have higher rates of chronic respiratory illness.",extra:"Clinical observations form the foundation of research questions. MAs contribute to this process by accurate, thorough documentation at every patient encounter.",extraLabel:"MA Application"},
  {term:"Hypothesis",cat:"Scientific Method",def:"A specific, testable, and falsifiable prediction formed before conducting a study. Must be structured so data can either support or refute it.",extra:"Example: 'Smokers will have statistically higher rates of chronic bronchitis than matched non-smokers.' A hypothesis that cannot be tested or disproven is not scientifically useful.",extraLabel:"Example"},
  {term:"Randomized Controlled Trial (RCT)",cat:"Scientific Method",def:"The gold standard experimental study design. Participants are randomly assigned to a treatment group or a control group, eliminating selection bias and allowing causal conclusions.",extra:"Random assignment is the key feature — it ensures groups are equivalent at baseline so any outcome difference can be attributed to the treatment, not participant characteristics.",extraLabel:"Why Random Assignment Matters"},
  {term:"Peer Review",cat:"Scientific Method",def:"A pre-publication evaluation process in which independent subject-matter experts assess a study's methodology, analysis, and conclusions before it appears in a scientific journal.",extra:"Peer review is medicine's quality control — it catches errors, bias, and flawed methodology. MAs should recognize peer-reviewed journals (NEJM, JAMA, Lancet) as credible sources.",extraLabel:"Credibility Marker"},
  {term:"Statistical Significance",cat:"Scientific Method",def:"A measure of how likely observed results are to have occurred by random chance. Expressed as a p-value; p < 0.05 is the standard threshold for medical research.",extra:"p < 0.05 means less than 5% probability the result is due to chance. Note: statistical significance does NOT equal clinical meaningfulness — effect size and context also matter.",extraLabel:"p-value Interpretation"},
  {term:"Evidence-Based Practice (EBP)",cat:"EBP & Research",def:"The integration of three equally important components: (1) best current research evidence, (2) clinical expertise from training and experience, and (3) individual patient values and needs.",extra:"EBP explains why protocols evolve — when stronger evidence emerges, practice must change. MAs support EBP by following current protocols and using only approved educational materials.",extraLabel:"Why Protocols Change"},
  {term:"Hierarchy of Evidence",cat:"EBP & Research",def:"A ranking system for study designs based on their resistance to bias and reliability of conclusions. Level 1 (strongest) to Level 5 (weakest).",extra:"Level 1: Systematic Reviews & Meta-Analyses | Level 2: RCTs | Level 3: Cohort & Case-Control Studies | Level 4: Case Reports & Expert Opinion | Level 5: Anecdote / Personal Experience.",extraLabel:"Five Levels"},
  {term:"Meta-Analysis",cat:"EBP & Research",def:"A statistical technique that pools and synthesizes data from multiple independent studies on the same clinical question, producing a more powerful overall estimate of effect.",extra:"Ranked Level 1 in the evidence hierarchy because combining results from many trials reduces the influence of any single study's sample size limitations or biases.",extraLabel:"Why It Ranks Highest"},
  {term:"Cohort Study",cat:"EBP & Research",def:"An observational study that follows a group (cohort) of people over time to assess whether exposure to a factor is associated with a particular outcome. Cannot establish causation — only association.",extra:"Example: following a group of smokers and non-smokers for 20 years to compare lung cancer rates. Cohort studies are Level 3 evidence — useful but weaker than RCTs.",extraLabel:"Example"},
  {term:"Cardiovascular System",cat:"Body Systems",def:"Consists of the heart, blood vessels (arteries, veins, capillaries), and blood. Pumps oxygenated blood to tissues and returns deoxygenated blood to the lungs for gas exchange.",extra:"MAs assess cardiovascular function by monitoring blood pressure and pulse at every visit. Vital signs directly measure cardiovascular homeostasis — the system's ability to maintain adequate perfusion.",extraLabel:"MA Monitoring"},
  {term:"Respiratory System",cat:"Body Systems",def:"Responsible for gas exchange: oxygen enters the bloodstream from inhaled air via the alveoli; carbon dioxide (metabolic waste) is expelled. Works in conjunction with the cardiovascular system.",extra:"Respiratory rate is a vital sign that reflects both pulmonary function and acid-base balance. Rapid breathing (tachypnea) may indicate compensation for metabolic acidosis or respiratory distress.",extraLabel:"Vital Sign Connection"},
  {term:"Nervous System",cat:"Body Systems",def:"Coordinates all body functions through electrical signals. Consists of the central nervous system (brain + spinal cord) and peripheral nervous system (sensory and motor nerves throughout the body).",extra:"The nervous system serves as the 'control center' in homeostatic feedback loops — interpreting sensor signals and directing effector responses to restore balance.",extraLabel:"Homeostasis Role"},
  {term:"Endocrine System",cat:"Body Systems",def:"Regulates metabolism, growth, reproduction, and mood through hormones secreted by glands (thyroid, adrenal, pancreas, pituitary, ovaries/testes) directly into the bloodstream.",extra:"Endocrine dysfunction drives major chronic diseases: Type 2 Diabetes (pancreas), hypothyroidism (thyroid), Cushing's syndrome (adrenal). MAs monitor related labs and symptoms routinely.",extraLabel:"Clinical Conditions"},
  {term:"Urinary/Renal System",cat:"Body Systems",def:"Kidneys filter blood, regulate fluid and electrolyte balance, maintain acid-base homeostasis, and excrete metabolic waste and drugs as urine. Critical for pharmacokinetics (excretion phase).",extra:"Kidney dysfunction (CKD) affects drug excretion, requiring dose adjustments for renally-cleared medications. MAs note BMP/CMP lab values and flag declining GFR trends.",extraLabel:"Pharmacology Connection"},
  {term:"Integumentary System",cat:"Body Systems",def:"Skin, hair, and nails — the body's largest organ system. Functions as a physical barrier against pathogens, regulates temperature (sweating, vasodilation), and provides sensory input.",extra:"Skin changes (pallor, jaundice, cyanosis, rashes) are often the first visible clinical signs of systemic disease. MAs should document skin findings during intake.",extraLabel:"Clinical Observation"},
  {term:"Homeostasis",cat:"Homeostasis",def:"The body's ability to maintain a stable internal environment despite changing external conditions. The fundamental goal of virtually every physiological process — from cellular metabolism to organ system function.",extra:"When homeostasis fails, disease results. Hypertension = failed blood pressure homeostasis. Diabetes = failed glucose homeostasis. Vital signs monitoring IS homeostasis assessment.",extraLabel:"Clinical Meaning"},
  {term:"Negative Feedback Loop",cat:"Homeostasis",def:"The most common homeostatic control mechanism. When a parameter deviates from the set point, the body responds in the OPPOSITE direction to counteract the change and restore balance.",extra:"Steps: Stimulus (change detected) → Receptor (sensor detects deviation) → Control Center (brain/glands interpret signal) → Effector (muscle/gland responds) → Response (balance restored). The loop then repeats.",extraLabel:"The 5 Steps"},
  {term:"Normal Body Temperature",cat:"Homeostasis",def:"98.6°F / 37°C. Maintained by negative feedback: when too hot, sweating and vasodilation dissipate heat; when too cold, shivering generates heat and vasoconstriction conserves it.",extra:"Fever (>100.4°F / 38°C) indicates the body's thermoregulatory set point has been elevated by pyrogens — typically as part of an immune response to infection.",extraLabel:"Fever Definition"},
  {term:"Normal Blood Pressure",cat:"Homeostasis",def:"120/80 mmHg (systolic/diastolic). Maintained by vasodilation/vasoconstriction and heart rate adjustment. Regulated by baroreceptors in blood vessel walls that signal the brainstem.",extra:"Hypertension (≥130/80): homeostasis is failing. MAs measure BP at every visit as the primary cardiovascular homeostasis check. Two-minute rest before measurement improves accuracy.",extraLabel:"MA Application"},
  {term:"Pathophysiology",cat:"Pathophysiology",def:"The study of how normal physiological processes are disrupted by disease, injury, or dysfunction. The bridge between basic science (anatomy, physiology) and clinical medicine (diagnosis, treatment).",extra:"Understanding pathophysiology helps MAs document more accurately: knowing WHY a patient with heart failure has edema (fluid retention from poor cardiac output) improves clinical observation.",extraLabel:"Why It Matters for MAs"},
  {term:"Genetic / Hereditary Disease",cat:"Pathophysiology",def:"Diseases caused by mutations or inherited genetic variants that disrupt normal protein production or cell function. Present at birth or triggered later in life when genetic predisposition meets environmental factors.",extra:"Examples: cystic fibrosis, sickle cell anemia, Huntington's disease, BRCA1/2-related hereditary breast cancer. Family history documentation is the MA's tool for identifying genetic risk.",extraLabel:"Examples & MA Role"},
  {term:"Infectious Disease",cat:"Pathophysiology",def:"Disease caused by pathogens (bacteria, viruses, fungi, parasites) that invade tissues, evade immune defenses, or produce damaging toxins.",extra:"Examples: bacterial (pneumonia, UTI, sepsis), viral (influenza, HIV, COVID-19), fungal (candidiasis), parasitic (malaria). Infection control (hand hygiene, PPE, sterile technique) directly applies microbiology to practice.",extraLabel:"Examples & Prevention"},
  {term:"Autoimmune Disease",cat:"Pathophysiology",def:"A condition in which the immune system mistakenly attacks the body's own healthy cells and tissues, causing ongoing inflammation and organ damage.",extra:"Examples: rheumatoid arthritis (joints), lupus (systemic), Crohn's disease (GI), Type 1 Diabetes (pancreatic beta cells). Autoimmune patients are often on immunosuppressants — flag infection signs promptly.",extraLabel:"Examples & Clinical Alert"},
  {term:"Inflammation",cat:"Pathophysiology",def:"The body's primary response to injury, infection, or irritation. Classic signs: redness (rubor), heat (calor), swelling (tumor), pain (dolor), and loss of function.",extra:"Acute inflammation = short-term, protective (fighting infection, healing wounds). Chronic inflammation = long-term, damaging — drives atherosclerosis, arthritis, inflammatory bowel disease, and cancer development.",extraLabel:"Acute vs. Chronic"},
  {term:"Neoplasia",cat:"Pathophysiology",def:"Abnormal, uncontrolled cell growth caused by mutations in genes that regulate the cell cycle. Benign tumors are localized and non-invasive; malignant tumors invade surrounding tissue and can metastasize.",extra:"Cancer staging describes spread: localized → regional (lymph node involvement) → distant metastasis. MAs document weight loss, fatigue, pain, and abnormal bleeding — all potential cancer flags.",extraLabel:"Staging & MA Observation"},
  {term:"Pharmacokinetics (ADME)",cat:"Pharmacology",def:"The study of what the body does to a drug — how it is absorbed, distributed, metabolized, and excreted over time.",extra:"A = Absorption (drug enters blood); D = Distribution (blood carries drug to tissues); M = Metabolism (liver breaks down drug); E = Excretion (kidneys/liver/lungs remove drug). Route and timing of administration directly affect each phase.",extraLabel:"ADME Breakdown"},
  {term:"Pharmacodynamics",cat:"Pharmacology",def:"The study of what a drug does to the body — its mechanisms of action, receptor binding, dose-response relationships, and therapeutic vs. adverse effects.",extra:"Example: beta blockers block beta-adrenergic receptors, preventing adrenaline from increasing heart rate and BP. Understanding mechanism of action helps MAs recognize expected effects vs. adverse reactions.",extraLabel:"Mechanism of Action Example"},
  {term:"Therapeutic Window",cat:"Pharmacology",def:"The dose range between the minimum effective concentration (too low = no effect) and the minimum toxic concentration (too high = toxicity). Drugs with narrow therapeutic windows require careful monitoring.",extra:"Narrow window drugs: warfarin (INR monitoring), digoxin (heart rate + digoxin level), lithium (serum levels), phenytoin (serum levels). MAs document lab values and symptoms at every visit for these patients.",extraLabel:"Narrow Window Drugs"},
  {term:"Side Effects vs. Adverse Reactions",cat:"Pharmacology",def:"Side effects are predictable, dose-related, and known from clinical trials (e.g., nausea from antibiotics). Adverse reactions are unexpected, potentially dangerous, and may not have been predicted.",extra:"MAs document both and report to the provider. Key: never dismiss a patient's new symptom after starting a medication — document it accurately and flag to the provider before the visit ends.",extraLabel:"MA Documentation Role"},
  {term:"Drug Classes — Analgesics",cat:"Pharmacology",def:"Medications that relieve pain. Include: acetaminophen (OTC, liver toxicity risk with overdose), NSAIDs (ibuprofen — GI/kidney risk), and opioids (oxycodone, morphine — addiction and respiratory depression risk).",extra:"MA monitoring role: assess pain scale at every visit, note all OTC analgesic use (missed as 'not a medication' by patients), and flag any signs of opioid misuse per office policy.",extraLabel:"MA Monitoring"},
  {term:"Drug Classes — Antihypertensives",cat:"Pharmacology",def:"Medications that lower blood pressure. Major classes: ACE inhibitors (lisinopril), beta blockers (metoprolol), calcium channel blockers (amlodipine). Used for hypertension and heart failure.",extra:"MA monitoring role: measure BP at every visit; watch for hypotension (dizziness on standing = orthostatic hypotension). Document BP trends and report readings outside the provider's target range.",extraLabel:"MA Monitoring"},
  {term:"Drug Classes — Anticoagulants",cat:"Pharmacology",def:"Medications that prevent blood clot formation. Used for atrial fibrillation, DVT, and PE. Examples: warfarin (vitamin K antagonist), heparin (IV/SC), apixaban (direct Xa inhibitor).",extra:"MA monitoring role: flag any changes in Vitamin K dietary intake (affects warfarin INR), document bruising or unusual bleeding, and record INR lab values. St. John's Wort can dangerously reduce warfarin levels.",extraLabel:"MA Monitoring & Drug Interactions"},
  {term:"Clinical Trial Phases",cat:"Clinical Trials",def:"The staged process for testing new treatments before FDA approval: Pre-Clinical (lab/animal) → Phase I (~20–100 humans; safety) → Phase II (~100–300; effectiveness) → Phase III (~1,000–3,000; large RCT) → FDA Review → Phase IV (post-market surveillance).",extra:"Phase IV (post-market surveillance) is how rare side effects — too infrequent to appear in trials — are identified after a drug enters widespread use. Voluntary reporting systems like FDA MedWatch collect these signals.",extraLabel:"Phase IV Importance"},
  {term:"Double-Blind Study",cat:"Clinical Trials",def:"A research design in which neither the participants nor the researchers know who is receiving the treatment vs. placebo. Eliminates both participant expectation effects and researcher observation bias.",extra:"The 'blind' is broken only after all data is collected and analyzed. Double-blinding is considered essential for high-quality RCTs because both participant and researcher knowledge can unconsciously skew results.",extraLabel:"Why Both Must Be Blinded"},
  {term:"Placebo Effect",cat:"Clinical Trials",def:"A measurable improvement in symptoms that occurs when a patient believes they are receiving an active treatment, even when given an inert substance. Demonstrates the power of expectation on physiology.",extra:"The placebo effect is real and measurable — up to 30–40% response rates in pain studies. Clinical trials must account for this through placebo-controlled arms to isolate true drug effects.",extraLabel:"Magnitude of Effect"},
  {term:"Informed Consent",cat:"Clinical Trials",def:"An ethical and legal requirement ensuring research participants are fully informed of a study's purpose, procedures, potential risks, benefits, and right to withdraw before agreeing to enroll.",extra:"Informed consent protects participant autonomy. MAs may assist with paperwork but the provider is responsible for ensuring the patient understands and consents. Consent must be voluntary — no coercion.",extraLabel:"MA Role"},
  {term:"Signs of Credible Health Information",cat:"Critical Thinking",def:"Credible health information is: published in peer-reviewed journals (NEJM, JAMA, Lancet); methodology is transparent and reproducible; large and diverse sample sizes; findings replicated independently; authors disclose conflicts of interest; conclusions are measured, not absolute.",extra:"Major health organizations (CDC, WHO, NIH) review and endorse credible research. MAs can direct patients to these sources when questions arise — instead of endorsing unverified online content.",extraLabel:"Trusted Sources"},
  {term:"Red Flags for Misinformation",cat:"Critical Thinking",def:"Warning signs of unreliable health content: no citations or links to primary studies; based on single anecdotes or celebrity endorsements; promises a cure for multiple unrelated conditions; uses fear/urgency to sell a product; claims 'doctors don't want you to know this.'",extra:"Published only on blogs or social media (not peer-reviewed journals) is a strong red flag. MAs apply critical thinking to protect patients — acknowledge questions, note them for the provider, and use approved materials.",extraLabel:"MA Response"},
  {term:"Science in Daily MA Practice",cat:"Critical Thinking",def:"Every core MA task is grounded in science: Vital signs = homeostasis assessment; Medication administration = pharmacokinetics applied (5 Rights); Lab collection = scientific method (specimen integrity = data validity); Patient education = EBP applied; Infection control = applied microbiology.",extra:"The '5 Rights' of medication administration (right drug, dose, route, time, patient) are pharmacokinetics and pharmacodynamics in practice. Every step has a scientific rationale — MAs who understand why are safer practitioners.",extraLabel:"The Science Behind the 5 Rights"},
];

let filtered=[...allTerms],current=0,visitedSet=new Set();
function buildDots(){
  const wrap=document.getElementById('dotsWrap');wrap.innerHTML='';
  filtered.forEach((t,i)=>{const d=document.createElement('div');d.className='dot'+(i===current?' active':visitedSet.has(i)?' visited':'');wrap.appendChild(d);});
}
function renderTerm(){
  const t=filtered[current];if(!t)return;
  visitedSet.add(current);
  document.getElementById('termName').textContent=t.term;
  document.getElementById('termDef').textContent=t.def;
  const badge=document.getElementById('catBadge');
  badge.textContent=t.cat;
  const [bg,fg]=CAT[t.cat]||['#162840','#2a8fa3'];
  badge.style.background=bg;badge.style.color=fg;
  const extra=document.getElementById('extraBlock');
  if(t.extra){extra.style.display='block';document.getElementById('extraLabel').textContent=t.extraLabel||'Note';document.getElementById('termExtra').textContent=t.extra;}
  else{extra.style.display='none';}
  document.getElementById('posLabel').textContent=(current+1)+' / '+filtered.length;
  document.getElementById('btnPrev').disabled=current===0;
  document.getElementById('btnNext').disabled=current===filtered.length-1;
  buildDots();
}
function onSearch(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  filtered=q?allTerms.filter(t=>t.term.toLowerCase().includes(q)||t.def.toLowerCase().includes(q)):[...allTerms];
  current=0;visitedSet.clear();
  document.getElementById('termCard').style.display=filtered.length?'flex':'none';
  document.getElementById('noResults').className=filtered.length?'no-results':'no-results show';
  document.getElementById('totalCount').textContent=filtered.length+' term'+(filtered.length!==1?'s':'');
  if(filtered.length)renderTerm();
}
function prev(){if(current>0){current--;renderTerm();}}
function next(){if(current<filtered.length-1){current++;renderTerm();}}
document.addEventListener('keydown',e=>{if(document.getElementById('searchInput')===document.activeElement)return;if(e.key==='ArrowRight')next();else if(e.key==='ArrowLeft')prev();});
renderTerm();
</script>
</body>
</html>
