<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Behind Healthcare — Clinical Simulator</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:10px 14px;gap:8px;background:#0f1e2e;color:#e8eef5;font-family:'Inter',sans-serif}
.header{flex-shrink:0;width:100%;max-width:760px;display:flex;flex-direction:column;gap:5px}
.title{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;color:#c9a84c;letter-spacing:.3px}
.top-row{display:flex;align-items:center;gap:10px}
.progress-bg{flex:1;height:6px;background:#162840;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#2a8fa3,#c9a84c);border-radius:3px;transition:width .4s ease}
.prog-label{font-size:12px;color:#6b8aaa;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;white-space:nowrap}
.score-badge{font-size:12px;font-weight:700;font-family:'Plus Jakarta Sans',sans-serif;color:#c9a84c;white-space:nowrap}
.scenario-card{flex-shrink:0;width:100%;max-width:760px;background:#0d2a3d;border:1.5px solid #2a8fa3;border-radius:14px;padding:16px 20px;display:flex;flex-direction:column;gap:8px}
.scenario-eyebrow{display:flex;align-items:center;gap:8px}
.scene-num{font-size:10px;font-weight:700;color:#2a8fa3;text-transform:uppercase;letter-spacing:1.2px;font-family:'Plus Jakarta Sans',sans-serif}
.scene-tag{font-size:10px;font-weight:700;color:#4a8aaa;background:#0a1e2e;padding:3px 10px;border-radius:8px;font-family:'Plus Jakarta Sans',sans-serif;letter-spacing:.4px}
.scenario-text{font-size:13.5px;color:#c0d8e8;line-height:1.65;font-family:'Inter',sans-serif}
.question-text{font-size:14.5px;font-weight:700;color:#e8eef5;font-family:'Plus Jakarta Sans',sans-serif;line-height:1.45}
.answer-grid{flex-shrink:0;width:100%;max-width:760px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans-opt{background:#162840;border:1.5px solid #1e3a56;border-radius:11px;padding:12px 14px;cursor:pointer;transition:border-color .18s,background .18s;display:flex;align-items:flex-start;gap:9px;font-family:'Plus Jakarta Sans',sans-serif}
.ans-opt:hover:not(.locked-opt){border-color:#2a8fa3;background:#102030}
.opt-chip{width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#1e3a56;color:#6b8aaa;flex-shrink:0;transition:background .18s,color .18s;font-family:'Plus Jakarta Sans',sans-serif}
.opt-body{flex:1}
.opt-main{font-size:12.5px;font-weight:600;color:#b0c4d8;line-height:1.35}
.opt-sub{font-size:11px;color:#5a7a99;margin-top:3px;line-height:1.3;font-style:italic}
.ans-opt.correct-opt{border-color:#2db37a;background:#0d2820}
.ans-opt.correct-opt .opt-chip{background:#2db37a;color:#fff}
.ans-opt.correct-opt .opt-main{color:#a0e8b8}
.ans-opt.wrong-opt{border-color:#e05252;background:#2a0d0d}
.ans-opt.wrong-opt .opt-chip{background:#e05252;color:#fff}
.ans-opt.wrong-opt .opt-main{color:#f0a0a0}
.ans-opt.locked-opt{cursor:default}
.explanation{flex-shrink:0;width:100%;max-width:760px;background:#0a1f30;border-left:3px solid #2a8fa3;border-radius:0 10px 10px 0;padding:11px 16px;font-size:12.5px;color:#7ec8d8;line-height:1.55;font-family:'Inter',sans-serif;display:none}
.explanation.show{display:block}
.exp-label{font-size:10px;font-weight:700;color:#2a8fa3;text-transform:uppercase;letter-spacing:1px;font-family:'Plus Jakarta Sans',sans-serif;margin-bottom:5px}
.footer{flex-shrink:0;width:100%;max-width:760px;display:flex;justify-content:flex-end}
.btn-next{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;background:#c9a84c;color:#0f1e2e;border:none;border-radius:9px;padding:10px 24px;cursor:pointer;display:none;transition:opacity .2s}
.btn-next.show{display:block}
.btn-next:hover{opacity:.88}
.end-screen{flex:1;min-height:0;width:100%;max-width:760px;background:#162840;border-radius:14px;border:1px solid #1e3a56;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px}
.end-screen.show{display:flex}
.ring-wrap{position:relative;width:120px;height:120px}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-pct{font-size:26px;font-weight:800;color:#e8eef5;font-family:'Plus Jakarta Sans',sans-serif}
.ring-sub{font-size:11px;color:#6b8aaa;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600}
.end-title{font-size:20px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;color:#c9a84c;text-align:center}
.end-detail{font-size:13px;color:#7a9cc0;text-align:center;line-height:1.5;max-width:440px}
.btn-restart{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;background:#1e3550;color:#e8eef5;border:none;border-radius:9px;padding:10px 26px;cursor:pointer;transition:background .2s}
.btn-restart:hover{background:#2a4a6e}
</style>
</head>
<body>
<div class="header">
  <div class="title">Science Behind Healthcare — Clinical Simulator</div>
  <div class="top-row">
    <div class="progress-bg"><div class="progress-fill" id="progFill" style="width:10%"></div></div>
    <div class="prog-label" id="progLabel">1 / 10</div>
    <div class="score-badge" id="scoreBadge">Score: 0 / 10</div>
  </div>
</div>
<div class="scenario-card" id="scenarioCard">
  <div class="scenario-eyebrow">
    <div class="scene-num" id="sceneNum">Scenario 1</div>
    <div class="scene-tag" id="sceneTag"></div>
  </div>
  <div class="scenario-text" id="sceneText"></div>
  <div class="question-text" id="sceneQ"></div>
</div>
<div class="answer-grid" id="answerGrid"></div>
<div class="explanation" id="explanation"><div class="exp-label">Clinical Rationale</div><div id="expText"></div></div>
<div class="end-screen" id="endScreen"></div>
<div class="footer"><button class="btn-next" id="btnNext" onclick="nextScenario()">Next Scenario →</button></div>
<script>
var scenarios=[
  {tag:"Scientific Method",scenario:"During morning rounds, the supervising provider mentions she has noticed that patients who are sent lab orders on Fridays seem to have a significantly higher rate of unprocessed or lost specimens than those ordered on other days. She asks if anyone has noticed the same pattern.",q:"Applying the scientific method, what is the CORRECT next step after this observation?",opts:[{main:"Immediately change the lab ordering protocol for Fridays",sub:"Act on the observation to prevent further specimen loss",correct:false},{main:"Form a researchable question and then a testable hypothesis",sub:"e.g., 'Does specimen processing error rate differ by day of the week?'",correct:true},{main:"Collect anecdotal stories from other staff about their Friday experiences",sub:"This builds enough evidence to take action",correct:false},{main:"Submit the observation directly to the medical director as a confirmed finding",sub:"The pattern is clear enough to report as fact",correct:false}],exp:"The scientific method requires: Observation → Question → Hypothesis → Experiment. An observation (noticing a pattern) is only the starting point. A testable hypothesis must be formed before any study or protocol change — acting on unverified observations is how clinical errors are made."},
  {tag:"Evidence-Based Practice",scenario:"A patient asks you about a dietary supplement she saw advertised on a wellness podcast. The ad claimed the supplement has 'decades of research' proving it reverses Type 2 Diabetes. She asks if she should try it instead of her metformin.",q:"How do you BEST apply EBP and critical thinking in your response?",opts:[{main:"Tell her the supplement sounds promising and she can try it alongside metformin",sub:"Natural products are generally safe",correct:false},{main:"Acknowledge her question, note it for the provider, and do not endorse or dismiss the supplement yourself",sub:"Apply EBP — provider will evaluate based on evidence",correct:true},{main:"Tell her all supplements are useless and she should stick with metformin",sub:"This is the evidence-based recommendation",correct:false},{main:"Look up the supplement online during the visit and give her your assessment",sub:"Real-time research supports informed patient decisions",correct:false}],exp:"EBP requires best research evidence evaluated by someone with clinical expertise, integrated with the patient's values. MAs do not evaluate clinical claims or make medication comparisons — that is the provider's role. Acknowledge the question, note it accurately, and flag it before the provider sees the patient. Recognizing 'decades of research' as a marketing claim without citations is also critical thinking applied."},
  {tag:"Homeostasis",scenario:"A 72-year-old patient with a history of CHF and CKD presents for a routine follow-up. Her vitals show BP 158/96 mmHg, temperature 98.8°F, and respiratory rate of 22 breaths/min (normal: 12–20). She reports increasing shortness of breath when climbing stairs over the past week.",q:"Which homeostatic mechanism is MOST directly reflected by the elevated respiratory rate?",opts:[{main:"The body is increasing CO2 removal to compensate for metabolic acidosis and maintain blood pH",sub:"Tachypnea as acid-base compensation",correct:true},{main:"The respiratory system is malfunctioning independently of other body systems",sub:"Each system works alone",correct:false},{main:"Elevated respiratory rate is a normal variant in elderly patients and requires no documentation",sub:"Age-related change in normal range",correct:false},{main:"The elevated BP is directly causing the increased respiratory rate through baroreceptor activation",sub:"Baroreceptors regulate respiratory rate",correct:false}],exp:"Blood pH homeostasis (normal: 7.35–7.45) is maintained partly through respiratory rate — faster breathing removes more CO2, raising pH. In CHF with early pulmonary congestion, the body may also compensate for poor oxygenation by breathing faster. Both reflect homeostatic compensation. The MA should document the elevated RR and BP and flag them to the provider before the visit."},
  {tag:"Pathophysiology",scenario:"A 58-year-old male with a 30-year smoking history presents with a persistent cough, weight loss of 12 lbs over 3 months, and fatigue. He mentions he saw an ad for a supplement that 'naturally shrinks tumors.' A chest X-ray ordered by the provider shows a right upper lobe mass.",q:"Which disease process BEST explains the pathophysiology of the suspected diagnosis?",opts:[{main:"Autoimmune disease — the immune system is attacking lung tissue from years of smoking inflammation",sub:"Chronic smoking triggers autoimmune response",correct:false},{main:"Neoplasia — uncontrolled cell growth from mutations in cell-cycle regulatory genes caused by carcinogen exposure",sub:"Smoking causes cancer through genetic mutation",correct:true},{main:"Ischemia — reduced blood flow to the lung from coronary artery disease",sub:"Smoking causes vascular disease",correct:false},{main:"Genetic/hereditary disease — he likely inherited a mutation from his parents",sub:"Most lung cancers are hereditary",correct:false}],exp:"Neoplasia (cancer) results from mutations in genes that regulate cell division, triggered over time by carcinogens in tobacco smoke. The presentation — new mass, unintentional weight loss, fatigue — is classic for malignancy. The smoking history provides the environmental/lifestyle mechanism. The MA's role: document findings accurately, note the supplement question for the provider, and NOT engage with the supplement claim."},
  {tag:"Pharmacokinetics",scenario:"A 45-year-old patient is prescribed warfarin (anticoagulant) for atrial fibrillation. Her INR today is 1.3 (therapeutic range: 2.0–3.0). During intake, she mentions she recently started taking St. John's Wort for mild depression after reading about it on a health blog. She takes warfarin as a daily oral tablet.",q:"Why is St. John's Wort causing a sub-therapeutic INR in this patient?",opts:[{main:"St. John's Wort directly blocks warfarin absorption in the GI tract",sub:"Preventing the drug from entering the bloodstream",correct:false},{main:"St. John's Wort induces liver enzymes (CYP450), accelerating warfarin METABOLISM and reducing its blood concentration",sub:"Faster metabolism = less drug available to work",correct:true},{main:"St. John's Wort increases Vitamin K levels, which reverses warfarin's anticoagulant effect",sub:"Vitamin K antagonizes warfarin directly",correct:false},{main:"The low INR means the warfarin is working too well and the dose should be reduced",sub:"INR 1.3 indicates over-anticoagulation",correct:false}],exp:"St. John's Wort induces CYP450 hepatic enzymes, accelerating the METABOLISM (M in ADME) of warfarin. Faster metabolism = lower warfarin blood concentration = less anticoagulation = sub-therapeutic INR (1.3 is too low — the patient is under-anticoagulated and at increased stroke risk). MAs must document all supplements as medications and flag INR results to the provider immediately."},
  {tag:"Drug Monitoring",scenario:"A 67-year-old male with heart failure and Type 2 Diabetes presents for a follow-up. He is on metformin, lisinopril, furosemide, and digoxin. His most recent lab shows serum digoxin level of 2.4 ng/mL (therapeutic range: 0.5–2.0 ng/mL). He reports nausea and seeing a yellow-green tinge around lights.",q:"Which pharmacological concept BEST explains the clinical significance of these findings?",opts:[{main:"The digoxin is at a sub-therapeutic level and the dose should be increased",sub:"2.4 ng/mL is below the therapeutic range",correct:false},{main:"The digoxin level exceeds the therapeutic window — the patient is showing signs of toxicity",sub:"Narrow therapeutic window drug above safe range",correct:true},{main:"Nausea and visual changes are unrelated to digoxin — they are symptoms of his heart failure",sub:"CHF causes GI and visual symptoms",correct:false},{main:"Furosemide is interacting with digoxin to cause false elevation in the lab result",sub:"Diuretics interfere with digoxin assays",correct:false}],exp:"Digoxin is a classic narrow therapeutic window drug. A serum level of 2.4 ng/mL EXCEEDS the therapeutic range (0.5–2.0 ng/mL), producing signs of toxicity: nausea and visual disturbances (yellow-green halos) are hallmark digoxin toxicity symptoms. This is a medical emergency — the MA must document findings and flag to the provider BEFORE they see the patient. Hold the next digoxin dose pending provider instruction."},
  {tag:"Clinical Trials",scenario:"A patient you are rooming asks about a 'new breakthrough drug' she heard about on the news. The report said it is in Phase III trials and showed remarkable results. She asks: 'Can I get it? It sounds like it already works perfectly.'",q:"What is the MOST accurate and appropriate response about Phase III trials?",opts:[{main:"Tell her Phase III means the drug is FDA approved and she can ask her provider to prescribe it",sub:"Phase III completion = FDA approval",correct:false},{main:"Explain that Phase III is a large-scale RCT comparing the drug to existing treatments or placebo — FDA approval comes after",sub:"The drug is not yet approved for general use",correct:true},{main:"Advise her not to trust news reports about clinical trials since media always exaggerates",sub:"Media reports are unreliable by definition",correct:false},{main:"Tell her to look up the trial on social media to get unbiased information about the drug",sub:"Social media provides objective clinical trial data",correct:false}],exp:"Phase III is a large-scale RCT (1,000–3,000 participants) comparing the new drug to existing treatments or placebo. Remarkable Phase III results are promising, but FDA Review must follow before approval. The drug is NOT yet available for general prescribing. The correct MA response acknowledges the patient's interest, provides accurate information, and notes the question for the provider without dismissing or endorsing the therapy."},
  {tag:"Critical Thinking",scenario:"While rooming a patient, she shows you an article shared on a Facebook health group claiming that a specific vitamin regimen 'cures' rheumatoid arthritis based on a study of 12 people. The article has no journal citation and was written by a company selling the vitamins.",q:"Which critical thinking red flags are PRESENT in this scenario?",opts:[{main:"The article is from Facebook and has a small sample size — but it may still be valid without a citation",sub:"Small studies can still be valid research",correct:false},{main:"Multiple red flags: no peer-reviewed citation, tiny sample size (n=12), source is selling the product, and cure-all claim",sub:"All four represent major credibility concerns",correct:true},{main:"The only red flag is the small sample size — citation and source would make it credible",sub:"Citation alone ensures credibility",correct:false},{main:"There are no red flags since vitamins are natural and cannot cause harm",sub:"Natural products have no risk or bias concerns",correct:false}],exp:"Multiple red flags are stacked here: (1) No peer-reviewed citation — published on social media, not a journal. (2) Sample size of 12 is far too small to draw meaningful conclusions. (3) The source is selling the product — a massive conflict of interest. (4) Claiming a 'cure' for an autoimmune condition from a single supplement is scientifically implausible. MAs apply these critical thinking principles to protect patients from misinformation."},
  {tag:"Body Systems & Homeostasis",scenario:"A 55-year-old patient with Stage 3 CKD and Type 2 Diabetes presents for labs. Her BMP shows: potassium 5.9 mEq/L (normal: 3.5–5.0), bicarbonate 18 mEq/L (normal: 22–29), and creatinine 3.2 mg/dL. She reports muscle weakness and leg cramps. Her respiratory rate is 24 breaths/min.",q:"Which physiological concept BEST explains why her respiratory rate is elevated given her lab findings?",opts:[{main:"The high creatinine is irritating the respiratory center in the brain, causing faster breathing",sub:"Creatinine directly stimulates breathing rate",correct:false},{main:"Her kidneys cannot adequately excrete acid — she has metabolic acidosis, and her lungs are compensating by increasing CO2 removal",sub:"Respiratory compensation for metabolic acidosis",correct:true},{main:"The elevated potassium is stimulating respiratory muscle contraction, increasing breathing rate",sub:"Hyperkalemia causes tachypnea",correct:false},{main:"Her elevated respiratory rate is unrelated to her kidney disease",sub:"Renal and respiratory systems function independently",correct:false}],exp:"CKD impairs the kidneys' ability to excrete acid and regulate bicarbonate. Her low bicarbonate (18 mEq/L) confirms metabolic acidosis. The body compensates through the RESPIRATORY SYSTEM — by breathing faster (tachypnea), removing more CO2, reducing carbonic acid in the blood, and partially restoring pH toward normal. This is homeostasis in action: one system (lungs) compensating for another's (kidneys) failure. The MA documents RR, labs, and symptoms and flags to the provider immediately."},
  {tag:"Pharmacology & EBP",scenario:"During a staff meeting, a colleague suggests that all patients with hypertension at your clinic should start receiving a specific herbal tea 'proven by hundreds of years of traditional use' to lower blood pressure. She argues this is safer than medications and that 'natural is always better.'",q:"How do EBP principles and the hierarchy of evidence apply to this suggestion?",opts:[{main:"Traditional use over hundreds of years constitutes strong evidence and should be considered a Level 1 recommendation",sub:"Length of traditional use equals evidence quality",correct:false},{main:"Traditional use is anecdote-level evidence (Level 5) — it does not replace peer-reviewed RCTs or FDA-approved treatments without clinical trial data",sub:"EBP requires rigorous evidence, not tradition alone",correct:true},{main:"Since no studies have been done on the tea, it is probably safe and could be offered as a supplement to treatment",sub:"Absence of evidence means absence of harm",correct:false},{main:"The suggestion should be adopted immediately since herbs have no side effects or drug interactions",sub:"Natural products cannot cause adverse effects",correct:false}],exp:"Traditional use is Level 5 evidence — anecdote. It does not establish safety or efficacy by itself. EBP requires peer-reviewed, replicated clinical evidence (ideally RCTs, Level 2 or above) before adopting treatments. 'Natural' does not mean safe: many herbs have drug interactions (St. John's Wort/warfarin) and adverse effects. The correct response: acknowledge the interest, explain EBP standards, and suggest the provider review the literature before any clinical change."},
];

var current=0,score=0,locked=false;

function buildGrid(){
  var s=scenarios[current];
  document.getElementById('sceneNum').textContent='Scenario '+(current+1)+' of '+scenarios.length;
  document.getElementById('sceneTag').textContent=s.tag;
  document.getElementById('sceneText').textContent=s.scenario;
  document.getElementById('sceneQ').textContent=s.q;
  document.getElementById('progFill').style.width=((current+1)/scenarios.length*100)+'%';
  document.getElementById('progLabel').textContent=(current+1)+' / '+scenarios.length;
  document.getElementById('scoreBadge').textContent='Score: '+score+' / '+scenarios.length;
  document.getElementById('explanation').className='explanation';
  document.getElementById('expText').textContent='';
  document.getElementById('btnNext').className='btn-next';
  var grid=document.getElementById('answerGrid');grid.innerHTML='';
  var labels=['A','B','C','D'];
  s.opts.forEach(function(opt,i){
    var div=document.createElement('div');div.className='ans-opt';
    div.innerHTML='<div class="opt-chip">'+labels[i]+'</div><div class="opt-body"><div class="opt-main">'+opt.main+'</div><div class="opt-sub">'+opt.sub+'</div></div>';
    div.addEventListener('click',(function(idx,el,correct,scene){return function(){selectAnswer(idx,el,correct,scene);};})(i,div,opt.correct,s));
    grid.appendChild(div);
  });
  locked=false;
}

function selectAnswer(idx,el,isCorrect,s){
  if(locked)return;locked=true;
  var opts=document.querySelectorAll('.ans-opt');
  opts.forEach(function(o){o.classList.add('locked-opt');});
  if(isCorrect){el.classList.add('correct-opt');score++;}
  else{el.classList.add('wrong-opt');s.opts.forEach(function(opt,i){if(opt.correct)opts[i].classList.add('correct-opt');});}
  document.getElementById('expText').textContent=s.exp;
  document.getElementById('explanation').className='explanation show';
  document.getElementById('scoreBadge').textContent='Score: '+score+' / '+scenarios.length;
  document.getElementById('btnNext').className='btn-next show';
}

function nextScenario(){
  current++;
  if(current>=scenarios.length){showEnd();return;}
  buildGrid();
}

function showEnd(){
  document.getElementById('scenarioCard').style.display='none';
  document.getElementById('answerGrid').style.display='none';
  document.getElementById('explanation').style.display='none';
  document.getElementById('btnNext').style.display='none';
  document.getElementById('progFill').style.width='100%';
  var pct=Math.round(score/scenarios.length*100);
  var color=pct>=80?'#2db37a':pct>=60?'#c9a84c':'#e05252';
  var circ=339.3;var offset=circ-(circ*pct/100);
  var msg=pct>=90?'Exceptional! You understand the science behind healthcare.':pct>=70?'Good work! Review the rationales for missed scenarios.':'Keep studying — science is the foundation of everything clinical.';
  var end=document.getElementById('endScreen');
  end.innerHTML='<div class="ring-wrap"><svg viewBox="0 0 130 130" width="120" height="120" style="transform:rotate(-90deg)"><circle fill="none" stroke="#1e3a56" stroke-width="12" cx="65" cy="65" r="54"/><circle id="ringFill" fill="none" stroke="'+color+'" stroke-width="12" stroke-linecap="round" cx="65" cy="65" r="54" stroke-dasharray="'+circ+'" stroke-dashoffset="'+circ+'" style="transition:stroke-dashoffset 1s ease"/></svg><div class="ring-center"><div class="ring-pct">'+pct+'%</div><div class="ring-sub">'+score+'/'+scenarios.length+'</div></div></div><div class="end-title">Simulation Complete!</div><div class="end-detail">'+msg+'</div><button class="btn-restart" onclick="restart()">Restart Simulation</button>';
  end.classList.add('show');
  setTimeout(function(){var r=document.getElementById('ringFill');if(r)r.style.strokeDashoffset=offset;},150);
}

function restart(){
  current=0;score=0;locked=false;
  document.getElementById('scenarioCard').style.display='';
  document.getElementById('answerGrid').style.display='';
  document.getElementById('explanation').style.display='';
  document.getElementById('endScreen').classList.remove('show');
  document.getElementById('endScreen').innerHTML='';
  buildGrid();
}

buildGrid();
</script>
</body>
</html>
