<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Science Behind Healthcare — True or False</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{display:flex;flex-direction:column;align-items:center;padding:10px 14px;gap:8px;background:#0f1e2e;color:#e8eef5;font-family:'Inter',sans-serif}
.header{flex-shrink:0;width:100%;max-width:760px}
.title{font-family:'Plus Jakarta Sans',sans-serif;font-size:17px;font-weight:800;color:#c9a84c;letter-spacing:.3px;margin-bottom:6px}
.stats-bar{flex-shrink:0;width:100%;max-width:760px;display:flex;gap:8px;align-items:stretch}
.stat-chip{flex:1;background:#162840;border:1.5px solid #1e3a56;border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.stat-val{font-size:19px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;color:#e8eef5}
.stat-label{font-size:10px;font-weight:600;color:#4a6a88;font-family:'Plus Jakarta Sans',sans-serif;text-transform:uppercase;letter-spacing:.8px}
.streak-chip .stat-val{color:#c9a84c}
.correct-chip .stat-val{color:#2db37a}
.wrong-chip .stat-val{color:#e05252}
.progress-wrap{display:flex;flex-direction:column;gap:4px;flex:1.5;background:#162840;border:1.5px solid #1e3a56;border-radius:10px;padding:8px 12px;justify-content:center}
.prog-label{font-size:10px;font-weight:600;color:#4a6a88;font-family:'Plus Jakarta Sans',sans-serif;text-transform:uppercase;letter-spacing:.8px}
.progress-bg{height:6px;background:#0f1e2e;border-radius:3px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#2a8fa3,#c9a84c);border-radius:3px;transition:width .4s ease}
.stmt-card{flex:1;min-height:0;width:100%;max-width:760px;background:#162840;border-radius:14px;border:2px solid #1e3a56;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 28px;gap:16px;transition:border-color .3s,background .3s;overflow:hidden}
.stmt-card.correct-state{border-color:#2db37a;background:#0c1f17}
.stmt-card.wrong-state{border-color:#e05252;background:#1a0a0a}
.q-num{font-size:10.5px;font-weight:700;color:#4a6a88;text-transform:uppercase;letter-spacing:1px;font-family:'Plus Jakarta Sans',sans-serif;align-self:flex-start}
.stmt-text{font-size:15.5px;font-weight:600;color:#e8eef5;line-height:1.6;font-family:'Plus Jakarta Sans',sans-serif;text-align:center;flex-shrink:0}
.feedback-strip{width:100%;border-radius:10px;padding:11px 16px;font-size:13px;line-height:1.5;font-family:'Inter',sans-serif;display:none;flex-shrink:0;text-align:center}
.feedback-strip.show{display:block}
.feedback-strip.correct-fb{background:#0d2820;border:1px solid #2db37a;color:#a0e8b8}
.feedback-strip.wrong-fb{background:#2a0d0d;border:1px solid #e05252;color:#f0a0a0}
.answer-row{flex-shrink:0;width:100%;max-width:760px;display:flex;gap:10px}
.ans-btn{flex:1;padding:14px;border-radius:12px;border:none;cursor:pointer;font-size:22px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;transition:transform .15s,opacity .2s;display:flex;align-items:center;justify-content:center;gap:8px;letter-spacing:.5px}
.ans-btn:hover:not(:disabled){transform:scale(1.03)}
.ans-btn:disabled{opacity:.45;cursor:default}
.btn-true{background:linear-gradient(135deg,#0d3020,#1a4a30);color:#2db37a;border:1.5px solid #2db37a}
.btn-false{background:linear-gradient(135deg,#2a0d0d,#3a1010);color:#e05252;border:1.5px solid #e05252}
.btn-label{font-size:13px}
.footer{flex-shrink:0;width:100%;max-width:760px;display:flex;justify-content:flex-end;align-items:center;gap:8px}
.btn-next{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;background:#c9a84c;color:#0f1e2e;border:none;border-radius:9px;padding:10px 24px;cursor:pointer;display:none;transition:opacity .2s}
.btn-next.show{display:block}
.btn-next:hover{opacity:.88}
.end-screen{flex:1;min-height:0;width:100%;max-width:760px;background:#162840;border-radius:14px;border:1px solid #1e3a56;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px}
.end-screen.show{display:flex}
.end-emoji{font-size:48px}
.end-title{font-size:22px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif;color:#c9a84c;text-align:center}
.end-stats{display:flex;gap:16px;justify-content:center}
.end-stat{text-align:center}
.end-stat-val{font-size:28px;font-weight:800;font-family:'Plus Jakarta Sans',sans-serif}
.end-stat-label{font-size:11px;color:#6b8aaa;font-family:'Plus Jakarta Sans',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.end-detail{font-size:13px;color:#7a9cc0;text-align:center;line-height:1.5;max-width:420px}
.btn-restart{font-family:'Plus Jakarta Sans',sans-serif;font-size:13px;font-weight:700;background:#1e3550;color:#e8eef5;border:none;border-radius:9px;padding:10px 26px;cursor:pointer;transition:background .2s}
.btn-restart:hover{background:#2a4a6e}
</style>
</head>
<body>
<div class="header"><div class="title">Science Behind Healthcare — True or False</div></div>
<div class="stats-bar">
  <div class="stat-chip streak-chip"><div class="stat-val" id="streakVal">0</div><div class="stat-label">Streak</div></div>
  <div class="stat-chip correct-chip"><div class="stat-val" id="correctVal">0</div><div class="stat-label">Correct</div></div>
  <div class="stat-chip wrong-chip"><div class="stat-val" id="wrongVal">0</div><div class="stat-label">Wrong</div></div>
  <div class="progress-wrap">
    <div class="prog-label">Progress</div>
    <div class="progress-bg"><div class="progress-fill" id="progressFill" style="width:4%"></div></div>
    <div class="stat-label" id="progText">1 / 25</div>
  </div>
</div>
<div class="stmt-card" id="stmtCard">
  <div class="q-num" id="qNum">Statement 1 of 25</div>
  <div class="stmt-text" id="stmtText"></div>
  <div class="feedback-strip" id="feedback"></div>
</div>
<div class="end-screen" id="endScreen"></div>
<div class="answer-row" id="answerRow">
  <button class="ans-btn btn-true" id="btnTrue" onclick="answer(true)"><span>✅</span><span class="btn-label">TRUE</span></button>
  <button class="ans-btn btn-false" id="btnFalse" onclick="answer(false)"><span>❌</span><span class="btn-label">FALSE</span></button>
</div>
<div class="footer"><button class="btn-next" id="btnNext" onclick="nextStatement()">Next →</button></div>
<script>
const allStatements=[
  {stmt:"In the scientific method, the hypothesis comes BEFORE designing the experiment.",ans:true,exp:"True. The hypothesis (a testable, falsifiable prediction) must be formed before conducting an experiment. It defines what you are testing and sets up the experimental design."},
  {stmt:"Evidence-Based Practice (EBP) relies solely on published research studies, ignoring patient values and clinical experience.",ans:false,exp:"False. EBP integrates THREE equally important components: (1) best current research evidence, (2) clinical expertise, AND (3) individual patient values and needs. All three must inform clinical decisions."},
  {stmt:"Systematic reviews and meta-analyses represent the strongest level of evidence in the hierarchy.",ans:true,exp:"True. Level 1 evidence — systematic reviews and meta-analyses — synthesizes findings from multiple high-quality studies, producing the most reliable estimate of effect while minimizing any single study's bias."},
  {stmt:"Homeostasis refers to the body's ability to fluctuate widely in response to environmental changes.",ans:false,exp:"False. Homeostasis is the OPPOSITE — the body's ability to maintain STABLE internal conditions despite external changes. The fundamental goal is constancy, not fluctuation."},
  {stmt:"Normal blood pH range is 7.35–7.45, and even small deviations can be life-threatening.",ans:true,exp:"True. Blood pH is tightly regulated between 7.35–7.45 by respiratory rate (CO2) and kidney bicarbonate adjustments. Values below 7.35 (acidosis) or above 7.45 (alkalosis) can cause cardiac arrhythmias and death."},
  {stmt:"In a negative feedback loop, the body's response moves in the SAME direction as the change to amplify it.",ans:false,exp:"False. Negative feedback corrects in the OPPOSITE direction of the change (hence 'negative'). When blood glucose rises, insulin brings it DOWN. Positive feedback amplifies — but negative feedback restores balance."},
  {stmt:"Pathophysiology is the study of how disease and dysfunction disrupt normal physiological processes.",ans:true,exp:"True. Pathophysiology bridges basic science and clinical medicine — explaining mechanistically WHY diseases produce the symptoms, signs, and lab findings they do. It's the 'why' behind every diagnosis."},
  {stmt:"Autoimmune diseases occur when the immune system fails to respond to pathogens, leading to increased infection risk.",ans:false,exp:"False. Autoimmune diseases occur when the immune system OVERREACTS and attacks the body's own healthy cells. Examples: rheumatoid arthritis, lupus, Type 1 Diabetes. Infection risk IS elevated — but from immunosuppressant treatment, not the disease mechanism itself."},
  {stmt:"Ischemia and infarction are the same thing — both describe complete tissue death from a blocked artery.",ans:false,exp:"False. Ischemia = REDUCED blood flow (tissue is hypoxic but not dead yet). Infarction = COMPLETE blockage causing permanent tissue DEATH. Ischemia can be reversed; infarction is irreversible tissue loss."},
  {stmt:"Chronic inflammation, unlike acute inflammation, is damaging and drives conditions like atherosclerosis and arthritis.",ans:true,exp:"True. Acute inflammation is short-term and protective. Chronic inflammation — sustained immune activation — causes progressive tissue damage, driving atherosclerosis, inflammatory bowel disease, arthritis, and contributes to cancer development."},
  {stmt:"The 'M' in pharmacokinetics ADME stands for Metabolism, which primarily occurs in the kidneys.",ans:false,exp:"False. Metabolism occurs primarily in the LIVER (not kidneys), where enzymes transform drugs into metabolites. The kidneys handle EXCRETION (E). The liver's first-pass effect significantly reduces the potency of oral medications."},
  {stmt:"Drugs with a narrow therapeutic window require close monitoring because the effective dose and toxic dose are very close together.",ans:true,exp:"True. Narrow therapeutic window drugs (warfarin, digoxin, lithium, phenytoin) have very little margin between effectiveness and toxicity. Lab monitoring (INR, serum drug levels) is essential to keep patients in the safe range."},
  {stmt:"A p-value of 0.03 in a medical study means there is a 3% chance the treatment is effective.",ans:false,exp:"False. A p-value of 0.03 means there is only a 3% probability that the observed results occurred by RANDOM CHANCE — making the result statistically significant (below the p < 0.05 threshold). It does NOT directly describe treatment efficacy."},
  {stmt:"Phase I clinical trials are the first to involve human participants, focusing primarily on safety and dosing.",ans:true,exp:"True. Phase I enrolls 20–100 participants and is primarily a safety study — assessing dosage ranges, side effects, and how the drug is metabolized. Efficacy is not the primary focus of Phase I."},
  {stmt:"In a double-blind clinical trial, only the patients are unaware of their group assignment — the researchers always know.",ans:false,exp:"False. In a DOUBLE-blind trial, BOTH participants and researchers are unaware of group assignment. This eliminates both the placebo effect (participant expectation) and researcher observation bias. Only the statisticians analyzing data know the allocation."},
  {stmt:"Phase IV clinical trials occur AFTER FDA approval and monitor for rare side effects in the general population.",ans:true,exp:"True. Phase IV (post-market surveillance) is ongoing after a drug is approved and widely used. It detects rare adverse effects that were too infrequent to appear in pre-approval trial populations of a few thousand patients."},
  {term:"Neoplasia always refers to malignant (cancerous) tumors — benign growths are not classified as neoplasia.",ans:false,exp:"False. Neoplasia refers to ANY abnormal, uncontrolled cell growth — both BENIGN (non-invasive, localized) and malignant (invasive, metastatic). The distinction lies in behavior: benign tumors do not invade or spread; malignant ones do."},
  {stmt:"When an MA administers a medication via IM injection instead of orally, the drug bypasses the first-pass effect in the liver.",ans:true,exp:"True. Oral drugs pass through the liver before entering systemic circulation (first-pass effect), reducing potency. IM, IV, and SC routes bypass this — delivering the drug directly into the bloodstream at full concentration."},
  {stmt:"A patient on warfarin who suddenly starts eating large amounts of leafy greens (high Vitamin K) would likely have a HIGHER INR.",ans:false,exp:"False. Vitamin K is warfarin's antagonist — MORE Vitamin K REDUCES warfarin's anticoagulant effect, producing a LOWER INR (less anticoagulated). MAs must flag significant dietary changes in Vitamin K for warfarin patients."},
  {stmt:"Collecting a contaminated lab specimen is directly analogous to a flawed experiment — the data produced may be invalid.",ans:true,exp:"True. The scientific method requires valid, reproducible data. A contaminated specimen generates false results just as a flawed experimental condition produces misleading data. Proper labeling, storage, and transport are specimen integrity — science applied to clinical practice."},
  {stmt:"Anecdotal evidence and personal experience are considered Level 1 in the hierarchy of evidence.",ans:false,exp:"False. Anecdote and personal experience are Level 5 — the WEAKEST form of evidence. Level 1 (strongest) = systematic reviews and meta-analyses. Personal experience is subject to bias, recall errors, and cannot establish causation."},
  {stmt:"A health website that promises a single supplement will cure both diabetes and arthritis simultaneously is a red flag for misinformation.",ans:true,exp:"True. Claiming a single product cures multiple unrelated conditions is a classic misinformation red flag. Legitimate medical treatments are condition-specific and proven through phased clinical trials — not broad cure-all claims."},
  {stmt:"The urinary/renal system is irrelevant to pharmacology because drugs are only metabolized by the liver.",ans:false,exp:"False. The kidneys are the primary route of EXCRETION (E in ADME) for many drugs and their metabolites. Renal impairment (CKD) reduces drug clearance, causing drug accumulation and toxicity. Dose adjustments for renally-cleared drugs are essential in CKD."},
  {stmt:"Evidence-based practice means that once a clinical guideline is established, it should never be changed regardless of new research.",ans:false,exp:"False. EBP is explicitly designed to EVOLVE with new evidence. When stronger research emerges, protocols must be updated. This is a core principle: current best evidence guides practice — not historical tradition or established habit."},
  {stmt:"The 5 Rights of medication administration (right drug, dose, route, time, patient) are a direct clinical application of pharmacokinetics and pharmacodynamics.",ans:true,exp:"True. Each of the 5 Rights maps to pharmacological science: right route affects absorption kinetics; right dose relates to the therapeutic window; right time relates to drug half-life and peak concentration; right patient prevents wrong-patient adverse reactions. The 5 Rights are pharmacology in practice."},
];

let statements=[...allStatements],current=0,correct=0,wrong=0,streak=0,locked=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function render(){
  const s=statements[current];
  document.getElementById('qNum').textContent='Statement '+(current+1)+' of '+statements.length;
  document.getElementById('stmtText').textContent=s.stmt;
  document.getElementById('stmtCard').className='stmt-card';
  document.getElementById('feedback').className='feedback-strip';
  document.getElementById('feedback').textContent='';
  document.getElementById('btnNext').className='btn-next';
  document.getElementById('btnTrue').disabled=false;
  document.getElementById('btnFalse').disabled=false;
  document.getElementById('progressFill').style.width=((current+1)/statements.length*100)+'%';
  document.getElementById('progText').textContent=(current+1)+' / '+statements.length;
  locked=false;
}
function answer(userAns){
  if(locked)return;locked=true;
  const s=statements[current];const isCorrect=userAns===s.ans;
  if(isCorrect){correct++;streak++;}else{wrong++;streak=0;}
  updateStats();
  document.getElementById('stmtCard').className='stmt-card '+(isCorrect?'correct-state':'wrong-state');
  const fb=document.getElementById('feedback');
  fb.className='feedback-strip show '+(isCorrect?'correct-fb':'wrong-fb');
  fb.textContent=(isCorrect?'✅ Correct! ':'❌ Incorrect. ')+s.exp;
  document.getElementById('btnTrue').disabled=true;document.getElementById('btnFalse').disabled=true;
  document.getElementById('btnNext').className='btn-next show';
}
function updateStats(){
  document.getElementById('streakVal').textContent=streak+(streak>=3?'🔥':streak>=1?'⚡':'');
  document.getElementById('correctVal').textContent=correct;
  document.getElementById('wrongVal').textContent=wrong;
}
function nextStatement(){current++;if(current>=statements.length){showEnd();return;}render();}
function showEnd(){
  document.getElementById('stmtCard').style.display='none';document.getElementById('answerRow').style.display='none';document.getElementById('btnNext').style.display='none';
  const pct=Math.round(correct/statements.length*100);
  const emoji=pct>=90?'🏆':pct>=70?'🌟':'📚';
  const msg=pct>=90?'Outstanding! You have mastered the science behind healthcare.':pct>=70?'Good work! Review the explanations for any missed statements.':'Keep studying — science is the foundation of everything clinical.';
  document.getElementById('endScreen').innerHTML='<div class="end-emoji">'+emoji+'</div><div class="end-title">Round Complete!</div><div class="end-stats"><div class="end-stat"><div class="end-stat-val" style="color:#2db37a">'+correct+'</div><div class="end-stat-label">Correct</div></div><div class="end-stat"><div class="end-stat-val" style="color:#e05252">'+wrong+'</div><div class="end-stat-label">Wrong</div></div><div class="end-stat"><div class="end-stat-val" style="color:#c9a84c">'+pct+'%</div><div class="end-stat-label">Score</div></div></div><div class="end-detail">'+msg+'</div><button class="btn-restart" onclick="restart()">🔀 Shuffle & Restart</button>';
  document.getElementById('endScreen').classList.add('show');
}
function restart(){
  current=0;correct=0;wrong=0;streak=0;locked=false;shuffle(statements);updateStats();
  document.getElementById('stmtCard').style.display='';document.getElementById('answerRow').style.display='';
  document.getElementById('endScreen').classList.remove('show');document.getElementById('endScreen').innerHTML='';
  render();
}
render();
</script>
</body>
</html>
